name: Stage-02 Product Authority Approval Docket R10

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_product_authority_approval_docket_r10.py'
      - 'governance/ci/validate_stage02_product_authority_approval_docket_r10.py'
      - '.github/workflows/stage02-product-authority-approval-docket-r10.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-product-authority-approval-docket-r10
  cancel-in-progress: false

jobs:
  product-authority-approval-docket-r10:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R10 docket machinery
        run: |
          python -m py_compile governance/ci/build_stage02_product_authority_approval_docket_r10.py
          python -m py_compile governance/ci/validate_stage02_product_authority_approval_docket_r10.py

      - name: Re-prove exact 75-file governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Revalidate current external-authority-aware Stage-02 truth and review packages
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
          python governance/ci/validate_current_stage2_materialized_closure_external_aware_r3.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_external_aware_r3.py
          python governance/ci/validate_stage02_product_design_authority_intake_r6.py
          python governance/ci/validate_stage02_core01_product_authority_review_r8.py
          python governance/ci/validate_stage02_asset01_product_authority_review_r9.py

      - name: Build exact unified 150-decision approval docket
        run: python governance/ci/build_stage02_product_authority_approval_docket_r10.py

      - name: Validate R10 150 coverage, exact review refs, and zero-authority-value invariant
        run: python governance/ci/validate_stage02_product_authority_approval_docket_r10.py

      - name: Prove R10 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R10 is non-normative approval docket only; no product/spec/Stage-01/Stage-02 owning output mutation'

      - name: Verify all 150 remain pending explicit Product Authority
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          den=d['denominators']
          assert den['total_product_authority_decisions'] == 150
          assert den['core01_decisions'] == 40
          assert den['asset01_decisions'] == 110
          assert den['approved_decisions'] == 0
          assert den['r7_materializable_decisions'] == 0
          assert den['effective_stage02_blocker_reduction_claimed'] == 0
          assert all(r['approval_state']=='PENDING_EXPLICIT_PRODUCT_AUTHORITY' for r in d['records'])
          assert all(r['r7_materialization_allowed'] is False for r in d['records'])
          assert d['stage02_status'] == 'BLOCKED'
          print('PASS: exact 150/150 remain pending explicit Product Authority; no false closure credit')
          PY

      - name: Commit R10 approval docket
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R10 generated no persistent approval docket' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist unified product authority approval docket R10'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R10 approval docket
        uses: actions/upload-artifact@v4
        with:
          name: stage02-product-authority-approval-docket-r10
          path: governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml
          if-no-files-found: error
