  stages:
  - stage_uid: CORE-01-STAGE-01-CONTEXT
    name: Resolve Context
    flow: Resolve Project/Topic/work item/thread + assigned AI route refs; no provider picker.
  - stage_uid: CORE-01-STAGE-02-CONVERSE
    name: Converse / Analyze
    flow: User input → shared AI routing → Single/Multi responses; no formal data write from raw AI response.
  - stage_uid: CORE-01-STAGE-03-SUMMARY-EVAL
    name: Assistant Summary / CORE Evaluation
    flow: Assistant summary + task-bound approved CORE criteria/evidence.
  - stage_uid: CORE-01-STAGE-04-HUMAN-DECIDE
    name: Human Decision
    flow: Human decision → Assistant structured decision → final confirm or return modify.
  - stage_uid: CORE-01-STAGE-05-CANDIDATE
    name: Candidate / Domain Review Ready
    flow: Create/decide immutable Candidate; domain-specific Project/DNA/Blueprint/Topic lock request remains gated by its registered action.
  stage_transitions:
  - transition_uid: CORE-01-STTR-01
    from_stage: CORE-01-STAGE-01-CONTEXT
    to_stage: CORE-01-STAGE-02-CONVERSE
    trigger_event_uid: CORE-01-EVT-CONTEXT-RESOLVED
    gate_uid: CORE-01-GATE-WORK-ITEM
    mutation_owner: CORE-01
    failure_state: CORE-01-ST-ERROR
    recovery:
      retain_stage: CORE-01-STAGE-01-CONTEXT
      action: RESET_TO_EXACT_PROJECT_CONTEXT_AND_RERESOLVE_WORK_ITEM_THREAD_AND_AI_ROUTE
      retry_condition: CORE-01-GATE-WORK-ITEM_PASS_AND_CORE-01-EVT-CONTEXT-RESOLVED
    audit_event_uid: CORE-01-EVT-CONTEXT-RESOLVED
    illegal_transition_tests:
    - test_uid: CORE01-STTR-01-ILLEGAL-WRONG-FROM
      reject_when: current_stage != CORE-01-STAGE-01-CONTEXT
    - test_uid: CORE01-STTR-01-ILLEGAL-TRIGGER
      reject_when: trigger_event_uid != CORE-01-EVT-CONTEXT-RESOLVED
    - test_uid: CORE01-STTR-01-ILLEGAL-GATE
      reject_when: CORE-01-GATE-WORK-ITEM != PASS
    - test_uid: CORE01-STTR-01-ILLEGAL-REPLAY
      reject_when: transition already committed or current_stage == CORE-01-STAGE-02-CONVERSE
  - transition_uid: CORE-01-STTR-02
    from_stage: CORE-01-STAGE-02-CONVERSE
    to_stage: CORE-01-STAGE-03-SUMMARY-EVAL
    trigger_event_uid: CORE-01-EVT-AI-RESPONSES-READY
    gate_uid: CORE-01-GATE-SUMMARY
    mutation_owner: CORE-01
    failure_state: CORE-01-ST-ERROR
    recovery:
      retain_stage: CORE-01-STAGE-02-CONVERSE
      action: PRESERVE_THREAD_AND_DRAFT_WAIT_FOR_COMPLETE_AI_RESPONSES_THEN_REEVALUATE_SUMMARY_GATE
      retry_condition: CORE-01-GATE-SUMMARY_PASS_AND_CORE-01-EVT-AI-RESPONSES-READY
    audit_event_uid: CORE-01-EVT-AI-RESPONSES-READY
    illegal_transition_tests:
    - test_uid: CORE01-STTR-02-ILLEGAL-WRONG-FROM
      reject_when: current_stage != CORE-01-STAGE-02-CONVERSE
    - test_uid: CORE01-STTR-02-ILLEGAL-TRIGGER
      reject_when: trigger_event_uid != CORE-01-EVT-AI-RESPONSES-READY
    - test_uid: CORE01-STTR-02-ILLEGAL-GATE
      reject_when: CORE-01-GATE-SUMMARY != PASS
    - test_uid: CORE01-STTR-02-ILLEGAL-REPLAY
      reject_when: transition already committed or current_stage == CORE-01-STAGE-03-SUMMARY-EVAL
  - transition_uid: CORE-01-STTR-03
    from_stage: CORE-01-STAGE-03-SUMMARY-EVAL
    to_stage: CORE-01-STAGE-04-HUMAN-DECIDE
    trigger_event_uid: CORE-01-EVT-EVALUATION-READY
    gate_uid: CORE-01-GATE-EVALUATION
    mutation_owner: CORE-01
    failure_state: CORE-01-ST-ERROR
    recovery:
      retain_stage: CORE-01-STAGE-03-SUMMARY-EVAL
      action: PRESERVE_SUMMARY_AND_EVIDENCE_RESOLVE_APPROVED_CRITERIA_OR_EVALUATION_BLOCKER_THEN_REEVALUATE
      retry_condition: CORE-01-GATE-EVALUATION_PASS_AND_CORE-01-EVT-EVALUATION-READY
    audit_event_uid: CORE-01-EVT-EVALUATION-READY
    illegal_transition_tests:
    - test_uid: CORE01-STTR-03-ILLEGAL-WRONG-FROM
      reject_when: current_stage != CORE-01-STAGE-03-SUMMARY-EVAL
    - test_uid: CORE01-STTR-03-ILLEGAL-TRIGGER
      reject_when: trigger_event_uid != CORE-01-EVT-EVALUATION-READY
    - test_uid: CORE01-STTR-03-ILLEGAL-GATE
      reject_when: CORE-01-GATE-EVALUATION != PASS
    - test_uid: CORE01-STTR-03-ILLEGAL-REPLAY
      reject_when: transition already committed or current_stage == CORE-01-STAGE-04-HUMAN-DECIDE
  - transition_uid: CORE-01-STTR-04
    from_stage: CORE-01-STAGE-04-HUMAN-DECIDE
    to_stage: CORE-01-STAGE-02-CONVERSE
    trigger_event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    gate_uid: CORE-01-GATE-HUMAN-DECISION
    mutation_owner: CORE-01
