name: ACPOS Page Authority Current Truth Cleanup Once

# retry: stale release-status assertions and IAM 9x9 residuals are included in the helper
on:
  push:
    branches:
      - new
    paths:
      - .github/workflows/page-authority-current-truth-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Current page authority cleanup
        run: python3 scripts/page-authority-current-truth-cleanup-once.py
      - name: Validate permanent regression
        run: node --test tests/release/page-authority-current-truth.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run release unit tests
        run: npm test
      - name: Commit clean tree
        shell: bash
        run: |
          rm .github/workflows/page-authority-current-truth-cleanup-once.yml
          rm scripts/page-authority-current-truth-cleanup-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: align page authorities to Current truth"
          git push origin HEAD:new
