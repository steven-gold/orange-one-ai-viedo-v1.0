name: Stage-02 Authority Dependency Reclassification R12

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_authority_dependency_reclassification_r12.py'
      - 'governance/ci/validate_stage02_authority_dependency_reclassification_r12.py'
      - 'governance/test/stage02/FIND-20260915-024_PRODUCT_AUTHORITY_CIRCULAR_CLASSIFICATION.yaml'
      - '.github/workflows/stage02-authority-dependency-reclassification-r12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-authority-dependency-reclassification-r12
  cancel-in-progress: false

jobs:
  authority-dependency-reclassification-r12:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R12 reclassification machinery
        run: |
          python -m py_compile governance/ci/build_stage02_authority_dependency_reclassification_r12.py
          python -m py_compile governance/ci/validate_stage02_authority_dependency_reclassification_r12.py

      - name: Re-prove exact governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Revalidate current Stage-02 identity baseline
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
          python governance/ci/validate_current_stage2_materialized_closure_external_aware_r3.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_external_aware_r3.py
          # R10 is validated here only as the exact 150-record identity baseline.
          python governance/ci/validate_stage02_product_authority_approval_docket_r10.py

      - name: Build independent 150-record authority-vs-dependency reclassification
        run: python governance/ci/build_stage02_authority_dependency_reclassification_r12.py

      - name: Validate R12 classification boundary and zero-reduction invariant
        run: python governance/ci/validate_stage02_authority_dependency_reclassification_r12.py

      - name: Prove R12 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R12 is classifier correction only; no specification/Stage-01/Stage-02 product output mutation'

      - name: Verify all 150 are reclassified and no blocker credit is claimed
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_AUTHORITY_DEPENDENCY_RECLASSIFICATION_R12.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          den=d['denominators']
          assert den['total_reclassified'] == 150
          assert den['deterministic_required_dependency'] + den['true_product_authority_gap_proven'] + den['unresolved_functional_contract_gap'] == 150
          assert den['effective_stage02_blocker_reduction_claimed'] == 0
          assert d['stage02_status'] == 'BLOCKED'
          assert d['stage03_allowed'] is False
          print('PASS: 150/150 independently classified; zero closure credit until separate materialization and fresh reexecution')
          PY

      - name: Commit R12 reclassification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_AUTHORITY_DEPENDENCY_RECLASSIFICATION_R12.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R12 generated no persistent reclassification output' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist authority dependency reclassification R12'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R12 reclassification
        uses: actions/upload-artifact@v4
        with:
          name: stage02-authority-dependency-reclassification-r12
          path: governance/test/stage02/STAGE02_AUTHORITY_DEPENDENCY_RECLASSIFICATION_R12.yaml
          if-no-files-found: error
