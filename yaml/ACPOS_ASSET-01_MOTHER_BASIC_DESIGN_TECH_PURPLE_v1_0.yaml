  - index: 18
    style: Normal
    text: 頁面目的：在單一 ASSET-01 工作區，讀取已鎖定的 Project/Topic/Task 上游來源，優先 Reuse exact eligible assets，只對 Missing 項目執行生成，完成候選、ASSET criteria 評估、人工 Confirm/Modify、可選 Layer/Patch、Lock
      exact version，最後產生 Exact Handoff Manifest 交付 VIDEO。
