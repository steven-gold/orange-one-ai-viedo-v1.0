name: EDIT01 Staging Compile Once
on:
  push:
    branches: [edit01-functional-staging]
    paths: ['.github/workflows/edit01-staging-compile-once.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit01-functional-staging
          fetch-depth: 0
      - name: Locks and counts
        run: |
          set -euo pipefail
          test "$(git hash-object src/components/pages/EditVisual.module.css)" = "6ec980b81fb6930a019d2b9ee6168e9d0f6f1d4e"
          git diff --exit-code 64896ace91173a3161e06b30932bd327017745c8 HEAD -- authority/
          python3 - <<'PY'
          import re
          from pathlib import Path
          a=Path('authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml').read_text()
          assert 'controls_fields: 160' in a and 'actions: 124' in a
          authority_actions=set(re.findall(r'action_uid:\s*(EDIT-01-ACT-[A-Z0-9-]+)',a))
          assert len(authority_actions)==124, len(authority_actions)
          b=Path('src/domain/edit/editControlBindings.ts').read_text()
          controls=set(re.findall(r'"(EDIT-01-[A-Z0-9-]+)"\s*:',b))
          mapped_actions=set(re.findall(r'EDIT-01-ACT-[A-Z0-9-]+',b))
          assert len(controls)==160, len(controls)
          assert mapped_actions <= authority_actions
          missing=sorted(authority_actions-mapped_actions)
          print(f'EDIT01_STATIC_SCOPE_PASS controls={len(controls)} authority_actions={len(authority_actions)} control_mapped_actions={len(mapped_actions)}')
          print('EDIT01_ACTIONS_WITHOUT_DIRECT_CONTROL=' + ','.join(missing))
          PY
      - name: Audit typecheck build
        run: |
          set -euo pipefail
          npm ci
          npm audit
          npm run typecheck
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=TEST npm run build
