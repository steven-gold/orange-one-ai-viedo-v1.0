  source_text: Enterprise Business Development AI System
- source_node_uid: SN-7FC17BB837B8912B2A2FDFF1
  document_order_index: 50
  source_text: 企業商機搜集、公司身份、聯絡證據、個人化開發、合規、Campaign、個別寄送、回覆與營收閉環母規範
- source_node_uid: SN-11342ACCA498EFFC42B0AB87
  document_order_index: 210
  source_text: 本文件定義 ACPOS 企業自動開發 AI 系統的系統級母設計。它不是單一 DEV-01 頁面說明，也不是 Email 供應商操作手冊；它規定企業商機如何被發現、驗證、去重、評估、個人化、合規審查、形成 Campaign、拆成每位收件者的獨立 Delivery，並將 Reply / Outcome / Revenue / Experience 回寫成可追溯閉環。
- source_node_uid: SN-A2DAC29745428F94981CFB71
  document_order_index: 289
  source_text: ACPOS-AI-06 Enterprise Business Development AI System
- source_node_uid: SN-077F55B7DF53848DF061FF87
  document_order_index: 323
  source_text: Enterprise discovery, company identity, contact evidence, qualification, personalization, outreach campaign, individual delivery, reply/follow-up, CRM outcome, revenue attribution.
- source_node_uid: SN-3E9C1A62439FAC911D8B4F8E
  document_order_index: 421
  source_text: Word completion MUST_NOT be reported as email connector, DNS authentication, webhook, bounce, complaint, unsubscribe, Production E2E or deployment completion.
- source_node_uid: SN-FF7179D020803275B5DD5156
  document_order_index: 450
  source_text: 建立唯一 Company Master 與可追溯 Contact Evidence，避免同一公司、同一聯絡點、同一 Campaign 形成第二套資料。
- source_node_uid: SN-C894DBF36D94C2A7AA5F5C5D
  document_order_index: 458
  source_text: 讓 AI 個人化內容只使用 Evidence-supported fact；推論必須顯式標示為 inference。
- source_node_uid: SN-5AB6C861A2F7E66533FA3D66
  document_order_index: 474
  source_text: 允許 Campaign-level 大量操作，但每個外寄 Email envelope 永遠保持 exactly one To，CC/BCC empty。
