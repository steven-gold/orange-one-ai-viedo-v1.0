name: Record Stage-02 Dual-Layer Harness Finding

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-record-dual-layer-harness-finding.yml'
      - 'governance/ci/record_stage02_dual_layer_harness_finding.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-finding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Record finding before harness repair
        run: python governance/ci/record_stage02_dual_layer_harness_finding.py
      - name: Prove formal Current Specification remains unchanged
        run: git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
      - name: Commit non-normative finding ledger update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
          if git diff --cached --quiet; then
            echo 'PASS: finding already present; no commit required'
            exit 0
          fi
          git commit -m 'test(stage02): record dual-layer remediation validator finding'
          git push origin HEAD:rebuild-v2.1.1
