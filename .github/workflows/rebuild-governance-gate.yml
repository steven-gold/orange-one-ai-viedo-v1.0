name: Governance v2.1.4 Clean Sealed Stage-1 Test Gate

on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-workspace-and-current-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify current v2.1.4 lock and clean pre-extraction workspace
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('.')
          cur=yaml.safe_load((root/'GOVERNANCE_CURRENT.yaml').read_text())
          base=yaml.safe_load((root/'REBUILD_BRANCH_BASELINE.yaml').read_text())
          lock=yaml.safe_load((root/'11_EVIDENCE/audit/GOVERNANCE_STAGE_LOCK.yaml').read_text())
          sealed=yaml.safe_load((root/'11_EVIDENCE/audit/SEALED_GOVERNANCE_TEST_BASELINE.yaml').read_text())
          package='d789312c2657f492f98dbf29b285be18f3184e341195e8c84f57f5bcfe2d9109'
          assert cur['normative_authority']['version']=='v2.1.4'
          assert cur['normative_authority']['package_sha256']==package
          assert cur['normative_authority']['normative_edit_allowed'] is False
          assert cur['test_runtime']['runtime_uid']=='ACPOS-GOV-TEST-v2.1.4-STAGE1'
          assert cur['current_execution']['fresh_extraction_required'] is True
          assert cur['current_execution']['reuse_prior_core_asset_snapshot'] is False
          assert base['governance_test']['version']=='v2.1.4'
          assert base['governance_test']['normative_edit_allowed'] is False
          assert base['source_revision_policy']=='RESOLVE_CURRENT_HEAD_AT_FRESH_EXTRACTION_START'
          assert base['prior_extraction_reuse']=='FORBIDDEN'
          assert lock['lock_state']=='USER_FROZEN_READ_ONLY'
          assert lock['normative_edit_after_lock']=='FORBIDDEN'
          assert sealed['sealed_governance']['version']=='v2.1.4'
          assert sealed['sealed_governance']['package_sha256']==package
          assert sealed['normative_mutation_allowed'] is False
          if (root/'00_SOURCE_INTAKE').exists():
              raise SystemExit('00_SOURCE_INTAKE must be absent before fresh extraction')
          forbidden=[p for p in [root/'app',root/'src',root/'pages',root/'public'] if p.exists()]
          if forbidden:
              raise SystemExit('premature website implementation: '+', '.join(map(str,forbidden)))
          stale_names={
              'CORE_ASSET_SOURCE_INVENTORY.yaml','EXTRACTION_LEDGER_CORE_ASSET_001.yaml',
              'GOVERNANCE_EXTRACTION_LEDGER_001.yaml','SOURCE_DOMAIN_DECOMPOSITION.yaml',
              'GOVERNANCE_DEFECT_LEDGER.yaml','GOVERNANCE_TEST_RUNTIME_SYNC_v2.1.4.yaml',
              'PHASE_CONTAMINATION_LEDGER.yaml','REBUILD_BRANCH_ISOLATION.yaml'
          }
          stale=[str(p) for p in root.rglob('*') if p.is_file() and p.name in stale_names]
          if stale:
              raise SystemExit('stale current-path artifacts remain: '+', '.join(stale))
          legacy=[str(p) for p in root.rglob('*') if p.is_file() and ('legacy_new' in p.parts or 'stage1_runtime_bundle.tar.gz.b64' in p.name)]
          if legacy:
              raise SystemExit('legacy transport/source residue remains: '+', '.join(legacy))
          garbage=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.name=='.DS_Store' or p.suffix in {'.pyc','.pyo'} or '__pycache__' in p.parts or p.name.endswith(('.tmp','.bak','~')):
                  garbage.append(str(p))
          if garbage:
              raise SystemExit('garbage detected: '+', '.join(garbage))
          print('PASS: clean workspace; stale CORE/ASSET and superseded current-path residue = 0')
          PY

  sealed-v2-1-4-stage1-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Assemble and verify exact sealed v2.1.4 runtime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, tarfile, yaml
          root=Path('.')
          manifest_path=root/'governance/test-runtime/v2.1.4/STAGE1_RUNTIME_MANIFEST.yaml'
          m=yaml.safe_load(manifest_path.read_text())
          chunks=m['transport']['chunks']
          if len(chunks)!=m['transport']['chunk_count']:
              raise SystemExit('chunk_count mismatch')
          payload=[]
          expected_chunk_paths=[]
          for item in chunks:
              p=root/item['path']
              expected_chunk_paths.append(item['path'])
              if not p.is_file(): raise SystemExit(f'missing runtime chunk: {p}')
              b=p.read_bytes()
              if len(b)!=item['size']: raise SystemExit(f'chunk size mismatch: {p}: {len(b)}')
              got=hashlib.sha256(b).hexdigest()
              if got!=item['sha256']: raise SystemExit(f'chunk sha mismatch: {p}: {got}')
              payload.append(b)
          assembled=b''.join(payload)
          if len(assembled)!=m['transport']['assembled_size_bytes']:
              raise SystemExit(f'assembled size mismatch: {len(assembled)}')
          got_bundle=hashlib.sha256(assembled).hexdigest()
          if got_bundle!=m['transport']['assembled_bundle_sha256']:
              raise SystemExit(f'assembled bundle sha mismatch: {got_bundle}')
          actual_runtime_files=[]
          runtime_dir=root/'governance/test-runtime/v2.1.4'
          for p in runtime_dir.iterdir():
              if p.name=='STAGE1_RUNTIME_MANIFEST.yaml': continue
              if p.is_file(): actual_runtime_files.append(str(p.as_posix()))
          if sorted(actual_runtime_files)!=sorted(expected_chunk_paths):
              raise SystemExit('runtime directory contains unregistered residue: '+repr(sorted(actual_runtime_files)))
          tar_path=Path('/tmp/acpos-v214-stage1.tar.gz')
          tar_path.write_bytes(assembled)
          out=Path('/tmp/acpos-gov-v214-stage1')
          shutil.rmtree(out,ignore_errors=True); out.mkdir(parents=True)
          expected={x['path']:x['sha256'] for x in m['files']}
          with tarfile.open(tar_path,'r:gz') as tf:
              members=[x for x in tf.getmembers() if x.isfile()]
              names=sorted(x.name.lstrip('./') for x in members)
              if names!=sorted(expected):
                  raise SystemExit(f'sealed runtime member set mismatch: {names}')
              for member in members:
                  name=member.name.lstrip('./')
                  target=(out/name).resolve()
                  if not str(target).startswith(str(out.resolve())+'/'):
                      raise SystemExit(f'unsafe tar member: {member.name}')
              tf.extractall(out)
          for rel,sha in expected.items():
              p=out/rel
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=sha: raise SystemExit(f'sealed file sha mismatch {rel}: {got}')
          print('PASS: exact v2.1.4 runtime transport + exact six-file set + file hashes')
          PY
      - name: Run sealed Stage-1 minimal-control 27/27
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python /tmp/acpos-gov-v214-stage1/09_TESTS/governance/test_stage1_source_to_blueprint_minimal_control.py > /tmp/stage1.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/stage1.json'))
          assert r['total']==27, r
          assert r['passed_expectations']==27, r
          assert all(x.get('ok') is True for x in r['results']), r
          print('PASS: sealed v2.1.4 Stage-1 minimal-control = 27/27')
          PY
