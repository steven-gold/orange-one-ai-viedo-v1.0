global_rules:
- Every current page is a governed Data Producer and/or Data Consumer.
- Page UI/controls remain owned by its Current Page Authority.
- Cross-page integration uses exact refs/versions and shared ACPOS objects.
- No generic Sync-to-ACPOS button is added unless explicitly registered.
- Provider selection is centralized through admin:AIAPI-01 / shared router.
- External data acquisition is one shared runtime; pages define domain intent, not separate crawler engines.
- Experience comes from real outcomes and cannot silently change authority.
- Navigation and IAM L1 bundles are owned by ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml.
