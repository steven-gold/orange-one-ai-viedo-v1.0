- Entity: Project Blueprint
  Operations: createCandidate / validate / approve / submitCoreReview
  Normative meaning: Project Core route only
- Entity: Mother Lock
  Operations: request / review / approve-or-return
  Normative meaning: no hidden approval
- Entity: Topic
  Operations: createDraft / validate / confirm / version
  Normative meaning: requires valid Project lineage
- Entity: Boundary
  Operations: proposeCandidates / compare / select
  Normative meaning: narrative + continuity + production-aware
