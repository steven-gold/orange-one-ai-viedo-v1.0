name: QA01 Test State Singleton Fix Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-test-state-singleton-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace module-local TEST state with process-global singleton
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/server/testing/controlledQaTestRuntime.ts')
          s=p.read_text()
          old='let state:QaResolvedContext=createInitial();'
          new='type QaControlledTestGlobal=typeof globalThis&{__ACPOS_QA_CONTROLLED_TEST_STATE__?:QaResolvedContext};\nconst qaControlledTestGlobal=globalThis as QaControlledTestGlobal;\nfunction currentState(){return qaControlledTestGlobal.__ACPOS_QA_CONTROLLED_TEST_STATE__??(qaControlledTestGlobal.__ACPOS_QA_CONTROLLED_TEST_STATE__=createInitial());}\nfunction replaceState(next:QaResolvedContext){qaControlledTestGlobal.__ACPOS_QA_CONTROLLED_TEST_STATE__=next;}'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old='function clone():QaResolvedContext{return{...state,values:{...state.values},gate_state:{...state.gate_state},lists:Object.fromEntries(Object.entries(state.lists).map(([k,v])=>[k,v.map(x=>({...x,meta:x.meta?{...x.meta}:undefined}))]))};}'
          new='function clone():QaResolvedContext{const state=currentState();return{...state,values:{...state.values},gate_state:{...state.gate_state},lists:Object.fromEntries(Object.entries(state.lists).map(([k,v])=>[k,v.map(x=>({...x,meta:x.meta?{...x.meta}:undefined}))]))};}'
          assert s.count(old)==1, 'clone target mismatch'
          s=s.replace(old,new)
          old='function commit(next:QaResolvedContext,correlation_id?:string){next.correlation_id=correlation_id??next.correlation_id;state=next;return readControlledQaTestProjection();}'
          new='function commit(next:QaResolvedContext,correlation_id?:string){next.correlation_id=correlation_id??next.correlation_id;replaceState(next);return readControlledQaTestProjection();}'
          assert s.count(old)==1, 'commit target mismatch'
          s=s.replace(old,new)
          old='export function resetControlledQaTestRuntime(){state=createInitial();return readControlledQaTestProjection();}'
          new='export function resetControlledQaTestRuntime(){replaceState(createInitial());return readControlledQaTestProjection();}'
          assert s.count(old)==1, 'reset target mismatch'
          s=s.replace(old,new)
          assert 'let state:QaResolvedContext=createInitial();' not in s
          p.write_text(s)
          PY
          rm .github/workflows/qa01-test-state-singleton-fix-once.yml
          git diff --check
          git diff -- src/server/testing/controlledQaTestRuntime.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/testing/controlledQaTestRuntime.ts .github/workflows/qa01-test-state-singleton-fix-once.yml
          git commit -m 'fix(qa): share controlled TEST state across server bundles'
          git push origin HEAD:qa01-functional-staging
