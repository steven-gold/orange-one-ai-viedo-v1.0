architecture_layers:
- Layer: Bootstrap Resolver
  責任: 解析 Current repository/branch/HEAD/Governance/Authority/WU/Resume/Evidence
  輸入: live source + registries
  輸出: CurrentTruthSnapshot
- Layer: Scope Resolver
  責任: 解析 exact scope / included / excluded / dependency / denominator
  輸入: Authority + Work Unit
  輸出: InspectionScope
- Layer: Trace Engine
  責任: 建構 forward/reverse functional/dependency graph
  輸入: registries + code/contracts/evidence
  輸出: FunctionalTraceGraph
- Layer: Inspection Engine
  責任: 執行 static/dynamic/semantic/runtime/evidence checks
  輸入: scope + trace + current state
  輸出: InspectionObservation
- Layer: Finding Engine
  責任: 正規化 Finding、dedupe、severity、reproduction
  輸入: observations
  輸出: Finding
- Layer: Root Cause Engine
  責任: 定位因果鏈與 Canonical Owner
  輸入: Finding + trace
  輸出: RootCauseAnalysis
- Layer: Impact Engine
  責任: 計算 reverse dependency / REVERIFY_REQUIRED
  輸入: change target + graph
  輸出: ImpactSet
- Layer: Change Planner
  責任: 產生 bounded Change Candidate / Set
  輸入: root cause + owner + impact
  輸出: ChangeCandidate
- Layer: Simulation/Validation
  責任: 在隔離環境測試、回放、驗證
  輸入: candidate + fixtures
  輸出: ValidationEvidence
- Layer: Authorization Boundary
  責任: 驗證 pre-existing approval / permission / gate
  輸入: candidate + validation
  輸出: AuthorizedChangeReceipt
- Layer: Execution/Verify
  責任: effectful execution + deployment/production verification
  輸入: authorized receipt
  輸出: ExecutionEvidence
- Layer: Rollback/Resume/Learning
  責任: 失敗復原、checkpoint、incident experience candidate
  輸入: execution/evidence
  輸出: ResumePoint + LearningCandidate
current_truth_bootstrap:
- 順序: '1'
  MUST resolve: Repository + target branch + live HEAD/tree
  Fail-closed 條件: 無法確認 live identity → BLOCK_CURRENT_TRUTH_UNRESOLVED
- 順序: '2'
  MUST resolve: Current Registry / Governance Entry
  Fail-closed 條件: 僅有聊天摘要或歷史版本 → BLOCK
- 順序: '3'
  MUST resolve: Mother Governance 01 → 02 → 03 → 04
  Fail-closed 條件: 順序不完整或來源不 Current → BLOCK
- 順序: '4'
  MUST resolve: Current Canonical Authority / owner registries
  Fail-closed 條件: owner/UID/path 無法 resolve → BLOCK
- 順序: '5'
  MUST resolve: Current Primary Task Layer + Active Work Unit
  Fail-closed 條件: 無 WU 必須進 WORK_UNIT_RESOLUTION_GATE，不得猜下一步
- 順序: '6'
  MUST resolve: Canonical Owner Mapping / candidate owner when WUR
  Fail-closed 條件: 多 owner 衝突或無證據 → REVIEW_REQUIRED/BLOCK
- 順序: '7'
  MUST resolve: Persisted Resume Point / exact next transition
  Fail-closed 條件: resume 不可由模型記憶推測
- 順序: '8'
  MUST resolve: Current Audit / Evidence identity
  Fail-closed 條件: 舊 revision evidence 不得自動沿用
- 順序: '9'
  MUST resolve: Selected Execution Profile + applicability
  Fail-closed 條件: profile 不得改寫 global policy
- 順序: '10'
  MUST resolve: Start conditions / dependencies / DoD / gates
  Fail-closed 條件: 任一 REQUIRED dependency 缺失 → BLOCK
- 順序: '11'
  MUST resolve: Search-before-create existing UID/name/alias/owner/runtime/test/evidence
  Fail-closed 條件: 第一次搜尋無結果不得直接建立新 owner
- 順序: '12'
  MUST resolve: Pre-write exact identity/hash recheck
  Fail-closed 條件: live HEAD 或 owner 已變 → STALE_CONTEXT / restart
functional_chain_edges:
- Edge: Page→Control
  Required proof: Control identity/visibility/owner
  禁止: 不存在 visual control 的 system-only operation 不得硬造按鈕
- Edge: Control/System Trigger→Action
  Required proof: deterministic trigger binding
  禁止: UI absence 不得直接誤判 Authority Gap
- Edge: Action→Gate/Permission
  Required proof: gate + permission refs
  禁止: 隱藏按鈕不得當 security
- Edge: Validation→Payload
  Required proof: schema/version/required fields
  禁止: alias fallback 隱藏 schema drift
- Edge: Payload→API→Runtime
  Required proof: exact binding + owner + version
  禁止: 以舊 route 或 mock runtime 冒充 Current
- Edge: Runtime→DB/Provider
  Required proof: effect boundary + idempotency + audit
  禁止: 無 evidence 的外部 effect 不得宣稱成功
- Edge: Audit→Response→UI Feedback
  Required proof: correlation + status/error mapping
  禁止: inner success 不得投影成 terminal success
inspection_modes:
- Mode: CURRENT_TRUTH_AUDIT
  用途: 檢查 Current identity 與引用
  典型輸入: Registry/Governance/HEAD
  輸出: truth findings
- Mode: FUNCTIONAL_CHAIN_AUDIT
  用途: 端到端 operation trace
  典型輸入: Page/Action/API/Runtime/DB
  輸出: missing/broken edges
- Mode: AUTHORITY_OWNER_AUDIT
  用途: owner/UID/duplicate/parallel system
  典型輸入: registries/paths
  輸出: ownership findings
- Mode: SCHEMA_CONTRACT_AUDIT
  用途: producer-consumer schema exactness
  典型輸入: payload/event/contracts
  輸出: schema drift findings
- Mode: PERMISSION_SECURITY_AUDIT
  用途: gate/permission/RLS/classification
  典型輸入: permission refs/runtime
  輸出: security findings
- Mode: STATE_LIFECYCLE_AUDIT
  用途: state/transition/guard closure
  典型輸入: state machines/evidence
  輸出: illegal transitions
- Mode: CROSS_STAGE_HANDOFF_AUDIT
  用途: producer output → successor input readiness
  典型輸入: handoff ledger/physical artifacts
  輸出: false-completion findings
- Mode: RUNTIME_EFFECT_AUDIT
  用途: effectful execution + idempotency + provider result
  典型輸入: runtime/evidence
  輸出: effect findings
- Mode: DEPLOYMENT_PRODUCTION_AUDIT
  用途: exact deployed SHA + remote acceptance
  典型輸入: deploy/runtime evidence
  輸出: production findings
- Mode: RESIDUAL_CLEANUP_AUDIT
  用途: dead/stale/duplicate/temp reference
  典型輸入: consumer graph/history
  輸出: cleanup findings
- Mode: PORTABILITY_AUDIT
  用途: common policy not product/profile coupled
  典型輸入: synthetic profiles
  輸出: portability findings
- Mode: HIDDEN_DEFECT_SWEEP
  用途: known fix 後找鄰近/反向缺陷
  典型輸入: fresh current scope
  輸出: latent findings
