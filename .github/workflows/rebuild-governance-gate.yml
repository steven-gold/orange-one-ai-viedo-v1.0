      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v219_evidence_logic_successor.py
  current-v219-visual-successor-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v219_visual_base_blueprint_successor.py
  current-v210-closure-continuity-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify lifecycle-wide closure evidence continuity and synchronized current ledgers
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v210_closure_continuity.py
  sealed-v216-runtime:
