authority:
  id: ACPOS_WEBSITE_CONSTRUCTION_PROGRESS
  version: V1.0
  status: ACTIVE
  branch: new
  authority_baseline_commit: 2c8a23feb6ccdc564c7590dc949fa164206ebb18
  source_of_truth: authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
  purpose: Track actual website construction progress without becoming a second system/page authority.
  construction_truth_rule: Only mark a step COMPLETE when the corresponding files, render/test evidence, and validation actually exist.

program_rules:
  sequence_lock:
    - Complete visual positioning for all pages before page business/runtime logic construction.
    - Visual construction order is Home -> Front Workspace -> Supporting Workspace -> Admin.
    - After Front visual completion, remaining visual/logic/runtime order is dependency-planned by ACPOS construction sequencing.
    - No page may invent sections, controls, routes, permissions, provider pickers, or business data outside Current Authority.
  visual_phase_boundary:
    allowed:
      - App shell rendering
      - Exact section/component/control placement
      - Page-local visual tabs/drawers/modals using local presentation state only
      - Responsive layout behavior
      - Loading/empty/error/disabled presentation states
      - Real-data placeholders using authority missing-value rules
    forbidden_until_logic_phase:
      - Business API mutation
      - Database mutation
      - Provider execution
      - Crawler execution
      - Cross-page business handoff execution
      - Fake business records or fabricated KPI/project/provider/version values
  page_visual_complete_gate:
    - Current Page Authority loaded and page UID matched
    - All registered visible sections/components/controls positioned
    - Global Shell V1.9 and Global Visual inherited without page-local theme override
    - No extra menu/page/header/control invented
    - No clipping/overlap at desktop target widths
    - Expanded/collapsed sidebar does not break workspace geometry
    - Loading/empty/error/disabled states have defined visual treatment
    - Render evidence captured and inspected
    - Visual validation PASS
  all_visual_complete_gate:
    - VIS-00 through VIS-18 are COMPLETE
    - No page business logic has been prematurely implemented
    - Cross-page visual consistency audit PASS
    - Navigation route-to-page visual audit PASS
  page_logic_complete_gate:
    - Required Control -> Action -> Gate -> Permission -> State/Transition path implemented
    - API/DB/runtime binding implemented only where authority requires it
    - Registered errors and recovery paths implemented
    - Exact version/reference rules enforced
    - Audit/correlation evidence exists
    - Unit/integration validation PASS
  final_close_gate:
    - All page logic steps COMPLETE
    - Shared runtimes COMPLETE
    - Five-department handoff E2E PASS
    - Permission/IAM E2E PASS
    - AI routing/provider E2E PASS where external environment is available
    - Shared acquisition E2E PASS where external environment is available
    - i18n PASS
    - Runtime/error/rollback PASS
    - No known P0/P1 construction gap

