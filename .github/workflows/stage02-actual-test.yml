          ev['frozen_governance_uid'] = freeze.get('frozen_governance_uid')
          ev['official_stage_output_denominator'] = official
          ev['execution_profile_mandatory_output_subset'] = mandatory
          raw = json.dumps(ev, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          result_p.write_text(raw, encoding='utf-8')
          latest_p.write_text(raw, encoding='utf-8')
