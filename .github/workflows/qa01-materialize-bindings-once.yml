name: QA01 Materialize Bindings Once
on:
  push:
    branches: [qa01-functional-staging]
    paths: ['.github/workflows/qa01-materialize-bindings-once.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa01-functional-staging
          fetch-depth: 0
      - name: Materialize exact authority registries
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import json, yaml
          from pathlib import Path
          p=Path('authority/pages/workspace/QA-01/ACPOS_QA-01_FINAL_LOCKED_ENCODING_DEDUP_CLEAN.yaml')
          d=yaml.safe_load(p.read_text())
          assert d['authority']['page_uid']=='QA-01' and d['authority']['status']=='FINAL_LOCKED'
          r=d['registries']
          controls=r['controls']; actions=r['actions']; ports=r['integration_ports']
          assert len(controls)==87, len(controls)
          assert len(actions)==32, len(actions)
          assert len(ports)==10, len(ports)
          action_ids={x['action_uid'] for x in actions}; assert len(action_ids)==32
          port_ids={x['port_uid'] for x in ports}; assert len(port_ids)==10
          control_map={x['control_uid']:{
            'type':x.get('type'), 'action_uid':x.get('action_uid'), 'gate_uid':x.get('gate_uid'),
            'permission_uid':x.get('permission_uid'), 'visibility_condition':x.get('visibility_condition'),
            'component_uid':x.get('component_uid'), 'section_uid':x.get('section_uid')
          } for x in controls}
          assert len(control_map)==87
          for uid,x in control_map.items():
            assert x['action_uid'] in action_ids, (uid,x['action_uid'])
          action_map={x['action_uid']:{
            'effect_type':x.get('effect_type'), 'owner':x.get('owner'), 'permission_uid':x.get('permission_uid'),
            'gate_uid':x.get('gate_uid'), 'operation':x.get('operation'), 'method_path':x.get('method_path'),
            'runtime_binding':x.get('runtime_binding')
          } for x in actions}
          port_map={x['port_uid']:{k:v for k,v in x.items() if k!='port_uid'} for x in ports}
          def ts(v): return json.dumps(v,ensure_ascii=False,separators=(',',':'))
          out='// GENERATED FROM QA-01 FINAL_LOCKED AUTHORITY. DO NOT HAND-EDIT.\n'
          out+=f'export const QA_CONTROL_BINDINGS={ts(control_map)} as const;\n'
          out+=f'export const QA_ACTION_REGISTRY={ts(action_map)} as const;\n'
          out+=f'export const QA_PORT_REGISTRY={ts(port_map)} as const;\n'
          out+='export type QaControlUid=keyof typeof QA_CONTROL_BINDINGS;\n'
          out+='export type QaActionUid=keyof typeof QA_ACTION_REGISTRY;\n'
          out+='export const QA_MATERIALIZED_CONTROL_COUNT=87 as const;\nexport const QA_MATERIALIZED_ACTION_COUNT=32 as const;\nexport const QA_MATERIALIZED_PORT_COUNT=10 as const;\n'
          Path('src/domain/qa/qaControlBindings.ts').write_text(out)
          print('QA01_MATERIALIZATION_PASS controls=87 actions=32 ports=10')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/qa/qaControlBindings.ts
          git commit -m 'feat(qa): materialize QA-01 authority control and action bindings'
          git push origin HEAD:qa01-functional-staging
