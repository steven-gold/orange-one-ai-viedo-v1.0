name: Governance v2.1.6 Semantic Granularity Stage-1 Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-v216-stage1-granularity-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify replay block, 61-node refinement, and 61/61 segment mapping
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v216_workspace.py
  current-v216-source-facts-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify source context, conflict ledger, dependency map, and stage boundary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v216_source_facts.py
  sealed-v216-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact sealed v2.1.6 runtime, Stage-1 33/33, and lifecycle 11/11
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_sealed_v216_runtime.py
