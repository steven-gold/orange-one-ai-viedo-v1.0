acceptance:
- acceptance_uid: INFO-01-ACC-01
  item: Single Page + Global Visual
  condition: Only workspace:INFO-01 is current latest-information workspace; no parallel current subpage; Global Shell/Visual inherited
- acceptance_uid: INFO-01-ACC-02
  item: Source Health / Freshness
  condition: Authorized source health and freshness are visible; stale/incomplete remain explicit; no fake values
- acceptance_uid: INFO-01-ACC-03
  item: FACT vs INFERENCE
  condition: FACT and INFERENCE/RECOMMENDATION are visibly separated and classification cannot be changed by UI
- acceptance_uid: INFO-01-ACC-04
  item: Fact Minimum Contract
  condition: Validated Fact displays source + source_time + scope + completeness + confidence + classification/evidence
- acceptance_uid: INFO-01-ACC-05
  item: Evidence / Citation
  condition: Fact Pack provides exact Evidence / Source Metadata / Citation; missing refs stay broken/incomplete and block evidence-dependent
    adoption
- acceptance_uid: INFO-01-ACC-06
  item: Research Boundary
  condition: Research Queue/Run is read-only unless a separate registered operation exists; INFO-01 creates no Start/Cancel Research action
- acceptance_uid: INFO-01-ACC-07
  item: Knowledge Firewall
  condition: Fact/Inference/Recommendation cannot directly write Canon/Lock/Priority/Budget/Task/Release/Publish
- acceptance_uid: INFO-01-ACC-08
  item: Context Candidate
  condition: Candidate review includes exact scope/facts/citations/adoption review; Adopt Context remains governance context adoption only
- acceptance_uid: INFO-01-ACC-09
  item: Registered Actions
  condition: Refresh/Search/Export/Adopt/Decide bind only to their canonical registered operations, schemas, permissions and server gates
- acceptance_uid: INFO-01-ACC-10
  item: Authorization
  condition: Account Permission Assignment + scope + condition + classification + audit; role-name authorization forbidden
- acceptance_uid: INFO-01-ACC-11
  item: Scrollable Page
  condition: Main Workspace height:auto; overflow-y:auto; not tied to Global Sidebar/Menu height
- acceptance_uid: INFO-01-ACC-12
  item: Machine Binding
  condition: Every visible control resolves Section/Component/Visual/Action/Gate/Permission; unlisted = BLOCK
hard_locks:
- Only workspace:INFO-01 is the current latest-information workspace defined by this authority; no parallel current latest-information page may
  be generated.
- Global Header/Sidebar/Visual are inherited; INFO-01 must not redraw the global shell or create a page-local visual system.
- All visible business data is REAL DATA ONLY; missing = —; loading = 載入中; no fake source, alert, fact, score, confidence, freshness, research
  status, candidate or citation.
- FACT and INFERENCE / RECOMMENDATION must remain visibly distinct.
- A validated Fact requires source + source_time + scope + completeness + confidence + classification; missing data is incomplete, not AI-filled.
- No page-local numeric threshold for Freshness / Completeness / Confidence may be invented.
- Research Queue / Research Run is read-only here; no unregistered Start/Cancel/Retry Research action.
- Fact / Inference / Recommendation may create Context / Alert / Candidate / Review Request only and cannot directly modify Canon, Lock, Priority,
  Budget, Task, Release or Publish.
- Adopt Context is not Canon adoption and not production execution; it records governed Context adoption only.
- adoptContextCandidate and decideCandidate remain separate registered operations; server/state gates determine which action is enabled.
- Refresh/Search/Export/Adopt/Decide must use registered request schema, exact scope/version/correlation/idempotency and permission/audit gates;
  no free-form union payload.
- No unlisted Section/Component/Control/Action/State/Gate/Permission/Port/Business Sample Data.
