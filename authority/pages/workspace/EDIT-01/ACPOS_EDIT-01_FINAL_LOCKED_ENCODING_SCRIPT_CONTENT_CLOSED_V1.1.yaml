  - action_uid: EDIT-01-ACT-VOICE-SCRIPT-BIND
    trigger_semantics: 配音腳本
    owner: CLIENT/ORCHESTRATION
    effect_type: CONTEXT_STATE
    success_contract: PROJECT_TASK：只讀目前 Production Package Voice Script Section ref，不允許手動改綁；STANDALONE：只更新 Session Script Context
    error_contract: EDIT-01-ERR-CONTEXT-001
  - action_uid: EDIT-01-ACT-EXECUTION-MODE-SET
    trigger_semantics: AUTO/MANUAL
    owner: CLIENT/ORCHESTRATION
    effect_type: CONTEXT_STATE
    success_contract: 只切 Execution Mode；不改資料來源；兩模式共用同一 Production Package/Input Manifest
    error_contract: EDIT-01-ERR-SOURCE-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-FLOW-START-CONTINUE
    trigger_semantics: 開始/繼續
    owner: EDITING/ORCHESTRATION
    effect_type: JOB_START
    success_contract: Resolve Current Stage → Verify Input Fingerprint → Load exact Script Section/Assets → Execute。AUTO 只自動執行「目前 Stage + Evaluation」，之後進
      WAIT_CONFIRMATION；Confirm 後才自動啟動下一 Stage。MANUAL 執行目前 Stage；Confirm 後下一 Stage 仍需再按開始/繼續。初始 PROJECT_TASK 以 current registered authority specialized
      createEditingRuntimeRun 啟動；不得使用 retired generic editing task execution。
    error_contract: EDIT-01-ERR-BLUEPRINT-001 / EDIT-01-ERR-PACKAGE-001 / EDIT-01-ERR-SCRIPT-001 / EDIT-01-ERR-ASSET-BINDING-001 / EDIT-01-ERR-FILENAME-001
      / EDIT-01-ERR-CHECKSUM-001 / EDIT-01-ERR-STAGE-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-BLUEPRINT-VIEW
    trigger_semantics: 查看藍圖
    owner: CLIENT/ORCHESTRATION
    effect_type: UI_ONLY
    success_contract: 只查看目前 Locked Blueprint Ref；不可編輯
    error_contract: EDIT-01-ERR-BLUEPRINT-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-PACKAGE-VIEW
    trigger_semantics: 查看生產包
    owner: CLIENT/ORCHESTRATION
    effect_type: UI_ONLY
    success_contract: 只查看目前 Production Package/Stage Sections；不可在 EDIT 改寫
    error_contract: EDIT-01-ERR-PACKAGE-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-MANIFEST-VIEW
    trigger_semantics: 查看輸入清單
    owner: CLIENT/ORCHESTRATION
    effect_type: UI_ONLY
    success_contract: 顯示 exact Script/DNA/Asset/File/Version/Checksum/Fingerprint
    error_contract: EDIT-01-ERR-ASSET-BINDING-001 / EDIT-01-ERR-FILENAME-001 / EDIT-01-ERR-CHECKSUM-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-STAGE-CONFIRM
    trigger_semantics: 確認目前階段
    owner: EDITING/ORCHESTRATION
    effect_type: STATE_TRANSITION
    success_contract: AUTO/MANUAL 共用的授權決策；僅 EDIT-01-GATE-STAGE-PASS PASS 時可執行。寫入 StageCheckpoint=CONFIRMED，並依 Current Stage 觸發 Port Registry 唯一允許的
      current registered authority decision/score/handoff/next-runtime 行為；AUTO 隨後自動啟動下一 Stage，MANUAL 僅將下一 Stage 置為 Ready。
    error_contract: EDIT-01-ERR-STAGE-001 / EDIT-01-ERR-EVALUATION-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-STAGE-MODIFY
    trigger_semantics: 修改目前階段
    owner: CLIENT/ORCHESTRATION
    effect_type: CONTEXT_STATE
    success_contract: 建立/打開 CorrectionContext；預載目前 Stage/Script/Bindings/Issue
    error_contract: EDIT-01-ERR-STAGE-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-RETURN-BLUEPRINT
    trigger_semantics: 退回藍圖修正
    owner: EDITING/ORCHESTRATION
    effect_type: HANDOFF
    success_contract: 建立「需要上游藍圖/素材更新」的邊界請求並暫停目前 Task；EDIT 不定義上游內部實作
    error_contract: EDIT-01-ERR-BLUEPRINT-UPDATE-REQUIRED / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-STANDALONE-SPEC-IMPORT
    trigger_semantics: 上傳腳本/規格
    owner: EDITING
    effect_type: JOB_START
    success_contract: 只在 Standalone 建立 Session Spec Ref；不得升格為 Project Blueprint
    error_contract: EDIT-01-ERR-UPLOAD-001 / EDIT-01-ERR-MEDIA-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-CORRECTION-CANDIDATE-GENERATE
    trigger_semantics: 產生 Correction Script Candidate
    owner: EDITING/AI
    effect_type: JOB_START
    success_contract: 只讀 CorrectionContext + Current Script Section + Blueprint/DNA/Asset refs；產生 EDIT-01-OBJ-CORRECTION-SCRIPT-CANDIDATE，不改 Working
      Draft
    error_contract: EDIT-01-ERR-CORRECTION-001 / EDIT-01-ERR-SCRIPT-001 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-CORRECTION-CANDIDATE-APPROVE
    trigger_semantics: 確認 Correction Script Candidate
    owner: EDITING/AI
    effect_type: CANDIDATE_STATE
    success_contract: 將 candidate approval_state=APPROVED；自動觸發 EDIT-01-ACT-CORRECTION-TRANSLATE；不改 Working Draft
    error_contract: EDIT-01-ERR-CORRECTION-002 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-CORRECTION-TRANSLATE
    trigger_semantics: 系統轉換已確認修正腳本
    owner: EDITING/API
    effect_type: JOB_START
    success_contract: 依 approved candidate + Production Package provider policy 建立 EDIT-01-OBJ-CORRECTION-TRANSLATION；PROJECT_TASK 不允許人手換 Provider/Model
    error_contract: EDIT-01-ERR-API-001 / EDIT-01-ERR-CORRECTION-003
  - action_uid: EDIT-01-ACT-CORRECTION-EXECUTE
    trigger_semantics: 執行已轉換修正
    owner: EDITING/API
    effect_type: JOB_START
    success_contract: 只執行 approved+translated target scope；產生 Candidate Output；不得超出 CorrectionContext scope
    error_contract: EDIT-01-ERR-API-002 / EDIT-01-ERR-CORRECTION-004 / EDIT-01-ERR-PERM-001
  - action_uid: EDIT-01-ACT-STAGE-EVALUATE
    trigger_semantics: Current Stage 評分
    owner: EDITING/EVALUATION
    effect_type: JOB_START
    success_contract: 以 Current Stage result + Blueprint Production Package evaluation criteria + input_fingerprint 建立 EDIT-01-OBJ-STAGE-EVALUATION
      / STAGE-EVIDENCE；不修改媒體
    error_contract: EDIT-01-ERR-EVALUATION-001 / EDIT-01-ERR-STAGE-001
  page_states:
  - state_uid: EDIT-01-ST-PAGE-EMPTY
    display: 無來源
    definition: 尚未載入媒體或專案來源
    allowed_primary_behavior: 只能選 Source Mode／Upload／Load Source
  - state_uid: EDIT-01-ST-PAGE-SOURCE_READY
    display: 來源完成
    definition: 媒體或專案來源已綁定
    allowed_primary_behavior: 允許建立／開啟 Working Draft
  - state_uid: EDIT-01-ST-PAGE-WORKING
    display: 工作草稿
    definition: Timeline 可人工/API/音訊/字幕操作
    allowed_primary_behavior: 所有變更只寫 Working Draft
  - state_uid: EDIT-01-ST-PAGE-EVAL_REQUIRED
    display: 待 QA
    definition: Working Draft 有新修改
    allowed_primary_behavior: Render/Lock/Handoff 禁止
  - state_uid: EDIT-01-ST-PAGE-EVAL_PASS
    display: QA 通過
    definition: 無 Blocking Issue
    allowed_primary_behavior: 允許 Save Version／Render
  - state_uid: EDIT-01-ST-PAGE-VERSION_SAVED
    display: 版本已存
    definition: Immutable Edit Version 已建立
    allowed_primary_behavior: Working Draft 可繼續衍生新版本
  - state_uid: EDIT-01-ST-PAGE-RENDERING
    display: Render 中
    definition: Render Job Running
    allowed_primary_behavior: 禁止重複 Render；允許 Cancel
  - state_uid: EDIT-01-ST-PAGE-OUTPUT_READY
    display: 輸出完成
    definition: Output Reference Ready
    allowed_primary_behavior: 允許 Download／Lock／Handoff
  - state_uid: EDIT-01-ST-PAGE-LOCKED
    display: 版本鎖定
    definition: Exact Version Locked
    allowed_primary_behavior: 禁止修改該版本；僅可 Restore as New Draft
  - state_uid: EDIT-01-ST-PAGE-HANDED_OFF
    display: 已交接
    definition: Handoff 完成
    allowed_primary_behavior: 原版本保持不可變
  job_states:
  - job_state_uid: EDIT-01-ST-JOB-QUEUED
    applicable_jobs: Import/API/Voice/Mix/LipSync/Subtitle/Render
    definition: 已排入佇列
  - job_state_uid: EDIT-01-ST-JOB-RUNNING
    applicable_jobs: 同上
    definition: 執行中
  - job_state_uid: EDIT-01-ST-JOB-CANDIDATE_READY
    applicable_jobs: API Edit
    definition: Candidate 已完成，尚未 Apply
  - job_state_uid: EDIT-01-ST-JOB-SUCCEEDED
    applicable_jobs: 同上
    definition: 結果可用
  - job_state_uid: EDIT-01-ST-JOB-FAILED
    applicable_jobs: 同上
    definition: 顯示真實 Error Code／可重試條件
  - job_state_uid: EDIT-01-ST-JOB-CANCELLED
    applicable_jobs: 同上
    definition: 使用者取消；不得套用半成品
  page_transitions:
  - transition_uid: EDIT-01-TR-001
    from: EDIT-01-ST-PAGE-EMPTY
    to: EDIT-01-ST-PAGE-SOURCE_READY
    trigger: Load Project Source / Media Import Success
    required_condition: 建立有效 Source Context；不得跳過來源
  - transition_uid: EDIT-01-TR-002
    from: EDIT-01-ST-PAGE-SOURCE_READY
    to: EDIT-01-ST-PAGE-WORKING
    trigger: Create/Open Working Draft
    required_condition: Working Draft ID + Timeline ID 必須存在
  - transition_uid: EDIT-01-TR-003
    from: EDIT-01-ST-PAGE-WORKING / EDIT-01-ST-PAGE-EVAL_PASS / EDIT-01-ST-PAGE-VERSION_SAVED
    to: EDIT-01-ST-PAGE-EVAL_REQUIRED
    trigger: 任何 DRAFT_MUTATION 或套用型 Job Result
    required_condition: Saved Version 不變；只標記目前 Draft 需重檢
  - transition_uid: EDIT-01-TR-004
    from: EDIT-01-ST-PAGE-EVAL_REQUIRED
    to: EDIT-01-ST-PAGE-EVAL_PASS
    trigger: Stage Recheck PASS
    required_condition: Blocking Issue=0；Evidence 完整
  - transition_uid: EDIT-01-TR-005
    from: EDIT-01-ST-PAGE-EVAL_PASS
    to: EDIT-01-ST-PAGE-VERSION_SAVED
    trigger: Save New Version
    required_condition: 建立全新 Immutable EditVersion ID
  - transition_uid: EDIT-01-TR-006
    from: EDIT-01-ST-PAGE-VERSION_SAVED
    to: EDIT-01-ST-PAGE-RENDERING
    trigger: Render Start
    required_condition: Render input 必須鎖定到 Saved EditVersion ID
  - transition_uid: EDIT-01-TR-007
    from: EDIT-01-ST-PAGE-RENDERING
    to: EDIT-01-ST-PAGE-OUTPUT_READY
    trigger: Render Success
    required_condition: OutputReference + Manifest + Checksum
  - transition_uid: EDIT-01-TR-008
    from: EDIT-01-ST-PAGE-RENDERING
    to: EDIT-01-ST-PAGE-VERSION_SAVED
    trigger: Render Fail/Cancel
    required_condition: 不得建立 OutputReference
  - transition_uid: EDIT-01-TR-009
    from: EDIT-01-ST-PAGE-OUTPUT_READY
    to: EDIT-01-ST-PAGE-LOCKED
    trigger: Lock Exact Version
    required_condition: EditVersion Locked；OutputReference 保持 immutable
  - transition_uid: EDIT-01-TR-010
    from: EDIT-01-ST-PAGE-LOCKED
    to: EDIT-01-ST-PAGE-HANDED_OFF
    trigger: Handoff Success
    required_condition: Handoff record 完整引用版本/輸出/證據
  - transition_uid: EDIT-01-TR-011
    from: EDIT-01-ST-PAGE-LOCKED / EDIT-01-ST-PAGE-VERSION_SAVED
    to: EDIT-01-ST-PAGE-WORKING
    trigger: Restore as New Draft
    required_condition: 建立新 Draft ID；原版本完全不變
  - transition_uid: EDIT-01-TR-012
    from: ANY NON-LOCKED PAGE STATE
    to: EDIT-01-ST-PAGE-EMPTY / EDIT-01-ST-PAGE-SOURCE_READY
    trigger: Source Mode / Context Change
    required_condition: 必須先 Context Reset；Running Job 按其 Cancel Contract 處理
  job_transitions:
  - job_transition_uid: EDIT-01-JTR-001
    from: —
    to: EDIT-01-ST-JOB-QUEUED
    legal_trigger: 建立 Import/API/Voice/Mix/LipSync/Subtitle/Render Job
  - job_transition_uid: EDIT-01-JTR-002
    from: EDIT-01-ST-JOB-QUEUED
    to: EDIT-01-ST-JOB-RUNNING
    legal_trigger: Worker/Provider 接手
  - job_transition_uid: EDIT-01-JTR-003
    from: EDIT-01-ST-JOB-RUNNING
    to: EDIT-01-ST-JOB-CANDIDATE_READY
    legal_trigger: 僅 API Edit Candidate 完成
  - job_transition_uid: EDIT-01-JTR-004
    from: EDIT-01-ST-JOB-RUNNING
    to: EDIT-01-ST-JOB-SUCCEEDED
    legal_trigger: 非 Candidate 類 Job 成功
  - job_transition_uid: EDIT-01-JTR-005
    from: EDIT-01-ST-JOB-QUEUED/EDIT-01-ST-JOB-RUNNING
    to: EDIT-01-ST-JOB-FAILED
    legal_trigger: 真實錯誤；必須 Error UID
  - job_transition_uid: EDIT-01-JTR-006
    from: EDIT-01-ST-JOB-QUEUED/EDIT-01-ST-JOB-RUNNING
    to: EDIT-01-ST-JOB-CANCELLED
    legal_trigger: 使用者 Cancel 且 Action 允許
  - job_transition_uid: EDIT-01-JTR-007
    from: EDIT-01-ST-JOB-CANDIDATE_READY
    to: EDIT-01-ST-JOB-SUCCEEDED
    legal_trigger: Candidate Apply 成功；Working Draft 更新
  gates:
  - gate_uid: EDIT-01-GATE-SOURCE
    condition: 合法 Source Mode + source loaded/imported
    block_behavior: 不建立 Timeline/Draft
  - gate_uid: EDIT-01-GATE-DRAFT
    condition: Timeline valid + Working Draft exists
    block_behavior: 所有 Edit Action Disabled
  - gate_uid: EDIT-01-GATE-AUDIO
    condition: 有音訊時 Mix Valid
    block_behavior: Render Disabled
  - gate_uid: EDIT-01-GATE-LIPSYNC
    condition: 使用 LipSync 時 Result Valid
    block_behavior: Render Disabled
  - gate_uid: EDIT-01-GATE-SUBTITLE
    condition: 有字幕時 Subtitle Valid
    block_behavior: Render Disabled
  - gate_uid: EDIT-01-GATE-EVALUATION
    condition: 無 unresolved Blocking Issue；最新修改已 Recheck
    block_behavior: Render/Lock/Handoff Disabled
  - gate_uid: EDIT-01-GATE-VERSION
    condition: Saved Version exists
    block_behavior: Lock Disabled
  - gate_uid: EDIT-01-GATE-RENDER
    condition: Source/Draft/Audio/DialogueSync/LipSync/Subtitle/QA gates pass + Immutable Saved Edit Version exists
    block_behavior: Render Disabled
  - gate_uid: EDIT-01-GATE-HANDOFF
    condition: Output Ready + Exact Version Locked + Handoff permission
    block_behavior: Handoff Disabled
  - gate_uid: EDIT-01-GATE-CONTEXT-INTEGRITY
    condition: PROJECT_TASK 必須 Project/Topic/Task + Locked Blueprint + Production Package + Input Manifest + fingerprint 全部一致
    block_behavior: Stage Execute Disabled
  - gate_uid: EDIT-01-GATE-BINDING-INTEGRITY
    condition: 每個 Script Section 引用的 DNA/Asset ID/Version/filename/checksum 必須 exact match
    block_behavior: 禁止 Load/Execute 該 Stage；無 fallback
  - gate_uid: EDIT-01-GATE-STAGE-PASS
    condition: Latest EDIT-01-OBJ-STAGE-EVALUATION.result=PASS + overall_score >= ProductionPackage evaluation threshold (current authority 95)
      + hard_blocks=0 + input_fingerprint match
    block_behavior: Stage Evaluation PASS 後解鎖「確認目前階段 / 修改目前階段」。AUTO 必須停在 WAIT_CONFIRMATION；確認後才由 Orchestrator 自動啟動下一 Stage。MANUAL 確認後仍需再按開始/繼續。FAIL/Hard
      Block 一律不得前進。
  - gate_uid: EDIT-01-GATE-PROJECT-SOURCE-MUTATION
    condition: PROJECT_TASK 禁止在 EDIT 新增/替換 Blueprint 綁定的來源
    block_behavior: 需執行 Return Blueprint Correction
  - gate_uid: EDIT-01-GATE-DIALOGUE-SYNC
    condition: EDIT-01-GATE-SYNC-POLICY PASS；Voice/LipSync/Subtitle 共用 exact DialogueTimingBinding；每個 segment drift <= resolved policy；無 STALE/mismatch
    block_behavior: SYNC Stage PASS / Render / Lock Disabled
  - gate_uid: EDIT-01-GATE-CONTEXT-MUTABLE
    condition: Page 未 LOCKED/HANDED_OFF；無阻止 Context change 的 Running Job
    block_behavior: Source/Project/Topic/Task/Mode controls Disabled
  - gate_uid: EDIT-01-GATE-PREVIEW
    condition: EDIT-01-GATE-SOURCE PASS + source previewable
    block_behavior: Preview/Transport Disabled
  - gate_uid: EDIT-01-GATE-TRACK-SELECTION
    condition: EDIT-01-GATE-DRAFT PASS + compatible selected Clip/Range/Track
    block_behavior: Selected-scope mutation controls Disabled
  - gate_uid: EDIT-01-GATE-CORRECTION
    condition: 'PROJECT_TASK: Current Stage + Current Script Section + Input Fingerprint + Issue/Selected Scope；或 STANDALONE Context complete'
    block_behavior: Correction input/generate Disabled
  - gate_uid: EDIT-01-GATE-CORRECTION-CANDIDATE
    condition: CorrectionScriptCandidate exists + candidate hash matches Current CorrectionContext + not stale
    block_behavior: Approve/Compare Disabled
  - gate_uid: EDIT-01-GATE-CORRECTION-TRANSLATED
    condition: Approved CorrectionScriptCandidate + valid CorrectionTranslation + exact target scope
    block_behavior: Execute Correction Disabled
  - gate_uid: EDIT-01-GATE-EVALUATION-RUN
    condition: Current Stage execution/correction result exists + input fingerprint valid + evaluation criteria resolved
    block_behavior: Stage Evaluate/Recheck Disabled
  - gate_uid: EDIT-01-GATE-FINALIZE
    condition: Stage 01/02/03 checkpoints PASS + no hard block + EVAL_PASS + exact saved version requirements resolvable
    block_behavior: Finalize/Save/Render/Lock Disabled
  - gate_uid: EDIT-01-GATE-BLUEPRINT-RETURN
    condition: PROJECT_TASK + requested change requires Script/DNA/Asset binding mutation + no non-cancellable job
    block_behavior: Return Blueprint Correction Disabled
  - gate_uid: EDIT-01-GATE-STANDALONE
    condition: Source Mode=STANDALONE_UPLOAD + owner/session permission valid
    block_behavior: Standalone-only controls Hidden/Disabled
  - gate_uid: EDIT-01-GATE-SYNC-POLICY
    condition: DialogueTimingBinding exists + sync tolerance policy resolved by EDIT-01-POLICY-DIALOGUE-SYNC-TOLERANCE
    block_behavior: Policy 缺失/不可解析 → EDIT-01-ERR-SYNC-POLICY-001；LipSync/Subtitle Stage PASS Disabled
  permissions:
  - permission_uid: EDITING_USE
    coverage: 進入 EDIT-01
    standalone_rule: 必須登入且允許使用 EDIT
  - permission_uid: EDITING_VIEW
    coverage: Preview/Timeline/History/Evidence
    standalone_rule: Standalone 只允許 Owner/授權者
  - permission_uid: EDITING_UPLOAD
    coverage: Upload/Import Subtitle/Media
    standalone_rule: Standalone Owner scope 必須成立；PROJECT_TASK 不得用 Upload 建立/替換專案來源
  - permission_uid: EDITING_EDIT
    coverage: 人工 Timeline 修改
    standalone_rule: 專案模式另需 Project permission
  - permission_uid: EDITING_API_EXECUTE
    coverage: API/AI Execute/Cancel/Apply
    standalone_rule: Provider 使用權限必須存在
  - permission_uid: EDITING_VOICE_EXECUTE
    coverage: Voice/Mix/LipSync 執行
    standalone_rule: Mix/LipSync 依既有 service permission；PROJECT_TASK 不在 EDIT 生成新 Voice Asset；Standalone Voice generation 另受權限控制
  - permission_uid: EDITING_STAGE_EVALUATION
    coverage: QA Recheck / Evidence
    standalone_rule: QA Evidence 維持原權限
  - permission_uid: EDITING_RENDER
    coverage: Render/Cancel Render
    standalone_rule: Completion Gate 仍需通過
  - permission_uid: EDITING_HANDOFF
    coverage: Lock/Handoff
    standalone_rule: Output Ready + Exact Version Locked
  errors:
  - error_uid: EDIT-01-ERR-SOURCE-001
    context: 來源模式資料不完整
    recovery: 阻擋載入/建立 Draft；指出缺少 Project/Task 或 Upload
  - error_uid: EDIT-01-ERR-UPLOAD-001
    context: 上傳失敗
    recovery: 保留佇列項目與錯誤；不得建立假 Asset Version
  - error_uid: EDIT-01-ERR-MEDIA-001
    context: 不支援媒體格式
    recovery: 阻擋加入 Timeline；顯示支援格式來源
  - error_uid: EDIT-01-ERR-TIME-001
    context: Timecode/Range 超界
    recovery: 拒絕操作並保持原值
  - error_uid: EDIT-01-ERR-TRACK-001
    context: 媒體與 Track 不相容
    recovery: 拒絕 Drop/Insert，不自動改 Track 類型
  - error_uid: EDIT-01-ERR-API-001
    context: Provider/Model 不可用
    recovery: 阻擋 Execute；不得自動切 Provider
  - error_uid: EDIT-01-ERR-API-002
    context: API Job 失敗
    recovery: 顯示 Provider Error；不得 Apply
  - error_uid: EDIT-01-ERR-API-003
    context: Candidate 已過期/與 Draft 不一致
    recovery: 阻擋 Apply；要求重新產生 Candidate
  - error_uid: EDIT-01-ERR-VOICE-001
    context: 配音生成失敗
    recovery: 保留既有 Take；不得以其他 Voice 自動替代
  - error_uid: EDIT-01-ERR-MIX-001
    context: 混音失敗
    recovery: 保留未混音 Working Draft；顯示 Track/Job 錯誤
  - error_uid: EDIT-01-ERR-LIPSYNC-001
    context: 對嘴失敗
    recovery: 建立/顯示問題 Marker；允許 Selected Range Retry
  - error_uid: EDIT-01-ERR-SUB-001
    context: 字幕同步失敗
    recovery: 保留字幕版本；跳到問題 Segment
  - error_uid: EDIT-01-ERR-EVALUATION-001
    context: Blocking Stage Evaluation Issue
    recovery: Render/Lock/Handoff Disabled
  - error_uid: EDIT-01-ERR-VERSION-001
    context: 版本衝突/已鎖定
    recovery: 禁止覆寫；只能 Save New Version / Restore as New Draft
  - error_uid: EDIT-01-ERR-RENDER-001
    context: Render 失敗
    recovery: 保留 Job Evidence；不得產生假 Output Reference
  - error_uid: EDIT-01-ERR-PERM-001
    context: 權限不足
    recovery: 控制項 Disabled/拒絕 Action；顯示缺少 Scope
  - error_uid: EDIT-01-ERR-BLUEPRINT-001
    context: Locked Blueprint Ref 缺失/版本不符
    recovery: BLOCK Current Stage；重新 Resolve 正確 Project/Topic/Task；不得拿其他版本替代
  - error_uid: EDIT-01-ERR-PACKAGE-001
    context: Production Package ID/version/hash 不一致
    recovery: BLOCK Current Stage；不得讀舊 package 或其他 Topic
  - error_uid: EDIT-01-ERR-SCRIPT-001
    context: Current Stage Script Section 缺失/hash 不符
    recovery: BLOCK Current Stage；不得由 AI 自行補寫首次生產腳本
  - error_uid: EDIT-01-ERR-ASSET-BINDING-001
    context: Asset ID/Version 不在目前 Blueprint/Package binding
    recovery: BLOCK；不得搜尋或替換為相似素材
  - error_uid: EDIT-01-ERR-FILENAME-001
    context: 實際素材檔名與 manifest/腳本引用名稱不一致
    recovery: BLOCK；要求上游修正 binding/產物命名；EDIT 不自行 rename 代替
  - error_uid: EDIT-01-ERR-CHECKSUM-001
    context: 檔案 checksum/版本 fingerprint 不一致
    recovery: BLOCK；重新取得 exact referenced file
  - error_uid: EDIT-01-ERR-STAGE-001
    context: Stage 前置 Gate/評分未通過
    recovery: AUTO 暫停；MANUAL Confirm disabled；進 Correction，不得跳 Stage
  - error_uid: EDIT-01-ERR-BLUEPRINT-UPDATE-REQUIRED
    context: 修正需求涉及新增/更換 Script/DNA/Asset binding
    recovery: 停止 EDIT 對該來源的替換；唯一 Recovery=退回藍圖修正→素材生成/更新→重新 Handoff/Resolve
  - error_uid: EDIT-01-ERR-SYNC-BINDING-001
    context: Voice / LipSync / Subtitle 的 dialogue_segment_id、timebase、binding fingerprint 不一致或任何一方 STALE
    recovery: 阻擋 SYNC Stage PASS/Render/Lock；保留目前 Working Draft；重新以 exact Voice Dialogue Timing Binding 執行 LipSync/Subtitle sync，不得用獨立拖移掩蓋錯誤
  - error_uid: EDIT-01-ERR-CORRECTION-001
    context: Correction Context 不完整或 candidate generation 失敗
    recovery: 不建立 Candidate；保留 Working Draft；要求補齊 exact Stage/Script/Issue/Scope context
  - error_uid: EDIT-01-ERR-CORRECTION-002
    context: Correction Script Candidate stale/hash mismatch/未通過人工確認
    recovery: 禁止 Approve/Translate；重新生成 Candidate
  - error_uid: EDIT-01-ERR-CORRECTION-003
    context: Approved Candidate Translation 失敗
    recovery: 禁止 Execute；保留 approved candidate；顯示 provider translation error
  - error_uid: EDIT-01-ERR-CORRECTION-004
    context: Correction Execute scope 與 approved/translated scope 不一致
    recovery: BLOCK Execute；不得擴大或改寫 Scope
  - error_uid: EDIT-01-ERR-SCRIPTROLE-001
    context: Current Stage 無唯一 Script Role/Section mapping
    recovery: BLOCK Stage；禁止 AI 自選其他 Section
  - error_uid: EDIT-01-ERR-PLACEMENT-001
    context: Asset binding 缺 target_track_uid / sequence_order / timeline_anchor / cue or dialogue binding
    recovery: BLOCK Stage Placement；不得由 EDIT 猜位置/順序
  - error_uid: EDIT-01-ERR-SYNC-POLICY-001
    context: Dialogue Sync tolerance policy 缺失/不可解析
    recovery: BLOCK SYNC Stage；禁止 AI 自訂 ms/frame 門檻
  - error_uid: EDIT-01-ERR-CONTEXT-001
    context: UI/Context 輸入非法、選項不在白名單、或 Context state 不允許修改
    recovery: 拒絕該輸入；保持原 Context/Working Draft；不得自動修正成其他值
  - error_uid: EDIT-01-ERR-VOICE-PROFILE-001
    context: PROJECT_TASK 啟動 Editing Runtime 時找不到 exact immutable LOCKED voice_runtime_profile_id，或 ref/version/state 不符合 current registered authority
      prerequisite
    recovery: 顯示 VOICE_RUNTIME_PROFILE_REQUIRED；BLOCK createEditingRuntimeRun/Stage Execute。EDIT 不得建立、覆寫、猜測或 default Voice Runtime Profile；由合法上游/既有正式
      Profile 解決後重新 Resolve。
  script_roles:
  - script_role_uid: EDIT-01-SCRIPTROLE-ASSEMBLY
    stage_uid: EDIT-01-STAGE-01-ASSEMBLY
    package_binding_key: production_package.editing.assembly
    required_content: Timeline Structure / Cut Points / Shot Order / Transition / Pacing / Continuity
    hard_guard: 唯一；缺失=EDIT-01-ERR-SCRIPTROLE-001
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-ASSEMBLY
  - script_role_uid: EDIT-01-SCRIPTROLE-VOICE
    stage_uid: EDIT-01-STAGE-02-AUDIO
    package_binding_key: production_package.audio.voice
    required_content: Voice/Dialogue usage + exact bound Voice Asset refs
    hard_guard: 唯一；Project 不生成新素材
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-VOICE
  - script_role_uid: EDIT-01-SCRIPTROLE-MUSIC
    stage_uid: EDIT-01-STAGE-02-AUDIO
    package_binding_key: production_package.audio.music
    required_content: Music cues / timing / level / exact Music Asset refs
    hard_guard: 唯一；不得素材搜尋
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-MUSIC
  - script_role_uid: EDIT-01-SCRIPTROLE-SFX
    stage_uid: EDIT-01-STAGE-02-AUDIO
    package_binding_key: production_package.audio.sfx
    required_content: SFX cues / purpose / timing / exact SFX Asset refs
    hard_guard: 每 cue 必須 placement binding
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-SFX
  - script_role_uid: EDIT-01-SCRIPTROLE-MIX
    stage_uid: EDIT-01-STAGE-02-AUDIO
    package_binding_key: production_package.audio.mix
    required_content: Voice/Music/SFX mixing requirements
    hard_guard: 只作用已綁定音檔
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-MIX
  - script_role_uid: EDIT-01-SCRIPTROLE-LIPSYNC
    stage_uid: EDIT-01-STAGE-03-SYNC
    package_binding_key: production_package.sync.lipsync
    required_content: Dialogue segment / target / sync requirements
    hard_guard: 必須共用 DialogueTimingBinding
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-LIPSYNC
  - script_role_uid: EDIT-01-SCRIPTROLE-SUBTITLE
    stage_uid: EDIT-01-STAGE-03-SYNC
    package_binding_key: production_package.sync.subtitle
    required_content: Subtitle text/language/timing/format requirements
    hard_guard: 必須共用 DialogueTimingBinding
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-SUBTITLE
  - script_role_uid: EDIT-01-SCRIPTROLE-FINALIZE
    stage_uid: EDIT-01-STAGE-04-FINALIZE
    package_binding_key: production_package.output.finalize
    required_content: Export/render/lock requirements
    hard_guard: 不取代 Stage 01~03 evaluation
    field_schema_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.EDIT_VOICE.role_field_schemas.EDIT-01-SCRIPTROLE-FINALIZE
  stage_transitions:
  - stage_transition_uid: EDIT-01-STTR-01
    from_stage: EDIT-01-STAGE-01-ASSEMBLY
    to_stage: EDIT-01-STAGE-02-AUDIO
    trigger: EDIT-01-ACT-STAGE-EVALUATE → PASS + EDIT-01-ACT-STAGE-CONFIRM → StageCheckpoint CONFIRMED
    failure_behavior: FAIL/Hard Block=停留 ASSEMBLY → Correction
  - stage_transition_uid: EDIT-01-STTR-02
    from_stage: EDIT-01-STAGE-02-AUDIO
    to_stage: EDIT-01-STAGE-03-SYNC
    trigger: EDIT-01-ACT-STAGE-EVALUATE → PASS + EDIT-01-ACT-STAGE-CONFIRM → StageCheckpoint CONFIRMED
    failure_behavior: FAIL/Hard Block=停留 AUDIO → Correction
  - stage_transition_uid: EDIT-01-STTR-03
    from_stage: EDIT-01-STAGE-03-SYNC
    to_stage: EDIT-01-STAGE-04-FINALIZE
    trigger: EDIT-01-ACT-STAGE-EVALUATE → PASS + EDIT-01-GATE-DIALOGUE-SYNC PASS + EDIT-01-ACT-STAGE-CONFIRM → StageCheckpoint CONFIRMED
    failure_behavior: FAIL/STALE/mismatch=停留 SYNC
  - stage_transition_uid: EDIT-01-STTR-04
    from_stage: EDIT-01-STAGE-04-FINALIZE
    to_stage: EDIT-01-STAGE-05-QA-HANDOFF
    trigger: Save Version → Render → Output Verify → Lock 完整完成；Stage 05 的 Handoff 由 EDIT-01-ACT-HANDOFF 明確觸發
    failure_behavior: 任一步失敗不得進 QA Handoff
  - stage_transition_uid: EDIT-01-STTR-05
    from_stage: ANY STAGE
    to_stage: SAME STAGE
    trigger: Correction / Recheck
    failure_behavior: 修正不改 Stage；只有 latest Evaluation PASS 才依 01~04 前進
  marker_dialogue_sync_policies:
  - uid: EDIT-01-MARKER-GENERIC
    type: Marker Type
    definition: 一般人工標記；不得冒充 Issue/Evidence
  - uid: EDIT-01-MARKER-CUT
    type: Marker Type
    definition: 剪接點/節奏點；可供 Snap
  - uid: EDIT-01-MARKER-STAGE-ISSUE
    type: Marker Type
    definition: EDIT Stage Evaluation Issue；必須引用 StageEvidence UID
  - uid: EDIT-01-MARKER-DIALOGUE
    type: Marker Type
    definition: Dialogue segment anchor；引用 dialogue_segment_id
  - uid: EDIT-01-MARKER-SFX-CUE
    type: Marker Type
    definition: SFX cue placement；引用 cue_id + exact asset binding
  - uid: EDIT-01-MARKER-SUBTITLE
    type: Marker Type
    definition: Subtitle segment anchor；引用 dialogue_segment_id
  - uid: EDIT-01-MARKER-LIPSYNC
    type: Marker Type
    definition: LipSync issue/anchor；引用 DialogueTimingBinding
  - uid: EDIT-01-POLICY-DIALOGUE-SYNC-TOLERANCE
    type: Policy
    definition: PROJECT_TASK 必須從 ProductionPackage.sync_policy 解析 max_lipsync_drift_ms / max_subtitle_drift_ms / timebase；STANDALONE 從 confirmed
      StandaloneContext.sync_policy 解析。缺任一值=EDIT-01-ERR-SYNC-POLICY-001；禁止 AI 使用預設 ms/frame。
  integration_ports:
  - port_uid: EDIT-01-PORT-IN-VIDEO-HANDOFF
    boundary_stage: Inbound / Task Ready
    registered_operation: createDepartmentHandoff
    method_effective_path: POST /v1/handoffs
    registered_permission: department.handoff.create
    state_transition_event: DepartmentTask:HANDOFF_READY→HANDED_OFF；dependent WAITING_DEPENDENCY→READY | handoff.created
    edit01_binding_exposure: 由 VIDEO/Orchestrator 建立；EDIT 只驗證 Approved Video Handoff + exact manifest/fingerprint。EDIT 無建立此 inbound handoff 的按鈕。
  - port_uid: EDIT-01-PORT-EDIT-RUN-CREATE
    boundary_stage: Bootstrap
    registered_operation: createEditingRuntimeRun
    method_effective_path: POST /v1/editing-runtime-runs
    registered_permission: editing.task.execute
    state_transition_event: No direct transition | editing.run.created
    edit01_binding_exposure: EDIT-01-ACT-FLOW-START-CONTINUE 初始 PROJECT_TASK；必須 exact immutable LOCKED voice_runtime_profile_id；禁止 generic editing
      task execution。
  - port_uid: EDIT-01-PORT-EDIT-RUN-READ
    boundary_stage: Status Read
    registered_operation: getEditingRuntimeRun
    method_effective_path: GET /v1/editing-runtime-runs/{runId}
    registered_permission: editing.task.read
    state_transition_event: No transition | editing.run.viewed
    edit01_binding_exposure: 背景/SEC-16 read projection；不得因 API 存在而新增可見控制。
  - port_uid: EDIT-01-PORT-ASSEMBLY-COMPLETE
    boundary_stage: Stage 01 Execute
    registered_operation: completeAssembly
    method_effective_path: POST /v1/editing-runtime-runs/{runId}/assembly
    registered_permission: editing.task.execute
    state_transition_event: DepartmentTask:RUNNING→CANDIDATE_OUTPUT；EditingVoiceRuntime:ASSEMBLY→EDITING_OUTPUT_READY | editing.assembly.completed
    edit01_binding_exposure: EDIT-01-ACT-FLOW-START-CONTINUE 的 ASSEMBLY 完成端口；需 explicit assembly evidence/manifest；完成後先 Stage Evaluation→WAIT_CONFIRMATION。
  - port_uid: EDIT-01-PORT-ASSEMBLY-DECISION
    boundary_stage: Stage 01 Confirm
    registered_operation: decideOutputCandidate
    method_effective_path: POST /v1/tasks/{taskId}/outputs/{outputVersionId}/decision
    registered_permission: department.output.decide
    state_transition_event: DepartmentTask:CANDIDATE_OUTPUT→SCORE_PENDING | output.decision_recorded
    edit01_binding_exposure: EDIT-01-ACT-STAGE-CONFIRM；只在 Stage 01 Evaluation PASS 且使用者 Confirm 後呼叫。Modify 不呼叫。
  - port_uid: EDIT-01-PORT-ASSEMBLY-SCORECARD
    boundary_stage: Stage 01 Score Persist
    registered_operation: submitScorecard
    method_effective_path: POST /v1/scorecards
    registered_permission: department.score.write
    state_transition_event: DepartmentTask:SCORE_PENDING→BLOCKED or HANDOFF_READY | scorecard.submitted
    edit01_binding_exposure: 把已確認的 Stage Evaluation 結果正式持久化；不得在 CANDIDATE_OUTPUT 尚未 decision 時直接 submit。
  - port_uid: EDIT-01-PORT-EDIT-VOICE-HANDOFF
    boundary_stage: Stage 01→02 Boundary
    registered_operation: transitionEditingToVoiceStage
    method_effective_path: POST /v1/editing-runtime-runs/{runId}/voice-handoff
    registered_permission: editing.handoff.create
    state_transition_event: HANDOFF_READY→HANDED_OFF；dependent WAITING_DEPENDENCY→READY；EditingVoiceRuntime:EDITING_OUTPUT_READY→VOICE_HANDOFF_READY
      | editing.voice_handoff.created
    edit01_binding_exposure: Stage 01 Confirm + Score PASS 後由 Orchestrator 呼叫；同頁無導航，且 direct EDIT→QA 禁止。
  - port_uid: EDIT-01-PORT-VOICE-RUNTIME-START
    boundary_stage: Stage 02 Start
    registered_operation: startVoiceRuntime
    method_effective_path: POST /v1/voice-runtime-runs/{runId}/start
    registered_permission: voice.task.execute
    state_transition_event: EditingVoiceRuntime:VOICE_HANDOFF_READY→AUDIO_MIX | voice.runtime.started
    edit01_binding_exposure: 同一 EDIT-01 內啟動底層 Voice Runtime；不渲染/導航 VOICE 工作頁。
  - port_uid: EDIT-01-PORT-VOICE-RUNTIME-READ
    boundary_stage: Voice Status Read
    registered_operation: getVoiceRuntimeRun
    method_effective_path: GET /v1/voice-runtime-runs/{runId}
    registered_permission: voice.task.read
    state_transition_event: No transition | voice.runtime.viewed
    edit01_binding_exposure: 背景/SEC-16 read projection；不得額外建立 VOICE 頁控制。
  - port_uid: EDIT-01-PORT-AUDIO-MIX-COMPLETE
    boundary_stage: Stage 02 Execute
    registered_operation: completeAudioMix
    method_effective_path: POST /v1/voice-runtime-runs/{runId}/audio-mix
    registered_permission: voice.task.execute
    state_transition_event: EditingVoiceRuntime:AUDIO_MIX→LIP_SYNC | voice.audio_mix.completed
    edit01_binding_exposure: EDIT-01-ACT-MIX-EXECUTE；完成後停在 LIP_SYNC-ready boundary，Stage Evaluation→WAIT_CONFIRMATION；Confirm 前禁止 completeLipSync。
  - port_uid: EDIT-01-PORT-LIPSYNC-COMPLETE
    boundary_stage: Stage 03 LipSync
    registered_operation: completeLipSync
    method_effective_path: POST /v1/voice-runtime-runs/{runId}/lip-sync
    registered_permission: voice.task.execute
    state_transition_event: EditingVoiceRuntime:LIP_SYNC→SUBTITLE | voice.lip_sync.completed
    edit01_binding_exposure: EDIT-01-ACT-LIPSYNC-EXECUTE；必須 DialogueTimingBinding / sync policy PASS。
  - port_uid: EDIT-01-PORT-SUBTITLE-COMPLETE
    boundary_stage: Stage 03 Subtitle
    registered_operation: completeSubtitle
    method_effective_path: POST /v1/voice-runtime-runs/{runId}/subtitle
    registered_permission: voice.task.execute
    state_transition_event: DepartmentTask:RUNNING→CANDIDATE_OUTPUT；EditingVoiceRuntime:SUBTITLE→VOICE_OUTPUT_READY | voice.subtitle.completed
    edit01_binding_exposure: EDIT-01-ACT-SUB-API-SYNC；完成後 Stage Evaluation→WAIT_CONFIRMATION。
  - port_uid: EDIT-01-PORT-VOICE-DECISION
    boundary_stage: Stage 03 Confirm
    registered_operation: decideOutputCandidate
    method_effective_path: POST /v1/tasks/{taskId}/outputs/{outputVersionId}/decision
    registered_permission: department.output.decide
    state_transition_event: DepartmentTask:CANDIDATE_OUTPUT→SCORE_PENDING | output.decision_recorded
    edit01_binding_exposure: EDIT-01-ACT-STAGE-CONFIRM；只在 Stage 03 Evaluation + Dialogue Sync PASS 後呼叫。
  - port_uid: EDIT-01-PORT-VOICE-SCORECARD
    boundary_stage: Stage 03 Score Persist
    registered_operation: submitScorecard
    method_effective_path: POST /v1/scorecards
    registered_permission: department.score.write
    state_transition_event: DepartmentTask:SCORE_PENDING→BLOCKED or HANDOFF_READY | scorecard.submitted
    edit01_binding_exposure: 持久化已確認的 Stage 03 Evaluation；PASS 後可進 FINALIZE，但不得提前 handoffVoiceToQA。
  - port_uid: EDIT-01-PORT-VOICE-QA-HANDOFF
    boundary_stage: Final Outbound
    registered_operation: handoffVoiceToQA
    method_effective_path: POST /v1/voice-runtime-runs/{runId}/qa-handoff
    registered_permission: voice.handoff.create
    state_transition_event: HANDOFF_READY→HANDED_OFF；dependent WAITING_DEPENDENCY→READY；EditingVoiceRuntime:VOICE_OUTPUT_READY→QA_READY | voice.qa_handoff.created
    edit01_binding_exposure: EDIT-01-ACT-HANDOFF 唯一 PROJECT_TASK final outbound；必須 Stage 04 Save→Render→Verify→Lock 完成。這是 EDIT+VOICE→QA backend
      boundary，不是 Editing→QA。
  integration_port_hard_guards:
  - rule_uid: EDIT-01-PORT-RULE-VOICE-PROFILE
    hard_guard: createEditingRuntimeRun 只消費 exact immutable LOCKED voice_runtime_profile_id。EDIT 不得呼叫 createVoiceRuntimeProfile、不得 overwrite/default/guess
      profile。
    block_recovery: 缺失或不合法 → VOICE_RUNTIME_PROFILE_REQUIRED + EDIT-01-ERR-VOICE-PROFILE-001；BLOCK Stage Execute，待合法 Profile 可解析後重試。
  - rule_uid: EDIT-01-PORT-RULE-NO-DIRECT-QA
    hard_guard: PROJECT_TASK 不存在 direct Editing→QA endpoint/control。最終 outbound 僅 handoffVoiceToQA。
    block_recovery: 任何 direct EDIT→QA request/control/route = BUILD_BLOCKED。
  - rule_uid: EDIT-01-PORT-RULE-NO-PAGE-SPLIT
    hard_guard: EDIT+VOICE internal stage transition 與 Voice Runtime operations 都在同一 EDIT-01 UI orchestration 中執行；service owner 可以不同，頁面不可因此跳到
      VOICE 或新增子頁。
    block_recovery: 若 AI 生成 VOICE navigation/second workspace = BLOCK_VISUAL/BOUNDARY CONTRACT。
  - rule_uid: EDIT-01-PORT-RULE-SPECIALIZED-RUNTIME
    hard_guard: PROJECT_TASK EDIT 不使用 generic requestTaskExecution 作為正式剪輯執行；必須 specialized createEditingRuntimeRun + completeAssembly。
    block_recovery: generic editing task execution = REJECT / 不 Render 對應控制。
  - rule_uid: EDIT-01-PORT-RULE-AUTH-GATES
    hard_guard: 所有 side-effect current registered authority operation 都必須重新驗證 identity + account permission/service capability + scope + condition
      + state_guard + expected_version + idempotency + audit；Role Name 授權禁止。
    block_recovery: 任何 Gate/Permission/Version/Idempotency 缺失 = backend BLOCK；前端 Disabled 不等於授權。
  - rule_uid: EDIT-01-PORT-RULE-EVIDENCE
    hard_guard: completeAssembly / handoff 必須使用 explicit evidence ref + deterministic manifest/checksum；不得自動生成或偽造 Evidence Ref，也不得把 human assembly
      偽裝 Provider Callback。
    block_recovery: Evidence/Checksum/Manifest 不可驗證 → BLOCK downstream；保留 last good state。
  - rule_uid: EDIT-01-PORT-RULE-TIMELINE-SCHEMA
    hard_guard: current registered authority 尚未提供完整 Track/Clip/Shot JSON internal schema 時，只驗證本文 typed IDs、scope、timecode/frame range、lineage/fingerprint；不得宣稱不存在的內部
      schema validator 已完成。
    block_recovery: 未知 internal schema 不得由 AI 自創；需保持最小影響範圍並 BLOCK 不可驗證 mutation。
  - rule_uid: EDIT-01-PORT-RULE-STANDALONE
    hard_guard: STANDALONE_UPLOAD 不存在 Project Task/Handoff lineage，不得呼叫上述 Department handoff/Voice task operations，也不得 fabricated project_id/task_id/run_id。
    block_recovery: Standalone 只走 owner-scoped upload/edit/API/render/export；若未正式轉成 governed Project Task，不得進五部門 Handoff。
  - rule_uid: EDIT-01-PORT-RULE-BOUNDARY-ONLY
    hard_guard: 本章只引用其他 owner 已存在的 current registered authority public operation contract；不在 EDIT 定義 VIDEO/VOICE/QA 資料表、worker、queue、service internals。
    block_recovery: 任何跨部門 internal implementation 出現在 EDIT authority = AUTHORITY_BOUNDARY_VIOLATION。
