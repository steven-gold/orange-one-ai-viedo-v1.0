artifact_type: V232_REALIGNMENT_EXECUTION_STEPS
mode: SUCCESSOR_REENTRY_STEPWISE_ONE_OPERATION_PER_INVOCATION
bulk_stage_materialization: FORBIDDEN
authorization_record_url: https://github.com/steven-gold/orange-one-ai-viedo-v1.0/issues/61
current_execution_admission: BLOCKED_PENDING_PRODUCT_SELECTED_GOVERNANCE_RELEASE
global_rules:
- NEVER_MUTATE_CLOSED_PREDECESSOR_WORK_UNIT
- NEVER_RESIGN_PREDECESSOR_MATRIX_IN_PLACE
- NEVER_REUSE_OLD_GOVERNANCE_PASS_AS_CURRENT_CREDIT
- ONE_EFFECTFUL_OPERATION_AT_A_TIME
- EACH_COMPLETED_PRODUCER_MUST_MATERIALIZE_AND_VALIDATE_OWNED_MATRIX_ROWS
steps:
- step_uid: REENTRY-STEP-00
  action: RESOLVE_PRODUCT_SELECTED_RELEASE
  required_artifacts:
  - PRODUCT_SELECTED_GOVERNANCE_RELEASE
  - GOVERNANCE_REVISION_TRANSITION_RECEIPT
  result_when_missing: BLOCKED
  product_completion_credit: 0
- step_uid: REENTRY-STEP-01
  stage_uid: STAGE-01
  action: CREATE_SUCCESSOR_REENTRY_WORK_UNIT
  predecessor_policy: IMMUTABLE_HISTORY_ONLY
  successor_uids:
  - WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001
  - WU-STAGE01-WB01-DASHBOARD-REENTRY-001
  entry_requires:
  - EXACT_SELECTED_RELEASE
  - PREDECESSOR_LINEAGE_BINDING
- step_uid: REENTRY-STEP-02
  stage_uid: STAGE-01
  action: FRESH_SOURCE_CONTENT_READINESS_AND_PROJECTION
  operations:
  - REAUDIT_SOURCE_DOCUMENT_CONTENT_WITH_GOVERNED_UNIT_UID
  - DERIVE_NONEMPTY_CANONICAL_SOURCE_PROJECTION_FROM_REGISTERED_IMMUTABLE_SOURCE
  - RECONCILE_WORD_YAML_ZERO_LOSS
  - FREEZE_NEW_SOURCE_PAIR
  forbidden:
  - PATCH_ZERO_BYTE_PREDECESSOR_PROJECTION_IN_PLACE
  - REUSE_STALE_PREDECESSOR_CONTENT_AUDIT_AS_CURRENT
- step_uid: REENTRY-STEP-03
  stage_uid: STAGE-01
  action: EXECUTE_CURRENT_STAGE01
  required_operation_uid: GOVERNED_UNIT_BASE_BLUEPRINT_COMPILE
  required_output_uid: GOVERNED_UNIT_BASE_BLUEPRINT
  operation_binding_required_fields:
  - applicability
  - executor_owner
  - executor_protocol
  - result_owner
  - operation_receipt_ref
  recursive_common_engine_executor: FORBIDDEN
- step_uid: REENTRY-STEP-04
  stage_uid: STAGE-02
  action: CREATE_AND_EXECUTE_SUCCESSOR_AFTER_STAGE01_PASS
  successor_uids:
  - WU-STAGE02-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001
  - WU-STAGE02-WB01-DASHBOARD-REENTRY-001
  required_operation_uid: GOVERNED_UNIT_CONSTRUCTION_SPEC_COMPILE
  required_output_uid: GOVERNED_UNIT_CONSTRUCTION_SPEC_PACKAGE
  s083a_disposition: NOT_APPLICABLE_WITH_AUTHORITY
  s083a_authority_ref: STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/s083a_scope_authority.yaml
- step_uid: REENTRY-STEP-05
  stage_uid: STAGE-03
  action: CREATE_AND_EXECUTE_SUCCESSOR_AFTER_STAGE02_PASS
  successor_uids:
  - WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001
  - WU-STAGE03-WB01-DASHBOARD-REENTRY-001
  s083a_disposition: NOT_APPLICABLE_WITH_AUTHORITY
  s083a_authority_ref: STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/s083a_scope_authority.yaml
  required_outputs:
  - VISUAL_DESIGN_SPEC_PACKAGE
  - VISUAL_GEOMETRY_CONTRACT
  - VISUAL_PREVIEW_EVIDENCE
  - VISUAL_CHANGESET
  - VISUAL_INTERACTION_TOPOLOGY_BINDING
  - FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT
  - VISUAL_REFERENCE_ANNOTATION
  - VISUAL_INHERITANCE_MATRIX
  - VISUAL_SCENARIO_EVIDENCE_SET
- step_uid: REENTRY-STEP-06
  stage_uid: STAGE-04
  action: CREATE_AND_EXECUTE_SUCCESSOR_AFTER_STAGE03_PASS
  successor_uids:
  - WU-STAGE04-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001
  - WU-STAGE04-WB01-DASHBOARD-REENTRY-001
  required_outputs:
  - BASIC_DESIGN_PACKAGE
  - BASIC_DESIGN_DOMAIN_STEPWISE_CHECKPOINT
  - ACCEPTANCE_AUDIT_BLUEPRINT
  - DESIGN_FREEZE_PACKAGE
  - FOUNDATION_BARRIER_RECORD
  checkpoint_contract:
    normative_section_uid: WEB-GOV-01-S083A
    artifact_type: BASIC_DESIGN_DOMAIN_STEPWISE_CHECKPOINT
    producer_operation_uid: BASIC_DESIGN_PACKAGE_COMPILE
    denominator_source: BASIC_DESIGN_PACKAGE.design_domains
    one_checkpoint_per_applicable_domain: true
    aggregate_summary_substitution: FORBIDDEN
    final_freeze_requires_all_domain_checkpoints_pass: true
- step_uid: REENTRY-STEP-07
  action: FRESH_STAGE_BY_STAGE_CLOSURE
  order:
  - STAGE-01
  - STAGE-02
  - STAGE-03
  - STAGE-04
  required_per_stage:
  - CURRENT_EXECUTION_SCOPE_MANIFEST
  - EXECUTION_STATE
  - NORMATIVE_EXECUTION_MATRIX
  - OPERATION_RECEIPTS
  - REQUIRED_EVIDENCE
  - SUCCESSOR_READINESS
  - TERMINAL_RECEIPT
  prior_stage_pass_reuse: FORBIDDEN
terminal_state_until_release_selected: BLOCKED_NOT_ADMITTED
