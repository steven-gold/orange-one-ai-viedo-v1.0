      母級基礎邏輯設計／規範性邏輯契約'
  - index: 12
    style: Heading 1
    text: 0. 文件使用方式與不可誤解原則
  - index: 13
    style: Normal
    text: 本文件是 ACPOS-AI-01 的唯一系統邏輯母級設計輸出，目的是讓不同 AI、不同工程師、不同後續施工代理讀到同一份規格時，導出同一套核心邏輯。文件以「規範語義」而非敘事描述為主：凡涉及正式執行、資料採用、版本、權限、跨頁關係、學習、外部資料與副作用，均必須可由規則決定，不得靠個人解讀。
  - index: 16
    style: Heading 1
    text: 1. Design Identity / 設計身份、目的與邊界
  - index: 18
    style: Heading 1
    text: 2. Authority / Source Basis / 權威與來源使用規則
  - index: 19
    style: Normal
    text: 本文件採三層來源：Current Mother Governance 定義治理方法；使用者確認的 ACPOS 系統邏輯移交內容定義此設計的產品意圖；既有 System Convergence Candidate 只作設計輸入與搜尋線索，除非後續被 Current Authority 正式採用，不得被描述成已實作
      Runtime。
  - index: 22
    style: Heading 1
    text: 3. ACPOS Global Brain / 全站智能大腦 11 層架構
  - index: 24
    style: ACPOS Caption
    text: FIG-01｜ACPOS Global Brain 11 層共用智能核心；Domain Page 以 Reference/Projection 參與，不建立第二套大腦。
  - index: 26
    style: Heading 1
    text: 4. Information Lifecycle / 資訊生命週期
  - index: 28
    style: ACPOS Caption
    text: FIG-02｜資訊從來源到採用、再到 Experience/Learning 的完整生命週期。
  - index: 29
    style: Normal
    text: 正式生命週期不是「取得資料 → 丟給 AI」。任何資訊必須先有 Source Identity、Scope、Rights/Classification、Freshness、Exact Version 或 immutable snapshot；進入 AI 前形成 ContextSnapshot；AI/Tool
      結果先成 Candidate；正式採用必須經 Domain/Governance owner；執行後的真實 Outcome 才能成 Experience。
  - index: 31
    style: Heading 1
    text: 5. Core Entity Inventory / 核心實體與唯一責任
  - index: 33
    style: Heading 2
    text: 5.1 Entity Hierarchy / Relationship Matrix
  - index: 35
    style: Heading 1
    text: 6. Business Entity × Operation Matrix / 實體 × 操作
  - index: 37
    style: Heading 1
    text: 7. T0–T7 Information Truth Model / 資訊真實性分級
  - index: 40
    style: Heading 1
    text: 8. Normative Invariant Registry / 規範性不變式登錄
  - index: 42
    style: Heading 1
    text: 9. Deterministic Truth Precedence / 確定性真實性裁決
  - index: 43
    style: Heading 2
    text: 9.1 Claim Class Owner First
  - index: 45
    style: Heading 2
    text: 9.2 T0–T7 Two-way Conflict Matrix
  - index: 46
    style: Normal
    text: 使用方式：先確認「既有 claim」與「新輸入 claim」指向相同 Canonical Claim Key（owner_scope + object_ref + property/claim_type + effective_version/time）。若不是同一 claim，兩者可並存；若是同一 claim，再套下表。
  - index: 49
    style: ACPOS Small
    text: '* 星號表示「如果 incoming tier 是該 Canonical Claim Class 的真正 owner，不能直接套 Keep；必須先重新做 Claim Owner Resolution」。例如 existing T1 決策與 incoming T0 operational result
      若其實是不同 claim class，兩者並存並建立 DECISION_EXECUTION_DIVERGENCE，而不是互相覆蓋。'
  - index: 50
    style: Heading 2
    text: 9.3 Deterministic Conflict Outcomes
  - index: 52
    style: Heading 1
    text: 10. Context Resolution Contract / Context 解析契約
  - index: 54
    style: ACPOS Caption
    text: FIG-03｜正式執行前的 13 步 Context Resolution。順序可以由 runtime 最佳化內部讀取，但語義 Gate 不得跳過。
  - index: 56
    style: Heading 1
    text: 11. Context Retrieval Decision Matrix / 提取決策矩陣
  - index: 59
    style: Heading 1
    text: 12. ACPOSContextPackage / ContextSnapshot 必填契約
  - index: 62
    style: Heading 1
    text: 13. Context Budget Algorithm / Context 預算與壓縮演算法
  - index: 63
    style: Normal
    text: Context Budget 必須是「不丟失治理語義」的資源分配，不是單純截字。Budget 可以包含 token、bytes、media count/size、retrieval calls、latency window；exact 數值由 implementation profile/Current
      Authority 綁定，本文件只定不可變的裁決順序。
  - index: 65
    style: Heading 2
    text: 13.1 Deterministic Budget Sequence
  - index: 66
    style: List Number
    text: 先計算 P0+P1 mandatory footprint，包含必要 media/attachment descriptors。
  - index: 67
    style: List Number
    text: 若 P0+P1 已超過 hard execution budget：BLOCK = CONTEXT_BUDGET_MANDATORY_OVERFLOW；不得靠刪除 constraint 取得 PASS。
  - index: 68
    style: List Number
    text: 對所有 refs 做 exact duplicate / semantic duplicate 檢查；同一 canonical source 只保留一次 payload，其他位置保留 reference。
  - index: 69
    style: List Number
    text: 依 P2→P7 順序加入；每層先 compact structure，再摘要 narrative，最後才 drop optional item。
  - index: 70
    style: List Number
    text: 摘要 MUST 保留 source_ref、exact_version/snapshot_hash、claim class、confidence/validation state、effective time。
  - index: 71
    style: List Number
    text: Media 超限：先降 representation（thumbnail/metadata/derived feature），不得替換 exact asset/source identity。
  - index: 72
    style: List Number
    text: Retrieval calls 超限：優先 required owner refs；optional external/semantic expansion 最先停止。
  - index: 73
    style: List Number
    text: 完成後重跑 Required-field validation + conflict scan + classification check。
  - index: 74
    style: List Number
    text: Freeze ContextSnapshot；任何後續新增/刪除都必須建立新 snapshot/fingerprint。
  - index: 75
    style: Heading 1
    text: 14. Semantic Conflict Engine / 語義衝突引擎
  - index: 77
    style: Heading 1
    text: 15. Impact Graph / 影響圖與 REVERIFY 規則
  - index: 80
    style: Heading 1
    text: 16. Context & Information State Machine / 狀態機
  - index: 82
    style: Heading 1
    text: 17. State Transition Guard Matrix / 狀態轉移守衛
  - index: 84
    style: Heading 1
    text: 18. ACPOSIntegrationEvent / Event & Consumer Contract
  - index: 86
    style: Heading 2
    text: 18.1 Delivery Semantics
  - index: 87
    style: List Bullet
    text: Canonical semantic = AT_LEAST_ONCE_DELIVERY + IDEMPOTENT_CONSUMER，除非 implementation authority 明確提供更強語義；不得假設 exactly-once。
  - index: 88
    style: List Bullet
    text: Producer MUST emit event only after/with governed mutation persistence according to the selected transaction/outbox pattern; exact mechanism REQUIRE_EXACT_BINDING。
  - index: 89
    style: List Bullet
    text: Consumer MUST dereference Current source owner for authoritative state when the operation requires Current truth；不得只相信 event copied payload。
  - index: 90
    style: List Bullet
    text: Duplicate event_id/idempotency_key → ACK/return prior processing result，MUST_NOT duplicate effect。
  - index: 91
    style: List Bullet
    text: Out-of-order event → compare aggregate_version/exact_version；stale event MUST_NOT roll back Current state。
  - index: 92
    style: List Bullet
    text: Poison/non-retryable event → quarantine/dead-letter equivalent + audit + operator/review path；exact queue technology REQUIRE_EXACT_BINDING。
  - index: 93
    style: Heading 1
    text: 19. Concurrency / Version Conflict Contract / 並行與版本衝突
  - index: 95
    style: Heading 1
    text: 20. Idempotency Contract / 冪等契約
  - index: 96
    style: Normal
    text: Idempotency 是副作用治理，不只是 HTTP 重送技巧。每個 effectful operation 必須明確定義「同一意圖」的 dedupe scope；exact storage/table/TTL 由 Current implementation authority 綁定。
  - index: 98
    style: Heading 1
    text: 21. Retry / Backoff / Fallback / Circuit Rules
  - index: 100
    style: Heading 2
    text: 21.1 Circuit Breaker State Semantics
  - index: 102
    style: ACPOS Small
    text: Exact thresholds、max attempts、base/max delay、jitter formula、cooldown 與 health window 均屬 implementation/policy binding；本文件禁止虛構數字，標記 REQUIRE_EXACT_BINDING。
  - index: 103
    style: Heading 1
    text: 22. Shared External Data Acquisition / 共用外部資料取得
  - index: 104
    style: Normal
    text: 外部資料取得是 BRAIN-11 的共享基礎設施契約。Page/Domain 只宣告 AcquisitionIntent；crawl/search/fetch/rss/api/document 的執行、rights/robots/rate、snapshot、dedupe、retry、audit 由共用
      runtime 負責。
  - index: 107
    style: Heading 1
    text: 23. Experience / Learning / Evolution Contract
  - index: 109
    style: ACPOS Caption
    text: FIG-04｜ACPOS 只從真實執行與 Outcome 建立 Experience；Learning Candidate 必須經治理採用。
  - index: 110
    style: Heading 2
    text: 23.1 Experience Admission
  - index: 112
    style: Heading 2
    text: 23.2 Learning Candidate Admission
  - index: 114
    style: Heading 1
    text: 24. Retention / Archive / Delete Contract / 保存、封存、刪除
  - index: 116
    style: Heading 2
    text: 24.1 Delete Decision Sequence
  - index: 117
    style: List Number
    text: Resolve canonical owner and artifact classification.
  - index: 118
    style: List Number
    text: Check forward references.
  - index: 119
    style: List Number
    text: Check reverse references / dependency graph.
  - index: 120
    style: List Number
    text: Check active Runtime/Workflow reachability.
  - index: 121
    style: List Number
    text: Check audit/regression/historical-retention role.
  - index: 122
    style: List Number
    text: Check privacy/rights/legal hold.
  - index: 123
    style: List Number
    text: If any REQUIRED reference remains → BLOCK hard delete；archive/tombstone may be allowed by owner policy.
  - index: 124
    style: List Number
    text: Persist deletion disposition + evidence + successor/tombstone reference when applicable.
  - index: 125
    style: List Number
    text: Revalidate search/index/projection consumers so deleted artifact cannot appear as Current.
  - index: 126
    style: Heading 1
    text: 25. Permission / Security / Classification Contract
  - index: 128
