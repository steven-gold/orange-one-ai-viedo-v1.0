name: VIS-16 SG02 validation
on:
  push:
    branches: [acpos-vis16-staging]
    paths: [.github/workflows/vis16-sg02-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis16-staging
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start production server
        run: |
          (npm start -- -p 3000 > /tmp/vis16-server.log 2>&1 & echo $! > /tmp/vis16-server.pid)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/admin/qa-criteria >/dev/null && exit 0; sleep 1; done
          cat /tmp/vis16-server.log
          exit 1
      - name: Chromium validation
        run: |
          cat > vis16-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            let business=0;
            const p=await b.newPage({viewport:{width:1440,height:900}});
            p.on('request',r=>{if(['xhr','fetch'].includes(r.resourceType()))business++});
            await p.goto('http://127.0.0.1:3000/admin/qa-criteria',{waitUntil:'networkidle'});
            const root=p.locator('[data-page-uid="admin:SG-02"]');
            assert(await root.count()===1,'page uid');
            assert(Number(await root.getAttribute('data-authority-section-count'))===9,'authority section count');
            assert(Number(await root.getAttribute('data-authority-control-count'))===11,'authority control count');
            assert(await p.locator('[data-section-id]').count()===9,'rendered sections');
            assert(await p.locator('[data-control-id]').count()===11,'rendered controls');
            assert(await p.locator('.global-sidebar [data-nav-id]').count()===9,'admin nav count');
            assert(await p.locator('[aria-current="page"]').getAttribute('data-nav-id')==='ADMIN-NAV-07','active nav');
            assert(await p.locator('a[href="/admin/qa-criteria"][data-nav-id="ADMIN-NAV-07"]').count()===1,'route binding');
            const ids=await p.locator('[data-control-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-control-id')));
            assert(ids.length===11 && new Set(ids).size===11,'control identity uniqueness');
            assert(!ids.some(id=>/SEARCH|FILTER|EXPORT/i.test(id||'')),'unregistered search/filter/export control');
            assert(await p.locator('[data-control-id="CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE"]').isDisabled(),'configure enabled in visual phase');
            assert(await p.locator('[data-control-id="CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE"]').isDisabled(),'approve enabled in visual phase');
            assert(!(await p.locator('[data-control-id="CTRL-ADMIN-SG-02-ACT-03-ACT-NAV-OPEN"]').isDisabled()),'nav open disabled');
            const sectionControls=[
              'CTRL-ADMIN-SG-02-CRITERIA-TABLE-OPEN','CTRL-ADMIN-SG-02-DIMENSION-LIBRARY-OPEN','CTRL-ADMIN-SG-02-THRESHOLDS-OPEN','CTRL-ADMIN-SG-02-DEPARTMENT-MAPPING-OPEN','CTRL-ADMIN-SG-02-REQUIRED-CHECKS-OPEN','CTRL-ADMIN-SG-02-GATE-POLICY-OPEN','CTRL-ADMIN-SG-02-APPROVAL-OPEN','CTRL-ADMIN-SG-02-IMPACT-OPEN'
            ];
            for(const id of sectionControls){
              await p.locator(`[data-control-id="${id}"]`).click();
              assert(await p.locator('[data-detail-drawer="SG-02"]').count()===1,'drawer missing '+id);
              await p.locator('button[aria-label="Close"]').click();
            }
            await p.locator('[data-control-id="CTRL-ADMIN-SG-02-ACT-03-ACT-NAV-OPEN"]').click();
            const drawerWidth=await p.locator('[data-detail-drawer="SG-02"]').evaluate(el=>Math.round(el.getBoundingClientRect().width));
            assert(drawerWidth>=480&&drawerWidth<=560,'drawer width '+drawerWidth);
            await p.locator('button[aria-label="Close"]').click();
            assert((await p.locator('text=目前沒有可顯示的真實 Criteria 資料').count())===1,'truthful empty state missing');
            const g=await p.evaluate(()=>{const w=document.querySelector('.workspace-slot');const ctx=document.querySelector('[data-page-uid="admin:SG-02"] > section');return {x:Math.round(w.getBoundingClientRect().x),client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid="admin:SG-02"]').scrollWidth,contextHeight:Math.round(ctx.getBoundingClientRect().height)}});
            assert(g.x===78 && g.client===g.scroll && g.contextHeight===56,'1440 geometry '+JSON.stringify(g));
            await p.locator('.global-sidebar').hover(); await p.waitForTimeout(180);
            const ex=await p.evaluate(()=>({x:Math.round(document.querySelector('.workspace-slot').getBoundingClientRect().x),side:Math.round(document.querySelector('.global-sidebar').getBoundingClientRect().width)}));
            assert(ex.x===78 && ex.side===221,'sidebar overlay '+JSON.stringify(ex));
            await p.screenshot({path:'vis16-1440-expanded.png',fullPage:false});
            for(const locale of ['zh-CN','en','zh-TW']){
              await p.locator('button[aria-label="Language"],button[aria-label="語言"],button[aria-label="语言"]').first().click();
              await p.locator('[role="option"]').filter({hasText:locale}).first().click();
            }
            await p.screenshot({path:'vis16-1440-main.png',fullPage:false});
            const p1600=await b.newPage({viewport:{width:1600,height:900}});await p1600.goto('http://127.0.0.1:3000/admin/qa-criteria',{waitUntil:'networkidle'});const g16=await p1600.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});assert(g16.client===g16.scroll,'1600 overflow '+JSON.stringify(g16));await p1600.screenshot({path:'vis16-1600.png'});
            const p1200=await b.newPage({viewport:{width:1200,height:900}});await p1200.goto('http://127.0.0.1:3000/admin/qa-criteria',{waitUntil:'networkidle'});const g12=await p1200.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});assert(g12.scroll>=1280&&g12.page>=1280&&g12.scroll>g12.client,'1200 expected scroll '+JSON.stringify(g12));await p1200.screenshot({path:'vis16-1200-minwidth.png'});
            assert(business===0,'business xhr '+business);
            fs.mkdirSync('docs/construction/evidence/VIS-16',{recursive:true});
            fs.writeFileSync('docs/construction/evidence/VIS-16/vis16-validation.json',JSON.stringify({route:'/admin/qa-criteria',pageUid:'admin:SG-02',authoritySections:9,authorityControls:11,renderedSections:9,renderedControls:11,sectionDrawerControls:8,configureDisabled:true,approveDisabled:true,unregisteredSearchFilterExport:false,hardcodedThreshold:false,sampleCriteriaData:false,drawerWidth,adminL1:9,activeNav:'ADMIN-NAV-07',workspace1440:g,sidebarExpanded:ex,viewport1600:g16,viewport1200:g12,localeSequence:['zh-TW','zh-CN','en','zh-TW'],businessRequests:business},null,2));
            for(const f of fs.readdirSync('.').filter(x=>x.startsWith('vis16-')&&x.endsWith('.png')))fs.renameSync(f,'docs/construction/evidence/VIS-16/'+f);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node vis16-check.cjs
      - name: Update truthful construction progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s=p.read_text()
          s=s.replace('current_task: VIS-16_ADMIN_SG-02_VISUAL_POSITIONING','current_task: VIS-17_ADMIN_STR-01_VISUAL_POSITIONING')
          s=s.replace('last_completed_task: VIS-15_ADMIN_AIAPI-01_VISUAL_POSITIONING','last_completed_task: VIS-16_ADMIN_SG-02_VISUAL_POSITIONING')
          s=s.replace('navigation_revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01-DEV01-SOC01-ERP01-AIAPI01','navigation_revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01-DEV01-SOC01-ERP01-AIAPI01-SG02')
          s=s.replace('  - id: VIS-16\n    group: ADMIN\n    page_uid: admin:SG-02\n    name: QA 評分項目\n    status: NOT_STARTED',f'''  - id: VIS-16\n    group: ADMIN\n    page_uid: admin:SG-02\n    name: QA 評分項目\n    status: COMPLETE\n    evidence:\n      final_validation_run_id: {os.environ['GITHUB_RUN_ID']}\n      evidence_directory: docs/construction/evidence/VIS-16\n      typecheck: PASS\n      next_build: PASS\n      production_server: PASS\n      chromium_render_and_geometry: PASS\n      locale_switch_runtime: PASS\n      business_requests_during_validation: 0\n      expected_controls: 11\n      unregistered_search_filter_export: false''')
          s=s.replace('  visual_steps_complete: 16','  visual_steps_complete: 17')
          old='  truthful_progress_note: VIS-00 through VIS-15 visual positioning are implemented and verified. VIS-15 implements the single current admin:AIAPI-01 at /admin/aiapi with four same-page views, a 10-column Provider/Model registry projection, and the fixed 15-field API professional description panel. Current control/permission/navigation remap and effectful runtime remain explicitly NOT_EXECUTED as required by authority. Historical evidence is not rewritten. VIS-16 SG-02 is next and has not started. Page business/runtime logic remains blocked until VIS-00 through VIS-18 are complete.'
          new='  truthful_progress_note: VIS-00 through VIS-16 visual positioning are implemented and verified. VIS-16 implements admin:SG-02 at /admin/qa-criteria as the QA review-standard governance page, with 9 sections, exactly 11 registered controls, registered SECTION_OPEN drawers, and no invented Search/Filter/Export or hardcoded threshold/sample criteria data. Configure/Approve runtime remains disabled in visual phase. Historical evidence is not rewritten. VIS-17 STR-01 is next and has not started. Page business/runtime logic remains blocked until VIS-00 through VIS-18 are complete.'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit evidence progress and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/evidence/VIS-16 docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "test(vis16): add SG-02 validation evidence and progress"
          git rm .github/workflows/vis16-sg02-validation.yml
          git commit -m "chore(vis16): remove SG-02 validation workflow"
          git push origin HEAD:acpos-vis16-staging
