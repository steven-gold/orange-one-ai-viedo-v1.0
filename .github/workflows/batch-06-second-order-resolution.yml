name: ACPOS Batch 06 Second Order Canonical Resolution

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-06-second-order-resolution
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Verify no Word drift since Batch 05
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="22761e902112a39fdf0853022e56704c725b1ad8"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-05")
          PY

      - name: Preflight script syntax
        run: python -m py_compile __temp/batch_06_second_order_resolution.py

      - name: Baseline DOCX encoding audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,json
          files=[
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};report={}
          for fn in files:
              with zipfile.ZipFile(fn) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  errs=[]
                  for n in xmls:
                      try:ET.fromstring(z.read(n))
                      except Exception as e:errs.append((n,str(e)))
                  assert not errs,(fn,errs)
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  text="".join((e.text or "") for e in root.iter(ns+"t"))
              assert "\x00" not in text,(fn,"NUL")
              ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
              assert not ctrl[:20],(fn,"CONTROL",ctrl[:20])
              hits=[x for x in bad if x in text]
              assert not hits,(fn,"MOJIBAKE",hits)
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,"NFC_REPLACEMENT")
              report[fn]={"xml_parts":len(xmls),"chars":len(text),"status":"PASS"}
          Path("__batch06_baseline_encoding.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-06 BASELINE ENCODING",json.dumps(report,ensure_ascii=False))
          PY

      - name: Apply Batch 06 resolution
        run: python __temp/batch_06_second_order_resolution.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch06_resolution_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["pre"]=={"definition_gaps":312,"resolvable":1,"unresolved":310,"conflict":1},m["pre"]
          assert m["post"]=={"definition_gaps":311,"resolvable":0,"unresolved":310,"conflict":1},m["post"]
          assert len(r["queue"])==310,len(r["queue"])
          d=Document("ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx")
          txt="\n".join([c.text for t in d.tables for row in t.rows for c in row.cells])
          assert "SYS-01-BTN-NAV-OPEN" in txt and "Projection / source page read owner" in txt
          s=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          st="\n".join([p.text for p in s.paragraphs]+[c.text for t in s.tables for row in t.rows for c in row.cells])
          for token in [
            "ACPOS-20260921-BATCH-06-SECOND-ORDER-CANONICAL-RESOLUTION-V1",
            "310-row Canonical Resolution Queue",
            "BATCH06_MACHINE_JSON=",
            "PRESERVED_UNRESOLVED"
          ]: assert token in st,token
          print("PASS: BATCH-06 SEMANTIC; SECOND-ORDER 1/1; POST GAP 311; QUEUE 310")
          PY

      - name: Convert DOCX to PDF
        shell: bash
        run: |
          mkdir -p __render_qa_batch06/pdf
          for f in           "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          do
            libreoffice --headless --convert-to pdf --outdir __render_qa_batch06/pdf "$f"
          done

      - name: Post-conversion encoding and garble audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          files=[
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13}
          cjk_re=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          report={}
          for fn in files:
              docx=Path(fn);pdf=Path("__render_qa_batch06/pdf")/(docx.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(docx) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  errs=[]
                  for n in xmls:
                      try:ET.fromstring(z.read(n))
                      except Exception as e:errs.append((n,str(e)))
                  assert not errs,(fn,errs)
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in root.iter(ns+"t"))
              pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              for label,text in [("DOCX",src),("PDF",pdftext)]:
                  assert "\x00" not in text,(fn,label,"NUL")
                  ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
                  assert not ctrl[:20],(fn,label,"CONTROL",ctrl[:20])
                  hits=[x for x in bad if x in text]
                  assert not hits,(fn,label,"MOJIBAKE",hits)
                  assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,label,"NFC_REPLACEMENT")
              sc=len(cjk_re.findall(src));pc=len(cjk_re.findall(pdftext));assert sc>0
              ratio=pc/sc;assert ratio>=0.97,(fn,"CJK_RETENTION",sc,pc,ratio)
              report[fn]={"xml_parts":len(xmls),"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch06/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-06 ENCODING/GARBLE INTEGRITY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Render PNGs geometry and contact sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,math
          from PIL import Image,ImageChops,ImageOps,ImageDraw
          files=[
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          qa=Path("__render_qa_batch06");pdfdir=qa/"pdf";pngroot=qa/"png";contact=qa/"contact"
          pngroot.mkdir(parents=True,exist_ok=True);contact.mkdir(parents=True,exist_ok=True)
          report={}
          for fn in files:
              p=Path(fn);pf=pdfdir/(p.stem+".pdf")
              info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
              pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
              od=pngroot/p.stem;od.mkdir(parents=True,exist_ok=True)
              subprocess.run(["pdftoppm","-png","-r","140",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob("page-*.png"));assert len(imgs)==pages,(fn,pages,len(imgs))
              blank=[];edge=[]
              thumbs=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert("RGB")
                  diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
                  bb=diff.getbbox()
                  if bb is None:blank.append(i)
                  else:
                      l,t,r,b=bb
                      if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
                  th=im.copy();th.thumbnail((420,594))
                  canvas=Image.new("RGB",(440,630),"white");canvas.paste(th,((440-th.width)//2,10))
                  ImageDraw.Draw(canvas).text((10,610),f"page {i}",fill="black")
                  thumbs.append(canvas)
              assert not blank,(fn,"BLANK",blank)
              assert not edge,(fn,"EDGE",edge)
              cols=4;rows=math.ceil(len(thumbs)/cols)
              sheet=Image.new("RGB",(cols*440,rows*630),"white")
              for i,th in enumerate(thumbs):sheet.paste(th,((i%cols)*440,(i//cols)*630))
              sheet.save(contact/(p.stem+".jpg"),quality=88)
              report[fn]={"pages":pages,"blank":blank,"edge":edge}
          Path("__render_qa_batch06/geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-06 RENDER/GEOMETRY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Verify exact Batch 06 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          }
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-06 CHANGE SCOPE EXACT 2 WORD")
          PY

      - name: Collect evidence
        shell: bash
        run: |
          cp __batch06_resolution_report.json __render_qa_batch06/
          cp __batch06_baseline_encoding.json __render_qa_batch06/

      - name: Upload Batch 06 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-06-second-order-resolution-evidence
          path: __render_qa_batch06
          retention-days: 1

      - name: Commit Batch 06 and remove temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch06 __temp/__pycache__ __batch06_resolution_report.json __batch06_baseline_encoding.json
          git rm __temp/batch_06_second_order_resolution.py .github/workflows/batch-06-second-order-resolution.yml
          git config user.name "acpos-word-batch-06"
          git config user.email "actions@users.noreply.github.com"
          git add           "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git commit -m "docs(acpos): close second-order binding and classify 310 gaps"
          git push
