directive_summary: >-
  Harden Basic Design so completeness means atomic, executable-detail materialization rather than
  page count, summary prose, coverage labels, or representative samples. Every applicable denominator
  must be enumerated and materialized row-by-row with exact identity, ownership, inputs, outputs,
  state/gate/permission/visual/next-step/recovery/acceptance bindings as applicable. Summary-only
  substitution is forbidden, missing rows block freeze, and human-readable and machine-readable
  deliverables must reconcile to the same denominator without silently dropping detail.
