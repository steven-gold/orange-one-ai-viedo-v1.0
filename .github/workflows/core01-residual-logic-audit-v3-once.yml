name: CORE01 Residual Logic Audit V3 Once
on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/core01-residual-logic-audit-v3-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - name: Locked authority and workflow hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(grep -c '^  - control_uid: CORE-01-' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml)" = "50"
          test "$(grep -c '^  - action_uid: CORE-01-ACT-' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml)" = "34"
          EXTRA="$(find .github/workflows -maxdepth 1 -type f -name '*-once.yml' ! -name 'core01-residual-logic-audit-v3-once.yml' -print 2>/dev/null || true)"
          test -z "$EXTRA" || { echo STALE_ONCE_WORKFLOW; echo "$EXTRA"; exit 1; }
          ! grep -q 'assetPrefix' next.config.ts
          echo LOCK_AND_HYGIENE_PASS

      - name: Compile regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build
          echo COMPILE_REGRESSION_PASS

      - name: Exact CORE residual audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, sys

          files = [Path('src/app/core/page.tsx'), Path('src/components/pages/CoreVisual.tsx'),
                   *sorted(Path('src/domain/core').glob('*.ts')), *sorted(Path('src/server/core').glob('*.ts')),
                   Path('src/server/shared/uiProjectionRuntime.ts'),
                   Path('src/app/v1/ui-projections/[pageUid]/route.ts'),
                   Path('src/app/v1/projects/drafts/route.ts'), Path('src/app/v1/projects/drafts/[id]/validate/route.ts'),
                   Path('src/app/v1/projects/drafts/[id]/confirm/route.ts'), Path('src/app/v1/projects/[projectId]/story-candidate-sets/route.ts'),
                   Path('src/app/v1/projects/[projectId]/conversations/route.ts'), Path('src/app/v1/conversations/[conversationId]/messages/route.ts'),
                   Path('src/app/v1/candidates/route.ts'), Path('src/app/v1/candidates/compare/route.ts'), Path('src/app/v1/candidates/[id]/decision/route.ts'),
                   Path('src/app/v1/state-commands/dnaversion/requestdnalock/route.ts'), Path('src/app/v1/state-commands/projectversion/submitcorereview/route.ts'),
                   Path('src/app/v1/locks/mother-requests/route.ts'), Path('src/app/v1/projects/[projectId]/topics/route.ts'),
                   Path('src/app/v1/topics/[id]/blueprints/route.ts'), Path('src/app/v1/blueprints/[id]/validate/route.ts'),
                   Path('src/app/v1/blueprints/[id]/approve/route.ts'), Path('src/app/v1/locks/child-requests/route.ts'),
                   Path('src/app/v1/topics/[id]/scripts/canonical/route.ts')]
          findings=[]
          for p in files:
              if not p.exists(): findings.append((str(p),0,'MISSING_FILE','')); continue
              s=p.read_text(encoding='utf-8')
              patterns={
                'TODO_FIXME_HACK':r'\b(?:TODO|FIXME|HACK|XXX)\b',
                'STUB_NOOP':r'\b(?:STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME)\b',
                'PLACEHOLDER_MARKER':r'\bPLACEHOLDER\b',
                'TS_SUPPRESSION':r'@ts-(?:ignore|nocheck|expect-error)',
                'DEBUGGER':r'\bdebugger\s*;',
                'CONSOLE_DEBUG':r'console\.(?:log|debug)\s*\('
              }
              for name,pat in patterns.items():
                  for m in re.finditer(pat,s,re.I if name in {'TODO_FIXME_HACK','STUB_NOOP'} else 0):
                      findings.append((str(p),s.count('\n',0,m.start())+1,name,m.group(0)))

          allsrc=[]
          srcfiles=[]
          for p in Path('src').rglob('*'):
              if p.is_file() and p.suffix in {'.ts','.tsx','.js','.jsx','.css'}:
                  srcfiles.append(p); allsrc.append(p.read_text(encoding='utf-8',errors='ignore'))
          joined='\n'.join(allsrc)
          for tok in ['wb01-preview-runtime','acpos-preview-drawer','rawcdn.githack','raw.githack','preview/_next/']:
              if tok in joined: findings.append(('src/**',0,'PREVIEW_HACK',tok))
          for tok in ['ATTACHMENT_SELECTOR_NOT_BOUND','REFERENCE_SELECTOR_NOT_BOUND','CANDIDATE_COMPARE_NOT_BOUND','CORE_SELECTOR_NOT_BOUND','FORM_ADAPTER_NOT_BOUND']:
              if tok in joined: findings.append(('src/**',0,'OBSOLETE_BLOCKER',tok))

          cv=Path('src/components/pages/CoreVisual.tsx').read_text(encoding='utf-8')
          if 'resolveCoreProjection(rawProjection)' not in cv: findings.append(('CoreVisual.tsx',0,'RESOLVER_MISSING',''))
          for pat in [r'rawProjection\s*\[',r'rawProjection\.[A-Za-z_]',r'asRecord\s*\(\s*rawProjection\s*\)']:
              if re.search(pat,cv): findings.append(('CoreVisual.tsx',0,'RAW_PROJECTION_GUESS',pat))

          cp=Path('src/domain/core/coreClientPort.ts').read_text(encoding='utf-8')
          if '"x-core-action-uid": input.action_uid' not in cp: findings.append(('coreClientPort.ts',0,'CLIENT_HEADER_MISMATCH','x-core-action-uid'))
          route_checks={
            'src/app/v1/conversations/[conversationId]/messages/route.ts':['x-core-action-uid','CORE-01-ACT-SEND','CORE-01-ACT-MSG-ANALYZE','createCorePostRoute','conversationPost'],
            'src/app/v1/candidates/compare/route.ts':['x-core-action-uid','CORE-01-ACT-CANDIDATE-COMPARE','createCoreGetRoute','compareCandidates'],
            'src/app/v1/candidates/[id]/decision/route.ts':['x-core-action-uid','CORE-01-ACT-CANDIDATE-ACCEPT','CORE-01-ACT-CANDIDATE-RETURN','createCorePostRoute','decideCandidate']}
          for path,toks in route_checks.items():
              s=Path(path).read_text(encoding='utf-8')
              for tok in toks:
                  if tok not in s: findings.append((path,0,'SHARED_DISPATCH_MISSING',tok))

          rt=Path('src/server/core/coreRuntime.ts').read_text(encoding='utf-8')
          tr=Path('src/server/testing/controlledCoreTestRuntime.ts').read_text(encoding='utf-8')
          td=Path('src/domain/testing/controlledTestData.ts').read_text(encoding='utf-8')
          for path,tok,s in [('coreRuntime.ts','isControlledCoreServerTestMode()',rt),('controlledCoreTestRuntime.ts','process.env.ACPOS_RUNTIME_MODE !== "PRODUCTION"',tr),('controlledTestData.ts','production_eligible: false',td),('controlledCoreTestRuntime.ts','final_lock_granted: false',tr),('controlledCoreTestRuntime.ts','SIMULATED_EXTERNAL',tr)]:
              if tok not in s: findings.append((path,0,'TEST_GOVERNANCE_MISSING',tok))

          contract=Path('src/domain/core/coreRuntimeContract.ts').read_text(encoding='utf-8')
          ab=contract.split('export const CORE_PORT_UIDS')[0]
          pb=contract.split('export const CORE_PORT_UIDS')[1].split('export type CorePortUid')[0]
          acts=re.findall(r'"(CORE-01-ACT-[A-Z0-9-]+)"',ab); ports=re.findall(r'"(CORE-01-PORT-[A-Z0-9-]+)"',pb)
          if (len(acts),len(set(acts)))!=(34,34): findings.append(('coreRuntimeContract.ts',0,'ACTION_COUNT_OR_DUP',f'{len(acts)}/{len(set(acts))}'))
          if (len(ports),len(set(ports)))!=(19,19): findings.append(('coreRuntimeContract.ts',0,'PORT_COUNT_OR_DUP',f'{len(ports)}/{len(set(ports))}'))

          tsall='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx'})
          for p in sorted(Path('src/domain/core').glob('*.ts')):
              mod='@/domain/core/'+p.stem
              if mod not in tsall: findings.append((str(p),0,'ORPHAN_CORE_MODULE',mod))

          allowed=('src/server/testing/','src/domain/testing/','src/server/core/coreRuntime.ts','src/components/pages/CoreVisual.tsx')
          for p in Path('src').rglob('*'):
              if not p.is_file() or p.suffix not in {'.ts','.tsx'}: continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if ('TEST-CORE-' in s or 'SIMULATED_EXTERNAL' in s) and not str(p).startswith(allowed):
                  findings.append((str(p),0,'TEST_MARKER_OUTSIDE_BOUNDARY',''))

          if findings:
              print('CORE_RESIDUAL_V3_FAIL')
              for f in findings: print(' | '.join(map(str,f)))
              sys.exit(1)
          print(f'CORE_RESIDUAL_V3_PASS files={len(files)} actions={len(set(acts))} ports={len(set(ports))}')
          PY

      - name: Repository-wide residue inventory
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'ATTACHMENT_SELECTOR_NOT_BOUND|REFERENCE_SELECTOR_NOT_BOUND|CANDIDATE_COMPARE_NOT_BOUND|CORE_SELECTOR_NOT_BOUND|FORM_ADAPTER_NOT_BOUND|wb01-preview-runtime|acpos-preview-drawer' -- src; then exit 1; fi
          echo HEADER_AWARE_SHARED_FALLBACKS
          git grep -n -E 'conversationPost\(|compareCandidates\(|decideCandidate\(' -- 'src/app/v1/**' || true
          echo CONTROLLED_TEST_MARKERS
          git grep -n -E 'SIMULATED_EXTERNAL|TEST-CORE-|production_eligible|final_lock_granted' -- src/server/testing src/domain/testing src/server/core src/components/pages/CoreVisual.tsx || true
          echo CONSTRUCTION_DIFF_FILES
          git diff --name-only 1e30abd4f4431957a4fe9b6b26a03adea138ebe9..HEAD
          echo REPOSITORY_RESIDUE_INVENTORY_PASS

      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          git rm -f .github/workflows/core01-residual-logic-audit-v3-once.yml
          git commit -m "chore: remove CORE01 residual logic audit v3 workflow"
          git push origin new
