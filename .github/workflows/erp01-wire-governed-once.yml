name: ERP01 governed wiring
on:
  push:
    paths:
      - '.github/workflows/erp01-wire-governed-once.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize authority control bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          src=Path('authority/pages/admin/ERP-01/ACPOS_ERP-01_ERP_FINANCE_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          block=src.split('\n  controls:\n',1)[1]
          rows=[];cur=None
          for line in block.splitlines():
              m=re.match(r'  - control_uid:\s*(\S+)',line)
              if m:
                  if cur: rows.append(cur)
                  cur={'control_uid':m.group(1)};continue
              if cur:
                  m=re.match(r'    (action_uid|gate_uid|permission_uid):\s*(\S+)',line)
                  if m:cur[m.group(1)]=m.group(2)
              if rows and len(rows)>=39 and line.startswith('derived_validation:'):break
          if cur and (not rows or rows[-1] is not cur):rows.append(cur)
          rows=rows[:39]
          if len(rows)!=39:raise SystemExit(f'expected 39 ERP controls got {len(rows)}')
          for r in rows:
              for k in ('action_uid','gate_uid','permission_uid'):
                  if k not in r:raise SystemExit(f'missing {k} for {r}')
              r['effect_type']='UI_CONTEXT_STATE' if r['control_uid'] in {'ERP-01-BTN-TAB-FINANCE','ERP-01-BTN-TAB-CONNECTOR','ERP-01-BTN-TAB-SYNC'} else 'REGISTERED_OR_READ'
          out='export type ErpControlBinding={action_uid:string;gate_uid:string;permission_uid:string;effect_type:"UI_CONTEXT_STATE"|"REGISTERED_OR_READ"};\n'
          out+='export const ERP_CONTROL_BINDINGS='+json.dumps({r['control_uid']:{k:r[k] for k in ('action_uid','gate_uid','permission_uid','effect_type')} for r in rows},separators=(',',':'))+' as const satisfies Record<string,ErpControlBinding>;\n'
          out+='export type ErpControlUid=keyof typeof ERP_CONTROL_BINDINGS;\nexport const ERP_CONTROL_BINDING_COUNT=Object.keys(ERP_CONTROL_BINDINGS).length;\n'
          Path('src/domain/erp/erpControlBindings.ts').write_text(out)
          PY
      - name: Wire existing ERP visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/ErpVisual.tsx');s=p.read_text()
          anchor='import { erpControlLabel, erpText } from "@/i18n/erpCatalog";\n'
          ins='import { ErpGovernedButton, ErpRuntimeProvider, ErpValue, useErpRuntimeState } from "./ErpControlRuntime";\n'
          if ins not in s:s=s.replace(anchor,anchor+ins,1)
          s=s.replace('export function ErpVisual() {','function ErpVisualBody() {',1)
          hook='''  const { locale } = useI18n();\n  const [activeView, setActiveView] = useState<ViewKey>("finance");'''
          newhook='''  const { locale } = useI18n();\n  const { projection, runtimeError } = useErpRuntimeState();\n  const [activeView, setActiveView] = useState<ViewKey>("finance");'''
          if hook not in s:raise SystemExit('ERP hook anchor missing')
          s=s.replace(hook,newhook,1)
          s=s.replace('data-page-state="VISUAL_ONLY_NO_BUSINESS_DATA"','data-page-state={projection?.page_state??"READ_ONLY"}',1)
          s=s.replace('{CONTEXT.map((id) => <div key={id} className={styles.contextCell} data-control-id={id}><span>{label(id)}</span><strong>—</strong></div>)}','{CONTEXT.map((id) => <div key={id} className={styles.contextCell} data-control-id={id}><span>{label(id)}</span><strong><ErpValue controlId={id}/></strong></div>)}',1)
          old='{VIEWS.map((item) => <button key={item.key} type="button" className={`${styles.viewButton} ${activeView === item.key ? styles.viewActive : ""}`} data-control-id={item.tabId} aria-pressed={activeView === item.key} onClick={() => setActiveView(item.key)}>{label(item.tabId)}</button>)}'
          new='{VIEWS.map((item) => <ErpGovernedButton key={item.key} className={`${styles.viewButton} ${activeView === item.key ? styles.viewActive : ""}`} controlId={item.tabId} onUiClick={() => setActiveView(item.key)}>{label(item.tabId)}</ErpGovernedButton>)}'
          if old not in s:raise SystemExit('ERP tab anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('{view.fields.map((id) => <div key={id} className={styles.row} data-control-id={id}><div className={styles.label}>{label(id)}</div><div className={styles.value}>—</div></div>)}','{view.fields.map((id) => <div key={id} className={styles.row} data-control-id={id}><div className={styles.label}>{label(id)}</div><div className={styles.value}><ErpValue controlId={id}/></div></div>)}',1)
          old='{view.actions.map((id) => <button key={id} type="button" data-control-id={id} className={id === view.primary ? styles.primaryButton : styles.button} disabled>{label(id)}</button>)}'
          new='{view.actions.map((id) => <ErpGovernedButton key={id} controlId={id} className={id === view.primary ? styles.primaryButton : styles.button}>{label(id)}</ErpGovernedButton>)}'
          if old not in s:raise SystemExit('ERP action anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('<div className={styles.railRow} data-control-id="ERP-01-FLD-READINESS"><span>{label("ERP-01-FLD-READINESS")}</span><strong>—</strong></div>','<div className={styles.railRow} data-control-id="ERP-01-FLD-READINESS"><span>{label("ERP-01-FLD-READINESS")}</span><strong><ErpValue controlId="ERP-01-FLD-READINESS"/></strong></div>',1)
          s=s.replace('<div className={styles.railRow} data-control-id="ERP-01-FLD-AUDIT-REF"><span>{label("ERP-01-FLD-AUDIT-REF")}</span><strong>—</strong></div>','<div className={styles.railRow} data-control-id="ERP-01-FLD-AUDIT-REF"><span>{label("ERP-01-FLD-AUDIT-REF")}</span><strong><ErpValue controlId="ERP-01-FLD-AUDIT-REF"/></strong></div>',1)
          s=s.replace('<button type="button" className={`${styles.button} ${styles.detailButton}`} data-control-id="ERP-01-BTN-DETAIL" disabled>{label("ERP-01-BTN-DETAIL")}</button>','<ErpGovernedButton className={`${styles.button} ${styles.detailButton}`} controlId="ERP-01-BTN-DETAIL">{label("ERP-01-BTN-DETAIL")}</ErpGovernedButton>',1)
          s=s.replace('<p className={styles.railNote}>{t("visualPhase")}</p>','<p className={styles.railNote}>{runtimeError??projection?.page_state??t("noRealData")}</p>',1)
          if 'export function ErpVisual(){return <ErpRuntimeProvider><ErpVisualBody/></ErpRuntimeProvider>}' not in s:s=s.rstrip()+'\n\nexport function ErpVisual(){return <ErpRuntimeProvider><ErpVisualBody/></ErpRuntimeProvider>}\n'
          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          node - <<'NODE'
          const fs=require('fs');const b=fs.readFileSync('src/domain/erp/erpControlBindings.ts','utf8'),v=fs.readFileSync('src/components/pages/ErpVisual.tsx','utf8'),r=fs.readFileSync('src/components/pages/ErpControlRuntime.tsx','utf8');
          const ids=[...b.matchAll(/"(ERP-01-[^"]+)":\{/g)].map(x=>x[1]);if(ids.length!==39||new Set(ids).size!==39)throw new Error(`expected 39 controls got ${ids.length}/${new Set(ids).size}`);
          if(v.includes('VISUAL_ONLY_NO_BUSINESS_DATA'))throw new Error('visual-only state remains');
          if(!v.includes('ErpRuntimeProvider')||!v.includes('ErpGovernedButton')||!v.includes('ErpValue'))throw new Error('ERP runtime wiring missing');
          if(!r.includes('ERP_COMMAND_RUNTIME_NOT_BOUND'))throw new Error('ERP fail-closed command boundary missing');
          for(const forbidden of ['/v1/erp/connectors','/v1/erp/sync-jobs','/v1/erp/finance/fact-pack'])if(r.includes(forbidden))throw new Error('renderer must not call ERP endpoint directly');
          NODE
          test "$(git hash-object src/components/pages/ErpVisual.module.css)" = "51dce8c23444efd17b4ac8a46e27f65489ba28fb"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/erp01-wire-governed-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/erp src/components/pages/ErpControlRuntime.tsx src/components/pages/ErpVisual.tsx .github/workflows/erp01-wire-governed-once.yml
          git commit -m "wire(erp): connect 39 governed controls to projection boundary"
          git push origin HEAD:new
