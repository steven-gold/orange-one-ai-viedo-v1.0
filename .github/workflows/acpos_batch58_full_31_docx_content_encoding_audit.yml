name: ACPOS Batch 58 Full 31 DOCX Content Encoding Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch58-full-docx-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final Word boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="85fd2a890eb78bf050cc4b7616439e484d940ca6"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          test "$(git -c core.quotePath=false ls-tree --name-only "$BASE" | wc -l)" -eq 31
          test "$(git -c core.quotePath=false ls-tree --name-only "$BASE" | grep -vc '\.docx$' || true)" -eq 0
          echo "PASS: EXACT 31-DOCX CONTENT BOUNDARY"

      - name: Install full Word audit runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Run full 31-DOCX content and encoding audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch58_full_31_docx_content_encoding_audit.py

      - name: Verify audit execution completeness
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          p=Path("__batch58_full_audit/batch58_full_audit_report.json")
          assert p.exists(),p
          r=json.loads(p.read_text(encoding="utf-8"))
          s=r["package"]
          assert s["docx_files"]==31,s
          assert len(r["documents"])==31,len(r["documents"])
          assert all(v["pdf_conversion_ok"] for v in r["documents"].values())
          assert all(v["xml_errors"]==[] for v in r["documents"].values())
          assert s["total_rendered_pages"]>0,s
          print("PASS: AUDIT COMPLETED FOR ALL 31 DOCX")
          print(Path("__batch58_full_audit/batch58_summary.json").read_text(encoding="utf-8"))
          PY

      - name: Remove transient PDFs before evidence upload
        shell: bash
        run: |
          rm -rf __batch58_full_audit/pdf __batch58_full_audit/png
          du -sh __batch58_full_audit || true

      - name: Upload Batch 58 full audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch58-full-31-docx-content-encoding-audit
          path: __batch58_full_audit
          retention-days: 2
          if-no-files-found: error

      - name: Remove Batch 58 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __batch58_full_audit
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-58-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch58_full_31_docx_content_encoding_audit.py .github/workflows/acpos_batch58_full_31_docx_content_encoding_audit.yml
          git commit -m "chore(acpos): close batch 58 full docx audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH58 HARNESS REMOVED / CLEAN TREE"
