name: Final DOCX Semantic QA

on:
  push:
    branches:
      - 0921acpos

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --quiet python-docx
      - name: High-pressure semantic validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          from docx import Document

          docs=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          assert len(docs)==9
          v1='ACPOS-20260921-EXACT-BINDING-CLOSURE'
          v2='ACPOS-20260921-UNIFIED-CONTROL-RUNTIME-MATRIX-V3'
          old='ACPOS-20260921-UNIFIED-CONTROL-RUNTIME-MATRIX]'
          report={'docs':{},'total_unified_rows':0,'bad_rows':[]}
          all_text={}

          def rows(d):
              for t in d.tables:
                  rr=[[c.text.strip() for c in r.cells] for r in t.rows]
                  if rr: yield rr

          for p in docs:
              d=Document(p)
              texts=[x.text for x in d.paragraphs]
              for t in d.tables:
                  for r in t.rows:
                      texts += [c.text for c in r.cells]
              joined='\n'.join(texts)
              all_text[p.name]=joined
              assert v1 in joined,p.name
              assert v2 in joined,p.name
              assert old not in joined,p.name
              assert 'Legacy REQUIRE_EXACT_BINDING Resolution Ledger' in joined,p.name
              assert 'Construction Lookup Invariant' in joined,p.name

              unified=0
              for rr in rows(d):
                  h=[x.strip() for x in rr[0]]
                  if 'Control UID' not in h or 'Action UID' not in h or 'API Method/Path' not in h:
                      continue
                  hm={x:i for i,x in enumerate(h)}
                  required=['Control UID','Action UID','Permission','API Method/Path','Runtime','DB/Provider Owner','Success State','Failure State','Evidence']
                  for r in rr[1:]:
                      if not any(r): continue
                      unified+=1
                      for col in required:
                          assert hm.get(col) is not None,(p.name,col)
                          val=r[hm[col]].strip() if hm[col]<len(r) else ''
                          assert val,(p.name,col,r[:6])
                      op=r[hm['Operation']].strip() if 'Operation' in hm else ''
                      api=r[hm['API Method/Path']].strip()
                      basis=r[hm['API Basis']].strip() if 'API Basis' in hm else ''
                      ctype=r[hm['Control Type']].strip() if 'Control Type' in hm else ''
                      readish=bool(re.match(r'^(get|list|search|compare|preview|fetch|trace|inspect|view)',op,re.I)) or 'READ' in ctype.upper()
                      if basis=='NEW_COMMAND_AUTHORITY_AFTER_GLOBAL_SOURCE_EXHAUSTION' and readish:
                          report['bad_rows'].append({'doc':p.name,'op':op,'api':api,'basis':basis,'control':r[hm['Control UID']]})
                      if basis=='NEW_QUERY_AUTHORITY_AFTER_GLOBAL_SOURCE_EXHAUSTION':
                          assert api.startswith('GET /v1/queries/'),(p.name,op,api)
                      if api.startswith('POST /v1/commands/'):
                          assert basis=='NEW_COMMAND_AUTHORITY_AFTER_GLOBAL_SOURCE_EXHAUSTION',(p.name,op,api,basis)
              assert unified>0,p.name
              report['docs'][p.name]={'unified_rows':unified,'tables':len(d.tables),'paragraphs':len(d.paragraphs)}
              report['total_unified_rows']+=unified

          assert not report['bad_rows'],report['bad_rows'][:20]

          # AI-02 quantitative policy must be concretely materialized.
          t=all_text[[x for x in all_text if x.startswith('02_')][0]]
          exact=[
            ('CONV_UI_INITIAL_LOAD_MESSAGES','50'),
            ('CONV_UI_LAZY_LOAD_MESSAGES','50'),
            ('CONV_UI_MAX_RENDERED_MESSAGES','200'),
            ('CONV_AI_RECENT_VERBATIM_MESSAGES','24'),
            ('CONV_SUMMARY_CHECKPOINT_MESSAGES','50'),
            ('CONV_SUMMARY_TRIGGER_INPUT_RATIO','0.80'),
            ('CONV_CONTEXT_INPUT_RATIO','0.70'),
            ('CONV_CONTEXT_OUTPUT_RESERVE_RATIO','0.20'),
            ('CONV_CONTEXT_SAFETY_RESERVE_RATIO','0.10'),
            ('CONV_CONTEXT_INPUT_HARD_CAP_TOKENS','96000'),
            ('CONV_OUTPUT_HARD_CAP_TOKENS','16000'),
            ('CONV_ACTIVE_GENERATION_PER_THREAD','1'),
            ('CONV_PENDING_MESSAGE_QUEUE_DEPTH','8'),
            ('CONV_STREAM_HEARTBEAT_SECONDS','15'),
            ('CONV_STREAM_IDLE_TIMEOUT_SECONDS','60'),
            ('CONV_COMPOSER_DRAFT_TTL_HOURS','24'),
            ('CONV_RETENTION_AFTER_PROJECT_CLOSE_DAYS','365'),
          ]
          for key,val in exact:
              assert key in t,(key,'missing')
              # require key and value to co-exist in a table row/cell neighborhood
              assert re.search(re.escape(key)+r'.{0,120}\b'+re.escape(val)+r'\b',t,re.S),(key,val)

          # Shared runtime numbers.
          for name in ['03_','05_','09_']:
              tt=all_text[[x for x in all_text if x.startswith(name)][0]]
              assert re.search(r'RUNTIME_MAX_ATTEMPTS.{0,120}\b3\b',tt,re.S)
          t3=all_text[[x for x in all_text if x.startswith('03_')][0]]
          assert re.search(r'JOB_VIDEO_HARD_TIMEOUT_SECONDS.{0,120}\b7200\b',t3,re.S)
          assert re.search(r'HTTP_CONNECT_TIMEOUT_SECONDS.{0,120}\b10\b',t3,re.S)
          assert re.search(r'CIRCUIT_FAILURE_THRESHOLD.{0,120}\b5\b',t3,re.S)

          Path('__final_semantic_qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('PASS: 9/9 DOCX semantic construction QA')
          PY
