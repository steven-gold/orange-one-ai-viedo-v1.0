name: CORE-01 Word YAML Pre-Stage Projection
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - "governance/test/CORE01_WORD_YAML_PROJECTION_TRIGGER"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Materialize exact CORE-01 Word projection and frozen source pair
        run: python .github/governance-maintenance/run_core01_word_yaml_projection.py
