name: Stage-02 Actual Product Test After Full-Line Gate

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-actual-test.yml'
      - 'governance/ci/run_current_stage2_actual_test.py'
      - 'governance/ci/validate_stage02_state_integrity.py'
      - 'governance/ci/validate_stage02_entry_receipts.py'
      - 'governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml'
      - 'governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage02-actual-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce Current Specification mutation authorization
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve stable Current governance registry
        run: python governance/ci/governance_resolver.py

      - name: Validate canonical validation remediation closure protocol
        run: python governance/ci/validate_validation_remediation_closure_protocol.py

      - name: Validate Current governance layout
        run: python governance/ci/validate_governance_layout.py

      - name: Run Current Registry multidirectional stress 13 of 13
        run: python governance/ci/stress_test_governance_registry.py

      - name: Validate Stage-01 binding invariants
        run: python governance/ci/validate_stage01_registry_binding.py

      - name: Validate Stage-02 admission predecessor state
        run: python governance/ci/validate_stage02_state_integrity.py

      - name: Validate Stage-02 frozen governance and clean baseline entry receipts
        run: python governance/ci/validate_stage02_entry_receipts.py

      - name: Run complete 75-file full-lifecycle high-pressure system gate on exact Stage-02 test SHA
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py

      - name: Prove verified source remained byte-clean before Stage-02 actual test
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/governance-source/active/source
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' -o -name '*.tmp' -o -name '*.bak' -o -name '*~' \) -print)"
          test -z "$bad" || { printf 'BLOCK: source runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: exact source remains byte-clean before Stage-02 actual test'

      - name: Execute fresh Stage-02 actual test from Stage-01 immutable inputs
        run: python governance/ci/run_current_stage2_actual_test.py

      - name: Prove Current Specification and Stage-01 inputs were not mutated by Stage-02 test
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: Stage-02 actual test did not mutate Current Specification or immutable Stage-01 inputs'

      - name: Upload Stage-02 actual test evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-actual-test-evidence
          path: |
            .github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json
            governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml
            governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml
            .github/governance-source/SOURCE_IDENTITY_REPORT.json
            .github/governance-source/FULL_LINE_SYSTEM_GATE_RESULT.json
          if-no-files-found: error
