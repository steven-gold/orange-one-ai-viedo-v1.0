name: Restore Preview Static Navigation
on:
  push:
    branches: [acpos-live-preview]
    paths: ['.github/workflows/restore-preview-static-navigation.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          fetch-depth: 0
      - name: Restore canonical static preview links only
        shell: python
        run: |
          from pathlib import Path
          mapping = {
            '/':'index.html', '/core':'core.html', '/assets':'assets.html', '/video':'video.html', '/edit':'edit.html', '/qa':'qa.html', '/database':'db.html', '/strategy':'strategy.html', '/info':'info.html',
            '/admin/system':'system.html', '/admin/accounts':'accounts.html', '/admin/development':'dev.html', '/admin/social':'social.html', '/admin/erp':'erp.html', '/admin/ai-api':'aiapi.html', '/admin/qa-criteria':'qa-criteria.html', '/admin/strategy':'strategy-admin.html', '/admin/knowledge':'knowledge-admin.html'
          }
          for p in Path('preview').glob('*.html'):
            s = p.read_text()
            for route,target in sorted(mapping.items(), key=lambda kv: len(kv[0]), reverse=True):
              s = s.replace(f'href="{route}"', f'href="{target}"')
            s = s.replace('src="/brand/', 'src="brand/').replace('href="/brand/', 'href="brand/')
            p.write_text(s)
          required=['index.html','core.html','assets.html','video.html','edit.html','qa.html','db.html','strategy.html','info.html','system.html','accounts.html','dev.html','social.html','erp.html','aiapi.html','qa-criteria.html','strategy-admin.html','knowledge-admin.html']
          missing=[x for x in required if not (Path('preview')/x).exists()]
          if missing: raise SystemExit(f'Missing preview pages: {missing}')
          # Verify no canonical nav href regressed to Next-server routes.
          bad=[]
          for p in Path('preview').glob('*.html'):
            s=p.read_text()
            for route in ['/core','/assets','/video','/edit','/qa','/database','/strategy','/info','/admin/system','/admin/accounts','/admin/development','/admin/social','/admin/erp','/admin/ai-api','/admin/qa-criteria','/admin/strategy','/admin/knowledge']:
              if f'href="{route}"' in s: bad.append((p.name,route))
          if bad: raise SystemExit(f'Unrewritten preview links: {bad[:20]}')
      - name: Commit restored preview navigation and self-clean
        run: |
          rm -f .github/workflows/restore-preview-static-navigation.yml
          git config user.name 'ACPOS Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(preview): restore canonical linked static navigation' || exit 0
          git push origin HEAD:acpos-live-preview
