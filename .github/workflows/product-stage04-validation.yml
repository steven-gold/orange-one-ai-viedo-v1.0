name: Product Stage04 Validation
on:
  push:
    branches: [0921acpos]
    paths: ['STAGE_EXECUTION/STAGE-04/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wu: [WU-STAGE04-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001, WU-STAGE04-WB01-DASHBOARD-CLEAN-001]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - name: Validate phase-aware Current Stage04 state
        env: {WU: "${{ matrix.wu }}"}
        run: |
          set -euo pipefail
          B="STAGE_EXECUTION/STAGE-04/$WU"
          test -s "$B/WORK_UNIT.yaml"; test -s "$B/EXECUTION_STATE.yaml"; test -s "$B/NORMATIVE_EXECUTION_MATRIX.yaml"
          CUR="$(python -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; print(d.get('current_operation') or '')" "$B/EXECUTION_STATE.yaml")"
          if [ "$CUR" != "COMPLETE" ]; then
            echo "PASS: Stage04 incremental operation checkpoint; closure evidence not yet applicable"
            exit 0
          fi
          for F in BASIC_DESIGN_PACKAGE.yaml ACCEPTANCE_AUDIT_BLUEPRINT.yaml DESIGN_FREEZE_PACKAGE.yaml FOUNDATION_BARRIER_RECORD.yaml EVIDENCE/DESIGN_APPROVAL_EVIDENCE.yaml; do test -s "$B/$F"; done
          python - <<'PY'
          import os,yaml
          from pathlib import Path
          b=Path('STAGE_EXECUTION/STAGE-04')/os.environ['WU']
          p=yaml.safe_load((b/'BASIC_DESIGN_PACKAGE.yaml').read_text()) or {}
          ds=p.get('design_domains') or []; refs=p.get('basic_design_domain_checkpoint_refs') or []
          assert ds and len(ds)==len(refs), 'BLOCK:DOMAIN_CHECKPOINT_DENOMINATOR_DRIFT'
          for d,r in zip(ds,refs):
              c=yaml.safe_load(Path(r).read_text()) or {}
              assert c.get('domain_uid')==d.get('domain_uid') and c.get('checkpoint_state')=='PASS', 'BLOCK:DOMAIN_CHECKPOINT_NOT_PASS'
          a=yaml.safe_load((b/'EVIDENCE/DESIGN_APPROVAL_EVIDENCE.yaml').read_text()) or {}
          assert a.get('approved_by_human') is True and a.get('reviewer') and a.get('reviewed_at'), 'BLOCK:HUMAN_APPROVAL_NOT_BOUND'
          print('PASS: Stage04 exact domain checkpoints and human approval are bound')
          PY
          if [ -f "$B/WORK_UNIT_TERMINAL_RECEIPT.yaml" ]; then
            test -s "$B/EVIDENCE/NORMALIZED_STAGE_EVIDENCE.json"
            echo "PASS: Stage04 terminal closure artifacts materialized"
          else
            echo "PASS: Stage04 execution complete; common terminalization pending"
          fi
