name: Stage Governance Load Receipt
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - "governance/test/STAGE_GOVERNANCE_LOAD_TRIGGER"
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate generic Stage governance-load producer
        run: |
          python governance/ci/test_stage_governance_load_receipt.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_execution_governance_load.py
      - name: Build and persist current Stage governance-load receipt
        run: python governance/ci/build_stage_governance_load_receipt.py --persist
      - name: Validate post-load admission and Current consumers
        run: |
          STAGE_UID=$(python - <<'PY'
          import yaml
          d=yaml.safe_load(open('governance/test/ACTIVE_STATE.yaml'))
          print(d['active_work_unit']['stage_uid'])
          PY
          )
          python governance/ci/stage_execution_engine.py --admission-check --stage "$STAGE_UID"
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Persist receipt and remove one-shot trigger
        run: |
          rm -f governance/test/STAGE_GOVERNANCE_LOAD_TRIGGER
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "BLOCK: no governance-load delta"; exit 1; } || true
          git commit -m "feat(governance-load): bind current Stage work unit before execution"
          git push origin HEAD:rebuild-v2.1.1
