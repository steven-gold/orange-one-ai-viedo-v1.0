name: Product STAGE-09 Execute Entry
on:
  workflow_dispatch:
    inputs:
      work_units:
        description: Comma-separated Current STAGE-09 Work Unit UIDs
        required: true
        type: string
jobs:
  execute:
    uses: ./.github/workflows/product-stage-lifecycle-driver.yml
    with:
      stage: STAGE-09
      work_units: ${{ inputs.work_units }}
    secrets: inherit
