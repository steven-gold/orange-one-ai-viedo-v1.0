name: Temporary CORE-01 Word Extract

on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/_tmp_core01_word_extract.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install DOCX parser
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Extract CORE-01 Word structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/core01_extract/media
          cp 'ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx' /tmp/core01_extract/
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          from zipfile import ZipFile
          import json, hashlib

          src=Path('ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx')
          out=Path('/tmp/core01_extract')
          doc=Document(src)

          paragraphs=[]
          for i,p in enumerate(doc.paragraphs,1):
              txt=p.text
              paragraphs.append({
                  'ordinal':i,
                  'style':p.style.name if p.style else None,
                  'text':txt,
              })

          tables=[]
          for ti,t in enumerate(doc.tables,1):
              rows=[]
              for ri,row in enumerate(t.rows,1):
                  rows.append({
                      'ordinal':ri,
                      'cells':[c.text for c in row.cells],
                  })
              tables.append({'ordinal':ti,'rows':rows})

          media=[]
          with ZipFile(src) as z:
              for name in sorted(z.namelist()):
                  if name.startswith('word/media/') and not name.endswith('/'):
                      data=z.read(name)
                      target=out/'media'/Path(name).name
                      target.write_bytes(data)
                      media.append({
                          'zip_path':name,
                          'filename':Path(name).name,
                          'size':len(data),
                          'sha256':hashlib.sha256(data).hexdigest(),
                      })
              core=z.read('docProps/core.xml') if 'docProps/core.xml' in z.namelist() else b''
              (out/'docProps_core.xml').write_bytes(core)
              (out/'word_document.xml').write_bytes(z.read('word/document.xml'))

          payload={
              'source_filename':src.name,
              'sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              'paragraph_count':len(paragraphs),
              'table_count':len(tables),
              'inline_shape_count':len(doc.inline_shapes),
              'section_count':len(doc.sections),
              'media_count':len(media),
              'paragraphs':paragraphs,
              'tables':tables,
              'media':media,
          }
          (out/'CORE01_EXTRACT.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')

          md=[]
          md.append(f"# CORE-01 Word Extract\n")
          md.append(f"- paragraphs: {len(paragraphs)}")
          md.append(f"- tables: {len(tables)}")
          md.append(f"- inline_shapes: {len(doc.inline_shapes)}")
          md.append(f"- sections: {len(doc.sections)}")
          md.append(f"- media: {len(media)}\n")
          md.append("## Paragraphs")
          for p in paragraphs:
              if p['text'].strip():
                  md.append(f"\n[P{p['ordinal']} | {p['style']}]\n{p['text']}")
          md.append("\n## Tables")
          for t in tables:
              md.append(f"\n### Table {t['ordinal']}")
              for row in t['rows']:
                  md.append(" | ".join(x.replace("\n"," / ") for x in row['cells']))
          (out/'CORE01_EXTRACT.md').write_text("\n".join(md),encoding='utf-8')
          PY
      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: core01-word-extract
          path: /tmp/core01_extract
          if-no-files-found: error
          retention-days: 7
