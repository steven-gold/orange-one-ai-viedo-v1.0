  freeze_without_full_current_rule_revalidation: BLOCK
  source_control_multiple_current_governance_versions: BLOCK
  source_control_current_entry_must_be_adapter_declared: true
  source_control_current_promotion_before_backtrace_and_full_revalidation: BLOCK
  github_adapter_current_spec_path: docs/governance/CURRENT_GOVERNANCE_SPEC.yaml
  next_stage_before_governance_freeze: BLOCK
  product_specific_binding_in_common_normative_rule: BLOCK
  product_profile_weakening_common_invariant: BLOCK
  business_entity_inventory_missing: BLOCK
  business_entity_operation_matrix_missing: BLOCK
  entity_hierarchy_matrix_missing: BLOCK
  business_entity_required_operation_unclassified: BLOCK
  business_entity_not_applicable_without_authority: BLOCK
  business_entity_required_operation_contract_missing: BLOCK
  entity_list_without_create_modify_finalization_lifecycle: BLOCK
  unresolved_parent_child_category_chapter_item_relation: BLOCK
  required_operation_without_ui_or_system_entry: BLOCK
  visible_control_without_business_or_utility_operation: BLOCK
  action_or_runtime_without_business_operation: BLOCK
  functional_completeness_by_control_action_api_port_count: BLOCK
  business_entity_operation_denominator_required: true
  product_binding_substitution_audit_required: true
  auto_completion_without_function_admission_scorecard: BLOCK
  function_score_override_authority_gap: BLOCK
  auto_completion_without_seed_gap_or_required_operation: BLOCK
  auto_completion_outside_frozen_dependency_closure: BLOCK
  generic_crud_or_sibling_symmetry_scope_expansion: BLOCK
  transitive_auto_completion_without_independent_admission_proof: BLOCK
  auto_completion_dependency_cycle: BLOCK
  continue_auto_completion_after_minimal_closure: BLOCK
  denominator_growth_without_authority_trace: BLOCK
  logic_addition_without_visual_impact_classification: BLOCK
  user_visible_required_operation_without_visual_binding: BLOCK
  new_visual_pattern_without_stage03_authority: BLOCK
  logic_visual_state_feedback_drift: BLOCK
  indexed_incremental_validation_required: true
  validation_index_may_skip_impacted_validator: BLOCK
  full_package_copy_for_every_mutation_when_not_integrity_subject: DISCOURAGED
  index_drift_before_freeze: BLOCK
  functional_workbench_contract_missing: BLOCK
  interaction_topology_matrix_missing: BLOCK
  atomic_workbench_fragmented_by_unrelated_surface: BLOCK
  visual_topology_drift_from_functional_topology: BLOCK
  cross_surface_without_context_handoff: BLOCK
  responsive_reflow_semantic_order_drift: BLOCK
  ai_profile_missing_interaction_continuity_matrix: BLOCK
  silent_conversation_or_thread_reset: BLOCK
  multi_agent_same_baseline_context_drift: BLOCK
  raw_ai_output_direct_authoritative_promotion: BLOCK
  revision_without_exact_base_context: BLOCK
  branch_silent_mainline_merge: BLOCK
forbidden_filename_tokens:
- new
- final
- latest
- fixed
- backup
- copy
- temp
- old
framework_reserved_filename_policy:
  rule: Framework-reserved source filenames may be used only when the exact canonical path, program artifact UID, owner UID, and construction profile are registered before implementation.
  examples:
  - page.tsx
  - layout.tsx
  - route.ts
  - loading.tsx
  - error.tsx
  - not-found.tsx
  filename_is_not_identity: true
