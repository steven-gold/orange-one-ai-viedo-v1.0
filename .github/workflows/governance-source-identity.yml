name: Governance Source Exact Identity Gate

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-source/IDENTITY_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-identity:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact 75-file materialized source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Fail on any source runtime residue after verification
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' \) -print)"
          test -z "$bad" || { printf 'BLOCK: runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: source verification left zero runtime residue'
      - name: Upload identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-source-identity-report
          path: .github/governance-source/SOURCE_IDENTITY_REPORT.json
          if-no-files-found: error
