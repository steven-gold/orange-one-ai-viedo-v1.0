additional_work_unit_fields: [work_unit_uid, governed_unit_uid, exit_gate, next_stage_uid]
sequence:
- {step: PRETERMINAL_CANDIDATE_HEAD, head_symbol: H, rule: "Operations outputs matrix scanner validator hidden-defect sweep and successor-binding resolution are frozen at H."}
- {step: OUTER_EXACT_HEAD_PRETERMINAL_VALIDATION, rule: "An independent successful outer validation run must validate H without mutating H."}
- {step: TERMINALIZER_CHECKOUT, rule: "Terminalizer binds exact H plus the prior successful outer run."}
- {step: EXACT_HEAD_GATE_RECEIPT_MATERIALIZATION, rule: "Gate receipts bind H and the successful validation run in the terminalizer working tree."}
- {step: CROSS_STAGE_HANDOFF_AND_NORMALIZED_EVIDENCE, rule: "Handoff and normalized evidence are compiled while git HEAD remains H."}
- {step: NORMALIZED_EVIDENCE_VALIDATION, rule: "Current Mother engine validates normalized evidence while git HEAD remains H."}
- {step: TERMINAL_RECEIPT_MATERIALIZATION, rule: "Receipt head_sha is H and conclusion is success."}
- {step: MOTHER_ENGINE_TERMINAL_VALIDATION, rule: "Current Mother engine validates terminal receipt while git HEAD remains H."}
- {step: PERSIST_CLOSURE_PROJECTION, head_symbol: H_PRIME, rule: "Commit gate receipts handoff normalized evidence receipt closed state and resume only after all checks pass."}
rules:
  same_run_preterminal_self_projection_of_terminal_pass: FORBIDDEN
  receipt_head_must_equal_validated_candidate_head: true
  persisted_projection_commit_may_differ_from_receipt_head: true
  predecessor_receipt_is_immutable_after_persist: true
  terminalizer_may_change_product_semantics: false
  normalized_evidence_must_not_claim_prior_outer_success_before_that_run_completes: true
