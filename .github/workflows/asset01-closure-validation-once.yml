name: ASSET-01 closure validation

on:
  push:
    branches:
      - acpos-asset01-closure-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: ASSET authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          auth=Path('authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml').read_text()
          visual=Path('src/components/pages/AssetVisual.tsx').read_text()
          runtime=Path('src/components/pages/AssetControlRuntime.tsx').read_text()
          bindings=Path('src/domain/asset/assetControlBindings.ts').read_text()
          contract=Path('src/domain/asset/assetRuntimeContract.ts').read_text()
          asset_server=Path('src/server/asset/assetRuntime.ts').read_text()
          projection=Path('src/domain/asset/assetProjectionPort.ts').read_text()
          controlled=Path('src/server/testing/controlledAssetTestRuntime.ts').read_text()
          sections=set(re.findall(r'section_uid:\s*(ASSET-01-SEC-[0-9]+)',auth))
          components=set(re.findall(r'component_uid:\s*(ASSET-01-CMP-[A-Z0-9-]+)',auth))
          controls=set(re.findall(r'control_uid:\s*(ASSET-01-[A-Z0-9-]+)',auth))
          actions=set(re.findall(r'action_uid:\s*(ASSET-01-ACT-[A-Z0-9-]+)',auth))
          gates=set(re.findall(r'gate_uid:\s*(ASSET-01-GATE-[A-Z0-9-]+)',auth))
          perms=set(re.findall(r'permission_uid:\s*(ASSET_[A-Z0-9_]+)',auth))
          errors=set(re.findall(r'error_uid:\s*(ASSET-01-ERR-[A-Z0-9-]+)',auth))
          expected={'sections':10,'components':16,'controls':85,'actions':44,'gates':21,'permissions':8,'errors':17}
          actual={'sections':len(sections),'components':len(components),'controls':len(controls),'actions':len(actions),'gates':len(gates),'permissions':len(perms),'errors':len(errors)}
          print('ASSET_AUTHORITY_COUNTS',actual)
          if actual!=expected: print('ASSET_COUNT_MISMATCH',expected);sys.exit(1)
          bind_controls=set(re.findall(r'"(ASSET-01-[A-Z0-9-]+)":\{"action_uid"',bindings))
          if bind_controls!=controls: print('ASSET_BINDING_CONTROL_MISMATCH',sorted(controls-bind_controls),sorted(bind_controls-controls));sys.exit(1)
          if any(x not in visual for x in controls): print('ASSET_VISUAL_CONTROL_GAP');sys.exit(1)
          contract_actions=set(re.findall(r'"(ASSET-01-ACT-[A-Z0-9-]+)"',contract.split('ASSET_ACTION_UIDS',1)[1].split('] as const',1)[0]))
          if contract_actions!=actions: print('ASSET_ACTION_CONTRACT_MISMATCH',sorted(actions-contract_actions),sorted(contract_actions-actions));sys.exit(1)
          contract_errors=set(re.findall(r'"(ASSET-01-ERR-[A-Z0-9-]+)"',contract))
          if not errors.issubset(contract_errors): print('ASSET_ERROR_CONTRACT_GAP',sorted(errors-contract_errors));sys.exit(1)
          if 'const enabled = Boolean(binding && action && allowed && builderReady);' not in runtime: print('ASSET_FAIL_CLOSED_CONTROL_GAP');sys.exit(1)
          if 'ASSET_RUNTIME_NOT_BOUND' not in asset_server: print('ASSET_SERVER_FAIL_CLOSED_GAP');sys.exit(1)
          required=['test_metadata?:AssetProjectionTestMetadata','data_classification:"TEST_ONLY"','production_eligible:false','if(p.test_metadata!==undefined){if(!isControlledTestMode()','test_metadata: TEST_METADATA']
          if any(x not in projection+controlled for x in required): print('ASSET_TEST_CLASSIFICATION_GAP');sys.exit(1)
          if 'data-data-classification={state.projection?.test_metadata?.data_classification}' not in visual: print('ASSET_UI_TEST_CLASSIFICATION_GAP');sys.exit(1)
          print('ASSET_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production ASSET must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3151 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/asset-prod.log 2>&1 &
          pid=$!; trap 'cat /tmp/asset-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3151/assets >/dev/null && break || sleep 1; done
          pcode=$(curl -sS -o /tmp/asset-prod-proj.json -w '%{http_code}' 'http://127.0.0.1:3151/v1/ui-projections/ASSET-01')
          cat /tmp/asset-prod-proj.json
          test "$pcode" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/asset-prod-proj.json
          ! grep -q 'TEST_ONLY' /tmp/asset-prod-proj.json
          ccode=$(curl -sS -o /tmp/asset-prod-command.json -w '%{http_code}' -H 'content-type: application/json' -X POST 'http://127.0.0.1:3151/v1/tasks/TEST-ASSET-TASK-001/execute' --data '{}')
          cat /tmp/asset-prod-command.json
          test "$ccode" = "503"
          grep -q 'DEPARTMENT_OPERATION_RUNTIME_NOT_BOUND' /tmp/asset-prod-command.json
          ! grep -q 'TEST_ONLY' /tmp/asset-prod-command.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled ASSET projection classification
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3152 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/asset-controlled.log 2>&1 &
          pid=$!; trap 'cat /tmp/asset-controlled.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3152/assets >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/asset-controlled-proj.json -w '%{http_code}' 'http://127.0.0.1:3152/v1/ui-projections/ASSET-01')
          test "$code" = "200"
          python <<'PY'
          import json
          d=json.load(open('/tmp/asset-controlled-proj.json'))
          m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY'
          assert m['synthetic'] is True
          assert m['created_for_validation'] is True
          assert m['production_eligible'] is False
          assert d['page_state']=='READY'
          assert len(d['gate_state'])==21
          assert '[TEST]' in d['lists']['ASSET-01-CTL-PROJECT'][0]['label']
          print('ASSET_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled ASSET browser interactions
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3153 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/asset-browser.log 2>&1 &
          pid=$!; trap 'cat /tmp/asset-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3153/assets >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1100}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3153/assets',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`ASSET route ${res&&res.status()} ${width}`);
              await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='READY');
              const root=page.locator('[data-page-uid="ASSET-01"]');
              if(await root.getAttribute('data-authority-sections')!=='10'||await root.getAttribute('data-authority-components')!=='16'||await root.getAttribute('data-authority-controls')!=='85'||await root.getAttribute('data-registry-valid')!=='true')throw new Error('ASSET registry metadata mismatch');
              if(await root.getAttribute('data-data-classification')!=='TEST_ONLY'||await root.getAttribute('data-production-eligible')!=='false')throw new Error('ASSET test classification missing in UI');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(width>=1280&&overflow>0)throw new Error(`ASSET horizontal overflow ${overflow} ${width}`);
              const ids=await page.locator('[data-control-id]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-control-id')));
              if(new Set(ids).size!==ids.length)throw new Error(`ASSET duplicate control ids ${ids.length}/${new Set(ids).size}`);
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3153/assets',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='READY');
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            for(const id of ['ASSET-01-BTN-CONFIRM','ASSET-01-BTN-LOCK','ASSET-01-BTN-HANDOFF']) if(!(await q(id).isDisabled()))throw new Error(`${id} must be gate-disabled initially`);
            await q('ASSET-01-CTL-PROJECT').selectOption('TEST-ASSET-PROJECT-001');
            await q('ASSET-01-CTL-TOPIC').selectOption('TEST-ASSET-TOPIC-001');
            const execResponse=page.waitForResponse(r=>r.url().includes('/v1/tasks/TEST-ASSET-TASK-001/execute')&&r.request().method()==='POST');
            await q('ASSET-01-BTN-EXECUTE').click();
            if((await execResponse).status()!==200)throw new Error('ASSET execute failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='CANDIDATE_OUTPUT');
            if(!(await q('ASSET-01-BTN-CONFIRM').isDisabled()))throw new Error('ASSET confirm enabled before evaluation');
            if(await page.locator('[data-section-id="ASSET-01-SEC-07"]').count()!==1)throw new Error('ASSET layer section not visible for image candidate');
            if(await q('ASSET-01-BTN-LAYER-DOC-CREATE').isDisabled())throw new Error('ASSET layer create unexpectedly disabled');
            const layerResp=page.waitForResponse(r=>r.url().endsWith('/v1/layer-documents')&&r.request().method()==='POST');
            await q('ASSET-01-BTN-LAYER-DOC-CREATE').click();
            if((await layerResp).status()!==200)throw new Error('ASSET layer document create failed');
            await page.waitForFunction(()=>document.querySelector('[data-control-id="ASSET-01-BTN-LAYER-ADD"]')&&!document.querySelector('[data-control-id="ASSET-01-BTN-LAYER-ADD"]').disabled);
            const evalResp=page.waitForResponse(r=>r.url().endsWith('/v1/scorecards')&&r.request().method()==='POST');
            await q('ASSET-01-BTN-EVALUATE').click();
            if((await evalResp).status()!==200)throw new Error('ASSET evaluation failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='WAIT_CONFIRMATION');
            if(await q('ASSET-01-BTN-CONFIRM').isDisabled())throw new Error('ASSET confirm not enabled after evaluation');
            const confirmResp=page.waitForResponse(r=>r.url().includes('/decision')&&r.request().method()==='POST');
            await q('ASSET-01-BTN-CONFIRM').click();
            if((await confirmResp).status()!==200)throw new Error('ASSET confirm failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='CONFIRMED');
            if(await q('ASSET-01-BTN-LOCK').isDisabled())throw new Error('ASSET lock not enabled after confirmation');
            await q('ASSET-01-BTN-LOCK').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='LOCKED');
            if(await q('ASSET-01-BTN-HANDOFF').isDisabled())throw new Error('ASSET handoff not enabled after lock');
            const handoffResp=page.waitForResponse(r=>r.url().endsWith('/v1/handoffs')&&r.request().method()==='POST');
            await q('ASSET-01-BTN-HANDOFF').click();
            if((await handoffResp).status()!==200)throw new Error('ASSET handoff failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="ASSET-01"]')?.getAttribute('data-page-state')==='HANDOFF');
            const body=(await page.locator('body').textContent())||'';
            if(!body.includes('TEST_ASSET_CHARACTER_V001.png')||!body.includes('TEST-SHA256-ASSET-0001'))throw new Error('ASSET canonical filename/checksum not visible');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('ASSET_BROWSER_INTERACTION_PASS');
            await page.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/asset src/server/asset src/server/testing/controlledAssetTestRuntime.ts src/components/pages/AssetControlRuntime.tsx src/components/pages/AssetVisual.tsx
          test ! -e .github/workflows/asset01-runtime-fix-once.yml
          git diff --exit-code
