name: TEMP R9 0005 Gate Seal

on:
  push:
    branches: [r9-0005-gate-seal-20260904]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r9-0005-gate-seal-20260904
          fetch-depth: 1
      - name: Seal 0005 temporary validation gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          ap = Path('authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml')
          mp = Path('authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml')
          a = ap.read_text(encoding='utf-8')
          m = mp.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          a = replace_once(
              a,
              '  revision: 2026-09-04-DATABASE-MIGRATION-0004-APPLIED-VERIFIED',
              '  revision: 2026-09-04-DATABASE-MIGRATION-0005-TEMP-VALIDATION-PASS-PENDING-STAGING-APPROVAL',
              'authority revision'
          )

          block = textwrap.dedent("""          staging_0005_preflight:
            status: PASS_PENDING_HUMAN_APPROVAL
            verified_on: '2026-09-04'
            migration_id: 0005_r9_final_correction
            migration_path: database/migrations/0005_r9_final_correction.sql
            payload_sha256: 524ed12ddc1e7718c71fba16f60a5cc191ef88ae36a62ad527250ccea866874b
            required_approval_ref: CR-R9-0005
            checksum_verification: PASS
            prior_migration_0004_exact: true
            migration_0005_history_rows_on_staging: 0
            target_create_tables: 20
            target_create_tables_already_present: 20
            target_meeting_columns: 12
            target_meeting_columns_already_present: 12
            fk_meetings_context_snapshot_present_before_0005: false
            meeting_participant_role_present_before_0005: false
            meeting_function_present_before_0005: true
            business_data_blockers: 0
            relevant_target_tables_empty: true
            unvalidated_constraints: 0
            restore_point:
              mode: NEON_BRANCH_AT_STAGING_HEAD
              branch_name: restore-pre-0005-r9-final-correction
              branch_id: br-wispy-water-b3mbb2se
              parent_branch_id: br-bitter-poetry-b3p6t5ub
              parent_lsn: 0/26565F8
              source_database: acpos_staging
              source_database_mutated: false
              auxiliary_database_present: acpos_validation_admin
              auxiliary_database_usage: UNUSED_ADMIN_HELPER_ONLY
              clone_database_created: false
              note: Neon branch quota prevented a new validation branch; direct database clone was not performed because Neon proxy reported source database in use.
          temporary_0005_validation:
            status: PASS
            verified_on: '2026-09-04'
            neon_project_id: tiny-dust-89825424
            validation_branch_reused: true
            reused_branch_name: r9-0004-finalization-validate-20260904
            reused_branch_id: br-frosty-art-b3z5ujpv
            reuse_reason: Neon branch quota exceeded; branch was proven schema/data/history equivalent to Current staging before 0005 execution.
            baseline_equivalence:
              schema_diff_against_staging: EMPTY
              migration_0001_exact: true
              migration_0002_exact: true
              migration_0003_exact: true
              migration_0004_exact: true
              migration_0005_rows: 0
              permission_resource_rows: 3650
              projects_rows: 0
            database_name: acpos_staging
            source_migration: database/migrations/0005_r9_final_correction.sql
            payload_sha256: 524ed12ddc1e7718c71fba16f60a5cc191ef88ae36a62ad527250ccea866874b
            execution_mode: SINGLE_TRANSACTION_26_STATEMENTS
            migration_history_rows: 1
            migration_history_checksum: 524ed12ddc1e7718c71fba16f60a5cc191ef88ae36a62ad527250ccea866874b
            migration_history_approval_ref: CR-R9-0005
            prior_migration_0004_exact: true
            target_tables_checked: 20
            target_table_rows_after_validation: 0
            fk_meetings_context_snapshot_present: true
            meeting_function_comment: NON_AUTHORIZATION_METADATA: meeting function/perspective only; never an Authorization Role.
            unvalidated_constraints: 0
            permission_resource_rows_preserved: 3650
            schema_diff_against_staging:
            - meeting_participants.meeting_function comment added
            - meetings.fk_meetings_context_snapshot foreign key added
            unexpected_schema_drift: 0
            staging_mutation_performed: false
          """)

          a = replace_once(a, 'execution_gates:', block + 'execution_gates:', 'insert 0005 blocks')
          a = replace_once(
              a,
              '  0005_state: PENDING_0005_OWN_GATES',
              """  0005_state: TEMP_VALIDATION_PASS_PENDING_CR_R9_0005_STAGING_APPROVAL
              0005_temporary_execution: PASS
              0005_staging_execution: FORBIDDEN_UNTIL_EXPLICIT_CR_R9_0005_STAGING_APPROVAL
              0006_state: BLOCKED_PENDING_0005""".replace('\n              ','\n  '),
              'authority 0005 gate'
          )

          m = replace_once(
              m,
              '  revision: 2026-09-04-DATABASE-MIGRATION-0004-APPLIED-VERIFIED',
              '  revision: 2026-09-04-DATABASE-MIGRATION-0005-TEMP-VALIDATION-PASS-PENDING-STAGING-APPROVAL',
              'manifest revision'
          )
          m = replace_once(
              m,
              '    0005_gate: PENDING_0005_OWN_GATES',
              """    0005_gate: TEMP_VALIDATION_PASS_PENDING_CR_R9_0005_STAGING_APPROVAL
              0005_payload_sha256: 524ed12ddc1e7718c71fba16f60a5cc191ef88ae36a62ad527250ccea866874b
              0005_restore_branch_id: br-wispy-water-b3mbb2se
              0005_validation_branch_id: br-frosty-art-b3z5ujpv
              0005_validation_branch_reused: true
              0005_staging_execution: NOT_EXECUTED_REQUIRES_EXPLICIT_HUMAN_APPROVAL
              0006_gate: BLOCKED_PENDING_0005""".replace('\n              ','\n    '),
              'manifest 0005 gate'
          )

          ap.write_text(a, encoding='utf-8')
          mp.write_text(m, encoding='utf-8')
          PY

          git diff --check
          git config user.name "acpos-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          git commit -m "docs(authority): record 0005 temporary validation gate"
          git push origin HEAD:r9-0005-gate-seal-20260904
