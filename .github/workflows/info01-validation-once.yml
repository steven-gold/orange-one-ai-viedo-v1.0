name: INFO-01 validation once

on:
  push:
    branches: [new]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact current new
        uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - name: Scope and visual lock guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=4ac48548b89117e0b74db6df904d8d7e90a01f67
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(src/components/pages/InfoControlRuntime\.tsx|src/components/pages/InfoVisual\.tsx|src/domain/info/infoClientState\.ts|src/domain/info/infoProjectionPort\.ts|\.github/workflows/info01-validation-once\.yml)$'; then
            echo 'INFO-01 scope pollution detected' >&2
            exit 1
          fi
          test "$(git hash-object src/components/pages/InfoVisual.module.css)" = "3c25f9160a804c9ba536529202154cd638996078"
          test -z "$(git diff --name-only "$BASE" HEAD -- src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css)"

      - name: Authority registry guard
        shell: bash
        run: |
          set -euo pipefail
          AUTH=authority/pages/workspace/INFO-01/ACPOS_INFO-01_FINAL_LOCKED_ENCODING.yaml
          test -f "$AUTH"
          test "$(grep -oE 'INFO-01-SEC-[0-9]{2}' "$AUTH" | sort -u | wc -l | tr -d ' ')" = "12"
          test "$(grep -oE 'INFO-01-CMP-[A-Z0-9-]+' "$AUTH" | sort -u | wc -l | tr -d ' ')" = "20"
          test "$(grep -oE 'INFO-01-(FLD|BTN|SEL|LST|TAB)-[A-Z0-9-]+' "$AUTH" | sort -u | wc -l | tr -d ' ')" = "66"
          test "$(grep -oE 'INFO-01-ACT-[A-Z0-9-]+' "$AUTH" | sort -u | wc -l | tr -d ' ')" = "17"
          for state in LOADING READY EMPTY STALE INCOMPLETE ERROR POLICY_BLOCKED CONTEXT_CANDIDATE; do grep -q "${state}" "$AUTH"; done
          node <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('src/domain/info/infoProjectionPort.ts','utf8');
          for(const state of ['LOADING','READY','EMPTY','STALE','INCOMPLETE','ERROR','POLICY_BLOCKED','CONTEXT_CANDIDATE']) if(!p.includes(`'${state}'`)) throw new Error(`missing state ${state}`);
          const c=fs.readFileSync('src/i18n/infoCatalog.ts','utf8');
          const ids=[...c.matchAll(/"id":\s*"(INFO-01-[^"]+)"/g)].map(x=>x[1]);
          if(new Set(ids).size!==66) throw new Error(`catalog controls ${new Set(ids).size}`);
          console.log('INFO01_AUTHORITY_GUARD_PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build current head
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build

      - name: Product residue guard
        shell: bash
        run: |
          set -euo pipefail
          files=(src/components/pages/InfoControlRuntime.tsx src/components/pages/InfoVisual.tsx src/domain/info/infoClientState.ts src/domain/info/infoProjectionPort.ts)
          if grep -En '(TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|@ts-expect-error|debugger|console\.(log|debug))' "${files[@]}"; then
            echo 'INFO-01 product residue detected' >&2
            exit 1
          fi

      - name: Install temporary Chromium tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"

      - name: Production browser validation
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/info01-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/info01-next.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/info >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[];
            const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:3000/info',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="workspace:INFO-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="workspace:INFO-01"]')?.getAttribute('data-page-state')==='ERROR',{timeout:15000});
            assert.equal(await root.getAttribute('data-authority-sections'),'12');
            assert.equal(await root.getAttribute('data-authority-components'),'20');
            assert.equal(await root.getAttribute('data-authority-controls'),'66');
            assert.equal(await root.getAttribute('data-authority-actions'),'17');
            assert.equal(await root.getAttribute('data-registry-valid'),'true');
            assert.equal(await root.getAttribute('data-projection-status'),'BLOCKED');
            assert.equal(await root.getAttribute('data-projection-reason'),'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.equal(await root.getAttribute('data-projection-adapter-ready'),'false');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert((await page.locator('body').innerText()).includes('UI_PROJECTION_RUNTIME_NOT_BOUND'));
            const api=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/workspace%3AINFO-01');return{status:r.status,body:await r.json()};});
            assert.equal(api.status,503);
            assert.equal(api.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            const formal=page.locator('[data-runtime-binding="NOT_EXECUTED"]');
            assert((await formal.count())>=5);
            for(let i=0;i<await formal.count();i++){
              const node=formal.nth(i);
              assert(await node.getAttribute('data-action-uid'));
              assert(await node.getAttribute('data-gate-uid'));
              assert(await node.getAttribute('data-permission-uid'));
              assert(await node.getAttribute('data-operation'));
              assert(await node.getAttribute('data-method-path'));
              assert(await node.getAttribute('data-error-uid'));
              assert.equal(await node.getAttribute('data-current-state'),'ERROR');
              assert.equal(await node.getAttribute('data-control-enabled-from-projection'),'false');
              if(await node.evaluate(el=>el instanceof HTMLButtonElement)) assert.equal(await node.isDisabled(),true);
            }
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('INFO01_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('INFO01_BROWSER_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Final product tree residue check
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain package.json package-lock.json src/components/pages/InfoVisual.module.css)"
