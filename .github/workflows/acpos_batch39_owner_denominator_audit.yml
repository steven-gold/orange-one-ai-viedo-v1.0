name: ACPOS Batch 39 Remaining Owner Denominator Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch39-owner-denominator-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 38 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="ed2b3e00cc81da12ea59efea739f4693b613bb6d"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH38 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 39 owner denominator audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch39_remaining_owner_denominator_audit.py

      - name: Verify Batch 39 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch39_owner_denominator_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_cells"]==286,s
          assert (s["method_path"],s["payload_schema"],s["persistence_owner"])==(63,119,104),s
          assert sum(x["cells"] for x in r["ranked_owners"])==286,r["ranked_owners"]
          print("PASS: BATCH39 OWNER DENOMINATOR")
          print(json.dumps({"summary":s,"ranked_owners":r["ranked_owners"]},ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 39 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch39-remaining-owner-denominator-audit
          path: |
            __batch39_owner_denominator_audit.json
            __batch39_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 39 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch39_owner_denominator_audit.json __batch39_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-39-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch39_remaining_owner_denominator_audit.py .github/workflows/acpos_batch39_owner_denominator_audit.yml
          git commit -m "chore(acpos): close batch 39 remaining owner denominator audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH39 HARNESS REMOVED / CLEAN TREE"
