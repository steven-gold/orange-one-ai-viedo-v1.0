business_payload_registry:
  contract_meta:
    contract_id: ACPOS-CURRENT-BUSINESS-PAYLOAD-REGISTRY-1.1.0
    status: FINAL_LOCKED
    current_ui_owners: [admin:STR-01, workspace:INFO-01]
    current_authorities:
    - authority/pages/admin/STR-01/ACPOS_STRATEGY_CENTER_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml
    - authority/pages/workspace/INFO-01/ACPOS_INFO-01_FINAL_LOCKED_ENCODING.yaml
    source_registry_provenance: ACPOS_SINGLE_AUTHORITY_CONSTRUCTION_MASTER_FINAL
    provenance_is_non_executable: true
  rule:
    - Only schemas explicitly retained by the Current Strategy single-page authority are materialized here.
    - Each invocation preserves source_page_uid and the original operation/schema owner.
    - Cross-source payload union inference is forbidden.
    - This recovery file does not recreate STR-02..06 as frontend pages.
  common_effectful_context:
    required:
      - scope
      - expected_version
      - correlation_id
      - idempotency_key
    rule: Exact context/version/idempotency remains server validated; UI omission never grants authority.
  schemas:
    - operation_id: searchProjection
      request_schema_id: SearchProjectionRequest
      source_page_uids: [admin:STR-01, admin:STR-04, workspace:INFO-01]
      method: POST
      path: /v1/search
      fields:
        - { name: query, type: text, required: true }
        - { name: scope_ref, type: reference, required: true }
        - { name: filters_json, type: json, required: false }
    - operation_id: refreshProjection
      request_schema_id: RefreshProjectionRequest
      source_page_uids: [admin:STR-01, workspace:INFO-01]
      method: POST
      path: /v1/projections/refresh
      fields:
        - { name: projection_type, type: string, required: true }
        - { name: scope_ref, type: reference, required: true }
    - operation_id: configureGovernedResource
      request_schema_id: ConfigureGovernedResourceRequest
      source_page_uids: [admin:STR-02]
      method: PATCH
      path: /v1/governance/resources/{id}
      fields:
        - { name: resource_type, type: string, required: true }
        - { name: resource_id, type: reference, required: true }
        - { name: config_patch_json, type: json, required: true }
        - { name: reason, type: text, required: true }
    - operation_id: approveGovernedResource
      request_schema_id: ApproveGovernedResourceRequest
      source_page_uids: [admin:STR-02, admin:STR-03, admin:STR-05]
      method: POST
      path: /v1/governance/resources/{id}/approve
      fields:
        - { name: resource_type, type: string, required: true }
        - { name: resource_id, type: reference, required: true }
        - { name: rationale, type: text, required: true }
        - { name: expected_resource_version, type: string, required: false }
    - operation_id: saveDraft
      request_schema_id: SaveDraftRequest
      source_page_uids: [admin:STR-03]
      method: POST
      path: /v1/drafts
      fields:
        - { name: resource_type, type: string, required: true }
        - { name: target_ref, type: reference, required: true }
        - { name: content, type: text, required: true }
        - { name: reference_ids, type: reference_list, required: false }
    - operation_id: exportProjection
      request_schema_id: ExportProjectionRequest
      source_page_uids: [admin:STR-04, workspace:INFO-01]
      method: POST
      path: /v1/exports
      fields:
        - { name: projection_type, type: string, required: true }
        - { name: scope_ref, type: reference, required: true }
        - { name: format, type: string, required: true }
    - operation_id: createCandidate
      request_schema_id: CreateCandidateRequest
      source_page_uids: [admin:STR-05]
      method: POST
      path: /v1/candidates
      fields:
        - { name: resource_type, type: string, required: true }
        - { name: title, type: text, required: false }
        - { name: source_ref, type: reference, required: false }
        - { name: content, type: text, required: false }
        - { name: reference_ids, type: reference_list, required: false }
    - operation_id: rejectStrategyCandidate
      request_schema_id: RejectStrategyCandidateRequest
      source_page_uids: [admin:STR-06]
      method: POST
      path: /v1/ai/strategy/candidates/{strategyCandidateId}/reject
      path_identifier: strategyCandidateId
      fields:
        - { name: strategy_candidate_id, type: reference, required: false, rule: "Optional body copy must equal canonical path identifier." }
        - { name: decision_reason, type: text, required: true }
        - { name: evidence_refs, type: reference_list, required: false }
    - operation_id: adoptAsContextCandidate
      request_schema_id: AdoptAsContextCandidateRequest
      source_page_uids: [admin:STR-06]
      method: POST
      path: /v1/state-commands/strategycandidate/adoptascontextcandidate
      fields:
        - { name: strategy_candidate_id, type: reference, required: true }
        - { name: decision_reason, type: text, required: true }
        - { name: evidence_refs, type: reference_list, required: false }

    - operation_id: adoptContextCandidate
      request_schema_id: AdoptContextCandidateRequest
      source_page_uids: [workspace:INFO-01]
      method: POST
      path: /v1/context-candidates/{id}/adopt
      path_identifier: id
      fields:
        - { name: context_candidate_id, type: reference, required: true, rule: "Body identifier must equal canonical path identifier." }
        - { name: decision_reason, type: text, required: true }
    - operation_id: decideCandidate
      request_schema_id: DecideCandidateRequest
      source_page_uids: [workspace:INFO-01]
      method: POST
      path: /v1/candidates/{id}/decision
      path_identifier: id
      fields:
        - { name: candidate_id, type: reference, required: true, rule: "Body identifier must equal canonical path identifier." }
        - { name: decision, type: enum, required: true, values: [ACCEPTED, REJECTED] }
  no_form_operations:
    - operation_id: compareCandidates
      source_page_uids: [admin:STR-06]
      method: GET
      path: /v1/candidates/compare
      interaction_type: DRAWER

department_runtime_payload_registry:
  authority_revision: 2026-09-09-SHARED-CORRECTION-VERSION-RUNTIME
  source_pages: [ASSET-01, VIDEO-01]
  rule:
  - Exact path identifiers are canonical; body copies may not disagree.
  - Blueprint/Script/Manifest/Instruction/Route lineage is derived from canonical DB owners.
  - Missing evaluation evidence, correction lineage, handoff target, or Provider route data fails closed; no defaults are fabricated.
  operations:
  - operation_id: requestTaskExecution
    required_path: [taskId]
    optional_body: [input_fingerprint, mode, approved_candidate_ref]
    correction_mode_contract:
      required_when_mode_CORRECTION: [approved_candidate_ref]
      source_candidate_state: APPROVED
      human_decision_required: true
      locked_source_output_correction: FORBIDDEN
  - operation_id: retryTaskExecution
    required_path: [taskId]
    optional_body: [input_fingerprint, preserve_previous_output]
  - operation_id: decideOutputCandidate
    required_path: [taskId, outputVersionId]
    required_body: [decision]
    allowed_decision: [CONFIRM]
  - operation_id: submitScorecard
    required_body: [task_ref, target_output_version_id, criteria_version_ref, dimensions, evidence_refs, total_score, gate_status]
  - operation_id: createFinding
    required_body: [target_output_version_id, severity, category, affected_scope, evidence]
  - operation_id: createCorrectionRequest
    required_body: [finding_id, source_output_version_id, source_instruction_package_id, original_owner_task_id, affected_scope, revalidation_requirements]
  - operation_id: createDepartmentHandoff
    required_body: [source_task_id, target_task_id, source_output_version_id, scorecard_id]

shared_correction_version_payload_registry:
  authority_revision: 2026-09-09-SHARED-CORRECTION-VERSION-RUNTIME
  authority_file: authority/runtime/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml
  source_pages: [ASSET-01, VIDEO-01]
  rules:
  - Exact task/output/finding/candidate references are required; latest-row guessing is forbidden.
  - Human correction approval requires decision_reason and exact candidate_ref.
  - Restore-as-new-draft persists lineage only and never creates or duplicates task_outputs.
  - Output lock is exact-version immutable state and may not reuse Mother/Child lock semantics.
  operations:
  - operation_id: generateCorrectionScriptCandidate
    method: POST
    path: /v1/state-commands/correctionscript/generate
    required_body: [family, task_id, output_version_id, finding_id, request, affected_scope]
    family_values: [ASSET, VIDEO]
    request_language: zh-TW
  - operation_id: approveCorrectionScriptCandidate
    method: POST
    path: /v1/state-commands/correctionscript/approve
    required_body: [family, candidate_ref, decision_reason]
    optional_body: [expected_content_hash]
    family_values: [ASSET, VIDEO]
  - operation_id: restoreAssetVersionAsNewDraft
    method: POST
    path: /v1/state-commands/assetversion/restoreasnewdraft
    required_body: [family, output_version_id]
    family_values: [ASSET]
  - operation_id: lockAssetVersion
    method: POST
    path: /v1/state-commands/assetversion/lock
    required_body: [family, output_version_id]
    optional_body: [manifest_hash]
    family_values: [ASSET]
  - operation_id: lockVideoVersion
    method: POST
    path: /v1/state-commands/videoversion/lock
    required_body: [family, output_version_id]
    optional_body: [manifest_hash]
    family_values: [VIDEO]
