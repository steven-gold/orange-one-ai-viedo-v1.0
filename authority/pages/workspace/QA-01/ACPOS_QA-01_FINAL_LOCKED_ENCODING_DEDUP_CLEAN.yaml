authority:
  id: ACPOS_QA-01_FINAL_LOCKED_ENCODING
  page_uid: QA-01
  page_name_zh: QA 審查工作區
  page_name_en: QA Review Workspace
  status: FINAL_LOCKED
  current_only: true
  single_page_workspace: true
  single_machine_authority: true
  legacy_merge: FORBIDDEN
  scope: QA-01 Main Workspace only
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  real_data_only: true
  missing_value_display: —
  department_boundary: QA owns exact-output validation, scorecard/evidence/finding/manual-review projection, correction request, recheck,
    QA gate decision and release-candidate creation only. QA never edits upstream Script/Asset/Video/Edit outputs and never publishes directly.
  source_policy:
    old_QA_02_03_04_runtime_pages: RETIRED_AS_SEPARATE_CURRENT_PAGES
    functional_content_merge_target: QA-01 sections only
    parallel_QA_page_authority: FORBIDDEN
  revision: 2026-08-28-MANUAL-REVIEW-CORRECTION
  revision_rule: 'System/AI scoring remains automatic. Human does not get generic result-confirm/result-modify controls. After scoring, only
    when a governed ManualReviewCase is triggered, the Manual Review surface exposes exactly two functions: MODIFY and PASS.'
  final_gap_closure_revision: 2026-08-28-BUTTON-RUNTIME-BINDING-CLOSURE
  source_file_for_gap_closure: ACPOS_QA-01_FINAL_LOCKED_ENCODING_CORRECTED(1).yaml
  final_dedup_revision: 2026-08-28-SINGLE-EXECUTABLE-AUTHORITY
  parallel_authority_for_same_page: FORBIDDEN
  supersedes_gap_closed_file: ACPOS_QA-01_FINAL_LOCKED_ENCODING_GAP_CLOSED.yaml
system_filename_governance:
  authority: ACPOS_SYSTEM
  page_behavior: READ_ONLY_REFERENCE_ONLY
  rule: QA does not rename or infer artifact identity from filenames. Review and release-candidate routing use exact output/artifact IDs,
    exact versions, checksums and provenance.
  forbidden:
  - manual rename
  - QA-local filename formula
  - filename parsing as business authority
  - latest/current/default implicit output resolution
layout:
  desktop_min_width: 1280px
  vertical_scroll: Main Workspace height:auto; overflow-y:auto; independent from Global Sidebar/Menu height
  below_min_width: Keep min-width=1280px; allow horizontal scroll; do not invent mobile page/drawer workflow
  context_bar:
    height: 56px
    width: 100%
    render_mode: READONLY_CONTEXT_CHIPS
    fields:
    - Project
    - Topic
    - QA Task
    - Target Output Version
    - QA Review State
    interactive_fields_forbidden: true
    only_action: Start Review in MANUAL mode; AUTO is started from QA Review Queue mode control
  primary_grid:
    columns: minmax(260px,1fr) minmax(720px,3fr) minmax(300px,1fr)
    approx: 20% / 60% / 20%
    gap: 16px
    align: start
  left_rail:
    min_width: 260px
    role: AUTO/MANUAL review mode + QA review queue + auto-run progress + search + state/severity/source-department filters
  center:
    min_width: 720px
    role: exact output viewer / validation / evidence
    priority: highest
    sticky_viewer_during_finding_capture: true
    finding_capture: Finding quick-capture uses same-page panel while Exact Output Viewer remains visible. Manual Review appears only when
      a governed ManualReviewCase is required/open.
  right_rail:
    min_width: 300px
    role: System/AI Generated Scorecard / Hard Block / QA Gate Result / Release Readiness. Scorecard area has no human decision buttons.
      If ManualReviewCase is triggered, human functions appear only in Manual Review.
  lower_rows: Finding/Manual Review, Correction/Recheck, Release Candidate and Audit extend full width
  viewer:
    video_or_edit_output: 16:9 container; object-fit:contain; no crop/stretch
    image_output: preserve output-contract/original ratio; contain; no stretch
    audio_output: waveform + transport; no fake 16:9 visual content
    document_or_text_output: read-only document/text viewport
    conditional_compare: Initial review = exact target output single 100%. During RECHECK, when a verified new exact output version exists,
      optional Before/After compare = 50/50. No new version => B pane does not render.
  tokens:
    control_height: 40px
    button_min_width: 88px
    primary_button_min_width: 120px
    button_radius: 10px
    panel_radius: 12px
    large_container_radius: 24px
    section_gap: 16px
    content_padding: 16px
    status_badge_height: 28px
    action_gap: 8px
    touch_target_min: 44px × 44px
  visual_override: FORBIDDEN; inherit Global Visual tokens only
qa_contract:
  receives:
  - QAHandoff
  - QATask
  - TargetOutputVersion / ExactOutputVersion
  - QAValidationScriptView
  - ScorecardRefs
  - CriteriaVersion
  - Evidence
  - RightsPolicy
  - ChannelPolicy
  produces:
  - QAScorecard
  - Finding
  - ManualReviewCase
  - CorrectionRequest
  - QAGateDecision
  - ReleaseCandidate / ReleasePackage
  ai_actions:
  - generate_scorecard
  - sequential_topic_review
  - evidence_assistance
  - consistency_check
  - policy_check_assistance
  - candidate_comparison
  human_actions:
  - manual_review_modify_when_required
  - manual_review_pass_when_required
  - request_correction
  - start_recheck
  - create_release_candidate
  mandatory_checks:
  - target_version_explicit
  - criteria_version_approved
  - evidence_complete
  - required_checks_complete
  - checksum_and_provenance_valid
  - rights_valid
  - policy_valid
  - manual_review_closed_when_required
  - channel_account_scope_valid_for_release_candidate
  can:
  - evaluate
  - auto_review_topic_tasks_sequentially
  - create_finding
  - request_correction
  - block
  - pass_or_fail_gate_by_bound_policy
  - create_release_candidate
  cannot:
  - edit_script
  - edit_asset
  - edit_video
  - edit_editing_output
  - bypass_hard_gate
  - close_finding_without_verified_new_version
  - publish_directly
  - blank_manual_scoring
  - human_create_unbound_score_dimension
  - auto_publish
  - auto_create_release_candidate_from_score_only
  handoff_out: QA PASS -> ReleaseService only
  human_scoring_policy: 'System/AI performs QA scoring. Human has no scoring action and no post-score action in the Scorecard area. Only
    when a governed ManualReviewCase is required/open after scoring does the Manual Review area expose exactly two human functions: 修改 /
    通過.'
scorecard_contract:
  source: Task-bound approved QA CriteriaVersion + QualityGatePolicyVersion
  ui_fields:
  - criteria_version_id
  - quality_gate_policy_version
  - dimension_uid
  - label
  - weight
  - score
  - hard_block
  - evidence_refs
  - total_score
  - gate_status
  hard_gate_rule: Evidence / Rights / Policy / Checksum / Provenance / Required Check failure overrides numeric score. QA-01 must not hard-code
    a second scoring scheme or a local numeric pass threshold.
  pass_rule: Use bound CriteriaVersion/QualityGatePolicy. PASS additionally requires no unresolved hard block, all blocking findings closed
    by verified new version/recheck, and required manual review closed.
  score_origin: SYSTEM_AI_GENERATED_FROM_BOUND_CRITERIA
  manual_scoring: FORBIDDEN
  human_review:
    generic_post_score_confirmation: NONE
    generic_post_score_modification: NONE
    trigger: Only when governed ManualReviewCase is required/open after scoring
    allowed_actions_when_triggered:
    - MODIFY
    - PASS
    pass_semantics: Pass the Manual Review requirement for the current case; then re-evaluate the normal QA Gate. It is not the same as direct
      QA Gate PASS and cannot bypass hard gates.
    modify_semantics: Open the governed manual-review modification surface for the current case. It is not a blank scoring form.
    audit: All Manual Review actions follow the governed Manual Review authority/audit.
  ui_fields_behavior:
    criteria_version_id: READONLY
    quality_gate_policy_version: READONLY
    dimension_uid: READONLY
    label: READONLY
    weight: READONLY
    score: SYSTEM_AI_GENERATED; no general human score input
    hard_block: READONLY_SYSTEM_RESULT
    evidence_refs: READONLY_AUTO_BOUND
    total_score: READONLY_DERIVED
    gate_status: READONLY_SYSTEM_RESULT; Manual Review, if required, is handled in the Manual Review section
finding_correction_contract:
  finding_required_fields:
  - finding_id
  - source_type
  - source_id
  - severity
  - category
  - affected_scope
  - evidence_refs
  - detected_by
  - status
  correction_required_fields:
  - correction_request_id
  - finding_ids
  - source_scorecard_ids
  - source_instruction_package_id
  - affected_scope
  - root_cause_classification
  - required_action
  - target_department
  - revalidation_requirements
  - created_by
  root_cause_classification: &id001
  - CANON
  - SCRIPT_VIEW
  - INSTRUCTION_PACKAGE
  - INPUT_ASSET
  - PROVIDER_ROUTE
  - OUTPUT_ARTIFACT
  - RIGHTS_POLICY
  - QUALITY_CRITERIA
  - EDITING
  - UNKNOWN
  closure_rule: QA does not directly mark a failed finding CLOSED after an upstream edit. A verified new exact output version must arrive,
    RECHECK must run, evidence/criteria must be re-evaluated, then the finding may close according to governed QA state.
  finding_input_policy:
    severity: SELECT_FROM_REGISTERED_SEVERITY_ENUM; no free-text severity
    category: SELECT_FROM_REGISTERED_QA_ISSUE_CATEGORY; missing registry value => BLOCK + REPORT_AUTHORITY_GAP
    affected_scope: PREFILLED from viewer current context/range; Human may narrow it without changing exact output identity
    evidence_refs: AUTO_BOUND from exact output/version/checksum + current timecode/frame/range; manual Evidence ID typing forbidden
  viewer_evidence_capture:
    video_edit:
    - current_timecode
    - previous_frame
    - next_frame
    - set_finding_point
    - set_range_in
    - set_range_out
    image:
    - zoom
    - fit
    - capture governed region if supported
    audio:
    - current_timecode
    - set_range_in
    - set_range_out
    document_text:
    - capture current selection/page/section ref if supported
    rule: Evidence capture never edits upstream output; it only binds QA evidence context.
  correction_binding_policy:
    finding_ids: READONLY_AUTO_BOUND_FROM_CURRENT_FINDING_CONTEXT
    source_scorecard_ids: READONLY_AUTO_BOUND_FROM_CURRENT_REVIEW
    source_instruction_package_id: READONLY_AUTO_BOUND_FROM_UPSTREAM_LINEAGE
    target_department: READONLY_AUTO_RESOLVED_ORIGINAL_OWNER
    affected_scope: PREFILLED_FROM_FINDING; Human may narrow with governed scope selector
    root_cause_classification: SELECT_CANONICAL_ENUM_ONLY
    required_action: TEXTAREA_HUMAN_REQUIRED
    revalidation_requirements: PREFILLED_REQUIRED_CHECKS; additions must be registered checks
release_candidate_contract:
  meaning: QA creates a ReleasePackage/Release Candidate; this is not Publish and not final Release approval.
  eligibility:
  - QA PASS
  - all findings closed
  - manual review closed
  - rights valid
  - policy valid
  - exact output versions
  - qa_gate_ref valid
  - rights_gate_ref valid
  - channel/account scope valid when applicable
  create_operation_fields:
  - scope
  - expected_version
  - correlation_id
  - idempotency_key
  - project_id
  - topic_id
  - output_version_ids
  - qa_gate_ref
  - rights_gate_ref
  - channel (optional)
  forbidden:
  - approveRelease button without explicit release-approval permission mapping
  - publish button
  - direct external channel call
workflow:
  canonical_states:
  - NOT_STARTED
  - IN_REVIEW
  - FINDING_OPEN
  - CORRECTION_REQUIRED
  - RECHECK
  - BLOCKED
  - PASS
  - FAIL
  - SUPERSEDED
  sequence:
  - Select AUTO or MANUAL review mode
  - Resolve exact Project + Topic QA scope
  - 'AUTO: sequentially resolve each Topic QA task | MANUAL: select one QA task/review'
  - Resolve exact target output + QAValidationScriptView + approved Criteria + Evidence + Rights/Policy
  - System/AI generates and persists QA Scorecard / Required Checks / hard-gate result
  - 'AUTO: low score emits warning only; otherwise continue automatically according to bound policy'
  - 'If governed ManualReviewCase is required/open after scoring: show Manual Review with exactly 修改 / 通過'
  - 'Manual Review 修改: enter governed modification flow for current case; not a blank scoring form'
  - 'Manual Review 通過: close/pass current manual review requirement and re-evaluate normal QA Gate; hard gates still apply'
  - Create Finding(s) / CorrectionRequest when required
  - Original owner produces NEW exact version -> start Recheck -> re-score / re-validate
  - QA Gate evaluates bound criteria/policy + hard gates + manual review closed state
  - 'If PASS + release eligibility: Create Release Candidate/Package'
  - ReleaseService continues approval/release; QA does not publish
  auto_behavior: AUTO reviews all authorized QA tasks in selected Topic sequentially, max active task=1. Only a below-threshold score emits
    QA_LOW_SCORE_WARNING. Passing/non-low-score items continue without popup. Hard-block/rights/policy/evidence failures remain BLOCKED and
    are never hidden by score. AUTO never publishes and never creates Release Candidate from score alone.
