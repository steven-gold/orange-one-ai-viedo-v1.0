name: AIAPI-01 Contact Sheet

on:
  push:
    branches:
      - aiapi-01-current-authority-runtime

permissions:
  contents: write

jobs:
  contact:
    if: ${{ contains(github.event.head_commit.message, 'add contact sheet generator') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aiapi-01-current-authority-runtime
      - run: python3 -m pip install --quiet pillow
      - name: Build compact visual contact sheet
        run: |
          python3 <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('.validation/aiapi-01')
          files=[root/'AIAPI-01-VIEW-OVERVIEW.png',root/'AIAPI-01-VIEW-PROVIDER-API.png',root/'AIAPI-01-VIEW-ROUTING-TEST.png',root/'AIAPI-01-VIEW-OPERATIONS.png']
          sheet=Image.new('L',(240,180),255)
          for i,path in enumerate(files):
            im=Image.open(path).convert('L')
            im.thumbnail((118,88))
            x=(i%2)*120+(120-im.width)//2
            y=(i//2)*90+(90-im.height)//2
            sheet.paste(im,(x,y))
          sheet.save(root/'AIAPI-01-CONTACT-MICRO.jpg',quality=5,optimize=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .validation/aiapi-01/AIAPI-01-CONTACT-MICRO.jpg
          git commit -m 'validation-artifacts: AIAPI-01 micro contact sheet'
          git push origin HEAD:aiapi-01-current-authority-runtime
