permission_materialization:
  algorithm:
  - Resolve exact selected frontend/backend L1 choices from this authority.
  - Resolve exact current canonical resource/action set for each selected L1 from registered current authorities.
  - Expand to explicit Account Permission Assignment candidate rows; no runtime inheritance.
  - Diff against current explicit assignments for the target account.
  - Call previewAuthorizationImpact and render exact added/removed/unchanged/blocked impact.
  - Require explicit confirmation.
  - Apply additions with assignAccountPermission and removals with revokeAccountPermission using exact resource/action/scope/condition + version/correlation/idempotency/audit.
  - Only after all required account data + permission operations + approval gates succeed may UI report complete.
  no_silent_inheritance: true
  no_automatic_department_grant: true
  no_role_bundle_authorization: true
  partial_failure: Keep account in pending/non-final state, show actual successful/failed assignments, preserve audit/correlation, allow idempotent
    retry. Never display completed.
state_machine:
  states:
  - LIST
  - CREATE_BASIC
  - CREATE_PERMISSION
  - CREATE_PREVIEW
  - EDIT_BASIC
  - EDIT_PERMISSION
  - EDIT_PREVIEW
  - APPLYING
  - COMPLETE
  - BLOCKED
  - ERROR
  transitions:
  - LIST -> CREATE_BASIC on Add Account
  - LIST -> EDIT_BASIC on Edit exact account
  - '*_BASIC -> *_PERMISSION after registered basic data validates'
  - '*_PERMISSION -> *_PREVIEW after proposed L1 selection exists and preview resolves'
  - '*_PREVIEW -> APPLYING after explicit confirmation'
  - APPLYING -> COMPLETE only when all required operations/gates/audit succeed
  - Any step -> BLOCKED on authority/permission/state/version/policy gap; preserve draft/context
  - Any effectful call -> ERROR on registered runtime failure; preserve last lawful state and correlation
gates:
- gate_uid: IAM-01-GATE-PAGE
  condition: identity + page:admin:IAM-01 VIEW + scope + condition + audit
- gate_uid: IAM-01-GATE-MANAGE
  condition: page gate + explicit account management permission; role/department inference forbidden
- gate_uid: IAM-01-GATE-DRAFT
  condition: manage gate + valid account/draft context + exact registered schema
- gate_uid: IAM-01-GATE-PREVIEW
  condition: draft valid + at least one intentional L1 selection state + exact expansion resolvable + preview permission
- gate_uid: IAM-01-GATE-COMPLETE
  condition: preview current + no blocking conflict + expected_version + idempotency + state_guard + all required account/permission permissions
    + explicit confirmation + audit
errors:
- error_uid: IAM-01-ERR-IDENTITY-SCHEMA
  when: Exact current registered authority Identity Candidate field/schema cannot be resolved
  recovery: BLOCK current form section + REPORT_AUTHORITY_GAP; do not invent username/email/etc.
- error_uid: IAM-01-ERR-PRESET
  when: Selected department preset not configured/resolvable
  recovery: Use 無預設 / 手動設定; do not infer department permissions.
- error_uid: IAM-01-ERR-L1-EXPANSION
  when: Selected L1 cannot resolve its exact current registered permission resource set
  recovery: BLOCK preview/apply for that L1; report mapping gap; do not grant broad wildcard.
- error_uid: IAM-01-ERR-AUTH-DENIED
  when: Any account permission/scope/condition/gate denied
  recovery: Do not perform denied mutation; show actual denied reason allowed by policy.
- error_uid: IAM-01-ERR-VERSION
  when: Expected version conflict
  recovery: Reload exact current account/draft/permission state; require new preview before apply.
- error_uid: IAM-01-ERR-PARTIAL-APPLY
  when: One or more assignment operations fail after others succeed
  recovery: Do not activate/finalize; display actual partial result and correlation; idempotently retry missing delta only.
- error_uid: IAM-01-ERR-UNDEFINED
  when: Unregistered route/operation/control/field requested
  recovery: BLOCK + REPORT_AUTHORITY_GAP.
account_detail_governance:
  primary_page_clutter_rule: Status/MFA/Risk/session/access history/audit/access review are secondary detail, not permanent oversized cards.
  source: current registered authority IAM-01/IAM-03/IAM-06 projections
  effectful_break_glass_rule: No new break-glass request/approve/revoke operation is invented by this file. Render only exact registered operation
    if current authority later resolves it; otherwise read-only + gap.
