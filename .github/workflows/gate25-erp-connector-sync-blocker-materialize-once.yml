name: ACPOS Gate25 ERP Connector Sync Blocker Materialize Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-erp-connector-sync-blocker-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize-erp-connector-sync-blockers:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_EXPECT_RELEASE_SHA: 608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install product dependencies
        run: npm ci
      - name: Install browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Execute authenticated Production ERP connector sync diagnostic
        run: |
          node --check scripts/gate25-production-erp-connector-sync-diagnostic.mjs
          node scripts/gate25-production-erp-connector-sync-diagnostic.mjs | tee "$RUNNER_TEMP/erp-connector-sync.log"
      - name: Materialize exact ERP connector sync blockers and synchronize ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          log_path=Path(os.environ['RUNNER_TEMP'])/'erp-connector-sync.log'
          line=next((x for x in log_path.read_text().splitlines() if x.startswith('ERP_CONNECTOR_SYNC_DIAGNOSTIC ')),None)
          assert line, 'ERP connector/sync diagnostic payload missing'
          diagnostic=json.loads(line.split(' ',1)[1])
          assert diagnostic['production_release_sha']==os.environ['ACPOS_EXPECT_RELEASE_SHA']
          assert diagnostic['projection_http']==200
          assert diagnostic['page_state']=='EMPTY'
          assert diagnostic['mutation_count']==0

          expected_gates={
            'ERP-01-GATE-PAGE': True,
            'ERP-01-GATE-CONNECTOR-READ': False,
            'ERP-01-GATE-CONNECTOR-WRITE': False,
            'ERP-01-GATE-CONNECTOR-VALIDATE': False,
            'ERP-01-GATE-MAPPING-VALIDATE': False,
            'ERP-01-GATE-SYNC-READ': False,
            'ERP-01-GATE-SNAPSHOT-REFRESH': False,
            'ERP-01-GATE-SYNC-CREATE': False,
            'ERP-01-GATE-SYNC-RETRY': False,
          }
          assert diagnostic['gate_state']==expected_gates, diagnostic['gate_state']
          assert all(value is False for value in diagnostic['references'].values()), diagnostic['references']

          pairs=[
            ('CTRL-ADMIN-ERP-01-ACT-01-ERP-CONNECTOR-CREATE','action:admin:ERP-01:erp.connector.create','ERP-01-BTN-CONNECTOR-CREATE','ERP-01-ACT-CONNECTOR-CREATE','ERP-01-GATE-CONNECTOR-WRITE','ERP-01-PERM-CONNECTOR','createERPConnector'),
            ('CTRL-ADMIN-ERP-01-ACT-02-ERP-CONNECTOR-UPDATE','action:admin:ERP-01:erp.connector.update','ERP-01-BTN-CONNECTOR-UPDATE','ERP-01-ACT-CONNECTOR-UPDATE','ERP-01-GATE-CONNECTOR-WRITE','ERP-01-PERM-CONNECTOR','updateERPConnector'),
            ('CTRL-ADMIN-ERP-01-ACT-03-ERP-CONNECTOR-VALIDATE','action:admin:ERP-01:erp.connector.validate','ERP-01-BTN-CONNECTOR-VALIDATE','ERP-01-ACT-CONNECTOR-VALIDATE','ERP-01-GATE-CONNECTOR-VALIDATE','ERP-01-PERM-CONNECTOR','validateERPConnector'),
            ('CTRL-ADMIN-ERP-01-ACT-04-ERP-MAPPING-VALIDATE','action:admin:ERP-01:erp.mapping.validate','ERP-01-BTN-MAPPING-VALIDATE','ERP-01-ACT-MAPPING-VALIDATE','ERP-01-GATE-MAPPING-VALIDATE','ERP-01-PERM-CONNECTOR','validateERPMapping'),
            ('CTRL-ADMIN-ERP-01-ACT-05-ERP-SNAPSHOT-REFRESH','action:admin:ERP-01:erp.snapshot.refresh','ERP-01-BTN-SNAPSHOT-REFRESH','ERP-01-ACT-SNAPSHOT-REFRESH','ERP-01-GATE-SNAPSHOT-REFRESH','ERP-01-PERM-SYNC','refreshERPSnapshot'),
            ('CTRL-ADMIN-ERP-01-ACT-06-ERP-SYNC-CREATE','action:admin:ERP-01:erp.sync.create','ERP-01-BTN-SYNC-CREATE','ERP-01-ACT-SYNC-CREATE','ERP-01-GATE-SYNC-CREATE','ERP-01-PERM-SYNC','createERPSyncJob'),
            ('CTRL-ADMIN-ERP-01-ACT-07-ERP-SYNC-STATUS','action:admin:ERP-01:erp.sync.status','ERP-01-BTN-SYNC-STATUS','ERP-01-ACT-SYNC-STATUS','ERP-01-GATE-SYNC-READ','ERP-01-PERM-SYNC','getERPSyncStatus'),
            ('CTRL-ADMIN-ERP-01-ACT-08-ERP-SYNC-RETRY','action:admin:ERP-01:erp.sync.retry','ERP-01-BTN-SYNC-RETRY','ERP-01-ACT-SYNC-RETRY','ERP-01-GATE-SYNC-RETRY','ERP-01-PERM-SYNC','retryERPSync'),
            ('CTRL-ADMIN-ERP-01-ACT-09-ERP-FAILURE-GET','action:admin:ERP-01:erp.failure.get','ERP-01-BTN-FAILURE-GET','ERP-01-ACT-FAILURE-GET','ERP-01-GATE-SYNC-READ','ERP-01-PERM-SYNC','getERPFailure'),
          ]
          observed={c['control_id']:c for c in diagnostic['connector']+diagnostic['sync']}
          assert len(observed)==9
          for _,_,control_id,action_uid,gate_uid,permission_uid,_ in pairs:
            c=observed[control_id]
            assert c['enabled'] is False
            assert c['disabled_reason']==gate_uid
            assert c['action_uid']==action_uid
            assert c['gate_uid']==gate_uid
            assert c['permission_uid']==permission_uid

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_ERP_CONNECTOR_SYNC_PRODUCTION_BLOCKERS_2026-09-10.json')
          authority_path=Path('authority/pages/admin/ERP-01/ACPOS_ERP-01_ERP_FINANCE_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml')
          binding_path=Path('src/domain/erp/erpControlBindings.ts')
          ledger=json.loads(ledger_path.read_text())
          assert ledger['denominator']['total']==1481
          before=dict(ledger['counts'])
          assert before=={'PASS':47,'BLOCKED':121,'NOT_EXECUTED':1313}, before
          entries={e['resource_key']:e for e in ledger['entries']}
          target_keys=[]
          for control_source, action_key, *_ in pairs:
            control_key=f'control:{control_source}'
            target_keys.extend([control_key,action_key])
            assert control_key in entries, f'missing ledger resource: {control_key}'
            assert action_key in entries, f'missing ledger resource: {action_key}'
            assert entries[control_key]['disposition']=='NOT_EXECUTED', (control_key,entries[control_key]['disposition'])
            assert entries[action_key]['disposition']=='NOT_EXECUTED', (action_key,entries[action_key]['disposition'])

          evidence={
            'document_id':'ACPOS_GATE25_ERP_CONNECTOR_SYNC_PRODUCTION_BLOCKERS',
            'status':'BLOCKED',
            'recorded_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':os.environ['ACPOS_EXPECT_RELEASE_SHA'],
            'deployment_url':os.environ['ACPOS_DEPLOYMENT_URL'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'resource_count':18,
            'mutation_count':0,
            'page_state':diagnostic['page_state'],
            'gate_state':diagnostic['gate_state'],
            'references':diagnostic['references'],
            'formal_resources':target_keys,
            'operation_pairs':[{'control_resource':f'control:{p[0]}','action_resource':p[1],'control_id':p[2],'action_uid':p[3],'gate_uid':p[4],'permission_uid':p[5],'operation_id':p[6]} for p in pairs],
            'rule':'Authenticated Production has the ERP page gate, but every connector/sync operation gate is false and no connector, mapping, snapshot, sync-job, or failure reference exists. Effectful or ID-dependent acceptance cannot bypass gates or fabricate Production business identifiers.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          run_ref=f'GitHub Actions: ACPOS Gate25 ERP Connector Sync Blocker Materialize run_id={os.environ["GITHUB_RUN_ID"]}'
          for control_source,action_key,control_id,action_uid,gate_uid,permission_uid,operation_id in pairs:
            detail=(f'Authenticated Production exposes {control_id} but {gate_uid}=false; page_state=EMPTY and required connector/sync references are absent. '
                    'Bypassing the gate, inventing IDs, or creating fake Production ERP business rows is forbidden.')
            for key in (f'control:{control_source}',action_key):
              e=entries[key]
              e['disposition']='BLOCKED'
              e['reason_code']='PRODUCTION_ERP_CONNECTOR_SYNC_PREREQUISITES_ABSENT'
              e['evidence_refs']=[str(evidence_path),run_ref,'scripts/gate25-production-erp-connector-sync-diagnostic.mjs',str(authority_path),str(binding_path)]
              e['blocker_detail']=detail
              e['operation_ids']=[operation_id,action_uid,gate_uid,permission_uid]

          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for e in ledger['entries']: counts[e['disposition']]+=1
          assert sum(counts.values())==1481
          assert counts=={'PASS':47,'BLOCKED':139,'NOT_EXECUTED':1295}, counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':18},ensure_ascii=False))
          PY
      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit ERP connector sync blocker evidence and ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_ERP_CONNECTOR_SYNC_PRODUCTION_BLOCKERS_2026-09-10.json
          git commit -m 'evidence(gate25): block 18 ERP connector sync resources on Production prerequisites'
          git push origin HEAD:new
