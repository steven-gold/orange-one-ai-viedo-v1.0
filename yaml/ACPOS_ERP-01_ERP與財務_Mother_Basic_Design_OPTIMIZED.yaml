document:
  paragraphs:
  - index: 0
    style: Normal
    text: 'ERP-01 ERP 與財務

      Mother Basic Design · Functional Completion · Data Truth & Finance Governance

      ORANGE ONE · admin:ERP-01'
  - index: 1
    style: Normal
    text: 本版保留單頁三個主要工作 View，並依母規範補齊 Entity × Operation、功能加入／排除規則、Finance Read Model、Data Trust、Connector/Mapping、Sync Recovery、Functional Chain、Permission、State、Error、Visual
      Geometry、A11y、Acceptance 與施工映射。
  - index: 2
    style: Normal
    text: 核心優化：財務數值、Forecast、Capacity Guardrail、Recommendation Boundary 明確分層；Connector 與 Mapping 先驗證再進 Sync；Freshness、Completeness、Currency/Timezone 成為資料可信度帶。未註冊的收入／支出／Ledger／Budget
      寫入與外部 ERP Writeback 不進本頁 effectful UI。
  - index: 4
    style: Normal
    text: 圖 1｜ERP-01 財務概況：Actual Finance、Forecast、Guardrails 與 Data Trust 分層呈現。
  - index: 5
    style: Heading 1
    text: 1. Page Identity / 頁面定位與產品目標
  - index: 7
    style: Heading 1
    text: 2. Scope / 需求、角色與 Out-of-Scope
  - index: 9
    style: Heading 1
    text: 3. Business Entity × Operation / 實體與操作矩陣
  - index: 11
    style: Heading 1
    text: 4. Entity Hierarchy / 資料與生命週期
  - index: 12
    style: Normal
    text: ERP Connector → Mapping → Connector Validation → Sync Job → Snapshot → Data Quality / Freshness / Completeness → Finance Read Model / Fact Pack / Forecast
      / Guardrails。Failure、Audit、Correlation、Version、Scope 與 Permission 橫跨全鏈。
  - index: 13
    style: Normal
    text: Finance View 不是第二套 Ledger。它只消費受治理 Read Model；任何新的收入、支出、Journal、Budget 或外部 ERP Write 操作，只有在未來存在精確 Operation / Permission / State Contract 時才能進入 effectful
      UI。
  - index: 14
    style: Heading 1
    text: 5. Three-View Functional Workbench / 三大工作 View
  - index: 16
    style: Heading 1
    text: 6. Functional Admission / 功能加入、降級與排除規則
  - index: 18
    style: Heading 1
    text: 7. Visual Architecture / 版面與資訊層級
  - index: 20
    style: Normal
    text: 圖 2｜ERP-01 連接與同步：Connector、Mapping、Snapshot、Sync、Quality 與 Recovery 合併在同一頁。
  - index: 22
    style: Heading 1
    text: 8. Finance Read Model / 財務資訊語義與顯示規則
  - index: 24
    style: Heading 1
    text: 9. Connector / Mapping Contract / ERP 連接契約
  - index: 26
    style: Heading 1
    text: 10. Sync & Data Quality Contract / 同步與資料品質
  - index: 28
    style: Heading 1
    text: 11. Functional Chain / 端到端功能鏈
  - index: 30
    style: Heading 1
    text: 12. Control Registry / 42 個頁面控制
  - index: 32
    style: Normal
    text: Control 不是「畫面上必須全部常駐」。低頻技術欄位與 Failure/Audit 進 Detail Drawer；Action Dock 僅呈現目前 View/State/Permission 合法按鈕，避免技術控制牆。
  - index: 33
    style: Heading 1
    text: 13. Action Registry / 18 個 Action
  - index: 35
    style: Heading 1
    text: 14. Gate / Permission / Security Matrix
  - index: 37
    style: Normal
    text: 頁面內明確使用的權限包括：erp.connector.read、erp.connector.write、erp.connector.validate、erp.mapping.validate、erp.sync.request、erp.sync.retry、erp.snapshot.read、finance.read。Role
      Name 與 Department Membership 不得直接授權。
  - index: 38
    style: Heading 1
    text: 15. State / Transition / Recovery
  - index: 40
    style: Heading 1
    text: 16. Error / Recovery Registry
  - index: 42
    style: Heading 1
    text: 17. Integration Ports / Runtime Binding
  - index: 44
    style: Heading 1
    text: 18. Data Truth / Security / Audit Hard Locks
  - index: 45
    style: List Bullet
    text: ERPConnectorService 是唯一 Connector/Snapshot/Sync Owner；FinanceGuardrailService 是唯一 Finance/Capacity/Forecast Owner。
  - index: 46
    style: List Bullet
    text: Raw Secret 永不顯示；只處理 Secret Reference ID。
  - index: 47
    style: List Bullet
    text: ERP_write_from_ACPOS 禁止；任何外部 ERP 寫入需未來另有明確註冊 Operation。
  - index: 48
    style: List Bullet
    text: Missing / unavailable 不得當 0；Finance amount 未授權時 Mask。
  - index: 49
    style: List Bullet
    text: 前端 Hide 不是 Authorization；Server 必須驗 Identity、Permission、Scope、State、Expected Version、Idempotency、Audit。
  - index: 50
    style: List Bullet
    text: 不得建立第二 ERP、Finance、Snapshot、Sync、Export、Permission 或 Provider/API-key 系統。
  - index: 51
    style: List Bullet
    text: 不得使用 fake KPI、fake chart、sample amount、synthetic completeness/freshness/failure。
  - index: 52
    style: Heading 1
    text: 19. Visual State / A11y / Localization
  - index: 54
    style: Heading 1
    text: 20. Acceptance Matrix / 驗收矩陣
  - index: 56
    style: Heading 1
    text: 21. Definition of Done / Design Freeze 前完成條件
  - index: 57
    style: List Bullet
    text: Page Identity、Scope、Out-of-Scope、Entity × Operation、Data/State Hierarchy 完整。
  - index: 58
    style: List Bullet
    text: 8 Sections、42 Controls、18 Actions、10 Gates、8 Errors、14 Runtime Operations 的頁面映射完整。
  - index: 59
    style: List Bullet
    text: Finance / Connector / Sync 三 View 與 Visual Geometry 固定；未指定區域不得因微調漂移。
  - index: 60
    style: List Bullet
    text: 兩張實際 UI Design Preview 對應真實頁面結構，不是概念圖。
  - index: 61
    style: List Bullet
    text: Finance Write Boundary、Secret Boundary、External ERP Writeback Boundary、Missing-as-zero Boundary 明確。
  - index: 62
    style: List Bullet
    text: A11y / i18n / Disabled Reason / Error Recovery / Audit / Version / Correlation 均具施工落點。
  - index: 63
    style: List Bullet
    text: 所有 effectful control 均可追溯到 Operation / Gate / Permission；未註冊能力 fail-closed。
  - index: 64
    style: Heading 1
    text: 22. Construction Mapping / 施工切片與驗證順序
  - index: 66
    style: Normal
    text: 最終設計裁決：ERP-01 是「可信財務讀模型 + ERP 連接與同步治理工作台」，不是第二套會計／Ledger 系統。任何未被正式 Operation 支持的寫入功能都不透過 UI 假裝完成；頁面只呈現可被精確驗證、可追溯、可 fail-closed 的能力。
  - index: 68
    style: Heading 1
    text: 2026-09-21 Machine Authority Construction Closure / 機器權威施工綁定封板
