    rows:
    - row: 0
      cells:
      - Control UID
      - Operation
      - Payload / Schema
      - Persistence Owner
      - Required Semantics
    - row: 1
      cells:
      - ERP-01-BTN-CONNECTOR-CREATE
      - createERPConnector
      - CreateERPConnectorRequest
      - ERPConnectorService / ERP Connector Configuration + Audit
      - Connector configuration persists provider/adapter/entity scope/mapping/secret-reference metadata only. Raw secret plaintext must remain outside this persistence
        boundary.
    - row: 2
      cells:
      - ERP-01-BTN-CONNECTOR-UPDATE
      - updateERPConnector
      - UpdateERPConnectorRequest
      - ERPConnectorService / ERP Connector Configuration + Audit
      - Update changes exact connector configuration/version with audit. Secret material remains referenced, not copied into Word/log/audit payload.
    - row: 3
      cells:
      - ERP-01-BTN-CONNECTOR-VALIDATE
      - validateERPConnector
      - ValidateERPConnectorRequest
      - ERPConnectorService / ERP Connector Validation Evidence
      - Validation persists bounded connectivity/schema/capability evidence for an exact connector/version; a pass is not equivalent to Production business-data correctness.
    - row: 4
      cells:
      - ERP-01-BTN-EXPORT
      - exportProjection
      - ExportERPProjectionRequest
      - Existing Projection/Export Owner / ERP Export Artifact + Export Audit
      - ERP export persists derived projection/export artifact and audit only; ERP/Finance remains financial truth and export cannot mutate accounting facts.
    - row: 5
      cells:
      - ERP-01-BTN-MAPPING-VALIDATE
      - validateERPMapping
      - ValidateERPMappingRequest
      - ERPConnectorService / ERP Mapping Validation Evidence
      - Mapping validation records exact mapping-version/entity-scope result/evidence without silently changing canonical financial data.
    - row: 6
      cells:
      - ERP-01-BTN-SNAPSHOT-REFRESH
      - refreshERPSnapshot
      - RefreshERPSnapshotRequest
      - ERPConnectorService / ERP Snapshot + Freshness/Audit
      - Snapshot refresh persists immutable snapshot identity/freshness/completeness lineage sourced from the connector; it does not fabricate finance values.
    - row: 7
      cells:
      - ERP-01-BTN-SYNC-CREATE
      - createERPSyncJob
      - CreateERPSyncJobRequest
      - ERPConnectorService / ERP Sync Job + Audit
      - Sync job persists exact connector/mapping/scope/snapshot target and idempotency/audit metadata. Job creation is not sync completion.
    - row: 8
      cells:
      - ERP-01-BTN-SYNC-RETRY
      - retryERPSync
      - RetryERPSyncRequest
      - ERPConnectorService / ERP Sync Attempt + Failure/Audit
      - Retry binds the failed sync job/failure/version and creates auditable retry-attempt lineage; prior failure evidence must not be erased.
