actions:
- action_uid: DEV-01-ACT-STAGE-1-SELECT
  label: 名單持續搜集
  effect_type: UI_CONTEXT_STATE
  runtime_binding:
    binding_kind: CLIENT_STATE_OR_VIEW_NO_API_REQUIRED
