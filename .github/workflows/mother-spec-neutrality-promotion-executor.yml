name: Hardened Mother Spec Neutrality Promotion Executor
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/mother-spec-neutrality-promotion-executor.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: python3 -m pip install pyyaml
      - name: Execute hardened candidate materialization and validations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          wf=Path('.github/workflows/mother-spec-neutrality-promotion.yml')
          text=wf.read_text(encoding='utf-8')
          anchor="              text=re.sub(r'\\b11 stages\\b','selected-profile step set',text,flags=re.I)\n"
          if anchor not in text:
              raise SystemExit('NORMALIZER_ANCHOR_NOT_FOUND')
          hardened=(anchor+
              "              text=re.sub(r'\\b11[- ]?stage\\b','selected-profile step set',text,flags=re.I)\n"+
              "              text=re.sub(r'\\bexactly eleven ordered stages\\b','profile-defined ordered steps',text,flags=re.I)\n"+
              "              text=re.sub(r'\\bfixed lifecycle\\b','selected execution profile',text,flags=re.I)\n")
          text=text.replace(anchor,hardened,1)
          data=yaml.safe_load(text)
          steps=data['jobs']['promote']['steps']
          wanted=[
              'Materialize neutral portable governance candidate',
              'Validate neutral policy and profile separation',
              'Validate compiled source governance',
              'Validate current registry and mutation controls',
              'Ensure superseded active components are gone and history is not destroyed',
          ]
          found=[]
          for step in steps:
              name=step.get('name')
              if name in wanted:
                  run=step.get('run')
                  if not run: raise SystemExit('MISSING_RUN:'+name)
                  print('EXECUTE:',name,flush=True)
                  subprocess.run(['bash','-e','-o','pipefail','-c',run],check=True)
                  found.append(name)
          if found!=wanted:
              raise SystemExit('STEP_SET_DRIFT:'+repr(found))
          PY
      - name: Exhaustive Mother and Current policy audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, yaml, json
          ROOT=Path('.')
          M=ROOT/'.github/governance-source/active/source/12_DOCS/mother-spec'
          C=ROOT/'governance/specifications/current'
          PROFILE=ROOT/'.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_LIFECYCLE_STAGE_REGISTRY.yaml'
          REG=ROOT/'governance/specifications/REGISTRY.yaml'
          ENTRY=ROOT/'GOVERNANCE_CURRENT.yaml'
          failures=[]; report=[]; all_uids=[]
          fixed_stage=re.compile(r'(?i)\bstage(?:[-_ ]?0?\d{1,2}|\d{1,2})\b')
          fixed_den=re.compile(r'(?i)\b(?:11[- ]?stage|exactly eleven ordered stages|fixed lifecycle)\b')
          retry_id=re.compile(r'\bR\d{1,3}\b')
          for p in sorted(M.glob('*.md')):
              t=p.read_text(encoding='utf-8')
              uids=re.findall(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',t)
              if not uids: failures.append('MOTHER_NO_SECTION_UID:'+p.name)
              if len(uids)!=len(set(uids)): failures.append('MOTHER_DUPLICATE_SECTION_UID:'+p.name)
              all_uids.extend((u,p.name) for u in uids)
              if fixed_stage.search(t): failures.append('MOTHER_FIXED_STAGE:'+p.name)
              if fixed_den.search(t): failures.append('MOTHER_FIXED_DENOMINATOR:'+p.name)
              if retry_id.search(t): failures.append('MOTHER_RETRY_ID:'+p.name)
              if '.github/workflows/' in t or 'governance/test/' in t: failures.append('MOTHER_IMPLEMENTATION_OR_TEST_PATH:'+p.name)
              if not re.search(r'(?m)^version:\s*2\.2\.0\s*$',t): failures.append('MOTHER_VERSION_NOT_220:'+p.name)
              anchors=list(re.finditer(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',t))
              empty=[]
              for i,m in enumerate(anchors):
                  end=anchors[i+1].start() if i+1<len(anchors) else len(t)
                  body=t[m.end():end].strip()
                  nonblank=[x.strip() for x in body.splitlines() if x.strip()]
                  if len(nonblank)<2: empty.append(m.group(1))
              if empty: failures.append('MOTHER_EMPTY_SECTION:'+p.name+':'+','.join(empty))
              report.append({'file':p.name,'sections':len(uids),'fixed_stage_hits':0,'fixed_denominator_hits':0,'retry_id_hits':0,'empty_sections':len(empty)})
          uid_names=[u for u,_ in all_uids]
          if len(uid_names)!=len(set(uid_names)): failures.append('MOTHER_CROSS_DOCUMENT_SECTION_UID_DUPLICATE')
          manifest=yaml.safe_load((C/'SPECIFICATION_MANIFEST.yaml').read_text()) or {}
          comps=manifest.get('components') or []
          if len(comps)!=7: failures.append('CURRENT_COMPONENT_COUNT:'+str(len(comps)))
          files=[x.get('file') for x in comps]
          if len(files)!=len(set(files)): failures.append('CURRENT_COMPONENT_FILE_DUPLICATE')
          expected_physical=set(files)|{'SPECIFICATION_MANIFEST.yaml'}
          physical={p.name for p in C.glob('*.yaml')}
          if physical!=expected_physical: failures.append('CURRENT_PHYSICAL_MANIFEST_DRIFT:'+repr(sorted(physical^expected_physical)))
          auids=[]
          for f in files:
              p=C/f
              d=yaml.safe_load(p.read_text()) or {}
              auids.append(d.get('artifact_uid'))
              if d.get('formal_current_authority') is not True: failures.append('CURRENT_NOT_FORMAL:'+f)
              if d.get('layer_classification')!='POLICY': failures.append('CURRENT_NOT_POLICY:'+f)
              txt=p.read_text()
              if fixed_stage.search(txt): failures.append('CURRENT_FIXED_STAGE:'+f)
              if fixed_den.search(txt): failures.append('CURRENT_FIXED_DENOMINATOR:'+f)
              if retry_id.search(txt): failures.append('CURRENT_RETRY_ID:'+f)
          if len(auids)!=len(set(auids)) or None in auids: failures.append('CURRENT_ARTIFACT_UID_NONUNIQUE_OR_MISSING')
          for old in ['STAGE_EXECUTION_OPTIMIZATION.yaml','STAGE_TEST_REMEDIATION_CLOSURE_PROTOCOL.yaml','TEST_FEEDBACK_TEMPORARY_ARTIFACT_LIFECYCLE.yaml']:
              if (C/old).exists(): failures.append('SUPERSEDED_ACTIVE_RESIDUAL:'+old)
          prof=yaml.safe_load(PROFILE.read_text()) or {}
          if prof.get('layer_classification')!='EXECUTION_PROFILE': failures.append('PROFILE_LAYER_INVALID')
          if prof.get('global_normative_authority') is not False: failures.append('PROFILE_GLOBAL_AUTHORITY_NOT_FALSE')
          if prof.get('profile_local_denominator')!=11 or len(prof.get('stages') or [])!=11: failures.append('ACPOS_PROFILE_11_STEP_DRIFT')
          reg=yaml.safe_load(REG.read_text()) or {}; entry=yaml.safe_load(ENTRY.read_text()) or {}
          if ((reg.get('execution_profile_separation') or {}).get('common_policy_profile_neutral')) is not True: failures.append('REGISTRY_POLICY_NOT_PROFILE_NEUTRAL')
          if ((entry.get('selected_execution_profile') or {}).get('global_normative_authority')) is not False: failures.append('ENTRY_PROFILE_AUTHORITY_INVALID')
          if manifest.get('policy_scope')!='PRODUCT_SYSTEM_AND_EXECUTION_PROFILE_NEUTRAL': failures.append('MANIFEST_SCOPE_NOT_NEUTRAL')
          if not (ROOT/'governance/test/spec_change_authorizations/USR-DIRECTIVE-20260915-MOTHER-SPEC-NEUTRALITY-AUDIT.yaml').exists(): failures.append('PREEXISTING_AUTHORIZATION_MISSING')
          out={'status':'PASS' if not failures else 'FAIL','mother_documents':report,'mother_section_total':len(all_uids),'current_policy_components':len(files),'acpos_profile_steps':len(prof.get('stages') or []),'failures':failures}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if failures: raise SystemExit(1)
          PY
          git diff --name-only HEAD -- governance/test/stage01 | grep -q . && { echo 'STAGE01_MUTATED'; exit 1; } || true
          echo 'PASS: immutable Stage-01 baseline untouched'
      - name: Commit neutral portable governance without workflow mutation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOVERNANCE_CURRENT.yaml governance .github/governance-source
          git reset -- .github/workflows || true
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "governance(spec): promote neutral portable mother policy v2.2.0" -m "Authorization: USR-DIRECTIVE-20260915-MOTHER-SPEC-NEUTRALITY-AUDIT" -m "Separates reusable POLICY from ACPOS EXECUTION_PROFILE, removes fixed Stage/Test authority from Current policy, preserves the profile-local 11-step ACPOS contract, and adds portability/promotion-contamination controls."
          git push origin HEAD:rebuild-v2.1.1
