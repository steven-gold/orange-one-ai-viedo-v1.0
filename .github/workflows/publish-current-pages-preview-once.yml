name: Publish Current Pages To Existing Preview

on:
  push:
    branches:
      - new
    paths:
      - .github/workflows/publish-current-pages-preview-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current new
        uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build current source
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Start current production server
        run: |
          (npm run start -- -p 3010 > /tmp/acpos-preview-next.log 2>&1 & echo $! > /tmp/acpos-preview-next.pid)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3010/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/acpos-preview-next.log
          exit 1

      - name: Render current validated pages
        run: |
          set -euo pipefail
          rm -rf /tmp/acpos-preview-stage
          mkdir -p /tmp/acpos-preview-stage/_next/static
          cp -a .next/static/. /tmp/acpos-preview-stage/_next/static/
          mkdir -p /tmp/acpos-preview-stage/brand
          cp -a public/brand/. /tmp/acpos-preview-stage/brand/

          curl -fsS http://127.0.0.1:3010/assets   -o /tmp/acpos-preview-stage/assets.html
          curl -fsS http://127.0.0.1:3010/video    -o /tmp/acpos-preview-stage/video.html
          curl -fsS http://127.0.0.1:3010/edit     -o /tmp/acpos-preview-stage/edit.html
          curl -fsS http://127.0.0.1:3010/qa       -o /tmp/acpos-preview-stage/qa.html
          curl -fsS http://127.0.0.1:3010/database -o /tmp/acpos-preview-stage/db.html
          curl -fsS http://127.0.0.1:3010/strategy -o /tmp/acpos-preview-stage/strategy.html

          python3 <<'PY'
          from pathlib import Path

          route_map = {
              '/admin/qa-criteria': 'qa-criteria.html',
              '/admin/strategy': 'strategy-admin.html',
              '/admin/knowledge': 'knowledge-admin.html',
              '/admin/accounts': 'accounts.html',
              '/admin/system': 'system.html',
              '/admin/social': 'social.html',
              '/admin/aiapi': 'aiapi.html',
              '/admin/dev': 'dev.html',
              '/admin/erp': 'erp.html',
              '/database': 'db.html',
              '/strategy': 'strategy.html',
              '/assets': 'assets.html',
              '/video': 'video.html',
              '/edit': 'edit.html',
              '/core': 'core.html',
              '/info': 'info.html',
              '/qa': 'qa.html',
              '/': 'index.html',
          }

          for path in Path('/tmp/acpos-preview-stage').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('href="/_next/', 'href="./_next/')
              text = text.replace('src="/_next/', 'src="./_next/')
              text = text.replace('href="/brand/', 'href="brand/')
              text = text.replace('src="/brand/', 'src="brand/')
              for route, target in sorted(route_map.items(), key=lambda item: len(item[0]), reverse=True):
                  text = text.replace(f'href="{route}"', f'href="{target}"')
              path.write_text(text, encoding='utf-8')
          PY

          kill "$(cat /tmp/acpos-preview-next.pid)" || true

      - name: Checkout existing correct preview branch
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          path: publish
          fetch-depth: 0

      - name: Replace only current validated page exports
        run: |
          set -euo pipefail
          before_index=$(git -C publish hash-object preview/index.html)
          before_core=$(git -C publish hash-object preview/core.html)

          cp /tmp/acpos-preview-stage/assets.html publish/preview/assets.html
          cp /tmp/acpos-preview-stage/video.html publish/preview/video.html
          cp /tmp/acpos-preview-stage/edit.html publish/preview/edit.html
          cp /tmp/acpos-preview-stage/qa.html publish/preview/qa.html
          cp /tmp/acpos-preview-stage/db.html publish/preview/db.html
          cp /tmp/acpos-preview-stage/strategy.html publish/preview/strategy.html
          mkdir -p publish/preview/_next/static
          cp -a /tmp/acpos-preview-stage/_next/static/. publish/preview/_next/static/

          after_index=$(git -C publish hash-object preview/index.html)
          after_core=$(git -C publish hash-object preview/core.html)
          test "$before_index" = "$after_index"
          test "$before_core" = "$after_core"
          echo "PREVIEW_LOCKED_PAGES_UNCHANGED index=$after_index core=$after_core"

      - name: Commit to existing preview branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets.html preview/video.html preview/edit.html preview/qa.html preview/db.html preview/strategy.html preview/_next/static
          if git diff --cached --quiet; then
            echo "PREVIEW_ALREADY_CURRENT"
            exit 0
          fi
          git commit -m "sync(preview): publish current ASSET VIDEO EDIT QA DB STR pages"
          git push origin HEAD:acpos-live-preview
          echo "PREVIEW_PUBLISHED_COMMIT=$(git rev-parse HEAD)"

      - name: Verify preview branch scope
        run: |
          set -euo pipefail
          cd publish
          git fetch origin acpos-live-preview
          git diff --name-only HEAD^ HEAD | tee /tmp/preview-files.txt
          if grep -Eq '^preview/index\.html$|^preview/core\.html$' /tmp/preview-files.txt; then
            echo "LOCKED_PREVIEW_PAGE_CHANGED"
            exit 1
          fi
          echo "PREVIEW_SCOPE_PASS"
