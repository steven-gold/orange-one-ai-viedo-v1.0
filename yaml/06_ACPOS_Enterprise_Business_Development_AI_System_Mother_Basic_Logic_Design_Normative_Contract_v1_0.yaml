  - index: 9
    style: Heading 1
    text: 0. 文件身份與使用方式
  - index: 10
    style: Normal
    text: 本文件定義 ACPOS 企業自動開發 AI 系統的系統級母設計。它不是單一 DEV-01 頁面說明，也不是 Email 供應商操作手冊；它規定企業商機如何被發現、驗證、去重、評估、個人化、合規審查、形成 Campaign、拆成每位收件者的獨立 Delivery，並將 Reply / Outcome /
      Revenue / Experience 回寫成可追溯閉環。
  - index: 12
    style: Heading 1
    text: 1. Purpose / Scope / Out-of-Scope
  - index: 13
    style: Heading 2
    text: 1.1 Purpose
  - index: 14
    style: List Bullet
    text: 把公開市場訊號轉成可驗證的企業商機，而不是把網路文字直接當成 Lead Truth。
  - index: 15
    style: List Bullet
    text: 建立唯一 Company Master 與可追溯 Contact Evidence，避免同一公司、同一聯絡點、同一 Campaign 形成第二套資料。
  - index: 16
    style: List Bullet
    text: 讓 AI 個人化內容只使用 Evidence-supported fact；推論必須顯式標示為 inference。
  - index: 17
    style: List Bullet
    text: 把合規、Suppression、Unsubscribe、寄送政策、Rate、Schedule、Approval 變成 effectful delivery 前的硬 Gate。
  - index: 18
    style: List Bullet
    text: 允許 Campaign-level 大量操作，但每個外寄 Email envelope 永遠保持 exactly one To，CC/BCC empty。
  - index: 19
    style: List Bullet
    text: 建立 Reply → Human Owner → Meeting → Proposal → Negotiation → Won/Lost → Revenue Attribution → Experience 的閉環。
  - index: 20
    style: Heading 2
    text: 1.2 In Scope / Out-of-Scope
  - index: 22
    style: Heading 1
    text: 2. Authority Inheritance / Owner Boundary
  - index: 23
    style: Normal
    text: AI-06 MUST follow ONE CONCEPT / ONE OWNER / REFERENCE, DO NOT COPY. Existing Company Master, Contact, Campaign, Delivery, Suppression, Evidence, shared
      acquisition and audit owners MUST be reused. A missing UI or missing binding is not permission to create another Company DB, Audience DB, BulkSend service,
      crawler, Evidence store or Suppression engine.
  - index: 26
    style: Normal
    text: 圖 1｜Enterprise Business Development Lifecycle。
