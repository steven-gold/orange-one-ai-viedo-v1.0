name: Source Package Successor Validation
on:
  push:
    branches:
      - governance-source-v2.2.33-candidate
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-package-successor-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Validate unsigned source-package successor
        run: |
          set -euo pipefail
          test "$(python -c "import yaml; d=yaml.safe_load(open('governance/source-successor/SOURCE_PACKAGE_CANDIDATE.yaml')) or {}; print(d.get('status'))")" = "UNSIGNED_NOT_CURRENT"
          python governance/source-successor/materialize_derived_source_package.py --check
          python governance/source-successor/refresh_source_checksums.py --check
          python governance/ci/validate_source_package_candidate.py
      - name: Diagnose mandatory regression failures
        if: failure()
        run: |
          python .github/governance-source/active/source/09_TESTS/governance/test_high_pressure_hardening.py || true
