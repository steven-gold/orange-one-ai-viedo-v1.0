name: SYS-01 page validation once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/sys01-validation-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Scope and Authority guards
        shell: bash
        run: |
          set -euo pipefail
          BASE=45bc9fd015a3a6f15bec7d3aab680a768a7620bd
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(src/app/admin/system/page\.tsx|src/components/pages/SystemVisual\.tsx|src/domain/system/systemProjectionPort\.ts|src/domain/system/systemRuntimeContract\.ts|\.github/workflows/sys01-validation-once\.yml)$'; then
            echo 'SYS-01 scope pollution detected' >&2
            exit 1
          fi
          test "$(git hash-object src/components/pages/SystemVisual.module.css)" = "678d702d890892dffb78526b9fb386ad3add6ca5"
          test -z "$(git diff --name-only "$BASE" HEAD -- src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css)"
          AUTH=authority/pages/admin/SYS-01/ACPOS_SYS-01_SYSTEM_LIFECYCLE_AI_FINAL_DESIGN_ENCODING.yaml
          grep -q 'page_uid: admin:SYS-01' "$AUTH"
          grep -q 'status: FINAL_LOCKED' "$AUTH"
          grep -q 'implementation_status: NOT_EXECUTED' "$AUTH"
          grep -q 'canonical_section_count: 8' "$AUTH"
          grep -q '  count: 12' "$AUTH"
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/domain/system/systemRuntimeContract.ts','utf8');
          const controls=[
            'SYS-01-BTN-SINGLE-AI','SYS-01-BTN-MULTI-AI','SYS-01-BTN-COUNCIL-DISCUSSION','SYS-01-BTN-COUNCIL-PARALLEL',
            'SYS-01-INP-MESSAGE','SYS-01-BTN-ATTACH','SYS-01-BTN-SEND','SYS-01-BTN-STOP',
            'SYS-01-BTN-CANDIDATE-CREATE','SYS-01-BTN-CR-CREATE','SYS-01-BTN-NAV-OPEN','SYS-01-BTN-SANDBOX-TEST'
          ];
          for(const id of controls) if(!src.includes(`control_uid: "${id}"`)) throw new Error(`missing registry ${id}`);
          if((src.match(/control_uid: "SYS-01-/g)||[]).length!==12) throw new Error('registry is not exactly 12 controls');
          console.log('SYS01_AUTHORITY_GUARD_PASS');
          NODE
      - name: Runtime truth guard
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git grep -n 'configureSystemLifecycleRuntime' -- src || true)
          echo "$refs"
          test "$(printf '%s\n' "$refs" | grep -c 'src/server/system/systemLifecycleRuntime.ts' || true)" = "1"
          refs=$(git grep -n 'configureSystemConversationAttachmentBinding' -- src || true)
          echo "$refs"
          test "$(printf '%s\n' "$refs" | grep -c 'src/server/system/systemConversationBindings.ts' || true)" = "1"
          test -z "$(find src/app/v1 -type f -name 'route.ts' -print | grep '/system/' || true)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build exact current head
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
      - name: Product residue guard
        shell: bash
        run: |
          set -euo pipefail
          files=(src/app/admin/system/page.tsx src/components/pages/SystemVisual.tsx src/domain/system/systemProjectionPort.ts src/domain/system/systemRuntimeContract.ts)
          if grep -En '(TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|@ts-expect-error|debugger|console\.(log|debug))' "${files[@]}"; then
            echo 'SYS-01 product residue detected' >&2
            exit 1
          fi
      - name: Install temporary Chromium tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Production browser validation
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/sys01-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/sys01-next.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/system >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const businessRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(r.method()!=='GET'&&u.pathname.startsWith('/v1/'))businessRequests.push(`${r.method()} ${u.pathname}`);});
            await page.goto('http://127.0.0.1:3000/admin/system',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:SYS-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:SYS-01"]')?.getAttribute('data-projection-status')==='BLOCKED',{timeout:15000});
            assert.equal(await root.getAttribute('data-authority-status'),'FINAL_LOCKED');
            assert.equal(await root.getAttribute('data-authority-sections'),'8');
            assert.equal(await root.getAttribute('data-authority-controls'),'12');
            assert.equal(await root.getAttribute('data-implementation-status'),'NOT_EXECUTED');
            assert.equal(await root.getAttribute('data-projection-status'),'BLOCKED');
            assert.equal(await root.getAttribute('data-projection-reason'),'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.equal(await root.getAttribute('data-system-context-resolved'),'false');
            assert.equal(await root.getAttribute('data-active-conversation-context-resolved'),'false');
            assert.equal(await root.getAttribute('data-mode-gate-ready'),'false');
            assert.equal(await root.getAttribute('data-multi-ai-route-ready'),'false');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert.equal(await root.getAttribute('data-ai-mode'),'SINGLE_AI');
            assert.equal(await page.locator('[data-section-id^="SEC-ADMIN-SYS-01-"]').count(),8);
            const controls=page.locator('[data-control-id^="SYS-01-"]');
            assert.equal(await controls.count(),12);
            for(let i=0;i<12;i++){
              const node=controls.nth(i);
              assert(await node.getAttribute('data-action-uid'));
              assert(await node.getAttribute('data-permission-uid'));
              assert(await node.getAttribute('data-enabled-in-visual-phase'));
            }
            const single=page.locator('#SYS-01-BTN-SINGLE-AI');
            const multi=page.locator('#SYS-01-BTN-MULTI-AI');
            assert.equal(await single.isDisabled(),true);
            assert.equal(await multi.isDisabled(),true);
            assert.equal(await single.getAttribute('data-blocked-error-uid'),'SYS-01-ERR-AI-MODE-CONTEXT');
            assert.equal(await multi.getAttribute('data-blocked-error-uid'),'SYS-01-ERR-AI-MODE-CONTEXT');
            await multi.evaluate(el=>el.click());
            assert.equal(await root.getAttribute('data-ai-mode'),'SINGLE_AI');
            assert.equal(await page.locator('[aria-label="Council Mode"]').isHidden(),true);
            const input=page.locator('#SYS-01-INP-MESSAGE');
            assert.equal(await input.isDisabled(),false);
            await input.fill('SYS-01 local draft verification');
            assert.equal(await input.inputValue(),'SYS-01 local draft verification');
            assert.equal(await root.getAttribute('data-ai-mode'),'SINGLE_AI');
            for(const id of ['SYS-01-BTN-ATTACH','SYS-01-BTN-SEND','SYS-01-BTN-STOP','SYS-01-BTN-CANDIDATE-CREATE','SYS-01-BTN-CR-CREATE','SYS-01-BTN-NAV-OPEN','SYS-01-BTN-SANDBOX-TEST']){
              assert.equal(await page.locator(`#${id}`).isDisabled(),true,`${id} must remain fail-closed`);
            }
            const api=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3ASYS-01');return{status:r.status,body:await r.json()};});
            assert.equal(api.status,503);
            assert.equal(api.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.deepEqual(businessRequests,[]);
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('SYS01_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('SYS01_BROWSER_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Final tree guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/components/pages/SystemVisual.module.css)" = "678d702d890892dffb78526b9fb386ad3add6ca5"
          test -z "$(git status --porcelain package.json package-lock.json src/components/pages/SystemVisual.module.css)"
