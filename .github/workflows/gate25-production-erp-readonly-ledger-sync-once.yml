name: ACPOS Gate25 ERP Production Readonly Acceptance Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-production-erp-readonly-ledger-sync-once.yml'

permissions:
  contents: write

jobs:
  erp-readonly:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_EXPECT_RELEASE_SHA: 608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Install browser audit dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Execute exact 14 mapped ERP Production read-only controls
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/erp-readonly.mjs" <<'NODE'
          import { chromium } from "playwright";
          const base=(process.env.ACPOS_DEPLOYMENT_URL??"").replace(/\/$/,"");
          const email=(process.env.ACPOS_PRODUCTION_E2E_EMAIL??"").trim();
          const password=process.env.ACPOS_PRODUCTION_E2E_PASSWORD??"";
          const expectedSha=(process.env.ACPOS_EXPECT_RELEASE_SHA??"").trim();
          const targets=[
            ["CTRL-ADMIN-ERP-01-CONNECTOR-OPEN","ERP-01-FLD-CONN-CONNECTOR-ID","connector"],
            ["CTRL-ADMIN-ERP-01-SNAPSHOT-OPEN","ERP-01-FLD-SNAPSHOT","finance"],
            ["CTRL-ADMIN-ERP-01-FRESHNESS-OPEN","ERP-01-FLD-FRESHNESS","finance"],
            ["CTRL-ADMIN-ERP-01-CURRENCY-TIMEZONE-OPEN","ERP-01-FLD-SYNC-CURRENCY-TIMEZONE","sync"],
            ["CTRL-ADMIN-ERP-01-COMPLETENESS-OPEN","ERP-01-FLD-SYNC-COMPLETENESS","sync"],
            ["CTRL-ADMIN-ERP-01-FAILURE-OPEN","ERP-01-FLD-SYNC-FAILURE-ID","sync"],
            ["CTRL-ADMIN-ERP-01-AUDIT-OPEN","ERP-01-FLD-AUDIT-REF","rail"],
            ["CTRL-ADMIN-ERP-02-COST-OPEN","ERP-01-FLD-FIN-COST","finance"],
            ["CTRL-ADMIN-ERP-02-REVENUE-OPEN","ERP-01-FLD-FIN-REVENUE","finance"],
            ["CTRL-ADMIN-ERP-02-CASHFLOW-OPEN","ERP-01-FLD-FIN-CASHFLOW","finance"],
            ["CTRL-ADMIN-ERP-02-CAPACITY-OPEN","ERP-01-FLD-FIN-CAPACITY","finance"],
            ["CTRL-ADMIN-ERP-02-FORECAST-OPEN","ERP-01-FLD-FIN-FORECAST","finance"],
            ["CTRL-ADMIN-ERP-02-GUARDRAILS-OPEN","ERP-01-FLD-FIN-GUARDRAILS","finance"],
            ["CTRL-ADMIN-ERP-02-RECOMMENDATION-BOUNDARY-OPEN","ERP-01-FLD-FIN-RECOMMENDATION-BOUNDARY","finance"],
          ];
          const tab={finance:"ERP-01-BTN-TAB-FINANCE",connector:"ERP-01-BTN-TAB-CONNECTOR",sync:"ERP-01-BTN-TAB-SYNC"};
          function assert(v,m){if(!v)throw new Error(m)}
          function headers(){const s=process.env.VERCEL_AUTOMATION_BYPASS_SECRET;return s?{"x-vercel-protection-bypass":s}:{}}
          assert(base&&email&&password&&expectedSha,"GATE25_ERP_REQUIRED_ENV_MISSING");
          assert(targets.length===14,"GATE25_ERP_TARGET_COUNT_INVALID");
          const health=await fetch(`${base}/health`,{cache:"no-store",headers:headers()});
          const healthBody=await health.json().catch(()=>null);
          assert(health.status===200,`GATE25_ERP_HEALTH_HTTP_${health.status}`);
          assert(healthBody?.environment==="production","GATE25_ERP_ENVIRONMENT_NOT_PRODUCTION");
          assert(healthBody?.release_sha===expectedSha,`GATE25_ERP_RELEASE_SHA_MISMATCH_${healthBody?.release_sha??"MISSING"}`);
          const browser=await chromium.launch({headless:true});
          let context;
          const evidence=[];
          try{
            context=await browser.newContext({extraHTTPHeaders:headers()});
            const login=await context.request.post(`${base}/v1/identity/session`,{headers:{"content-type":"application/json","x-correlation-id":crypto.randomUUID()},data:{email,password}});
            const loginBody=await login.json().catch(()=>null);
            assert(login.status()===200,`GATE25_ERP_LOGIN_HTTP_${login.status()}`);
            assert(loginBody?.ok===true&&loginBody?.logged_in===true,"GATE25_ERP_LOGIN_BODY_INVALID");
            const projection=await context.request.get(`${base}/v1/ui-projections/admin%3AERP-01`,{headers:{"x-correlation-id":crypto.randomUUID()}});
            const projectionBody=await projection.json().catch(()=>null);
            assert(projection.status()===200,`GATE25_ERP_PROJECTION_HTTP_${projection.status()}`);
            assert(!projectionBody?.test_metadata,"GATE25_ERP_SYNTHETIC_PROJECTION_FORBIDDEN");
            const page=await context.newPage({viewport:{width:1440,height:1400}});
            const runtimeErrors=[];
            page.on("pageerror",e=>runtimeErrors.push(e.message));
            const nav=await page.goto(`${base}/admin/erp`,{waitUntil:"networkidle",timeout:45000});
            assert(nav?.ok(),`GATE25_ERP_NAV_HTTP_${nav?.status()}`);
            const root=page.locator('[data-page-uid="admin:ERP-01"]');
            await root.waitFor({state:"visible",timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:ERP-01"]')?.getAttribute('data-page-state')!=="LOADING",{timeout:15000});
            const pageState=await root.getAttribute("data-page-state");
            assert(pageState!=="ERROR",`GATE25_ERP_PAGE_STATE_${pageState}`);
            let active="finance";
            for(const [sourceId,currentId,view] of targets){
              if(view!=="rail"&&active!==view){
                const b=page.locator(`[data-control-id="${tab[view]}"]`).first();
                await b.waitFor({state:"visible",timeout:10000});
                assert(await b.isEnabled(),`GATE25_ERP_TAB_DISABLED_${view}`);
                await b.click(); active=view;
              }
              const node=page.locator(`[data-control-id="${currentId}"]`).first();
              await node.waitFor({state:"visible",timeout:10000});
              const text=((await node.textContent())??"").trim();
              assert(text.length>0,`GATE25_ERP_CURRENT_CONTROL_EMPTY_${currentId}`);
              evidence.push({resource_key:`control:${sourceId}`,source_control_id:sourceId,current_control_id:currentId,current_view:view,route:"/admin/erp",projection_http:projection.status(),page_state:pageState,current_control_visible:true,synthetic_projection:false,outcome:"PASS"});
            }
            assert(runtimeErrors.length===0,`GATE25_ERP_RUNTIME_ERRORS_${runtimeErrors.join("|")}`);
            assert(evidence.length===14,"GATE25_ERP_EVIDENCE_COUNT_INVALID");
            const logout=await context.request.delete(`${base}/v1/identity/session`,{headers:{"x-correlation-id":crypto.randomUUID()}});
            const logoutBody=await logout.json().catch(()=>null);
            assert(logout.status()===200,`GATE25_ERP_LOGOUT_HTTP_${logout.status()}`);
            assert(logoutBody?.ok===true&&logoutBody?.logged_in===false,"GATE25_ERP_LOGOUT_BODY_INVALID");
            console.log(`GATE25_ERP_READONLY_PRODUCTION_PASS resources=${evidence.length} release_sha=${expectedSha}`);
            console.log(`GATE25_ERP_READONLY_PRODUCTION_EVIDENCE ${JSON.stringify(evidence)}`);
          }finally{if(context)await context.close().catch(()=>{});await browser.close();}
          NODE
          node "$RUNNER_TEMP/erp-readonly.mjs" | tee "$RUNNER_TEMP/erp-readonly.log"

      - name: Materialize exact per-resource PASS evidence and synchronize ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          log=Path(os.environ['RUNNER_TEMP'])/'erp-readonly.log'
          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_ERP_PRODUCTION_READONLY_EXECUTION_2026-09-10.json')
          prefix='GATE25_ERP_READONLY_PRODUCTION_EVIDENCE '
          payload=[x for x in log.read_text().splitlines() if x.startswith(prefix)]
          assert len(payload)==1, f'expected one ERP evidence payload, got {len(payload)}'
          resources=json.loads(payload[0][len(prefix):])
          assert len(resources)==14 and len({r['resource_key'] for r in resources})==14
          assert all(r['outcome']=='PASS' and r['projection_http']==200 and r['current_control_visible'] and not r['synthetic_projection'] for r in resources)
          ledger=json.loads(ledger_path.read_text())
          entries={e['resource_key']:e for e in ledger['entries']}
          before=dict(ledger['counts'])
          for r in resources:
            assert r['resource_key'] in entries, f'missing ledger entry: {r["resource_key"]}'
            assert entries[r['resource_key']]['disposition']=='NOT_EXECUTED', f'{r["resource_key"]} expected NOT_EXECUTED, got {entries[r["resource_key"]]["disposition"]}'
          evidence={
            'document_id':'ACPOS_GATE25_ERP_PRODUCTION_READONLY_EXECUTION','status':'PASS','executed_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':os.environ['ACPOS_EXPECT_RELEASE_SHA'],'deployment_url':os.environ['ACPOS_DEPLOYMENT_URL'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'resource_count':14,'mutation_count':0,
            'mapping_authority':'src/domain/erp/erpRuntimeContract.ts','resources':resources,
            'rule':'PASS applies only to these exact formal ERP read-only controls after authenticated Production projection HTTP 200, exact ERP_SOURCE_CONTROL_MAP Current target visibility, non-error Current page state, no synthetic projection, no browser runtime error, and zero mutation.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          run_ref=f'GitHub Actions: ACPOS Gate25 ERP Production Readonly Acceptance run_id={os.environ["GITHUB_RUN_ID"]}'
          for r in resources:
            e=entries[r['resource_key']]; e['disposition']='PASS'; e['reason_code']='PRODUCTION_CURRENT_MAPPED_READONLY_PROJECTION_PASS';
            e['evidence_refs']=[str(evidence_path),run_ref,'src/domain/erp/erpRuntimeContract.ts','src/components/pages/ErpVisual.tsx'];
            e['blocker_detail']=None; e['operation_ids']=['getUiProjection',r['current_control_id']]
          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for e in ledger['entries']: counts[e['disposition']]+=1
          assert sum(counts.values())==1481
          assert counts['PASS']==before['PASS']+14 and counts['BLOCKED']==before['BLOCKED'] and counts['NOT_EXECUTED']==before['NOT_EXECUTED']-14
          ledger['counts']=counts; ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':14},ensure_ascii=False))
          PY

      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs

      - name: Commit ERP evidence and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_ERP_PRODUCTION_READONLY_EXECUTION_2026-09-10.json
          git rm .github/workflows/gate25-production-erp-readonly-ledger-sync-once.yml
          git commit -m 'evidence(gate25): pass 14 ERP Production readonly controls'
          git push origin HEAD:new
