  - index: 65
    style: List Bullet
    text: 不得將 Conversation / AI Response / Search Result 直接寫成 Approved Knowledge。
  - index: 66
    style: List Bullet
    text: 不得在 KB-01 建立第二套 crawler、Context Engine、Experience Engine、Learning Engine、INFO Search DB 或 Provider Picker。
  - index: 67
    style: List Bullet
    text: 不得讓 Context Candidate 在 KB-01 直接變成 Consumer Domain 的 Adopted Context。
  - index: 68
    style: List Bullet
    text: 不得人工建立假的 Experience / Outcome / Cost / Provider / QA Result。
  - index: 69
    style: List Bullet
    text: 不得將 Learning Candidate 自動改寫 Canon、Criteria、Permission 或 RoutePolicy。
  - index: 70
    style: List Bullet
    text: 不得顯示或保存 raw secret；只使用 Secret Reference / registered connector。
  - index: 71
    style: List Bullet
    text: 不得以 latest/current/default alias 做 effectful versioned write；必須綁 exact ID/version。
  - index: 72
    style: List Bullet
    text: 不得因 UI 已畫出控制就宣稱 API/DB/Runtime/E2E/Deploy 已完成。
