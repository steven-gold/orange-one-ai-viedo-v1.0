name: Product Stage01 Successor Execute
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Operator note for successor/re-entry execution
        required: false
        default: manual
jobs:
  execute:
    uses: ./.github/workflows/product-stage-successor-execute-reusable.yml
    with:
      stage: STAGE-01
      work_units: WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001,WU-STAGE01-WB01-DASHBOARD-REENTRY-001
    secrets: inherit
