name: ACPOS Batch 48 System06 Enterprise ERP Contract Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch48-system06-enterprise-erp-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 47 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="56e176cc30f43b8c3f9d021bee173103669de483"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH47 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 48 System06 contract audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch48_system06_enterprise_erp_contract_audit.py

      - name: Verify Batch 48 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch48_system06_contract_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["system06_cells"]==49,s
          assert s["unique_controls"]>0 and s["operations"]>0,s
          assert sum(s["by_field"].values())==49,s
          print("PASS: BATCH48 SYSTEM06 DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 48 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch48-system06-enterprise-erp-contract-audit
          path: |
            __batch48_system06_contract_audit.json
            __batch48_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 48 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch48_system06_contract_audit.json __batch48_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-48-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch48_system06_enterprise_erp_contract_audit.py .github/workflows/acpos_batch48_system06_enterprise_erp_contract_audit.yml
          git commit -m "chore(acpos): close batch 48 system06 contract audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH48 HARNESS REMOVED / CLEAN TREE"
