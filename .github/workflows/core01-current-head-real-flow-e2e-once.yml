name: CORE01 Current Head Real Flow E2E Once
on:
  push:
    branches: [new]
    paths:
      - .github/workflows/core01-current-head-real-flow-e2e-once.yml
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - name: Assert workflow-only repository change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/core01-current-head-real-flow-e2e-once.yml"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          echo PRODUCT_UNCHANGED_BEFORE_TEST

      - name: Runner-only permission authorization override
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/domain/core/coreCreationPermissionAdapter.ts')
          s=p.read_text()
          old='if (!current) return { allowed: false, reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND", required_permission_uid };'
          new='if (!current) return { allowed: true, required_permission_uid };'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('src/server/testing/controlledCoreTestRuntime.ts')
          s=p.read_text()
          old='''    authorize: async (request) => {\n      if (request.port_uid === "CORE-01-PORT-PROJECT-CREATE" || request.port_uid === "CORE-01-PORT-TOPIC-CREATE") {\n        return { allowed: false, reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND" };\n      }\n      return { allowed: true };\n    },\n'''
          new='''    authorize: async () => ({ allowed: true }),\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          echo RUNNER_ONLY_AUTH_OVERRIDE_READY

      - name: Install compile and security check
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json >/tmp/audit.json || true
          node - <<'NODE'
          const a=require('/tmp/audit.json');
          if(a.metadata.vulnerabilities.total!==0){console.error(a.metadata.vulnerabilities);process.exit(1)}
          console.log('AUDIT_ZERO_PASS')
          NODE
          npm run typecheck
          npm run build
          echo BUILD_PASS

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Next
        shell: bash
        run: |
          nohup npm run start -- -p 3000 >/tmp/core01-current-head-next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/core >/dev/null && exit 0; sleep 1; done
          cat /tmp/core01-current-head-next.log
          exit 1

      - name: Real browser Project Topic and full control flow
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const A=(v,m)=>{if(!v)throw new Error(m)};
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({permissions:['clipboard-read','clipboard-write']});
            const p=await c.newPage();
            const errors=[],fails=[],controls=new Set(),actions=new Set();
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('requestfailed',r=>fails.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            const cap=async()=>{
              for(const x of await p.locator('[data-control-id]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-control-id')).filter(Boolean)))controls.add(x);
              for(const x of await p.locator('[data-action-uid]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-action-uid')).filter(Boolean)))actions.add(x);
            };
            const click=async id=>{const n=p.locator(`[data-control-id="${id}"]`).first();await n.waitFor({state:'visible'});A(await n.isEnabled(),`${id} disabled`);await n.click()};
            const text=async(s,t)=>p.waitForFunction(([a,b])=>(document.querySelector(a)?.textContent||'').includes(b),[s,t]);
            const reason=async x=>p.waitForFunction(v=>(document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')||'').startsWith(v),x);
            const snapshot=async label=>{
              const buttons=await p.locator('button[data-control-id]').evaluateAll(ns=>ns.map(n=>({id:n.getAttribute('data-control-id'),disabled:n.disabled,action:n.getAttribute('data-action-uid'),runtime:n.getAttribute('data-runtime-binding')})));
              const projectOptions=await p.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count();
              const topicOptions=await p.locator('[data-control-id="CORE-01-CTL-TOPIC"] option').count();
              const threadOptions=await p.locator('[data-control-id="CORE-01-LST-THREADS"] select option').count();
              const workOptions=await p.locator('[data-control-id="CORE-01-LST-WORK-ITEMS"] select option').count();
              console.log(`STATE_${label}=${JSON.stringify({projectOptions,topicOptions,threadOptions,workOptions,buttons})}`);
            };
            const menu=async()=>{const n=p.locator('[data-message-role="USER"]').first();await n.waitFor({state:'visible'});await n.click({button:'right'});await p.locator('[data-component-uid="CORE-01-CMP-MESSAGE-MENU"] [data-control-id="CORE-01-MENU-QUOTE"]').waitFor({state:'visible'});await cap()};

            await p.goto('http://127.0.0.1:3000/core',{waitUntil:'networkidle'});
            await p.locator('[data-page-uid="CORE-01"][data-page-state="READY"]').waitFor();
            await cap();
            await snapshot('EMPTY');

            await click('CORE-01-BTN-PROJECT-CREATE');
            await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-CTL-PROJECT"] option').length>1);
            await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','[TEST] DRAFT');
            await snapshot('PROJECT_CREATED');

            await click('CORE-01-BTN-PROJECT-VALIDATE');
            await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','VALIDATED');
            await click('CORE-01-BTN-PROJECT-CONFIRM');
            await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','CORE_MODELING');
            await click('CORE-01-BTN-STORY-CANDIDATE');
            await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','TEST-STORY-SET-');

            await click('CORE-01-BTN-NEW-THREAD');
            await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-LST-THREADS"] select option').length>1);
            await click('CORE-01-BTN-MULTI-AI'); await reason('AI_MODE=MULTI');
            await click('CORE-01-BTN-SINGLE-AI'); await reason('AI_MODE=SINGLE');
            await click('CORE-01-BTN-ASSISTANT-RECORD'); await p.locator('[data-assistant-record-overlay="true"]').waitFor(); await click('CORE-01-BTN-ASSISTANT-RECORD');
            await click('CORE-01-BTN-ATTACHMENT'); await reason('ATTACHMENT_ATTACHED:TEST-CORE-ATTACHMENT-');
            await click('CORE-01-BTN-REFERENCE'); await reason('REFERENCE_ATTACHED:TEST-CORE-REFERENCE-');
            await p.locator('[data-control-id="CORE-01-FLD-MESSAGE"]').fill('@Assistant current head real flow');
            await click('CORE-01-BTN-SEND');
            await p.locator('[data-message-role="USER"]').waitFor();
            await p.locator('[data-message-role="SIMULATED_AI"]').waitFor();
            await text('[data-control-id="CORE-01-FLD-ASSISTANT-SUMMARY"]','SIMULATED_EXTERNAL');

            await menu(); await click('CORE-01-MENU-QUOTE'); await reason('MESSAGE_QUOTED:TEST-MSG-');
            await menu(); await click('CORE-01-MENU-CONTINUE'); await reason('MESSAGE_CONTEXT_CONTINUED:TEST-MSG-');
            await menu(); await click('CORE-01-MENU-DECISION'); await reason('DECISION_EVIDENCE_ADDED:TEST-MSG-');
            await menu(); await click('CORE-01-MENU-COPY'); await reason('MESSAGE_COPIED:TEST-MSG-');
            await menu(); let n=await p.locator('[data-message-role="SIMULATED_AI"]').count(); await click('CORE-01-MENU-ANALYZE'); await p.waitForFunction(x=>document.querySelectorAll('[data-message-role="SIMULATED_AI"]').length>x,n);
            await menu(); await click('CORE-01-MENU-BRANCH'); await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-LST-THREADS"] select option').length>=3); A(await p.locator('[data-message-role]').count()===0,'branch history leak');

            await p.locator('[data-control-id="CORE-01-FLD-HUMAN-DECISION"]').fill('TEST decision');
            await click('CORE-01-BTN-CANDIDATE-CREATE'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','CANDIDATE');
            await click('CORE-01-BTN-CANDIDATE-COMPARE'); await text('[data-candidate-compare-read-model="true"]','[TEST] Compared 1 exact candidate');
            await click('CORE-01-BTN-RETURN-MODIFY'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','RETURNED');
            await click('CORE-01-BTN-CANDIDATE-CREATE'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','CANDIDATE');
            await click('CORE-01-BTN-CANDIDATE-CONFIRM'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','ACCEPTED');

            await click('CORE-01-BTN-DNA-LOCK'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','DNA_LOCK_REVIEW_REQUESTED');
            await click('CORE-01-BTN-CORE-REVIEW'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','CORE_REVIEW_REQUESTED');
            await click('CORE-01-BTN-PROJECT-LOCK'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','MOTHER_LOCK_REVIEW_REQUESTED');

            await click('CORE-01-BTN-TOPIC-CREATE');
            await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-CTL-TOPIC"] option').length>1);
            await text('[data-control-id="CORE-01-FLD-PAGE-MODE"]','TOPIC_PRODUCTION');
            await snapshot('TOPIC_CREATED');

            await click('CORE-01-BTN-BLUEPRINT-CREATE'); await text('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]','BLUEPRINT_DRAFT');
            await click('CORE-01-BTN-BLUEPRINT-VALIDATE'); await text('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]','BLUEPRINT_REVIEW');
            await click('CORE-01-BTN-BLUEPRINT-APPROVE'); await text('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]','READY_FOR_CHILD_REVIEW');
            await click('CORE-01-BTN-CHILD-LOCK'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','CHILD_LOCK_REVIEW_REQUESTED');
            await click('CORE-01-BTN-CANONICAL-SCRIPT'); await text('[data-control-id="CORE-01-FLD-PACKAGE"]','[TEST] Canonical Script Bound');

            await cap();
            A(controls.size===50,`controls ${controls.size}/50`);
            A(actions.size===34,`actions ${actions.size}/34`);
            A(errors.length===0,`page errors ${errors}`);
            A(fails.length===0,`request failures ${fails}`);
            console.log(`CORE01_CURRENT_HEAD_FULL_PASS controls=${controls.size} actions=${actions.size}`);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Restore runner and prove product tree unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/core01-current-head-real-flow-e2e-once.yml"
          echo PRODUCT_TREE_UNCHANGED_AFTER_TEST

      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          if [ -f .github/workflows/core01-current-head-real-flow-e2e-once.yml ]; then
            git rm -f .github/workflows/core01-current-head-real-flow-e2e-once.yml
            git commit -m "chore: remove CORE01 current head real flow E2E workflow"
            git push origin new
          fi
