name: ACPOS Batch 21 Exact UID Contract Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch21-exact-uid-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 20 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="a110c6510d4d460ada6eb20f1cf0b54b93017184"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH20 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 21 exact UID contract audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch21_exact_uid_transport_payload_persistence_audit.py

      - name: Verify Batch 21 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch21_exact_uid_applicability_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_cells"]==341,s
          assert (s["method_path"],s["payload_schema"],s["persistence_owner"])==(80,137,124),s
          assert s["exact_uid_unique_source"]+s["exact_uid_source_conflict"]+s["exact_uid_no_source"]==341,s
          print("PASS: BATCH21 EXACT UID DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 21 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch21-exact-uid-contract-audit
          path: |
            __batch21_exact_uid_applicability_audit.json
            __batch21_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 21 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch21_exact_uid_applicability_audit.json __batch21_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-21-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch21_exact_uid_transport_payload_persistence_audit.py .github/workflows/acpos_batch21_exact_uid_contract_audit.yml
          git commit -m "chore(acpos): close batch 21 exact UID contract audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH21 AUDIT HARNESS REMOVED / CLEAN TREE"
