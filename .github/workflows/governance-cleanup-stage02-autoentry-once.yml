name: Governance One-Shot Stage-02 Automatic Entrypoint Cleanup

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/governance-cleanup-stage02-autoentry-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install pyyaml

      - name: Sanitize Stage-02 workflow entrypoints and remove current test products
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import textwrap

          ROOT = Path('.')
          WORKFLOW_DIR = ROOT / '.github/workflows'
          ALLOWED = {'workflow_dispatch', 'workflow_call'}

          def sanitize_workflow(path: Path):
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              on_idx = None
              for i, line in enumerate(lines):
                  if re.match(r'^on\s*:', line):
                      on_idx = i
                      break
              if on_idx is None:
                  raise SystemExit(f'BLOCK: workflow has no on: block: {path}')

              rhs = lines[on_idx].split(':', 1)[1].strip()
              if rhs:
                  if rhs.startswith('[') and rhs.endswith(']'):
                      tokens = [x.strip().strip("'\"") for x in rhs[1:-1].split(',') if x.strip()]
                  else:
                      tokens = [rhs.strip().strip("'\"")]
                  kept = [x for x in tokens if x in ALLOWED] or ['workflow_dispatch']
                  lines = lines[:on_idx] + ['on:\n'] + [f'  {x}:\n' for x in kept] + lines[on_idx + 1:]
              else:
                  end = on_idx + 1
                  while end < len(lines):
                      raw = lines[end]
                      stripped = raw.strip()
                      if not stripped or stripped.startswith('#'):
                          end += 1
                          continue
                      if len(raw) - len(raw.lstrip(' ')) == 0:
                          break
                      end += 1
                  block = lines[on_idx + 1:end]
                  starts = []
                  for j, raw in enumerate(block):
                      m = re.match(r'^  ([A-Za-z0-9_-]+)\s*:', raw)
                      if m:
                          starts.append((j, m.group(1)))
                  kept_segments = []
                  for pos, (start, key) in enumerate(starts):
                      stop = starts[pos + 1][0] if pos + 1 < len(starts) else len(block)
                      if key in ALLOWED:
                          kept_segments.extend(block[start:stop])
                  if not kept_segments:
                      kept_segments = ['  workflow_dispatch:\n']
                  lines = lines[:on_idx + 1] + kept_segments + lines[end:]

              updated = ''.join(lines)
              path.write_text(updated, encoding='utf-8')
              return original != updated

          changed = []
          for pattern in ('stage02-*.yml', 'stage02-*.yaml'):
              for path in sorted(WORKFLOW_DIR.glob(pattern)):
                  if sanitize_workflow(path):
                      changed.append(path.as_posix())

          for residual in (ROOT / '.github/stage02-test', ROOT / 'governance/test/stage02'):
              if residual.exists():
                  shutil.rmtree(residual)

          validator = ROOT / 'governance/ci/validate_stage02_zero_residual.py'
          text = validator.read_text(encoding='utf-8')
          if '".github/stage02-test",' not in text:
              text = text.replace('FORBIDDEN = [\n', 'FORBIDDEN = [\n    ".github/stage02-test",\n', 1)

          if 'def stage02_workflow_triggers(path):' not in text:
              helper = textwrap.dedent(r'''
              def stage02_workflow_triggers(path):
                  import re
                  lines = path.read_text(encoding="utf-8").splitlines()
                  for i, line in enumerate(lines):
                      if not re.match(r"^on\s*:", line):
                          continue
                      rhs = line.split(":", 1)[1].strip()
                      if rhs:
                          if rhs.startswith("[") and rhs.endswith("]"):
                              return {x.strip().strip("'\"") for x in rhs[1:-1].split(",") if x.strip()}
                          return {rhs.strip().strip("'\"")}
                      triggers = set()
                      j = i + 1
                      while j < len(lines):
                          raw = lines[j]
                          stripped = raw.strip()
                          if not stripped or stripped.startswith("#"):
                              j += 1
                              continue
                          indent = len(raw) - len(raw.lstrip(" "))
                          if indent == 0:
                              break
                          m = re.match(r"^  ([A-Za-z0-9_-]+)\s*:", raw)
                          if m:
                              triggers.add(m.group(1))
                          j += 1
                      return triggers
                  return set()
              ''')
              text = text.replace('\ndef main():\n', '\n' + helper + '\ndef main():\n', 1)

          if 'STAGE2_WORKFLOW_AUTOMATIC_TRIGGER_RESIDUAL' not in text:
              needle = '    state = (ROOT / "00_SOURCE_INTAKE/fresh_run_003/EXECUTION_STATE.yaml").read_text(encoding="utf-8")\n'
              check = textwrap.dedent('''
                  allowed_stage02_triggers = {"workflow_dispatch", "workflow_call"}
                  workflow_dir = ROOT / ".github/workflows"
                  for workflow in sorted(list(workflow_dir.glob("stage02-*.yml")) + list(workflow_dir.glob("stage02-*.yaml"))):
                      triggers = stage02_workflow_triggers(workflow)
                      automatic = sorted(triggers - allowed_stage02_triggers)
                      if automatic:
                          return fail(f"STAGE2_WORKFLOW_AUTOMATIC_TRIGGER_RESIDUAL:{workflow.relative_to(ROOT)}:{','.join(automatic)}")
                      if not triggers:
                          return fail(f"STAGE2_WORKFLOW_EXPLICIT_TRIGGER_MISSING:{workflow.relative_to(ROOT)}")

              ''')
              check = textwrap.indent(check, '    ')
              if needle not in text:
                  raise SystemExit('BLOCK: zero-residual validator insertion owner not found')
              text = text.replace(needle, check + needle, 1)

          validator.write_text(text, encoding='utf-8')
          print(f'SANITIZED_WORKFLOW_COUNT={len(changed)}')
          PY
          git rm -r --ignore-unmatch .github/stage02-test governance/test/stage02

      - name: Validate cleanup workspace
        shell: bash
        run: |
          python governance/ci/validate_stage02_zero_residual.py
          python governance/ci/validate_profile_history_binding.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          if ! git diff --quiet -- .github/governance-source/active/source/12_DOCS/mother-spec governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml; then
            echo 'BLOCK: cleanup touched normative Mother/Current governance' >&2
            exit 1
          fi

      - name: Remove one-shot runner from candidate
        run: git rm .github/workflows/governance-cleanup-stage02-autoentry-once.yml

      - name: Create detached cleanup commit through Git database API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()

          def api(method, path, payload):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  data=json.dumps(payload).encode('utf-8'),
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD'])
          parts = raw.split(b'\0')
          entries = []
          i = 0
          changed_paths = []
          while i < len(parts) and parts[i]:
              status = parts[i].decode('utf-8')
              path = parts[i + 1].decode('utf-8')
              i += 2
              if status.startswith('R') or status.startswith('C'):
                  path2 = parts[i].decode('utf-8')
                  i += 1
                  raise SystemExit(f'BLOCK: unexpected rename/copy {status}: {path} -> {path2}')
              changed_paths.append(path)
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              data = Path(path).read_bytes()
              blob = api('POST', '/git/blobs', {'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'})
              mode_line = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).strip()
              mode = mode_line.split()[0] if mode_line else '100644'
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})

          if not entries:
              raise SystemExit('BLOCK: detached candidate has no changes')

          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'chore(stage02): remove automatic execution residue',
              'tree': tree['sha'],
              'parents': [base],
          })
          print(f'CANDIDATE_BASE_SHA={base}')
          print(f'CANDIDATE_TREE_SHA={tree["sha"]}')
          print(f'CANDIDATE_COMMIT_SHA={commit["sha"]}')
          print(f'CANDIDATE_CHANGED_PATHS={len(changed_paths)}')
          PY
