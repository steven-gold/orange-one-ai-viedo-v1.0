intro_rules:
- EDIT-01 整合後製剪輯工作台｜頁面設計與完整系統權威封板
- FINAL_FROZEN_HARD_LOCK｜CURRENT ONLY｜GLOBAL VISUAL INHERIT｜BLUEPRINT DRIVEN｜AUTO/MANUAL ORCHESTRATION｜STANDALONE EXCEPTION
- 本版唯一有效：圖 1 Final Layout / Layout Region / Section UID / Component UID / Control & Field UID / Action UID / Object UID / Stage UID / State UID
  / Transition UID / Error UID / Permission UID / Gate UID。任何歷史切版、平行視覺圖或舊配置不得合併回填。
- 圖 1｜EDIT-01 最終切版唯一視覺權威：功能區固定為 1 Context、2 Asset Binding、3 16:9 Preview、4 General Toolbar、5 Range/Marker、6 Multi-track Timeline、7 Semantic Correction、8
  Manual Micro-Adjustment、9 Inspector、10 Compare、11 Execution/Output。色彩只繼承 GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY。圖中具體資料僅為視覺示意，不得作為 Business Data；Runtime
  Real Data Only，缺值 = —。
- 圖像 UID 同步索引｜圖 1 的 1–11 區域必須與本文同版；任何區域位置、比例或責任變更都必須同步修改圖像與本文。
contracts:
  authority_priority:
  - item: EDIT 範圍最高權威
    definition: 本文件為 EDIT-01 頁面、視覺、功能、UID、控制、狀態、流程與封板 Gate 的最高權威。
  - item: current registered authority 使用方式
    definition: current registered authority 只允許補充與本文不衝突的既有系統識別、底層服務或共用治理。任何與本文不同的 EDIT 規則不得套用。
  - item: AI 白名單
    definition: AI 只可建立本文明確列出的 Section / Component / Field / Control / Action / State / Error / Transition / Permission Scope。未列出者=FORBIDDEN，不是「請
      AI 補齊」。
  - item: 缺口處理
    definition: 本文封板後若工程發現必要資料在本文件無 UID/契約：直接 BLOCK_BUILD + REPORT_AUTHORITY_CONFLICT；禁止自行命名、推測、複製其他頁面模式。
  - item: 同步規則
    definition: 展示圖、正文、Layout、UID 表與工程輸出必須同版；任一名稱/位置/尺寸/Token/UID/按鈕不一致 = BLOCK_VISUAL_CONTRACT。
  - item: 未授權替代結構
    definition: 任何未列於本版白名單的替代 Page、流程、Panel、切版、固定側欄、按鈕、視覺 Token、比較模式或導航結構一律禁止。
  page_authority:
  - item: Page UID
    definition: EDIT-01
  - item: Canonical Name
    definition: 整合後製剪輯工作台 / Integrated Post-Production Workspace
  - item: Route
    definition: 單一路由；所有後製功能同一頁；禁止建立任何功能子頁或平行後製頁
  - item: 核心目的
    definition: 讓使用者把影片後製工作完整做完，而非播放器或純預覽頁。
  - item: 合法 Source Mode
    definition: PROJECT_TASK / STANDALONE_UPLOAD（僅此兩種合法來源模式）
  - item: API/人工
    definition: AUTO/MANUAL 都由系統載入 Locked Blueprint Production Package；MANUAL 只改變「是否自動跨 Stage 前進」，不代表首次生產由人輸入腳本。人工 Timeline 編輯僅用於細節修正。
  - item: Project 非必填規則
    definition: 只有 STANDALONE_UPLOAD 不需要 Project / Topic / Task；PROJECT_TASK 必須由既有 Task/Handoff 進入。
  - item: 資料真實性
    definition: 所有版本、Job、Provider、Score、Evidence、Output 僅顯示真實資料；缺值 = —；禁止 Sample/Mock 業務資料。
  visual_layout:
  - item: Canonical Viewport
    definition: Desktop-first；1440×900 為視覺參考、最低 1280×720。Main Page Content 高度依內容延伸，可獨立垂直捲動；不得綁定 Global Menu / Sidebar 高度。
  - item: Visual Source
    definition: 唯一來源 = GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY；EDIT 不擁有獨立色票、Button/Panel/Input/Tab/Chip/Glow 規則。Visual Override = FORBIDDEN。
  - item: Layout Authority
    definition: 圖 1 為 EDIT-01 CURRENT ONLY 唯一切版權威。文字規格若與圖 1 的功能區位置／層級衝突，以本版圖 1 + 本表同步規則為準並立即修正文檔；禁止保留雙版本。
  - item: Top Context / Execution
    definition: 全寬頂列：Project → Topic → Task → Stage → Status → AUTO/MANUAL → Start/Continue → View Blueprint/Package/Binding → Return Blueprint
      Correction。
  - item: Primary Production Grid
    definition: Context 下方固定兩欄：左 Asset Binding 約 20%，右 Production Stack 約 80%；gap 使用 GLOBAL section_gap=16px。左欄可獨立捲動；右欄不得因左欄內容增長而改變 Preview 比例。
  - item: Asset Binding Column
    definition: 左欄約 20%；PROJECT_TASK 顯示 Exact Blueprint/Script/DNA/Asset Binding，全部唯讀；禁止 Asset Picker/搜尋替代；Standalone 才顯示 Upload/Session Media。
  - item: Production Stack
    definition: 右欄約 80%；由上至下固定：16:9 Preview → General Toolbar → Range/Marker Toolbar → Multi-track Timeline。
  - item: Preview
    definition: 唯一主 Preview；aspect-ratio 16/9；width:100%；高度優先；Transport 位於下方。不得為配合整頁高度壓縮成短條播放器。
  - item: Timeline
    definition: Video / Overlay / Voice / Music / SFX / Subtitle / LipSync 固定 Track；Dialogue Binding Guard 與 Timeline 同區顯示；Track/Clip 增加時向下延伸或區內捲動，不壓縮
      Preview。
  - item: Adjustment Row
    definition: Timeline 下方雙欄：左約 38% Semantic Correction + Score/Issues；右約 62% Manual Micro-Adjustment；兩區可隨頁面捲動。
  - item: Bottom Operation Row
    definition: 最下層三欄：Inspector 約 34% / Version Compare 約 34% / Execution-Output 約 32%；依內容延伸，可隨頁面捲動；Inspector 只存在於 EDIT-01-VIS-INSPECTOR 指定位置。
  - item: Global Geometry
    definition: Control h40、Button radius10、Panel radius12、Large container radius24、section gap16、content padding16；狀態／Focus／Hover／Disabled 完全繼承
      GLOBAL。
  - item: Responsive
    definition: EDIT 內部只封板 Desktop Production Layout：viewport ≥1440px 使用 20/80、38/62、34/34/32 比例；1280–1439px 左欄固定 240px、右欄吃剩餘寬度，底部仍三欄；<1280px
      不自行重排/Drawer/Stack，Main Workspace min-width=1280px 並允許水平捲動。Global Shell 可調外框，但不得改 EDIT 內部 Section 順序。
  - item: Image Sample Data
    definition: 圖 1 內具體 Project/Topic/Task/檔名/Score/Version/日期只作版面示意；Runtime Business Data 必須 Real Data Only；缺值 = —；Sample Data 禁止進入程式與資料庫。
  visual_uid_sync_index:
  - region: 1 專案／主題／任務情境（Context）
    section_visual_uid: EDIT-01-SEC-01 / EDIT-01-VIS-CONTEXT
    primary_component_uid: EDIT-01-CMP-SOURCE-BAR
    immutable_rule: 頁面最上方全寬；Project / Topic / Task / Stage / Status / AUTO-MANUAL / Start-Continue / Blueprint-Package-Binding 狀態集中於此；PROJECT_TASK
      首次生產不得手動輸入腳本或素材。
  - region: 2 素材綁定區（可捲動）
    section_visual_uid: EDIT-01-SEC-02 / EDIT-01-VIS-ASSET-BIND
    primary_component_uid: EDIT-01-CMP-MEDIA-BIN
    immutable_rule: 主工作區左欄約 20%；PROJECT_TASK 只顯示 Blueprint/Production Package 已綁定 Exact Asset ID/Version/Filename/Checksum，唯讀且可捲動；Standalone 才顯示上傳
      Session Media。
  - region: 3 主預覽（16:9 優先）
    section_visual_uid: EDIT-01-SEC-03 / EDIT-01-VIS-PREVIEW
    primary_component_uid: EDIT-01-CMP-PREVIEW + EDIT-01-CMP-TRANSPORT
    immutable_rule: 主工作區右側主製作欄；Preview 固定 16:9 且為最大視覺元素；下方 Transport 不得壓縮畫面。
  - region: 4 工具列（通用）
    section_visual_uid: EDIT-01-SEC-06 / EDIT-01-VIS-TOOLBAR
    primary_component_uid: EDIT-01-CMP-MANUAL-TOOLS
    immutable_rule: 位於 Preview 下方、主製作欄全寬；Undo/Redo/Select/Razor/Split/Trim/Move/Order/Delete/Duplicate/Transition/Speed 等固定順序。
  - region: 5 範圍／標記工具
    section_visual_uid: EDIT-01-SEC-04 / EDIT-01-VIS-RANGE
    primary_component_uid: EDIT-01-CMP-PRECISION
    immutable_rule: 位於通用工具列下方；Set In/Set Out/Clear/Marker/Snap/Zoom-/Zoom+/Fit 固定順序，Playhead 與 Range State 分離。
  - region: 6 多軌同步時間軸
    section_visual_uid: EDIT-01-SEC-05 + SEC-09~12 / EDIT-01-VIS-TIMELINE
    primary_component_uid: EDIT-01-CMP-TIMELINE + EDIT-01-CMP-DIALOGUE-BINDING
    immutable_rule: 位於主製作欄；Video / Overlay / Voice / Music / SFX / Subtitle / LipSync 同步顯示；Dialogue Binding Guard 直接附著於 Timeline 區，Voice/LipSync/Subtitle
      共用 Dialogue Timing Binding。
  - region: 7 腳本／AI 語義修正
    section_visual_uid: EDIT-01-SEC-08 + SEC-13 / EDIT-01-VIS-SEMANTIC
    primary_component_uid: EDIT-01-CMP-API + EDIT-01-CMP-STAGE-EVALUATION
    immutable_rule: Timeline 下方左區；系統自動帶入 Current Stage Script / Blueprint / DNA / Bound Asset / Issue-Evidence；使用者只輸入繁中修改要求；Candidate → Compare
      → Execute Correction → Recheck。
  - region: 8 人工時間軸微調
    section_visual_uid: EDIT-01-SEC-06 + SEC-07 / EDIT-01-VIS-MICRO
    primary_component_uid: EDIT-01-CMP-MICRO-ADJUSTMENT + EDIT-01-CMP-INSPECTOR
    immutable_rule: Timeline 下方右區；Drag / Move / Trim / Snap / Frame-Timecode / Volume-Fade 等局部 Working Draft 微調；不得修改 Blueprint、正式 Script Authority
      或 Project Asset Binding。
  - region: 9 Inspector／屬性面板
    section_visual_uid: EDIT-01-SEC-07 + SEC-09~12 / EDIT-01-VIS-INSPECTOR
    primary_component_uid: EDIT-01-CMP-INSPECTOR
    immutable_rule: 底部左區；Clip / Track / Voice / Audio / LipSync / Subtitle / QA / Version / Output 依選取 Context 切換；不另開工作頁。
  - region: 10 版本比較（Compare）
    section_visual_uid: EDIT-01-SEC-14 / EDIT-01-VIS-COMPARE
    primary_component_uid: EDIT-01-CMP-VERSION
    immutable_rule: 底部中區；Baseline / Candidate / Diff / Score 只做比較與決策，不覆寫既有 Version。
  - region: 11 執行與輸出（Execution / Output）
    section_visual_uid: EDIT-01-SEC-15 + SEC-16 / EDIT-01-VIS-OUTPUT
    primary_component_uid: EDIT-01-CMP-OUTPUT + EDIT-01-CMP-STATUS + EDIT-01-CMP-STAGE-RAIL
    immutable_rule: 底部右區；Generate/Correction Job、AUTO PASS→Next Stage、FAIL→Pause+Correction、Render/Output/Lock/Handoff Gate 集中於此；Blocking Error
      必須 Disable。
  internal_layout_order:
  - section_visual_region: 1 / SEC-01
    fixed_order: Project → Topic → Task → Stage → Status → AUTO/MANUAL → Start/Continue → View Blueprint/Package/Binding → Return Blueprint Correction
    size_rule: 全寬；Control/Field/Primary h40；gap 8px；padding16；可換行但不得分裂成第二 Context Bar。
  - section_visual_region: 2 / SEC-02
    fixed_order: Bound Asset/Script/DNA References → Asset Type → Exact ID/Version/Filename/Checksum → Binding Status
    size_rule: Primary Grid 左約20%；自身可垂直捲動；Project mode 唯讀且無 Picker；Standalone 才有 Upload。
  - section_visual_region: 3 / SEC-03
    fixed_order: Main 16:9 Preview → Transport：Play/Pause → Prev/Next Frame → Timecode → Rate → Loop → Volume/Mute → Fullscreen
    size_rule: Primary Grid 右約80%頂部；Preview 16:9；Viewer 優先。
  - section_visual_region: 4 / SEC-06 General Toolbar
    fixed_order: Undo → Redo → Select → Razor → Split → Trim L/R → Move → Order → Delete → Duplicate → Transition → Speed
    size_rule: Preview 下方主製作欄全寬；Control h40；可橫向 overflow，但不得換成另一套工具列。
  - section_visual_region: 5 / SEC-04 Range/Marker
    fixed_order: Set In → Set Out → Clear → Marker → Snap → Zoom- → Zoom+ → Fit
    size_rule: General Toolbar 下方；Control h40；Playhead/Range/Snap 各自獨立 State。
  - section_visual_region: 6 / SEC-05 + SEC-09~12
    fixed_order: Track Header → Ruler/Playhead → Video → Overlay → Voice → Music → SFX → Subtitle → LipSync → Dialogue Binding Guard
    size_rule: 主製作欄全寬；Timeline min-height 320px；Track 可增高/捲動；Binding Guard 固定在 Timeline 右側/下側 Context Panel，不另開頁。
  - section_visual_region: 7 / SEC-08 + SEC-13
    fixed_order: Current Stage/Script/Bound Input → Correction Instruction → Generate Candidate → Compare → Execute Correction → Score/Issue/Evidence
      → Recheck
    size_rule: Adjustment Row 左約38%；Textarea min120px；PROJECT_TASK 首次生產不顯示手動 Prompt。
  - section_visual_region: 8 / SEC-06 + SEC-07
    fixed_order: Range/Clip/Track Scope → Drag/Move/Trim/Snap → Frame/Timecode Nudge → Volume/Fade/Transition/Subtitle Offset → Apply Draft
    size_rule: Adjustment Row 右約62%；只改 Working Draft；不得改 Blueprint/Script Authority/Project Binding。
  - section_visual_region: 9 / SEC-07 + SEC-09~12
    fixed_order: Clip / Track / Voice / Audio / LipSync / Subtitle / QA / Version / Output Inspector Tabs → Selected Context Fields
    size_rule: Bottom Row 左約34%；Tabs h40；只顯示合法 Context 欄位。
  - section_visual_region: 10 / SEC-14
    fixed_order: Baseline → Candidate → Diff → Score → Compare Decision → Save New Version / Restore as New Draft / Lock Exact Version
    size_rule: Bottom Row 中約34%；Version append-only；Compare 不覆寫。
  - section_visual_region: 11 / SEC-15 + SEC-16
    fixed_order: Generate/Correction Job → AUTO Gate → Render/Output → Download/Handoff → Job/Error/State Trace
    size_rule: Bottom Row 右約32%；Blocking QA/Binding/State Error 時 Primary Disabled；PASS 才可下一 Stage/Lock/Handoff。
  control_size_classes:
  - size_class: ICON_S
    geometry: 外框/Hit Area 40×40px；圖示 20–24px；只允許單一圖示或極短標籤；Touch ≥44×44px。
  - size_class: BUTTON_M
    geometry: height 40px；min-width 88px；padding 12–16px；radius 10px；視覺完全繼承 GLOBAL button_system。
  - size_class: TAB_M
    geometry: height 40px；radius 10px；Default/Selected 只引用 GLOBAL Tab/Button Selected 規格。
  - size_class: FIELD_M
    geometry: height 40px；radius 12px；Input/Select 背景、Border、Focus 只引用 GLOBAL control_system。
  - size_class: TEXTAREA
    geometry: min-height 96px；radius 12px；可垂直增高；不得水平縮到 <180px。
  - size_class: LIST_ITEM
    geometry: min-height 52px；Media/Binding Item min-height 56px；Panel padding 12–16px。
  - size_class: TRACK_ROW
    geometry: min-height 40px；所有 track header 高度一致；波形/字幕/對嘴標記不得因縮高消失。
  - size_class: TOUCH_TARGET
    geometry: Touch 模式互動命中區 ≥44×44px；不得只靠拖曳，核心功能需有按鈕/鍵盤/數值替代。
  visual_geometry:
  - visual_uid: EDIT-01-VIS-CONTEXT
    position_size: Main Workspace 最上方 100% 寬；content-driven height
    z_overflow: z10；非 sticky；隨 Main Page Content 正常捲動；不得遮內容
    locked_behavior: Context/Execution 只有一套；不得複製業務 Action。
  - visual_uid: EDIT-01-VIS-ASSET-BIND
    position_size: Primary Production Grid 左約20%；從 Preview row 延伸至 Timeline row
    z_overflow: 區內 vertical scroll
    locked_behavior: Project 只讀 exact refs；Standalone 才可上傳。
  - visual_uid: EDIT-01-VIS-PREVIEW
    position_size: Production Stack 右約80%頂部；16:9
    z_overflow: Viewer layer；不得被其他 Panel 覆蓋
    locked_behavior: 唯一主 Preview；Viewer 高度優先。
  - visual_uid: EDIT-01-VIS-TOOLBAR
    position_size: Preview 下方；Production Stack 100% 寬
    z_overflow: horizontal overflow allowed
    locked_behavior: 通用剪輯工具固定順序，禁止第二套重複工具。
  - visual_uid: EDIT-01-VIS-RANGE
    position_size: General Toolbar 下方；Production Stack 100% 寬
    z_overflow: horizontal overflow allowed
    locked_behavior: In/Out/Marker/Snap/Zoom/Fit 固定順序。
  - visual_uid: EDIT-01-VIS-TIMELINE
    position_size: Range Toolbar 下方；Production Stack 100% 寬
    z_overflow: Track area 可縱向延伸/捲動
    locked_behavior: 多軌 + Binding Guard；Voice/LipSync/Subtitle 同步綁定。
  - visual_uid: EDIT-01-VIS-SEMANTIC
    position_size: Timeline 下方 Adjustment Row 左約38%
    z_overflow: 隨 Page Content 捲動
    locked_behavior: Script/AI 語義修正 + Score/Issues；Context 自動帶入。
  - visual_uid: EDIT-01-VIS-MICRO
    position_size: Timeline 下方 Adjustment Row 右約62%
    z_overflow: 隨 Page Content 捲動
    locked_behavior: 人工 Timeline 微調；只改 Working Draft。
  - visual_uid: EDIT-01-VIS-INSPECTOR
    position_size: Bottom Operation Row 左約34%
    z_overflow: 隨 Page Content 捲動
    locked_behavior: Selected Context Inspector；不固定右側。
  - visual_uid: EDIT-01-VIS-COMPARE
    position_size: Bottom Operation Row 中約34%
    z_overflow: 隨 Page Content 捲動
    locked_behavior: Version Baseline/Candidate/Diff；不覆寫。
  - visual_uid: EDIT-01-VIS-OUTPUT
    position_size: Bottom Operation Row 右約32%
    z_overflow: 隨 Page Content 捲動
    locked_behavior: Execution/Render/Output/Handoff + Job/Error Gate。
  uid_naming_grammar:
  - type: Page
    format: EDIT-01
    rule_example: 全頁唯一
  - type: Section
    format: EDIT-01-SEC-##
    rule_example: '## 固定兩位數；只允許本文件 SEC-01~SEC-16'
  - type: Component
    format: EDIT-01-CMP-*
    rule_example: 僅允許 Component Registry 已列值
  - type: Button
    format: EDIT-01-BTN-*
    rule_example: 可觸發 Action 的按鈕
  - type: Control
    format: EDIT-01-CTL-*
    rule_example: Toggle/Slider/Range/Track control 等
  - type: Field
    format: EDIT-01-FLD-*
    rule_example: Input/Select/Timecode/Textarea/Readonly field
  - type: List/Panel/Tool/Label
    format: EDIT-01-LST-* / PNL-* / TOOL-* / LBL-*
    rule_example: 只允許 Control Registry 已列值
  - type: Action
    format: EDIT-01-ACT-*
    rule_example: 每個可執行語義唯一；不得同義另命名
  - type: Object/Reference
    format: EDIT-01-OBJ-* / EDIT-01-REF-*
    rule_example: 資料物件與外部受治理 reference
  - type: Page/Job State
    format: EDIT-01-ST-PAGE-* / EDIT-01-ST-JOB-*
    rule_example: 只允許 State Registry 已列值
  - type: Transition
    format: EDIT-01-TR-* / EDIT-01-JTR-*
    rule_example: 只允許 Transition Registry 已列值
  - type: Error
    format: EDIT-01-ERR-*-###
    rule_example: 必須出現在 Error Registry 才能顯示/處理
  - type: Gate
    format: EDIT-01-GATE-*
    rule_example: 任何 Enable/Render/Lock/Handoff 判斷只引用 Gate Registry
  - type: Permission
    format: EDITING_*
    rule_example: 只允許 Permission Scope Registry 已列 scope
  - type: Visual Region
    format: EDIT-01-VIS-*
    rule_example: 只允許 Visual Geometry Registry 已列值；圖像區域只能引用 VIS UID
  - type: Stage
    format: EDIT-01-STAGE-##-*
    rule_example: 只允許 Stage Registry 已列值；目前固定 01~05
  - type: Stage Transition
    format: EDIT-01-STTR-##
    rule_example: 只允許 Stage Transition Registry 已列值
  - type: Script Role
    format: EDIT-01-SCRIPTROLE-*
    rule_example: 同一 Production Package 內的執行區段角色；不是獨立權威腳本
  - type: Binding Step
    format: EDIT-01-BIND-##
    rule_example: 只允許 Binding Chain Registry 已列值
  - type: Marker Type
    format: EDIT-01-MARKER-*
    rule_example: 只允許 Marker Type Registry 已列值
  - type: Policy
    format: EDIT-01-POLICY-*
    rule_example: 任何閾值/容差必須引用 Policy Registry；禁止 AI 自訂數值
  - type: Integration Port UID
    format: EDIT-01-PORT-[BOUNDARY/STAGE]-[NAME]
    rule_example: 只用於 current registered authority Operation/Endpoint boundary 映射；不得當作 Control/Action/Page UID，也不得自行建立未登錄 Port。
  source_modes:
  - mode: PROJECT_TASK
    project: Required
    topic: Required
    task: Required
    upload: Forbidden
    working_draft: 由 VIDEO 完成後的 EDIT 待辦/Handoff 進入；系統自動解析 Locked Blueprint Production Package、Script Sections、DNA refs、Asset refs；首次生產禁止手動輸入腳本/素材。
  - mode: STANDALONE_UPLOAD
    project: Forbidden / null
    topic: Forbidden / null
    task: Forbidden
    upload: Required before editing
    working_draft: Owner-scoped Session；允許上傳媒體與腳本/規格，或在同頁中文對話建立 Standalone Requirement；不得假裝存在 Blueprint/DNA。
  source_mode_rules:
  - Source Mode 切換一律執行 Context Reset：清除 Selected Clip/Range、Job Candidate、Inspector Context、QA Selection、未提交 UI-only selection；不得殘留上一情境的版本或 Evidence。
  - PROJECT_TASK 的 Upload / Asset Picker / Voice-Music-SFX Source Picker 必須隱藏或唯讀；任何新增或更換 Project Script/DNA/Asset binding 必須退回藍圖修正。
  - Standalone Upload 是本頁正式功能，不是臨時入口；不要求建立 Project 或 Production Task。
  timeline:
  - item: 核心時間模型
    definition: Edit truth 必須是 exact canonical time（frame/tick/sample rational）；禁止只用浮點秒數作為唯一真值。
  - item: Main Editing Controller
    definition: 多軌 Timeline；禁止以一般單 slider / Seek Bar 代替 Timeline。
  - item: Mini Timeline
    definition: 只顯示全局位置與 viewport；不得和 In/Out Range 共用狀態。
  - item: Playhead
    definition: 單一獨立 temporal cursor；跨所有 Tracks 的垂直線；不等於 Selection。
  - item: Range
    definition: In/Out 雙端點；可由按鈕、鍵盤、數值輸入、Drag 設定。
  - item: Timecode
    definition: 可直接輸入；至少支援 hh:mm:ss:ff；解析後轉 canonical time。
  - item: Frame Nudge
    definition: 前/後 1 frame 必須存在；長度與 FPS 由 Project/Source Timebase 決定。
  - item: Zoom
    definition: Zoom In / Out / Fit 必須存在；放大 anchor 優先 pointer，無 pointer 時 playhead。
  - item: Snap
    definition: 獨立 Snap Resolver；Snap 只處理時間對齊，不得隱含改變 Clip 結構或位置關係。
  - item: Marker
    definition: Marker 类型只允許本文定義的問題點/剪接點/字幕/嘴型/畫面/音效/音樂節奏/AI_QA/人工修改。
  - item: Waveform
    definition: VOICE/MUSIC/SFX 必須顯示 Waveform；依 Zoom 使用 LOD，不得每次縮放重新解碼完整音訊。
  - item: Thumbnail
    definition: VIDEO/OVERLAY 可依 Zoom 使用 filmstrip LOD；不得因總片長線性建立所有 DOM。
  - item: Playback Clock
    definition: Preview playhead 跟隨 media/audio clock；UI timer 不得成為播放真值。
  - item: Undo/Redo
    definition: 所有可改變 Working Draft 的人工操作必須是 Undoable Command。
  button_control_visual_states:
  - state: DEFAULT
    visual_spec: 只引用 GLOBAL secondary/control default：Surface/Input/Border/Text token；禁止 EDIT raw color。
    behavior_spec: 可操作但未選取。
  - state: HOVER
    visual_spec: GLOBAL interaction.hover：120ms ease；brightness + soft glow；尺寸不位移。
    behavior_spec: 只提供 hover feedback，不觸發 Action。
  - state: ACTIVE / SELECTED
    visual_spec: GLOBAL button_system.selected / Tab Selected：較亮紫色漸層 + stronger glow + selected indicator。
    behavior_spec: 用於 Source Mode、Tab、Snap、選取狀態；狀態語意不由顏色單獨承擔。
  - state: PRIMARY
    visual_spec: GLOBAL button_system.primary：紫色三段漸層 + inner highlight + purple soft glow；height 40px；radius 10px。
    behavior_spec: 只用於主要執行動作：Upload/Execute/Apply/Save/Recheck/Render/Download/Handoff 等。
  - state: DISABLED
    visual_spec: GLOBAL disabled：opacity 0.38；無 glow；尺寸/Label 保留。
    behavior_spec: Gate 未滿足時必須 Disabled；禁止用假資料或自動 fallback 使其可用。
  - state: LOADING
    visual_spec: 保留 GLOBAL geometry；Spinner + 原 Label；Processing 狀態只用 processing token。
    behavior_spec: 對應真實 Job RUNNING；禁止重複 submit；Cancel 若合法則另顯示。
  - state: SUCCESS
    visual_spec: 只用 GLOBAL success token 顯示真實 PASS/READY/APPROVED/LOCKED 狀態。
    behavior_spec: 不得把 Primary Action 永久改成綠色；完成後以真實 Page/Job State 呈現。
  - state: ERROR
    visual_spec: GLOBAL error token + Error icon + Error UID；不得只寫 Failed。
    behavior_spec: 必須追到 Error Registry；不允許自動 fallback。
  - state: FOCUS
    visual_spec: GLOBAL surface_focus / input focus：violet border + visible soft focus ring。
    behavior_spec: Keyboard navigation 必須可見。
  - state: DESTRUCTIVE
    visual_spec: 'GLOBAL destructive #FF6B7A；只允許確認性破壞操作/critical operation。'
    behavior_spec: 一般 Cancel/Secondary 不得任意使用紅色；是否二次確認由 Action Contract 定義。
  control_contract_rule: 所有按鈕的 UID、Label、位置、State、Action UID、Gate 必須同時存在；任何一欄缺少即 BLOCK_CONTROL_CONTRACT。
  api_ai_correction_flow:
  - step_uid: EDIT-01-FLOW-CORR-01
    flow: Issue/Stage/Selected Range → 系統建立 Correction Context
    gate_result: 自動帶 Project/Topic/Task/Locked Blueprint/Production Package/Current Script Section/DNA refs/Asset refs/Current Result/Score/Evidence
  - step_uid: EDIT-01-FLOW-CORR-02
    flow: 使用者只輸入繁中修改要求
    gate_result: 僅 Correction/Standalone；首次專案生產禁止手動輸入
  - step_uid: EDIT-01-FLOW-CORR-03
    flow: AI 產生 Correction Script Candidate
    gate_result: Candidate 必須引用原 Script Section ID/version/hash 與 target scope；禁止改 Blueprint/DNA/Asset binding
  - step_uid: EDIT-01-FLOW-CORR-04
    flow: 人工確認 Candidate → Provider/API Translation/Execution
    gate_result: Project Provider/Model 依既有 policy 自動解析；不得人工換 Provider 逃避規則
  - step_uid: EDIT-01-FLOW-CORR-05
    flow: Candidate Output → Preview/Compare → Apply
    gate_result: 只更新 Working Draft；Saved Version 不變
  - step_uid: EDIT-01-FLOW-CORR-06
    flow: Recheck Current Stage
    gate_result: PASS→MANUAL 可確認或 AUTO 自動前進；FAIL→保持 Correction
  - step_uid: EDIT-01-FLOW-CORR-07
    flow: 若修改需要新 Script/Asset/DNA binding
    gate_result: 禁止在 EDIT 直接新增/替換；執行 EDIT-01-ACT-RETURN-BLUEPRINT，待上游更新後重新 Resolve Input Manifest
  manual_edit_operations:
  - operation_uid: EDIT-01-OP-MANUAL-SELECT
    operation: Select Clip/Range
    data_impact: UI selection only
    forbidden: 不得修改 Draft
  - operation_uid: EDIT-01-OP-MANUAL-SPLIT
    operation: Split at Playhead
    data_impact: 新增 Working Draft clip segmentation
    forbidden: 不得覆寫 Saved Version
  - operation_uid: EDIT-01-OP-MANUAL-TRIM
    operation: Trim Start/End
    data_impact: 修改 Working Draft clip in/out
    forbidden: 不得改 Source Asset 原檔
  - operation_uid: EDIT-01-OP-MANUAL-MOVE
    operation: Move/Reorder
    data_impact: 修改 Working Draft clip placement/order
    forbidden: 不得自動跨 Track 類型
  - operation_uid: EDIT-01-OP-MANUAL-DELETE
    operation: Delete
    data_impact: Working Draft remove reference
    forbidden: 不得刪除 Asset Version
  - operation_uid: EDIT-01-OP-MANUAL-DUP
    operation: Duplicate
    data_impact: Working Draft 新 clip ref
    forbidden: 不得複製成新 Asset Version 除非另有 Asset Action
  - operation_uid: EDIT-01-OP-MANUAL-REPLACE
    operation: Replace Source
    data_impact: Standalone：更換 Session source ref；Project：禁止直接更換
    forbidden: PROJECT_TASK 要換來源必須退回藍圖修正→素材生成→更新 binding→回 EDIT
  - operation_uid: EDIT-01-OP-MANUAL-STYLE
    operation: Transition/Speed/Volume/Fade
    data_impact: 修改 Working Draft clip properties
    forbidden: 所有變更可 Undo/Redo
  - operation_uid: EDIT-01-OP-MANUAL-COMMIT
    operation: Save New Version
    data_impact: 建立 Immutable Edit Version
    forbidden: 永遠禁止 overwrite
  voice_audio_lipsync_subtitle_flow:
  - feature: 配音｜PROJECT_TASK
    flow: 從 Production Package 讀 Voice Script Section → exact Voice Asset ID/Version/filename/checksum → 載入 VOICE Track → timing/level/preview
    gate: 素材由前置素材生產完成；EDIT 不重新搜尋/生成；需新音檔則退回藍圖修正
  - feature: 配樂｜PROJECT_TASK
    flow: 從 Production Package 讀 Music requirement → exact Music Asset Ref → 自動加入 MUSIC Track → timing/volume/fade
    gate: 不得人工 Picker；不得用相似檔替代
  - feature: SFX｜PROJECT_TASK
    flow: 從 Production Package 讀 SFX cues → exact SFX Asset Refs → 自動加入 SFX Track → timing/volume/fade
    gate: 不得人工 Picker；每個 cue 必須有 purpose binding
  - feature: 音訊合音
    flow: Voice/Music/SFX 已綁定 → Track/Master Level → Mix Preview/Execute → Score
    gate: Audio present 才啟用；FAIL 進 Correction，不得跳下一 Stage
  - feature: 對嘴
    flow: 從 Sync Script Section + exact Voice Result + Video target 建立/驗證 DialogueTimingBinding → LipSync Execute → Preview → Score/Issue
    gate: LipSync 必須與 Subtitle 共用 dialogue_segment_id/timebase；Voice timing 變更後兩者同時 STALE；只重跑問題 Segment/Range
  - feature: 字幕
    flow: 從 Subtitle Script Section 載入文字/語言規格 → 以同一 DialogueTimingBinding 錨定 Voice Segment → Subtitle Track → Manual/API Sync → Score
    gate: 字幕時間碼只允許相對 Voice anchor 微調；Binding mismatch 或 drift > EDIT-01-POLICY-DIALOGUE-SYNC-TOLERANCE resolved value直接 BLOCK SYNC Stage
  - feature: Standalone
    flow: 僅使用使用者本 Session 上傳/建立的媒體與規格；可手動選擇 Session Media
    gate: 不得假裝擁有 Project Blueprint/DNA；不自動搜尋專案資料庫
  - feature: 共同規則
    flow: Project 所有來源只允許 Locked Blueprint Production Package 綁定的 exact refs；任何 Working Draft 修改後需對應 Stage Recheck
    gate: 不得跨 Blueprint/Project/Topic/Task 取檔；不得 Provider/Asset fallback
  stage_evidence:
  - item: Issue Hierarchy
    definition: Project(optional) → Sequence/Timeline → Track → Clip → TimeRange or Marker。Standalone 允許 Project=null。
  - item: Evidence
    definition: Evidence Ref 必須是真實 QA 證據；禁止自動生成不存在的 Evidence ID。
  - item: Jump
    definition: Issue 選取後可 Jump Marker；若有 Range 同時載入 In/Out。
  - item: Correction
    definition: 人工或 API/AI 修正 Working Draft；修正後 Issue 不得直接標 CLOSED。
  - item: Recheck
    definition: Selected Issue 或 Full Timeline；只有 Recheck PASS 才可 Closed。
  - item: Blocking
    definition: 任何 Blocking Issue 未解決：Render / Version Lock / Handoff Disabled。
  - item: 95 Score
    definition: 若使用 Score，可顯示；但 Hard Block 永遠可覆蓋分數。分數不得取代 Blocking Gate。
  version_working_draft_output_rules:
  - object_uid: EDIT-01-OBJ-WORKING-DRAFT
    mutability: Mutable
    rule: 所有人工/API/音訊/字幕/對嘴修正只作用 Working Draft；任何內容 mutation → EVAL_REQUIRED
  - object_uid: EDIT-01-OBJ-EDIT-VERSION
    mutability: Immutable
    rule: Save 永遠建立新版本；不覆寫、不重用 ID
  - object_uid: EDIT-01-OBJ-API-CANDIDATE
    mutability: Immutable Candidate
    rule: 只供 Preview/Compare/Apply；不是 Saved Version
  - object_uid: EDIT-01-OBJ-OUTPUT-REF
    mutability: Immutable
    rule: Render 成功才建立；必有 Manifest + Checksum + exact input EditVersion
  - object_uid: EDIT-01-OBJ-VERSION-LOCK
    mutability: Immutable
    rule: 只鎖定 exact EditVersion + OutputReference；修改只能 Restore as New Draft
  - object_uid: EDIT-01-OBJ-HANDOFF-RECORD
    mutability: Append-only
    rule: 只引用 Locked Exact Version + OutputReference + Evidence/Manifest；不定義 QA 內部實作
  project_task_inbound:
  - item: Inbound Task
    definition: 上游完成可供剪輯的任務後，EDIT 只接收「待辦/Handoff 邊界資料」並顯示待辦；本文件不定義上游部門如何產生該 Handoff。
  - item: Select Context
    definition: 使用者只選 Project → Topic → Production Task。選定後系統自動 Resolve Locked Blueprint、Production Package、Stage Script Sections、DNA refs、Asset
      Binding refs、VIDEO input refs。
  - item: First Production
    definition: 禁止要求使用者重新輸入剪輯、配音、配樂、SFX、字幕、對嘴腳本；禁止讓使用者挑 Project 素材。
  - item: Single Package
    definition: 所有後製腳本屬同一 Blueprint Production Package，依 Stage 分 Section/View；不是五份彼此獨立的權威腳本。
  - item: Task Context Reset
    definition: 切換 Project/Topic/Task 必須清除上一 Context 的 Draft selection、Issue、Script Section、Asset refs、Stage result、Score、Candidate、Evidence。
  blueprint_script_dna_asset_binding_chain:
  - step_uid: EDIT-01-BIND-01
    resolution_rule: Current Task → exact Locked Blueprint Version
    hard_guard: version_id + lock_state + hash 必須一致
  - step_uid: EDIT-01-BIND-02
    resolution_rule: Locked Blueprint → exact Production Package Version
    hard_guard: package_id/version/hash 必須一致
  - step_uid: EDIT-01-BIND-03
    resolution_rule: Current Stage → Package 內唯一 Script Section
    hard_guard: section_uid/version/hash 必須存在；不可 AI 補寫首次腳本
  - step_uid: EDIT-01-BIND-04
    resolution_rule: Script Section → DNA refs / Asset requirement refs
    hard_guard: 只允許 script 明確引用；不得由 EDIT 搜尋資料庫猜測
  - step_uid: EDIT-01-BIND-05
    resolution_rule: Asset Binding Manifest → exact Asset ID + Version + filename + checksum
    hard_guard: 任一不一致即 BLOCK；素材部門產出檔名必須與引用同步
  - step_uid: EDIT-01-BIND-06
    resolution_rule: VIDEO/VOICE/MUSIC/SFX/SUBTITLE refs → Timeline placement
    hard_guard: 只使用已綁定結果；EDIT 不建立新的 Project source
  - step_uid: EDIT-01-BIND-07
    resolution_rule: Execution Input Manifest snapshot → input_fingerprint
    hard_guard: 每次 Stage Execute 前重新驗證；跨 Project/Topic cache 禁止
  - step_uid: EDIT-01-BIND-08
    resolution_rule: Voice Dialogue Segment → DialogueTimingBinding → LipSync Target + Subtitle Segment
    hard_guard: LipSync/Subtitle 必須共用 dialogue_segment_id + canonical timebase + binding fingerprint；Voice timing/version 變更立即標兩者 STALE，未重新同步不得
      Stage PASS
  auto_manual_orchestration:
  - stage_uid: EDIT-01-STAGE-01-ASSEMBLY
    auto: 自動載入 EDIT.ASSEMBLY Section + exact VIDEO refs → 影像碎片整合 → Stage Evaluation → WAIT_CONFIRMATION；使用者確認後才執行正式 Output Decision / Score Persistence
      / EDIT+VOICE internal stage transition boundary，並自動啟動下一 Stage。
    manual: 載入/執行來源完全相同；Stage Evaluation 後等待「確認目前階段」或「修改目前階段」。確認只批准目前結果；下一 Stage 仍需人工按開始/繼續。
    stage_result_gate: Score≥95 + no Hard Block 才 PASS；FAIL 進 Correction
  - stage_uid: EDIT-01-STAGE-02-AUDIO
    auto: 自動載入 Voice/Music/SFX/Mix sections + exact audio refs → 啟動既有 Voice Runtime → 完成 Audio Mix → Stage Evaluation → WAIT_CONFIRMATION；確認後
      AUTO 才自動開始 SYNC。
    manual: 同一 Blueprint/Package/Asset refs；完成 Audio Mix 後評分並等待確認/修改。確認後仍需人工按開始/繼續進入 SYNC；不得重選 Project Asset。
    stage_result_gate: 所有 Voice/Music/SFX 已由上游素材生產並入庫；本 Stage 只引用/混音
  - stage_uid: EDIT-01-STAGE-03-SYNC
    auto: 自動載入 Subtitle/LipSync sections + exact Voice/Video refs → LipSync → Subtitle Sync → DialogueTimingBinding 一致性檢查 → Stage Evaluation →
      WAIT_CONFIRMATION；確認後只完成正式 Voice Output Decision / Score Persistence，接著 AUTO 自動進 FINALIZE。
    manual: 同資料來源；可做細節人工調整，但 Subtitle timing 只能相對 Voice anchor 微調。完成 LipSync+Subtitle 後評分並等待確認/修改；確認後下一 Stage 仍需人工按開始/繼續。
    stage_result_gate: LipSync/Subtitle 共用 dialogue_segment_id/timebase/binding fingerprint；任一 stale/mismatch/drift > EDIT-01-POLICY-DIALOGUE-SYNC-TOLERANCE
      resolved value = FAIL/BLOCK
  - stage_uid: EDIT-01-STAGE-04-FINALIZE
    auto: Stage 01~03 Checkpoint PASS → Save Exact Edit Version → Render → Verify Output Manifest/Checksum → Output Ready → Lock Exact Version；不得跳過任何步驟
    manual: 同一 Finalize 順序；由人逐步確認 Save/Render/Lock，但不能跳步
    stage_result_gate: EDIT-01-GATE-FINALIZE + EDIT-01-GATE-RENDER + EDIT-01-GATE-HANDOFF 依序通過
  - stage_uid: EDIT-01-STAGE-05-QA-HANDOFF
    auto: Exact Version 已 Save/Render/Verify/Lock 後，使用者在同一 EDIT-01 執行最終 Handoff；後端唯一合法端口為 handoffVoiceToQA。頁面不跳轉至 VOICE，也不存在直接 Editing→QA。
    manual: 同；MANUAL 亦只能使用 handoffVoiceToQA。EDIT 只呈現自身 final handoff action，不定義 QA 內部實作。
    stage_result_gate: EDIT-01-GATE-HANDOFF PASS + exact locked version/output/evidence + current registered authority voice.handoff.create authorization；final
      EDIT+VOICE→QA handoff is REQUIRED after integrated finalization
  project_correction:
  - type: 人工細節編輯
    user_input: 不輸入腳本；直接在 Timeline 以拖曳 Range/Clip、Trim handle、Split/Razor、Move/Reorder、Transition、Speed、Volume/Fade、frame nudge、numeric timecode
      等精準操作
    system_auto_load: Current Working Draft + Selected Track/Clip/Range + exact bound refs；字幕 timing 另讀 DialogueTimingBinding
    allowed_result: 只改 Working Draft；不改 Blueprint/Production Package/Source binding。Voice timing 若被合法微調，系統必須把 LipSync+Subtitle 標 STALE 並要求重新同步
  - type: AI/語義修正
    user_input: 只輸入繁中「修改要求」；先在 Preview/Timeline 選 Target/Range（可不選則用 Issue Context），不直接手寫 Provider 語法或重寫完整正式腳本
    system_auto_load: Current Stage + Current Script Section + Locked Blueprint + DNA/Asset refs + Current Result + Score + Issue/Evidence + target
      range；系統自動產生 Correction Script Candidate
    allowed_result: 人工確認 Candidate → Provider/API translation/execute → Candidate Output → Apply → Stage Recheck；只有語義/內容要求走此路徑，純幾何/時間細節可直接人工微調
  - type: 需要新來源
    user_input: 不在 EDIT 直接輸入/挑選新 Project Asset
    system_auto_load: 系統判定變更涉及 Script/DNA/Asset binding
    allowed_result: 唯一動作：Return Blueprint Correction；待上游更新後重新 Handoff/Resolve 最新 references
  standalone_upload:
  - item: Project Context
    definition: Project/Topic/Task 必須 null/hidden；不得假裝存在 Locked Blueprint/DNA。
  - item: 取得檔案
    definition: 顯示「上傳媒體」與「上傳腳本/規格」按鈕；所有可用來源只限本 Standalone Session 已上傳/建立的 refs。
  - item: 需求輸入
    definition: 若沒有正式腳本，可在 Correction/AI 面板輸入繁中製作需求，產生 Standalone Requirement/Script Candidate；人工確認後才可執行。
  - item: Manual
    definition: 可直接人工 Timeline 編輯；可選擇本 Session 媒體作為 Voice/Music/SFX/Video/Subtitle source。
  - item: Auto
    definition: 只有在 Standalone Context 已有足夠 Script/Spec + required input refs 時才允許啟動；不得自動搜尋 Project database 補缺。
  department_boundary:
  - item: EDIT 文件責任
    definition: 只定義 EDIT-01 內部 Page/Controls/Stage/Correction/Version/Output 與它需要接收/送出的 boundary refs。
  - item: 禁止跨部門內部定義
    definition: 不得在 EDIT 文件替 VIDEO、ASSET、QA 或其他部門定義其內部 Page、API、Runtime、生成流程、資料表或操作規則。
  - item: 現在每個部門都要寫好
    definition: 本部門 Local Closure 100% + Inbound Contract 100% + Outbound Contract 100%；引用其他部門時只使用 boundary UID/ref，不複製對方內部實作。
  - item: 最後總串接
    definition: 五個部門全部封板後，再建立跨部門 Orchestration/Integration Authority，綁定 Handoff/Event/State/Retry/Return/E2E；不得回頭重寫各部門內部權威。
  - item: 底層 Operation Boundary
    definition: EDIT 可以在同一頁編排 current registered authority 已存在的 Editing/Voice Runtime operations，但只做 operation/path/permission/state/event boundary
      mapping；不得把 VOICE/QA service internals 複製成 EDIT-owned implementation。
  - item: 單頁 UI ≠ Service Merge
    definition: 使用者始終停留 EDIT-01；底層可依 current registered authority state machine 從 EditingExecutionService 進 Voice Runtime，再由 EDIT+VOICE→QA。UI
      不導航至 VOICE 頁，也不得建立 direct Editing→QA endpoint。
  stage_evaluation:
  - item: Evaluator Action
    definition: EDIT-01-ACT-STAGE-EVALUATE；Stage Execute/Correction 完成後必須觸發；AUTO 自動觸發，MANUAL 可由 Recheck 觸發。
  - item: Input
    definition: Current Stage result ref + exact Blueprint Production Package evaluation criteria + Current Script Role/Section + Input Fingerprint
      + Stage Evidence。
  - item: Output
    definition: EDIT-01-OBJ-STAGE-EVALUATION + 0..N EDIT-01-OBJ-STAGE-EVIDENCE；overall_score / dimension_scores / hard_blocks / result / evaluator_version
      全部可追蹤。
  - item: Threshold
    definition: Stage PASS threshold = Production Package evaluation criteria；本版現行 authority=95。不得由 AI 自訂不同分數門檻。
  - item: Internal vs QA Department
    definition: 本頁只做 EDIT Stage Evaluation。真正 QA 部門只在 EDIT-01-STAGE-05-QA-HANDOFF boundary 之後；EDIT 不定義 QA 內部實作。
  - item: current registered authority Score Persistence Sequence
    definition: 本文 Stage Evaluation 可先產生可見評分供「確認/修改」決策；current registered authority submitScorecard 只能在對應 Candidate 已由 decideOutputCandidate 進入
      SCORE_PENDING 後持久化。不得因 UI 先顯示分數而跳過正式 state transition。
  image_responsive_hard_lock:
  - item: Runtime UI Regions
    definition: 圖 1 中 Context、Asset Binding、16:9 Preview、General Toolbar、Range/Marker、Timeline、Semantic Correction、Manual Micro-Adjustment、Inspector、Compare、Execution/Output
      僅依 Visual/Section/Control Registry 實作。；Inspector 顯示文字「QA」僅是 EDIT 內部 Stage Evaluation 的短標籤，語義 UID 固定為 EDIT-01-TAB-EVALUATION；真正 QA 部門只存在於
      EDIT-01-STAGE-05-QA-HANDOFF。
  - item: Documentation Overlay
    definition: 圖 1 的編號圓點、說明箭頭、示範卡、說明文字、FINAL LOCKED 徽章屬文件註解，不是 Runtime Component/Control，不建立 UID、API、DB。
  - item: Illustrative Business Values
    definition: 圖 1 的 Project/Topic/Task/Score/Version/日期/檔名等具體內容全部是 Documentation Sample Value，不屬 Runtime Data Contract；程式禁止 seed/copy/建立 sample
      record。Runtime 只能讀實際 Context/Manifest/Result，缺值=—。
  - item: Stage Rail
    definition: 圖 1 的 Stage 1~5 是 EDIT-01-CMP-STAGE-RAIL 的只讀狀態顯示；不得點擊跳 Stage。Stage 前進只依 EDIT-01-STTR-01~05。
  - item: Micro Examples
    definition: 拖動/Move/Trim/Snap 示例若顯示在圖中，只是 EDIT-01-CMP-MICRO-ADJUSTMENT 的操作說明，不是第二套 Button；實際命令只使用 Control Registry 既有 UID。
  - item: Desktop ≥1440
    definition: Primary=20/80；Adjustment=38/62；Bottom=34/34/32；Preview 16:9。
  - item: Desktop 1280–1439
    definition: Asset Binding 固定 240px；Production Stack 使用剩餘寬度；Adjustment/Bottom 比例不變。
  - item: <1280
    definition: 不自行改 Drawer/Stack/新頁；Main Workspace min-width=1280px，允許水平捲動。
  - item: Vertical
    definition: Main Page Content 不綁 Global Menu/Sidebar 高度；整頁 overflow-y:auto；Section 依內容向下延伸。
  integration_boundary_note: 本章只做 EDIT-01 與既有 current registered authority Runtime Operation 的「邊界引用映射」。它不建立第二套 Backend、不把 VOICE/QA 內部實作改成 EDIT
    所有，也不改變單頁 UI。Operation ID、Effective Path、Permission、State Transition、Event 以 current registered authority Operation Registry 為底層權威；EDIT-01
    的頁面、Stage、Control/Action、視覺與使用流程仍以本文 CURRENT ONLY 為權威。
  department_flow:
    current_department: EDIT+VOICE
    upstream: VIDEO-01 exact handoff
    downstream: QA-01 exact handoff after integrated finalization
    separate_voice_page: FORBIDDEN
registries:
  sections:
  - section_uid: EDIT-01-SEC-01
    name: 來源與工作情境
    responsibility: Project Task Context、AUTO/MANUAL、Locked Blueprint/Production Package/Input Manifest 查看、開始/繼續、退回藍圖修正；Standalone 上傳入口
    fixed_position: Visual Region 1｜頁面最上方全寬 Context / Execution
  - section_uid: EDIT-01-SEC-02
    name: Media Bin／綁定輸入
    responsibility: PROJECT_TASK 顯示已綁定輸入與完整 Binding Integrity；STANDALONE 顯示上傳/Session Media
    fixed_position: Visual Region 2｜Primary Production Grid 左欄約20%；可捲動；Project mode 唯讀
  - section_uid: EDIT-01-SEC-03
    name: 主預覽／Transport
    responsibility: 單一 16:9 主預覽、frame 定位、音量、速率、Loop、Fullscreen
    fixed_position: Visual Region 3｜Production Stack 頂部；單一 16:9 Preview + Transport
  - section_uid: EDIT-01-SEC-04
    name: Timeline 導航與精準控制
    responsibility: Mini Timeline、Ruler、Playhead、In/Out、Marker、Snap、Zoom/Fit
    fixed_position: Visual Region 5｜Preview 下方第二工具列：Range / Marker / Snap / Zoom / Fit
  - section_uid: EDIT-01-SEC-05
    name: 多軌 Timeline
    responsibility: VIDEO/OVERLAY/VOICE/MUSIC/SFX/SUBTITLE/LIP_SYNC；Clip/Waveform；Dialogue Timing Binding
    fixed_position: Visual Region 6｜Production Stack Timeline；Video/Voice/Music/SFX/Subtitle/LipSync 多軌
  - section_uid: EDIT-01-SEC-06
    name: 人工剪輯工具／微調
    responsibility: Undo/Redo、Select/Razor/Split、Trim、Move、Delete、Duplicate、Transition、Speed、Volume/Fade、Range/Timecode/Nudge；只改 Working Draft
    fixed_position: Visual Region 4 + 8｜General Toolbar + Manual Micro-Adjustment；同一 Manual Command Authority
  - section_uid: EDIT-01-SEC-07
    name: Clip/Track Inspector
    responsibility: Selected Clip/Track 屬性、精準 timecode/volume/fade/transition/speed
    fixed_position: Visual Region 8 + 9｜Manual Context Fields + Bottom Inspector；不長駐右側
  - section_uid: EDIT-01-SEC-08
    name: API / AI 編輯
    responsibility: Current Stage/Script/Input Context、繁中修改要求、Correction Script Candidate、執行選定 Scope；首次生產不手填
    fixed_position: Visual Region 7｜Semantic Correction 左區；Project correction/Standalone 才接受繁中需求
  - section_uid: EDIT-01-SEC-09
    name: 配音
    responsibility: Project 只引用 Blueprint/Production Package 已綁定 Voice Asset；Standalone 才允許 Session Voice
    fixed_position: Visual Region 6 + 9｜Voice Track / Voice Inspector；Project 只引用既有綁定 Voice Asset
  - section_uid: EDIT-01-SEC-10
    name: 配樂／SFX／混音
    responsibility: Project 只引用已綁定 Music/SFX Asset 並執行 timing/level/mix；不搜尋素材庫
    fixed_position: Visual Region 6 + 9｜Music/SFX Tracks / Audio Inspector；Project 只引用既有綁定音檔
  - section_uid: EDIT-01-SEC-11
    name: 對嘴
    responsibility: 與 Voice/Subtitle 共用 Dialogue Timing Binding；Target/Execute/Preview/Retry/Issue
    fixed_position: Visual Region 6 + 9｜LipSync Track / Inspector；與 Voice/Subtitle 共用 Dialogue Timing Binding
  - section_uid: EDIT-01-SEC-12
    name: 字幕
    responsibility: 與 Voice/LipSync 共用 Dialogue Timing Binding；文字可編輯，Timing 以 Voice Segment anchor + offset 微調
    fixed_position: Visual Region 6 + 9｜Subtitle Track / Inspector；Timing 綁 Voice Segment anchor + offset
  - section_uid: EDIT-01-SEC-13
    name: Stage Evaluation／Issue／修正
    responsibility: Current Stage Evaluation、Issue/Evidence、Jump/Load Range/Recheck；只處理 EDIT 內部階段評分，不代表 QA 部門
    fixed_position: Visual Region 7 + 11｜Score/Issues/Evidence/Recheck + Gate Status；不佔獨立頂部右欄
  - section_uid: EDIT-01-SEC-14
    name: 版本
    responsibility: Save New Version、History、Compare、Restore as New Draft、Lock Exact Version
    fixed_position: Visual Region 10｜Bottom Operation Row 中區 Version Compare / Save / Restore / Lock
  - section_uid: EDIT-01-SEC-15
    name: 最終預覽／Render／Export／Handoff
    responsibility: Completion Gate、Render Settings/Job、Output Version、Download、Handoff
    fixed_position: Visual Region 11｜Bottom Operation Row 右區 Execution / Final Preview / Render / Output / Handoff
  - section_uid: EDIT-01-SEC-16
    name: 狀態／錯誤／工作佇列
    responsibility: 待辦通知、AUTO/MANUAL、Stage Machine、Script Section、Input Fingerprint、Stage Score、Job/Error
    fixed_position: Visual Region 1 + 11｜Context Status + Job/Error Trace；不得建立獨立平行頁
