name: Stage-02 Remaining Blocker Disposition R4

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/consolidate_current_stage2_remaining_blockers_r4.py'
      - '.github/workflows/stage02-remaining-blocker-disposition-r4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disposition-r4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py
      - name: Validate current structural and functional owning-layer remediation
        run: |
          python governance/ci/validate_current_stage2_materialized_closure.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_stage02_successor_integrity.py
      - name: Consolidate current 154 remaining blockers from fresh R2 evidence
        run: python governance/ci/consolidate_current_stage2_remaining_blockers_r4.py
      - name: Prove no formal specification or immutable Stage-01 authority mutation
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R4 is evidence/state disposition only; no product/spec authority was invented'
      - name: Commit blocker disposition and synchronized next action
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_REMAINING_BLOCKER_DISPOSITION_R4.yaml
          git add governance/test/ACTIVE_STATE.yaml
          git add governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R4 produced no persistent disposition change' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist remaining blocker disposition R4'
          git push origin HEAD:rebuild-v2.1.1
      - name: Upload R4 disposition
        uses: actions/upload-artifact@v4
        with:
          name: stage02-remaining-blocker-disposition-r4
          path: governance/test/stage02/STAGE02_REMAINING_BLOCKER_DISPOSITION_R4.yaml
          if-no-files-found: error
