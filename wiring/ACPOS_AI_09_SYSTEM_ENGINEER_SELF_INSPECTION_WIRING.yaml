responsible_not_responsible:
- 分類: Current Truth
  本文件負責: Session Bootstrap / Registry / Governance / Authority / WU / Resume / Evidence resolution
  本文件不負責: 替代 Mother Governance 或把 chat memory 當 Current Truth
- 分類: Inspection
  本文件負責: System/Functional/Data/Permission/Runtime/Dependency/Consumer trace
  本文件不負責: 自行發明未存在的產品需求
- 分類: Finding
  本文件負責: Finding lifecycle、evidence、severity、reproduction、owner candidate
  本文件不負責: 直接把 Finding 當產品 Authority
- 分類: Root Cause
  本文件負責: 因果鏈、owner resolution、shared-vs-local classification
  本文件不負責: 用症狀位置代替真正 Owner
- 分類: Change
  本文件負責: Change Candidate / Set / exact write-set / impact / rollback plan
  本文件不負責: 未授權就直接修改 Current Authority 或 Production
- 分類: Validation
  本文件負責: Simulation / Replay / targeted / full-line / hidden-defect sweep
  本文件不負責: 把 inner test success 當 outer terminal / Production success
- 分類: Execution
  本文件負責: 只在 pre-existing authorization + exact binding + gate PASS 後執行
  本文件不負責: 自我核准、跨 Owner 寫入、繞過 permission/gate
- 分類: Evolution
  本文件負責: Incident/Experience Candidate → governed adoption
  本文件不負責: AI 自行改寫自己的 policy / validator / governance
