  affected_closure_requires_authoritative_resolution_evidence: true
phase_boundary_contract:
  required_predecessor_phase: SOURCE_SEGMENT_MAPPING
  source_segment_mapping_must_be_completed_before_source_fact_start: true
  source_fact_materialization_after_segment_mapping: ALLOW
  source_fact_materialization_is_not_segment_mapping_boundary_violation: true
  before_source_fact_close:
    DOMAIN_EXTRACTION: BLOCK
    RESPONSIBILITY_CLASSIFICATION: BLOCK
    PAGE_BASE_BLUEPRINT_COMPILE: BLOCK
    VISUAL_BASE_BLUEPRINT_COMPILE: BLOCK
    BLUEPRINT_BINDING_COMPILE: BLOCK
    WEBSITE_CONSTRUCTION: BLOCK
    DEPLOYMENT: BLOCK
  after_source_fact_close:
    DOMAIN_EXTRACTION: ALLOW_BY_NEXT_GATE
    RESPONSIBILITY_CLASSIFICATION: ALLOW_BY_NEXT_GATE
    PAGE_BASE_BLUEPRINT_COMPILE: ALLOW_ONLY_AFTER_CLASSIFICATION_GATE
    VISUAL_BASE_BLUEPRINT_COMPILE: ALLOW_ONLY_AFTER_PAGE_BLUEPRINT_GATE
    BLUEPRINT_BINDING_COMPILE: ALLOW_ONLY_AFTER_PAGE_AND_VISUAL_BLUEPRINT_GATES
    WEBSITE_CONSTRUCTION: BLOCK_IN_STAGE_01
    DEPLOYMENT: BLOCK_IN_STAGE_01
  successor_gate_chain:
  - predecessor: SOURCE_FACT_MATERIALIZATION
    successor: RESPONSIBILITY_CLASSIFICATION
    required_gate: SOURCE_FACT_GATE_PASS
  - predecessor: RESPONSIBILITY_CLASSIFICATION
    successor: PAGE_BASE_BLUEPRINT_COMPILE
    required_gate: CLASSIFICATION_GATE_PASS
  - predecessor: PAGE_BASE_BLUEPRINT_COMPILE
    successor: VISUAL_BASE_BLUEPRINT_COMPILE
    required_gate: PAGE_BASE_BLUEPRINT_GATE_PASS
  - predecessor: VISUAL_BASE_BLUEPRINT_COMPILE
    successor: BLUEPRINT_BINDING_COMPILE
    required_gate: PAGE_AND_VISUAL_BLUEPRINT_GATES_PASS
  predecessor_validator_successor_policy:
    legal_successor_presence: ALLOW
    retroactive_predecessor_invalidation: FORBIDDEN
    predecessor_validator_scope: VALIDATE_PREDECESSOR_ARTIFACT_INTEGRITY_AND_GATE_EVIDENCE
    phase_order_enforcement_owner: PHASE_BOUNDARY_GUARD
    projection_wrapper_as_primary_acceptance_gate: FORBIDDEN
unresolved_external_authority_preservation_contract:
  source_fact_disposition: UNRESOLVED_AUTHORITY_GAP
  required_identity_fields: [gap_uid, authority_ref, consumer_source_uids, disposition, authority_evidence_ref]
