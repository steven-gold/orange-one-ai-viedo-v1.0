name: Temp 18 Page Business Content Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - name: Audit evaluation catalogs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import json,re
          docs={p.name:p for p in Path('.').glob('ACPOS_*.docx') if 'GLOBAL_HOME' not in p.name and 'SYSTEM_LOGIC_GLOBAL' not in p.name and 'LOGIN_' not in p.name}
          for fn,p in sorted(docs.items()):
              d=Document(p)
              tables=[]
              for i,t in enumerate(d.tables,1):
                  rr=[[" ".join(c.text.split()) for c in r.cells] for r in t.rows]
                  if not rr: continue
                  blob=" | ".join(" | ".join(r) for r in rr[:10])
                  if re.search(r'criteria|dimension|score|evaluation|quality|check|審查|評分|檢查|一致性|continuity|compliance',blob,re.I):
                      tables.append({"table":i,"rows":len(rr)-1,"header":rr[0],"samples":rr[1:8]})
              print("EVALCAT",fn,json.dumps(tables,ensure_ascii=False))
          PY
\n      - name: Audit concrete business content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import json,re

          docs={
          "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
          "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
          "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
          "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
          "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
          "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
          "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
          }
          # Domain concepts that should normally materialize into concrete rows if the page claims to manage them.
          concepts={
          "WB-01":["KPI","專案","待辦","執行中","待審查","修改率","已完成"],
          "CORE-01":["Project","Topic","Blueprint","Script","DNA","Character","Object","Scene","Subtitle"],
          "ASSET-01":["Character","Object","Scene","DNA","Reference","Style","Asset"],
          "VIDEO-01":["Shot","Scene","Camera","Duration","Motion","Video","Generation"],
          "EDIT-01":["Timeline","Track","Clip","Transition","Subtitle","Audio","Voice","BGM","SFX","Render"],
          "QA-01":["人物一致性","角色一致性","字幕","構圖","嘴型","口型","音訊","幀間","連續性","Dimension","Required Check"],
          "DB-01":["Entity","Table","Relation","Lineage","Version","Audit"],
          "STR-01":["Strategy","Objective","Decision","Candidate","Evidence","Risk","Scenario"],
          "INFO-01":["Source","Ingestion","Extract","Metadata","Classification","Evidence"],
          "SYS-01":["Lifecycle","Change","Sandbox","Release","Rollback","Maintenance","Incident"],
          "IAM-01":["Role","Permission","Account","Scope","Assignment","Department"],
          "DEV-01":["Discovery","Campaign","Lead","Target","Delivery","Stage"],
          "SOC-01":["Channel","Platform","Publish","Schedule","Post","Account","Content"],
          "ERP-01":["Revenue","Expense","Invoice","Budget","Cost","Payment","Finance"],
          "AIAPI-01":["Provider","Model","Capability","Credential","Route","Queue","Quarantine"],
          "SG-02":["人物一致性","角色一致性","字幕","構圖","嘴型","口型","音訊","幀間","連續性","Dimension","Threshold","Required Check"],
          "ADMIN-STR-01":["Strategy","Candidate","Compare","Decision","Evidence","Risk","Export"],
          "KB-01":["Knowledge","Experience","Acquisition","Source","Semantic","Index","Category"],
          }
          generic=re.compile(r'no data|no .* registered|empty|source_not_defined|not executed|待建立|尚未建立|未建立|沒有可顯示|placeholder|mock|sample',re.I)
          report={}
          for uid,fn in docs.items():
              d=Document(fn)
              paras=[p.text.strip() for p in d.paragraphs if p.text.strip()]
              tables=[]
              rows=[]
              for ti,t in enumerate(d.tables,1):
                  rr=[[" ".join(c.text.split()) for c in r.cells] for r in t.rows]
                  if not rr: continue
                  tables.append({"index":ti,"header":rr[0],"rows":len(rr)})
                  for r in rr[1:]:
                      if any(x.strip() for x in r): rows.append(r)
              text="\n".join(paras+[" | ".join(r) for r in rows])
              found=[x for x in concepts[uid] if x.lower() in text.lower()]
              generic_hits=[p for p in paras if generic.search(p)][:20]
              # Candidate business catalogs: tables with at least 4 data rows and headers suggesting domain items,
              # excluding exact construction/binding matrices and generic authority metadata.
              candidates=[]
              for ti,t in enumerate(d.tables,1):
                  rr=[[" ".join(c.text.split()) for c in r.cells] for r in t.rows]
                  if len(rr)<5: continue
                  h=" | ".join(rr[0]).lower()
                  if any(k in h for k in ["control uid","action uid","authority","runtime status","method / path","permission","source commit"]):
                      continue
                  if any(k in h for k in ["item","name","type","category","dimension","check","stage","role","channel","provider","model","entity","field","metric","kpi","component","section"]):
                      candidates.append({"table":ti,"rows":len(rr)-1,"header":rr[0],"samples":rr[1:5]})
              report[uid]={
                "file":fn,
                "paragraphs":len(paras),
                "tables":len(d.tables),
                "concepts_found":found,
                "candidate_business_catalogs":candidates[:12],
                "generic_or_empty_signals":generic_hits,
              }
          print("BUSINESS_CONTENT_AUDIT_BEGIN")
          print(json.dumps(report,ensure_ascii=False))
          print("BUSINESS_CONTENT_AUDIT_END")
          PY
