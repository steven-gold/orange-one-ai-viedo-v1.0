name: ACPOS Batch 08 Authority Remediation Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-08-authority-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_08_authority_remediation_audit.py
      - name: Run Batch 08 authority remediation audit
        run: python __temp/batch_08_authority_remediation_audit.py
      - name: Upload Batch 08 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-08-authority-remediation-audit
          path: __batch08_authority_remediation_audit.json
          retention-days: 1
