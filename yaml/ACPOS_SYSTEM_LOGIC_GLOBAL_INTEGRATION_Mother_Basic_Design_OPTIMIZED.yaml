  - index: 3
    style: Normal
    text: System Logic / Global Integration
  - index: 4
    style: Normal
    text: 18 頁、中央大腦、Identity／Permission／Data／AI／Queue／Audit 的單一整合契約
  - index: 7
    style: Heading 1
    text: 1. Whole-site Architecture
  - index: 9
    style: Normal
    text: 圖 1　18 個 Current Page 圍繞 ACPOS Central Brain；共享 Runtime 位於底層，Domain Owner 不被取代。
  - index: 10
    style: Heading 1
    text: 2. Current Page Universe / 18 頁
  - index: 12
    style: Heading 1
    text: 3. ACPOS Brain Layers
  - index: 14
    style: Heading 1
    text: 4. System Truth Precedence
  - index: 15
    style: Normal
    text: 1.  Current Page Authority：決定各頁 Business / UI 行為。
  - index: 16
    style: Normal
    text: 2.  Global Shell / Navigation / Visual：決定全站外框、路由目標、視覺 Token。
  - index: 17
    style: Normal
    text: 3.  System Authority：決定跨頁 Context、Orchestration、AI、Experience、Integration。
  - index: 18
    style: Normal
    text: 4.  Runtime Contracts：決定 Identity、DB、Queue 等實際技術邊界。
  - index: 19
    style: Normal
    text: 5.  Implementation / Test / Deployment Evidence：只能證明是否已施工，不反向改寫 Authority。
  - index: 21
    style: Heading 1
    text: 5. Core Production Flow / 五大生產鏈
  - index: 23
    style: List Bullet
    text: 每階段必須消費 exact upstream refs，不用 latest/current/default alias。
  - index: 24
    style: List Bullet
    text: AUTO / MANUAL 只改 progression behavior，不改 Source Truth。
  - index: 25
    style: List Bullet
    text: 任何修改建立新 version，禁止 silent overwrite。
  - index: 26
    style: List Bullet
    text: QA 不自己生成替代媒體；Correction 回到真正的 production owner。
  - index: 27
    style: Heading 1
    text: 6. Identity → Permission → Page Gate
  - index: 28
    style: Normal
    text: 1.  瀏覽器攜帶 `acpos_session` HttpOnly Cookie。
  - index: 29
    style: Normal
    text: 2.  Identity Runtime 解析 runtime session → READY account → non-disabled app_users actor。
  - index: 30
    style: Normal
    text: 3.  Shell 取得 `visible_page_uids`，只顯示授權 Front/Admin L1。
  - index: 31
    style: Normal
    text: 4.  進入 Page 時再執行 exact page / section / action / control / API / field permission + scope + state gate。
  - index: 32
    style: Normal
    text: 5.  Effectful write 額外要求 expected_version、idempotency、correlation、audit。
  - index: 33
    style: Normal
    text: 6.  Permission denied = HIDDEN；authorized but state blocked = DISABLED + reason。
  - index: 34
    style: Heading 1
    text: 7. Context / AI / Provider Routing
  - index: 37
    style: Heading 1
    text: 8. Shared External Data Acquisition
  - index: 39
    style: List Bullet
    text: Shared Acquisition Runtime 統一負責 robots/rights/domain/rate/retry/snapshot/dedupe/normalize/evidence/audit。
  - index: 40
    style: List Bullet
    text: Page 不可建立第二套 crawler，亦不可把 raw crawl result 直接寫成 Canon / Knowledge / Strategy Truth。
  - index: 41
    style: Heading 1
    text: 9. Data / Queue / Version / Audit
  - index: 43
    style: Heading 1
    text: 10. Cross-page Handoff Contract
  - index: 45
    style: Heading 1
    text: 11. Failure / Recovery Model
  - index: 47
    style: Heading 1
    text: 12. Global Acceptance Matrix
  - index: 50
    style: Heading 1
    text: 13. Construction / Verification Order
  - index: 51
    style: Normal
    text: 1.  先施工／驗證 Global Shell adaptive reflow，讓所有頁面共享同一穩定 mount geometry。
  - index: 52
    style: Normal
    text: 2.  驗證 Login / Identity session 與登入後可見 Navigation。
  - index: 53
    style: Normal
    text: 3.  逐頁對接 Page Authority → Control → Action → Permission → API → Runtime → DB / Provider。
  - index: 54
    style: Normal
    text: 4.  驗證五大生產鏈 exact-version handoff 與 correction round-trip。
  - index: 55
    style: Normal
    text: 5.  驗證 AIAPI router / queue / provider adapter / normalized result lineage。
  - index: 56
    style: Normal
    text: 6.  驗證 KB / INFO / Strategy / DEV / SOC 對 shared acquisition 的 domain-specific binding。
  - index: 57
    style: Normal
    text: 7.  跑全站 permission-denied / version-conflict / missing-authority / provider-failure / queue-failure / stale-data negative tests。
  - index: 58
    style: Normal
    text: 8.  最後才做 Production deployment / remote browser / external provider E2E；不得由文件或本機測試推定。
  - index: 59
    style: Heading 1
    text: 14. Verification Evidence Layers
  - index: 63
    style: Heading 1
    text: Exhaustive Functional / System Logic / Cross-stage Closure Contract
