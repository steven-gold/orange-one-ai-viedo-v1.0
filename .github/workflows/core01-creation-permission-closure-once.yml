name: CORE01 Creation Permission Closure Once
on:
  push:
    branches: [new]
    paths:
      - .github/workflows/core01-creation-permission-closure-once.yml
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Patch current authority and implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # CORE Current Authority: explicit user-approved account permission gate.
          p=Path('authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml')
          s=p.read_text()
          anchor='  parallel_authority_for_same_page: FORBIDDEN\n'
          block='''  parallel_authority_for_same_page: FORBIDDEN\ncreation_authorization_policy:\n  source: USER_CURRENT_REQUIREMENT_2026-08-31\n  scope:\n  - CORE-01-ACT-PROJECT-CREATE\n  - CORE-01-ACT-TOPIC-CREATE\n  account_identity_source: Authenticated current account resolved by IAM-01 / account permission runtime\n  required_permissions:\n    CORE-01-ACT-PROJECT-CREATE: CORE_PROJECT_WRITE\n    CORE-01-ACT-TOPIC-CREATE: CORE_TOPIC_WRITE\n  authorization_order: Resolve authenticated account -> resolve exact registered permission -> only then open registered draft form/schema -> gate -> mutation\n  iam_not_ready_behavior: BLOCK\n  unauthenticated_behavior: BLOCK\n  missing_permission_behavior: BLOCK\n  test_only_permission_bypass: FORBIDDEN\n  control_behavior_when_denied: Control remains clickable for permission evaluation; creation mutation is forbidden; show denial in existing Runtime Stage Strip.\n  denial_reason_codes:\n  - AUTHENTICATED_ACCOUNT_REQUIRED\n  - IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND\n  - REQUIRED_PERMISSION_MISSING\n  denial_notice_zh_tw: 建立功能已拒絕：必須由已登入帳號通過帳號權限驗證；帳號權限系統尚未完成或目前帳號缺少所需權限。\n  security_rule: Client denial is UX only; server authorization is mandatory and direct API bypass must also be denied.\n'''
          if 'creation_authorization_policy:' not in s:
              assert anchor in s
              s=s.replace(anchor,block,1)
          old='    recovery: Disable control + show actual permission reason\n'
          new='    recovery: For Project/Topic creation keep the control clickable for permission evaluation, block mutation, and show the actual permission reason in the existing Runtime Stage Strip; other controls follow registered permission behavior.\n'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # Current i18n authority gets visible text only because source text now exists in CORE Current Authority.
          p=Path('authority/global/ACPOS_I18N_TRANSLATION_ENCODING_FINAL_LOCKED_V1.0.yaml')
          s=p.read_text()
          anchor='    control.create_topic: { zh-TW: 建立 Topic, zh-CN: 建立 Topic, en: Create Topic }\n'
          insert=anchor+'    notice.creation_permission_denied: { zh-TW: "建立功能已拒絕：必須由已登入帳號通過帳號權限驗證；帳號權限系統尚未完成或目前帳號缺少所需權限。", zh-CN: "创建功能已拒绝：必须由已登录账号通过账号权限验证；账号权限系统尚未完成或当前账号缺少所需权限。", en: "Creation denied: the signed-in account must pass account permission validation; IAM is not ready or the current account lacks the required permission." }\n'
          if 'notice.creation_permission_denied:' not in s:
              assert anchor in s
              s=s.replace(anchor,insert,1)
          p.write_text(s)

          # Runtime i18n catalog mirrors exact Current i18n authority.
          p=Path('src/i18n/coreCatalog.ts')
          s=p.read_text()
          anchor='  "core01.control.create_topic": { "zh-TW": "建立 Topic", "zh-CN": "建立 Topic", en: "Create Topic" },\n'
          insert=anchor+'  "core01.notice.creation_permission_denied": { "zh-TW": "建立功能已拒絕：必須由已登入帳號通過帳號權限驗證；帳號權限系統尚未完成或目前帳號缺少所需權限。", "zh-CN": "创建功能已拒绝：必须由已登录账号通过账号权限验证；账号权限系统尚未完成或当前账号缺少所需权限。", en: "Creation denied: the signed-in account must pass account permission validation; IAM is not ready or the current account lacks the required permission." },\n'
          if 'core01.notice.creation_permission_denied' not in s:
              assert anchor in s
              s=s.replace(anchor,insert,1)
          p.write_text(s)

          # Client authorization adapter: fail closed until IAM/account permission runtime binds it.
          Path('src/domain/core/coreCreationPermissionAdapter.ts').write_text('''export type CoreCreationPermissionKind = "PROJECT" | "TOPIC";\n\nexport type CoreCreationPermissionContext = {\n  kind: CoreCreationPermissionKind;\n};\n\nexport type CoreCreationPermissionResult =\n  | { allowed: true; required_permission_uid: "CORE_PROJECT_WRITE" | "CORE_TOPIC_WRITE" }\n  | { allowed: false; reason_code: string; required_permission_uid: "CORE_PROJECT_WRITE" | "CORE_TOPIC_WRITE" };\n\nexport type CoreCreationPermissionAdapter = {\n  authorizeCreation: (context: CoreCreationPermissionContext & { required_permission_uid: "CORE_PROJECT_WRITE" | "CORE_TOPIC_WRITE" }) => Promise<CoreCreationPermissionResult> | CoreCreationPermissionResult;\n};\n\nlet adapter: CoreCreationPermissionAdapter | null = null;\n\nexport function configureCoreCreationPermissionAdapter(next: CoreCreationPermissionAdapter): void { adapter = next; }\nexport function isCoreCreationPermissionAdapterBound(): boolean { return adapter !== null; }\n\nfunction requiredPermission(kind: CoreCreationPermissionKind): "CORE_PROJECT_WRITE" | "CORE_TOPIC_WRITE" {\n  return kind === "PROJECT" ? "CORE_PROJECT_WRITE" : "CORE_TOPIC_WRITE";\n}\n\nexport async function requestCoreCreationPermission(context: CoreCreationPermissionContext): Promise<CoreCreationPermissionResult> {\n  const required_permission_uid = requiredPermission(context.kind);\n  const current = adapter;\n  if (!current) return { allowed: false, reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND", required_permission_uid };\n  try {\n    const result = await current.authorizeCreation({ ...context, required_permission_uid });\n    if (!result.allowed) return { ...result, required_permission_uid };\n    if (result.required_permission_uid !== required_permission_uid) return { allowed: false, reason_code: "REQUIRED_PERMISSION_MISMATCH", required_permission_uid };\n    return result;\n  } catch {\n    return { allowed: false, reason_code: "AUTHORIZATION_EVALUATION_FAILED", required_permission_uid };\n  }\n}\n''')

          # CoreVisual: permission first, then context/form/mutation; existing Runtime Stage renders friendly denial plus exact reason.
          p=Path('src/components/pages/CoreVisual.tsx')
          s=p.read_text()
          old='import { requestCoreDraftFormPayload } from "@/domain/core/coreDraftFormAdapter";\n'
          new=old+'import { requestCoreCreationPermission } from "@/domain/core/coreCreationPermissionAdapter";\n'
          if 'coreCreationPermissionAdapter' not in s:
              assert old in s
              s=s.replace(old,new,1)
          old='''  const runDraftCreate = async (kind: "PROJECT" | "TOPIC") => {\n    const action: CoreActionUid = kind === "PROJECT" ? "CORE-01-ACT-PROJECT-CREATE" : "CORE-01-ACT-TOPIC-CREATE";\n    const projectId = kind === "TOPIC" ? requireProjectId() : null;\n    if (kind === "TOPIC" && !projectId) return;\n    const form = await requestCoreDraftFormPayload(kind === "PROJECT" ? { kind } : { kind, project_id: projectId! });\n'''
          new='''  const runDraftCreate = async (kind: "PROJECT" | "TOPIC") => {\n    const action: CoreActionUid = kind === "PROJECT" ? "CORE-01-ACT-PROJECT-CREATE" : "CORE-01-ACT-TOPIC-CREATE";\n    const permission = await requestCoreCreationPermission({ kind });\n    if (!permission.allowed) {\n      reportBlock(`CORE-01-ERR-PERM-001:${permission.reason_code}:${permission.required_permission_uid}`);\n      return;\n    }\n    const projectId = kind === "TOPIC" ? requireProjectId() : null;\n    if (kind === "TOPIC" && !projectId) return;\n    const form = await requestCoreDraftFormPayload(kind === "PROJECT" ? { kind } : { kind, project_id: projectId! });\n'''
          if old not in s:
              raise SystemExit('runDraftCreate anchor missing')
          s=s.replace(old,new,1)
          old='  const runtimeDisplay = runtimeReason ?? display("runtime_stage");\n'
          new='  const runtimeDisplay = runtimeReason?.startsWith("CORE-01-ERR-PERM-001:") ? `${t("core01.notice.creation_permission_denied")} (${runtimeReason.split(":").slice(1).join(":")})` : runtimeReason ?? display("runtime_stage");\n'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # Server defense: unbound formal runtime reports permission/IAM blocker for creation rather than generic runtime blocker.
          p=Path('src/server/core/coreRuntime.ts')
          s=p.read_text()
          old='''  const runtime = bindings ?? (isControlledCoreServerTestMode() ? getControlledCoreTestRuntimeBindings() : null);\n  if (!runtime) return { ok: false, error_uid: "CORE-01-ERR-CONTEXT-001", reason_code: "CORE_RUNTIME_NOT_BOUND", correlation_id: request.correlation_id, status: 503 };\n'''
          new='''  const runtime = bindings ?? (isControlledCoreServerTestMode() ? getControlledCoreTestRuntimeBindings() : null);\n  if (!runtime) {\n    if (request.port_uid === "CORE-01-PORT-PROJECT-CREATE" || request.port_uid === "CORE-01-PORT-TOPIC-CREATE") {\n      return { ok: false, error_uid: "CORE-01-ERR-PERM-001", reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND", correlation_id: request.correlation_id, status: 403 };\n    }\n    return { ok: false, error_uid: "CORE-01-ERR-CONTEXT-001", reason_code: "CORE_RUNTIME_NOT_BOUND", correlation_id: request.correlation_id, status: 503 };\n  }\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # TEST runtime must not auto-grant Project/Topic creation permission.
          p=Path('src/server/testing/controlledCoreTestRuntime.ts')
          s=p.read_text()
          old='    authorize: async () => ({ allowed: true }),\n'
          new='''    authorize: async (request) => {\n      if (request.port_uid === "CORE-01-PORT-PROJECT-CREATE" || request.port_uid === "CORE-01-PORT-TOPIC-CREATE") {\n        return { allowed: false, reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND" };\n      }\n      return { allowed: true };\n    },\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          git diff --check
          git diff --name-only

      - name: Authority and source assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'account_identity_source: Authenticated current account resolved by IAM-01' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          grep -q 'test_only_permission_bypass: FORBIDDEN' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          grep -q 'CORE-01-ACT-PROJECT-CREATE: CORE_PROJECT_WRITE' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          grep -q 'CORE-01-ACT-TOPIC-CREATE: CORE_TOPIC_WRITE' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          grep -q 'core01.notice.creation_permission_denied' src/i18n/coreCatalog.ts
          grep -q 'requestCoreCreationPermission' src/components/pages/CoreVisual.tsx
          ! grep -q 'authorize: async () => ({ allowed: true })' src/server/testing/controlledCoreTestRuntime.ts
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          echo AUTHORITY_PERMISSION_LOCK_PASS

      - name: Install audit typecheck build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json >/tmp/audit.json || true
          node - <<'NODE'
          const a=require('/tmp/audit.json'); if(a.metadata.vulnerabilities.total!==0){console.error(a.metadata.vulnerabilities);process.exit(1)} console.log('AUDIT_ZERO_PASS')
          NODE
          npm run typecheck
          npm run build
          echo COMPILE_PASS

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Next
        shell: bash
        run: |
          nohup npm run start -- -p 3000 >/tmp/core-permission-next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/core >/dev/null && exit 0; sleep 1; done
          cat /tmp/core-permission-next.log; exit 1

      - name: Browser denial and server bypass tests
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const A=(v,m)=>{if(!v)throw new Error(m)};
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const writes=[]; page.on('request',r=>{if(r.method()==='POST' && (/\/v1\/projects\/drafts$/.test(r.url()) || /\/v1\/projects\/[^/]+\/topics$/.test(r.url()))) writes.push(r.url())});
            await page.goto('http://127.0.0.1:3000/core',{waitUntil:'networkidle'});
            await page.locator('[data-page-uid="CORE-01"][data-page-state="READY"]').waitFor();
            const project=page.locator('[data-control-id="CORE-01-BTN-PROJECT-CREATE"]');
            const topic=page.locator('[data-control-id="CORE-01-BTN-TOPIC-CREATE"]');
            A(await project.isEnabled(),'project create unexpectedly disabled');
            A(await topic.isEnabled(),'topic create unexpectedly disabled');
            await project.click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND'));
            A((await page.locator('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"]').textContent()).includes('建立功能已拒絕'),'project denial notice missing');
            A(await page.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count()===1,'project mutated despite denial');
            await topic.click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('CORE_TOPIC_WRITE'));
            A((await page.locator('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"]').textContent()).includes('建立功能已拒絕'),'topic denial notice missing');
            A(writes.length===0,`UI emitted forbidden create POSTs: ${writes}`);

            const api=page.request;
            const p=await api.post('http://127.0.0.1:3000/v1/projects/drafts',{headers:{'x-core-action-uid':'CORE-01-ACT-PROJECT-CREATE'},data:{data_classification:'TEST_ONLY',synthetic:true,production_eligible:false}});
            A(p.status()===403,`direct project bypass status ${p.status()}`); const pj=await p.json(); A(pj.error_uid==='CORE-01-ERR-PERM-001','project bypass wrong error'); A(pj.reason_code==='IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND','project bypass wrong reason');
            const t=await api.post('http://127.0.0.1:3000/v1/projects/TEST-PROJ/topics',{headers:{'x-core-action-uid':'CORE-01-ACT-TOPIC-CREATE'},data:{data_classification:'TEST_ONLY',synthetic:true,production_eligible:false}});
            A(t.status()===403,`direct topic bypass status ${t.status()}`); const tj=await t.json(); A(tj.error_uid==='CORE-01-ERR-PERM-001','topic bypass wrong error'); A(tj.reason_code==='IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND','topic bypass wrong reason');
            const proj=await api.get('http://127.0.0.1:3000/v1/ui-projections/CORE-01'); const j=await proj.json(); A((j.value?.projects??j.projects??[]).length===0,'server bypass created project');
            console.log('CORE01_CREATION_PERMISSION_PASS ui_posts=0 server_project=403 server_topic=403');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Residual logic scan
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          cv=Path('src/components/pages/CoreVisual.tsx').read_text()
          assert cv.index('requestCoreCreationPermission({ kind })') < cv.index('requestCoreDraftFormPayload(')
          assert 'CORE-01-ERR-PERM-001:${permission.reason_code}:${permission.required_permission_uid}' in cv
          ca=Path('src/domain/core/coreCreationPermissionAdapter.ts').read_text()
          assert 'IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND' in ca
          assert 'if (!current) return { allowed: false' in ca
          tr=Path('src/server/testing/controlledCoreTestRuntime.ts').read_text()
          assert 'CORE-01-PORT-PROJECT-CREATE' in tr and 'CORE-01-PORT-TOPIC-CREATE' in tr
          assert 'authorize: async () => ({ allowed: true })' not in tr
          for p in [Path('src/domain/core/coreCreationPermissionAdapter.ts'),Path('src/components/pages/CoreVisual.tsx'),Path('src/server/core/coreRuntime.ts')]:
              s=p.read_text()
              for bad in ['TODO','FIXME','HACK','NOT_IMPLEMENTED','@ts-ignore','debugger;']:
                  assert bad not in s, (p,bad)
          print('CREATION_PERMISSION_RESIDUAL_PASS')
          PY

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- next-env.d.ts tsconfig.json 2>/dev/null || true
          git add authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml authority/global/ACPOS_I18N_TRANSLATION_ENCODING_FINAL_LOCKED_V1.0.yaml src/i18n/coreCatalog.ts src/domain/core/coreCreationPermissionAdapter.ts src/components/pages/CoreVisual.tsx src/server/core/coreRuntime.ts src/server/testing/controlledCoreTestRuntime.ts
          git diff --cached --check
          git commit -m "fix(core): gate project topic creation by account permission"
          git push origin new

      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          if [ -f .github/workflows/core01-creation-permission-closure-once.yml ]; then
            git rm -f .github/workflows/core01-creation-permission-closure-once.yml
            git commit -m "chore: remove CORE01 creation permission workflow"
            git push origin new
          fi
