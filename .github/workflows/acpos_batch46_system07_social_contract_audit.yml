name: ACPOS Batch 46 System07 Social Contract Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch46-system07-social-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 45 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="ff050d80da5495ed70a4e4a6380d89226e5f8e00"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH45 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 46 System07 social audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch46_system07_social_contract_audit.py

      - name: Verify Batch 46 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch46_system07_social_contract_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["operations"]==14,s
          assert s["owner_paragraph_hits"]+s["owner_table_hits"]>0,s
          print("PASS: BATCH46 SYSTEM07 SOCIAL CONTRACT EVIDENCE")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 46 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch46-system07-social-contract-audit
          path: |
            __batch46_system07_social_contract_audit.json
            __batch46_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 46 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch46_system07_social_contract_audit.json __batch46_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-46-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch46_system07_social_contract_audit.py .github/workflows/acpos_batch46_system07_social_contract_audit.yml
          git commit -m "chore(acpos): close batch 46 system07 social contract audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH46 HARNESS REMOVED / CLEAN TREE"
