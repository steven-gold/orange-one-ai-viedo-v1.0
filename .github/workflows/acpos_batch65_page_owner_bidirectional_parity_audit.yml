name: ACPOS Batch 65 Page Owner Bidirectional Parity Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch65-page-owner-parity-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 64 clean Word boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="b9449ee5c35db102195385927402e8e05b074e70"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH64 WORD BOUNDARY"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 65 page-owner parity audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch65_page_owner_bidirectional_parity_audit.py

      - name: Verify audit completeness
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch65_page_owner_parity_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["page_exact_rows"]>0,s
          assert s["owner_resolved"]>0,s
          print("PASS: BATCH65 PAGE-OWNER PARITY AUDIT")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 65 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch65-page-owner-bidirectional-parity-audit
          path: |
            __batch65_page_owner_parity_audit.json
            __batch65_summary.json
          retention-days: 2
          if-no-files-found: error

      - name: Remove Batch 65 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch65_page_owner_parity_audit.json __batch65_summary.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-65-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch65_page_owner_bidirectional_parity_audit.py .github/workflows/acpos_batch65_page_owner_bidirectional_parity_audit.yml
          git commit -m "chore(acpos): close batch 65 page owner parity audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH65 HARNESS REMOVED / CLEAN TREE"
