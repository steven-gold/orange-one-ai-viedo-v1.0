name: Stage-03 v2.2.15 Producer Patch

"on":
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/governance-maintenance/patch_stage03_producer_v2215.py
      - .github/workflows/stage03-producer-v2215-patch.yml

permissions:
  contents: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage03-producer-patch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock patch source SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Apply AST-bounded producer patch
        run: python .github/governance-maintenance/patch_stage03_producer_v2215.py
      - name: Validate clean-baseline and mutation safety
        run: |
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-03
      - name: Persist producer patch and request fresh Stage-03 execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/ci/run_current_stage3_visual_design.py
          git rm .github/governance-maintenance/patch_stage03_producer_v2215.py .github/workflows/stage03-producer-v2215-patch.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m "[stage03-execute] fix(stage03): align producer to v2.2.15 visual materialization"
          git push origin "HEAD:${GITHUB_REF_NAME}"
