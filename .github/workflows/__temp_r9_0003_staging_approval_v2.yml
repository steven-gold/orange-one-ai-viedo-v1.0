name: TEMP R9 0003 Staging Approval V2

on:
  push:
    branches: [r9-0003-staging-approval-20260904-v2]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r9-0003-staging-approval-20260904-v2
          fetch-depth: 1
      - name: Record explicit CR-AUTH-0003 staging approval
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ap=Path('authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml')
          mp=Path('authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml')
          a=ap.read_text(encoding='utf-8')
          m=mp.read_text(encoding='utf-8')
          def one(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old,new,1)
          a=one(a,
              "  staging_apply_approval: NOT_GRANTED",
              "  staging_apply_approval: APPROVED\n  staging_apply_approved_on: '2026-09-04'\n  staging_apply_approved_by: HUMAN_USER\n  staging_apply_approval_ref: CR-AUTH-0003\n  staging_apply_scope: APPLY_VALIDATED_0003_TO_STAGING_ONLY\n  pre_0003_restore_branch_id: br-icy-field-b383fiso",
              'authority staging approval')
          a=one(a,
              '  0003_state: TEMP_VALIDATION_PASS_PENDING_CR_AUTH_0003_STAGING_APPROVAL\n  0003_temporary_execution: PASS\n  0003_staging_execution: FORBIDDEN_UNTIL_EXPLICIT_CR_AUTH_0003_STAGING_APPROVAL',
              '  0003_state: STAGING_APPROVED_PENDING_EXECUTION\n  0003_temporary_execution: PASS\n  0003_staging_execution: APPROVED_PENDING_EXECUTION',
              'authority gate')
          m=one(m,
              '    0003_gate: TEMP_VALIDATION_PASS_PENDING_CR_AUTH_0003_STAGING_APPROVAL',
              '    0003_gate: STAGING_APPROVED_PENDING_EXECUTION',
              'manifest gate')
          m=one(m,
              '    0003_staging_execution: NOT_EXECUTED_REQUIRES_EXPLICIT_HUMAN_APPROVAL',
              '    0003_staging_execution: APPROVED_PENDING_EXECUTION\n    0003_staging_approval_ref: CR-AUTH-0003\n    0003_restore_branch_id: br-icy-field-b383fiso',
              'manifest approval')
          ap.write_text(a,encoding='utf-8')
          mp.write_text(m,encoding='utf-8')
          PY
          git diff --check
          git config user.name "acpos-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          git commit -m "docs(authority): record CR-AUTH-0003 staging approval"
          git push origin HEAD:r9-0003-staging-approval-20260904-v2
