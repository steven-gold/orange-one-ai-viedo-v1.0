name: Temporary DOCX Binding Audit

on:
  push:
    branches:
      - 0921acpos

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install parser
        run: python -m pip install --quiet python-docx
      - name: Build exact binding coverage report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          from docx import Document

          ROOT=Path('.')
          OUT=ROOT/'__authority_extract__'
          OUT.mkdir(exist_ok=True)

          BASIC=[p for p in sorted(ROOT.glob('ACPOS_*.docx'))]
          def norm(s):
              return re.sub(r'\s+',' ',str(s or '').strip())
          def key(s):
              return re.sub(r'[^a-z0-9]+',' ',norm(s).lower()).strip()

          def rows(table):
              return [[norm(c.text) for c in r.cells] for r in table.rows]

          def hmap(header):
              return {key(v):i for i,v in enumerate(header)}

          def pick(row,hm,*names):
              for n in names:
                  i=hm.get(key(n))
                  if i is not None and i < len(row):
                      return norm(row[i])
              return ''

          report={'schema_version':1,'pages':{},'files':[]}
          for p in BASIC:
              d=Document(p)
              file_hash=hashlib.sha256(p.read_bytes()).hexdigest()
              page_uid=''
              all_tables=[]
              for ti,t in enumerate(d.tables):
                  rr=rows(t)
                  if not rr: continue
                  all_tables.append(rr)
                  for row in rr[:8]:
                      if len(row)>=2 and key(row[0]) in {'page uid','pageuid'} and row[1]:
                          page_uid=row[1]
              if not page_uid:
                  m=re.search(r'ACPOS_([A-Za-z0-9-]+)',p.name)
                  page_uid=(m.group(1) if m else p.stem)
              page={
                  'source_file':p.name,'source_sha256':file_hash,'page_uid':page_uid,
                  'controls':[],'actions':[],'ports':[],'permissions':[],'gates':[],
                  'state_tables':[],'error_tables':[],'payload_data_tables':[],'other_binding_tables':[],
                  'joined_bindings':[],'gaps':[]
              }
              for rr in all_tables:
                  header=rr[0]
                  hk=[key(x) for x in header]
                  hs=' | '.join(hk)
                  hm=hmap(header)
                  data=rr[1:]
                  if any(x in hk for x in ['control uid','controluid']):
                      for row in data:
                          uid=pick(row,hm,'Control UID','Control')
                          if not uid: continue
                          page['controls'].append({
                            'control_uid':uid,'section':pick(row,hm,'Sec','Section','Section UID'),
                            'component':pick(row,hm,'Component','Component UID'),'type':pick(row,hm,'Type','Control Type'),
                            'label':pick(row,hm,'Label','Name'),'action_uid':pick(row,hm,'Action','Action UID'),
                            'gate_uid':pick(row,hm,'Gate','Gate UID'),'permission':pick(row,hm,'Permission','Permission UID'),
                            'raw':row
                          })
                  elif any(x in hk for x in ['action uid','actionuid']):
                      for row in data:
                          uid=pick(row,hm,'Action UID','Action')
                          if not uid: continue
                          page['actions'].append({
                            'action_uid':uid,'label':pick(row,hm,'Label','Name'),'permission':pick(row,hm,'Permission','Permission UID'),
                            'gate_uid':pick(row,hm,'Gate','Gate UID'),'effect':pick(row,hm,'Effect','Effect Class'),
                            'port_owner':pick(row,hm,'Port / Owner','Port/Owner','Port','Owner'),
                            'raw':row
                          })
                  elif any(x in hk for x in ['port uid','portuid']):
                      for row in data:
                          uid=pick(row,hm,'Port UID','Port')
                          if not uid: continue
                          page['ports'].append({
                            'port_uid':uid,'boundary':pick(row,hm,'Boundary'),'operation':pick(row,hm,'Operation'),
                            'method_path':pick(row,hm,'Method / Path','Method/Path','Path','Endpoint'),
                            'permission':pick(row,hm,'Permission'),'raw':row
                          })
                  elif ('permission' in hk or 'permission uid' in hk) and any(x in hs for x in ['backend','purpose','scope']):
                      page['permissions'].extend([{'raw':r} for r in data if any(norm(c) for c in r)])
                  elif ('gate uid' in hk or hk[:1]==['gate']) and any(x in hs for x in ['condition','rule','requirement','purpose']):
                      page['gates'].extend([{'raw':r} for r in data if any(norm(c) for c in r)])
                  elif any('error' in x for x in hk) or any((r and re.search(r'-ERR-',r[0])) for r in data):
                      page['error_tables'].append(rr)
                  elif any(x in hs for x in ['state','status']) and any(x in hs for x in ['transition','meaning','condition','next']):
                      page['state_tables'].append(rr)
                  elif any(x in hs for x in ['payload','data binding','persistence','database',' db ','provider','event','handoff','input','output','entity']):
                      page['payload_data_tables'].append(rr)
                  elif any(x in hs for x in ['binding','runtime','operation','route','api']):
                      page['other_binding_tables'].append(rr)

              actions={a['action_uid']:a for a in page['actions']}
              ports={p0['port_uid']:p0 for p0 in page['ports']}
              ui_effects={'UI_ONLY','READ_ONLY','READONLY','CONTEXT_STATE','LOCAL_UI_STATE','NAVIGATION_ONLY','PROJECTION_READ'}
              for c in page['controls']:
                  a=actions.get(c['action_uid'])
                  jb={**c,'action_effect':'','port_owner':'','api_operation':'','api_method_path':'','port_boundary':''}
                  if not c['action_uid']:
                      page['gaps'].append({'type':'CONTROL_ACTION_MISSING','control_uid':c['control_uid']})
                  if not c['gate_uid']:
                      page['gaps'].append({'type':'CONTROL_GATE_MISSING','control_uid':c['control_uid']})
                  if not c['permission']:
                      page['gaps'].append({'type':'CONTROL_PERMISSION_MISSING','control_uid':c['control_uid']})
                  if c['action_uid'] and not a:
                      page['gaps'].append({'type':'ACTION_DEFINITION_NOT_FOUND','control_uid':c['control_uid'],'action_uid':c['action_uid']})
                  if a:
                      jb['action_effect']=a['effect']; jb['port_owner']=a['port_owner']
                      po=a['port_owner']
                      if po in ports:
                          pr=ports[po]
                          jb['api_operation']=pr['operation']; jb['api_method_path']=pr['method_path']; jb['port_boundary']=pr['boundary']
                      effect=(a['effect'] or '').upper()
                      is_effectful=bool(effect) and effect not in ui_effects and 'UI_ONLY' not in effect and 'READ' not in effect
                      if is_effectful and not po:
                          page['gaps'].append({'type':'EFFECTFUL_ACTION_PORT_MISSING','action_uid':a['action_uid'],'effect':a['effect']})
                      if is_effectful and po and po.startswith(page_uid) and po not in ports:
                          page['gaps'].append({'type':'REFERENCED_PORT_NOT_FOUND','action_uid':a['action_uid'],'port_uid':po})
                  page['joined_bindings'].append(jb)
              report['pages'][page_uid]=page
              report['files'].append({'file':p.name,'page_uid':page_uid,'sha256':file_hash})

          (OUT/'BINDING_COVERAGE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          summary={}
          for uid,p in report['pages'].items():
              summary[uid]={
                'controls':len(p['controls']),'actions':len(p['actions']),'ports':len(p['ports']),
                'gaps':len(p['gaps']),'gap_types':sorted({g['type'] for g in p['gaps']})
              }
          (OUT/'BINDING_COVERAGE_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist audit report
        shell: bash
        run: |
          git config user.name "acpos-binding-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add __authority_extract__/BINDING_COVERAGE*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(temp): audit DOCX exact binding coverage"
          git push
