name: ACPOS Current Truth Bootstrap Read

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-current-truth-bootstrap-read
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1dade15d7bb15279f70c89e2d87ef10403dcc803"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          test -z "$(git status --porcelain)"
          echo "PASS: CURRENT TRUTH ENTRY"

      - name: Install reader
        run: python -m pip install --quiet python-docx

      - name: Extract current governance and target context
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from docx import Document
          import json,re,hashlib
          docs=sorted(Path('.').glob('*.docx'))
          keys=re.compile(r'(governance|current|revision|authority|canonical|work unit|resume|transition|owner|dependency|applicability|change impact|active|stage|gate|permission|runtime|persistence|SYS-01-ACT-CONVERSATION-ATTACH|CORE-01-ACT-CANDIDATE-CREATE|STR-01-ACT-NOOP|KB-01-CTL-CITATION-OPEN|KB-01-CTL-REPLAY-OPEN|CTRL-ADMIN-SG-02-|runSandboxTest|setKillSwitch|createCandidate|createChangeRequest)',re.I)
          out={'head':'1dade15d7bb15279f70c89e2d87ef10403dcc803','files':[],'hits':[]}
          for p in docs:
            b=p.read_bytes(); out['files'].append({'file':p.name,'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)})
            d=Document(p)
            for i,para in enumerate(d.paragraphs):
              t=' '.join((para.text or '').split())
              if t and keys.search(t): out['hits'].append({'file':p.name,'kind':'p','index':i,'text':t[:4000]})
            for ti,t in enumerate(d.tables,1):
              for ri,row in enumerate(t.rows,1):
                vals=[' '.join((c.text or '').split()) for c in row.cells]
                s=' | '.join(vals)
                if s and keys.search(s): out['hits'].append({'file':p.name,'kind':'table','table':ti,'row':ri,'text':s[:8000]})
          Path('__bootstrap_current_truth.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DOCX_COUNT',len(docs),'HITS',len(out['hits']))
          PY

      - name: Upload current Word snapshot and bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-current-truth-bootstrap-read
          path: |
            *.docx
            __bootstrap_current_truth.json
          retention-days: 2
          if-no-files-found: error

      - name: Remove bootstrap harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __bootstrap_current_truth.json
          git config user.name "acpos-current-truth-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch68_current_truth_bootstrap.yml
          git commit -m "chore(acpos): close current-truth bootstrap harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BOOTSTRAP HARNESS REMOVED"
