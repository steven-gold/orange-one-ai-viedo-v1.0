name: ERP-01 closure validation

on:
  push:
    branches: [acpos-erp01-closure-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: ERP authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          auth=Path('authority/pages/admin/ERP-01/ACPOS_ERP-01_ERP_FINANCE_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          contract=Path('src/domain/erp/erpRuntimeContract.ts').read_text()
          bindings=Path('src/domain/erp/erpControlBindings.ts').read_text()
          visual=Path('src/components/pages/ErpVisual.tsx').read_text()
          runtime=Path('src/components/pages/ErpControlRuntime.tsx').read_text()
          projection=Path('src/domain/erp/erpProjectionPort.ts').read_text()
          controlled=Path('src/server/testing/controlledErpTestRuntime.ts').read_text()

          reg=auth.split('registries:',1)[1]
          sections_block=reg.split('  controls:',1)[0]
          controls_block=reg.split('  controls:',1)[1].split('\nactions:',1)[0]
          actions_block=auth.split('\nactions:',1)[1].split('\ngates:',1)[0]
          gates_block=auth.split('\ngates:',1)[1].split('\npermission_contract:',1)[0]
          errors_block=auth.split('\nerrors:',1)[1].split('\nqa_runtime_closure:',1)[0]
          operations_block=auth.split('operation_registry_refs:',1)[1].split('source_control_coverage:',1)[0]
          source_block=auth.split('source_control_coverage:',1)[1].split('registries:',1)[0]
          permission_block=auth.split('current_page_permissions:',1)[1].split('server_guard:',1)[0]
          state_block=auth.split('state_model:',1)[1].split('errors:',1)[0]

          sections=set(re.findall(r'section_uid:\s*(ERP-01-SEC-[A-Z0-9-]+)',sections_block))
          controls=set(re.findall(r'control_uid:\s*(ERP-01-[A-Z0-9-]+)',controls_block))
          actions=set(re.findall(r'^- action_uid:\s*(ERP-01-ACT-[A-Z0-9-]+)',actions_block,re.M))
          control_actions=set(re.findall(r'action_uid:\s*(ERP-01-ACT-[A-Z0-9-]+)',controls_block))
          gates=set(re.findall(r'^- gate_uid:\s*(ERP-01-GATE-[A-Z0-9-]+)',gates_block,re.M))
          permission_uids=set(re.findall(r'permission_uid:\s*(ERP-01-PERM-[A-Z0-9-]+)',controls_block))
          errors=set(re.findall(r'^- error_uid:\s*(ERP-01-ERR-[A-Z0-9-]+)',errors_block,re.M))
          operations=set(re.findall(r'^- operation_id:\s*([A-Za-z0-9_-]+)',operations_block,re.M))
          source_controls=set(re.findall(r'CTRL-ADMIN-ERP-0[12]-[A-Z0-9-]+',source_block))
          account_permissions=set(re.findall(r'^\s*-\s+([a-z][a-z0-9_.]+)\s*$',permission_block,re.M))
          states=set(re.findall(r'^\s*-\s+([A-Z][A-Z0-9_]+)\s*$',state_block,re.M))

          expected={'sections':8,'controls':42,'actions':18,'control_actions':21,'gates':10,'permission_uids':4,'errors':8,'operations':14,'source_controls':29,'account_permissions':8,'states':19}
          actual={'sections':len(sections),'controls':len(controls),'actions':len(actions),'control_actions':len(control_actions),'gates':len(gates),'permission_uids':len(permission_uids),'errors':len(errors),'operations':len(operations),'source_controls':len(source_controls),'account_permissions':len(account_permissions),'states':len(states)}
          print('ERP_AUTHORITY_COUNTS',actual)
          if actual!=expected:
              print('COUNT_MISMATCH expected',expected);sys.exit(1)

          binding_controls=set(re.findall(r'"(ERP-01-[A-Z0-9-]+)":\{"action_uid"',bindings))
          if binding_controls!=controls:
              print('BINDING_CONTROL_MISMATCH',sorted(controls-binding_controls),sorted(binding_controls-controls));sys.exit(1)
          visual_missing=sorted(x for x in controls if x not in visual)
          if visual_missing:
              print('VISUAL_CONTROL_MISSING',visual_missing);sys.exit(1)

          contract_sections=set(re.findall(r'"(ERP-01-SEC-[A-Z0-9-]+)"',contract.split('ERP_SECTION_UIDS',1)[1].split('] as const',1)[0]))
          contract_controls=set(re.findall(r'"(ERP-01-[A-Z0-9-]+)"',contract.split('ERP_CONTROL_UIDS',1)[1].split('] as const',1)[0]))
          contract_actions=set(re.findall(r'"(ERP-01-ACT-[A-Z0-9-]+)"',contract.split('ERP_ACTION_UIDS',1)[1].split('] as const',1)[0]))
          contract_gates=set(re.findall(r'"(ERP-01-GATE-[A-Z0-9-]+)"',contract.split('ERP_GATE_UIDS',1)[1].split('] as const',1)[0]))
          contract_errors=set(re.findall(r'"(ERP-01-ERR-[A-Z0-9-]+)"',contract.split('ERP_ERROR_UIDS',1)[1].split('] as const',1)[0]))
          contract_ops=set(re.findall(r'"([A-Za-z][A-Za-z0-9_-]+)"',contract.split('ERP_OPERATION_IDS',1)[1].split('] as const',1)[0]))
          contract_states=set(re.findall(r'"([A-Z][A-Z0-9_]+)"',contract.split('ERP_PAGE_STATES',1)[1].split('] as const',1)[0]))
          contract_source=set(re.findall(r'"(CTRL-ADMIN-ERP-0[12]-[A-Z0-9-]+)"\s*:',contract))
          contract_perms=set(re.findall(r'"([a-z][a-z0-9_.]+)"',contract.split('ERP_ACCOUNT_PERMISSIONS',1)[1].split('] as const',1)[0]))
          for name,a,b in [('sections',sections,contract_sections),('controls',controls,contract_controls),('actions',actions,contract_actions),('gates',gates,contract_gates),('errors',errors,contract_errors),('operations',operations,contract_ops),('states',states,contract_states),('source_controls',source_controls,contract_source),('account_permissions',account_permissions,contract_perms)]:
              if a!=b:
                  print('CONTRACT_MISMATCH',name,sorted(a-b),sorted(b-a));sys.exit(1)

          dangling=control_actions-actions
          expected_dangling={'ERP-01-ACT-READ-FINANCE','ERP-01-ACT-READ-CONNECTOR','ERP-01-ACT-READ-SYNC'}
          if dangling!=expected_dangling:
              print('CONTROL_READ_BINDING_MISMATCH',dangling);sys.exit(1)
          if any(x not in bindings for x in control_actions):
              print('CONTROL_ACTION_NOT_MATERIALIZED');sys.exit(1)
          if 'ERP-01-ERR-SECRET' not in runtime+projection or 'ERP-01-ERR-UNREGISTERED-WRITE' not in runtime+projection:
              print('ERROR_MAPPING_GAP');sys.exit(1)
          if 'function formFieldsFor' in visual or 'TEST-ERP-' in visual or '[TEST]' in visual:
              print('PRODUCT_UI_SCHEMA_OR_FIXTURE_HARDCODE');sys.exit(1)
          if 'form_schemas' not in projection or 'CONTROLLED_FORM_SCHEMAS' not in controlled:
              print('RUNTIME_FORM_SCHEMA_NOT_BOUND');sys.exit(1)
          if 'SNAPSHOT_FRESH' in controlled:
              print('UNREGISTERED_STATE_RESIDUAL');sys.exit(1)
          if 'ERP01_SECRET_VALUE_FORBIDDEN' not in controlled:
              print('SECRET_BOUNDARY_GUARD_MISSING');sys.exit(1)
          print('ERP_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production ERP must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3133 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/erp-prod.log 2>&1 &
          pid=$!; trap 'cat /tmp/erp-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3133/admin/erp >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/erp-prod-proj.json -w '%{http_code}' 'http://127.0.0.1:3133/v1/ui-projections/admin%3AERP-01')
          cat /tmp/erp-prod-proj.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/erp-prod-proj.json
          ! grep -q 'TEST_ONLY' /tmp/erp-prod-proj.json
          cmd=$(curl -sS -o /tmp/erp-prod-cmd.json -w '%{http_code}' 'http://127.0.0.1:3133/v1/erp/finance/fact-pack')
          cat /tmp/erp-prod-cmd.json
          test "$cmd" = "503"
          grep -q 'ERP_COMMAND_RUNTIME_NOT_BOUND' /tmp/erp-prod-cmd.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled ERP server boundary and create
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3134 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/erp-controlled-direct.log 2>&1 &
          pid=$!; trap 'cat /tmp/erp-controlled-direct.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3134/admin/erp >/dev/null && break || sleep 1; done
          base='{"provider_key":"TEST-PROVIDER-CREATE","adapter_key":"TEST-ADAPTER-CREATE","secret_reference_id":"TEST-SECRET-REF-CREATE","entity_scope":"TEST-SCOPE-CREATE","mapping_version":1,"mapping_entity_name":"TEST_ENTITY","mapping_source_schema":"TEST_SOURCE","mapping_target_schema":"TEST_TARGET","mapping_transform_spec":"TEST_TRANSFORM","data_classification":"TEST_ONLY","scope":"TEST-SCOPE-CREATE","expected_version":0'
          secret=$(curl -sS -o /tmp/erp-secret.json -w '%{http_code}' -H 'content-type: application/json' -X POST http://127.0.0.1:3134/v1/erp/connectors --data "$base,"'"'"idempotency_key"'"'":"'"'"TEST-IDEM-SECRET"'"'","'"'"secret_value"'"'":"'"'"FORBIDDEN"'"'"}'")
          cat /tmp/erp-secret.json; test "$secret" = "400"; grep -q 'ERP01_SECRET_VALUE_FORBIDDEN' /tmp/erp-secret.json
          extra=$(curl -sS -o /tmp/erp-extra.json -w '%{http_code}' -H 'content-type: application/json' -X POST http://127.0.0.1:3134/v1/erp/connectors --data "$base,"'"'"idempotency_key"'"'":"'"'"TEST-IDEM-EXTRA"'"'","'"'"unknown_field"'"'":"'"'"NO"'"'"}'")
          cat /tmp/erp-extra.json; test "$extra" = "400"; grep -q 'ERP01_ADDITIONAL_PROPERTY_FORBIDDEN' /tmp/erp-extra.json
          ok=$(curl -sS -o /tmp/erp-create.json -w '%{http_code}' -H 'content-type: application/json' -X POST http://127.0.0.1:3134/v1/erp/connectors --data "$base,"'"'"idempotency_key"'"'":"'"'"TEST-IDEM-CREATE"'"'"}'")
          cat /tmp/erp-create.json; test "$ok" = "200"; grep -q 'TEST_ONLY' /tmp/erp-create.json; grep -q 'production_eligible' /tmp/erp-create.json
          pcode=$(curl -sS -o /tmp/erp-controlled-proj.json -w '%{http_code}' 'http://127.0.0.1:3134/v1/ui-projections/admin%3AERP-01')
          test "$pcode" = "200"; grep -q '"data_classification":"TEST_ONLY"' /tmp/erp-controlled-proj.json; grep -q '"production_eligible":false' /tmp/erp-controlled-proj.json; grep -q '"form_schemas"' /tmp/erp-controlled-proj.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled ERP browser interactions
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3135 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/erp-controlled-browser.log 2>&1 &
          pid=$!; trap 'cat /tmp/erp-controlled-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3135/admin/erp >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            const waitReady=page=>page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:ERP-01"]')?.getAttribute('data-page-state')==='READY');
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1000}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3135/admin/erp',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`ERP route ${res&&res.status()} at ${width}`);
              await waitReady(page);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>0)throw new Error(`ERP horizontal overflow ${overflow} at ${width}`);
              const root=page.locator('[data-page-uid="admin:ERP-01"]');
              if(await root.getAttribute('data-authority-control-count')!=='42'||await root.getAttribute('data-source-control-count')!=='29'||await root.getAttribute('data-form-schema-count')!=='5')throw new Error('ERP root registry metadata mismatch');
              await page.close();
            }

            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3135/admin/erp',{waitUntil:'networkidle'});await waitReady(page);
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            const responseJson=async r=>{const text=await r.text();let json;try{json=JSON.parse(text)}catch{throw new Error(`Non JSON ${r.status()} ${text}`)};if(r.status()!==200)throw new Error(`HTTP ${r.status()} ${text}`);return json;};
            const clickResponse=async(id,match,method='GET')=>{const w=page.waitForResponse(r=>match(r.url())&&r.request().method()===method);await q(id).click();return responseJson(await w)};
            const assertUnique=async()=>{const nodes=page.locator('[data-control-id]'),count=await nodes.count(),unique=await nodes.evaluateAll(ns=>new Set(ns.map(n=>n.getAttribute('data-control-id'))).size);if(count!==unique)throw new Error(`ERP duplicate control ids ${count}/${unique}`)};
            const union=new Set();
            const collect=async()=>{for(const id of await page.locator('[data-control-id]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-control-id'))))union.add(id);await assertUnique()};
            await collect();
            let body=(await page.locator('body').textContent())||'';
            if(!body.includes('[TEST] authorized provider cost status'))throw new Error('ERP controlled finance data not visibly TEST classified');
            if(body.includes('secret_value')||body.includes('raw_secret'))throw new Error('ERP raw secret leaked to UI');

            await clickResponse('ERP-01-BTN-FACTPACK',u=>u.endsWith('/v1/erp/finance/fact-pack'));
            await clickResponse('ERP-01-BTN-GUARDRAILS',u=>u.endsWith('/v1/erp/capacity/guardrails'));
            await clickResponse('ERP-01-BTN-FORECAST',u=>u.endsWith('/v1/erp/forecasts'));
            await q('ERP-01-BTN-EXPORT').click();
            let form=page.locator('[data-drawer-form="ERP-01-BTN-EXPORT"]');if(await form.count()!==1)throw new Error('ERP export runtime form missing');
            if(!(await form.locator('[data-form-submit="true"]').isDisabled()))throw new Error('ERP export submit enabled before required input');
            await form.locator('[data-form-field-key="scope"] input').fill('finance-ledger');
            let w=page.waitForResponse(r=>r.url().endsWith('/v1/exports')&&r.request().method()==='POST');await form.locator('[data-form-submit="true"]').click();await responseJson(await w);await page.waitForFunction(()=>!document.querySelector('[data-drawer-form="ERP-01-BTN-EXPORT"]'));

            await q('ERP-01-BTN-TAB-CONNECTOR').click();await page.waitForFunction(()=>document.querySelector('[data-section-id="ERP-01-SEC-04"]'));await collect();
            if(!(await q('ERP-01-BTN-CONNECTOR-CREATE').isDisabled())||await q('ERP-01-BTN-CONNECTOR-CREATE').getAttribute('data-disabled-reason')!=='ERP_CONNECTOR_ALREADY_CONFIGURED')throw new Error('ERP create state guard missing');
            body=(await page.locator('body').textContent())||'';if(!body.includes('SEC-REF-TEST-ERP-001'))throw new Error('ERP secret reference missing');
            await q('ERP-01-BTN-CONNECTOR-UPDATE').click();
            form=page.locator('[data-drawer-form="ERP-01-BTN-CONNECTOR-UPDATE"]');if(await form.locator('[data-form-field-key]').count()!==6)throw new Error('ERP update runtime schema mismatch');
            if(!(await form.locator('[data-form-submit="true"]').isDisabled()))throw new Error('ERP empty update submit enabled');
            await form.locator('[data-form-field-key="entity_scope"] input').fill('finance-ledger-updated');
            w=page.waitForResponse(r=>r.url().includes('/v1/erp/connectors/')&&r.request().method()==='PATCH');await form.locator('[data-form-submit="true"]').click();await responseJson(await w);await page.waitForFunction(()=>!document.querySelector('[data-drawer-form="ERP-01-BTN-CONNECTOR-UPDATE"]'));
            await clickResponse('ERP-01-BTN-CONNECTOR-VALIDATE',u=>u.endsWith('/validate'),'POST');
            await clickResponse('ERP-01-BTN-MAPPING-VALIDATE',u=>u.includes('/v1/erp/mappings/')&&u.endsWith('/validate'),'POST');

            await q('ERP-01-BTN-TAB-SYNC').click();await page.waitForFunction(()=>document.querySelector('[data-section-id="ERP-01-SEC-05"]'));await collect();
            if(union.size!==42)throw new Error(`ERP control union ${union.size}/42: ${[...union].sort().join(',')}`);
            await clickResponse('ERP-01-BTN-FAILURE-GET',u=>u.includes('/v1/erp/failures/'));
            await clickResponse('ERP-01-BTN-SYNC-STATUS',u=>u.includes('/v1/erp/sync-jobs/')&&!u.endsWith('/retry'));
            await clickResponse('ERP-01-BTN-SYNC-RETRY',u=>u.includes('/v1/erp/sync-jobs/')&&u.endsWith('/retry'),'POST');

            await q('ERP-01-BTN-SNAPSHOT-REFRESH').click();form=page.locator('[data-drawer-form="ERP-01-BTN-SNAPSHOT-REFRESH"]');
            if(await form.locator('[data-form-field-key]').count()!==1)throw new Error('ERP snapshot schema mismatch');await form.locator('input').fill('finance-ledger-updated');
            w=page.waitForResponse(r=>r.url().endsWith('/v1/erp/snapshots/refresh')&&r.request().method()==='POST');await form.locator('[data-form-submit="true"]').click();await responseJson(await w);

            await q('ERP-01-BTN-SYNC-CREATE').click();form=page.locator('[data-drawer-form="ERP-01-BTN-SYNC-CREATE"]');if(await form.locator('[data-form-field-key]').count()!==8)throw new Error('ERP sync runtime schema mismatch');
            const fill=(key,value)=>form.locator(`[data-form-field-key="${key}"] input`).fill(value);
            await fill('requested_scope','finance-ledger-updated');await fill('data_classification','TEST_ONLY');await fill('records_payload','TEST records');await fill('snapshot_document','TEST snapshot document');await fill('completeness','82%');await fill('external_evidence_refs','TEST-EVIDENCE-001');
            await form.locator('[data-form-field-key="snapshot_type"] select').selectOption('delta');await form.locator('[data-form-field-key="external_result_verified"] select').selectOption('false');
            w=page.waitForResponse(r=>r.url().endsWith('/v1/erp/sync-jobs')&&r.request().method()==='POST');await form.locator('[data-form-submit="true"]').click();await responseJson(await w);
            await clickResponse('ERP-01-BTN-SYNC-STATUS',u=>u.includes('/v1/erp/sync-jobs/')&&!u.endsWith('/retry'));

            await q('ERP-01-BTN-DETAIL').click();await page.waitForFunction(()=>document.querySelector('[data-section-id="ERP-01-SEC-08"]')?.getAttribute('data-state')==='OPEN_DETAIL');await assertUnique();
            if(await page.locator('[data-detail-control-ref]').count()<2)throw new Error('ERP detail drawer not projection-bound');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('ERP_BROWSER_INTERACTION_PASS');
            await page.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/erp src/server/erp src/server/testing/controlledErpTestRuntime.ts src/components/pages/ErpControlRuntime.tsx src/components/pages/ErpVisual.tsx
          test ! -e .github/workflows/erp01-controlled-runtime-patch-once.yml
          git diff --exit-code
