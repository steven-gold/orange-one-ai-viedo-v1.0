name: ACPOS Batch 15 UI Local Read Source Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-15-ui-local-read-source-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Verify no Word drift since Batch 14
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="a43f3509d4d3448fc466a6bfe5ec1b8cee9cb22a"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-14")
          PY
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_15_ui_local_read_source_audit.py
      - name: Run Batch 15 audit
        run: python __temp/batch_15_ui_local_read_source_audit.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-15-ui-local-read-source-audit
          path: __batch15_ui_local_read_source_audit.json
          retention-days: 1
