name: One-time Governance Branch Cleanup 20260925

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/one-time-governance-branch-cleanup-20260925.yml'

permissions:
  contents: write

jobs:
  delete-consolidated-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete consolidated governance branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "governance-v2.2.23-unit-lifecycle"
            "governance-v2.2.24-current-identity-sync"
            "governance-v2.2.25-normative-execution-matrix"
            "governance-candidate-normative-execution-matrix-20260925"
          )
          for b in "${branches[@]}"; do
            code="$(curl -sS -o /tmp/delete-response.json -w '%{http_code}'               -X DELETE               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${REPO}/git/refs/heads/${b}")"
            if [ "${code}" = "204" ]; then
              echo "DELETED ${b}"
            elif [ "${code}" = "422" ] || [ "${code}" = "404" ]; then
              echo "NOT_PRESENT_OR_NOT_DELETABLE ${b} HTTP=${code}"
              cat /tmp/delete-response.json || true
              if [ "${code}" != "404" ]; then exit 1; fi
            else
              echo "DELETE_FAILED ${b} HTTP=${code}"
              cat /tmp/delete-response.json || true
              exit 1
            fi
          done
