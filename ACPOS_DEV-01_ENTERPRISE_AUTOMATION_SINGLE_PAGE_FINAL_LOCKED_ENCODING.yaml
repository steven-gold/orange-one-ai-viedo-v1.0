- action_uid: DEV-01-ACT-DISCOVERY-START
  label: 開始搜集
  effect_type: REGISTERED_COMMAND
  operation: startCompanyDiscovery
  runtime_binding:
    binding_kind: SOURCE_R9_OPERATION
    operation: startCompanyDiscovery
    method_path: POST /v1/outreach/discovery-jobs
    permission: outreach.discovery.configure
    event: outreach.discovery.started
    form_schema: USE_EXISTING_R9_BUSINESS_PAYLOAD_SCHEMA; do not union or invent fields
- action_uid: DEV-01-ACT-DISCOVERY-PAUSE
  label: 暫停
  effect_type: REGISTERED_COMMAND
  operation: pauseCompanyDiscovery
  runtime_binding:
    binding_kind: SOURCE_R9_OPERATION
    operation: pauseCompanyDiscovery
    method_path: POST /v1/outreach/discovery-jobs/{jobId}/pause
    permission: outreach.discovery.configure
    event: outreach.discovery.paused
    form_schema: USE_EXISTING_R9_BUSINESS_PAYLOAD_SCHEMA; do not union or invent fields
- action_uid: DEV-01-ACT-DISCOVERY-RESUME
  label: 繼續
  effect_type: REGISTERED_COMMAND
  operation: resumeCompanyDiscovery
  runtime_binding:
    binding_kind: SOURCE_R9_OPERATION
    operation: resumeCompanyDiscovery
    method_path: POST /v1/outreach/discovery-jobs/{jobId}/resume
    permission: outreach.discovery.configure
    event: outreach.discovery.resumed
    form_schema: USE_EXISTING_R9_BUSINESS_PAYLOAD_SCHEMA; do not union or invent fields
- action_uid: DEV-01-ACT-DISCOVERY-STOP
  label: 停止
  effect_type: REGISTERED_COMMAND
  operation: stopCompanyDiscovery
  runtime_binding:
    binding_kind: SOURCE_R9_OPERATION
    operation: stopCompanyDiscovery
    method_path: POST /v1/outreach/discovery-jobs/{jobId}/stop
