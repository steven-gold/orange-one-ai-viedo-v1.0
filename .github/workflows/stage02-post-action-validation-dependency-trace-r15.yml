name: Stage-02 Post-Action Validation Dependency Trace R15

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_post_action_validation_dependency_trace_r15.py'
      - 'governance/ci/validate_stage02_post_action_validation_dependency_trace_r15.py'
      - '.github/workflows/stage02-post-action-validation-dependency-trace-r15.yml'
      - 'governance/test/stage02/STAGE02_AUTHORITY_DEPENDENCY_RECLASSIFICATION_R12.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/FUNCTIONAL_CHAIN_SPEC.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-post-action-validation-dependency-trace-r15
  cancel-in-progress: false

jobs:
  post-action-validation-dependency-trace-r15:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R15 trace machinery
        run: |
          python -m py_compile governance/ci/build_stage02_post_action_validation_dependency_trace_r15.py
          python -m py_compile governance/ci/validate_stage02_post_action_validation_dependency_trace_r15.py

      - name: Re-prove exact governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_validation_remediation_closure_protocol.py

      - name: Revalidate R12 and Current external-authority continuity
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_authority_dependency_reclassification_r12.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py

      - name: Build exact 18-row post-action validation dependency trace
        run: python governance/ci/build_stage02_post_action_validation_dependency_trace_r15.py

      - name: Validate R15 exact validation-contract evidence boundary
        run: python governance/ci/validate_stage02_post_action_validation_dependency_trace_r15.py

      - name: Prove R15 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R15 trace is non-mutating diagnostic evidence only'

      - name: Verify exact 18 denominator and zero closure credit
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_POST_ACTION_VALIDATION_DEPENDENCY_TRACE_R15.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          den=d['denominators']
          assert den['post_action_validation_gaps_traced'] == 18
          assert den['scope_counts'] == {'ASSET-01': 18}
          assert den['exact_post_action_validation_contract_found'] + den['conflicting_post_action_validation_contracts'] + den['frozen_result_or_state_signal_only'] + den['current_frozen_post_action_validation_contract_missing'] == 18
          assert den['effective_stage02_blocker_reduction_claimed'] == 0
          assert d['stage02_status'] == 'BLOCKED'
          print('PASS: exact 18 post-action validation gaps traced; zero blocker credit until separate materialization and fresh reexecution')
          PY

      - name: Commit R15 dependency trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_POST_ACTION_VALIDATION_DEPENDENCY_TRACE_R15.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R15 generated no persistent dependency trace' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist post-action validation dependency trace R15'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R15 dependency trace
        uses: actions/upload-artifact@v4
        with:
          name: stage02-post-action-validation-dependency-trace-r15
          path: governance/test/stage02/STAGE02_POST_ACTION_VALIDATION_DEPENDENCY_TRACE_R15.yaml
          if-no-files-found: error
