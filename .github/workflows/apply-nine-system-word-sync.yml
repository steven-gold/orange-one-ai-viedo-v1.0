name: Apply Nine System Word Sync

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow
      - name: Update 01-09 Word
        run: python __temp/apply_nine_system_word_sync.py
      - name: Nine-system semantic QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import json,re
          marker='ACPOS-20260921-NINE-SYSTEM-QA-SYNC-V1'
          files=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          assert len(files)==9
          texts={}
          for p in files:
              d=Document(p)
              text='\n'.join([x.text for x in d.paragraphs]+[c.text for t in d.tables for r in t.rows for c in r.cells])
              assert marker in text,p.name
              texts[p.name]=text

          checks={
          '01_':['CONTENT_INCOMPLETE','SG-02 Current Control Denominator = 12','QCP-QA-FINAL-OUTPUT-V1','Completion Declaration Gate'],
          '02_':['qa_profile_uid','criteria_version_id','scorecard_id','finding_ids','evidence_refs','recheck_output_ref','Criteria changes must enter SG-02 governed lifecycle'],
          '03_':['EvaluateOutputRequest','CreateFindingRequest','CorrectionRequest','RecheckRequest','SubmitGovernedResourceReviewRequest','submitGovernedResourceReview','POST /v1/governance/resources/{id}/submit-review'],
          '04_':['QCP-CORE-BASELINE-V1','8 concrete dimensions','pass threshold=95','Rights/Policy failure blocks CORE approval'],
          '05_':['QCP-ASSET-IMAGE-V1','QCP-ASSET-AUDIO-V1','QCP-VIDEO-BASELINE-V1','QCP-EDIT-FINAL-V1','QCP-QA-FINAL-OUTPUT-V1','SG-02 control denominator is 12'],
          '06_':['No Parallel QA System','criteria_version_id','scorecard_id','Rights/Policy Required Check'],
          '07_':['Publish Eligibility Contract','qa_gate_status','open_blocking_findings','Scheduled post references stale/superseded version'],
          '08_':['Decision-domain Separation','Never reuse strategy confidence as QA PASS evidence','strategy-approved artifact may still require QA'],
          '09_':['STATIC_CATALOG_CONTENT','CRITERIA_LIFECYCLE_REACHABILITY','DENOMINATOR_ALIGNMENT','QUALITY_CONTEXT_UNBOUND','Nine-System Synchronization Requirement'],
          }
          for prefix,needles in checks.items():
              fn=next(k for k in texts if k.startswith(prefix))
              for n in needles:
                  assert n in texts[fn],(fn,n)

          # Common canonical profiles and denominator appear across all docs.
          for fn,text in texts.items():
              for n in ['QCP-CORE-BASELINE-V1','QCP-ASSET-IMAGE-V1','QCP-ASSET-AUDIO-V1','QCP-VIDEO-BASELINE-V1','QCP-EDIT-FINAL-V1','QCP-QA-FINAL-OUTPUT-V1','SG-02 Current Control Denominator = 12']:
                  assert n in text,(fn,n)
              assert 'SG-02 Current Control Denominator = 11' not in text,fn

          print('PASS: 9/9 SYSTEM WORD SEMANTIC SYNC')
          PY
      - name: Render 01-09
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          from PIL import Image,ImageChops
          docs=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          qa=Path('__render_qa');pdf=qa/'pdf';png=qa/'png';pdf.mkdir(parents=True,exist_ok=True);png.mkdir(parents=True,exist_ok=True)
          report={'docs':{},'pages':0,'blank':[],'edge':[]}
          for p in docs:
              subprocess.run(['libreoffice','--headless','--convert-to','pdf','--outdir',str(pdf),str(p)],check=True,stdout=subprocess.DEVNULL)
              pf=pdf/(p.stem+'.pdf')
              info=subprocess.check_output(['pdfinfo',str(pf)],text=True,errors='replace')
              pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              od=png/p.stem;od.mkdir(parents=True,exist_ok=True)
              subprocess.run(['pdftoppm','-png','-r','96',str(pf),str(od/'page')],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob('page-*.png'));assert len(imgs)==pages
              blank=[];edge=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert('RGB');diff=ImageChops.difference(im,Image.new('RGB',im.size,'white'));bb=diff.getbbox()
                  if bb is None:blank.append(i);continue
                  l,t,r,b=bb
                  if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
              txt=subprocess.check_output(['pdftotext','-layout',str(pf),'-'],text=True,errors='replace').split('\f')
              marker_pages=[i+1 for i,x in enumerate(txt) if 'ACPOS-20260921-NINE-SYSTEM-QA-SYNC-V1' in x]
              assert marker_pages,p.name
              report['docs'][p.name]={'pages':pages,'marker_pages':marker_pages,'blank':blank,'edge':edge}
              report['pages']+=pages;report['blank'] += [(p.name,x) for x in blank];report['edge'] += [(p.name,x) for x in edge]
          assert not report['blank'],report['blank']
          assert not report['edge'],report['edge']
          (qa/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'documents':9,'pages':report['pages'],'blank':0,'edge':0,'marker_pages':{k:v['marker_pages'] for k,v in report['docs'].items()}},ensure_ascii=False))
          print('PASS: 9/9 SYSTEM WORD RENDER QA')
          PY
      - name: Commit 01-09
        shell: bash
        run: |
          git config user.name "acpos-nine-system-sync"
          git config user.email "actions@users.noreply.github.com"
          git add 0[1-9]_ACPOS_*.docx __temp/nine_system_sync_report.json
          git commit -m "docs(acpos): synchronize QA governance across 01-09 system Word"
          git push
      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: nine-system-word-render
          path: __render_qa
          retention-days: 1
