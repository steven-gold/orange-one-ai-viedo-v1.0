 case 'ASSET-01-PORT-LAYER-DELETE':if(!s.layer_document_id||!s.layer_id)return bad('EXACT_LAYER_REQUIRED');s.layer_id=null;s.last_event='LAYER_DELETED';return ok({deleted:true});
 case 'ASSET-01-PORT-LAYER-DUP':if(!s.layer_id)return bad('EXACT_LAYER_REQUIRED');s.layer_id=createControlledTestRef('ASSET-LAYER-DUP');s.last_event='LAYER_DUPLICATED';return ok({layer_id:s.layer_id});
 case 'ASSET-01-PORT-LAYER-REORDER':if(!s.layer_id)return bad('EXACT_LAYER_REQUIRED');s.last_event='LAYER_REORDERED';return ok({reordered:true});
 case 'ASSET-01-PORT-LAYER-PROPS':if(!s.layer_id)return bad('EXACT_LAYER_REQUIRED');s.last_event='LAYER_PROPERTIES_UPDATED';return ok({updated:true});
