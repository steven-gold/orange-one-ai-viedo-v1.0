name: SYS-01 baseline audit once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/sys01-baseline-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Lock baseline and inspect bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "45bc9fd015a3a6f15bec7d3aab680a768a7620bd"
          echo '--- configureSystemLifecycleRuntime refs ---'
          git grep -n 'configureSystemLifecycleRuntime' -- src || true
          echo '--- configureSystemConversationAttachmentBinding refs ---'
          git grep -n 'configureSystemConversationAttachmentBinding' -- src || true
          echo '--- executeSystemLifecycleOperation refs ---'
          git grep -n 'executeSystemLifecycleOperation' -- src || true
          echo '--- SYS-01 route candidates ---'
          find src/app/v1 -type f -name 'route.ts' -print | sort | grep -E '(system|candidate|conversation|projection)' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build current source
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Audit production browser baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/sys01-baseline.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/sys01-baseline.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/system >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:3000/admin/system',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:SYS-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            const sections=await page.locator('[data-page-uid="admin:SYS-01"] [data-section-id^="SEC-ADMIN-SYS-01-"]').count();
            const controls=await page.locator('[data-page-uid="admin:SYS-01"] [data-control-id^="SYS-01-"]').count();
            console.log('SYS01_BASELINE_SECTIONS',sections);
            console.log('SYS01_BASELINE_CONTROLS',controls);
            console.log('SYS01_BASELINE_PAGE_STATE',await root.getAttribute('data-page-state'));
            console.log('SYS01_BASELINE_AI_MODE',await root.getAttribute('data-ai-mode'));
            const multi=page.locator('#SYS-01-BTN-MULTI-AI');
            console.log('SYS01_BASELINE_MULTI_DISABLED',await multi.isDisabled());
            await multi.click();
            console.log('SYS01_BASELINE_AI_MODE_AFTER_MULTI_CLICK',await root.getAttribute('data-ai-mode'));
            console.log('SYS01_BASELINE_SYSTEM_CHANGE_ID_TEXT',await page.locator('[data-page-uid="admin:SYS-01"] .contextMeta strong').count().catch(()=>-1));
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('SYS01_BASELINE_WIDTH',width,'OVERFLOW',overflow);
            }
            const api=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3ASYS-01');return{status:r.status,body:await r.json().catch(()=>null)}});
            console.log('SYS01_BASELINE_PROJECTION_STATUS',api.status);
            console.log('SYS01_BASELINE_PROJECTION_REASON',api.body?.reason_code||'');
            console.log('SYS01_BASELINE_PAGE_ERRORS',JSON.stringify(pageErrors));
            console.log('SYS01_BASELINE_REQUEST_FAILED',JSON.stringify(failed));
            assert.equal(sections,8);
            assert.equal(controls,12);
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
