name: Stage-03 Existing Visual Authority Materialization

"on":
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/governance-maintenance/materialize_stage03_existing_visual_authorities.py
      - .github/workflows/stage03-existing-visual-authority-materialization.yml

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage03-authority
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock exact transaction source
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Materialize exact existing Authorities and clean R2 outputs
        run: python .github/governance-maintenance/materialize_stage03_existing_visual_authorities.py
      - name: Validate exact authority bytes and R3 clean baseline
        run: |
          test "$(git hash-object authority/global/GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY_FINAL_LOCKED_V1.9.yaml)" = "cec94fa39c060b7de8c4be228f7958c2105d53f5"
          test "$(git hash-object authority/global/GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY_FINAL_LOCKED.yaml)" = "48d7bdaa46bfda16cbdf29997db126de3b9ce939"
          test ! -e 00_SOURCE_INTAKE/run_core01_d81df9ac_stage02/05_VISUAL_DESIGN
          test ! -e governance/test/stage03
          python governance/ci/governance_resolver.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-03
      - name: Persist Authority materialization and R3 clean baseline atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(stage03): materialize exact global visual authorities and R3 clean baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
