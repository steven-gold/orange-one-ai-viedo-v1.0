name: Governance v2.1.4 Sealed Stage-1 Test Gate

on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed-v2-1-4-stage1-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Reconstruct and verify sealed v2.1.4 Stage-1 runtime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile, shutil, yaml
          b=Path('governance/test-runtime/v2.1.4')
          m=yaml.safe_load((b/'STAGE1_RUNTIME_MANIFEST.yaml').read_text())
          names=[
            'stage1_runtime_bundle.tar.gz.b64.part00','stage1_runtime_bundle.tar.gz.b64.part01',
            'stage1_runtime_bundle.tar.gz.b64.part02','stage1_runtime_bundle.tar.gz.b64.part03',
            'stage1_runtime_bundle.tar.gz.b64.part03a2','stage1_runtime_bundle.tar.gz.b64.part03b',
            'stage1_runtime_bundle.tar.gz.b64.part04','stage1_runtime_bundle.tar.gz.b64.part05',
            'stage1_runtime_bundle.tar.gz.b64.part06','stage1_runtime_bundle.tar.gz.b64.part07',
            'stage1_runtime_bundle.tar.gz.b64.part07b','stage1_runtime_bundle.tar.gz.b64.part08']
          actual=sorted(p.name for p in b.glob('stage1_runtime_bundle.tar.gz.b64.part*'))
          if sorted(names)!=actual: raise SystemExit(f'chunk set mismatch: {actual}')
          if m['transport']['chunk_count']!=12: raise SystemExit('manifest chunk_count mismatch')
          normalized=''.join(''.join((b/n).read_text().split()) for n in names)
          b64sha=hashlib.sha256(normalized.encode()).hexdigest()
          if b64sha!=m['transport']['concatenated_base64_sha256']:
            raise SystemExit(f'base64 aggregate sha mismatch: {b64sha}')
          decoded=base64.b64decode(normalized,validate=True)
          dsha=hashlib.sha256(decoded).hexdigest()
          if dsha!=m['transport']['decoded_bundle_sha256']:
            raise SystemExit(f'decoded bundle sha mismatch: {dsha}')
          tar=Path('/tmp/acpos-stage1.tar.gz'); tar.write_bytes(decoded)
          out=Path('/tmp/acpos-gov-v214-stage1'); shutil.rmtree(out,ignore_errors=True); out.mkdir()
          expected={x['path']:x['sha256'] for x in m['files']}
          with tarfile.open(tar,'r:gz') as tf:
            members=sorted(x.name.lstrip('./') for x in tf.getmembers() if x.isfile())
            if members!=sorted(expected): raise SystemExit(f'sealed runtime member set mismatch: {members}')
            tf.extractall(out)
          for rel,sha in expected.items():
            p=out/rel
            got=hashlib.sha256(p.read_bytes()).hexdigest()
            if got!=sha: raise SystemExit(f'sealed file sha mismatch {rel}: {got}')
          print('PASS: exact v2.1.4 sealed runtime transport + 6-file set + hashes')
          PY
      - name: Run sealed Stage-1 minimal-control 27/27
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python /tmp/acpos-gov-v214-stage1/09_TESTS/governance/test_stage1_source_to_blueprint_minimal_control.py > /tmp/stage1.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/stage1.json'))
          assert r['total']==27 and r['passed_expectations']==27
          assert all(x.get('ok') is True for x in r['results'])
          print('PASS: sealed v2.1.4 Stage-1 minimal-control = 27/27')
          PY

  rebuild-branch-current-test-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify v2.1.4 current pointer and frozen rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          r=Path('.')
          cur=yaml.safe_load((r/'GOVERNANCE_CURRENT.yaml').read_text())
          base=yaml.safe_load((r/'REBUILD_BRANCH_BASELINE.yaml').read_text())
          lock=yaml.safe_load((r/'11_EVIDENCE/audit/GOVERNANCE_STAGE_LOCK.yaml').read_text())
          sealed=yaml.safe_load((r/'11_EVIDENCE/audit/SEALED_GOVERNANCE_TEST_BASELINE.yaml').read_text())
          assert cur['normative_authority']['version']=='v2.1.4'
          assert cur['normative_authority']['package_sha256']=='d789312c2657f492f98dbf29b285be18f3184e341195e8c84f57f5bcfe2d9109'
          assert cur['normative_authority']['normative_edit_allowed'] is False
          assert cur['test_runtime']['runtime_uid']=='ACPOS-GOV-TEST-v2.1.4-STAGE1'
          assert cur['test_runtime']['materialization_status']=='MATERIALIZED'
          assert cur['current_execution']['website_reconstruction_allowed'] is False
          assert cur['current_execution']['website_code_write_allowed'] is False
          assert base['governance_test']['version']=='v2.1.4' and base['governance_test']['normative_edit_allowed'] is False
          assert lock['lock_state']=='USER_FROZEN_READ_ONLY' and lock['normative_edit_after_lock']=='FORBIDDEN'
          assert sealed['sealed_governance']['version']=='v2.1.4' and sealed['normative_mutation_allowed'] is False
          print('PASS: branch pinned to frozen v2.1.4 test authority')
          PY
      - name: Verify CORE and ASSET reference-only source snapshots are unchanged
        run: |
          test "$(git rev-parse 'HEAD:00_SOURCE_INTAKE/legacy_new/reference_only/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml')" = '9490f3bcc28c5511bc04d6c3ce53c026e3c4667f'
          test "$(git rev-parse 'HEAD:00_SOURCE_INTAKE/legacy_new/reference_only/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml')" = '9668e2307c722ea4cf64f93f07c92da1b3abcc28'
          echo 'PASS: CORE/ASSET snapshots unchanged'
      - name: Block premature website reconstruction and garbage
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('.')
          bad=[str(p) for p in [r/'app',r/'src',r/'pages',r/'public'] if p.exists()]
          if bad: raise SystemExit('premature website paths: '+','.join(bad))
          garbage=[]
          for p in r.rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            if p.name=='.DS_Store' or p.suffix in {'.pyc','.pyo'} or '__pycache__' in p.parts or p.name.endswith(('.tmp','.bak','~')): garbage.append(str(p))
          if garbage: raise SystemExit('garbage: '+','.join(garbage))
          print('PASS: no website implementation and garbage=0')
          PY
