name: CORE-01 Stage-01 WUR Admission
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - "governance/test/CORE01_STAGE01_WUR_TRIGGER"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Resolve CORE-01 Stage-01 WU and run admission only
        run: python .github/governance-maintenance/resolve_core01_stage01_work_unit.py
