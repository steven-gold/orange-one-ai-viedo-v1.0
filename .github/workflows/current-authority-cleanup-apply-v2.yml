          b='[busy,setBusy]=useState<VideoActionUid|null>(null),lockedVersionRef=useRef<string|null>(null),viewerRef=useRef<HTMLDivElement|null>(null);'
          if a not in s: raise SystemExit('VIDEO ref insertion point missing')
          s=s.replace(a,b,1)
          a='case"VIDEO-01-ACT-VERSION-LOCK":{const current=projection?.current_version_id;if(!current){block("VIDEO-01-ERR-VERSION-001:EXACT_VIDEO_VERSION_REQUIRED");return;}void server(action,undefined,{video_version_id:current,manifest_hash:projection?.values["VIDEO-01-FLD-HANDOFF-CONTRACT"]},false);return;}'
          b='case"VIDEO-01-ACT-VERSION-LOCK":{const current=projection?.current_version_id;if(!current){block("VIDEO-01-ERR-VERSION-001:EXACT_VIDEO_VERSION_REQUIRED");return;}lockedVersionRef.current=null;void server(action,undefined,{video_version_id:current,manifest_hash:projection?.values["VIDEO-01-FLD-HANDOFF-CONTRACT"]},false).then(result=>{const payload=result as {value?:unknown}|null,value=payload?.value;if(!value||typeof value!=="object"||typeof (value as Record<string,unknown>).locked_version_ref!=="string"){block("VIDEO-01-ERR-VERSION-001:EXACT_LOCKED_VERSION_REF_NOT_RETURNED");return;}lockedVersionRef.current=(value as Record<string,unknown>).locked_version_ref as string;});return;}'
          if a not in s: raise SystemExit('VIDEO lock case missing')
          s=s.replace(a,b,1)
          a='case"VIDEO-01-ACT-HANDOFF":{const current=projection?.current_version_id,lockRef=projection?.values["VIDEO-01-TEST-LOCK-REF"];'
          b='case"VIDEO-01-ACT-HANDOFF":{const current=projection?.current_version_id,lockRef=lockedVersionRef.current;'
          if a not in s: raise SystemExit('VIDEO handoff hidden ref missing')
          s=s.replace(a,b,1)
          if 'VIDEO-01-TEST-' in s: raise SystemExit('VIDEO UI pseudo token remains')
          w(p,s)
          p='src/domain/edit/controlledEditClientTestRuntime.ts';s=r(p)
          s=s.replace('let correctionApprovedRef: string | null = null;','let correctionApprovedRef: string | null = null;\nlet lockedVersionRef: string | null = null;',1)
          s=s.replace('test_run_id:"TEST-RUN-EDIT-01-CONTROLLED"','test_run_id:"TEST-RUN-EDIT-CONTROLLED-01"',1)
          s=s.replace('  next.values={...next.values,"EDIT-01-TEST-LAST-ACTION":input.action_uid};\n','',1)
          a='next.values={...next.values,"EDIT-01-LBL-API-JOB":correctionCandidateRef,"EDIT-01-TEST-INTERNAL-CORRECTION-ACTION":"EDIT-01-ACT-CORRECTION-TRANSLATE"};'
          if a not in s: raise SystemExit('EDIT hidden correction action missing')
          s=s.replace(a,'next.values={...next.values,"EDIT-01-LBL-API-JOB":correctionCandidateRef};',1)
          a='if(input.action_uid==="EDIT-01-ACT-VERSION-LOCK"){if(next.page_state_uid!=="EDIT-01-ST-PAGE-OUTPUT_READY"||!next.saved_edit_version_id||!next.output_version_id)return fail("OUTPUT_READY_EXACT_VERSION_REQUIRED","EDIT-01-ERR-VERSION-001");next.page_state_uid="EDIT-01-ST-PAGE-LOCKED";next.current_stage_uid="EDIT-01-STAGE-05-QA-HANDOFF";next.current_stage_phase="READY";setGate(next,"EDIT-01-GATE-CONTEXT-MUTABLE",false);setGate(next,"EDIT-01-GATE-HANDOFF",true);return ok(next,input.action_uid,{locked_version_ref:`TEST-LOCK-${next.saved_edit_version_id}`});}'
          b='if(input.action_uid==="EDIT-01-ACT-VERSION-LOCK"){if(next.page_state_uid!=="EDIT-01-ST-PAGE-OUTPUT_READY"||!next.saved_edit_version_id||!next.output_version_id)return fail("OUTPUT_READY_EXACT_VERSION_REQUIRED","EDIT-01-ERR-VERSION-001");const lockRef=`TEST-LOCK-${next.saved_edit_version_id}`;lockedVersionRef=lockRef;next.page_state_uid="EDIT-01-ST-PAGE-LOCKED";next.current_stage_uid="EDIT-01-STAGE-05-QA-HANDOFF";next.current_stage_phase="READY";setGate(next,"EDIT-01-GATE-CONTEXT-MUTABLE",false);setGate(next,"EDIT-01-GATE-HANDOFF",true);return ok(next,input.action_uid,{locked_version_ref:lockRef});}'
          if a not in s: raise SystemExit('EDIT lock case missing')
          s=s.replace(a,b,1)
          s=s.replace('if(input.action_uid==="EDIT-01-ACT-VERSION-RESTORE-AS-DRAFT"){const draft=ref("EDIT-WORKING-DRAFT");','if(input.action_uid==="EDIT-01-ACT-VERSION-RESTORE-AS-DRAFT"){lockedVersionRef=null;const draft=ref("EDIT-WORKING-DRAFT");',1)
          a='if(input.action_uid==="EDIT-01-ACT-HANDOFF")return invokePort(input,"EDIT-01-PORT-VOICE-QA-HANDOFF",{runId:voiceRunId},{task_id:taskId,saved_edit_version_id:p.saved_edit_version_id,output_version_id:p.output_version_id,locked_version_ref:p.values["EDIT-01-TEST-LOCK-REF"]??`TEST-LOCK-${p.saved_edit_version_id??"MISSING"}`});'
          b='if(input.action_uid==="EDIT-01-ACT-HANDOFF"){if(!lockedVersionRef)return fail("LOCKED_VERSION_REF_REQUIRED","EDIT-01-ERR-VERSION-001");return invokePort(input,"EDIT-01-PORT-VOICE-QA-HANDOFF",{runId:voiceRunId},{task_id:taskId,saved_edit_version_id:p.saved_edit_version_id,output_version_id:p.output_version_id,locked_version_ref:lockedVersionRef});}'
          if a not in s: raise SystemExit('EDIT handoff hidden ref missing')
          s=s.replace(a,b,1)
          if 'EDIT-01-TEST-' in s or 'EDIT-01-CONTROLLED' in s: raise SystemExit('EDIT client pseudo token remains')
          w(p,s)
          p='src/server/testing/controlledEditTestRuntime.ts';s=r(p)
          s=s.replace('test_run_id:"TEST-RUN-EDIT-01-CONTROLLED"','test_run_id:"TEST-RUN-EDIT-CONTROLLED-01"',1)
          s=s.replace('  "EDIT-01-TEST-HANDOFF-REF":state.handoff_ref??"—",\n','',1)
          if 'EDIT-01-TEST-' in s or 'EDIT-01-CONTROLLED' in s: raise SystemExit('EDIT server pseudo token remains')
          w(p,s)
          base='875224a9401d576104eabc1a6e5507869cb3c644'
          subprocess.run(['git','rm','-f','src/app/v1/database/read-model/route.ts','src/server/testing/controlledDbTestRuntime.ts'],check=True)
          for p in ['src/server/database/dbReadModelRuntime.ts','src/server/shared/uiProjectionRuntime.ts']:
              w(p,subprocess.check_output(['git','show',f'{base}:{p}'],text=True))
          db_lines=[
          "import type{DbReadPortUid,DbErrorUid}from'./dbRuntimeContract';",
          "export type DbProjectionItem={ref:string;label:string;meta?:Record<string,unknown>};",
          "export type DbNormalizedProjection={page_state:string;values:Record<string,unknown>;lists:Record<string,DbProjectionItem[]>;tables:Record<string,unknown[]>;gates:Record<string,boolean>;filters:Record<string,DbProjectionItem[]>;graph:unknown;trace:unknown;audit:unknown;source_sync:string|null;};",
          "export type DbReadInput={scope?:unknown;query?:unknown};",
          "export type DbClientResult={ok:true;projection:DbNormalizedProjection;correlation_id:string}|{ok:false;error_uid:DbErrorUid;reason_code:string;correlation_id:string};",
          "export type DbClientBindings={readProjection:()=>Promise<DbClientResult>;read:(port_uid:DbReadPortUid,input:DbReadInput)=>Promise<DbClientResult>;resolveSystemLifecycle:()=>Promise<{ok:true;href:string}|{ok:false;reason_code:string}>};",
          "let binding:DbClientBindings|null=null;",
          "export function configureDbClientRuntime(next:DbClientBindings){binding=next;}",
          "export function isDbClientRuntimeBound(){return binding!==null;}",
          "export async function readDbProjection():Promise<DbClientResult>{if(!binding)return{ok:false,error_uid:'DB-01-ERR-CONTEXT-001',reason_code:'DB_CLIENT_RUNTIME_NOT_BOUND',correlation_id:'unresolved'};try{return await binding.readProjection();}catch{return{ok:false,error_uid:'DB-01-ERR-CONTEXT-001',reason_code:'DB_PROJECTION_READ_FAILED',correlation_id:'unresolved'};}}",
          "export async function invokeDbRead(port_uid:DbReadPortUid,input:DbReadInput):Promise<DbClientResult>{if(!binding)return{ok:false,error_uid:'DB-01-ERR-CONTEXT-001',reason_code:'DB_CLIENT_RUNTIME_NOT_BOUND',correlation_id:'unresolved'};try{return await binding.read(port_uid,input);}catch{return{ok:false,error_uid:'DB-01-ERR-CONTEXT-001',reason_code:'DB_READ_MODEL_QUERY_FAILED',correlation_id:'unresolved'};}}",
          "export async function openDbSystemLifecycle(){if(binding){try{return await binding.resolveSystemLifecycle();}catch{return{ok:false as const,reason_code:'SYSTEM_LIFECYCLE_ROUTE_RESOLUTION_FAILED'};}}return{ok:true as const,href:'/admin/system'};}",
          ]
          w('src/domain/database/dbClientPort.ts','\n'.join(db_lines)+'\n')
          banned=['CORE-01-PRIMARY-GRID','EDIT-01-ACT-EVAL-JUMP','QA-01-FLD-AUTO-PROGRESS-DONE','ASSET-01-TEST-LOCK-REF','ASSET-01-TEST-HANDOFF-REF','VIDEO-01-TEST-LOCK-REF','VIDEO-01-TEST-HANDOFF-REF','EDIT-01-TEST-LAST-ACTION','EDIT-01-TEST-INTERNAL-CORRECTION-ACTION','EDIT-01-TEST-LOCK-REF','EDIT-01-TEST-HANDOFF-REF','/v1/database/read-model']
