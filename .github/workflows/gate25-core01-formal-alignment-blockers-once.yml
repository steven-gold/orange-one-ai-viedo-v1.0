name: ACPOS Gate25 CORE-01 Formal Alignment Blockers Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-core01-formal-alignment-blockers-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize exact CORE-01 formal resource blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          inventory_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json')
          authority_path=Path('authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml')
          runtime_path=Path('src/domain/core/coreRuntimeContract.ts')
          visual_path=Path('src/components/pages/CoreVisual.tsx')
          evidence_path=Path('docs/construction/evidence/GATE25_CORE01_FORMAL_ALIGNMENT_BLOCKERS_2026-09-11.json')

          action_ids=[
            'ACT-CANDIDATE-CREATE','ACT-DRAFT-SAVE','ACT-DRAFT-VALIDATE',
            'core.project.add_reference','core.project.confirm','core.project.invite_collaborator','core.project.open_modeling'
          ]
          action_resources=[f'action:workspace:CORE-01:{x}' for x in action_ids]
          control_ids=[
            'CTRL-WORKSPACE-CORE-01-ACT-01-ACT-DRAFT-SAVE',
            'CTRL-WORKSPACE-CORE-01-ACT-02-ACT-CANDIDATE-CREATE',
            'CTRL-WORKSPACE-CORE-01-ACT-03-ACT-DRAFT-VALIDATE',
            'CTRL-WORKSPACE-CORE-01-ACT-04-CORE-PROJECT-OPEN-MODELING',
            'CTRL-WORKSPACE-CORE-01-ACT-05-CORE-PROJECT-ADD-REFERENCE',
            'CTRL-WORKSPACE-CORE-01-ACT-06-CORE-PROJECT-INVITE-COLLABORATOR',
            'CTRL-WORKSPACE-CORE-01-ACT-07-CORE-PROJECT-CONFIRM',
            'CTRL-WORKSPACE-CORE-01-COLLABORATION-OPEN',
            'CTRL-WORKSPACE-CORE-01-PREFLIGHT-OPEN',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-ADD-NOTE',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-CONFIRM-PROJECT',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-GENERATE-STORY-CANDIDATES',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-REQUEST-MOTHER-LOCK',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-RETURN-FOR-REVISION',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-SAVE-DRAFT',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-VALIDATE-DRAFT',
            'CTRL-WORKSPACE-CORE-01-PROJECT-CREATION-WIZARD-VIEW-HISTORY',
            'CTRL-WORKSPACE-CORE-01-PROJECT-IDENTITY-OPEN',
            'CTRL-WORKSPACE-CORE-01-REFERENCES-OPEN',
            'CTRL-WORKSPACE-CORE-01-STORY-CORE-OPEN',
            'CTRL-WORKSPACE-CORE-01-WORLD-CHARACTER-DNA-RULES-OPEN'
          ]
          control_resources=[f'control:{x}' for x in control_ids]
          targets=action_resources+control_resources
          assert len(action_resources)==7
          assert len(control_resources)==21
          assert len(targets)==28 and len(set(targets))==28

          ledger=json.loads(ledger_path.read_text())
          inventory=json.loads(inventory_path.read_text())
          assert ledger['counts']=={'PASS':51,'BLOCKED':159,'NOT_EXECUTED':1271}, ledger['counts']
          assert ledger['denominator']=={'controls':1155,'actions':326,'total':1481}
          assert inventory['denominator']=={'controls':1155,'actions':326,'total':1481}
          entries={x['resource_key']:x for x in ledger['entries']}
          formal={x['resource_key']:x for x in inventory['resources']}
          for key in targets:
            assert key in formal, f'formal inventory missing {key}'
            assert key in entries, f'ledger missing {key}'
            assert entries[key]['disposition']=='NOT_EXECUTED', f'{key} expected NOT_EXECUTED got {entries[key]["disposition"]}'

          authority=authority_path.read_text()
          runtime=runtime_path.read_text()
          visual=visual_path.read_text()
          current_action_uids=set(re.findall(r'^\s*-\s*action_uid:\s*([^\s#]+)',authority,re.M))
          current_action_uids.update(re.findall(r'"(CORE-01-ACT-[A-Z0-9-]+)"',runtime))
          current_control_uids=set(re.findall(r'^\s*-\s*control_uid:\s*([^\s#]+)',authority,re.M))
          current_control_uids.update(re.findall(r'"(CORE-01-(?:BTN|CTL|FLD|LST|MENU)-[A-Z0-9-]+)"',visual))
          assert 'CORE-01-ACT-CANDIDATE-CREATE' in current_action_uids
          assert 'CORE-01-ACT-PROJECT-VALIDATE' in current_action_uids
          assert 'CORE-01-ACT-PROJECT-CONFIRM' in current_action_uids
          assert 'CORE-01-BTN-CANDIDATE-CREATE' in current_control_uids
          assert 'CORE-01-BTN-PROJECT-VALIDATE' in current_control_uids
          assert 'CORE-01-BTN-PROJECT-CONFIRM' in current_control_uids
          for old in action_ids:
            assert old not in current_action_uids, f'unexpected exact Current action owner for {old}'
            assert f'"{old}"' not in runtime, f'unexpected runtime alias for {old}'
            assert f'"{old}"' not in visual, f'unexpected visual alias for {old}'
          for old in control_ids:
            assert old not in current_control_uids, f'unexpected exact Current control owner for {old}'
            assert old not in runtime and old not in visual and old not in authority, f'unexpected Current binding for {old}'

          now=datetime.now(timezone(timedelta(hours=8))).isoformat()
          evidence={
            'document_id':'ACPOS_GATE25_CORE01_FORMAL_ALIGNMENT_BLOCKERS',
            'status':'PHYSICAL_ALIGNMENT_BLOCKERS_VERIFIED',
            'recorded_at':now,
            'production_release_sha':ledger['production_release_sha'],
            'production_permission_inventory':str(inventory_path),
            'current_authority':str(authority_path),
            'current_authority_status':'FINAL_LOCKED',
            'current_authority_legacy_merge':'FORBIDDEN',
            'current_runtime':str(runtime_path),
            'current_visual':str(visual_path),
            'resource_count':28,
            'action_count':7,
            'control_count':21,
            'formal_resources':targets,
            'current_identity_examples':{
              'candidate_create_action':'CORE-01-ACT-CANDIDATE-CREATE',
              'project_validate_action':'CORE-01-ACT-PROJECT-VALIDATE',
              'project_confirm_action':'CORE-01-ACT-PROJECT-CONFIRM',
              'candidate_create_control':'CORE-01-BTN-CANDIDATE-CREATE',
              'project_validate_control':'CORE-01-BTN-PROJECT-VALIDATE',
              'project_confirm_control':'CORE-01-BTN-PROJECT-CONFIRM'
            },
            'gate17_fresh_readback':{
              'verified_at':'2026-09-11T01:47:00+08:00',
              'source':'Neon production read-only SELECT via connected Neon tool',
              'quality_criteria_versions':0,'topics':0,'topic_versions':0,'topic_production_contracts':0,
              'topic_blueprints':0,'blueprint_versions':0,'canonical_script_versions':0,'child_locks':0
            },
            'reason':'Production formal permission resources remain active, but their exact ACTION/CONTROL identities have no owner or explicit alias in the FINAL_LOCKED Current CORE-01 Authority/runtime/visual. Semantic similarity is not an authorized remap. Gate17 canonical business lineage also remains empty; no fake Production business rows may be created for acceptance.',
            'rule':'Do not recreate retired Project Creation Wizard identities, invent aliases, or fabricate CORE business lineage. Resolve by authoritative permission inventory remap/deactivation or explicit Current Authority registration.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')

          for key in action_resources:
            entry=entries[key]
            entry['disposition']='BLOCKED'
            entry['reason_code']='CURRENT_FORMAL_ACTION_UID_NOT_BOUND_BY_CURRENT_PAGE_AUTHORITY'
            entry['evidence_refs']=[str(evidence_path),str(authority_path),str(runtime_path),str(inventory_path),'docs/construction/evidence/GATE17_CORE_PRODUCTION_LINEAGE_BLOCKER_2026-09-10.json']
            entry['blocker_detail']='Production formal ACTION remains active, but its exact UID has no Current CORE-01 Authority/runtime owner or explicit alias. Current prefixed action identities may not be inferred as a remap. No fake Production lineage may be created to force acceptance.'
            entry['operation_ids']=[key.split(':',3)[-1]]
          for key in control_resources:
            entry=entries[key]
            entry['disposition']='BLOCKED'
            entry['reason_code']='CURRENT_FORMAL_CONTROL_UID_NOT_BOUND_BY_CURRENT_PAGE_AUTHORITY'
            entry['evidence_refs']=[str(evidence_path),str(authority_path),str(visual_path),str(inventory_path),'docs/construction/evidence/GATE17_CORE_PRODUCTION_LINEAGE_BLOCKER_2026-09-10.json']
            entry['blocker_detail']='Production formal CONTROL remains active, but its exact UID is absent from FINAL_LOCKED Current CORE-01 Authority and Current visual bindings. Recreating the retired Project Creation Wizard/control identity is forbidden.'
            entry['operation_ids']=[key.removeprefix('control:')]

          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for entry in ledger['entries']:
            counts[entry['disposition']]+=1
          assert counts=={'PASS':51,'BLOCKED':187,'NOT_EXECUTED':1243},counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'resource_count':28,'counts':counts,'evidence':str(evidence_path)},ensure_ascii=False))
          PY
      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit CORE-01 blocker evidence and ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_CORE01_FORMAL_ALIGNMENT_BLOCKERS_2026-09-11.json
          git commit -m 'evidence(gate25): block 28 unbound CORE-01 formal resources'
          git push origin HEAD:new
