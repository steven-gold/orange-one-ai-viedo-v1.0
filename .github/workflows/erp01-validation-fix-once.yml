name: ERP-01 validation fix once

on:
  push:
    branches: [acpos-erp01-closure-20260902]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-erp01-closure-20260902
      - name: Fix controlled boundary payload generation
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/erp01-closure-validation-once.yml')
          s=p.read_text()
          start=s.index("          base='{\"provider_key\"")
          end=s.index("          pcode=$(curl", start)
          new='''          python <<'PY'\n          import json\n          from pathlib import Path\n          base={\n            "provider_key":"TEST-PROVIDER-CREATE","adapter_key":"TEST-ADAPTER-CREATE","secret_reference_id":"TEST-SECRET-REF-CREATE",\n            "entity_scope":"TEST-SCOPE-CREATE","mapping_version":1,"mapping_entity_name":"TEST_ENTITY","mapping_source_schema":"TEST_SOURCE",\n            "mapping_target_schema":"TEST_TARGET","mapping_transform_spec":"TEST_TRANSFORM","data_classification":"TEST_ONLY",\n            "scope":"TEST-SCOPE-CREATE","expected_version":0,\n          }\n          Path('/tmp/erp-secret-payload.json').write_text(json.dumps({**base,"idempotency_key":"TEST-IDEM-SECRET","secret_value":"FORBIDDEN"}))\n          Path('/tmp/erp-extra-payload.json').write_text(json.dumps({**base,"idempotency_key":"TEST-IDEM-EXTRA","unknown_field":"NO"}))\n          Path('/tmp/erp-create-payload.json').write_text(json.dumps({**base,"idempotency_key":"TEST-IDEM-CREATE"}))\n          PY\n          secret=$(curl -sS -o /tmp/erp-secret.json -w '%{http_code}' -H 'content-type: application/json' -X POST http://127.0.0.1:3134/v1/erp/connectors --data-binary @/tmp/erp-secret-payload.json)\n          cat /tmp/erp-secret.json; test "$secret" = "400"; grep -q 'ERP01_SECRET_VALUE_FORBIDDEN' /tmp/erp-secret.json\n          extra=$(curl -sS -o /tmp/erp-extra.json -w '%{http_code}' -H 'content-type: application/json' -X POST http://127.0.0.1:3134/v1/erp/connectors --data-binary @/tmp/erp-extra-payload.json)\n          cat /tmp/erp-extra.json; test "$extra" = "400"; grep -q 'ERP01_ADDITIONAL_PROPERTY_FORBIDDEN' /tmp/erp-extra.json\n          ok=$(curl -sS -o /tmp/erp-create.json -w '%{http_code}' -H 'content-type: application/json' -X POST http://127.0.0.1:3134/v1/erp/connectors --data-binary @/tmp/erp-create-payload.json)\n          cat /tmp/erp-create.json; test "$ok" = "200"; grep -q 'TEST_ONLY' /tmp/erp-create.json; grep -q 'production_eligible' /tmp/erp-create.json\n'''
          p.write_text(s[:start]+new+s[end:])
      - name: Commit validation fix and remove helper
        run: |
          rm .github/workflows/erp01-validation-fix-once.yml
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add .github/workflows/erp01-closure-validation-once.yml .github/workflows/erp01-validation-fix-once.yml
          git commit -m "test(erp): fix boundary payload generation"
          git push origin HEAD:acpos-erp01-closure-20260902
