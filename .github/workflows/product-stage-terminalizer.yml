name: Product Stage Terminalizer
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      work_unit:
        required: true
        type: string
      validated_head:
        required: true
        type: string
      validation_run_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  terminalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.validated_head }}
          fetch-depth: 0
      - name: Verify branch has not advanced past validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.validated_head }}"
          git fetch origin 0921acpos --depth=1
          test "$(git rev-parse origin/0921acpos)" = "${{ inputs.validated_head }}" || {
            echo "BLOCK:BRANCH_ADVANCED_AFTER_VALIDATED_CANDIDATE"
            exit 41
          }
      - name: Resolve exact selected Current governance
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml)"
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install governance dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r _governance_authority/governance/ci/requirements-governance.lock
      - name: Load exact Current governance runtime into product checkout
        run: |
          set -euo pipefail
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
      - name: Materialize terminal closure projection
        run: |
          python .github/scripts/common_stage_terminalizer.py             --mode terminalize             --stage "${{ inputs.stage }}"             --work-unit "${{ inputs.work_unit }}"             --validated-head "${{ inputs.validated_head }}"             --validation-run-id "${{ inputs.validation_run_id }}"             --product-root "$GITHUB_WORKSPACE"             --governance-root "$GITHUB_WORKSPACE/_governance_authority"
      - name: Persist closure projection by fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "STAGE_EXECUTION/${{ inputs.stage }}"
          git diff --cached --quiet && { echo "BLOCK:NO_TERMINALIZATION_DELTA"; exit 42; }
          git commit -m "stage: persist ${{ inputs.stage }} terminal closure projection"
          git push origin HEAD:0921acpos
