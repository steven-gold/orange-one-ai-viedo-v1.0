artifact_type: V232_PAGE_TO_GOVERNED_UNIT_RENAME_MAP
rationale: v2.2.33 neutralized the common stage semantics to GOVERNED_UNIT. STAGE-01/02 operation and output identities that still carry PAGE_* names must be re-signed to GOVERNED_UNIT_* so that active
  work unit binding coverage equals the selected profile operation/output universe.
stages:
  STAGE-01:
    renames:
    - current_operation_uid: PAGE_BASE_BLUEPRINT_COMPILE
      target_operation_uid: GOVERNED_UNIT_BASE_BLUEPRINT_COMPILE
      current_output_uid: PAGE_BASE_BLUEPRINT
      target_output_uid: GOVERNED_UNIT_BASE_BLUEPRINT
      required_artifact_type: GOVERNED_UNIT_BASE_BLUEPRINT
      selected_profile_producer: GOVERNED_UNIT_BASE_BLUEPRINT_COMPILE
      action: RENAME_OPERATION_AND_OUTPUT_IDENTITY
    unchanged:
    - SOURCE_STRUCTURE_ENUMERATION
    - SOURCE_SEGMENT_MAPPING
    - SOURCE_CONTEXT_COMPILATION
    - SOURCE_SUPERSESSION_CONFLICT_RESOLUTION
    - SOURCE_DEPENDENCY_EXTRACTION
    - RESPONSIBILITY_CLASSIFICATION
    - VISUAL_BASE_BLUEPRINT_COMPILE
    - BLUEPRINT_BINDING_COMPILE
  STAGE-02:
    renames:
    - current_operation_uid: PAGE_CONSTRUCTION_SPEC_COMPILE
      target_operation_uid: GOVERNED_UNIT_CONSTRUCTION_SPEC_COMPILE
      current_output_uid: PAGE_CONSTRUCTION_SPEC_PACKAGE
      target_output_uid: GOVERNED_UNIT_CONSTRUCTION_SPEC_PACKAGE
      required_artifact_type: GOVERNED_UNIT_CONSTRUCTION_SPEC_PACKAGE
      selected_profile_producer: GOVERNED_UNIT_CONSTRUCTION_SPEC_COMPILE
      action: RENAME_OPERATION_AND_OUTPUT_IDENTITY
    unchanged:
    - STAGE_EXECUTION_PREFLIGHT_COMPILE
    - EFFECTIVE_CONTRACT_OVERLAY_COMPILE
    - DEPENDENCY_TOPOLOGY_COMPILE
    - CHANGE_IMPACT_MAP_COMPILE
    - FUNCTIONAL_CHAIN_COMPILE
    - DEPENDENCY_MAP_COMPILE
    - ASYNC_PROVIDER_CONTRACT_COMPILE
    - SHARED_OWNER_PORT_RESOLVE
    - FUNCTIONAL_WORKBENCH_CONTRACT_COMPILE
    - INTERACTION_TOPOLOGY_COMPILE
    - FUNCTION_ADMISSION_SCORECARD_COMPILE
    - AUTO_COMPLETION_SCOPE_LEDGER_COMPILE
