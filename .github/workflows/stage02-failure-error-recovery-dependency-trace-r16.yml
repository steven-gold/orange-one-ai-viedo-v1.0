name: Stage-02 Failure Error Recovery Dependency Trace R16

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_failure_error_recovery_dependency_trace_r16.py'
      - 'governance/ci/validate_stage02_failure_error_recovery_dependency_trace_r16.py'
      - '.github/workflows/stage02-failure-error-recovery-dependency-trace-r16.yml'
      - 'governance/test/stage02/STAGE02_AUTHORITY_DEPENDENCY_RECLASSIFICATION_R12.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/FUNCTIONAL_CHAIN_SPEC.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-failure-error-recovery-dependency-trace-r16
  cancel-in-progress: false

jobs:
  failure-error-recovery-dependency-trace-r16:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R16 trace machinery
        run: |
          python -m py_compile governance/ci/build_stage02_failure_error_recovery_dependency_trace_r16.py
          python -m py_compile governance/ci/validate_stage02_failure_error_recovery_dependency_trace_r16.py

      - name: Re-prove exact governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Revalidate R12 and Current external-authority continuity
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_authority_dependency_reclassification_r12.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py

      - name: Build exact 44-row failure error recovery dependency trace
        run: python governance/ci/build_stage02_failure_error_recovery_dependency_trace_r16.py

      - name: Validate R16 exact failure error recovery evidence boundary
        run: python governance/ci/validate_stage02_failure_error_recovery_dependency_trace_r16.py

      - name: Prove R16 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R16 trace is non-mutating diagnostic evidence only'

      - name: Verify exact 44 denominator and zero closure credit
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_FAILURE_ERROR_RECOVERY_DEPENDENCY_TRACE_R16.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          den=d['denominators']
          assert den['failure_error_recovery_gaps_traced'] == 44
          assert den['scope_counts'] == {'ASSET-01': 44}
          assert den['exact_failure_error_recovery_binding_found'] + den['conflicting_failure_error_recovery_bindings'] + den['frozen_result_or_state_signal_only'] + den['current_frozen_failure_error_recovery_binding_missing'] == 44
          assert den['effective_stage02_blocker_reduction_claimed'] == 0
          assert d['stage02_status'] == 'BLOCKED'
          print('PASS: exact 44 failure/error/recovery gaps traced; zero blocker credit until separate materialization and fresh reexecution')
          PY

      - name: Commit R16 dependency trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_FAILURE_ERROR_RECOVERY_DEPENDENCY_TRACE_R16.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R16 generated no persistent dependency trace' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist failure error recovery dependency trace R16'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R16 dependency trace
        uses: actions/upload-artifact@v4
        with:
          name: stage02-failure-error-recovery-dependency-trace-r16
          path: governance/test/stage02/STAGE02_FAILURE_ERROR_RECOVERY_DEPENDENCY_TRACE_R16.yaml
          if-no-files-found: error
