name: Execution Closure Owning-Layer Repair

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/execution-closure-owning-layer-repair.yml'

permissions:
  contents: write

jobs:
  exact-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Apply exact owning-layer repairs and self-delete
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/stage02-actual-test.yml')
          text = workflow.read_text(encoding='utf-8')
          old = """          sysrun['full_line_github_result'] = 'PASS_EXECUTION_SOURCE_HEAD'\n          sysrun['full_line_verification_run_id'] = source_run\n          sysrun['exact_denominators_verified'] = True\n          sysrun['persisted_head_revalidation_required'] = True"""
          new = """          sysrun['full_line_github_result'] = 'INNER_FULL_LINE_PASS_PENDING_TERMINAL_WORKFLOW'\n          sysrun['full_line_verification_run_id'] = source_run\n          sysrun['exact_denominators_verified'] = True\n          sysrun['persisted_head_revalidation_required'] = True\n          sysrun['terminal_run_conclusion'] = 'PENDING'\n          sysrun['terminal_result_credit_allowed'] = False"""
          count = text.count(old)
          assert count == 2, f'expected exactly 2 preterminal PASS projection blocks, got {count}'
          workflow.write_text(text.replace(old, new), encoding='utf-8')

          validator = Path('governance/ci/validate_active_consumer_reference_integrity.py')
          text = validator.read_text(encoding='utf-8')
          lines = text.splitlines()
          targets = [i for i, line in enumerate(lines) if 'r"(?:python(?:3)?\\s+|python(?:3)?\\s+-m\\s+)?"' in line]
          assert len(targets) == 1, f'expected exactly one optional executable-prefix regex line, got {len(targets)}'
          lines[targets[0]] = '    r"python(?:3)?\\s+(?:-m\\s+)?"'
          validator.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('PASS: exact Stage-02 terminal-pending projection and executable-reference parser repairs applied')
          PY
          git rm .github/workflows/execution-closure-owning-layer-repair.yml
          git diff --check
          actual="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/execution-closure-owning-layer-repair.yml .github/workflows/stage02-actual-test.yml governance/ci/validate_active_consumer_reference_integrity.py | sort)"
          test "$actual" = "$expected" || { printf 'BLOCK: unexpected repair delta\n%s\n' "$actual" >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage02-actual-test.yml governance/ci/validate_active_consumer_reference_integrity.py
          git commit -am 'fix(governance): repair terminal projection and executable consumer parsing'
          git push origin HEAD:rebuild-v2.1.1
