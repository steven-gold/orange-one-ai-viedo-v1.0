    context: Authorized scope/read model unavailable or version mismatch
    recovery: BLOCK dependent panels; show actual server reason
  - error_uid: INFO-01-ERR-SOURCE-001
    context: Source health/source metadata unavailable or unauthorized
    recovery: Show unavailable/masked state; never fabricate source
  - error_uid: INFO-01-ERR-FRESHNESS-001
    context: Freshness/source_time missing, stale or inconsistent
    recovery: Show STALE/INCOMPLETE as returned; never relabel current
  - error_uid: INFO-01-ERR-FACTPACK-001
    context: Fact Pack missing, inaccessible or invalid exact ref
    recovery: BLOCK detail; preserve list/context
  - error_uid: INFO-01-ERR-FACT-001
    context: FACT lacks required source/source_time/scope/completeness/confidence/classification
    recovery: Do not present as validated FACT; surface missing contract
  - error_uid: INFO-01-ERR-EVIDENCE-001
    context: Evidence/citation ref missing or invalid
    recovery: Show broken evidence state; block evidence-dependent adoption
  - error_uid: INFO-01-ERR-RESEARCH-001
    context: Research run/queue projection missing or failed
    recovery: Show actual status/error; do not create local retry/start action
  - error_uid: INFO-01-ERR-SEARCH-001
    context: Search request invalid/denied/stale
    recovery: Show registered error + retry eligibility
  - error_uid: INFO-01-ERR-EXPORT-001
    context: Export request invalid/denied/stale
    recovery: Show registered error; no local file fabrication
  - error_uid: INFO-01-ERR-CANDIDATE-001
    context: Context Candidate scope/evidence/citation/adoption-review invalid
    recovery: BLOCK candidate action; preserve candidate projection
  - error_uid: INFO-01-ERR-PERM-001
    context: Permission/scope/classification denied
    recovery: Hide/disable/mask according to registered permission result
  - error_uid: INFO-01-ERR-UNDEFINED-001
    context: Unlisted Section/Component/Control/Action/Gate/Permission/Port requested
