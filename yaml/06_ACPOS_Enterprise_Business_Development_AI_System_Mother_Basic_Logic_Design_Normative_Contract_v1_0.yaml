  - index: 38
    rows:
    - row: 0
      cells:
      - Invariant
      - System-wide rule
    - row: 1
      cells:
      - QA-SYNC-01
      - 任何需要 Quality Review / Score / Evaluation 的系統，MUST resolve exact approved Criteria Profile + CriteriaVersion + QualityGatePolicyVersion；不得用 generic/default/latest
        取代。
    - row: 2
      cells:
      - QA-SYNC-02
      - Static canonical catalog 必須有具體 rows；只有 Registry/Library/Dimension 容器而沒有 canonical content = CONTENT_INCOMPLETE。
    - row: 3
      cells:
      - QA-SYNC-03
      - Dynamic runtime records 可以為空；禁止用 mock/sample/fake business rows 讓頁面看起來完整。
    - row: 4
      cells:
      - QA-SYNC-04
      - QA score 不能覆蓋 Hard Block / Required Check；Rights / Policy / Evidence / Checksum / Provenance 等 blocker FAIL 時不得因總分高而 PASS。
    - row: 5
      cells:
      - QA-SYNC-05
      - Correction 必須產生 NEW exact output/version 後才可 Recheck；不得在原輸出上直接關閉 Finding。
    - row: 6
      cells:
      - QA-SYNC-06
      - Human Review 完成不等於 QA Gate PASS；人工不能繞過 Hard Block / Evidence / Policy / Criteria。
    - row: 7
      cells:
      - QA-SYNC-07
      - SG-02 lifecycle canonical path = EMPTY → DRAFT → REVIEW → APPROVED / ACTIVE → SUPERSEDED。
    - row: 8
      cells:
      - QA-SYNC-08
      - SG-02 Current Control Denominator = 12，包含 Submit Review；舊 11-control 描述不得作為 Current truth。
    - row: 9
      cells:
      - QA-SYNC-09
      - 只有 Word authority 已定義不等於 Runtime 已完成；Implementation / Production evidence 必須獨立標示。
  - index: 39
    rows:
    - row: 0
      cells:
      - Enterprise output case
      - QA requirement
    - row: 1
      cells:
      - Creative/media artifact generated for outreach/delivery
      - Must resolve the applicable existing QCP profile by artifact type; if no applicable profile exists, BLOCK and route a governed profile request to SG-02 rather
        than inventing a generic score.
    - row: 2
      cells:
      - Business records (lead/target/campaign/account metadata)
      - These are dynamic business data, not QA Criteria catalog rows; do not seed fake values. Validate with business schema/permission/runtime rules.
    - row: 3
      cells:
      - Externally deliverable content
      - Must carry exact output/version/checksum + criteria_version_id + scorecard_id + required-check state before delivery/publish handoff.
    - row: 4
