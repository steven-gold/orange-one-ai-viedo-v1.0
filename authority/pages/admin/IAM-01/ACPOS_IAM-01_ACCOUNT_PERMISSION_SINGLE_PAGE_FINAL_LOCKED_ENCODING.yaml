hard_locks:
- Only admin:IAM-01 is the current Accounts & Permissions UI page in this authority.
- IAM-02..IAM-06 standalone navigation surfaces are superseded by this single-page composition; their services/operations/data contracts are reused,
  not duplicated.
- User-visible permission configuration is L1 only. No Section/Control/Action/Field/API permission tree is shown to account administrators.
- L1 selection does not create runtime inheritance. It must materialize explicit current permission assignments before activation.
- Department / Job Title / Role Name never grants permission by itself.
- Department Permission Preset only pre-fills draft L1 choices and is always editable before preview/apply.
- 後台總權限 is select-all UI only; it is not SUPER_ADMIN and never bypasses MFA/approval/state/policy/audit gates.
- Preset or L1 structure changes never retroactively auto-grant access to existing accounts.
- No wildcard admin:* grant is generated by this page.
- No invented account field, endpoint, role, department list, permission combination, break-glass operation or route.
- No fake user/account/MFA/risk/session/audit/access-review data.
- No completion claim unless all required existing operations and audit evidence succeed.
acceptance:
- uid: IAM-01-ACC-01
  item: Single Page
  condition: Only admin:IAM-01 is current visible Accounts & Permissions page; no IAM-02..06 standalone navigation.
- uid: IAM-01-ACC-02
  item: current registered authority Reuse
  condition: IdentityService/PolicyService/AccessReviewService and existing current registered authority operations are reused; no parallel IAM/RBAC.
- uid: IAM-01-ACC-03
  item: Account Directory
  condition: Search/list/status/identity source/MFA/risk/audit remain available from current registered authority IAM-01 projections.
- uid: IAM-01-ACC-04
  item: Create/Edit Flow
  condition: Basic Data -> L1 Permission -> Preview/Complete in one page; Add/Edit do not navigate to another IAM page.
- uid: IAM-01-ACC-05
  item: Frontend L1
  condition: Exactly 9 current frontend permission choices in exact order.
- uid: IAM-01-ACC-06
  item: Backend L1
  condition: Exactly 9 confirmed backend permission choices in exact order.
- uid: IAM-01-ACC-07
  item: Department Preset
  condition: Preset only pre-fills L1 draft; Department itself never grants access.
- uid: IAM-01-ACC-08
  item: Backend All
  condition: 後台總權限 selects all backend L1 draft values only; no super-admin bypass.
- uid: IAM-01-ACC-09
  item: Explicit Materialization
  condition: Selected L1 grants become explicit account permission assignments; runtime inheritance remains forbidden.
- uid: IAM-01-ACC-10
  item: Preview First
  condition: Effective authorization impact preview is required before permission apply/activation.
- uid: IAM-01-ACC-11
  item: No Silent Future Grant
  condition: New resource under an L1 does not auto-grant to existing accounts.
- uid: IAM-01-ACC-12
  item: Security / Audit
  condition: Identity, account permission, scope, condition, state/version/idempotency and audit remain backend gates.
- uid: IAM-01-ACC-13
  item: Truthful State
  condition: Partial failure never displays account creation/update as complete.
- uid: IAM-01-ACC-14
  item: No Fake / No Guess
  condition: Unknown fields/mappings/operations are blocked and reported rather than invented.
- uid: IAM-01-ACC-15
  item: Global Visual
  condition: Global Shell V1.9 and Global Visual inherited; no second visual system.
