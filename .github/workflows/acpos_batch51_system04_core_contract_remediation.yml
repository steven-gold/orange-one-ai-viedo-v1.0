name: ACPOS Batch 51 System04 CORE Contract Remediation

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch51-system04-core-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 50 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="7770fb3cd0466d14b971a3354d9bd35f1a45cd15"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH50 CONTENT BOUNDARY / 31 DOCX"

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Apply Batch 51 System04 remediation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch51_system04_core_contract_remediation.py

      - name: Verify Batch 51 semantics
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch51_remediation_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["pre_contract_cells"]==190,m
          assert m["system04_cells_closed"]==53,m
          assert (m["method_path_closed"],m["payload_schema_closed"],m["persistence_owner_closed"])==(19,17,17),m
          assert m["exact_lock_routes_reused"]==2,m
          assert m["new_current_design_route_definitions"]==17,m
          assert m["post_contract_cells"]==137,m
          assert (m["remaining_method_path"],m["remaining_payload_schema"],m["remaining_persistence_owner"])==(43,56,38),m
          assert m["same_page_route_collisions"]==0,m
          assert m["ai_self_approval_introduced"]==0,m
          assert m["runtime_execution_claimed"] is False,m
          print("PASS: BATCH51 190 -> 137")
          PY

      - name: Convert three DOCX files to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __render_qa_batch51/pdf
          while IFS= read -r f; do libreoffice --headless --convert-to pdf --outdir __render_qa_batch51/pdf "$f" >/dev/null; done <<'EOF'
          04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          EOF

      - name: Encoding CJK and geometry QA
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,math,shutil
          from PIL import Image
          r=json.loads(Path("__batch51_remediation_report.json").read_text(encoding="utf-8"))
          root=Path("__render_qa_batch51");(root/"contact").mkdir(exist_ok=True);(root/"png").mkdir(exist_ok=True)
          cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"];rep={};total=0
          for fn in r["changed_docs"]:
              p=Path(fn);pdf=root/"pdf"/(p.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(p) as z:
                  for n in [x for x in z.namelist() if x.endswith(".xml") or x.endswith(".rels")]: ET.fromstring(z.read(n))
                  rootxml=ET.fromstring(z.read("word/document.xml"));ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in rootxml.iter(ns+"t"))
              txt=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              assert not [x for x in bad if x in src or x in txt],(fn,"MOJIBAKE")
              sc=len(cjk.findall(src));pc=len(cjk.findall(txt));assert sc>0 and pc/sc>=0.97,(fn,sc,pc)
              out=root/"png"/p.stem;out.mkdir(exist_ok=True)
              subprocess.check_call(["pdftoppm","-png","-r","72",str(pdf),str(out/"page")],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              imgs=sorted(out.glob("page-*.png"));assert imgs
              blank=[];edge=[];thumbs=[]
              for imf in imgs:
                  im=Image.open(imf).convert("L");w,h=im.size;mask=im.point(lambda x:255 if x<245 else 0);bbox=mask.getbbox()
                  if bbox is None:blank.append(imf.name)
                  elif bbox[0]<=1 or bbox[1]<=1 or bbox[2]>=w-1 or bbox[3]>=h-1:edge.append((imf.name,bbox,(w,h)))
                  th=Image.open(imf).convert("RGB");th.thumbnail((180,255));thumbs.append(th.copy())
              assert not blank,(fn,"BLANK",blank);assert not edge,(fn,"EDGE",edge[:5])
              cols=4;cw=190;ch=265;rows=math.ceil(len(thumbs)/cols);sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for i,im in enumerate(thumbs):sheet.paste(im,((i%cols)*cw+5,(i//cols)*ch+5))
              sheet.save(root/"contact"/(p.stem+"_contact.jpg"),quality=82)
              total+=len(imgs);rep[fn]={"pages":len(imgs),"cjk_ratio":pc/sc,"blank":0,"edge_clip":0,"status":"PASS"};shutil.rmtree(out)
          rep["_summary"]={"documents":len(r["changed_docs"]),"pages":total,"blank":0,"edge_clip":0,"status":"PASS"}
          (root/"qa_report.json").write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH51 WORD QA",rep["_summary"])
          PY

      - name: Verify exact Word scope
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import subprocess,json
          from pathlib import Path
          r=json.loads(Path("__batch51_remediation_report.json").read_text(encoding="utf-8"))
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","7770fb3cd0466d14b971a3354d9bd35f1a45cd15","--","*.docx"],text=True)
          changed=sorted(x for x in out.splitlines() if x);expected=sorted(r["changed_docs"])
          assert changed==expected,{"changed":changed,"expected":expected}
          assert len(changed)==3
          print("PASS: EXACT WORD SCOPE = 3")
          PY

      - name: Collect evidence
        shell: bash
        run: |
          mkdir -p __batch51_evidence
          cp __batch51_remediation_report.json __batch51_evidence/
          cp __render_qa_batch51/qa_report.json __batch51_evidence/
          cp -R __render_qa_batch51/pdf __render_qa_batch51/contact __batch51_evidence/

      - name: Upload Batch 51 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch51-system04-core-contract-remediation-evidence
          path: __batch51_evidence
          retention-days: 1
          if-no-files-found: error

      - name: Commit Batch 51 and remove tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-word-batch-51"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git rm -f __temp/batch51_system04_core_contract_remediation.py .github/workflows/acpos_batch51_system04_core_contract_remediation.yml
          rm -rf __batch51_remediation_report.json __batch51_evidence __render_qa_batch51
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(git diff --cached --name-only -- '*.docx' | wc -l)" -eq 3
          git commit -m "docs(acpos): close system04 core contract gaps"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH51 COMMITTED / CLEAN TREE"
