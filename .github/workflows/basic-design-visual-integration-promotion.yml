name: Basic Design Visual Integration Promotion
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - '.github/governance-maintenance/BASIC_DESIGN_VISUAL_INTEGRATION_PROMOTE_TRIGGER'
permissions:
  contents: write
jobs:
  promote-basic-design:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - name: Promote Basic Design visual integration successor
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/governance-maintenance/promote_basic_design_visual_integration.py.gz > /tmp/promote_basic_design_visual_integration.py
          python /tmp/promote_basic_design_visual_integration.py
