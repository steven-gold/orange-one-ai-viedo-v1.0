          new='function localAction(controlId:string,state:EditClientState,dispatch:Dispatch<Parameters<typeof reduceEditClientState>[1]>,setRuntimeError:(v:string|null)=>void,value?:unknown,scopeRef?:string){'
          if old not in s: raise SystemExit('localAction signature missing')
          s=s.replace(old,new)
          anchor='  if(controlId==="EDIT-01-CTL-SUBTITLE-TOGGLE"){dispatch({type:"SUBTITLE_TOGGLE"});return true;}if(controlId==="EDIT-01-FLD-MEDIA-SEARCH")'
          insertion='  if(controlId==="EDIT-01-CTL-DROP-TIMELINE"){const media=typeof value==="string"&&value?value:state.selected_media_ref;if(!media){setRuntimeError("EDIT-01-ERR-MEDIA-001: MEDIA_SELECTION_REQUIRED");return true;}dispatch({type:"CLIP_SELECT",value:`WORKING-CLIP:${media}`});dispatch({type:"LOCAL_ACTION",action_uid:action,dirty:true,result:`CLIP_INSERT:${media}`});return true;}\n  if(controlId==="EDIT-01-CTL-RULER"||controlId==="EDIT-01-CTL-PLAYHEAD"){dispatch({type:"SEEK",value:Number(value??0)});dispatch({type:"LOCAL_ACTION",action_uid:action,result:`SEEK:${String(value??0)}`});return true;}if(controlId==="EDIT-01-CTL-MINI-TIMELINE"||controlId==="EDIT-01-CTL-MARKER-RAIL"){dispatch({type:"LOCAL_ACTION",action_uid:action,result:`TIMELINE_NAV:${String(value??0)}`});return true;}\n  if(scopeRef&&["EDIT-01-CTL-TRACK-VISIBLE","EDIT-01-CTL-TRACK-MUTE","EDIT-01-CTL-TRACK-SOLO","EDIT-01-CTL-TRACK-LOCK"].includes(controlId)){dispatch({type:"TRACK_SELECT",value:scopeRef});dispatch({type:"LOCAL_ACTION",action_uid:action,dirty:binding.effect_type==="DRAFT_MUTATION",result:`TRACK:${scopeRef}:${controlId}`});return true;}\n  if(controlId==="EDIT-01-CTL-SUBTITLE-TOGGLE"){dispatch({type:"SUBTITLE_TOGGLE"});return true;}if(controlId==="EDIT-01-FLD-MEDIA-SEARCH")'
          if anchor not in s: raise SystemExit('local special anchor missing')
          s=s.replace(anchor,insertion)
          old='export function EditRuntimeControl({controlId,kind,compact=false}:{controlId:string;kind:EditControlKind;compact?:boolean})'
          new='export function EditRuntimeControl({controlId,kind,compact=false,scopeRef}:{controlId:string;kind:EditControlKind;compact?:boolean;scopeRef?:string})'
          if old not in s: raise SystemExit('runtime props token missing')
          s=s.replace(old,new)
          s=s.replace('"data-busy-action":state.busy_action??undefined};','"data-busy-action":state.busy_action??undefined,"data-scope-ref":scopeRef};')
          s=s.replace('if(local){if(!localAction(controlId,state,dispatch,setRuntimeError,value))','if(local){if(!localAction(controlId,state,dispatch,setRuntimeError,value,scopeRef))')
          marker='  if(kind==="readonly"||kind==="overview")return <div className={`${styles.readonly} ${compact?styles.compact:""}`} {...common}><span>{label}</span><strong>{readonlyValue(controlId,state,runtimeError)}</strong></div>;'
          addition=marker+'\n  if(kind==="mode-select"){if(state.source_mode==="PROJECT_TASK")return <div className={`${styles.readonly} ${compact?styles.compact:""}`} {...common}><span>{label}</span><strong>{readonlyValue(controlId,state,runtimeError)}</strong></div>;const items=listItems(controlId,state);return <label className={styles.fieldControl}><span>{label}</span><select {...common} disabled={!enabled||items.length===0} defaultValue="" onChange={event=>act(event.target.value)}><option value="">—</option>{items.map(item=><option key={item.ref} value={item.ref}>{item.label}</option>)}</select></label>;}\n  if(kind==="dropzone")return <button className={styles.button} type="button" disabled={!enabled} draggable={false} onDragOver={event=>event.preventDefault()} onDrop={event=>{event.preventDefault();act(event.dataTransfer.getData("text/plain")||state.selected_media_ref||undefined)}} onClick={()=>act(state.selected_media_ref??undefined)} {...common}>{label}</button>;\n  if(kind==="timeline"){const current=typeof state.playhead==="number"?state.playhead:0;return <label className={styles.rangeControl}><span>{label}</span><input {...common} disabled={!enabled} type="range" min="0" max="1000" value={Math.max(0,Math.min(1000,current))} onChange={event=>act(Number(event.target.value))}/></label>;}'
          if marker not in s: raise SystemExit('readonly render marker missing')
          s=s.replace(marker,addition)
          old='if(kind==="select"){if(controlId==="EDIT-01-CTL-PLAYBACK-RATE")return <label className={styles.fieldControl}><span>{label}</span><select {...common} disabled={!enabled} value={state.playback_rate} onChange={event=>dispatch({type:"RATE",value:Number(event.target.value) as EditClientState["playback_rate"]})}>{[0.25,0.5,1,1.5,2].map(value=><option key={value} value={value}>{value}x</option>)}</select></label>;const items=listItems(controlId,state);const exact=controlId==="EDIT-01-FLD-PROJECT"?state.resolved.project_id:controlId==="EDIT-01-FLD-TOPIC"?state.resolved.topic_id:controlId==="EDIT-01-FLD-TASK"?state.resolved.task_id:"";return <label className={styles.fieldControl}><span>{label}</span><select {...common} disabled={!enabled&&items.length===0} value={exact??""} onChange={event=>act(event.target.value)}><option value="">—</option>{items.map(item=><option key={item.ref} value={item.ref}>{item.label}</option>)}</select></label>;}'
          new='if(kind==="select"){if(controlId==="EDIT-01-CTL-PLAYBACK-RATE")return <label className={styles.fieldControl}><span>{label}</span><select {...common} disabled={!enabled} value={state.playback_rate} onChange={event=>dispatch({type:"RATE",value:Number(event.target.value) as EditClientState["playback_rate"]})}>{[0.25,0.5,1,1.5,2].map(value=><option key={value} value={value}>{value}x</option>)}</select></label>;const items=listItems(controlId,state);const exact=controlId==="EDIT-01-FLD-PROJECT"?state.resolved.project_id:controlId==="EDIT-01-FLD-TOPIC"?state.resolved.topic_id:controlId==="EDIT-01-FLD-TASK"?state.resolved.task_id:controlId==="EDIT-01-CTL-AUDIO-MONITOR"?state.audio_monitor:"";return <label className={styles.fieldControl}><span>{label}</span><select {...common} disabled={!enabled||items.length===0} value={exact??""} onChange={event=>controlId==="EDIT-01-CTL-AUDIO-MONITOR"?dispatch({type:"AUDIO_MONITOR",value:event.target.value||null}):act(event.target.value)}><option value="">—</option>{items.map(item=><option key={item.ref} value={item.ref}>{item.label}</option>)}</select></label>;}'
          if old not in s: raise SystemExit('select render token missing')
          s=s.replace(old,new)
          old='if(kind==="range"){const previewVolume=controlId==="EDIT-01-CTL-VOLUME";const value=previewVolume?Math.round(state.preview_volume*100):50;return <label className={styles.rangeControl}><span>{label}</span><input {...common} disabled={!enabled} type="range" min="0" max="100" value={value} onChange={event=>previewVolume?dispatch({type:"PREVIEW_VOLUME",value:Number(event.target.value)/100}):act(Number(event.target.value))}/></label>;}'
          new='if(kind==="range"){const previewVolume=controlId==="EDIT-01-CTL-VOLUME";if(controlId==="EDIT-01-CTL-IN-OUT"){const a=typeof state.range_in==="number"?state.range_in:0,b=typeof state.range_out==="number"?state.range_out:100;return <fieldset className={styles.rangeControl} {...common} disabled={!enabled}><legend>{label}</legend><input aria-label={`${label} In`} type="range" min="0" max="1000" value={Math.max(0,Math.min(1000,a))} onChange={event=>dispatch({type:"RANGE_IN",value:Number(event.target.value)})}/><input aria-label={`${label} Out`} type="range" min="0" max="1000" value={Math.max(0,Math.min(1000,b))} onChange={event=>dispatch({type:"RANGE_OUT",value:Number(event.target.value)})}/></fieldset>;}const value=previewVolume?Math.round(state.preview_volume*100):50;return <label className={styles.rangeControl}><span>{label}</span><input {...common} disabled={!enabled} type="range" min="0" max="100" value={value} onChange={event=>previewVolume?dispatch({type:"PREVIEW_VOLUME",value:Number(event.target.value)/100}):act(Number(event.target.value))}/></label>;}'
          if old not in s: raise SystemExit('range render token missing')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/domain/edit/editClientState.ts'); s=p.read_text()
          old='case"SOURCE_MODE":return{...clearTransient(state),source_mode:action.value};'
          new='case"SOURCE_MODE":{const next=clearTransient(state);return action.value==="STANDALONE_UPLOAD"?{...next,source_mode:action.value,resolved:{...EMPTY_EDIT_RESOLVED_CONTEXT,page_state_uid:"EDIT-01-ST-PAGE-EMPTY",gate_state:{"EDIT-01-GATE-STANDALONE":true,"EDIT-01-GATE-CONTEXT-MUTABLE":true}}}:{...next,source_mode:action.value};}'
          if old not in s: raise SystemExit('source mode reducer token missing')
          s=s.replace(old,new)
          p.write_text(s)

