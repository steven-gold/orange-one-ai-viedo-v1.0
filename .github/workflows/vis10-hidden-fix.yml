name: VIS-10 Council hidden correction
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-hidden-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Apply exact hidden-state correction
        run: |
          python3 -c "from pathlib import Path; p=Path('src/components/pages/SystemVisual.module.css'); s=p.read_text(); a='.segmentGroup {\\n  display: inline-flex;'; b='.segmentGroup[hidden] { display: none; }\\n\\n.segmentGroup {\\n  display: inline-flex;'; assert a in s; p.write_text(s.replace(a,b,1))"
          grep -Fq '.segmentGroup[hidden] { display: none; }' src/components/pages/SystemVisual.module.css
      - name: Commit exact file and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add src/components/pages/SystemVisual.module.css
          git commit -m "fix(vis10): enforce Council controls hidden in Single AI"
          git rm .github/workflows/vis10-hidden-fix.yml
          git commit -m "chore(vis10): remove temporary hidden-state workflow"
          git push origin HEAD:acpos-vis10-staging
