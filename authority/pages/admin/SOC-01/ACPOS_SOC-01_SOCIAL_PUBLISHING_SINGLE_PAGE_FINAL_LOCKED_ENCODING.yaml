state_model:
  common_ui_states:
  - LOADING
  - READY
  - EMPTY
  - ERROR
  - POLICY_BLOCKED
  - VERSION_CONFLICT
  - EXTERNAL_PENDING
  - READ_ONLY
  - BLOCKED
  social_account_states:
  - UNBOUND
  - CONFIGURED
  - BOUND_LOCKED
  - REAUTH_REQUIRED
  social_target_states:
  - DISCOVERED
  - READY_TO_JOIN
  - MANUAL_ACTION_REQUIRED
  - PENDING_ADMIN_APPROVAL
  - JOINED
  - READY_TO_POST
  - PENDING_EXTERNAL
  - POSTED
  - COOLDOWN
  - UNAVAILABLE
  rules:
  - Service-only verifySocialAccountBinding may transition CONFIGURED/REAUTH_REQUIRED to BOUND_LOCKED or REAUTH_REQUIRED;
    SOC-01 exposes status only, no user Verify button.
  - Service-only verifySocialTargetCapability may transition DISCOVERED to READY_TO_JOIN; SOC-01 exposes status only, no user
    capability Verify button.
  - requestSocialTargetJoin from DISCOVERED/READY_TO_JOIN may become MANUAL_ACTION_REQUIRED or PENDING_EXTERNAL.
  - completeSocialManualAction uses actual pending action context and may progress target according to source state machine;
    page never chooses an impossible target state.
  - configureSocialTargetPolicy operates on an eligible JOINED target and prepares READY_TO_POST according to source state
    machine.
  - requestSocialTargetPublish from READY_TO_POST creates a request that may become MANUAL_ACTION_REQUIRED or PENDING_EXTERNAL;
    request completion is not equivalent to POSTED external success.
  - Results/Records render only recorded real external status/callback/metrics; UI may not infer POSTED.
policy_contract:
  platform_native_variant_rule: One governed Master Message/source may produce platform-native variants, but blind identical
    cross-platform copy is forbidden.
  specific_company_mention_tag: FORCE_HUMAN_APPROVAL
  mass_commenting_tagging_cold_outreach: FORBIDDEN
  direct_message: ONLY_WHEN_OFFICIAL_API_ACCOUNT_PERMISSION_AND_POLICY_EXPLICITLY_ALLOW
  auto_publish_ui: READ_GOVERNED_POLICY; no invented local request field/toggle. If an exact existing governed-resource binding
    is returned, edit through configureGovernedResource; otherwise read-only.
  human_approval_ui: READ_GOVERNED_POLICY; no invented local request field/toggle; specific-company mention/tag remains forced
    human approval.
  provider_model_picker: FORBIDDEN
  external_adapter_direct_sdk_call_from_page: FORBIDDEN
errors:
- error_uid: SOC-01-ERR-AUTH
  when: Page/action/API account permission, scope, condition or classification denied
  recovery: Hide effectful control where required but rely on server DENY; preserve safe page context; show permitted reason
    only.
- error_uid: SOC-01-ERR-SECRET
  when: Credential reveal/binding secret handling invalid or unauthorized
  recovery: Do not render/store raw secret in normal page state; keep masked status; require exact source operation and audit.
- error_uid: SOC-01-ERR-ACCOUNT
  when: Account binding version/state/platform mismatch or external verification fails
  recovery: Preserve configured data; show CONFIGURED/REAUTH_REQUIRED/actual error; never fabricate BOUND_LOCKED.
- error_uid: SOC-01-ERR-DISCOVERY
  when: Target discovery request invalid, platform/capability/policy unavailable or external discovery fails
  recovery: BLOCK start/result adoption; preserve form; show actual source/policy/external state; no synthetic targets.
- error_uid: SOC-01-ERR-TARGET
  when: Target state/capability does not allow join/publish
  recovery: Disable legal action and show actual blocker; no client bypass.
- error_uid: SOC-01-ERR-CONTENT
  when: Release source/content package/candidate version missing, stale, invalid or policy blocked
  recovery: Keep Draft/Candidate; require exact source/version and governed review; never publish directly.
- error_uid: SOC-01-ERR-POLICY
  when: Frequency/cooldown/time-window/policy request invalid or stale
  recovery: Do not mark READY_TO_POST; reload exact target/version and correct registered fields only.
- error_uid: SOC-01-ERR-PUBLISH
  when: Publish target/content/channel account/approval/policy/version/idempotency invalid
  recovery: BLOCK request; do not create external-success UI; preserve correlation/evidence.
- error_uid: SOC-01-ERR-EXTERNAL
  when: Publish/join requires manual action or external platform is pending/unavailable
  recovery: Represent MANUAL_ACTION_REQUIRED/PENDING_EXTERNAL/UNAVAILABLE truthfully; do not auto-convert to success.
- error_uid: SOC-01-ERR-PARTIAL
  when: Composite page orchestration or future multi-target UX partially succeeds
  recovery: Never report COMPLETE; show exact succeeded/blocked/failed items; retry idempotently only for missing legal work.
- error_uid: SOC-01-ERR-UNDEFINED
  when: Unregistered field/operation/route/service/permission/provider behavior requested
  recovery: BLOCK + REPORT_AUTHORITY_GAP; never create a parallel social publishing system.
hard_locks:
- Only admin:SOC-01 is the current Social Publishing UI workspace in this authority.
- The five workflow stages are composition areas inside one page; they are not five current navigation pages.
- Existing PublishingAdapterService / PublishingService / PublishingAnalyticsService / EnterpriseSocialOutreachGovernance
  / Governance owners are reused; no parallel system, registry, DB, adapter, scheduler, queue or analytics store.
- Backend access is configured to the user as one L1 社群發布 choice; operation-level source permissions remain internal runtime
  gates and are not exposed as a new fine-grained permission UI here.
- Role name or department membership never authorizes an operation.
- Platform capability/health/policy and external status are real data only; missing=—/incomplete, never AI-filled.
- Raw social credential is never shown by default; reveal is an existing high-risk audited operation only.
- verifySocialAccountBinding and verifySocialTargetCapability remain service-runtime operations; no page user Verify button
  is invented.
- Content package remains Draft/Candidate until governed decision; content approval does not itself publish.
- Master Message is transformed into platform-native variants; blind identical copy to all platforms is forbidden.
- Mention/Tag a specific target company requires human approval; automated mass commenting/tagging/cold outreach is forbidden.
- Direct Message is not a default feature and is allowed only when official API/account permission/policy explicitly supports
  it.
- Auto Publish / Human Approval policy is read from current governed policy. No local auto_publish/human_approval request
  field is invented.
- Publish request uses exact existing target-scoped requestSocialTargetPublish. No new bulkSocialPublish endpoint/service.
- requestSocialTargetPublish success means governed request accepted, not proof that the external post is POSTED.
- Withdrawal in Results/Records is read-only because no current registered withdrawal mutation is sourced; no Withdraw button
  is invented.
- Low-frequency audit/evidence/history/credential/callback/incident detail stays in secondary rail/drawer; no duplicate permanent
  cards.
- No fake metrics, account status, target status, platform health, content approval, publish result, callback, incident or
  audit data.
- No invented endpoint, request field, platform capability, permission, route, provider syntax or external adapter call.
- Unknown/missing authority -> BLOCK + REPORT_AUTHORITY_GAP.
- FILE_SPEC_COMPLETE does not mean application/runtime/Sandbox/Regression/E2E/deployment completed.
acceptance:
- uid: SOC-01-ACC-01
  item: Single Current Page
  condition: Only admin:SOC-01 is current Social Publishing UI; historical segmented source UI is not reconstructed.
- uid: SOC-01-ACC-02
  item: Source Owner Reuse
  condition: Existing publishing adapter/service/analytics/governance owners and existing DBs/operations are reused; no second
    backend.
- uid: SOC-01-ACC-03
  item: Five-Stage Same-Page Flow
  condition: Platform -> Accounts/Targets -> Content -> Publish -> Records is one page context flow.
- uid: SOC-01-ACC-04
  item: Account & Secret Safety
  condition: Bind/reveal/unbind use existing operations; raw credential never normal-rendered; service verify remains backend-only.
- uid: SOC-01-ACC-05
  item: Target Discovery
  condition: Discovery uses exact source fields including mode CONTINUOUS/SINGLE_RUN; no second crawler/directory.
- uid: SOC-01-ACC-06
  item: Content Candidate Boundary
  condition: Release source/platform variants/content draft/candidate review are separated from publish execution.
- uid: SOC-01-ACC-07
  item: Platform-Native Content
  condition: Master source may generate native platform variants; blind identical cross-platform copy forbidden.
- uid: SOC-01-ACC-08
  item: Human Approval Policy
  condition: Specific-company mention/tag forces human approval; Auto Publish/Human Approval semantics do not invent new request
    fields.
- uid: SOC-01-ACC-09
  item: Target Policy Contract
  condition: minimum_interval_hours/daily_limit/weekly_limit and registered optional cooldown/window/notes fields are exact.
- uid: SOC-01-ACC-10
  item: Publish Request Contract
  condition: content_package_id + channel_account_id required; schedule/hash/similarity optional; exact target-scoped operation
    only.
- uid: SOC-01-ACC-11
  item: Truthful External State
  condition: PENDING_EXTERNAL/MANUAL_ACTION_REQUIRED remain non-success; POSTED only from real recorded state.
- uid: SOC-01-ACC-12
  item: Records Boundary
  condition: Search/refresh/read only; withdrawal has no invented mutation button.
- uid: SOC-01-ACC-13
  item: Authorization
  condition: User sees backend L1 social_publishing; runtime enforces exact source account permissions/scope/state/version/idempotency/audit;
    role/department bypass forbidden.
- uid: SOC-01-ACC-14
  item: No Parallel System
  condition: No second registry/account/target/content/publish/analytics/credential/provider system or invented bulk publish
    endpoint.
- uid: SOC-01-ACC-15
  item: Global Shell/Visual
  condition: Global Shell V1.9 and Global Visual inherited; page does not redraw header/sidebar or local theme.
- uid: SOC-01-ACC-16
  item: UI Necessity
  condition: Active stage only; low-frequency details in drawer; max one primary CTA; fake/decorative KPI/chart forbidden.
- uid: SOC-01-ACC-17
  item: Machine Binding
  condition: Every visible control resolves Section/Component/Visual/Action/Gate/Permission; zero unresolved internal refs.
- uid: SOC-01-ACC-18
  item: Truthful Completion
  condition: File may be FILE_SPEC_COMPLETE while application/runtime/external/Sandbox/Regression/E2E/deployment remain NOT_EXECUTED.
