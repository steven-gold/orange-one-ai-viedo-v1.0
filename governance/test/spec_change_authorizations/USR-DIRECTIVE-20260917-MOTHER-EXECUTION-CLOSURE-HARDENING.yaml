      - DEFINITION_OF_DONE
      - RESUME_LEDGER
      - WORK_UNIT_MATRIX
  permitted_normative_changes:
    - Consolidate duplicated or overlapping Mother clauses into canonical semantic owners without reducing requirements.
    - Define one complete reusable lifecycle contract from Current Truth resolution through planning, preflight, dependency-ordered execution, verification, persistence, cleanup, closure and legal transition.
    - Require a machine-readable validator applicability/domain contract and prohibit workflows from invoking validators outside their legal predecessor/current/successor state domain.
    - Require complete Current projector inventory derived from registered state/evidence consumers, not a fixed handwritten subset.
    - Require every state mutation producer to atomically project every registered Current state/evidence/projector owner or fail before persistence.
    - Require complete active workflow/consumer inventory including indirect invoked validators, producers, projectors, denominator consumers, lifecycle-output consumers and terminal receipt consumers.
    - Require stale/missing/deleted owner references to fail at workflow admission/preflight rather than during later execution.
    - Require one canonical preflight/compiler truth and prohibit workflow-local hard-coded denominator, required-field, applicability, validator-selection or projector subsets.
    - Separate discovery evidence, effective-contract reconciliation, remediation proof and terminal closure evidence while preserving exact lineage.
    - Require persistence transaction topology to distinguish execution-source identity, receipt-only persistence child, state-closure commit, cleanup commit and terminal external CI receipt when those layers are applicable.
    - Require success-path and failure-path regression fixtures for every reusable invariant learned from execution.
    - Require zero unjustified duplicate, stale, obsolete, empty, backup, temporary, abandoned intermediate, dead owner and superseded Current residual after promotion/cleanup.
    - Require planning/freeze outputs to be machine-complete at a detail level sufficient to generate concrete Work Unit Matrix, Acceptance Matrix, DoD, Resume, Control/Field/State/Gate/Owner/Dependency/Evidence bindings before implementation.
    - Preserve product-neutrality and execution-profile neutrality; concrete Stage/Rxx/workflow/script identities may appear only as non-normative empirical provenance or profile/run-state bindings.
    - Add or strengthen machine-enforced coverage/consistency/negative-regression rules required to prevent recurrence of the observed Stage-02 execution defects.
  permitted_supporting_changes:
