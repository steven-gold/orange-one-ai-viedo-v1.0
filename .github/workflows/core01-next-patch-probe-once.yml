name: CORE01 Next Patch Probe Once
on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/core01-next-patch-probe-once.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Probe Next 16.2.11 without repository write
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --save-exact next@16.2.11
          test "$(node -p "require('./node_modules/next/package.json').version")" = "16.2.11"
          npm audit --omit=dev --json >/tmp/audit.json || true
          python3 <<'PY'
          import json,sys
          d=json.load(open('/tmp/audit.json'))
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print('PATCH_16_2_11_PROD_COUNTS='+json.dumps(v,sort_keys=True))
          for n,x in sorted(d.get('vulnerabilities',{}).items()): print('PATCH_VULN',n,x.get('severity'),x.get('range'),x.get('fixAvailable'))
          if v.get('total',0): sys.exit(2)
          PY
          npm run typecheck
          npm run build
          echo NEXT_16_2_11_SECURITY_COMPILE_PROBE_PASS
      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          git rm -f .github/workflows/core01-next-patch-probe-once.yml
          git commit -m "chore: remove CORE01 Next patch probe workflow"
          git push origin new
