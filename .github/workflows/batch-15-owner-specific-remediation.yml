name: ACPOS Batch 15 Owner Specific Remediation

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-15-owner-specific-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Verify no Word drift since Batch 14
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="a43f3509d4d3448fc466a6bfe5ec1b8cee9cb22a"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-14")
          PY

      - name: Preflight script syntax
        run: python -m py_compile __temp/batch_15_owner_specific_remediation.py

      - name: Baseline DOCX encoding audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,json
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};report={}
          for fn in files:
              with zipfile.ZipFile(fn) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  for n in xmls:ET.fromstring(z.read(n))
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  text="".join((e.text or "") for e in root.iter(ns+"t"))
              assert "\x00" not in text,(fn,"NUL")
              ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
              assert not ctrl[:20],(fn,"CONTROL",ctrl[:20])
              hits=[x for x in bad if x in text]
              assert not hits,(fn,"MOJIBAKE",hits)
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,"REPLACEMENT")
              report[fn]={"xml_parts":len(xmls),"chars":len(text),"status":"PASS"}
          Path("__batch15_baseline_encoding.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-15 BASELINE ENCODING",json.dumps(report,ensure_ascii=False))
          PY

      - name: Apply Batch 15 remediation
        run: python __temp/batch_15_owner_specific_remediation.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch15_remediation_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["pre_definition_gaps"]==164,m
          assert m["db_operation_na"]==8,m
          assert m["erp_operation_na"]==20,m
          assert m["erp_connector_runtime_owner_bound"]==7,m
          assert m["erp_finance_runtime_owner_bound"]==7,m
          assert m["gaps_closed"]==42,m
          assert m["post_definition_gaps"]==122,m
          assert m["remaining_unique_owner_remediation"]==121,m
          assert m["preserved_sys_gate_conflict"]==1,m
          assert m["operation_values_invented"]==0,m
          assert m["runtime_owner_values_written"]==14,m
          assert m["runtime_execution_claimed"] is False,m
          assert len(r["db_operation_targets"])==8
          assert len(r["erp_operation_targets"])==20
          assert len(r["runtime_owner_bindings"])==14
          assert len(r["removed_from_definition_gap"])==42
          logic=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          lt="\n".join([p.text for p in logic.paragraphs]+[c.text for t in logic.tables for row in t.rows for c in row.cells])
          for token in [
            "ACPOS-20260921-BATCH-15-OWNER-SPECIFIC-READ-PROJECTION-CLOSURE-V1",
            "LEGITIMATE_NA_DB_READ_MODEL_OPERATION",
            "LEGITIMATE_NA_ERP_READ_PROJECTION_FIELD_OPERATION",
            "BATCH15_MACHINE_JSON="
          ]:assert token in lt,token
          print("PASS: BATCH-15 SEMANTIC 42 CLOSED; DEFINITION GAP 164 -> 122")
          PY

      - name: Convert five DOCX files to PDF
        shell: bash
        run: |
          mkdir -p __render_qa_batch15/pdf
          for f in           "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx"           "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"           "ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          do
            libreoffice --headless --convert-to pdf --outdir __render_qa_batch15/pdf "$f"
          done

      - name: Post-conversion encoding and garble audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]");report={}
          for fn in files:
              docx=Path(fn);pdf=Path("__render_qa_batch15/pdf")/(docx.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(docx) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  for n in xmls:ET.fromstring(z.read(n))
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in root.iter(ns+"t"))
              pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              for label,text in [("DOCX",src),("PDF",pdftext)]:
                  assert "\x00" not in text,(fn,label,"NUL")
                  ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
                  assert not ctrl[:20],(fn,label,"CONTROL",ctrl[:20])
                  hits=[x for x in bad if x in text]
                  assert not hits,(fn,label,"MOJIBAKE",hits)
                  assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,label,"REPLACEMENT")
              sc=len(cjk.findall(src));pc=len(cjk.findall(pdftext));assert sc>0,(fn,"NO_SOURCE_CJK")
              ratio=pc/sc;assert ratio>=0.97,(fn,"CJK_RETENTION",sc,pc,ratio)
              report[fn]={"xml_parts":len(xmls),"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch15/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-15 ENCODING/GARBLE INTEGRITY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Render PNGs geometry and contact sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,math
          from PIL import Image,ImageChops,ImageDraw
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          qa=Path("__render_qa_batch15");pdfdir=qa/"pdf";pngroot=qa/"png";contact=qa/"contact"
          pngroot.mkdir(parents=True,exist_ok=True);contact.mkdir(parents=True,exist_ok=True)
          report={}
          for fn in files:
              p=Path(fn);pf=pdfdir/(p.stem+".pdf")
              info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
              pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
              od=pngroot/p.stem;od.mkdir(parents=True,exist_ok=True)
              subprocess.run(["pdftoppm","-png","-r","130",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob("page-*.png"));assert len(imgs)==pages,(fn,pages,len(imgs))
              blank=[];edge=[];thumbs=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert("RGB")
                  diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"));bb=diff.getbbox()
                  if bb is None:blank.append(i)
                  else:
                      l,t,r,b=bb
                      if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
                  th=im.copy();th.thumbnail((360,510))
                  canvas=Image.new("RGB",(380,545),"white");canvas.paste(th,((380-th.width)//2,8))
                  ImageDraw.Draw(canvas).text((8,526),f"page {i}",fill="black");thumbs.append(canvas)
              assert not blank,(fn,"BLANK",blank)
              assert not edge,(fn,"EDGE",edge)
              cols=5;rows=math.ceil(len(thumbs)/cols)
              sheet=Image.new("RGB",(cols*380,rows*545),"white")
              for i,th in enumerate(thumbs):sheet.paste(th,((i%cols)*380,(i//cols)*545))
              sheet.save(contact/(p.stem+".jpg"),quality=86)
              report[fn]={"pages":pages,"blank":blank,"edge":edge}
          Path("__render_qa_batch15/geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-15 RENDER/GEOMETRY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Verify exact Batch 15 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          }
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-15 CHANGE SCOPE EXACT 5 WORD")
          PY

      - name: Collect evidence
        run: |
          cp __batch15_remediation_report.json __render_qa_batch15/
          cp __batch15_baseline_encoding.json __render_qa_batch15/

      - name: Upload Batch 15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-15-owner-specific-remediation-evidence
          path: __render_qa_batch15
          retention-days: 1

      - name: Commit Batch 15 and remove temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch15 __temp/__pycache__ __batch15_remediation_report.json __batch15_baseline_encoding.json
          git rm __temp/batch_15_owner_specific_remediation.py .github/workflows/batch-15-owner-specific-remediation.yml
          git config user.name "acpos-word-batch-15"
          git config user.email "actions@users.noreply.github.com"
          git add           "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx"           "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"           "ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git commit -m "docs(acpos): resolve 42 owner-specific read-source gaps"
          git push
