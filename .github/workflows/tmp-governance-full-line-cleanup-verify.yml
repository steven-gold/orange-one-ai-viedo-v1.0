name: tmp-governance-full-line-cleanup-verify
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/tmp-governance-full-line-cleanup-verify.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      verify_head: ${{ steps.out.outputs.verify_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-governance-full-line-cleanup-verify.yml
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add -A .github/workflows/tmp-governance-full-line-cleanup-verify.yml
          CURRENT="$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')"
          test "$CURRENT" = "${GITHUB_SHA}"
          git commit -m "chore(governance): remove temporary full-line verifier"
          git push origin HEAD:rebuild-v2.1.1
      - id: out
        run: echo "verify_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.verify_head }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML==6.0.2
      - name: Run Current Governance full-line gate
        shell: bash
        run: |
          set -euo pipefail
          python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
