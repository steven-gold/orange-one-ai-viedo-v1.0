name: VIS-12 DEV validation
on:
  push:
    branches: [acpos-vis12-staging]
    paths: [.github/workflows/vis12-dev-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis12-staging
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start production server
        run: |
          (npm start -- -p 3000 > /tmp/vis12-server.log 2>&1 & echo $! > /tmp/vis12-server.pid)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/admin/dev >/dev/null && exit 0; sleep 1; done
          cat /tmp/vis12-server.log
          exit 1
      - name: Chromium validation
        run: |
          cat > vis12-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const expectedSections=['DEV-01-SEC-01','DEV-01-SEC-02','DEV-01-SEC-03','DEV-01-SEC-04','DEV-01-SEC-05','DEV-01-SEC-06','DEV-01-SEC-07','DEV-01-SEC-08','DEV-01-SEC-09'];
          const expectedComponents=['DEV-01-CMP-CONTEXT','DEV-01-CMP-STAGE-NAV','DEV-01-CMP-DISCOVERY-SETUP','DEV-01-CMP-DISCOVERY-RUNTIME','DEV-01-CMP-DISCOVERY-ACTION','DEV-01-CMP-DIRECTORY','DEV-01-CMP-MERGE','DEV-01-CMP-MESSAGE','DEV-01-CMP-MESSAGE-REVIEW','DEV-01-CMP-CAMPAIGN','DEV-01-CMP-CAMPAIGN-REVIEW','DEV-01-CMP-DELIVERY','DEV-01-CMP-KILL-SWITCH','DEV-01-CMP-GOVERNANCE','DEV-01-CMP-DETAIL-DRAWER'];
          const expectedControls=['DEV-01-BTN-STAGE-1','DEV-01-BTN-STAGE-2','DEV-01-BTN-STAGE-3','DEV-01-BTN-STAGE-4','DEV-01-BTN-STAGE-5','DEV-01-BTN-DISCOVERY-START','DEV-01-BTN-DISCOVERY-PAUSE','DEV-01-BTN-DISCOVERY-RESUME','DEV-01-BTN-DISCOVERY-STOP','DEV-01-BTN-DIRECTORY-SEARCH','DEV-01-BTN-MERGE-PREVIEW','DEV-01-BTN-MERGE','DEV-01-BTN-EXPORT','DEV-01-BTN-CANDIDATE-CREATE','DEV-01-BTN-CANDIDATE-DECIDE','DEV-01-BTN-CR-CREATE','DEV-01-BTN-CAMPAIGN-SEARCH','DEV-01-BTN-CAMPAIGN-CREATE','DEV-01-BTN-CAMPAIGN-APPROVE','DEV-01-BTN-EMAIL-DISPATCH','DEV-01-BTN-REFRESH','DEV-01-BTN-KILL-SWITCH'];
          (async()=>{
            const src=fs.readFileSync('src/components/pages/DevVisual.tsx','utf8');
            for(const id of expectedSections)assert(src.includes(id),'source missing section '+id);
            for(const id of expectedComponents)assert(src.includes(id),'source missing component '+id);
            for(const id of expectedControls)assert(src.includes(id),'source missing control '+id);
            assert(expectedSections.length===9 && expectedComponents.length===15 && expectedControls.length===22,'authority count constants');
            assert(!src.includes('BLOCKED_AUTHORITY_GAP'),'stale route gap');
            assert(!src.includes('data-control-id="DEV-01-BTN-SEND"'),'message send must not exist');
            const css=fs.readFileSync('src/components/pages/DevVisual.module.css','utf8');
            assert(!css.includes('--surface-elevated'),'undefined surface token');
            assert(css.includes('min-width:1280px'),'page min width');
            assert(css.includes('height:56px'),'context/action height');
            assert(css.includes('height:52px'),'stage height');
            assert(css.includes('minmax(0,72fr) minmax(320px,28fr)'),'72/28 geometry');
            const b=await chromium.launch({headless:true});
            let businessRequests=0;
            const p=await b.newPage({viewport:{width:1440,height:900}});
            p.on('request',r=>{if(['xhr','fetch'].includes(r.resourceType())) businessRequests++});
            await p.goto('http://127.0.0.1:3000/admin/dev',{waitUntil:'networkidle'});
            assert(await p.locator('[data-page-uid="admin:DEV-01"]').count()===1,'page uid');
            assert(await p.locator('[data-route-status="RESOLVED_USER_APPROVED_ADMIN_ROUTE"]').count()===1,'route status');
            assert(await p.locator('[aria-current="page"]').getAttribute('data-nav-id')==='ADMIN-NAV-03','admin active nav');
            assert(await p.locator('.global-sidebar [data-nav-id]').count()===9,'admin nav 9');
            assert(await p.locator('a[href="/admin/dev"][data-nav-id="ADMIN-NAV-03"]').count()===1,'dev route');
            const stageIds=await p.locator('[data-section-id="DEV-01-SEC-02"] [data-control-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-control-id')));
            assert(stageIds.length===5,'stage nav count '+stageIds.length);
            const stageSelectors=['DEV-01-BTN-STAGE-1','DEV-01-BTN-STAGE-2','DEV-01-BTN-STAGE-3','DEV-01-BTN-STAGE-4','DEV-01-BTN-STAGE-5'];
            const stageSection=['DEV-01-SEC-03','DEV-01-SEC-04','DEV-01-SEC-05','DEV-01-SEC-06','DEV-01-SEC-07'];
            const screenshots=[];
            const seenControls=new Set();
            for(let i=0;i<5;i++){
              if(i>0)await p.locator(`[data-control-id="${stageSelectors[i]}"]`).click();
              assert(await p.locator(`[data-section-id="${stageSection[i]}"]`).count()===1,'active stage '+stageSection[i]);
              for(const id of await p.locator('[data-control-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-control-id'))))seenControls.add(id);
              const f=`vis12-1440-stage-${i+1}.png`; await p.screenshot({path:f,fullPage:false}); screenshots.push(f);
            }
            for(const id of ['DEV-01-BTN-DISCOVERY-PAUSE','DEV-01-BTN-DISCOVERY-RESUME','DEV-01-BTN-DISCOVERY-STOP','DEV-01-BTN-MERGE-PREVIEW','DEV-01-BTN-MERGE','DEV-01-BTN-CANDIDATE-DECIDE','DEV-01-BTN-CR-CREATE','DEV-01-BTN-CAMPAIGN-APPROVE','DEV-01-BTN-EMAIL-DISPATCH','DEV-01-BTN-KILL-SWITCH'])assert(!seenControls.has(id),'conditional control unexpectedly visible '+id);
            await p.locator('[data-control-id="DEV-01-BTN-STAGE-3"]').click();
            assert(await p.getByText(/不提供 Send|no Send action/i).count()>=1,'message no-send boundary');
            const enabledEffectful=await p.locator('button[data-control-id]:not([data-control-id^="DEV-01-BTN-STAGE-"]):not([disabled])').count();
            assert(enabledEffectful===0,'enabled business controls '+enabledEffectful);
            const g=await p.evaluate(()=>{const w=document.querySelector('.workspace-slot');const c=document.querySelector('[data-section-id="DEV-01-SEC-01"]');const s=document.querySelector('[data-section-id="DEV-01-SEC-02"]');return {x:Math.round(w.getBoundingClientRect().x),client:w.clientWidth,scroll:w.scrollWidth,contextHeight:Math.round(c.getBoundingClientRect().height),stageHeight:Math.round(s.getBoundingClientRect().height),page:document.querySelector('[data-page-uid]').scrollWidth};});
            assert(g.x===78,'workspace x '+JSON.stringify(g)); assert(g.contextHeight===56,'context '+JSON.stringify(g)); assert(g.stageHeight===52,'stage '+JSON.stringify(g)); assert(g.client===g.scroll,'1440 unexpected overflow '+JSON.stringify(g));
            await p.locator('.global-sidebar').hover(); await p.waitForTimeout(220);
            const ex=await p.evaluate(()=>({x:Math.round(document.querySelector('.workspace-slot').getBoundingClientRect().x),side:Math.round(document.querySelector('.global-sidebar').getBoundingClientRect().width)}));
            assert(ex.x===78 && ex.side===221,'sidebar overlay '+JSON.stringify(ex)); await p.screenshot({path:'vis12-1440-expanded.png'}); screenshots.push('vis12-1440-expanded.png');
            const p1600=await b.newPage({viewport:{width:1600,height:900}}); await p1600.goto('http://127.0.0.1:3000/admin/dev',{waitUntil:'networkidle'}); const g16=await p1600.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}}); assert(g16.client===g16.scroll,'1600 overflow '+JSON.stringify(g16)); await p1600.screenshot({path:'vis12-1600.png'}); screenshots.push('vis12-1600.png');
            const p1200=await b.newPage({viewport:{width:1200,height:900}}); await p1200.goto('http://127.0.0.1:3000/admin/dev',{waitUntil:'networkidle'}); const g12=await p1200.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}}); assert(g12.scroll>=1280 && g12.page>=1280 && g12.scroll>g12.client,'1200 expected scroll '+JSON.stringify(g12)); await p1200.screenshot({path:'vis12-1200-minwidth.png'}); screenshots.push('vis12-1200-minwidth.png');
            const localeLabels=[];
            for(const locale of ['zh-CN','en','zh-TW']){
              const lang=p.locator('button[aria-label="Language"],button[aria-label="語言"],button[aria-label="语言"]').first(); await lang.click(); const opt=p.locator('[role="option"]').filter({hasText:locale}); assert(await opt.count()>=1,'locale option '+locale); await opt.first().click(); localeLabels.push(await p.locator('h1').first().innerText());
            }
            assert(localeLabels[0].includes('企业') && /Enterprise Automation/i.test(localeLabels[1]) && localeLabels[2].includes('企業'),'locale '+JSON.stringify(localeLabels));
            assert(businessRequests===0,'business xhr/fetch '+businessRequests);
            fs.mkdirSync('docs/construction/evidence/VIS-12',{recursive:true});
            fs.writeFileSync('docs/construction/evidence/VIS-12/vis12-validation.json',JSON.stringify({route:'/admin/dev',pageUid:'admin:DEV-01',authoritySections:9,authorityComponents:15,authorityControls:22,adminL1:9,activeNav:'ADMIN-NAV-03',workspace1440:g,sidebarExpanded:ex,viewport1600:g16,viewport1200:g12,localeSequence:['zh-TW','zh-CN','en','zh-TW'],localeLabels,businessRequests,enabledEffectfulBusinessControls:enabledEffectful,noMessageSend:true,noFakeBusinessData:true},null,2));
            for(const f of screenshots)fs.renameSync(f,'docs/construction/evidence/VIS-12/'+f);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node vis12-check.cjs
      - name: Commit evidence and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/evidence/VIS-12
          git commit -m "test(vis12): add DEV-01 validation evidence"
          git rm .github/workflows/vis12-dev-validation.yml
          git commit -m "chore(vis12): remove DEV validation workflow"
          git push origin HEAD:acpos-vis12-staging
