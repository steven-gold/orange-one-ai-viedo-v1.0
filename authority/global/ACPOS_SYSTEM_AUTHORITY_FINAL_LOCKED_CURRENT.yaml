core_identity:
  definition_zh: ACPOS 是 ORANGE ONE 全站中央大腦。所有 Current Page 都是 ACPOS 的生產、操作、觀測、資訊或治理介面；ACPOS 統一理解全站受治理狀態、Exact Version、Context、Memory、Decision、Handoff、AI
    Capability、Provider Execution、Experience 與 Audit，並在保留各 Domain Owner 的前提下協調跨頁流程與持續進化。
  not_a_page: true
  external_ai_role: CAPABILITY_PROVIDER_ONLY
  acpos_retains:
  - whole-site system understanding
  - context selection
  - conversation continuity
  - memory
  - decision governance
  - version and lineage
  - cross-domain orchestration
  - AI capability routing governance
  - experience and evolution
  - permission policy audit coordination
  domain_ownership: Each Current Page/Domain retains business ownership. ACPOS links and coordinates; it does not duplicate domain systems.
