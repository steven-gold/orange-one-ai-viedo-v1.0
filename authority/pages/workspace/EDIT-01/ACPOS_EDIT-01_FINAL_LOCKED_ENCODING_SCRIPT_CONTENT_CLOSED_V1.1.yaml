  - track_type_uid: EDIT-01-TRACK-OVERLAY
    display_name: OVERLAY
    allowed_content: 圖像/疊加視訊
    fixed_capabilities: Visibility=editor view only / Lock=edit protection / Clip Edit
  - track_type_uid: EDIT-01-TRACK-VOICE
    display_name: VOICE
    allowed_content: 配音 Take
    fixed_capabilities: Mute=Working Draft audio state / Solo=preview only / Lock=edit protection / Waveform / Volume / Fade
  - track_type_uid: EDIT-01-TRACK-MUSIC
    display_name: MUSIC
    allowed_content: 配樂
