    text: 28. Function Admission / Auto-completion Boundary
  - index: 134
    style: Normal
    text: 本文件可以定義跨頁智能基礎 contract，但不得以「系統完整性」為理由替 Domain Page 自動補不存在的 Business Function。任何未在 Current Authority 出現、但設計認為可能需要的新行為，必須先走 Function Admission，而不是直接寫成既有功能。
