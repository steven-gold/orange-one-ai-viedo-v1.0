name: CORE01 public preview final verify once
on:
  push:
    paths:
      - '.github/workflows/core01-public-preview-final-verify-once.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm exact public HTML is available
        run: |
          HOME_URL='https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/a265264b7738be1778e6b94c4e1819dae3ef83e9/preview/index.html'
          CORE_URL='https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/a265264b7738be1778e6b94c4e1819dae3ef83e9/preview/core.html'
          test "$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$HOME_URL")" = "200"
          test "$(curl -L -sS -o /tmp/core.html -w '%{http_code}' "$CORE_URL")" = "200"
          grep -q 'data-page-uid="workspace:WB-01"' /tmp/home.html
          grep -q 'data-page-uid="CORE-01"' /tmp/core.html
      - name: Chromium verify exact rawcdn commit
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cat > public-final-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const sha='a265264b7738be1778e6b94c4e1819dae3ef83e9';
            const base=`https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/${sha}/preview/`;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[];
            const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText}`));

            await page.goto(base+'index.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('[data-page-uid="workspace:WB-01"]',{timeout:30000});
            await page.waitForLoadState('networkidle',{timeout:30000}).catch(()=>{});
            const sections=await page.locator('[data-section-id^="SEC-WORKSPACE-WB-01-"]').count();
            const buttons=page.locator('[data-control-id^="CTRL-WORKSPACE-WB-01-"]');
            const count=await buttons.count();
            if(sections!==14||count!==14) throw new Error(`homepage mismatch sections=${sections} controls=${count}`);
            for(let i=0;i<count;i++){
              await buttons.nth(i).click();
              const drawer=page.locator('[data-component-uid="WB-01-CMP-DRAWER-PROJECTION"]');
              await drawer.waitFor({state:'visible',timeout:10000});
              const state=await drawer.getAttribute('data-state');
              if(!['LOADING','ERROR','READ_ONLY'].includes(state)) throw new Error(`drawer state ${state}`);
              if(await page.locator('#acpos-preview-drawer').count()) throw new Error('forbidden preview drawer');
              await page.keyboard.press('Escape');
              await drawer.waitFor({state:'detached'});
            }
            if(await page.locator('a[data-nav-id="NAV-02"]').getAttribute('href')!=='core.html') throw new Error('NAV-02 is not core.html');
            if(pageErrors.length||failed.length) throw new Error(`homepage browser errors page=${JSON.stringify(pageErrors)} failed=${JSON.stringify(failed)}`);

            await page.goto(base+'core.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('[data-page-uid="CORE-01"]',{timeout:30000});
            await page.waitForLoadState('networkidle',{timeout:30000}).catch(()=>{});
            for(const id of ['CORE-01-CTL-PROJECT','CORE-01-CTL-TOPIC','CORE-01-LST-WORK-ITEMS','CORE-01-LST-THREADS']){
              const options=await page.locator(`[data-control-id="${id}"] option`).count();
              if(options!==1) throw new Error(`CORE invented options ${id}=${options}`);
            }
            const posts=[];
            page.on('request',r=>{if(r.method()==='POST') posts.push(r.url())});
            await page.locator('[data-control-id="CORE-01-BTN-PROJECT-VALIDATE"]').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('REQUIRED_PROJECT_VERSION_REF_MISSING'),null,{timeout:10000});
            if(posts.length) throw new Error('CORE emitted POST without exact ref '+posts.join(','));
            if(await page.locator('#acpos-preview-drawer').count()) throw new Error('CORE preview contamination');
            if(pageErrors.length||failed.length) throw new Error(`browser errors page=${JSON.stringify(pageErrors)} failed=${JSON.stringify(failed)}`);
            console.log('PUBLIC_STATIC_HYDRATION_PASS sections=14 controls=14 drawer=14/14');
            console.log('PUBLIC_CORE01_FAIL_CLOSED_PASS posts=0');
            console.log('PUBLIC_PAGE_ERRORS []');
            console.log('PUBLIC_FAILED_REQUESTS []');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node public-final-check.cjs
      - name: Self clean
        if: always()
        run: |
          rm -f .github/workflows/core01-public-preview-final-verify-once.yml public-final-check.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/core01-public-preview-final-verify-once.yml
          git commit -m 'chore(core01): remove final public preview verifier'
          git push origin HEAD:new
