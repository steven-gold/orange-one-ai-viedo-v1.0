name: Product Stage03 Validation
# revalidates Stage-03 after the v2.2.25 semantic remediation materialization
# exact-head-rerun: 2026-09-25T11:03+08:00-v225-matrix-final
# independent-rerun-marker: 2026-09-25-v225-dynamic-current-state-v2
# revalidates Stage-03 current-head closure after stage03 materialize (run 36227587296)
on:
  push:
    branches: [0921acpos]
    paths:
      - 'STAGE_EXECUTION/STAGE-03/**'
      - '.github/workflows/product-stage03-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-stage03:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wu:
        - WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-001
        - WU-STAGE03-WB01-DASHBOARD-001
    steps:
    - uses: actions/checkout@v4
      with: {ref: 0921acpos, fetch-depth: 0}
    - uses: actions/checkout@v4
      with:
        repository: steven-gold/orange-one-ai-viedo-v1.0
        ref: 93a595d034b06bcc28285f064f312587b63f4f9a
        path: _governance_authority
        fetch-depth: 1
    - run: |
        rm -rf governance .github/governance-source
        cp -R _governance_authority/governance ./governance
        mkdir -p .github
        cp -R _governance_authority/.github/governance-source .github/governance-source
        python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
    - name: Validate admission
      env:
        ACPOS_PRODUCT_ROOT: ${{ github.workspace }}
        ACPOS_ACTIVE_WORK_UNIT: STAGE_EXECUTION/STAGE-03/${{ matrix.wu }}/WORK_UNIT.yaml
        ACPOS_CURRENT_SCOPE: STAGE_EXECUTION/STAGE-03/${{ matrix.wu }}/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml
      run: python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-03
    - name: Validate Stage03 materialization
      env:
        WU: ${{ matrix.wu }}
      run: |
        python - <<'PY'
        import os,yaml
        from pathlib import Path
        b=Path('STAGE_EXECUTION/STAGE-03')/os.environ['WU']
        def y(n):
          p=b/n
          if not p.is_file(): raise SystemExit('BLOCK:MISSING:'+n)
          return yaml.safe_load(p.read_text()) or {}
        outputs=['VISUAL_DESIGN_SPEC_PACKAGE.yaml','VISUAL_GEOMETRY_CONTRACT.yaml','VISUAL_PREVIEW_EVIDENCE.yaml','VISUAL_CHANGESET.yaml','VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml','FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT.yaml','VISUAL_REFERENCE_ANNOTATION.yaml','VISUAL_INHERITANCE_MATRIX.yaml','VISUAL_SCENARIO_EVIDENCE_SET.yaml']
        for n in outputs:y(n)
        g=y('VISUAL_GEOMETRY_CONTRACT.yaml')
        if not g.get('visual_anchors') or int(g.get('visual_anchor_count') or 0)<=0: raise SystemExit('BLOCK:VISUAL_ANCHORS_EMPTY')
        s=y('VISUAL_SCENARIO_EVIDENCE_SET.yaml')
        if int(s.get('required_scenario_count') or -1)!=int(s.get('materialized_scenario_count') or -2): raise SystemExit('BLOCK:SCENARIO_DENOMINATOR_DRIFT')
        for x in s.get('scenarios') or []:
          if not (b/x['evidence_ref']).is_file(): raise SystemExit('BLOCK:SCENARIO_PHYSICAL_EVIDENCE_MISSING:'+x['evidence_ref'])
        t=y('VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml')
        if t.get('functional_topology_redefined') is not False: raise SystemExit('BLOCK:FUNCTIONAL_TOPOLOGY_REDEFINED')
        p=y('VISUAL_PREVIEW_EVIDENCE.yaml')
        if p.get('structural_only') is not False: raise SystemExit('BLOCK:STRUCTURAL_ONLY_PREVIEW')
        vra=y('VISUAL_REFERENCE_ANNOTATION.yaml')
        annotations=vra.get('annotations') or []
        scenarios=s.get('scenarios') or []
        if len(annotations)!=len(scenarios):
          raise SystemExit(f'BLOCK:VRA_SCENARIO_DENOMINATOR_DRIFT:{len(annotations)}!={len(scenarios)}')
        scenario_ids={x.get('scenario_uid') for x in scenarios}
        if {x.get('scenario_uid') for x in annotations}!=scenario_ids:
          raise SystemExit('BLOCK:VRA_SCENARIO_IDENTITY_DRIFT')
        vra_required=('visual_uid','page_or_scope_uid','scenario_uid','state_uid','workbench_uid','journey_uid','parent_visual_uid','design_version','basic_design_change_set_uid','viewport','language','theme','applicable_business_entity_or_operation','visible_sections','conditional_sections','locked_regions','editable_regions','visual_anchor_uids','primary_controls_or_system_triggers','disabled_or_blocked_controls','current_next_action_or_gate','source_authority_refs','authority_classification','inherited_visual_authority_refs','verification_purpose','evidence_ref')
        for row in annotations:
          for k in vra_required:
            if k not in row or row.get(k) in (None,'',[]):
              raise SystemExit('BLOCK:VRA_REQUIRED_FIELD_MISSING:'+str(row.get('scenario_uid'))+':'+k)
          ep=b/str(row['evidence_ref'])
          if not ep.is_file(): raise SystemExit('BLOCK:VRA_EVIDENCE_MISSING:'+str(row['evidence_ref']))
        vim=y('VISUAL_INHERITANCE_MATRIX.yaml')
        vim_required=('source_authority_uid','source_authority_path','source_authority_version','source_authority_hash','inherited_rule_or_token','lock_override_status','allowed_page_local_variation','required_change_set_when_deviation')
        rows=vim.get('rows') or []
        if not rows: raise SystemExit('BLOCK:VIM_ROWS_EMPTY')
        for row in rows:
          for k in vim_required:
            if k not in row or row.get(k) in (None,'',[]):
              raise SystemExit('BLOCK:VIM_REQUIRED_FIELD_MISSING:'+str(row.get('visual_region'))+':'+k)
          ap=str(row['source_authority_path']).split('#',1)[0]
          pp=Path(ap)
          if not pp.is_absolute() and not pp.is_file():
            if not (Path.cwd()/ap).is_file():
              raise SystemExit('BLOCK:VIM_AUTHORITY_PATH_MISSING:'+ap)
        if int(vim.get('duplicate_visual_owner_count') or 0)!=0:
          raise SystemExit('BLOCK:VIM_DUPLICATE_VISUAL_OWNER')
        if int(vim.get('unresolved_visual_authority_count') or 0)!=0:
          raise SystemExit('BLOCK:VIM_UNRESOLVED_VISUAL_AUTHORITY')
        req_fields=g.get('typography_baseline_required_fields') or []
        expected_req={'target_uid','page_or_scope_uid','viewport_or_breakpoint_uid','language','theme','typography_authority_ref','font_family_token_or_value_ref','font_size_token_or_value_ref','font_weight_token_or_value_ref','line_height_token_or_value_ref','letter_spacing_token_or_value_ref','expected_font_family','expected_font_size_px','expected_font_weight','expected_line_height_px','expected_letter_spacing_px','expected_text_container_min_width_px','expected_text_container_max_width_px','wrap_rule','truncation_rule','expected_line_count_rule','allowed_tolerance'}
        if set(req_fields)!=expected_req:
          raise SystemExit('BLOCK:TYPOGRAPHY_REQUIRED_FIELD_SCHEMA_DRIFT')
        typo_rows=g.get('typography_baseline_rows') or []
        if int(g.get('typography_baseline_target_total') or -1)!=len(typo_rows):
          raise SystemExit('BLOCK:TYPOGRAPHY_TARGET_DENOMINATOR_DRIFT')
        seen=set()
        for row in typo_rows:
          uid=row.get('target_uid')
          if not uid or uid in seen: raise SystemExit('BLOCK:TYPOGRAPHY_TARGET_UID_DUPLICATE_OR_MISSING:'+str(uid))
          seen.add(uid)
          for k in expected_req:
            if k not in row or row.get(k) in (None,'',[]):
              raise SystemExit('BLOCK:TYPOGRAPHY_REQUIRED_FIELD_MISSING:'+str(uid)+':'+k)
          tol=row.get('allowed_tolerance')
          if not isinstance(tol,dict) or tol.get('semantic_overflow_or_clipping')!=0:
            raise SystemExit('BLOCK:TYPOGRAPHY_TOLERANCE_INVALID:'+str(uid))
        vdsp=y('VISUAL_DESIGN_SPEC_PACKAGE.yaml')
        for k in ('visual_inheritance_matrix_ref','visual_reference_annotation_ref','visual_scenario_evidence_set_ref','visual_geometry_contract_ref','visual_change_set_ref','typography_authority_ref','transitive_binding_status'):
          if vdsp.get(k) in (None,''):
            raise SystemExit('BLOCK:VDSP_TRANSITIVE_BINDING_MISSING:'+k)
        for k in ('visual_inheritance_matrix_ref','visual_reference_annotation_ref','visual_scenario_evidence_set_ref','visual_geometry_contract_ref','visual_change_set_ref'):
          if not Path(str(vdsp[k])).is_file():
            raise SystemExit('BLOCK:VDSP_TRANSITIVE_REF_MISSING:'+str(vdsp[k]))
        r=y('EVIDENCE/VISUAL_REVIEW_EVIDENCE.yaml')
        decision=r.get('decision')
        if decision=='PENDING_HUMAN_REVIEW':
          if r.get('visual_approved') is not False or int(r.get('stage_exit_credit') or 0)!=0:
            raise SystemExit('BLOCK:PENDING_REVIEW_STATE_INVALID')
          review_state='PENDING_HUMAN_REVIEW'
        elif decision=='VISUAL_APPROVED':
          if r.get('visual_approved') is not True:
            raise SystemExit('BLOCK:APPROVED_REVIEW_WITHOUT_VISUAL_APPROVAL')
          if not r.get('reviewer') or not r.get('reviewed_at'):
            raise SystemExit('BLOCK:APPROVED_REVIEW_IDENTITY_OR_TIME_MISSING')
          if int(r.get('stage_exit_credit') or 0)!=0:
            raise SystemExit('BLOCK:HUMAN_REVIEW_MUST_NOT_GRANT_STAGE_EXIT_CREDIT')
          if r.get('status')!='REVIEW_COMPLETE_PENDING_STAGE03_CLOSURE':
            raise SystemExit('BLOCK:APPROVED_REVIEW_STATUS_INVALID')
          review_state='VISUAL_APPROVED_PENDING_STAGE03_CLOSURE'
        else:
          raise SystemExit('BLOCK:UNEXPECTED_REVIEW_STATE:'+str(decision))
        print('PASS: 9/9 Stage03 outputs physical')
        print('PASS: non-empty visual anchors')
        print('PASS: required visual scenarios independently materialized')
        print('PASS: functional topology preserved')
        print('PASS: preview is non-structural-only')
        print('PASS: visual review checkpoint='+review_state)
        PY

    - name: Validate Stage03 canonical preflight and Stage04 handoff
      env:
        WU: ${{ matrix.wu }}
      run: |
        python - <<'PY'
        import os,yaml
        from pathlib import Path
        b=Path('STAGE_EXECUTION/STAGE-03')/os.environ['WU']
        def y(n):
          p=b/n
          if not p.is_file(): raise SystemExit('BLOCK:MISSING:'+n)
          obj=yaml.safe_load(p.read_text()) or {}
          if not isinstance(obj,dict): raise SystemExit('BLOCK:INVALID_MAPPING:'+n)
          return obj
        manifest_set=['REQUIRED_FIELD_MANIFEST.yaml','FUNCTIONAL_CHAIN_MANIFEST.yaml','EFFECTIVE_CONTRACT_OVERLAY.yaml','DEPENDENCY_TOPOLOGY.yaml','DENOMINATOR_SNAPSHOT.yaml','CLASSIFICATION_RULESET.yaml','CHANGE_IMPACT_MAP.yaml','STAGE_EXECUTION_PREFLIGHT_RECEIPT.yaml']
        for n in manifest_set: y(n)
        pf=y('STAGE_EXECUTION_PREFLIGHT_RECEIPT.yaml')
        if set(pf.get('required_manifest_set') or [])!=set(manifest_set):
          raise SystemExit('BLOCK:PREFLIGHT_MANIFEST_SET_DRIFT')
        if pf.get('shared_manifest_set_complete') is not True or pf.get('result')!='PASS':
          raise SystemExit('BLOCK:PREFLIGHT_RECEIPT_NOT_PASS')
        if pf.get('historical_product_values_used') is not False:
          raise SystemExit('BLOCK:HISTORICAL_PRODUCT_VALUE_FALLBACK')
        pr=y('CURRENT_PROBLEM_REGISTER.yaml')
        problems=[x for x in (pr.get('problems') or []) if isinstance(x,dict)]
        open_rows=[x for x in problems if str(x.get('status') or '').startswith('OPEN')]
        open_total=int(pr.get('open_problem_total') or 0)
        blocker_total=int(pr.get('closure_blocker_total') or 0)
        if open_total!=len(open_rows):
          raise SystemExit(f'BLOCK:PROBLEM_OPEN_DENOMINATOR_DRIFT:declared={open_total}:actual={len(open_rows)}')
        if open_total!=0:
          raise SystemExit('BLOCK:CURRENT_PROBLEM_REGISTER_HAS_OPEN_TECHNICAL_PROBLEMS:'+str(open_total))
        review_gates=[x for x in (pr.get('non_problem_closure_gates') or []) if isinstance(x,dict)]
        pending_non_problem=0
        for gate in review_gates:
          if gate.get('gate_uid')!='HUMAN_VISUAL_REVIEW':
            raise SystemExit('BLOCK:UNREGISTERED_NON_PROBLEM_CLOSURE_GATE:'+str(gate.get('gate_uid')))
          status=str(gate.get('status') or '')
          credit=int(gate.get('stage_exit_credit') or 0)
          if status=='PENDING_HUMAN_REVIEW':
            if credit!=0: raise SystemExit('BLOCK:PENDING_HUMAN_REVIEW_WITH_STAGE_EXIT_CREDIT')
            pending_non_problem+=1
          elif status in ('VISUAL_APPROVED','REVIEW_COMPLETE_PENDING_STAGE03_CLOSURE'):
            if credit!=0: raise SystemExit('BLOCK:HUMAN_REVIEW_MUST_NOT_GRANT_STAGE_EXIT_CREDIT')
          else:
            raise SystemExit('BLOCK:HUMAN_VISUAL_REVIEW_GATE_STATE_INVALID:'+status)
        expected_blockers=open_total+pending_non_problem
        if blocker_total!=expected_blockers:
          raise SystemExit(f'BLOCK:CLOSURE_BLOCKER_DENOMINATOR_DRIFT:declared={blocker_total}:expected={expected_blockers}')
        scope=y('CURRENT_EXECUTION_SCOPE_MANIFEST.yaml')
        state=y('EXECUTION_STATE.yaml')
        resume=y('RESUME_POINT.yaml')
        reverify=('REVERIFY_REQUIRED' in str(state.get('status') or '')
                  or state.get('stage3_guard_result')=='REVERIFY_REQUIRED'
                  or 'REVERIFY_REQUIRED' in str(resume.get('status') or ''))
        if reverify:
          if scope.get('stage_exit_credit_allowed') is not False:
            raise SystemExit('BLOCK:REVERIFY_SCOPE_STILL_ALLOWS_STAGE_EXIT_CREDIT')
          current_closure=scope.get('current_closure_validation') or {}
          if current_closure.get('result')!='REVERIFY_REQUIRED' or int(current_closure.get('stage_exit_credit') or 0)!=0:
            raise SystemExit('BLOCK:REVERIFY_SCOPE_CURRENT_CLOSURE_STATE_DRIFT')
          if scope.get('terminal_receipt_ref') not in (None,''):
            raise SystemExit('BLOCK:REVERIFY_SCOPE_CURRENT_TERMINAL_RECEIPT_MUST_BE_EMPTY')
          if resume.get('stage_exit_authorized') is not False:
            raise SystemExit('BLOCK:REVERIFY_RESUME_STILL_AUTHORIZES_STAGE_EXIT')
        rl=y('RESOLUTION_LEDGER.yaml')
        if rl.get('append_only') is not True:
          raise SystemExit('BLOCK:RESOLUTION_LEDGER_NOT_APPEND_ONLY')
        d=y('DENOMINATOR_SNAPSHOT.yaml')
        t=y('VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml')
        g=y('VISUAL_GEOMETRY_CONTRACT.yaml')
        bindings=t.get('bindings') or []
        actual_binding_ids=[]
        for row in bindings:
          uid=row.get('control_uid') or row.get('operation')
          if not uid: raise SystemExit('BLOCK:VISUAL_BINDING_ID_MISSING')
          actual_binding_ids.append(uid)
        actual_anchor_ids=[x.get('anchor_uid') for x in (g.get('visual_anchors') or [])]
        if any(not x for x in actual_anchor_ids): raise SystemExit('BLOCK:VISUAL_ANCHOR_ID_MISSING')
        if set(d.get('required_visual_bindings') or [])!=set(actual_binding_ids):
          raise SystemExit('BLOCK:VISUAL_BINDING_DENOMINATOR_DRIFT')
        if set(d.get('geometry_units') or [])!=set(actual_anchor_ids):
          raise SystemExit('BLOCK:GEOMETRY_DENOMINATOR_DRIFT')
        if int(d.get('required_visual_binding_total') or -1)!=len(actual_binding_ids):
          raise SystemExit('BLOCK:VISUAL_BINDING_TOTAL_DRIFT')
        if int(d.get('geometry_unit_total') or -1)!=len(actual_anchor_ids):
          raise SystemExit('BLOCK:GEOMETRY_TOTAL_DRIFT')
        if int(d.get('required_total') or -1)!=(len(actual_binding_ids)+len(actual_anchor_ids)):
          raise SystemExit('BLOCK:STAGE03_REQUIRED_TOTAL_DRIFT')
        h=y('EVIDENCE/CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml')
        if h.get('consumer_stage_uid')!='STAGE-04':
          raise SystemExit('BLOCK:HANDOFF_SUCCESSOR_DRIFT')
        required={'PAGE_CONSTRUCTION_SPEC_PACKAGE','VISUAL_DESIGN_SPEC_PACKAGE','DEPENDENCY_MAP'}
        rows=h.get('required_inputs') or []
        if {x.get('input_uid') for x in rows}!=required:
          raise SystemExit('BLOCK:STAGE04_HANDOFF_DENOMINATOR_DRIFT')
        for row in rows:
          for k in ('reference_resolution_status','physical_materialization_status','required_field_completeness','consumer_readiness_status'):
            if row.get(k)!='PASS': raise SystemExit('BLOCK:STAGE04_HANDOFF_NOT_READY:'+str(row.get('input_uid'))+':'+k)
          ref=str(row.get('ref') or '')
          if not ref or not Path(ref).is_file():
            raise SystemExit('BLOCK:STAGE04_HANDOFF_PHYSICAL_REF_MISSING:'+ref)
        for k in ('reference_resolution_complete','physical_materialization_complete','required_field_completeness_complete','denominator_reconciled','consumer_readiness_complete'):
          if h.get(k) is not True: raise SystemExit('BLOCK:STAGE04_HANDOFF_SUMMARY_NOT_READY:'+k)
        handoff_status=h.get('status')
        if int(h.get('unresolved_required_dependency_total') or 0)!=0 or handoff_status not in ('PASS','PASS_CURRENT_REVERIFY'):
          raise SystemExit('BLOCK:STAGE04_HANDOFF_UNRESOLVED_OR_STATUS_DRIFT:'+str(handoff_status))
        if os.environ['WU']=='WU-STAGE03-WB01-DASHBOARD-001':
          topo=y('DEPENDENCY_TOPOLOGY.yaml')
          deps=topo.get('cross_unit_required_dependencies') or []
          if len(deps)!=1 or deps[0].get('governed_unit_uid')!='GLOBAL-HOME-SHELL-NAVIGATION':
            raise SystemExit('BLOCK:WB01_SHARED_SHELL_DEPENDENCY_MISSING')
          ref=str(deps[0].get('ref') or '')
          if not ref or not Path(ref).is_file():
            raise SystemExit('BLOCK:WB01_SHARED_SHELL_DEPENDENCY_REF_MISSING')
        print(f'PASS: canonical Stage03 preflight manifest set={len(manifest_set)}/8')
        print(f'PASS: physical Stage03 denominator bindings={len(actual_binding_ids)} geometry={len(actual_anchor_ids)} total={len(actual_binding_ids)+len(actual_anchor_ids)}')
        print('PASS: Stage04 handoff required inputs=3/3 ready')
        print(f'PASS: current problem register open={open_total} (preflight replay reconciliation boundary)')
        PY
    - name: Validate normalized Stage03 evidence when materialized
      env:
        ACPOS_PRODUCT_ROOT: ${{ github.workspace }}
        ACPOS_ACTIVE_WORK_UNIT: STAGE_EXECUTION/STAGE-03/${{ matrix.wu }}/WORK_UNIT.yaml
        ACPOS_CURRENT_SCOPE: STAGE_EXECUTION/STAGE-03/${{ matrix.wu }}/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml
        WU: ${{ matrix.wu }}
      run: |
        EVIDENCE_PATH="STAGE_EXECUTION/STAGE-03/$WU/EVIDENCE/STAGE03_NORMALIZED_EVIDENCE.json"
        if [ -f "$EVIDENCE_PATH" ]; then
          python governance/ci/stage_execution_engine.py --validate-evidence --stage STAGE-03 --evidence "$EVIDENCE_PATH"
        else
          echo "STAGE03_NORMALIZED_EVIDENCE_NOT_YET_MATERIALIZED"
        fi
