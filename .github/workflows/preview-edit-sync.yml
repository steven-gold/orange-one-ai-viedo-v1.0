name: Sync EDIT Preview Link
on:
  push:
    branches: [acpos-live-preview]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only EDIT nav item
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('preview/index.html')
          s=p.read_text()
          old='<button disabled><span class="ico">≋</span><span class="nav-label" data-i="edit">剪輯配音</span></button>'
          new='<a href="edit.html" data-route="/edit"><span class="ico">≋</span><span class="nav-label" data-i="edit">剪輯配音</span></a>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one EDIT disabled nav item, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/preview-edit-sync.yml').unlink()
          PY
      - name: Commit synchronized preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview(vis05): connect EDIT to shared preview shell [skip ci]"
          git push origin HEAD:acpos-live-preview
