    surface: CORE_AI
    modes:
    - SINGLE_AI
    - MULTI_AI
    capabilities:
    - TEXT_CHAT
    provider_picker: FORBIDDEN
    formalization: AI result -> evaluation/assistant structure -> human governed decision -> candidate/version
  handoff_in:
  - Governed Project/Strategy/Information context
  handoff_out:
  - CORE -> ASSET Production Package
  experience_signals:
  - candidate accepted/rejected
  - revision count
  - human decision
  - downstream QA outcome linked back to source Blueprint/Script
