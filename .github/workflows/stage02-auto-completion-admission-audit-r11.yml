name: Stage-02 Auto-Completion Admission Audit R11

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_auto_completion_admission_audit_r11.py'
      - 'governance/ci/validate_stage02_auto_completion_admission_audit_r11.py'
      - '.github/workflows/stage02-auto-completion-admission-audit-r11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-auto-completion-admission-audit-r11
  cancel-in-progress: false

jobs:
  auto-completion-admission-audit-r11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R11 admission machinery
        run: |
          python -m py_compile governance/ci/build_stage02_auto_completion_admission_audit_r11.py
          python -m py_compile governance/ci/validate_stage02_auto_completion_admission_audit_r11.py

      - name: Re-prove exact governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_validation_remediation_closure_protocol.py

      - name: Revalidate current Stage-02 truth and R10 approval docket
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
          python governance/ci/validate_current_stage2_materialized_closure_external_aware_r3.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_external_aware_r3.py
          python governance/ci/validate_stage02_product_design_authority_intake_r6.py
          python governance/ci/validate_stage02_core01_product_authority_review_r8.py
          python governance/ci/validate_stage02_asset01_product_authority_review_r9.py
          python governance/ci/validate_stage02_product_authority_approval_docket_r10.py

      - name: Build exact 150-record auto-completion admission audit
        run: python governance/ci/build_stage02_auto_completion_admission_audit_r11.py

      - name: Validate R11 zero-authority-gap admission boundary
        run: python governance/ci/validate_stage02_auto_completion_admission_audit_r11.py

      - name: Prove R11 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- .github/governance-source/active/source
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R11 is non-normative admission audit only; no Current governance or product owning layer mutation'

      - name: Verify all 150 are blocked from auto-completion and remain Product Authority pending
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_AUTO_COMPLETION_ADMISSION_AUDIT_R11.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          den=d['denominators']
          assert den['r10_product_authority_decisions'] == 150
          assert den['auto_completion_eligible'] == 0
          assert den['blocked_by_authority_gap'] == 150
          assert den['not_scored_due_authority_gap_precedence'] == 150
          assert den['r7_materializable'] == 0
          assert den['effective_stage02_blocker_reduction_claimed'] == 0
          assert all(r['auto_completion_decision']=='BLOCK_AUTO_COMPLETION_AUTHORITY_GAP' for r in d['records'])
          assert all(r['auto_completion_eligible'] is False for r in d['records'])
          assert all(r['necessity_score'] is None for r in d['records'])
          assert d['stage02_status'] == 'BLOCKED'
          print('PASS: 150/150 Product Authority gaps cannot be converted into bounded auto-completion work')
          PY

      - name: Commit R11 admission audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_AUTO_COMPLETION_ADMISSION_AUDIT_R11.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R11 generated no persistent admission audit' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist auto-completion admission audit R11'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R11 admission audit
        uses: actions/upload-artifact@v4
        with:
          name: stage02-auto-completion-admission-audit-r11
          path: governance/test/stage02/STAGE02_AUTO_COMPLETION_ADMISSION_AUDIT_R11.yaml
          if-no-files-found: error
