name: Promote Cross-Stage Materialization Governance

"on":
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/governance-maintenance/promote_cross_stage_materialization_governance.py
      - .github/workflows/promote-cross-stage-materialization-governance.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/acpos-v2216-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install governance dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock exact authorized predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260920-CROSS-STAGE-MATERIALIZATION-CONTINUITY-HARDENING-R1.yaml
      - name: Precheck complete v2.2.16 successor without persistence
        run: python .github/governance-maintenance/promote_cross_stage_materialization_governance.py --mode precheck
      - name: Restore exact predecessor after destructive precheck
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Promote v2.2.16 atomically
        run: python .github/governance-maintenance/promote_cross_stage_materialization_governance.py --mode promote
