    required_fields:
    - source_asset_version_ref
    - source_script_view_ref
    - source_script_hash
    - affected_asset_ref
    - affected_layer_ref_if_any
    - affected_region_if_any
    - finding_or_issue_ref
    - current_problem
    - requested_delta_zh_tw
    - expected_result
    - preserve_constraints
    - candidate_hash
    - approval_state
    translation_rule: After human approval, compile only the approved delta against the exact source ASSET instruction; unchanged fields are preserved from source.
  VIDEO:
    existing_object: CorrectionScriptCandidate
    required_fields:
    - source_video_version_ref
    - source_script_view_ref
    - source_script_hash
    - scene_id
    - shot_id
    - start_end_time_range
    - target_object_refs
    - target_layer_refs
    - finding_or_issue_ref
    - current_problem
    - requested_delta_zh_tw
    - expected_result
    - preserve_constraints
    - candidate_hash
    - approval_state
    translation_rule: After human approval, compile only the target Scene/Shot/time/object/layer delta; route as VIDEO_EDIT when source media is edited or TEXT_TO_VIDEO
      only when the existing governed execution path requires regeneration.
  EDIT_VOICE:
    existing_objects:
    - EDIT-01-OBJ-CORRECTION-CONTEXT
    - EDIT-01-OBJ-CORRECTION-SCRIPT
    - EDIT-01-OBJ-CORRECTION-TRANSLATION
    required_fields:
    - stage_uid
    - script_role_uid
    - source_script_section_ref
    - source_script_section_version
    - source_script_section_hash
    - target_scope
    - target_timeline_range_if_applicable
    - target_clip_or_cue_or_dialogue_refs_if_applicable
    - finding_or_issue_ref
    - current_problem
    - requested_delta_zh_tw
    - expected_result
    - preserve_constraints
    - candidate_hash
    - approval_state
