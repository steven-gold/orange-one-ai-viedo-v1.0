name: ACPOS Current Authority Residue Cleanup Once

on:
  push:
    branches: [new]
    paths:
      - .github/workflows/current-authority-residue-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove mutable historical state from Current authority contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml';
          const sharedPath = 'authority/runtime/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml';
          const editVoicePath = 'authority/runtime/ACPOS_EDIT_VOICE_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml';
          const testPath = 'tests/release/authority.test.mjs';

          let manifest = fs.readFileSync(manifestPath, 'utf8');
          manifest = manifest.replace(/^  revision:.*$/m, '  revision: 2026-09-11-CURRENT-AUTHORITY-RUNTIME-CLEANUP');
          const runtimeAnchor = '  - authority/runtime/ACPOS_PRODUCTION_DEPLOYMENT_EXECUTION_POLICY_FINAL_LOCKED_V1.0.yaml\n';
          if (!manifest.includes(runtimeAnchor)) throw new Error('runtime anchor missing');
          if (!manifest.includes('authority/runtime/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml')) {
            manifest = manifest.replace(runtimeAnchor, runtimeAnchor + '  - authority/runtime/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml\n  - authority/runtime/ACPOS_EDIT_VOICE_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml\n');
          }
          const mutableBlock = /cross_authority_bindings:\n  database_migration_v1_0:[\s\S]*?\n  production_database_runtime_contract:/;
          if (!mutableBlock.test(manifest)) throw new Error('mutable migration evidence block missing');
          manifest = manifest.replace(mutableBlock, `cross_authority_bindings:\n  database_migration_v1_0:\n    authority_path: authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml\n    migration_root: database/migrations/\n    checksum_manifest: database/migrations/migration_checksum_manifest.yaml\n    historical_execution_evidence_owner: database/migrations/migration_checksum_manifest.yaml\n    mutable_production_state_embedded: false\n  production_database_runtime_contract:`);
          fs.writeFileSync(manifestPath, manifest);

          let shared = fs.readFileSync(sharedPath, 'utf8');
          shared = shared.replace('status: VALIDATED_PENDING_PRODUCTION_APPLY', 'status: CURRENT_CONTRACT');
          const sharedMutable = shared.indexOf('\nvalidation_evidence:');
          if (sharedMutable < 0) throw new Error('shared mutable evidence block missing');
          shared = shared.slice(0, sharedMutable) + `\ndeployment_state_policy:\n  mutable_environment_state_embedded: false\n  evidence_owner: docs/construction/evidence/\n  migration_history_owner: database/migrations/migration_checksum_manifest.yaml\n`;
          fs.writeFileSync(sharedPath, shared);

          let editVoice = fs.readFileSync(editVoicePath, 'utf8');
          editVoice = editVoice.replace('status: CURRENT_CANDIDATE_PENDING_VALIDATION', 'status: CURRENT_CONTRACT');
          const editMutable = editVoice.indexOf('\npermission_materialization:');
          if (editMutable < 0) throw new Error('edit/voice mutable materialization block missing');
          editVoice = editVoice.slice(0, editMutable) + `\ndeployment_state_policy:\n  mutable_environment_state_embedded: false\n  evidence_owner: docs/construction/evidence/\n  migration_history_owner: database/migrations/migration_checksum_manifest.yaml\n`;
          fs.writeFileSync(editVoicePath, editVoice);

          let test = fs.readFileSync(testPath, 'utf8');
          const oldIntegrity = /test\("Current production integrity reconciles the sealed catalog and post-0001 FK delta", \(\) => \{[\s\S]*?\n\}\);/;
          if (!oldIntegrity.test(test)) throw new Error('old Current manifest integrity test missing');
          test = test.replace(oldIntegrity, `test("Current-only manifest does not embed mutable historical migration execution state", () => {\n  assert.match(manifest, /version: V1\\.8/);\n  assert.match(manifest, /historical_execution_evidence_owner: database\\/migrations\\/migration_checksum_manifest\\.yaml/);\n  assert.match(manifest, /mutable_production_state_embedded: false/);\n  assert.doesNotMatch(manifest, /post_migration_validation:/);\n  assert.doesNotMatch(manifest, /production_integrity_checklist:/);\n  assert.doesNotMatch(manifest, /CR-R9-/);\n  assert.match(migrationAuthority, /current_production_reconciliation:/);\n  assert.match(migrationAuthority, /historical_evidence_immutable: true/);\n});`);
          const firstTestEnd = '  assert.match(manifest, /current_page_count:\\s*18/);\n});';
          if (!test.includes(firstTestEnd)) throw new Error('authority set test anchor missing');
          test = test.replace(firstTestEnd, firstTestEnd + `\n\ntest("Current Authority explicitly includes active Shared and EDIT+VOICE runtime contracts and excludes stale gap reports", () => {\n  assert.match(manifest, /authority\\/runtime\\/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1\\.0\\.yaml/);\n  assert.match(manifest, /authority\\/runtime\\/ACPOS_EDIT_VOICE_RUNTIME_OPERATION_AUTHORITY_V1\\.0\\.yaml/);\n  assert.doesNotMatch(manifest, /ACPOS_RUNTIME_BINDING_GAP_REPORT/);\n});`);
          fs.writeFileSync(testPath, test);
          NODE
      - name: Validate residue cleanup invariants
        run: |
          set -euo pipefail
          test ! -e authority/runtime/ACPOS_RUNTIME_BINDING_GAP_REPORT.md
          ! grep -R "CR-R9-" authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          ! grep -R "FORBIDDEN_UNTIL_FINAL_RELEASE_SEQUENCE\|VALIDATED_PENDING_PRODUCTION_APPLY\|CURRENT_CANDIDATE_PENDING_VALIDATION" authority/runtime/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml authority/runtime/ACPOS_EDIT_VOICE_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml
          grep -q "ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml" authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          grep -q "ACPOS_EDIT_VOICE_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml" authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
      - name: Install dependencies
        run: npm ci
      - name: Run authority and release tests
        run: npm test
      - name: Commit clean tree without one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/current-authority-residue-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml authority/runtime/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml authority/runtime/ACPOS_EDIT_VOICE_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml tests/release/authority.test.mjs
          git commit -m "chore: remove stale R9 deployment state from current authority"
          git push origin HEAD:new
