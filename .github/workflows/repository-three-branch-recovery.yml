name: Repository three-branch recovery

on:
  push:
    branches:
      - rebuild-v2.1.1

permissions:
  contents: write

jobs:
  recover:
    if: github.event.head_commit.message == 'repo(recovery): restore main/new pre-0912 and purge post-0912 temp branches'
    runs-on: ubuntu-latest
    steps:
      - name: Restore main/new and remove post-0912 temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_TARGET: 1e081935b96d5b539e29eb16a6b067c4489ef2dd
          NEW_TARGET: 165c6440cb53b1b45ec96905241fb4d56dc3b867
          CUTOFF: 2026-09-11T16:00:00Z
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          patch_ref() {
            local branch="$1" sha="$2"
            echo "Restoring ${branch} -> ${sha}"
            api -X PATCH \
              "https://api.github.com/repos/${REPO}/git/refs/heads/${branch}" \
              -d "{\"sha\":\"${sha}\",\"force\":true}" >/tmp/ref-${branch}.json
            test "$(jq -r '.object.sha' /tmp/ref-${branch}.json)" = "${sha}"
          }

          patch_ref main "${MAIN_TARGET}"
          patch_ref new "${NEW_TARGET}"

          # GitHub's branch API does not expose branch creation timestamps.
          # Therefore cleanup uses two conservative signals:
          # (1) branch head committer timestamp is on/after the 2026-09-12 Taipei cutoff; OR
          # (2) branch is one of the known GPT temporary/rebuild-helper refs created during the bad run.
          known_bad='^(tmp-|rebuild-v2\.1\.1-(cleanup-safety|foundation-safety|sourcefacts-staging|v215-pre-v216-sync-safety)$|governance-pilot/)'

          api "https://api.github.com/repos/${REPO}/branches?per_page=100" >/tmp/branches.json
          jq -r '.[].name' /tmp/branches.json >/tmp/branch-names.txt

          : >/tmp/deleted.txt
          : >/tmp/preserved.txt
          while IFS= read -r branch; do
            case "${branch}" in
              main|new|rebuild-v2.1.1)
                echo "${branch} [PRIMARY_KEEP]" >>/tmp/preserved.txt
                continue
                ;;
            esac

            sha="$(jq -r --arg b "${branch}" '.[] | select(.name==$b) | .commit.sha' /tmp/branches.json)"
            commit_json="$(api "https://api.github.com/repos/${REPO}/commits/${sha}")"
            commit_date="$(jq -r '.commit.committer.date // .commit.author.date' <<<"${commit_json}")"

            delete=false
            if [[ "${commit_date}" >="${CUTOFF}" ]]; then
              delete=true
            fi
            if [[ "${branch}" =~ ${known_bad} ]]; then
              delete=true
            fi

            if [[ "${delete}" == true ]]; then
              encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
              code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/git/refs/heads/${encoded}")"
              if [[ "${code}" != "204" ]]; then
                echo "Delete failed: ${branch} HTTP ${code}"
                cat /tmp/delete.json || true
                exit 1
              fi
              echo "${branch} ${sha} ${commit_date}" >>/tmp/deleted.txt
            else
              echo "${branch} ${sha} ${commit_date} [PRE_CUTOFF_KEEP]" >>/tmp/preserved.txt
            fi
          done </tmp/branch-names.txt

          echo '--- DELETED ---'
          cat /tmp/deleted.txt
          echo '--- PRESERVED ---'
          cat /tmp/preserved.txt

          # Final hard assertion for the two restored primary refs.
          test "$(api "https://api.github.com/repos/${REPO}/git/ref/heads/main" | jq -r '.object.sha')" = "${MAIN_TARGET}"
          test "$(api "https://api.github.com/repos/${REPO}/git/ref/heads/new" | jq -r '.object.sha')" = "${NEW_TARGET}"
