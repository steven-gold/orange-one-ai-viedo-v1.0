    text: 1. Page Identity / Route
  - index: 10
    style: Heading 1
    text: 2. Visual Architecture / 登入畫面
  - index: 12
    style: Normal
    text: 圖 1　登入頁採 Hero + Access 雙欄；窄螢幕只保留 Access，不建立另一套登入流程。
  - index: 14
    style: Heading 1
    text: 3. Component / Field Registry
  - index: 17
    style: Heading 1
    text: 4. Login Functional Chain
  - index: 18
    style: Normal
    text: 1.  使用者開啟 `/login`。
  - index: 19
    style: Normal
    text: 2.  Locale Provider 載入目前語言；登入頁不需要 Page Permission。
  - index: 20
    style: Normal
    text: 3.  使用者輸入 email + password，送出 `POST /identity/login`。
  - index: 21
    style: Normal
    text: 4.  Server 以 email 尋找 READY runtime account；密碼使用 scrypt 驗證。
  - index: 22
    style: Normal
    text: 5.  建立 32-byte random session token；資料庫只保存 SHA-256 token hash。
  - index: 23
    style: Normal
    text: 6.  以 session 對 runtime account → app_users 做 email join；app_users 必須 `disabled_at IS NULL`。
  - index: 24
    style: Normal
    text: 7.  成功：建立 `acpos_session` HttpOnly Cookie，303 Redirect `/`。
  - index: 25
    style: Normal
    text: 8.  失敗：回 `/login?error=<reason_code>`；頁面顯示實際錯誤狀態，不建立 Session。
  - index: 26
    style: Heading 1
    text: 5. Identity / Account Boundary
  - index: 29
    style: Heading 1
    text: 6. Security Contract
  - index: 30
    style: List Bullet
    text: Cookie 必須 HttpOnly；Production / HTTPS 時 Secure；SameSite=Lax。
  - index: 31
    style: List Bullet
    text: Database 永遠只保存 session token 的 SHA-256 hash，不保存 raw token。
  - index: 32
    style: List Bullet
    text: Password 使用 scrypt N=16384 / r=8 / p=1 / keylen=32；失敗路徑使用 dummy hash 降低帳號枚舉 timing 差異。
  - index: 33
    style: List Bullet
    text: 登入失敗不得回傳 password、password hash、session token、header plaintext 或 secret。
  - index: 34
    style: List Bullet
    text: 不得把 x-correlation-id、Authorization Bearer、第三方 IdP Header 猜成 Current Identity。
  - index: 35
    style: List Bullet
    text: Runtime account 必須 READY，且可映射至 non-disabled app_users；否則 fail-closed。
  - index: 36
    style: Heading 1
    text: 7. State / Error / Recovery
  - index: 39
    style: Heading 1
    text: 8. Accessibility / Localization
  - index: 40
    style: List Bullet
    text: Email / Password 使用正式 `<label>`；錯誤區 `role=alert`。
  - index: 41
    style: List Bullet
    text: Language Switch 使用 button + aria-pressed；目前語言可明確辨識。
  - index: 42
    style: List Bullet
    text: Focus Ring 必須可見，不能只依紫色差異；Tab order：語言 → email → password → login。
  - index: 43
    style: List Bullet
    text: Hero 為純裝飾時使用 aria-hidden，不影響 Screen Reader 登入主流程。
  - index: 44
    style: List Bullet
    text: 支援 zh-TW / zh-CN / en；品牌 ORANGE ONE / ACPOS 不翻譯。
  - index: 46
    style: Heading 1
    text: 9. Acceptance Matrix
  - index: 48
    style: Heading 1
    text: 10. Construction Mapping
  - index: 49
    style: Normal
    text: 1.  保留現有 split layout 與三語 selector；按本文件 Geometry 做視覺精修。
  - index: 50
    style: Normal
    text: 2.  維持 POST /identity/login → create session → Cookie → 303 / 的單一路徑。
  - index: 51
    style: Normal
    text: 3.  加入明確 submitting / error focus 管理，但不得改變 Identity Runtime contract。
  - index: 52
    style: Normal
    text: 4.  對 401 / 400 / 503 / app-user mapping failure 做 browser regression。
  - index: 53
    style: Normal
    text: 5.  檢查 Cookie flags、session expiry、logout delete、invalid/expired token fail-closed。
  - index: 54
    style: Normal
    text: 6.  完成登入後導向 WB-01，再由 Global Shell 載入 visible_page_uids。
  - index: 56
    style: Heading 1
    text: Mother Planning / Basic Design Closure Annex｜規劃設計規範閉環補充
  - index: 57
    style: Normal
    text: '[ACPOS-20260922-PLANNING-DESIGN-CLOSURE-ANNEX-V1] 本附錄只補規劃／基本設計規範缺口；原頁面既有功能、Owner、Operation、Permission、Entity、Visual 與跨頁 Authority 仍為同一 Canonical Owner。不得由本附錄發明
      Runtime/API/DB/Provider 行為，也不得建立第二套平行規範。'
  - index: 58
    style: Heading 2
    text: Design Dependency / Reference Closure｜登入設計依賴補齊
  - index: 59
    style: Normal
    text: '[ACPOS-DESIGN-CLOSURE:LOGIN:DEPENDENCY]'
