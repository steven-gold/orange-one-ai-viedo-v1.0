name: VIS-11 evidence pack
on:
  push:
    branches: [acpos-vis11-staging]
    paths: [.github/workflows/vis11-evidence-pack.yml]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis11-staging
      - uses: actions/upload-artifact@v4
        with:
          name: vis11-final-manual-inspection
          path: docs/construction/evidence/VIS-11
      - name: Self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git rm .github/workflows/vis11-evidence-pack.yml
          git commit -m "chore(vis11): remove evidence pack workflow"
          git push origin HEAD:acpos-vis11-staging