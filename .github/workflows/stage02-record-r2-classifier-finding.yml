name: Record Stage-02 R2 Classifier False Positive Finding

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - governance/ci/record_stage02_r2_classifier_false_positive_finding.py
      - .github/workflows/stage02-record-r2-classifier-finding.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Freeze formal specification
        run: python governance/ci/specification_mutation_guard.py
      - name: Record finding before repair
        run: python governance/ci/record_stage02_r2_classifier_false_positive_finding.py
      - name: Prove only non-normative ledger changed
        run: |
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
      - name: Commit finding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
          if git diff --cached --quiet; then
            echo 'Finding already recorded; nothing to commit.'
            exit 0
          fi
          git commit -m 'test(stage02): record R2 classifier false-positive finding'
          git push origin HEAD:rebuild-v2.1.1
