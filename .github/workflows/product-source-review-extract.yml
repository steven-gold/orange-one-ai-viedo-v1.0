name: Product Immutable Source Review Extract
on:
  workflow_dispatch:
    inputs:
      units:
        description: Comma-separated governed units to extract
        required: true
        default: GLOBAL-HOME-SHELL-NAVIGATION,WB01-DASHBOARD
      reason:
        description: Operator note
        required: false
        default: explicit-source-review-regeneration
permissions:
  contents: write
concurrency:
  group: product-source-review-extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Extract review inputs directly from canonical root Word sources
        env:
          SELECTED_UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          python .github/scripts/stage01_successor_materialize.py --mode source-review --units "$SELECTED_UNITS" --product-root "$GITHUB_WORKSPACE"
      - name: Assert no Stage predecessor source dependency
        run: |
          set -euo pipefail
          ! grep -R "STAGE_EXECUTION/STAGE-01/WU-STAGE01-.*-001/00_SOURCE_INTAKE/RAW_SOURCE" .github/workflows/product-source-review-extract.yml
      - name: Commit fresh review extracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/SOURCE_REVIEW_INPUTS
          git diff --cached --quiet && exit 0
          git commit -m "evidence(source): extract selected canonical Word review inputs"
          git pull --rebase origin 0921acpos
          git push origin HEAD:0921acpos
