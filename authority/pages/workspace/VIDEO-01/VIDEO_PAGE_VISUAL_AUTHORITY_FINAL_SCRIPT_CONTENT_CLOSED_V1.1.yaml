layout:
  sections:
  - section_uid: VIDEO-01-SEC-01
    name: Context / Execution
    responsibility: Project / Topic / Task / Status / AUTO-MANUAL / Execute
    position: Top 100%
  - section_uid: VIDEO-01-SEC-02
    name: Production List & Bound Input
    responsibility: Scene/Shot list + Blueprint/Script/DNA/Asset exact refs read-only
    position: Primary left 20%
  - section_uid: VIDEO-01-SEC-03
    name: Main Preview / Compare
    responsibility: Single 16:9 primary preview; conditional A/B compare
    position: Primary center 60%
  - section_uid: VIDEO-01-SEC-04
    name: Version / Score / Decision
    responsibility: Current/Candidate version, VIDEO criteria score, Confirm/Modify
    position: Primary right 20%
  - section_uid: VIDEO-01-SEC-05
    name: Correction Scope
    responsibility: Scene/Shot/Start-End Time/Object/Layer local correction target
    position: Below primary full width
  - section_uid: VIDEO-01-SEC-06
    name: AI Semantic Correction
    responsibility: Traditional Chinese correction request + candidate script lifecycle
    position: Below correction scope left/center
  - section_uid: VIDEO-01-SEC-07
    name: Provider Runtime
    responsibility: Approved Route read-only + provider job/retry status
    position: Below correction scope right
  - section_uid: VIDEO-01-SEC-08
    name: Stage Evaluation / Issue
    responsibility: VIDEO-specific multidimensional evaluation, Finding/Evidence/Recheck
    position: Lower full width
  - section_uid: VIDEO-01-SEC-09
    name: Exact Output Manifest / Lock / Handoff
    responsibility: Exact version lineage + lock + VIDEO→EDIT handoff
    position: Bottom full width
  - section_uid: VIDEO-01-SEC-10
    name: State / Error / Audit
    responsibility: Runtime state, blocking reason, correlation/audit trace
    position: Background/read projection
  visual_regions:
  - visual_uid: VIDEO-01-VIS-CONTEXT
    position_size: Top 100%; content-driven; h≥56
    overflow: Normal page flow
    hard_lock: One Context/Execution bar only.
  - visual_uid: VIDEO-01-VIS-LEFT
    position_size: Primary row left 20%; min 260px
    overflow: Section internal vertical scroll
    hard_lock: Scene/Shot + exact bound input read-only; no project asset picker.
  - visual_uid: VIDEO-01-VIS-PREVIEW
    position_size: Primary row center 60%; 16:9
    overflow: Viewer priority
    hard_lock: Current only=100%; Candidate Compare=50/50 only when enabled.
  - visual_uid: VIDEO-01-VIS-RIGHT
    position_size: Primary row right 20%; min 280px
    overflow: Section internal vertical scroll
    hard_lock: Version/Score/Decision only; no Provider picker.
  - visual_uid: VIDEO-01-VIS-CORRECTION
    position_size: Below primary; 100%
    overflow: Normal page flow
    hard_lock: Shot/Layer/Time/Object scope; not EDIT Timeline.
  - visual_uid: VIDEO-01-VIS-AI-REVISION
    position_size: Below correction; about 64%
    overflow: Normal page flow
    hard_lock: Correction-only Chinese input; hidden/disabled on first production.
  - visual_uid: VIDEO-01-VIS-RUNTIME
    position_size: Below correction; about 36%
    overflow: Normal page flow
    hard_lock: Provider route/job read-only; Retry only if policy eligible.
  - visual_uid: VIDEO-01-VIS-EVAL
    position_size: Lower 100%
    overflow: Normal page flow
    hard_lock: VIDEO evaluation/Issue; QA department internals not defined.
  - visual_uid: VIDEO-01-VIS-OUTPUT
    position_size: Bottom 100%
    overflow: Normal page flow
    hard_lock: Exact manifest/lock/handoff; trace complement, not extra department stage.
