name: tmp-governance-runstate-separation-verify
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/tmp-governance-runstate-separation-verify.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      verify_head: ${{ steps.out.outputs.verify_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-governance-runstate-separation-verify.yml
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add -A .github/workflows/tmp-governance-runstate-separation-verify.yml
          CURRENT="$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')"
          test "$CURRENT" = "${GITHUB_SHA}"
          git commit -m "chore(governance): remove temporary runstate verifier"
          git push origin HEAD:rebuild-v2.1.1
      - id: out
        run: echo "verify_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.verify_head }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML==6.0.2
      - name: Validate Current governance and common engine
        shell: bash
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/test_stage_execution_engine.py
      - name: Verify legacy Stage-02 compatibility fail-closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          out="$(python governance/ci/compile_stage_execution_preflight.py 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q 'LEGACY_COMPATIBILITY_MODULE_HAS_NO_CURRENT_EXECUTION_AUTHORITY:STAGE-02'
          echo "PASS: legacy Stage-02 compatibility has no Current execution authority"
