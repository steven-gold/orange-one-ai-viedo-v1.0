    text: 1. 產品目標與設計原則
  - index: 6
    style: List Bullet
    text: 把 Provider 設定、能力治理、路由測試、作業成本監控收斂在同一頁，避免操作人員在多個管理頁之間失去 Provider/Profile 上下文。
  - index: 7
    style: List Bullet
    text: 任何 Effectful 動作必須綁定已註冊 Operation、Permission、Gate 與 Runtime Owner；未知能力、Endpoint、價格、限制或 Provider 資料一律顯示 — 或 BLOCK。
  - index: 8
    style: List Bullet
    text: Secret 僅允許寫入與狀態檢視，不提供明文回顯、匯出、日誌或 Audit Plaintext。
  - index: 9
    style: List Bullet
    text: 路由由能力、Rights、Data Classification、Health/Test、Budget/Policy 等硬條件決定；前端不得 Override。
  - index: 10
    style: List Bullet
    text: 所有 Provider-specific Prompt/Request 轉換只能改語法與欄位映射，不得改變 Canonical Instruction 的治理語意。
