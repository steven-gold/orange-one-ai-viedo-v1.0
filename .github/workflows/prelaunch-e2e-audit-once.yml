name: ACPOS exhaustive prelaunch E2E audit
on:
  push:
    branches: [acpos-prelaunch-e2e-audit-20260903]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependency, type and repository hygiene
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          git diff --exit-code

      - name: Release static inventory
        shell: python
        run: |
          from pathlib import Path
          import json,re
          pkg=json.loads(Path('package.json').read_text())
          scripts=pkg.get('scripts',{})
          report={}
          report['has_lint_script']='lint' in scripts
          report['has_unit_test_script']=any(k in scripts for k in ['test','test:unit'])
          report['has_e2e_script']=any('e2e' in k for k in scripts)
          report['has_release_script']=any('release' in k or 'verify' in k for k in scripts)
          report['has_env_example']=any(Path('.').glob('.env.example'))
          report['has_deploy_config']=Path('vercel.json').exists() or Path('Dockerfile').exists()
          report['has_health_route']=any(p.as_posix().endswith('/health/route.ts') or 'health' in p.name.lower() for p in Path('src/app').rglob('*') if p.is_file())
          report['has_error_boundary']=any(p.name in ['error.tsx','global-error.tsx'] for p in Path('src/app').rglob('*') if p.is_file())
          report['has_not_found']=any(p.name=='not-found.tsx' for p in Path('src/app').rglob('*') if p.is_file())
          report['has_loading_boundary']=any(p.name=='loading.tsx' for p in Path('src/app').rglob('*') if p.is_file())
          gi=Path('.gitignore').read_text()
          report['gitignore_env']=('.env' in gi)
          report['gitignore_secrets']=('secret' in gi.lower() or '*.pem' in gi.lower() or '*.key' in gi.lower())
          cfg=Path('next.config.ts').read_text()
          for token in ['Content-Security-Policy','Strict-Transport-Security','X-Content-Type-Options','Referrer-Policy','Permissions-Policy','X-Frame-Options']:
            report['header_'+token]=token in cfg
          source='\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx','.js','.jsx','.json','.css'})
          report['has_sentry']='sentry' in source.lower()
          report['has_otel']=('opentelemetry' in source.lower() or 'otel' in source.lower())
          report['has_rate_limit']=('rate limit' in source.lower() or 'rate_limit' in source.lower() or 'ratelimit' in source.lower())
          report['has_correlation_id']='correlation_id' in source
          report['has_audit_runtime']='audit' in source.lower()
          report['hardcoded_localhost_count']=len(re.findall(r'https?://(?:127\.0\.0\.1|localhost)',source))
          print('PRELAUNCH_STATIC_INVENTORY='+json.dumps(report,sort_keys=True))

      - name: Secret and dangerous residue scan
        shell: python
        run: |
          from pathlib import Path
          import re
          findings=[]
          allow_dirs={'.git','node_modules','.next'}
          patterns={
            'OPENAI_STYLE_KEY':re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
            'GROQ_KEY':re.compile(r'\bgsk_[A-Za-z0-9_-]{20,}\b'),
            'GOOGLE_API_KEY':re.compile(r'\bAIza[A-Za-z0-9_-]{20,}\b'),
            'PRIVATE_KEY':re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
            'BEARER_LITERAL':re.compile(r'Authorization["\'\s:]+Bearer\s+[A-Za-z0-9._-]{16,}',re.I),
          }
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(part in allow_dirs for part in p.parts): continue
            if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.ico','.woff','.woff2','.ttf','.zip','.gz','.pdf'}: continue
            text=p.read_text(errors='ignore')
            for name,pat in patterns.items():
              if pat.search(text): findings.append((name,str(p)))
          assert not findings, findings
          print('SECRET_SCAN_PASS')

      - name: Authority and page identity integrity
        shell: python
        run: |
          from pathlib import Path
          import re
          m=Path('authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml').read_text()
          pages=re.findall(r'^  - (authority/pages/[^\n]+)$',m,re.M)
          assert len(pages)==18 and len(set(pages))==18
          for p in pages: assert Path(p).is_file(),p
          assert 'current_page_count: 18' in m
          assert 'production_script_v1_3:' in m
          assert not list(Path('authority').rglob('*PRODUCTION_SCRIPT*V1.2*'))
          assert len(list(Path('authority/global').glob('*PRODUCTION_SCRIPT*')))==1
          print('AUTHORITY_INTEGRITY_PASS')

      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ''
        run: npm run build

      - name: Production runtime truth, headers and routes
        run: |
          set -euo pipefail
          PORT=3401 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/prelaunch-prod.log 2>&1 & pid=$!
          trap 'cat /tmp/prelaunch-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3401/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const expected=[
            ['/','workspace:WB-01'],['/core','CORE-01'],['/assets','ASSET-01'],['/video','VIDEO-01'],['/edit','EDIT-01'],['/qa','QA-01'],['/database','admin:DB-01'],['/strategy','workspace:STR-01'],['/info','workspace:INFO-01'],
            ['/admin/system','admin:SYS-01'],['/admin/accounts','admin:IAM-01'],['/admin/dev','admin:DEV-01'],['/admin/social','admin:SOC-01'],['/admin/erp','admin:ERP-01'],['/admin/aiapi','admin:AIAPI-01'],['/admin/qa-criteria','admin:SG-02'],['/admin/strategy','admin:STR-01'],['/admin/knowledge','admin:KB-01']
          ];
          (async()=>{
            const first=await fetch('http://127.0.0.1:3401/');
            const headers=Object.fromEntries(first.headers.entries());
            const security=['content-security-policy','strict-transport-security','x-content-type-options','referrer-policy','permissions-policy'];
            console.log('SECURITY_HEADERS',JSON.stringify(Object.fromEntries(security.map(k=>[k,headers[k]??null]))));
            let prod503=0,prod200=0;
            for(const [route,uid] of expected){
              const page=await fetch('http://127.0.0.1:3401'+route); if(!page.ok) throw new Error(`PAGE ${route} ${page.status}`);
              const r=await fetch('http://127.0.0.1:3401/v1/ui-projections/'+encodeURIComponent(uid)); const text=await r.text();
              if(r.status===503){prod503++; if(!/RUNTIME_NOT_BOUND|NOT_BOUND|NOT_CONFIGURED/.test(text)) throw new Error(`UNTRUTHFUL 503 ${uid}`)}
              else if(r.status===200){prod200++}
              else throw new Error(`PROJECTION ${uid} ${r.status}: ${text}`);
              if(/TEST_ONLY|TEST-RUN-|"synthetic"\s*:\s*true/.test(text)) throw new Error(`TEST LEAK ${uid}`);
            }
            console.log('PRODUCTION_PROJECTION_SUMMARY',JSON.stringify({prod200,prod503}));
            console.log('PRODUCTION_RUNTIME_TRUTH_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT

      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build

      - name: Install Chromium audit dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Full-site browser E2E desktop and narrow viewport
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3402 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/prelaunch-browser.log 2>&1 & pid=$!
          trap 'cat /tmp/prelaunch-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3402/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const{chromium}=require('playwright');
          const expected=[
            ['/','workspace:WB-01'],['/core','CORE-01'],['/assets','ASSET-01'],['/video','VIDEO-01'],['/edit','EDIT-01'],['/qa','QA-01'],['/database','admin:DB-01'],['/strategy','workspace:STR-01'],['/info','workspace:INFO-01'],
            ['/admin/system','admin:SYS-01'],['/admin/accounts','admin:IAM-01'],['/admin/dev','admin:DEV-01'],['/admin/social','admin:SOC-01'],['/admin/erp','admin:ERP-01'],['/admin/aiapi','admin:AIAPI-01'],['/admin/qa-criteria','admin:SG-02'],['/admin/strategy','admin:STR-01'],['/admin/knowledge','admin:KB-01']
          ];
          (async()=>{
            const b=await chromium.launch({headless:true});
            for(const width of [375,768,1024,1280,1440,1920]){
              for(const [route,uid] of expected){
                const p=await b.newPage({viewport:{width,height:1400}}),errs=[];
                p.on('pageerror',e=>errs.push('pageerror:'+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/Failed to load resource.*503/.test(m.text()))errs.push('console:'+m.text())});
                const resp=await p.goto('http://127.0.0.1:3402'+route,{waitUntil:'networkidle',timeout:45000});
                if(!resp||!resp.ok()) throw new Error(`NAV ${route} ${resp?.status()}`);
                const root=p.locator('[data-page-uid]').first(); await root.waitFor({state:'attached',timeout:15000});
                const actual=await root.getAttribute('data-page-uid'); if(actual!==uid) throw new Error(`UID ${route}: ${actual}`);
                const state=await root.getAttribute('data-page-state'); if(state==='LOADING') throw new Error(`STUCK_LOADING ${uid}`);
                const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                if(width>=1024 && overflow>0) throw new Error(`DESKTOP_OVERFLOW ${uid} ${width} ${overflow}`);
                const body=(await p.locator('body').textContent())||'';
                if(body.includes('"use client"')||body.includes('function KnowledgeAdminVisual')||body.includes('const CONTROLS')) throw new Error(`SOURCE_RENDER ${uid}`);
                if(errs.length) throw new Error(`${uid} ${width} ${errs.join(' | ')}`);
                console.log('E2E',width,uid,state||'NO_STATE','overflow='+overflow);
                await p.close();
              }
            }
            await b.close(); console.log('BROWSER_108_CASES_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT

      - name: Source hardening and release blocker inventory
        shell: python
        run: |
          from pathlib import Path
          import re,json
          src=[]
          for p in Path('src').rglob('*'):
            if p.is_file() and p.suffix in {'.ts','.tsx','.js','.jsx','.json'}:
              src.append((str(p),p.read_text(errors='ignore')))
          findings={
            'todo_fixme_hack_stub':[],
            'console_log_debug':[],
            'dangerous_html':[],
            'eval_usage':[],
            'window_local_storage':[],
            'runtime_not_bound_refs':[],
          }
          for path,text in src:
            if re.search(r'\b(TODO|FIXME|HACK|STUB)\b',text): findings['todo_fixme_hack_stub'].append(path)
            if re.search(r'console\.(log|debug)\s*\(',text): findings['console_log_debug'].append(path)
            if 'dangerouslySetInnerHTML' in text: findings['dangerous_html'].append(path)
            if re.search(r'\beval\s*\(',text): findings['eval_usage'].append(path)
            if 'localStorage' in text or 'sessionStorage' in text: findings['window_local_storage'].append(path)
            if 'RUNTIME_NOT_BOUND' in text or '_NOT_BOUND' in text: findings['runtime_not_bound_refs'].append(path)
          print('SOURCE_HARDENING_INVENTORY='+json.dumps(findings,sort_keys=True))
          assert not findings['todo_fixme_hack_stub'],findings['todo_fixme_hack_stub']
          assert not findings['console_log_debug'],findings['console_log_debug']
          assert not findings['eval_usage'],findings['eval_usage']
          print('SOURCE_RESIDUAL_GUARD_PASS')

      - name: Dirty tree
        run: git diff --exit-code
