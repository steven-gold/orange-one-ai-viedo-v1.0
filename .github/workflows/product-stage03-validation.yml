name: Product Stage03 Validation
on:
  push:
    branches: [0921acpos]
    paths: ['STAGE_EXECUTION/STAGE-03/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wu: [WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001, WU-STAGE03-WB01-DASHBOARD-CLEAN-001]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - name: Validate phase-aware Current Stage03 state
        env: {WU: "${{ matrix.wu }}"}
        run: |
          set -euo pipefail
          B="STAGE_EXECUTION/STAGE-03/$WU"
          test -s "$B/WORK_UNIT.yaml"; test -s "$B/EXECUTION_STATE.yaml"; test -s "$B/NORMATIVE_EXECUTION_MATRIX.yaml"
          CUR="$(python -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; print(d.get('current_operation') or '')" "$B/EXECUTION_STATE.yaml")"
          if [ "$CUR" != "COMPLETE" ]; then
            echo "PASS: Stage03 incremental operation checkpoint; closure evidence not yet applicable"
            exit 0
          fi
          for F in VISUAL_DESIGN_SPEC_PACKAGE.yaml VISUAL_GEOMETRY_CONTRACT.yaml VISUAL_PREVIEW_EVIDENCE.yaml VISUAL_CHANGESET.yaml VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT.yaml VISUAL_REFERENCE_ANNOTATION.yaml VISUAL_INHERITANCE_MATRIX.yaml VISUAL_SCENARIO_EVIDENCE_SET.yaml EVIDENCE/VISUAL_REVIEW_EVIDENCE.yaml; do test -s "$B/$F"; done
          DEC="$(python -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; print(d.get('decision') or '')" "$B/EVIDENCE/VISUAL_REVIEW_EVIDENCE.yaml")"
          if [ "$DEC" = "PENDING_HUMAN_REVIEW" ]; then
            echo "PASS: Stage03 materialization complete; FORMAL_HUMAN_APPROVAL_REQUIRED; stage exit credit=0"
            exit 0
          fi
          [ "$DEC" = "VISUAL_APPROVED" ] || { echo "BLOCK:STAGE03_REVIEW_NOT_APPROVED:$DEC"; exit 42; }
          if [ -f "$B/WORK_UNIT_TERMINAL_RECEIPT.yaml" ]; then
            test -s "$B/EVIDENCE/NORMALIZED_STAGE_EVIDENCE.json"
            echo "PASS: Stage03 terminal closure artifacts materialized"
          else
            echo "PASS: Stage03 human-approved closure candidate awaiting common terminalization"
          fi
