name: ACPOS Batch 08 Authority Remediation Registers

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-08-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Verify no Word drift since Batch 07
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="f4f671b2cd7d66a93ef3bc3381885e74dd32f534"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-07")
          PY

      - name: Preflight script syntax
        run: python -m py_compile __temp/batch_08_authority_remediation.py

      - name: Baseline DOCX encoding audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,json
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};report={}
          for fn in files:
              with zipfile.ZipFile(fn) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  errs=[]
                  for n in xmls:
                      try:ET.fromstring(z.read(n))
                      except Exception as e:errs.append((n,str(e)))
                  assert not errs,(fn,errs)
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  text="".join((e.text or "") for e in root.iter(ns+"t"))
              assert "\x00" not in text,(fn,"NUL")
              ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
              assert not ctrl[:20],(fn,"CONTROL",ctrl[:20])
              hits=[x for x in bad if x in text]
              assert not hits,(fn,"MOJIBAKE",hits)
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,"NFC_REPLACEMENT")
              report[fn]={"xml_parts":len(xmls),"chars":len(text),"status":"PASS"}
          Path("__batch08_baseline_encoding.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-08 BASELINE ENCODING",json.dumps(report,ensure_ascii=False))
          PY

      - name: Apply Batch 08 remediation registers
        run: python __temp/batch_08_authority_remediation.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch08_remediation_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["denominator"]==310,m
          assert m["classification"]=={"CANONICAL_SPEC_REMEDIATION_REQUIRED":282,"FORMAL_NOT_APPLICABLE":0,"FORMAL_RUNTIME_BLOCKED":0},m
          assert m["unique_owner_rows"]==226,m
          assert m["multi_owner_rows"]==56,m
          assert m["wb_owner_absent_rows"]==28 and m["wb_controls"]==14,m
          assert m["page_binding_mutations"]==0,m
          assert len(r["unique_owner_rows"])==226
          assert len(r["multi_owner_rows"])==56
          assert len(r["wb_owner_absent_rows"])==28
          expected={
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx":14,
          "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":19,
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":133,
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":54,
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":6,
          }
          for fn,count in expected.items():
              d=Document(fn)
              txt="\n".join([p.text for p in d.paragraphs]+[c.text for t in d.tables for row in t.rows for c in row.cells])
              assert "Batch 08 · Canonical Spec Remediation Register" in txt,fn
              assert "PAGE_BINDING_MUTATION_AUTHORIZED" in txt,fn
              assert str(count) in txt,fn
          wb=Document("ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx")
          wt="\n".join([p.text for p in wb.paragraphs]+[c.text for t in wb.tables for row in t.rows for c in row.cells])
          assert "ACPOS-20260921-BATCH-08-WB-CANONICAL-OWNER-MAPPING-V1" in wt
          assert "CANONICAL_CONTROL_UID_OWNER_MAPPING_REQUIRED" in wt
          logic=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          lt="\n".join([p.text for p in logic.paragraphs]+[c.text for t in logic.tables for row in t.rows for c in row.cells])
          for token in [
            "ACPOS-20260921-BATCH-08-AUTHORITY-REMEDIATION-DENOMINATOR-V1",
            "Unique-owner Remediation Distribution",
            "Multi-owner Collision Distribution",
            "28-row WB Canonical Owner Mapping Ledger",
            "BATCH08_MACHINE_JSON="
          ]: assert token in lt,token
          print("PASS: BATCH-08 SEMANTIC 310/310; UNIQUE 226; COLLISION 56; WB 28")
          PY

      - name: Convert seven DOCX files to PDF
        shell: bash
        run: |
          mkdir -p __render_qa_batch08/pdf
          for f in           "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx"           "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          do
            libreoffice --headless --convert-to pdf --outdir __render_qa_batch08/pdf "$f"
          done

      - name: Post-conversion encoding and garble audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]");report={}
          for fn in files:
              docx=Path(fn);pdf=Path("__render_qa_batch08/pdf")/(docx.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(docx) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  errs=[]
                  for n in xmls:
                      try:ET.fromstring(z.read(n))
                      except Exception as e:errs.append((n,str(e)))
                  assert not errs,(fn,errs)
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in root.iter(ns+"t"))
              pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              for label,text in [("DOCX",src),("PDF",pdftext)]:
                  assert "\x00" not in text,(fn,label,"NUL")
                  ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
                  assert not ctrl[:20],(fn,label,"CONTROL",ctrl[:20])
                  hits=[x for x in bad if x in text]
                  assert not hits,(fn,label,"MOJIBAKE",hits)
                  assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,label,"NFC_REPLACEMENT")
              sc=len(cjk.findall(src));pc=len(cjk.findall(pdftext));assert sc>0,(fn,"NO_SOURCE_CJK")
              ratio=pc/sc;assert ratio>=0.97,(fn,"CJK_RETENTION",sc,pc,ratio)
              report[fn]={"xml_parts":len(xmls),"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch08/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-08 ENCODING/GARBLE INTEGRITY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Render PNGs geometry and contact sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,math
          from PIL import Image,ImageChops,ImageDraw
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          qa=Path("__render_qa_batch08");pdfdir=qa/"pdf";pngroot=qa/"png";contact=qa/"contact"
          pngroot.mkdir(parents=True,exist_ok=True);contact.mkdir(parents=True,exist_ok=True)
          report={}
          for fn in files:
              p=Path(fn);pf=pdfdir/(p.stem+".pdf")
              info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
              pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
              od=pngroot/p.stem;od.mkdir(parents=True,exist_ok=True)
              subprocess.run(["pdftoppm","-png","-r","130",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob("page-*.png"));assert len(imgs)==pages,(fn,pages,len(imgs))
              blank=[];edge=[];thumbs=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert("RGB")
                  diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
                  bb=diff.getbbox()
                  if bb is None:blank.append(i)
                  else:
                      l,t,r,b=bb
                      if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
                  th=im.copy();th.thumbnail((360,510))
                  canvas=Image.new("RGB",(380,545),"white");canvas.paste(th,((380-th.width)//2,8))
                  ImageDraw.Draw(canvas).text((8,526),f"page {i}",fill="black");thumbs.append(canvas)
              assert not blank,(fn,"BLANK",blank)
              assert not edge,(fn,"EDGE",edge)
              cols=5;rows=math.ceil(len(thumbs)/cols)
              sheet=Image.new("RGB",(cols*380,rows*545),"white")
              for i,th in enumerate(thumbs):sheet.paste(th,((i%cols)*380,(i//cols)*545))
              sheet.save(contact/(p.stem+".jpg"),quality=86)
              report[fn]={"pages":pages,"blank":blank,"edge":edge}
          Path("__render_qa_batch08/geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-08 RENDER/GEOMETRY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Verify exact Batch 08 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          }
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-08 CHANGE SCOPE EXACT 7 WORD")
          PY

      - name: Collect evidence
        run: |
          cp __batch08_remediation_report.json __render_qa_batch08/
          cp __batch08_baseline_encoding.json __render_qa_batch08/

      - name: Upload Batch 08 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-08-authority-remediation-evidence
          path: __render_qa_batch08
          retention-days: 1

      - name: Commit Batch 08 and remove temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch08 __temp/__pycache__ __batch08_remediation_report.json __batch08_baseline_encoding.json
          git rm __temp/batch_08_authority_remediation.py .github/workflows/batch-08-authority-remediation.yml
          git config user.name "acpos-word-batch-08"
          git config user.email "actions@users.noreply.github.com"
          git add           "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx"           "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"           "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git commit -m "docs(acpos): materialize batch-08 authority remediation registers"
          git push
