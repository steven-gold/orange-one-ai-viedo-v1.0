name: ACPOS Batch 80 R2 Post-Remediation Fresh Entity Reaudit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch80_post_remediation_fresh_entity_reaudit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fresh entity lifecycle hierarchy applicability reaudit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="d4072f488bdc3dc4d2fcb071f9fcd9e556dcc416"
          WF=Path(".github/workflows/acpos_batch80_post_remediation_fresh_entity_reaudit.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift: raise SystemExit(f"PRE_AUDIT_TREE_DRIFT {drift}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          ALL_DOCS=sorted(Path(".").glob("*.docx"))
          if len(ALL_DOCS)!=31: raise SystemExit(f"DOCX_COUNT_FAIL {len(ALL_DOCS)}")
          for p in PAGE_DOCS.values():
              if not Path(p).exists(): raise SystemExit(f"PAGE_DOC_MISSING {p}")

          OPS=[
            "DISCOVER_OR_LIST","SELECT_OR_OPEN","CREATE","CREATION_MODE","PARENT_BIND",
            "CATEGORY_OR_GROUP_BIND","DRAFT","RESUME","EDIT","SAVE","VALIDATE",
            "CONFIRM_OR_APPROVE","VERSION","REVISE","LOCK_OR_UNLOCK","REORDER",
            "MOVE_OR_REPARENT","ARCHIVE_OR_DELETE","RESTORE","DEPENDENCY_IMPACT",
            "AUDIT","ERROR_RECOVERY","NEXT_STEP",
          ]
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          EH={"BUSINESS ENTITY","BUSINESS_ENTITY","ENTITY","ENTITY NAME","ENTITY / REF","實體","業務實體","商業實體"}
          BEH={"BUSINESS ENTITY","BUSINESS_ENTITY","業務實體","商業實體"}
          EUID={"ENTITY UID"}; CNAME={"CANONICAL NAME"}
          ROLE_HEADERS={"ENTITY ROLE","ROLE","CLASSIFICATION"}
          APP_HEADERS={"APPLICABILITY","適用性","適用"}
          AUTH_HEADERS={"AUTHORITY EVIDENCE","AUTHORITY","EVIDENCE","依據","證據"}
          OP_TEXT_HEADERS={"OPERATIONS","REQUIRED OPERATIONS","OPERATION","EFFECTFUL OPERATION","LIFECYCLE","LIFECYCLE / CONSTRAINT","生命週期／約束"}

          ALIAS={
            ("SG-02","Approval Record"):"approval_record",("SG-02","approval_record"):"approval_record",
            ("SG-02","Department Mapping"):"department_mapping",("SG-02","department_mapping"):"department_mapping",
            ("SG-02","Dimension Library"):"dimension_library",("SG-02","dimension_library"):"dimension_library",
            ("SG-02","Impact Record"):"impact_record",("SG-02","impact_record"):"impact_record",
            ("SG-02","Required Check"):"required_check",("SG-02","required_check"):"required_check",
            ("SG-02","Threshold"):"threshold",("SG-02","threshold"):"threshold",
            ("SG-02","Criteria Version"):"quality_criteria_version",("SG-02","quality_criteria_version"):"quality_criteria_version",
            ("SG-02","Gate Policy"):"quality_gate_policy",("SG-02","quality_gate_policy"):"quality_gate_policy",
            ("KB-01","ACPOSContextCandidate"):"Context Candidate",("KB-01","Context Candidate"):"Context Candidate",
            ("KB-01","ACPOSLearningCandidate"):"Learning Candidate",("KB-01","Learning Candidate"):"Learning Candidate",
            ("KB-01","ACPOSExperienceRecord / Replay"):"Experience / Replay",("KB-01","Experience / Replay"):"Experience / Replay",
          }

          # Source-backed residual decisions. They are applied only if the exact identity
          # is present in the CURRENT Word source; no prior artifact is consumed.
          FIXED={
            ("AIAPI-01","Artifact"):"SUPPORTING_ARTIFACT",("AIAPI-01","Cost"):"VALUE_OBJECT",
            ("ASSET-01","AssetCandidateOutput"):"SUPPORTING_ARTIFACT",("ASSET-01","AssetEvaluation"):"SUPPORTING_ARTIFACT",
            ("ASSET-01","AssetFinding"):"SUPPORTING_ARTIFACT",("ASSET-01","AssetOutputVersion"):"SUPPORTING_ARTIFACT",
            ("ASSET-01","AssetPatch"):"SUPPORTING_ARTIFACT",("ASSET-01","CorrectionScriptCandidate"):"TRUE_BUSINESS_ENTITY",
            ("ASSET-01","VersionedLayerDocument"):"TRUE_BUSINESS_ENTITY",("DB-01","SchemaMetadata"):"SUPPORTING_ARTIFACT",
            ("EDIT-01","ApiEditCandidate"):"SUPPORTING_ARTIFACT",("EDIT-01","AssetVersion"):"REFERENCE_ONLY",
            ("EDIT-01","CorrectionScriptCandidate"):"TRUE_BUSINESS_ENTITY",("EDIT-01","CorrectionTranslation"):"SUPPORTING_ARTIFACT",
            ("EDIT-01","EditVersion"):"TRUE_BUSINESS_ENTITY",("EDIT-01","EditWorkingDraft"):"TRUE_BUSINESS_ENTITY",
            ("EDIT-01","ProductionPackage"):"REFERENCE_ONLY",("EDIT-01","StageEvaluation"):"SUPPORTING_ARTIFACT",
            ("EDIT-01","SubtitleSegment"):"TRUE_BUSINESS_ENTITY",("EDIT-01","SubtitleTrack"):"TRUE_BUSINESS_ENTITY",
            ("EDIT-01","Timeline"):"TRUE_BUSINESS_ENTITY",("ERP-01","ERPMapping"):"TRUE_BUSINESS_ENTITY",
            ("IAM-01","ACCESS-REVIEW"):"READ_PROJECTION",("IAM-01","ACCOUNT"):"TRUE_BUSINESS_ENTITY",
            ("IAM-01","AUTH-IMPACT"):"READ_PROJECTION",("IAM-01","IDENTITY-ACTOR"):"REFERENCE_ONLY",
            ("IAM-01","L1-BUNDLE"):"VALUE_OBJECT",("IAM-01","PERM-ASSIGNMENT"):"TRUE_BUSINESS_ENTITY",
            ("INFO-01","Audit/Correlation"):"SUPPORTING_ARTIFACT",("INFO-01","Fact"):"SUPPORTING_ARTIFACT",
            ("INFO-01","FactPack"):"SUPPORTING_ARTIFACT",("KB-01","KnowledgeCitation"):"SUPPORTING_ARTIFACT",
            ("QA-01","CorrectionRequest"):"TRUE_BUSINESS_ENTITY",("QA-01","QAReviewRun"):"TRUE_BUSINESS_ENTITY",
            ("QA-01","ReleasePackageCandidate"):"TRUE_BUSINESS_ENTITY",("STR-01","DecisionBrief"):"SUPPORTING_ARTIFACT",
            ("STR-01","ResourceProposal"):"SUPPORTING_ARTIFACT",("STR-01","StrategyAlert"):"SUPPORTING_ARTIFACT",
            ("STR-01","StrategyAnalysisResult"):"SUPPORTING_ARTIFACT",("STR-01","StrategyExecutionFeedback"):"SUPPORTING_ARTIFACT",
            ("STR-01","StrategyRecommendation"):"SUPPORTING_ARTIFACT",("SYS-01","Change Candidate"):"TRUE_BUSINESS_ENTITY",
            ("SYS-01","Decision Record"):"TRUE_BUSINESS_ENTITY",("SYS-01","Maintenance Alert"):"REFERENCE_ONLY",
            ("SYS-01","System Change"):"TRUE_BUSINESS_ENTITY",("VIDEO-01","VideoCandidateOutput"):"SUPPORTING_ARTIFACT",
            ("VIDEO-01","VideoFinding"):"SUPPORTING_ARTIFACT",("VIDEO-01","VideoStageEvaluation"):"SUPPORTING_ARTIFACT",

            # Batch79 materialized resolutions.
            ("CORE-01","AssistantSummary"):"TRUE_BUSINESS_ENTITY",
            ("CORE-01","CoreEvaluation"):"TRUE_BUSINESS_ENTITY",
            ("CORE-01","ConversationThread"):"TRUE_BUSINESS_ENTITY",
            ("CORE-01","ConversationMessage"):"TRUE_BUSINESS_ENTITY",
            ("CORE-01","HumanDecision"):"TRUE_BUSINESS_ENTITY",
            ("CORE-01","StructuredDecision"):"TRUE_BUSINESS_ENTITY",
            ("DEV-01","Campaign"):"TRUE_BUSINESS_ENTITY",
            ("DEV-01","Discovery Profile"):"TRUE_BUSINESS_ENTITY",
            ("INFO-01","Inference / Recommendation"):"SUPPORTING_ARTIFACT",
            ("KB-01","KnowledgeAcquisitionIntent"):"VALUE_OBJECT",
            ("SYS-01","Shared Conversation Core Reference"):"REFERENCE_ONLY",

            # Previously legal compound/non-BE dispositions.
            ("DEV-01","Suppression / Evidence / Audit"):"REFERENCE_ONLY",
            ("ERP-01","Audit / Correlation"):"SUPPORTING_ARTIFACT",
            ("KB-01","Experience / Replay"):"TRUE_BUSINESS_ENTITY",
            ("KB-01","KnowledgeVersion / Review"):"ALIAS_TO_EXISTING_ENTITY",
            ("SOC-01","Evidence / Audit"):"SUPPORTING_ARTIFACT",
            ("SOC-01","ExternalResult / Record"):"TRUE_BUSINESS_ENTITY",
            ("SYS-01","Sandbox / Validation Run"):"TRUE_BUSINESS_ENTITY",
            ("CORE-01","TopicProductionPackage"):"REFERENCE_ONLY",
            ("DEV-01","Company"):"TRUE_BUSINESS_ENTITY",
            ("DEV-01","Contact Point"):"TRUE_BUSINESS_ENTITY",
            ("DEV-01","Delivery"):"TRUE_BUSINESS_ENTITY",
            ("DEV-01","Market Signal"):"TRUE_BUSINESS_ENTITY",
            ("ERP-01","ERPFailure"):"TRUE_BUSINESS_ENTITY",
            ("SOC-01","ManualAction"):"TRUE_BUSINESS_ENTITY",
            ("SOC-01","PlatformCapability"):"TRUE_BUSINESS_ENTITY",
            ("SOC-01","PublishPolicy"):"TRUE_BUSINESS_ENTITY",
            ("SOC-01","PublishRequest"):"TRUE_BUSINESS_ENTITY",
          }

          REF_RE=re.compile(r"(?:REF|REFERENCE)(?:$|\b|/)",re.I)
          EXT_RE=re.compile(r"(CREDENTIALREFERENCE|PROVIDERJOBREF|EXTERNAL.*REF|CALLBACK)",re.I)
          PROJ_RE=re.compile(r"(PROJECTION|READMODEL|READ MODEL|SEARCH RESULT|SEARCHRESULT)",re.I)
          SUPPORT_RE=re.compile(r"(EVIDENCE|MANIFEST|SCORECARD|CHECKPOINT|TRACE|HANDOFF|SCRIPT VIEW|SCRIPT_VIEW)",re.I)
          VALUE_RE=re.compile(r"(CONTEXT|BINDING|SNAPSHOT|TIMING)",re.I)
          EFFECT_RE=re.compile(r"\b(CREATE|START|DISPATCH|COMPLETE|EDIT|SAVE|APPROVE|CONFIRM|DECIDE|CONFIGURE|ADD|REMOVE|PAUSE|RESUME|RETRY|SUPERSEDE|RETIRE|ARCHIVE|DELETE|RESTORE|LOCK|UNLOCK|REORDER|MOVE|REPARENT|PUBLISH|EXECUTE|RUN|RETURN|REJECT|APPEND|UPDATE)\b|建立|新增|編輯|修改|儲存|核准|確認|設定|完成|重試|封存|刪除|還原|鎖定|排序|移動|發布|執行|退回|拒絕|追加",re.I)
          READ_RE=re.compile(r"\b(LIST|OPEN|DISCOVER|SEARCH|GET|VIEW|READ|QUERY|COMPARE|TRACE)\b|清單|開啟|搜尋|查看|讀取|查詢|比較",re.I)
          ID_RE=re.compile(r"\b[a-zA-Z][a-zA-Z0-9_]*(?:_id|_uid)\b")
          STATE_RE=re.compile(r"\b(state|status|approval_state|lock_state|lifecycle_state)\b",re.I)
          ORDER_RE=re.compile(r"\b(order|ordering|sequence|sort|position|parent_id|parent_uid|child_id|child_uid|category_id|group_id)\b",re.I)

          OP_PATTERNS={
            "DISCOVER_OR_LIST":[r"\bDISCOVER\b",r"\bLIST\b",r"清單",r"列表",r"瀏覽",r"查詢"],
            "SELECT_OR_OPEN":[r"\bSELECT\b",r"\bOPEN\b",r"選擇",r"開啟",r"查看"],
            "CREATE":[r"\bCREATE\b",r"新增",r"建立",r"創建"],
            "CREATION_MODE":[r"CREATION[_ /-]*MODE",r"建立模式",r"新增模式"],
            "PARENT_BIND":[r"PARENT[_ /-]*BIND",r"父層綁定",r"父項綁定"],
            "CATEGORY_OR_GROUP_BIND":[r"CATEGORY[_ /-]*BIND",r"GROUP[_ /-]*BIND",r"分類綁定",r"群組綁定"],
            "DRAFT":[r"\bDRAFT\b",r"草稿"],"RESUME":[r"\bRESUME\b",r"續作",r"繼續"],
            "EDIT":[r"\bEDIT\b",r"編輯",r"修改"],"SAVE":[r"\bSAVE\b",r"儲存",r"保存"],
            "VALIDATE":[r"\bVALIDATE\b",r"\bVALIDATION\b",r"驗證",r"校驗"],
            "CONFIRM_OR_APPROVE":[r"\bCONFIRM\b",r"\bAPPROVE\b",r"\bREVIEW\b",r"確認",r"核准",r"審批",r"審查"],
            "VERSION":[r"\bVERSION\b",r"版本"],"REVISE":[r"\bREVISE\b",r"\bREVISION\b",r"修訂",r"改版"],
            "LOCK_OR_UNLOCK":[r"\bLOCK\b",r"\bUNLOCK\b",r"鎖定",r"解鎖"],
            "REORDER":[r"\bREORDER\b",r"排序",r"重排"],
            "MOVE_OR_REPARENT":[r"\bREPARENT\b",r"\bMOVE\b",r"移動",r"改掛",r"變更父層"],
            "ARCHIVE_OR_DELETE":[r"\bARCHIVE\b",r"\bDELETE\b",r"\bRETIRE\b",r"封存",r"刪除",r"退役"],
            "RESTORE":[r"\bRESTORE\b",r"還原",r"恢復"],
            "DEPENDENCY_IMPACT":[r"DEPENDENCY[_ /-]*IMPACT",r"\bIMPACT\b",r"依賴影響",r"影響"],
            "AUDIT":[r"\bAUDIT\b",r"稽核",r"審計"],
            "ERROR_RECOVERY":[r"ERROR[_ /-]*RECOVERY",r"\bRECOVERY\b",r"\bROLLBACK\b",r"錯誤恢復",r"復原",r"回滾"],
            "NEXT_STEP":[r"NEXT[_ /-]*STEP",r"NEXT[_ /-]*ACTION",r"下一步",r"下一動作"],
          }

          def norm(s): return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def up(s): return norm(s).upper()
          def txt(el): return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def exact_idx(headers,names):
              for i,h in enumerate(headers):
                  if up(h) in names:return i
              return None
          def parse(fn):
              with zipfile.ZipFile(fn) as z:
                  root=ET.fromstring(z.read("word/document.xml"))
              tables=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[[txt(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
                  tables.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return tables
          def canon(page,name): return ALIAS.get((page,name),name)
          def op_hits(s):
              u=up(s); out=[]
              for op,patterns in OP_PATTERNS.items():
                  if any(re.search(p,u,re.I) for p in patterns): out.append(op)
              return out
          def app_value(s):
              u=up(s)
              if re.search(r"\bREQUIRED\b|(^|[|/ ])R($|[|/ ])|必須|必填",u): return "REQUIRED"
              if re.search(r"\bOPTIONAL\b|(^|[|/ ])O($|[|/ ])|可選|選用",u): return "OPTIONAL"
              if re.search(r"\bNOT[_ /-]*APPLICABLE\b|\bN/A\b|不適用|(^|[|/ ])N($|[|/ ])",u): return "NOT_APPLICABLE"
              return ""

          rows=collections.defaultdict(list)
          declared=collections.defaultdict(bool)
          bound_ops=collections.defaultdict(lambda:collections.defaultdict(list))
          rejected_identity_substring_tables=[]
          entity_table_count=0

          for page,fn in PAGE_DOCS.items():
              for t in parse(fn):
                  h=t["headers"]; hu=[up(x) for x in h]
                  ei=exact_idx(h,EH)
                  if ei is None:
                      euid=exact_idx(h,EUID); cname=exact_idx(h,CNAME)
                      if euid is not None and cname is not None: ei=cname
                  if ei is None:
                      if any("IDENTITY" in x and "ENTITY" in x for x in hu):
                          rejected_identity_substring_tables.append({"page":page,"file":fn,"table":t["table"],"headers":h})
                      continue
                  entity_table_count+=1
                  isbe=up(h[ei]) in BEH
                  appi=exact_idx(h,APP_HEADERS); authi=exact_idx(h,AUTH_HEADERS)

                  # Exact operation-text columns.
                  text_cols=[i for i,x in enumerate(hu) if x in OP_TEXT_HEADERS]
                  # Wide lifecycle matrix columns.
                  wide={}
                  for i,x in enumerate(h):
                      hits=op_hits(x)
                      for op in hits: wide.setdefault(op,[]).append(i)

                  for ri,row in enumerate(t["rows"],2):
                      if ei>=len(row):continue
                      raw=norm(row[ei])
                      if not raw or raw in {"—","-","N/A","NA"}:continue
                      name=canon(page,raw); key=(page,name)
                      rows[key].append({"file":fn,"table":t["table"],"row":ri,"headers":h,"cells":row,"raw_identity":raw})
                      declared[key]|=isbe
                      row_app=app_value(row[appi]) if appi is not None and appi<len(row) else ""
                      auth=norm(row[authi]) if authi is not None and authi<len(row) else ""

                      for op,cols in wide.items():
                          vals=[norm(row[i]) for i in cols if i<len(row) and norm(row[i])]
                          if not vals:continue
                          rawv=" | ".join(vals)
                          av=row_app or app_value(rawv)
                          bound_ops[key][op].append({"source":"WIDE","value":rawv,"applicability":av,"authority":auth,"table":t["table"],"row":ri})

                      for i in text_cols:
                          if i>=len(row) or not norm(row[i]):continue
                          rawv=norm(row[i])
                          for op in op_hits(rawv):
                              av=row_app or app_value(rawv)
                              bound_ops[key][op].append({"source":"LONG","value":rawv,"applicability":av,"authority":auth,"table":t["table"],"row":ri})

          # Classify from current bytes only.
          classifications=[]
          eligibility_unresolved=[]
          split_required=[]
          for key,src in sorted(rows.items()):
              page,name=key
              rowtext=" || ".join(" | ".join(r["cells"]) for r in src)
              if key in FIXED:
                  cat=FIXED[key]; reason="CURRENT_SOURCE_BACKED_FIXED_RULE"
              elif declared[key]:
                  cat="TRUE_BUSINESS_ENTITY"; reason="EXPLICIT_BUSINESS_ENTITY_DECLARATION"
              elif EXT_RE.search(name):
                  cat="EXTERNAL_REF"; reason="EXTERNAL_REFERENCE"
              elif REF_RE.search(name):
                  cat="REFERENCE_ONLY"; reason="REFERENCE_IDENTITY"
              elif PROJ_RE.search(name):
                  cat="READ_PROJECTION"; reason="READ_PROJECTION"
              elif SUPPORT_RE.search(name):
                  cat="SUPPORTING_ARTIFACT"; reason="SUPPORT_ARTIFACT"
              elif VALUE_RE.search(name):
                  cat="VALUE_OBJECT"; reason="VALUE_OBJECT"
              elif bound_ops[key] and any(EFFECT_RE.search(e["value"]) for es in bound_ops[key].values() for e in es):
                  cat="TRUE_BUSINESS_ENTITY"; reason="ENTITY_BOUND_EFFECTFUL_OPERATION"
              elif STATE_RE.search(rowtext) or ORDER_RE.search(rowtext) or ID_RE.search(rowtext):
                  cat="TRUE_BUSINESS_ENTITY"; reason="OWN_IDENTITY_STATE_ORDERING"
              elif bound_ops[key] and all(not EFFECT_RE.search(e["value"]) for es in bound_ops[key].values() for e in es):
                  cat="READ_PROJECTION"; reason="READ_ONLY_BOUND_OPERATION"
              else:
                  cat="REVIEW_REQUIRED"; reason="INSUFFICIENT_CURRENT_AUTHORITY"
                  eligibility_unresolved.append({"page":page,"identity":name,"source_rows":src})

              if cat=="TRUE_BUSINESS_ENTITY" and re.search(r"\\s+/\\s+",name):
                  legal_compound = {
                    ("KB-01","Experience / Replay"),
                    ("SOC-01","ExternalResult / Record"),
                    ("SYS-01","Sandbox / Validation Run"),
                  }
                  if key not in legal_compound:
                      split_required.append({"page":page,"identity":name,"source_rows":src})
              classifications.append({"page":page,"identity":name,"category":cat,"reason":reason,"source_rows":src})

          true_keys={(x["page"],x["identity"]) for x in classifications if x["category"]=="TRUE_BUSINESS_ENTITY"}
          counts=collections.Counter(x["category"] for x in classifications)

          # 23-operation applicability denominator only for admitted TRUE Business Entity.
          app_rows=[]
          for key in sorted(true_keys):
              for op in OPS:
                  ev=bound_ops[key].get(op,[])
                  apps=sorted(set(e["applicability"] for e in ev if e["applicability"]))
                  if len(apps)==1 and apps[0] in {"REQUIRED","OPTIONAL","NOT_APPLICABLE"}:
                      decision=apps[0]
                      if decision=="NOT_APPLICABLE" and not any(e["authority"] for e in ev):
                          status="N_A_AUTHORITY_MISSING"
                      else:
                          status="EXPLICIT"
                  elif len(apps)>1:
                      decision="AMBIGUOUS"; status="AMBIGUOUS"
                  else:
                      decision=""; status="MISSING_APPLICABILITY"
                  app_rows.append({
                    "page":key[0],"entity":key[1],"operation":op,
                    "decision":decision,"status":status,"evidence":ev
                  })

          app_counts=collections.Counter(x["decision"] or x["status"] for x in app_rows)
          unresolved_app=[x for x in app_rows if x["status"]!="EXPLICIT"]
          required_rows=[x for x in app_rows if x["decision"]=="REQUIRED" and x["status"]=="EXPLICIT"]
          optional_rows=[x for x in app_rows if x["decision"]=="OPTIONAL" and x["status"]=="EXPLICIT"]
          na_rows=[x for x in app_rows if x["decision"]=="NOT_APPLICABLE" and x["status"]=="EXPLICIT"]

          # Exact hierarchy edge audit.
          HMAP={
            "parent_identity":{"PARENT","PARENT ID","PARENT UID","父層","父項","父"},
            "child_identity":{"CHILD","CHILD ID","CHILD UID","子層","子項","子"},
            "cardinality":{"CARDINALITY","基數"},
            "creation_entry":{"CREATION ENTRY","CREATE ENTRY","新增入口","建立入口"},
            "payload_or_reference_binding":{"PAYLOAD / REFERENCE BINDING","REFERENCE BINDING","REF BINDING","PAYLOAD","引用綁定","參照綁定"},
            "ordering_semantics":{"ORDERING","ORDERING SEMANTICS","排序"},
            "permission":{"PERMISSION","權限"},
            "state_dependency":{"STATE DEPENDENCY","狀態依賴"},
            "version_dependency":{"VERSION DEPENDENCY","版本依賴"},
            "move_or_reparent":{"MOVE / REPARENT","MOVE OR REPARENT","REPARENT","移動／改掛","變更父層"},
            "archive_or_delete_propagation":{"ARCHIVE / DELETE PROPAGATION","DELETE PROPAGATION","封存／刪除傳播","級聯刪除"},
            "upstream_change_impact":{"UPSTREAM CHANGE IMPACT","IMPACT","上游變更影響","影響"},
            "downstream_revalidation":{"DOWNSTREAM REVALIDATION","REVALIDATION","下游重驗","重新驗證"},
            "authority_evidence":{"AUTHORITY EVIDENCE","AUTHORITY","EVIDENCE","依據","證據"},
          }
          hierarchy=[]
          for page,fn in PAGE_DOCS.items():
              for t in parse(fn):
                  h=t["headers"]
                  ix={f:exact_idx(h,names) for f,names in HMAP.items()}
                  pi,ci=ix["parent_identity"],ix["child_identity"]
                  if pi is None or ci is None or pi==ci:continue
                  for ri,row in enumerate(t["rows"],2):
                      pv=norm(row[pi]) if pi<len(row) else ""; cv=norm(row[ci]) if ci<len(row) else ""
                      if not pv and not cv:continue
                      rec={"page":page,"file":fn,"table":t["table"],"row":ri}
                      for f,i in ix.items(): rec[f]=norm(row[i]) if i is not None and i<len(row) else ""
                      rec["missing_fields"]=[f for f in HMAP if not rec.get(f)]
                      hierarchy.append(rec)
          hierarchy_incomplete=[x for x in hierarchy if x["missing_fields"]]

          # Post-remediation source signatures.
          forbidden_exact=[
            ("CORE-01","AssistantSummary / CoreEvaluation"),
            ("CORE-01","ConversationThread / Message"),
            ("CORE-01","HumanDecision / StructuredDecision"),
            ("DEV-01","Campaign / Audience"),
            ("DEV-01","Discovery Profile / Topic"),
            ("KB-01","KnowledgeAcquisitionIntent / Run"),
            ("SYS-01","Conversation / Thread"),
          ]
          remaining_forbidden=[{"page":p,"identity":n} for p,n in forbidden_exact if (p,n) in rows]

          summary={
            "marker":"ACPOS-20260922-BATCH-80-POST-REMEDIATION-FRESH-ENTITY-REAUDIT-V1",
            "base_head":EXPECTED_PARENT,
            "docx_files":len(ALL_DOCS),
            "page_docs":len(PAGE_DOCS),
            "entity_tables":entity_table_count,
            "identity_substring_false_positive_tables_rejected":len(rejected_identity_substring_tables),
            "canonical_identity_count":len(rows),
            "alias_rows_collapsed":sum(max(0,len(v)-1) for v in rows.values()),
            "category_counts":dict(counts),
            "true_business_entities":len(true_keys),
            "eligibility_unresolved":len(eligibility_unresolved),
            "split_required_true_entities":len(split_required),
            "remaining_forbidden_pre_remediation_compound_rows":len(remaining_forbidden),
            "operation_types":len(OPS),
            "entity_operation_applicability_denominator":len(app_rows),
            "required_explicit":len(required_rows),
            "optional_explicit":len(optional_rows),
            "not_applicable_explicit_with_authority":len(na_rows),
            "applicability_unresolved":len(unresolved_app),
            "applicability_status_counts":dict(collections.Counter(x["status"] for x in app_rows)),
            "hierarchy_edges":len(hierarchy),
            "hierarchy_edges_incomplete":len(hierarchy_incomplete),
          }
          out={
            "summary":summary,
            "classification":classifications,
            "eligibility_unresolved":eligibility_unresolved,
            "split_required":split_required,
            "remaining_forbidden":remaining_forbidden,
            "applicability_rows":app_rows,
            "applicability_unresolved":unresolved_app,
            "hierarchy":hierarchy,
            "hierarchy_incomplete":hierarchy_incomplete,
            "rejected_identity_substring_tables":rejected_identity_substring_tables,
          }
          Path("__batch80_fresh_entity_reaudit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch80_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH80_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH80_ELIGIBILITY_UNRESOLVED="+json.dumps([{"page":x["page"],"identity":x["identity"]} for x in eligibility_unresolved],ensure_ascii=False))
          print("BATCH80_SPLIT_REQUIRED="+json.dumps([{"page":x["page"],"identity":x["identity"]} for x in split_required],ensure_ascii=False))
          print("BATCH80_FORBIDDEN_REMAINS="+json.dumps(remaining_forbidden,ensure_ascii=False))

          if eligibility_unresolved: raise SystemExit("ELIGIBILITY_UNRESOLVED_NONZERO")
          if split_required: raise SystemExit("SPLIT_REQUIRED_NONZERO")
          if remaining_forbidden: raise SystemExit("PRE_REMEDIATION_COMPOUND_REMAINS")
          if rejected_identity_substring_tables and any("IDENTITY" in " ".join(x["headers"]).upper() for x in rejected_identity_substring_tables):
              # Rejection is expected; presence is diagnostic, not failure.
              pass
          print("BATCH80_ENTITY_ELIGIBILITY_CLOSED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch80-post-remediation-fresh-entity-reaudit
          path: |
            __batch80_fresh_entity_reaudit.json
            __batch80_summary.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch80_fresh_entity_reaudit.json __batch80_summary.json
          git config user.name "acpos-batch80-reaudit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch80_post_remediation_fresh_entity_reaudit.yml" ]; then
            printf '%s\n' "${staged[@]}"; exit 1
          fi
          git commit -m "chore(acpos): close batch 80 fresh entity reaudit"
          git push origin HEAD:0921acpos
