schema_version: 7
artifact_uid: GOV-COMP-SPECIFICATION-MUTATION-CONTROL
artifact_type: GOVERNANCE_SPECIFICATION_COMPONENT
normative_status: ACTIVE_CURRENT_GOVERNANCE_COMPONENT
formal_current_authority: true
layer_classification: POLICY
control_precedence: HIGHEST_CURRENT_SPECIFICATION_MUTATION_CONTROL
canonical_rule_registry_ref: governance/specifications/current/CANONICAL_RULE_REGISTRY.yaml
canonical_rule_refs:
- GOV-RULE-ANTI-DRIFT-008
- GOV-RULE-ANTI-DRIFT-009
- GOV-RULE-ANTI-DRIFT-010
purpose:
  statement: Current reusable policy is immutable throughout a governed execution/validation cycle. Ordinary defects are repaired at their owning layer. Normative change requires explicit
    exact-scope authorization and atomic successor promotion.
  default_decision: DENY_MUTATION
  fail_closed: true
non_authorities:
- CONSTRUCTION_NEED
- IMPLEMENTATION_NEED
- PRODUCT_GAP
- TEST_FAILURE
- VALIDATOR_OR_HARNESS_FAILURE
- RUNTIME_FAILURE
- EVIDENCE_OR_STATE_FAILURE
- STALE_HASH
- DISPLAY_VERSION_CHANGE
- AI_INFERENCE
- AI_AUTOFILL
- CONVENIENCE_OR_GATE_PASSING
- CANDIDATE_LEDGER_ENTRY_BY_ITSELF
explicit_change_authorization:
  required: true
  authority_source: EXPLICIT_USER_DIRECTIVE
  exact_scope_required: true
  reusable_for_unrelated_change: false
  ai_may_expand_scope: false
  authorization_receipt_must_preexist_spec_mutation_commit: true
  same_commit_authorization_fabrication: BLOCK
  atomic_specification_update_required: true
  immutable_governance_uid_must_change_when_normative_content_changes: true
  registry_manifest_binding_must_change_in_same_atomic_commit: true
execution_cycle_freeze_control:
  freeze_required_before_validation_or_governed_execution: true
  frozen_governance_uid_must_be_recorded: true
  ordinary_cycle_mutation: false
  results_may_mix_multiple_governance_uids: false
  product_or_contract_gap_owner: PRODUCT_OR_CONTRACT_LAYER
  validator_or_harness_bug_owner: TEST_OR_VALIDATION_IMPLEMENTATION
  runtime_bug_owner: IMPLEMENTATION_OR_RUNTIME
  evidence_state_bug_owner: NON_NORMATIVE_EVIDENCE_OR_STATE
  external_authority_gap: PRESERVE_UNRESOLVED_UNTIL_AUTHORITATIVE_RESOLUTION_OR_FORMAL_NON_APPLICABILITY
finding_intake:
  candidate_ledger_identity: NON_NORMATIVE_SPECIFICATION_CHANGE_CANDIDATE_LEDGER
  every_suspected_reusable_defect_recorded: true
  finding_is_normative_change: false
  finding_may_auto_promote: false
  candidate_may_be_active_rule_before_authorized_promotion: false
successor_candidate_bootstrap_control:
  released_predecessor_mutation: FORBIDDEN
  candidate_branch_role: GOVERNANCE_REVISION_CANDIDATE
  candidate_branch_must_be_distinct_from_predecessor: true
  candidate_branch_must_descend_from_exact_predecessor_head: true
  preexisting_authorization_record_required: true
  allowed_authorization_record_kinds:
  - EXTERNAL_EXPLICIT_USER_DIRECTIVE
  - GITHUB_GOVERNANCE_CHANGE_RECORD
  authorization_record_required_fields:
  - authority_source
  - authorized_scope
  - predecessor_branch
  - predecessor_head_sha
  - candidate_branch
  - created_before_normative_mutation
  candidate_registry_must_bind_authorization_record: true
  candidate_registry_must_bind_exact_predecessor_head: true
  candidate_registry_must_expose_candidate_governance_identity: true
  candidate_scope_must_be_subset_of_authorized_scope: true
  authorization_record_may_document_preexisting_external_directive: true
  authorization_record_may_create_new_authority_in_same_normative_commit: false
  released_predecessor_history_preservation_required: true
  candidate_product_execution: FORBIDDEN
  candidate_product_completion_credit: 0
  missing_or_unverifiable_bootstrap_evidence: BLOCK
consolidated_promotion_control:
  explicit_user_directive_required: true
  preexisting_authorization_required: true
  new_immutable_governance_uid_required: true
  registry_manifest_atomic_update_required: true
  canonical_rule_registry_binding_required: true
  local_rule_vocabulary_fork_forbidden: true
  canonical_rule_registry_uid_digest_match_required: true
  active_consumer_inventory_required: true
  stale_predecessor_pin_scan_required: true
  projection_atomicity_required: true
  portability_validation_required: true
  policy_layer_contamination_scan_required: true
  promotion_invalidates_affected_old_closure_evidence: true
  fresh_reverification_required: true
reference_migration_atomicity_control:
  applies_to:
  - DELETE
  - RENAME
  - MOVE
  - SUPERSEDE
  - REPLACEMENT
  - ENTRYPOINT_CHANGE
  - EXECUTABLE_OWNER_CHANGE
  - GOVERNANCE_PROMOTION
  complete_active_reverse_consumer_set_required: true
  reverse_consumer_set_must_be_frozen_against_prewrite_commit_and_tree: true
  required_inventory_classes:
  - ACTIVE_WORKFLOW_REFERENCES
  - WORKFLOW_INVOKED_GOVERNANCE_PYTHON_CONSUMERS
  - TRANSITIVE_EXECUTABLE_OWNER_CONSUMERS
  - DERIVED_TRUST_IDENTITY_CONSUMERS
  - AUTHORITATIVE_DENOMINATOR_CONSUMERS
  - LIFECYCLE_OUTPUT_EXPECTATION_CONSUMERS
  - ACTIVE_PROJECTORS
  partial_consumer_migration: BLOCK
  old_target_retirement_before_complete_migration: BLOCK
  all_affected_active_references_must_migrate_in_same_atomic_commit: true
  persisted_head_reference_integrity_gate_required: true
  full_line_regression_required_after_reference_migration: true
  zero_stale_or_broken_current_reference_required: true
  zero_unjustified_residual_required: true
  commit_message_or_declared_migration_count_is_closure_evidence: false
  required_machine_gate: governance/ci/validate_active_consumer_reference_integrity.py
post_write_reconciliation_control:
  same_transaction_as_promotion_required: true
  complete_registered_current_projector_rebuild_required: true
  complete_active_and_transitive_consumer_sweep_required: true
  residual_classification_requires_content_semantic_review: true
  count_only_cleanup_claim: BLOCK
  superseded_current_projector_required_count: 0
  stale_current_reference_required_count: 0
  unjustified_residual_required_count: 0
  unknown_residual_disposition: BLOCK
  historical_failure_may_receive_current_credit: false
  terminal_run_conclusion_must_be_observed_before_current_closure_projection: true
  inner_step_pass_may_substitute_terminal_run_pass: false
  same_run_preterminal_self_projection_of_terminal_pass: FORBIDDEN
  required_machine_gate: governance/ci/validate_active_consumer_reference_integrity.py
fatal_specification_contradiction_exception:
  default: DENY
  requires_proven_current_policy_self_contradiction: true
  ordinary_product_validator_runtime_evidence_or_external_authority_gap_qualifies: false
  new_explicit_authorization_required: true
  ai_may_self_authorize: false
promotion_gate:
  required_sequence:
  - RECORD_FINDING_OR_EXPLICIT_CHANGE_REQUEST
  - VERIFY_PREEXISTING_EXACT_SCOPE_AUTHORIZATION
  - CLASSIFY_LAYER_AND_CANONICAL_OWNER
  - RESOLVE_CANONICAL_RULE_UID_AND_REGISTRY_DIGEST
  - FREEZE_COMPLETE_ACTIVE_REVERSE_CONSUMER_SET
  - APPLY_ONLY_AUTHORIZED_NORMATIVE_CHANGE
  - ASSIGN_NEW_IMMUTABLE_GOVERNANCE_UID
  - ATOMICALLY_MIGRATE_ACTIVE_REFERENCES_DERIVED_IDENTITIES_DENOMINATORS_AND_PROJECTORS
  - UPDATE_REGISTRY_MANIFEST_CANONICAL_RULE_BINDING_ATOMICALLY
  - POST_WRITE_RECONCILE_COMPLETE_PROJECTORS_CONSUMERS_AND_RESIDUALS
  - VERIFY_PERSISTED_HEAD_REFERENCE_INTEGRITY
  - VERIFY_ACTIVE_CONSUMER_PROJECTIONS
  - RUN_CONTAMINATION_CONTRADICTION_PORTABILITY_GATES
  - RUN_GOVERNANCE_REGRESSION_AND_STRESS_GATES
  - VERIFY_TERMINAL_RUN_CONCLUSION
  - FRESHLY_REVERIFY_AFFECTED_EXECUTION_SCOPE
  unauthorized_scope_expansion: BLOCK
status: ACTIVE
structured_mutation_selector_control:
  applies_to:
  - GOVERNANCE_POLICY
  - RUN_STATE
  - REGISTRY
  - MANIFEST
  - EVIDENCE
  - STRUCTURED_SOURCE
  - EXECUTABLE_SOURCE
  typed_structural_selector_required: true
  whole_document_raw_text_primary_selector: FORBIDDEN
  lexical_match_may_be_secondary_precondition_only: true
  global_uniqueness_claim_requires_schema_or_registry_guarantee: true
  zero_match: BLOCK
  ambiguous_multiple_match: BLOCK
  first_or_nearest_match_fallback: FORBIDDEN
  parse_before_mutation: true
  reparse_after_mutation: true
  exact_write_set_required: true
  unrelated_sibling_preservation_required: true
  executable_semantic_mutation_requires_ast_cst_parser_or_equivalent_bounded_selector: true
  raw_source_spelling_is_semantic_authority: false
  impacted_reverse_consumer_revalidation_required: true
  governance_test_integrity_pass_product_stage_credit: 0
  required_machine_gate: governance/ci/validate_structured_mutation_safety.py
