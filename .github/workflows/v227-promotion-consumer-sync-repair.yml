name: V2.2.7 Promotion Consumer Sync Repair

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/repair_v227_promotion_consumer_sync.py'

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(governance): stage v2.2.7 consumer sync repair' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Assert authorization and Current governance
        shell: bash
        run: |
          set -euo pipefail
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-PROFILE-TOKEN-PROMOTION-CONSUMER-SYNC-R1.yaml
          grep -q 'GOV-REV-20260919-PROFILE-TOKEN-DECONTAMINATION-HARDENING' governance/specifications/REGISTRY.yaml
      - name: Compile repair helper
        run: python -m py_compile .github/governance-maintenance/repair_v227_promotion_consumer_sync.py
      - name: Repair all derived semantic-baseline consumers and source identity
        run: python .github/governance-maintenance/repair_v227_promotion_consumer_sync.py
      - name: Verify repair transaction hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d governance/test/temporary
          git status --short
      - name: Persist atomic derived-consumer synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "fix(governance): synchronize v2.2.7 semantic baseline consumers" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260919-PROFILE-TOKEN-PROMOTION-CONSUMER-SYNC-R1" \
            -m "Spec-Change-Scope: V227_PROMOTION_DERIVED_CONSUMER_SYNC_REPAIR"
          git push origin HEAD:rebuild-v2.1.1
