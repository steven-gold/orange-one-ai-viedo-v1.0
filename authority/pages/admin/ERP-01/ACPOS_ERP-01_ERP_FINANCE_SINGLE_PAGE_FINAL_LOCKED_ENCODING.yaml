gates:
- gate_uid: ERP-01-GATE-PAGE
  condition: identity + page:admin:ERP-01 VIEW + effective backend L1 erp_finance + explicit account permission + scope + condition + classification
    mask where applicable + audit
- gate_uid: ERP-01-GATE-FINANCE
  condition: page gate + finance.read for raw finance values/actions + exact authorized scope; otherwise mask/non-amount status only
- gate_uid: ERP-01-GATE-CONNECTOR-READ
  condition: page gate + erp.connector.read + exact source field permission/mask
- gate_uid: ERP-01-GATE-CONNECTOR-WRITE
  condition: page gate + erp.connector.write + exact current registered authority schema + expected_version + idempotency + state_guard + audit
- gate_uid: ERP-01-GATE-CONNECTOR-VALIDATE
  condition: page gate + erp.connector.validate + exact connector/version + state_guard + expected_version/idempotency + audit
- gate_uid: ERP-01-GATE-MAPPING-VALIDATE
  condition: page gate + erp.mapping.validate + exact mapping/version/schema + state_guard + expected_version/idempotency + audit
- gate_uid: ERP-01-GATE-SYNC-READ
  condition: page gate + exact source read permission + exact sync/snapshot/failure reference
- gate_uid: ERP-01-GATE-SNAPSHOT-REFRESH
  condition: page gate + exact refreshERPSnapshot permission + explicit scope/version + state_guard + idempotency + audit
- gate_uid: ERP-01-GATE-SYNC-CREATE
  condition: page gate + erp.sync.request + exact CreateERPSyncJobRequest + explicit connector/scope/version + idempotency + audit
- gate_uid: ERP-01-GATE-SYNC-RETRY
  condition: page gate + erp.sync.retry + exact failed/retry-eligible sync job + state_guard + expected_version/idempotency + audit
permission_contract:
  authorization_source: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY
  role_name_authorization: FORBIDDEN
  department_membership_as_allow: FORBIDDEN
  frontend_hide_is_not_authorization: true
  current_page_permissions:
  - erp.connector.read
  - erp.connector.write
  - erp.connector.validate
  - erp.mapping.validate
  - erp.sync.request
  - erp.sync.retry
  - erp.snapshot.read
  - finance.read
  server_guard: identity + exact account page/section/action/control/API/field permission + scope + condition + classification/mask + state_guard
    + expected_version_when_write + idempotency_when_side_effect + audit
  denied_behavior: Do not render denied control/value or expose masked amount/secret; direct URL/operation remains denied server-side.
state_model:
  common:
  - LOADING
  - READY
  - EMPTY
  - ERROR
  - POLICY_BLOCKED
  - VERSION_CONFLICT
  - REVIEW_REQUIRED
  - EXTERNAL_PENDING
  - READ_ONLY
  - ARCHIVED
  erp_specific:
  - CONNECTOR_UNCONFIGURED
  - CONNECTOR_CONFIGURING
  - CONNECTOR_VALIDATING
  - CONNECTOR_READY
  - CONNECTOR_DEGRADED
  - SNAPSHOT_STALE
  - SNAPSHOT_SYNCING
  - SNAPSHOT_FAILED
  - DATA_INCOMPLETE
  source_transition_examples:
  - 'createERPConnector: UNCONFIGURED -> CONFIGURING'
  - 'updateERPConnector: CONFIGURING -> VALIDATING'
  - 'validateERPConnector: VALIDATING -> READY | DEGRADED | FAILED'
  ui_rule: View tab switch never mutates these business states.
errors:
- error_uid: ERP-01-ERR-AUTH
  when: Any exact page/section/control/API/field permission, scope, condition or mask gate denies
  recovery: Hide/deny protected surface; preserve actual server reason allowed by policy; never infer allow.
- error_uid: ERP-01-ERR-SECRET
  when: Secret value would be rendered/stored in page authority
  recovery: BLOCK; use secret_reference_id only.
- error_uid: ERP-01-ERR-VERSION
  when: Expected version or exact source reference is stale/missing
  recovery: Return VERSION_CONFLICT; reload exact projection; do not use latest/current/default alias for write.
- error_uid: ERP-01-ERR-CONNECTOR
  when: Connector or mapping validation fails
  recovery: Keep exact state DEGRADED/FAILED as returned, show permitted failure reference, no fabricated READY.
- error_uid: ERP-01-ERR-SYNC
  when: Sync/snapshot refresh fails or is partial
  recovery: Keep SNAPSHOT_FAILED/DATA_INCOMPLETE/actual state; no COMPLETE/0 substitution; retry only registered retry-eligible job.
- error_uid: ERP-01-ERR-FINANCE
  when: Finance data missing, stale, incomplete or finance.read denied
  recovery: Show — / stale/incomplete/masked state; never synthesize amount or zero.
- error_uid: ERP-01-ERR-UNREGISTERED-WRITE
  when: Revenue/expense/ledger/budget/external ERP write action is requested without active current registered authority operation
  recovery: BLOCK + REPORT_AUTHORITY_GAP; do not import archive handbook operation or create second finance service.
- error_uid: ERP-01-ERR-UNDEFINED
  when: Any unregistered field/operation/route/service requested
  recovery: BLOCK + REPORT_AUTHORITY_GAP.
qa_runtime_closure:
  source_completion_tests:
  - UT-ERP-SECRET-BOUNDARY
  - UT-ERP-RETRY-BOUND
  - E2E-ERP-CONNECTOR-MAPPING-SNAPSHOT-SYNC
  - E2E-ERP-FINANCE-PERMISSION
  - E2E-ERP-RESTART-PERSISTENCE
  source_handoff_out:
  - FinanceCapacityProjection
  runtime_closure_validator: 14_acceptance/erp_runtime_closure.py
  migration: 11_migrations/0013_erp_runtime_closure
  execution_status: NOT_EXECUTED by this artifact
hard_locks:
- Only admin:ERP-01 is the current ERP UI page in this authority; admin:ERP-02 standalone UI is superseded by same-page composition only, while
  its owner/service/operations/data/permissions are preserved.
- ERPConnectorService remains the sole connector/snapshot/sync owner; FinanceGuardrailService remains the sole finance/capacity/forecast owner.
- No current page writes revenue, expense, ledger, budget reallocation, statutory accounting data or external ERP data unless a future active
  current registered authority operation explicitly authorizes it.
- ERP_write_from_ACPOS is forbidden.
- missing_value_as_zero is forbidden; missing/unavailable = — or exact incomplete/stale/error state.
- Raw finance/provider cost values require explicit finance.read/provider.cost.read as applicable; otherwise masked/non-amount status only.
- Secret values never render or embed; only Secret Reference ID is handled.
- All 29 current registered authority ERP-01/ERP-02 source controls remain mapped/accounted for; no backend action is invented.
- Finance / ERP Connection / Sync & Data Quality are same-page UI views only; no second route or parallel page family.
- No fake KPI, chart, trend, connector health, finance value, snapshot status, completeness, freshness, failure or audit record.
- Unknown authority -> BLOCK + REPORT_AUTHORITY_GAP.
- FILE_SPEC_COMPLETE does not mean runtime/system implementation; Sandbox/Regression/E2E/deployment remain NOT_EXECUTED.
acceptance:
- uid: ERP-01-ACC-01
  item: Single Current Page
  condition: Only admin:ERP-01 is current ERP UI; ERP-02 standalone navigation is not reconstructed.
- uid: ERP-01-ACC-02
  item: current registered authority Owner Reuse
  condition: ERPConnectorService + FinanceGuardrailService reused; no second service/registry/store.
- uid: ERP-01-ACC-03
  item: Source Control Coverage
  condition: 17 ERP-01 + 12 ERP-02 source controls = 29 accounted for.
- uid: ERP-01-ACC-04
  item: Source Operation Coverage
  condition: All 14 unique current current registered authority ERP operations are referenced; no invented backend operation.
- uid: ERP-01-ACC-05
  item: Finance Boundary
  condition: Finance view is read/export only; no unregistered revenue/expense/ledger/budget write control.
- uid: ERP-01-ACC-06
  item: External ERP Boundary
  condition: No ERP_write_from_ACPOS control/path.
- uid: ERP-01-ACC-07
  item: Secret Boundary
  condition: Only secret_reference_id; no raw secret render/storage in page authority.
- uid: ERP-01-ACC-08
  item: Data Truth
  condition: Missing = — / exact stale/incomplete/error state; no zero substitution or fake values.
- uid: ERP-01-ACC-09
  item: Authorization
  condition: Account permission + scope/condition/state/version/idempotency/audit remain server-side gates.
- uid: ERP-01-ACC-10
  item: Same-page UX
  condition: Finance / Connector / Sync tabs are UI context only; audit/details secondary drawer; no route fragmentation.
- uid: ERP-01-ACC-11
  item: Layout
  condition: 56px context + 52px view bar + 72/28 workspace + 480-560px detail drawer + 56px action dock.
- uid: ERP-01-ACC-12
  item: No Fake UI
  condition: No decorative KPI/charts/trend deltas/sample finance or connector values.
- uid: ERP-01-ACC-13
  item: Form Authority
  condition: Effectful requests use exact current registered authority schema or explicit source-by-operation schema binding; no page-union inference.
- uid: ERP-01-ACC-14
  item: State Truth
  condition: Connector/snapshot states use current registered authority state vocabulary; view switch does not fake business state.
- uid: ERP-01-ACC-15
  item: Runtime Truthfulness
  condition: Spec is FILE_SPEC_COMPLETE only; source runtime closure tests remain NOT_EXECUTED here.
