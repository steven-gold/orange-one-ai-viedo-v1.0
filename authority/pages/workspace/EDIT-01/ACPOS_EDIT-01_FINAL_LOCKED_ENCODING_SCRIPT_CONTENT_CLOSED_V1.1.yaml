    label: 剪輯待辦
    size: FIELD_M
    action_or_behavior: READ_ONLY
    enable_gate: EDIT-01-GATE-SOURCE；Inbound EDIT task exists
    default_state: —
  - control_uid: EDIT-01-LBL-CURRENT-STAGE
    order: '14'
    type: status
    label: 目前 Stage
    size: FIELD_M
    action_or_behavior: READ_ONLY
    enable_gate: EDIT-01-GATE-SOURCE；PROJECT_TASK runtime active
    default_state: —
  - control_uid: EDIT-01-LBL-STAGE-SCORE
    order: '15'
    type: status
    label: Stage Score
    size: FIELD_M
    action_or_behavior: READ_ONLY
    enable_gate: EDIT-01-GATE-SOURCE；Stage evaluation exists
    default_state: —
