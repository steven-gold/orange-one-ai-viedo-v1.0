name: KB-01 preview seal once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current new
        uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Build exact current source
        working-directory: source
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install temporary Chromium tooling
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"

      - name: Capture KB-01 sealed fail-closed snapshot
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/kb01-preview-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/kb01-preview-next.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/knowledge >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          const views = [
            'KB-01-VIEW-OVERVIEW',
            'KB-01-VIEW-SOURCE',
            'KB-01-VIEW-SEARCH',
            'KB-01-VIEW-EXPERIENCE',
            'KB-01-VIEW-REVIEW',
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:900}});
            const staticPaths = new Set();
            const pageErrors = [];
            const failed = [];
            page.on('request', request => {
              const u = new URL(request.url());
              if (u.pathname.startsWith('/_next/static/')) staticPaths.add(u.pathname);
            });
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('requestfailed', request => failed.push(`${request.method()} ${request.url()} ${request.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:3000/admin/knowledge',{waitUntil:'networkidle'});
            const root = page.locator('[data-page-uid="admin:KB-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(() => document.querySelector('[data-page-uid="admin:KB-01"]')?.getAttribute('data-page-state') === 'ERROR',{timeout:15000});
            assert.equal(await root.getAttribute('data-section-registry-count'),'16');
            assert.equal(await root.getAttribute('data-component-registry-count'),'22');
            assert.equal(await root.getAttribute('data-field-registry-count'),'127');
            assert.equal(await root.getAttribute('data-control-registry-count'),'27');
            assert.equal(await root.getAttribute('data-action-registry-count'),'21');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');

            const fragments = {};
            for (const view of views) {
              await page.locator(`[data-view-uid="${view}"]`).click();
              await page.waitForFunction(expected => document.querySelector('[data-current-view]')?.getAttribute('data-current-view') === expected, view);
              fragments[view] = await page.locator('[data-current-view]').evaluate(element => element.outerHTML);
            }
            await page.locator('[data-view-uid="KB-01-VIEW-OVERVIEW"]').click();
            await page.waitForFunction(() => document.querySelector('[data-current-view]')?.getAttribute('data-current-view') === 'KB-01-VIEW-OVERVIEW');
            const activeClass = await page.locator('[data-view-uid="KB-01-VIEW-OVERVIEW"]').getAttribute('class');
            const inactiveClass = await page.locator('[data-view-uid="KB-01-VIEW-SOURCE"]').getAttribute('class');

            await page.evaluate(({fragments,activeClass,inactiveClass}) => {
              document.querySelectorAll('script').forEach(node => node.remove());
              document.querySelectorAll('link[rel="modulepreload"],link[rel="preload"][as="script"]').forEach(node => node.remove());
              document.querySelectorAll('[href^="/_next/static/"]').forEach(node => {
                const value = node.getAttribute('href');
                if (value) node.setAttribute('href',`./kb01-assets${value}`);
              });
              document.querySelectorAll('[src^="/_next/static/"]').forEach(node => {
                const value = node.getAttribute('src');
                if (value) node.setAttribute('src',`./kb01-assets${value}`);
              });
              document.querySelectorAll('[href^="/brand/"]').forEach(node => {
                const value = node.getAttribute('href');
                if (value) node.setAttribute('href',`.${value}`);
              });
              document.querySelectorAll('[src^="/brand/"]').forEach(node => {
                const value = node.getAttribute('src');
                if (value) node.setAttribute('src',`.${value}`);
              });
              document.documentElement.dataset.kb01PreviewMode = 'SEALED_STATIC_FAIL_CLOSED';
              const script = document.createElement('script');
              script.textContent = `(function(){const fragments=${JSON.stringify(fragments)};const activeClass=${JSON.stringify(activeClass)};const inactiveClass=${JSON.stringify(inactiveClass)};document.addEventListener('click',function(event){const button=event.target.closest('[data-view-uid]');if(!button)return;const view=button.getAttribute('data-view-uid');if(!view||!fragments[view])return;event.preventDefault();const workspace=document.querySelector('[data-current-view]');if(!workspace)return;workspace.outerHTML=fragments[view];document.querySelectorAll('[data-view-uid]').forEach(function(tab){const selected=tab.getAttribute('data-view-uid')===view;tab.setAttribute('aria-pressed',selected?'true':'false');tab.setAttribute('class',selected?activeClass:inactiveClass);});});})();`;
              document.body.appendChild(script);
            }, {fragments,activeClass,inactiveClass});

            fs.writeFileSync('/tmp/knowledge-admin.html', await page.content());
            fs.writeFileSync('/tmp/kb01-static-paths.txt',[...staticPaths].sort().join('\n')+'\n');
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

          rm -rf /tmp/kb01-assets
          mkdir -p /tmp/kb01-assets
          while IFS= read -r p; do
            test -n "$p" || continue
            src=".next${p#/_next}"
            dst="/tmp/kb01-assets${p}"
            test -f "$src" || { echo "missing static asset: $src" >&2; exit 1; }
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
          done < /tmp/kb01-static-paths.txt

      - name: Checkout cumulative preview
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          fetch-depth: 0
          path: previewrepo

      - name: Stage only isolated KB-01 preview files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf previewrepo/preview/kb01-assets
          mkdir -p previewrepo/preview/kb01-assets
          cp /tmp/knowledge-admin.html previewrepo/preview/knowledge-admin.html
          cp -R /tmp/kb01-assets/. previewrepo/preview/kb01-assets/
          cd previewrepo
          changed=$(git status --porcelain | awk '{print $2}')
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(preview/knowledge-admin\.html|preview/kb01-assets/)'; then
            echo 'Preview pollution outside KB-01 detected' >&2
            exit 1
          fi

      - name: Validate staged KB-01 static preview in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo/preview
          python3 -m http.server 4173 > /tmp/kb01-static.log 2>&1 &
          static_pid=$!
          trap 'kill $static_pid || true; cat /tmp/kb01-static.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/knowledge-admin.html >/dev/null; then break; fi
            sleep 1
          done
          cd ../../source
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const views = [
            'KB-01-VIEW-OVERVIEW',
            'KB-01-VIEW-SOURCE',
            'KB-01-VIEW-SEARCH',
            'KB-01-VIEW-EXPERIENCE',
            'KB-01-VIEW-REVIEW',
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors = [];
            const failed = [];
            const runtimeRequests = [];
            page.on('pageerror',error => pageErrors.push(String(error)));
            page.on('requestfailed',request => failed.push(`${request.method()} ${request.url()} ${request.failure()?.errorText||''}`));
            page.on('request',request => {
              const u = new URL(request.url());
              if (u.pathname.startsWith('/v1/')) runtimeRequests.push(`${request.method()} ${u.pathname}`);
            });
            await page.goto('http://127.0.0.1:4173/knowledge-admin.html',{waitUntil:'networkidle'});
            const root = page.locator('[data-page-uid="admin:KB-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            assert.equal(await root.getAttribute('data-page-state'),'ERROR');
            assert.equal(await root.getAttribute('data-section-registry-count'),'16');
            assert.equal(await root.getAttribute('data-component-registry-count'),'22');
            assert.equal(await root.getAttribute('data-field-registry-count'),'127');
            assert.equal(await root.getAttribute('data-control-registry-count'),'27');
            assert.equal(await root.getAttribute('data-action-registry-count'),'21');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert.equal(await page.locator('html').getAttribute('data-kb01-preview-mode'),'SEALED_STATIC_FAIL_CLOSED');
            for (const view of views) {
              await page.locator(`[data-view-uid="${view}"]`).click();
              assert.equal(await page.locator('[data-current-view]').getAttribute('data-current-view'),view);
            }
            for (const width of [1280,1440,1920]) {
              await page.setViewportSize({width,height:900});
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth-window.innerWidth);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(runtimeRequests,[]);
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('KB01_STATIC_PREVIEW_PASS');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Commit cumulative KB-01 preview seal
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/knowledge-admin.html preview/kb01-assets
          git commit -m 'sync(preview): seal isolated KB-01 page'
          parent=$(git rev-parse HEAD^)
          if git diff --name-only "$parent" HEAD | grep -Ev '^(preview/knowledge-admin\.html|preview/kb01-assets/)'; then
            echo 'Committed preview pollution outside KB-01 detected' >&2
            exit 1
          fi
          git push origin HEAD:acpos-live-preview
