authority:
  id: ACPOS_DEV-01_ENTERPRISE_AUTOMATION_SINGLE_PAGE_AUTHORITY
  page_uid: admin:DEV-01
  page_name_zh: 企業自動開發系統
  page_name_en: Enterprise Automation
  surface: ADMIN
  status: FINAL_LOCKED
  current_only: true
  file_spec_status: FILE_SPEC_COMPLETE
  system_implementation_status: NOT_EXECUTED
  single_page_workspace: true
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY V1.9
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY
  authorization_model: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY
  backend_l1_key: enterprise_development
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  purpose: One current Enterprise Automation workspace that reorganizes the existing R9 outreach capabilities into a five-stage
    same-page workflow without creating parallel outreach services, registries, databases, campaign engines, message engines
    or delivery engines.
  truthful_status_rule: This file completes page design/encoding only. Application code, master merge, runtime, Sandbox, Regression,
    E2E, external connector verification and production deployment are not executed by this file.
source_alignment:
  primary_authority: ACPOS_SINGLE_AUTHORITY_CONSTRUCTION_MASTER_FINAL.yaml / R9 Enterprise Social Outreach
  source_capability_clusters:
  - Company discovery jobs / allowed sources / rate-policy gates
  - Company master directory / identity resolution / contact points / evidence / merge
  - One-to-one outreach message Candidate / personalization / compliance / review
  - Campaign / audience batch / suppression / approval
  - Individual delivery / schedule / rate-quota / bounce-reply / kill switch
  current_consolidation_rule: Historical source page segmentation is non-executable provenance for this page authority. Current
    UI renders one admin:DEV-01 workspace only; preserved source services/operations/data remain single owners.
single_system_contract:
  current_ui_owner: admin:DEV-01
  service_owners:
  - REUSE OutreachDiscoveryService
  - REUSE OutreachDirectoryService
  - REUSE OutreachMessageService
  - REUSE OutreachBatchService
  - REUSE OutreachDeliveryService
  shared_governance_owner: REUSE EnterpriseSocialOutreachGovernance
  forbidden_parallel_components:
  - second enterprise outreach system
  - second company master database
  - second company identity resolver
  - second suppression registry
  - second campaign engine
  - second message candidate engine
  - second email delivery engine
  - second connector registry
  - second audit/evidence store
  - page-local provider/API-key system
workflow:
  canonical_user_flow: Discovery -> Company Directory -> Message Candidate -> Campaign / Audience Batch -> Individual Delivery
  stage_navigation: Same-page UI context only; never routes to separate current DEV pages.
  cross_stage_context: Carry exact authorized Company/Candidate/Campaign/Delivery references forward; never resolve formal
    actions from latest/current/default aliases.
  stages:
  - stage_uid: DEV-01-STAGE-01-DISCOVERY
    key: discovery
    label: 名單持續搜集
    short: Discovery
    owner: REUSE OutreachDiscoveryService
    purpose: 建立單次或持續企業名單搜集工作；持續模式由後端長期執行直到暫停或停止。
    content:
    - 搜尋任務設定
    - 單次 / 持續模式
    - 搜尋範圍
    - Allowed Sources
    - 執行狀態
    - 累積結果摘要
    - Connector Health
    - 暫停 / 恢復 / 停止
    actions:
    - DEV-01-ACT-DISCOVERY-START
    - DEV-01-ACT-DISCOVERY-PAUSE
    - DEV-01-ACT-DISCOVERY-RESUME
    - DEV-01-ACT-DISCOVERY-STOP
    permission:
    - outreach.discovery.read
    - outreach.discovery.configure
  - stage_uid: DEV-01-STAGE-02-DIRECTORY
    key: directory
    label: 企業資料庫
    short: Directory
    owner: REUSE OutreachDirectoryService
    purpose: 持續累積企業主資料、解析企業身份、保存一對多聯絡資料與來源證據；重複企業採合併，不破壞歷史。
    content:
    - 企業搜尋 / 篩選
    - 企業清單
    - 身份解析
    - 登記號比對
    - 別名
    - 電話 / Email / 地址
    - 來源證據
    - 合併預覽 / 審查
    - 發送歷史
    - Suppression
    actions:
    - DEV-01-ACT-DIRECTORY-SEARCH
    - DEV-01-ACT-MERGE-PREVIEW
    - DEV-01-ACT-MERGE
    - DEV-01-ACT-EXPORT
    permission:
    - outreach.directory.read
    - outreach.directory.merge
  - stage_uid: DEV-01-STAGE-03-MESSAGE
    key: message
    label: 開發信內容
    short: Message
    owner: REUSE OutreachMessageService
    purpose: 建立一對一企業開發 Email Candidate、個人化內容、版本、合規檢查與人工審查；Candidate 不得直接發送。
    content:
    - Audience Context
    - Message Candidate
    - Personalization
    - Policy Check
    - Human Review
    - Version History
    - Audit
    actions:
    - DEV-01-ACT-CANDIDATE-CREATE
    - DEV-01-ACT-CANDIDATE-DECIDE
    - DEV-01-ACT-CR-CREATE
    permission:
    - outreach.message.write
    - outreach.message.review
  - stage_uid: DEV-01-STAGE-04-CAMPAIGN
    key: campaign
    label: Campaign / 受眾批次
    short: Campaign
    owner: REUSE OutreachBatchService
    purpose: 建立 Campaign 與受眾批次做內部編排、審查與統計；實際外寄仍拆成一位收件者一封。
    content:
    - Audience Filter
    - Inclusion / Exclusion
    - Suppression
    - Recipient Preview
    - Campaign Config
    - Personalization Binding
    - Approval
    actions:
    - DEV-01-ACT-CAMPAIGN-SEARCH
    - DEV-01-ACT-CAMPAIGN-CREATE
    - DEV-01-ACT-CAMPAIGN-APPROVE
    permission:
    - outreach.batch.create
    - outreach.batch.approve
  - stage_uid: DEV-01-STAGE-05-DELIVERY
    key: delivery
    label: 一對一發送控制
    short: Delivery
    owner: REUSE OutreachDeliveryService
    purpose: 將已核准 Campaign 拆成獨立 Delivery；每封郵件只有一個 To，並受時間窗、頻率、退信、回覆、Suppression 與停止控制。
    content:
    - Delivery Policy
    - Schedule Window
    - Rate / Quota
    - Individual Delivery Queue
    - Delivery Status
    - Bounce / Reply
    - Suppression
    - Kill Switch
    actions:
    - DEV-01-ACT-EMAIL-DISPATCH
    - DEV-01-ACT-REFRESH
    - DEV-01-ACT-KILL-SWITCH
    permission:
    - outreach.send.configure
    - outreach.send.dispatch
layout:
  desktop_min_width: 1280
  page_context_bar: 100% x 56px
  workflow_stage_bar: 100% x 52px; five compact segmented stages
  primary_workspace: 72% width; active stage only
  governance_rail: 28% width; current-stage blockers/status only
  detail_drawer: 480-560px secondary drawer for evidence/history/audit/version/connector detail
  stage_action_dock: 56px local bottom action row; only current legal stage actions
  main_workspace: height:auto; overflow-y:auto
  below_1280: min-width=1280px + horizontal scroll
  visual_rule: Inherit Global Visual; no new visual system, no card-per-field layout, no fake charts or decorative counters.
