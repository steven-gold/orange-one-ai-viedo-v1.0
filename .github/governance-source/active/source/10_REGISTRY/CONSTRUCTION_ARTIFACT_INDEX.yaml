schema_version: 2
registry_uid: REG-CONSTRUCTION-ARTIFACT-001
status: CANDIDATE_PREFORMAL
purpose: Single machine-readable index for construction artifact identity, program file naming, normative guidance binding, dependency continuity, and cleanup obligations.
