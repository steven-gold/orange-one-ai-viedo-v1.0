name: Product Stage02 Validation
on:
  push:
    branches: [0921acpos]
    paths: ['STAGE_EXECUTION/STAGE-02/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wu: [WU-STAGE02-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001, WU-STAGE02-WB01-DASHBOARD-CLEAN-001]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - name: Validate phase-aware Current Stage02 state
        env: {WU: "${{ matrix.wu }}"}
        run: |
          set -euo pipefail
          B="STAGE_EXECUTION/STAGE-02/$WU"
          test -s "$B/WORK_UNIT.yaml"; test -s "$B/EXECUTION_STATE.yaml"; test -s "$B/NORMATIVE_EXECUTION_MATRIX.yaml"
          CUR="$(python -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; print(d.get('current_operation') or '')" "$B/EXECUTION_STATE.yaml")"
          if [ "$CUR" != "COMPLETE" ]; then
            echo "PASS: Stage02 incremental operation checkpoint; closure evidence not yet applicable"
            exit 0
          fi
          test -s "$B/EVIDENCE/GOVERNED_UNIT_FUNCTIONAL_REVIEW_EVIDENCE.yaml"
          python - <<'PY'
          import os,yaml
          from pathlib import Path
          b=Path('STAGE_EXECUTION/STAGE-02')/os.environ['WU']
          ev=yaml.safe_load((b/'EVIDENCE/GOVERNED_UNIT_FUNCTIONAL_REVIEW_EVIDENCE.yaml').read_text()) or {}
          assert ev.get('result')=='PASS', 'BLOCK:FUNCTIONAL_REVIEW_EVIDENCE_NOT_PASS'
          for n in ('FUNCTIONAL_CHAIN_SPEC.yaml','GOVERNED_UNIT_CONSTRUCTION_SPEC_PACKAGE.yaml','FUNCTIONAL_WORKBENCH_CONTRACT.yaml','INTERACTION_TOPOLOGY_SPEC.yaml','FUNCTION_ADMISSION_SCORECARD.yaml','AUTO_COMPLETION_SCOPE_LEDGER.yaml'):
              assert (b/n).is_file(), 'BLOCK:STAGE02_REQUIRED_OUTPUT_MISSING:'+n
          print('PASS: Stage02 operation-complete functional contract outputs are physical')
          PY
          if [ -f "$B/WORK_UNIT_TERMINAL_RECEIPT.yaml" ]; then
            test -s "$B/EVIDENCE/CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml"
            test -s "$B/EVIDENCE/NORMALIZED_STAGE_EVIDENCE.json"
            echo "PASS: Stage02 terminal closure artifacts materialized"
          else
            echo "PASS: Stage02 execution complete; common preterminal/terminalization pending"
          fi
