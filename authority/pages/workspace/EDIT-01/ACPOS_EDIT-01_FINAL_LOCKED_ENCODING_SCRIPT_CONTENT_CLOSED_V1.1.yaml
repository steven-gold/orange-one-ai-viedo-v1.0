  action_effect_types:
  - effect_type: UI_ONLY
    allowed_changes: Selection / Viewport / Playhead / Range / Preview / Compare
    forbidden: 不得修改 Working Draft、Version、Output、Evidence
  - effect_type: CONTEXT_STATE
    allowed_changes: 當前 Source/Provider/Model/Target/Inspector input context
    forbidden: 不得因選擇欄位就寫入媒體內容或建立版本
  - effect_type: DRAFT_MUTATION
    allowed_changes: Working Draft only
    forbidden: 不得覆寫 Saved Version；內容型 mutation 必須 EVAL_REQUIRED
  - effect_type: JOB_START
    allowed_changes: 建立真實 Job + Job State
    forbidden: 不得先顯示完成；未成功不得生成結果 reference
  - effect_type: JOB_CANCEL
    allowed_changes: 取消允許取消的 Job
    forbidden: 不得套用半成品
  - effect_type: CANDIDATE_STATE
    allowed_changes: ApiEditCandidate lifecycle only
    forbidden: 不得修改 Working Draft；只允許 discard/state change
  - effect_type: EVALUATION_MUTATION
    allowed_changes: Stage Evaluation Issue / Evidence / Marker
    forbidden: 不得冒充媒體內容修改；必須引用真實 QA object
  - effect_type: VERSION_CREATE
    allowed_changes: New immutable EditVersion
    forbidden: 禁止 overwrite/reuse Version ID
  - effect_type: VERSION_LOCK
    allowed_changes: Exact version lock state
    forbidden: 不得修改版本內容；只鎖定已存在 Saved Version
  - effect_type: OUTPUT_CREATE
    allowed_changes: New immutable OutputReference/OutputVersion
    forbidden: 必須 Manifest + Checksum + input version
  - effect_type: HANDOFF
    allowed_changes: Handoff Record
    forbidden: 只可引用 Locked Exact Version + Output + Evidence
  - effect_type: READ_OUTPUT
    allowed_changes: 讀取/下載既有 Output
    forbidden: 不得建立或修改輸出
  - effect_type: STATE_TRANSITION
    allowed_changes: Page/Stage state only；寫入合法 Transition/Checkpoint
    forbidden: 不得跳過 Transition Registry、不得直接建立 Output/Version
  actions:
  - action_uid: EDIT-01-ACT-API-APPLY
    trigger_semantics: 套用 Candidate
    owner: EDITING
    effect_type: DRAFT_MUTATION
    success_contract: Candidate 套用至 Working Draft；建立新 draft hash；Page State=EVAL_REQUIRED
    error_contract: EDIT-01-ERR-API-001 / EDIT-01-ERR-API-002 / EDIT-01-ERR-API-003
  - action_uid: EDIT-01-ACT-API-CANCEL
    trigger_semantics: 取消 Job
    owner: EDITING
    effect_type: JOB_CANCEL
    success_contract: ApiEditJob=CANCELLED；Candidate 不得 Apply；Working Draft 不變
    error_contract: EDIT-01-ERR-API-001 / EDIT-01-ERR-API-002 / EDIT-01-ERR-API-003
  - action_uid: EDIT-01-ACT-API-COMPARE
    trigger_semantics: 比較 Candidate
    owner: CLIENT/ORCHESTRATION
    effect_type: UI_ONLY
    success_contract: 只更新 Selection/View/Range/Preview State；不得修改 Working Draft 或 Saved Version
    error_contract: EDIT-01-ERR-CONTEXT-001
  - action_uid: EDIT-01-ACT-API-DISCARD
    trigger_semantics: Discard
    owner: EDITING
    effect_type: CANDIDATE_STATE
    success_contract: ApiEditCandidate=DISCARDED；Working Draft、Saved Version、QA State 全部不變
    error_contract: EDIT-01-ERR-API-001 / EDIT-01-ERR-API-002 / EDIT-01-ERR-API-003
