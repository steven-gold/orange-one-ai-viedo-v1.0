entity_operations:
- Entity: ACPOSStateProjection
  Operations: PROJECT / REFRESH / INVALIDATE
  Precondition: Domain exact version exists
  Output: Projection version, state, owner, relationships
  Invariant: Derived only
- Entity: ACPOSContextNeed
  Operations: DECLARE / VALIDATE
  Precondition: Actor + operation known
  Output: Required/optional/forbidden context classes
  Invariant: No data fetch yet
- Entity: ACPOSContextCandidate
  Operations: BUILD / REVIEW / ADOPT / REJECT
  Precondition: Authorized source refs
  Output: Candidate state + evidence refs
  Invariant: Adoption by consumer domain
- Entity: ACPOSContextSnapshot
  Operations: FREEZE / VERIFY / REPLAY_REFERENCE
  Precondition: Resolution complete
  Output: Immutable snapshot + digest
  Invariant: No mutation after freeze
- Entity: ACPOSConflictRecord
  Operations: CREATE / CLASSIFY / RESOLVE / ESCALATE
  Precondition: Contradictory claims/refs
  Output: Disposition + reviewer + refs
  Invariant: No silent overwrite
- Entity: ACPOSImpactSet
  Operations: BUILD / EXPAND / VERIFY
  Precondition: Change target known
  Output: Affected owners + reverify set
  Invariant: Closure requires complete graph
- Entity: ACPOSIntegrationEvent
  Operations: EMIT / CONSUME / ACK / RECONCILE
  Precondition: Source mutation already governed
  Output: Event delivery evidence
  Invariant: Event itself cannot mutate source truth
- Entity: ACPOSExperienceRecord
  Operations: CREATE / VALIDATE / RETIRE
  Precondition: Real outcome observed
  Output: Evidence-linked experience
  Invariant: Failure retained
- Entity: ACPOSLearningCandidate
  Operations: DERIVE / REVIEW / ADOPT / REJECT
  Precondition: Validated experience input
  Output: Candidate or governed adoption
  Invariant: Self-adoption forbidden
- Entity: AcquisitionIntent
  Operations: DECLARE / CANCEL
  Precondition: Domain need + rights scope
  Output: AcquisitionJob reference
  Invariant: No page-local crawler
- Entity: RawSourceSnapshot
  Operations: CAPTURE / VERIFY / RETAIN / DELETE_GOVERNED
  Precondition: Acquisition attempt
  Output: Immutable source snapshot
  Invariant: Delete subject to retention/ref/legal hold
- Entity: HumanDecisionQueueItem
  Operations: ENQUEUE / ASSIGN / DECIDE / EXPIRE_GOVERNED
  Precondition: Review-required condition
  Output: Decision ref or unresolved state
  Invariant: No AI self-approval
truth_tiers_T0_T7:
- Tier: T0
  Canonical Name: CURRENT_OPERATIONAL_TRUTH
  定義: 目前正式 Domain entity/state/exact version 的可驗證操作事實。
  Authority Basis: Current owner + exact version
  正式使用限制: 可作 operational claim Authority。
- Tier: T1
  Canonical Name: CONFIRMED_DECISION_TRUTH
  定義: 已確認 Decision / Approval / Lock / Policy choice。
  Authority Basis: Governed decision owner
  正式使用限制: 可作 decision/policy claim Authority；不能改寫實際 T0 outcome。
- Tier: T2
  Canonical Name: APPROVED_KNOWLEDGE
  定義: 經審查正式採用的 Knowledge。
  Authority Basis: Knowledge owner + approved version
  正式使用限制: 可作 reference knowledge；若 claim 有更高 Domain owner，僅輔助。
- Tier: T3
  Canonical Name: VALIDATED_EXPERIENCE
  定義: 由真實執行、QA、成本、Business Outcome 形成的經驗。
  Authority Basis: Experience owner + evidence refs
  正式使用限制: 可用於 ranking/recommendation；不能穿透 hard gate。
- Tier: T4
  Canonical Name: EXTERNAL_EVIDENCE
  定義: Search/Crawl/API/RSS/Document 的可追溯外部證據。
  Authority Basis: Raw snapshot + acquisition evidence
  正式使用限制: 不可直接覆蓋 T0/T1/T2；需 domain adoption。
- Tier: T5
  Canonical Name: CONVERSATION_WORKING_CONTEXT
  定義: 對話、工作筆記、暫存分析。
  Authority Basis: Conversation/thread context
  正式使用限制: 僅 working context；不可宣稱為 Canon。
- Tier: T6
  Canonical Name: CANDIDATE
  定義: AI/Human 尚未採用的候選。
  Authority Basis: Candidate owner/version
  正式使用限制: 不得作 formal truth。
- Tier: T7
  Canonical Name: SEMANTIC_INDEX_RESULT
  定義: 向量/semantic search 命中的候選索引。
  Authority Basis: Index pointer
  正式使用限制: 只負責找候選；正式使用 MUST 回 exact source/version/evidence。
invariants:
- ID: INV-001
  Trigger / Condition: Formal AI/Tool execution starts
  Normative Rule: ContextSnapshot MUST be FROZEN and fingerprinted.
  Disposition: 'BLOCK: CONTEXT_NOT_FROZEN'
- ID: INV-002
  Trigger / Condition: Operation requires exact object/version
  Normative Rule: Exact object_ref + exact_version_ref MUST exist.
  Disposition: 'BLOCK: EXACT_VERSION_UNRESOLVED'
- ID: INV-003
  Trigger / Condition: Only latest/current/default alias is available
  Normative Rule: Alias MUST_NOT satisfy formal exact-version requirement.
  Disposition: 'BLOCK: ALIAS_NOT_EXACT'
- ID: INV-004
  Trigger / Condition: Cross-project source is encountered
  Normative Rule: MUST verify explicit scope authorization; silent fallback forbidden.
  Disposition: 'BLOCK: CROSS_PROJECT_SCOPE'
- ID: INV-005
  Trigger / Condition: T4 external evidence conflicts with T0/T1/T2 owner claim
  Normative Rule: MUST create ConflictRecord; external source MUST_NOT overwrite internal authority.
  Disposition: KEEP owner truth + REVIEW if required
- ID: INV-006
  Trigger / Condition: T7 semantic hit selected
  Normative Rule: MUST dereference exact source/version/evidence before formal use.
  Disposition: BLOCK if dereference fails
- ID: INV-007
  Trigger / Condition: AI raw output exists
  Normative Rule: MUST remain RAW_AI_OUTPUT/CANDIDATE until governed adoption.
  Disposition: NO AUTHORITY CREDIT
- ID: INV-008
  Trigger / Condition: Context contains restricted data
  Normative Rule: Provider/tool eligibility MUST verify classification/rights before disclosure.
  Disposition: 'BLOCK: CLASSIFICATION_POLICY'
- ID: INV-009
  Trigger / Condition: Required permission missing
  Normative Rule: MUST_NOT execute effectful operation.
  Disposition: 'BLOCK: PERMISSION_DENIED'
- ID: INV-010
  Trigger / Condition: Context source is stale for requested freshness
  Normative Rule: MUST refresh/re-resolve or explicitly block/review.
  Disposition: NO SILENT REBASE
- ID: INV-011
  Trigger / Condition: Context mandatory set exceeds budget
  Normative Rule: MUST_NOT drop mandatory constraints.
  Disposition: 'BLOCK: CONTEXT_BUDGET_MANDATORY_OVERFLOW'
- ID: INV-012
  Trigger / Condition: Optional context exceeds budget
  Normative Rule: MUST dedupe → summarize → rank/drop lowest priority in defined order.
  Disposition: Continue only if mandatory intact
- ID: INV-013
  Trigger / Condition: Same claim has unresolved same-tier conflict
  Normative Rule: MUST create ConflictRecord and deterministic disposition.
  Disposition: REVIEW/BLOCK by claim class
- ID: INV-014
  Trigger / Condition: Two writers target same governed version
  Normative Rule: MUST use expected_version/pre-write identity.
  Disposition: STALE_WRITE_BLOCK
- ID: INV-015
  Trigger / Condition: Stale write detected
  Normative Rule: MUST_NOT silent overwrite or silent merge.
  Disposition: COMPARE/FORK/RETRY with fresh base
- ID: INV-016
  Trigger / Condition: Same idempotency key + same payload
  Normative Rule: MUST return/reconcile prior effect; MUST_NOT duplicate effect.
  Disposition: IDEMPOTENT_REPLAY
- ID: INV-017
  Trigger / Condition: Same idempotency key + different payload
  Normative Rule: MUST reject.
  Disposition: 'BLOCK: IDEMPOTENCY_KEY_REUSE_CONFLICT'
- ID: INV-018
  Trigger / Condition: External effect response is ambiguous
  Normative Rule: MUST reconcile provider/external status before retry.
  Disposition: NO BLIND RETRY
- ID: INV-019
  Trigger / Condition: Retryable failure
  Normative Rule: Retry MUST be bounded and policy-owned.
  Disposition: No infinite retry
- ID: INV-020
  Trigger / Condition: Non-retryable validation/permission failure
  Normative Rule: MUST_NOT retry automatically.
  Disposition: BLOCK/RETURN ERROR
- ID: INV-021
  Trigger / Condition: Provider/tool health circuit open
  Normative Rule: New calls MUST follow circuit policy; hard gates still apply.
  Disposition: FALLBACK only if semantically eligible
- ID: INV-022
  Trigger / Condition: Fallback provider selected
  Normative Rule: Request MUST recompile from canonical meaning.
  Disposition: MUST_NOT reuse Provider-A compiled prompt blindly
- ID: INV-023
  Trigger / Condition: Integration event received twice
  Normative Rule: Consumer MUST dedupe using event_id/idempotency semantics.
  Disposition: No duplicate business mutation
- ID: INV-024
  Trigger / Condition: Event arrives out of order
  Normative Rule: Consumer MUST compare aggregate/exact_version/sequence and reconcile.
  Disposition: No stale rollback
- ID: INV-025
  Trigger / Condition: Integration event payload exists
  Normative Rule: Event MUST be treated as notification/evidence envelope, not source mutation authority.
  Disposition: Consumer dereferences owner
- ID: INV-026
  Trigger / Condition: Domain page needs external acquisition
  Normative Rule: MUST use shared acquisition runtime contract.
  Disposition: No page-local second crawler
- ID: INV-027
  Trigger / Condition: Raw external payload acquired
  Normative Rule: MUST persist provenance/snapshot before normalization/adoption.
  Disposition: No direct Canon write
- ID: INV-028
  Trigger / Condition: Experience is created
  Normative Rule: MUST link real execution/outcome evidence.
  Disposition: Conversation-only experience forbidden
- ID: INV-029
  Trigger / Condition: Execution failed or was wasteful
  Normative Rule: Failure experience MUST be retained when policy allows.
  Disposition: Do not learn only from successes
- ID: INV-030
  Trigger / Condition: Learning Candidate exists
  Normative Rule: MUST NOT self-adopt into Authority.
  Disposition: REVIEW_REQUIRED
- ID: INV-031
  Trigger / Condition: Learning recommendation conflicts with hard eligibility gate
  Normative Rule: Hard gate wins.
  Disposition: Experience cannot bypass rights/policy/capability
- ID: INV-032
  Trigger / Condition: Material change affects dependency descendants
  Normative Rule: ImpactSet MUST mark affected PASS items REVERIFY_REQUIRED.
  Disposition: No stale PASS carryover
- ID: INV-033
  Trigger / Condition: Source owner is changed/superseded
  Normative Rule: References MUST migrate atomically or remain blocked.
  Disposition: No second authority
- ID: INV-034
  Trigger / Condition: Deletion requested
  Normative Rule: Reference/retention/legal-hold checks MUST pass.
  Disposition: No hard delete of referenced canonical evidence
- ID: INV-035
  Trigger / Condition: Audit/Decision/Canonical Version referenced by active lineage
  Normative Rule: MUST preserve traceability.
  Disposition: No destructive delete
- ID: INV-036
  Trigger / Condition: Current Authority binding is unknown
  Normative Rule: Document/implementation MUST use REQUIRE_EXACT_BINDING.
  Disposition: No invented UID/path/table/API
- ID: INV-037
  Trigger / Condition: Page already owns business behavior
  Normative Rule: Global Brain MUST reference, not duplicate/redefine.
  Disposition: ONE CONCEPT / ONE OWNER
- ID: INV-038
  Trigger / Condition: AI wants to change another domain
  Normative Rule: Cross-domain mutation MUST use governed handoff/adoption.
  Disposition: No silent cross-domain mutation
- ID: INV-039
  Trigger / Condition: Formal result is only preview/test/simulation
  Normative Rule: MUST NOT be presented as Production outcome.
  Disposition: Truthful execution state
- ID: INV-040
  Trigger / Condition: Tool/run inner step succeeded
  Normative Rule: MUST_NOT infer outer terminal success.
  Disposition: Need terminal evidence
- ID: INV-041
  Trigger / Condition: ContextSnapshot changes after freeze
  Normative Rule: Original snapshot remains immutable; new execution requires new snapshot/fingerprint.
  Disposition: No in-place mutation
- ID: INV-042
  Trigger / Condition: Manual correction changes subset
  Normative Rule: Preserve constraints MUST protect unaffected governed content.
  Disposition: Exact-scope delta only
- ID: INV-043
  Trigger / Condition: Human Decision Queue item unresolved
  Normative Rule: Dependent effectful action MUST stay blocked when decision is REQUIRED.
  Disposition: No timeout-as-approval
- ID: INV-044
  Trigger / Condition: Evidence is missing/ambiguous
  Normative Rule: MUST report UNKNOWN/NOT_VERIFIED/BLOCKED as applicable.
  Disposition: No fake success
- ID: INV-045
  Trigger / Condition: Retention duration not formally bound
  Normative Rule: Effectful implementation MUST NOT invent TTL.
  Disposition: REQUIRE_EXACT_BINDING
- ID: INV-046
  Trigger / Condition: Context fingerprint mismatch on resume/replay
  Normative Rule: MUST re-resolve context or explicitly branch.
  Disposition: No silent resume onto changed truth
- ID: INV-047
  Trigger / Condition: A source has no classification/rights metadata but may cross trust boundary
  Normative Rule: MUST classify or block before disclosure.
  Disposition: 'BLOCK: DATA_POLICY_UNRESOLVED'
- ID: INV-048
  Trigger / Condition: Duplicate/semantic duplicate owner discovered
  Normative Rule: MUST resolve to one canonical owner and references.
  Disposition: NO SECOND AUTHORITY
