name: ACPOS Batch 111 Strategy Authority Gap Closure
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch111_strategy_authority_gap_closure.yml
permissions:
  contents: write
jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install DOCX and render tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
      - name: Close three canonical Strategy authority gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.enum.text import WD_BREAK
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          import subprocess,re,json,zipfile,collections

          BASE="4e68b8f2682538c3de3e9046007f467a3dc34854"
          if subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()!=BASE:
              raise SystemExit("EXACT_PARENT_FAIL")

          FILES=[
            Path("08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"),
            Path("ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx"),
          ]
          for p in FILES:
              if not p.exists(): raise SystemExit(f"MISSING {p}")

          TARGETS={
            "CTRL-ADMIN-STR-03-ACT-01-ACT-DRAFT-SAVE":{
              "operation":"saveDraft",
              "runtime":"IAM_RUNTIME",
              "persistence":"StrategyService / PlatformPlaybook Draft Version + Audit",
              "status":"EFFECTFUL_EXACT",
              "closure":"DESIGN_AUTHORITY_RESOLVED — shared IAM_RUNTIME may remain the registered draft/governance ingress, while canonical business persistence is StrategyService / PlatformPlaybook Draft Version + Audit. The operation creates or updates only a governed PlatformPlaybook draft version; it does not approve, publish, or bypass later approval. Runtime execution is not claimed by this Word.",
              "owner_table":"IAM_RUNTIME ingress → StrategyService / PlatformPlaybook",
              "entity":"PlatformPlaybook",
              "lifecycle":"CREATE + EDIT + VERSION + AUDIT",
            },
            "CTRL-ADMIN-STR-05-ACT-01-ACT-CANDIDATE-CREATE":{
              "operation":"createCandidate",
              "runtime":"StrategyService",
              "persistence":"StrategyService / OpportunityCandidate + Version/Audit",
              "status":"EFFECTFUL_EXACT",
              "closure":"DESIGN_AUTHORITY_RESOLVED — the Opportunity view and lifecycle matrix bind createCandidate to OpportunityCandidate.CREATE/EDIT under StrategyService. Persistence creates or versions an OpportunityCandidate with evidence lineage; it does not create a StrategyCandidate decision object and does not auto-approve it. Runtime execution is not claimed by this Word.",
              "owner_table":"StrategyService / OpportunityCandidate",
              "entity":"OpportunityCandidate",
              "lifecycle":"CREATE + EDIT + VERSION + AUDIT",
            },
            "CTRL-ADMIN-STR-06-ACT-02-ACT-CANDIDATE-DECIDE":{
              "operation":"rejectStrategyCandidate",
              "runtime":"StrategyService",
              "persistence":"StrategyService / StrategyCandidate Rejected State + DecisionContext + Audit",
              "status":"EFFECTFUL_EXACT",
              "closure":"DESIGN_AUTHORITY_RESOLVED — Decision Reject/Adopt flow and StrategyCandidate.CONFIRM_OR_APPROVE bind rejectStrategyCandidate to StrategyService. Reject persists the exact candidate/version rejected state, decision reason/evidence into DecisionContext, and audit lineage; it creates no ContextCandidate and executes no downstream owner action. Runtime execution is not claimed by this Word.",
              "owner_table":"StrategyService / StrategyCandidate Decision State",
              "entity":"StrategyCandidate",
              "lifecycle":"CONFIRM_OR_APPROVE + VERSION + AUDIT",
            },
          }

          def norm(s):return re.sub(r"\s+"," ",(s or "").strip())
          def set_para(p,text):
              if p.runs:
                  p.runs[0].text=text
                  for r in p.runs[1:]:r.text=""
              else:p.text=text
          def set_cell(c,text):
              if c.paragraphs:
                  set_para(c.paragraphs[0],text)
                  for p in c.paragraphs[1:]:set_para(p,"")
              else:c.text=text
          def headers(t):return [norm(c.text) for c in t.rows[0].cells] if t.rows else []
          def add_table(doc,heads,rows):
              t=doc.add_table(rows=1,cols=len(heads)); t.style="Table Grid"
              for i,h in enumerate(heads):t.rows[0].cells[i].text=h
              for row in rows:
                  cs=t.add_row().cells
                  for i,v in enumerate(row):cs[i].text=str(v)
              return t
          def page_break(doc):
              p=doc.add_paragraph();p.add_run().add_break(WD_BREAK.PAGE)
          def full_text(doc):
              out=[p.text for p in doc.paragraphs]
              for t in doc.tables:
                  for r in t.rows:out.append(" | ".join(c.text for c in r.cells))
              return "\n".join(out)

          metrics=collections.Counter()
          for path in FILES:
              d=Document(path)
              seen_primary=set();seen_resolution=set()

              for t in d.tables:
                  h=headers(t)
                  idx={x:i for i,x in enumerate(h)}

                  # Primary control contract.
                  primary=["Control UID","UID Status","Label","Type","Action UID","Gate","Permission / Auth Resource","Payload / Schema","Operation","Method / Path","Runtime Owner","Persistence Owner","Runtime Status"]
                  if h==primary:
                      for row in t.rows[1:]:
                          uid=norm(row.cells[idx["Control UID"]].text)
                          if uid in TARGETS:
                              x=TARGETS[uid]
                              set_cell(row.cells[idx["Runtime Owner"]],x["runtime"])
                              set_cell(row.cells[idx["Persistence Owner"]],x["persistence"])
                              set_cell(row.cells[idx["Runtime Status"]],x["status"])
                              seen_primary.add(uid);metrics["primary_rows"]+=1

                  # Current resolution table.
                  resolution=["Control UID","Operation","Method / Path","Payload","Permission","Current Runtime Owner","Current Persistence Owner","Required closure before enablement","Current status"]
                  if h==resolution:
                      for row in t.rows[1:]:
                          uid=norm(row.cells[idx["Control UID"]].text)
                          if uid in TARGETS:
                              x=TARGETS[uid]
                              set_cell(row.cells[idx["Current Runtime Owner"]],x["runtime"])
                              set_cell(row.cells[idx["Current Persistence Owner"]],x["persistence"])
                              set_cell(row.cells[idx["Required closure before enablement"]],x["closure"])
                              set_cell(row.cells[idx["Current status"]],x["status"])
                              seen_resolution.add(uid);metrics["resolution_rows"]+=1

                  # Operation registry in ADMIN STR.
                  if h==["Operation","Method / Path","Owner","Effect","施工 Gate"]:
                      for row in t.rows[1:]:
                          op=norm(row.cells[0].text)
                          match=[(uid,x) for uid,x in TARGETS.items() if x["operation"]==op]
                          if match:
                              uid,x=match[0]
                              set_cell(row.cells[2],x["owner_table"])
                              set_cell(row.cells[4],x["closure"])
                              metrics["operation_rows"]+=1

                  # Source-grounded findings: close old blockers without asserting runtime execution.
                  if h==["Finding","Source-grounded status"]:
                      for row in t.rows[1:]:
                          val=norm(row.cells[1].text)
                          for uid,x in TARGETS.items():
                              if uid in val:
                                  if norm(row.cells[0].text)=="RUNTIME_IMPLEMENTATION_BLOCKED":
                                      set_cell(row.cells[0],"DESIGN_AUTHORITY_RESOLVED_RUNTIME_NOT_ASSERTED")
                                      set_cell(row.cells[1],json.dumps({
                                          "control_uid":uid,
                                          "operation":x["operation"],
                                          "design_runtime_owner":x["runtime"],
                                          "design_persistence_owner":x["persistence"],
                                          "runtime_execution_claimed":False
                                      },ensure_ascii=False))
                                      metrics["finding_rows"]+=1
                      # Replace partial summary row if present.
                      for row in t.rows[1:]:
                          if norm(row.cells[0].text)=="PARTIAL_RUNTIME_MATERIALIZATION":
                              set_cell(row.cells[0],"DESIGN_AUTHORITY_COMPLETE_RUNTIME_EVIDENCE_SEPARATE")
                              set_cell(row.cells[1],json.dumps({
                                  "design_bound":["saveDraft","exportProjection","createCandidate","compareCandidates","rejectStrategyCandidate","adoptAsContextCandidate"],
                                  "runtime_execution_claimed":False
                              },ensure_ascii=False))
                              metrics["summary_rows"]+=1

              if seen_primary!=set(TARGETS):
                  raise SystemExit(f"PRIMARY_TARGET_MISSING {path} {sorted(set(TARGETS)-seen_primary)}")
              if seen_resolution!=set(TARGETS):
                  raise SystemExit(f"RESOLUTION_TARGET_MISSING {path} {sorted(set(TARGETS)-seen_resolution)}")

              # Rewrite stale prose that still says the three controls are Authority gaps.
              for p in d.paragraphs:
                  s=norm(p.text)
                  if s.startswith("All 19 source-preserving interaction controls remain exact at the planning/design layer.") and "AUTHORITY_GAP" in s:
                      set_para(p,
                        "All 19 source-preserving interaction controls remain exact at the planning/design layer. "
                        "saveDraft is now canonically bound to shared IAM_RUNTIME ingress with StrategyService / PlatformPlaybook Draft Version + Audit persistence; "
                        "createCandidate is bound to StrategyService / OpportunityCandidate + Version/Audit; "
                        "rejectStrategyCandidate is bound to StrategyService / StrategyCandidate Rejected State + DecisionContext + Audit. "
                        "exportProjection, compareCandidates and adoptAsContextCandidate retain their prior source-backed bindings. "
                        "These are design-authority bindings only; this Word does not claim runtime execution or Production readiness.")
                      metrics["summary_paragraphs"]+=1

              marker="[ACPOS-STRATEGY-AUTHORITY-CLOSURE-V1]"
              if marker not in full_text(d):
                  page_break(d)
                  d.add_heading("Strategy Canonical Authority Closure｜戰略功能正式 Owner 收斂",level=1)
                  d.add_paragraph(marker+" This annex closes the three remaining planning/basic-design Authority gaps without creating a parallel Strategy runtime. It is derived from the existing Owner Boundary (StrategyService + StrategyFactPackService + shared owners), Business Entity registry, lifecycle matrix, functional chains, payload contracts and existing operation routes.")
                  add_table(d,["Control UID","Operation","Canonical Runtime Owner","Canonical Persistence Owner","Entity/Lifecycle Authority","Exact Design Semantics"],[
                    (uid,x["operation"],x["runtime"],x["persistence"],x["entity"]+" / "+x["lifecycle"],x["closure"])
                    for uid,x in TARGETS.items()
                  ])
                  d.add_heading("Owner and Entity Resolution Rules",level=2)
                  add_table(d,["Rule","Normative Result"],[
                    ("No second Strategy runtime","StrategyService remains the canonical Strategy business owner. StrategyFactPackService remains fact/acquisition authority. Shared IAM/INFO owners may provide registered ingress/governance/export capabilities but do not become Strategy business persistence owners."),
                    ("saveDraft disambiguation","POST /v1/drafts is a shared draft ingress. In ADMIN STR Playbook view, resource_type/target_ref resolve the business entity to PlatformPlaybook; canonical persistence therefore belongs to StrategyService / PlatformPlaybook Draft Version + Audit."),
                    ("createCandidate disambiguation","ADMIN STR View 4 is Opportunity. The lifecycle matrix explicitly marks OpportunityCandidate Create/Edit as Create Candidate*. Therefore POST /v1/candidates here creates/versions OpportunityCandidate, not StrategyCandidate."),
                    ("rejectStrategyCandidate disambiguation","The path contains strategyCandidateId and the Decision flow explicitly performs Reject/Adopt. StrategyCandidate.CONFIRM_OR_APPROVE is REQUIRED; rejection persists candidate state + human reason/evidence in DecisionContext and audit lineage."),
                    ("Approval separation","Draft Save and Create Candidate do not imply approval. Existing approveGovernedResource remains the later explicit approval gate where applicable."),
                    ("Context separation","Reject never creates ContextCandidate. Only adoptAsContextCandidate may create governed context handoff and still preserves AI-01 downstream context authority."),
                    ("Runtime evidence separation","Design authority is now complete. Runtime implementation/production acceptance remain outside this Word-only scope and must be proven separately; lack of runtime evidence MUST NOT mutate the design owner mapping back into SOURCE_NOT_DEFINED/AUTHORITY_GAP."),
                  ])
                  d.add_heading("End-to-End Internal Function Chains",level=2)
                  add_table(d,["Function","Canonical Chain"],[
                    ("Playbook Draft Save","Selected platform/account scope + SaveDraftRequest → admin:STR-03 permission/gate → IAM_RUNTIME shared ingress → StrategyService resolves PlatformPlaybook target → append/create governed draft version + references → audit → refreshed Playbook projection → later explicit approval."),
                    ("Opportunity Candidate Create","Trend/Forecast projection + evidence + CreateCandidateRequest → admin:STR-05 permission/gate → StrategyService → OpportunityCandidate create/version → evidence lineage + audit → DRAFT/REVIEW projection → explicit later approval."),
                    ("Strategy Candidate Reject","Exact strategyCandidateId + expected/current version context + decision_reason/evidence_refs → admin:STR-06 permission/state gate → StrategyService → persist rejected StrategyCandidate state + DecisionContext reason/evidence → audit → refreshed Decision projection; no ContextCandidate/downstream execution."),
                  ])
                  d.add_heading("Failure / Recovery / Acceptance",level=2)
                  add_table(d,["Case","Required Behavior"],[
                    ("resource_type/target_ref cannot resolve PlatformPlaybook","Fail closed; no draft persistence."),
                    ("Opportunity candidate evidence/source invalid","Fail closed; no candidate creation/version."),
                    ("Strategy candidate ID/version mismatch","Fail closed; no rejected-state mutation."),
                    ("Permission/gate failure","No mutation; explicit denied/error response and audit where policy requires."),
                    ("Partial persistence","Forbidden. Business state/version/audit linkage must be transactionally coherent at the design contract level."),
                    ("Acceptance","PASS when both System 08 and ADMIN-STR-01 expose the same three Runtime/Persistence Owner mappings, no Authority-gap placeholder remains for these controls, and no second Strategy runtime/business store is introduced."),
                  ])

              # Prevent annex table row splitting.
              body=list(d._element.body)
              start=None
              for i,el in enumerate(body):
                  if el.tag==qn("w:p"):
                      s="".join((x.text or "") for x in el.iter(qn("w:t")))
                      if marker in s:
                          start=i;break
              if start is not None:
                  for el in body[start:]:
                      if el.tag!=qn("w:tbl"):continue
                      for tr in el.iter(qn("w:tr")):
                          trPr=tr.find(qn("w:trPr"))
                          if trPr is None:
                              trPr=OxmlElement("w:trPr");tr.insert(0,trPr)
                          if trPr.find(qn("w:cantSplit")) is None:
                              trPr.append(OxmlElement("w:cantSplit"))

              d.save(path)

          # exact post-write semantic assertions
          gap_tokens=[
              "AUTHORITY_GAP_BLOCKED",
              "INTENTIONAL_FAIL_CLOSED_AUTHORITY_GAP",
              "until the authorized Strategy candidate runtime+persistence owner is materialized",
              "until authorized runtime/state persistence ownership is materialized",
              "until an authorized STR draft persistence owner is materialized",
          ]
          report={}
          for p in FILES:
              d=Document(p);t=full_text(d)
              residual=[x for x in gap_tokens if x in t]
              if residual: raise SystemExit(f"AUTHORITY_GAP_RESIDUAL {p} {residual}")
              for uid,x in TARGETS.items():
                  if uid not in t or x["runtime"] not in t or x["persistence"] not in t or x["status"] not in t:
                      raise SystemExit(f"TARGET_BINDING_MISSING {p} {uid}")
              if marker not in t:raise SystemExit(f"ANNEX_MISSING {p}")
              report[p.name]={"gap_residual":0,"target_bindings":3}
              with zipfile.ZipFile(p) as z:
                  if z.testzip():raise SystemExit(f"ZIP_BAD {p}")

          changed=[x for x in subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",BASE],text=True).splitlines() if x.endswith(".docx")]
          if sorted(changed)!=sorted(x.name for x in FILES):
              raise SystemExit("MODIFIED_SCOPE_FAIL "+repr(changed))
          Path("__batch111_manifest.json").write_text(json.dumps({"metrics":dict(metrics),"validation":report,"modified":changed},ensure_ascii=False,indent=2))
          print("BATCH111_WRITE_PASS="+json.dumps({"modified_docx":len(changed),**dict(metrics)},ensure_ascii=False,sort_keys=True))
          PY
      - name: Cross-document exact authority validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from docx import Document
          import re,json
          files=[
            "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          targets={
            "CTRL-ADMIN-STR-03-ACT-01-ACT-DRAFT-SAVE":("IAM_RUNTIME","StrategyService / PlatformPlaybook Draft Version + Audit","EFFECTFUL_EXACT"),
            "CTRL-ADMIN-STR-05-ACT-01-ACT-CANDIDATE-CREATE":("StrategyService","StrategyService / OpportunityCandidate + Version/Audit","EFFECTFUL_EXACT"),
            "CTRL-ADMIN-STR-06-ACT-02-ACT-CANDIDATE-DECIDE":("StrategyService","StrategyService / StrategyCandidate Rejected State + DecisionContext + Audit","EFFECTFUL_EXACT"),
          }
          observed={}
          for fn in files:
              d=Document(fn);observed[fn]={}
              for t in d.tables:
                  if not t.rows:continue
                  h=[re.sub(r"\s+"," ",c.text.strip()) for c in t.rows[0].cells]
                  if h==["Control UID","UID Status","Label","Type","Action UID","Gate","Permission / Auth Resource","Payload / Schema","Operation","Method / Path","Runtime Owner","Persistence Owner","Runtime Status"]:
                      idx={x:i for i,x in enumerate(h)}
                      for row in t.rows[1:]:
                          uid=re.sub(r"\s+"," ",row.cells[idx["Control UID"]].text.strip())
                          if uid in targets:
                              vals=(
                                re.sub(r"\s+"," ",row.cells[idx["Runtime Owner"]].text.strip()),
                                re.sub(r"\s+"," ",row.cells[idx["Persistence Owner"]].text.strip()),
                                re.sub(r"\s+"," ",row.cells[idx["Runtime Status"]].text.strip()),
                              )
                              observed[fn][uid]=vals
                              if vals!=targets[uid]:
                                  raise SystemExit(f"BINDING_MISMATCH {fn} {uid} {vals}")
              if set(observed[fn])!=set(targets):raise SystemExit(f"TARGET_SET_FAIL {fn}")
          for uid in targets:
              vals={observed[fn][uid] for fn in files}
              if len(vals)!=1:raise SystemExit(f"CROSS_DOC_DRIFT {uid} {vals}")
          print("BATCH111_CROSSDOC_PASS="+json.dumps({"controls":3,"documents":2,"conflicts":0},sort_keys=True))
          PY
      - name: Render both modified Word files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __r111/pdf __r111/png
          while IFS= read -r f; do
            libreoffice --headless --convert-to pdf --outdir __r111/pdf "$f" >/tmp/lo111.log 2>&1 || { cat /tmp/lo111.log; exit 1; }
          done <<'EOF'
          08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx
          EOF
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pdfs=sorted(Path("__r111/pdf").glob("*.pdf"))
          if len(pdfs)!=2:raise SystemExit("PDF_COUNT_FAIL")
          pages={};total=0
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","125",str(pdf),str(Path("__r111/png")/slug)])
              imgs=list(Path("__r111/png").glob(slug+"-*.png"))
              if not imgs:raise SystemExit(f"NO_PNG {pdf}")
              pages[pdf.name]=len(imgs);total+=len(imgs)
          Path("__batch111_render.json").write_text(json.dumps({"pdf_count":2,"png_count":total,"pages":pages},ensure_ascii=False,indent=2))
          print("BATCH111_RENDER_PASS="+json.dumps({"pdf_count":2,"png_count":total,"pages":pages},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch111-strategy-authority-gap-closure
          path: |
            08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
            ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx
            __r111/pdf/*.pdf
            __r111/png/*.png
            __batch111_manifest.json
            __batch111_render.json
          retention-days: 3
      - name: Commit and push closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __r111 __batch111_manifest.json __batch111_render.json
          git config user.name "acpos-batch111-design"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch111_strategy_authority_gap_closure.yml
          git add *.docx
          git commit -m "fix(acpos): close remaining Strategy canonical authority gaps"
          git push origin HEAD:0921acpos
