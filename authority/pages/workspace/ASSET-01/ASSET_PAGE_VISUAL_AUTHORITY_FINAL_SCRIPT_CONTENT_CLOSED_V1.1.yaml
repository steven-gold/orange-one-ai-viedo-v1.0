  objects_refs:
  - object_uid: ASSET-01-REF-BLUEPRINT
    entity: LockedBlueprintRef
    owner: CORE/BLUEPRINT
    required_content: immutable exact child lock/blueprint version/hash
  - object_uid: ASSET-01-REF-SCRIPT
    entity: AssetProductionScriptViewRef
    owner: CORE/SCRIPT
    required_content: provider-neutral ASSET Script View/Section/version/hash
  - object_uid: ASSET-01-REF-DNA
    entity: DNABindingRef
    owner: CORE/BLUEPRINT
    required_content: DNA/identity/continuity exact refs
  - object_uid: ASSET-01-REF-MANIFEST
    entity: AssetManifestRef
    owner: CORE/BLUEPRINT
    required_content: required asset items/type/purpose/reuse policy
  - object_uid: ASSET-01-REF-NAMING
    entity: SystemOutputNamingRef
    owner: ACPOS_SYSTEM
    required_content: canonical filename/output artifact identity/version/checksum policy; page read-only
  - object_uid: ASSET-01-REF-INSTRUCTION
    entity: InstructionPackageRef
    owner: InstructionCompiler
    required_content: approved provider-neutral instruction package
  - object_uid: ASSET-01-REF-ROUTE
    entity: ProviderRouteSnapshotRef
    owner: ACPOS AI API Router
    required_content: approved route/provider/model/capability snapshot; page read-only
  - object_uid: ASSET-01-OBJ-INPUT-MANIFEST
    entity: AssetExecutionInputManifest
    owner: ASSET/ORCH
    required_content: task+blueprint+script+DNA+manifest+naming+instruction+route+input fingerprint
  - object_uid: ASSET-01-OBJ-CANDIDATE
    entity: AssetCandidateOutput
    owner: ASSET
    required_content: candidate artifact exact version/uri/canonical filename/checksum/provenance
  - object_uid: ASSET-01-OBJ-EVALUATION
    entity: AssetEvaluation
    owner: ASSET/EVALUATION
    required_content: criteria version/dimension scores/hard blocks/evidence/result
  - object_uid: ASSET-01-OBJ-FINDING
    entity: AssetFinding
    owner: ASSET/EVALUATION
    required_content: issue type/asset/layer/region/evidence
  - object_uid: ASSET-01-OBJ-CORRECTION
    entity: AssetCorrectionContext
    owner: ASSET/AI
    required_content: current exact refs + issue + zh-TW request + candidate
  - object_uid: ASSET-01-OBJ-CORRECTION-SCRIPT
    entity: CorrectionScriptCandidate
    owner: ACPOS Script System
    required_content: provider-neutral delta; human approved before translation
  - object_uid: ASSET-01-OBJ-LAYER-DOC
    entity: VersionedLayerDocument
    owner: AssetCatalogService
    required_content: immutable versions of image-compatible layer document
  - object_uid: ASSET-01-OBJ-ASSET-PATCH
    entity: AssetPatch
    owner: AssetCatalogService
    required_content: source asset/layer/region/blueprint/DNA/preserve constraints/preview/decision
  - object_uid: ASSET-01-OBJ-ASSET-VERSION
    entity: AssetOutputVersion
    owner: AssetCatalogService
    required_content: immutable exact artifact version + canonical filename/checksum
  - object_uid: ASSET-01-OBJ-SCORECARD
    entity: AssetScorecard
    owner: ASSET/EVALUATION
    required_content: target output + criteria version + scores/issues/evidence
  - object_uid: ASSET-01-OBJ-HANDOFF
    entity: AssetHandoffManifest
    owner: ASSET boundary
    required_content: exact locked output + layer/composite refs + blueprint/script/DNA/manifest/naming/score/rights/contract hash
  errors:
  - error_uid: ASSET-01-ERR-CONTEXT-001
    context: Project/Topic/Task context missing/stale
    recovery: BLOCK; re-resolve exact task
  - error_uid: ASSET-01-ERR-BLUEPRINT-001
    context: Child lock/Blueprint missing/hash mismatch
    recovery: BLOCK; return Core/Blueprint owner
  - error_uid: ASSET-01-ERR-SCRIPT-001
    context: ASSET Script View/Section missing/hash mismatch
    recovery: BLOCK; no local script guess
  - error_uid: ASSET-01-ERR-DNA-001
    context: DNA/continuity ref missing or mismatch
    recovery: BLOCK; no substitute
  - error_uid: ASSET-01-ERR-MANIFEST-001
    context: Asset Manifest item/type/purpose/reuse status invalid
    recovery: BLOCK; re-resolve upstream manifest
  - error_uid: ASSET-01-ERR-NAMING-001
    context: Canonical filename/output identity unavailable or mismatched
    recovery: BLOCK; wait ACPOS naming resolution; page cannot rename
  - error_uid: ASSET-01-ERR-ROUTE-001
    context: Approved Provider Route unavailable
    recovery: BLOCK; wait ACPOS Core/API Router
  - error_uid: ASSET-01-ERR-PROVIDER-001
    context: Provider job/callback failed
    recovery: Preserve task/candidate; show retry eligibility
  - error_uid: ASSET-01-ERR-CANDIDATE-001
    context: Candidate provenance/checksum invalid
    recovery: BLOCK evaluation/decision
  - error_uid: ASSET-01-ERR-CRITERIA-001
    context: ASSET criteria version missing/wrong department
    recovery: BLOCK evaluation; no generic default
  - error_uid: ASSET-01-ERR-CORRECTION-001
    context: Correction context stale/candidate unapproved
    recovery: Return correction discussion; no execute
  - error_uid: ASSET-01-ERR-TRANSLATION-001
    context: Shared Translation/Compiler failed
    recovery: BLOCK provider execution; preserve Chinese candidate
  - error_uid: ASSET-01-ERR-LAYER-001
    context: Layer operation invalid/locked/cross-document
    recovery: BLOCK mutation
  - error_uid: ASSET-01-ERR-PATCH-001
    context: Patch lineage/preserve/preview invalid
    recovery: BLOCK patch decision
  - error_uid: ASSET-01-ERR-VERSION-001
    context: Overwrite/non-exact version attempt
    recovery: BLOCK; create new version only
  - error_uid: ASSET-01-ERR-HANDOFF-001
    context: Exact handoff manifest/contract/hash incomplete
    recovery: BLOCK handoff; preserve locked version
  - error_uid: ASSET-01-ERR-PERM-001
    context: Permission/scope denied
    recovery: Disable action + show real reason
  page_states:
  - state_uid: ASSET-01-ST-PAGE-LOADING
    display: LOADING
  - state_uid: ASSET-01-ST-PAGE-READY
    display: READY
  - state_uid: ASSET-01-ST-PAGE-EXECUTING
    display: EXECUTING
  - state_uid: ASSET-01-ST-PAGE-CANDIDATE
    display: CANDIDATE_OUTPUT
  - state_uid: ASSET-01-ST-PAGE-WAIT-CONFIRM
    display: WAIT_CONFIRMATION
  - state_uid: ASSET-01-ST-PAGE-CORRECTION
    display: CORRECTION_REQUIRED
  - state_uid: ASSET-01-ST-PAGE-CONFIRMED
    display: CONFIRMED
  - state_uid: ASSET-01-ST-PAGE-LOCKED
    display: LOCKED
  - state_uid: ASSET-01-ST-PAGE-HANDOFF
    display: HANDOFF
  - state_uid: ASSET-01-ST-PAGE-ERROR
    display: ERROR
  stages:
  - stage_uid: ASSET-01-STAGE-01-RESOLVE
    name: Resolve Inputs
    flow: Resolve exact Task→Blueprint→ASSET Script→DNA→Asset Manifest→ACPOS Naming→Instruction/Route; first production has no manual prompt.
  - stage_uid: ASSET-01-STAGE-02-REUSE-GENERATE
    name: Reuse First / Generate Missing
    flow: Resolve each required manifest item; reuse exact eligible asset first; only generate Missing items.
  - stage_uid: ASSET-01-STAGE-03-LAYER-COMPOSITE
    name: Layer / Composite
    flow: For image-compatible assets, optional Layer/Patch/Composite; audio assets skip LayerRuntime. No cross-department edit.
  - stage_uid: ASSET-01-STAGE-04-EVALUATE-DECIDE
    name: Evaluate / Confirm or Modify
    flow: Run bound ASSET criteria → WAIT_CONFIRMATION; Confirm or enter Correction. AUTO advances only after Confirm.
  - stage_uid: ASSET-01-STAGE-05-FINALIZE
    name: Lock / Handoff
    flow: Seal exact asset output manifest, lock exact version, handoff exact manifest to VIDEO.
  stage_transitions:
  - transition_uid: ASSET-01-STTR-01
    from_stage: ASSET-01-STAGE-01-RESOLVE
    to_stage: ASSET-01-STAGE-02-REUSE-GENERATE
    trigger: ASSET-01-ACT-FLOW-START
    gate: ASSET-01-GATE-EXECUTE
  - transition_uid: ASSET-01-STTR-02
    from_stage: ASSET-01-STAGE-02-REUSE-GENERATE
    to_stage: ASSET-01-STAGE-03-LAYER-COMPOSITE
    trigger: Verified Candidate/Reuse Resolution
    gate: all required items resolved or valid candidate produced
  - transition_uid: ASSET-01-STTR-03
    from_stage: ASSET-01-STAGE-03-LAYER-COMPOSITE
    to_stage: ASSET-01-STAGE-04-EVALUATE-DECIDE
    trigger: ASSET-01-ACT-EVALUATE
    gate: candidate/layer/composite provenance PASS
  - transition_uid: ASSET-01-STTR-04
    from_stage: ASSET-01-STAGE-04-EVALUATE-DECIDE
    to_stage: ASSET-01-STAGE-02-REUSE-GENERATE
    trigger: ASSET-01-ACT-CORRECTION-EXECUTE
    gate: Modify path; approved correction only
  - transition_uid: ASSET-01-STTR-05
    from_stage: ASSET-01-STAGE-04-EVALUATE-DECIDE
    to_stage: ASSET-01-STAGE-05-FINALIZE
    trigger: ASSET-01-ACT-CANDIDATE-CONFIRM
    gate: ASSET-01-GATE-CONFIRM
  script_roles:
  - script_role_uid: ASSET-01-SCRIPT-ROLE-PRODUCTION
    view: Asset_Production_Script_View
    required_content: 8-section field-level ASSET production script contract; provider-neutral; first production read-only
    content_contract_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.ASSET
  - script_role_uid: ASSET-01-SCRIPT-ROLE-CORRECTION
    view: CorrectionScriptCandidate
    required_content: only affected asset/layer/region delta derived from current ASSET script + issue; human approve before shared translation
    content_contract_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_correction_content.ASSET
  integration_ports:
  - port_uid: ASSET-01-PORT-IN-CORE-HANDOFF
    boundary: Inbound / Task Ready
    r9_operation: createDepartmentHandoff
    method_effective_path: POST /v1/handoffs
    r9_permission: department.handoff.create
    state_event: Upstream HANDOFF_READY→HANDED_OFF; ASSET WAITING_DEPENDENCY→READY | handoff.created
    exposure: Created upstream; ASSET validates exact task/blueprint/script/manifest refs only.
  - port_uid: ASSET-01-PORT-EXECUTE
    boundary: Execute Task
    r9_operation: requestTaskExecution
    method_effective_path: POST /v1/tasks/{taskId}/execute
    r9_permission: department.task.execute
    state_event: READY→ROUTING | provider.job.requested
    exposure: ASSET-01-ACT-FLOW-START after all execute gates PASS.
  - port_uid: ASSET-01-PORT-RETRY
    boundary: Retry Task
    r9_operation: retryTaskExecution
    method_effective_path: POST /v1/tasks/{taskId}/retry
    r9_permission: department.task.execute
    state_event: BLOCKED/FAILED→ROUTING | provider.job.requested
    exposure: ASSET-01-ACT-TASK-RETRY; policy eligible only.
  - port_uid: ASSET-01-PORT-FINDING
    boundary: Evaluation Finding
    r9_operation: createFinding
    method_effective_path: POST /v1/findings
    r9_permission: finding.write
    state_event: IN_REVIEW→FINDING_OPEN | finding.created
    exposure: ASSET-01-ACT-FINDING-CREATE.
  - port_uid: ASSET-01-PORT-CORRECTION
    boundary: Correction Request
    r9_operation: createCorrectionRequest
    method_effective_path: POST /v1/correction-requests
    r9_permission: correction.create
    state_event: FINDING_OPEN→CORRECTION_REQUIRED | correction.requested
    exposure: Correction references exact asset/layer/region; shared translation remains system-level.
  - port_uid: ASSET-01-PORT-DECISION
    boundary: Candidate Confirm
    r9_operation: decideOutputCandidate
    method_effective_path: POST /v1/tasks/{taskId}/outputs/{outputVersionId}/decision
    r9_permission: department.output.decide
    state_event: CANDIDATE_OUTPUT→SCORE_PENDING | output.decision_recorded
    exposure: ASSET-01-ACT-CANDIDATE-CONFIRM.
  - port_uid: ASSET-01-PORT-SCORECARD
    boundary: Score Persist
    r9_operation: submitScorecard
    method_effective_path: POST /v1/scorecards
    r9_permission: department.score.write
    state_event: SCORE_PENDING→BLOCKED or HANDOFF_READY | scorecard.submitted
    exposure: Persist bound ASSET criteria version; page never invents dimension schema.
  - port_uid: ASSET-01-PORT-OUT-VIDEO
    boundary: Outbound to VIDEO
    r9_operation: createDepartmentHandoff
    method_effective_path: POST /v1/handoffs
    r9_permission: department.handoff.create
    state_event: HANDOFF_READY→HANDED_OFF; VIDEO dependency→READY | handoff.created
    exposure: ASSET-01-ACT-HANDOFF; exact locked manifest only.
  - port_uid: ASSET-01-PORT-LAYER-DOC-CREATE
    boundary: Layer Runtime
    r9_operation: createLayerDocument
    method_effective_path: POST /v1/layer-documents
    r9_permission: asset.layer.write
    state_event: DRAFT→ACTIVE | layer.document.created
    exposure: Image-compatible asset only.
  - port_uid: ASSET-01-PORT-LAYER-DOC-UPDATE
    boundary: Layer Runtime
    r9_operation: updateLayerDocument
    method_effective_path: PATCH /v1/layer-documents/{layerDocumentId}
    r9_permission: asset.layer.write
    state_event: ACTIVE→ACTIVE | layer.document.updated
    exposure: Versioned update only.
  - port_uid: ASSET-01-PORT-LAYER-ADD
    boundary: Layer Runtime
    r9_operation: addLayer
    method_effective_path: POST /v1/layer-documents/{layerDocumentId}/layers
    r9_permission: asset.layer.write
    state_event: layer document version increments
    exposure: Add layer.
  - port_uid: ASSET-01-PORT-LAYER-DELETE
    boundary: Layer Runtime
    r9_operation: deleteLayer
    method_effective_path: DELETE /v1/layer-documents/{layerDocumentId}/layers/{layerId}
    r9_permission: asset.layer.write
    state_event: layer document version increments
    exposure: Locked layer rejects destructive mutation.
  - port_uid: ASSET-01-PORT-LAYER-DUP
    boundary: Layer Runtime
    r9_operation: duplicateLayer
    method_effective_path: POST /v1/layer-documents/{layerDocumentId}/layers/{layerId}/duplicate
    r9_permission: asset.layer.write
    state_event: layer document version increments
    exposure: Duplicate layer.
  - port_uid: ASSET-01-PORT-LAYER-REORDER
    boundary: Layer Runtime
    r9_operation: reorderLayer
    method_effective_path: POST /v1/layer-documents/{layerDocumentId}/layers/{layerId}/reorder
    r9_permission: asset.layer.write
    state_event: layer document version increments
    exposure: z_index remains unique/compact.
  - port_uid: ASSET-01-PORT-LAYER-PROPS
    boundary: Layer Runtime
    r9_operation: updateLayerProperties
    method_effective_path: PATCH /v1/layer-documents/{layerDocumentId}/layers/{layerId}
    r9_permission: asset.layer.write
    state_event: layer document version increments
    exposure: Opacity/blend/transform etc.
  - port_uid: ASSET-01-PORT-LAYER-MASK
    boundary: Layer Runtime
    r9_operation: updateLayerMask
    method_effective_path: PATCH /v1/layer-documents/{layerDocumentId}/layers/{layerId}/mask
    r9_permission: asset.layer.write
    state_event: layer document version increments
    exposure: Mask/semantic region.
  - port_uid: ASSET-01-PORT-PATCH-CREATE
    boundary: Asset Patch
    r9_operation: createAssetPatch
    method_effective_path: POST /v1/asset-patches
    r9_permission: asset.layer.write
    state_event: asset.patch.created
    exposure: Exact source asset/layer/blueprint/DNA refs required.
  - port_uid: ASSET-01-PORT-PATCH-PREVIEW
    boundary: Asset Patch
    r9_operation: previewAssetPatch
    method_effective_path: POST /v1/asset-patches/{patchId}/preview
    r9_permission: asset.layer.write
    state_event: Patch→PREVIEW_READY
    exposure: No output version created yet.
  - port_uid: ASSET-01-PORT-PATCH-DECIDE
    boundary: Asset Patch
    r9_operation: decideAssetPatch
    method_effective_path: POST /v1/asset-patches/{patchId}/decision
    r9_permission: asset.patch.decide
    state_event: ACCEPT→new ASSET_VERSION + new LAYER_DOCUMENT_VERSION; REJECT/REVISE no output
    exposure: No non-ASSET patch operation may bind to this port.
