  - G:SOURCE-WRITE::REQ=knowledge.source.configure|authorized scope::BLOCK=permission denied
  - G:SOURCE-SAVE::REQ=knowledge.source.configure|source draft selected|scope valid|rights valid|classification set|expected_version matches::BLOCK=missing required source field|version conflict|invalid
    rights/config
  - G:SOURCE-PAUSE::REQ=knowledge.source.configure|source status ACTIVE|expected_version matches::BLOCK=source already paused/retired|version conflict
  - G:SOURCE-RESUME::REQ=knowledge.source.configure|source status PAUSED|rights/config still valid|expected_version matches::BLOCK=source not paused|rights/config invalid|version conflict
  - G:SOURCE-RETIRE::REQ=knowledge.source.configure|source exists|expected_version matches::BLOCK=active non-cancelable run|version conflict
  - G:INGEST-START::REQ=knowledge.ingestion.execute|source ACTIVE|rights/config valid|no prohibited duplicate active run::BLOCK=source paused/retired|rights invalid|duplicate active run|connector unavailable
  - G:INGEST-RETRY::REQ=knowledge.ingestion.execute|run status FAILED|retry_eligible true::BLOCK=retry policy blocks|source retired|non-retryable failure
  - G:CONTEXT-DRAFT::REQ=knowledge.context.create|result authorized|source/evidence traceable::BLOCK=classification denied|untraceable result
  - G:CONTEXT-CREATE::REQ=knowledge.context.create|selected_refs >= 1|scope set|purpose set|all selected refs authorized|all factual refs traceable::BLOCK=empty selection|missing scope/purpose|citation
    missing|classification denied|conflicting exact versions unresolved
  - G:EXPERIENCE-READ::REQ=knowledge.experience.read|experience authorized::BLOCK=scope denied
  - G:REPLAY-COMPARE::REQ=knowledge.experience.read|at least two comparable attempts/versions::BLOCK=insufficient comparable items
  - G:LEARNING-CREATE::REQ=knowledge.learning.create|ACPOSExperienceRecord state OUTCOME_COMPLETE|root cause/pattern evidence exists::BLOCK=outcome pending|insufficient evidence|scope unresolved
  - G:DRAFT-FROM-EXP::REQ=knowledge.draft.write|experience outcome complete|trace lineage complete::BLOCK=outcome pending|lineage incomplete
  - G:DRAFT-SAVE::REQ=knowledge.draft.write|draft selected|required fields valid|expected_version matches::BLOCK=version conflict|required field missing|classification invalid
  - G:KNOWLEDGE-REVIEW::REQ=knowledge.review.approve|draft state REVIEW|review rationale present::BLOCK=permission denied|draft not in review|rationale missing
  - G:KNOWLEDGE-APPROVE::REQ=knowledge.review.approve|draft state REVIEW|review rationale present|scope explicit|classification explicit|mandatory checks complete|factual claims have citation/source or
    validated governed outcome|conflicts resolved or explicitly blocked|previous approved version preserved when superseding|expected_version matches::BLOCK=citation missing|outcome unvalidated|unsupported
    factual generalization|authority conflict unresolved|mandatory check incomplete|version conflict
error_registry:
  count: 14
  format: uid::code::message_zh::recovery
  rows:
  - E:001::KB_PERMISSION_DENIED::沒有此知識範圍的權限。::HIDE_PROTECTED_CONTENT_AND_ACTION
  - E:002::KB_SCOPE_INVALID::Scope 缺失或超出授權範圍。::CORRECT_SCOPE
  - E:003::KB_VERSION_CONFLICT::資料版本已變更。::REFRESH_EXACT_VERSION_AND_REVIEW_DIFF
  - E:004::KB_SOURCE_RIGHTS_INVALID::來源 Rights / Classification 不允許目前操作。::FIX_SOURCE_GOVERNANCE
  - E:005::KB_DUPLICATE_ACTIVE_RUN::已有不可重複的執行中 Run。::OPEN_EXISTING_RUN
  - E:006::KB_INGESTION_NOT_RETRYABLE::此失敗不可直接重試。::OPEN_FAILURE_DETAIL_AND_RESOLVE_CAUSE
  - E:007::KB_CITATION_REQUIRED::Fact 缺少可追溯 Citation / Evidence。::ADD_VALID_CITATION_OR_RECLASSIFY
  - E:008::KB_CONTEXT_CONFLICT::Context Candidate 存在未解決版本/來源衝突。::RESOLVE_CONFLICT_BEFORE_CREATE
  - E:009::KB_OUTCOME_PENDING::Experience 尚未完成 Outcome。::WAIT_FOR_REAL_OUTCOME
  - E:010::KB_LINEAGE_INCOMPLETE::Experience Replay 缺少必要 Exact Lineage。::RESOLVE_SOURCE_LINEAGE
  - E:011::KB_REVIEW_CHECK_INCOMPLETE::Knowledge Review Mandatory Check 尚未完成。::COMPLETE_REVIEW_CHECKLIST
  - E:012::KB_AUTHORITY_CONFLICT::Draft 與 Current Authority / Confirmed Truth 衝突。::REVIEW_AND_RESOLVE_CONFLICT
  - E:013::KB_RAW_SECRET_FORBIDDEN::禁止在 Knowledge Source 儲存或顯示 Raw Secret。::USE_SECRET_REFERENCE_OR_REGISTERED_CONNECTOR
  - E:014::KB_UNSUPPORTED_OPERATION::此操作未在 KB-01 Current Authority 註冊。::BLOCK_AND_REPORT_AUTHORITY_GAP
state_machines:
  KnowledgeSource:
    states:
    - DRAFT
    - ACTIVE
    - PAUSED
    - RETIRED
    transitions:
    - DRAFT->ACTIVE::A:SOURCE-SAVE::G:SOURCE-SAVE
    - ACTIVE->PAUSED::A:SOURCE-PAUSE::G:SOURCE-PAUSE
    - PAUSED->ACTIVE::A:SOURCE-RESUME::G:SOURCE-RESUME
    - DRAFT,ACTIVE,PAUSED->RETIRED::A:SOURCE-RETIRE::G:SOURCE-RETIRE
  KnowledgeIngestionRun:
    states:
    - PENDING
    - RUNNING
    - NORMALIZING
    - COMPLETED
    - FAILED
    - RETRY_ELIGIBLE
    transitions:
    - 'PENDING->RUNNING::ACPOS_SHARED_EXTERNAL_DATA_ACQUISITION_RUNTIME::'
    - 'RUNNING->NORMALIZING::ACPOS_SHARED_EXTERNAL_DATA_ACQUISITION_RUNTIME::'
    - 'NORMALIZING->COMPLETED::ACPOS_SHARED_EXTERNAL_DATA_ACQUISITION_RUNTIME::'
    - 'RUNNING,NORMALIZING->FAILED::ACPOS_SHARED_EXTERNAL_DATA_ACQUISITION_RUNTIME::'
    - FAILED->RETRY_ELIGIBLE::ACPOS_SHARED_EXTERNAL_DATA_ACQUISITION_RUNTIME::failure policy permits retry
    - RETRY_ELIGIBLE->PENDING::A:INGEST-RETRY::G:INGEST-RETRY
  ACPOSContextCandidate:
    states:
    - DRAFT
    - READY_FOR_CONSUMER_REVIEW
    - ADOPTED
    - REJECTED
    - RETIRED
    transitions:
    - DRAFT->READY_FOR_CONSUMER_REVIEW::A:CONTEXT-CANDIDATE-CREATE::G:CONTEXT-CREATE
    - READY_FOR_CONSUMER_REVIEW->ADOPTED,REJECTED::CONSUMER_DOMAIN_GOVERNANCE::KB-01 cannot perform consumer adoption.
  ACPOSExperienceRecord:
    states:
    - CAPTURED
    - OUTCOME_PENDING
    - OUTCOME_COMPLETE
    - REPLAY_READY
    transitions:
    - 'CAPTURED->OUTCOME_PENDING::ACPOSExperienceEngine::'
    - OUTCOME_PENDING->OUTCOME_COMPLETE::ACPOSExperienceEngine::real outcome/evaluation data sufficient
    - OUTCOME_COMPLETE->REPLAY_READY::ACPOSExperienceEngine::required lineage resolvable
  ACPOSLearningCandidate:
    states:
    - DRAFT
    - REVIEW
    - ADOPTED
    - REJECTED
    - SUPERSEDED
    transitions:
    - ->DRAFT::A:LEARNING-CREATE::G:LEARNING-CREATE
    - 'DRAFT->REVIEW::ACPOSEvolutionEngine / Governance::'
    - REVIEW->ADOPTED,REJECTED::ACPOS_GOVERNANCE::Cannot silently mutate Canon/Criteria/Permission/RoutePolicy.
  KnowledgeVersion:
    states:
    - DRAFT
    - REVIEW
    - APPROVED
    - RETURNED
    - REJECTED
    - SUPERSEDED
    - RETIRED
    transitions:
    - ->DRAFT::A:KNOWLEDGE-DRAFT-FROM-EXPERIENCE::G:DRAFT-FROM-EXP
    - DRAFT->DRAFT::A:KNOWLEDGE-DRAFT-SAVE::G:DRAFT-SAVE
    - DRAFT->REVIEW::KnowledgeExperienceService::submit for review
    - REVIEW->APPROVED::A:KNOWLEDGE-APPROVE::G:KNOWLEDGE-APPROVE
    - REVIEW->RETURNED::A:KNOWLEDGE-RETURN::G:KNOWLEDGE-REVIEW
    - REVIEW->REJECTED::A:KNOWLEDGE-REJECT::G:KNOWLEDGE-REVIEW
    - APPROVED->SUPERSEDED::KnowledgeExperienceService::new approved version supersedes exact prior version
