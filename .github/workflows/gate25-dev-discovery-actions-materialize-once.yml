name: ACPOS Gate25 DEV Discovery Actions Materialize Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-dev-discovery-actions-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize-dev-discovery-actions:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_EXPECT_RELEASE_SHA: 526316501c86fe54f02603cdb47da5ad51a005dc
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute governed Production DEV discovery lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/production-dev-lifecycle-e2e.mjs
          node scripts/production-dev-lifecycle-e2e.mjs | tee "$RUNNER_TEMP/dev-lifecycle.log"
          grep -q '^PRODUCTION_DEV_LIFECYCLE_E2E_PASS ' "$RUNNER_TEMP/dev-lifecycle.log"
          grep -q 'start=RUNNING pause=PAUSED resume=RUNNING stop=STOPPED external_request_sent=false deployment_triggered=false' "$RUNNER_TEMP/dev-lifecycle.log"
      - name: Materialize exact DEV discovery ACTION PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone

          log=(Path(os.environ['RUNNER_TEMP'])/'dev-lifecycle.log').read_text()
          match=re.search(r'^PRODUCTION_DEV_LIFECYCLE_E2E_PASS release_sha=([^ ]+) discovery_job_id=([^ ]+) start=RUNNING pause=PAUSED resume=RUNNING stop=STOPPED external_request_sent=false deployment_triggered=false$',log,re.M)
          assert match,'DEV lifecycle PASS payload missing'
          release_sha,job_id=match.groups()
          assert release_sha==os.environ['ACPOS_EXPECT_RELEASE_SHA'],(release_sha,os.environ['ACPOS_EXPECT_RELEASE_SHA'])

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_DEV_DISCOVERY_ACTIONS_PRODUCTION_PASS_2026-09-10.json')
          ledger=json.loads(ledger_path.read_text())
          before=dict(ledger['counts'])
          assert before=={'PASS':47,'BLOCKED':145,'NOT_EXECUTED':1289},before
          entries={e['resource_key']:e for e in ledger['entries']}
          actions=[
            ('action:admin:DEV-01:ACT-DISCOVERY-START','startCompanyDiscovery','RUNNING'),
            ('action:admin:DEV-01:ACT-DISCOVERY-PAUSE','pauseCompanyDiscovery','PAUSED'),
            ('action:admin:DEV-01:ACT-DISCOVERY-RESUME','resumeCompanyDiscovery','RUNNING'),
            ('action:admin:DEV-01:ACT-DISCOVERY-STOP','stopCompanyDiscovery','STOPPED'),
          ]
          for key,_,_ in actions:
            assert entries[key]['disposition']=='NOT_EXECUTED',(key,entries[key]['disposition'])

          evidence={
            'document_id':'ACPOS_GATE25_DEV_DISCOVERY_ACTIONS_PRODUCTION_PASS',
            'status':'PASS',
            'recorded_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':release_sha,
            'deployment_url':os.environ['ACPOS_DEPLOYMENT_URL'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'discovery_job_id':job_id,
            'acceptance_scope':'GATE_24_DEV',
            'resource_count':4,
            'lifecycle':['RUNNING','PAUSED','RUNNING','STOPPED'],
            'external_request_sent':False,
            'deployment_triggered':False,
            'normal_projection_excludes_acceptance_scope':True,
            'formal_resources':[x[0] for x in actions],
            'runtime_evidence':['scripts/production-dev-lifecycle-e2e.mjs','src/server/dev/productionDevCommandRuntime.ts','src/server/shared/identityPageCommandRuntime.ts','src/server/shared/pageCatalogProjectionRuntime.ts'],
            'rule':'Uses the registered isolated GATE_24_DEV acceptance lifecycle. The acceptance row is stopped after validation and is explicitly excluded from the normal DEV projection; no external request or deployment is triggered.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          run_ref=f'GitHub Actions: ACPOS Gate25 DEV Discovery Actions Materialize run_id={os.environ["GITHUB_RUN_ID"]}'
          for key,operation,state in actions:
            e=entries[key]
            e['disposition']='PASS'
            e['reason_code']='PRODUCTION_DEV_DISCOVERY_LIFECYCLE_E2E_PASS'
            e['evidence_refs']=[str(evidence_path),run_ref,'scripts/production-dev-lifecycle-e2e.mjs','src/server/dev/productionDevCommandRuntime.ts','src/server/shared/identityPageCommandRuntime.ts']
            e['operation_ids']=[operation]
            e['acceptance_detail']=f'Production isolated discovery lifecycle reached expected state {state}; external_request_sent=false and deployment_triggered=false.'
          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for e in ledger['entries']:counts[e['disposition']]+=1
          assert counts=={'PASS':51,'BLOCKED':145,'NOT_EXECUTED':1285},counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':4,'job_id':job_id},ensure_ascii=False))
          PY
      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit DEV discovery ACTION evidence and ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_DEV_DISCOVERY_ACTIONS_PRODUCTION_PASS_2026-09-10.json
          git commit -m 'evidence(gate25): pass 4 DEV discovery Production actions'
          git push origin HEAD:new
