name: ACPOS Batch 91 Fresh Entity and Hierarchy Closure Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch91_fresh_entity_hierarchy_closure_audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fresh exact-head closure audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="5daa7f58bb8f6d2545fdfb1fe0ebf53f7ce4bd8e"
          WF=Path(".github/workflows/acpos_batch91_fresh_entity_hierarchy_closure_audit.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT: raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          EXPECTED_MATRIX_PAGES=set(PAGE_DOCS)-{"WB-01"}
          OPS=[
            "DISCOVER_OR_LIST","SELECT_OR_OPEN","CREATE","CREATION_MODE","PARENT_BIND",
            "CATEGORY_OR_GROUP_BIND","DRAFT","RESUME","EDIT","SAVE","VALIDATE",
            "CONFIRM_OR_APPROVE","VERSION","REVISE","LOCK_OR_UNLOCK","REORDER",
            "MOVE_OR_REPARENT","ARCHIVE_OR_DELETE","RESTORE","DEPENDENCY_IMPACT",
            "AUDIT","ERROR_RECOVERY","NEXT_STEP",
          ]
          HIER_HEADERS=[
            "Parent Identity","Child Identity","Cardinality","Creation Entry",
            "Payload / Reference Binding","Ordering Semantics","Permission",
            "State Dependency","Version Dependency","Move / Reparent",
            "Archive / Delete Propagation","Upstream Change Impact",
            "Downstream Revalidation","Authority Evidence"
          ]
          EXPECTED_HIER_EDGES={
            ("IAM-01","ACCOUNT","PERMISSION-DRAFT"),
            ("IAM-01","ACCOUNT","PERM-ASSIGNMENT"),
            ("KB-01","KnowledgeSource","Acquisition Run"),
            ("KB-01","Experience / Replay","Learning Candidate"),
            ("KB-01","Experience / Replay","KnowledgeVersion"),
            ("SYS-01","System Change","Change Candidate"),
            ("SYS-01","System Change","Decision Record"),
            ("SYS-01","System Change","Validation Run"),
          }
          FORBIDDEN={
            "AssistantSummary / CoreEvaluation","ConversationThread / Message",
            "HumanDecision / StructuredDecision","Campaign / Audience",
            "Discovery Profile / Topic","KnowledgeAcquisitionIntent / Run",
            "Conversation / Thread"
          }
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          def n(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def txt(el):return n("".join((x.text or "") for x in el.iter(W+"t")))
          def tables(fn):
              with zipfile.ZipFile(fn) as z:root=ET.fromstring(z.read("word/document.xml"))
              out=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[[txt(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
                  out.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return out

          if len(list(Path(".").glob("*.docx")))!=31: raise SystemExit("DOCX_COUNT_FAIL")

          app=[]; app_tabs=[]; hier=[]; hier_tabs=[]; forbidden=[]; noncanon=[]
          projection_tabs=[]
          for page,fn in PAGE_DOCS.items():
              for t in tables(fn):
                  h=[n(x) for x in t["headers"]]
                  if h==["Entity","Operation","Applicability","Authority Evidence"]:
                      app_tabs.append((page,t["table"]))
                      for ri,row in enumerate(t["rows"],2):
                          if len(row)<4: raise SystemExit(f"APP_ROW_WIDTH {page} {t['table']} {ri}")
                          e,o,a,ev=map(n,row[:4])
                          app.append({"page":page,"table":t["table"],"row":ri,"entity":e,"operation":o,"applicability":a,"evidence":ev})
                  elif h==["Projection / Read Model","Operation","Applicability","Authority Evidence"]:
                      projection_tabs.append((page,t["table"],len(t["rows"])))
                  if h==HIER_HEADERS:
                      hier_tabs.append((page,t["table"]))
                      for ri,row in enumerate(t["rows"],2):
                          vals=[n(x) for x in row[:14]]
                          hier.append({"page":page,"table":t["table"],"row":ri,"values":vals})
                  hs=" | ".join(h).upper()
                  if h!=HIER_HEADERS and (("PARENT" in hs and "CHILD" in hs) or ("父" in hs and "子" in hs)):
                      noncanon.append({"page":page,"table":t["table"],"headers":h})
                  for row in t["rows"]:
                      for cell in row:
                          if n(cell) in FORBIDDEN:
                              forbidden.append({"page":page,"table":t["table"],"value":n(cell)})

          # Applicability exact denominator.
          pages=set(p for p,_ in app_tabs)
          matrix_page_mismatch={
            "missing":sorted(EXPECTED_MATRIX_PAGES-pages),
            "unexpected":sorted(pages-EXPECTED_MATRIX_PAGES)
          }
          invalid=[x for x in app if x["operation"] not in OPS or x["applicability"] not in {"REQUIRED","OPTIONAL","NOT_APPLICABLE"} or not x["entity"] or not x["evidence"]]
          pairs=collections.Counter((x["page"],x["entity"],x["operation"]) for x in app)
          duplicate=[{"page":p,"entity":e,"operation":o,"count":c} for (p,e,o),c in pairs.items() if c!=1]
          byent=collections.defaultdict(set)
          for x in app:byent[(x["page"],x["entity"])].add(x["operation"])
          incomplete=[{"page":p,"entity":e,"missing":sorted(set(OPS)-ops)} for (p,e),ops in byent.items() if ops!=set(OPS)]
          entities=set(byent)
          ac=collections.Counter(x["applicability"] for x in app)

          # Hierarchy exact denominator.
          hier_invalid=[]
          hier_edges=set()
          for x in hier:
              vals=x["values"]
              if len(vals)!=14 or not all(vals):
                  hier_invalid.append(x);continue
              hier_edges.add((x["page"],vals[0],vals[1]))
          missing_hier=sorted(EXPECTED_HIER_EDGES-hier_edges)
          unexpected_hier=sorted(hier_edges-EXPECTED_HIER_EDGES)

          summary={
            "marker":"ACPOS-20260922-BATCH-91-FRESH-ENTITY-HIERARCHY-CLOSURE-AUDIT-V1",
            "base_head":EXPECTED_PARENT,
            "docx_files":31,
            "canonical_applicability_tables":len(app_tabs),
            "projection_matrix_tables":len(projection_tabs),
            "projection_matrix_rows":sum(x[2] for x in projection_tabs),
            "applicability_rows":len(app),
            "business_entities":len(entities),
            "required":ac.get("REQUIRED",0),
            "optional":ac.get("OPTIONAL",0),
            "not_applicable":ac.get("NOT_APPLICABLE",0),
            "invalid_applicability_rows":len(invalid),
            "duplicate_entity_operation_pairs":len(duplicate),
            "entity_operation_incomplete":len(incomplete),
            "matrix_page_missing":matrix_page_mismatch["missing"],
            "matrix_page_unexpected":matrix_page_mismatch["unexpected"],
            "canonical_hierarchy_tables":len(hier_tabs),
            "canonical_hierarchy_rows":len(hier),
            "hierarchy_invalid_rows":len(hier_invalid),
            "hierarchy_missing_expected_edges":len(missing_hier),
            "hierarchy_unexpected_edges":len(unexpected_hier),
            "noncanonical_parent_child_tables":len(noncanon),
            "residual_forbidden_compound_rows":len(forbidden),
          }
          out={
            "summary":summary,
            "invalid_applicability":invalid,
            "duplicates":duplicate,
            "incomplete":incomplete,
            "hierarchy_invalid":hier_invalid,
            "hierarchy_missing":missing_hier,
            "hierarchy_unexpected":unexpected_hier,
            "noncanonical":noncanon,
            "forbidden":forbidden,
            "projection_tables":projection_tabs,
          }
          Path("__batch91_closure.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch91_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH91_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))

          if len(app_tabs)!=17 or matrix_page_mismatch["missing"] or matrix_page_mismatch["unexpected"]: raise SystemExit("MATRIX_PAGE_FAIL")
          if len(app)!=2300 or len(entities)!=100: raise SystemExit("APP_DENOMINATOR_FAIL")
          if ac.get("REQUIRED",0)!=237 or ac.get("OPTIONAL",0)!=0 or ac.get("NOT_APPLICABLE",0)!=2063: raise SystemExit("APP_CLASS_COUNT_FAIL")
          if invalid or duplicate or incomplete: raise SystemExit("APP_CONTRACT_FAIL")
          if projection_tabs!=[("WB-01",8,14)]: raise SystemExit("WB_PROJECTION_MATRIX_FAIL")
          if len(hier_tabs)!=3 or len(hier)!=8: raise SystemExit("HIER_DENOMINATOR_FAIL")
          if hier_invalid or missing_hier or unexpected_hier or noncanon: raise SystemExit("HIER_CLOSURE_FAIL")
          if forbidden: raise SystemExit("FORBIDDEN_COMPOUND_RESIDUAL")
          print("BATCH91_FRESH_ENTITY_AND_HIERARCHY_CLOSURE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acpos-batch91-fresh-entity-hierarchy-closure
          path: |
            __batch91_closure.json
            __batch91_summary.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Close harness
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch91_closure.json __batch91_summary.json
          git config user.name "acpos-batch91-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch91_fresh_entity_hierarchy_closure_audit.yml
          git commit -m "chore(acpos): close batch 91 fresh entity hierarchy audit"
          git push origin HEAD:0921acpos
