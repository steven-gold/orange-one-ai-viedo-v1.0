  - index: 0
    style: Normal
    text: 'DEV-01 企業自動開發系統

      Mother Basic Design · Functional Completion · Broad Discovery · Enterprise Outreach Governance

      ORANGE ONE · admin:DEV-01'
  - index: 1
    style: Normal
    text: 本版沿用 DEV-01 現有單頁五階段企業開發架構，補齊母規範要求的需求、Entity × Operation、Broad Discovery、Signal / Opportunity、Contact Evidence、功能鏈、跨頁來源治理、權限／狀態／錯誤、Geometry、A11y、Acceptance
      與施工映射。
  - index: 2
    style: Normal
    text: 核心優化：使用者先定義「要找什麼企業商機」，由受治理的 Shared Acquisition 在允許範圍內發現來源與企業訊號；再沿用既有 Company → Candidate → Campaign → Individual Delivery 閉環，不建立第二套 CRM、Company DB、Campaign
      Engine、Delivery Engine 或 Source Registry。
  - index: 4
    style: Normal
    text: 圖 1｜DEV-01 優化後主工作區：商機持續搜集、Signal / Company 結果與治理 Rail。
  - index: 5
    style: Heading 1
    text: 1. Page Identity / 頁面定位與產品目標
  - index: 7
    style: Heading 1
    text: 2. Scope / 需求、角色、Out-of-Scope 與非功能要求
  - index: 9
    style: Heading 1
    text: 3. Business Entity × Operation / 產品實體與操作矩陣
  - index: 11
    style: Heading 1
    text: 4. Entity Hierarchy / 資料與生命週期關係
  - index: 12
    style: Normal
    text: Discovery Profile → Discovery Job → Market Signal → Company → Contact / Opportunity → Message Candidate → Campaign → Campaign Recipient → Individual Delivery。Evidence、Suppression、Permission、Audit
      與 Version/Correlation 為跨鏈治理層。
  - index: 14
    style: Heading 1
    text: 5. Five-Stage Functional Workbench / 五階段產品流程
  - index: 16
    style: Normal
    text: 顯示優化：Stage 01 以「商機持續搜集」呈現產品目的，但底層 discovery stage / owner 不需要重建。每個 Stage 同一情境最多 1 個 Primary CTA。
  - index: 17
    style: Heading 1
    text: 6. Functional Admission / 功能加入、降級與移除規則
  - index: 19
    style: Heading 1
    text: 7. Layout / Interaction Topology / 視覺與互動拓撲
  - index: 22
    style: Normal
    text: 圖 2｜DEV-01 Stage 01 / 02 操作結構：Profile、Signal 結果、Company/Opportunity 與治理狀態。
  - index: 23
    style: Heading 1
    text: 8. Section / Component Registry / 頁面結構
  - index: 25
    style: Heading 1
    text: 9. Control / Action Registry / 現行控制與必要補強
  - index: 27
    style: Heading 1
    text: 9.1 Optimization Additions / 補齊但不膨脹頁面的互動
  - index: 29
    style: Normal
    text: 補強控制不等於全部做成常駐按鈕。Evidence、Contact Disable、Won/Lost、Suppression detail、Rescore、每列 Campaign 加入/移除等低頻操作必須收斂到 Row / Drawer / More。
  - index: 30
    style: Heading 1
    text: 10. Stage 01 / Broad Discovery & Source Governance
  - index: 32
    style: Heading 1
    text: 11. Stage 02 / Company, Contact Evidence & Opportunity
  - index: 34
    style: Heading 1
    text: 12. Stage 03–05 / Candidate → Campaign → Individual Delivery
  - index: 37
    style: Normal
    text: 圖 3｜DEV-01 Campaign / Delivery：Recipient Preview、Approval 與一對一外寄治理。
  - index: 38
    style: Heading 1
    text: 13. Functional Chain / 必須完整閉環的核心鏈
  - index: 40
    style: Heading 1
    text: 14. State / Gate / Permission Model
  - index: 42
    style: Heading 1
    text: 14.1 Critical Gates
  - index: 44
    style: Heading 1
    text: 15. API / Runtime / Cross-page Integration
  - index: 46
    style: Normal
    text: Cross-page：來源設定回到 KB / Shared Acquisition；Provider / model / secret 不在 DEV-01 管理；前後台權限由 IAM-01 明確 assignment；任何共享能力只能被引用，不可複製成 page-local runtime。
  - index: 47
    style: Heading 1
    text: 16. Data / Lineage / Security / Error Recovery
  - index: 49
    style: Heading 1
    text: 17. Visual Geometry / States / Responsive / i18n / A11y
  - index: 51
    style: Heading 1
    text: 18. Validation / Acceptance / Definition of Done
  - index: 53
    style: Heading 1
    text: 18.1 Definition of Done
  - index: 54
    style: List Bullet
    text: Page Design：9 Sections、必要 Components、現行 22 control 基礎與 6 個優化補強 interaction 均有位置、狀態、Gate 與 owner boundary。
  - index: 55
    style: List Bullet
    text: Functional：五階段同頁流程成立；Profile/Signal/Opportunity 不造成第二套 domain system。
  - index: 56
    style: List Bullet
    text: Data：Company/Contact/Candidate/Campaign/Delivery lineage 可追溯；Suppression / Evidence / Audit 不丟失。
  - index: 57
    style: List Bullet
    text: Runtime：所有 effectful operation 綁 exact registered owner；未解析者 Fail-Closed。
  - index: 58
    style: List Bullet
    text: Visual：科技紫、72/28、52px Stage Bar、56px Action Dock、480–560 Drawer 一致；無卡片牆與假 KPI。
  - index: 59
    style: List Bullet
    text: Test：Unit / API / Permission / Browser / E2E / Production 各層依適用範圍分別驗證，不能互相代替。
  - index: 60
    style: Heading 1
    text: 19. Construction Mapping / 施工落點
  - index: 62
    style: Normal
    text: 施工優先順序：先完成 Profile / Signal / Opportunity 的 owner / schema / permission / API contract，再做 Stage 01–02 UI 補強；Stage 03–05 優先重用現有 Candidate / Campaign / Delivery
      閉環，避免因優化前兩階段而重做後半系統。
  - index: 64
