# governance-single-branch-current-validation
name: Current Governance Cleanup Validation

on:
  push:
    branches:
      - rebuild-v2.1.1

permissions:
  contents: read
  issues: read
  actions: read
  statuses: write

concurrency:
  group: current-governance-cleanup-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install hash-locked verifier dependencies
        id: install
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock

      - name: Gate 01 - Promotion transaction contract
        id: gate01
        run: python governance/ci/governance_promotion_transaction.py --self-test

      - name: Gate 02 - Stage definition and selected profile
        id: gate02
        run: |
          set -euo pipefail
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/validate_selected_execution_profile_integrity.py

      - name: Gate 03A - Active consumer reference integrity
        id: gate03a
        run: python governance/ci/validate_active_consumer_reference_integrity.py

      - name: Gate 03B - Governance layout
        id: gate03b
        run: |
          set +e
          python governance/ci/validate_governance_layout.py > /tmp/issue60-gate03b.log 2>&1
          RC=$?
          cat /tmp/issue60-gate03b.log
          exit "$RC"

      - name: Gate 04 - Mutation safety portability and domain isolation
        id: gate04
        run: |
          set -euo pipefail
          python governance/ci/validate_structured_mutation_safety.py --self-test
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_governance_portability.py
          python governance/ci/validate_execution_domain_isolation.py

      - name: Gate 05 - Single-branch source and governance preformal
        id: gate05
        run: |
          set +e
          python governance/ci/validate_successor_governance_preformal.py > /tmp/issue60-gate05.log 2>&1
          RC=$?
          cat /tmp/issue60-gate05.log
          if [ "$RC" -ne 0 ]; then
            WEB_GOVERNANCE_PREFORMAL_SUITE_CHILD=1 python - <<'PY' > /tmp/issue60-regression-detail.log 2>&1
          import json, os, subprocess, sys
          from pathlib import Path
          root=Path(".github/governance-source/active/source/09_TESTS/governance")
          suites=[
            "test_reference_semantic_guard.py",
            "test_prefomal_stress_repairs.py",
            "test_bugfix_regressions.py",
            "test_v2_1_8_successor_evidence_sync_bugfix.py",
            "test_v2_1_9_evidence_state_closure.py",
            "test_v2_1_13_stage_execution_invariants.py",
          ]
          for name in suites:
            cp=subprocess.run([sys.executable,name],cwd=str(root),text=True,capture_output=True,env={**os.environ,"WEB_GOVERNANCE_PREFORMAL_SUITE_CHILD":"1"})
            print("SUITE",name,"RC",cp.returncode)
            try:
              d=json.loads(cp.stdout)
              rows=d.get("results") or d.get("semantic_results") or []
              bad=[x for x in rows if isinstance(x,dict) and x.get("ok") is False]
              print(json.dumps({"total":d.get("total"),"passed_expectations":d.get("passed_expectations"),"semantic_cases_total":d.get("semantic_cases_total"),"semantic_passed_expectations":d.get("semantic_passed_expectations"),"failing_cases":bad},ensure_ascii=False))
            except Exception:
              print(cp.stdout[-4000:])
              print(cp.stderr[-2000:])
          PY
            cat /tmp/issue60-regression-detail.log
          fi
          exit "$RC"

      - name: Gate 06 - Source stage and product-neutral invariants
        id: gate06
        run: |
          set -euo pipefail
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_product_neutral_entity_lifecycle.py

      - name: Gate 07 - Audit closure
        id: gate07
        run: |
          set -euo pipefail
          python governance/ci/audit_closure_engine.py --self-test
          python governance/ci/audit_closure_engine.py

      - name: Gate 08 - Promotion readiness semantics and retired-path guards
        id: gate08
        run: |
          set -euo pipefail
          python governance/ci/validate_governance_candidate_promotion_readiness.py --self-test
          test ! -e governance/ci/compile_stage_execution_preflight.py
          test ! -e governance/ci/stage_execution_adapters/stage02_functional_contract.py

      - name: Gate 09 - Full high-pressure Stage regression
        id: gate09
        run: python governance/ci/test_stage_execution_engine.py
      - name: Gate 10 - External admission layer isolation
        id: gate10
        run: |
          python .github/governance-source/active/source/09_TESTS/governance/validate_external_execution_admission.py
          python governance/ci/test_external_execution_admission.py
      - name: Report exact tested-head diagnostic without mutating governance
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
          VALIDATION_TESTED_HEAD: ${{ github.sha }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_GATE01: ${{ steps.gate01.outcome }}
          OUT_GATE02: ${{ steps.gate02.outcome }}
          OUT_GATE03A: ${{ steps.gate03a.outcome }}
          OUT_GATE03B: ${{ steps.gate03b.outcome }}
          OUT_GATE04: ${{ steps.gate04.outcome }}
          OUT_GATE05: ${{ steps.gate05.outcome }}
          OUT_GATE06: ${{ steps.gate06.outcome }}
          OUT_GATE07: ${{ steps.gate07.outcome }}
          OUT_GATE08: ${{ steps.gate08.outcome }}
          OUT_GATE09: ${{ steps.gate09.outcome }}
          OUT_GATE10: ${{ steps.gate10.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          payload={
            "artifact_type":"CURRENT_GOVERNANCE_CLEANUP_VALIDATION_DIAGNOSTIC",
            "tested_head":os.environ["VALIDATION_TESTED_HEAD"],
            "job_status":os.environ["VALIDATION_JOB_STATUS"],
            "step_outcomes":{
              "install":os.environ.get("OUT_INSTALL",""),
              "gate01":os.environ.get("OUT_GATE01",""),
              "gate02":os.environ.get("OUT_GATE02",""),
              "gate03a":os.environ.get("OUT_GATE03A",""),
              "gate03b":os.environ.get("OUT_GATE03B",""),
              "gate04":os.environ.get("OUT_GATE04",""),
              "gate05":os.environ.get("OUT_GATE05",""),
              "gate06":os.environ.get("OUT_GATE06",""),
              "gate07":os.environ.get("OUT_GATE07",""),
              "gate08":os.environ.get("OUT_GATE08",""),
              "gate09":os.environ.get("OUT_GATE09",""),
              "gate10":os.environ.get("OUT_GATE10",""),
            },
            "persistence":"GITHUB_ACTIONS_JOB_LOG_ONLY",
            "governance_branch_mutation":False,
          }
          print(json.dumps(payload,sort_keys=True,indent=2))
          PY
          if [ -f /tmp/issue60-gate03b.log ]; then cat /tmp/issue60-gate03b.log; fi
          if [ -f /tmp/issue60-gate05.log ]; then cat /tmp/issue60-gate05.log; fi
          if [ -f /tmp/issue60-regression-detail.log ]; then cat /tmp/issue60-regression-detail.log; fi

      - name: Publish exact-head validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$VALIDATION_JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=error ;;
          esac
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          state={"success":"success","failure":"failure","error":"error"}[os.environ.get("STATE","error")]
          payload={
            "state":state,
            "context":"Governance/Current Cleanup",
            "description":"Current Governance Cleanup Validation on exact HEAD",
            "target_url":f'{os.environ["GITHUB_SERVER_URL"]}/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }
          req=urllib.request.Request(
            f"https://api.github.com/repos/{repo}/statuses/{sha}",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization":f'Bearer {os.environ["GH_TOKEN"]}',
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json",
            },
            method="POST",
          )
          with urllib.request.urlopen(req) as r:
            if r.status not in (200,201):
              raise SystemExit(f"status publish failed: {r.status}")
          PY
        env:
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
