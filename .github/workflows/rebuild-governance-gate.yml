name: Governance v2.1.7 Page Base Blueprint Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-v217-upstream-projection-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Replay sealed Segment Mapping and Source Facts validators at their valid phase boundary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v217_upstream_projection.py
  current-v217-phase-authority-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify legal Stage-1 phase boundary and unresolved external Authority preservation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v217_phase_authority.py
  current-v217-responsibility-classification-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Replay sealed 52/52 Responsibility Classification validator at its valid phase boundary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v217_classification_projection.py
  current-v217-page-base-blueprint-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify two PAGE_BASE_BLUEPRINTs, exact classification hashes, domain isolation, and unresolved Authority carry-forward
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v217_page_base_blueprint.py
  sealed-v216-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact sealed v2.1.6 runtime, Stage-1 33/33, and lifecycle 11/11
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_sealed_v216_runtime.py
