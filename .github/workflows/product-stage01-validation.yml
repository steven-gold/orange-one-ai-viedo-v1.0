name: Product Stage01 Validation
on:
  push:
    branches: [0921acpos]
    paths:
      - 'STAGE_EXECUTION/STAGE-01/**/WORK_UNIT_TERMINAL_RECEIPT.yaml'
      - 'STAGE_EXECUTION/STAGE-01/CURRENT_STAGE01_RESUME.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-stage01:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: governance
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          STATUS="$(awk '$1=="status:" {print $2; exit}' "$SEL")"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          test "$STATUS" = "SELECTED_EXACT_CURRENT_SNAPSHOT" || exit 32
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - name: Set up governance Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Load exact Current governance
        run: |
          set -euo pipefail
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Validate only current CLEAN Stage01 terminal Work Units
        run: |
          set -euo pipefail
          python governance/ci/stage_execution_engine.py --definition-audit-all
          mapfile -t RECEIPTS < <(find STAGE_EXECUTION/STAGE-01 -mindepth 2 -maxdepth 2 -type f -name WORK_UNIT_TERMINAL_RECEIPT.yaml -path '*/WU-STAGE01-*-CLEAN-001/*' | sort)
          test "${#RECEIPTS[@]}" -gt 0 || { echo "BLOCK:NO_CURRENT_CLEAN_STAGE01_TERMINAL_RECEIPT"; exit 41; }
          for RECEIPT in "${RECEIPTS[@]}"; do
            B="$(dirname "$RECEIPT")"
            test -f "$B/EVIDENCE/CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml"
            test -f "$B/EVIDENCE/STAGE01_NORMALIZED_EVIDENCE.json"
            python governance/ci/stage_execution_engine.py --validate-evidence --stage STAGE-01 --evidence "$B/EVIDENCE/STAGE01_NORMALIZED_EVIDENCE.json"
            python -c "import json,yaml,sys; from pathlib import Path; p=Path(sys.argv[1]); t=p.read_text(encoding='utf-8'); d=(json.loads(t) if t.lstrip().startswith('{') else (yaml.safe_load(t) or {})); req=('provider','repository_or_project','head_sha','run_id','job_denominator','conclusion','governance_uid','stage_uid','work_unit_uid','evidence_ref'); missing=[k for k in req if d.get(k) in (None,'',[])]; assert not missing, 'BLOCK:PERSISTED_TERMINAL_RECEIPT_FIELD_MISSING:'+','.join(missing); assert d.get('conclusion')=='success' and d.get('stage_uid')=='STAGE-01', 'BLOCK:PERSISTED_TERMINAL_RECEIPT_IDENTITY_OR_RESULT_DRIFT'; print('PASS: persisted Stage01 terminal receipt structurally bound to prior successful closure validation head='+str(d['head_sha'])[:8])" "$RECEIPT"
          done
      - name: Reject stale predecessor or REENTRY current identities
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          forbidden=(
            'WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-001',
            'WU-STAGE01-WB01-DASHBOARD-001',
            'WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001',
            'WU-STAGE01-WB01-DASHBOARD-REENTRY-001',
          )
          for p in Path('STAGE_EXECUTION/STAGE-01').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.yaml','.yml','.json'}:
                  continue
              body=p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in body:
                      raise SystemExit(f'BLOCK:STALE_STAGE01_CURRENT_IDENTITY:{token}:{p}')
          resume=Path('STAGE_EXECUTION/STAGE-01/CURRENT_STAGE01_RESUME.yaml')
          if resume.is_file():
              import yaml
              r=yaml.safe_load(resume.read_text()) or {}
              text=str(r)
              for token in forbidden:
                  if token in text:
                      raise SystemExit('BLOCK:STALE_STAGE01_RESUME_IDENTITY:'+token)
          print('PASS: Stage01 validation consumes only current CLEAN Work Units')
          PY
