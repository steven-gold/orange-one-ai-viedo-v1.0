name: Product Stage01 Current Step Execute
on:
  workflow_run:
    workflows: ["Product Full Stage Lifecycle Validation"]
    types: [completed]
permissions:
  contents: write
jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == '0921acpos'
    runs-on: ubuntu-24.04
    outputs:
      work_units: ${{ steps.map.outputs.work_units }}
      skip: ${{ steps.map.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: map
        env:
          CURRENT_VALIDATED_HEAD: ${{ github.event.workflow_run.head_sha }}
          CURRENT_VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import os,yaml
          reqp=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml')
          trigp=Path('STAGE_EXECUTION/STAGE-01/STAGE01_CURRENT_EXECUTION_TRIGGER.yaml')
          if not reqp.is_file() or not trigp.is_file():
              print('skip=true')
              raise SystemExit(0)
          req=yaml.safe_load(reqp.read_text(encoding='utf-8')) or {}
          trig=yaml.safe_load(trigp.read_text(encoding='utf-8')) or {}
          if req.get('status')!='CONSUMED' or req.get('auto_enter_stage01') is not True:
              print('skip=true')
              raise SystemExit(0)
          source_validated_head=str(req.get('validated_head_sha') or '')
          source_validation_run_id=str(req.get('validation_run_id') or '')
          if not source_validated_head or not source_validation_run_id:
              raise SystemExit('BLOCK:STAGE01_PRESTAGE_SOURCE_VALIDATION_BINDING_MISSING')
          if trig.get('status')!='READY_AWAITING_RUNTIME_INLINE_VALIDATION_AND_VALIDATED_STAGE_ENTRY':
              print('skip=true')
              raise SystemExit(0)
          current_head=os.environ['CURRENT_VALIDATED_HEAD']
          current_run=os.environ['CURRENT_VALIDATION_RUN_ID']
          if not current_head or not current_run:
              raise SystemExit('BLOCK:STAGE01_EFFECTFUL_CURRENT_VALIDATION_BINDING_MISSING')
          wus=trig.get('work_units') or []
          if not wus:
              raise SystemExit('BLOCK:STAGE01_TRIGGER_WORK_UNITS_EMPTY')
          print('skip=false')
          print('work_units='+','.join(map(str,wus)))
          print('prestage_source_validated_head='+source_validated_head)
          print('prestage_source_validation_run_id='+source_validation_run_id)
          print('effectful_entry_validated_head='+current_head)
          print('effectful_entry_validation_run_id='+current_run)
          PY
  execute:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/product-stage-current-execute-reusable.yml
    with:
      stage: STAGE-01
      work_units: ${{ needs.resolve.outputs.work_units }}
    secrets: inherit
