name: STR-01 Current Authority Validation

on:
  push:
    branches:
      - str-01-current-authority-closure
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Current-only STR registry scan
        run: |
          node <<'NODE'
          const fs = require('fs');
          const authority = fs.readFileSync('authority/pages/workspace/STR-01/ACPOS_STR-01_FINAL_LOCKED_ENCODING_PROVIDER_BOUND.yaml', 'utf8');
          const visual = fs.readFileSync('src/components/pages/StrategyVisual.tsx', 'utf8');
          const runtime = fs.readFileSync('src/components/pages/StrategyControlRuntime.tsx', 'utf8');
          const command = fs.readFileSync('src/domain/strategy/strategyCommandPort.ts', 'utf8');
          const projection = fs.readFileSync('src/domain/strategy/strategyProjectionPort.ts', 'utf8');
          const authorityControls = [...authority.matchAll(/^\s*- control_uid:\s*(STR-01-[A-Z0-9-]+)/gm)].map(m => m[1]);
          const visualControls = [...visual.matchAll(/s\("(STR-01-[A-Z0-9-]+)"/g)].map(m => m[1]);
          const uniqueAuthority = [...new Set(authorityControls)];
          const uniqueVisual = [...new Set(visualControls)];
          if (uniqueAuthority.length !== 57) throw new Error(`authority controls=${uniqueAuthority.length}, expected 57`);
          if (uniqueVisual.length !== 57) throw new Error(`visual controls=${uniqueVisual.length}, expected 57`);
          const missing = uniqueAuthority.filter(x => !uniqueVisual.includes(x));
          const extra = uniqueVisual.filter(x => !uniqueAuthority.includes(x));
          if (missing.length || extra.length) throw new Error(`control mismatch missing=${missing.join(',')} extra=${extra.join(',')}`);
          const authorityActions = new Set([...authority.matchAll(/^\s*- action_uid:\s*(STR-01-ACT-[A-Z0-9-]+)/gm)].map(m => m[1]));
          const code = [visual, runtime, command, projection].join('\n');
          const codeActions = [...new Set([...code.matchAll(/STR-01-ACT-[A-Z0-9-]+/g)].map(m => m[0]))];
          const unregisteredActions = codeActions.filter(x => !authorityActions.has(x));
          if (unregisteredActions.length) throw new Error(`unregistered actions: ${unregisteredActions.join(',')}`);
          if (/STR-01-PORT-SEND/.test(code)) throw new Error('unregistered STR-01-PORT-SEND leaked into code');
          if (/provider_picker|ProviderModelProfile|ProviderGateway/.test(code)) throw new Error('page-local provider routing pollution detected');
          if (!/data-audit-trace-drawer/.test(runtime) || !/role="dialog"/.test(runtime)) throw new Error('audit drawer implementation missing');
          console.log(`STR_CURRENT_ONLY_STATIC_PASS controls=${uniqueVisual.length} actions=${codeActions.length}`);
          NODE
      - run: npm run typecheck
      - run: npm run build
      - name: Start production server
        run: |
          npm start -- -p 3000 > /tmp/acpos-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/strategy >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/acpos-next.log
          exit 1
      - name: Formal runtime fail-closed checks
        run: |
          code=$(curl -sS -o /tmp/send.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3000/v1/conversations/validation/messages)
          test "$code" = "503"
          grep -q 'CONVERSATION_RUNTIME_NOT_BOUND' /tmp/send.json
          code=$(curl -sS -o /tmp/compare.json -w '%{http_code}' http://127.0.0.1:3000/v1/candidates/compare)
          test "$code" = "503"
          grep -q 'CANDIDATE_COMPARE_RUNTIME_NOT_BOUND' /tmp/compare.json
          code=$(curl -sS -o /tmp/review.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3000/v1/state-commands/strategycandidate/submitstrategyreview)
          test "$code" = "503"
          grep -q 'STRATEGY_DECISION_RUNTIME_NOT_BOUND' /tmp/review.json
          code=$(curl -sS -o /tmp/adopt.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3000/v1/state-commands/strategycandidate/adoptascontextcandidate)
          test "$code" = "503"
          grep -q 'STRATEGY_DECISION_RUNTIME_NOT_BOUND' /tmp/adopt.json
          echo 'STR_FORMAL_RUNTIME_FAIL_CLOSED_PASS'
      - name: Browser smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1600,height:1000}});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            const response = await page.goto('http://127.0.0.1:3000/strategy', {waitUntil:'networkidle'});
            if (!response || response.status() !== 200) throw new Error(`strategy status=${response?.status()}`);
            const pageUid = await page.locator('[data-page-uid="workspace:STR-01"]').count();
            const controls = await page.locator('[data-control-id]').count();
            const registry = await page.locator('[data-page-uid="workspace:STR-01"]').getAttribute('data-registry-valid');
            if (pageUid !== 1) throw new Error(`pageUid count=${pageUid}`);
            if (controls !== 57) throw new Error(`controls=${controls}, expected 57`);
            if (registry !== 'true') throw new Error(`registry=${registry}`);
            if (errors.length) throw new Error(`page errors: ${errors.join(' | ')}`);
            console.log(`STR_BROWSER_SMOKE_PASS controls=${controls} registry=${registry}`);
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Build drift cleanup and clean check
        if: always()
        run: |
          git checkout -- next-env.d.ts tsconfig.json 2>/dev/null || true
          rm -f tsconfig.tsbuildinfo
          git status --short
          test -z "$(git status --porcelain)"
