      - CORE-01-BTN-PROJECT-CREATE
      - createProjectDraft
      - POST /v1/core/projects/drafts
      - OWNER_DEFINED_CURRENT_CONTRACT
      - CreateProjectDraftRequest
      - System 04 / Project + ProjectDraftVersion + Audit
      - Creates a governed editable ProjectDraftVersion under one Project identity. Raw AI output is not canonical authority; idempotency/version/audit identity are
        required.
    - row: 2
      cells:
      - CORE-01-BTN-TOPIC-CREATE
      - createTopicDraft
      - POST /v1/core/projects/{projectId}/topics/drafts
      - OWNER_DEFINED_CURRENT_CONTRACT
      - CreateTopicDraftRequest
      - System 04 / Topic + TopicProductionScope Draft + Audit
      - Creates a production-scoped Topic draft only from valid Project lineage. Topic cannot recreate Project Story/World/Base DNA/Project Blueprint authority.
    - row: 3
      cells:
      - CORE-01-FLD-EVALUATION
      - evaluateCoreCandidate
      - POST /v1/core/candidates/{candidateId}/evaluation
      - OWNER_DEFINED_CURRENT_CONTRACT
      - EvaluateCoreCandidateRequest
      - System 04 / CandidateVersion + Evaluation Evidence + QualityCriteriaRef
      - Formal evaluation requires exact approved criteria and evidence. Score/AI consensus cannot auto-adopt, auto-approve or auto-lock a candidate.
    - row: 4
      cells:
      - CORE-01-FLD-HUMAN-DECISION
      - recordCoreHumanDecision
      - POST /v1/core/candidates/{candidateId}/human-decisions
      - OWNER_DEFINED_CURRENT_CONTRACT
      - RecordCoreHumanDecisionRequest
      - System 04 / CandidateVersion + Human Decision Evidence/Audit
      - Records explicit authorized human decision/rationale bound to exact candidate/version/evidence. Human decision is distinct from later lock approval.
    - row: 5
