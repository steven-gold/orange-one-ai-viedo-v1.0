name: ACPOS Batch 14 Operation Owner Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-14-operation-owner-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Verify no Word drift since Batch 13
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="0e116b28d18af69b031fb03497a75ed78dcd7f83"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-13")
          PY
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_14_operation_owner_audit.py
      - name: Run Batch 14 audit
        run: python __temp/batch_14_operation_owner_audit.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-14-operation-owner-audit
          path: __batch14_operation_owner_audit.json
          retention-days: 1
