  - index: 110
    style: Normal
    text: Where the operation registry already supplies a control:* authorization resource, that exact control resource is reused. For current single-page UI operations
      that exist in the page UI + operation registry but expose only an action/page authorization resource, this closure creates a deterministic AIAPI-01-BTN-<OPERATION>
      construction UID and marks UID Status as NEW_CONSTRUCTION_UID_FROM_EXISTING_CURRENT_UI_OPERATION. The operation, path, authorization owner, payload fields and
      runtime are not changed.
  - index: 111
    style: Heading 2
    text: Construction Resolution Rule
  - index: 112
    style: Normal
    text: '施工 AI MUST resolve UI behavior from this order: page machine authority → exact control row → action/gate/permission → payload/schema → operation/method/path
      → runtime/persistence owner → source runtime status. If a row is SPEC_EXACT_RUNTIME_BLOCKED or SPEC_EXACT_RUNTIME_NOT_EXECUTED, the UI definition is known but
      effectful enablement is forbidden until implementation evidence closes. If a quantitative value is SOURCE_NOT_DEFINED, do not choose a “reasonable” number.'
