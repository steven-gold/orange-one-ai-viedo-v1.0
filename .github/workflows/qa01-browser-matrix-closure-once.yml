name: QA01 Browser Matrix Closure Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-browser-matrix-closure-once.yml'

permissions:
  contents: read

jobs:
  chromium:
    strategy:
      fail-fast: false
      matrix:
        scenario: [CORRECTION, MANUAL_REQUIRED, AUTO, PRODUCTION]
    runs-on: ubuntu-latest
    env:
      ACPOS_QA_TEST_SCENARIO: ${{ matrix.scenario == 'PRODUCTION' && 'CORRECTION' || matrix.scenario }}
      NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ${{ matrix.scenario == 'PRODUCTION' && 'PRODUCTION' || 'TEST' }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Install ephemeral Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run isolated QA browser scenario
        run: |
          npm run dev -- -p 3300 > /tmp/next.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://localhost:3300/qa >/dev/null 2>&1 && break; sleep 0.5; done
          cat > qa01-matrix.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const ctl=(p,id)=>p.locator(`[data-control-id="${id}"]`);
          const val=async(p,id)=>((await ctl(p,id).locator('strong').textContent())||'').trim();
          const click=async(p,id)=>{const e=ctl(p,id);await e.waitFor({state:'visible'});await p.waitForFunction(id=>{const x=document.querySelector(`[data-control-id="${id}"]`);return x instanceof HTMLButtonElement&&!x.disabled},id,{timeout:15000});await e.click()};
          const state=async(p,s)=>p.waitForFunction(s=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')===s,s,{timeout:15000});
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1600,height:1200}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));try{await p.goto('http://localhost:3300/qa',{waitUntil:'networkidle'});await p.waitForSelector('[data-page-uid="QA-01"]');const sc=process.env.SCENARIO;
            if(sc!=='PRODUCTION')await p.waitForFunction(()=>{const e=document.querySelector('[data-control-id="QA-01-BTN-AUTO-START"]');return e instanceof HTMLButtonElement&&!e.disabled},{timeout:15000});
            if(sc==='CORRECTION'){
              assert(await p.locator('[data-page-uid="QA-01"]').getAttribute('data-registry-valid')==='true','registry false');await p.getByRole('button',{name:'MANUAL',exact:true}).click();await click(p,'QA-01-BTN-START-REVIEW');await state(p,'QA-01-ST-FAIL');assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='82','score 82 missing');assert(await ctl(p,'QA-01-BTN-FINDING-CREATE').isDisabled(),'finding should block');assert(await ctl(p,'QA-01-BTN-FINDING-CREATE').getAttribute('data-disabled-reason')==='AUTHORITY_GAP_QA_ISSUE_CATEGORY_REGISTRY','authority gap mismatch');await ctl(p,'QA-01-INP-CORR-ACTION').fill('[TEST] original owner correction');await click(p,'QA-01-BTN-CORRECTION');await state(p,'QA-01-ST-CORRECTION');assert(await val(p,'QA-01-FLD-NEW-VERSION')==='TEST-EDIT-OUTPUT-002','new exact output missing');await click(p,'QA-01-BTN-RECHECK');await state(p,'QA-01-ST-PASS');assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='98','recheck score missing');await click(p,'QA-01-BTN-RELEASE-CREATE');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-REL-PACKAGE"] strong')?.textContent==='TEST-RELEASE-CANDIDATE-001');assert(await p.locator('[data-action-uid="QA-01-ACT-GATE-PASS"],[data-action-uid="QA-01-ACT-GATE-FAIL"]').count()===0,'direct gate control exposed');assert(await p.locator('[data-control-id*="PUBLISH"],[data-action-uid*="PUBLISH"]').count()===0,'publish exposed');
            }else if(sc==='MANUAL_REQUIRED'){
              await p.getByRole('button',{name:'MANUAL',exact:true}).click();await click(p,'QA-01-BTN-START-REVIEW');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-GATE-STATUS"] strong')?.textContent==='MANUAL_REVIEW_REQUIRED');assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='97','manual score missing');const mb=p.locator('[data-component-uid="QA-01-CMP-MANUAL-DECISION"] button');assert(await mb.count()===2,'manual mutation count not 2');const acts=await mb.evaluateAll(es=>es.map(e=>e.getAttribute('data-action-uid')).sort());assert(JSON.stringify(acts)===JSON.stringify(['QA-01-ACT-MANUAL-MODIFY','QA-01-ACT-MANUAL-PASS'].sort()),`manual action mismatch ${JSON.stringify(acts)}`);assert(await p.locator('[data-component-uid="QA-01-CMP-SCORE"] input,[data-component-uid="QA-01-CMP-SCORE"] select,[data-component-uid="QA-01-CMP-SCORE"] textarea,[data-component-uid="QA-01-CMP-SCORE"] button').count()===0,'human scoring exposed');await click(p,'QA-01-BTN-MANUAL-MODIFY');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-BTN-MANUAL-MODIFY"]')?.getAttribute('data-last-action')==='true');await click(p,'QA-01-BTN-MANUAL-PASS');await state(p,'QA-01-ST-PASS');assert(await val(p,'QA-01-FLD-GATE-STATUS')==='PASS','manual pass did not re-evaluate gate');
            }else if(sc==='AUTO'){
              assert(await ctl(p,'QA-01-BTN-START-REVIEW').count()===0,'manual start visible in AUTO');const q=p.locator('[data-control-id="QA-01-LIST-REVIEWS"] [data-item-ref]');assert(await q.count()===2,'AUTO queue count mismatch');for(let i=0;i<2;i++)assert(await q.nth(i).isDisabled(),'AUTO queue can reorder');await click(p,'QA-01-BTN-AUTO-START');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-AUTO-PROGRESS"] strong')?.textContent==='2/2',null,{timeout:15000});assert(await p.locator('[data-control-id*="PUBLISH"],[data-action-uid*="PUBLISH"]').count()===0,'AUTO publish exposed');
            }else{
              await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-ERROR"] strong')?.textContent?.includes('UI_PROJECTION_RUNTIME_NOT_BOUND'),null,{timeout:15000});const r=await p.request.post('http://localhost:3300/v1/qa/reviews',{data:{project_id:'X',topic_id:'Y',output_version_id:'Z',qa_profile_id:'Q'}});assert(r.status()===503,`expected 503 got ${r.status()}`);const body=await r.json();assert(body.reason_code==='QA_RUNTIME_NOT_BOUND',`unexpected production reason ${JSON.stringify(body)}`);
            }
            assert(errors.length===0,`page errors ${errors}`);console.log(`QA01_${sc}_PASS`);
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa01-matrix.cjs
