name: ACPOS Batch 118 Persistence Owner Completion
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch118_persistence_owner_completion.yml
permissions:
  contents: write
jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install DOCX and render tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
      - name: Complete 20 source-backed Persistence Owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.enum.text import WD_BREAK
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          import subprocess,re,json,zipfile,collections

          BASE="985504b6e138332d5f8e8dd375f6518820bbbfa8"
          if subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()!=BASE:
              raise SystemExit("EXACT_PARENT_FAIL")

          SYS01=Path("01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx")
          SYS05=Path("05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx")
          SYS08=Path("08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx")
          SYS09=Path("09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx")
          KB=Path("ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx")
          SG=Path("ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx")
          STR=Path("ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx")
          FILES=[SYS01,SYS05,SYS08,SYS09,KB,SG,STR]
          for p in FILES:
              if not p.exists(): raise SystemExit(f"MISSING {p}")

          M={}
          def add(uids,persistence,entity,semantics):
              for uid in uids:
                  M[uid]={"persistence":persistence,"entity":entity,"semantics":semantics}

          add([
            "KB-01-CTL-SOURCE-CREATE","KB-01-CTL-SOURCE-SAVE","KB-01-CTL-SOURCE-PAUSE",
            "KB-01-CTL-SOURCE-RESUME","KB-01-CTL-SOURCE-RETIRE"
          ],
          "KnowledgeExperienceService / KnowledgeSource State + Version + Audit",
          "KnowledgeSource",
          "Source create/update/state-transition persists the exact KnowledgeSource identity, scope/rights/classification/configuration, lifecycle state/version and audit lineage. RETIRED may not be silently revived; historical source/version evidence remains addressable.")

          add([
            "KB-01-CTL-INGEST-START","KB-01-CTL-INGEST-RETRY"
          ],
          "Shared Acquisition Runtime / Acquisition Run + Snapshot/Evidence + Audit",
          "Acquisition Run",
          "KnowledgeAcquisitionIntent is a value object; create/retry persists a governed Acquisition Run under Shared Acquisition Runtime with exact source_ref/scope/mode/correlation/idempotency, attempt/checkpoint, immutable snapshot/evidence and audit lineage. It does not create a second crawler owner.")

          add(["KB-01-CTL-CONTEXT-CREATE"],
          "ACPOSContextEngine / ACPOSContextCandidate + Evidence/Audit",
          "ACPOSContextCandidate",
          "Creates a governed Context Candidate from authorized Knowledge/Fact/Evidence refs. Candidate remains READY_FOR_CONSUMER_REVIEW and does not self-adopt or duplicate source Authority payload.")

          add(["KB-01-CTL-LEARNING-CREATE"],
          "ACPOSEvolutionEngine / ACPOSLearningCandidate + Evidence/Audit",
          "ACPOSLearningCandidate",
          "Creates a governed Learning Candidate only from complete real Experience/outcome lineage. Candidate remains non-authoritative until separate governed review/adoption and may not self-write Canon/Criteria/Policy.")

          add([
            "KB-01-CTL-DRAFT-FROM-EXP","KB-01-CTL-DRAFT-SAVE"
          ],
          "KnowledgeExperienceService / KnowledgeVersion Draft + Evidence/Citation + Audit",
          "KnowledgeVersion / Draft",
          "Creates or updates the governed KnowledgeVersion DRAFT from exact Experience/Evidence/Citation refs and expected version. Draft mutation is versioned and auditable and does not imply approval.")

          add([
            "KB-01-CTL-APPROVE","KB-01-CTL-RETURN","KB-01-CTL-REJECT"
          ],
          "KnowledgeExperienceService / KnowledgeVersion Review State + Approval/Review + Audit",
          "KnowledgeVersion / Review",
          "Persists the exact KnowledgeVersion review transition and human review evidence. APPROVE makes the governed approved version immutable; RETURN/REJECT preserve prior approved versions and evidence lineage rather than overwriting history.")

          add(["CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE"],
          "QualityGovernance / Resolved Governed Criteria Resource Draft/Version + Impact/Audit",
          "QualityGovernance governed resource",
          "resource_type/resource_id MUST resolve to a legal QualityGovernance resource (criteria version, dimension/threshold/check/mapping/gate-policy domain). Configure persists a governed draft/version plus impact and audit lineage; it never mutates an ACTIVE version in place.")

          add(["CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE"],
          "QualityGovernance / Resolved Governed Criteria Resource Approved Version + ApprovalRecord/Impact/Audit",
          "QualityGovernance governed resource",
          "Approval requires exact REVIEW resource/version, impact/mapping evidence and rationale. Persistence records APPROVED state/version, ApprovalRecord, Impact and audit lineage; downstream QA resolves exact ACTIVE criteria_version and historical results retain their original binding.")

          add(["CTRL-ADMIN-STR-02-ACT-01-ACT-CONFIGURE"],
          "StrategyFactPackService / Resolved StrategicSource or StrategicFact Governed State/Version + Audit",
          "StrategicSource or StrategicFact",
          "ADMIN STR View 2 is Intelligence/Fact governance. resource_type/resource_id resolves the exact StrategicSource or StrategicFact; shared IAM_RUNTIME is governance ingress only. Persistence remains StrategyFactPackService, preserving source/fact version, citation/quality/scope and audit lineage.")

          add(["CTRL-ADMIN-STR-02-ACT-02-ACT-APPROVE"],
          "StrategyFactPackService / Resolved StrategicSource or StrategicFact Approved State/Version + Approval/Audit",
          "StrategicSource or StrategicFact",
          "Approves the exact Intelligence/Fact governed resource/version under StrategyFactPackService. Approval persists exact approved state/version plus rationale/evidence and audit lineage; inference cannot be promoted to Fact without evidence governance.")

          add(["CTRL-ADMIN-STR-03-ACT-02-ACT-APPROVE"],
          "StrategyService / PlatformPlaybook Approved Version + Approval/Audit",
          "PlatformPlaybook",
          "Playbook approval follows the existing draft/version chain. Persistence resolves exact PlatformPlaybook/version and records approved state, rationale/approval and audit lineage; it does not publish or execute downstream work.")

          add(["CTRL-ADMIN-STR-05-ACT-02-ACT-APPROVE"],
          "StrategyService / OpportunityCandidate Approved State + Version/Audit",
          "OpportunityCandidate",
          "Opportunity approval resolves the exact OpportunityCandidate/version created from governed Trend/Forecast evidence, persists approved/review state plus evidence/audit lineage, and does not convert the candidate into an automatic Strategy decision or downstream execution.")

          if len(M)!=20: raise SystemExit(f"MAPPING_COUNT_FAIL {len(M)}")

          def norm(s):return re.sub(r"\s+"," ",(s or "").strip())
          def setp(p,text):
              if p.runs:
                  p.runs[0].text=text
                  for r in p.runs[1:]:r.text=""
              else:p.text=text
          def setc(c,text):
              if c.paragraphs:
                  setp(c.paragraphs[0],text)
                  for p in c.paragraphs[1:]:setp(p,"")
              else:c.text=text
          def heads(t):return [norm(c.text) for c in t.rows[0].cells] if t.rows else []
          def full(d):
              out=[p.text for p in d.paragraphs]
              for t in d.tables:
                  for r in t.rows:out.append(" | ".join(c.text for c in r.cells))
              return "\n".join(out)
          def add_table(d,h,rows):
              t=d.add_table(rows=1,cols=len(h));t.style="Table Grid"
              for i,x in enumerate(h):t.rows[0].cells[i].text=x
              for row in rows:
                  cs=t.add_row().cells
                  for i,x in enumerate(row):cs[i].text=str(x)
              return t
          def page_break(d):
              p=d.add_paragraph();p.add_run().add_break(WD_BREAK.PAGE)
          def cant_split_from_marker(d,marker):
              body=list(d._element.body);start=None
              for i,el in enumerate(body):
                  if el.tag==qn("w:p"):
                      s="".join((x.text or "") for x in el.iter(qn("w:t")))
                      if marker in s:start=i;break
              if start is None:return 0
              n=0
              for el in body[start:]:
                  if el.tag!=qn("w:tbl"):continue
                  for tr in el.iter(qn("w:tr")):
                      trPr=tr.find(qn("w:trPr"))
                      if trPr is None:
                          trPr=OxmlElement("w:trPr");tr.insert(0,trPr)
                      if trPr.find(qn("w:cantSplit")) is None:trPr.append(OxmlElement("w:cantSplit"))
                      n+=1
              return n

          expected_files={
            uid:set() for uid in M
          }
          for uid in M:
              if uid.startswith("KB-"):
                  expected_files[uid]={SYS01.name,SYS09.name,KB.name}
              elif uid.startswith("CTRL-ADMIN-SG"):
                  expected_files[uid]={SYS05.name,SYS09.name,SG.name}
              else:
                  expected_files[uid]={SYS08.name,STR.name}

          seen=collections.defaultdict(set)
          row_updates=0
          for path in FILES:
              d=Document(path)
              for t in d.tables:
                  h=heads(t)
                  if "Control UID" not in h or "Persistence Owner" not in h:continue
                  ci=h.index("Control UID");pi=h.index("Persistence Owner")
                  for row in t.rows[1:]:
                      uid=norm(row.cells[ci].text)
                      if uid in M:
                          setc(row.cells[pi],M[uid]["persistence"])
                          seen[uid].add(path.name);row_updates+=1
              d.save(path)

          for uid,files in expected_files.items():
              if seen[uid]!=files:
                  raise SystemExit(f"MIRROR_SET_FAIL {uid} expected={sorted(files)} seen={sorted(seen[uid])}")
          if row_updates!=56:raise SystemExit(f"ROW_UPDATE_COUNT_FAIL {row_updates}")

          # Add compact authoritative closure annexes only to the canonical page + primary system owner.
          annexes=[
            (KB,SYS01,"[ACPOS-KB-PERSISTENCE-OWNER-CLOSURE-V1]",
             [uid for uid in M if uid.startswith("KB-")],
             "KB-01 Persistence Owner Closure｜知識與經驗持久化 Owner 收斂",
             "This annex closes the 14 KB-01 mutation Persistence Owner gaps from the existing Entity/Canonical Owner table, lifecycle matrix, relationship contract and Action Group/Owner table. It introduces no second Knowledge, Context, Learning or Acquisition owner."),
            (SG,SYS05,"[ACPOS-SG02-PERSISTENCE-OWNER-CLOSURE-V1]",
             [uid for uid in M if uid.startswith("CTRL-ADMIN-SG")],
             "SG-02 Persistence Owner Closure｜品質治理持久化 Owner 收斂",
             "This annex closes the two SG-02 governance mutation Persistence Owner gaps. QualityGovernance remains the canonical page/domain owner; IAM_RUNTIME remains the shared governance ingress, not the business persistence owner."),
            (STR,SYS08,"[ACPOS-ADMIN-STR-PERSISTENCE-OWNER-CLOSURE-V1]",
             [uid for uid in M if uid.startswith("CTRL-ADMIN-STR")],
             "ADMIN-STR Persistence Owner Closure｜戰略治理持久化 Owner 收斂",
             "This annex closes the four remaining ADMIN-STR governance mutation Persistence Owner gaps using the existing View/Entity/Owner boundary. IAM_RUNTIME is shared governance ingress only; StrategyFactPackService and StrategyService retain canonical business persistence authority.")
          ]
          annex_rows=0
          for page,system,marker,uids,title,intro in annexes:
              for path in [page,system]:
                  d=Document(path)
                  if marker not in full(d):
                      page_break(d)
                      d.add_heading(title,level=1)
                      d.add_paragraph(marker+" "+intro)
                      add_table(d,["Control UID","Business Entity / Resolution","Canonical Persistence Owner","Design Semantics"],[
                        (uid,M[uid]["entity"],M[uid]["persistence"],M[uid]["semantics"]) for uid in uids
                      ])
                      d.add_heading("Shared Invariants / 共用不變式",level=2)
                      inv=[
                        ("Ingress ≠ Persistence Owner","Shared route/runtime/identity ingress does not transfer business data authority. The target resource/entity decides canonical persistence."),
                        ("Exact identity/version","Every effectful mutation MUST resolve the exact entity/resource identity and version/state required by its current gate; latest/current aliases may not silently replace exact binding."),
                        ("Audit lineage","Effectful state/version changes preserve correlation/idempotency/evidence or rationale as applicable and generate/retain governed audit lineage."),
                        ("No parallel authority","The closure reuses the existing canonical owner shown in the current Word corpus and MUST NOT create a duplicate store/service for the same concept."),
                        ("Runtime evidence separation","A complete design Persistence Owner does not claim application/API/DB/Production execution. Runtime status remains separately evidenced and may remain NOT_EXECUTED where the current Word says so.")
                      ]
                      add_table(d,["Invariant","Rule"],inv)
                      annex_rows+=len(uids)+len(inv)+2
                      cant_split_from_marker(d,marker)
                      d.save(path)

          # Post-write exact checks in all seven docs.
          residual=[]
          observed=collections.defaultdict(list)
          for path in FILES:
              d=Document(path)
              for t in d.tables:
                  h=heads(t)
                  if "Control UID" not in h or "Persistence Owner" not in h:continue
                  ci=h.index("Control UID");pi=h.index("Persistence Owner")
                  for row in t.rows[1:]:
                      uid=norm(row.cells[ci].text)
                      if uid in M:
                          val=norm(row.cells[pi].text)
                          observed[uid].append({"file":path.name,"value":val})
                          if val!=M[uid]["persistence"]:
                              residual.append({"uid":uid,"file":path.name,"value":val,"expected":M[uid]["persistence"]})
              with zipfile.ZipFile(path) as z:
                  bad=z.testzip()
                  if bad:raise SystemExit(f"ZIP_BAD {path} {bad}")
          if residual:raise SystemExit("OWNER_VALUE_MISMATCH "+repr(residual))
          for uid,recs in observed.items():
              if {r["value"] for r in recs}!={M[uid]["persistence"]}:raise SystemExit(f"CROSSDOC_OWNER_DRIFT {uid}")
          changed=[x for x in subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",BASE],text=True).splitlines() if x.endswith(".docx")]
          if sorted(changed)!=sorted(p.name for p in FILES):raise SystemExit("MODIFIED_SCOPE_FAIL "+repr(changed))
          Path("__batch118_manifest.json").write_text(json.dumps({
            "modified_docx":changed,"unique_controls":20,"mirrored_rows_updated":row_updates,
            "mappings":M,"observed":observed,"annex_rows":annex_rows
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH118_WRITE_PASS="+json.dumps({
            "modified_docx":len(changed),"unique_controls":20,
            "mirrored_rows_updated":row_updates,"owner_conflicts":0
          },sort_keys=True))
          PY
      - name: Exact 20-control closure validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from docx import Document
          import re,json
          files=[
            "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx"
          ]
          targets=set(json.load(open("__batch118_manifest.json"))["mappings"])
          gap=[]
          found=set()
          for fn in files:
              d=Document(fn)
              for t in d.tables:
                  if not t.rows:continue
                  h=[re.sub(r"\s+"," ",c.text.strip()) for c in t.rows[0].cells]
                  if "Control UID" not in h or "Persistence Owner" not in h:continue
                  ci=h.index("Control UID");pi=h.index("Persistence Owner")
                  for r in t.rows[1:]:
                      uid=re.sub(r"\s+"," ",r.cells[ci].text.strip())
                      if uid in targets:
                          found.add(uid)
                          v=re.sub(r"\s+"," ",r.cells[pi].text.strip())
                          if v in {"","—","-","SOURCE_NOT_DEFINED"} or "AUTHORITY_GAP" in v:
                              gap.append({"file":fn,"uid":uid,"value":v})
          if found!=targets:raise SystemExit("TARGET_DISCOVERY_FAIL "+repr(sorted(targets-found)))
          if gap:raise SystemExit("PERSISTENCE_GAP_RESIDUAL "+repr(gap))
          print("BATCH118_EXACT_CLOSURE_PASS="+json.dumps({"unique_controls":20,"persistence_gap_residual":0,"crossdoc_conflicts":0},sort_keys=True))
          PY
      - name: Render all seven modified Word files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __r118/pdf __r118/png
          while IFS= read -r f; do
            libreoffice --headless --convert-to pdf --outdir __r118/pdf "$f" >/tmp/lo118.log 2>&1 || { echo "RENDER_FAIL $f"; cat /tmp/lo118.log; exit 1; }
          done <<'EOF'
          01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx
          05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx
          EOF
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pdfs=sorted(Path("__r118/pdf").glob("*.pdf"))
          if len(pdfs)!=7:raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          pages={};total=0
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","125",str(pdf),str(Path("__r118/png")/slug)])
              imgs=list(Path("__r118/png").glob(slug+"-*.png"))
              if not imgs:raise SystemExit(f"NO_PNG {pdf}")
              pages[pdf.name]=len(imgs);total+=len(imgs)
          Path("__batch118_render.json").write_text(json.dumps({"pdf_count":7,"png_count":total,"pages":pages},ensure_ascii=False,indent=2))
          print("BATCH118_RENDER_PASS="+json.dumps({"pdf_count":7,"png_count":total,"pages":pages},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch118-persistence-owner-completion
          path: |
            01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx
            05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
            08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
            09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
            ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx
            ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx
            ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx
            __r118/pdf/*.pdf
            __r118/png/*.png
            __batch118_manifest.json
            __batch118_render.json
          retention-days: 3
      - name: Commit and push completion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __r118 __batch118_manifest.json __batch118_render.json
          git config user.name "acpos-batch118-design"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch118_persistence_owner_completion.yml
          git add *.docx
          git commit -m "fix(acpos): complete remaining 20 Word persistence owner contracts"
          git push origin HEAD:0921acpos
