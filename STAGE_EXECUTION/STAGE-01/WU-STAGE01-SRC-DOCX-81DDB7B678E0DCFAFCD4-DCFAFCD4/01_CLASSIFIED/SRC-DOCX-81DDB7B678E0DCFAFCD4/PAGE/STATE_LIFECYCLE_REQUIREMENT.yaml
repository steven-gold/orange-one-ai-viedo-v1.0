- source_node_uid: SN-C295378D649C0F7903371C33
  document_order_index: 86680
  source_text: Fresh scorecard on NEW version; previous scorecard remains historical evidence.
- source_node_uid: SN-5BDED85C14289E1F107317AB
  document_order_index: 86700
  source_text: SG-02 control denominator is 12. The Submit Review control/action is part of the governing criteria lifecycle and 05 must not retain an 11-control assumption.
