name: Product Stage01 Current Step Execute
on:
  workflow_dispatch:
    inputs:
      units:
        description: Comma-separated governed units to execute
        required: true
        default: GLOBAL-HOME-SHELL-NAVIGATION,WB01-DASHBOARD
      reason:
        description: Explicit operator authorization to enter Stage-01 effectful execution
        required: true
        default: explicit-stage01-entry
  workflow_run:
    workflows: ["Product Full Stage Lifecycle Validation"]
    types: [completed]
permissions:
  contents: write
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == '0921acpos')
    runs-on: ubuntu-24.04
    outputs:
      work_units: ${{ steps.map.outputs.work_units }}
      skip: ${{ steps.map.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: map
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml
          reqp=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml')
          trigp=Path('STAGE_EXECUTION/STAGE-01/STAGE01_CURRENT_EXECUTION_TRIGGER.yaml')
          if not reqp.is_file() or not trigp.is_file():
              print('skip=true')
              raise SystemExit(0)
          req=yaml.safe_load(reqp.read_text(encoding='utf-8')) or {}
          trig=yaml.safe_load(trigp.read_text(encoding='utf-8')) or {}
          if req.get('status')!='CONSUMED' or req.get('auto_enter_stage01') is not True:
              print('skip=true')
              raise SystemExit(0)
          allowed={
            'READY_AWAITING_RUNTIME_INLINE_VALIDATION_AND_VALIDATED_STAGE_ENTRY',
            'READY_AWAITING_RUNTIME_INLINE_VALIDATION_AND_EXPLICIT_STAGE_ENTRY',
          }
          if trig.get('status') not in allowed:
              print('skip=true')
              raise SystemExit(0)
          wus=trig.get('work_units') or []
          if not wus:
              raise SystemExit('BLOCK:STAGE01_TRIGGER_WORK_UNITS_EMPTY')
          print('skip=false')
          print('work_units='+','.join(map(str,wus)))
          PY
          else
            WUS=()
            IFS=',' read -ra UNITS <<< "$DISPATCH_UNITS"
            for RAW in "${UNITS[@]}"; do
              U="$(echo "$RAW" | xargs)"
              case "$U" in
                GLOBAL-HOME-SHELL-NAVIGATION) WUS+=("WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001") ;;
                WB01-DASHBOARD) WUS+=("WU-STAGE01-WB01-DASHBOARD-CLEAN-001") ;;
                *) echo "BLOCK:UNKNOWN_SELECTED_UNIT:$U"; exit 41 ;;
              esac
            done
            test "${#WUS[@]}" -gt 0
            CSV="$(IFS=,; echo "${WUS[*]}")"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "work_units=$CSV" >> "$GITHUB_OUTPUT"
          fi
  execute:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/product-stage-current-execute-reusable.yml
    with:
      stage: STAGE-01
      work_units: ${{ needs.resolve.outputs.work_units }}
    secrets: inherit
