name: ACPOS Batch 75 Business Entity Eligibility Classification
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch75_business_entity_eligibility_classification.yml
permissions:
  contents: write
jobs:
  classify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify canonical Business Entity eligibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="00d6b84bf9aeb8ce8419d23b2ce6d26bdb3fedc9"
          WF=Path(".github/workflows/acpos_batch75_business_entity_eligibility_classification.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift: raise SystemExit(f"PRE_AUDIT_TREE_DRIFT {drift}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          EXACT_ENTITY_HEADERS={"BUSINESS ENTITY","BUSINESS_ENTITY","ENTITY","ENTITY NAME","ENTITY / REF","實體","業務實體","商業實體"}
          ENTITY_UID_HEADERS={"ENTITY UID"}
          CANONICAL_NAME_HEADERS={"CANONICAL NAME"}
          EFFECTFUL_TOKENS=["CREATE","EDIT","SAVE","APPROVE","CONFIRM","VERSION","REVISE","LOCK","UNLOCK","REORDER","MOVE","REPARENT","ARCHIVE","DELETE","RESTORE","UPDATE","MUTATE","PUBLISH","EXECUTE","RUN","DECIDE","REVIEW","新增","建立","編輯","修改","儲存","核准","確認","版本","修訂","鎖定","排序","移動","封存","刪除","還原","發布","執行","審查"]
          LIFECYCLE_TOKENS=["LIFECYCLE","STATE","STATUS","VERSION","MUTABILITY","ORDER","PARENT","CHILD","ARCHIVE","RETIRED","DRAFT","LOCK","OWNER","生命週期","狀態","版本","可變","排序","父","子","封存","草稿","鎖定"]
          READ_TOKENS=["LIST","OPEN","DISCOVER","SEARCH","VIEW","READ","PROJECTION","DISPLAY","QUERY","清單","開啟","搜尋","查看","讀取","投影","查詢"]
          REF_NAME=re.compile(r"(?:REF|REFERENCE)(?:$|\b|/)",re.I)
          PROJ_NAME=re.compile(r"(PROJECTION|READMODEL|READ MODEL|SEARCHRESULT|SEARCH RESULT|DASHBOARDPROJECTION)",re.I)
          EXT_NAME=re.compile(r"(CREDENTIALREFERENCE|PROVIDERJOBREF|EXTERNALRESULT|EXTERNAL.*REF|CALLBACK)",re.I)
          SUPPORT_NAME=re.compile(r"(EVIDENCE|MANIFEST|SCORECARD|CHECKPOINT|TRACE|AUDIT|HANDOFF|PACKAGE|SCRIPT VIEW|SCRIPT_VIEW|POLICYREF|CRITERIA.*REF)",re.I)
          VALUE_NAME=re.compile(r"(CONTEXT|BINDING|SNAPSHOT|DECISIONCONTEXT|ROUTEDECISION|ROUTEPREFLIGHT|CORRELATION|TIMINGBINDING)",re.I)

          def norm(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def up(s):return norm(s).upper()
          def txt(el):return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def exact_idx(headers,names):
              for i,h in enumerate(headers):
                  if up(h) in names:return i
              return None
          def parse(fn):
              with zipfile.ZipFile(fn) as z: root=ET.fromstring(z.read("word/document.xml"))
              out=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[]
                  for tr in trs: rows.append([txt(c) for c in list(tr) if c.tag==W+"tc"])
                  out.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return out
          def contains_any(text,tokens):
              u=up(text);return [t for t in tokens if t.upper() in u]

          evidence=collections.defaultdict(lambda:{"rows":[],"declared_business_entity":False,"effectful":[],"read":[],"lifecycle":[]})
          selected_tables=[]
          for page,fn in PAGE_DOCS.items():
              for t in parse(fn):
                  h=t["headers"]; hu=[up(x) for x in h]
                  ei=exact_idx(h,EXACT_ENTITY_HEADERS)
                  if ei is None:
                      euid=exact_idx(h,ENTITY_UID_HEADERS); cname=exact_idx(h,CANONICAL_NAME_HEADERS)
                      if euid is not None and cname is not None: ei=cname
                  if ei is None:continue
                  declared=up(h[ei]) in {"BUSINESS ENTITY","BUSINESS_ENTITY","業務實體","商業實體"}
                  selected_tables.append({"page":page,"file":fn,"table":t["table"],"headers":h,"declared_business_entity":declared})
                  for ri,row in enumerate(t["rows"],2):
                      if ei>=len(row):continue
                      ent=norm(row[ei])
                      if not ent or ent in {"—","-","N/A","NA"}:continue
                      key=(page,ent)
                      full=" | ".join(row)
                      evidence[key]["declared_business_entity"] |= declared
                      evidence[key]["rows"].append({"file":fn,"table":t["table"],"row":ri,"headers":h,"cells":row})
                      evidence[key]["effectful"]+=contains_any(full,EFFECTFUL_TOKENS)
                      evidence[key]["read"]+=contains_any(full,READ_TOKENS)
                      evidence[key]["lifecycle"]+=contains_any(full,LIFECYCLE_TOKENS)

          results=[]
          for (page,ent),ev in sorted(evidence.items()):
              name=up(ent)
              eff=sorted(set(ev["effectful"])); rd=sorted(set(ev["read"])); life=sorted(set(ev["lifecycle"]))
              rowtext=" || ".join(" | ".join(r["cells"]) for r in ev["rows"])
              reasons=[]
              category=None

              # Mother §71: explicit Business Entity declaration is Authority evidence.
              if ev["declared_business_entity"]:
                  category="TRUE_BUSINESS_ENTITY"; reasons.append("EXPLICIT_BUSINESS_ENTITY_TABLE")
              # Own effectful lifecycle/user-visible operations make it a Business Entity.
              elif eff:
                  category="TRUE_BUSINESS_ENTITY"; reasons.append("OWN_EFFECTFUL_OR_LIFECYCLE_OPERATION")
              # Own identity plus strong lifecycle/state semantics qualifies even if the
              # current table is an inventory rather than an operation matrix.
              elif len(life)>=2 and not (REF_NAME.search(ent) or PROJ_NAME.search(ent)):
                  category="TRUE_BUSINESS_ENTITY"; reasons.append("OWN_IDENTITY_PLUS_LIFECYCLE_STATE_SEMANTICS")
              elif EXT_NAME.search(ent):
                  category="EXTERNAL_REF"; reasons.append("EXTERNAL_REFERENCE_IDENTITY_NO_OWN_EFFECTFUL_LIFECYCLE")
              elif REF_NAME.search(ent):
                  category="REFERENCE_ONLY"; reasons.append("REFERENCE_IDENTITY_NO_OWN_EFFECTFUL_LIFECYCLE")
              elif PROJ_NAME.search(ent):
                  category="READ_PROJECTION"; reasons.append("READ_PROJECTION_NO_OWN_EFFECTFUL_LIFECYCLE")
              elif SUPPORT_NAME.search(ent):
                  category="SUPPORTING_ARTIFACT"; reasons.append("SUPPORT_ARTIFACT_NO_OWN_EFFECTFUL_LIFECYCLE")
              elif VALUE_NAME.search(ent):
                  category="VALUE_OBJECT"; reasons.append("CONTEXT_BINDING_SNAPSHOT_NO_OWN_EFFECTFUL_LIFECYCLE")
              elif rd and not eff and not life:
                  category="READ_PROJECTION"; reasons.append("READ_ONLY_OPERATION_EVIDENCE")
              else:
                  category="REVIEW_REQUIRED"; reasons.append("INSUFFICIENT_AUTHORITY_TO_CLASSIFY")

              results.append({
                "page":page,"identity":ent,"category":category,"reasons":reasons,
                "declared_business_entity":ev["declared_business_entity"],
                "effectful_tokens":eff,"read_tokens":rd,"lifecycle_tokens":life,
                "source_rows":ev["rows"],
              })

          counts=collections.Counter(x["category"] for x in results)
          bypage=collections.defaultdict(collections.Counter)
          for x in results:bypage[x["page"]][x["category"]]+=1
          review=[x for x in results if x["category"]=="REVIEW_REQUIRED"]
          true_entities=[x for x in results if x["category"]=="TRUE_BUSINESS_ENTITY"]
          non_entities=[x for x in results if x["category"]!="TRUE_BUSINESS_ENTITY"]

          summary={
            "marker":"ACPOS-20260922-BATCH-75-BUSINESS-ENTITY-ELIGIBILITY-V1",
            "base_head":EXPECTED_PARENT,
            "candidate_identities":len(results),
            "category_counts":dict(counts),
            "true_business_entities":len(true_entities),
            "non_business_entity_identities":len(non_entities),
            "review_required":len(review),
            "true_entity_23op_raw_denominator":len(true_entities)*23,
            "by_page":{p:dict(c) for p,c in sorted(bypage.items())},
            "mother_rule":"USER_MANAGEABLE_OWN_IDENTITY_STATE_ORDERING_PARENT_EDITABLE_LIFECYCLE_OR_USER_VISIBLE_OPERATION",
          }
          out={"summary":summary,"classification":results,"review_required":review,"selected_entity_tables":selected_tables}
          Path("__batch75_entity_eligibility.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch75_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH75_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if review: print("BATCH75_REVIEW_REQUIRED_IDENTITIES="+json.dumps([{"page":x["page"],"identity":x["identity"]} for x in review],ensure_ascii=False))
          else: print("BATCH75_ZERO_REVIEW_REQUIRED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch75-business-entity-eligibility
          path: |
            __batch75_entity_eligibility.json
            __batch75_summary.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch75_entity_eligibility.json __batch75_summary.json
          git config user.name "acpos-batch75-classifier"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch75_business_entity_eligibility_classification.yml" ]; then
            printf '%s\n' "${staged[@]}"; exit 1
          fi
          git commit -m "chore(acpos): close batch 75 entity eligibility classifier"
          git push origin HEAD:0921acpos
