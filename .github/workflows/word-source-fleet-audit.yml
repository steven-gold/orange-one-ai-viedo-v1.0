name: Word Source Fleet Audit
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - ".github/governance-maintenance/audit_word_source_fleet.py"
      - "governance/test/WORD_SOURCE_FLEET_AUDIT_TRIGGER"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Audit every Word source against current projection contract
        run: python .github/governance-maintenance/audit_word_source_fleet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-source-fleet-audit
          path: /tmp/word_source_fleet_audit.json
          if-no-files-found: error
