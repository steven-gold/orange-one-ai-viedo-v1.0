          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=PRODUCTION npm run build
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=PRODUCTION nohup npm run start -- -p 3001 >/tmp/asset01-prod.log 2>&1 & echo $! >/tmp/asset01-prod.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3001/assets >/dev/null && break; sleep 1; done
          code=$(curl -sS -o /tmp/proj.json -w '%{http_code}' http://127.0.0.1:3001/v1/ui-projections/ASSET-01); test "$code" = "503"; grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/proj.json
          code=$(curl -sS -o /tmp/exec.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-asset-action-uid: ASSET-01-ACT-FLOW-START' --data '{}' http://127.0.0.1:3001/v1/tasks/TEST-ASSET-TASK-01/execute); test "$code" = "503"; grep -q 'DEPARTMENT_OPERATION_RUNTIME_NOT_BOUND' /tmp/exec.json
          code=$(curl -sS -o /tmp/layer.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-asset-action-uid: ASSET-01-ACT-LAYER-DOC-CREATE' --data '{}' http://127.0.0.1:3001/v1/layer-documents); test "$code" = "503"; grep -q 'ASSET_RUNTIME_NOT_BOUND' /tmp/layer.json
          kill $(cat /tmp/asset01-prod.pid) 2>/dev/null || true
          echo ASSET01_PRODUCTION_FAIL_CLOSED_PASS
      - name: Residual and locked-file validation
        run: |
          set -euo pipefail
          git checkout -- tsconfig.json 2>/dev/null || true
          rm -f tsconfig.tsbuildinfo
          test "$(git hash-object authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml)" = "$(cat /tmp/asset_authority_before)"
          test "$(git hash-object src/components/pages/AssetVisual.module.css)" = "80220b164df59a3a4d03ee3ac6886b844d785552"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          files=$(git diff --name-only)
          echo "$files"
          ! grep -RInE 'TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|debugger|console\.debug' $(echo "$files" | grep -E '\.(ts|tsx)$' || true)
          ! grep -RIn 'production_eligible: true' src/domain/asset src/server/testing/controlledAssetTestRuntime.ts
          grep -q 'process.env.NEXT_PUBLIC_ACPOS_RUNTIME_MODE!=="PRODUCTION"' src/server/testing/controlledAssetTestRuntime.ts
          echo ASSET01_RESIDUAL_PASS
      - name: Finalize progress and commit product changes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml');s=p.read_text();s=s.replace('  current_task_state: IN_PROGRESS','  current_task_state: COMPLETE',1);s=s.replace('  last_completed_task: PHASE-1_GLOBAL_CLOSURE_AUDIT','  last_completed_task: PHASE-2_ASSET-01_FUNCTIONAL_CLOSURE',1);p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git diff --cached --check
          git commit -m 'feat(asset): close controlled runtime and page flow'
          git push origin new
      - name: Self clean workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          if [ -f .github/workflows/asset01-functional-closure-once.yml ]; then
            git rm -f .github/workflows/asset01-functional-closure-once.yml
            git commit -m 'chore: remove ASSET01 functional closure workflow'
            git push origin new
          fi
