name: Apply Concrete Business Content Closure

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - name: Patch original Word authority
        run: python __temp/apply_concrete_business_content.py
      - name: Structural validation
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          import json,re
          mark='ACPOS-20260921-CONCRETE-BUSINESS-CONTENT-CLOSURE-V1'
          targets=[
          '00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx',
          '01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx',
          '04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx',
          '05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx',
          '09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx',
          'ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
          'ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
          'ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
          'ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
          'ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
          'ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx']
          assert len(targets)==11
          for fn in targets:
              d=Document(fn)
              text='\n'.join([p.text for p in d.paragraphs]+[c.text for t in d.tables for r in t.rows for c in r.cells])
              assert mark in text,fn
          qa=Document('ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx')
          qt='\n'.join([p.text for p in qa.paragraphs]+[c.text for t in qa.tables for r in t.rows for c in r.cells])
          for x in ['人物／角色一致性','幀間連續性','嘴型／口型同步','字幕內容正確','字幕時間／可讀性／安全區','音訊技術品質','構圖／取景']:
              assert x in qt,x
          sg=Document('ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx')
          st='\n'.join([p.text for p in sg.paragraphs]+[c.text for t in sg.tables for r in t.rows for c in r.cells])
          for x in ['QCP-CORE-BASELINE-V1','QCP-ASSET-IMAGE-V1','QCP-ASSET-AUDIO-V1','QCP-VIDEO-BASELINE-V1','QCP-EDIT-FINAL-V1','QCP-QA-FINAL-OUTPUT-V1','CTRL-ADMIN-SG-02-ACT-04-ACT-SUBMIT-REVIEW','SG-02 Current Control Denominator = 12']:
              assert x in st,x
          print('PASS: CONCRETE BUSINESS CONTENT STRUCTURAL QA')
          PY
      - name: Commit Word updates
        shell: bash
        run: |
          git config user.name "acpos-content-closure"
          git config user.email "actions@users.noreply.github.com"
          git add '*.docx' __temp/concrete_content_patch_report.json
          git commit -m "docs(acpos): materialize concrete review criteria and content completeness gate"
          git push
