name: admin STR-01 closure validation
on:
  push:
    branches: [acpos-admin-str01-closure-20260903]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Product audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: STR admin authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          a=Path('authority/pages/admin/STR-01/ACPOS_STRATEGY_CENTER_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          v=Path('src/components/pages/StrategyAdminVisual.tsx').read_text()
          r=Path('src/components/pages/StrategyAdminRuntime.tsx').read_text()
          p=Path('src/domain/strategyAdmin/strategyAdminRuntimePort.ts').read_text()
          s=Path('src/server/testing/controlledStrategyTestRuntime.ts').read_text()
          views=['STR-CURRENT-VIEW-OVERVIEW','STR-CURRENT-VIEW-INTELLIGENCE-FACT','STR-CURRENT-VIEW-PLAYBOOK','STR-CURRENT-VIEW-OPPORTUNITY','STR-CURRENT-VIEW-DECISION']
          for uid in views: assert uid in a and uid in v
          for uid in [f'STR-CURRENT-ACC-{n:02d}' for n in range(1,10)]: assert uid in a
          actions=['ACT-SEARCH','ACT-REFRESH','ACT-NAV-OPEN','ACT-CONFIGURE','ACT-APPROVE','ACT-EXPORT','ACT-DRAFT-SAVE','ACT-CANDIDATE-CREATE','ACT-CANDIDATE-COMPARE','ACT-CANDIDATE-DECIDE','ACT-ADOPT-CONTEXT']
          for action in actions: assert action in a and action in v
          ops=['getUiProjection','refreshProjection','searchProjection','approveGovernedResource','configureGovernedResource','exportProjection','saveDraft','createCandidate','compareCandidates','adoptAsContextCandidate','rejectStrategyCandidate']
          for op in ops: assert op in a and (op in v or op=='getUiProjection')
          assert 'application_implementation: NOT_EXECUTED' in a
          assert 'runtime_binding_validation: NOT_EXECUTED' in a
          assert 'e2e_validation: NOT_EXECUTED' in a
          assert 'effectful_runtime_ready: false' in a
          assert 'data-effectful-runtime-ready="false"' in v
          assert 'data-remap-state="IMPLEMENTATION_REQUIRED_NOT_EXECUTED"' in v
          assert 'data-application-implementation="NOT_EXECUTED"' in v
          assert 'StrategyAdminProjectionTestMetadata' in p
          assert 'STR_ADMIN_TEST_PROJECTION_FORBIDDEN_IN_PRODUCTION' in p
          assert 'TEST_ONLY' in s and 'production_eligible: false' in s
          usage=[]
          for f in Path('src').rglob('*'):
            if f.is_file() and f.suffix in {'.ts','.tsx'}:
              t=f.read_text(errors='ignore')
              if 'configureStrategyAdminCommandAdapter(' in t: usage.append(str(f))
          assert usage==['src/domain/strategyAdmin/strategyAdminRuntimePort.ts'], usage
          assert 'isStrategyAdminCommandAdapterBound()' in r
          print('STR_ADMIN_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ''
        run: npm run build
      - name: Production STR admin must fail closed
        run: |
          set -euo pipefail
          PORT=3271 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/str-admin-prod.log 2>&1 & pid=$!; trap 'cat /tmp/str-admin-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3271/admin/strategy >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/str-admin-prod.json -w '%{http_code}' 'http://127.0.0.1:3271/v1/ui-projections/admin%3ASTR-01'); cat /tmp/str-admin-prod.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/str-admin-prod.json
          ! grep -q 'TEST_ONLY' /tmp/str-admin-prod.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled STR admin projection truth
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3272 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/str-admin-api.log 2>&1 & pid=$!; trap 'cat /tmp/str-admin-api.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3272/admin/strategy >/dev/null && break || sleep 1; done
          curl -fsS 'http://127.0.0.1:3272/v1/ui-projections/admin%3ASTR-01' >/tmp/str-admin.json
          python <<'PY'
          import json
          d=json.load(open('/tmp/str-admin.json'));m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY' and m['synthetic'] is True and m['production_eligible'] is False
          assert d['page_state']=='READY'
          assert d['selected_resource_id']=='TEST-STR-FACT-001'
          assert d['action_enabled']['ACT-SEARCH'] is True
          assert d['action_enabled']['ACT-ADOPT-CONTEXT'] is True
          assert 'ACT-CANDIDATE-DECIDE' not in d['action_enabled']
          assert all('TEST' in str(v) or v=='—' or isinstance(v,(bool,int,float,type(None))) for v in [d['selected_resource_id']])
          print('STR_ADMIN_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled STR admin browser flow
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3273 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/str-admin-browser.log 2>&1 & pid=$!; trap 'cat /tmp/str-admin-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3273/admin/strategy >/dev/null && break || sleep 1; done
          node <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),errors=[];
          for(const width of [1280,1440,1920]){const p=await b.newPage({viewport:{width,height:1500}});p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto('http://127.0.0.1:3273/admin/strategy',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:STR-01"]')?.getAttribute('data-page-state')==='READY');const root=p.locator('[data-page-uid="admin:STR-01"]');if(await root.getAttribute('data-data-classification')!=='TEST_ONLY'||await root.getAttribute('data-production-eligible')!=='false')throw new Error('classification');if(await root.getAttribute('data-remap-state')!=='IMPLEMENTATION_REQUIRED_NOT_EXECUTED')throw new Error('remap truth');if(await root.getAttribute('data-application-implementation')!=='NOT_EXECUTED'||await root.getAttribute('data-runtime-binding-validation')!=='NOT_EXECUTED'||await root.getAttribute('data-e2e-validation')!=='NOT_EXECUTED')throw new Error('runtime truth');const o=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(o>0)throw new Error(`overflow ${width}:${o}`);await p.close()}
          const p=await b.newPage({viewport:{width:1440,height:1600}});await p.goto('http://127.0.0.1:3273/admin/strategy',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:STR-01"]')?.getAttribute('data-page-state')==='READY');
          const views=[['STR-CURRENT-VIEW-OVERVIEW',3],['STR-CURRENT-VIEW-INTELLIGENCE-FACT',5],['STR-CURRENT-VIEW-PLAYBOOK',3],['STR-CURRENT-VIEW-OPPORTUNITY',3],['STR-CURRENT-VIEW-DECISION',4]];
          for(const [uid,count] of views){await p.locator(`[data-view-uid="${uid}"]`).click();if(await p.locator('[data-current-view]').getAttribute('data-current-view')!==uid)throw new Error(`view ${uid}`);if(!p.url().endsWith('/admin/strategy'))throw new Error('parallel route');const buttons=p.locator('section').filter({has:p.locator('[data-action-id]')}).locator('[data-action-id]');if(await buttons.count()!==count)throw new Error(`action count ${uid}`);for(let i=0;i<await buttons.count();i++){if(!(await buttons.nth(i).isDisabled()))throw new Error(`effectful enabled ${uid}`);const reason=await buttons.nth(i).getAttribute('data-disabled-reason');if(!['IMPLEMENTATION_REQUIRED_NOT_EXECUTED','AUTHORITY_BINDING_UNRESOLVED'].includes(reason||''))throw new Error(`disabled reason ${uid}:${reason}`)}}
          const body=(await p.locator('body').textContent())||'';if(body.includes('mock strategy')||body.includes('fake confidence'))throw new Error('fake strategy text');if(errors.length)throw new Error(errors.join('\n'));console.log('STR_ADMIN_BROWSER_INTERACTION_PASS');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/strategyAdmin src/components/pages/StrategyAdminVisual.tsx src/components/pages/StrategyAdminRuntime.tsx
          git diff --exit-code
