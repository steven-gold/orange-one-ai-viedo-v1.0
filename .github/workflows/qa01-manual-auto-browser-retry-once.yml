name: QA01 Manual Auto Browser Retry Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-manual-auto-browser-retry-once.yml'

permissions:
  contents: read

jobs:
  chromium:
    strategy:
      fail-fast: false
      matrix:
        scenario: [MANUAL_REQUIRED, AUTO]
    runs-on: ubuntu-latest
    env:
      ACPOS_QA_TEST_SCENARIO: ${{ matrix.scenario }}
      NEXT_PUBLIC_ACPOS_RUNTIME_MODE: TEST
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Install ephemeral Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run isolated browser flow
        run: |
          npm run dev -- -p 3400 > /tmp/next.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://localhost:3400/qa >/dev/null 2>&1 && break; sleep 0.5; done
          cat > qa01-targeted.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const ctl=(p,id)=>p.locator(`[data-control-id="${id}"]`);
          const val=async(p,id)=>((await ctl(p,id).locator('strong').textContent())||'').trim();
          async function click(p,id){const e=ctl(p,id);await e.waitFor({state:'visible'});await p.waitForFunction(id=>{const x=document.querySelector(`[data-control-id="${id}"]`);return x instanceof HTMLButtonElement&&!x.disabled},id,{timeout:15000});await e.click();}
          async function state(p,s){await p.waitForFunction(s=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')===s,s,{timeout:15000});}
          async function dump(p,label){console.log(label,JSON.stringify({page_state:await p.locator('[data-page-uid="QA-01"]').getAttribute('data-page-state'),stage:await p.locator('[data-page-uid="QA-01"]').getAttribute('data-current-stage'),gate:await val(p,'QA-01-FLD-GATE-STATUS'),manual:await val(p,'QA-01-FLD-MANUAL-STATE'),decision:await val(p,'QA-01-FLD-MANUAL-DECISION'),progress:await val(p,'QA-01-FLD-AUTO-PROGRESS'),error:await val(p,'QA-01-FLD-ERROR'),runtime_error:await val(p,'QA-01-FLD-ERROR')}));}
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1600,height:1200}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));try{await p.goto('http://localhost:3400/qa',{waitUntil:'networkidle'});await p.waitForSelector('[data-page-uid="QA-01"]');await p.waitForFunction(()=>{const e=document.querySelector('[data-control-id="QA-01-BTN-AUTO-START"]');return e instanceof HTMLButtonElement&&!e.disabled},null,{timeout:15000});
            if(process.env.SCENARIO==='MANUAL_REQUIRED'){
              await p.getByRole('button',{name:'MANUAL',exact:true}).click();await click(p,'QA-01-BTN-START-REVIEW');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-GATE-STATUS"] strong')?.textContent==='MANUAL_REVIEW_REQUIRED',null,{timeout:15000});assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='97','manual score missing');const mb=p.locator('[data-component-uid="QA-01-CMP-MANUAL-DECISION"] button');assert(await mb.count()===2,'manual action count not 2');assert(await p.locator('[data-component-uid="QA-01-CMP-SCORE"] input,[data-component-uid="QA-01-CMP-SCORE"] select,[data-component-uid="QA-01-CMP-SCORE"] textarea,[data-component-uid="QA-01-CMP-SCORE"] button').count()===0,'human scoring exposed');await click(p,'QA-01-BTN-MANUAL-MODIFY');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-BTN-MANUAL-MODIFY"]')?.getAttribute('data-last-action')==='true',null,{timeout:15000});await click(p,'QA-01-BTN-MANUAL-PASS');try{await state(p,'QA-01-ST-PASS')}catch(e){await dump(p,'MANUAL_FAILURE_STATE');throw e}assert(await val(p,'QA-01-FLD-GATE-STATUS')==='PASS','manual pass did not re-evaluate normal QA gate');assert(await val(p,'QA-01-FLD-MANUAL-STATE')==='CLOSED/PASSED','manual case not closed');console.log('QA01_MANUAL_REQUIRED_PASS');
            }else{
              assert(await ctl(p,'QA-01-BTN-START-REVIEW').count()===0,'manual start visible in AUTO');const q=p.locator('[data-control-id="QA-01-LIST-REVIEWS"] [data-item-ref]');assert(await q.count()===2,'AUTO queue mismatch');for(let i=0;i<2;i++)assert(await q.nth(i).isDisabled(),'AUTO queue reorder enabled');await click(p,'QA-01-BTN-AUTO-START');try{await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-AUTO-PROGRESS"] strong')?.textContent==='2/2',null,{timeout:15000})}catch(e){await dump(p,'AUTO_FAILURE_STATE');throw e}assert(await p.locator('[data-control-id*="PUBLISH"],[data-action-uid*="PUBLISH"]').count()===0,'AUTO publish exposed');console.log('QA01_AUTO_PASS');
            }
            assert(errors.length===0,`page errors ${errors}`);
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa01-targeted.cjs
