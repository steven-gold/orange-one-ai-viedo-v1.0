- 共享概念: CORE / Blueprint / Canonical Script
  Canonical Owner: ACPOS-AI-04
  AI-09 規則: 只檢查/追蹤/提出 Change Candidate；Canon 修改仍回 CORE Owner。
- 共享概念: Creative Production
  Canonical Owner: ACPOS-AI-05
  AI-09 規則: Finding 可指向 ASSET/VIDEO/EDIT/VOICE/QA owner；不直接修改生產物。
- 共享概念: Enterprise BD
  Canonical Owner: ACPOS-AI-06
  AI-09 規則: 檢查 CRM/Delivery/Compliance chain；不直接發信或更改 suppression。
- 共享概念: Social Publishing
  Canonical Owner: ACPOS-AI-07
  AI-09 規則: 檢查 Publish chain；不直接發文或繞過 platform policy。
- 共享概念: Strategy
