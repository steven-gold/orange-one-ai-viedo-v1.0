- source_node_uid: SN-A6F7EC2C1A4855CA98586479
  document_order_index: 5453
  source_text: 有明確 owner / schema / permission / state machine
- source_node_uid: SN-B0088082C0E37DD2DA86125E
  document_order_index: 8377
  source_text: 正式控制分母為 27：5 個 View Tab、2 個 Search 入口、Source 5 個狀態/編輯控制、Acquisition 2、Citation 1、Context 3、Replay 2、Learning/Draft 2、Knowledge Draft/Version 2、Review 3。所有 Effectful Control 必須同時具備 Action + Gate + Permission
    + State 條件。
- source_node_uid: SN-9A4C14B069F60C612ACFEBA8
  document_order_index: 8872
  source_text: 12. Gate / Permission / Security Boundary
- source_node_uid: SN-AA9755650B0C10D650B71E58
  document_order_index: 8881
  source_text: Permission Model：Account Permission Assignment Only。Role name、department membership、前端隱藏狀態都不得作為 Allow。Server Gate 順序至少包含 identity → account_permission → scope → condition/classification → state_guard → expected_version（versioned
    write）→ idempotency（side effect）→ audit。
