name: VIS-10 evidence cleanup
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-evidence-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Remove superseded VIS-10 evidence only
        run: |
          git rm docs/construction/evidence/VIS-10/vis10-1200-top.png \
                 docs/construction/evidence/VIS-10/vis10-1440-bottom.png \
                 docs/construction/evidence/VIS-10/vis10-1440-expanded.png \
                 docs/construction/evidence/VIS-10/vis10-1440-top.png \
                 docs/construction/evidence/VIS-10/vis10-1600-top.png \
                 docs/construction/evidence/VIS-10/vis10-front-admin-entry.png \
                 docs/construction/evidence/VIS-10/vis10-validation.json
      - name: Verify final evidence remains
        run: |
          test -f docs/construction/evidence/VIS-10/vis10-final-1200.png
          test -f docs/construction/evidence/VIS-10/vis10-final-1440-collapsed.png
          test -f docs/construction/evidence/VIS-10/vis10-final-1440-expanded.png
          test -f docs/construction/evidence/VIS-10/vis10-final-1440-bottom.png
          test -f docs/construction/evidence/VIS-10/vis10-final-front-admin-entry.png
          test -f docs/construction/evidence/VIS-10/vis10-final-regression.json
      - name: Commit cleanup and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git commit -m "chore(vis10): remove superseded intermediate evidence"
          git rm .github/workflows/vis10-evidence-cleanup.yml
          git commit -m "chore(vis10): remove temporary evidence cleanup workflow"
          git push origin HEAD:acpos-vis10-staging
