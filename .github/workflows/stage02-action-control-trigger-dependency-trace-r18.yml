name: Stage-02 Action Control Trigger Dependency Trace R18

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_action_control_trigger_dependency_trace_r18.py'
      - 'governance/ci/validate_stage02_action_control_trigger_dependency_trace_r18.py'
      - '.github/workflows/stage02-action-control-trigger-dependency-trace-r18.yml'
      - 'governance/test/stage02/STAGE02_AUTHORITY_DEPENDENCY_RECLASSIFICATION_R12.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/FUNCTIONAL_CHAIN_SPEC.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-action-control-trigger-dependency-trace-r18
  cancel-in-progress: false

jobs:
  action-control-trigger-dependency-trace-r18:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R18 trace machinery
        run: |
          python -m py_compile governance/ci/build_stage02_action_control_trigger_dependency_trace_r18.py
          python -m py_compile governance/ci/validate_stage02_action_control_trigger_dependency_trace_r18.py

      - name: Re-prove exact governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Revalidate R12 baseline and Stage-02 successor integrity
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_authority_dependency_reclassification_r12.py
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py

      - name: Build exact single action control trigger dependency trace
        run: python governance/ci/build_stage02_action_control_trigger_dependency_trace_r18.py

      - name: Validate R18 exact control trigger evidence boundary
        run: python governance/ci/validate_stage02_action_control_trigger_dependency_trace_r18.py

      - name: Prove R18 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R18 trace is non-mutating diagnostic evidence only'

      - name: Verify exact one denominator and zero closure credit
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_ACTION_CONTROL_TRIGGER_DEPENDENCY_TRACE_R18.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          den=d['denominators']
          assert den['action_without_control_or_trigger_gaps_traced'] == 1
          assert den['scope_counts'] == {'ASSET-01': 1}
          assert den['effective_stage02_blocker_reduction_claimed'] == 0
          assert d['stage02_status'] == 'BLOCKED'
          print('PASS: exact one action/control/trigger gap traced; zero blocker credit until separate materialization and fresh reexecution')
          PY

      - name: Commit R18 dependency trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_ACTION_CONTROL_TRIGGER_DEPENDENCY_TRACE_R18.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R18 generated no persistent dependency trace' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist action control trigger dependency trace R18'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R18 dependency trace
        uses: actions/upload-artifact@v4
        with:
          name: stage02-action-control-trigger-dependency-trace-r18
          path: governance/test/stage02/STAGE02_ACTION_CONTROL_TRIGGER_DEPENDENCY_TRACE_R18.yaml
          if-no-files-found: error
