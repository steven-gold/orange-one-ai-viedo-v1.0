name: ACPOS Gate25 VOICE-01 Retired Formal Resource Sync Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-voice01-retired-resource-sync-once.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize retired VOICE-01 formal resources to fresh Production truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          inventory_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json')
          nav_path=Path('authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml')
          edit_path=Path('authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml')
          voice_authority_dir=Path('authority/pages/workspace/VOICE-01')
          evidence_path=Path('docs/construction/evidence/GATE25_VOICE01_RETIRED_FORMAL_RESOURCE_EVIDENCE_2026-09-11.json')

          action_resources=[
            'action:workspace:VOICE-01:ACT-CANDIDATE-COMPARE',
            'action:workspace:VOICE-01:ACT-FINDING-CREATE',
            'action:workspace:VOICE-01:ACT-TASK-EXECUTE',
          ]
          dock_controls=[
            'control:CTRL-WORKSPACE-VOICE-01-ACT-01-ACT-TASK-EXECUTE',
            'control:CTRL-WORKSPACE-VOICE-01-ACT-02-ACT-FINDING-CREATE',
            'control:CTRL-WORKSPACE-VOICE-01-ACT-03-ACT-CANDIDATE-COMPARE',
          ]
          readonly_controls=[
            'control:CTRL-WORKSPACE-VOICE-01-EVIDENCE-OPEN',
            'control:CTRL-WORKSPACE-VOICE-01-LANGUAGE-FORMAT-OPEN',
            'control:CTRL-WORKSPACE-VOICE-01-NARRATION-VIEW-OPEN',
            'control:CTRL-WORKSPACE-VOICE-01-PROJECT-TOPIC-TASK-TREE-OPEN',
            'control:CTRL-WORKSPACE-VOICE-01-SUBTITLE-TIMELINE-OPEN',
            'control:CTRL-WORKSPACE-VOICE-01-TIMING-VALIDATION-OPEN',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-REFERENCE-OPEN',
          ]
          runtime_controls=[
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-COMPLETE-AUDIO-MIX',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-COMPLETE-LIP-SYNC',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-COMPLETE-SUBTITLE',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-CREATE-VOICE-RUNTIME-PROFILE',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-GET-VOICE-RUNTIME-RUN',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-HANDOFF-VOICE-TO-QA',
            'control:CTRL-WORKSPACE-VOICE-01-VOICE-RUNTIME-START-VOICE-RUNTIME',
          ]
          already_blocked=action_resources+dock_controls+runtime_controls
          targets=already_blocked+readonly_controls
          assert len(action_resources)==3
          assert len(dock_controls)==3
          assert len(readonly_controls)==7
          assert len(runtime_controls)==7
          assert len(already_blocked)==13
          assert len(targets)==20 and len(set(targets))==20

          ledger=json.loads(ledger_path.read_text())
          inventory=json.loads(inventory_path.read_text())
          assert ledger['counts']=={'PASS':51,'BLOCKED':187,'NOT_EXECUTED':1243},ledger['counts']
          assert ledger['denominator']=={'controls':1155,'actions':326,'total':1481}
          assert inventory['denominator']=={'controls':1155,'actions':326,'total':1481}
          assert ledger['production_release_sha']=='526316501c86fe54f02603cdb47da5ad51a005dc'
          entries={x['resource_key']:x for x in ledger['entries']}
          formal={x['resource_key']:x for x in inventory['resources']}
          for key in targets:
            assert key in formal, f'formal inventory missing {key}'
            assert key in entries, f'ledger missing {key}'
          for key in already_blocked:
            assert entries[key]['disposition']=='BLOCKED',f'{key} expected BLOCKED got {entries[key]["disposition"]}'
            assert entries[key]['reason_code']=='EDIT_VOICE_EFFECTFUL_PREREQUISITE_NOT_READY',f'{key} unexpected reason {entries[key]["reason_code"]}'
          for key in readonly_controls:
            assert entries[key]['disposition']=='NOT_EXECUTED',f'{key} expected NOT_EXECUTED got {entries[key]["disposition"]}'

          nav=nav_path.read_text()
          edit=edit_path.read_text()
          assert 'page_uid: EDIT-01' in nav and 'route: /edit' in nav
          assert 'zh-TW: 剪輯配音' in nav and 'en: Editing & Voice' in nav
          assert 'page_uid: VOICE-01' not in nav
          assert 'status: FINAL_LOCKED' in edit
          assert 'current_only: true' in edit
          assert 'legacy_merge: FORBIDDEN' in edit
          assert 'EDIT+VOICE is one Current department/page' in edit
          assert 'Voice/Music/SFX/Mix/LipSync/Subtitle are internal EDIT-01 stages' in edit
          assert not voice_authority_dir.exists(),'unexpected Current VOICE-01 authority directory exists'

          now=datetime.now(timezone(timedelta(hours=8))).isoformat()
          fresh_neon={
            'verified_at':'2026-09-11T01:56:00+08:00',
            'source':'connected Neon Production read-only SQL',
            'project':'wild-wave-25661146','branch':'main','database':'neondb',
            'department_tasks_editing':0,'department_tasks_qa':0,'task_outputs':0,
            'editing_timelines':0,'edit_render_jobs':0,'production_output_version_locks':0,
            'editing_runtime_runs':0,'voice_runtime_profiles':0,
            'approved_provider_capabilities':4,'provider_route_policies_table':None,
            'approved_provider_contracts':[
              {'provider':'deepseek','model':'deepseek-v4-flash','input':['canonical_instruction'],'output':['text']},
              {'provider':'google','model':'gemini-3.5-flash','input':['canonical_instruction'],'output':['text']},
              {'provider':'groq','model':'openai/gpt-oss-120b','input':['canonical_instruction'],'output':['text']},
              {'provider':'openrouter','model':'openrouter/auto','input':['canonical_instruction'],'output':['text']},
            ],
            'edit_render_contract_observed':False,'voice_contract_observed':False,
            'production_voice01_permission_resources_active':20,
            'production_voice01_actions_active':3,
            'production_voice01_controls_active':17,
          }
          evidence={
            'document_id':'ACPOS_GATE25_VOICE01_RETIRED_FORMAL_RESOURCE_EVIDENCE',
            'status':'CURRENT_PRODUCTION_ALIGNMENT_BLOCKER_VERIFIED',
            'recorded_at':now,
            'production_release_sha':ledger['production_release_sha'],
            'current_navigation_authority':str(nav_path),
            'current_edit_authority':str(edit_path),
            'current_page_identity':'EDIT-01',
            'current_route':'/edit',
            'voice_separate_current_page':False,
            'voice_authority_directory_present':False,
            'edit_voice_boundary':'EDIT+VOICE is one Current department/page; Voice/Music/SFX/Mix/LipSync/Subtitle are internal EDIT-01 stages.',
            'formal_voice01_resource_count':20,
            'formal_voice01_action_count':3,
            'formal_voice01_control_count':17,
            'already_blocked_refreshed':13,
            'newly_blocked_readonly_controls':7,
            'formal_resources':targets,
            'fresh_production_neon_readback':fresh_neon,
            'rule':'Do not recreate VOICE-01 as a Current page, infer aliases into EDIT-01, or fabricate editing/voice business lineage. Current authority consolidates Voice into EDIT-01; Production permission catalog still contains retired VOICE-01 identities.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')

          fresh_refs=[str(evidence_path),str(edit_path),str(nav_path),str(inventory_path)]
          for key in already_blocked:
            row=entries[key]
            row['evidence_refs']=fresh_refs
            row['blocker_detail']='Fresh Production readback confirms zero EDITING/QA lineage, zero edit/voice runtime lineage, no provider_route_policies table, and no EDIT_RENDER/VOICE provider contract. Current FINAL_LOCKED authority also consolidates Voice into EDIT-01; the separate VOICE-01 formal identity is not a Current page owner.'
          for key in readonly_controls:
            row=entries[key]
            row['disposition']='BLOCKED'
            row['reason_code']='RETIRED_CURRENT_UI_PERMISSION_RESOURCE_ACTIVE_IN_PRODUCTION_INVENTORY'
            row['evidence_refs']=fresh_refs
            row['blocker_detail']='Production permission inventory still contains this VOICE-01 CONTROL, but Current FINAL_LOCKED navigation and EDIT authority expose only EDIT-01 for Editing & Voice. No Current VOICE-01 page authority exists; reconstructing the retired page is forbidden.'
            row['operation_ids']=[key.removeprefix('control:')]

          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for row in ledger['entries']:
            counts[row['disposition']]+=1
          assert counts=={'PASS':51,'BLOCKED':194,'NOT_EXECUTED':1236},counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'resource_count':20,'refreshed':13,'newly_blocked':7,'counts':counts},ensure_ascii=False))
          PY
      - name: Validate synchronized formal ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit fresh VOICE-01 blocker evidence and ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_VOICE01_RETIRED_FORMAL_RESOURCE_EVIDENCE_2026-09-11.json
          git commit -m 'evidence(gate25): synchronize 20 retired VOICE-01 formal resources'
          git push origin HEAD:new
