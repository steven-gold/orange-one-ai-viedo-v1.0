name: TEMP R9 0003 Authority Seal

on:
  push:
    branches: [r9-0003-authority-seal-20260904]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r9-0003-authority-seal-20260904
          fetch-depth: 1

      - name: Seal 0003 temporary validation evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          authority_path = Path('authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml')
          manifest_path = Path('authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml')
          authority = authority_path.read_text(encoding='utf-8')
          manifest = manifest_path.read_text(encoding='utf-8')

          new_revision = '2026-09-04-DATABASE-MIGRATION-0003-TEMP-VALIDATION-PASS-PENDING-STAGING-APPROVAL'
          if new_revision in authority and '0003_gate: TEMP_VALIDATION_PASS_PENDING_CR_AUTH_0003_STAGING_APPROVAL' in manifest:
              print('ALREADY_SEALED')
              raise SystemExit(0)

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              return text.replace(old, new, 1)

          authority = replace_once(
              authority,
              'revision: 2026-09-04-DATABASE-MIGRATION-0003-CORRECTION-CODED-PENDING-CATALOG-MATERIALIZATION-AND-TEMP-VALIDATION',
              f'revision: {new_revision}',
              'authority revision')
          authority = replace_once(
              authority,
              '  account_permission_catalog_repository_status: PENDING_MATERIALIZATION',
              '  account_permission_catalog_repository_status: MATERIALIZED_VERIFIED\n  account_permission_catalog_git_blob_sha: bf9081eae472785d260bddeb3860d2f0f0c38b9d\n  account_permission_catalog_sha256: e2a5f05867ba317ca968e8b71e8412e1b8d643392009d90ddee7cc1df325cb2c\n  account_permission_catalog_bytes: 2762474\n  account_permission_catalog_lines: 79399',
              'artifact catalog status')
          authority = replace_once(
              authority,
              'staging_0003_preflight:\n  status: BLOCKED_AUTHORITY_CORRECTION_REQUIRED',
              'staging_0003_pre_correction_preflight:\n  status: HISTORICAL_BLOCKER_RESOLVED_BY_APPROVED_0003_MINIMAL_CORRECTION',
              'historical staging preflight')
          authority = replace_once(
              authority,
              '  repository_materialization_status: PENDING\n  staging_import_status: NOT_EXECUTED',
              '  repository_materialization_status: PASS\n  repository_git_blob_sha: bf9081eae472785d260bddeb3860d2f0f0c38b9d\n  repository_byte_size: 2762474\n  repository_line_count: 79399\n  repository_sha256: e2a5f05867ba317ca968e8b71e8412e1b8d643392009d90ddee7cc1df325cb2c\n  staging_import_status: NOT_EXECUTED',
              'catalog materialization')
          authority = replace_once(
              authority,
              '  status: GENERATED_CHECKSUM_VERIFIED_NOT_EXECUTED\n  source_catalog_contract_id: ACPOS-ACCOUNT-PERMISSION-CATALOG-1.0.0',
              '  status: TEMPORARY_VALIDATION_PASS\n  source_catalog_contract_id: ACPOS-ACCOUNT-PERMISSION-CATALOG-1.0.0',
              'preimport status')
          authority = replace_once(
              authority,
              '  database_execution_status: NOT_EXECUTED\nexecution_gates:',
              '''  database_execution_status: TEMPORARY_VALIDATION_PASS\ntemporary_0003_validation:\n  status: PASS\n  verified_on: '2026-09-04'\n  neon_project_id: tiny-dust-89825424\n  parent_staging_branch_id: br-bitter-poetry-b3p6t5ub\n  temporary_branch_name: r9-0003-account-permission-validate-20260904\n  temporary_branch_id: br-rapid-cherry-b325q8fm\n  database_name: acpos_staging\n  source_migration: database/migrations/0003_account_permission_authorization.sql\n  payload_sha256: 3e8a1eec9a9069ebf5e49d2fedf4285c1c7464f147b3f1b66cc8ec1db8e62790\n  execution_mode: PREIMPORT_THEN_SINGLE_TRANSACTION_35_STATEMENTS\n  preimport_rows: 3648\n  sensitive_rows_added_by_0003: 2\n  final_permission_resource_rows: 3650\n  unique_resource_ids: 3650\n  unique_resource_keys: 3650\n  missing_parent_resource_keys: 0\n  projection_payload_bytes: 572915\n  projection_sha256: 745b716a814be0c55a2851dd82c5b3eaaf9dc07534cfcb03abc357d45d94b98c\n  migration_history_rows: 1\n  migration_history_checksum: 3e8a1eec9a9069ebf5e49d2fedf4285c1c7464f147b3f1b66cc8ec1db8e62790\n  migration_history_approval_ref: CR-AUTH-0003\n  approval_function_present: true\n  approval_trigger_present: true\n  legacy_role_tables_present: false\n  helper_cleanup:\n    approved_by: HUMAN_USER\n    transport_table_present: false\n    cipher_table_present: false\n    uuid_ossp_present: false\n    status: PASS\n  clean_schema_diff_against_staging:\n  - permission_resources_resource_type_check adds SENSITIVE_PERMISSION\n  - memberships_user_department_unique added\n  unexpected_schema_drift: 0\n  staging_mutation_performed: false\nexecution_gates:''',
              'validation evidence insertion')
          authority = replace_once(
              authority,
              '  0003_state: CORRECTION_CODED_PENDING_CATALOG_MATERIALIZATION_AND_TEMP_VALIDATION\n  0003_temporary_execution: NOT_EXECUTED_REQUIRES_EXPLICIT_APPROVAL\n  0003_staging_execution: FORBIDDEN_PENDING_TEMP_VALIDATION_AND_SEPARATE_CR_AUTH_0003_APPROVAL',
              '  0003_state: TEMP_VALIDATION_PASS_PENDING_CR_AUTH_0003_STAGING_APPROVAL\n  0003_temporary_execution: PASS\n  0003_staging_execution: FORBIDDEN_UNTIL_EXPLICIT_CR_AUTH_0003_STAGING_APPROVAL',
              'execution gates')

          manifest = replace_once(
              manifest,
              'revision: 2026-09-04-DATABASE-MIGRATION-0002-APPLIED-VERIFIED',
              f'revision: {new_revision}',
              'manifest revision')
          manifest = replace_once(
              manifest,
              '  pages:\n',
              '  permission:\n  - 06_permission/account_permission_catalog.yaml\n  pages:\n',
              'manifest permission set')
          manifest = replace_once(
              manifest,
              '    0003_gate: BLOCKED_PENDING_0003_OWN_GATES',
              '''    0003_gate: TEMP_VALIDATION_PASS_PENDING_CR_AUTH_0003_STAGING_APPROVAL\n    0003_payload_sha256: 3e8a1eec9a9069ebf5e49d2fedf4285c1c7464f147b3f1b66cc8ec1db8e62790\n    0003_catalog_path: 06_permission/account_permission_catalog.yaml\n    0003_catalog_git_blob_sha: bf9081eae472785d260bddeb3860d2f0f0c38b9d\n    0003_catalog_sha256: e2a5f05867ba317ca968e8b71e8412e1b8d643392009d90ddee7cc1df325cb2c\n    0003_validation_branch_id: br-rapid-cherry-b325q8fm\n    0003_validation_projection_sha256: 745b716a814be0c55a2851dd82c5b3eaaf9dc07534cfcb03abc357d45d94b98c\n    0003_staging_execution: NOT_EXECUTED_REQUIRES_EXPLICIT_HUMAN_APPROVAL''',
              'manifest 0003 gate')
          manifest = replace_once(
              manifest,
              '  migrations: database/migrations/\n',
              '  migrations: database/migrations/\n  permission: 06_permission/\n',
              'repository layout')
          manifest = replace_once(
              manifest,
              '- No second Navigation/IAM L1 authority.\n',
              '- No second Navigation/IAM L1 authority.\n- No second Account Permission Catalog; Current catalog path is 06_permission/account_permission_catalog.yaml.\n',
              'single source catalog rule')

          authority_path.write_text(authority, encoding='utf-8')
          manifest_path.write_text(manifest, encoding='utf-8')
          print('SEALED')
          PY

          git diff --check
          git diff -- authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          git config user.name "acpos-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            exit 0
          fi
          git commit -m "docs(authority): seal 0003 temporary validation pass"
          git push origin HEAD:r9-0003-authority-seal-20260904
