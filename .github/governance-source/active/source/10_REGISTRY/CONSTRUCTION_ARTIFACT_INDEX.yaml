  profile_mandatory_contract_runtime_enforcement_required: true
  typed_runtime_reference_authority_resolution_required: true
  manifest_program_artifact_uid_uniqueness_required: true
  framework_reserved_filename_preregistration_required: true
  profile_file_class_enforcement_required: true
  stage_execution_invariant_registry_required: true
  port_exposure_as_trigger: BLOCK
  state_event_as_trigger_without_explicit_binding: BLOCK
  semantic_similarity_binding_creation: BLOCK
  non_current_final_locked_authority_use: BLOCK
  input_authority_architecture_gap_ai_autofill: BLOCK
  required_evidence_ledger_claim_without_physical_artifact: BLOCK
  validator_stale_schema_path_or_enum: BLOCK
  optional_sparse_zero_absence_may_equal_zero: true
  successor_current_projection_must_be_atomic: true
