name: Preview SYS-01 sync
on:
  push:
    branches: [acpos-live-preview]
    paths: [.github/workflows/preview-system-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
      - name: Patch preview account entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('preview/index.html')
          s=p.read_text()
          old='<button class="head-btn account" disabled>○ —⌄</button>'
          new='<button class="head-btn account" type="button" title="進入後台 / Admin" onclick="location.href=\'system.html\'">○ —⌄</button>'
          assert s.count(old)==1, f'expected one account target, got {s.count(old)}'
          p.write_text(s.replace(old,new))
          PY
      - name: Validate static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('preview/system.html').read_text()
          assert s.count('data-page-uid="admin:SYS-01"')==1
          sections=re.findall(r'data-section-id="([^"]+)"',s)
          expected_sections=[
            'SEC-ADMIN-SYS-01-SYSTEM-CONTEXT','SEC-ADMIN-SYS-01-CONVERSATION','SEC-ADMIN-SYS-01-CANDIDATE-CHANGE','SEC-ADMIN-SYS-01-SOURCE-REFS',
            'SEC-ADMIN-SYS-01-IMPACT-PREVIEW','SEC-ADMIN-SYS-01-AUDIT','SEC-ADMIN-SYS-01-ACTION-DOCK','SEC-ADMIN-SYS-01-EXECUTION-PANEL']
          assert sections==expected_sections, sections
          controls=re.findall(r'data-control-id="([^"]+)"',s)
          expected_controls={
            'SYS-01-BTN-SINGLE-AI','SYS-01-BTN-MULTI-AI','SYS-01-BTN-COUNCIL-DISCUSSION','SYS-01-BTN-COUNCIL-PARALLEL',
            'SYS-01-BTN-CANDIDATE-CREATE','SYS-01-BTN-CR-CREATE','SYS-01-BTN-NAV-OPEN','SYS-01-BTN-SANDBOX-TEST'}
          assert set(controls)==expected_controls and len(controls)==8, controls
          assert '<div class="segments" hidden>' in s
          assert 'Provider / Model' not in s
          assert 'Production Deploy' not in s
          idx=Path('preview/index.html').read_text()
          assert "onclick=\"location.href='system.html'\"" in idx
          PY
      - name: Browser preview validation
        run: |
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          python3 -m http.server 8000 --directory preview >/tmp/preview-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/system.html >/dev/null && break; sleep 1; done
          cat > /tmp/check.cjs <<'NODE'
          const { chromium }=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:900}});
            await p.goto('http://127.0.0.1:8000/system.html',{waitUntil:'networkidle'});
            assert(await p.locator('[data-page-uid="admin:SYS-01"]').count()===1,'SYS UID');
            assert(await p.locator('[data-section-id]').count()===8,'section count');
            assert(await p.locator('[data-control-id]').count()===8,'control count');
            assert(await p.locator('[data-control-id="SYS-01-BTN-COUNCIL-DISCUSSION"]').isHidden(),'council hidden');
            assert(await p.locator('[data-nav-id]').count()===9,'admin nav count');
            const g=await p.evaluate(()=>({x:Math.round(document.querySelector('.workspace').getBoundingClientRect().x),c:document.querySelector('.workspace').clientWidth,s:document.querySelector('.workspace').scrollWidth}));
            assert(g.x===78 && g.c===g.s,'1440 geometry '+JSON.stringify(g));
            const f=await b.newPage({viewport:{width:1440,height:900}});
            await f.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            await f.locator('.account').click();
            await f.waitForURL(/system\.html$/);
            assert(await f.locator('[data-page-uid="admin:SYS-01"]').count()===1,'account entry');
            await b.close();})();
          NODE
          node /tmp/check.cjs
      - name: Commit exact preview patch and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add preview/index.html
          git commit -m "feat(preview): link Account to SYS-01 admin preview"
          git rm .github/workflows/preview-system-sync.yml
          git commit -m "chore(preview): remove SYS-01 sync workflow"
          git push origin HEAD:acpos-live-preview