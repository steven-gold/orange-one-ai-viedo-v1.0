program_artifact_contract:
  required_fields:
  - program_artifact_uid
  - work_unit_uid
  - page_uid_or_scope_uid
  - construction_profile
  - canonical_name
  - canonical_path
  - canonical_filename
  - owner_uid
  - producer_stage_uid
  - input_artifact_refs
  - required_normative_section_uids
  - dependency_refs
  - reverse_dependency_refs
  - acceptance_audit_blueprint_ref
  - required_test_refs
  - current_hash
  - status
  - governance_load_receipt_ref
  - write_target_binding_ref
  - profile_contracts
  identity_rule: UID + canonical_path + current_hash
  source_file_header:
    policy: OPTIONAL_WHEN_LANGUAGE_OR_FRAMEWORK_DISCOURAGES_HEADERS
    authoritative_reference_location: IMPLEMENTATION_MANIFEST
    minimum_annotation_when_used:
    - program_artifact_uid
    - owner_uid
    - implementation_manifest_ref
implementation_manifest_contract:
  required_before_code_write: true
  required_fields:
  - work_unit_uid
  - governance_revision
  - design_freeze_ref
  - program_artifacts
  - dependency_closure_ref
  - acceptance_audit_blueprint_ref
  - naming_registry_ref
  - section_registry_ref
  - protected_current_artifact_registry_ref
  - common_normative_bundle_refs
  - stage_normative_section_uids
  - item_specific_normative_section_uids
  - governance_load_receipt_ref
  - write_target_bindings
  - governance_load_receipt
  - dependency_closure
  - typed_identity_registry_ref
  loader_policy: Code construction MUST load the manifest first, then only the exact normative and artifact refs declared by that manifest plus their dependency closure. Whole-package
    rescans are forbidden unless a declared integrity/audit operation explicitly requires them.
  no_governance_load_receipt_no_execution: true
  effective_normative_set_must_be_compiled_before_execution: true
  required_field_presence_is_not_sufficient: true
  all_required_fields_must_be_runtime_validated: true
  receipt_must_bind_effective_normative_set_hash: true
  dependency_closure_must_bind_declared_edges: true
  validation_impact_index_ref_required_for_incremental_validation: true
  mutation_overlay_or_copy_on_write_preferred: true
continuity_contract:
  edge_types:
  - CROSS_LAYER
  - CROSS_STAGE
  - CROSS_PAGE
  - PAGE_VISUAL_REFERENCE
  - SHARED_OWNER_PORT
  - PROVIDER_ASYNC
  - DATA_RUNTIME
  required_edge_fields:
  - edge_uid
  - producer_uid
  - producer_hash
  - consumer_uid
  - consumer_stage_uid
  - edge_type
  - handoff_or_contract_ref
  forward_and_reverse_edge_required: true
  unresolved_required_edge: BLOCK
  changed_producer_hash_marks_consumers: REVERIFY_REQUIRED
supersession_cleanup_transaction:
  applies_to: ALL_CURRENT_ARTIFACT_TYPES
  ordered_steps:
  - REGISTER_REPLACEMENT
  - RESOLVE_FORWARD_REFERENCES
  - RESOLVE_REVERSE_DEPENDENCIES
  - MARK_IMPACTED_CONSUMERS_REVERIFY_REQUIRED
  - PROVE_ZERO_CURRENT_REFERENCE_TO_SUPERSEDED_OWNER
  - REMOVE_SUPERSEDED_FROM_CURRENT_INDEX
  - DELETE_GENERATED_DUPLICATE_TEMP_BACKUP_OR_OBSOLETE_ARTIFACTS
  - UPDATE_NAMING_OWNER_ARTIFACT_DEPENDENCY_INDEXES
  - UPDATE_CLEANUP_LEDGER
  - RUN_ORPHAN_RESIDUAL_BROKEN_REFERENCE_SCAN
  raw_source_policy: IMMUTABLE_REFERENCE_MAY_REMAIN_BUT_CANNOT_REMAIN_CURRENT_OWNER
  completion_conditions:
    current_reference_to_superseded_owner: 0
    duplicate_current_owner: 0
    orphan_required_artifact: 0
    unjustified_residual_file: 0
    broken_reference: 0
canonical_path_policy:
  source_code: src/<domain>/<scope>/<registered-path>
  test_code: tests/<domain>/<scope>/<registered-path>
  migration: migrations/<registered-sequence>_<canonical-name>.sql
  governance_machine_registry: 10_REGISTRY/<UID>_<CANONICAL_NAME>.yaml
  evidence: 11_EVIDENCE/<stage-or-audit-scope>/<UID>_<CANONICAL_NAME>.yaml
  forbidden_path_patterns:
  - ../
  - ./../
  - \..\
  - //
