authority:
  id: ACPOS_ERP-01_ERP_FINANCE_SINGLE_PAGE_AUTHORITY
  page_uid: admin:ERP-01
  page_name_zh: ERP
  page_name_en: ERP & Finance
  surface: ADMIN
  status: FINAL_LOCKED
  current_only: true
  file_spec_status: FILE_SPEC_COMPLETE
  system_implementation_status: NOT_EXECUTED
  single_page_workspace: true
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY@V1.9
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY@V1.0
  authorization_model: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY
  backend_l1_key: erp_finance
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  purpose: One current ERP workspace that consolidates the existing current registered authority ERP Connector/Snapshot and Finance/Capacity Guardrail
    page capabilities into one same-page administration workspace without creating a second ERP service, finance service, connector registry,
    sync engine, snapshot store, finance store, export service or authorization system.
  truthful_status_rule: This file completes current ERP page design/encoding only. Application code, current registered authority master merge,
    external ERP connector execution, runtime, Sandbox, Regression, E2E, restart persistence and production deployment are NOT_EXECUTED.
  system_authority: ACPOS_SYSTEM_AUTHORITY@V1.0
  navigation_authority: ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY@V1.0
single_system_contract:
  current_ui_owner: admin:ERP-01
  service_owners:
  - REUSE ERPConnectorService
  - REUSE FinanceGuardrailService
  - REUSE existing Projection/Export/Audit owners
  forbidden_parallel_components:
  - second ERP system
  - second ERP connector registry
  - second finance/ledger service
  - second snapshot store
  - second ERP sync engine
  - second finance/capacity guardrail engine
  - second export service
  - page-local secret store
  - page-local RBAC/permission system
  - page-local provider/API-key system
  external_erp_writeback: FORBIDDEN by current registered authority ERP_write_from_ACPOS boundary
  missing_value_behavior: Render — / incomplete / actual state; missing_value_as_zero is forbidden.
page_composition:
  canonical_user_flow: Finance Overview <-> ERP Connection <-> Sync & Data Quality; Audit/details secondary drawer
  view_switch_rule: Three main views are same-page UI context only; switching views does not mutate business state and does not create new routes.
  default_view: finance_overview
  main_views:
  - view_uid: ERP-01-VIEW-FINANCE
    key: finance_overview
    label: 財務概況
    owner: REUSE FinanceGuardrailService
    content:
    - Cost
    - Revenue
    - Cashflow
    - Capacity
    - Forecast
    - Guardrails
    - Recommendation Boundary
    - Fact Pack / Export
  - view_uid: ERP-01-VIEW-CONNECTOR
    key: connector_mapping
    label: ERP 連接
    owner: REUSE ERPConnectorService
    content:
    - Connector identity
    - Provider/Adapter key
    - Secret Reference ID
    - Entity Scope
    - Connection Status
    - Mapping Version
    - Create/Update/Validate/Mapping Validate
  - view_uid: ERP-01-VIEW-SYNC
    key: sync_quality
    label: 同步與資料品質
    owner: REUSE ERPConnectorService
    content:
    - Snapshot
    - Freshness
    - Currency/Timezone
    - Completeness
    - Last Sync Status
    - Failure
    - Refresh/Create Sync/Status/Retry
  secondary_drawer:
    width: 480-560px
    content:
    - Exact source projection detail
    - Failure detail
    - Audit ref
    - Version/correlation reference
    - Allowed error/retry eligibility
    no_duplicate_permanent_cards: true
layout:
  desktop_min_width: 1280px
  below_min_width: Keep min-width=1280px + horizontal scroll; no alternate mobile workflow
  vertical_scroll: Main workspace height:auto; overflow-y:auto
  context_bar:
    height: 56px
    width: 100%
  view_bar:
    height: 52px
    width: 100%
    type: compact segmented tabs
  primary_grid:
    columns: minmax(0,72fr) minmax(300px,28fr)
    approx: 72% / 28%
    gap: 16px
    align: start
  primary_workspace: Current selected ERP view; finance/connector/sync details
  governance_rail: Readiness, connector/snapshot state, freshness/completeness, permission/data blockers, detail drawer trigger
  local_action_dock:
    height: 56px
    rule: Only actions valid for current view + current state + permission; one dominant action maximum.
  visual_override: FORBIDDEN; inherit Global Visual tokens only
  fake_chart_or_kpi: FORBIDDEN
finance_contract:
  read_only: true
  amount_visibility: Raw finance/provider cost values require explicit finance.read/provider.cost.read as applicable; otherwise masked/non-amount
    status only.
  visible_groups:
  - cost
  - revenue
  - cashflow
  - capacity
  - forecast
  - guardrails
  - recommendation_boundary
  actions:
  - getERPFinanceFactPack
  - getERPCapacityGuardrails
  - getERPForecast
  - exportProjection
  forbidden_current_actions:
  - create revenue
  - create expense
  - edit ledger
  - budget approval/reallocation execution
  - manual accounting journal
  - external ERP writeback
  reason: No such executable current ERP operation is registered in the active current registered authority ERP page authority; do not import
    archive handbook examples as runtime authority.
connector_contract:
  read_fields:
  - FIELD-ADMIN-ERP-01-CONNECTOR-ID
  - FIELD-ADMIN-ERP-01-PROVIDER-KEY
  - FIELD-ADMIN-ERP-01-ADAPTER-KEY
  - FIELD-ADMIN-ERP-01-SECRET-REFERENCE-ID
  - FIELD-ADMIN-ERP-01-ENTITY-SCOPE
  - FIELD-ADMIN-ERP-01-CONNECTION-STATUS
  - FIELD-ADMIN-ERP-01-MAPPING-VERSION
  secret_rule: Only secret_reference_id is stored/rendered; secret values are never embedded or displayed.
  actions:
  - createERPConnector
  - updateERPConnector
  - validateERPConnector
  - validateERPMapping
sync_quality_contract:
  read_fields:
  - FIELD-ADMIN-ERP-01-SNAPSHOT-ID
  - FIELD-ADMIN-ERP-01-FRESHNESS-AT
  - FIELD-ADMIN-ERP-01-COMPLETENESS
  - FIELD-ADMIN-ERP-01-LAST-SYNC-STATUS
  - FIELD-ADMIN-ERP-01-FAILURE-ID
  - FIELD-ADMIN-ERP-01-AUDIT-REF
  currency_timezone_source_section: admin:ERP-01:currency_timezone
  actions:
  - refreshERPSnapshot
  - createERPSyncJob
  - getERPSyncStatus
  - retryERPSync
  - getERPFailure
  data_truth_rule: No fake connector health, no fake financial values, no synthetic completeness/freshness, no missing-as-zero.
form_contracts:
  common_effectful_context:
  - scope
  - expected_version
  - correlation_id
  - idempotency_key
  CreateERPConnectorRequest:
    business_fields:
    - provider_key
    - adapter_key
    - secret_reference_id
    - entity_scope
    - mapping_version
    - mapping_entity_name
    - mapping_source_schema
    - mapping_target_schema
    - mapping_transform_spec
    - data_classification
    additionalProperties: false
    ui_rule: Schema-driven modal. No page-union fields; no client-authored runtime state; no raw secret value field.
  UpdateERPConnectorRequest:
    rule: Use exact existing current registered authority UpdateERPConnectorRequest. Do not union/infer fields from page.
  ValidateERPConnectorRequest:
    rule: Use exact existing current registered authority ValidateERPConnectorRequest by operation binding.
  ValidateERPMappingRequest:
    rule: Use exact existing current registered authority business payload schema by operation_id.
  RefreshERPSnapshotRequest:
    rule: Use exact existing current registered authority business payload schema by operation_id.
  CreateERPSyncJobRequest:
    known_business_fields_from_R9:
    - erp_connector_id
    - requested_scope
    - data_classification
    - records_payload
    - snapshot_type
    - snapshot_document
    - completeness
    - external_result_verified
    - external_evidence_refs
    ui_rule: Use exact current registered authority schema. Do not turn test fixture/example values into defaults.
  RetryERPSyncRequest:
    rule: Use exact existing current registered authority business payload schema by operation_id.
  ExportProjectionRequest:
    rule: Use exact existing current registered authority business payload schema by operation_id.
operation_registry_refs:
- operation_id: getUiProjection
  method: GET
  path: /v1/ui-projections/{pageUid}
  owner: Projection / source page read owner
  permission: SOURCE_REGISTERED_PAGE_SECTION_FIELD_ACCOUNT_AUTHORIZATION
  request_contract: N/A_READ
- operation_id: createERPConnector
  method: POST
  path: /v1/erp/connectors
  owner: ERPConnectorService
  permission: erp.connector.write
  request_contract: CreateERPConnectorRequest
  event: erp.connector.created
- operation_id: updateERPConnector
  method: PATCH
  path: /v1/erp/connectors/{id}
  owner: ERPConnectorService
  permission: erp.connector.write
  request_contract: UpdateERPConnectorRequest
  event: erp.connector.updated
- operation_id: validateERPConnector
  method: POST
  path: /v1/erp/connectors/{id}/validate
  owner: ERPConnectorService
  permission: erp.connector.validate
  request_contract: ValidateERPConnectorRequest
  events:
  - erp.connector.validation_requested
  - erp.connector.validation_failed
- operation_id: validateERPMapping
  method: POST
  path: /v1/erp/mappings/{id}/validate
  owner: ERPConnectorService
  permission: erp.mapping.validate
  request_contract: USE_SOURCE_REGISTERED_BUSINESS_PAYLOAD_SCHEMA_BY_OPERATION_ID
  event: erp.mapping.validation_failed
- operation_id: refreshERPSnapshot
  method: POST
  path: /v1/erp/snapshots/refresh
  owner: ERPConnectorService
  permission: erp.snapshot.read / source exact operation permission
  request_contract: USE_SOURCE_REGISTERED_BUSINESS_PAYLOAD_SCHEMA_BY_OPERATION_ID
  event: erp.snapshot.refresh_requested
- operation_id: createERPSyncJob
  method: POST
  path: /v1/erp/sync-jobs
  owner: ERPConnectorService
  permission: erp.sync.request
  request_contract: CreateERPSyncJobRequest
  event: erp.sync.requested
- operation_id: getERPSyncStatus
  method: GET
  path: /v1/erp/sync-jobs/{id}
  owner: ERPConnectorService
  permission: erp.connector.read / source exact operation permission
  request_contract: N/A_READ
- operation_id: retryERPSync
  method: POST
  path: /v1/erp/sync-jobs/{id}/retry
  owner: ERPConnectorService
  permission: erp.sync.retry
  request_contract: USE_SOURCE_REGISTERED_BUSINESS_PAYLOAD_SCHEMA_BY_OPERATION_ID
  event: erp.sync.retry_requested
- operation_id: getERPFailure
  method: GET
  path: /v1/erp/failures/{id}
  owner: ERPConnectorService
  permission: erp.connector.read / source exact operation permission
  request_contract: N/A_READ
- operation_id: getERPFinanceFactPack
  method: GET
  path: /v1/erp/finance/fact-pack
  owner: FinanceGuardrailService
  permission: finance.read
  request_contract: N/A_READ
- operation_id: getERPCapacityGuardrails
  method: GET
  path: /v1/erp/capacity/guardrails
  owner: FinanceGuardrailService
  permission: finance.read
  request_contract: N/A_READ
- operation_id: getERPForecast
  method: GET
  path: /v1/erp/forecasts
  owner: FinanceGuardrailService
  permission: finance.read
  request_contract: N/A_READ
- operation_id: exportProjection
  method: POST
  path: /v1/exports
  owner: Existing Projection/Export owner
  permission: SOURCE_REGISTERED_OPERATION_PERMISSION_BY_OPERATION_ID
  request_contract: USE_SOURCE_REGISTERED_BUSINESS_PAYLOAD_SCHEMA_BY_OPERATION_ID
  event: export.requested
