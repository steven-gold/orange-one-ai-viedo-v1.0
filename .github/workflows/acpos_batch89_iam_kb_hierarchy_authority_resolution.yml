name: ACPOS Batch 89 IAM KB Hierarchy Authority Resolution
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch89_iam_kb_hierarchy_authority_resolution.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve IAM and KB hierarchy evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET
          EXPECTED_PARENT="798b7d5615d1c894a708cd10ef1c30fd56729294"
          WF=Path(".github/workflows/acpos_batch89_iam_kb_hierarchy_authority_resolution.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT: raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          TARGETS={
            "IAM-01":{
              "file":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
              "terms":["Account","Identity Actor","Permission Draft","L1 Permission Choice","Explicit Permission Assignment","Authorization Impact Preview","Access Review","Audit","permission","assignment","authorization","identity"]
            },
            "KB-01":{
              "file":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
              "terms":["KnowledgeSource","Acquisition Intent","Acquisition Run","Snapshot","Normalized Refs","Citation","Knowledge","Fact","Evidence","ACPOSContextCandidate","Real Execution","ACPOSExperienceRecord","Experience Record","Replay","Learning Candidate","Knowledge Draft","Approved Knowledge Version","version","review","source_ref","selected_refs","evidence_refs"]
            }
          }
          def norm(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def txt(el):return norm("".join((x.text or "") for x in el.iter(W+"t")))
          out={}
          for page,spec in TARGETS.items():
              fn=spec["file"]; terms=[t.upper() for t in spec["terms"]]
              with zipfile.ZipFile(fn) as z: root=ET.fromstring(z.read("word/document.xml"))
              recs=[]
              for pi,p in enumerate(root.iter(W+"p"),1):
                  s=txt(p); u=s.upper()
                  if s and any(t in u for t in terms):
                      recs.append({"kind":"PARAGRAPH","index":pi,"text":s})
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[[txt(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
                  headers=rows[0] if rows else []
                  for ri,row in enumerate(rows[1:],2):
                      joined=" | ".join(row); u=joined.upper()
                      if any(t in u for t in terms):
                          recs.append({"kind":"TABLE_ROW","table":ti,"row":ri,"headers":headers,"cells":row})
              # exact dedup
              seen=set();ded=[]
              for r in recs:
                  k=json.dumps(r,ensure_ascii=False,sort_keys=True)
                  if k not in seen:seen.add(k);ded.append(r)
              out[page]={"file":fn,"records":ded}
          summary={p:len(v["records"]) for p,v in out.items()}
          Path("__batch89_iam_kb_hierarchy_authority.json").write_text(json.dumps({"summary":summary,"pages":out},ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH89_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH89_AUTHORITY_RESOLUTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch89-iam-kb-hierarchy-authority
          path: __batch89_iam_kb_hierarchy_authority.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch89_iam_kb_hierarchy_authority.json
          git config user.name "acpos-batch89-source"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch89_iam_kb_hierarchy_authority_resolution.yml
          git commit -m "chore(acpos): close batch 89 IAM KB hierarchy authority resolution"
          git push origin HEAD:0921acpos
