name: VIS-10 blocker truth sync
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-blocker-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Record truthful VIS-10 authority blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s = p.read_text()
          old = "  current_task: VIS-10_ADMIN_SYS-01_VISUAL_POSITIONING\n  last_completed_task: VIS-09_FRONT_INFO-01_VISUAL_POSITIONING\n"
          new = "  current_task: VIS-10_ADMIN_SYS-01_VISUAL_POSITIONING\n  current_task_state: BLOCKED_BY_AUTHORITY_GAP\n  current_task_blockers:\n  - CANONICAL_ROUTE_RESOLVER_MISSING\n  - PRESERVED_25_CONTROL_REGISTRY_UID_SOURCE_MISSING\n  last_completed_task: VIS-09_FRONT_INFO-01_VISUAL_POSITIONING\n"
          if old not in s:
              raise SystemExit('current_state anchor not found')
          s = s.replace(old, new, 1)
          old2 = "  - id: VIS-10\n    group: ADMIN\n    page_uid: admin:SYS-01\n    name: 系統維護\n    status: NOT_STARTED\n"
          new2 = "  - id: VIS-10\n    group: ADMIN\n    page_uid: admin:SYS-01\n    name: 系統維護\n    status: BLOCKED_BY_AUTHORITY_GAP\n    blocker_detail:\n      canonical_route_resolver:\n        state: MISSING\n        finding: ADMIN-NAV-01 binds admin:SYS-01, but Current Authority/repo contains no literal route/path/href/URL resolver for this page.\n        rule: Do not invent /admin/system or any other route.\n      preserved_control_registry:\n        state: MISSING\n        finding: SYS-01 Current Page Authority declares 25 existing registered controls must be preserved, but their exact control UIDs are not present in the Current Authority repository text; only the 4 explicit Multi-AI controls are enumerated.\n        rule: Do not invent or semantically reconstruct the missing 25 control UIDs.\n    discovery_evidence:\n      registry_scan_run_id: 33282112752\n      registry_scan_artifact_id: 9723286489\n      registry_scan_result: No separate exact 25-control SYS-01 UID registry found in current repository.\n      route_scan_run_id: 33282172518\n      route_scan_artifact_id: 9723304445\n      route_scan_result: No literal SYS-01 route/path/href resolver found in current repository.\n      pre_blocker_sync_staging_diff_vs_new: ZERO_FILES\n    resume_gate:\n    - Publish/identify canonical literal route resolver for admin:SYS-01 / ADMIN-NAV-01.\n    - Publish/identify exact authoritative UID registry for the preserved 25 SYS-01 controls, including section/action/component/visual bindings where required.\n    - Then restart VIS-10 from Current Authority without inferring missing definitions.\n"
          if old2 not in s:
              raise SystemExit('VIS-10 anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          ruby -e 'require "yaml"; YAML.load_file("docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml"); puts "PROGRESS YAML PASS"'
      - name: Commit tracker and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "docs(vis10): record SYS-01 authority blockers"
          git rm .github/workflows/vis10-blocker-sync.yml
          git commit -m "chore(vis10): remove temporary blocker sync workflow"
          git push origin HEAD:acpos-vis10-staging
