      This closure supersedes the prior generic 2026-09-21 V1/V3 annex only, not the original domain logic or human visual review gates.'
  - index: 62
    style: Heading 2
    text: SOC-01 · Exact Construction Binding
  - index: 63
    style: Heading 2
    text: Page Construction Invariant
  - index: 64
    style: Normal
    text: The exact control denominator above is the only construction denominator for this page. Components/fields/visual IDs are not counted as additional controls.
      Existing source UIDs are preserved. A control classified UI_LOCAL_EXACT MUST NOT create a server write. A control classified SPEC_EXACT_RUNTIME_BLOCKED / NOT_EXECUTED
      MUST remain disabled or fail-closed until its runtime evidence exists.
  - index: 66
    style: Heading 1
    text: SOC-01 Publish QA Eligibility Consumer Contract
  - index: 67
    style: Normal
    text: '[ACPOS-20260921-BATCH-02-CONSUMER-CONTRACT-CLOSURE-V1] 本節只補齊既有 Current source 已可證明的設計契約。既有 Control / Action / Gate / Permission / Owner / Operation / Route
      優先；SOURCE_NOT_DEFINED、NO_PUBLIC_API_ID_IN_CURRENT_AUTHORITY、SPEC_EXACT_RUNTIME_BLOCKED 不得由 Word 自行發明或升格為 Runtime 完成。'
  - index: 68
    style: Normal
    text: 'Existing publish authority remains unchanged: SOC-01-BTN-PUBLISH → SOC-01-ACT-PUBLISH-REQUEST → SOC-01-GATE-PUBLISH → SOC-01-PERM-PUBLISH → requestSocialTargetPublish
      → POST /v1/social/targets/{targetId}/publish → PublishingService. This batch adds the missing governed QA eligibility bindings to that SAME publish gate; it
      does not create a second publish API.'
  - index: 70
    style: Heading 1
    text: Batch 47 · SOC-01 Social Contract Binding Ledger
  - index: 71
    style: Normal
    text: '[ACPOS-20260922-BATCH-47-SYSTEM07-SOCIAL-CONTRACT-REMEDIATION-V1] Social effectful contracts preserve external-provider truth, secret isolation, candidate
      governance and derived-projection boundaries. Credential reveal never persists plaintext secret; local publish request acceptance never equals external publish
      success.'
  - index: 73
    style: Heading 2
    text: Canonical Business Entity Operation Applicability Matrix / 業務實體操作適用性矩陣
  - index: 74
    style: Normal
    text: 'Authority: Current Word design + Mother §71 bounded completion. 本矩陣只正規化既有行為與目前未授權行為；不得據此新增 Business Entity、Operation、Runtime 或 API。 Current tree: b2f81b20322dd9e9268001126b07931b437e27df.'
  - index: 76
    style: Heading 1
    text: Mother Planning / Basic Design Closure Annex｜規劃設計規範閉環補充
  - index: 77
