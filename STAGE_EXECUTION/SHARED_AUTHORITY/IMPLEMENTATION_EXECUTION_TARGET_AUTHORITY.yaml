authority:
  id: ACPOS_IMPLEMENTATION_EXECUTION_TARGET_AUTHORITY
  version: V2.0
  status: CURRENT_DYNAMIC_RESOLUTION_CONTRACT
  artifact_type: IMPLEMENTATION_EXECUTION_TARGET_AUTHORITY_PROTOCOL
  normative_authority: false
  authority_role: STAGE05_SUCCESSOR_EXECUTION_TARGET_RESOLUTION_PROTOCOL
  created_by: FULL_STAGE_LIFECYCLE_CONVERGENCE
  scope: STAGE-04_TO_STAGE-05_HANDOFF_AND_STAGE-05_ADMISSION
  static_historical_branch_or_head_binding: FORBIDDEN
  undefined_behavior: BLOCK_AND_REPORT_AUTHORITY_GAP
  rule: >
    This protocol defines how Stage-05 execution targets are resolved from the exact
    Current product repository context at the time Stage-05 becomes authorized.
    It does not preserve historical main/new branch identities, old fixed SHAs, or
    V232-derived target values. No target identity is granted completion credit
    until a Current target-resolution receipt binds repository, branch, head, tree,
    work unit, successor stage, binding class, authority evidence and context match.
  current_resolution_contract:
    resolution_timing: STAGE04_CLOSURE_ELIGIBILITY_CHECK_AND_STAGE05_ADMISSION_RECHECK
    stage05_effectful_authorization_required_before_execution: true
    current_repository_context_required: true
    required_receipt_fields:
    - artifact_type
    - binding_uid
    - consuming_operation_uid
    - binding_class
    - target_identity
    - canonical_owner_or_authority_ref
    - authority_evidence_ref
    - work_unit_uid
    - successor_stage_uid
    - resolution_kind
    - resolution_status
    - current_execution_repository
    - current_execution_branch
    - current_execution_head_sha
    - current_execution_tree_sha
    - current_context_match
    allowed_resolution_statuses: [RESOLVED_CURRENT, AUTHORIZED_NOT_APPLICABLE]
    authorized_not_applicable_requires_authority_evidence: true
    stale_head_or_tree: BLOCK
    historical_branch_target: BLOCK
    v232_derived_target: BLOCK
  minimum_binding_classes:
  - REPOSITORY_TARGET
  - APPLICATION_ROOT
  - IMPLEMENTATION_OWNER
  - IMPLEMENTATION_LANGUAGE_AUTHORITY
  - FRONTEND_FRAMEWORK_AUTHORITY
  - BACKEND_FRAMEWORK_AUTHORITY
  - PACKAGE_MANAGER_AUTHORITY
  - FRONTEND_RUNTIME_TARGET
  - BACKEND_RUNTIME_TARGET
  - DATA_ACCESS_TARGET
  - DATABASE_TARGET
  - AUTHENTICATION_TARGET
  - AUTHORIZATION_TARGET
  - DATA_SECURITY_TARGET
  - AUDIT_LOGGING_TARGET
  - EXTERNAL_INTEGRATION_TARGET
  - ASYNC_RUNTIME_TARGET
  - STORAGE_RUNTIME_TARGET
  current_resolved_targets: []
  completion_credit: 0
