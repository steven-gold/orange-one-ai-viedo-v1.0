  - index: 40
    rows:
    - row: 0
      cells:
      - Design Item / 設計項目
      - Canonical Planning Design Contract / 正式規劃設計契約
    - row: 1
      cells:
      - Keyboard / Focus
      - Reading and focus order MUST follow semantic operation order. Every interactive control is keyboard reachable; Focus state remains visibly distinct.
    - row: 2
      cells:
      - ARIA / Label
      - Icon-only controls require accessible name/label; form fields bind visible label, validation/error description and required state.
    - row: 3
      cells:
      - Modal / Drawer
      - On open, focus enters the surface; focus remains contained where modal; close/cancel is keyboard reachable; focus returns to the invoking control.
    - row: 4
      cells:
      - Color / State
      - State meaning MUST NOT rely on color alone; text/icon/state label remains available under current contrast tokens.
    - row: 5
      cells:
      - Error / Validation
      - Error state is announced/associated with its control or field; failure does not erase user input unless the current design explicitly requires reset.
    - row: 6
      cells:
      - i18n Languages
      - zh-TW / zh-CN / en are design-supported language contexts. Labels/help/error/status text must use localization-owned copy rather than page-local semantic
        duplication.
    - row: 7
      cells:
      - Variable Text Length
      - Localized text may wrap/reflow within current responsive rules but MUST NOT alter functional order, hide required actions or create uncontrolled layout drift.
