    - generate_scorecard
    - evidence assistance
    - consistency check
    - policy/check assistance
    - candidate comparison
  handoff_in:
  - EDIT/other exact finished output
  handoff_out:
  - CorrectionRequest -> original owner
  - PASS -> Release candidate
  experience_signals:
  - scorecard
  - finding categories/severity
  - root cause
  - recheck count
  - pass/fail
  - manual review outcome
  decision_boundary: QA cannot edit upstream output and cannot publish directly.
  version_boundary: Finding closes only after verified new exact version + recheck when correction is required.
