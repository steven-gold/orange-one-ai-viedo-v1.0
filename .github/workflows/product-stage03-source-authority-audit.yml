name: Product Stage03 Source Authority Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/product-stage03-source-authority-audit.yml'
permissions:
  contents: read
jobs:
  audit-source-authority:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with: {ref: 0921acpos, fetch-depth: 1}
    - name: Extract exact source authority tables
      run: |
        python - <<'PY'
        from pathlib import Path
        import zipfile, xml.etree.ElementTree as ET
        W='{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
        files={
          'HOME':Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-001/00_SOURCE_INTAKE/RAW_SOURCE/SRC-DOCX-334A4679600F092B733B/ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx'),
          'WB01':Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-001/00_SOURCE_INTAKE/RAW_SOURCE/SRC-DOCX-2B1908530B5BD312A392/ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx'),
        }
        def txt(node): return ''.join((t.text or '') for t in node.iter(W+'t')).strip()
        for label,path in files.items():
          with zipfile.ZipFile(path) as z: root=ET.fromstring(z.read('word/document.xml'))
          body=root.find(W+'body')
          tables=[]
          for child in list(body):
            if child.tag!=W+'tbl': continue
            rows=[]
            for tr in child.findall(W+'tr'):
              rows.append([txt(tc) for tc in tr.findall(W+'tc')])
            if rows: tables.append(rows)
          print('===',label,'TABLES',len(tables),'===')
          for ti,rows in enumerate(tables):
            joined=' '.join(' | '.join(r) for r in rows).casefold()
            if label=='HOME' and ('font size' in joined or 'ty01' in joined or 'typography' in joined):
              print('TABLE',ti)
              for r in rows: print('ROW',' | '.join(r))
            if label=='WB01' and (('token / geometry' in joined) or ('page bg' in joined) or ('breakpoints' in joined) or ('global visual' in joined)):
              print('TABLE',ti)
              for r in rows: print('ROW',' | '.join(r))
        PY
