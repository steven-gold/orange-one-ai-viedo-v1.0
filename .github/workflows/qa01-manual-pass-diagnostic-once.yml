name: QA01 Manual Pass Diagnostic Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-manual-pass-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose manual pass chain
        run: |
          cat > qa01-manual-diagnostic.cjs <<'NODE'
          const {chromium}=require('playwright');
          const {spawn}=require('child_process');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const ctl=(p,id)=>p.locator(`[data-control-id="${id}"]`);
          const val=async(p,id)=>((await ctl(p,id).locator('strong').textContent())||'').trim();
          async function click(p,id){const e=ctl(p,id);await p.waitForFunction(id=>{const x=document.querySelector(`[data-control-id="${id}"]`);return x instanceof HTMLButtonElement&&!x.disabled},id,{timeout:15000});await e.click()}
          (async()=>{
            const srv=spawn('npm',['run','dev','--','-p','3210'],{env:{...process.env,NEXT_PUBLIC_ACPOS_RUNTIME_MODE:'TEST',ACPOS_QA_TEST_SCENARIO:'MANUAL_REQUIRED'},stdio:['ignore','pipe','pipe'],detached:true});srv.stdout.pipe(process.stdout);srv.stderr.pipe(process.stderr);
            try{
              for(let i=0;i<120;i++){try{const r=await fetch('http://localhost:3210/qa');if(r.status<500)break}catch{}await sleep(500)}
              const b=await chromium.launch({headless:true});
              try{
                const p=await b.newPage({viewport:{width:1600,height:1200}});const req=[];p.on('request',r=>{if(r.url().includes('/v1/state-commands/qareview/decidepass'))req.push(r.url())});
                await p.goto('http://localhost:3210/qa',{waitUntil:'networkidle'});await p.waitForFunction(()=>{const e=document.querySelector('[data-control-id="QA-01-BTN-AUTO-START"]');return e instanceof HTMLButtonElement&&!e.disabled},{timeout:15000});
                await p.getByRole('button',{name:'MANUAL',exact:true}).click();await click(p,'QA-01-BTN-START-REVIEW');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-GATE-STATUS"] strong')?.textContent==='MANUAL_REVIEW_REQUIRED',{timeout:15000});
                await click(p,'QA-01-BTN-MANUAL-MODIFY');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-BTN-MANUAL-MODIFY"]')?.getAttribute('data-last-action')==='true',{timeout:15000});
                await click(p,'QA-01-BTN-MANUAL-PASS');await sleep(1500);
                const out={page_state:await p.locator('[data-page-uid="QA-01"]').getAttribute('data-page-state'),gate_status:await val(p,'QA-01-FLD-GATE-STATUS'),manual_state:await val(p,'QA-01-FLD-MANUAL-STATE'),manual_decision:await val(p,'QA-01-FLD-MANUAL-DECISION'),runtime_error:await val(p,'QA-01-FLD-ERROR'),manual_pass_last:await ctl(p,'QA-01-BTN-MANUAL-PASS').getAttribute('data-last-action'),decidepass_requests:req.length};
                console.log('MANUAL_PASS_DIAGNOSTIC',JSON.stringify(out));
                if(out.decidepass_requests===0)console.log('DIAGNOSIS_NO_DECIDEPASS_REQUEST');
                else console.log('DIAGNOSIS_DECIDEPASS_REQUEST_PRESENT');
              }finally{await b.close()}
            }finally{try{process.kill(-srv.pid,'SIGKILL')}catch{}}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa01-manual-diagnostic.cjs
