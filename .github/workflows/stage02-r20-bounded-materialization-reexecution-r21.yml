name: Stage-02 R20 Bounded Materialization + Fresh Reexecution R21

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-r20-bounded-materialization-reexecution-r21.yml'
      - 'governance/ci/materialize_stage02_r20_auto_remediable_closures_r21.py'
      - 'governance/ci/validate_stage02_r20_materialized_closures_r21.py'
      - 'governance/ci/run_current_stage2_r20_effective_reexecution_r21.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-reexecute:
    runs-on: ubuntu-latest
    env:
      STAGE02_FULL_LINE_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R21 implementation
        run: |
          python -m py_compile governance/ci/materialize_stage02_r20_auto_remediable_closures_r21.py
          python -m py_compile governance/ci/validate_stage02_r20_materialized_closures_r21.py
          python -m py_compile governance/ci/run_current_stage2_r20_effective_reexecution_r21.py
      - name: Revalidate corrected R20 exact 150 classification
        run: python governance/ci/validate_stage02_functional_chain_auto_remediability_r20.py
      - name: Revalidate GAP-006 exact current-successor authority resolution
        run: python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
      - name: Materialize only R20 19 deterministic minimal closures
        run: python governance/ci/materialize_stage02_r20_auto_remediable_closures_r21.py
      - name: Validate R21 exact materialization set and safety boundary
        run: python governance/ci/validate_stage02_r20_materialized_closures_r21.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Fresh Stage-02 effective reexecution from exact Raw scanner
        run: python governance/ci/run_current_stage2_r20_effective_reexecution_r21.py
      - name: Assert fresh R21 result denominator and Stage-02 fail-closed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.github/stage02-test/STAGE02_R20_EFFECTIVE_REEXECUTION_RESULT_R21.json')
          d = json.loads(p.read_text())
          assert d['raw_discovery_gap_total'] == 171, d
          assert d['product_materialization_elimination_count'] == 36, d
          assert d['gap006_authority_elimination_count'] == 4, d
          assert d['total_effective_elimination_count'] == 40, d
          assert d['fresh_functional_gap_total'] == 131, d
          assert d['effective_gap_categories'] == {
              'ACTION_WITHOUT_CONTROL_OR_TRIGGER': 1,
              'AUDIT_EVENT_NODE_MISSING': 13,
              'FAILURE_STATE_ERROR_BINDING_MISSING': 44,
              'PAYLOAD_INPUT_CONTRACT_MISSING': 34,
              'POST_ACTION_VALIDATION_NODE_MISSING': 3,
              'STATE_TRANSITION_LEDGER_FIELD_MISSING': 36,
          }, d
          assert d['result'] == 'BLOCKED'
          assert d['stage_exit_allowed'] is False
          assert d['website_construction_allowed'] is False
          assert d['deployment_allowed'] is False
          assert d['current_specification_mutated'] is False
          assert d['immutable_stage1_source_mutated'] is False
          assert d['prior_stage2_results_used'] is False
          assert d['prior_stage2_counts_used_as_scan_input'] is False
          print('PASS: R21 fresh effective denominator=131 and Stage-02 remains fail-closed')
          PY
      - name: Persist R21 owning-layer materialization and fresh evidence
        run: |
          paths=(
            '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
            '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
            'governance/test/stage02/STAGE02_R20_BOUNDED_MATERIALIZATION_R21_RECEIPT.yaml'
            '.github/stage02-test/STAGE02_R20_EFFECTIVE_REEXECUTION_RESULT_R21.json'
            'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
            'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml'
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'R21 outputs unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'test(stage02): materialize R20 closures and persist fresh R21 evidence'
          git push origin HEAD:rebuild-v2.1.1
