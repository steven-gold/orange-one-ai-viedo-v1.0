name: ACPOS Batch68 Validation A Bidirectional
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch68_validate_a_bidirectional.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate bidirectional contract closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess, zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="44385f43573d4f7c8eca0f5223e03302735cc528"
          WF=Path(".github/workflows/acpos_batch68_validate_a_bidirectional.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift:
              raise SystemExit(f"PREVALIDATION_TREE_DRIFT {drift}")

          target_uids = {
            "SYS-01-BTN-ATTACH",
            "CORE-01-BTN-CANDIDATE-CREATE","CORE-01-FLD-ASSISTANT-SUMMARY","CORE-01-FLD-EVALUATION","CORE-01-FLD-HUMAN-DECISION","CORE-01-FLD-STRUCTURED-DECISION",
            "STR-01-BTN-ATTACH","STR-01-VIEW-CONVERSATION",
            "AIAPI-01-BTN-CONFIGURE-GOVERNED-RESOURCE","AIAPI-01-BTN-APPROVE-GOVERNED-RESOURCE",
            "CORE-01-BTN-SEND","CORE-01-FLD-MESSAGE","STR-01-BTN-SEND","STR-01-BTN-STOP","STR-01-INP-MESSAGE",
            "IAM-01-BTN-AUDIT","SYS-01-BTN-SANDBOX-TEST","SYS-01-BTN-SEND","SYS-01-BTN-STOP",
            "CTRL-ADMIN-STR-01-ACT-03-ACT-NAV-OPEN","CTRL-ADMIN-STR-02-ACT-03-ACT-NAV-OPEN","CTRL-ADMIN-STR-03-ACT-03-ACT-NAV-OPEN",
            "CTRL-ADMIN-STR-04-ACT-02-ACT-NAV-OPEN","CTRL-ADMIN-STR-05-ACT-03-ACT-NAV-OPEN","CTRL-ADMIN-STR-06-ACT-04-ACT-NAV-OPEN",
            "QA-01-BTN-EVIDENCE-IN","QA-01-BTN-EVIDENCE-OUT","QA-01-BTN-FINDING-POINT",
            "KB-01-CTL-CITATION-OPEN","KB-01-CTL-REPLAY-OPEN",
            "CTRL-ADMIN-SG-02-CRITERIA-TABLE-OPEN","CTRL-ADMIN-SG-02-DIMENSION-LIBRARY-OPEN","CTRL-ADMIN-SG-02-THRESHOLDS-OPEN",
            "CTRL-ADMIN-SG-02-DEPARTMENT-MAPPING-OPEN","CTRL-ADMIN-SG-02-REQUIRED-CHECKS-OPEN","CTRL-ADMIN-SG-02-GATE-POLICY-OPEN",
            "CTRL-ADMIN-SG-02-APPROVAL-OPEN","CTRL-ADMIN-SG-02-IMPACT-OPEN","CTRL-ADMIN-SG-02-ACT-03-ACT-NAV-OPEN",
          }
          target_ops = {
            "attachConversationContext","createCoreCandidate","createAssistantSummary","evaluateCoreCandidate","recordCoreHumanDecision",
            "createAssistantStructuredDecision","getConversationAttachmentContext","getStrategicConversationProjection","configureGovernedResource",
            "approveGovernedResource","sendConversationMessage","stopConversationGeneration","getUiProjection","runSandboxTest",
            "setQAEvidenceRangeIn","setQAEvidenceRangeOut","setQAFindingPoint",
          }
          multi_route={"runSandboxTest","setKillSwitch","createCandidate","createChangeRequest"}
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          def txt(el):
              return "".join((x.text or "") for x in el.iter(W+"t")).strip()
          def norm(s):
              return re.sub(r"\s+"," ",s.strip()).lower()
          def pick(d,*needles):
              for k,v in d.items():
                  nk=norm(k)
                  if any(n in nk for n in needles):
                      return v.strip()
              return ""

          docs=sorted(Path(".").glob("*.docx"))
          if len(docs)!=31:
              raise SystemExit(f"DOCX_COUNT_FAIL {len(docs)}")

          exact_rows=[]
          all_text=[]
          for p in docs:
              with zipfile.ZipFile(p) as z:
                  xml=z.read("word/document.xml")
              root=ET.fromstring(xml)
              all_text.append(xml.decode("utf-8","ignore"))
              for tbl in root.iter(W+"tbl"):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if len(trs)<2: continue
                  headers=[txt(c) for c in list(trs[0]) if c.tag==W+"tc"]
                  hnorm=[norm(h) for h in headers]
                  if not any("control uid" in h for h in hnorm): continue
                  if not any(h=="operation" or "operation" in h for h in hnorm): continue
                  if not any("runtime status" in h for h in hnorm): continue
                  for tr in trs[1:]:
                      cells=[txt(c) for c in list(tr) if c.tag==W+"tc"]
                      if not cells: continue
                      row={headers[i]:cells[i] if i<len(cells) else "" for i in range(len(headers))}
                      uid=pick(row,"control uid")
                      op=pick(row,"operation")
                      status=pick(row,"runtime status")
                      action=pick(row,"action uid","action")
                      method=pick(row,"method / path","method/path")
                      owner=pick(row,"runtime owner")
                      if uid or op:
                          exact_rows.append({"doc":p.name,"uid":uid,"op":op,"status":status,"action":action,"method":method,"owner":owner})

          found_uids={r["uid"] for r in exact_rows if r["uid"] in target_uids}
          found_ops={r["op"] for r in exact_rows if r["op"] in target_ops}
          missing_uids=sorted(target_uids-found_uids)
          missing_ops=sorted(target_ops-found_ops)

          relevant=[r for r in exact_rows if r["uid"] in target_uids and r["status"] in {"EFFECTFUL_EXACT","READ_EXACT"}]
          action_map={}
          for r in relevant:
              a,o=r["action"],r["op"]
              if not a or a=="—" or not o or o=="—": continue
              action_map.setdefault(a,set()).add(o)
          conflicts={a:sorted(v) for a,v in action_map.items() if len(v)>1}

          str_noop=[r for r in relevant if r["action"]=="STR-01-ACT-NOOP" and r["op"] not in {"","—"}]
          full="\n".join(all_text)
          stale=full.count("RESOLVE_FROM_CURRENT_CONVERSATION_CORE_DURING_LOGIC_PHASE")
          if "LEGAL_OWNER_SCOPED_LEXICAL_REUSE" not in full:
              raise SystemExit("MULTI_ROUTE_DISPOSITION_MISSING")

          multi_conflicts={}
          for op in multi_route:
              rows=[r for r in exact_rows if r["op"]==op and r["method"] not in {"","—"}]
              by_context={}
              for r in rows:
                  key=(r["doc"],r["uid"],r["action"],r["owner"])
                  by_context.setdefault(key,set()).add(r["method"])
              bad={str(k):sorted(v) for k,v in by_context.items() if len(v)>1}
              if bad: multi_conflicts[op]=bad

          summary={
            "target_uid_count":len(target_uids),"target_uids_found":len(found_uids),"missing_uids":missing_uids,
            "operation_count":len(target_ops),"operations_found":len(found_ops),"missing_ops":missing_ops,
            "active_action_operation_conflicts":conflicts,
            "str_noop_operation_rows":len(str_noop),
            "stale_conversation_placeholder_hits":stale,
            "multi_route_same_context_conflicts":multi_conflicts,
          }
          print("BATCH68_VALIDATION_A_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if missing_uids or missing_ops or conflicts or str_noop or stale or multi_conflicts:
              raise SystemExit("BATCH68_VALIDATION_A_FAIL")
          print("BATCH68_VALIDATION_A_PASS")
          PY
      - name: Persist exact tested tree by removing harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-batch68-validate-a"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch68_validate_a_bidirectional.yml" ]; then
            printf '%s\n' "${staged[@]}"
            exit 1
          fi
          git commit -m "chore(acpos): close Batch68 validation A harness"
          git push origin HEAD:0921acpos
