authority:
  id: ACPOS_STR-01_FINAL_LOCKED_ENCODING
  page_uid: workspace:STR-01
  control_prefix: STR-01
  page_name_zh: 戰略中心工作區
  page_name_en: Strategic Center Workspace
  surface: WORKSPACE
  status: FINAL_LOCKED
  current_only: true
  single_page_workspace: true
  single_machine_authority: true
  parallel_strategy_page: FORBIDDEN
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  real_data_only: true
  missing_value_display: —
  ai_role: Strategic Intelligence Assistant
  purpose: 企業策略情報整理、趨勢分析、方案比較、風險評估、資源建議與人工決策輔助。
  hard_boundary: AI provides analysis/proposals only. Formal strategy decision is human-governed. Finance / Workflow / Governance / Production execution remains
    in its owning module.
  provider_adapter_binding_revision: 2026-08-28-STRATEGIC-TEXT-CHAT-PROVIDER-BINDING
  provider_adapter_authority_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.2
strategic_context_contract:
  source_types:
  - 市場情報
  - 產業資料
  - 競爭資訊
  - 企業內部資料
  - 資源能力
  - 成本資訊
  - 風險資訊
  - Governance 條件
  priority:
  - P0 Current Human Instruction
  - P1 Confirmed Decision
  - P2 Current Valid Internal Data
  - P3 Historical Strategic Analysis / Baseline / Experience
  - P4 External Intelligence
  required_metadata:
  - source_ref
  - source_type
  - source_time_or_version
  - scope
  - confidence_or_quality_state
  rules:
  - External intelligence cannot overwrite confirmed decisions/current governed internal truth.
  - Context must expose source and confidence/quality state.
  - Missing source/financial/resource/risk values are never AI-filled.
  - Strategic Context is analysis input, not a formal decision by itself.
conversation_contract:
  shared_core: ACPOS AI Conversation Core
  strategy_context_extension: STRATEGIC_CENTER_EXTENSION
  modes:
  - SINGLE_AI
  - MULTI_AI
  multi_ai_semantics: Same question + same Strategic Context -> multiple independent complete viewpoints; Assistant synthesizes after responses.
  assistant_fixed: true
  assistant_is_mode: false
  provider_picker: FORBIDDEN
  provider_display: Provider brand only on response; full technical model/capability data belongs to API Management.
  input_support:
  - Traditional Chinese instruction
  - file attachment
  - image reference
  - '@Strategy'
  - '@Alert'
  - '@Knowledge'
  - '@Decision'
  - quoted message / response ref
  generation_rule: Raw AI response never becomes a formal strategy decision automatically.
  visible_record:
  - User instruction
  - AI viewpoints
  - Assistant summary
  - analysis basis
  - assumptions
  - risks
  - uncertainty
  - human decision record
strategy_analysis_contract:
  flow:
  - 資料收集
  - 分類整理
  - Pattern / Baseline 分析
  - 趨勢 / Forecast 判斷
  - Strategic Need / Opportunity / Risk / Priority
  - 方案比較
  - 策略建議
  - Human Review
  mandatory_output_fields:
  - analysis_basis
  - assumptions
  - opportunities
  - risks
  - uncertainties
  - option_comparison
  - recommendation_reason
  - evidence_refs
  option_comparison_fields:
  - candidate_id
  - option_title
  - expected_benefit
  - cost_or_resource_impact
  - risk
  - time_horizon
  - dependency
  - evidence
  - uncertainty
  - AI_recommendation_state
  rule: No strategy recommendation may hide its assumptions, risk or uncertainty.
strategy_output_contract:
  types:
    STRATEGY_RECOMMENDATION:
      label: Strategy Recommendation / 策略建議
      required:
      - summary
      - basis
      - recommended_path
      - reason
      - risk
      - uncertainty
      - evidence_refs
    STRATEGY_ALERT:
      label: Strategy Alert / 風險與機會提醒
      required:
      - alert_type
      - scope
      - reason
      - evidence_refs
      - urgency_or_priority_state
      - recommended_response
    RESOURCE_PROPOSAL:
      label: Resource Proposal / 資源配置建議
      required:
      - target
      - resource_need
      - reason
      - expected_effect
      - cost_or_capacity_impact
      - risk
      - dependency
      boundary: Proposal only; actual budget/resource approval belongs to Finance/Workflow/Governance owner.
    DECISION_BRIEF:
      label: Decision Brief / 決策摘要
      required:
      - issue
      - context
      - candidate_options
      - recommended_option
      - rejected_or_less_preferred_options
      - key_risks
      - unknowns
      - decision_needed
  version_rule: Generated strategic outputs/candidates are append-only; revision creates a new version and preserves prior versions.
decision_ledger_contract:
  required_fields:
  - decision_id
  - strategy_topic_id
  - strategy_candidate_ref
  - proposal_summary
  - analysis_source_refs
  - risk_assessment
  - approval_level
  - decision_result
  - decision_reason
  - decided_by
  - decided_at
  - execution_status
  - execution_ref
  - audit_ref
  separation_rule: Strategy recommendation/candidate is not the formal Decision Ledger result.
  human_gate: true
  page_owned_registered_actions:
  - submitStrategyReview
  - adoptAsContextCandidate
  cross_module_decisions:
    budget_reallocation: A10 ERP & Finance
    production_priority_or_pause_resume_cancel: A04 Workflow & Runtime
    account/channel_governance: A08 Governance / Project owner
    production_execution: Core / Department Workflow
  cross_module_rule: STR-01 may show proposal/readiness/status and navigate to owner; it does not duplicate owner-module approval/execution action.
strategic_memory_contract:
  stores:
  - Strategy Pattern
  - Strategy Case
  - Historical Strategy
  - Execution Result
  - Success Case
  - Failure Case
  - Experiment Record
  - Baseline History
  - KPI Change
  - Expected vs Actual
  - Learning Result
  version_rule: History is versioned and never overwritten.
  knowledge_boundary: Conversation alone is not validated knowledge; execution/performance feedback and review feed Strategic Experience / Knowledge.
feedback_loop_contract:
  flow:
  - Approved/Adopted Strategy Context
  - Owner Module Execution
  - Execution Result
  - Performance / Revenue / Cost / KPI
  - Expected vs Actual
  - Difference Analysis
  - Learning
  - Strategic Experience Update
  - Next Strategy Analysis
  page_role: Display feedback and strategic learning; do not execute downstream owner actions.
layout:
  desktop_min_width: 1280px
  vertical_scroll: Main Workspace height:auto; overflow-y:auto; independent from Global Sidebar/Menu height
  below_min_width: Keep min-width=1280px; allow horizontal scroll; no alternate unregistered mobile workflow
  context_bar:
    height: 56px
    width: 100%
  primary_grid:
    columns: minmax(280px,1fr) minmax(720px,3fr) minmax(320px,1.12fr)
    approx: 19% / 59% / 22%
    gap: 16px
    align: start
  left_rail:
    min_width: 280px
    role: Strategy topics / Context Sources / Alerts / Memory quick access
  center:
    min_width: 720px
    role: Strategic AI Conversation + Analysis / Option Comparison
    priority: highest
  right_rail:
    min_width: 320px
    role: Strategy Outputs / Human Review / Decision Ledger state
  lower_rows: Option comparison, Decision Ledger, Strategic Memory, Feedback Loop and Audit extend downward
  tokens:
    control_height: 40px
    button_min_width: 88px
    primary_button_min_width: 120px
    button_radius: 10px
    panel_radius: 12px
    large_container_radius: 24px
    section_gap: 16px
    content_padding: 16px
    status_badge_height: 28px
    action_gap: 8px
    touch_target_min: 44px × 44px
  visual_override: FORBIDDEN; inherit Global Visual tokens only
registries:
  sections:
  - section_uid: STR-01-SEC-01
    name: Strategy Context Bar
    responsibility: Strategy Topic, scope, horizon, mode, state, current decision status
    visual_uid: STR-01-VIS-CONTEXT
  - section_uid: STR-01-SEC-02
    name: Strategy Topics / History
    responsibility: Strategy topic list, search, current topic selection, previous discussions
    visual_uid: STR-01-VIS-LEFT-TOPIC
  - section_uid: STR-01-SEC-03
    name: Strategic Context
    responsibility: Market/industry/competition/internal/resource/cost/risk/governance sources and confidence
    visual_uid: STR-01-VIS-LEFT-CONTEXT
  - section_uid: STR-01-SEC-04
    name: Strategic Alerts / Open Questions
    responsibility: Relevant opportunity/risk alerts and missing-information questions
    visual_uid: STR-01-VIS-LEFT-ALERT
  - section_uid: STR-01-SEC-05
    name: Strategic AI Conversation
    responsibility: Single/Multi AI conversation, attachment/image/reference, assistant summary
    visual_uid: STR-01-VIS-CONVERSATION
  - section_uid: STR-01-SEC-06
    name: Strategy Analysis
    responsibility: Basis, assumptions, opportunity, risk, uncertainty, pattern/baseline/forecast
    visual_uid: STR-01-VIS-ANALYSIS
  - section_uid: STR-01-SEC-07
    name: Option Comparison
    responsibility: Compare strategy candidates/options without deleting prior versions
    visual_uid: STR-01-VIS-COMPARE
  - section_uid: STR-01-SEC-08
    name: Strategy Outputs
    responsibility: Recommendation, Alert, Resource Proposal, Decision Brief
    visual_uid: STR-01-VIS-RIGHT-OUTPUT
  - section_uid: STR-01-SEC-09
    name: Human Review / Decision Ledger
    responsibility: Review status, candidate status, human decision record, execution status
    visual_uid: STR-01-VIS-RIGHT-DECISION
  - section_uid: STR-01-SEC-10
    name: Strategic Memory / Experience
    responsibility: Patterns, cases, experiments, baselines, KPI changes and learning
    visual_uid: STR-01-VIS-MEMORY
  - section_uid: STR-01-SEC-11
    name: Feedback Loop
    responsibility: Expected vs Actual, difference, learning, owner execution feedback
    visual_uid: STR-01-VIS-FEEDBACK
  - section_uid: STR-01-SEC-12
    name: Audit / Boundary
    responsibility: Source trace, provider brand, correlation, permission, owner handoff boundary
    visual_uid: STR-01-VIS-STATUS
  visuals:
  - visual_uid: STR-01-VIS-CONTEXT
    geometry: top full width; h>=56px
  - visual_uid: STR-01-VIS-LEFT-TOPIC
    geometry: primary left upper; ~19%; min 280px
  - visual_uid: STR-01-VIS-LEFT-CONTEXT
    geometry: primary left middle; ~19%; min 280px
  - visual_uid: STR-01-VIS-LEFT-ALERT
    geometry: primary left lower; ~19%; min 280px
  - visual_uid: STR-01-VIS-CONVERSATION
    geometry: primary center upper; ~59%; min 720px; dominant
  - visual_uid: STR-01-VIS-ANALYSIS
    geometry: center lower; collapsible/stacked strategic analysis
  - visual_uid: STR-01-VIS-COMPARE
    geometry: lower full-width comparison table/cards
  - visual_uid: STR-01-VIS-RIGHT-OUTPUT
    geometry: primary right upper; ~22%; min 320px
  - visual_uid: STR-01-VIS-RIGHT-DECISION
    geometry: primary right lower; ~22%; min 320px
  - visual_uid: STR-01-VIS-MEMORY
    geometry: lower full-width/2-column memory region
  - visual_uid: STR-01-VIS-FEEDBACK
    geometry: lower full-width/2-column feedback region
  - visual_uid: STR-01-VIS-STATUS
    geometry: bottom full-width audit/boundary strip
  components:
  - component_uid: STR-01-CMP-CONTEXT
    section_uid: STR-01-SEC-01
    name: Strategic Context Bar
  - component_uid: STR-01-CMP-TOPICS
    section_uid: STR-01-SEC-02
    name: Strategy Topic List / History
  - component_uid: STR-01-CMP-SOURCE-STACK
    section_uid: STR-01-SEC-03
    name: Strategic Context Source Stack
  - component_uid: STR-01-CMP-ALERTS
    section_uid: STR-01-SEC-04
    name: Strategy Alerts / Open Questions
  - component_uid: STR-01-CMP-CONVERSATION
    section_uid: STR-01-SEC-05
    name: AI Conversation Workspace
  - component_uid: STR-01-CMP-MODE
    section_uid: STR-01-SEC-05
    name: Single / Multi AI Mode
  - component_uid: STR-01-CMP-COMPOSER
    section_uid: STR-01-SEC-05
    name: Conversation Composer
  - component_uid: STR-01-CMP-ASSISTANT
    section_uid: STR-01-SEC-05
    name: Assistant Summary / Meeting Record
  - component_uid: STR-01-CMP-ANALYSIS
    section_uid: STR-01-SEC-06
    name: Strategy Analysis Result
  - component_uid: STR-01-CMP-COMPARE
    section_uid: STR-01-SEC-07
    name: Option Comparison
  - component_uid: STR-01-CMP-OUTPUTS
    section_uid: STR-01-SEC-08
    name: Strategic Output Cards
  - component_uid: STR-01-CMP-REVIEW
    section_uid: STR-01-SEC-09
    name: Human Review
  - component_uid: STR-01-CMP-LEDGER
    section_uid: STR-01-SEC-09
    name: Decision Ledger
  - component_uid: STR-01-CMP-MEMORY
    section_uid: STR-01-SEC-10
    name: Strategic Memory / Experience
  - component_uid: STR-01-CMP-FEEDBACK
    section_uid: STR-01-SEC-11
    name: Expected vs Actual / Learning
  - component_uid: STR-01-CMP-STATUS
    section_uid: STR-01-SEC-12
    name: Audit / Boundary / Handoff Status
  permissions:
  - permission_uid: STR_VIEW
    backend_scope: strategy.read
    purpose: Read Strategic Center projection/context/output/decision/memory
  - permission_uid: STR_CONVERSATION
    backend_scope: conversation.write
    purpose: Send Strategic Center conversation message
  - permission_uid: STR_COMPARE
    backend_scope: candidate.read
    purpose: Compare strategy candidates/options
  - permission_uid: STR_REVIEW
    backend_scope: strategy.decision.propose
    purpose: Submit strategy candidate for human review
  - permission_uid: STR_ADOPT
    backend_scope: strategy.decision.approve
    purpose: Adopt reviewed strategy candidate as governed context
  gates:
  - gate_uid: STR-01-GATE-PAGE
    condition: explicit Account Permission Assignment + scope + condition + audit
  - gate_uid: STR-01-GATE-TOPIC
    condition: exact Strategy Topic / discussion context is selected and active
  - gate_uid: STR-01-GATE-CONTEXT
    condition: Strategic Context sources have exact refs/version/time + authorization + confidence/quality state
  - gate_uid: STR-01-GATE-MESSAGE
    condition: active conversation + strategy topic + context ready + non-empty message + conversation.write
  - gate_uid: STR-01-GATE-MULTI
    condition: mode=MULTI_AI + assigned AI route/group available from shared ACPOS Router; no manual Provider/Model picker
  - gate_uid: STR-01-GATE-ANALYSIS
    condition: AI response(s) + Assistant Summary + source/evidence refs available
  - gate_uid: STR-01-GATE-COMPARE
    condition: at least 2 exact strategy candidate refs/version refs available
  - gate_uid: STR-01-GATE-REVIEW
    condition: exact Strategy Candidate state=CANDIDATE + analysis basis/risk/uncertainty/evidence + expected version + strategy.decision.propose
  - gate_uid: STR-01-GATE-ADOPT
    condition: exact Strategy Candidate state=REVIEW_REQUIRED + human review decision/reason + evidence refs + strategy.decision.approve
  - gate_uid: STR-01-GATE-MEMORY
    condition: authorized strategic memory/experience projection available
  - gate_uid: STR-01-GATE-FEEDBACK
    condition: execution/performance result refs available; read-only in STR-01
  errors:
  - error_uid: STR-01-ERR-CONTEXT-001
    context: Strategic Context source/ref/time/version unavailable or stale
    recovery: BLOCK dependent analysis; show exact missing source; do not AI-fill
  - error_uid: STR-01-ERR-CONVERSATION-001
    context: Conversation/session/message/attachment/mode invalid
    recovery: Preserve topic/context; show registered error/retry eligibility
  - error_uid: STR-01-ERR-CANDIDATE-001
    context: Strategy candidate/version/evidence invalid or stale
    recovery: BLOCK compare/review/adoption
  - error_uid: STR-01-ERR-REVIEW-001
    context: Review prerequisites/permission/expected version invalid
    recovery: BLOCK submit review; preserve candidate
  - error_uid: STR-01-ERR-ADOPT-001
    context: Adoption prerequisites/human decision/evidence/version invalid
    recovery: BLOCK adoption; no auto-approval
  - error_uid: STR-01-ERR-MEMORY-001
    context: Strategic Memory/Experience projection unavailable
    recovery: Show unavailable state; do not substitute unvalidated conversation
  - error_uid: STR-01-ERR-FEEDBACK-001
    context: Execution result / KPI / Expected-vs-Actual refs missing
    recovery: Show pending/incomplete feedback; do not fabricate performance
  - error_uid: STR-01-ERR-PERM-001
    context: Permission/scope denied
    recovery: Hide/disable according to actual server result
  - error_uid: STR-01-ERR-UNDEFINED-001
    context: Unlisted Section/Component/Control/Action/Gate/Permission/Port requested
    recovery: BLOCK + REPORT_AUTHORITY_GAP
  page_states:
  - state_uid: STR-01-ST-EMPTY
    display: EMPTY
    definition: No Strategy Topic/discussion selected
  - state_uid: STR-01-ST-READY
    display: READY
    definition: Strategy Topic + context ready
  - state_uid: STR-01-ST-RESPONDING
    display: RESPONDING
    definition: Single/Multi AI response active
  - state_uid: STR-01-ST-ANALYZING
    display: ANALYZING
    definition: Assistant synthesis / strategy analysis active
  - state_uid: STR-01-ST-CANDIDATE
    display: CANDIDATE_READY
    definition: Strategy candidate/output ready
  - state_uid: STR-01-ST-REVIEW
    display: REVIEW_REQUIRED
    definition: Human strategy review required
  - state_uid: STR-01-ST-ADOPTED
    display: ADOPTED_CONTEXT
    definition: Human-reviewed strategy context adopted; owner execution still separate
  - state_uid: STR-01-ST-FEEDBACK
    display: FEEDBACK_AVAILABLE
    definition: Execution/performance feedback available
  - state_uid: STR-01-ST-ERROR
    display: ERROR/BLOCKED
    definition: Real permission/context/runtime/error blocker
  stages:
  - stage_uid: STR-01-STAGE-01-CONTEXT
    name: Resolve Strategic Context
    flow: Topic + sources + confirmed decisions + current internal data + historical experience + external intelligence
  - stage_uid: STR-01-STAGE-02-CONVERSE
    name: Strategic Conversation
    flow: Single/Multi AI same issue/context -> independent views -> Assistant record
  - stage_uid: STR-01-STAGE-03-ANALYZE
    name: Analyze / Compare
    flow: Pattern/Baseline/Forecast -> Need/Opportunity/Risk/Priority -> Option comparison
  - stage_uid: STR-01-STAGE-04-OUTPUT
    name: Strategic Outputs
    flow: Recommendation / Alert / Resource Proposal / Decision Brief candidate outputs
  - stage_uid: STR-01-STAGE-05-HUMAN
    name: Human Review / Decision
    flow: Submit strategy review -> human decision -> governed strategy context adoption when approved
  - stage_uid: STR-01-STAGE-06-FEEDBACK
    name: Execution Feedback / Learning
    flow: Owner execution result -> Expected vs Actual -> Learning -> Strategic Experience
  actions:
  - action_uid: STR-01-ACT-NOOP
    label: Read display
    permission_uid: STR_VIEW
    gate_uid: STR-01-GATE-PAGE
    effect_type: READ_ONLY
    owner: STR-01 / shared registered service
    success_contract: Render real authorized strategic projection only
    error_uid: STR-01-ERR-CONTEXT-001
    operation: null
    method_path: null
    state_event: NONE
  - action_uid: STR-01-ACT-TOPIC-SELECT
    label: Select Strategy Topic
    permission_uid: STR_VIEW
    gate_uid: STR-01-GATE-PAGE
    effect_type: CONTEXT_STATE
    owner: STR-01 / shared registered service
    success_contract: Load exact strategy topic/discussion and clear stale dependent state
    error_uid: STR-01-ERR-CONTEXT-001
    operation: null
    method_path: null
    state_event: NONE
  - action_uid: STR-01-ACT-FILTER
    label: Filter current strategic projection
    permission_uid: STR_VIEW
    gate_uid: STR-01-GATE-PAGE
    effect_type: UI_ONLY
    owner: STR-01 / shared registered service
    success_contract: Filter topic/context/ledger/memory view only
    error_uid: STR-01-ERR-CONTEXT-001
    operation: null
    method_path: null
    state_event: NONE
  - action_uid: STR-01-ACT-MODE
    label: Single / Multi AI mode
    permission_uid: STR_VIEW
    gate_uid: STR-01-GATE-TOPIC
    effect_type: UI_ONLY
    owner: STR-01 / shared registered service
    success_contract: Switch conversation mode; Provider/Model remain router-owned
    error_uid: STR-01-ERR-CONVERSATION-001
    operation: null
    method_path: null
    state_event: NONE
  - action_uid: STR-01-ACT-SEND
    label: Send Strategic Message
    permission_uid: STR_CONVERSATION
    gate_uid: STR-01-GATE-MESSAGE
    effect_type: CONVERSATION_WRITE
    owner: STR-01 / shared registered service
    success_contract: Send message to shared AI Conversation Core; raw response is not formal strategy decision
    error_uid: STR-01-ERR-CONVERSATION-001
    operation: sendConversationMessage
    method_path: POST /v1/conversations/{conversationId}/messages
    state_event: conversation.message.sent
  - action_uid: STR-01-ACT-STOP
    label: Stop Current Generation
    permission_uid: STR_CONVERSATION
    gate_uid: STR-01-GATE-MESSAGE
    effect_type: CONVERSATION_CONTROL
    owner: STR-01 / shared registered service
    success_contract: Stop active conversation generation only
    error_uid: STR-01-ERR-CONVERSATION-001
    operation: stopConversationGeneration
    method_path: POST /v1/conversations/{conversationId}/generation/stop
    state_event: NONE
  - action_uid: STR-01-ACT-COMPARE
    label: Compare Strategy Candidates
    permission_uid: STR_COMPARE
    gate_uid: STR-01-GATE-COMPARE
    effect_type: READ_MODEL_QUERY
    owner: STR-01 / shared registered service
    success_contract: Compare exact candidate refs without mutation/deletion
    error_uid: STR-01-ERR-CANDIDATE-001
    operation: compareCandidates
    method_path: GET /v1/candidates/compare
    state_event: READ_ONLY
  - action_uid: STR-01-ACT-REVIEW
    label: Submit Strategy Review
    permission_uid: STR_REVIEW
    gate_uid: STR-01-GATE-REVIEW
    effect_type: STRATEGY_REVIEW_REQUEST
    owner: STR-01 / shared registered service
    success_contract: Move exact StrategyCandidate CANDIDATE -> REVIEW_REQUIRED; human review required
    error_uid: STR-01-ERR-REVIEW-001
    operation: submitStrategyReview
    method_path: POST /v1/state-commands/strategycandidate/submitstrategyreview
    state_event: ai.strategy.review_requested
  - action_uid: STR-01-ACT-ADOPT
    label: Adopt Reviewed Strategy Context
    permission_uid: STR_ADOPT
    gate_uid: STR-01-GATE-ADOPT
    effect_type: STRATEGY_CONTEXT_ADOPTION
    owner: STR-01 / shared registered service
    success_contract: Move exact reviewed StrategyCandidate REVIEW_REQUIRED -> ADOPTED; does not execute Finance/Workflow/Production
    error_uid: STR-01-ERR-ADOPT-001
    operation: adoptAsContextCandidate
    method_path: POST /v1/state-commands/strategycandidate/adoptascontextcandidate
    state_event: ai.strategy.context_adopted
  - action_uid: STR-01-ACT-OPEN-OWNER
    label: Open Execution Owner Module
    permission_uid: STR_VIEW
    gate_uid: STR-01-GATE-PAGE
    effect_type: UI_NAVIGATION
    owner: STR-01 / shared registered service
    success_contract: Navigate to actual owner module for budget/workflow/governance/production action; no duplicate execution
    error_uid: STR-01-ERR-PERM-001
    operation: null
    method_path: null
    state_event: NONE
  - action_uid: STR-01-ACT-AUDIT
    label: Open Audit / Trace
    permission_uid: STR_VIEW
    gate_uid: STR-01-GATE-PAGE
    effect_type: UI_ONLY
    owner: STR-01 / shared registered service
    success_contract: Open inherited audit/trace drawer
    error_uid: STR-01-ERR-PERM-001
    operation: null
    method_path: null
    state_event: NONE
  objects_refs:
  - object_uid: STR-01-OBJ-TOPIC
    entity: StrategyTopicRef
    owner: Strategic Center
    required_content: strategy_topic_id + title + scope + objective + status + conversation/thread refs
  - object_uid: STR-01-OBJ-CONTEXT
    entity: StrategicContextBundle
    owner: Strategy Context / Intelligence
    required_content: market/industry/competition/internal/resource/cost/risk/governance refs + priority + source_time/version + confidence
  - object_uid: STR-01-OBJ-CONVERSATION
    entity: StrategicConversationRef
    owner: ACPOS AI Conversation Core
    required_content: conversation_id + topic ref + mode + message refs + context fingerprint + audit
  - object_uid: STR-01-OBJ-ANALYSIS
    entity: StrategyAnalysisResult
    owner: Strategic Intelligence
    required_content: basis + assumptions + opportunity + risk + uncertainty + pattern/baseline/forecast + evidence
  - object_uid: STR-01-OBJ-CANDIDATE
    entity: StrategyCandidate
    owner: Strategic Intelligence
    required_content: candidate_id/version + output type + proposal + analysis refs + risk + uncertainty + evidence + state
  - object_uid: STR-01-OBJ-RECOMMENDATION
    entity: StrategyRecommendation
    owner: Strategic Intelligence
    required_content: summary + basis + recommended path + reason + risk + uncertainty + evidence
  - object_uid: STR-01-OBJ-ALERT
    entity: StrategyAlert
    owner: Strategic Intelligence
    required_content: alert type + scope + reason + evidence + urgency/priority + recommended response
  - object_uid: STR-01-OBJ-RESOURCE
    entity: ResourceProposal
    owner: Strategic Intelligence
    required_content: target + need + reason + expected effect + cost/capacity impact + risk + dependency
