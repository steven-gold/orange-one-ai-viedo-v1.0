name: Scope Stage Reentry Promotion Sync Repair

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/repair_scope_stage_reentry_promotion_sync.py'

permissions:
  contents: write

jobs:
  repair-promotion-sync:
    if: "${{ github.event.head_commit.message == 'chore(governance): stage atomic promotion sync repair helper' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Assert exact authorization and Current governance
        shell: bash
        run: |
          set -euo pipefail
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-MOTHER-PROMOTION-ATOMIC-SYNC-REPAIR-R2.yaml
          grep -q 'GOV-REV-20260919-SCOPE-STAGE-REENTRY-PORTABILITY-HARDENING' governance/specifications/REGISTRY.yaml
          test -f .github/governance-maintenance/repair_scope_stage_reentry_promotion_sync.py
      - name: Static compile repair helper
        run: python -m py_compile .github/governance-maintenance/repair_scope_stage_reentry_promotion_sync.py
      - name: Repair all promotion-derived consumers atomically
        run: python .github/governance-maintenance/repair_scope_stage_reentry_promotion_sync.py
      - name: Validate transaction hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d governance/test/temporary
          git status --short
      - name: Persist atomic promotion synchronization repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "fix(governance): complete scope-stage-reentry promotion synchronization" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260919-MOTHER-PROMOTION-ATOMIC-SYNC-REPAIR-R2" \
            -m "Spec-Change-Scope: PROMOTION_DERIVED_CONSUMER_ATOMIC_SYNC_REPAIR"
          git push origin HEAD:rebuild-v2.1.1
