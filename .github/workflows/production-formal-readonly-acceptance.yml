name: ACPOS Production Formal Readonly Acceptance

on:
  workflow_dispatch:
    inputs:
      route_decision_id:
        description: Existing Production provider route decision ID used only for GET readback acceptance
        required: true
        type: string

permissions:
  contents: read

jobs:
  formal-readonly:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_ACCEPTANCE_ROUTE_DECISION_ID: ${{ inputs.route_decision_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate formal readonly acceptance syntax
        run: node --check scripts/production-formal-readonly-acceptance.mjs
      - name: Run four exact formal Production read-only adapters
        run: node scripts/production-formal-readonly-acceptance.mjs
