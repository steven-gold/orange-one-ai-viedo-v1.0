function gateState(s:TestState){const candidate=Boolean(s.output_version_id),wait=s.page_state==='WAIT_CONFIRMATION',correction=wait||s.page_state==='CORRECTION_REQUIRED',layer=candidate&&!s.locked,patch=Boolean(s.patch_id);return{
