name: Current Authority Pollution Audit
on:
  push:
    branches: [current-authority-pollution-cleanup]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Current-only pollution inventory
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const pages={
            'WB-01':'authority/pages/workspace/WB-01/ACPOS_WB-01_FINAL_LOCKED_ENCODING.yaml',
            'CORE-01':'authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml',
            'ASSET-01':'authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml',
            'VIDEO-01':'authority/pages/workspace/VIDEO-01/VIDEO_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml',
            'EDIT-01':'authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml',
            'QA-01':'authority/pages/workspace/QA-01/ACPOS_QA-01_FINAL_LOCKED_ENCODING_DEDUP_CLEAN.yaml',
            'DB-01':'authority/pages/admin/DB-01/ACPOS_DB-01_FINAL_LOCKED_ENCODING.yaml'
          };
          const authority=Object.fromEntries(Object.entries(pages).map(([k,p])=>[k,fs.readFileSync(p,'utf8')]));
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const files=walk('src').filter(f=>/\.(ts|tsx|css)$/.test(f));
          const prefixes=Object.keys(pages);
          const old=/\b(R9(?:\.\d+)?|mother\s*file|motherfile|legacy|obsolete|deprecated|old[_ -](?:authority|spec|page|flow|payload))\b/ig;
          const tokenRe=/(?:WB|CORE|ASSET|VIDEO|EDIT|QA|DB)-01-[A-Z0-9][A-Z0-9_-]*/g;
          let totalMissing=0,totalCross=0,totalOld=0,totalRoutes=0;
          for(const prefix of prefixes){
            const owned=[];
            const missing=[];
            const cross=[];
            const olds=[];
            const routes=[];
            for(const f of files){
              const text=fs.readFileSync(f,'utf8');
              const tokens=[...new Set(text.match(tokenRe)||[])];
              const own=tokens.filter(t=>t.startsWith(prefix+'-'));
              if(!own.length)continue;
              owned.push(f);
              for(const t of own)if(!authority[prefix].includes(t))missing.push(`${f} :: ${t}`);
              for(const t of tokens)if(!t.startsWith(prefix+'-'))cross.push(`${f} :: ${t}`);
              for(const m of text.matchAll(old))olds.push(`${f} :: ${m[0]}`);
              for(const m of text.matchAll(/["'`](\/v1\/[A-Za-z0-9_./%:{}\[\]-]+)["'`]/g)){
                const route=m[1];
                const normalized=route.replace(/%3A/ig,':');
                if(!authority[prefix].includes(route)&&!authority[prefix].includes(normalized))routes.push(`${f} :: ${route}`);
              }
            }
            const uniq=a=>[...new Set(a)].sort();
            const um=uniq(missing),uc=uniq(cross),uo=uniq(olds),ur=uniq(routes);
            totalMissing+=um.length;totalCross+=uc.length;totalOld+=uo.length;totalRoutes+=ur.length;
            console.log(`PAGE_AUDIT ${prefix} owned_files=${new Set(owned).size} own_token_missing=${um.length} cross_page_tokens=${uc.length} old_source_terms=${uo.length} unconfirmed_routes=${ur.length}`);
            for(const [label,list] of [['MISSING_CURRENT_TOKEN',um],['CROSS_PAGE_TOKEN',uc],['OLD_SOURCE_TERM',uo],['UNCONFIRMED_ROUTE',ur]]) for(const x of list)console.log(`${label} ${prefix} ${x}`);
          }
          console.log(`CURRENT_ONLY_POLLUTION_INVENTORY_PASS pages=7 missing_tokens=${totalMissing} cross_tokens=${totalCross} old_terms=${totalOld} unconfirmed_routes=${totalRoutes}`);
          console.log('NOTE=CANDIDATES_REQUIRE_CURRENT_AUTHORITY_CLASSIFICATION_BEFORE_EDIT');
          NODE
