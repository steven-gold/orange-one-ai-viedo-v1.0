name: Sync all validated pages to original preview
on:
  push:
    paths:
      - '.github/workflows/sync-all-completed-preview-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate current source
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Start production server
        run: |
          (npm run start -- -p 3000 > /tmp/acpos-next.log 2>&1 & echo $! > /tmp/acpos-next.pid)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/acpos-next.log
          exit 1
      - name: Materialize all 18 canonical pages
        run: |
          rm -rf /tmp/materialized
          mkdir -p /tmp/materialized
          python - <<'PY'
          import subprocess
          routes = {
            '/':'index.html',
            '/core':'core.html',
            '/assets':'assets.html',
            '/video':'video.html',
            '/edit':'edit.html',
            '/qa':'qa.html',
            '/database':'db.html',
            '/strategy':'strategy.html',
            '/info':'info.html',
            '/admin/system':'system.html',
            '/admin/accounts':'accounts.html',
            '/admin/dev':'dev.html',
            '/admin/social':'social.html',
            '/admin/erp':'erp.html',
            '/admin/aiapi':'aiapi.html',
            '/admin/qa-criteria':'qa-criteria.html',
            '/admin/strategy':'strategy-admin.html',
            '/admin/knowledge':'knowledge-admin.html',
          }
          for route,name in routes.items():
            data=subprocess.check_output(['curl','-fsS','http://127.0.0.1:3000'+route], text=True)
            open('/tmp/materialized/'+name,'w').write(data)
          PY
      - name: Rewrite only static preview paths and canonical navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          nav = {
            '/':'index.html',
            '/core':'core.html',
            '/assets':'assets.html',
            '/video':'video.html',
            '/edit':'edit.html',
            '/qa':'qa.html',
            '/database':'db.html',
            '/strategy':'strategy.html',
            '/info':'info.html',
            '/admin/system':'system.html',
            '/admin/accounts':'accounts.html',
            '/admin/dev':'dev.html',
            '/admin/social':'social.html',
            '/admin/erp':'erp.html',
            '/admin/aiapi':'aiapi.html',
            '/admin/qa-criteria':'qa-criteria.html',
            '/admin/strategy':'strategy-admin.html',
            '/admin/knowledge':'knowledge-admin.html',
          }
          # Longest paths first so '/' is only replaced as an exact href.
          ordered=sorted(nav.items(), key=lambda x: len(x[0]), reverse=True)
          for p in Path('/tmp/materialized').glob('*.html'):
            s=p.read_text()
            s=s.replace('href="/_next/','href="_next/').replace('src="/_next/','src="_next/')
            s=s.replace('href="/brand/','href="brand/').replace('src="/brand/','src="brand/')
            for route,target in ordered:
              s=s.replace(f'href="{route}"', f'href="{target}"')
            p.write_text(s)
          PY
      - name: Validate page identities and preview navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          expected={
            'index.html':'workspace:WB-01','core.html':'CORE-01','assets.html':'ASSET-01','video.html':'VIDEO-01','edit.html':'EDIT-01','qa.html':'QA-01',
            'db.html':'admin:DB-01','strategy.html':'workspace:STR-01','info.html':'workspace:INFO-01','system.html':'admin:SYS-01','accounts.html':'admin:IAM-01',
            'dev.html':'admin:DEV-01','social.html':'admin:SOC-01','erp.html':'admin:ERP-01','aiapi.html':'admin:AIAPI-01','qa-criteria.html':'admin:SG-02',
            'strategy-admin.html':'admin:STR-01','knowledge-admin.html':'admin:KB-01',
          }
          root=Path('/tmp/materialized')
          assert len(list(root.glob('*.html')))==18
          for name,uid in expected.items():
            s=(root/name).read_text()
            assert f'data-page-uid="{uid}"' in s, (name,uid)
            assert 'href="/_next/' not in s and 'src="/_next/' not in s, name
            assert 'href="/core"' not in s and 'href="/admin/system"' not in s, name
            assert 'wb01-preview-runtime' not in s and 'acpos-preview-drawer' not in s, name
          # Current STR admin test wiring must be included in this synchronization.
          strategy=(root/'strategy-admin.html').read_text()
          assert 'data-runtime-state=' in strategy
          assert 'AUTHORITY_BINDING_UNRESOLVED' in strategy
          # Current SG-02 governance wiring must also be present.
          criteria=(root/'qa-criteria.html').read_text()
          assert 'configureGovernedResource' in criteria
          assert 'approveGovernedResource' in criteria
          PY
      - name: Update original acpos-live-preview branch without replacing its identity
        run: |
          git fetch origin acpos-live-preview
          git worktree add -B acpos-live-preview /tmp/acpos-preview origin/acpos-live-preview
          mkdir -p /tmp/acpos-preview/preview
          find /tmp/acpos-preview/preview -maxdepth 1 -type f -name '*.html' -delete
          cp /tmp/materialized/*.html /tmp/acpos-preview/preview/
          rm -rf /tmp/acpos-preview/preview/_next
          mkdir -p /tmp/acpos-preview/preview/_next
          cp -R .next/static /tmp/acpos-preview/preview/_next/static
          rm -rf /tmp/acpos-preview/preview/brand
          cp -R public/brand /tmp/acpos-preview/preview/brand
          cd /tmp/acpos-preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test $(find preview -maxdepth 1 -type f -name '*.html' | wc -l) -eq 18
          for f in index core assets video edit qa db strategy info system accounts dev social erp aiapi qa-criteria strategy-admin knowledge-admin; do test -s preview/$f.html; done
          git add preview
          git commit -m 'sync(preview): materialize all validated pages from new' || true
          git push origin HEAD:acpos-live-preview
      - name: Verify preview branch after push
        run: |
          git fetch origin acpos-live-preview
          PREVIEW_SHA=$(git rev-parse origin/acpos-live-preview)
          echo "PREVIEW_SHA=$PREVIEW_SHA"
          git ls-tree -r --name-only origin/acpos-live-preview preview | grep -E '^preview/[^/]+\.html$' | sort > /tmp/html-list
          test $(wc -l < /tmp/html-list) -eq 18
          grep -qx 'preview/index.html' /tmp/html-list
          grep -qx 'preview/strategy-admin.html' /tmp/html-list
          grep -qx 'preview/knowledge-admin.html' /tmp/html-list
      - name: Self clean source workflow
        run: |
          git worktree remove /tmp/acpos-preview --force || true
          rm -f .github/workflows/sync-all-completed-preview-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sync-all-completed-preview-once.yml
          git commit -m 'chore(preview): remove one-shot full sync workflow'
          git push origin HEAD:new
