name: stage01-reclose-stage02-entry-0921
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/stage01-reclose-stage02-entry-0921.yml
permissions:
  contents: write
  actions: read

jobs:
  reclose_candidate:
    runs-on: ubuntu-latest
    outputs:
      candidate_head: ${{ steps.out.outputs.candidate_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Verify historical fresh replay evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/35958357915/jobs?per_page=100 > /tmp/jobs.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/jobs.json'))
          replay=[x for x in j['jobs'] if x['name'].startswith('replay (')]
          ok=[x for x in replay if x['status']=='completed' and x['conclusion']=='success']
          bad=[x for x in replay if not (x['status']=='completed' and x['conclusion']=='success')]
          agg=[x for x in j['jobs'] if x['name']=='aggregate']
          assert len(replay)==31,(len(replay))
          assert len(ok)==31 and not bad,(len(ok),bad)
          assert len(agg)==1 and agg[0]['conclusion']=='failure',agg
          print('PASS: historical replay workers 31/31; old aggregate intentionally blocked by branch-head authority lock')
          PY
      - name: Materialize Stage-01 replay closure candidate on 0921
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml,json,hashlib,subprocess
          P=Path('.').resolve(); ST=P/'STAGE_EXECUTION/STAGE-01'; C=ST/'CLOSURE'
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          replay=sorted([x for x in jobs if x['name'].startswith('replay (')],key=lambda x:x['name'])
          assert len(replay)==31 and all(x['conclusion']=='success' for x in replay)
          def y(p):
              d=yaml.safe_load(p.read_text(encoding='utf-8'))
              assert isinstance(d,dict),p
              return d
          def h(d):
              body={k:v for k,v in d.items() if k not in {'artifact_hash','content_hash'}}
              raw=yaml.safe_dump(body,allow_unicode=True,sort_keys=False,width=220).encode()
              return hashlib.sha256(raw).hexdigest()
          def w(p,d,key='artifact_hash'):
              d[key]=h(d); p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=220),encoding='utf-8',newline='\n')
          current=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()

          summary={
            'artifact_uid':'STAGE01-PREFLIGHT-FRESH-REPLAY-SUMMARY',
            'artifact_type':'STAGE01_PREFLIGHT_FRESH_REPLAY_SUMMARY',
            'stage_uid':'STAGE-01',
            'replay_product_head':'11caac7865b7070dbe319db92c68d30477312a20',
            'governance_head':'c411687bcd94ba2f0c8016de63c3d8b4dc3d3209',
            'github_run_id':35958357915,
            'evidence_disposition':'HISTORICAL_EXTERNAL_EVIDENCE_ONLY_NO_EXECUTION_AUTHORITY',
            'required_work_unit_count':31,'received_result_count':31,'pass_count':31,'fail_count':0,
            'stage02_handoff_edge_total':124,'stage02_consumer_ready_edge_total':124,'result':'PASS',
            'worker_receipts':[{'job_id':x['id'],'job_name':x['name'],'conclusion':x['conclusion']} for x in replay]
          }
          w(C/'STAGE01_PREFLIGHT_FRESH_REPLAY_SUMMARY.yaml',summary)

          pp=C/'STAGE_EXECUTION_PREFLIGHT_RECEIPT.yaml'; p=y(pp)
          p['fresh_replay_run_id']=35958357915
          p['fresh_replay_head']='11caac7865b7070dbe319db92c68d30477312a20'
          p['fresh_replay_result']='PASS'
          p['fresh_replay_evidence_disposition']='HISTORICAL_EXTERNAL_EVIDENCE_ONLY'
          p['authorized_next_action']='STAGE01_EXACT_HEAD_CLOSURE_GATE'
          p['status']='REPLAY_VALIDATED'; p['result']='PASS'
          w(pp,p)

          dp=C/'DENOMINATOR_SNAPSHOT.yaml'; d=y(dp)
          d['closure_blocker_total']=0
          d['replay_required_work_unit_total']=31
          d['fresh_replay_pass_total']=31
          d['status']='FROZEN_FOR_STAGE01_CLOSURE_CANDIDATE'
          w(dp,d)

          prp=C/'CURRENT_PROBLEM_REGISTER.yaml'; pr=y(prp)
          pr['closure_blocker_total']=0
          if 'current_blocker' in pr:
              pr['historical_resolved_blocker']=pr.pop('current_blocker')
          pr['status']='ZERO_STAGE01_OWNED_OPEN_GAPS'
          w(prp,pr)

          lp=C/'RESOLUTION_LEDGER.yaml'; l=y(lp)
          entries=l.get('entries') or []
          found=False
          for x in entries:
              if x.get('issue_uid')=='STAGE01-CANONICAL-PREFLIGHT-CHRONOLOGY-001':
                  x['resolution']='CANONICAL_PREFLIGHT_ESTABLISHED_THEN_FRESH_REPLAY_COMPLETED_31_OF_31'
                  x['replay_run_id']=35958357915
                  x['replay_head']='11caac7865b7070dbe319db92c68d30477312a20'
                  x['closure_credit']='ELIGIBLE_FOR_EXACT_HEAD_GATE'
                  x['status']='RESOLVED'
                  found=True
          assert found
          if not any(x.get('action')=='EXECUTION_BRANCH_LOCKED_TO_0921ACPOS' for x in entries):
              entries.append({'ordinal':max(int(x.get('ordinal',0)) for x in entries)+1,
                              'action':'EXECUTION_BRANCH_LOCKED_TO_0921ACPOS',
                              'execution_branch':'0921acpos',
                              'historical_transport_branch':'tmp-word-binary-handoff-20260923',
                              'historical_transport_branch_disposition':'RETIRED_NO_EXECUTION_AUTHORITY',
                              'status':'RESOLVED'})
          l['entries']=entries;l['unresolved_stage01_owned_entry_total']=0;l['status']='PASS';w(lp,l)

          ap=C/'STAGE01_FULL_DENOMINATOR_AUDIT.yaml'; a=y(ap)
          a['external_fresh_replay_receipt']={
            'provider':'github_actions','repository_or_project':'steven-gold/orange-one-ai-viedo-v1.0',
            'head_sha':'11caac7865b7070dbe319db92c68d30477312a20','run_id':35958357915,
            'job_denominator':31,'conclusion':'success','execution_authority':False
          }
          a['fresh_pass_work_unit_count']=31;a['fresh_fail_work_unit_count']=0
          a['stage02_consumer_ready_edge_total']=124;a['stage02_blocked_edge_total']=0
          a['closure_blocker_total']=0;a['remaining_scope_total']=0;a['result']='PASS'
          w(ap,a)

          cp=C/'STAGE01_CLOSURE_CANDIDATE.yaml'; c=y(cp)
          c['exact_head_gate_status']='PENDING'
          c['stage_exit_authorized']=False
          c['status']='PENDING_EXACT_HEAD_CLOSURE_GATE'
          c['legal_next_transition']='STAGE01_EXACT_HEAD_CLOSURE_GATE'
          c['fresh_replay_summary_ref']='STAGE_EXECUTION/STAGE-01/CLOSURE/STAGE01_PREFLIGHT_FRESH_REPLAY_SUMMARY.yaml'
          c.pop('historical_invalidated_exact_head_gate_receipt',None)
          w(cp,c)

          rp=ST/'CURRENT_STAGE01_RESUME.yaml'; r=y(rp)
          assert r.get('execution_branch')=='0921acpos'
          assert r.get('execution_branch_lock')=='ONLY_0921ACPOS_MAY_MUTATE_CURRENT_PRODUCT_STATE'
          r['resume_base_product_head']=current
          r['resume_point']='STAGE01_EXACT_HEAD_CLOSURE_GATE'
          r['stage_exit_authorized']=False
          r['checkpoint_reason']='CANONICAL_PREFLIGHT_FRESH_REPLAY_31_OF_31_PASS_AWAITING_EXACT_HEAD_GATE'
          r['status']='CURRENT_RESUME'
          r.pop('previous_exit_gate_disposition',None)
          r.pop('historical_invalidated_exit_gate_receipt',None)
          w(rp,r,'content_hash')

          # This workflow must not remain in the Current product tree.
          wf=P/'.github/workflows/stage01-reclose-stage02-entry-0921.yml'
          assert wf.is_file()
          wf.unlink()
          PY
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add -A STAGE_EXECUTION/STAGE-01 .github/workflows/stage01-reclose-stage02-entry-0921.yml
          CURRENT="$(git ls-remote origin refs/heads/0921acpos | awk '{print $1}')"
          test "$CURRENT" = "${GITHUB_SHA}"
          git commit -m "fix(stage01): accept canonical preflight replay on 0921"
          git push origin HEAD:0921acpos
      - id: out
        run: echo "candidate_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  exact_head_gate:
    needs: reclose_candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_head: ${{ needs.reclose_candidate.outputs.candidate_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reclose_candidate.outputs.candidate_head }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Validate Stage-01 candidate exact head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          P=Path('.');ST=P/'STAGE_EXECUTION/STAGE-01';C=ST/'CLOSURE'
          def y(p): return yaml.safe_load(p.read_text(encoding='utf-8'))
          failures=[]
          s=y(C/'STAGE01_PREFLIGHT_FRESH_REPLAY_SUMMARY.yaml')
          p=y(C/'STAGE_EXECUTION_PREFLIGHT_RECEIPT.yaml')
          d=y(C/'DENOMINATOR_SNAPSHOT.yaml')
          pr=y(C/'CURRENT_PROBLEM_REGISTER.yaml')
          l=y(C/'RESOLUTION_LEDGER.yaml')
          a=y(C/'STAGE01_FULL_DENOMINATOR_AUDIT.yaml')
          c=y(C/'STAGE01_CLOSURE_CANDIDATE.yaml')
          r=y(ST/'CURRENT_STAGE01_RESUME.yaml')
          h=y(C/'CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml')
          if s.get('pass_count')!=31 or s.get('fail_count')!=0 or s.get('stage02_consumer_ready_edge_total')!=124 or s.get('result')!='PASS': failures.append('REPLAY_SUMMARY')
          if p.get('fresh_replay_result')!='PASS' or p.get('status')!='REPLAY_VALIDATED': failures.append('PREFLIGHT_REPLAY')
          if d.get('closure_blocker_total')!=0 or d.get('fresh_replay_pass_total')!=31: failures.append('DENOMINATOR')
          if pr.get('closure_blocker_total')!=0 or pr.get('stage01_owned_open_gap_total')!=0: failures.append('PROBLEM_REGISTER')
          if l.get('unresolved_stage01_owned_entry_total')!=0 or l.get('status')!='PASS': failures.append('RESOLUTION_LEDGER')
          if a.get('fresh_pass_work_unit_count')!=31 or a.get('fresh_fail_work_unit_count')!=0 or a.get('closure_blocker_total')!=0 or a.get('result')!='PASS': failures.append('FULL_AUDIT')
          if h.get('required_edge_total')!=124 or h.get('consumer_ready_total')!=124 or h.get('unresolved_required_dependency_total')!=0 or h.get('result')!='PASS': failures.append('HANDOFF')
          if c.get('status')!='PENDING_EXACT_HEAD_CLOSURE_GATE' or c.get('stage_exit_authorized') is not False: failures.append('CANDIDATE')
          if r.get('resume_point')!='STAGE01_EXACT_HEAD_CLOSURE_GATE' or r.get('stage_exit_authorized') is not False or r.get('execution_branch')!='0921acpos': failures.append('RESUME')
          if (P/'.github/workflows/stage01-reclose-stage02-entry-0921.yml').exists(): failures.append('TEMP_WORKFLOW_NOT_REMOVED')
          assert not failures,failures
          print('PASS: Stage-01 candidate exact head is closure-eligible on 0921')
          PY

  finalize_stage01:
    needs: [reclose_candidate, exact_head_gate]
    runs-on: ubuntu-latest
    outputs:
      final_head: ${{ steps.out.outputs.final_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reclose_candidate.outputs.candidate_head }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Finalize Stage-01
        env:
          CANDIDATE_HEAD: ${{ needs.reclose_candidate.outputs.candidate_head }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml,os
          ST=Path('STAGE_EXECUTION/STAGE-01');C=ST/'CLOSURE'
          def y(p): return yaml.safe_load(p.read_text(encoding='utf-8'))
          def w(p,d): p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=220),encoding='utf-8',newline='\n')
          receipt={'provider':'github_actions','repository_or_project':'steven-gold/orange-one-ai-viedo-v1.0',
                   'head_sha':os.environ['CANDIDATE_HEAD'],'run_id':int(os.environ['GITHUB_RUN_ID']),
                   'job_denominator':['stage01-reclose-stage02-entry-0921/exact_head_gate'],'conclusion':'success'}
          cp=C/'STAGE01_CLOSURE_CANDIDATE.yaml';c=y(cp)
          c['exact_head_gate_status']='PASS';c['exact_head_gate_receipt']=receipt
          c['stage_exit_authorized']=True;c['status']='ALL_REQUIRED_PAGES_STAGE1_CLOSED'
          c['legal_next_transition']='STAGE02_WORK_UNIT_RESOLUTION_GATE';w(cp,c)
          rp=ST/'CURRENT_STAGE01_RESUME.yaml';r=y(rp)
          r['resume_base_product_head']=os.environ['CANDIDATE_HEAD']
          r['resume_point']='STAGE02_WORK_UNIT_RESOLUTION_GATE';r['stage_exit_authorized']=True
          r['stage01_exit_gate']='ALL_REQUIRED_PAGES_STAGE1_CLOSED';r['stage01_exit_gate_receipt']=receipt
          r['next_stage_uid']='STAGE-02';r['checkpoint_reason']='CANONICAL_PREFLIGHT_FRESH_REPLAY_CLOSED_ON_0921'
          r['status']='STAGE01_CLOSED_STAGE02_READY';w(rp,r)
          PY
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add STAGE_EXECUTION/STAGE-01/CLOSURE/STAGE01_CLOSURE_CANDIDATE.yaml STAGE_EXECUTION/STAGE-01/CURRENT_STAGE01_RESUME.yaml
          CURRENT="$(git ls-remote origin refs/heads/0921acpos | awk '{print $1}')"
          test "$CURRENT" = "${CANDIDATE_HEAD}"
          git commit -m "feat(stage01): close Stage-01 on 0921 after canonical replay"
          git push origin HEAD:0921acpos
      - id: out
        run: echo "final_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  terminal_stage01:
    needs: finalize_stage01
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize_stage01.outputs.final_head }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Validate terminal Stage-01 head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          ST=Path('STAGE_EXECUTION/STAGE-01');C=ST/'CLOSURE'
          c=yaml.safe_load((C/'STAGE01_CLOSURE_CANDIDATE.yaml').read_text())
          r=yaml.safe_load((ST/'CURRENT_STAGE01_RESUME.yaml').read_text())
          h=yaml.safe_load((C/'CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml').read_text())
          assert c['status']=='ALL_REQUIRED_PAGES_STAGE1_CLOSED' and c['stage_exit_authorized'] is True
          assert r['status']=='STAGE01_CLOSED_STAGE02_READY' and r['resume_point']=='STAGE02_WORK_UNIT_RESOLUTION_GATE' and r['stage_exit_authorized'] is True
          assert r['execution_branch']=='0921acpos'
          assert h['consumer_ready_total']==124 and h['unresolved_required_dependency_total']==0
          assert not Path('.github/workflows/stage01-reclose-stage02-entry-0921.yml').exists()
          print('PASS: terminal Stage-01 head closed and Stage-02 entry authorized')
          PY

  stage02_entry:
    needs: [finalize_stage01, terminal_stage01]
    runs-on: ubuntu-latest
    outputs:
      stage02_head: ${{ steps.out.outputs.stage02_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize_stage01.outputs.final_head }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Resolve first Stage-02 Work Unit
        env:
          STAGE1_FINAL_HEAD: ${{ needs.finalize_stage01.outputs.final_head }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml,hashlib,os
          P=Path('.'); S1=P/'STAGE_EXECUTION/STAGE-01'; S2=P/'STAGE_EXECUTION/STAGE-02'
          c=yaml.safe_load((S1/'CLOSURE/STAGE01_CLOSURE_CANDIDATE.yaml').read_text())
          r=yaml.safe_load((S1/'CURRENT_STAGE01_RESUME.yaml').read_text())
          assert c['status']=='ALL_REQUIRED_PAGES_STAGE1_CLOSED' and c['stage_exit_authorized'] is True
          assert r['resume_point']=='STAGE02_WORK_UNIT_RESOLUTION_GATE' and r['stage_exit_authorized'] is True
          source=S1/'WU-STAGE01-CORE-01-11C975A3'
          assert source.is_dir()
          page_bp=next((source/'02_BASE_BLUEPRINT').rglob('PAGE_BASE_BLUEPRINT.yaml'))
          ctx=source/'00_SOURCE_INTAKE/SOURCE_CONTEXT_MANIFEST.yaml'
          con=source/'00_SOURCE_INTAKE/CONTENT_SUPERSESSION_CONFLICT_LEDGER.yaml'
          dep=source/'00_SOURCE_INTAKE/SOURCE_DEPENDENCY_MAP.yaml'
          for p in [page_bp,ctx,con,dep]: assert p.is_file(),p
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def w(p,d):
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=220),encoding='utf-8',newline='\n')
          wu='WU-STAGE02-CORE-01-001'; W=S2/wu
          inputs=[
            {'input_type':'PAGE_BASE_BLUEPRINT','ref':str(page_bp.relative_to(P)),'sha256':sha(page_bp),'origin_stage':'STAGE-01'},
            {'input_type':'SOURCE_CONTEXT_MANIFEST','ref':str(ctx.relative_to(P)),'sha256':sha(ctx),'origin_stage':'STAGE-01'},
            {'input_type':'CONTENT_SUPERSESSION_CONFLICT_LEDGER','ref':str(con.relative_to(P)),'sha256':sha(con),'origin_stage':'STAGE-01'},
            {'input_type':'SOURCE_DEPENDENCY_MAP','ref':str(dep.relative_to(P)),'sha256':sha(dep),'origin_stage':'STAGE-01'}
          ]
          w(W/'WORK_UNIT_RESOLUTION_GATE.yaml',{
            'artifact_type':'WORK_UNIT_RESOLUTION_GATE','result':'EXECUTABLE',
            'stage_uid':'STAGE-02','work_unit_uid':wu,'page_uid':'CORE-01',
            'entry_gate':'ALL_REQUIRED_PAGES_STAGE1_CLOSED','entry_gate_status':'PASS',
            'predecessor_stage_head':os.environ['STAGE1_FINAL_HEAD'],
            'predecessor_stage_closure_ref':'STAGE_EXECUTION/STAGE-01/CLOSURE/STAGE01_CLOSURE_CANDIDATE.yaml',
            'input_handoff_required_total':4,'input_handoff_ready_total':4,
            'primary_task_layer':'PRODUCT_STAGE_EXECUTION',
            'canonical_owner':'STAGE02_PAGE_FUNCTIONAL_CONTRACT:CORE-01',
            'legal_first_operation':'STAGE_EXECUTION_PREFLIGHT_COMPILE',
            'stage_exit_authorized':False
          })
          w(W/'WORK_UNIT.yaml',{
            'work_unit_uid':wu,'canonical_name':'CORE-01 Stage-02 Page Functional Contract',
            'primary_task_layer':'PRODUCT_STAGE_EXECUTION','stage_uid':'STAGE-02',
            'scope':{'page_uid':'CORE-01','predecessor_stage1_work_unit':'WU-STAGE01-CORE-01-11C975A3'},
            'dependencies':inputs,'current_status':'ACTIVE_PRIMARY_WORK_UNIT',
            'resume_point':'STAGE_EXECUTION_PREFLIGHT_COMPILE',
            'out_of_scope':['STAGE-03_AND_LATER','IMPLEMENTATION','DEPLOYMENT']
          })
          w(W/'CURRENT_EXECUTION_SCOPE_MANIFEST.yaml',{
            'artifact_type':'CURRENT_EXECUTION_SCOPE_MANIFEST','stage_uid':'STAGE-02',
            'work_unit_uid':wu,'page_uids':['CORE-01'],
            'input_types':[x['input_type'] for x in inputs],
            'input_handoff_ready_total':4,'stage_exit_authorized':False
          })
          w(W/'INPUT_HANDOFF_MANIFEST.yaml',{
            'artifact_type':'STAGE02_INPUT_HANDOFF_MANIFEST','stage_uid':'STAGE-02',
            'work_unit_uid':wu,'required_input_total':4,'ready_input_total':4,
            'inputs':inputs,'result':'PASS'
          })
          w(S2/'CURRENT_STAGE02_RESUME.yaml',{
            'artifact_uid':'STAGE02-CURRENT-EXECUTION-RESUME','artifact_type':'STAGE_EXECUTION_RESUME',
            'stage_uid':'STAGE-02','primary_task_layer':'PRODUCT_STAGE_EXECUTION',
            'execution_branch':'0921acpos','current_work_unit_uid':wu,'current_page_uid':'CORE-01',
            'resume_point':'STAGE_EXECUTION_PREFLIGHT_COMPILE','stage_exit_authorized':False,
            'stage1_entry_gate':'ALL_REQUIRED_PAGES_STAGE1_CLOSED','stage1_entry_gate_status':'PASS',
            'status':'STAGE02_ACTIVE_WORK_UNIT_RESOLVED'
          })
          PY
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add STAGE_EXECUTION/STAGE-02
          CURRENT="$(git ls-remote origin refs/heads/0921acpos | awk '{print $1}')"
          test "$CURRENT" = "${STAGE1_FINAL_HEAD}"
          git commit -m "feat(stage02): resolve CORE-01 Stage-02 work unit"
          git push origin HEAD:0921acpos
      - id: out
        run: echo "stage02_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
