name: Product Stage01 Validation
# Independently revalidates Stage-01 closure evidence after materialization.
on:
  push:
    branches: [0921acpos]
    paths:
      - 'STAGE_EXECUTION/STAGE-01/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-stage01:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact selected Current governance
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          test -s "$SEL" || { echo "BLOCK:CURRENT_GOVERNANCE_SELECTION_MISSING"; exit 31; }
          STATUS="$(awk '$1=="status:" {print $2; exit}' "$SEL")"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          test "$STATUS" = "SELECTED_VALIDATED_CURRENT" || { echo "BLOCK:CURRENT_GOVERNANCE_NOT_EXACT_HEAD_VALIDATED"; exit 32; }
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "BLOCK:CURRENT_GOVERNANCE_COMMIT_INVALID"; exit 33; }
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout current governance authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - name: Load current governance authority
        run: |
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Validate current governance definition
        run: |
          python governance/ci/stage_execution_engine.py --definition-audit-all
      - name: Validate Stage01 canonical preflight manifests and closure evidence
        run: |
          set -euo pipefail
          for WU in WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001 WU-STAGE01-WB01-DASHBOARD-REENTRY-001; do
            B="STAGE_EXECUTION/STAGE-01/${WU}"
            for M in REQUIRED_FIELD_MANIFEST FUNCTIONAL_CHAIN_MANIFEST EFFECTIVE_CONTRACT_OVERLAY DEPENDENCY_TOPOLOGY DENOMINATOR_SNAPSHOT CLASSIFICATION_RULESET CHANGE_IMPACT_MAP STAGE_EXECUTION_PREFLIGHT_RECEIPT; do
              test -f "$B/$M.yaml" || { echo "BLOCK:STAGE01_PREFLIGHT_MANIFEST_MISSING:$WU:$M"; exit 1; }
            done
            test -f "$B/EVIDENCE/CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml" || { echo "BLOCK:STAGE01_HANDOFF_LEDGER_MISSING:$WU"; exit 1; }
            python governance/ci/stage_execution_engine.py --validate-evidence --stage STAGE-01 --evidence "$B/EVIDENCE/STAGE01_NORMALIZED_EVIDENCE.json"
          done
      - name: Assert Stage01 stage-exit authorized
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          r = yaml.safe_load(Path('STAGE_EXECUTION/STAGE-01/CURRENT_STAGE01_RESUME.yaml').read_text()) or {}
          if r.get('stage_exit_authorized') is not True:
              raise SystemExit('BLOCK:STAGE01_STAGE_EXIT_NOT_AUTHORIZED')
          if r.get('status') != 'STAGE01_COMPLETE_STAGE02_ELIGIBLE':
              raise SystemExit('BLOCK:STAGE01_RESUME_STATUS_DRIFT')
          print('PASS: Stage-01 stage exit authorized and Stage-02 eligible')
          PY
