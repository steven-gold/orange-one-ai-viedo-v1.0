name: Stage-03 Governance Closure and Product Restore

"on":
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/governance-maintenance/finalize_stage03_visual_governance.py
      - .github/workflows/stage03-visual-governance-finalize.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify exact prior terminal governance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 35483671654 35483671548 35483671577; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq .head_sha)" = "f7dad5ac112337251f35678a95e9d8f3d99d9d4d"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq .status)" = "completed"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq .conclusion)" = "success"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/35483447515" --jq .conclusion)" = "success"
      - name: Close governance WU and restore Stage-03 Product WU
        run: python .github/governance-maintenance/finalize_stage03_visual_governance.py
      - name: Validate restored state and current profile
        run: |
          python governance/ci/governance_resolver.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/stage_execution_engine.py --definition-audit-all
      - name: Persist transition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/test/ACTIVE_STATE.yaml governance/test/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore(governance): close Stage-03 visual hardening and restore product WU"
          git push origin "HEAD:${GITHUB_REF_NAME}"
