name: VIS-11 IAM authority closure
on:
  push:
    branches: [acpos-vis11-staging]
    paths: [.github/workflows/vis11-iam-authority-closure.yml]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis11-staging
      - name: Align IAM-01 to current navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('authority/pages/admin/IAM-01/ACPOS_IAM-01_ACCOUNT_PERMISSION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml')
          s=p.read_text()
          anchor='    canonical_page_uid: workspace:STR-01\n  backend_permission_choices:'
          insert='    canonical_page_uid: workspace:STR-01\n  - order: 9\n    bundle_key: FRONT-L1-09\n    label: 最新資訊\n    canonical_page_uid: workspace:INFO-01\n  backend_permission_choices:'
          assert s.count(anchor)==1
          s=s.replace(anchor,insert)
          replacements={
            'effect: Select all 8 frontend L1 choices in the draft only.':'effect: Select all 9 frontend L1 choices in the draft only.',
            'role: Eight frontend L1 permission choices only':'role: Nine frontend L1 permission choices only',
            'role: Eight backend L1 permission choices only':'role: Nine backend L1 permission choices only',
            'label: 前台 8 L1':'label: 前台 9 L1',
            'label: 後台 8 L1':'label: 後台 9 L1',
            'rule: Select/deselect all eight frontend L1 draft choices.':'rule: Select/deselect all nine frontend L1 draft choices.',
            'rule: Select/deselect all eight backend L1 draft choices; not super-admin.':'rule: Select/deselect all nine backend L1 draft choices; not super-admin.',
            'condition: Exactly 8 current frontend permission choices in exact order.':'condition: Exactly 9 current frontend permission choices in exact order.',
            'condition: Exactly 8 confirmed backend permission choices in exact order.':'condition: Exactly 9 confirmed backend permission choices in exact order.'
          }
          for a,b in replacements.items():
            assert s.count(a)==1, (a,s.count(a))
            s=s.replace(a,b)
          front='    - 戰略中心\n    backend:'
          assert s.count(front)==1
          s=s.replace(front,'    - 戰略中心\n    - 最新資訊\n    backend:')
          back='    - QA 評分項目\n    - 戰略中心\nhard_locks:'
          assert s.count(back)==1
          s=s.replace(back,'    - QA 評分項目\n    - 戰略中心\n    - 知識庫\nhard_locks:')
          if '  revision:' not in s.split('authorization_simplification:',1)[0]:
            s=s.replace('  current_only: true\n','  current_only: true\n  revision: 2026-08-30-CURRENT-NAV-9X9-ALIGNMENT\n',1)
          p.write_text(s)

          n=Path('authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml')
          x=n.read_text()
          old='    page_uid: admin:IAM-01\n    permission_bundle: ADMIN-L1-IAM'
          new='    page_uid: admin:IAM-01\n    route: /admin/accounts\n    permission_bundle: ADMIN-L1-IAM'
          assert x.count(old)==1
          x=x.replace(old,new)
          x=x.replace('revision: 2026-08-30-USER-APPROVED-SYS01-ADMIN-ROUTE','revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01',1)
          n.write_text(x)
          PY
      - name: Validate authority closure
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          ip=Path('authority/pages/admin/IAM-01/ACPOS_IAM-01_ACCOUNT_PERMISSION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml')
          np=Path('authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml')
          i=yaml.safe_load(ip.read_text()); n=yaml.safe_load(np.read_text())
          a=i['authorization_simplification']
          assert len(a['frontend_permission_choices'])==9
          assert len(a['backend_permission_choices'])==9
          assert a['frontend_permission_choices'][-1]['bundle_key']=='FRONT-L1-09'
          assert a['frontend_permission_choices'][-1]['canonical_page_uid']=='workspace:INFO-01'
          ctrls={c['control_uid']:c for c in i['controls']}
          assert ctrls['IAM-01-GRP-FRONT-L1']['label']=='前台 9 L1'
          assert ctrls['IAM-01-GRP-BACK-L1']['label']=='後台 9 L1'
          acc={a['uid']:a for a in i['acceptance']}
          assert 'Exactly 9' in acc['IAM-01-ACC-05']['condition']
          assert 'Exactly 9' in acc['IAM-01-ACC-06']['condition']
          nav={x['nav_id']:x for x in n['admin_navigation']['items']}
          assert nav['ADMIN-NAV-02']['route']=='/admin/accounts'
          text=ip.read_text()
          for stale in ['前台 8 L1','後台 8 L1','all eight frontend','all eight backend','Exactly 8 current frontend','Exactly 8 confirmed backend','Eight frontend L1','Eight backend L1']:
            assert stale not in text, stale
          assert '最新資訊' in text and '知識庫' in text
          print('IAM-01 authority closure PASS: 9 front / 9 admin / route /admin/accounts')
          PY
      - name: Commit exact authority files and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add authority/pages/admin/IAM-01/ACPOS_IAM-01_ACCOUNT_PERMISSION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml
          git commit -m "fix(vis11): align IAM-01 with current 9x9 navigation"
          git rm .github/workflows/vis11-iam-authority-closure.yml
          git commit -m "chore(vis11): remove IAM authority closure workflow"
          git push origin HEAD:acpos-vis11-staging