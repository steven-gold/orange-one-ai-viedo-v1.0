name: ACPOS VIS-04 validation

on:
  push:
    branches:
      - acpos-vis04-staging
    paths-ignore:
      - 'docs/construction/evidence/VIS-04/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis04-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser harness without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/acpos-vis04.log 2>&1 &
          echo $! > /tmp/acpos-vis04.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/video >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/acpos-vis04.log
          exit 1
      - name: Render and validate VIS-04
        run: node scripts/capture-vis04.mjs
      - name: Upload VIS-04 render evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-vis04-render-evidence
          path: artifacts/vis04
          if-no-files-found: error
      - name: Persist VIS-04 evidence
        run: |
          mkdir -p docs/construction/evidence/VIS-04
          cp artifacts/vis04/* docs/construction/evidence/VIS-04/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/VIS-04
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: persist VIS-04 render evidence'
          git push origin HEAD:acpos-vis04-staging
