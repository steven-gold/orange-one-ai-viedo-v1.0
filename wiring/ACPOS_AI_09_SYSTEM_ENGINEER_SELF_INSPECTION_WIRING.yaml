- '#': '29'
  Domain: Inspection / Finding
  Normative rule: Known issue remediation MUST be followed by hidden-defect sweep。
- '#': '30'
  Domain: Inspection / Finding
  Normative rule: Successful audit with reproducible remediable gap MUST NOT be called closure。
- '#': '31'
  Domain: Inspection / Finding
  Normative rule: No evidence = NOT_VERIFIED, not PASS。
- '#': '32'
  Domain: Inspection / Finding
  Normative rule: Partial validator PASS MUST NOT be terminal run PASS。
- '#': '33'
  Domain: Inspection / Finding
  Normative rule: Timeout/cancelled/skipped/ambiguous MUST NOT become PASS。
- '#': '34'
  Domain: Inspection / Finding
