      - deleteAssetLayer
      - DELETE /v1/asset-runtime-runs/{runId}/layer-documents/{compositionDocumentId}/layers/{layerId}
      - DeleteAssetLayerRequest
      - System 05 / LayerVersion Tombstone + CompositionVersion
      - Deletion is versioned/tombstoned through a new composition state; prior LayerVersion remains recoverable/auditable.
