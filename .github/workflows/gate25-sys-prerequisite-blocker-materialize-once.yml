name: ACPOS Gate25 SYS Prerequisite Blocker Materialize Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-sys-prerequisite-blocker-materialize-once.yml'
      - 'scripts/gate25-production-sys-prerequisite-diagnostic.mjs'

permissions:
  contents: write

jobs:
  materialize-sys-prerequisite-blockers:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_EXPECT_RELEASE_SHA: 608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Execute read-only authenticated Production SYS prerequisite diagnostic
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/gate25-production-sys-prerequisite-diagnostic.mjs
          node scripts/gate25-production-sys-prerequisite-diagnostic.mjs | tee "$RUNNER_TEMP/sys-prerequisite.log"
      - name: Materialize exact SYS prerequisite blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          log=Path(os.environ['RUNNER_TEMP'])/'sys-prerequisite.log'
          line=next((x for x in log.read_text().splitlines() if x.startswith('SYS_PREREQUISITE_DIAGNOSTIC ')),None)
          assert line,'SYS prerequisite diagnostic payload missing'
          d=json.loads(line.split(' ',1)[1])
          assert d['production_release_sha']==os.environ['ACPOS_EXPECT_RELEASE_SHA']
          assert d['projection_http']==200
          assert d['mutation_count']==0
          expected={
            'SYS-01-BTN-CANDIDATE-CREATE':('ACT-CANDIDATE-CREATE','createCandidate'),
            'SYS-01-BTN-CR-CREATE':('ACT-CR-CREATE','createChangeRequest'),
          }
          observed={c['control_id']:c for c in d['controls']}
          assert set(observed)==set(expected)
          for cid,(action,operation) in expected.items():
            assert observed[cid]['action_uid']==action
            assert observed[cid]['operation_id']==operation
          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_SYS_PREREQUISITE_PRODUCTION_BLOCKERS_2026-09-10.json')
          ledger=json.loads(ledger_path.read_text())
          before=dict(ledger['counts'])
          assert before=={'PASS':47,'BLOCKED':141,'NOT_EXECUTED':1293},before
          entries={e['resource_key']:e for e in ledger['entries']}
          pairs=[
            ('control:CTRL-ADMIN-SYS-01-ACT-01-ACT-CANDIDATE-CREATE','action:admin:SYS-01:ACT-CANDIDATE-CREATE','createCandidate','SYSTEM_CHANGE_CANDIDATE_ACCEPTANCE_FIXTURE_AND_CLEANUP_NOT_REGISTERED'),
            ('control:CTRL-ADMIN-SYS-01-ACT-02-ACT-CR-CREATE','action:admin:SYS-01:ACT-CR-CREATE','createChangeRequest','SYSTEM_CHANGE_REQUEST_ACCEPTANCE_FIXTURE_AND_CLEANUP_NOT_REGISTERED'),
          ]
          for control,action,_,_ in pairs:
            assert entries[control]['disposition']=='NOT_EXECUTED',(control,entries[control]['disposition'])
            assert entries[action]['disposition']=='NOT_EXECUTED',(action,entries[action]['disposition'])
          evidence={
            'document_id':'ACPOS_GATE25_SYS_PREREQUISITE_PRODUCTION_BLOCKERS',
            'status':'BLOCKED',
            'recorded_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':os.environ['ACPOS_EXPECT_RELEASE_SHA'],
            'deployment_url':os.environ['ACPOS_DEPLOYMENT_URL'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'resource_count':4,
            'mutation_count':0,
            'production_snapshot':{k:d.get(k) for k in ['page_state','system_change_id','candidate_ref','conversation_id']},
            'controls':d['controls'],
            'formal_resources':[x for p in pairs for x in p[:2]],
            'runtime_evidence':['src/server/system/productionSystemLifecycleRuntime.ts','src/domain/system/systemMutationPort.ts','authority/pages/admin/SYS-01/ACPOS_SYS-01_SYSTEM_LIFECYCLE_AI_FINAL_DESIGN_ENCODING.yaml'],
            'rule':'createCandidate can persist a new Production system change, candidate and conversation; createChangeRequest persists a Production change request. No isolated reversible acceptance fixture/cleanup operation is registered. Formal acceptance must not fabricate durable System Lifecycle business state solely to turn these resources PASS.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          run_ref=f'GitHub Actions: ACPOS Gate25 SYS Prerequisite Blocker Materialize run_id={os.environ["GITHUB_RUN_ID"]}'
          for control,action,operation,reason in pairs:
            for key in (control,action):
              e=entries[key]
              e['disposition']='BLOCKED'
              e['reason_code']=reason
              e['evidence_refs']=[str(evidence_path),run_ref,'src/server/system/productionSystemLifecycleRuntime.ts','src/domain/system/systemMutationPort.ts','authority/pages/admin/SYS-01/ACPOS_SYS-01_SYSTEM_LIFECYCLE_AI_FINAL_DESIGN_ENCODING.yaml']
              e['blocker_detail']='Production execution would create or extend durable System Lifecycle state and no isolated reversible acceptance fixture/cleanup contract is registered; fabricating Production business state for acceptance is forbidden.'
              e['operation_ids']=[operation]
          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for e in ledger['entries']:counts[e['disposition']]+=1
          assert counts=={'PASS':47,'BLOCKED':145,'NOT_EXECUTED':1289},counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':4},ensure_ascii=False))
          PY
      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit SYS prerequisite blocker evidence and ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_SYS_PREREQUISITE_PRODUCTION_BLOCKERS_2026-09-10.json
          git commit -m 'evidence(gate25): block SYS prerequisite mutations without cleanup contract'
          git push origin HEAD:new
