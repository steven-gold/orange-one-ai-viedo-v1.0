purpose: 18 頁、中央大腦、Identity／Permission／Data／AI／Queue／Audit 的單一整合契約。ACPOS 是全站中央協調大腦，不是第 19 個業務頁面。
positioning: 每個 Domain Page 保留自己的 Business Truth；System Logic 只負責 Context、Version、Handoff、Routing、Experience、Audit
  與跨頁合法下一步。
truth_precedence:
- Current Page Authority：決定各頁 Business / UI 行為
- Global Shell / Navigation / Visual：決定全站外框、路由目標、視覺 Token
- System Authority：決定跨頁 Context、Orchestration、AI、Experience、Integration
- Runtime Contracts：決定 Identity、DB、Queue 等實際技術邊界
- Implementation / Test / Deployment Evidence：只能證明是否已施工，不反向改寫 Authority
unknown_rule: 任何無 owner、無 exact version、無 permission、無 registered operation、無 required evidence 的跨頁行為，不得用
  AI 推測補值；必須 BLOCK + REPORT_AUTHORITY_GAP。
