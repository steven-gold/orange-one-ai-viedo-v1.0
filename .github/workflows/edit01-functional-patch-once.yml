          old='  gates["EDIT-01-GATE-STANDALONE"]=false;\n  gates["EDIT-01-GATE-PREVIEW"]'
          new='  gates["EDIT-01-GATE-STANDALONE"]=false;\n  gates["EDIT-01-GATE-LIPSYNC"]=state.stage_uid==="EDIT-01-STAGE-03-SYNC";\n  gates["EDIT-01-GATE-SUBTITLE"]=state.stage_uid==="EDIT-01-STAGE-03-SYNC";\n  gates["EDIT-01-GATE-PROJECT-SOURCE-MUTATION"]=false;\n  gates["EDIT-01-GATE-SYNC-POLICY"]=true;\n  gates["EDIT-01-GATE-PREVIEW"]'
          if old not in s: raise SystemExit('controlled gate token missing')
          s=s.replace(old,new)
          old='    "EDIT-01-FLD-PROJECT":list(PROJECT_ID,"[TEST] ORANGE ONE Project"),"EDIT-01-FLD-TOPIC":list(TOPIC_ID,"[TEST] Topic 001"),"EDIT-01-FLD-TASK":list(TASK_ID,"[TEST] EDIT Task 001"),\n  },gate_state:allGates(),'
          new='    "EDIT-01-FLD-PROJECT":list(PROJECT_ID,"[TEST] ORANGE ONE Project"),"EDIT-01-FLD-TOPIC":list(TOPIC_ID,"[TEST] Topic 001"),"EDIT-01-FLD-TASK":list(TASK_ID,"[TEST] EDIT Task 001"),\n    "EDIT-01-CTL-MEDIA-TYPE-FILTER":list("TEST-MEDIA-VIDEO","[TEST] Video"),"EDIT-01-FLD-INSPECTOR-SPEED":list("1","[TEST] 1x"),"EDIT-01-FLD-INSPECTOR-TRANSITION":list("TEST-CUT","[TEST] Cut"),\n    "EDIT-01-FLD-API-SCOPE":list("TEST-RANGE","[TEST] Selected Range"),"EDIT-01-FLD-LIPSYNC-TARGET":list("TEST-DIALOGUE-001","[TEST] Dialogue Target"),"EDIT-01-FLD-SUB-LANG":list("zh-TW","[TEST] zh-TW"),"EDIT-01-FLD-SUB-FORMAT":list("SRT","[TEST] SRT"),"EDIT-01-CTL-AUDIO-MONITOR":list("MASTER","[TEST] Master"),\n    "EDIT-01-FLD-API-PROVIDER":list("TEST-PROVIDER","[TEST] Provider"),"EDIT-01-FLD-API-MODEL":list("TEST-MODEL","[TEST] Model"),"EDIT-01-FLD-VOICE-SCRIPT":list("TEST-VOICE-SCRIPT-001","[TEST] Voice Script"),"EDIT-01-FLD-VOICE-ASSET":list("TEST-VOICE-ASSET-001","[TEST] Voice Asset"),"EDIT-01-FLD-VOICE-PROVIDER":list("TEST-VOICE-PROVIDER","[TEST] Voice Provider"),"EDIT-01-FLD-VOICE-MODEL":list("TEST-VOICE-MODEL","[TEST] Voice Model"),"EDIT-01-FLD-MUSIC-ASSET":list("TEST-MUSIC-ASSET-001","[TEST] Music Asset"),"EDIT-01-FLD-SFX-ASSET":list("TEST-SFX-ASSET-001","[TEST] SFX Asset"),\n  },gate_state:allGates(),'
          if old not in s: raise SystemExit('controlled list token missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/pages/EditVisual.tsx src/components/pages/EditControlRuntime.tsx src/domain/edit/editClientState.ts src/server/testing/controlledEditTestRuntime.ts
