name: ACPOS Batch 05 Authority Remediation

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-05-authority-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Verify no Word drift since Batch 04
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="bcb2d0db630ad2ad88727b6be548e216a4fe4129"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-04")
          PY

      - name: Preflight script syntax
        run: python -m py_compile __temp/batch_05_authority_remediation.py

      - name: Baseline DOCX encoding audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,re,json
          files=[
          "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13}
          report={}
          for fn in files:
              with zipfile.ZipFile(fn) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  errs=[]
                  for n in xmls:
                      try:ET.fromstring(z.read(n))
                      except Exception as e:errs.append((n,str(e)))
                  assert not errs,(fn,errs)
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  text="".join((e.text or "") for e in root.iter(ns+"t"))
              assert "\x00" not in text,(fn,"NUL")
              ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
              assert not ctrl[:20],(fn,"CONTROL",ctrl[:20])
              hits=[x for x in bad if x in text]
              assert not hits,(fn,"MOJIBAKE",hits)
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,"NFC_REPLACEMENT")
              report[fn]={"xml_parts":len(xmls),"chars":len(text),"status":"PASS"}
          Path("__baseline_encoding_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-05 BASELINE DOCX ENCODING",json.dumps(report,ensure_ascii=False))
          PY

      - name: Apply authority-backed remediation
        run: python __temp/batch_05_authority_remediation.py

      - name: Verify semantic remediation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch05_remediation_report.json").read_text(encoding="utf-8"))
          assert len(r["applied"])==34,len(r["applied"])
          assert r["post"]["total_definition_gaps"]==312,r["post"]["total_definition_gaps"]
          for x in r["applied"]:
              d=Document(x["file"])
              texts=[]
              for t in d.tables:
                  for row in t.rows:
                      texts.append(" | ".join(c.text for c in row.cells))
              exact=[z for z in texts if x["uid"] in z and x["value"] in z]
              assert exact,(x["page"],x["uid"],x["field"],x["value"])
          sysdoc=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          st="\n".join([p.text for p in sysdoc.paragraphs]+[c.text for t in sysdoc.tables for row in t.rows for c in row.cells])
          for token in [
             "ACPOS-20260921-BATCH-05-AUTHORITY-BACKED-REMEDIATION-V1",
             "BATCH05_MACHINE_JSON=",
             "PRESERVED_UNRESOLVED",
             "Post-batch direct Definition Binding Gap"
          ]: assert token in st,token
          print("PASS: BATCH-05 SEMANTIC REMEDIATION 34/34; POST GAP 312")
          PY

      - name: Convert six DOCX files to PDF
        shell: bash
        run: |
          mkdir -p __render_qa_batch05/pdf
          for f in           "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"           "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          do
            libreoffice --headless --convert-to pdf --outdir __render_qa_batch05/pdf "$f"
          done

      - name: Post-conversion encoding and garble audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          files=[
          "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13}
          cjk_re=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          report={}
          for fn in files:
              docx=Path(fn);pdf=Path("__render_qa_batch05/pdf")/(docx.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(docx) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  errs=[]
                  for n in xmls:
                      try:ET.fromstring(z.read(n))
                      except Exception as e:errs.append((n,str(e)))
                  assert not errs,(fn,errs)
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in root.iter(ns+"t"))
              pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              for label,text in [("DOCX",src),("PDF",pdftext)]:
                  assert "\x00" not in text,(fn,label,"NUL")
                  ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
                  assert not ctrl[:20],(fn,label,"CONTROL",ctrl[:20])
                  hits=[x for x in bad if x in text]
                  assert not hits,(fn,label,"MOJIBAKE",hits)
                  assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,label,"NFC_REPLACEMENT")
              sc=len(cjk_re.findall(src));pc=len(cjk_re.findall(pdftext))
              assert sc>0,(fn,"NO_SOURCE_CJK")
              ratio=pc/sc
              assert ratio>=0.97,(fn,"CJK_RETENTION",sc,pc,ratio)
              report[fn]={"xml_parts":len(xmls),"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch05/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-05 ENCODING/GARBLE INTEGRITY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Render PNGs and geometry QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          from PIL import Image,ImageChops
          files=[
          "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          qa=Path("__render_qa_batch05");pdfdir=qa/"pdf";pngroot=qa/"png";pngroot.mkdir(parents=True,exist_ok=True)
          report={}
          for fn in files:
              p=Path(fn);pf=pdfdir/(p.stem+".pdf")
              info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
              pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
              od=pngroot/p.stem;od.mkdir(parents=True,exist_ok=True)
              subprocess.run(["pdftoppm","-png","-r","130",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob("page-*.png"));assert len(imgs)==pages,(fn,pages,len(imgs))
              blank=[];edge=[];tiny=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert("RGB")
                  diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
                  bb=diff.getbbox()
                  if bb is None:blank.append(i);continue
                  l,t,r,b=bb
                  if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
                  if (r-l)*(b-t)<5000:tiny.append(i)
              assert not blank,(fn,"BLANK",blank)
              assert not edge,(fn,"EDGE",edge)
              report[fn]={"pages":pages,"blank":blank,"edge":edge,"tiny_content_pages":tiny}
          Path("__render_qa_batch05/geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-05 RENDER/GEOMETRY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Verify exact Batch 05 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
          "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          }
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-05 CHANGE SCOPE EXACT 6 WORD")
          PY

      - name: Collect evidence
        shell: bash
        run: |
          cp __batch05_remediation_report.json __render_qa_batch05/
          cp __baseline_encoding_report.json __render_qa_batch05/

      - name: Upload Batch 05 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-05-authority-remediation-evidence
          path: __render_qa_batch05
          retention-days: 1

      - name: Commit Batch 05 and remove temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch05 __temp/__pycache__ __batch05_remediation_report.json __baseline_encoding_report.json
          git rm __temp/batch_05_authority_remediation.py .github/workflows/batch-05-authority-remediation.yml
          git config user.name "acpos-word-batch-05"
          git config user.email "actions@users.noreply.github.com"
          git add           "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"           "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx"           "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git commit -m "docs(acpos): close 34 authority-backed binding gaps"
          git push
