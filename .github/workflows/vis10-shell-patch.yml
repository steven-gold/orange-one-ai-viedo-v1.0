name: VIS-10 shared admin shell patch
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-shell-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Apply shared shell patch
        run: python3 .acpos-temp/vis10-shell.py
      - name: Sanity checks
        run: |
          grep -q 'surface?: "front" | "admin"' src/components/shell/AppShell.tsx
          grep -q 'ADMIN-NAV-01' src/components/shell/AppShell.tsx
          grep -q 'href: "/admin/system"' src/components/shell/AppShell.tsx
          grep -q 'global.header.admin' src/i18n/catalog.ts
          grep -q 'account-popover' src/app/globals.css
      - name: Commit exact files and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add src/components/shell/AppShell.tsx src/i18n/catalog.ts src/app/globals.css
          git commit -m "feat(vis10): add shared admin shell surface and frontend admin entry"
          git rm .acpos-temp/vis10-shell.py .github/workflows/vis10-shell-patch.yml
          git commit -m "chore(vis10): remove temporary shared shell patch tools"
          git push origin HEAD:acpos-vis10-staging
