authority:
  id: ACPOS_PRODUCTION_DEPLOYMENT_EXECUTION_POLICY_FINAL_LOCKED_V1.0
  status: FINAL_LOCKED
  current_only: true
  revision: 2026-09-07-MAIN-ONLY-VERCEL-DEPLOYMENT
  purpose: Prevent construction commits from consuming Vercel deployment quota and enforce one validated Production release.

branch_policy:
  construction_branch: new
  production_release_branch: main
  direct_construction_on_main: FORBIDDEN
  empty_commit_for_redeploy: FORBIDDEN
  repeated_redeploy_for_status_polling: FORBIDDEN

vercel_git_policy:
  automatic_deployment:
    wildcard: false
    main: true
  source_of_truth: vercel.json
  required_config:
    git:
      deploymentEnabled:
        "*": false
        main: true
  effect:
    new: NO_VERCEL_DEPLOYMENT
    main: PRODUCTION_DEPLOYMENT_ALLOWED
  preview_builds_for_construction: FORBIDDEN

release_sequence:
  - Continue all implementation on new.
  - Run ACPOS Release Gate on the exact final new head.
  - Do not merge if the exact final new head is not PASS.
  - Create one release PR from new to main.
  - Merge with expected exact head SHA.
  - Allow Vercel to deploy the resulting main SHA once.
  - Require GitHub Vercel status success for the exact main SHA.
  - Require ACPOS Post Deploy Smoke success for the exact deployed main SHA.
  - Only then update Production acceptance state.

quota_policy:
  plan_aware: true
  hobby_build_rate_limit_must_not_be_consumed_by_construction_commits: true
  quota_exhaustion_behavior: BLOCK_DEPLOYMENT_ONLY
  construction_may_continue_on_new: true
  do_not_push_retry_commits_while_rate_limited: true

evidence_policy:
  release_gate_is_not_production_deployment: true
  merge_is_not_production_deployment: true
  vercel_success_is_not_post_deploy_acceptance: true
  production_completion_requires:
    - exact main SHA
    - Vercel deployment success
    - health/readiness
    - Post Deploy HTTP acceptance
    - authenticated acceptance where configured
    - browser acceptance
    - gate-specific Production runtime evidence

queue_recovery_schedule:
  platform: Vercel Hobby
  native_cron_role: DAILY_RECOVERY_ONLY
  schedule: "0 0 * * *"
  primary_queue_acceptance: AUTHENTICATED_ON_DEMAND_RUNTIME
  cron_secret_requirement: REQUIRED_WHEN_NATIVE_RECOVERY_CRON_IS_ENABLED

forbidden:
  - Enable Vercel Preview for new.
  - Deploy every construction commit.
  - Push empty commits to escape a Vercel quota window.
  - Treat a skipped or rate-limited deployment as Production success.
  - Treat Release Gate success as deployed Production evidence.
