name: Mother Spec Neutrality Empty Section Diagnostic
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/mother-spec-neutrality-empty-section-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: python3 -m pip install pyyaml
      - name: Materialize same neutral candidate and print exact empty section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml,re
          wf=Path('.github/workflows/mother-spec-neutrality-promotion.yml')
          text=wf.read_text(encoding='utf-8')
          anchor="              text=re.sub(r'\\b11 stages\\b','selected-profile step set',text,flags=re.I)\n"
          if anchor not in text: raise SystemExit('NORMALIZER_ANCHOR_NOT_FOUND')
          text=text.replace(anchor,anchor+
              "              text=re.sub(r'\\b11[- ]?stage\\b','selected-profile step set',text,flags=re.I)\n"+
              "              text=re.sub(r'\\bexactly eleven ordered stages\\b','profile-defined ordered steps',text,flags=re.I)\n"+
              "              text=re.sub(r'\\bfixed lifecycle\\b','selected execution profile',text,flags=re.I)\n",1)
          old="'registry':'governance/specifications/REGISTRY.yaml'"; new="'registry_ref':'governance/specifications/REGISTRY.yaml'"
          if old not in text: raise SystemExit('ROOT_REGISTRY_PROJECTION_ANCHOR_NOT_FOUND')
          text=text.replace(old,new,1)
          d=yaml.safe_load(text)
          step=next(s for s in d['jobs']['promote']['steps'] if s.get('name')=='Materialize neutral portable governance candidate')
          subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          p=Path('.github/governance-source/active/source/12_DOCS/mother-spec/01_BLUEPRINT_DESIGN_GOVERNANCE.md')
          t=p.read_text(encoding='utf-8')
          anchors=list(re.finditer(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',t))
          empties=[]
          for i,m in enumerate(anchors):
              end=anchors[i+1].start() if i+1<len(anchors) else len(t)
              body=t[m.end():end]
              nonblank=[x for x in body.splitlines() if x.strip()]
              if len(nonblank)<2:
                  uid=m.group(1); empties.append(uid)
                  print('EMPTY_UID='+uid)
                  print('--- CANDIDATE BODY BEGIN ---')
                  print(body)
                  print('--- CANDIDATE BODY END ---')
                  # Print predecessor body for semantic disposition review.
                  orig=subprocess.check_output(['git','show','HEAD:'+str(p)],text=True)
                  oa=list(re.finditer(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',orig))
                  for j,om in enumerate(oa):
                      if om.group(1)==uid:
                          oe=oa[j+1].start() if j+1<len(oa) else len(orig)
                          print('--- PREDECESSOR BODY BEGIN ---')
                          print(orig[om.end():oe])
                          print('--- PREDECESSOR BODY END ---')
                          break
                  # Print immediate neighbor UIDs/titles for duplicate/responsibility analysis.
                  idx=i
                  for k in range(max(0,idx-2),min(len(anchors),idx+3)):
                      a=anchors[k]; e=anchors[k+1].start() if k+1<len(anchors) else len(t)
                      lines=[x.strip() for x in t[a.end():e].splitlines() if x.strip()][:3]
                      print('NEIGHBOR',k-idx,a.group(1),repr(lines))
          print('EMPTY_COUNT='+str(len(empties)))
          if len(empties)!=1: raise SystemExit('EXPECTED_ONE_EMPTY_SECTION')
          PY
