schema_version: 1
artifact_uid: GOV-COMP-LAYER-SEPARATION-PORTABILITY
artifact_type: GOVERNANCE_SPECIFICATION_COMPONENT
normative_status: ACTIVE_CURRENT_GOVERNANCE_COMPONENT
formal_current_authority: true
layer_classification: POLICY
common_scope: ALL_ADOPTING_SYSTEMS
layer_model:
  POLICY:
    may_define:
    - SEMANTIC_INVARIANT
    - AUTHORITY_BOUNDARY
    - APPLICABILITY
    - EVIDENCE_REQUIREMENT
    - CLOSURE_CONDITION
    - FAIL_CLOSED_BEHAVIOR
    may_not_define:
    - PROJECT_FIXED_STEP_IDENTITY
    - PROJECT_FIXED_STEP_COUNT
    - RUN_OR_ATTEMPT_ID
    - RETRY_ROUND_ID
    - WORKFLOW_PATH
    - TEST_SCRIPT_NAME
    - PROVIDER_SPECIFIC_PATH
  EXECUTION_PROFILE:
    may_define:
    - PROJECT_STEP_UID
    - STEP_NAME
    - ORDER_OR_DAG
    - CONCURRENCY
    - INPUT_OUTPUT_BINDING
    - PROFILE_LOCAL_DENOMINATOR
    global_normative_authority: false
    may_weaken_policy: false
  RUN_STATE:
    normative_authority: false
  IMPLEMENTATION:
    normative_authority: false
  HISTORICAL_EVIDENCE:
    normative_authority: false
promotion_contamination_guard:
  fixed_profile_step_identity_in_policy: BLOCK
  fixed_profile_step_count_in_policy: BLOCK
  run_attempt_retry_identity_in_policy: BLOCK
  workflow_or_test_path_in_policy: BLOCK_UNLESS_EXPLICIT_NON_NORMATIVE_REFERENCE
  test_result_promoted_as_policy_without_generalization: BLOCK
  profile_data_promoted_as_global_policy: BLOCK
authority_consistency:
  current_manifest_component_must_self_declare_formal_current_authority: true
  active_test_component_in_current_manifest: BLOCK
  one_canonical_rule_owner_per_semantic_rule: true
  duplicate_or_contradictory_active_rule_owner: BLOCK
  superseded_active_residual: BLOCK
portability:
  minimum_synthetic_execution_profiles: 2
  profiles_must_have_materially_different_step_names: true
  profiles_must_have_materially_different_step_counts: true
  common_policy_may_change_between_profiles: false
  profile_local_denominator_must_close_completely: true
promotion_projection_atomicity:
  active_consumer_inventory_required: true
  stale_predecessor_governance_pin_scan_required: true
  registry_manifest_current_policy_update_same_transaction: true
  source_identity_and_external_trust_projection_update_same_transaction: true
  first_clean_restart_may_discover_preexisting_projection_staleness: false
  discovered_projection_staleness_after_successful_promotion_classification: PROMOTION_ATOMICITY_DEFECT
  timeout_or_skipped_consumer_validation_may_count_as_pass: false
