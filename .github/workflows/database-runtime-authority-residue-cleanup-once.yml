name: ACPOS Database Runtime Authority Residue Cleanup Once

on:
  push:
    branches: [new]
    paths:
      - .github/workflows/database-runtime-authority-residue-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove superseded migration snapshots from Current DB runtime contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='authority/runtime/ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(/^  revision:.*$/m,'  revision: 2026-09-11-MIGRATION-TRUTH-EXTERNALIZED');
          s=s.replace('  - Bind register() to @neondatabase/serverless against wild-wave after 0001-0015 applied','  - Bind register() to @neondatabase/serverless against wild-wave only after Current Database Migration Authority and checksum manifest validation pass');
          const bootstrap=/bootstrap:\n[\s\S]*?\nrequired_schema:/;
          if(!bootstrap.test(s)) throw new Error('bootstrap/required_schema anchor missing');
          s=s.replace(bootstrap,`bootstrap:\n  driver_binding_requirement: DATABASE_DRIVER_MUST_BIND_BEFORE_READINESS\n  package_json_dependency: REQUIRED\n  identity_guard: NEON_PROJECT_ID must equal wild-wave-25661146\n  migration_guard: CURRENT_DATABASE_MIGRATION_AUTHORITY_AND_CHECKSUM_MANIFEST_MUST_PASS\n  production_ready_claim_allowed_from_this_contract_alone: false\nrequired_schema:`);
          const required=/required_schema:\n[\s\S]*?\nforbidden:/;
          if(!required.test(s)) throw new Error('required_schema block missing');
          s=s.replace(required,`required_schema:\n  authority_path: authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml\n  migration_root: database/migrations/\n  checksum_manifest: database/migrations/migration_checksum_manifest.yaml\n  mutable_migration_count_embedded: false\n  historical_execution_state_embedded: false\n  target: wild-wave-25661146 / neondb / PG 18 / br-shy-cherry-auiol4oy\nforbidden:`);
          s=s.replace('  - Drop or skip 0001-0015 because the tiny-dust project is gone','  - Drop, skip, reorder, or infer application of any migration outside Current Database Migration Authority and checksum validation');
          s=s.replace('  - Claim wild-wave schema complete from tiny-dust COMPLETE','  - Claim target schema completeness from another project, branch, historical snapshot, or stale migration count');
          fs.writeFileSync(p,s);
          NODE
          cat > tests/release/database-runtime-authority-current-truth.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const p="authority/runtime/ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml";
          const s=await readFile(p,"utf8");
          test("Current production DB runtime contract delegates mutable migration truth",()=>{
            assert.match(s,/authority_path: authority\/global\/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1\.0\.yaml/);
            assert.match(s,/checksum_manifest: database\/migrations\/migration_checksum_manifest\.yaml/);
            assert.match(s,/mutable_migration_count_embedded: false/);
            assert.match(s,/historical_execution_state_embedded: false/);
            assert.doesNotMatch(s,/exact_migrations:\s*15/);
            assert.doesNotMatch(s,/schema_migration_history must contain 15 rows/);
            assert.doesNotMatch(s,/chain:\s*0001-0015/);
            assert.doesNotMatch(s,/tiny_dust_complete_record:/);
            assert.doesNotMatch(s,/NEON_DRIVER_BOUND_UI_PROJECTION_NOT_BOUND/);
          });
          TEST
      - name: Validate DB authority separation
        run: |
          set -euo pipefail
          ! grep -q "exact_migrations: 15\|schema_migration_history must contain 15 rows\|chain: 0001-0015\|tiny_dust_complete_record\|NEON_DRIVER_BOUND_UI_PROJECTION_NOT_BOUND" authority/runtime/ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml
          grep -q "mutable_migration_count_embedded: false" authority/runtime/ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Commit clean tree without one-shot
        run: |
          set -euo pipefail
          git rm .github/workflows/database-runtime-authority-residue-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authority/runtime/ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml tests/release/database-runtime-authority-current-truth.test.mjs
          git commit -m "chore: externalize database migration execution truth"
          git push origin HEAD:new
