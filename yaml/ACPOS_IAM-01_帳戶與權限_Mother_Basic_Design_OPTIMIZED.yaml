document:
  paragraphs:
  - index: 0
    style: Normal
    text: 本版沿用既有 IAM-01 單頁帳戶與權限規劃，補齊母規範要求的完整產品設計、Business Entity × Operation、功能鏈、權限實體化、Identity/Permission Security、跨頁導航刷新、Partial Apply Recovery、Visual Geometry、A11y
      與驗收規格。
  - index: 1
    style: Normal
    text: 核心原則：帳號管理者只設定前台 9 L1 與後台 9 L1；L1 是設定體驗，不是 Runtime inheritance。套用前必須展開成精確 Resource / Action Assignment、做影響預覽、人工確認，再明確 Assign / Revoke。
  - index: 3
    style: Normal
    text: 圖 1｜IAM-01 優化後主工作區：帳號目錄與同頁 3-Step 新增／編輯流程。
  - index: 4
    style: Heading 1
    text: 1. Page Identity / 頁面定位與產品目標
  - index: 6
    style: Heading 1
    text: 2. Scope / 角色、需求、Out-of-Scope 與非功能要求
  - index: 8
    style: Heading 1
    text: 3. Business Entity Inventory / 業務實體清單
  - index: 10
    style: Heading 1
    text: 4. Entity Hierarchy / Owner 與資料責任邊界
  - index: 12
    style: Heading 1
    text: 5. Business Entity × Applicable Operation Matrix
  - index: 15
    style: Normal
    text: Legend：R = REQUIRED、O = OPTIONAL、N = NOT_APPLICABLE。任何新增正式 Entity、Operation 或 effectful control 都必須先證明現有 Owner / Runtime 無法合法承接，才可進入新增評估。
  - index: 16
    style: Heading 1
    text: 6. Functional Admission / 單一 IAM 與功能必要性規則
  - index: 18
    style: Heading 1
    text: 7. Primary User Journey / 新增與編輯的連續流程
  - index: 20
    style: Heading 1
    text: 8. Layout System / Grid、Geometry 與資訊密度
  - index: 22
    style: Heading 1
    text: 9. Section Registry
  - index: 24
