name: Blueprint Traceability Governance Promotion
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - '.github/governance-maintenance/BLUEPRINT_TRACEABILITY_PRECHECK_TRIGGER'
      - '.github/governance-maintenance/BLUEPRINT_TRACEABILITY_PROMOTE_TRIGGER'
permissions:
  contents: write
jobs:
  blueprint-traceability-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - name: Execute governance precheck or promotion
        shell: bash
        run: |
          gzip -dc .github/governance-maintenance/promote_blueprint_traceability_governance.py.gz > .github/governance-maintenance/promote_blueprint_traceability_governance.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/governance-maintenance/promote_blueprint_traceability_governance.py')
          s=p.read_text(encoding='utf-8')
          old_ref="    if 'governance_revision' in ref: ref['governance_revision']=NEW_SOURCE_REV\n"
          new_ref="""    bt_ref=ref.setdefault('blueprint_type_identities',[])\n    if not any((x or {}).get('blueprint_type_uid')=='BPTYPE-GOV-007' for x in bt_ref):\n        bt_ref.append({'blueprint_type_uid':'BPTYPE-GOV-007','canonical_name':'CONSTRUCTION_BLUEPRINT_PACKAGE','planning_domain':'NON_OWNING_BINDING','created_stage_uid':'STAGE-04'})\n    if 'governance_revision' in ref: ref['governance_revision']=NEW_SOURCE_REV\n"""
          sem_anchor="    sem['content_hash']=hobj(sem)\n"
          sem_insert="""    bt_sem=sem['semantic_snapshot'].setdefault('blueprint_type_identities',[])\n    if not any((x or {}).get('blueprint_type_uid')=='BPTYPE-GOV-007' for x in bt_sem):\n        bt_sem.append({'blueprint_type_uid':'BPTYPE-GOV-007','canonical_name':'CONSTRUCTION_BLUEPRINT_PACKAGE','planning_domain':'NON_OWNING_BINDING','created_stage_uid':'STAGE-04'})\n    sem['content_hash']=hobj(sem)\n"""
          if s.count(old_ref)!=1:
              raise SystemExit('PATCH_REF_ANCHOR_COUNT='+str(s.count(old_ref)))
          if s.count(sem_anchor)!=1:
              raise SystemExit('PATCH_SEM_CONTENT_HASH_ANCHOR_COUNT='+str(s.count(sem_anchor)))
          p.write_text(s.replace(old_ref,new_ref,1).replace(sem_anchor,sem_insert,1),encoding='utf-8')
          PY
          if [ -f .github/governance-maintenance/BLUEPRINT_TRACEABILITY_PROMOTE_TRIGGER ]; then
            python .github/governance-maintenance/promote_blueprint_traceability_governance.py --mode promote
          else
            python .github/governance-maintenance/promote_blueprint_traceability_governance.py --mode precheck
          fi
