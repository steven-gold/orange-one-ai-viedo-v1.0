name: ACPOS Fix Gate25 ERP Readonly Harness Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/fix-gate25-erp-readonly-harness-once.yml'

permissions:
  contents: write

jobs:
  fix-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Fix Playwright module resolution without changing ERP product code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gate25-production-erp-readonly-ledger-sync-once.yml')
          s=p.read_text()
          old1='cat > "$RUNNER_TEMP/erp-readonly.mjs" <<\'NODE\''
          new1='cat > "scripts/.gate25-erp-readonly-temp.mjs" <<\'NODE\''
          old2='node "$RUNNER_TEMP/erp-readonly.mjs" | tee "$RUNNER_TEMP/erp-readonly.log"'
          new2='node scripts/.gate25-erp-readonly-temp.mjs | tee "$RUNNER_TEMP/erp-readonly.log"\n          rm -f scripts/.gate25-erp-readonly-temp.mjs'
          assert s.count(old1)==1, 'ERP temp script creation line not found exactly once'
          assert s.count(old2)==1, 'ERP temp script execution line not found exactly once'
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
          git diff --check
          grep -F 'scripts/.gate25-erp-readonly-temp.mjs' .github/workflows/gate25-production-erp-readonly-ledger-sync-once.yml
      - name: Commit harness fix and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gate25-production-erp-readonly-ledger-sync-once.yml
          git rm .github/workflows/fix-gate25-erp-readonly-harness-once.yml
          git commit -m 'fix(gate25): resolve ERP readonly Playwright from repository'
          git push origin HEAD:new
