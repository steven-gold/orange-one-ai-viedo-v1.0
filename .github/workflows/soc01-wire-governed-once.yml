name: SOC01 governed wiring
on:
  push:
    paths:
      - '.github/workflows/soc01-wire-governed-once.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize authority bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          src=Path('authority/pages/admin/SOC-01/ACPOS_SOC-01_SOCIAL_PUBLISHING_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          controls=src.split('\ncontrols:\n',1)[1].split('\nactions:\n',1)[0]
          actions=src.split('\nactions:\n',1)[1]
          effects={}
          cur=None
          for line in actions.splitlines():
              m=re.match(r'- action_uid:\s*(\S+)',line)
              if m:cur=m.group(1);continue
              if cur:
                  m=re.match(r'  effect_type:\s*(\S+)',line)
                  if m:effects[cur]=m.group(1)
          rows=[];cur=None
          for line in controls.splitlines():
              m=re.match(r'- control_uid:\s*(\S+)',line)
              if m:
                  if cur:rows.append(cur)
                  cur={'control_uid':m.group(1)};continue
              if cur:
                  m=re.match(r'  (action_uid|gate_uid|permission_uid):\s*(\S+)',line)
                  if m:cur[m.group(1)]=m.group(2)
          if cur:rows.append(cur)
          if len(rows)!=67:raise SystemExit(f'expected 67 controls got {len(rows)}')
          for r in rows:
              for k in ('action_uid','gate_uid'):
                  if k not in r:raise SystemExit(f'missing {k}: {r}')
              r.setdefault('permission_uid','SOC-01-PERM-READ')
              r['effect_type']=effects.get(r['action_uid'],'REGISTERED_READ')
          out='export type SocControlBinding={action_uid:string;gate_uid:string;permission_uid:string;effect_type:string};\n'
          out+='export const SOC_CONTROL_BINDINGS='+json.dumps({r['control_uid']:{k:r[k] for k in ('action_uid','gate_uid','permission_uid','effect_type')} for r in rows},ensure_ascii=False,separators=(',',':'))+' as const satisfies Record<string,SocControlBinding>;\n'
          out+='export type SocControlUid=keyof typeof SOC_CONTROL_BINDINGS;\nexport const SOC_CONTROL_BINDING_COUNT=Object.keys(SOC_CONTROL_BINDINGS).length;\n'
          Path('src/domain/social/socControlBindings.ts').write_text(out)
          PY
      - name: Wire existing social visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/SocVisual.tsx');s=p.read_text()
          anchor='import { socControlLabel, socText } from "@/i18n/socCatalog";\n'
          ins='import { SocGovernedButton, SocRuntimeProvider, SocValue, useSocGate, useSocRuntimeState } from "./SocControlRuntime";\n'
          if ins not in s:s=s.replace(anchor,anchor+ins,1)
          a=s.find('const EMPTY_VISUAL_STATE = {')
          if a>=0:
              b=s.find('} as const;\n\n',a)
              if b<0:raise SystemExit('empty state end missing')
              s=s[:a]+s[b+12:]
          s=s.replace('export function SocVisual() {','function SocVisualBody() {',1)
          hook='''  const { locale } = useI18n();\n  const [activeStage, setActiveStage] = useState<StageKey>("platform");'''
          newhook='''  const { locale } = useI18n();\n  const { projection, runtimeError } = useSocRuntimeState();\n  const [activeStage, setActiveStage] = useState<StageKey>("platform");'''
          if hook not in s:raise SystemExit('SOC hook anchor missing')
          s=s.replace(hook,newhook,1)
          start=s.index('  const actionVisible = (action: ActionDef) => {')
          end=s.index('\n\n  return (',start)
          visible='''  const actionVisible = (action: ActionDef) => {\n    if (!action.conditional) return true;\n    const gateByControl: Record<string,string> = {\n      "SOC-01-BTN-PLATFORM-CONFIG":"SOC-01-GATE-PLATFORM-CONFIG",\n      "SOC-01-BTN-KILL":"SOC-01-GATE-KILL",\n      "SOC-01-BTN-CREDENTIAL-REVEAL":"SOC-01-GATE-CREDENTIAL",\n      "SOC-01-BTN-ACCOUNT-UNBIND":"SOC-01-GATE-ACCOUNT",\n      "SOC-01-BTN-TARGET-JOIN":"SOC-01-GATE-TARGET-JOIN",\n      "SOC-01-BTN-MANUAL-COMPLETE":"SOC-01-GATE-MANUAL",\n      "SOC-01-BTN-CANDIDATE-DECIDE":"SOC-01-GATE-CANDIDATE",\n    };\n    const gate = gateByControl[action.id];\n    return gate ? projection?.gate_state[gate] === true : false;\n  };'''
          s=s[:start]+visible+s[end:]
          s=s.replace('data-page-state="VISUAL_ONLY_NO_BUSINESS_DATA"','data-page-state={runtimeError?"ERROR":projection?.page_state??"READ_ONLY"}',1)
          s=s.replace('<div className={styles.contextCell} data-control-id="SOC-01-FLD-CONTEXT"><span>{label("SOC-01-FLD-CONTEXT")}</span><strong>—</strong></div>','<div className={styles.contextCell} data-control-id="SOC-01-FLD-CONTEXT"><span>{label("SOC-01-FLD-CONTEXT")}</span><strong><SocValue controlId="SOC-01-FLD-CONTEXT"/></strong></div>',1)
          s=s.replace('<div className={styles.contextCell} data-control-id="SOC-01-FLD-CURRENT-STATE"><span>{label("SOC-01-FLD-CURRENT-STATE")}</span><strong>—</strong></div>','<div className={styles.contextCell} data-control-id="SOC-01-FLD-CURRENT-STATE"><span>{label("SOC-01-FLD-CURRENT-STATE")}</span><strong><SocValue controlId="SOC-01-FLD-CURRENT-STATE"/></strong></div>',1)
          old='''          <button key={item.key} type="button" className={`${styles.stageButton} ${activeStage === item.key ? styles.stageActive : ""}`} data-control-id={item.tabId} aria-pressed={activeStage === item.key} onClick={() => setActiveStage(item.key)}>\n            {item.code} · {label(item.tabId)}\n          </button>'''
          new='''          <SocGovernedButton key={item.key} className={`${styles.stageButton} ${activeStage === item.key ? styles.stageActive : ""}`} controlId={item.tabId} onUiClick={() => setActiveStage(item.key)}>\n            {item.code} · {label(item.tabId)}\n          </SocGovernedButton>'''
          if old not in s:raise SystemExit('stage button anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('<input id={stage.searchId} className={styles.searchInput} data-control-id={stage.searchId} placeholder={t("searchPlaceholder")} disabled />','<input id={stage.searchId} className={styles.searchInput} data-control-id={stage.searchId} placeholder={t("searchPlaceholder")} disabled={!useSocGate(stage.key === "records" ? "SOC-01-GATE-RECORDS" : "SOC-01-GATE-READ")} />',1)
          s=s.replace('<div className={styles.value}>—</div>','<div className={styles.value}><SocValue controlId={controlId}/></div>',1)
          old='''                  <button key={action.id} type="button" data-control-id={action.id} className={action.primary ? styles.primaryButton : action.danger ? styles.dangerButton : styles.secondaryButton} disabled>\n                    {label(action.id)}\n                  </button>'''
          new='''                  <SocGovernedButton key={action.id} controlId={action.id} className={action.primary ? styles.primaryButton : action.danger ? styles.dangerButton : styles.secondaryButton}>\n                    {label(action.id)}\n                  </SocGovernedButton>'''
          if old not in s:raise SystemExit('action button anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('<div className={styles.railRow} data-control-id="SOC-01-FLD-BLOCKERS"><span>{label("SOC-01-FLD-BLOCKERS")}</span><strong>—</strong></div>','<div className={styles.railRow} data-control-id="SOC-01-FLD-BLOCKERS"><span>{label("SOC-01-FLD-BLOCKERS")}</span><strong><SocValue controlId="SOC-01-FLD-BLOCKERS"/></strong></div>',1)
          s=s.replace('<button className={`${styles.secondaryButton} ${styles.detailButton}`} type="button" data-control-id="SOC-01-BTN-DETAIL" disabled>{label("SOC-01-BTN-DETAIL")}</button>','<SocGovernedButton className={`${styles.secondaryButton} ${styles.detailButton}`} controlId="SOC-01-BTN-DETAIL">{label("SOC-01-BTN-DETAIL")}</SocGovernedButton>',1)
          s=s.replace('<p className={styles.railNote}>{t("visualPhase")}</p>','<p className={styles.railNote}>{runtimeError??projection?.page_state??t("noRealData")}</p>',1)
          if 'export function SocVisual(){return <SocRuntimeProvider><SocVisualBody/></SocRuntimeProvider>}' not in s:s=s.rstrip()+'\n\nexport function SocVisual(){return <SocRuntimeProvider><SocVisualBody/></SocRuntimeProvider>}\n'
          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          node - <<'NODE'
          const fs=require('fs');const b=fs.readFileSync('src/domain/social/socControlBindings.ts','utf8'),v=fs.readFileSync('src/components/pages/SocVisual.tsx','utf8'),r=fs.readFileSync('src/components/pages/SocControlRuntime.tsx','utf8');
          const ids=[...b.matchAll(/"(SOC-01-[^"]+)":\{/g)].map(x=>x[1]);if(ids.length!==67||new Set(ids).size!==67)throw new Error(`expected 67 controls got ${ids.length}/${new Set(ids).size}`);
          if(v.includes('EMPTY_VISUAL_STATE')||v.includes('VISUAL_ONLY_NO_BUSINESS_DATA'))throw new Error('fixed visual state remains');
          for(const gate of ['SOC-01-GATE-PLATFORM-CONFIG','SOC-01-GATE-KILL','SOC-01-GATE-CREDENTIAL','SOC-01-GATE-ACCOUNT','SOC-01-GATE-TARGET-JOIN','SOC-01-GATE-MANUAL','SOC-01-GATE-CANDIDATE'])if(!v.includes(gate))throw new Error(`conditional gate missing ${gate}`);
          if(!r.includes('SOC_COMMAND_RUNTIME_NOT_BOUND'))throw new Error('fail-closed command boundary missing');
          if(r.includes('/v1/social')||r.includes('/v1/publish'))throw new Error('renderer directly binds platform endpoint');
          NODE
          test "$(git hash-object src/components/pages/SocVisual.module.css)" = "d7acba435f9a8a9836a946d6d8af250f99b7de3a"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/soc01-wire-governed-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/social src/components/pages/SocControlRuntime.tsx src/components/pages/SocVisual.tsx .github/workflows/soc01-wire-governed-once.yml
          git commit -m "wire(soc): replace fixed social state with governed gates"
          git push origin HEAD:new
