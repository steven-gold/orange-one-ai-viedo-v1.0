name: VIS-09 progress sync
# retry with external script
on:
  push:
    branches:
      - acpos-vis09-staging
    paths:
      - .github/workflows/vis09-progress-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis09-staging
      - name: Update construction truth tracker
        run: python3 scripts/vis09_progress_sync.py
      - name: Validate progress YAML
        run: ruby -e 'require "yaml"; YAML.load_file("docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml"); puts "PROGRESS YAML PASS"'
      - name: Commit and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "docs(vis09): synchronize construction truth through INFO"
          git rm .github/workflows/vis09-progress-sync.yml scripts/vis09_progress_sync.py
          git commit -m "chore(vis09): remove progress sync tools"
          git push origin HEAD:acpos-vis09-staging
