  canonical-preflight-calibration:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'wire canonical preflight calibration') }}
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove Current governance identity and full-line gate before common-engine mutation
        run: |
          python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
          python governance/ci/governance_resolver.py
          python governance/ci/validate_canonical_rule_registry.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
      - name: Synchronize derived active-consumer report before preflight write-set
        shell: bash
        run: |
          set -euo pipefail
          report='governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json'
          unexpected="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | grep -v "^$report$" || true)"
          test -z "$unexpected" || { printf 'BLOCK: unexpected pre-preflight validator delta\n%s\n' "$unexpected" >&2; exit 1; }
          if [ -n "$(git status --porcelain=v1 --untracked-files=all -- "$report")" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$report"
            test "$(git diff --cached --name-only)" = "$report" || { echo 'BLOCK: active-consumer report commit is not isolated' >&2; exit 1; }
            git commit -m 'test(governance): refresh active consumer integrity before core preflight'
            git push origin HEAD:rebuild-v2.1.1
            python governance/ci/validate_active_consumer_reference_integrity.py
            git diff --exit-code -- "$report"
            python governance/ci/validate_selected_execution_profile_integrity.py
            python governance/ci/validate_stage02_state_integrity.py
            python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
          else
            echo 'PASS: active-consumer report already current; no synchronization commit required'
          fi
      - name: Materialize and validate the one canonical Stage-02 preflight
        run: |
          python governance/ci/compile_stage_execution_preflight.py --materialize
          python governance/ci/compile_stage_execution_preflight.py --check
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          evidence=json.loads(Path('governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json').read_text())
          if int(evidence.get('closure_blocker_total') or 0)==0:
              subprocess.run(['python','governance/ci/validate_current_stage2_required_outputs.py'],check=True)
              print('PASS: full required-output validation applicable and passed')
          else:
              print(f"PASS: first canonical preflight materialization; full required-output validation deferred while structural_closure_blockers={evidence.get('closure_blocker_total')}")
          PY
      - name: Prove generated delta is authorized first-materialization or reconciliation persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          base = Path('00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT')
          names = [
              'REQUIRED_FIELD_MANIFEST',
              'FUNCTIONAL_CHAIN_MANIFEST',
              'EFFECTIVE_CONTRACT_OVERLAY',
              'DEPENDENCY_TOPOLOGY',
              'DENOMINATOR_SNAPSHOT',
              'CLASSIFICATION_RULESET',
              'CHANGE_IMPACT_MAP',
              'STAGE_EXECUTION_PREFLIGHT_RECEIPT',
              'CURRENT_PROBLEM_REGISTER',
              'RESOLUTION_LEDGER',
              'GOVERNANCE_EXECUTION_CONTEXT_RECEIPT',
              'EXECUTION_CYCLE_PREFLIGHT_RECEIPT',
          ]
          expected = sorted((base / f'{name}.yaml').as_posix() for name in names)
          missing = [path for path in expected if not Path(path).is_file()]
          assert not missing, {'missing_canonical_outputs': missing}
          tracked = []
          for path in expected:
              probe = subprocess.run(['git', 'ls-files', '--error-unmatch', path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if probe.returncode == 0:
                  tracked.append(path)
          status = subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all'], text=True)
          actual = sorted(line[3:] for line in status.splitlines() if line.strip())
          unexpected = sorted(set(actual) - set(expected))
          assert not unexpected, {'unexpected_generated_delta': unexpected, 'authorized': expected}
          assert actual, {'error': 'canonical preflight materialization produced no persistence delta'}
          if not tracked:
              assert actual == expected, {'mode': 'FIRST_MATERIALIZATION', 'expected': expected, 'actual': actual}
              mode = 'FIRST_MATERIALIZATION'
          else:
              assert len(tracked) == len(expected), {'error': 'partial_preexisting_canonical_persistence_set', 'tracked': tracked, 'expected': expected}
              assert set(actual).issubset(set(expected)), {'mode': 'RECONCILIATION', 'actual': actual, 'expected': expected}
              mode = 'RECONCILIATION'
          print(f'PASS: authorized canonical preflight persistence delta mode={mode} changed={len(actual)}/12')
          PY
      - name: Persist authorized canonical preflight outputs as an isolated child commit
        shell: bash
        run: |
          set -euo pipefail
          base='00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT'
          files=(
            "$base/REQUIRED_FIELD_MANIFEST.yaml"
            "$base/FUNCTIONAL_CHAIN_MANIFEST.yaml"
            "$base/EFFECTIVE_CONTRACT_OVERLAY.yaml"
            "$base/DEPENDENCY_TOPOLOGY.yaml"
            "$base/DENOMINATOR_SNAPSHOT.yaml"
            "$base/CLASSIFICATION_RULESET.yaml"
            "$base/CHANGE_IMPACT_MAP.yaml"
            "$base/STAGE_EXECUTION_PREFLIGHT_RECEIPT.yaml"
            "$base/CURRENT_PROBLEM_REGISTER.yaml"
