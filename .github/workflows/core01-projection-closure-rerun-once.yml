name: CORE01 projection closure rerun
on:
  push:
    paths:
      - '.github/workflows/core01-projection-closure-rerun-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix existing CORE internal state discriminator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/domain/core/coreClientState.ts'); s=p.read_text()
          old='''  if ("type" in action && action.type === "CORE_INTERNAL_PROJECTION_SYNC") {\n    const next = mergeCoreExactRefs(state, action.refs);\n    if (action.work_item !== undefined) next.work_item = action.work_item;\n    return next;\n  }\n\n  switch (action.action_uid) {'''
          new='''  if ("type" in action) {\n    const next = mergeCoreExactRefs(state, action.refs);\n    if (action.work_item !== undefined) next.work_item = action.work_item;\n    return next;\n  }\n\n  switch (action.action_uid) {'''
          assert old in s
          s=s.replace(old,new,1)
          old_tail='''    case "CORE-01-ACT-REFERENCE-ATTACH": return { ...state, reference_refs: appendUnique(state.reference_refs, action.reference_ref) };\n  }\n}'''
          new_tail='''    case "CORE-01-ACT-REFERENCE-ATTACH": return { ...state, reference_refs: appendUnique(state.reference_refs, action.reference_ref) };\n  }\n  return state;\n}'''
          assert old_tail in s
          s=s.replace(old_tail,new_tail,1)
          p.write_text(s)
          PY
      - name: Patch CORE01 normalized projection boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/CoreVisual.tsx'); s=p.read_text()
          anchor='import { requestCoreLockCommandPayload, type CoreLockCommandKind } from "@/domain/core/coreLockCommandPayloadAdapter";'
          assert anchor in s and 'resolveCoreProjection' not in s
          s=s.replace(anchor,anchor+'\nimport { resolveCoreProjection, type CoreNormalizedProjection } from "@/domain/core/coreProjectionAdapter";',1)

          old='''function EmptyList({ id, labelKey }: ControlProps) {\n  const { t } = useI18n();\n  return <div className={styles.listControl} data-control-id={id} data-action-uid={actionUid(id)}><div className={styles.subheading}>{t(labelKey)}</div><div className={styles.emptyValue}>—</div></div>;\n}'''
          new='''function SelectionList({ id, labelKey, value, options, onChange }: ControlProps & { value: string; options: readonly { value: string; label: string }[]; onChange: (value: string) => void }) {\n  const { t } = useI18n();\n  return <label className={styles.listControl} data-control-id={id} data-action-uid={actionUid(id)}><div className={styles.subheading}>{t(labelKey)}</div><select value={value} onChange={(event) => onChange(event.target.value)} aria-label={t(labelKey)}><option value="">—</option>{options.map((item) => <option key={`${item.value}:${item.label}`} value={item.value}>{item.label}</option>)}</select></label>;\n}'''
          assert old in s; s=s.replace(old,new,1)

          old='''  const [humanDecision, setHumanDecision] = useState("");\n  const [clientState, dispatchClient] = useReducer(reduceCoreClientState, INITIAL_CORE_CLIENT_STATE);\n\n  useEffect(() => {\n    const controller = new AbortController();\n    void readCoreProjection(controller.signal).then((result) => {\n      if (controller.signal.aborted) return;\n      if (result.ok) { setPageState("READY"); setRuntimeReason(null); }\n      else { setPageState("ERROR"); setRuntimeReason(result.reason_code); }\n    });\n    return () => controller.abort();\n  }, []);'''
          new='''  const [humanDecision, setHumanDecision] = useState("");\n  const [clientState, dispatchClient] = useReducer(reduceCoreClientState, INITIAL_CORE_CLIENT_STATE);\n  const [projection, setProjection] = useState<CoreNormalizedProjection | null>(null);\n\n  const applyRawProjection = async (rawProjection: unknown) => {\n    const resolved = await resolveCoreProjection(rawProjection);\n    if (!resolved.ok) {\n      setProjection(null);\n      setPageState("ERROR");\n      setRuntimeReason(`CORE-01-ERR-CONTEXT-001:${resolved.reason_code}`);\n      return false;\n    }\n    setProjection(resolved.projection);\n    dispatchClient({ type: "CORE_INTERNAL_PROJECTION_SYNC", refs: resolved.projection.refs, work_item: resolved.projection.work_item });\n    setPageState("READY");\n    setRuntimeReason(null);\n    return true;\n  };\n\n  useEffect(() => {\n    const controller = new AbortController();\n    void readCoreProjection(controller.signal).then(async (result) => {\n      if (controller.signal.aborted) return;\n      if (!result.ok) { setProjection(null); setPageState("ERROR"); setRuntimeReason(`${result.error_uid}:${result.reason_code}`); return; }\n      await applyRawProjection(result.value);\n    });\n    return () => controller.abort();\n  }, []);'''
          assert old in s; s=s.replace(old,new,1)

          old='''    if (result?.ok) {\n      const projection = await readCoreProjection();\n      if (!projection.ok) reportBlock(`${projection.error_uid}:${projection.reason_code}`);\n    }'''
          new='''    if (result?.ok) {\n      const projectionResult = await readCoreProjection();\n      if (!projectionResult.ok) reportBlock(`${projectionResult.error_uid}:${projectionResult.reason_code}`);\n      else await applyRawProjection(projectionResult.value);\n    }'''
          assert old in s; s=s.replace(old,new,1)

          marker='''  const openContextMenu = (event: ReactMouseEvent<HTMLDivElement>) => { event.preventDefault(); setMenuOpen(true); };'''
          insert='''  const selectProject = (projectId: string) => {\n    if (!projectId) { dispatchClient({ action_uid: "CORE-01-ACT-PROJECT-SELECT", project_ref: null, project_id: null, project_version_ref: null }); return; }\n    const matches = projection?.projects.filter((item) => item.project_id === projectId) ?? [];\n    if (matches.length !== 1) { reportBlock("CORE-01-ERR-CONTEXT-001:PROJECT_PROJECTION_SELECTION_AMBIGUOUS"); return; }\n    const selected = matches[0];\n    dispatchClient({ action_uid: "CORE-01-ACT-PROJECT-SELECT", project_ref: selected.project_id, project_id: selected.project_id, project_version_ref: selected.project_version_ref });\n  };\n  const selectTopic = (topicId: string) => {\n    if (!topicId) { dispatchClient({ action_uid: "CORE-01-ACT-TOPIC-SELECT", topic_ref: null, topic_id: null, topic_version_ref: null }); return; }\n    const matches = projection?.topics.filter((item) => item.topic_id === topicId) ?? [];\n    if (matches.length !== 1) { reportBlock("CORE-01-ERR-TOPIC-LINEAGE-001:TOPIC_PROJECTION_SELECTION_AMBIGUOUS"); return; }\n    const selected = matches[0];\n    dispatchClient({ action_uid: "CORE-01-ACT-TOPIC-SELECT", topic_ref: selected.topic_id, topic_id: selected.topic_id, topic_version_ref: selected.topic_version_ref });\n  };\n\n'''+marker
          assert marker in s; s=s.replace(marker,insert,1)

          old='<label className={styles.selectField}><span>{t("core01.control.project")}</span><select value={clientState.project_id ?? ""} onChange={(event) => dispatchClient({ action_uid: "CORE-01-ACT-PROJECT-SELECT", project_ref: event.target.value || null, project_id: event.target.value || null })} data-control-id="CORE-01-CTL-PROJECT" data-action-uid={actionUid("CORE-01-CTL-PROJECT")} aria-label={t("core01.control.project")}><option value="">—</option></select></label>'
          new='<label className={styles.selectField}><span>{t("core01.control.project")}</span><select value={clientState.project_id ?? ""} onChange={(event) => selectProject(event.target.value)} data-control-id="CORE-01-CTL-PROJECT" data-action-uid={actionUid("CORE-01-CTL-PROJECT")} aria-label={t("core01.control.project")}><option value="">—</option>{(projection?.projects ?? []).map((item) => <option key={`${item.project_id}:${item.project_version_ref ?? ""}`} value={item.project_id}>{item.label}</option>)}</select></label>'
          assert old in s; s=s.replace(old,new,1)

          old='<label className={styles.selectField}><span>{t("core01.control.topic")}</span><select value={clientState.topic_id ?? ""} onChange={(event) => dispatchClient({ action_uid: "CORE-01-ACT-TOPIC-SELECT", topic_ref: event.target.value || null, topic_id: event.target.value || null })} data-control-id="CORE-01-CTL-TOPIC" data-action-uid={actionUid("CORE-01-CTL-TOPIC")} aria-label={t("core01.control.topic")}><option value="">—</option></select></label>'
          new='<label className={styles.selectField}><span>{t("core01.control.topic")}</span><select value={clientState.topic_id ?? ""} onChange={(event) => selectTopic(event.target.value)} data-control-id="CORE-01-CTL-TOPIC" data-action-uid={actionUid("CORE-01-CTL-TOPIC")} aria-label={t("core01.control.topic")}><option value="">—</option>{(projection?.topics ?? []).map((item) => <option key={`${item.topic_id}:${item.topic_version_ref ?? ""}`} value={item.topic_id}>{item.label}</option>)}</select></label>'
          assert old in s; s=s.replace(old,new,1)

          old='<div data-component-uid="CORE-01-CMP-NAV"><EmptyList id="CORE-01-LST-WORK-ITEMS" labelKey="core01.control.work_items" /></div>'
          new='<div data-component-uid="CORE-01-CMP-NAV"><SelectionList id="CORE-01-LST-WORK-ITEMS" labelKey="core01.control.work_items" value={clientState.work_item ?? ""} options={(projection?.work_items ?? []).map((item) => ({ value: item.work_item, label: item.label }))} onChange={(value) => dispatchClient({ action_uid: "CORE-01-ACT-WORK-ITEM-SELECT", work_item: value || null })} /></div>'
          assert old in s; s=s.replace(old,new,1)

          old='<div data-component-uid="CORE-01-CMP-THREADS"><div className={styles.threadHeader}><PanelTitle labelKey="core01.group.conversation_threads" /><ActionButton id="CORE-01-BTN-NEW-THREAD" labelKey="core01.control.new_thread" compact disabled={isBusy} onClick={() => runControl("CORE-01-BTN-NEW-THREAD")} /></div><div className={styles.threadListScroll}><EmptyList id="CORE-01-LST-THREADS" labelKey="core01.control.threads" /></div></div>'
          new='<div data-component-uid="CORE-01-CMP-THREADS"><div className={styles.threadHeader}><PanelTitle labelKey="core01.group.conversation_threads" /><ActionButton id="CORE-01-BTN-NEW-THREAD" labelKey="core01.control.new_thread" compact disabled={isBusy} onClick={() => runControl("CORE-01-BTN-NEW-THREAD")} /></div><div className={styles.threadListScroll}><SelectionList id="CORE-01-LST-THREADS" labelKey="core01.control.threads" value={clientState.conversation_id ?? ""} options={(projection?.threads ?? []).map((item) => ({ value: item.conversation_id, label: item.label }))} onChange={(value) => dispatchClient({ action_uid: "CORE-01-ACT-THREAD-SELECT", thread_ref: value || null, conversation_id: value || null })} /></div></div>'
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Authority contract and visual locks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const core=fs.readFileSync('src/components/pages/CoreVisual.tsx','utf8');
          const state=fs.readFileSync('src/domain/core/coreClientState.ts','utf8');
          for(const x of ['resolveCoreProjection','CORE_INTERNAL_PROJECTION_SYNC','project_version_ref: selected.project_version_ref','topic_version_ref: selected.topic_version_ref','projection?.work_items','projection?.threads']) if(!core.includes(x)) throw new Error('CORE projection closure missing '+x);
          if(!state.includes('if ("type" in action)')) throw new Error('internal projection discriminator not closed');
          if(core.includes('display_values[')) throw new Error('unapproved display_values inference found');
          if(core.includes('wb01-preview-runtime')||core.includes('acpos-preview-drawer')) throw new Error('preview contamination found');
          const adapter=fs.readFileSync('src/domain/core/coreProjectionAdapter.ts','utf8');
          if(!adapter.includes('CORE_PROJECTION_SCHEMA_ADAPTER_NOT_BOUND')) throw new Error('fail-closed resolver boundary missing');
          NODE
          git diff --check
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
          test -z "$(git diff -- src/components/pages/CoreVisual.module.css src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium fail-closed interaction check
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          (npm run start -- -p 3000 >/tmp/core-projection.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/core >/dev/null && break; sleep 1; done
          cat > check.cjs <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage(),posts=[];
            p.on('request',r=>{if(r.method()==='POST')posts.push(r.url())});
            await p.goto('http://127.0.0.1:3000/core',{waitUntil:'networkidle'});
            const root=p.locator('[data-page-uid="CORE-01"]');
            const initial=await root.getAttribute('data-runtime-reason');
            if(!initial||!initial.includes('UI_PROJECTION_RUNTIME_NOT_BOUND')) throw new Error('projection route did not fail closed: '+initial);
            if(await p.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count()!==1) throw new Error('unbound projection invented project options');
            if(await p.locator('[data-control-id="CORE-01-CTL-TOPIC"] option').count()!==1) throw new Error('unbound projection invented topic options');
            await p.locator('[data-control-id="CORE-01-BTN-PROJECT-VALIDATE"]').click();
            await p.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('REQUIRED_PROJECT_VERSION_REF_MISSING'));
            if(posts.length) throw new Error('missing exact ref emitted POST '+posts.join(','));
            console.log('CORE01_PROJECTION_FAIL_CLOSED_PASS posts=0');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
          rm check.cjs
      - name: Commit and self clean
        run: |
          rm -f .github/workflows/core01-projection-closure-rerun-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/core/coreClientState.ts src/components/pages/CoreVisual.tsx .github/workflows/core01-projection-closure-rerun-once.yml
          git commit -m "fix(core): close normalized projection boundary"
          git push origin HEAD:new
