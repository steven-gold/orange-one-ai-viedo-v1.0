name: ACPOS Batch 30 Operation Semantic Placeholder Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch30-operation-placeholder-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 29 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="199b77eee06722b546702214aa64587f46ea3b60"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH29 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 30 placeholder audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch30_operation_semantic_placeholder_audit.py

      - name: Verify Batch 30 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch30_operation_placeholder_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["placeholder_controls"]==3,s
          assert sum(s[k] for k in [
            "exact_uid_owner_real_operation",
            "strong_relation_operation_candidate",
            "operation_relation_conflict",
            "canonical_operation_remediation_required"
          ])==3,s
          print("PASS: BATCH30 PLACEHOLDER OPERATION DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 30 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch30-operation-semantic-placeholder-audit
          path: |
            __batch30_operation_placeholder_audit.json
            __batch30_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 30 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch30_operation_placeholder_audit.json __batch30_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-30-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch30_operation_semantic_placeholder_audit.py .github/workflows/acpos_batch30_operation_placeholder_audit.yml
          git commit -m "chore(acpos): close batch 30 operation placeholder audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH30 HARNESS REMOVED / CLEAN TREE"
