name: ACPOS Batch 37 System03 Persistence Design Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch37-system03-persistence-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 36 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="01343f341271c65d45405c4fb6de0dac96de5339"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH36 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 37 System03 persistence audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch37_system03_persistence_design_audit.py

      - name: Verify Batch 37 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch37_system03_persistence_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["operations"]==4,s
          assert s["owner_paragraph_hits"]+s["owner_table_hits"]>0,s
          print("PASS: BATCH37 SYSTEM03 PERSISTENCE EVIDENCE")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 37 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch37-system03-persistence-design-audit
          path: |
            __batch37_system03_persistence_audit.json
            __batch37_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 37 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch37_system03_persistence_audit.json __batch37_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-37-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch37_system03_persistence_design_audit.py .github/workflows/acpos_batch37_system03_persistence_audit.yml
          git commit -m "chore(acpos): close batch 37 system03 persistence audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH37 HARNESS REMOVED / CLEAN TREE"
