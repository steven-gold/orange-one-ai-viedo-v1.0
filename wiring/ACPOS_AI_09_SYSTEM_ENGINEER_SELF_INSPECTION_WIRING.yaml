- '#': '26'
  Domain: Inspection / Finding
  Normative rule: Finding MUST include exact scope, signature, evidence, owner state and reproducibility。
- '#': '27'
  Domain: Inspection / Finding
  Normative rule: Same signature + same Current scope SHOULD dedupe, not multiply problem denominator。
- '#': '28'
  Domain: Inspection / Finding
  Normative rule: Finding classification MUST separate product gap, governance defect, test defect, evidence
