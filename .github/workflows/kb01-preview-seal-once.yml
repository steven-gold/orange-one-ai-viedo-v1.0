name: KB-01 preview seal once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current new
        uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Build exact current source
        working-directory: source
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install temporary Chromium tooling
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"

      - name: Capture KB-01 isolated page and required assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/kb01-preview-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/kb01-preview-next.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/knowledge -o /tmp/kb01.html; then break; fi
            sleep 1
          done
          test -s /tmp/kb01.html
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const staticPaths=new Set();
            const pageErrors=[]; const failed=[];
            page.on('request',r=>{const u=new URL(r.url()); if(u.pathname.startsWith('/_next/static/')) staticPaths.add(u.pathname);});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:3000/admin/knowledge',{waitUntil:'networkidle'});
            await page.waitForSelector('[data-page-uid="admin:KB-01"][data-page-state="ERROR"]',{timeout:15000});
            for(const view of ['KB-01-VIEW-OVERVIEW','KB-01-VIEW-SOURCE','KB-01-VIEW-SEARCH','KB-01-VIEW-EXPERIENCE','KB-01-VIEW-REVIEW']){
              await page.locator(`[data-view-uid="${view}"]`).click();
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            fs.writeFileSync('/tmp/kb01-static-paths.txt',[...staticPaths].sort().join('\n')+'\n');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          rm -rf /tmp/kb01-assets
          mkdir -p /tmp/kb01-assets
          while IFS= read -r p; do
            test -n "$p" || continue
            src=".next${p#/_next}"
            dst="/tmp/kb01-assets${p}"
            test -f "$src" || { echo "missing static asset: $src" >&2; exit 1; }
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
          done < /tmp/kb01-static-paths.txt
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('/tmp/kb01.html','utf8');
          html=html.replaceAll('href="/_next/static/','href="./kb01-assets/_next/static/')
                   .replaceAll('src="/_next/static/','src="./kb01-assets/_next/static/')
                   .replaceAll('href="/brand/','href="./brand/')
                   .replaceAll('src="/brand/','src="./brand/');
          fs.writeFileSync('/tmp/knowledge-admin.html',html);
          NODE

      - name: Checkout cumulative preview
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          fetch-depth: 0
          path: previewrepo

      - name: Stage only isolated KB-01 preview files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf previewrepo/preview/kb01-assets
          mkdir -p previewrepo/preview/kb01-assets
          cp /tmp/knowledge-admin.html previewrepo/preview/knowledge-admin.html
          cp -R /tmp/kb01-assets/. previewrepo/preview/kb01-assets/
          cd previewrepo
          changed=$(git status --porcelain | awk '{print $2}')
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(preview/knowledge-admin\.html|preview/kb01-assets/)'; then
            echo 'Preview pollution outside KB-01 detected' >&2
            exit 1
          fi

      - name: Validate staged static preview in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo/preview
          python3 -m http.server 4173 > /tmp/kb01-static.log 2>&1 &
          static_pid=$!
          trap 'kill $static_pid || true; cat /tmp/kb01-static.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/knowledge-admin.html >/dev/null; then break; fi
            sleep 1
          done
          cd ../../source
          node <<'NODE'
          const { chromium }=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/knowledge-admin.html',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:KB-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:KB-01"]')?.getAttribute('data-page-state')==='ERROR',{timeout:15000});
            assert.equal(await root.getAttribute('data-section-registry-count'),'16');
            assert.equal(await root.getAttribute('data-component-registry-count'),'22');
            assert.equal(await root.getAttribute('data-field-registry-count'),'127');
            assert.equal(await root.getAttribute('data-control-registry-count'),'27');
            assert.equal(await root.getAttribute('data-action-registry-count'),'21');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            for(const view of ['KB-01-VIEW-OVERVIEW','KB-01-VIEW-SOURCE','KB-01-VIEW-SEARCH','KB-01-VIEW-EXPERIENCE','KB-01-VIEW-REVIEW']){
              await page.locator(`[data-view-uid="${view}"]`).click();
              assert.equal(await page.locator('[data-current-view]').getAttribute('data-current-view'),view);
            }
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('KB01_STATIC_PREVIEW_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Commit cumulative preview seal
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/knowledge-admin.html preview/kb01-assets
          git commit -m 'sync(preview): seal isolated KB-01 page'
          parent=$(git rev-parse HEAD^)
          if git diff --name-only "$parent" HEAD | grep -Ev '^(preview/knowledge-admin\.html|preview/kb01-assets/)'; then
            echo 'Committed preview pollution outside KB-01 detected' >&2
            exit 1
          fi
          git push origin HEAD:acpos-live-preview
