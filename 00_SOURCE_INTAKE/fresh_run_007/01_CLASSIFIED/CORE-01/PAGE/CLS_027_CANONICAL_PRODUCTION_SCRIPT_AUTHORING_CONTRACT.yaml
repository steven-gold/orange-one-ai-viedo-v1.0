facts:
- source_ref: $.canonical_production_script_authoring_contract
  value:
    contract_uid: CORE-01-CONTRACT-TOPIC-CANONICAL-PRODUCTION-SCRIPT
    owner: CORE Script System
    page_mode: TOPIC_PRODUCTION
    work_item: PRODUCTION_SCRIPT
    provider_neutral: true
    qa_in_scope: false
    purpose: For the selected Topic, author one Canonical Production Script that stays inside the selected Project's locked/confirmed Blueprint and exact Topic Production Scope. This
      Canonical Script is the single content source that downstream department scripts must reference.
    required_source_bindings:
    - binding: project_ref
      rule: Exact current Project lineage selected in CORE; no cross-project substitution.
    - binding: topic_ref
      rule: Exact Topic under the selected Project.
    - binding: project_blueprint_ref
      rule: Exact confirmed/locked BlueprintVersionRef available to the Topic from the Project canon. The authoring process may not invent or silently replace Blueprint rules.
    - binding: topic_production_scope_ref
      rule: Exact current TOPIC_SCOPE work-item result; defines the only allowed content range for this Topic.
    - binding: project_canon_refs
      rule: Exact Story / Chapter / World Setting refs required by the current Blueprint/Topic context.
    - binding: dna_refs
      rule: Exact required Character / Scene / Object DNA refs; unresolved required DNA blocks script finalization.
    - binding: previous_topic_continuity_ref_if_applicable
      rule: When the Project sequence defines a previous Topic, use its confirmed ending/continuity state as read-only source. If no previous Topic is defined, leave absent; do not fabricate
        continuity.
    - binding: naming_authority_ref
      rule: Use existing naming authority; script authoring must not create a parallel naming system.
    authoring_principles:
    - 'Blueprint-first: every story event, character behavior, world rule and production intent must be explainable by an exact Blueprint/Canon/DNA source.'
    - 'Topic-boundary-first: only write content inside the confirmed Topic Production Scope; do not consume future Topic content unless the scope explicitly contains that bridge.'
    - 'Causality preserved: each major story beat declares cause, event and effect so downstream production cannot reinterpret the story order.'
    - 'Character continuity preserved: intent, behavior, dialogue and state changes must remain consistent with exact DNA and current story state.'
    - 'Scene continuity preserved: location/world/time/object state must remain consistent with Blueprint/Canon unless the Topic explicitly changes that state.'
    - 'Provider-neutral: no Kling/OpenAI/Runway/other provider syntax, model names, endpoint fields or vendor prompt grammar in the Canonical Script.'
    - 'Department-neutral at core level: Canonical Script states production meaning and constraints; ASSET/VIDEO/EDIT+VOICE own their detailed department script wording.'
    - Undefined required authority data is BLOCK + REPORT_AUTHORITY_GAP; AI must not fill the gap by inference.
    canonical_script_schema:
      identity_and_lineage:
        required_fields:
        - canonical_script_id
        - canonical_script_version
        - project_id
        - topic_id
        - project_blueprint_ref
        - topic_production_scope_ref
        - project_canon_refs
        - dna_refs
        - source_candidate_ref
        - canonical_script_hash
      topic_boundary:
        required_fields:
        - topic_start_state
        - topic_end_state
        - topic_objective
        - topic_conflict_or_problem
        - topic_payoff_or_resolution
        - allowed_story_range
        - forbidden_out_of_scope_content
      continuity_bridge:
        required_fields:
        - previous_topic_state_if_applicable
        - current_topic_entry_state
        - current_topic_exit_state
        - next_topic_bridge_if_defined_by_scope
        - continuity_preserve_requirements
      story_beats:
        type: ordered_array
        required_item_fields:
        - beat_id
        - order
        - purpose
        - cause
        - event
        - effect
        - character_state_before
        - character_state_after
        - scene_refs
        - must_preserve
      scenes:
        type: ordered_array
        required_item_fields:
        - scene_id
        - order
        - story_beat_refs
        - scene_goal
        - location_or_scene_dna_ref
        - time_or_world_state
        - character_refs
        - object_refs
        - entry_state
        - event_sequence
        - exit_state
        - continuity_constraints
      character_action_and_dialogue:
        required_item_fields:
        - character_ref
        - scene_id
        - intent
        - action
        - emotion_or_state
        - dialogue_or_speech_content_if_any
        - dialogue_purpose_if_any
        - interaction_target_if_any
        - preserve_constraints
      production_meaning:
        required_fields:
        - visual_intent
        - emotion_and_atmosphere
        - pacing_intent
        - critical_story_emphasis
        - required_reveals_or_information
        - required_on_screen_text_if_any
        - audio_or_voice_intent_if_story_required
        - must_not_be_reinterpreted
        rule: These are semantic production requirements only. Shot-level camera/motion belongs to VIDEO; asset-generation detail belongs to ASSET; edit/voice timing and mix detail belongs
          to EDIT+VOICE.
      department_source_requirements:
        required_fields:
        - asset_department_source_requirements
        - video_department_source_requirements
        - edit_voice_department_source_requirements
        rule: Each field lists exact story/scene/character/object/dialogue/continuity requirements that the department script must consume. It is not a provider prompt and not a duplicate
          department script.
      finalization:
        required_fields:
        - human_confirmed_candidate_ref
        - confirmed_at
        - confirmed_by
        - canonical_script_hash
        - source_binding_fingerprint
        - status
        allowed_status:
        - CANDIDATE
        - CONFIRMED
        - LOCKED_OR_CONFIRMED_AS_GOVERNED_BY_EXISTING_CORE_STATE
    candidate_and_materialization_binding:
      existing_candidate_create_action: CORE-01-ACT-CANDIDATE-CREATE
      existing_candidate_decision_action: CORE-01-ACT-CANDIDATE-ACCEPT
      existing_candidate_create_port: CORE-01-PORT-CANDIDATE-CREATE
      existing_candidate_decision_port: CORE-01-PORT-CANDIDATE-DECIDE
      work_item_discriminator: PRODUCTION_SCRIPT
      raw_ai_output_formalization: FORBIDDEN
      required_flow:
      - TOPIC_PRODUCTION mode resolves exact source bindings
      - AI/human discussion produces structured PRODUCTION_SCRIPT decision
      - Existing Create Candidate creates immutable PRODUCTION_SCRIPT Candidate
      - Existing Confirm Candidate records human ACCEPTED decision
      - Existing CORE Script System materializes the accepted candidate as the Topic CanonicalProductionScriptRef/version/hash
      - Existing Canonical Script read action exposes the exact confirmed projection
      new_ui_action: false
      new_endpoint_in_this_authority: false
      transport_rule: Canonical materialization is owned by the existing CORE Script System domain handler. If the deployment lacks a registered transport/domain operation for accepted
        PRODUCTION_SCRIPT Candidate -> CanonicalProductionScriptRef, BLOCK deployment and register it in the System Operation Registry; do not invent an endpoint in page code.
    downstream_department_script_binding:
      rule: CORE owns only CanonicalProductionScriptRef. Each production department owns its existing specialized script view/section and must bind to the exact Canonical Script version/hash
        for the selected Project/Topic.
      ASSET:
        target_existing_script_view: AssetProductionScriptViewRef
        department_owner: ASSET
        required_source: CORE-01-REF-CANONICAL-SCRIPT exact version/hash
        additional_existing_sources:
        - Blueprint exact ref
        - DNA exact refs
        - AssetManifest / reference inputs as governed by ASSET
        content_contract_ref: authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml#production_script_content_contract
      VIDEO:
        target_existing_script_view: VisualGenerationScriptViewRef
        department_owner: VIDEO
        required_source: CORE-01-REF-CANONICAL-SCRIPT exact version/hash
        additional_existing_sources:
        - Blueprint exact ref
        - DNA exact refs
        - exact locked Asset refs
        content_contract_ref: authority/pages/workspace/VIDEO-01/VIDEO_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml#production_script_content_contract
      EDIT_VOICE:
        target_existing_script_view: ProductionScriptSectionRef / existing 8 Script Roles
        department_owner: EDIT+VOICE
        required_source: CORE-01-REF-CANONICAL-SCRIPT exact version/hash
        additional_existing_sources:
        - Blueprint exact ref
        - exact VIDEO output
        - exact Asset refs
        - existing stage dependencies
        content_contract_ref: authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml#production_script_content_contract
      first_production_behavior: 'No change: each department continues its existing behavior—after Project/Topic/Task resolution, the first production automatically loads its exact specialized
        script and executes through the existing department runtime.'
    provider_adapter_binding:
      contract_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.3#provider_adapter
      required_capability: TEXT_CHAT
      profile_owner: admin:AIAPI-01#provider_model_profiles
      router_owner: ACPOS AI Execution / current AI API Router
      department_or_core_local_provider_registry: FORBIDDEN
      provider_specific_syntax_in_canonical_script: FORBIDDEN
    hard_locks:
    - Only one Canonical Production Script source may be active for the exact Topic/version context.
    - Canonical Script cannot be created from raw AI output without the existing Candidate + Human Decision flow.
    - Canonical Script cannot silently switch Project, Topic, Blueprint, Scope, Canon or DNA refs.
    - Department specialized scripts must reference the exact Canonical Script version/hash; they may not become an independent story authority.
    - CORE Canonical Script may not contain provider/model-specific request syntax.
    - No QA production-script authoring contract is created.
