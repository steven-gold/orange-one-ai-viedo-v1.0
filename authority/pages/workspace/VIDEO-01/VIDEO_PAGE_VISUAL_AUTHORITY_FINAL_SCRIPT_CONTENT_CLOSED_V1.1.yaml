      binding_kind: CLIENT_STATE_OR_VIEW_NO_API_REQUIRED
      api_required: false
  - action_uid: VIDEO-01-ACT-CORRECTION-GENERATE
    trigger_semantics: Generate correction script candidate
    owner: VIDEO/AI
    effect_type: CANDIDATE_CREATE
    success_contract: Create provider-neutral Chinese CorrectionScriptCandidate; no provider syntax
    error_contract: VIDEO-01-ERR-CORRECTION-001
    runtime_binding:
      binding_kind: SHARED_OPERATION_REFERENCE
      shared_authority_id: ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY
      shared_operation_id: generateCorrectionScriptCandidate
  - action_uid: VIDEO-01-ACT-CORRECTION-APPROVE
    trigger_semantics: Approve correction script candidate
    owner: VIDEO/HUMAN
    effect_type: DECISION_MUTATION
    success_contract: Freeze approved candidate ref for shared Instruction/Translation layer
    error_contract: VIDEO-01-ERR-CORRECTION-001
    runtime_binding:
      binding_kind: SHARED_OPERATION_REFERENCE
      shared_authority_id: ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY
      shared_operation_id: approveCorrectionScriptCandidate
  - action_uid: VIDEO-01-ACT-CORRECTION-EXECUTE
    trigger_semantics: Execute approved correction
    owner: VIDEO/RUNTIME
    effect_type: JOB_START
    success_contract: Shared Compiler/Adapter translates approved candidate; Core route selects Provider; execute only target scope; new version
    error_contract: VIDEO-01-ERR-TRANSLATION-001 / VIDEO-01-ERR-ROUTE-001
    runtime_binding:
      binding_kind: COMPOSITE_TO_EXISTING_EXECUTE_PORT
      port_uid: VIDEO-01-PORT-EXECUTE
      pre_step: Shared Compiler/Adapter translates approved candidate; Core Route resolves Provider; revalidate VIDEO input fingerprint.
      payload_mode: CORRECTION; exact task/shot/time/object/layer + source_video_version_id + approved candidate + translated instruction ref
      result: NEW Video Candidate/Version; no overwrite
      decision: SOURCE_DERIVED_CLOSURE
  - action_uid: VIDEO-01-ACT-TASK-RETRY
    trigger_semantics: Retry failed task/job
    owner: VIDEO/RUNTIME
    effect_type: JOB_START
    success_contract: retryTaskExecution only when policy eligible; preserve previous version/output
    error_contract: VIDEO-01-ERR-PROVIDER-001
    runtime_binding:
      binding_kind: SOURCE_INTEGRATION_PORT
      port_uid: VIDEO-01-PORT-RETRY
      decision: SOURCE_DERIVED
  - action_uid: VIDEO-01-ACT-RUNTIME-VIEW
    trigger_semantics: View Provider runtime
    owner: CLIENT
    effect_type: UI_ONLY
    success_contract: Read route/job/correlation/attempt only; no provider selector
    error_contract: VIDEO-01-ERR-PROVIDER-001
    runtime_binding:
      binding_kind: CLIENT_STATE_OR_VIEW_NO_API_REQUIRED
      api_required: false
  - action_uid: VIDEO-01-ACT-FINDING-CREATE
    trigger_semantics: Create VIDEO finding
    owner: VIDEO/EVALUATION
    effect_type: FINDING_CREATE
    success_contract: createFinding with exact task/output/evidence refs
    error_contract: VIDEO-01-ERR-CRITERIA-001
    runtime_binding:
      binding_kind: SOURCE_INTEGRATION_PORT
      port_uid: VIDEO-01-PORT-FINDING
      decision: SOURCE_DERIVED
  - action_uid: VIDEO-01-ACT-ISSUE-OPEN
    trigger_semantics: Open issue/evidence
    owner: CLIENT
    effect_type: UI_ONLY
    success_contract: Set current finding/evidence context only
    error_contract: VIDEO-01-ERR-CRITERIA-001
    runtime_binding:
      binding_kind: CLIENT_STATE_OR_VIEW_NO_API_REQUIRED
      api_required: false
  - action_uid: VIDEO-01-ACT-VERSION-LOCK
    trigger_semantics: Lock exact Video Version
    owner: VIDEO/VERSION
    effect_type: VERSION_LOCK
    success_contract: Lock exact confirmed output manifest; immutable
    error_contract: VIDEO-01-ERR-MANIFEST-001
    runtime_binding:
      binding_kind: SHARED_OPERATION_REFERENCE
      shared_authority_id: ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY
      shared_operation_id: lockVideoVersion
  - action_uid: VIDEO-01-ACT-HANDOFF
    trigger_semantics: Handoff locked Video to EDIT
    owner: VIDEO/HANDOFF
    effect_type: HANDOFF_CREATE
    success_contract: createDepartmentHandoff with exact approved output/score/contract hash
    error_contract: VIDEO-01-ERR-HANDOFF-001
    runtime_binding:
      binding_kind: SOURCE_INTEGRATION_PORT
      port_uid: VIDEO-01-PORT-OUT-EDIT
      decision: SOURCE_DERIVED
  action_effect_types:
  - effect_type: UI_ONLY
    allowed: Viewer/selection/read state only
    forbidden: No business mutation
  - effect_type: CONTEXT_STATE
    allowed: Page context/scope/current selection
    forbidden: No immutable version mutation
  - effect_type: JOB_START
    allowed: Start approved runtime/retry/correction execution
    forbidden: Requires Gate+Permission+idempotency
  - effect_type: SCORE_MUTATION
    allowed: Create immutable VIDEO evaluation/score evidence
    forbidden: Must use approved VIDEO criteria
  - effect_type: DECISION_MUTATION
    allowed: Human/policy candidate decision
    forbidden: Cannot overwrite source version
  - effect_type: CANDIDATE_CREATE
    allowed: Create provider-neutral correction candidate
    forbidden: Cannot execute provider directly
  - effect_type: FINDING_CREATE
    allowed: Create finding/evidence link
    forbidden: No output mutation
  - effect_type: VERSION_LOCK
    allowed: Create immutable exact version lock
    forbidden: No fuzzy current pointer
  - effect_type: HANDOFF_CREATE
    allowed: Create immutable boundary handoff
    forbidden: Target=EDIT only for canonical flow
  objects_refs:
  - object_uid: VIDEO-01-REF-BLUEPRINT
    entity: LockedBlueprintRef
    mutability: Immutable Ref
    owner: CORE/BLUEPRINT
    required_content: project/topic/task + child_blueprint_version_id + hash + lock_state
  - object_uid: VIDEO-01-REF-VIDEO-SCRIPT
    entity: VisualGenerationScriptViewRef
    mutability: Immutable Ref
    owner: CORE/SCRIPT
    required_content: package/script view/section/version/hash; provider-neutral
  - object_uid: VIDEO-01-REF-INSTRUCTION
    entity: InstructionPackageRef
    mutability: Immutable Ref
    owner: InstructionCompiler
    required_content: same task/manifest; APPROVED_FOR_EXECUTION
  - object_uid: VIDEO-01-REF-DNA
    entity: DNABindingRef
    mutability: Immutable Ref
    owner: CORE/BLUEPRINT
    required_content: character/scene/object/continuity IDs/versions/hashes
  - object_uid: VIDEO-01-REF-ASSET-HANDOFF
    entity: ApprovedAssetHandoffRef
    mutability: Immutable Ref
    owner: ASSET boundary
    required_content: exact asset IDs/versions/filename/checksum/purpose/rights
  - object_uid: VIDEO-01-OBJ-INPUT-MANIFEST
    entity: VideoExecutionInputManifest
    mutability: Immutable snapshot
    owner: VIDEO/ORCH
    required_content: task + blueprint + script + asset + instruction + route refs + fingerprint
  - object_uid: VIDEO-01-OBJ-PROVIDER-JOB
    entity: ProviderJobRef
    mutability: Runtime
    owner: MediaExecutionService
    required_content: route/provider/model/job/attempt/callback/correlation/status
  - object_uid: VIDEO-01-OBJ-VIDEO-CANDIDATE
    entity: VideoCandidateOutput
    mutability: Immutable candidate
    owner: VIDEO
    required_content: task/shot refs + output URI + checksum + provenance + version
  - object_uid: VIDEO-01-OBJ-EVALUATION
    entity: VideoStageEvaluation
    mutability: Immutable per run
    owner: VIDEO/EVALUATION
    required_content: criteria version + dimension scores + overall + hard blocks + evidence
  - object_uid: VIDEO-01-OBJ-FINDING
    entity: VideoFinding
    mutability: Append-only
    owner: VIDEO/EVALUATION
    required_content: issue type + shot/time/object/layer + evidence refs
  - object_uid: VIDEO-01-OBJ-CORRECTION-CONTEXT
    entity: VideoCorrectionContext
    mutability: Mutable until accepted
    owner: VIDEO/AI
    required_content: current exact refs + affected_scope + finding/evidence + zh-TW requirement
  - object_uid: VIDEO-01-OBJ-CORRECTION-SCRIPT
    entity: CorrectionScriptCandidate
    mutability: Immutable candidate
    owner: VIDEO/AI
    required_content: source script ref/hash + target scope + Chinese delta + candidate hash + approval state
  - object_uid: VIDEO-01-OBJ-CORRECTION-TRANSLATION
    entity: CorrectionTranslationRef
    mutability: Immutable execution ref
    owner: Shared Instruction/Provider layer
    required_content: approved candidate + instruction/compiler/adapter refs + translated payload hash
  - object_uid: VIDEO-01-OBJ-VIDEO-VERSION
    entity: ExactVideoVersion
    mutability: Immutable
    owner: VIDEO
    required_content: candidate/confirmed state + output ref + lineage
  - object_uid: VIDEO-01-OBJ-OUTPUT-MANIFEST
    entity: VideoOutputManifest
    mutability: Immutable trace record
    owner: VIDEO boundary
    required_content: exact Video/Shot/Layer versions + script hash + asset fingerprint + URI/checksum + score/evidence/rights
  - object_uid: VIDEO-01-OBJ-VERSION-LOCK
    entity: VideoVersionLock
    mutability: Immutable
    owner: VIDEO
    required_content: exact video_version_id + manifest hash + lock actor/time
  - object_uid: VIDEO-01-OBJ-HANDOFF
    entity: VideoEditingHandoff
    mutability: Append-only
    owner: VIDEO boundary
    required_content: locked exact output + manifest/checksum + scorecard + contract hash + target EDIT
  gates:
  - gate_uid: VIDEO-01-GATE-PAGE
    condition: Authorized page + project/task scope
    block_behavior: BLOCK + permission reason
  - gate_uid: VIDEO-01-GATE-TASK-READY
    condition: Assigned VIDEO task READY and dependency Handoff complete
    block_behavior: BLOCK execute
  - gate_uid: VIDEO-01-GATE-CHILD-LOCK
    condition: Exact ChildLock/Blueprint version+hash valid
    block_behavior: BLOCK execute
  - gate_uid: VIDEO-01-GATE-SCRIPT
    condition: Exact VIDEO Script View/Section + hash resolved
    block_behavior: BLOCK; no free prompt fallback
  - gate_uid: VIDEO-01-GATE-ASSET-BIND
    condition: Approved asset refs exact ID/version/filename/checksum/purpose match
    block_behavior: BLOCK; return upstream correction
  - gate_uid: VIDEO-01-GATE-INSTRUCTION
    condition: Approved Instruction Package resolvable for same task/manifest
    block_behavior: BLOCK; INSTRUCTION_PACKAGE_REQUIRED
  - gate_uid: VIDEO-01-GATE-ROUTE
    condition: Core-approved Provider Candidate Group/Capability/rights/budget policy PASS
    block_behavior: BLOCK; no local Provider selection
  - gate_uid: VIDEO-01-GATE-EXECUTE
    condition: TASK_READY + CHILD_LOCK + SCRIPT + ASSET_BIND + INSTRUCTION + ROUTE
    block_behavior: Execute/retry enabled only on PASS
  - gate_uid: VIDEO-01-GATE-CANDIDATE
    condition: Verified provider result materialized as Candidate with provenance/checksum
    block_behavior: BLOCK compare/decision
  - gate_uid: VIDEO-01-GATE-EVALUATION
    condition: Approved VIDEO criteria version + all required dimensions/evidence
    block_behavior: BLOCK decision
  - gate_uid: VIDEO-01-GATE-CONFIRM
    condition: VIDEO score ≥95 + no hard block + human selection
    block_behavior: Confirm enabled
  - gate_uid: VIDEO-01-GATE-CORRECTION
    condition: Finding + affected_scope + current exact refs + correction reason
    block_behavior: Correction enabled
  - gate_uid: VIDEO-01-GATE-RETRY
    condition: Runtime BLOCKED/FAILED + retry policy eligible
    block_behavior: Retry enabled; otherwise disabled reason
  - gate_uid: VIDEO-01-GATE-LOCK
    condition: Confirmed exact Video Version + scorecard + exact output manifest complete
    block_behavior: Lock enabled
  - gate_uid: VIDEO-01-GATE-HANDOFF
    condition: Locked exact Video Version + handoff manifest/contract hash PASS
    block_behavior: VIDEO→EDIT handoff enabled
  - gate_uid: VIDEO-01-GATE-COMPARE
    condition: Candidate exists + Current exists + user enables Compare
    block_behavior: Render A/B 50/50; otherwise single 100%
  permissions:
  - permission_uid: VIDEO_USE
    purpose: Enter page / basic projection
    r9_scope: video.task.read
  - permission_uid: VIDEO_EXECUTE
    purpose: Execute/retry assigned VIDEO task
    r9_scope: video.task.execute + department.task.execute
  - permission_uid: VIDEO_DECIDE
    purpose: Confirm/modify candidate
    r9_scope: department.output.decide
  - permission_uid: VIDEO_SCORE
    purpose: Persist VIDEO scorecard
    r9_scope: video.score.write + department.score.write
  - permission_uid: VIDEO_CORRECT
    purpose: Create finding/correction
    r9_scope: finding.write + correction.create
  - permission_uid: VIDEO_HANDOFF
    purpose: Create VIDEO→EDIT handoff
    r9_scope: video.handoff.create + department.handoff.create
  errors:
  - error_uid: VIDEO-01-ERR-CONTEXT-001
    context: Project/Topic/Task context missing or stale
    recovery: Reset context and resolve current task
  - error_uid: VIDEO-01-ERR-BLUEPRINT-001
    context: Locked Blueprint/ChildLock missing/mismatch
    recovery: BLOCK; return Core/Blueprint owner
  - error_uid: VIDEO-01-ERR-SCRIPT-001
    context: VIDEO Script Role/Section missing/hash mismatch
    recovery: BLOCK; do not generate prompt locally
  - error_uid: VIDEO-01-ERR-ASSET-001
    context: Approved Asset binding ID/version/filename/checksum/purpose mismatch
    recovery: BLOCK; return Blueprint→Asset regeneration/update path
  - error_uid: VIDEO-01-ERR-INSTRUCTION-001
    context: Approved Instruction Package unavailable
    recovery: BLOCK; INSTRUCTION_PACKAGE_REQUIRED
  - error_uid: VIDEO-01-ERR-ROUTE-001
    context: Provider capability/rights/budget route unavailable
    recovery: BLOCK; wait Core/API routing resolution
  - error_uid: VIDEO-01-ERR-PROVIDER-001
    context: Provider job failed/callback invalid
    recovery: Preserve task/current output; show retry eligibility
  - error_uid: VIDEO-01-ERR-CALLBACK-001
    context: Callback pending/invalid/duplicate/hash mismatch
    recovery: No domain mutation for invalid result; audit
  - error_uid: VIDEO-01-ERR-CANDIDATE-001
    context: Candidate output/provenance/checksum invalid
    recovery: BLOCK decision/score
  - error_uid: VIDEO-01-ERR-CRITERIA-001
    context: VIDEO criteria version missing/not approved/wrong department
    recovery: BLOCK evaluation; no generic default criteria
  - error_uid: VIDEO-01-ERR-SCOPE-001
    context: Correction scope missing or outside current Shot/object/layer/time range
    recovery: BLOCK correction
  - error_uid: VIDEO-01-ERR-CORRECTION-001
    context: Correction candidate not approved or source context stale
    recovery: Return correction discussion; no execute
  - error_uid: VIDEO-01-ERR-TRANSLATION-001
    context: Shared translation/compiler failed or mismatched candidate
    recovery: BLOCK provider execution; preserve Chinese candidate
  - error_uid: VIDEO-01-ERR-VERSION-001
    context: Attempt to overwrite or use non-exact version
    recovery: BLOCK; create new immutable version only
  - error_uid: VIDEO-01-ERR-MANIFEST-001
    context: Output manifest/checksum/lineage incomplete
    recovery: BLOCK Lock/Handoff
  - error_uid: VIDEO-01-ERR-PERM-001
    context: Permission/scope denied
    recovery: Disable action + show real reason
  - error_uid: VIDEO-01-ERR-HANDOFF-001
    context: Handoff dependency/contract/hash invalid
    recovery: BLOCK Handoff; preserve locked version
  stages:
  - stage_uid: VIDEO-01-STAGE-01-RESOLVE
    name: Resolve Inputs
    flow: Resolve exact Blueprint→VIDEO Script→DNA/Asset→Instruction Package→Core Route; no manual prompt.
  - stage_uid: VIDEO-01-STAGE-02-GENERATE
    name: Generate / Regenerate
    flow: requestTaskExecution or approved correction/retry path; Provider routing/backend materializes candidate.
  - stage_uid: VIDEO-01-STAGE-03-EVALUATE
    name: VIDEO Evaluation
    flow: Run VIDEO criteria, findings/evidence, overall score; enter WAIT_CONFIRMATION.
  - stage_uid: VIDEO-01-STAGE-04-DECIDE
    name: Confirm / Modify
    flow: Confirm candidate or open correction loop. AUTO only advances after Confirm.
  - stage_uid: VIDEO-01-STAGE-05-FINALIZE
    name: Lock / Handoff
    flow: Seal exact output manifest, lock exact Video Version, handoff to EDIT.
  stage_transitions:
  - transition_uid: VIDEO-01-STTR-01
    from_stage: VIDEO-01-STAGE-01-RESOLVE
    to_stage: VIDEO-01-STAGE-02-GENERATE
    trigger: VIDEO-01-ACT-FLOW-START
    gate: All input/route gates PASS
  - transition_uid: VIDEO-01-STTR-02
    from_stage: VIDEO-01-STAGE-02-GENERATE
    to_stage: VIDEO-01-STAGE-03-EVALUATE
    trigger: Verified Candidate Output
    gate: Candidate provenance/checksum PASS
  - transition_uid: VIDEO-01-STTR-03
    from_stage: VIDEO-01-STAGE-03-EVALUATE
    to_stage: VIDEO-01-STAGE-04-DECIDE
    trigger: VIDEO-01-ACT-EVALUATE
    gate: Criteria/evidence completed
  - transition_uid: VIDEO-01-STTR-04
    from_stage: VIDEO-01-STAGE-04-DECIDE
    to_stage: VIDEO-01-STAGE-02-GENERATE
    trigger: VIDEO-01-ACT-CORRECTION-EXECUTE
    gate: Modify path; new candidate only
  - transition_uid: VIDEO-01-STTR-05
    from_stage: VIDEO-01-STAGE-04-DECIDE
    to_stage: VIDEO-01-STAGE-05-FINALIZE
    trigger: VIDEO-01-ACT-CANDIDATE-CONFIRM
    gate: Score≥95 + no hard block + human confirm
  script_roles:
  - script_role_uid: VIDEO-01-SCRIPT-ROLE-VIDEO
    view: VisualGenerationScriptView
    required_content: '8-section field-level VIDEO production script contract: Shot/Input/Composition/Motion/Camera/Timing/Environment/Output Constraints'
    hard_guard: Provider-neutral; first production read-only
    content_contract_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_production_scripts.VIDEO
  - script_role_uid: VIDEO-01-SCRIPT-ROLE-CORRECTION
    view: CorrectionScriptCandidate
    required_content: Only target scope delta/instruction derived from current VIDEO script + issue
    hard_guard: Exists only during Correction; must be human approved before shared translation
    content_contract_ref: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT#department_correction_content.VIDEO
  video_score_dimensions:
  - score_uid: VIDEO-01-SCORE-SCRIPT
    dimension: Script Compliance
    definition: Matches Blueprint/VIDEO Script intent and required shot beats
  - score_uid: VIDEO-01-SCORE-IDENTITY
    dimension: Character / Identity Stability
    definition: Character face/body/clothing/DNA consistency
  - score_uid: VIDEO-01-SCORE-MOTION
    dimension: Motion / Body Continuity
    definition: Movement continuity and physical plausibility
  - score_uid: VIDEO-01-SCORE-CAMERA
    dimension: Camera / Gaze
    definition: Camera instruction, framing, gaze/action direction
  - score_uid: VIDEO-01-SCORE-SCENE
    dimension: Scene / Continuity
    definition: Scene/world continuity, bridge/setting consistency
  - score_uid: VIDEO-01-SCORE-TIMING
    dimension: Timing / Duration
    definition: Shot duration, beats, temporal progression
  - score_uid: VIDEO-01-SCORE-TECH
    dimension: Technical Quality
    definition: Resolution, flicker/artifacts, anatomy/physics, visual defects
  - score_uid: VIDEO-01-SCORE-ASSET
    dimension: Asset / DNA Fidelity
    definition: Exact bound assets/DNA visually respected
  - score_uid: VIDEO-01-SCORE-RIGHTS
    dimension: Rights / Policy
    definition: Hard block; PASS required regardless of numeric score
  integration_ports:
  - port_uid: VIDEO-01-PORT-IN-ASSET-HANDOFF
    boundary: Inbound / Dependency Ready
    r9_operation: createDepartmentHandoff
    method_effective_path: POST /v1/handoffs
    r9_permission: department.handoff.create
    state_event: Upstream HANDOFF_READY→HANDED_OFF; VIDEO WAITING_DEPENDENCY→READY | handoff.created
    video01_exposure: Created upstream; VIDEO validates exact AssetHandoff only.
  - port_uid: VIDEO-01-PORT-EXECUTE
    boundary: Generate
    r9_operation: requestTaskExecution
    method_effective_path: POST /v1/tasks/{taskId}/execute
    r9_permission: department.task.execute
    state_event: DepartmentTask:READY→ROUTING | provider.job.requested
    video01_exposure: VIDEO-01-ACT-FLOW-START; only after execute gates PASS.
  - port_uid: VIDEO-01-PORT-RETRY
    boundary: Retry
    r9_operation: retryTaskExecution
    method_effective_path: POST /v1/tasks/{taskId}/retry
    r9_permission: department.task.execute
    state_event: DepartmentTask:BLOCKED/FAILED→ROUTING | provider.job.requested
    video01_exposure: VIDEO-01-ACT-TASK-RETRY; policy eligible only.
  - port_uid: VIDEO-01-PORT-FINDING
    boundary: Evaluation Finding
    r9_operation: createFinding
    method_effective_path: POST /v1/findings
    r9_permission: finding.write
    state_event: IN_REVIEW→FINDING_OPEN | finding.created
    video01_exposure: VIDEO-01-ACT-FINDING-CREATE.
  - port_uid: VIDEO-01-PORT-CORRECTION
    boundary: Correction Request
    r9_operation: createCorrectionRequest
    method_effective_path: POST /v1/correction-requests
    r9_permission: correction.create
    state_event: FINDING_OPEN→CORRECTION_REQUIRED | correction.requested
    video01_exposure: Correction request references affected_scope; execution still uses approved script/translation/route.
  - port_uid: VIDEO-01-PORT-DECISION
    boundary: Candidate Confirm
    r9_operation: decideOutputCandidate
    method_effective_path: POST /v1/tasks/{taskId}/outputs/{outputVersionId}/decision
    r9_permission: department.output.decide
    state_event: CANDIDATE_OUTPUT→SCORE_PENDING | output.decision_recorded
    video01_exposure: VIDEO-01-ACT-CANDIDATE-CONFIRM.
  - port_uid: VIDEO-01-PORT-SCORECARD
    boundary: Score Persist
    r9_operation: submitScorecard
    method_effective_path: POST /v1/scorecards
    r9_permission: department.score.write
    state_event: SCORE_PENDING→BLOCKED or HANDOFF_READY | scorecard.submitted
    video01_exposure: Persist confirmed VIDEO evaluation with VIDEO criteria version.
  - port_uid: VIDEO-01-PORT-OUT-EDIT
    boundary: Outbound to EDIT
    r9_operation: createDepartmentHandoff
    method_effective_path: POST /v1/handoffs
    r9_permission: department.handoff.create
    state_event: HANDOFF_READY→HANDED_OFF; EDIT WAITING_DEPENDENCY→READY | handoff.created
    video01_exposure: VIDEO-01-ACT-HANDOFF; exact locked manifest only.
binding_chain:
- step_uid: VIDEO-01-BIND-01
  resolution_rule: Current Task → exact Child Lock / Blueprint
  hard_guard: version_id + lock_state + hash 一致；不可讀 latest。
- step_uid: VIDEO-01-BIND-02
  resolution_rule: Blueprint → VisualGenerationScriptView / VIDEO Script Role
  hard_guard: section/version/hash 必須存在；首次生產不得 AI 自建。
- step_uid: VIDEO-01-BIND-03
  resolution_rule: VIDEO Script → DNA / Continuity / Asset requirement refs
  hard_guard: 只接受 Script/Blueprint 明確引用。
- step_uid: VIDEO-01-BIND-04
  resolution_rule: AssetHandoff → exact Asset ID + Version + Filename + Checksum + Purpose Binding
  hard_guard: 任一 mismatch=BLOCK；要改素材必須回 Blueprint→ASSET 更新。
- step_uid: VIDEO-01-BIND-05
  resolution_rule: Task/Manifest → Approved Instruction Package
  hard_guard: 同 Task/Manifest、APPROVED_FOR_EXECUTION；缺失=BLOCK。
- step_uid: VIDEO-01-BIND-06
  resolution_rule: Instruction/Capability → Core API Routing
  hard_guard: VIDEO 只宣告能力需求；Provider/Model由 Core Router 決定。
- step_uid: VIDEO-01-BIND-07
  resolution_rule: Execute 前 → VideoExecutionInputManifest / input fingerprint
  hard_guard: 每次 execute/retry/correction 前重新驗證。
- step_uid: VIDEO-01-BIND-08
  resolution_rule: Candidate → exact output lineage/checksum/provenance
  hard_guard: 未驗證 callback/結果不得進 Candidate/Decision。
correction_lifecycle:
- step_uid: VIDEO-01-CORR-01
  flow: Open Finding / manual correction request
  hard_guard: Resolve Current Task/Shot/Video Version/Script/DNA/Assets/Score/Evidence
- step_uid: VIDEO-01-CORR-02
  flow: Set affected_scope
  hard_guard: Scene/Shot/time/object/layer 必須合法
- step_uid: VIDEO-01-CORR-03
  flow: User zh-TW requirement
  hard_guard: 只描述修改要求，不輸入 Provider syntax
- step_uid: VIDEO-01-CORR-04
  flow: Generate CorrectionScriptCandidate
  hard_guard: Provider-neutral Chinese scoped candidate
- step_uid: VIDEO-01-CORR-05
  flow: Human Approve Candidate
  hard_guard: 未核准不得 Translation/Execute
- step_uid: VIDEO-01-CORR-06
  flow: Shared Instruction/Provider Translation
  hard_guard: 由共用 Compiler/Adapter 轉換，不由 VIDEO 定義 Provider 語法
- step_uid: VIDEO-01-CORR-07
  flow: Execute correction target scope
  hard_guard: Core Route 指定 Provider；產生 New Candidate，不覆蓋舊版
- step_uid: VIDEO-01-CORR-08
  flow: Re-score / Compare / Confirm or Modify again
  hard_guard: 直到 Confirm 後才能進 Finalize/Handoff
binding_matrices:
  control_matrix:
  - control_uid: VIDEO-01-FLD-PROJECT
    section_uid: VIDEO-01-SEC-01
