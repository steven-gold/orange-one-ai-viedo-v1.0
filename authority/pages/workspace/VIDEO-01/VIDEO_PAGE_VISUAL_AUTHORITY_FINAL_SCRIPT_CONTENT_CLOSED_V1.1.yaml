forbidden:
- 禁止初次生產顯示自由 Prompt / 手動腳本輸入。
- 禁止 VIDEO 人工挑 Project Asset / DNA / Provider / Model。
- 禁止直接以 Provider syntax 作為核心 Script；中文製作腳本/Provider-neutral intent 才是 Authority。
- 禁止永久渲染兩個播放器；沒有 Candidate 時 B 完全不存在。
- 禁止把 EDIT Timeline/Clip/Subtitle/Audio Mixing/Final Render 功能加入 VIDEO。
- 禁止把 ASSET Layer Editor / AssetPatch 操作加入 VIDEO。
- 禁止修改 Blueprint/DNA/Asset binding；需變更時退回 Blueprint→Asset 更新再 Resolve。
- 禁止 generic/default 評分；必須是 VIDEO approved criteria。
- 禁止覆寫 Video Version；Correction/Retry 建立 New Version。
- 禁止 direct VIDEO→QA 或 release；canonical Handoff target = EDIT。
- 禁止假 Provider/Score/Version/Duration/Runtime；缺值顯示 —。
- 未列 Section/Component/Control/Action/State/Gate/Error/Port = BLOCK。
