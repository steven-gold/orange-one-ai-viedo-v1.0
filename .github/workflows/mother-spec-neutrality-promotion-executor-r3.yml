name: Hardened Mother Spec Neutrality Promotion Executor R3
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/mother-spec-neutrality-promotion-executor-r3.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: python3 -m pip install pyyaml
      - name: Materialize neutral candidate and neutral closure validator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml, textwrap
          wf=Path('.github/workflows/mother-spec-neutrality-promotion.yml')
          text=wf.read_text(encoding='utf-8')
          anchor="              text=re.sub(r'\\b11 stages\\b','selected-profile step set',text,flags=re.I)\n"
          if anchor not in text: raise SystemExit('NORMALIZER_ANCHOR_NOT_FOUND')
          text=text.replace(anchor,anchor+
              "              text=re.sub(r'\\b11[- ]?stage\\b','selected-profile step set',text,flags=re.I)\n"+
              "              text=re.sub(r'\\bexactly eleven ordered stages\\b','profile-defined ordered steps',text,flags=re.I)\n"+
              "              text=re.sub(r'\\bfixed lifecycle\\b','selected execution profile',text,flags=re.I)\n",1)
          old="'registry':'governance/specifications/REGISTRY.yaml'"; new="'registry_ref':'governance/specifications/REGISTRY.yaml'"
          if old not in text: raise SystemExit('ROOT_REGISTRY_PROJECTION_ANCHOR_NOT_FOUND')
          text=text.replace(old,new,1)
          data=yaml.safe_load(text); steps=data['jobs']['promote']['steps']
          wanted=['Materialize neutral portable governance candidate','Validate neutral policy and profile separation','Validate compiled source governance']
          found=[]
          for step in steps:
              if step.get('name') in wanted:
                  subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
                  found.append(step['name'])
          if found!=wanted: raise SystemExit('STEP_SET_DRIFT:'+repr(found))

          # Atomically project the newly promoted Current authority into non-normative run state.
          statep=Path('governance/test/ACTIVE_STATE.yaml'); st=yaml.safe_load(statep.read_text()) or {}
          reg=yaml.safe_load(Path('governance/specifications/REGISTRY.yaml').read_text()) or {}
          new_uid=(reg.get('active_specification') or {}).get('governance_uid')
          if new_uid!='GOV-REV-20260915-NEUTRAL-PORTABLE-GOVERNANCE': raise SystemExit('NEW_UID_PROJECTION_INVALID')
          old_uid=st.get('specification_uid')
          st['specification_uid']=new_uid
          stage2=((st.get('execution') or {}).get('stage2') or {})
          stage2['revalidation_required_under_current_governance']=True
          stage2['prior_results_authoritative_for_current_governance']=False
          attempt=st.get('stage02_active_attempt') or {}
          frozen=attempt.get('frozen_governance_uid')
          attempt['governance_status']='HISTORICAL_FROZEN_PREDECESSOR_AFTER_PROMOTION'
          attempt['closure_credit_under_current_governance']=False
          attempt['fresh_revalidation_required']=True
          st['stage02_active_attempt']=attempt
          proto=st.get('stage_execution_remediation_closure_protocol') or {}
          proto['specification_ref']='governance/specifications/current/VALIDATION_REMEDIATION_CLOSURE_PROTOCOL.yaml'
          proto['binding_status']='CURRENT_POLICY_REQUIRES_FRESH_REVALIDATION_OF_PREDECESSOR_ATTEMPT'
          st['stage_execution_remediation_closure_protocol']=proto
          st['governance_revision_transition']={
              'previous_governance_uid':old_uid,
              'current_governance_uid':new_uid,
              'predecessor_attempt_frozen_governance_uid':frozen,
              'predecessor_attempt_preserved_as_historical_evidence':True,
              'predecessor_attempt_may_close_under_current_governance':False,
              'fresh_revalidation_required':True,
              'selected_execution_profile_preserved':True,
              'website_construction_remains_blocked':True,
              'deployment_remains_blocked':True,
          }
          statep.write_text(yaml.safe_dump(st,allow_unicode=True,sort_keys=False,width=160),encoding='utf-8')

          neutral=textwrap.dedent('''\
          #!/usr/bin/env python3
          from pathlib import Path
          import sys, yaml
          from governance_resolver import resolve
          ROOT=Path(__file__).resolve().parents[2]
          protocol_p=ROOT/'governance/specifications/current/VALIDATION_REMEDIATION_CLOSURE_PROTOCOL.yaml'
          mutation_p=ROOT/'governance/specifications/current/SPECIFICATION_MUTATION_CONTROL.yaml'
          layers_p=ROOT/'governance/specifications/current/GOVERNANCE_LAYER_SEPARATION_AND_PORTABILITY.yaml'
          manifest_p=ROOT/'governance/specifications/current/SPECIFICATION_MANIFEST.yaml'
          registry_p=ROOT/'governance/specifications/REGISTRY.yaml'
          state_p=ROOT/'governance/test/ACTIVE_STATE.yaml'
          errors=[]
          for p in (protocol_p,mutation_p,layers_p,manifest_p,registry_p,state_p):
              if not p.is_file(): errors.append('MISSING_REQUIRED_FILE:'+str(p.relative_to(ROOT)))
          if errors:
              [print('BLOCK:',e,file=sys.stderr) for e in errors]; raise SystemExit(1)
          protocol=yaml.safe_load(protocol_p.read_text()) or {}; mutation=yaml.safe_load(mutation_p.read_text()) or {}; layers=yaml.safe_load(layers_p.read_text()) or {}; manifest=yaml.safe_load(manifest_p.read_text()) or {}; registry=yaml.safe_load(registry_p.read_text()) or {}; state=yaml.safe_load(state_p.read_text()) or {}
          uid=resolve()['governance_uid']
          if protocol.get('artifact_uid')!='GOV-COMP-VALIDATION-REMEDIATION-CLOSURE-PROTOCOL': errors.append('PROTOCOL_UID_INVALID')
          if protocol.get('formal_current_authority') is not True or protocol.get('layer_classification')!='POLICY': errors.append('PROTOCOL_NOT_FORMAL_POLICY')
          principles=protocol.get('principles') or {}; remediation=protocol.get('material_remediation') or {}; retest=protocol.get('retest_and_regression') or {}; closure=protocol.get('closure_gate') or {}; cycle=protocol.get('canonical_cycle') or []
          required_principles={'audit_pass_with_reproducible_product_gap_is_closure':False,'repeated_audit_blocked_loop_counts_as_progress':False,'hidden_defect_search_after_known_fix':True,'fresh_verification_from_clean_registered_baseline':True,'prior_result_reuse_as_current':False,'ai_may_invent_missing_product_authority':False,'external_authority_auto_resolution':False,'mixed_governance_uid_evidence_for_one_closure':False}
          for k,v in required_principles.items():
              if principles.get(k)!=v: errors.append('PRINCIPLE_DRIFT:'+k)
          if remediation.get('required_for_every_remediable_defect') is not True: errors.append('MATERIAL_REMEDIATION_NOT_REQUIRED')
          if remediation.get('audit_or_diagnosis_only')!='NOT_REMEDIATION': errors.append('AUDIT_WRONGLY_COUNTS_AS_REMEDIATION')
          if remediation.get('evidence_only_without_owning_layer_change')!='NOT_REMEDIATION': errors.append('EVIDENCE_ONLY_WRONGLY_COUNTS_AS_REMEDIATION')
          if retest.get('clean_registered_baseline_required') is not True or retest.get('fresh_reexecution_required') is not True: errors.append('FRESH_RETEST_INVARIANT_MISSING')
          if retest.get('known_remediable_signature_reproduction_count')!=0: errors.append('KNOWN_SIGNATURE_ZERO_INVARIANT_MISSING')
          if retest.get('same_signature_after_claimed_fix')!='REMEDIATION_FAILURE': errors.append('REMEDIATION_FAILURE_CLASSIFICATION_MISSING')
          must_steps=['FREEZE_CURRENT_POLICY_AND_INPUT_BASELINE','MATERIALLY_REMEDIATE_AT_OWNER','FRESHLY_REEXECUTE','VERIFY_KNOWN_SIGNATURE_ZERO','RUN_HIDDEN_DEFECT_SWEEP','PROMOTE_ONLY_IF_EXPLICITLY_AUTHORIZED','MAKE_CLOSURE_DECISION']
          if any(x not in cycle for x in must_steps): errors.append('CANONICAL_CYCLE_SEMANTIC_STEP_MISSING')
          if closure.get('all_discovered_remediable_defects_materially_eliminated')!='REQUIRED' or closure.get('hidden_defect_sweep')!='PASS_REQUIRED' or closure.get('otherwise')!='BLOCK_ADVANCE': errors.append('CLOSURE_FAIL_CLOSED_INVARIANT_MISSING')
          purpose=mutation.get('purpose') or {}; auth=mutation.get('explicit_change_authorization') or {}; freeze=mutation.get('execution_cycle_freeze_control') or {}; promo=mutation.get('consolidated_promotion_control') or {}; fatal=mutation.get('fatal_specification_contradiction_exception') or {}
          if purpose.get('default_decision')!='DENY_MUTATION' or purpose.get('fail_closed') is not True: errors.append('MUTATION_DEFAULT_DENY_MISSING')
          if auth.get('required') is not True or auth.get('authorization_receipt_must_preexist_spec_mutation_commit') is not True or auth.get('same_commit_authorization_fabrication')!='BLOCK': errors.append('PREEXISTING_AUTHORIZATION_INVARIANT_MISSING')
          if freeze.get('freeze_required_before_validation_or_governed_execution') is not True or freeze.get('ordinary_cycle_mutation') is not False or freeze.get('results_may_mix_multiple_governance_uids') is not False: errors.append('CYCLE_FREEZE_INVARIANT_MISSING')
          for k in ('registry_manifest_atomic_update_required','active_consumer_inventory_required','stale_predecessor_pin_scan_required','projection_atomicity_required','portability_validation_required','policy_layer_contamination_scan_required','fresh_reverification_required'):
              if promo.get(k) is not True: errors.append('PROMOTION_INVARIANT_MISSING:'+k)
          if fatal.get('default')!='DENY' or fatal.get('requires_proven_current_policy_self_contradiction') is not True or fatal.get('new_explicit_authorization_required') is not True or fatal.get('ai_may_self_authorize') is not False: errors.append('FATAL_CONTRADICTION_EXCEPTION_INVALID')
          lm=layers.get('layer_model') or {}; pol=lm.get('POLICY') or {}; prof=lm.get('EXECUTION_PROFILE') or {}
          if 'PROJECT_FIXED_STEP_IDENTITY' not in (pol.get('may_not_define') or []) or 'PROJECT_FIXED_STEP_COUNT' not in (pol.get('may_not_define') or []): errors.append('POLICY_PROFILE_SEPARATION_MISSING')
          if prof.get('global_normative_authority') is not False or prof.get('may_weaken_policy') is not False: errors.append('EXECUTION_PROFILE_AUTHORITY_BOUNDARY_INVALID')
          comps=manifest.get('components') or []
          if sum(1 for x in comps if x.get('file')=='VALIDATION_REMEDIATION_CLOSURE_PROTOCOL.yaml')!=1: errors.append('MANIFEST_PROTOCOL_BINDING_INVALID')
          if (registry.get('active_specification') or {}).get('governance_uid')!=uid: errors.append('REGISTRY_UID_RESOLUTION_DRIFT')
          if state.get('specification_uid')!=uid: errors.append('ACTIVE_STATE_CURRENT_UID_STALE')
          trans=state.get('governance_revision_transition') or {}; attempt=state.get('stage02_active_attempt') or {}; ex=state.get('execution') or {}; s2=ex.get('stage2') or {}
          if trans.get('current_governance_uid')!=uid or trans.get('fresh_revalidation_required') is not True: errors.append('AUTHORITY_TRANSITION_REVALIDATION_MISSING')
          if trans.get('predecessor_attempt_may_close_under_current_governance') is not False: errors.append('PREDECESSOR_ATTEMPT_CLOSURE_CREDIT_NOT_BLOCKED')
          if attempt.get('closure_credit_under_current_governance') is not False or attempt.get('fresh_revalidation_required') is not True: errors.append('PREDECESSOR_ATTEMPT_NOT_HISTORICAL')
          if s2.get('prior_results_authoritative_for_current_governance') is not False or s2.get('revalidation_required_under_current_governance') is not True: errors.append('RUN_STATE_REVALIDATION_PROJECTION_INVALID')
          if ex.get('website_construction_allowed') is not False or ex.get('deployment_allowed') is not False: errors.append('PRODUCT_GATE_WRONGLY_OPENED')
          if errors:
              [print('BLOCK:',e,file=sys.stderr) for e in errors]; raise SystemExit(1)
          print('PASS: reusable validation/remediation/closure policy is profile-neutral and fail-closed')
          print('PASS: mutation control preserves freeze, explicit authorization, atomic projection, portability, and fresh revalidation')
          print('PASS: predecessor Stage/Run evidence remains historical RUN_STATE and cannot become current closure credit')
          print('PASS: website construction and deployment remain blocked')
          ''')
          Path('governance/ci/validate_validation_remediation_closure_protocol.py').write_text(neutral,encoding='utf-8')
          wrapper="#!/usr/bin/env python3\n# Compatibility shim only; reusable policy semantics live in the neutral validator.\nfrom pathlib import Path\nimport runpy\nrunpy.run_path(str(Path(__file__).with_name('validate_validation_remediation_closure_protocol.py')),run_name='__main__')\n"
          Path('governance/ci/validate_stage_test_remediation_closure_protocol.py').write_text(wrapper,encoding='utf-8')
          PY
      - name: Validate registry mutation controls and neutral closure semantics
        shell: bash
        run: |
          python3 governance/ci/validate_governance_layout.py
          python3 governance/ci/stress_test_governance_registry.py
          python3 governance/ci/validate_validation_remediation_closure_protocol.py
          python3 governance/ci/validate_governance_portability.py
      - name: Run original cleanup-protection validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          d=yaml.safe_load(Path('.github/workflows/mother-spec-neutrality-promotion.yml').read_text())
          step=next(s for s in d['jobs']['promote']['steps'] if s.get('name')=='Ensure superseded active components are gone and history is not destroyed')
          subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
      - name: Exhaustive Mother Current and source identity audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,yaml,json
          R=Path('.'); M=R/'.github/governance-source/active/source/12_DOCS/mother-spec'; C=R/'governance/specifications/current'; P=R/'.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_LIFECYCLE_STAGE_REGISTRY.yaml'
          failures=[]; docs=[]; alluids=[]
          fixed_stage=re.compile(r'(?i)\bstage(?:[-_ ]?0?\d{1,2}|\d{1,2})\b'); fixed_den=re.compile(r'(?i)\b(?:11[- ]?stage|exactly eleven ordered stages|fixed lifecycle)\b'); retry=re.compile(r'\bR\d{1,3}\b')
          for p in sorted(M.glob('*.md')):
              t=p.read_text(); u=re.findall(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',t); alluids += u
              bad=[]
              if fixed_stage.search(t): bad.append('fixed-stage')
              if fixed_den.search(t): bad.append('fixed-denominator')
              if retry.search(t): bad.append('retry-id')
              if '.github/workflows/' in t or 'governance/test/' in t: bad.append('implementation-test-path')
              if len(u)!=len(set(u)): bad.append('duplicate-section-uid')
              anchors=list(re.finditer(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',t)); empty=[]
              for i,m in enumerate(anchors):
                  end=anchors[i+1].start() if i+1<len(anchors) else len(t)
                  if len([x for x in t[m.end():end].splitlines() if x.strip()])<2: empty.append(m.group(1))
              if empty: bad.append('empty-section')
              if bad: failures.append(p.name+':'+','.join(bad))
              docs.append({'file':p.name,'sections':len(u),'failures':bad})
          if len(alluids)!=len(set(alluids)): failures.append('cross-document-section-uid-duplicate')
          man=yaml.safe_load((C/'SPECIFICATION_MANIFEST.yaml').read_text()) or {}; comps=man.get('components') or []; files=[x.get('file') for x in comps]
          if len(comps)!=7 or len(files)!=len(set(files)): failures.append('current-component-set-invalid')
          if {x.name for x in C.glob('*.yaml')} != set(files)|{'SPECIFICATION_MANIFEST.yaml'}: failures.append('current-physical-manifest-drift')
          for f in files:
              d=yaml.safe_load((C/f).read_text()) or {}; txt=(C/f).read_text()
              if d.get('formal_current_authority') is not True or d.get('layer_classification')!='POLICY': failures.append('current-authority-layer-invalid:'+f)
              if fixed_stage.search(txt) or fixed_den.search(txt) or retry.search(txt): failures.append('current-execution-instance-pollution:'+f)
          prof=yaml.safe_load(P.read_text()) or {}
          if prof.get('layer_classification')!='EXECUTION_PROFILE' or prof.get('global_normative_authority') is not False or prof.get('profile_local_denominator')!=11 or len(prof.get('stages') or [])!=11: failures.append('acpos-execution-profile-invalid')
          out={'status':'PASS' if not failures else 'FAIL','mother_documents':docs,'mother_section_total':len(alluids),'current_policy_components':len(files),'acpos_profile_steps':len(prof.get('stages') or []),'failures':failures}; print(json.dumps(out,ensure_ascii=False,indent=2))
          if failures: raise SystemExit(1)
          PY
          python3 .github/governance-source/active/source/11_TEST/VERIFY_GITHUB_MATERIALIZED_SOURCE.py
          git diff --name-only HEAD -- governance/test/stage01 | grep -q . && { echo STAGE01_MUTATED; exit 1; } || true
          echo 'PASS: Stage-01 immutable baseline untouched'
      - name: Persist authorized neutral governance promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOVERNANCE_CURRENT.yaml governance .github/governance-source
          git reset -- .github/workflows || true
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "governance(spec): promote neutral portable mother policy v2.2.0" -m "Authorization: USR-DIRECTIVE-20260915-MOTHER-SPEC-NEUTRALITY-AUDIT" -m "Separates reusable POLICY from ACPOS EXECUTION_PROFILE and preserves predecessor Stage/Run evidence only as non-normative historical run state requiring fresh revalidation."
          git push origin HEAD:rebuild-v2.1.1
