name: ACPOS Batch 100 Word Cross-Document Consistency Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch100_word_cross_document_consistency_audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Audit cross-document references ownership current-truth and design consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,re,json,collections,subprocess
          EXPECTED_PARENT="5a861ca794275ebe6c90d6adcea915cce024a70a"
          CURRENT_TREE="d9782b31a96ae04dd84be270f1f53e8a9c9298a8"
          p=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if p!=EXPECTED_PARENT:raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {p}")
          docs=sorted(Path(".").glob("*.docx"))
          if len(docs)!=31:raise SystemExit(f"DOCX_COUNT_FAIL {len(docs)}")
          names=set(x.name for x in docs)
          PAGE_IDS=["AIAPI-01","ASSET-01","CORE-01","DB-01","DEV-01","EDIT-01","ERP-01","IAM-01","INFO-01","KB-01","QA-01","SG-02","SOC-01","STR-01","SYS-01","VIDEO-01","WB-01","ADMIN-STR-01"]
          INDEX="00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx"
          GLOBAL="ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          def n(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def tx(el):return n("".join((x.text or "") for x in el.iter(W+"t")))
          def extract(doc):
            with zipfile.ZipFile(doc) as z:root=ET.fromstring(z.read("word/document.xml"))
            paras=[tx(p) for p in root.iter(W+"p") if tx(p)]
            tabs=[]
            for ti,tbl in enumerate(root.iter(W+"tbl"),1):
              trs=[x for x in list(tbl) if x.tag==W+"tr"]
              if not trs:continue
              rows=[[tx(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
              tabs.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
            full="\n".join(paras+[" | ".join(r) for t in tabs for r in [t["headers"]]+t["rows"]])
            return full,tabs
          corpus={}
          for d in docs:
            full,tabs=extract(d);corpus[d.name]={"text":full,"tables":tabs}
          # 1. index/global coverage
          index_missing=[x for x in PAGE_IDS if x not in corpus[INDEX]["text"]]
          global_missing=[x for x in PAGE_IDS if x not in corpus[GLOBAL]["text"]]
          # 2. current-truth branch/head/tree contradictions
          stale_current_tree=[];stale_live_head=[];wrong_branch=[]
          for fn,data in corpus.items():
            s=data["text"]
            for m in re.finditer(r"Current exact tree\s+([0-9a-f]{40})",s,re.I):
              if m.group(1)!=CURRENT_TREE:
                stale_current_tree.append({"file":fn,"value":m.group(1),"expected":CURRENT_TREE})
            for m in re.finditer(r"(?:Live HEAD|Current HEAD)\s*[:：|]?\s*([0-9a-f]{40})",s,re.I):
              if m.group(1)!=EXPECTED_PARENT:
                stale_live_head.append({"file":fn,"value":m.group(1),"expected":EXPECTED_PARENT,"context":s[max(0,m.start()-100):m.end()+120]})
            for pat in [r"GitHub\s+new\s+live\s+HEAD",r"Repository[^\n]{0,140}\bbranch\s+new\b",r"\bBranch\s*\|?\s*new\b",r"GitHub\s+branch\s*\|?\s*new\b"]:
              for m in re.finditer(pat,s,re.I):
                wrong_branch.append({"file":fn,"match":m.group(0),"context":s[max(0,m.start()-120):m.end()+160]})
          # 3. structured UID field values across all docs
          critical={"OPERATION","CANONICAL OWNER","OWNER","RUNTIME OWNER","PERSISTENCE OWNER","ROUTE","ACTION REFERENCE","PERMISSION REFERENCE","REQUIRED PERMISSION","METHOD","PATH","STATUS"}
          def ch(h):
            u=n(h).upper()
            if "CANONICAL OWNER" in u:return "CANONICAL OWNER"
            if u in critical:return u
            if u=="OWNER / BOUNDARY" or u.endswith(" OWNER"):return "OWNER" if "RUNTIME" not in u and "PERSISTENCE" not in u else u
            return None
          uidpat=re.compile(r"^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+){1,}(?:[._][A-Z0-9]+)*$")
          vals=collections.defaultdict(lambda:collections.defaultdict(list))
          unresolved_rows=[]
          for fn,data in corpus.items():
            for t in data["tables"]:
              h=[n(x) for x in t["headers"]];hu=[x.upper() for x in h]
              for ri,row in enumerate(t["rows"],2):
                row=[n(x) for x in row]
                ident=None
                if h==["Entity","Operation","Applicability","Authority Evidence"] and len(row)>=2:
                  ident=f"ENTITY_OP::{fn}::{row[0]}::{row[1]}" # page-local; not cross-doc merged
                else:
                  idx=[i for i,x in enumerate(hu) if " UID" in x or x.endswith("UID") or x in {"UID","CONTROL UID","FIELD UID","ACTION UID","PAGE UID","FLOW UID","AUDIT UID"}]
                  for i in idx:
                    if i<len(row) and row[i]:ident=row[i];break
                  if ident is None and row and uidpat.match(row[0].upper()):ident=row[0]
                if ident:
                  for i,head in enumerate(h):
                    if i>=len(row) or not row[i]:continue
                    f=ch(head)
                    if f:vals[ident][f].append({"file":fn,"table":t["table"],"row":ri,"value":row[i]})
                  joined=" | ".join(row)
                  if re.search(r"\bSOURCE_NOT_DEFINED\b|\bRESOLVE_FROM_[A-Z0-9_]+\b|\bUNRESOLVED\b",joined,re.I):
                    unresolved_rows.append({"file":fn,"identity":ident,"table":t["table"],"row":ri,"cells":row})
          def placeholder(v):
            u=v.strip().upper()
            return u in {"","—","-","N/A","N/A_READ_ONLY","NOT_APPLICABLE","UNCHANGED","SOURCE_NOT_DEFINED"} or u.startswith("RESOLVE_FROM_") or "SOURCE_NOT_DEFINED" in u
          hard_cross=[];stale_mirrors=[];status_variants=[]
          for ident,fields in vals.items():
            for fld,recs in fields.items():
              byval=collections.defaultdict(list)
              for r in recs:byval[r["value"]].append(r)
              uniq=list(byval)
              if len(uniq)<=1:continue
              non=[v for v in uniq if not placeholder(v)]
              if fld=="STATUS":
                status_variants.append({"identity":ident,"field":fld,"values":uniq,"evidence":recs})
              elif len(set(non))>=2:
                hard_cross.append({"identity":ident,"field":fld,"values":sorted(set(non)),"all_values":uniq,"evidence":recs})
              elif non and len(uniq)>1:
                stale_mirrors.append({"identity":ident,"field":fld,"resolved":non,"all_values":uniq,"evidence":recs})
          # 4. broken explicit docx references
          broken_refs=[]
          # only capture basenames ending docx with safe non-separator run; exact known names are ignored
          ref_re=re.compile(r"([A-Za-z0-9_\-().\u4e00-\u9fff]+(?:_[A-Za-z0-9_\-().\u4e00-\u9fff]+)*\.docx)")
          for fn,data in corpus.items():
            for m in ref_re.finditer(data["text"]):
              ref=m.group(1)
              if ref not in names:
                # Ignore Mother/governance examples outside the 31-word set only if explicitly generic example-ish
                broken_refs.append({"file":fn,"reference":ref})
          # 5. planning corpus contamination: executable audit history embedded as current design content
          history=[]
          for fn,data in corpus.items():
            s=data["text"]
            for pat,label in [
              (r"BATCH\d+_MACHINE_JSON\s*=\s*\{","MACHINE_JSON"),
              (r"Persisted Resume Point","RESUME_POINT"),
              (r'"remaining_contract_cells"\s*:\s*[1-9]\d*',"NONZERO_REMAINING_CONTRACT_CELLS"),
              (r'"operation_placeholder_controls_pre"\s*:\s*[1-9]\d*',"OLD_PLACEHOLDER_PRECOUNT"),
              (r'"payload_defined"\s*:\s*0',"OLD_ZERO_PAYLOAD_DEFINED"),
              (r'"persistence_owner_defined"\s*:\s*0',"OLD_ZERO_PERSISTENCE_DEFINED"),
            ]:
              for m in re.finditer(pat,s,re.I):
                history.append({"file":fn,"type":label,"match":m.group(0),"context":s[max(0,m.start()-100):m.end()+180]})
          # 6. frozen design denominator recheck
          app_rows=[];hier=[]
          for fn,data in corpus.items():
            for t in data["tables"]:
              h=[n(x) for x in t["headers"]]
              if h==["Entity","Operation","Applicability","Authority Evidence"]:
                for r in t["rows"]:
                  if len(r)>=4:app_rows.append((fn,n(r[0]),n(r[1]),n(r[2]),n(r[3])))
              if h==["Parent Identity","Child Identity","Cardinality","Creation Entry","Payload / Reference Binding","Ordering Semantics","Permission","State Dependency","Version Dependency","Move / Reparent","Archive / Delete Propagation","Upstream Change Impact","Downstream Revalidation","Authority Evidence"]:
                for r in t["rows"]:hier.append((fn,)+tuple(n(x) for x in r[:14]))
          app_counts=collections.Counter(x[3] for x in app_rows)
          # Distinct stale current tree is denominator compressed for reporting
          stale_tree_by_file=collections.Counter(x["file"] for x in stale_current_tree)
          out={
            "marker":"ACPOS-20260922-BATCH-100-WORD-CROSS-DOCUMENT-CONSISTENCY-AUDIT-V1",
            "base_head":EXPECTED_PARENT,"word_tree":CURRENT_TREE,"docx_count":31,
            "index_missing_page_uids":index_missing,
            "global_integration_missing_page_uids":global_missing,
            "stale_current_tree_literals":{"occurrences":len(stale_current_tree),"by_file":dict(stale_tree_by_file),"samples":stale_current_tree[:40]},
            "stale_live_head_literals":stale_live_head,
            "wrong_current_branch_literals":wrong_branch,
            "hard_cross_document_field_conflicts":hard_cross,
            "stale_unresolved_mirrors":stale_mirrors,
            "status_variant_candidates":status_variants,
            "structured_unresolved_rows":unresolved_rows,
            "broken_docx_reference_candidates":broken_refs,
            "embedded_execution_history_candidates":history,
            "design_denominator":{
              "entity_applicability_rows":len(app_rows),
              "required":app_counts.get("REQUIRED",0),
              "optional":app_counts.get("OPTIONAL",0),
              "not_applicable":app_counts.get("NOT_APPLICABLE",0),
              "canonical_hierarchy_rows":len(hier)
            }
          }
          Path("__batch100_cross_document.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH100_SUMMARY="+json.dumps({
            "index_missing":len(index_missing),"global_missing":len(global_missing),
            "stale_current_tree_occurrences":len(stale_current_tree),
            "stale_current_tree_files":len(stale_tree_by_file),
            "stale_live_head":len(stale_live_head),"wrong_branch":len(wrong_branch),
            "hard_cross_conflicts":len(hard_cross),"stale_unresolved_mirrors":len(stale_mirrors),
            "status_variants":len(status_variants),"structured_unresolved_rows":len(unresolved_rows),
            "broken_ref_candidates":len(broken_refs),"embedded_history":len(history),
            "entity_applicability_rows":len(app_rows),"hierarchy_rows":len(hier)
          },ensure_ascii=False,sort_keys=True))
          print("BATCH100_AUDIT_EXECUTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch100-word-cross-document-consistency-audit
          path: __batch100_cross_document.json
          retention-days: 3
      - name: Close audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch100_cross_document.json
          git config user.name "acpos-batch100-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch100_word_cross_document_consistency_audit.yml
          git commit -m "chore(acpos): close batch 100 Word cross-document consistency audit"
          git push origin HEAD:0921acpos
