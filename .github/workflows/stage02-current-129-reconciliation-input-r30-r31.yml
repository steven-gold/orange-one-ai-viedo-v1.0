name: Stage-02 Current 129 Reconciliation + Input R30 R31

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-current-129-reconciliation-input-r30-r31.yml'
      - 'governance/ci/build_stage02_current_problem_reconciliation_r30.py'
      - 'governance/ci/validate_stage02_current_problem_reconciliation_r30.py'
      - 'governance/ci/build_stage02_owning_layer_remediation_input_packet_r31.py'
      - 'governance/ci/validate_stage02_owning_layer_remediation_input_packet_r31.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-and-build-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R30 R31 implementation
        run: |
          python -m py_compile governance/ci/build_stage02_current_problem_reconciliation_r30.py
          python -m py_compile governance/ci/validate_stage02_current_problem_reconciliation_r30.py
          python -m py_compile governance/ci/build_stage02_owning_layer_remediation_input_packet_r31.py
          python -m py_compile governance/ci/validate_stage02_owning_layer_remediation_input_packet_r31.py
      - name: Revalidate R29 corrected fresh evidence
        run: |
          python governance/ci/validate_stage02_failure_recovery_scanner_fix_r29.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.github/stage02-test/STAGE02_R29_EFFECTIVE_REEXECUTION_RESULT.json').read_text())
          assert r['fresh_functional_gap_total']==129, r
          assert r['effective_gap_categories']['FAILURE_STATE_ERROR_BINDING_MISSING']==23, r
          print('PASS: R29 corrected baseline=129')
          PY
      - name: Build and validate R30 current problem reconciliation
        run: |
          python governance/ci/build_stage02_current_problem_reconciliation_r30.py
          python governance/ci/validate_stage02_current_problem_reconciliation_r30.py
      - name: Build and validate R31 owning-layer input packet
        run: |
          python governance/ci/build_stage02_owning_layer_remediation_input_packet_r31.py
          python governance/ci/validate_stage02_owning_layer_remediation_input_packet_r31.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert current fail-closed baseline
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          r30=yaml.safe_load(Path('governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_PROBLEM_RECONCILIATION_R30.yaml').read_text())
          r31=yaml.safe_load(Path('governance/test/stage02/STAGE02_OWNING_LAYER_REMEDIATION_INPUT_PACKET_R31.yaml').read_text())
          assert r30['denominators']['fresh_effective_problems']==129, r30
          assert r30['denominators']['r28_scanner_false_positives_superseded']==21, r30
          assert r31['denominators']['total_required_inputs']==129, r31
          assert r31['denominators']['pending_inputs']==129 and r31['denominators']['provided_inputs']==0, r31
          assert r31['stage02_status']=='BLOCKED' and r31['stage03_allowed'] is False, r31
          print('PASS: current problem denominator=129; pending owning-layer inputs=129; Stage-02 fail-closed')
          PY
      - name: Persist R30 R31 current baseline
        run: |
          paths=(
            'governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_PROBLEM_RECONCILIATION_R30.yaml'
            'governance/test/stage02/STAGE02_OWNING_LAYER_REMEDIATION_INPUT_PACKET_R31.yaml'
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'R30/R31 outputs unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'test(stage02): persist corrected current 129 problem and input baseline R30 R31'
          git push origin HEAD:rebuild-v2.1.1
