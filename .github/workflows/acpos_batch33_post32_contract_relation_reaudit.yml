name: ACPOS Batch 33 Post32 Contract Relation Reaudit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch33-post32-contract-relation-reaudit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 32 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="fdc8a14c8b124331b1aebe007efbf4b61a3d0c28"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH32 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 33 post32 contract relation reaudit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch33_post32_contract_relation_reaudit.py

      - name: Verify Batch 33 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch33_post32_relation_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_cells"]==324,s
          assert s["post32_strong_unique_relation"]+s["post32_strong_relation_conflict"]+s["post32_no_strong_relation"]==324,s
          print("PASS: BATCH33 POST32 RELATION DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 33 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch33-post32-contract-relation-reaudit
          path: |
            __batch33_post32_relation_audit.json
            __batch33_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 33 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch33_post32_relation_audit.json __batch33_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-33-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch33_post32_contract_relation_reaudit.py .github/workflows/acpos_batch33_post32_contract_relation_reaudit.yml
          git commit -m "chore(acpos): close batch 33 post32 relation reaudit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH33 HARNESS REMOVED / CLEAN TREE"
