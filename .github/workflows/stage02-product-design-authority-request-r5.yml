name: Stage-02 Product Design Authority Request R5

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_product_design_authority_request_r5.py'
      - '.github/workflows/stage02-product-design-authority-request-r5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authority-request-r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py
      - name: Validate current Stage-02 owning-layer truth
        run: |
          python governance/ci/validate_current_stage2_materialized_closure.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_stage02_successor_integrity.py
      - name: Build exact non-authoritative Authority Request / Blocker Package
        run: python governance/ci/build_stage02_product_design_authority_request_r5.py
      - name: Prove no product/spec/Stage-01 authority mutation
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R5 request package is non-authoritative evidence/state only'
      - name: Verify request package cannot masquerade as authority
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_REQUEST_R5.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          assert d['artifact_type']=='NON_NORMATIVE_AUTHORITY_REQUEST_AND_BLOCKER_PACKAGE'
          assert d['normative_authority'] is False
          assert d['request_is_product_authority'] is False
          assert d['safety']['contains_product_authority_values'] is False
          assert d['safety']['may_be_used_as_authority_input'] is False
          assert d['denominators']=={
            'current_effective_blockers':154,
            'product_design_authority_requests':150,
            'gap006_external_authority_requests':4,
            'materializable_from_current_authority_now':0,
          }
          assert len(d['product_design_authority_requests'])==150
          assert len(d['gap006_external_authority_requests'])==4
          assert all(x['authority_value_supplied_by_ai'] is False for x in d['product_design_authority_requests'])
          assert all(x['authority_value_supplied_by_ai'] is False for x in d['gap006_external_authority_requests'])
          print('PASS: R5 request package cannot be interpreted as supplied authority')
          PY
      - name: Commit R5 request package and resume state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_REQUEST_R5.yaml
          git add governance/test/ACTIVE_STATE.yaml
          git add governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R5 generated no persistent request/state update' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist product design authority request R5'
          git push origin HEAD:rebuild-v2.1.1
      - name: Upload R5 request package
        uses: actions/upload-artifact@v4
        with:
          name: stage02-product-design-authority-request-r5
          path: governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_REQUEST_R5.yaml
          if-no-files-found: error
