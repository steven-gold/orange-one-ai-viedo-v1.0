name: CORE01 full preview sync once
on:
  push:
    paths:
      - '.github/workflows/core01-preview-sync-once.yml'
permissions:
  contents: write
jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Protect locked source and validate current build
        run: |
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test -z "$(git status --porcelain -- src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css src/components/pages/CoreVisual.module.css)"
          npm ci
          npm run typecheck
          cp next.config.ts /tmp/next.config.production.ts
          cat > next.config.ts <<'CFG'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            reactStrictMode: true,
            poweredByHeader: false,
            assetPrefix: ".",
          };
          export default nextConfig;
          CFG
          npm run build
      - name: Start production server for materialization
        run: |
          (npm run start -- -p 3000 > /tmp/acpos-next.log 2>&1 & echo $! > /tmp/acpos-next.pid)
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/acpos-next.log
          exit 1
      - name: Materialize all 18 pages from one preview build
        run: |
          rm -rf /tmp/static-site
          mkdir -p /tmp/static-site/preview/_next
          python - <<'PY'
          import subprocess
          from pathlib import Path
          routes={'/':'index.html','/core':'core.html','/assets':'assets.html','/video':'video.html','/edit':'edit.html','/qa':'qa.html','/database':'db.html','/strategy':'strategy.html','/info':'info.html','/admin/system':'system.html','/admin/accounts':'accounts.html','/admin/dev':'dev.html','/admin/social':'social.html','/admin/erp':'erp.html','/admin/aiapi':'aiapi.html','/admin/qa-criteria':'qa-criteria.html','/admin/strategy':'strategy-admin.html','/admin/knowledge':'knowledge-admin.html'}
          root=Path('/tmp/static-site/preview')
          for route,name in routes.items():
              html=subprocess.check_output(['curl','-fsS','http://127.0.0.1:3000'+route],text=True)
              (root/name).write_text(html)
          PY
          cp -R .next/static /tmp/static-site/preview/_next/static
          cp -R public/brand /tmp/static-site/preview/brand
      - name: Rewrite only canonical preview navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          nav={'/':'index.html','/core':'core.html','/assets':'assets.html','/video':'video.html','/edit':'edit.html','/qa':'qa.html','/database':'db.html','/strategy':'strategy.html','/info':'info.html','/admin/system':'system.html','/admin/accounts':'accounts.html','/admin/dev':'dev.html','/admin/social':'social.html','/admin/erp':'erp.html','/admin/aiapi':'aiapi.html','/admin/qa-criteria':'qa-criteria.html','/admin/strategy':'strategy-admin.html','/admin/knowledge':'knowledge-admin.html'}
          ordered=sorted(nav.items(),key=lambda item:len(item[0]),reverse=True)
          for p in Path('/tmp/static-site/preview').glob('*.html'):
              s=p.read_text().replace('/brand/','brand/')
              for route,target in ordered:
                  s=s.replace(f'href="{route}"',f'href="{target}"')
              p.write_text(s)
          PY
          test $(find /tmp/static-site/preview -maxdepth 1 -name '*.html' | wc -l) -eq 18
          test -d /tmp/static-site/preview/_next/static/chunks
          ! test -d /tmp/static-site/preview/_next/chunks
          ! grep -R 'wb01-preview-runtime\|acpos-preview-drawer' /tmp/static-site/preview/*.html
          grep -q '\./_next/static/' /tmp/static-site/preview/index.html
          grep -q '\./_next/static/' /tmp/static-site/preview/core.html
      - name: Run real Chromium against materialized static preview
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          (python3 -m http.server 4173 --directory /tmp/static-site > /tmp/static-http.log 2>&1 & echo $! > /tmp/static-http.pid)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/preview/index.html >/dev/null && break; sleep 1; done
          cat > static-hydration-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[];
            const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText}`));
            await page.goto('http://127.0.0.1:4173/preview/index.html',{waitUntil:'networkidle'});
            await page.waitForSelector('[data-page-uid="workspace:WB-01"]');
            const sections=await page.locator('[data-section-id^="SEC-WORKSPACE-WB-01-"]').count();
            const buttons=page.locator('[data-control-id^="CTRL-WORKSPACE-WB-01-"]');
            const count=await buttons.count();
            if(sections!==14||count!==14) throw new Error(`dashboard registry mismatch sections=${sections} controls=${count}`);
            for(let i=0;i<count;i++){
              await buttons.nth(i).click();
              const drawer=page.locator('[data-component-uid="WB-01-CMP-DRAWER-PROJECTION"]');
              await drawer.waitFor({state:'visible',timeout:5000});
              const dstate=await drawer.getAttribute('data-state');
              if(!['LOADING','ERROR','READ_ONLY'].includes(dstate)) throw new Error(`invalid drawer state ${dstate}`);
              if(await page.locator('#acpos-preview-drawer').count()) throw new Error('forbidden preview drawer detected');
              await page.keyboard.press('Escape');
              await drawer.waitFor({state:'detached'});
            }
            const navHref=await page.locator('a[data-nav-id="NAV-02"]').getAttribute('href');
            if(navHref!=='core.html') throw new Error(`bad preview nav ${navHref}`);
            if(pageErrors.length||failed.length) throw new Error(`homepage browser errors page=${JSON.stringify(pageErrors)} failed=${JSON.stringify(failed)}`);

            await page.goto('http://127.0.0.1:4173/preview/core.html',{waitUntil:'networkidle'});
            const core=page.locator('[data-page-uid="CORE-01"]');
            await core.waitFor({state:'visible'});
            if(await page.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count()!==1) throw new Error('static preview invented project options');
            if(await page.locator('[data-control-id="CORE-01-CTL-TOPIC"] option').count()!==1) throw new Error('static preview invented topic options');
            if(await page.locator('[data-control-id="CORE-01-LST-WORK-ITEMS"] option').count()!==1) throw new Error('static preview invented work-item options');
            if(await page.locator('[data-control-id="CORE-01-LST-THREADS"] option').count()!==1) throw new Error('static preview invented thread options');
            const posts=[];
            page.on('request',r=>{if(r.method()==='POST') posts.push(r.url())});
            await page.locator('[data-control-id="CORE-01-BTN-PROJECT-VALIDATE"]').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('REQUIRED_PROJECT_VERSION_REF_MISSING'));
            if(posts.length) throw new Error('missing exact ref emitted POST '+posts.join(','));
            if(await page.locator('#acpos-preview-drawer').count()) throw new Error('preview contamination detected on CORE');
            console.log('STATIC_HYDRATION_PASS sections=14 controls=14 drawer=14/14');
            console.log('CORE01_STATIC_FAIL_CLOSED_PASS posts=0');
            console.log('PAGE_ERRORS',pageErrors);
            console.log('FAILED_REQUESTS',failed);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node static-hydration-check.cjs
          rm -f static-hydration-check.cjs
      - name: Sync entire matching build to preview branch
        run: |
          git fetch origin acpos-live-preview
          git worktree add -B acpos-live-preview /tmp/acpos-preview origin/acpos-live-preview
          rm -rf /tmp/acpos-preview/preview
          cp -R /tmp/static-site/preview /tmp/acpos-preview/preview
          cd /tmp/acpos-preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview
          git commit -m 'sync(preview): publish CORE01 validated full build'
          git push origin HEAD:acpos-live-preview
      - name: Verify pushed preview branch and public commit URL
        run: |
          git fetch origin acpos-live-preview
          PREVIEW_SHA=$(git rev-parse origin/acpos-live-preview)
          echo PREVIEW_SHA=$PREVIEW_SHA
          echo $PREVIEW_SHA > /tmp/preview-sha
          test $(git ls-tree -r --name-only origin/acpos-live-preview preview | grep -E '^preview/[^/]+\.html$' | wc -l) -eq 18
          git show origin/acpos-live-preview:preview/index.html | grep -q 'WB-01-CMP-DRAWER-PROJECTION'
          git show origin/acpos-live-preview:preview/index.html | grep -q '\./_next/static/'
          git show origin/acpos-live-preview:preview/core.html | grep -q 'CORE-01'
      - name: Chromium verify pushed public preview
        run: |
          PREVIEW_SHA=$(cat /tmp/preview-sha)
          cat > public-preview-check.cjs <<NODE
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[],failed=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(r.url()));
            const base='https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/${PREVIEW_SHA}/preview/';
            await page.goto(base+'index.html',{waitUntil:'networkidle',timeout:60000});
            if(await page.locator('[data-section-id^="SEC-WORKSPACE-WB-01-"]').count()!==14) throw new Error('public homepage section mismatch');
            const first=page.locator('[data-control-id^="CTRL-WORKSPACE-WB-01-"]').first();
            await first.click();
            const drawer=page.locator('[data-component-uid="WB-01-CMP-DRAWER-PROJECTION"]');
            await drawer.waitFor({state:'visible',timeout:10000});
            await page.keyboard.press('Escape');
            await drawer.waitFor({state:'detached'});
            if(errors.length||failed.length) throw new Error(`public homepage errors page=${JSON.stringify(errors)} failed=${JSON.stringify(failed)}`);
            await page.goto(base+'core.html',{waitUntil:'networkidle',timeout:60000});
            await page.locator('[data-page-uid="CORE-01"]').waitFor({state:'visible'});
            if(await page.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count()!==1) throw new Error('public CORE invented project options');
            const posts=[]; page.on('request',r=>{if(r.method()==='POST') posts.push(r.url())});
            await page.locator('[data-control-id="CORE-01-BTN-PROJECT-VALIDATE"]').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('REQUIRED_PROJECT_VERSION_REF_MISSING'));
            if(posts.length) throw new Error('public CORE emitted POST without exact ref');
            console.log('PUBLIC_PREVIEW_PASS sha=${PREVIEW_SHA}');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node public-preview-check.cjs
          rm -f public-preview-check.cjs
      - name: Self clean and restore source config
        run: |
          git worktree remove /tmp/acpos-preview --force || true
          cp /tmp/next.config.production.ts next.config.ts
          rm -f .github/workflows/core01-preview-sync-once.yml static-hydration-check.cjs public-preview-check.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add next.config.ts .github/workflows/core01-preview-sync-once.yml
          git commit -m 'chore(core01): remove completed preview sync workflow'
          git push origin HEAD:new
