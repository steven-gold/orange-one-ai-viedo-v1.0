name: ACPOS Batch 07 Canonical Context Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-07-context-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_07_context_audit.py
      - name: Run canonical context audit
        run: python __temp/batch_07_context_audit.py
      - name: Upload Batch 07 context evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-07-canonical-context-audit
          path: __batch07_context_audit.json
          retention-days: 1
