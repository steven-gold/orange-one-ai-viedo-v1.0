name: VIDEO-01 closure validation

on:
  push:
    branches:
      - acpos-video01-closure-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: VIDEO authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          auth=Path('authority/pages/workspace/VIDEO-01/VIDEO_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml').read_text()
          visual=Path('src/components/pages/VideoVisual.tsx').read_text()
          contract=Path('src/domain/video/videoRuntimeContract.ts').read_text()
          projection=Path('src/domain/video/videoProjectionPort.ts').read_text()
          controlled=Path('src/server/testing/controlledVideoTestRuntime.ts').read_text()
          client=Path('src/domain/video/controlledVideoClientTestRuntime.ts').read_text()
          sections=set(re.findall(r'section_uid:\s*(VIDEO-01-SEC-[0-9]+)',auth))
          components=set(re.findall(r'component_uid:\s*(VIDEO-01-CMP-[A-Z0-9-]+)',auth))
          controls=set(re.findall(r'control_uid:\s*(VIDEO-01-[A-Z0-9-]+)',auth))
          actions=set(re.findall(r'action_uid:\s*(VIDEO-01-ACT-[A-Z0-9-]+)',auth))
          gates=set(re.findall(r'gate_uid:\s*(VIDEO-01-GATE-[A-Z0-9-]+)',auth))
          perms=set(re.findall(r'permission_uid:\s*(VIDEO_[A-Z0-9_]+)',auth))
          errors=set(re.findall(r'error_uid:\s*(VIDEO-01-ERR-[A-Z0-9-]+)',auth))
          actual={'sections':len(sections),'components':len(components),'controls':len(controls),'actions':len(actions),'gates':len(gates),'permissions':len(perms),'errors':len(errors)}
          print('VIDEO_AUTHORITY_COUNTS',actual)
          assert len(sections)==10
          assert len(controls)==85
          assert len(errors)==17
          assert all(x in visual for x in controls), sorted(x for x in controls if x not in visual)
          contract_actions=set(re.findall(r'"(VIDEO-01-ACT-[A-Z0-9-]+)"',contract.split('VIDEO_ACTION_UIDS=',1)[1].split('] as const',1)[0]))
          assert contract_actions==actions, (sorted(actions-contract_actions),sorted(contract_actions-actions))
          contract_errors=set(re.findall(r'"(VIDEO-01-ERR-[A-Z0-9-]+)"',contract))
          assert errors.issubset(contract_errors), sorted(errors-contract_errors)
          required=['VideoProjectionTestMetadata','data_classification:"TEST_ONLY"','production_eligible:false','!isControlledTestMode()','test_metadata:TEST_METADATA']
          assert all(x in projection+controlled for x in required)
          assert 'data-data-classification={projection?.test_metadata?.data_classification}' in visual
          assert 'VIDEO-01-GATE-HANDOFF":true' in client
          assert 'VIDEO-01-ERR-HANDOFF-001' in controlled
          print('VIDEO_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production VIDEO must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3161 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/video-prod.log 2>&1 &
          pid=$!; trap 'cat /tmp/video-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3161/video >/dev/null && break || sleep 1; done
          pcode=$(curl -sS -o /tmp/video-prod-proj.json -w '%{http_code}' 'http://127.0.0.1:3161/v1/ui-projections/VIDEO-01')
          cat /tmp/video-prod-proj.json
          test "$pcode" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/video-prod-proj.json
          ! grep -q 'TEST_ONLY' /tmp/video-prod-proj.json
          ccode=$(curl -sS -o /tmp/video-prod-command.json -w '%{http_code}' -H 'content-type: application/json' -X POST 'http://127.0.0.1:3161/v1/tasks/TEST-VIDEO-TASK-001/execute' --data '{}')
          cat /tmp/video-prod-command.json
          test "$ccode" = "503"
          grep -q 'DEPARTMENT_OPERATION_RUNTIME_NOT_BOUND' /tmp/video-prod-command.json
          ! grep -q 'TEST_ONLY' /tmp/video-prod-command.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled VIDEO projection classification
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3162 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/video-controlled.log 2>&1 &
          pid=$!; trap 'cat /tmp/video-controlled.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3162/video >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/video-controlled-proj.json -w '%{http_code}' 'http://127.0.0.1:3162/v1/ui-projections/VIDEO-01')
          test "$code" = "200"
          python <<'PY'
          import json
          d=json.load(open('/tmp/video-controlled-proj.json'))
          m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY'
          assert m['synthetic'] is True
          assert m['created_for_validation'] is True
          assert m['production_eligible'] is False
          assert d['page_state']=='READY'
          assert len(d['gate_state'])==16
          assert '[TEST]' in d['lists']['VIDEO-01-FLD-PROJECT'][0]['label']
          print('VIDEO_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled VIDEO browser interactions
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3163 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/video-browser.log 2>&1 &
          pid=$!; trap 'cat /tmp/video-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3163/video >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1100}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3163/video',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`VIDEO route ${res&&res.status()} ${width}`);
              await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='READY');
              const root=page.locator('[data-page-uid="VIDEO-01"]');
              if(await root.getAttribute('data-authority-controls')!=='85'||await root.getAttribute('data-registry-valid')!=='true')throw new Error('VIDEO registry metadata mismatch');
              if(await root.getAttribute('data-data-classification')!=='TEST_ONLY'||await root.getAttribute('data-production-eligible')!=='false')throw new Error('VIDEO classification missing');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>0)throw new Error(`VIDEO horizontal overflow ${overflow} ${width}`);
              const ids=await page.locator('[data-control-id]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-control-id')));
              if(new Set(ids).size!==ids.length)throw new Error(`VIDEO duplicate control ids ${ids.length}/${new Set(ids).size}`);
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1300}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3163/video',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='READY');
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            for(const id of ['VIDEO-01-BTN-CONFIRM','VIDEO-01-BTN-MODIFY','VIDEO-01-BTN-LOCK','VIDEO-01-BTN-HANDOFF']) if(!(await q(id).isDisabled()))throw new Error(`${id} must be disabled initially`);
            await q('VIDEO-01-FLD-PROJECT').selectOption('TEST-VIDEO-PROJECT-001');
            await q('VIDEO-01-FLD-TOPIC').selectOption('TEST-VIDEO-TOPIC-001');
            await q('VIDEO-01-FLD-TASK').selectOption('TEST-VIDEO-TASK-001');
            const execResponse=page.waitForResponse(r=>r.url().includes('/v1/tasks/TEST-VIDEO-TASK-001/execute')&&r.request().method()==='POST');
            await q('VIDEO-01-BTN-EXECUTE').click();
            if((await execResponse).status()!==200)throw new Error('VIDEO execute failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='CANDIDATE_OUTPUT');
            if(await q('VIDEO-01-BTN-EVALUATE').isDisabled())throw new Error('VIDEO evaluate disabled on candidate');
            const eval1=page.waitForResponse(r=>r.url().endsWith('/v1/scorecards')&&r.request().method()==='POST');
            await q('VIDEO-01-BTN-EVALUATE').click();
            if((await eval1).status()!==200)throw new Error('VIDEO evaluation 1 failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='WAIT_CONFIRMATION');
            const score1=(await q('VIDEO-01-FLD-OVERALL-SCORE').textContent())||'';
            if(!score1.includes('92'))throw new Error(`VIDEO first score not 92: ${score1}`);
            if(!(await q('VIDEO-01-BTN-CONFIRM').isDisabled()))throw new Error('VIDEO confirm enabled below threshold');
            if(await q('VIDEO-01-BTN-MODIFY').isDisabled())throw new Error('VIDEO modify not enabled at correction gate');
            await q('VIDEO-01-BTN-MODIFY').click();
            await page.waitForFunction(()=>document.querySelector('[data-component-uid="VIDEO-01-CMP-CORRECTION-SCOPE"]')?.getAttribute('data-conditional-controls')==='8');
            await q('VIDEO-01-FLD-SCENE').selectOption('TEST-SCENE-001');
            await q('VIDEO-01-FLD-SHOT').selectOption('TEST-SHOT-001');
            await q('VIDEO-01-FLD-START-TC').fill('00:00:01.000');
            await q('VIDEO-01-FLD-END-TC').fill('00:00:03.000');
            await q('VIDEO-01-FLD-TARGET-OBJECT').selectOption('TEST-OBJECT-CHARACTER-001');
            await q('VIDEO-01-FLD-TARGET-LAYER').selectOption('TEST-VIDEO-LAYER-COMPOSITE-001');
            await q('VIDEO-01-TXT-CORRECTION').fill('修正角色動作連續性，維持已鎖定 DNA 與鏡頭意圖。');
            await q('VIDEO-01-BTN-GEN-CORRECTION').click();
            await q('VIDEO-01-BTN-APPROVE-CORRECTION').click();
            const correctionExec=page.waitForResponse(r=>r.url().includes('/v1/tasks/TEST-VIDEO-TASK-001/execute')&&r.request().method()==='POST');
            await q('VIDEO-01-BTN-EXEC-CORRECTION').click();
            if((await correctionExec).status()!==200)throw new Error('VIDEO correction execute failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='CANDIDATE_OUTPUT');
            const eval2=page.waitForResponse(r=>r.url().endsWith('/v1/scorecards')&&r.request().method()==='POST');
            await q('VIDEO-01-BTN-EVALUATE').click();
            if((await eval2).status()!==200)throw new Error('VIDEO evaluation 2 failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='WAIT_CONFIRMATION');
            const score2=(await q('VIDEO-01-FLD-OVERALL-SCORE').textContent())||'';
            if(!score2.includes('98'))throw new Error(`VIDEO second score not 98: ${score2}`);
            if(await q('VIDEO-01-BTN-CONFIRM').isDisabled())throw new Error('VIDEO confirm not enabled at 98');
            const confirm=page.waitForResponse(r=>r.url().includes('/decision')&&r.request().method()==='POST');
            await q('VIDEO-01-BTN-CONFIRM').click();
            if((await confirm).status()!==200)throw new Error('VIDEO confirm failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='CONFIRMED');
            if(await q('VIDEO-01-BTN-LOCK').isDisabled())throw new Error('VIDEO lock not enabled after confirm');
            await q('VIDEO-01-BTN-LOCK').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='LOCKED');
            if(await q('VIDEO-01-BTN-HANDOFF').isDisabled())throw new Error('VIDEO handoff not enabled after lock');
            const handoff=page.waitForResponse(r=>r.url().endsWith('/v1/handoffs')&&r.request().method()==='POST');
            await q('VIDEO-01-BTN-HANDOFF').click();
            if((await handoff).status()!==200)throw new Error('VIDEO handoff failed');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="VIDEO-01"]')?.getAttribute('data-page-state')==='HANDOFF');
            const body=(await page.locator('body').textContent())||'';
            if(!body.includes('TEST-VIDEO-EDIT-HANDOFF-CONTRACT-001')||!body.includes('TEST-SHA256-VIDEO-2'))throw new Error('VIDEO exact manifest not visible');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('VIDEO_BROWSER_INTERACTION_PASS');
            await page.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/video src/server/video src/server/testing/controlledVideoTestRuntime.ts src/components/pages/VideoVisual.tsx
          test ! -e .github/workflows/video01-runtime-fix-once.yml
          git diff --exit-code
