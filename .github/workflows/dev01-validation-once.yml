name: DEV-01 validation once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/dev01-validation-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scope Authority and runtime guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=b2b443e7235bba1e042a88a072d652f8671a595b
          allowed='^(src/components/pages/DevControlRuntime.tsx|src/components/pages/DevVisual.tsx|src/domain/dev/devProjectionPort.ts|src/domain/dev/devControlBindings.ts|src/domain/dev/devRuntimeContract.ts|.github/workflows/dev01-validation-once.yml)$'
          bad=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
          test "$(sha256sum src/components/pages/DevVisual.module.css | awk '{print $1}')" = 9308ec244ffe6936d8b05a55d1373dc215fe2309e216bb5e58c3e7caf248eb2f
          git diff --quiet "$BASE" -- src/i18n/devCatalog.ts
          git diff --quiet "$BASE" -- src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css
          AUTH=authority/pages/admin/DEV-01/ACPOS_DEV-01_ENTERPRISE_AUTOMATION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml
          grep -q 'page_uid: admin:DEV-01' "$AUTH"
          grep -q 'status: FINAL_LOCKED' "$AUTH"
          grep -q 'system_implementation_status: NOT_EXECUTED' "$AUTH"
          grep -q 'single_page_workspace: true' "$AUTH"
          test "$(grep -c '^- section_uid: DEV-01-SEC-' "$AUTH")" = 9
          test "$(grep -c '^- component_uid: DEV-01-CMP-' "$AUTH")" = 15
          test "$(grep -c '^- control_uid: DEV-01-' "$AUTH")" = 22
          test "$(grep -c '^- action_uid: DEV-01-ACT-' "$AUTH")" = 22
          test "$(grep -c '^- gate_uid: DEV-01-GATE-' "$AUTH")" = 15
          test "$(grep -c '^- error_uid: DEV-01-ERR-' "$AUTH")" = 12
          grep -q 'Candidate never directly sends' "$AUTH"
          grep -q 'exactly one To' "$AUTH"
          grep -q 'CC/BCC empty' "$AUTH"
          grep -q 'Suppressed contacts cannot be sent' "$AUTH"
          grep -q 'No Parallel System' "$AUTH"
          test "$(grep -R 'configureDevProjectionResolver' src --exclude=devProjectionPort.ts | wc -l | tr -d ' ')" = 0
          test "$(grep -R 'configureDevCommandAdapter' src --exclude=devCommandPort.ts | wc -l | tr -d ' ')" = 0
          test "$(grep -c '^  \"DEV-01-BTN-' src/domain/dev/devControlBindings.ts)" = 22
          test "$(grep -c '^  \"DEV-01-GATE-' src/domain/dev/devRuntimeContract.ts)" = 15
          test "$(grep -c '^  \"DEV-01-ERR-' src/domain/dev/devRuntimeContract.ts)" = 12
          ! grep -q 'Send' src/components/pages/DevVisual.tsx
          echo DEV01_SCOPE_AUTHORITY_PASS
      - name: Install and audit
        run: |
          npm ci
          npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Route and residue guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -d 'src/app/v1/outreach'
          test ! -e 'src/app/v1/change-requests'
          test ! -e 'src/app/v1/operations/kill-switch'
          files=(src/components/pages/DevControlRuntime.tsx src/components/pages/DevVisual.tsx src/domain/dev/devProjectionPort.ts src/domain/dev/devControlBindings.ts src/domain/dev/devRuntimeContract.ts)
          ! grep -En 'TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|@ts-expect-error|debugger|console\.(log|debug)' "${files[@]}"
          echo DEV01_RESIDUE_PASS
      - name: Production Chromium validation
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 4173 > /tmp/dev01-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/dev01-next.log || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/admin/dev >/dev/null; then break; fi
            sleep 1
          done
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const nonGetV1=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/')&&r.method()!=='GET')nonGetV1.push(`${r.method()} ${u.pathname}`)});
            await page.goto('http://127.0.0.1:4173/admin/dev',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:DEV-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:DEV-01"]')?.getAttribute('data-projection-status')==='BLOCKED');
            const expected={
              'data-authority-status':'FINAL_LOCKED','data-authority-sections':'9','data-authority-components':'15','data-authority-controls':'22',
              'data-authority-actions':'22','data-authority-gates':'15','data-authority-errors':'12','data-implementation-status':'NOT_EXECUTED',
              'data-single-page-workflow':'true','data-control-registry-valid':'true','data-page-state':'ERROR','data-projection-status':'BLOCKED',
              'data-projection-reason':'UI_PROJECTION_RUNTIME_NOT_BOUND','data-runtime-error-uid':'DEV-01-ERR-UNDEFINED',
              'data-projection-adapter-ready':'false','data-command-adapter-ready':'false','data-effectful-runtime-ready':'false','data-page-gate-ready':'false','data-active-stage':'discovery'
            };
            for(const [k,v] of Object.entries(expected)) assert.equal(await root.getAttribute(k),v,k);
            assert.equal(await page.locator('[data-section-id="DEV-01-SEC-01"]').count(),1);
            assert.equal(await page.locator('[data-section-id="DEV-01-SEC-02"]').count(),1);
            assert.equal(await page.locator('[data-section-id="DEV-01-SEC-03"]').count(),1);
            assert.equal(await page.locator('[data-section-id="DEV-01-SEC-08"]').count(),1);
            assert.equal(await page.locator('[data-section-id="DEV-01-SEC-09"]').count(),1);
            assert.equal(await page.locator('[data-control-id^="DEV-01-"]').count(),6);
            for(const id of ['DEV-01-BTN-STAGE-1','DEV-01-BTN-STAGE-2','DEV-01-BTN-STAGE-3','DEV-01-BTN-STAGE-4','DEV-01-BTN-STAGE-5']){
              const control=page.locator(`[data-control-id="${id}"]`);
              assert.equal(await control.isDisabled(),true,id);
              assert(await control.getAttribute('data-action-uid'));
              assert.equal(await control.getAttribute('data-gate-uid'),'DEV-01-GATE-PAGE');
              assert.equal(await control.getAttribute('data-effect-type'),'UI_CONTEXT_STATE');
              assert.equal(await control.getAttribute('data-runtime-binding'),'CLIENT_STATE_OR_VIEW_NO_API_REQUIRED');
              assert.equal(await control.getAttribute('data-current-state'),'DISABLED');
              assert.equal(await control.getAttribute('data-formal-runtime-ready'),'not-required');
            }
            const start=page.locator('[data-control-id="DEV-01-BTN-DISCOVERY-START"]');
            assert.equal(await start.isDisabled(),true);
            assert.equal(await start.getAttribute('data-action-uid'),'DEV-01-ACT-DISCOVERY-START');
            assert.equal(await start.getAttribute('data-gate-uid'),'DEV-01-GATE-DISCOVERY-START');
            assert.equal(await start.getAttribute('data-permission-uid'),'outreach.discovery.configure');
            assert.equal(await start.getAttribute('data-effect-type'),'REGISTERED_COMMAND');
            assert.equal(await start.getAttribute('data-runtime-binding'),'SOURCE_REGISTERED_OPERATION');
            assert.equal(await start.getAttribute('data-operation'),'startCompanyDiscovery');
            assert.equal(await start.getAttribute('data-method-path'),'POST /v1/outreach/discovery-jobs');
            assert.equal(await start.getAttribute('data-current-state'),'DISABLED');
            assert.equal(await start.getAttribute('data-formal-runtime-ready'),'false');
            await page.locator('[data-control-id="DEV-01-BTN-STAGE-2"]').click({force:true});
            assert.equal(await root.getAttribute('data-active-stage'),'discovery');
            assert.equal(await page.locator('[data-section-id="DEV-01-SEC-04"]').count(),0);
            assert.equal(await page.getByText('Message 階段不提供 Send；Candidate 必須先完成受治理審查。').count(),0);
            const source=await page.locator('body').textContent();
            assert(source.includes('每次實際寄送只能有一個 To')===false,'delivery stage must remain inactive');
            const direct=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3ADEV-01',{cache:'no-store'});return{status:r.status,body:await r.json()}});
            assert.equal(direct.status,503);
            assert.equal(direct.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.deepEqual(nonGetV1,[]);
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('DEV01_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('DEV01_BROWSER_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
