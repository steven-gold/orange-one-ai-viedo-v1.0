  - index: 7
    style: Normal
    text: 'Mother Basic Logic Design / Normative Logic Contract

      母級基礎邏輯設計／規範性邏輯契約'
  - index: 12
    style: Heading 1
    text: 0. 文件使用方式與不可誤解原則
  - index: 13
    style: Normal
    text: 本文件定義 ACPOS 全站唯一 Shared Conversation Core 的母級邏輯。任何有 AI 對話的頁面或工作台 MUST 使用這一套 Conversation / Thread / Branch / Message / Reference / Resume / Assistant /
      Memory Projection 契約；Domain Extension 只能新增 Domain-specific context、permission、action、read-model 與 presentation，MUST_NOT 建立第二套聊天核心。
  - index: 16
    style: Heading 1
    text: 1. Design Identity / 設計身份、目的與邊界
  - index: 18
    style: Heading 1
    text: 2. Authority / Source Basis / 權威與來源使用規則
  - index: 20
    style: Normal
    text: 若任何來源互相衝突，MUST 先依 Current Governance、Current Canonical Owner 與 ACPOS-AI-01 Truth/Context precedence 解決；不得由本文件用「最新看起來合理」自行覆蓋。
  - index: 21
    style: Heading 1
    text: 3. Shared Conversation Core Architecture / 共用對話核心架構
  - index: 22
    style: Normal
    text: Shared Conversation Core MUST 是所有對話型工作區的唯一底座。Domain Extension 只提供 context sources、domain commands、permission projection、render extension 與 business handoff；Conversation
      identity、message storage semantics、reference grammar、branch/resume、assistant record 與 Multi-AI relation model MUST 共用。
  - index: 25
    style: Heading 1
    text: 4. Owner Boundary & Extension Model / Owner 邊界與 Extension 模式
  - index: 28
    style: Heading 1
    text: 5. Core Entity Inventory / 核心實體與唯一責任
  - index: 30
    style: Heading 2
    text: 5.1 Entity Hierarchy / Relationship Matrix
  - index: 32
    style: Heading 1
    text: 6. Business Entity × Operation Matrix / 實體 × 操作
  - index: 34
    style: Heading 1
    text: 7. Conversation Identity & Scope Contract / 對話身份與 Scope
  - index: 36
    style: Normal
    text: Conversation identity MUST_NOT be derived from browser tab, URL alone, provider chat ID, model session ID, UI component instance, or chat title. External/provider
      identifiers MAY be stored as transport metadata only.
  - index: 37
    style: Heading 1
    text: 8. Normative Invariant Registry / 規範性不變式
  - index: 39
    style: Heading 1
    text: 9. Conversation / Thread / Branch State Machine
  - index: 42
    style: Heading 1
    text: 10. State Transition Guard Matrix / 狀態轉移守衛
  - index: 44
    style: Heading 1
    text: 11. Message Identity, Indexing & Canonical Reference Contract
  - index: 46
    style: Normal
    text: Reference resolution MUST return object type, canonical identity, current visibility/permission, source conversation/thread/branch, and resolution status.
      A failed or ambiguous resolution MUST NOT be replaced by fuzzy search.
  - index: 47
    style: Heading 1
    text: 12. Timeline vs Relationship Graph / 時間線與關係圖
  - index: 50
    style: Heading 1
    text: '13. @ / # Composer Parser Contract'
  - index: 53
    style: Heading 1
    text: 14. Context Binding / Fingerprint Contract
  - index: 54
    style: Normal
    text: Conversation Core does not own Global Context truth. It MUST bind ACPOS-AI-01 outputs exactly and preserve the identity used for each request/response.
      A response without reconstructable context identity is not a valid Current conversation artifact for governed downstream use.
  - index: 57
    style: Heading 1
    text: 15. Stale Context & Resume Resolution / 過期 Context 與續作
  - index: 60
    style: Heading 1
    text: 16. Single AI Contract / 單 AI 對話契約
  - index: 62
    style: Heading 1
    text: 17. Multi-AI Session Contract / 多 AI Session
  - index: 66
    style: Heading 1
    text: 18. Cross-AI Relation Contract / 交叉討論契約
  - index: 69
    style: Normal
    text: Cross-AI loops MAY continue A→B→C→A repeatedly. No number of AI agreements upgrades unsupported content into Source Fact; evidence admission stays with
      ACPOS-AI-01 and relevant Domain Authority.
  - index: 70
    style: Heading 1
    text: 19. AI Assistant Role Contract / AI 助理角色契約
  - index: 74
    style: Heading 1
    text: 20. Assistant Record / Meeting Summary Data Contract
  - index: 76
    style: Normal
    text: Assistant summary MUST be a derived artifact. Any later source message/Decision change that affects its source set MUST mark the summary stale or create
      a new version; silent rewrite of an earlier summary is forbidden.
  - index: 77
    style: Heading 1
    text: 21. Conversation Memory Taxonomy / 對話記憶分類
  - index: 79
    style: Normal
    text: Conversation “memory” MUST therefore mean a typed memory class. Unqualified “remember this” MUST NOT silently write Global Experience or Domain Canon; the
      system must resolve the requested memory class and permission first.
  - index: 80
    style: Heading 1
    text: 22. Idea / Candidate / Decision Memory Boundary
  - index: 83
    style: Heading 1
    text: 23. Branch / Fork / Adopt / Sync Contract
  - index: 85
    style: Heading 1
    text: 24. Conversation Continuity & Resume Algorithm
  - index: 86
    style: Normal
    text: 1. Resolve exact Conversation ID from Current allowed scope; do not infer from title alone.
  - index: 87
    style: Normal
    text: 2. Resolve active Thread/Branch identity and persisted ResumePointer.
  - index: 88
    style: Normal
    text: 3. Verify permission against conversation scope and extension binding.
  - index: 89
    style: Normal
    text: 4. Load immutable message chronology up to required sequence; load relation graph separately.
  - index: 90
    style: Normal
    text: 5. Resolve bound ContextSnapshotRef/Fingerprint and compare with Current context owner state when operation requires Current.
  - index: 91
    style: Normal
    text: 6. Mark CURRENT / HISTORICAL / STALE / UNVERIFIED / BLOCKED explicitly.
  - index: 92
    style: Normal
    text: 7. Load conversation-local memory projection only as derived helper; never as higher authority than Decision/Context.
  - index: 93
    style: Normal
    text: 8. Restore Multi-AI session aliases/round relations when resuming within that session.
  - index: 94
    style: Normal
    text: 9. Restore Assistant record links and open questions without inventing completion.
  - index: 95
    style: Normal
    text: 10. Persist a new resume event only after successful resolution; browser state does not become authority.
  - index: 96
    style: Heading 1
    text: 25. Attachment / Source Reference Contract
  - index: 98
    style: Normal
    text: An attachment shown in the composer is not automatically trusted Context. Inclusion into AI request requires successful reference resolution, permission/classification,
      and the applicable ACPOS-AI-01 retrieval/context decision.
