name: Stage-02 Transition Role-Safe Candidate Authoring R36

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-transition-role-safe-candidate-authoring-r36.yml'
      - 'governance/ci/build_stage02_transition_role_safe_candidate_authoring_r36.py'
      - 'governance/ci/validate_stage02_transition_role_safe_candidate_authoring_r36.py'
      - 'governance/test/stage02/STAGE02_TRANSITION_LEDGER_REQUIRED_APPLICABILITY_R34.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author-validate-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R36 implementation
        run: |
          python -m py_compile governance/ci/build_stage02_transition_role_safe_candidate_authoring_r36.py
          python -m py_compile governance/ci/validate_stage02_transition_role_safe_candidate_authoring_r36.py
      - name: Revalidate R34 baseline
        run: python governance/ci/validate_stage02_transition_ledger_required_applicability_r34.py
      - name: Author transition role-safe candidates
        run: python governance/ci/build_stage02_transition_role_safe_candidate_authoring_r36.py
      - name: Validate transition role-safe candidates
        run: python governance/ci/validate_stage02_transition_role_safe_candidate_authoring_r36.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert authoring only and zero premature reduction
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('governance/test/stage02/STAGE02_TRANSITION_ROLE_SAFE_CANDIDATE_AUTHORING_R36.yaml').read_text())
          assert d['denominators']['input_required_fields']==40
          assert d['denominators']['blocker_reduction_claimed']==0
          assert d['product_contract_materialized_this_cycle'] is False
          assert d['stage02_status']=='BLOCKED' and d['stage03_allowed'] is False
          print('PASS: R36 is candidate authoring only; no blocker reduction or product materialization')
          PY
      - name: Persist R36 evidence
        run: |
          path='governance/test/stage02/STAGE02_TRANSITION_ROLE_SAFE_CANDIDATE_AUTHORING_R36.yaml'
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo 'R36 output unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'test(stage02): persist transition role-safe candidates R36'
          git push origin HEAD:rebuild-v2.1.1
