  - index: 41
    style: Normal
    text: 正式控制分母為 27：5 個 View Tab、2 個 Search 入口、Source 5 個狀態/編輯控制、Acquisition 2、Citation 1、Context 3、Replay 2、Learning/Draft 2、Knowledge Draft/Version 2、Review 3。所有
      Effectful Control 必須同時具備 Action + Gate + Permission + State 條件。
  - index: 43
    style: Heading 1
    text: 12. Gate / Permission / Security Boundary
  - index: 44
    style: Normal
    text: Permission Model：Account Permission Assignment Only。Role name、department membership、前端隱藏狀態都不得作為 Allow。Server Gate 順序至少包含 identity → account_permission →
      scope → condition/classification → state_guard → expected_version（versioned write）→ idempotency（side effect）→ audit。
