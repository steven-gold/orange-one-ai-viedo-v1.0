name: Mother Structured Mutation Selector Successor

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/materialize_structured_mutation_selector_successor.py'

permissions:
  contents: write

jobs:
  promote:
    if: "${{ github.event.head_commit.message == 'chore(governance): stage structured mutation selector successor' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify exact authorization parent and Current governance
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'artifact_type: SPECIFICATION_CHANGE_AUTHORIZATION_RECEIPT' governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-STRUCTURED-MUTATION-SELECTOR-HARDENING-R1.yaml
          grep -q 'baseline_commit_sha: 3aa7ea7a2559b8f0017d83e73eebfad6e14a8962' governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-STRUCTURED-MUTATION-SELECTOR-HARDENING-R1.yaml
          grep -q 'GOV-REV-20260919-PROFILE-TOKEN-DECONTAMINATION-HARDENING' governance/specifications/REGISTRY.yaml
      - name: Compile and preflight successor materializer
        run: |
          python -m py_compile .github/governance-maintenance/materialize_structured_mutation_selector_successor.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_structured_mutation_safety.py --self-test
      - name: Materialize atomic Current governance successor
        run: python .github/governance-maintenance/materialize_structured_mutation_selector_successor.py
      - name: Validate successor before persistence
        run: |
          python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
          python governance/ci/governance_resolver.py
          python governance/ci/validate_canonical_rule_registry.py
          python governance/ci/validate_governance_portability.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_section_registry.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_structured_mutation_safety.py --self-test
          git diff --check
      - name: Persist v2.2.8 successor atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          test -n "$(git diff --cached --name-only)" || { echo 'BLOCK: no successor changes staged' >&2; exit 1; }
          git commit -m "feat(governance): promote structured mutation selector hardening"             -m "Spec-Change-Authorization: USR-DIRECTIVE-20260919-STRUCTURED-MUTATION-SELECTOR-HARDENING-R1"             -m "Spec-Change-Scope: STRUCTURED_MUTATION_SELECTOR_AND_WRITESET_HARDENING"
          git push origin HEAD:rebuild-v2.1.1
