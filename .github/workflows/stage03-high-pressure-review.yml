name: Stage-03 CORE-01 High-Pressure Review

"on":
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - governance/ci/stress_test_stage03_core01.py
      - .github/workflows/stage03-high-pressure-review.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  high-pressure-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage03-review-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock exact review SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Compile Stage-03 review harness
        run: python -m py_compile governance/ci/stress_test_stage03_core01.py
      - name: Resolve Stage-03 CORE-01 review applicability
        id: admission
        shell: bash
        run: |
          python - <<'PY'
          import os, yaml
          state=yaml.safe_load(open("governance/test/ACTIVE_STATE.yaml",encoding="utf-8")) or {}
          work=state.get("active_work_unit") or {}
          applicable=(
              work.get("work_unit_uid")=="WU-STAGE03-CORE01-VISUAL-DESIGN-001"
              and work.get("stage_uid")=="STAGE-03"
              and "CORE-01" in (work.get("scope") or [])
          )
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("applicable=" + ("true" if applicable else "false") + "\n")
          print("STAGE03_CORE01_REVIEW_APPLICABLE=" + str(applicable))
          print("ACTIVE_WORK_UNIT=" + str(work.get("work_unit_uid")))
          PY
      - name: Run CORE-01 Stage-03 multidimensional high-pressure review
        if: steps.admission.outputs.applicable == 'true'
        run: python governance/ci/stress_test_stage03_core01.py
      - name: Record non-applicable maintenance execution
        if: steps.admission.outputs.applicable != 'true'
        run: echo "PASS - Stage-03 CORE-01 product review skipped because the Current active Work Unit is not the governed Stage-03 CORE-01 product Work Unit."
      - name: Upload Stage-03 high-pressure report
        if: ${{ always() && steps.admission.outputs.applicable == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: stage03-core01-high-pressure-review
          retention-days: 30
          if-no-files-found: error
          path: governance/test/stage03/STAGE03_HIGH_PRESSURE_REVIEW_REPORT.json
