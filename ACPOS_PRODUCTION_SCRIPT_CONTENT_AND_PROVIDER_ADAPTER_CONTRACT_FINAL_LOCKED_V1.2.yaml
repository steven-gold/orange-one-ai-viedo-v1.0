authority:
  id: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT
  version: V1.2
  status: FINAL_LOCKED
  current_only: true
  non_executable_contract: true
  new_page: false
  new_runtime_service: false
  new_provider_registry: false
  new_script_engine: false
  scope: CORE Canonical Production Script AI authoring; ASSET / VIDEO / EDIT+VOICE production and correction-script content; STR-01 Strategic AI conversation/analysis/output
    instruction binding; and deterministic conversion through the EXISTING ACPOS InstructionCompiler + AI API Router + admin:AIAPI-06 Provider/Model Profiles.
  qa_in_scope: false
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  supersedes: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.1
source_alignment:
  existing_provider_profile_owner: admin:AIAPI-06#provider_model_profiles
  existing_provider_profile_persistence: acpos_runtime.provider_profiles / runtime provider_model_profiles
  existing_router_owner: ACPOS AI API Router
  existing_compiler_owner: InstructionCompiler / Provider Prompt Adapter
  existing_gateway_handlers:
  - ProviderGateway.openai_compatible_chat
  - ProviderGateway.generic_json_http
  existing_adapter_types_only:
  - OPENAI_COMPATIBLE_CHAT
  - GENERIC_JSON_HTTP
  existing_capability_enum:
  - TEXT_CHAT
  - TEXT_TO_IMAGE
  - IMAGE_EDIT
  - TEXT_TO_VIDEO
  - VIDEO_EDIT
  - TEXT_TO_VOICE
  - VOICE_TO_VOICE
  - EMBEDDING
  - OTHER
  preservation_rule: This contract adds content/mapping rules only. Existing ASSET/VIDEO/EDIT controls, actions, gates, ports, correction lifecycle, versioning,
    and first-production auto-load behavior remain unchanged.
  core_script_owner: CORE Script System
  core_ai_authoring_capability: TEXT_CHAT
  strategic_center_owner: workspace:STR-01 / ACPOS AI Conversation Core + Strategic Extension
  strategic_ai_capability: TEXT_CHAT
common_script_rules:
  language: zh-TW canonical production instruction; provider-neutral
  first_production: Department reads the exact bound Script View/Section from current Project/Topic/Task package; no free prompt.
  trace_required:
  - project_id
  - topic_id
  - task_id
  - blueprint_version_id
  - script_view_id
  - script_view_version_or_section_version
  - script_view_hash
  - input_fingerprint
  meaning_preservation: Provider conversion may change syntax/field placement only; it may not add, delete, weaken, reorder, or reinterpret governed production
    intent/constraints.
  provider_syntax_in_department_script: FORBIDDEN
  manual_provider_model_picker_in_department: FORBIDDEN
department_production_scripts:
  ASSET:
    existing_view: Asset_Production_Script_View
    existing_parent_role_uid: ASSET-01-SCRIPT-ROLE-PRODUCTION
    section_count: 8
    sections:
    - section_uid: ASSET-SCRIPT-SEC-01-REQUIREMENT
      name: Asset Requirement / Purpose
      applies_to: EVERY AssetManifest item
      required_fields:
      - manifest_item_id
      - asset_type_uid
      - purpose_binding
      - required_or_optional
      - reuse_policy
      - target_output_class
      - topic_or_scene_usage_ref
    - section_uid: ASSET-SCRIPT-SEC-02-IDENTITY-DNA
      name: Identity / DNA / Continuity Binding
      applies_to: Character/Scene/Object/VFX/Texture/Reference and any item with governed identity
      required_fields:
      - dna_refs
      - continuity_refs
      - identity_preserve_requirements
      - forbidden_identity_drift
      - blueprint_constraint_refs
    - section_uid: ASSET-SCRIPT-SEC-03-CHARACTER
      name: Character / Expression / Pose
      applies_to_asset_types:
      - ASSET-01-TYPE-CHARACTER
      required_fields:
      - character_ref
      - appearance_requirements
      - expression
      - pose_or_body_action
      - wardrobe_or_costume_ref
      - camera_facing_or_view_requirement
      - preserve_requirements
    - section_uid: ASSET-SCRIPT-SEC-04-SCENE
      name: Scene / Environment / Spatial Composition
      applies_to_asset_types:
      - ASSET-01-TYPE-SCENE
      required_fields:
      - scene_ref
      - environment_description
      - spatial_layout
      - foreground_midground_background
      - time_weather_atmosphere
      - continuity_requirements
    - section_uid: ASSET-SCRIPT-SEC-05-OBJECT-TEXT
      name: Object / Prop / Text Content
      applies_to_asset_types:
      - ASSET-01-TYPE-OBJECT
      - ASSET-01-TYPE-TEXT
      required_fields:
      - object_or_text_ref
      - shape_or_content
      - material_or_surface
      - scale_proportion
      - placement_or_usage
      - legibility_language_if_text
      - preserve_requirements
    - section_uid: ASSET-SCRIPT-SEC-06-STYLE-LIGHT-VFX
      name: Visual Style / Texture / Material / Lighting / VFX
      applies_to_asset_types:
      - ASSET-01-TYPE-CHARACTER
      - ASSET-01-TYPE-SCENE
      - ASSET-01-TYPE-OBJECT
      - ASSET-01-TYPE-VFX
      - ASSET-01-TYPE-TEXTURE
      - ASSET-01-TYPE-TEXT
      required_fields:
      - style_refs
      - material_texture_requirements
      - lighting_requirements
      - color_tone_requirements
      - effect_requirements
      - negative_or_forbidden_visual_constraints
    - section_uid: ASSET-SCRIPT-SEC-07-AUDIO
      name: Voice / Music / SFX Asset Requirement
      applies_to_asset_types:
      - ASSET-01-TYPE-VOICE
      - ASSET-01-TYPE-MUSIC
      - ASSET-01-TYPE-SFX
      required_fields:
      - audio_asset_type
      - purpose_binding
      - content_or_cue_requirement
      - language_or_voice_ref_if_applicable
      - duration_or_timing_requirement_if_defined
      - style_mood_or_sound_character
      - rights_constraint_refs
    - section_uid: ASSET-SCRIPT-SEC-08-OUTPUT
      name: Output / Reference / Naming / Rights Contract
      applies_to: EVERY item
      required_fields:
      - output_dimensions_or_format_from_contract
      - transparency_requirement_if_applicable
      - reference_asset_refs
      - canonical_naming_ref
      - rights_constraint_refs
      - expected_asset_purpose_binding
      - acceptance_constraint_refs
    item_materialization_rule: One AssetManifest item materializes one normalized ASSET instruction using SEC-01 + SEC-08 + every applicable section. Non-applicable
      sections remain absent, not AI-filled.
  VIDEO:
    existing_view: VisualGenerationScriptView
    existing_parent_role_uid: VIDEO-01-SCRIPT-ROLE-VIDEO
    section_count: 8
    sections:
    - section_uid: VIDEO-SCRIPT-SEC-01-SHOT-INTENT
      name: Scene / Shot Identity & Generation Intent
      required_fields:
      - scene_id
      - shot_id
      - shot_order
      - generation_intent
      - story_beat_or_purpose_ref
      - required_start_state
      - required_end_state
    - section_uid: VIDEO-SCRIPT-SEC-02-INPUT-BINDING
      name: Exact Asset / DNA / Continuity Binding
      required_fields:
      - character_dna_refs
      - scene_dna_refs
      - object_dna_refs
      - asset_version_refs
      - continuity_refs
      - preserve_identity_requirements
    - section_uid: VIDEO-SCRIPT-SEC-03-COMPOSITION
      name: Composition / Framing / Subject Placement
      required_fields:
      - framing
      - subject_positions
      - foreground_midground_background
      - gaze_or_screen_direction
      - composition_constraints
    - section_uid: VIDEO-SCRIPT-SEC-04-ACTION-MOTION
      name: Character / Object Action & Motion
      required_fields:
      - character_actions
      - object_actions
      - motion_direction
      - motion_intensity_or_speed_requirement
      - interaction_requirements
      - physical_continuity_constraints
    - section_uid: VIDEO-SCRIPT-SEC-05-CAMERA
      name: Camera / Lens Intent / Gaze
      required_fields:
      - camera_position_or_angle
      - camera_movement
      - camera_speed_or_emphasis
      - focus_subject
      - gaze_or_action_direction
      - camera_constraints
    - section_uid: VIDEO-SCRIPT-SEC-06-TIMING
      name: Duration / Timing / Beat / Transition
      required_fields:
      - duration_seconds_or_contract_ref
      - start_time_or_relative_start
      - end_time_or_relative_end
      - beat_timing
      - action_timing
      - transition_requirement_if_any
    - section_uid: VIDEO-SCRIPT-SEC-07-ENVIRONMENT
      name: Environment / Lighting / Effect / Continuity
      required_fields:
      - environment_state
      - lighting_state
      - weather_or_atmosphere_if_defined
      - effect_requirements
      - background_continuity
      - visual_style_refs
    - section_uid: VIDEO-SCRIPT-SEC-08-OUTPUT-CONSTRAINTS
      name: Output Contract / Preserve / Negative Constraints
      required_fields:
      - aspect_ratio
      - resolution
      - fps_if_contract_defined
      - output_format_if_defined
      - must_preserve
      - must_not_change
      - forbidden_generation_behavior
      - rights_policy_constraint_refs
    shot_materialization_rule: Each Shot receives all 8 sections. Any undefined optional production value stays null/— and must not be invented by the department
      or provider adapter.
  EDIT_VOICE:
    existing_page: EDIT-01
    existing_role_count: 8
    role_field_schemas:
      EDIT-01-SCRIPTROLE-ASSEMBLY:
      - timeline_structure
      - shot_order
      - cut_points
      - transition_requirements
      - pacing_requirements
      - continuity_requirements
      - exact_video_asset_refs
      - placement_bindings
      EDIT-01-SCRIPTROLE-VOICE:
      - dialogue_segment_refs
      - speaker_or_voice_asset_ref
      - language
      - delivery_intent
      - timing_binding
      - volume_or_level_requirement_if_defined
      - preserve_requirements
      EDIT-01-SCRIPTROLE-MUSIC:
      - music_asset_refs
      - cue_ids
      - cue_purpose
      - start_end_timing
      - trim_or_loop_requirement
      - level_or_fade_requirement
      - preserve_requirements
      EDIT-01-SCRIPTROLE-SFX:
      - sfx_asset_refs
      - cue_ids
      - purpose
      - placement_timing
      - trim_requirement
      - level_or_fade_requirement
      - marker_or_event_binding
      EDIT-01-SCRIPTROLE-MIX:
      - voice_level_requirements
      - music_level_requirements
      - sfx_level_requirements
      - master_level_requirement
      - ducking_or_priority_if_defined
      - mix_preview_requirement
      - preserve_requirements
      EDIT-01-SCRIPTROLE-LIPSYNC:
      - dialogue_segment_ref
      - target_character_or_face_ref
      - dialogue_timing_binding_ref
      - sync_requirement
      - allowed_target_range
      - preserve_non_target_ranges
      EDIT-01-SCRIPTROLE-SUBTITLE:
      - subtitle_segment_id
      - text
      - language
      - start_end_timing
      - format_requirement
      - dialogue_timing_binding_ref
      - placement_or_safe_area_requirement_if_defined
      EDIT-01-SCRIPTROLE-FINALIZE:
      - render_source_version_ref
      - resolution
      - aspect_ratio
      - fps
      - audio_output_requirement
      - subtitle_burn_or_track_requirement
      - format_or_codec_if_output_contract_defined
      - lock_manifest_requirements
    materialization_rule: Existing eight Script Roles remain the only EDIT+VOICE production-script roles. This contract adds field-level required content only;
      it does not create new EDIT/VOICE roles or pages.
department_correction_content:
