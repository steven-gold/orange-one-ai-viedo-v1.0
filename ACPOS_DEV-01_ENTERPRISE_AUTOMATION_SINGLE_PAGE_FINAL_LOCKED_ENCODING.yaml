state_model:
  common_states:
  - LOADING
  - READY
  - EMPTY
  - ERROR
  - POLICY_BLOCKED
  - VERSION_CONFLICT
  - REVIEW_REQUIRED
  - EXTERNAL_PENDING
  - READ_ONLY
  - ARCHIVED
  discovery_states:
  - RUNNING
  - PAUSED
  - STOPPED
  campaign_business_states:
  - REVIEW
  - APPROVED
  - QUEUED
  ui_stage_context:
  - discovery
  - directory
  - message
  - campaign
  - delivery
  rules:
  - UI stage switch does not mutate business state.
  - Discovery start/pause/resume/stop follows exact service state guards.
  - Message Candidate decision does not dispatch email.
  - Campaign approval does not itself send email.
  - Dispatch requires exact APPROVED Campaign and creates/queues governed individual delivery work.
  - Kill Switch changes governed operation state only through setKillSwitch; no client-only stop illusion.
  - Partial failure remains non-final and exposes exact failed/blocked items.
data_and_lineage:
  reuse_only: true
  source_data_groups:
  - discovery_jobs
  - discovery_policy
  - allowed_sources
  - discovery_metrics
  - connector_health
  - companies
  - company_aliases
  - contact_points
  - source_evidence
  - merge_candidates
  - deliveries
  - suppressions
  - audience_context
  - message_versions
  - compliance
  - reviews
  - contacts
  - campaigns
  - campaign_recipients
  - delivery_policy
  - schedules
  - email_deliveries
  - delivery_status
  - bounce_reply
  no_new_database_table: true
  company_identity_rule: Use registration/jurisdiction identity resolution as primary matching basis; company name alone is
    never sufficient.
  contact_rule: Phone/email/address may be one-to-many and must retain source evidence; distinct contact points are not overwritten.
  merge_rule: Merge preserves lineage/source evidence; destructive duplicate delete is forbidden.
  delivery_rule: Each actual email delivery has exactly one To; CC/BCC empty; campaign batch is internal orchestration only.
permission_and_security:
  page_entry: effective backend L1 enterprise_development + page authorization + scope/condition/audit
  role_name_authorization: FORBIDDEN
  department_membership_as_allow: FORBIDDEN
  server_gate: identity + exact account permission + scope + condition + state_guard + expected_version_when_write + idempotency_when_side_effect
    + audit
  frontend_hide_is_not_authorization: true
  suppression_bypass: FORBIDDEN
  rate_limit_bypass: FORBIDDEN
  access_control_bypass: FORBIDDEN
  plain_secret_or_provider_payload: FORBIDDEN
stage_presentation:
  discovery:
    main: Setup + running job list/status; schema-driven inputs from existing R9 payload; no invented source list.
    secondary: Accumulation metrics and Connector Health as compact read-only status, not hero KPIs.
    action_order:
    - Start
    - Pause/Resume conditional
    - Stop conditional
  directory:
    main: Search/filter + company table; selected row opens identity/contact/source-evidence detail.
    secondary: Merge Review, Delivery History, Suppression in drawer/secondary views.
    action_order:
    - Search
    - Preview Merge conditional
    - Confirm Merge conditional
    - Export secondary
  message:
    main: Audience Context + Candidate editor/view + personalization + policy result.
    secondary: Version History / Audit in drawer.
    action_order:
    - Create Candidate
    - Review/Decide conditional
    - Request Change conditional
    hard_boundary: No Send button exists in Message stage.
  campaign:
    main: Audience filters/inclusion/exclusion/suppression + recipient preview + campaign config.
    secondary: Approval panel with exact message version/policy/suppression summary.
    action_order:
    - Search Audience
    - Create Campaign
    - Approve Campaign conditional
    hard_boundary: Batch may contain many internal recipient records; actual outbound envelope remains one recipient per delivery.
  delivery:
    main: Delivery policy/schedule/rate-quota + individual queue/status + bounce/reply.
    secondary: Suppression and detailed delivery evidence in drawer.
    action_order:
    - Dispatch approved campaign conditional
    - Refresh secondary
    - Kill Switch only when applicable/high-risk
    hard_boundary: No CC/BCC bulk-send simulation; no send-to-suppressed contact.
errors:
- error_uid: DEV-01-ERR-AUTH
  when: Page/action/API permission or scope denied
  recovery: Hide unauthorized effectful control where required; server DENY remains authoritative; show permitted reason only.
- error_uid: DEV-01-ERR-SOURCE
  when: Discovery source is not allowed or policy/rate gate fails
  recovery: BLOCK start/continue; preserve config; show source/policy blocker and allowed recovery.
- error_uid: DEV-01-ERR-CONNECTOR
  when: External source connector unavailable
  recovery: Mark EXTERNAL_PENDING/ERROR from real state; do not fabricate results; retry only when registered policy allows.
- error_uid: DEV-01-ERR-IDENTITY
  when: Company identity cannot resolve to registered/jurisdiction identity
  recovery: Keep as candidate/review; do not merge by company name alone.
- error_uid: DEV-01-ERR-MERGE
  when: Merge preview stale/conflicting or evidence incomplete
  recovery: Do not merge; refresh exact candidate/version, rerun preview, require explicit confirmation.
- error_uid: DEV-01-ERR-MESSAGE-POLICY
  when: Personalization/personal-data/compliance policy fails
  recovery: BLOCK Candidate decision/campaign approval as applicable; create/route correction through existing candidate/change
    workflow.
- error_uid: DEV-01-ERR-SUPPRESSION
  when: Contact/recipient is suppressed
  recovery: Remove/block from outbound delivery; preserve suppression evidence; never send.
- error_uid: DEV-01-ERR-CAMPAIGN
  when: Campaign recipient/content/policy version stale or approval missing
  recovery: Return REVIEW_REQUIRED or VERSION_CONFLICT; never dispatch.
- error_uid: DEV-01-ERR-DELIVERY
  when: Recipient count != 1, CC/BCC nonempty, duplicate delivery, schedule/rate/policy invalid
  recovery: BLOCK dispatch item; no bulk-send workaround.
- error_uid: DEV-01-ERR-KILL
  when: Kill-switch target/scope/reason/permission invalid
  recovery: Do not change state; preserve current delivery state; show actual error/correlation.
- error_uid: DEV-01-ERR-PARTIAL
  when: A multi-step campaign/delivery operation partially succeeds
  recovery: Never report COMPLETE; show exact succeeded/blocked/failed items; retry idempotently only for missing legal work.
- error_uid: DEV-01-ERR-UNDEFINED
  when: Unregistered field/operation/route/service requested
  recovery: BLOCK + REPORT_AUTHORITY_GAP; never create a parallel outreach system.
hard_locks:
- Only admin:DEV-01 is the current Enterprise Automation UI workspace in this authority.
- The five workflow stages are composition areas inside one page; they are not five current navigation pages.
- Existing R9 Discovery / Directory / Message / Batch / Delivery services, operations, databases, suppression and audit owners
  are reused; no parallel system is created.
- Discovery cannot run without Allowed Source / Rate / Policy / Authorization gates.
- Company name alone never resolves identity; duplicate companies merge with evidence and lineage, never destructive delete.
- One-to-one Email content remains Candidate until governed decision; Candidate never directly sends.
- Campaign batch is internal orchestration/review/statistics; every actual outbound email contains exactly one To and empty
  CC/BCC.
- Suppressed contact delivery is forbidden with no bypass.
- Campaign approval is separate from dispatch; dispatch requires exact APPROVED Campaign and all delivery gates.
- Kill Switch is a conditional high-risk control and uses the existing setKillSwitch operation only.
- Low-frequency evidence, audit, history, connector details and suppression details stay secondary/drawer; do not create permanent
  duplicate cards.
- No fake company metrics, connector health, campaign status, delivery result, bounce/reply, audit or external connector data.
- No invented endpoint, request field, source list, company identity field, message schema, campaign schema, permission, route
  or provider syntax.
- Unknown or missing authority -> BLOCK + REPORT_AUTHORITY_GAP, never create another outreach system.
- This file is FILE_SPEC_COMPLETE only; application/runtime/Sandbox/E2E/deployment remain NOT_EXECUTED.
acceptance:
- uid: DEV-01-ACC-01
  item: Single Current Page
  condition: Only admin:DEV-01 is the current Enterprise Automation UI workspace; no five-page current navigation is reconstructed.
- uid: DEV-01-ACC-02
  item: R9 Service Reuse
  condition: Discovery/Directory/Message/Batch/Delivery existing owners and operations are reused; no second outreach backend,
    registry or database is introduced.
- uid: DEV-01-ACC-03
  item: Five-Stage Workflow
  condition: Discovery -> Directory -> Message Candidate -> Campaign -> Individual Delivery exists as same-page workflow context,
    not five standalone pages.
- uid: DEV-01-ACC-04
  item: Discovery Governance
  condition: Single/continuous discovery cannot run without allowed source, rate, policy and authorization gates; pause/resume/stop
    use exact R9 operations.
- uid: DEV-01-ACC-05
  item: Company Identity
  condition: Registration/jurisdiction identity is primary; name-only identity and destructive duplicate delete are forbidden;
    contacts preserve one-to-many source evidence.
- uid: DEV-01-ACC-06
  item: Candidate Boundary
  condition: One-to-one email content is Candidate until governed decision; Candidate cannot directly send.
- uid: DEV-01-ACC-07
  item: Batch Boundary
  condition: Campaign/recipient batch is internal orchestration/review/statistics only; outbound delivery is always one recipient
    per email.
- uid: DEV-01-ACC-08
  item: One Recipient Per Email
  condition: Every outbound delivery has exactly one To; CC/BCC empty; no recipient-duplicate workaround.
- uid: DEV-01-ACC-09
  item: Suppression
  condition: Suppressed contacts cannot be sent; suppression is checked before campaign approval/dispatch and visible as a
    blocker.
- uid: DEV-01-ACC-10
  item: Delivery Governance
  condition: Approved Campaign + schedule/rate/policy + exact state/version/idempotency/audit are required before dispatch.
- uid: DEV-01-ACC-11
  item: High-Risk Control
  condition: Kill Switch is conditional and permission/state gated; it is not a permanently dominant page CTA.
- uid: DEV-01-ACC-12
  item: No Parallel System
  condition: No second Company DB, campaign engine, message engine, delivery engine, suppression registry or connector registry
    is defined.
- uid: DEV-01-ACC-13
  item: Real Data Only
  condition: No fake company count, connector health, delivery status, reply/bounce, campaign result or audit data.
- uid: DEV-01-ACC-14
  item: Exact Runtime Binding
  condition: All effectful actions bind only to exact R9 operation/method/path or are blocked; no guessed endpoint.
- uid: DEV-01-ACC-15
  item: Truthful Completion
  condition: File-spec completion is separate from application/runtime/Sandbox/E2E/deployment completion.
- uid: DEV-01-ACC-16
  item: UI Necessity
  condition: Low-frequency evidence/history/audit/health detail is drawer/secondary content; no duplicate permanent card wall.
