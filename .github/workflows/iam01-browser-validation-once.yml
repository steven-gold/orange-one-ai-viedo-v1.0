name: IAM-01 browser validation once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/iam01-browser-validation-once.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build production
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Validate IAM-01 in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 4173 > /tmp/iam01-browser-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/iam01-browser-next.log || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/admin/accounts >/dev/null; then break; fi
            sleep 1
          done
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const nonGetV1=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/')&&r.method()!=='GET')nonGetV1.push(`${r.method()} ${u.pathname}`)});
            await page.goto('http://127.0.0.1:4173/admin/accounts',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:IAM-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:IAM-01"]')?.getAttribute('data-page-state')==='BLOCKED');
            const expected={
              'data-authority-status':'FINAL_LOCKED','data-authority-sections':'6','data-authority-components':'10','data-authority-controls':'14',
              'data-frontend-l1-count':'9','data-backend-l1-count':'9','data-control-registry-valid':'true','data-page-state':'BLOCKED',
              'data-projection-status':'BLOCKED','data-projection-reason':'UI_PROJECTION_RUNTIME_NOT_BOUND','data-runtime-error-uid':'IAM-01-ERR-UNDEFINED',
              'data-projection-adapter-ready':'false','data-effectful-runtime-ready':'false','data-formal-runtime-status':'NOT_EXECUTED'
            };
            for(const [k,v] of Object.entries(expected)) assert.equal(await root.getAttribute(k),v,`${k}`);
            assert.equal(await page.locator('[data-section-id^="IAM-01-SEC-"]').count(),6);
            assert.equal(await page.locator('[data-component-id^="IAM-01-CMP-"]').count(),10);
            const controls=page.locator('[data-control-id^="IAM-01-"]');
            assert.equal(await controls.count(),14);
            for(let i=0;i<14;i++){
              const node=controls.nth(i);
              for(const attr of ['data-action-uid','data-gate-uid','data-permission-uid','data-effect-type','data-current-state','data-runtime-binding']) assert(await node.getAttribute(attr),`${i} ${attr}`);
            }
            for(const id of ['IAM-01-BTN-ADD','IAM-01-BTN-EDIT','IAM-01-BTN-SAVE-DRAFT','IAM-01-BTN-VALIDATE','IAM-01-BTN-PREVIEW','IAM-01-BTN-COMPLETE','IAM-01-BTN-AUDIT','IAM-01-CTL-SEARCH','IAM-01-SEL-DEPT-PRESET','IAM-01-CHK-FRONT-ALL','IAM-01-CHK-BACK-ALL']){
              assert.equal(await page.locator(`[data-control-id="${id}"]`).isDisabled(),true,id);
            }
            assert.equal(await page.locator('[data-control-id="IAM-01-CTL-BASIC-DATA"]').getAttribute('data-disabled-reason'),'IAM-01-ERR-IDENTITY-SCHEMA');
            assert.equal(await page.locator('[data-control-id="IAM-01-SEL-DEPT-PRESET"]').getAttribute('data-disabled-reason'),'IAM-01-ERR-PRESET');
            assert((await page.locator('[data-control-id^="IAM-01-"][data-runtime-binding="NOT_EXECUTED"]').count())>=7);
            const direct=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3AIAM-01',{cache:'no-store'});return{status:r.status,body:await r.json()}});
            assert.equal(direct.status,503);
            assert.equal(direct.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.deepEqual(nonGetV1,[]);
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('IAM01_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('IAM01_BROWSER_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
