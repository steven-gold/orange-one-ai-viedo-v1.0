name: ACPOS Gate25 EDIT-01 Formal Identity Diagnostic Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-edit01-formal-identity-diagnostic-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build exact EDIT-01 formal identity matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          inventory_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json')
          authority_path=Path('authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml')
          runtime_path=Path('src/components/pages/EditControlRuntime.tsx')
          visual_path=Path('src/components/pages/EditVisual.tsx')
          evidence_path=Path('docs/construction/evidence/GATE25_EDIT01_FORMAL_IDENTITY_DIAGNOSTIC_2026-09-11.json')

          ledger=json.loads(ledger_path.read_text())
          inventory=json.loads(inventory_path.read_text())
          assert ledger['counts']=={'PASS':51,'BLOCKED':194,'NOT_EXECUTED':1236},ledger['counts']
          assert ledger['denominator']=={'controls':1155,'actions':326,'total':1481}
          assert inventory['denominator']=={'controls':1155,'actions':326,'total':1481}

          authority=authority_path.read_text()
          assert 'status: FINAL_LOCKED' in authority
          assert 'current_only: true' in authority
          assert 'legacy_merge: FORBIDDEN' in authority
          current_actions=set(re.findall(r'^\s*-\s*action_uid:\s*([^\s#]+)',authority,re.M))
          current_controls=set(re.findall(r'^\s*-\s*control_uid:\s*([^\s#]+)',authority,re.M))
          assert current_actions and current_controls

          # Exact source binding scope only. Do not scan docs/tests/evidence, which would create false ownership.
          src_text='\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx','.js','.mjs'})
          runtime_text=runtime_path.read_text()
          visual_text=visual_path.read_text()

          entries={x['resource_key']:x for x in ledger['entries']}
          formal=[]
          for resource in inventory['resources']:
            key=resource['resource_key']
            if key.startswith('action:workspace:EDIT-01:') or key.startswith('control:CTRL-WORKSPACE-EDIT-01'):
              formal.append(resource)
          assert formal, 'no formal EDIT-01 resources'

          rows=[]
          stats={
            'total':0,'actions':0,'controls':0,
            'current_exact_owner':0,'src_exact_binding_only':0,'no_current_exact_owner':0,
            'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0,
          }
          for resource in formal:
            key=resource['resource_key']
            typ=resource['resource_type']
            if typ=='ACTION':
              ident=key.split(':',3)[-1]
              authority_exact=ident in current_actions
            else:
              ident=key.removeprefix('control:')
              authority_exact=ident in current_controls
            src_exact=ident in src_text
            if authority_exact:
              classification='CURRENT_EXACT_OWNER'
            elif src_exact:
              classification='SRC_EXACT_BINDING_ONLY'
            else:
              classification='NO_CURRENT_EXACT_OWNER'
            ledger_row=entries[key]
            row={
              'resource_key':key,
              'resource_type':typ,
              'identity':ident,
              'classification':classification,
              'authority_exact':authority_exact,
              'src_exact':src_exact,
              'edit_control_runtime_exact':ident in runtime_text,
              'edit_visual_exact':ident in visual_text,
              'disposition':ledger_row['disposition'],
              'reason_code':ledger_row.get('reason_code'),
            }
            rows.append(row)
            stats['total']+=1
            stats['actions' if typ=='ACTION' else 'controls']+=1
            if classification=='CURRENT_EXACT_OWNER': stats['current_exact_owner']+=1
            elif classification=='SRC_EXACT_BINDING_ONLY': stats['src_exact_binding_only']+=1
            else: stats['no_current_exact_owner']+=1
            stats[ledger_row['disposition']]+=1

          cross={}
          for row in rows:
            k=f"{row['classification']}::{row['disposition']}"
            cross[k]=cross.get(k,0)+1

          evidence={
            'document_id':'ACPOS_GATE25_EDIT01_FORMAL_IDENTITY_DIAGNOSTIC',
            'status':'READ_ONLY_CLASSIFICATION_COMPLETE',
            'recorded_at':datetime.now(timezone(timedelta(hours=8))).isoformat(),
            'production_release_sha':ledger['production_release_sha'],
            'current_authority':str(authority_path),
            'current_authority_status':'FINAL_LOCKED',
            'current_only':True,
            'legacy_merge':'FORBIDDEN',
            'source_binding_scope':'src/**/*.{ts,tsx,js,mjs} exact string only; docs/tests/evidence excluded',
            'ledger_counts_before':ledger['counts'],
            'formal_denominator':ledger['denominator'],
            'stats':stats,
            'classification_by_disposition':cross,
            'fresh_gate20_production_prerequisites':{
              'verified_at':'2026-09-11T01:56:00+08:00',
              'department_tasks_editing':0,'department_tasks_qa':0,'task_outputs':0,
              'editing_timelines':0,'edit_render_jobs':0,'production_output_version_locks':0,
              'editing_runtime_runs':0,'voice_runtime_profiles':0,
              'approved_provider_capabilities':4,'provider_route_policies_table':None,
              'edit_render_contract_observed':False,'voice_contract_observed':False,
            },
            'rows':rows,
            'mutation_scope':'NONE_LEDGER_READ_ONLY',
            'rule':'Classification is identity-only. CURRENT_EXACT_OWNER requires exact FINAL_LOCKED UID. SRC_EXACT_BINDING_ONLY requires exact literal source binding but does not itself authorize remap. NO_CURRENT_EXACT_OWNER must never be semantically remapped. This diagnostic does not promote or block any ledger resource.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'stats':stats,'classification_by_disposition':cross},ensure_ascii=False))
          PY
      - name: Prove diagnostic did not mutate formal ledger
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-formal-acceptance-ledger.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json').read_text())
          evidence=json.loads(Path('docs/construction/evidence/GATE25_EDIT01_FORMAL_IDENTITY_DIAGNOSTIC_2026-09-11.json').read_text())
          assert ledger['counts']=={'PASS':51,'BLOCKED':194,'NOT_EXECUTED':1236}
          assert evidence['mutation_scope']=='NONE_LEDGER_READ_ONLY'
          assert evidence['ledger_counts_before']==ledger['counts']
          PY
      - name: Commit diagnostic evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/GATE25_EDIT01_FORMAL_IDENTITY_DIAGNOSTIC_2026-09-11.json
          git diff --cached --name-only | grep -qx 'docs/construction/evidence/GATE25_EDIT01_FORMAL_IDENTITY_DIAGNOSTIC_2026-09-11.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'evidence(gate25): classify EDIT-01 formal identities read-only'
          git push origin HEAD:new
