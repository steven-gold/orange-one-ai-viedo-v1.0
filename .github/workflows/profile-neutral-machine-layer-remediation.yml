name: Profile Neutral Machine Layer Remediation

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/apply_profile_neutral_machine_layer.py'
      - '.github/workflows/profile-neutral-machine-layer-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      BASELINE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Apply profile-neutral machine-layer remediation and push only after complete verification
        run: python governance/ci/apply_profile_neutral_machine_layer.py
