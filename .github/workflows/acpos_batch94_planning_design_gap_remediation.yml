name: ACPOS Batch 94 Planning Design Gap Remediation
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch94_planning_design_gap_remediation.yml
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Build bounded Word design remediator
        shell: bash
        run: |
          cat > /tmp/acpos_design94.py <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.enum.text import WD_BREAK
          import re,sys,subprocess,zipfile

          BASE="93241332f4de47a0875ce6ea2d245f9281585879"
          PAGES={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          LABEL={
            "AIAPI-01":"AI API 管理",
            "ASSET-01":"素材生產工作區",
            "CORE-01":"CORE 工作區",
            "DB-01":"資料模型／資料庫治理",
            "DEV-01":"企業自動開發系統",
            "EDIT-01":"剪輯工作區",
            "ERP-01":"ERP 與財務",
            "IAM-01":"帳戶與權限",
            "INFO-01":"資訊／研究工作區",
            "KB-01":"知識庫",
            "QA-01":"QA 審查工作區",
            "SG-02":"QA 審查標準治理",
            "SOC-01":"社群發布",
            "STR-01":"戰略工作區",
            "SYS-01":"系統維護與生命週期",
            "VIDEO-01":"影片生產工作區",
            "WB-01":"首頁／工作台",
            "ADMIN-STR-01":"戰略中心後台",
          }

          MISSING={
            "requirements":["DB-01","INFO-01","STR-01"],
            "page_identity":["CORE-01","QA-01"],
            "design_system":["AIAPI-01","ASSET-01","CORE-01","DB-01","EDIT-01","INFO-01","KB-01","QA-01","SOC-01","STR-01","VIDEO-01"],
            "geometry":["AIAPI-01","ASSET-01","CORE-01","DB-01","DEV-01","ERP-01","INFO-01","KB-01","QA-01","SG-02","SOC-01","STR-01","VIDEO-01","ADMIN-STR-01"],
            "visual":["AIAPI-01","CORE-01","DEV-01","EDIT-01","ERP-01","KB-01","QA-01","SG-02","SOC-01","STR-01","VIDEO-01","ADMIN-STR-01"],
            "asset":["AIAPI-01","ERP-01","KB-01","QA-01","SG-02","SOC-01","ADMIN-STR-01"],
            "a11y":["ASSET-01","CORE-01","INFO-01","STR-01","VIDEO-01"],
            "audit":["AIAPI-01","ASSET-01","CORE-01","EDIT-01","ERP-01","VIDEO-01"],
            "freeze":["AIAPI-01","ASSET-01","CORE-01","DEV-01","EDIT-01","ERP-01","IAM-01","KB-01","QA-01","SG-02","SOC-01","SYS-01","VIDEO-01","ADMIN-STR-01"],
            "control":["ADMIN-STR-01"],
          }

          def text_all(doc):
              return "\n".join(p.text for p in doc.paragraphs)+"\n"+"\n".join(" | ".join(c.text for c in r.cells) for t in doc.tables for r in t.rows)

          def ensure_annex(doc):
              if "[ACPOS-20260922-PLANNING-DESIGN-CLOSURE-ANNEX-V1]" in text_all(doc):
                  return
              p=doc.add_paragraph()
              p.add_run().add_break(WD_BREAK.PAGE)
              h=doc.add_heading("Mother Planning / Basic Design Closure Annex｜規劃設計規範閉環補充", level=1)
              p=doc.add_paragraph("[ACPOS-20260922-PLANNING-DESIGN-CLOSURE-ANNEX-V1]")
              p.add_run(" 本附錄只補規劃／基本設計規範缺口；原頁面既有功能、Owner、Operation、Permission、Entity、Visual 與跨頁 Authority 仍為同一 Canonical Owner。不得由本附錄發明 Runtime/API/DB/Provider 行為，也不得建立第二套平行規範。")

          def add_table(doc, marker, title, rows, heads=("Design Item / 設計項目","Canonical Planning Design Contract / 正式規劃設計契約")):
              if marker in text_all(doc): return False
              ensure_annex(doc)
              doc.add_heading(title, level=2)
              doc.add_paragraph(marker)
              t=doc.add_table(rows=1, cols=len(heads))
              t.style="Table Grid"
              for i,h in enumerate(heads): t.rows[0].cells[i].text=h
              for row in rows:
                  cells=t.add_row().cells
                  for i,v in enumerate(row): cells[i].text=str(v)
              return True

          def save(page,doc):
              fn=PAGES[page]
              doc.save(fn)
              with zipfile.ZipFile(fn) as z:
                  bad=z.testzip()
                  if bad: raise RuntimeError(f"ZIP_BAD {fn} {bad}")

          def requirements(page):
              specific={
                "DB-01":{
                  "goal":"以單一治理視角呈現 ACPOS canonical data model、exact version lineage、relationships、schema/migration history、integrity findings 與 audit，供受權限限制的管理／Debug Viewer 使用。",
                  "user":"具 DB-01 read/debug/governance 權限的內部管理者、系統工程或資料治理人員。",
                  "func":"查看 canonical model、relationship、version lineage、schema/migration history、integrity finding、audit/traceability；任何 effectful 行為仍只可使用既有 exact Operation。",
                  "non":"Read-first、Fail Closed、Real Data Only、Exact Version、Traceability；缺 Authority 時顯示 gap，不合成 schema。",
                  "out":"禁止建立第二套 DB owner、禁止由 Viewer 猜測 schema/relationship、禁止以文件補寫未授權資料 mutation。"
                },
                "INFO-01":{
                  "goal":"在受治理來源與 exact evidence 下管理 Source Health、Fact Pack、Fact/Inference、Evidence/Citation、Research/Quality 與候選資訊，維持 source/version/audit 可追溯。",
                  "user":"具 INFO-01 資訊、研究、查證或治理權限的內部使用者。",
                  "func":"選擇 authorized source/scope、檢視 readiness/health/status、組合 Fact Pack、查看 Evidence/Citation、形成受治理的 inference/recommendation supporting artifact 與後續 handoff。",
                  "non":"Real Data Only、Evidence-first、Fail Closed、Exact source/version、Audit、不可把 inference 當 verified fact。",
                  "out":"禁止建立第二 Source Registry、禁止憑空生成 Fact/Evidence、禁止把 supporting artifact 升格成未授權 Business Entity。"
                },
                "STR-01":{
                  "goal":"在同一 Strategy Workspace 保留 topic/context/conversation continuity，讓受權限控制的使用者完成 TEXT_CHAT 型策略討論、分析、建議與決策支援。",
                  "user":"具 STR-01 戰略工作區與對話權限的內部策略使用者／決策參與者。",
                  "func":"建立或恢復策略 context、TEXT_CHAT 對話、引用 evidence/context、查看分析與 recommendation、形成決策支援／resource proposal／feedback 並安全 handoff。",
                  "non":"Conversation/thread continuity、Exact context fingerprint、Audit、Fail Closed、不得將 Assistant output 自動視為 Human approval。",
                  "out":"禁止建立第二 Conversation Core、禁止繞過 Human Decision/Approval、禁止為缺失能力發明新的 runtime/provider。"
                }
              }[page]
              doc=Document(PAGES[page])
              rows=[
                ("Project Scope",f"{page}／{LABEL[page]} current Word planning/basic-design scope；僅補設計規範，不改變已存在產品 Authority。"),
                ("Business Goal",specific["goal"]),
                ("Target User / Role Definition",specific["user"]),
                ("Functional Requirements",specific["func"]),
                ("Non-functional Requirements",specific["non"]),
                ("Out-of-Scope Definition",specific["out"]),
                ("Glossary",f"{page} 使用本文既有 Entity / Operation / State / Owner / Evidence / Version 名詞；同義詞不得建立第二 identity。"),
                ("Naming Registry Initial State",f"Page UID={page}；Owner File={PAGES[page]}；Current canonical filename only；禁止 copy/backup/alternate owner。"),
                ("Authority",f"Current {page} Word + Mother 01→04；缺產品選擇時 BLOCK，不由本附錄猜測。"),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:REQUIREMENTS]","Requirement Definition Gate Closure｜需求定義補齊",rows)
              save(page,doc)

          def page_identity(page):
              doc=Document(PAGES[page])
              rows=[
                ("Page UID",page),
                ("Canonical Name",page),
                ("Display Name",LABEL[page]),
                ("Route","SHARED_OWNER_REFERENCE → ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx resolves the current route for this Page UID; this page MUST NOT duplicate or invent a second route literal."),
                ("Module UID","REFERENCE_ONLY → current Index / Global Navigation module mapping for this Page UID."),
                ("Purpose",f"{LABEL[page]} current canonical page responsibility as defined by this Word."),
                ("Parent UID","REFERENCE_ONLY → current Global Navigation parent mapping."),
                ("Required Permission","Use the exact permission references already bound to current controls/actions; fail closed when unresolved."),
                ("Design Owner",f"{PAGES[page]}"),
                ("Implementation Owner","REFERENCE_ONLY → existing owner/port mappings in this Word; no new implementation owner is created here."),
                ("Visual Status","Current canonical visual/baseline remains authoritative; candidate requires Visual Review before Authority update."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:PAGE-IDENTITY]","Page Registry Identity Closure｜頁面識別補齊",rows)
              save(page,doc)

          def design_system(page):
              doc=Document(PAGES[page])
              rows=[
                ("Color Tokens","SHARED_OWNER_REFERENCE → current Global Home / Shell Design System tech-purple token set; existing page-local approved override, if any, remains authoritative."),
                ("Typography Tokens","SHARED_OWNER_REFERENCE → current Global Design System typography; page-local text hierarchy may only use registered heading/body/label/technical text roles."),
                ("Spacing Tokens","Use registered gap/padding/spacing tokens; existing exact page gaps remain authoritative; no ad-hoc pixel drift."),
                ("Component States","Default / Hover / Focus / Active / Loading / Disabled / Success / Error MUST NOT change the approved component footprint unless the current component contract explicitly allows it."),
                ("Primary Layout","Use this Word's existing Primary Grid / Section / Workspace layout as the page-local authority; this annex introduces no second grid."),
                ("Navigation Region","Global Header and collapsible/overlay Sidebar remain shared shell regions; page Workspace starts in the registered content region."),
                ("Responsive Behavior","Use the current page responsive rule and shared shell breakpoint owner; semantic order and functional topology MUST remain stable across reflow."),
                ("Design Ownership","Page owns page-local layout/components; Global Shell owns shared header/sidebar/tokens; references only, no duplicated shared payload."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:DESIGN-SYSTEM]","Design System / Layout Closure｜設計系統與版面補齊",rows)
              save(page,doc)

          def geometry(page):
              doc=Document(PAGES[page])
              rows=[
                ("Viewport / Breakpoint UID","SHARED_OWNER_REFERENCE → current Global Home breakpoint contract; page-specific breakpoint/reflow rules in this Word override only where explicitly registered."),
                ("Container Width / Min / Max","Retain current Global Shell + page Primary Grid width contract. No page-local implicit width may override an existing exact dimension."),
                ("Grid Columns / Span / Gutter / Outer Margin","Use the existing page Primary Grid / section mapping and current gap/margin values; any structural grid change requires Change Set."),
                ("Section Bounding Rules","Every registered Section remains within its current Workspace region; sticky/fixed/overlay areas MUST NOT occlude required controls."),
                ("Component / Control / Field Width / Height Rules","Use current Control/Field Dimensions or shared component token. State transitions MUST NOT cause layout jump."),
                ("Min / Max Width / Height","Inherit current exact values where present; otherwise shared component minimums apply. Required input/button content may not compress below its registered usable size."),
                ("Gap / Padding / Alignment","Use current page spacing/grid tokens; alignment changes outside token tolerance require Visual Review."),
                ("Aspect Ratio","NOT_APPLICABLE unless the current page declares an image/video/preview ratio; when declared, the exact current ratio remains authoritative."),
                ("Overflow / Scroll Rule","No hidden overflow for actionable content. Long technical values use existing ellipsis + tooltip/drawer rule; large tables may use the current controlled horizontal-scroll rule."),
                ("Collapse / Stack / Wrap Rule","Reflow may stack/collapse only within the current responsive contract; semantic order, required adjacency and operation order MUST NOT change."),
                ("Z-order / Overlay Rule","Global Header / Sidebar overlay / Dialog / Drawer layers remain above Workspace without blocking required content; overlay expansion MUST NOT reflow the primary Workspace unless explicitly specified."),
                ("Text Capacity / Truncation / Wrap Rule","Required labels/status/error text may not be clipped. Long IDs/technical values use controlled ellipsis with recoverable full value; no silent semantic truncation."),
                ("Asset Object-fit / Object-position","REFERENCE_ONLY → current Asset Binding owner when a formal visual asset exists; otherwise NOT_APPLICABLE."),
                ("Locked Visual Anchors","Bound to the Visual Anchor Registry in this annex; unlisted regions are not implicitly editable."),
                ("Allowed Tolerance / Diff Threshold","Locked anchors and structural grid: zero unapproved drift. Token-level micro adjustment is allowed only inside current Design Token/Layout rules; structural changes require Change Set + re-review."),
                ("Geometry Failure Set","Detect overlap, clipping, horizontal overflow, unapproved scroll, control compression, unexpected wrap/stack, aspect drift, misalignment, sticky/fixed occlusion and header/sidebar/workspace collision."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:GEOMETRY]","Visual Geometry Contract Closure｜視覺幾何補齊",rows)
              save(page,doc)

          def visual(page):
              doc=Document(PAGES[page])
              if f"[ACPOS-DESIGN-CLOSURE:{page}:VISUAL]" in text_all(doc): return
              ensure_annex(doc)
              doc.add_heading("Visual Anchor / Preview / Review Contract｜視覺錨點與預覽審查補齊", level=2)
              doc.add_paragraph(f"[ACPOS-DESIGN-CLOSURE:{page}:VISUAL]")
              t=doc.add_table(rows=1,cols=5); t.style="Table Grid"
              for i,h in enumerate(["Anchor UID","Position Rule","Dimension Rule","Relationship Rule","Lock Status"]):t.rows[0].cells[i].text=h
              anchors=[
                (f"{page}-VA-HEADER","Fixed at top of shared shell","58px full-width according to current shell authority","Above Sidebar/Workspace; must not be covered by page content","LOCKED"),
                (f"{page}-VA-SIDEBAR","Fixed left rail under shared shell header","64px resting; 221px overlay expansion where current shell defines it","Overlay expansion must not silently change the approved page Primary Grid","LOCKED"),
                (f"{page}-VA-WORKSPACE","Current page primary content region below Header / beside resting rail","Use this Word's existing Primary Grid / section dimensions","Owns page-local section geometry; dialogs/drawers are overlays, not replacement layout","LOCKED_EXCEPT_AUTHORIZED_CHANGE_SET"),
              ]
              for row in anchors:
                  cells=t.add_row().cells
                  for i,v in enumerate(row):cells[i].text=v
              rows=[
                ("Current Canonical Visual","REFERENCE_ONLY → current visual/baseline already named in this Word or shared current visual owner. This annex does not replace it."),
                ("Visual Candidate UID","Generated candidate MUST receive a unique Visual UID and Parent Visual UID; no candidate is deemed approved merely by this annex."),
                ("Generation Manifest","Required before generation; MUST bind Page UID, Design Version, Reference Visual UID, Design System Version, Layout UID, Component Versions, Asset refs, Viewport, Language, Theme, Change Level/Set and locked/editable areas."),
                ("Visual Preview","MUST represent the actual website structure, not a moodboard. Preview occurs after page/design specification and before Design Freeze."),
                ("Visual Review","Authorized reviewer checks function-to-visual mapping, geometry, anchors, responsive order, A11y/i18n and visual drift."),
                ("Approval Status","VISUAL_APPROVED is required before DESIGN_FROZEN. This planning annex does NOT self-approve the page."),
                ("Change Set / Drift","Any layout/asset/typography/color/component/navigation/dimension/information-hierarchy change outside the approved Change Set is VISUAL_DRIFT_FAIL."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:VISUAL-CONTRACT]","Visual Generation / Review Planning Contract",rows)
              save(page,doc)

          def asset(page):
              doc=Document(PAGES[page])
              rows=[
                ("Page-local Asset Registry Applicability","REFERENCE_ONLY / CONDITIONAL. Existing page-owned formal Asset UID rows, if present, remain authoritative; this annex creates no duplicate Asset UID."),
                ("Shared Shell Assets","SHARED_OWNER_REFERENCE → Global Home / Design System owns logo, navigation icons, generic status icons and shared shell visuals; page MUST NOT clone them."),
                ("Dynamic Business Content","Provider logos, thumbnails, output previews, evidence images or other runtime/business data are NOT automatically design assets; they remain data/projection unless current page explicitly registers an Asset UID."),
                ("Binding Contract","Any formal page-owned asset MUST bind Page UID + Section UID + Component UID + Asset UID + position + width/height + aspect ratio + crop/object-fit/object-position + lock status."),
                ("Modification Rule","APPROVED/LOCKED assets may not be regenerated, recolored, cropped or repurposed without an authorized Change Set and Visual Review."),
                ("N/A Authority","When a page has no page-owned formal visual asset, page-local Asset Binding is NOT_APPLICABLE with this reason; shared assets remain referenced from their existing canonical owner."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:ASSET]","Asset Registry / Binding Applicability Closure｜素材註冊與綁定補齊",rows)
              save(page,doc)

          def a11y(page):
              doc=Document(PAGES[page])
              rows=[
                ("Keyboard / Focus","Reading and focus order MUST follow semantic operation order. Every interactive control is keyboard reachable; Focus state remains visibly distinct."),
                ("ARIA / Label","Icon-only controls require accessible name/label; form fields bind visible label, validation/error description and required state."),
                ("Modal / Drawer","On open, focus enters the surface; focus remains contained where modal; close/cancel is keyboard reachable; focus returns to the invoking control."),
                ("Color / State","State meaning MUST NOT rely on color alone; text/icon/state label remains available under current contrast tokens."),
                ("Error / Validation","Error state is announced/associated with its control or field; failure does not erase user input unless the current design explicitly requires reset."),
                ("i18n Languages","zh-TW / zh-CN / en are design-supported language contexts. Labels/help/error/status text must use localization-owned copy rather than page-local semantic duplication."),
                ("Variable Text Length","Localized text may wrap/reflow within current responsive rules but MUST NOT alter functional order, hide required actions or create uncontrolled layout drift."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:A11Y-I18N]","A11y / i18n Design Contract Closure｜無障礙與語系補齊",rows)
              save(page,doc)

          def audit(page):
              doc=Document(PAGES[page])
              au=f"{page}-AUD-DESIGN-001"
              rows=[
                ("Audit UID",au),
                ("Target UID",page),
                ("Required Audit Items","Requirement/Page identity where applicable; Architecture/Flow; Control/Field; Entity/Operation applicability; Cross-page/topology; Geometry; Visual Anchor/Preview contract; A11y/i18n; Asset applicability; Design Freeze package."),
                ("Required Tests","Word structural completeness audit; forward/reverse design-reference audit; DOCX render visual QA; design-only semantic consistency audit."),
                ("Required Evidence","Exact Word hash/tree identity; audit result; render page set; visual-review record when a candidate is generated."),
                ("Required Gates","Requirement, Naming, Architecture, Navigation, User Flow, Page Registry, Design System, Layout, Component, Asset applicability/binding, Page Design, Visual Preview/Review/Approval, Audit Baseline, Acceptance Matrix, DoD."),
                ("Acceptance Matrix","Every item is classified REQUIRED / OPTIONAL / NOT_APPLICABLE with owner/evidence. REQUIRED may not be downgraded merely to obtain PASS."),
                ("PASS Condition","All applicable REQUIRED planning/basic-design items are complete and internally consistent; no unresolved duplicate owner/reference or required design gap."),
                ("PARTIAL Condition","Only explicitly OPTIONAL or justified NOT_APPLICABLE design items remain; no REQUIRED item is missing."),
                ("FAIL Condition","Any REQUIRED planning/design contract, owner/reference, geometry, topology, acceptance condition or visual prerequisite is unresolved or contradictory."),
                ("Definition of Done","Current Word is self-contained enough for authorized construction handoff, while unresolved product choices remain explicitly blocked rather than invented."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:AUDIT]","Audit Baseline / Acceptance Matrix / Definition of Done Closure",rows)
              save(page,doc)

          def freeze(page):
              doc=Document(PAGES[page])
              rows=[
                ("Canonical UID",page),
                ("Canonical Name",page),
                ("Owner File",PAGES[page]),
                ("Page / Capability Spec","This current Word remains the single page design Canonical Owner."),
                ("Layout Mapping","REFERENCE → existing Page Layout / Primary Grid / Section mapping + Design System/Layout closure annex."),
                ("Component Mapping","REFERENCE → current Component/Section registry in this Word; no duplicate component inventory is introduced."),
                ("Control / Field Mapping","REFERENCE → current Control / Field / Action / Permission design tables and invariants in this Word."),
                ("Asset Mapping","REFERENCE → current page Asset Registry if any; otherwise explicit shared-owner / NOT_APPLICABLE asset rule in this annex."),
                ("Responsive Spec","REFERENCE → current page responsive rules + Visual Geometry closure annex."),
                ("Current Canonical Visual","REFERENCE → current visual/baseline already owned by this page/shared visual authority; candidate does not replace it without approval."),
                ("Generation Manifest","REQUIRED before a new candidate is generated; fields are defined by the Visual contract in this annex."),
                ("Audit Baseline","REFERENCE → "+f"{page}-AUD-DESIGN-001" if page in MISSING["audit"] else "REFERENCE → existing Audit/Acceptance section in this Word."),
                ("Acceptance Matrix","Current page acceptance section plus this annex; REQUIRED / OPTIONAL / NOT_APPLICABLE classification is preserved."),
                ("Definition of Done","Planning/basic-design DoD is the current page DoD plus zero unresolved REQUIRED design-spec gaps."),
                ("Design Version","Use this Word's current version metadata / exact repository revision; this annex MUST NOT invent a parallel design version."),
                ("Freeze Status","DESIGN_FREEZE_PACKAGE_DEFINED. DESIGN_FROZEN may be asserted only after required Visual Preview/Review/Approval and all applicable design gates actually pass; this annex does not self-approve."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:FREEZE]","Design Freeze Package Closure｜設計封板包補齊",rows)
              save(page,doc)

          def control(page):
              doc=Document(PAGES[page])
              rows=[
                ("Scope","This invariant applies to every existing ADMIN-STR-01 Control UID; it does not create new controls."),
                ("Canonical Name / Type / Label","Use each current control row's exact identity/type/label. Label copy must resolve through the current localization owner; no second label authority."),
                ("Icon Reference","Use current registered/shared icon reference; when no icon is required, NOT_APPLICABLE with the existing visual design as evidence."),
                ("Position / Dimensions","Use the current Section/Layout/Geometry mapping and existing control dimensions. Control state changes may not alter footprint unexpectedly."),
                ("Default / Hover / Focus / Active","Default preserves baseline; Hover reveals affordance only; Focus is keyboard-visible; Active indicates the current selected/invoked state without semantic mutation."),
                ("Loading","For an invoked async/effectful action, loading state prevents duplicate activation while preserving current context and label/status readability."),
                ("Disabled","Disabled is explicit and must expose the blocking reason/permission/gate when relevant; disabled state is not a hidden action."),
                ("Success","Success state is shown only after the current design's confirmed success outcome; it does not invent runtime completion."),
                ("Error","Error state preserves recoverable context, displays actionable failure information and follows current retry/recovery design."),
                ("Visibility / Permission / Action Reference","Use each current control's existing Visibility Condition + Permission Reference + Action Reference; missing exact authority remains fail closed."),
              ]
              add_table(doc,f"[ACPOS-DESIGN-CLOSURE:{page}:CONTROL]","Control State / Specification Closure｜控制項規格補齊",rows)
              save(page,doc)

          def login_dependency():
              fn="ACPOS_LOGIN_IDENTITY_ENTRY_Mother_Basic_Design_OPTIMIZED.docx"
              doc=Document(fn)
              rows=[
                ("Upstream Design Dependency","ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx owns Account / Identity / Permission design truth referenced by Login."),
                ("Downstream Design Dependency","ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx owns the authenticated Home/Shell/Navigation entry after successful identity admission."),
                ("Shared-owner Boundary","Login does not duplicate IAM permission models or Home navigation registry. It only owns the identity-entry surface and its local states."),
                ("Success Handoff","Successful identity admission hands the authenticated context to the current Home/Shell entry defined by Global Navigation."),
                ("Failure / Resume","Authentication/identity failure remains on the Login surface with explicit error/recovery state; no unauthorized downstream navigation."),
                ("Dependency Change Impact","IAM identity/permission contract or Home entry/navigation changes require Login design reference revalidation before design freeze."),
              ]
              add_table(doc,"[ACPOS-DESIGN-CLOSURE:LOGIN:DEPENDENCY]","Design Dependency / Reference Closure｜登入設計依賴補齊",rows)
              doc.save(fn)
              with zipfile.ZipFile(fn) as z:
                  bad=z.testzip()
                  if bad:raise RuntimeError(f"ZIP_BAD {fn} {bad}")

          action=sys.argv[1]
          if action=="requirements":
              for p in MISSING[action]:requirements(p)
          elif action=="page_identity":
              for p in MISSING[action]:page_identity(p)
          elif action=="design_system":
              for p in MISSING[action]:design_system(p)
          elif action=="geometry":
              for p in MISSING[action]:geometry(p)
          elif action=="visual":
              for p in MISSING[action]:visual(p)
          elif action=="asset":
              for p in MISSING[action]:asset(p)
          elif action=="a11y":
              for p in MISSING[action]:a11y(p)
          elif action=="audit":
              for p in MISSING[action]:audit(p)
          elif action=="freeze":
              for p in MISSING[action]:freeze(p)
          elif action=="control":
              for p in MISSING[action]:control(p)
          elif action=="login":
              login_dependency()
          else:
              raise SystemExit("UNKNOWN_ACTION")
          PY
