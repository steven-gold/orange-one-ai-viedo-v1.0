name: VIS-08 STR-01 Route Render Retry

on:
  push:
    branches: [acpos-vis08-staging]
    paths:
      - '.github/workflows/vis08-route-render-retry.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis08-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind authorized NAV-08 route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/shell/AppShell.tsx')
          s=p.read_text()
          old='{ id: "NAV-08", labelKey: "global.nav.strategy", icon: "strategy" },'
          new='{ id: "NAV-08", labelKey: "global.nav.strategy", icon: "strategy", href: "/strategy" },'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Install, typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Start production server
        run: |
          npm start > /tmp/vis08-server.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/strategy >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vis08-server.log
          exit 1
      - name: Browser validate and capture
        run: |
          mkdir -p docs/construction/evidence/VIS-08
          cat > .vis08-retry.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const out={};
          async function run(width,name,expanded=false){
            const p=await browser.newPage({viewport:{width,height:1000}});
            const xhr=[]; p.on('request',r=>{if(['xhr','fetch'].includes(r.resourceType())) xhr.push(r.url())});
            const res=await p.goto('http://127.0.0.1:3000/strategy',{waitUntil:'networkidle'});
            if(!res?.ok()) throw new Error(`route ${res?.status()}`);
            const root=p.locator('[data-page-uid="workspace:STR-01"]'); await root.waitFor();
            const c=await root.evaluate(el=>({
              controls:new Set([...el.querySelectorAll('[data-control-id]')].map(x=>x.getAttribute('data-control-id'))).size,
              sections:new Set([...el.querySelectorAll('[data-section-id]')].map(x=>x.getAttribute('data-section-id'))).size,
              visuals:new Set([...el.querySelectorAll('[data-visual-uid]')].map(x=>x.getAttribute('data-visual-uid'))).size,
              components:new Set([...el.querySelectorAll('[data-component-uid]')].map(x=>x.getAttribute('data-component-uid'))).size,
              client:el.clientWidth,scroll:el.scrollWidth,
              enabled:el.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled])').length
            }));
            if(c.controls!==57||c.sections!==12||c.visuals!==12||c.components!==16||c.enabled!==0) throw new Error(JSON.stringify(c));
            const ws=p.locator('.workspace-slot'), sb=p.locator('.global-sidebar');
            const before=await ws.boundingBox(); if(expanded){await sb.hover();await p.waitForTimeout(220)} const after=await ws.boundingBox(); const side=await sb.boundingBox();
            if(expanded && Math.abs((before?.x??0)-(after?.x??0))>1) throw new Error('sidebar reflow');
            const widths=await p.locator('[data-section-id="STR-01-SEC-02"]').evaluate(el=>[...el.closest('aside').parentElement.children].map(x=>Math.round(x.getBoundingClientRect().width)));
            out[name]={...c,xBefore:before?.x,xAfter:after?.x,sidebar:side?.width,primary:widths,xhr:xhr.length};
            await p.screenshot({path:`docs/construction/evidence/VIS-08/${name}.png`,fullPage:true}); await p.close();
          }
          await run(1600,'vis08-1600-top');
          await run(1600,'vis08-1600-expanded',true);
          await run(1440,'vis08-1440-top');
          await run(1440,'vis08-1440-expanded',true);
          await run(1200,'vis08-1200-minwidth');
          await browser.close();
          if(out['vis08-1600-top'].scroll!==out['vis08-1600-top'].client) throw new Error(`1600 overflow ${JSON.stringify(out['vis08-1600-top'])}`);
          if(out['vis08-1440-top'].scroll!==out['vis08-1440-top'].client) throw new Error(`1440 overflow ${JSON.stringify(out['vis08-1440-top'])}`);
          if(out['vis08-1200-minwidth'].scroll<=out['vis08-1200-minwidth'].client) throw new Error(`1200 no expected scroll ${JSON.stringify(out['vis08-1200-minwidth'])}`);
          fs.writeFileSync('docs/construction/evidence/VIS-08/vis08-validation.json',JSON.stringify(out,null,2));
          JS
          node .vis08-retry.mjs
          rm .vis08-retry.mjs
      - name: Commit validated shell binding and evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/shell/AppShell.tsx docs/construction/evidence/VIS-08
          git commit -m 'test(vis08): validate STR-01 route geometry [skip ci]'
          git push origin HEAD:acpos-vis08-staging
