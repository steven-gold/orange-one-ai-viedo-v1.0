name: CORE01 interaction closure
on:
  push:
    paths:
      - '.github/workflows/core01-interaction-closure-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch CORE01 visible interaction feedback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/CoreVisual.tsx')
          s=p.read_text()
          s=s.replace('type PageState = "LOADING" | "READY" | "ERROR";','type PageState = "LOADING" | "READY" | "ERROR";\ntype ConversationUiMessage = { id: string; role: "USER" | "STATUS"; text: string };',1)
          needle='''  const [message, setMessage] = useState("");\n  const [humanDecision, setHumanDecision] = useState("");'''
          repl='''  const [message, setMessage] = useState("");\n  const [conversationMessages, setConversationMessages] = useState<ConversationUiMessage[]>([]);\n  const [humanDecision, setHumanDecision] = useState("");'''
          assert needle in s
          s=s.replace(needle,repl,1)
          needle2='''  const reportBlock = (reason: string) => { setPageState("ERROR"); setRuntimeReason(reason); };\n  const runServerAction = async (action_uid: CoreActionUid, options: { path_params?: Record<string, string>; query?: Record<string, string>; payload?: unknown } = {}) => {\n    if (busyAction) return;'''
          repl2='''  const reportBlock = (reason: string) => { setPageState("ERROR"); setRuntimeReason(reason); };\n  const appendConversationMessage = (role: ConversationUiMessage["role"], text: string) => {\n    setConversationMessages((current) => [...current, { id: crypto.randomUUID(), role, text }]);\n  };\n  const runServerAction = async (action_uid: CoreActionUid, options: { path_params?: Record<string, string>; query?: Record<string, string>; payload?: unknown } = {}) => {\n    if (busyAction) return null;'''
          assert needle2 in s
          s=s.replace(needle2,repl2,1)
          needle3='''    if (result.ok) { setPageState("READY"); setRuntimeReason(null); }\n    else { setPageState("ERROR"); setRuntimeReason(result.reason_code); }\n  };'''
          repl3='''    if (result.ok) { setPageState("READY"); setRuntimeReason(null); }\n    else { setPageState("ERROR"); setRuntimeReason(`${result.error_uid}:${result.reason_code}`); }\n    return result;\n  };'''
          assert needle3 in s
          s=s.replace(needle3,repl3,1)
          old_send='''      case "CORE-01-ACT-SEND": {\n        const conversationId = requireConversationId(); if (!conversationId) return;\n        if (!message.trim()) { reportBlock("CORE-01-ERR-CONVERSATION-001:MESSAGE_REQUIRED"); return; }\n        void runServerAction(action, { path_params: { conversationId }, payload: { message: message.trim(), ai_mode: clientState.ai_mode, attachment_refs: clientState.attachment_refs, reference_refs: clientState.reference_refs } }); return;\n      }'''
          new_send='''      case "CORE-01-ACT-SEND": {\n        const submitted = message.trim();\n        if (!submitted) { reportBlock("CORE-01-ERR-CONVERSATION-001:MESSAGE_REQUIRED"); return; }\n        appendConversationMessage("USER", submitted);\n        setMessage("");\n        const conversationId = clientState.conversation_id;\n        if (!conversationId) {\n          const reason = "CORE-01-ERR-THREAD-001:REQUIRED_CONVERSATION_ID_MISSING";\n          reportBlock(reason);\n          appendConversationMessage("STATUS", reason);\n          return;\n        }\n        void (async () => {\n          const result = await runServerAction(action, { path_params: { conversationId }, payload: { message: submitted, ai_mode: clientState.ai_mode, attachment_refs: clientState.attachment_refs, reference_refs: clientState.reference_refs } });\n          if (!result) return;\n          appendConversationMessage("STATUS", result.ok ? `MESSAGE_ACCEPTED:${result.correlation_id}` : `${result.error_uid}:${result.reason_code}`);\n        })();\n        return;\n      }'''
          assert old_send in s
          s=s.replace(old_send,new_send,1)
          old_msg='''<PanelTitle labelKey="core01.group.message_workspace" /><div className={styles.messageEmpty}>—</div>{menuOpen &&'''
          new_msg='''<PanelTitle labelKey="core01.group.message_workspace" />{conversationMessages.length ? <div data-conversation-local-log="true">{conversationMessages.map((entry) => <div key={entry.id} className={styles.readonlyField} data-message-role={entry.role} aria-label={entry.role}><span className={styles.fieldValue}>{entry.text}</span></div>)}</div> : <div className={styles.messageEmpty}>—</div>}{menuOpen &&'''
          assert old_msg in s
          s=s.replace(old_msg,new_msg,1)
          p.write_text(s)
          PY
      - name: Contract and pollution checks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/components/pages/CoreVisual.tsx','utf8');
          if(!s.includes('data-conversation-local-log="true"'))throw new Error('conversation feedback log missing');
          if(!s.includes('appendConversationMessage("USER", submitted)'))throw new Error('user message is not appended before runtime');
          if(!s.includes('appendConversationMessage("STATUS", reason)'))throw new Error('blocked send lacks visible status');
          if(!s.includes('DASHBOARD_RUNTIME_NOT_BOUND') && s.includes('fake_ai_response'))throw new Error('fake runtime text detected');
          if(s.includes('/v1/core/actions')||s.includes('providerPicker')||s.includes('modelPicker'))throw new Error('unregistered CORE implementation introduced');
          const ids=[...s.matchAll(/"(CORE-01-(?:BTN|MENU)-[A-Z0-9-]+)"/g)].map(m=>m[1]);
          if(new Set(ids).size<25)throw new Error('CORE actionable control coverage unexpectedly low');
          NODE
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production server
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/core-server.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/core >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/core-server.log
          exit 1
      - name: Chromium interaction closure
        run: |
          cat > core01-check.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});const p=await b.newPage();
            await p.goto('http://127.0.0.1:3000/core',{waitUntil:'networkidle'});
            const runtime=p.locator('[data-component-uid="CORE-01-CMP-RUNTIME"] strong');
            async function clickReason(id, expected){const btn=p.locator(`[data-control-id="${id}"]`);if(await btn.isDisabled())throw new Error(id+' disabled');await btn.click();await p.waitForFunction(([id,expected])=>{const el=document.querySelector(`[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong`);return !!el&&el.textContent?.includes(expected)},[id,expected]);}
            await clickReason('CORE-01-BTN-TOPIC-CREATE','REQUIRED_PROJECT_ID_MISSING');
            await clickReason('CORE-01-BTN-NEW-THREAD','REQUIRED_PROJECT_ID_MISSING');
            await clickReason('CORE-01-BTN-SINGLE-AI','REQUIRED_WORK_ITEM_MISSING');
            await p.locator('[data-control-id="CORE-01-BTN-ASSISTANT-RECORD"]').click();
            await p.waitForFunction(()=>document.querySelector('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong')?.textContent?.includes('ASSISTANT_RECORD_OPEN'));
            const composer=p.locator('textarea[data-control-id="CORE-01-FLD-MESSAGE"]');await composer.fill('測試訊息：沒有正式 AI Runtime 時仍應留在對話欄');await p.locator('[data-control-id="CORE-01-BTN-SEND"]').click();
            const log=p.locator('[data-conversation-local-log="true"]');await log.waitFor();const logText=await log.innerText();
            if(!logText.includes('測試訊息：沒有正式 AI Runtime 時仍應留在對話欄'))throw new Error('user message missing from conversation');
            if(!logText.includes('REQUIRED_CONVERSATION_ID_MISSING'))throw new Error('visible AI/system failure status missing');
            if(await composer.inputValue()!=='')throw new Error('composer not cleared after send');
            await clickReason('CORE-01-BTN-CANDIDATE-CREATE','HUMAN_DECISION_REQUIRED');
            await clickReason('CORE-01-BTN-PROJECT-VALIDATE','REQUIRED_PROJECT_VERSION_REF_MISSING');
            await clickReason('CORE-01-BTN-BLUEPRINT-CREATE','REQUIRED_TOPIC_ID_MISSING');
            await clickReason('CORE-01-BTN-ATTACHMENT','REQUIRED_CONVERSATION_ID_MISSING');
            await clickReason('CORE-01-BTN-CANDIDATE-COMPARE','EXACT_CANDIDATE_SET_REQUIRED');
            await p.locator('[data-component-uid="CORE-01-CMP-MESSAGES"]').click({button:'right'});
            const menu=p.locator('[data-component-uid="CORE-01-CMP-MESSAGE-MENU"]');await menu.waitFor({state:'visible'});
            const quote=p.locator('[data-control-id="CORE-01-MENU-QUOTE"]');if(await quote.isDisabled())throw new Error('message menu disabled');await quote.click();
            await p.waitForFunction(()=>document.querySelector('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong')?.textContent?.includes('REQUIRED_CONVERSATION_ID_MISSING'));
            const create=p.locator('[data-control-id="CORE-01-BTN-PROJECT-CREATE"]');if(await create.isDisabled())throw new Error('project create disabled');await create.click();
            await p.waitForFunction(()=>{const t=document.querySelector('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong')?.textContent||'';return t.includes('CORE_RUNTIME_NOT_BOUND')||t.includes('CORE_PORT_REQUEST_FAILED')});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node core01-check.cjs
          rm core01-check.cjs
      - name: Commit validated CORE closure and self-clean
        run: |
          rm -f .github/workflows/core01-interaction-closure-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/CoreVisual.tsx .github/workflows/core01-interaction-closure-once.yml
          git commit -m "fix(core01): make governed interactions visibly responsive"
          git push origin HEAD:new
