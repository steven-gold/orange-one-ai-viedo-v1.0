name: Stage-02 Failure Recovery Applicability Fix R29

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-failure-recovery-applicability-fix-r29.yml'
      - 'governance/ci/apply_stage02_failure_recovery_applicability_fix_r29.py'
      - 'governance/ci/validate_stage02_failure_recovery_scanner_fix_r29.py'
      - 'governance/ci/run_current_stage2_r29_effective_reexecution.py'
      - 'governance/ci/close_stage02_failure_recovery_applicability_finding_r29.py'
      - 'governance/ci/run_current_stage2_actual_test.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-reexecute-close:
    runs-on: ubuntu-latest
    env:
      STAGE02_FULL_LINE_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R29 implementation
        run: |
          python -m py_compile governance/ci/apply_stage02_failure_recovery_applicability_fix_r29.py
          python -m py_compile governance/ci/validate_stage02_failure_recovery_scanner_fix_r29.py
          python -m py_compile governance/ci/run_current_stage2_r29_effective_reexecution.py
          python -m py_compile governance/ci/close_stage02_failure_recovery_applicability_finding_r29.py
      - name: Revalidate R28 applicability evidence and current legal ledgers
        run: |
          python governance/ci/validate_stage02_failure_recovery_applicability_r28.py
          python governance/ci/validate_stage02_r25_correctness_rollback.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
      - name: Apply exact canonical scanner applicability correction
        run: python governance/ci/apply_stage02_failure_recovery_applicability_fix_r29.py
      - name: Validate canonical scanner correction
        run: python governance/ci/validate_stage02_failure_recovery_scanner_fix_r29.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Fresh Stage-02 effective reexecution R29
        run: python governance/ci/run_current_stage2_r29_effective_reexecution.py
      - name: Assert corrected fresh denominator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.github/stage02-test/STAGE02_R29_EFFECTIVE_REEXECUTION_RESULT.json').read_text())
          assert r['raw_discovery_gap_total']==150, r
          assert r['raw_failure_recovery_gap_total']==23, r
          assert r['r28_exact_not_applicable_count']==21, r
          assert r['product_materialization_elimination_count']==17, r
          assert r['gap006_authority_elimination_count']==4, r
          assert r['fresh_functional_gap_total']==129, r
          assert r['effective_gap_categories']=={
            'ACTION_WITHOUT_CONTROL_OR_TRIGGER':1,
            'AUDIT_EVENT_NODE_MISSING':13,
            'FAILURE_STATE_ERROR_BINDING_MISSING':23,
            'PAYLOAD_INPUT_CONTRACT_MISSING':34,
            'POST_ACTION_VALIDATION_NODE_MISSING':18,
            'STATE_TRANSITION_LEDGER_FIELD_MISSING':40,
          }, r
          assert r['correctness_correction']['recovery_value_materialized'] is False, r
          assert r['current_specification_mutated'] is False and r['immutable_stage1_source_mutated'] is False, r
          assert r['result']=='BLOCKED' and r['stage_exit_allowed'] is False, r
          print('PASS: R29 raw=150 failure=23 product=17 external=4 effective=129; fail-closed')
          PY
      - name: Close verified scanner applicability finding
        run: python governance/ci/close_stage02_failure_recovery_applicability_finding_r29.py
      - name: Persist R29 scanner correction and fresh evidence
        run: |
          paths=(
            'governance/ci/run_current_stage2_actual_test.py'
            'governance/test/stage02/FIND-20260915-025_FAILURE_RECOVERY_APPLICABILITY_OVERREACH.yaml'
            '.github/stage02-test/STAGE02_R29_EFFECTIVE_REEXECUTION_RESULT.json'
            'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
            'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml'
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'R29 outputs unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'test(stage02): correct failure recovery applicability and persist R29 evidence'
          git push origin HEAD:rebuild-v2.1.1
