name: ACPOS Batch 47 System07 Social Contract Remediation
on:
  push:
    branches: [0921acpos]
permissions:
  contents: write
concurrency:
  group: acpos-batch47-system07-social-remediation
  cancel-in-progress: false
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Batch 46 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="c195fca67d80c7303123f131b699a6739056cb06"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow
      - name: Apply Batch 47 remediation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch47_system07_social_contract_remediation.py
      - name: Verify Batch 47 semantics
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("__batch47_remediation_report.json").read_text(encoding="utf-8"))["machine"]
          assert m["pre_contract_cells"]==268 and m["system07_cells_closed"]==29 and m["post_contract_cells"]==239,m
          assert (m["remaining_method_path"],m["remaining_payload_schema"],m["remaining_persistence_owner"])==(62,98,79),m
          assert m["plaintext_secret_persisted"]==0 and m["local_request_as_external_success"]==0,m
          print("PASS: BATCH47 268 -> 239")
          PY
      - name: Convert three DOCX files to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __render_qa_batch47/pdf
          while IFS= read -r f; do libreoffice --headless --convert-to pdf --outdir __render_qa_batch47/pdf "$f" >/dev/null; done <<'EOF'
          07_ACPOS_Social_Publishing_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          EOF
      - name: Encoding CJK and geometry QA
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,math,shutil
          from PIL import Image
          r=json.loads(Path("__batch47_remediation_report.json").read_text(encoding="utf-8"));root=Path("__render_qa_batch47");(root/"contact").mkdir(exist_ok=True);(root/"png").mkdir(exist_ok=True)
          cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]");bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"];rep={};total=0
          for fn in r["changed_docs"]:
              p=Path(fn);pdf=root/"pdf"/(p.stem+".pdf");assert pdf.exists()
              with zipfile.ZipFile(p) as z:
                  for n in [x for x in z.namelist() if x.endswith(".xml") or x.endswith(".rels")]:ET.fromstring(z.read(n))
                  rx=ET.fromstring(z.read("word/document.xml"));ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}";src="".join((e.text or "") for e in rx.iter(ns+"t"))
              txt=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict");assert not [x for x in bad if x in src or x in txt]
              sc=len(cjk.findall(src));pc=len(cjk.findall(txt));assert sc and pc/sc>=0.97,(fn,sc,pc)
              out=root/"png"/p.stem;out.mkdir(exist_ok=True);subprocess.check_call(["pdftoppm","-png","-r","72",str(pdf),str(out/"page")],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              imgs=sorted(out.glob("page-*.png"));blank=[];edge=[];thumbs=[]
              for imf in imgs:
                  im=Image.open(imf).convert("L");w,h=im.size;b=im.point(lambda x:255 if x<245 else 0).getbbox()
                  if b is None:blank.append(imf.name)
                  elif b[0]<=1 or b[1]<=1 or b[2]>=w-1 or b[3]>=h-1:edge.append(imf.name)
                  th=Image.open(imf).convert("RGB");th.thumbnail((180,255));thumbs.append(th.copy())
              assert not blank and not edge,(fn,blank,edge[:5]);cols=4;cw=190;ch=265;rows=math.ceil(len(thumbs)/cols);sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for i,im in enumerate(thumbs):sheet.paste(im,((i%cols)*cw+5,(i//cols)*ch+5))
              sheet.save(root/"contact"/(p.stem+"_contact.jpg"),quality=82);total+=len(imgs);rep[fn]={"pages":len(imgs),"cjk_ratio":pc/sc,"blank":0,"edge_clip":0,"status":"PASS"};shutil.rmtree(out)
          rep["_summary"]={"documents":len(r["changed_docs"]),"pages":total,"blank":0,"edge_clip":0,"status":"PASS"};(root/"qa_report.json").write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding="utf-8")
          print(rep["_summary"])
          PY
      - name: Verify exact Word scope
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import subprocess,json
          from pathlib import Path
          r=json.loads(Path("__batch47_remediation_report.json").read_text(encoding="utf-8"))
          c=sorted(subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","c195fca67d80c7303123f131b699a6739056cb06","--","*.docx"],text=True).splitlines())
          assert c==sorted(r["changed_docs"]),(c,r["changed_docs"])
          PY
      - name: Collect evidence
        run: |
          mkdir -p __batch47_evidence
          cp __batch47_remediation_report.json __batch47_evidence/
          cp __render_qa_batch47/qa_report.json __batch47_evidence/
          cp -R __render_qa_batch47/pdf __render_qa_batch47/contact __batch47_evidence/
      - name: Upload Batch 47 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch47-system07-social-contract-remediation-evidence
          path: __batch47_evidence
          retention-days: 1
          if-no-files-found: error
      - name: Commit Batch 47 and remove tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-word-batch-47"
          git config user.email "actions@users.noreply.github.com"
          git add -- "07_ACPOS_Social_Publishing_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" "ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx" "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git rm -f __temp/batch47_system07_social_contract_remediation.py .github/workflows/acpos_batch47_system07_social_contract_remediation.yml
          rm -rf __batch47_remediation_report.json __batch47_evidence __render_qa_batch47
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git commit -m "docs(acpos): close system07 social contract gaps"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
