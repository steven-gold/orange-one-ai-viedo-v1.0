      - UpdateAssetLayerDocumentRequest
      - System 05 / CompositionDocument + New CompositionVersion Lineage
      - Updates create a new composition version from expected document/version; historical composition snapshots remain immutable.
    - row: 8
      cells:
      - ASSET-01-BTN-LAYER-ADD
      - addAssetLayer
      - POST /v1/asset-runtime-runs/{runId}/layer-documents/{compositionDocumentId}/layers
