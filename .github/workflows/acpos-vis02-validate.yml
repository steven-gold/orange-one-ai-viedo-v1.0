name: ACPOS VIS-02 validation

on:
  push:
    branches:
      - acpos-vis02-staging
    paths-ignore:
      - 'docs/construction/evidence/VIS-02/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis02-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser harness without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/acpos-vis02.log 2>&1 &
          echo $! > /tmp/acpos-vis02.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/core >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/acpos-vis02.log
          exit 1
      - name: Render and validate VIS-02
        run: node scripts/capture-vis02.mjs
      - name: Upload VIS-02 render evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-vis02-render-evidence
          path: artifacts/vis02
          if-no-files-found: error
      - name: Persist VIS-02 evidence
        run: |
          mkdir -p docs/construction/evidence/VIS-02
          cp artifacts/vis02/* docs/construction/evidence/VIS-02/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/VIS-02
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: persist VIS-02 render evidence'
          git push origin HEAD:acpos-vis02-staging
