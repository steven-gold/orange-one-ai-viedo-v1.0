name: ERP-01 closure validation
on:
  push:
    branches: [acpos-erp01-closure-20260903]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Product audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: ERP authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re
          a=Path('authority/pages/admin/ERP-01/ACPOS_ERP-01_ERP_FINANCE_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          v=Path('src/components/pages/ErpVisual.tsx').read_text(); c=Path('src/domain/erp/erpRuntimeContract.ts').read_text(); p=Path('src/domain/erp/erpProjectionPort.ts').read_text(); r=Path('src/components/pages/ErpControlRuntime.tsx').read_text(); s=Path('src/server/testing/controlledErpTestRuntime.ts').read_text()
          controls=set(re.findall(r'control_uid:\s*(ERP-01-[A-Z0-9-]+)',a)); sections=set(re.findall(r'section_uid:\s*(ERP-01-SEC-[0-9]+)',a)); actions=set(re.findall(r'action_uid:\s*(ERP-01-ACT-[A-Z0-9-]+)',a)); gates=set(re.findall(r'gate_uid:\s*(ERP-01-GATE-[A-Z0-9-]+)',a)); errors=set(re.findall(r'error_uid:\s*(ERP-01-ERR-[A-Z0-9-]+)',a))
          print('ERP_AUTHORITY_COUNTS',len(controls),len(sections),len(actions),len(gates),len(errors))
          assert len(controls)==42 and len(sections)==8 and len(actions)==18 and len(gates)==10 and len(errors)==8
          assert all(x in v or x in c for x in controls)
          assert all(x in c for x in errors) and all(x in c for x in gates)
          assert 'ErpProjectionTestMetadata' in p and 'ERP_TEST_PROJECTION_FORBIDDEN_IN_PRODUCTION' in p
          assert 'TEST_METADATA' in s and 'production_eligible: false' in s
          assert 'secret_reference_id' in s and 'raw_secret' in s and 'ERP01_SECRET_VALUE_FORBIDDEN' in s
          assert 'system_implementation_status: NOT_EXECUTED' in a
          assert 'external_erp_writeback: FORBIDDEN' in a and 'missing_value_as_zero is forbidden' in a
          assert 'secret values are never embedded or displayed' in a
          assert 'ERP-01-ACT-CONNECTOR-CREATE' in r and '/v1/erp/connectors' in r
          print('ERP_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ''
        run: npm run build
      - name: Production ERP must fail closed
        run: |
          set -euo pipefail
          PORT=3241 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/erp-prod.log 2>&1 & pid=$!; trap 'cat /tmp/erp-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3241/admin/erp >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/erp-prod.json -w '%{http_code}' 'http://127.0.0.1:3241/v1/ui-projections/admin%3AERP-01'); cat /tmp/erp-prod.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/erp-prod.json
          ! grep -q 'TEST_ONLY' /tmp/erp-prod.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled ERP projection classification and secret boundary
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3242 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/erp-api.log 2>&1 & pid=$!; trap 'cat /tmp/erp-api.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3242/admin/erp >/dev/null && break || sleep 1; done
          curl -fsS 'http://127.0.0.1:3242/v1/ui-projections/admin%3AERP-01' >/tmp/erp.json
          python <<'PY'
          import json
          d=json.load(open('/tmp/erp.json')); m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY' and m['synthetic'] is True and m['production_eligible'] is False
          assert d['page_state']=='READY' and len(d['gate_state'])==10
          assert d['values']['ERP-01-FLD-CONN-SECRET-REFERENCE-ID']=='SEC-REF-TEST-ERP-001'
          assert 'secret' not in d['values']['ERP-01-FLD-CONN-SECRET-REFERENCE-ID'].lower()
          assert len(d['form_schemas']['ERP-01-BTN-CONNECTOR-CREATE'])==10
          assert all(f['key'] not in ['secret','secret_value','raw_secret','credential_value','api_key'] for f in d['form_schemas']['ERP-01-BTN-CONNECTOR-CREATE'])
          print('ERP_CONTROLLED_PROJECTION_PASS')
          PY
          code=$(curl -sS -o /tmp/erp-secret.json -w '%{http_code}' -X PATCH 'http://127.0.0.1:3242/v1/erp/connectors/TEST-ERP-CONNECTOR-001' -H 'content-type: application/json' --data '{"raw_secret":"forbidden","scope":"finance-ledger","expected_version":2,"idempotency_key":"TEST-FORBIDDEN"}')
          test "$code" = "400"
          grep -q 'ERP01_SECRET_VALUE_FORBIDDEN' /tmp/erp-secret.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled ERP browser flow
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3243 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/erp-browser.log 2>&1 & pid=$!; trap 'cat /tmp/erp-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3243/admin/erp >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),errors=[];
          for(const width of [1280,1440,1920]){const p=await b.newPage({viewport:{width,height:1500}});p.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));p.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});await p.goto('http://127.0.0.1:3243/admin/erp',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:ERP-01"]')?.getAttribute('data-page-state')==='READY');const root=p.locator('[data-page-uid="admin:ERP-01"]');if(await root.getAttribute('data-authority-control-count')!=='42')throw new Error('controls');const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>0)throw new Error(`overflow ${width}:${overflow}`);await p.close()}
          const p=await b.newPage({viewport:{width:1440,height:1800}});p.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));p.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});await p.goto('http://127.0.0.1:3243/admin/erp',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:ERP-01"]')?.getAttribute('data-page-state')==='READY');const q=id=>p.locator(`[data-control-id="${id}"]`).first();
          if(!((await q('ERP-01-FLD-CONN-SECRET-REFERENCE-ID').textContent())||'').includes('SEC-REF-TEST-ERP-001')){await q('ERP-01-BTN-TAB-CONNECTOR').click()}
          await q('ERP-01-BTN-DETAIL').click();await p.waitForFunction(()=>document.querySelector('[data-section-id="ERP-01-SEC-08"]')?.getAttribute('data-state')==='OPEN_DETAIL');
          await q('ERP-01-BTN-FACTPACK').click();await q('ERP-01-BTN-GUARDRAILS').click();await q('ERP-01-BTN-FORECAST').click();
          await q('ERP-01-BTN-EXPORT').click();let drawer=p.locator('[data-drawer-form="ERP-01-BTN-EXPORT"]');await drawer.locator('[data-form-field-key="scope"] input').fill('finance-ledger');await drawer.locator('[data-form-submit="true"]').click();
          await q('ERP-01-BTN-TAB-CONNECTOR').click();
          if(!(await q('ERP-01-BTN-CONNECTOR-CREATE').isDisabled()))throw new Error('create must be disabled when configured');
          await q('ERP-01-BTN-CONNECTOR-UPDATE').click();drawer=p.locator('[data-drawer-form="ERP-01-BTN-CONNECTOR-UPDATE"]');await drawer.locator('[data-form-field-key="entity_scope"] input').fill('finance-ledger');await drawer.locator('[data-form-submit="true"]').click();
          await q('ERP-01-BTN-CONNECTOR-VALIDATE').click();await q('ERP-01-BTN-MAPPING-VALIDATE').click();
          if(!((await q('ERP-01-FLD-CONN-SECRET-REFERENCE-ID').textContent())||'').includes('SEC-REF-TEST-ERP-001'))throw new Error('secret reference lost');
          await q('ERP-01-BTN-TAB-SYNC').click();
          await q('ERP-01-BTN-SNAPSHOT-REFRESH').click();drawer=p.locator('[data-drawer-form="ERP-01-BTN-SNAPSHOT-REFRESH"]');await drawer.locator('[data-form-field-key="requested_scope"] input').fill('finance-ledger');await drawer.locator('[data-form-submit="true"]').click();
          await q('ERP-01-BTN-SYNC-CREATE').click();drawer=p.locator('[data-drawer-form="ERP-01-BTN-SYNC-CREATE"]');
          const vals={requested_scope:'finance-ledger',data_classification:'internal',records_payload:'controlled records',snapshot_document:'TEST_ONLY snapshot',completeness:'100%',external_evidence_refs:'TEST-EVIDENCE-ERP-001'};for(const[k,v]of Object.entries(vals))await drawer.locator(`[data-form-field-key="${k}"] input`).fill(v);await drawer.locator('[data-form-field-key="snapshot_type"] select').selectOption('delta');await drawer.locator('[data-form-field-key="external_result_verified"] select').selectOption('false');await drawer.locator('[data-form-submit="true"]').click();
          await q('ERP-01-BTN-SYNC-STATUS').click();
          if(!(await q('ERP-01-BTN-SYNC-RETRY').isDisabled()))await q('ERP-01-BTN-SYNC-RETRY').click();
          await q('ERP-01-BTN-FAILURE-GET').click();
          if(errors.length)throw new Error(errors.join('\n'));console.log('ERP_BROWSER_INTERACTION_PASS');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/erp src/components/pages/ErpControlRuntime.tsx src/components/pages/ErpVisual.tsx
          git diff --exit-code
