name: INFO-01 preview final verify once

on:
  push:
    branches: [new]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source for browser tooling
        uses: actions/checkout@v4
        with:
          ref: new
          path: source

      - name: Checkout sealed preview
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          path: previewrepo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install isolated browser tooling
        working-directory: source
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"

      - name: Validate final sealed INFO-01 preview head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C previewrepo rev-parse HEAD)" = "b67c8758f6eeee035d485f0845405b22fc133867"
          test -f previewrepo/preview/info.html
          test -f previewrepo/preview/info01-assets/_next/static/chunks/2-yi9nccot1u4.css
          test -f previewrepo/preview/info01-assets/_next/static/chunks/0837kap0r0242.css
          test "$(find previewrepo/preview/info01-assets -type f | wc -l | tr -d ' ')" = "2"
          if find previewrepo/preview/info01-assets -type f ! -name '*.css' | grep -q .; then
            echo 'Unexpected INFO-01 preview runtime asset remains' >&2
            exit 1
          fi
          cd previewrepo/preview
          python3 -m http.server 4173 > /tmp/info01-final-preview.log 2>&1 &
          static_pid=$!
          trap 'kill $static_pid || true; cat /tmp/info01-final-preview.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/info.html >/dev/null; then break; fi
            sleep 1
          done
          cd ../../source
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[];
            const failed=[];
            const runtimeRequests=[];
            const scriptRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/'))runtimeRequests.push(`${r.method()} ${u.pathname}`);if(r.resourceType()==='script')scriptRequests.push(u.pathname);});
            await page.goto('http://127.0.0.1:4173/info.html',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="workspace:INFO-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            assert.equal(await page.locator('html').getAttribute('data-info01-preview-mode'),'SEALED_STATIC_FAIL_CLOSED');
            assert.equal(await root.getAttribute('data-page-state'),'ERROR');
            assert.equal(await root.getAttribute('data-projection-status'),'BLOCKED');
            assert.equal(await root.getAttribute('data-projection-reason'),'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.equal(await root.getAttribute('data-authority-sections'),'12');
            assert.equal(await root.getAttribute('data-authority-components'),'20');
            assert.equal(await root.getAttribute('data-authority-controls'),'66');
            assert.equal(await root.getAttribute('data-authority-actions'),'17');
            assert.equal(await root.getAttribute('data-registry-valid'),'true');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert((await page.locator('body').innerText()).includes('UI_PROJECTION_RUNTIME_NOT_BOUND'));
            assert.equal(await page.locator('script').count(),0);
            assert.deepEqual(runtimeRequests,[]);
            assert.deepEqual(scriptRequests,[]);
            const formal=page.locator('[data-runtime-binding="NOT_EXECUTED"]');
            assert((await formal.count())>=5);
            for(let i=0;i<await formal.count();i++){
              const node=formal.nth(i);
              assert(await node.getAttribute('data-action-uid'));
              assert(await node.getAttribute('data-gate-uid'));
              assert(await node.getAttribute('data-permission-uid'));
              assert(await node.getAttribute('data-operation'));
              assert(await node.getAttribute('data-method-path'));
              assert(await node.getAttribute('data-error-uid'));
              assert.equal(await node.getAttribute('data-current-state'),'ERROR');
              assert.equal(await node.getAttribute('data-control-enabled-from-projection'),'false');
            }
            assert.equal(await page.locator('a[data-nav-id="NAV-09"]').getAttribute('href'),'info.html');
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('INFO01_FINAL_SEALED_PREVIEW_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
