authority:
  id: ACPOS_PRODUCTION_IDENTITY_RUNTIME_CONTRACT
  version: V1.0
  status: FINAL_LOCKED
  current_only: true
  revision: 2026-09-05-INTERNAL-COOKIE-SESSION-TRANSPORT
  scope: PRODUCTION_REQUEST_TO_APP_USERS_ACTOR_CONTRACT_ONLY
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
approval:
  user_approved: true
  approved_on: '2026-09-05'
  approved_scope:
  - Name canonical production actor as app_users.user_id
  - Name GHS-PORT-IDENTITY / resolveIdentityAccountAuthority as the required identity port
  - Lock internal cookie session transport named acpos_session
  - Lock email join from acpos_runtime.accounts to app_users
  - Lock scrypt password verify against acpos_runtime.accounts.password_hash
  - Materialize GET/POST/DELETE /v1/identity/session and OPEN_LOGIN /login
  - Keep 03_api/operation_registry.yaml absent
  - Do not bind configureUiProjectionRuntime in this revision
  - Do not change /health/ready to 200
source:
  derived_from:
  - authority/global/GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY_FINAL_LOCKED_V1.9.yaml
  - authority/runtime/ACPOS_WB01_UI_PROJECTION_SQL_PERMISSION_MAPPING_FINAL_LOCKED_V1.0.yaml
  - database/migrations/0001_canonical_schema.sql
  - database/migrations/0003_account_permission_authorization.sql
  - database/migrations/0007_runtime_operational_schema.sql
  - authority/runtime/ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml
canonical_actor:
  table: app_users
  user_id_column: user_id
  external_subject_column: external_subject
  email_column: email
  display_name_column: display_name
  disabled_at_column: disabled_at
  status_column: status
  actor_type_for_human_page_gate: USER
  lookup_sql: |
    SELECT user_id, external_subject, email, display_name, status, disabled_at
    FROM app_users
    WHERE user_id = $actor_user_id
      AND disabled_at IS NULL
  lookup_by_external_subject_sql: |
    SELECT user_id, external_subject, email, display_name, status, disabled_at
    FROM app_users
    WHERE external_subject = $external_subject
      AND disabled_at IS NULL
  lookup_by_runtime_session_sql: |
    SELECT u.user_id::text AS user_id,
           a.id AS runtime_account_id,
           u.email::text AS email,
           u.display_name,
           u.external_subject
    FROM acpos_runtime.sessions s
    JOIN acpos_runtime.accounts a ON a.id = s.account_id
    JOIN app_users u ON lower(u.email::text) = lower(a.email)
    WHERE s.token_hash = $session_token_sha256_hex
      AND s.expires_at > now()
      AND u.disabled_at IS NULL
      AND a.status = 'READY'
    LIMIT 1
  external_subject_uniqueness: UNIQUE
  external_subject_provider: INTERNAL_RUNTIME_ACCOUNT_EMAIL
  status_predicate: AUTHORITY_GAP
  status_gap_reason: app_users.status uses acpos_status; Current Authority does not name which values are an active human actor. Session lookup uses disabled_at IS NULL only.
shell_identity_port:
  port_uid: GHS-PORT-IDENTITY
  operation: resolveIdentityAccountAuthority
  path: /v1/identity/session
  logged_out_action: OPEN_LOGIN
  logged_in_action: OPEN_ACCOUNT_MENU
  unresolved_error: GHS-ERR-IDENTITY-001
  fake_name_or_avatar: FORBIDDEN
  logged_out_to_logged_in: authenticated session established
  logged_in_to_logged_out: session ended
  open_login_path: /login
  operation_registry_file: 03_api/operation_registry.yaml
  operation_registry_file_in_app_repo: ABSENT
  catalog_registration: NOT_PRESENT
current_http_surface:
  observed_request_headers:
  - x-correlation-id
  observed_identity_headers: []
  ui_projection_request_fields:
  - page_uid
  - correlation_id
  dashboard_access_request_fields:
  - correlation_id
  identity_transport: INTERNAL_COOKIE_SESSION
  cookie_name: acpos_session
  cookie_http_only: true
  cookie_same_site: Lax
  cookie_path: /
  cookie_max_age_seconds: 43200
  token_hash_algorithm: SHA-256
  token_hash_encoding: hex
  session_methods:
  - GET
  - POST
  - DELETE
  missing_identity_fail_closed:
    condition: request has no valid acpos_session cookie
    reason_code: IDENTITY_RUNTIME_NOT_BOUND
    bind_login_adapter: false
  search_evidence:
    login_route_in_src_app: src/app/login/page.tsx
    session_route_in_src_app: src/app/v1/identity/session/route.ts
    identity_runtime_in_src_app: src/server/identity/identityRuntime.ts
    cookie_name_in_current_authority: acpos_session
    authorization_scheme_in_current_authority: ABSENT
runtime_account_store:
  schema: acpos_runtime
  accounts_table: acpos_runtime.accounts
  sessions_table: acpos_runtime.sessions
  mapping_to_app_users: EMAIL_JOIN
  mapping_sql: lower(app_users.email::text) = lower(acpos_runtime.accounts.email)
  runtime_account_active_status: READY
  password_hash_login: scrypt$16384$8$1$salt_base64url$key_base64url
  password_keylen: 32
forbidden:
  - Invent Authorization Bearer or an IdP header
  - Use NEON_AUTH_BASE_URL or VITE_NEON_AUTH_URL as application identity
  - Treat acpos_runtime.sessions as app_users identity without the email join
  - Treat x-correlation-id as user identity
  - Create a health/ready service user to force ready 200
  - Bind configureUiProjectionRuntime while remaining_blockers is non-empty
  - Change official site /health/ready to 200
  - Claim production ready
health_ready:
  identity_required_for_page_gate: true
  unauthenticated_reason_code: IDENTITY_RUNTIME_NOT_BOUND
  keep_fail_closed: true
remaining_blockers:
  - IDENTITY_OPERATION_REGISTRY_ABSENT
  - APP_USERS_STATUS_PREDICATE_NOT_DEFINED
adapter_bind_allowed: false
production_ready_claim_allowed: false
next_action: CLOSE_WB01_PROJECTION_MAPPING_GAPS
