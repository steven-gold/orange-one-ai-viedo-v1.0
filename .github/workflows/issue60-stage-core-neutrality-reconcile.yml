name: Issue60 Stage Core Neutrality Reconcile

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-source/active/source/**'
      - 'governance/ci/stage_execution_engine.py'
      - 'governance/ci/stage_execution_semantic_adapters.yaml'
      - 'governance/ci/test_stage_execution_engine.py'
      - 'governance/ci/validate_selected_execution_profile_integrity.py'
      - 'governance/ci/external_execution_admission.py'
      - 'governance/ci/test_external_execution_admission.py'
      - 'governance/specifications/REGISTRY.yaml'
      - 'governance/environment/EXECUTION_WORKLINE_BINDING.yaml'
      - '.github/workflows/common-stage-execution-engine.yml'
      - '.github/workflows/current-governance-cleanup-validation.yml'
      - '.github/workflows/issue60-stage-core-neutrality-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Reconcile Stage-neutral governance derivatives
        run: |
          set -euo pipefail
          python governance/source-successor/materialize_derived_source_package.py
          python governance/source-successor/refresh_source_checksums.py
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          p=Path('governance/specifications/REGISTRY.yaml')
          text=p.read_text(encoding='utf-8')
          doc=yaml.safe_load(text) or {}
          c=doc.get('candidate_validation_contract') or {}
          exact=list(map(str,c.get('source_package_validation_toolchain_exact_paths') or []))
          prefixes=tuple(map(str,c.get('source_package_validation_toolchain_subtree_prefixes') or []))
          tracked=subprocess.run(['git','ls-files'],check=True,text=True,capture_output=True).stdout.splitlines()
          observed=sorted(set(exact)|{x for x in tracked if any(x.startswith(pre) for pre in prefixes)})
          missing=[x for x in observed if not Path(x).is_file()]
          if missing: raise SystemExit('TOOLCHAIN_PATH_MISSING:'+repr(missing))
          blobs={x:subprocess.run(['git','hash-object',x],check=True,text=True,capture_output=True).stdout.strip() for x in observed}
          ls=text.splitlines()
          count_rows=[i for i,x in enumerate(ls) if x.startswith('  source_package_validation_toolchain_exact_file_count:')]
          if len(count_rows)!=1: raise SystemExit('TOOLCHAIN_COUNT_ROW_INVALID')
          ls[count_rows[0]]='  source_package_validation_toolchain_exact_file_count: '+str(len(observed))
          starts=[i for i,x in enumerate(ls) if x=='  source_package_validation_toolchain_blob_bindings:']
          if len(starts)!=1: raise SystemExit('TOOLCHAIN_BINDING_BLOCK_INVALID')
          lo=starts[0]
          hi=next((i for i in range(lo+1,len(ls)) if ls[i] and not ls[i].startswith('    ')),len(ls))
          block=['  source_package_validation_toolchain_blob_bindings:']+[f'    "{k}": {v}' for k,v in blobs.items()]
          ls=ls[:lo]+block+ls[hi:]
          p.write_text('\n'.join(ls)+'\n',encoding='utf-8')
          print('PASS: rebuilt toolchain exact set count='+str(len(observed)))
          PY
          python governance/source-successor/materialize_derived_source_package.py
          python governance/source-successor/refresh_source_checksums.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/governance-source/active/source governance/specifications/REGISTRY.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(governance): reconcile Stage-neutral derived package"
          fi
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/validate_selected_execution_profile_integrity.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_external_execution_admission.py
          python governance/ci/test_stage_execution_engine.py
          python governance/ci/test_external_execution_admission.py
          python governance/ci/validate_source_package_candidate.py
          git push origin HEAD:rebuild-v2.1.1
