name: ACPOS Batch 12 Unique Owner Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-12-unique-owner-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Verify no Word drift since Batch 11
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="b82149b96b3409e3002550111f8f8a5a0ba4d716"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-11")
          PY
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_12_unique_owner_audit.py
      - name: Run Batch 12 audit
        run: python __temp/batch_12_unique_owner_audit.py
      - name: Upload Batch 12 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-12-unique-owner-audit
          path: __batch12_unique_owner_audit.json
          retention-days: 1
