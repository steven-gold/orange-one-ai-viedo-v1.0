name: ACPOS Batch 60 Legacy Cleanup EDIT Bidirectional Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch60-legacy-edit-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 59 clean Word boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="883594dc703d1e3f97c2f5510ff801a0e1c2e512"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH59 WORD BOUNDARY"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 60 multidirectional audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch60_legacy_cleanup_edit_bidirectional_audit.py

      - name: Verify audit denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch60_bidirectional_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_exact_rows"]==2,s
          assert s["page_target_rows"]==1 and s["owner_target_rows"]==1,s
          assert s["port_contract_count"]==2,s
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 60 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch60-legacy-cleanup-edit-bidirectional-audit
          path: |
            __batch60_bidirectional_audit.json
            __batch60_summary.json
          retention-days: 2
          if-no-files-found: error

      - name: Remove Batch 60 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch60_bidirectional_audit.json __batch60_summary.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-60-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch60_legacy_cleanup_edit_bidirectional_audit.py .github/workflows/acpos_batch60_legacy_edit_bidirectional_audit.yml
          git commit -m "chore(acpos): close batch 60 legacy and edit audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH60 HARNESS REMOVED / CLEAN TREE"
