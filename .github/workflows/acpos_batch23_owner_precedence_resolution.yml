name: ACPOS Batch 23 Canonical Owner Precedence Resolution

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch23-owner-precedence-resolution
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 22 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="625ddbc2bbe4cdbe19e798c2fc49b9b3a60eb648"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH22 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 23 owner precedence resolution
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch23_owner_precedence_resolution.py

      - name: Verify Batch 23 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch23_owner_precedence_resolution.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_cells"]==341,s
          assert s["pre_raw_owner_collision"]==47,s
          assert s["owner_precedence_resolved"]==47,s
          assert s["post_raw_owner_collision"]==0,s
          assert s["all_cells_with_canonical_owner"]==341,s
          assert s["unique_owner_direct"]==294,s
          assert s["by_field"]=={"method_path":80,"payload_schema":137,"persistence_owner":124},s
          print("PASS: BATCH23 OWNER PRECEDENCE 47 -> 0")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 23 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch23-owner-precedence-resolution
          path: |
            __batch23_owner_precedence_resolution.json
            __batch23_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 23 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch23_owner_precedence_resolution.json __batch23_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-23-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch23_owner_precedence_resolution.py .github/workflows/acpos_batch23_owner_precedence_resolution.yml
          git commit -m "chore(acpos): close batch 23 owner precedence resolution harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH23 HARNESS REMOVED / CLEAN TREE"
