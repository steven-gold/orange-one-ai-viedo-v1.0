document:
  paragraphs:
  - index: 0
    style: Normal
    text: ACPOS · SG-02
  - index: 1
    style: Normal
    text: QA 審查項目名單｜Mother Basic Design
  - index: 2
    style: Normal
    text: Quality Criteria · Gate Policy · Versioning · Impact · Approval
  - index: 3
    style: Normal
    text: 頁面定位｜後台 QA Review Standard 治理面。管理 Criteria Version、Dimension、Threshold、Department Applicability、Required Check、Gate Policy、Impact 與 Approval；它不是 workspace:QA-01
      的待審工作台，也不執行實際 QA 審查。
  - index: 6
    style: Heading 1
    text: 1. 產品目標與治理邊界
  - index: 7
    style: List Bullet
    text: 把 QA 評分標準的版本、維度、門檻、必檢項目、部門適用性、Gate Policy、Impact 與 Approval 放在單一治理頁中，避免標準散落在各 QA 工作區。
  - index: 8
    style: List Bullet
    text: ACTIVE Criteria Version 不可原地修改；任何實質變更先形成新版本／新草稿，再進 Impact、Review 與 Approval，歷史審查結果永久保留原 criteria_version。
  - index: 9
    style: List Bullet
    text: SG-02 只治理「審查標準」；專案、任務、影片、素材的實際 QA 執行仍由 QA Runtime / QA-01 負責。
  - index: 10
    style: List Bullet
    text: Threshold 不得硬編碼在 UI、前端常數或 QA 執行頁；QA Runtime 必須讀取被正式綁定的 Criteria Version / Gate Policy。
  - index: 11
    style: List Bullet
    text: 未註冊 Search / Filter / Export / Clone / Delete / Activate 等操作不得因便利性自行加入。
  - index: 12
    style: Heading 1
    text: 2. Scope / Out-of-Scope
  - index: 14
    style: Heading 1
    text: 3. Business Entity Inventory
  - index: 16
    style: Heading 1
    text: 4. Business Entity × Operation Matrix
  - index: 18
    style: Heading 1
    text: 5. Entity Hierarchy & Version Semantics
  - index: 19
    style: List Bullet
    text: QualityCriteriaVersion 是版本根；Dimension / Threshold / Required Check / Department Mapping / Gate Policy 的正式狀態必須可追溯回該版本。
  - index: 20
    style: List Bullet
    text: ACTIVE 版本為 immutable。修改需求先建立新的 Draft/Working Version，不允許把 ACTIVE row 直接改寫。
  - index: 21
    style: List Bullet
    text: Review Result 必須保存 criteria_version_ref；後續 Criteria 更新不能回填或重算歷史結果，除非建立正式 Revalidation 結果且保留原結果。
  - index: 22
    style: List Bullet
    text: 同一時點可存在歷史版本與待核准版本，但執行端只使用被 Current Mapping 明確指定的版本；不得用 latest/current 字串猜測。
  - index: 23
    style: List Bullet
    text: SUPERSEDED 代表不再作為新工作的預設版本，但仍可被歷史 Review Result 引用；RETIRED 仍保留 Audit/Lineage。
  - index: 24
    style: Heading 1
    text: 6. Lifecycle / State Model
  - index: 27
    style: Normal
    text: 圖 1｜SG-02 Criteria Governance Workbench：版本名單為主，Dimension / Threshold / Required Checks 透過 Drawer 查看，Action Dock 僅保留合法 Configure / Approve。
  - index: 28
    style: Heading 1
    text: 7. Functional Workbench / Interaction Topology
  - index: 30
    style: Heading 1
    text: 8. Layout / Visual Geometry
  - index: 32
    style: Normal
    text: 後續 Word Geometry 基準｜本頁起所有表格固定儲存格內距；短欄位與表頭水平＋垂直置中；長文字左對齊但保留安全距；表格採固定欄寬避免 Render 時被自動壓縮。
  - index: 34
    style: Heading 1
    text: 9. Section Registry
  - index: 36
    style: Heading 1
    text: 10. Control Registry / 11 Current Controls
  - index: 38
    style: Heading 1
    text: 11. Configure Contract
  - index: 40
    style: List Bullet
    text: Configure 只修改 DRAFT/允許狀態的 governed resource；若選中 ACTIVE Criteria，UI 應導向「建立新版本／新草稿」的治理流程，而不是直接改 ACTIVE。
  - index: 41
    style: List Bullet
    text: Read-model 欄位由 projection 自動帶入，禁止要求使用者重新輸入 criteria_versions / dimensions / policies / mappings / approvals。
  - index: 42
    style: List Bullet
    text: config_patch_json 必須在提交前提供結構化 Diff 預覽：Before / After / Affected Entity / Impact Required。
  - index: 43
    style: Heading 1
    text: 12. Approve Contract
  - index: 45
    style: Normal
    text: 核准不是啟用捷徑｜Approval 必須驗證 State、Version、Permission、Impact 與 Audit。核准 Criteria Version 不代表可修改舊 ACTIVE；也不允許把歷史 Review Result 換綁到新版本。
  - index: 48
    style: Normal
    text: 圖 2｜SG-02 Approval / Impact：Configure 與 Approval 使用 Effectful Modal；Impact / Revalidation 與歷史版本可重現性必須在核准前被確認。
  - index: 49
    style: Heading 1
    text: 13. Core Functional Chains
  - index: 51
    style: Heading 1
    text: 14. Permission / Gate Model
  - index: 53
    style: List Bullet
    text: 授權模型是 Account Permission Assignment Only；角色名稱與部門身分不得直接構成 allow。
  - index: 54
    style: List Bullet
    text: Permission denied 與 Policy blocked 必須區分：前者依規則隱藏／拒絕，後者可顯示 Disabled Reason。
  - index: 55
    style: List Bullet
    text: 前端 Visible/Disabled 只是 UX；真正 Effectful 操作必須在 server 重新驗證 identity、account_permission、scope、condition、state、version、idempotency、audit。
  - index: 56
    style: Heading 1
    text: 15. Impact / Applicability / Revalidation
  - index: 58
    style: Heading 1
    text: 16. QA-01 Integration Boundary
  - index: 59
    style: List Bullet
    text: QA-01 的 Review Session / Scorecard 必須讀取 exact criteria_version_ref 與其 Dimension / Threshold / Required Check / Gate Policy；不得自行 hardcode 門檻。
  - index: 60
    style: List Bullet
    text: SG-02 不顯示待審專案名單，也不執行 Approve Output / Finding / Correction / Handoff 等 QA 工作動作。
  - index: 61
    style: List Bullet
    text: Criteria 版本升級不得自動替換進行中的 Review Session。是否重啟／revalidate 必須由 Impact + Runtime Contract 明確決定。
  - index: 62
    style: List Bullet
    text: 如果下游工作類型找不到可用 Criteria Mapping，QA Runtime 應 fail closed，顯示「未綁定 QA 標準」而非選一個最新版本。
  - index: 63
    style: Heading 1
    text: 17. Error / Recovery
  - index: 65
    style: Heading 1
    text: 18. Responsive / i18n / Accessibility
  - index: 67
    style: Heading 1
    text: 19. Validation / Acceptance
  - index: 69
    style: Heading 1
    text: 20. Definition of Done / Construction Handoff
  - index: 70
    style: List Bullet
    text: Static Design：Page / Section / Control / Field / Layout / State / Error / Permission / Action / Gate / Interaction / Visual Geometry 已可施工。
  - index: 71
    style: List Bullet
    text: Functional Closure：Configure / Approve / Criteria Consumption / Historical Reproducibility / Impact / Revalidation 均有前後關聯，不留下「先做畫面、後補邏輯」的空洞。
  - index: 72
    style: List Bullet
    text: Runtime Enablement：仍須由施工階段核對 Governance operation runtime、QA runtime mapping、DB persistence、permission assignment、audit、tests 與 deployment evidence；本 Word
      不宣稱 Production Ready。
  - index: 73
    style: List Bullet
    text: 任何實際施工發現未註冊功能（例如 Clone / Search / Export / Activate / Retire command），不得從本文件猜 API；必須回到 Current Authority 走正式補權威流程。
  - index: 74
    style: Normal
    text: 施工交付結論｜SG-02 的設計目標不是「做一張 QA 標準表」，而是把 Criteria 的版本治理、Impact、Approval、歷史可重現性與 QA Runtime 綁定做成完整閉環；UI 保持單頁、低頻細節 Drawer 化、效應操作 Modal 化。
  - index: 77
    style: Heading 1
    text: 2026-09-21 Machine Authority Construction Closure / 機器權威施工綁定封板
