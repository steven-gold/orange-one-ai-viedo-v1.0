name: One Shot Issue60 Stage Spec Closure
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - .github/workflows/one-shot-issue60-stage-spec-closure.yml
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]' && github.ref_name == 'rebuild-v2.1.1'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout governance candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Install locked verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Apply governance-only Stage specification remediation
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')" = "$BASE_HEAD"
          python governance/ci/issue60_stage_spec_closure_transaction.py
          python governance/source-successor/materialize_derived_source_package.py
          VAL_BLOB="$(git hash-object .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py)"
          VAL_BLOB="$VAL_BLOB" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('governance/specifications/REGISTRY.yaml')
          s=p.read_text(encoding='utf-8')
          key='".github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py"'
          pat=r'('+re.escape(key)+r':\s*)[0-9a-f]{40}'
          s2,n=re.subn(pat,lambda m:m.group(1)+os.environ['VAL_BLOB'],s)
          if n!=1:
              raise SystemExit('ISSUE60_REFERENCE_SEMANTICS_TOOLCHAIN_REBIND_COUNT='+str(n))
          p.write_text(s2,encoding='utf-8')
          PY
          python governance/source-successor/materialize_derived_source_package.py --check
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/test_stage_execution_engine.py
          python governance/ci/validate_successor_governance_preformal.py
          python governance/ci/validate_governance_candidate_promotion_readiness.py --self-test
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py
          git rm -f .github/workflows/one-shot-issue59-semantic-baseline-rebind.yml || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "NO_ISSUE60_CHANGES"; exit 1; }
          git commit -m "fix(governance): close Stage specification and exact-head validation gaps"
          test "$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')" = "$BASE_HEAD"
          git push origin HEAD:rebuild-v2.1.1
