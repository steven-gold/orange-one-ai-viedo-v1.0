name: QA01 Canonical State Fix Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-canonical-state-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Authority state UID correction and self-clean
        run: |
          set -euo pipefail
          FILE='src/server/testing/controlledQaTestRuntime.ts'
          BEFORE=$(grep -o 'QA-01-ST-CORRECTION-REQUIRED' "$FILE" | wc -l)
          test "$BEFORE" -eq 1
          python - <<'PY'
          from pathlib import Path
          p=Path('src/server/testing/controlledQaTestRuntime.ts')
          s=p.read_text()
          old='QA-01-ST-CORRECTION-REQUIRED'
          new='QA-01-ST-CORRECTION'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          assert old not in s
          assert s.count(new)>=1
          p.write_text(s)
          PY
          rm .github/workflows/qa01-canonical-state-fix-once.yml
          git diff --check
          git diff -- src/server/testing/controlledQaTestRuntime.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/testing/controlledQaTestRuntime.ts .github/workflows/qa01-canonical-state-fix-once.yml
          git commit -m 'fix(qa): align correction state with QA-01 authority'
          git push origin HEAD:qa01-functional-staging
