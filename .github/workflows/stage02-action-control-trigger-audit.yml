name: Stage02 Action Control Trigger Current Authority Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-control-trigger-current-authority-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage02-action-trigger-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Enforce Current Specification mutation authorization
        run: python governance/ci/specification_mutation_guard.py
      - name: Validate remediation closure protocol; this audit is diagnostic only
        run: python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Validate Stage-02 legal successor state
        run: python governance/ci/validate_stage02_state_integrity.py
      - name: Run fresh single-action control/trigger authority audit
        run: python governance/ci/run_current_stage2_action_control_trigger_audit.py
      - name: Prove ASSET Stage-01 source and Current Specification remained byte-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml \
            governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
      - name: Upload diagnostic action control trigger evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-action-control-trigger-current-authority-audit
          path: .github/stage02-action-trigger/ACTION_CONTROL_TRIGGER_CURRENT_AUTHORITY_AUDIT.json
          if-no-files-found: error
