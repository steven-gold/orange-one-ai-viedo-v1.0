  - otherwise classify UNRESOLVED_FUNCTIONAL_CONTRACT_GAP
  - do not reduce any Stage-02 blocker from classification alone
  - deterministic candidates must be materialized only at the owning Stage-02 layer and then proven by clean reset, Full-Line gate, and fresh reexecution
