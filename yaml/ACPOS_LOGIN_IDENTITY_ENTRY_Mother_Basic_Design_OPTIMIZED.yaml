      - Design Item / 設計項目
      - Canonical Planning Design Contract / 正式規劃設計契約
    - row: 1
      cells:
      - Upstream Design Dependency
      - ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx owns Account / Identity / Permission design truth referenced by Login.
    - row: 2
      cells:
      - Downstream Design Dependency
      - ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx owns the authenticated Home/Shell/Navigation entry after successful identity admission.
    - row: 3
      cells:
      - Shared-owner Boundary
      - Login does not duplicate IAM permission models or Home navigation registry. It only owns the identity-entry surface and its local states.
    - row: 4
      cells:
      - Success Handoff
      - Successful identity admission hands the authenticated context to the current Home/Shell entry defined by Global Navigation.
    - row: 5
      cells:
      - Failure / Resume
      - Authentication/identity failure remains on the Login surface with explicit error/recovery state; no unauthorized downstream navigation.
    - row: 6
      cells:
      - Dependency Change Impact
      - IAM identity/permission contract or Home entry/navigation changes require Login design reference revalidation before design freeze.
