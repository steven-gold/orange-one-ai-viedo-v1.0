name: IAM-01 projection classification patch

on:
  push:
    branches:
      - acpos-iam01-closure-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-iam01-closure-20260903
      - name: Guard
        id: guard
        run: |
          msg=$(git log -1 --format=%s)
          if [ "$msg" = "chore(iam): add one-time projection classification patch" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - name: Patch IAM projection classification
        if: steps.guard.outputs.run == 'yes'
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/domain/iam/iamClientPort.ts')
          s=p.read_text()
          if 'isControlledTestMode' not in s:
            s='import{isControlledTestMode}from"@/domain/testing/controlledTestData";\n'+s
          old='export type IamNormalizedProjection={page_state:IamPageState|null;values:Readonly<Record<string,string>>;gate_state:Readonly<Record<string,boolean>>;authorized_account_count:number|null;accounts:readonly IamAccountProjection[];identity_schema:readonly IamIdentitySchemaField[];department_presets:readonly IamDepartmentPreset[];preview:IamImpactPreview|null;audit_entries:readonly string[];};'
          new='export type IamProjectionTestMetadata={data_classification:"TEST_ONLY";synthetic:true;test_dataset_id:string;test_run_id:string;created_for_validation:true;production_eligible:false};\nexport type IamNormalizedProjection={page_state:IamPageState|null;values:Readonly<Record<string,string>>;gate_state:Readonly<Record<string,boolean>>;authorized_account_count:number|null;accounts:readonly IamAccountProjection[];identity_schema:readonly IamIdentitySchemaField[];department_presets:readonly IamDepartmentPreset[];preview:IamImpactPreview|null;audit_entries:readonly string[];test_metadata?:IamProjectionTestMetadata;};'
          assert old in s
          s=s.replace(old,new,1)
          old='try{const projection=await resolver.resolve(raw);if(!projectionStateIsValid(projection))return{ok:false as const,error_uid:"IAM-01-ERR-UNDEFINED",reason_code:"IAM_PROJECTION_ADAPTER_REJECTED",correlation_id};return{ok:true as const,projection,correlation_id};}'
          new='try{const projection=await resolver.resolve(raw);if(!projectionStateIsValid(projection))return{ok:false as const,error_uid:"IAM-01-ERR-UNDEFINED",reason_code:"IAM_PROJECTION_ADAPTER_REJECTED",correlation_id};if(projection.test_metadata!==undefined&&(!isControlledTestMode()||projection.test_metadata.data_classification!=="TEST_ONLY"||projection.test_metadata.synthetic!==true||projection.test_metadata.created_for_validation!==true||projection.test_metadata.production_eligible!==false))return{ok:false as const,error_uid:"IAM-01-ERR-UNDEFINED",reason_code:"IAM_TEST_PROJECTION_FORBIDDEN_IN_PRODUCTION",correlation_id};return{ok:true as const,projection,correlation_id};}'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/domain/iam/controlledIamClientTestRuntime.ts')
          s=p.read_text()
          old='return{page_state:r.page_state,values:strmap(r.values),gate_state:bools(r.gate_state),authorized_account_count:typeof r.authorized_account_count==="number"?r.authorized_account_count:null,accounts:Array.isArray(r.accounts)?r.accounts.flatMap(x=>{const a=account(x);return a?[a]:[]}):[],identity_schema:Array.isArray(r.identity_schema)?r.identity_schema.flatMap(x=>{const f=field(x);return f?[f]:[]}):[],department_presets:Array.isArray(r.department_presets)?r.department_presets.flatMap(x=>{const p=preset(x);return p?[p]:[]}):[],preview:preview(r.preview),audit_entries:strings(r.audit_entries)};'
          new='return{page_state:r.page_state,values:strmap(r.values),gate_state:bools(r.gate_state),authorized_account_count:typeof r.authorized_account_count==="number"?r.authorized_account_count:null,accounts:Array.isArray(r.accounts)?r.accounts.flatMap(x=>{const a=account(x);return a?[a]:[]}):[],identity_schema:Array.isArray(r.identity_schema)?r.identity_schema.flatMap(x=>{const f=field(x);return f?[f]:[]}):[],department_presets:Array.isArray(r.department_presets)?r.department_presets.flatMap(x=>{const p=preset(x);return p?[p]:[]}):[],preview:preview(r.preview),audit_entries:strings(r.audit_entries),test_metadata:TEST_METADATA};'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/components/pages/IamVisual.tsx')
          s=p.read_text()
          needle='data-formal-runtime-status={effectfulRuntimeReady ? "BOUND" : "NOT_EXECUTED"}'
          assert needle in s
          s=s.replace(needle,needle+'\n      data-data-classification={projection?.test_metadata?.data_classification}\n      data-production-eligible={projection?.test_metadata ? String(projection.test_metadata.production_eligible) : undefined}',1)
          p.write_text(s)
      - name: Commit patch
        if: steps.guard.outputs.run == 'yes'
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add src/domain/iam/iamClientPort.ts src/domain/iam/controlledIamClientTestRuntime.ts src/components/pages/IamVisual.tsx
          git commit -m "fix(iam): preserve controlled projection classification"
          git push origin HEAD:acpos-iam01-closure-20260903
