name: DOCX Render QA

on:
  push:
    branches:
      - 0921acpos
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install render tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          python -m pip install --quiet pillow
      - name: Render and inspect all pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pdf qa/png qa/contact qa/report
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, os, math
          from PIL import Image, ImageChops, ImageStat, ImageDraw, ImageFont

          root=Path('.')
          out=Path('qa')
          docs=sorted(root.glob('0[1-9]_ACPOS_*.docx'))
          assert len(docs)==9
          report={'docs':{},'total_pages':0,'edge_touch_pages':[],'blank_pages':[]}
          for doc in docs:
              subprocess.run(['libreoffice','--headless','--convert-to','pdf','--outdir',str(out/'pdf'),str(doc)],check=True)
              pdf=out/'pdf'/(doc.stem+'.pdf')
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace')
              pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              pdir=out/'png'/doc.stem
              pdir.mkdir(parents=True,exist_ok=True)
              subprocess.run(['pdftoppm','-png','-r','96',str(pdf),str(pdir/'page')],check=True)
              imgs=sorted(pdir.glob('page-*.png'))
              assert len(imgs)==pages,(doc.name,pages,len(imgs))
              edge=[];blank=[]
              thumbs=[]
              for idx,p in enumerate(imgs,1):
                  im=Image.open(p).convert('RGB')
                  bg=Image.new('RGB',im.size,'white')
                  diff=ImageChops.difference(im,bg)
                  bbox=diff.getbbox()
                  if bbox is None:
                      blank.append(idx)
                  else:
                      l,t,r,b=bbox
                      # Touching within 3 px of PDF page edge indicates possible clipping.
                      if l<=3 or t<=3 or r>=im.width-3 or b>=im.height-3:
                          edge.append(idx)
                  th=im.copy()
                  th.thumbnail((360,510))
                  canvas=Image.new('RGB',(380,550),'white')
                  canvas.paste(th,((380-th.width)//2,20))
                  dr=ImageDraw.Draw(canvas)
                  dr.text((10,525),f'{idx}/{pages}',fill='black')
                  thumbs.append(canvas)
              report['docs'][doc.name]={'pages':pages,'blank_pages':blank,'edge_touch_pages':edge,'pdf_bytes':pdf.stat().st_size}
              report['total_pages']+=pages
              report['blank_pages'] += [[doc.name,x] for x in blank]
              report['edge_touch_pages'] += [[doc.name,x] for x in edge]
              per=12
              for si in range(0,len(thumbs),per):
                  batch=thumbs[si:si+per]
                  cols=3;rows=math.ceil(len(batch)/cols)
                  sheet=Image.new('RGB',(cols*380,rows*550),'white')
                  for j,th in enumerate(batch):
                      sheet.paste(th,((j%cols)*380,(j//cols)*550))
                  sheet.save(out/'contact'/f'{doc.stem}_sheet_{si//per+1:03d}.jpg',quality=88)
          (out/'report'/'render_qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          # Blank pages are a hard failure. Edge touch is recorded for visual inspection, not auto-fail.
          assert not report['blank_pages'], report['blank_pages']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-0921-docx-render-qa
          path: |
            qa/pdf
            qa/contact
            qa/report
          retention-days: 3
