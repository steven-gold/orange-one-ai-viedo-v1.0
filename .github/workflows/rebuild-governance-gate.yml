    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Exhaustive Stage-02 functional-chain preflight
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_stage2_functional_chain_preflight.py
      - name: Upload machine-readable Stage-02 preflight result
        uses: actions/upload-artifact@v4
        with:
          name: stage2-functional-preflight-result
          path: stage2_functional_preflight_result.json
          if-no-files-found: error
