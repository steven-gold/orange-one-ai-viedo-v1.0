name: VIS-05 EDIT-01 Validation

on:
  push:
    branches: [acpos-vis05-staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/vis05-next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/edit >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vis05-next.log
          exit 1

      - name: Validate authority registry and browser geometry
        run: |
          mkdir -p docs/construction/evidence/VIS-05
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const source = fs.readFileSync('src/components/pages/EditVisual.tsx', 'utf8');
          const catalog = fs.readFileSync('src/i18n/editCatalog.ts', 'utf8');
          const shell = fs.readFileSync('src/components/shell/AppShell.tsx', 'utf8');
          const css = fs.readFileSync('src/components/pages/EditVisual.module.css', 'utf8');
          const ids = text => [...new Set([...text.matchAll(/EDIT-01-(?:CTL|FLD|BTN|LBL|LST|PNL|TOOL|TAB)-[A-Z0-9-]+/g)].map(m => m[0]))];
          const sourceIds = ids(source);
          const catalogIds = [...new Set([...catalog.matchAll(/"(EDIT-01-(?:CTL|FLD|BTN|LBL|LST|PNL|TOOL|TAB)-[A-Z0-9-]+)"\s*:/g)].map(m => m[1]))];
          const rawColors = [...css.matchAll(/#[0-9a-fA-F]{3,8}|rgba?\(/g)].map(m => m[0]);
          if (sourceIds.length !== 160) throw new Error(`source controls=${sourceIds.length}`);
          if (catalogIds.length !== 160) throw new Error(`catalog controls=${catalogIds.length}`);
          if (!sourceIds.every(id => catalogIds.includes(id))) throw new Error('registry/catalog mismatch');
          if (!shell.includes('{ id: "NAV-05", labelKey: "global.nav.edit_voice", icon: "edit", href: "/edit" }')) throw new Error('NAV-05 route missing');
          if (rawColors.length) throw new Error(`page-local colors=${rawColors.join(',')}`);
          if (/\bfetch\s*\(|XMLHttpRequest|\baxios\b/.test(source)) throw new Error('business network code detected');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1440,height:900}});
            const page = await context.newPage();
            let businessRequests = 0;
            page.on('request', r => { if (['xhr','fetch'].includes(r.resourceType())) businessRequests++; });
            const response = await page.goto('http://127.0.0.1:3000/edit',{waitUntil:'networkidle'});
            if (!response || response.status() !== 200) throw new Error(`HTTP=${response && response.status()}`);

            const top = await page.evaluate(() => {
              const root = document.querySelector('[data-page-uid="EDIT-01"]');
              const workspace = document.querySelector('.workspace-slot');
              const viewer = document.querySelector('[data-component-uid="EDIT-01-CMP-PREVIEW"]');
              const timeline = document.querySelector('[data-visual-uid="EDIT-01-VIS-TIMELINE"]');
              const primary = document.querySelector('[data-page-uid="EDIT-01"] > div:nth-of-type(1)');
              const adjustment = document.querySelector('[data-page-uid="EDIT-01"] > div:nth-of-type(2)');
              const bottom = document.querySelector('[data-page-uid="EDIT-01"] > div:nth-of-type(3)');
              const unique = (selector, attr) => new Set([...document.querySelectorAll(selector)].map(el => el.getAttribute(attr))).size;
              const widths = el => [...el.children].map(c => c.getBoundingClientRect().width);
              return {
                registryValid: root.getAttribute('data-registry-valid'),
                authorityControls: root.getAttribute('data-authority-controls'),
                pageWidth: root.getBoundingClientRect().width,
                workspaceX: workspace.getBoundingClientRect().x,
                viewer: viewer.getBoundingClientRect().toJSON(),
                timelineHeight: timeline.getBoundingClientRect().height,
                primaryWidths: widths(primary),
                adjustmentWidths: widths(adjustment),
                bottomWidths: widths(bottom),
                sections: unique('[data-page-uid="EDIT-01"] [data-section-id]','data-section-id'),
                components: unique('[data-page-uid="EDIT-01"] [data-component-uid]','data-component-uid'),
                controls: unique('[data-page-uid="EDIT-01"] [data-control-id]','data-control-id'),
                activeNav: document.querySelector('[data-nav-id="NAV-05"][aria-current="page"]')?.getAttribute('href'),
                enabled: [...document.querySelectorAll('[data-page-uid="EDIT-01"] button,[data-page-uid="EDIT-01"] input,[data-page-uid="EDIT-01"] select,[data-page-uid="EDIT-01"] textarea')].filter(el => !el.disabled).length,
                correctionVisible: !!document.querySelector('[data-control-id="EDIT-01-FLD-API-INSTRUCTION"]')?.getClientRects().length,
                standaloneUploadVisible: !!document.querySelector('[data-control-id="EDIT-01-BTN-ADD-MEDIA"]')?.getClientRects().length,
              };
            });

            const ratio = top.viewer.width/top.viewer.height;
            if (top.registryValid !== 'true' || top.authorityControls !== '160') throw new Error('registry self-check failed');
            if (top.sections !== 16) throw new Error(`sections=${top.sections}`);
            if (top.components !== 24) throw new Error(`components=${top.components}`);
            if (top.controls !== 160) throw new Error(`controls=${top.controls}`);
            if (top.activeNav !== '/edit') throw new Error(`activeNav=${top.activeNav}`);
            if (top.enabled !== 0) throw new Error(`enabled business controls=${top.enabled}`);
            if (top.correctionVisible) throw new Error('project first-production correction prompt visible');
            if (top.standaloneUploadVisible) throw new Error('standalone upload visible in default state');
            if (Math.abs(ratio-16/9) > .02) throw new Error(`preview ratio=${ratio}`);
            if (top.timelineHeight < 320) throw new Error(`timeline height=${top.timelineHeight}`);
            if (top.pageWidth < 1280) throw new Error(`page width=${top.pageWidth}`);
            if (top.workspaceX !== 78) throw new Error(`workspace x=${top.workspaceX}`);
            if (top.primaryWidths.length !== 2 || top.primaryWidths[0] < 240) throw new Error(`primary=${JSON.stringify(top.primaryWidths)}`);
            if (top.adjustmentWidths.length !== 2) throw new Error(`adjustment=${JSON.stringify(top.adjustmentWidths)}`);
            if (top.bottomWidths.length !== 3) throw new Error(`bottom=${JSON.stringify(top.bottomWidths)}`);

            await page.locator('.global-sidebar').hover();
            await page.waitForTimeout(250);
            const expanded = await page.evaluate(() => ({
              sidebarWidth: document.querySelector('.global-sidebar').getBoundingClientRect().width,
              workspaceX: document.querySelector('.workspace-slot').getBoundingClientRect().x
            }));
            if (expanded.sidebarWidth !== 221 || expanded.workspaceX !== 78) throw new Error(`sidebar=${JSON.stringify(expanded)}`);
            await page.screenshot({path:'docs/construction/evidence/VIS-05/vis05-1440-expanded.png'});
            await page.mouse.move(800,400); await page.waitForTimeout(250);
            await page.screenshot({path:'docs/construction/evidence/VIS-05/vis05-1440-top.png'});

            const workspace = page.locator('.workspace-slot');
            await workspace.evaluate(el => el.scrollTop = Math.round((el.scrollHeight-el.clientHeight)/2));
            await page.waitForTimeout(100);
            await page.screenshot({path:'docs/construction/evidence/VIS-05/vis05-1440-middle.png'});
            await workspace.evaluate(el => el.scrollTop = el.scrollHeight); await page.waitForTimeout(100);
            await page.screenshot({path:'docs/construction/evidence/VIS-05/vis05-1440-bottom.png'});
            await workspace.evaluate(el => {el.scrollTop=0;el.scrollLeft=0;});

            const lang = page.locator('button[aria-haspopup="listbox"]');
            await lang.click(); await page.getByRole('option',{name:/English/}).click();
            if (!(await page.getByText('Asset Binding',{exact:true}).count())) throw new Error('en locale failed');
            await lang.click(); await page.getByRole('option',{name:/简体中文/}).click();
            if (!(await page.getByText('素材绑定',{exact:true}).count())) throw new Error('zh-CN locale failed');
            await lang.click(); await page.getByRole('option',{name:/繁體中文/}).click();
            if (!(await page.getByText('素材綁定',{exact:true}).count())) throw new Error('zh-TW locale failed');

            await page.setViewportSize({width:1200,height:900}); await page.waitForTimeout(100);
            const narrow = await page.evaluate(() => ({
              pageWidth: document.querySelector('[data-page-uid="EDIT-01"]').getBoundingClientRect().width,
              client: document.querySelector('.workspace-slot').clientWidth,
              scroll: document.querySelector('.workspace-slot').scrollWidth
            }));
            if (narrow.pageWidth < 1280 || narrow.scroll <= narrow.client) throw new Error(`min-width=${JSON.stringify(narrow)}`);
            await page.screenshot({path:'docs/construction/evidence/VIS-05/vis05-1200-minwidth.png'});
            if (businessRequests !== 0) throw new Error(`business fetch/xhr=${businessRequests}`);

            const validation = {
              source_sha: process.env.GITHUB_SHA,
              route:'/edit', http_status:200,
              registry_controls:160, unique_sections:top.sections, unique_components:top.components, unique_controls:top.controls,
              preview_ratio:ratio, timeline_height:top.timelineHeight, page_width_1440:top.pageWidth,
              primary_column_widths:top.primaryWidths, adjustment_column_widths:top.adjustmentWidths, bottom_column_widths:top.bottomWidths,
              workspace_origin_x:top.workspaceX, sidebar_expanded_width:expanded.sidebarWidth, workspace_reflow_on_expand:false,
              enabled_business_controls:top.enabled, business_fetch_xhr:businessRequests,
              project_first_production_prompt_visible:false, standalone_upload_visible_by_default:false,
              page_local_raw_colors:rawColors.length, supported_locales:['zh-TW','zh-CN','en'], authority_files_modified:false,
              typecheck:'PASS', next_build:'PASS', production_server:'PASS', chromium_geometry:'PASS'
            };
            fs.writeFileSync('docs/construction/evidence/VIS-05/vis05-validation.json',JSON.stringify(validation,null,2)+'\n');
            console.log(JSON.stringify(validation,null,2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Persist validated VIS-05 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/construction/evidence/VIS-05
          git commit -m "test(vis05): persist EDIT-01 render evidence [skip ci]"
          git push origin HEAD:acpos-vis05-staging

      - name: Upload VIS-05 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis05-edit01-evidence
          path: |
            docs/construction/evidence/VIS-05
            /tmp/vis05-next.log
          if-no-files-found: warn
