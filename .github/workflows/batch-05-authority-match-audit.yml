name: ACPOS Batch 05 Authority Match Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-05-authority-graph-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_05_authority_match_audit.py
      - name: Run exact UID authority audit
        run: python __temp/batch_05_authority_match_audit.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-05-authority-match-audit
          path: __batch05_authority_graph_audit.json
          retention-days: 1
