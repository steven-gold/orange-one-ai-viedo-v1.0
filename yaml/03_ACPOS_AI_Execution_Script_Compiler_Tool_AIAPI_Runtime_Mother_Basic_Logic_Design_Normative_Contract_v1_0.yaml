    text: ONE ProviderGateway：secret 只在 gateway runtime 注入；Domain / UI / log 不取得 raw secret。
  - index: 32
    style: List Bullet
    text: ONE Execution Job/Attempt lineage：Job、Attempt、Callback、Artifact、Cost、Error 共享生命週期。
  - index: 33
    style: List Bullet
    text: Tool Runtime 與 Provider Runtime 共用 execution safety primitives，但 tool schema / permission owner 必須精確綁定。
