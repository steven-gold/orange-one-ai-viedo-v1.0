artifact_type: V232_REALIGNMENT_EXECUTION_STEPS
mode: STEPWISE_ONE_OPERATION_PER_INVOCATION
bulk_stage_materialization: FORBIDDEN
preconditions:
- CURRENT_GOVERNED_UNIT_FOUNDATION_FROZEN
- PREDECESSOR_STAGE_CLOSED
- ISSUE_59_REENTRY_AUTHORIZATION
steps:
- step_uid: RA-STEP-01
  action: RESIGN_MATRIX_IDENTITY
  targets:
  - STAGE_EXECUTION/STAGE-01/WU-*GLOBAL-HOME-SHELL-NAVIGATION*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-01/WU-*WB01-DASHBOARD*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-02/WU-*GLOBAL-HOME-SHELL-NAVIGATION*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-02/WU-*WB01-DASHBOARD*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-03/WU-*GLOBAL-HOME-SHELL-NAVIGATION*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-03/WU-*WB01-DASHBOARD*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-04/WU-*GLOBAL-HOME-SHELL-NAVIGATION*/NORMATIVE_EXECUTION_MATRIX.yaml
  - STAGE_EXECUTION/STAGE-04/WU-*WB01-DASHBOARD*/NORMATIVE_EXECUTION_MATRIX.yaml
  content:
    governance_uid: GOV-REV-20260927-GOVERNANCE-IDENTITY-NEGATIVE-TRACE-AUDITOR-INDEPENDENCE-HARDENING
    status: PASS
  validator: NORMATIVE_EXECUTION_MATRIX_IDENTITY_DRIFT
- step_uid: RA-STEP-02
  action: REPRESENT_S083A
  targets:
  - STAGE_EXECUTION/STAGE-02|03|04/WU-*/NORMATIVE_EXECUTION_MATRIX.yaml
  content_ref: STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/s083a_matrix_rows.yaml
  validator: NORMATIVE_EXECUTION_MATRIX_SECTION_COVERAGE_MISSING
- step_uid: RA-STEP-03
  action: MATERIALIZE_DOMAIN_STEPWISE_CHECKPOINTS
  stage_uid: STAGE-04
  content_schema_ref: STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/s083a_matrix_rows.yaml#stepwise_checkpoint_schema
  produced_artifact_type: BASIC_DESIGN_DOMAIN_STEPWISE_CHECKPOINT
  owner_operation: BASIC_DESIGN_PACKAGE_COMPILE
  validator: BASIC_DESIGN_STEPWISE_DOMAIN_COMPLETE
- step_uid: RA-STEP-04
  action: RENAME_PAGE_IDENTITIES
  content_ref: STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/output_rename_map.yaml
  stages:
  - STAGE-01
  - STAGE-02
  validator: NORMATIVE_EXECUTION_MATRIX_ARTIFACT_COVERAGE_MISSING
- step_uid: RA-STEP-05
  action: COMPLETE_OPERATION_BINDINGS
  content_ref: STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT/operation_binding_realignment.yaml
  adds:
  - applicability
  - executor_protocol
  - operation_receipt_ref
  validator: ACTIVE_WORK_UNIT_OPERATION_BINDING_INVALID
- step_uid: RA-STEP-06
  action: PROVIDE_DEDICATED_OPERATION_EXECUTORS
  stages:
  - STAGE-01
  - STAGE-02
  - STAGE-03
  protocol: PYTHON_STAGE_OPERATION_V1
  validator: COMMON_ENGINE_RECURSIVE_EXECUTOR_FORBIDDEN
- step_uid: RA-STEP-07
  action: REVALIDATE_AND_RECLOSE
  commands:
  - python3 governance/ci/stage_execution_engine.py --admission-check --stage STAGE-04
  - python3 governance/ci/stage_execution_engine.py --validate-evidence --stage STAGE-04 --evidence <evidence>
  validator: definition_audit_and_stage_validation
