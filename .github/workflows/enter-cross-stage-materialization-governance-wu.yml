name: Enter Cross-Stage Governance Hardening

"on":
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/governance-maintenance/enter_cross_stage_materialization_governance_wu.py
      - .github/workflows/enter-cross-stage-materialization-governance-wu.yml

permissions:
  contents: write

jobs:
  enter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Enter authorized governance maintenance work unit
        run: python .github/governance-maintenance/enter_cross_stage_materialization_governance_wu.py
      - name: Validate non-normative state transition
        run: |
          python governance/ci/governance_resolver.py
          python governance/ci/validate_structured_mutation_safety.py
      - name: Persist governance maintenance state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/test/ACTIVE_STATE.yaml
          git commit -m "chore(governance): enter cross-stage materialization hardening WU"
          git push origin "HEAD:${GITHUB_REF_NAME}"
