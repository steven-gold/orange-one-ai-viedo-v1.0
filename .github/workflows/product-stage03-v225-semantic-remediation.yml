name: Product Stage03 v2.2.25 Semantic Remediation
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/product-stage03-v225-semantic-remediation.yml'
permissions:
  contents: write
concurrency:
  group: stage03-v225-semantic-remediation-current-v2
  cancel-in-progress: true
jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 0921acpos
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: steven-gold/orange-one-ai-viedo-v1.0
        ref: 335d8a01d6d3eb6f0ed951ffc40216029b19d4e3
        path: _governance_authority
        fetch-depth: 1
    - name: Load Current Governance v2.2.25
      run: |
        rm -rf governance .github/governance-source
        cp -R _governance_authority/governance ./governance
        mkdir -p .github
        cp -R _governance_authority/.github/governance-source .github/governance-source
        python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
    - name: Materialize complete Stage03 semantic contracts
      run: |
        python - <<'PY'
        from pathlib import Path
        import yaml, hashlib, copy

        GOV_UID='GOV-REV-20260925-NORMATIVE-EXECUTION-MATRIX'
        GOV_HEAD='335d8a01d6d3eb6f0ed951ffc40216029b19d4e3'
        GOV_VER='v2.2.25'
        STAGE='STAGE-03'
        EXIT='CURRENT_GOVERNED_UNIT_STAGE3_CLOSED'

        def load(p):
            p=Path(p)
            d=yaml.safe_load(p.read_text()) or {}
            if not isinstance(d,dict): raise SystemExit(f'BLOCK:NOT_MAPPING:{p}')
            return d
        def dump(p,d):
            Path(p).write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=220))
        def sha(p):
            return hashlib.sha256(Path(p).read_bytes()).hexdigest()
        def present(v):
            return v is not None and v != '' and v != []
        def field_get(obj,path):
            cur=obj
            for k in path:
                if isinstance(k,int):
                    if not isinstance(cur,list) or k>=len(cur): raise KeyError(path)
                    cur=cur[k]
                else:
                    if not isinstance(cur,dict) or k not in cur: raise KeyError(path)
                    cur=cur[k]
            return cur
        def artifact_type(p):
            return load(p).get('artifact_type')

        reg=load('.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_LIFECYCLE_STAGE_REGISTRY.yaml')
        s3=[x for x in reg.get('stages',[]) if x.get('stage_uid')=='STAGE-03' and x.get('name')=='VISUAL_DESIGN']
        s4=[x for x in reg.get('stages',[]) if x.get('stage_uid')=='STAGE-04' and x.get('name')=='FOUNDATION_FREEZE']
        if len(s3)!=1 or len(s4)!=1: raise SystemExit('BLOCK:LIFECYCLE_RESOLUTION')
        s3,s4=s3[0],s4[0]
        required_sections=s3['required_normative_section_uids']

        unit_cfg={
          'HOME':{
            'wu':'WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-001',
            'unit':'GLOBAL-HOME-SHELL-NAVIGATION',
            'candidate':'VIS-CANDIDATE-HOME-001',
            'workbench':'GHS-SHELL-WORKBENCH',
            'journey':'AUTHORIZED_NAVIGATION_TO_WORKSPACE',
            'entity_uids':['NAVIGATION_SURFACE','NAVIGATION_ITEM','ACCOUNT_PERMISSION_ASSIGNMENT','LANGUAGE_SELECTION','QUICK_STATUS_PROJECTION','WORKSPACE_MOUNT'],
            'ops':['OPEN_CANONICAL_TARGET','RESOLVE_NAVIGATION_VISIBILITY','APPLY_LANGUAGE_SELECTION','READ_STATUS_PROJECTION','SYNCHRONIZE_WORKSPACE_LAYOUT'],
            'controls':['NAVIGATION_ITEM','LANGUAGE_SELECTION','QUICK_STATUS','SURFACE_SWITCH','ACCOUNT_CLUSTER'],
            'locked':['GLOBAL_HEADER','GLOBAL_SIDEBAR','WORKSPACE_MOUNT_GEOMETRY'],
            'editable':['PRESENTATION_MICRO_DETAIL_INSIDE_CURRENT_TOKENS_ONLY'],
          },
          'WB':{
            'wu':'WU-STAGE03-WB01-DASHBOARD-001',
            'unit':'workspace:WB-01',
            'candidate':'VIS-CANDIDATE-WB01-002',
            'workbench':'WB01-DASHBOARD-MAIN',
            'journey':'PAGE_READ_TO_14_SECTION_SUMMARY_TO_OPTIONAL_DRAWER',
            'entity_uids':['COMPANY_DASHBOARD_PROJECTION'],
            'ops':['getDashboardReadModel','SECTION_OPEN'],
            'controls':[],
            'locked':['GLOBAL_HEADER','GLOBAL_SIDEBAR','GLOBAL_WORKSPACE_MOUNT_GEOMETRY','CANONICAL_SECTION_ORDER'],
            'editable':['PRESENTATION_MICRO_DETAIL_INSIDE_CURRENT_TOKENS_ONLY'],
          }
        }

        # Exact WB controls come from current Stage03 binding, not reconstructed aliases.
        wb_bind=load('STAGE_EXECUTION/STAGE-03/WU-STAGE03-WB01-DASHBOARD-001/VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml')
        unit_cfg['WB']['controls']=[r['control_uid'] for r in wb_bind.get('bindings',[]) if r.get('control_uid')]
        if len(unit_cfg['WB']['controls'])!=14: raise SystemExit('BLOCK:WB_CONTROL_DENOMINATOR_NOT_14')

        for key,cfg in unit_cfg.items():
            b=Path('STAGE_EXECUTION/STAGE-03')/cfg['wu']
            geom=load(b/'VISUAL_GEOMETRY_CONTRACT.yaml')
            vds=load(b/'VISUAL_DESIGN_SPEC_PACKAGE.yaml')
            vim=load(b/'VISUAL_INHERITANCE_MATRIX.yaml')
            vpe=load(b/'VISUAL_PREVIEW_EVIDENCE.yaml')
            vcs=load(b/'VISUAL_CHANGESET.yaml')
            vitb=load(b/'VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml')
            fwlc=load(b/'FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT.yaml')
            vses=load(b/'VISUAL_SCENARIO_EVIDENCE_SET.yaml')
            # ---- Complete Stage03 VDSP bindings with Mother applicability ----
            vds['design_version']='STAGE03-V2.2.25-REVERIFY'
            vds.pop('visual_style_definition_ref',None)
            vds['visual_style_definition_applicability']='NOT_APPLICABLE_EXISTING_CURRENT_VISUAL_AUTHORITY'
            vds['visual_inheritance_matrix_ref']=str(b/'VISUAL_INHERITANCE_MATRIX.yaml')
            vds['visual_reference_annotation_ref']=str(b/'VISUAL_REFERENCE_ANNOTATION.yaml')
            vds['visual_scenario_evidence_set_ref']=str(b/'VISUAL_SCENARIO_EVIDENCE_SET.yaml')
            vds['visual_geometry_contract_ref']=str(b/'VISUAL_GEOMETRY_CONTRACT.yaml')
            vds['visual_change_set_ref']=str(b/'VISUAL_CHANGESET.yaml')
            vds.pop('generation_manifest_ref',None)
            vds.pop('generation_manifest_source_section',None)
            vds['generation_manifest_applicability']='NOT_STAGE03_REQUIRED_OUTPUT_CURRENT_LIFECYCLE'
            vds['transitive_binding_status']='CURRENT_PHYSICAL_OWNER_BOUND'
            dump(b/'VISUAL_DESIGN_SPEC_PACKAGE.yaml',vds)

            vra=load(b/'VISUAL_REFERENCE_ANNOTATION.yaml')

            # ---- S079: complete per-scenario candidate annotation ----
            anchor_uids=list(vpe.get('visual_anchor_uids') or [])
            if not anchor_uids: raise SystemExit(f'BLOCK:NO_VISUAL_ANCHORS:{cfg["wu"]}')
            source_refs=[
              str(b/'VISUAL_GEOMETRY_CONTRACT.yaml'),
              str(b/'VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml'),
              str(b/'FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT.yaml'),
              'STAGE_EXECUTION/SHARED_AUTHORITY/GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY.yaml',
            ]
            cand_ann=[]
            for sc in vses.get('scenarios',[]):
                suid=sc['scenario_uid']
                state=sc.get('sidebar_state') or sc.get('shell_state') or sc.get('class')
                viewport=sc.get('viewport_px')
                if viewport is None:
                    if 'GE1440' in suid or '1440' in suid: viewport='>=1440'
                    elif '1280' in suid and 'LT1280' not in suid: viewport='1280-1439'
                    elif 'LT1280' in suid: viewport='<1280'
                    else: viewport='INHERITED_FROM_CANDIDATE'
                if key=='HOME':
                    controls=cfg['controls']
                    visible_sections=['HEADER_TOPBAR','ADAPTIVE_NAVIGATION','WORKSPACE_MOUNT']
                    conditional=['FRONT_NAVIGATION_SURFACE','ADMIN_NAVIGATION_SURFACE','QUICK_STATUS','ACCOUNT_CLUSTER']
                    next_action='OPEN_CANONICAL_TARGET'
                    next_gate='ACCOUNT_PERMISSION_ASSIGNMENT'
                    parent=None
                else:
                    controls=cfg['controls']
                    visible_sections=[r.get('section_uid') for r in geom.get('section_geometry_rows',[]) if r.get('section_uid')]
                    conditional=['DETAIL_DRAWER'] if sc.get('class')=='SECTION_OPEN' else []
                    next_action='SECTION_OPEN' if sc.get('class') not in ('STATE_FEEDBACK',) else 'SAME_CONTROL_REINVOCATION'
                    next_gate='PAGE_READ'
                    parent='VIS-CANDIDATE-HOME-001'
                cand_ann.append({
                  'visual_uid':cfg['candidate'],
                  'page_or_scope_uid':cfg['unit'],
                  'scenario_uid':suid,
                  'state_uid':str(state),
                  'workbench_uid':cfg['workbench'],
                  'journey_uid':cfg['journey'],
                  'parent_visual_uid':parent or 'NOT_APPLICABLE_ROOT_VISUAL',
                  'design_version':'STAGE03-V2.2.25-REVERIFY',
                  'basic_design_change_set_uid':vcs.get('artifact_uid'),
                  'viewport':viewport,
                  'language':['zh-TW','zh-CN','en'],
                  'theme':'DARK_TECH_PURPLE',
                  'business_entity_uids':cfg['entity_uids'],
                  'operation_uids':cfg['ops'],
                  'applicable_business_entity_or_operation':cfg['entity_uids']+cfg['ops'],
                  'visible_sections':visible_sections,
                  'conditional_sections':conditional or ['NOT_APPLICABLE_NO_CONDITIONAL_SECTION'],
                  'locked_regions':cfg['locked'],
                  'editable_regions':cfg['editable'],
                  'visual_anchor_uids':anchor_uids,
                  'primary_controls_or_system_triggers':controls,
                  'primary_controls':controls,
                  'disabled_or_blocked_controls':[{'control_uid':'NOT_APPLICABLE','applicability':'NOT_APPLICABLE_WITH_AUTHORITY','reason_source':'CURRENT_PERMISSION_OR_STATE_AUTHORITY'}],
                  'disabled_reason_source':'CURRENT_PERMISSION_OR_STATE_AUTHORITY',
                  'current_next_action':next_action,
                  'current_next_gate':next_gate,
                  'current_next_action_or_gate':{'action_uid':next_action,'gate_uid':next_gate},
                  'source_authority_refs':source_refs,
                  'authority_classification':'CURRENT_SOURCE_GROUNDED_VISUAL_PROJECTION',
                  'inherited_visual_authority_refs':[
                    'STAGE_EXECUTION/SHARED_AUTHORITY/GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY.yaml',
                    'STAGE_EXECUTION/STAGE-03/WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-001/VISUAL_GEOMETRY_CONTRACT.yaml'
                  ],
                  'verification_purpose':f'Prove {suid} preserves current workbench, operation/state ownership, visual anchors, inherited style and semantic order.',
                  'design_review_item_uids':[f'DR-{suid}-GEOMETRY',f'DR-{suid}-TOPOLOGY',f'DR-{suid}-STATE'],
                  'evidence_ref':sc['evidence_ref'],
                  'annotation_status':'CURRENT_REVERIFY_MATERIALIZED',
                  'status':'CURRENT_REVERIFY_MATERIALIZED',
                })
            vra['candidate_uid']=cfg['candidate']
            vra['annotation_granularity']='ONE_ROW_PER_REQUIRED_VISUAL_SCENARIO'
            vra['required_row_fields']=[
              'visual_uid','page_or_scope_uid','scenario_uid','state_uid','workbench_uid','journey_uid',
              'parent_visual_uid','design_version','basic_design_change_set_uid','viewport','language','theme',
              'applicable_business_entity_or_operation','visible_sections','conditional_sections','locked_regions',
              'editable_regions','visual_anchor_uids','primary_controls','disabled_or_blocked_controls',
              'current_next_action_or_gate','source_authority_refs','authority_classification',
              'inherited_visual_authority_refs','verification_purpose'
            ]
            vra['annotations']=cand_ann
            vra['annotation_count']=len(cand_ann)
            vra['required_scenario_count']=len(vses.get('scenarios',[]))
            vra['scenario_annotation_coverage_complete']=len(cand_ann)==vra['required_scenario_count']
            vra.pop('candidate_annotations',None)
            vra.pop('required_candidate_annotation_fields',None)
            vra.pop('candidate_annotation_count',None)
            vra.pop('candidate_annotation_denominator_complete',None)
            vra['status']='CURRENT_REVERIFY_MATERIALIZED'
            dump(b/'VISUAL_REFERENCE_ANNOTATION.yaml',vra)

            # ---- S081: scenario -> exact function/visual coverage ----
            newsc=[]
            for sc,ann in zip(vses.get('scenarios',[]),cand_ann):
                row=copy.deepcopy(sc)
                row.update({
                  'workbench_uid':cfg['workbench'],
                  'journey_uid':cfg['journey'],
                  'function_or_operation_uids':cfg['ops'],
                  'state_uids':[ann['state_uid']],
                  'control_or_system_trigger_uids':ann['primary_controls_or_system_triggers'],
                  'visual_anchor_uids':anchor_uids,
                  'visual_style_ref':'STAGE_EXECUTION/SHARED_AUTHORITY/GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY.yaml',
                  'visual_inheritance_ref':str(b/'VISUAL_INHERITANCE_MATRIX.yaml'),
                  'visual_reference_annotation_ref':str(b/'VISUAL_REFERENCE_ANNOTATION.yaml'),
                  'design_review_item_uids':ann['design_review_item_uids'],
                  'semantic_order_ref':str(b/'FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT.yaml'),
                  'functional_topology_ref':str(b/'VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml'),
                  'coverage_status':'COMPLETE_CURRENT',
                })
                newsc.append(row)
            vses['required_scenario_row_fields']=[
              'scenario_uid','evidence_ref','status','workbench_uid','journey_uid','function_or_operation_uids',
              'state_uids','control_or_system_trigger_uids','visual_anchor_uids','visual_style_ref',
              'visual_inheritance_ref','visual_reference_annotation_ref','design_review_item_uids',
              'semantic_order_ref','functional_topology_ref','coverage_status'
            ]
            vses['scenarios']=newsc
            vses['scenario_to_function_coverage_complete']=True
            vses['status']='COMPLETE_CURRENT_REVERIFY'
            dump(b/'VISUAL_SCENARIO_EVIDENCE_SET.yaml',vses)

            # ---- S075/S071/S085/S088: complete handoff rows ----
            handoff_path=b/'EVIDENCE/CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml'
            hand=load(handoff_path)
            edge_defs=[
              ('STAGE-02','FUNCTIONAL_CONTRACT','PAGE_CONSTRUCTION_SPEC_PACKAGE',
               Path(str(b).replace('STAGE-03','STAGE-02').replace('WU-STAGE03','WU-STAGE02'))/'PAGE_CONSTRUCTION_SPEC_PACKAGE.yaml'),
              ('STAGE-03','VISUAL_DESIGN','VISUAL_DESIGN_SPEC_PACKAGE',b/'VISUAL_DESIGN_SPEC_PACKAGE.yaml'),
              ('STAGE-02','FUNCTIONAL_CONTRACT','DEPENDENCY_MAP',
               Path(str(b).replace('STAGE-03','STAGE-02').replace('WU-STAGE03','WU-STAGE02'))/'DEPENDENCY_MAP.yaml'),
            ]
            edges=[]
            for prod_stage,prod_cap,input_uid,path in edge_defs:
                if not path.is_file(): raise SystemExit(f'BLOCK:HANDOFF_SOURCE_MISSING:{path}')
                obj=load(path)
                edges.append({
                  'edge_uid':f'{cfg["unit"]}:{prod_stage}:{input_uid}:TO:STAGE-04',
                  'producer_stage_uid':prod_stage,
                  'producer_capability':prod_cap,
                  'producer_output_uid':obj.get('artifact_uid'),
                  'producer_output_type':obj.get('artifact_type'),
                  'producer_owner_path':str(path),
                  'producer_evidence_ref':str(path),
                  'producer_sha256':sha(path),
                  'producer_version':'NOT_SEPARATELY_VERSIONED_CURRENT_ARTIFACT',
                  'producer_schema':f'{obj.get("artifact_type")}@{obj.get("stage_uid",prod_stage)}',
                  'consumer_stage_uid':'STAGE-04',
                  'consumer_capability':'FOUNDATION_FREEZE',
                  'consumer_input_uid':input_uid,
                  'consumer_input_type':input_uid,
                  'consumer_owner':'STAGE04_FOUNDATION_FREEZE',
                  'consumer_schema':input_uid,
                  'applicability':'REQUIRED',
                  'reference_resolution_status':'PASS',
                  'physical_materialization_status':'PASS',
                  'parse_schema_status':'PASS',
                  'required_field_completeness_status':'PASS',
                  'denominator_inclusion_status':'PASS',
                  'consumer_admission_readiness_result':'PASS',
                  'unresolved_dependency_count':0,
                  'blocking_owner':'NOT_APPLICABLE_NO_BLOCKER',
                  'reentry_target':'NOT_APPLICABLE_NO_REENTRY',
                  'current_evidence_ref':str(path),
                })
            hand['required_edge_fields']=[
              'edge_uid','producer_stage_uid','producer_capability','producer_output_uid','producer_output_type',
              'producer_owner_path','producer_evidence_ref','producer_sha256','producer_version','producer_schema',
              'consumer_stage_uid','consumer_capability','consumer_input_uid','consumer_input_type','consumer_owner',
              'consumer_schema','applicability','reference_resolution_status','physical_materialization_status',
              'parse_schema_status','required_field_completeness_status','denominator_inclusion_status',
              'consumer_admission_readiness_result','unresolved_dependency_count','blocking_owner','reentry_target',
              'current_evidence_ref'
            ]
            hand['required_edges']=edges
            hand['required_edge_total']=len(edges)
            hand['reference_resolved_total']=len(edges)
            hand['physically_materialized_total']=len(edges)
            hand['parse_schema_valid_total']=len(edges)
            hand['required_field_complete_total']=len(edges)
            hand['denominator_included_total']=len(edges)
            hand['consumer_ready_total']=len(edges)
            hand['unresolved_required_dependency_total']=0
            hand['reentry_required_total']=0
            hand['impacted_reverify_required_consumer_total']=0
            hand['status']='PASS_CURRENT_REVERIFY'
            dump(handoff_path,hand)

            # ---- Required Field Manifest: actual row schemas, not dimension names ----
            rf=load(b/'REQUIRED_FIELD_MANIFEST.yaml')
            rf['governance_uid']=GOV_UID
            rf['governance_head']=GOV_HEAD
            rf['normative_execution_matrix_ref']=str(b/'NORMATIVE_EXECUTION_MATRIX.yaml')
            rf['row_contracts']=[
              {'row_class':'TYPOGRAPHY_BASELINE','artifact_ref':str(b/'VISUAL_GEOMETRY_CONTRACT.yaml'),'denominator_path':['typography_baseline_rows'],'row_identity_field':'target_uid','required_fields':geom.get('typography_baseline_required_fields') or []},
              {'row_class':'VISUAL_ANCHOR','artifact_ref':str(b/'VISUAL_GEOMETRY_CONTRACT.yaml'),'denominator_path':['visual_anchors'],'row_identity_field':'anchor_uid','required_fields':['anchor_uid','position_rule','dimension_rule','relationship_rule','lock_status']},
              {'row_class':'VISUAL_INHERITANCE','artifact_ref':str(b/'VISUAL_INHERITANCE_MATRIX.yaml'),'denominator_path':['rows'],'row_identity_field':'visual_region','required_fields':vim.get('required_row_fields') or []},
              {'row_class':'VISUAL_CANDIDATE_ANNOTATION','artifact_ref':str(b/'VISUAL_REFERENCE_ANNOTATION.yaml'),'denominator_path':['annotations'],'row_identity_field':'scenario_uid','required_fields':vra['required_row_fields']},
              {'row_class':'VISUAL_SCENARIO_COVERAGE','artifact_ref':str(b/'VISUAL_SCENARIO_EVIDENCE_SET.yaml'),'denominator_path':['scenarios'],'row_identity_field':'scenario_uid','required_fields':vses['required_scenario_row_fields']},
              {'row_class':'CROSS_STAGE_HANDOFF','artifact_ref':str(handoff_path),'denominator_path':['required_edges'],'row_identity_field':'edge_uid','required_fields':hand['required_edge_fields']},
            ]
            if key=='WB':
              rf['row_contracts'] += [
                {'row_class':'PAGE_SECTION_GEOMETRY','artifact_ref':str(b/'VISUAL_GEOMETRY_CONTRACT.yaml'),'denominator_path':['section_geometry_rows'],'row_identity_field':'section_uid','required_fields':['section_uid','label','component_uid','row_group','span_ge_1440','height_px','control_uid','field_identity','render_schema_uid','canonical_order_locked']},
                {'row_class':'CONTROL_VISUAL_BINDING','artifact_ref':str(b/'VISUAL_GEOMETRY_CONTRACT.yaml'),'denominator_path':['control_visual_rows'],'row_identity_field':'control_uid','required_fields':['section_uid','control_uid','control_type','visible_label','trigger_location','card_body_clickable','permission','gate_uid','operation_uid','api','runtime_owner','persistence_owner','render_schema_uid','action_uid_disposition']},
              ]
            rf['manifest_semantics']='EXACT_ROW_AND_REQUIRED_FIELD_CONTRACT'
            rf['summary_only_completion_credit']=0
            rf['status']='CURRENT_REVERIFY_MATERIALIZED'
            dump(b/'REQUIRED_FIELD_MANIFEST.yaml',rf)

            # ---- semantic exact NORMATIVE_EXECUTION_MATRIX ----
            outputs={
              'VISUAL_DESIGN_SPEC_PACKAGE':b/'VISUAL_DESIGN_SPEC_PACKAGE.yaml',
              'VISUAL_GEOMETRY_CONTRACT':b/'VISUAL_GEOMETRY_CONTRACT.yaml',
              'VISUAL_PREVIEW_EVIDENCE':b/'VISUAL_PREVIEW_EVIDENCE.yaml',
              'VISUAL_CHANGESET':b/'VISUAL_CHANGESET.yaml',
              'VISUAL_INTERACTION_TOPOLOGY_BINDING':b/'VISUAL_INTERACTION_TOPOLOGY_BINDING.yaml',
              'FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT':b/'FUNCTIONAL_WORKBENCH_LAYOUT_CONTRACT.yaml',
              'VISUAL_REFERENCE_ANNOTATION':b/'VISUAL_REFERENCE_ANNOTATION.yaml',
              'VISUAL_INHERITANCE_MATRIX':b/'VISUAL_INHERITANCE_MATRIX.yaml',
              'VISUAL_SCENARIO_EVIDENCE_SET':b/'VISUAL_SCENARIO_EVIDENCE_SET.yaml',
              'VISUAL_REVIEW_EVIDENCE':b/'EVIDENCE/VISUAL_REVIEW_EVIDENCE.yaml',
            }
            for pp in outputs.values():
                if not pp.is_file(): raise SystemExit(f'BLOCK:REQUIRED_ARTIFACT_MISSING:{pp}')

            rows=[]
            def add(sec,req,atype,aref,row_src,rowid,field_path,check,app='REQUIRED',ev=None,authority_ev=None):
                obj=load(aref)
                try: val=field_get(obj,field_path)
                except KeyError: raise SystemExit(f'BLOCK:MATRIX_FIELD_PATH_MISSING:{cfg["wu"]}:{sec}:{aref}:{field_path}')
                if app=='REQUIRED' and not present(val) and val is not False:
                    raise SystemExit(f'BLOCK:MATRIX_REQUIRED_VALUE_EMPTY:{cfg["wu"]}:{sec}:{aref}:{field_path}')
                row={
                  'matrix_row_uid':f'MX-{len(rows)+1:05d}',
                  'normative_section_uid':sec,
                  'requirement_uid':req,
                  'required_artifact_type':atype,
                  'artifact_ref':str(aref),
                  'artifact_owner':cfg['unit'],
                  'row_denominator_source':row_src,
                  'row_identity':rowid,
                  'field_path':field_path,
                  'applicability':app,
                  'validator_uid':'VAL-GOV-029',
                  'validator_check_id':check,
                  'evidence_ref':ev or str(aref),
                  'closure_gate':EXIT,
                  'failure_disposition':'BLOCK_AND_REENTER_STAGE03_OWNER',
                  'reentry_owner':'VISUAL_DESIGN',
                }
                if app=='NOT_APPLICABLE_WITH_AUTHORITY':
                    row['authority_evidence_ref']=authority_ev or str(aref)
                rows.append(row)

            # Full row/field expansions.
            g=load(b/'VISUAL_GEOMETRY_CONTRACT.yaml')
            for ri,r in enumerate(g.get('typography_baseline_rows') or []):
                for fld in g.get('typography_baseline_required_fields') or []:
                    add('WEB-GOV-01-S089',f'TYPOGRAPHY:{fld}','VISUAL_GEOMETRY_CONTRACT',b/'VISUAL_GEOMETRY_CONTRACT.yaml','typography_baseline_rows',r['target_uid'],['typography_baseline_rows',ri,fld],f'TYPOGRAPHY:{fld}')
            for ri,r in enumerate(g.get('visual_anchors') or []):
                for fld in ['anchor_uid','position_rule','dimension_rule','relationship_rule','lock_status']:
