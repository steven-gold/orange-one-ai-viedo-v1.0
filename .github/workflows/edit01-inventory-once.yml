name: EDIT-01 inventory once
on:
  push:
    branches: [acpos-sequential-closure-20260902]
    paths: ['.github/workflows/edit01-inventory-once.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse authority and source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          auth=Path('authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml').read_text()
          src='\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx','.js','.jsx'})
          def vals(key):
            out=[]
            for line in auth.splitlines():
              s=line.strip()
              if s.startswith('- '): s=s[2:].strip()
              if s.startswith(key+':'):
                v=s[len(key)+1:].strip().strip('"\'')
                if v and v not in out: out.append(v)
            return out
          for k in ['section_uid','control_uid','action_uid','gate_uid','permission_uid','error_uid']:
            v=vals(k); missing=[x for x in v if x not in src]
            print(f'EDIT_AUTH|{k}|count={len(v)}|source={len(v)-len(missing)}/{len(v)}')
            if missing: print('EDIT_MISSING_'+k.upper()+'|'+json.dumps(missing,ensure_ascii=False))
            if k in ('gate_uid','error_uid'): print('EDIT_'+k.upper()+'_LIST|'+json.dumps(v,ensure_ascii=False))
          visual=Path('src/components/pages/EditVisual.tsx').read_text()
          bindings=Path('src/domain/edit/editControlBindings.ts').read_text()
          specs=dict(re.findall(r'\{ id: "([^"]+)", kind: "([^"]+)" \}',visual))
          controls=vals('control_uid')
          print(f'EDIT_VISUAL_SPEC_UNIQUE={len(specs)}')
          for cid in controls:
            m=re.search(re.escape('"'+cid+'"')+r':\{"action_uid":(null|"([^"]+)")',bindings)
            action=m.group(2) if m and m.group(1)!='null' else None
            kind=specs.get(cid,'MISSING')
            if action and kind in {'readonly','overview','preview','list'}:
              print(f'EDIT_INTERACTIVITY_REVIEW|{cid}|kind={kind}|action={action}')
          PY
          echo EDIT01_INVENTORY_PASS
