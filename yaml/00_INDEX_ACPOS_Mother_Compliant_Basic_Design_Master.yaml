  - index: 3
    style: Normal
    text: 本包共 20 份 Basic Design：18 個 GitHub Current Pages + Login/Identity Entry + 全站 System Logic；另有本總目錄，共 31 份 Word。每一份頁面文件均獨立完成 Mother S076–S083 相容的 27 項 Blueprint
      artifact denominator，避免把所有頁面混成一份大文件。
