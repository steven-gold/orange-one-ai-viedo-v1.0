    order: '01'
    type: search
    label: 搜尋目前輸入
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-UI-MEDIA-FILTER
    enable_gate: EDIT-01-GATE-SOURCE；PROJECT_TASK 只搜尋目前 Execution Input Manifest 已綁定項目；Standalone 搜尋 Session Media
    default_state: DEFAULT
  - control_uid: EDIT-01-CTL-MEDIA-TYPE-FILTER
    order: '02'
    type: filter
    label: 素材類型
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-UI-MEDIA-FILTER
    enable_gate: EDIT-01-GATE-SOURCE；UI_ONLY
    default_state: DEFAULT
  - control_uid: EDIT-01-BTN-ADD-MEDIA
    order: '03'
    type: button
    label: 上傳媒體
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-MEDIA-IMPORT
    enable_gate: EDIT-01-GATE-STANDALONE；只允許 STANDALONE_UPLOAD；PROJECT_TASK 隱藏
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-LST-IMPORT-QUEUE
