name: Semantic Baseline Consumer Single Owner Successor

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/materialize_semantic_baseline_consumer_single_owner.py'

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(governance): stage semantic baseline consumer single owner repair' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify authorization parent and Current identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'artifact_type: SPECIFICATION_CHANGE_AUTHORIZATION_RECEIPT' governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-SEMANTIC-BASELINE-CONSUMER-SINGLE-OWNER-R2.yaml
          grep -q 'baseline_commit_sha: 52f1c3d1351eceda8a3554aafe3a9c60e3b10440' governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-SEMANTIC-BASELINE-CONSUMER-SINGLE-OWNER-R2.yaml
          grep -q 'GOV-REV-20260919-STRUCTURED-MUTATION-SELECTOR-HARDENING' governance/specifications/REGISTRY.yaml
      - name: Preflight repair materializer
        run: |
          python -m py_compile .github/governance-maintenance/materialize_semantic_baseline_consumer_single_owner.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_structured_mutation_safety.py
      - name: Materialize single-owner consumer repair and source identity successor
        run: python .github/governance-maintenance/materialize_semantic_baseline_consumer_single_owner.py
      - name: Persist repair successor atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          test -n "$(git diff --cached --name-only)" || { echo 'BLOCK: no repair successor changes staged' >&2; exit 1; }
          git commit -m "fix(governance): promote semantic baseline consumer single owner"             -m "Spec-Change-Authorization: USR-DIRECTIVE-20260919-SEMANTIC-BASELINE-CONSUMER-SINGLE-OWNER-R2"             -m "Spec-Change-Scope: SEMANTIC_BASELINE_CONSUMER_SINGLE_OWNER_AND_SOURCE_IDENTITY_REPAIR"
          git push origin HEAD:rebuild-v2.1.1
