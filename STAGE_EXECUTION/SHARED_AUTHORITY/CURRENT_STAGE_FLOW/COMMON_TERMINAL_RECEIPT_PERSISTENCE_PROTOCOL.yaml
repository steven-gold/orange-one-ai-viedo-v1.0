artifact_type: PRODUCT_COMMON_TERMINAL_RECEIPT_PERSISTENCE_PROTOCOL
status: CURRENT
normative_authority: false
owner: COMMON_STAGE_CLOSURE_PROTOCOL
applies_to: [STAGE-01, STAGE-02, STAGE-03, STAGE-04, STAGE-05, STAGE-06, STAGE-07, STAGE-08, STAGE-09, STAGE-10, STAGE-11]
purpose: ELIMINATE_SELF_REFERENTIAL_GIT_HEAD_TERMINAL_RECEIPT_CYCLE
sequence:
- step: CLOSURE_CANDIDATE_HEAD
  head_symbol: H
  rule: All effectful operations, outputs, required evidence, current state/matrix and handoff candidate are frozen at H.
- step: CLOSURE_CANDIDATE_VALIDATION
  rule: Validate normalized evidence candidate against H without claiming terminal receipt.
- step: OUTER_VALIDATION_RUN_TERMINAL_SUCCESS
  rule: The candidate validation workflow must reach terminal success before a terminal receipt may be materialized.
- step: TERMINALIZER_CHECKOUT
  rule: Terminalizer checks out the exact validated H and binds the successful prior run identity.
- step: TERMINAL_RECEIPT_MATERIALIZATION
  rule: Materialize terminal receipt with head_sha H and the already-terminal successful validation run id.
- step: EXACT_HEAD_TERMINAL_VALIDATION
  rule: Validate evidence and terminal receipt while git HEAD is still H.
- step: PERSIST_CLOSURE_PROJECTION
  head_symbol: H_PRIME
  rule: Commit evidence, terminal receipt, closed state and resume projection after exact-head terminal validation.
- step: POST_PERSIST_VALIDATION
  rule: At H_PRIME validate persisted receipt structure, predecessor identity, source validated head H and closure state consistency; do not reinterpret H receipt as an H_PRIME exact-head receipt.
rules:
  same_run_preterminal_self_projection_of_terminal_pass: FORBIDDEN
  receipt_head_must_equal_validated_candidate_head: true
  persisted_projection_commit_may_differ_from_receipt_head: true
  persisted_projection_must_record_source_validated_head: true
  post_persist_exact_head_terminal_revalidation_against_projection_head: FORBIDDEN
  predecessor_receipt_is_immutable_after_persist: true
  terminal_receipt_completion_credit_before_prior_run_terminal_success: 0
  terminalizer_may_change_product_semantics: false
completion_credit: 0
