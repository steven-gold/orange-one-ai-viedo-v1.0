denominator_rule:
- Denominator: Functions
  Rule: Every visible/effectful function + system-triggered function in the page contract.
- Denominator: Operations
  Rule: Every operation reachable from those functions, including cancel/retry/recheck/submit/approve.
- Denominator: System logic
  Rule: S01–S30 evaluated per applicable operation/domain; absence is not implicit N/A.
- Denominator: Cross-stage
  Rule: Every predecessor→successor handoff in the package, not representative examples.
- Denominator: Completion
  Rule: Only when all REQUIRED rows close and all N/A rows carry authority reason may Stage-02 functional
    closure be claimed.
canonical_time_integration:
- Integration Rule: Single time truth
  Normative Requirement: Time-bearing systems exchange exact CanonicalTimePoint rational values + explicit
    timebase identity; float seconds alone are forbidden as cross-system authority.
- Integration Rule: Display-unit independence
  Normative Requirement: Frame, millisecond, subframe and sample are UI/operation projections over the
    same canonical value; switching projection cannot mutate time.
- Integration Rule: Source identity
  Normative Requirement: Frame rate/sample rate/source version are part of the binding needed to interpret
    a precise position.
- Integration Rule: Cross-stage handoff
  Normative Requirement: ASSET/VIDEO/EDIT/VOICE/QA handoffs that carry timing MUST preserve canonical
    rational values or a lossless equivalent plus timebase metadata.
- Integration Rule: Video boundary
  Normative Requirement: Video edits/visual render boundaries remain frame-addressable; audio/dialogue
    may refine below a frame without creating a video subframe cut.
- Integration Rule: Audio precision
  Normative Requirement: Sample-level operations require exact sample-rate authority; millisecond operation
    is legal as a rational projection and may require deterministic quantization only at a sample-bound
    commit.
- Integration Rule: Subtitle precision
  Normative Requirement: Subtitle cue timing may be millisecond-addressable; export-specific quantization
    is a target-format concern and must not overwrite canonical edit truth.
- Integration Rule: LipSync/Dialogue
  Normative Requirement: Derived sync/binding status references canonical time + source/version fingerprint;
    derived status cannot become independent timing authority.
- Integration Rule: Failure propagation
  Normative Requirement: Unknown/mismatched timebase or source version is an explicit blocker propagated
    to the consuming stage; no guessed defaults.
- Integration Rule: Audit evidence
  Normative Requirement: Precision edits and quantization, when effectful, must be attributable to exact
    input version, unit, canonical before/after values and deterministic rule.
