name: Governance v2.1.6 Semantic Granularity Replay Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-v216-replay-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify v2.1.6 current pointers and expected block of restored 34-node replay
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v216_workspace.py
  sealed-v216-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact sealed v2.1.6 runtime, Stage-1 33/33, and lifecycle 11/11
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_sealed_v216_runtime.py
