schema_version: 4
artifact_uid: GOV-COMP-VALIDATION-REMEDIATION-CLOSURE-PROTOCOL
artifact_type: GOVERNANCE_SPECIFICATION_COMPONENT
normative_status: ACTIVE_CURRENT_GOVERNANCE_COMPONENT
formal_current_authority: true
layer_classification: POLICY
common_scope: ALL_GOVERNED_VALIDATION_AND_EXECUTION_CYCLES
purpose:
  discovery_without_material_remediation_is_progress: false
  fail_closed: true
principles:
  audit_pass_with_reproducible_product_gap_is_closure: false
  repeated_audit_blocked_loop_counts_as_progress: false
  hidden_defect_search_after_known_fix: true
  fresh_verification_from_clean_registered_baseline: true
  prior_result_reuse_as_current: false
  ai_may_invent_missing_product_authority: false
  external_authority_auto_resolution: false
  mixed_governance_uid_evidence_for_one_closure: false
  inner_step_pass_is_terminal_run_pass: false
  failed_terminal_run_may_close_work_unit: false
  file_count_or_residual_count_without_semantic_review_is_cleanup_proof: false
canonical_cycle:
- RESOLVE_ACTIVE_WORK_UNIT_OR_WORK_UNIT_RESOLUTION_GATE
- CLASSIFY_AND_LOCK_CURRENT_PRIMARY_TASK_LAYER
- SESSION_BOOTSTRAP_RESUME_GATE
- RESOLVE_CURRENT_TRUTH_AND_CANONICAL_OWNER
- FREEZE_CURRENT_POLICY_AND_INPUT_BASELINE
- COMPILE_APPLICABILITY_DEPENDENCY_VALIDATOR_AND_PROJECTOR_PLAN
- RUN_SYSTEM_DEFINITION_AND_HIGH_PRESSURE_GATES
- EXECUTE_FRESH_PHYSICAL_VALIDATION
- CLASSIFY_DEFECT_ROOT_CAUSE_AND_OWNER
- MATERIALLY_REMEDIATE_AT_OWNER
- PRE_WRITE_RECONCILIATION
- WRITE_AUTHORIZED_CHANGE_SET
- POST_WRITE_RECONCILIATION
- REBUILD_COMPLETE_REGISTERED_CURRENT_PROJECTOR_SET
- SWEEP_COMPLETE_ACTIVE_AND_TRANSITIVE_CONSUMER_SET
- CLASSIFY_RESIDUALS_BY_CONTENT_OWNER_REFERENCE_AND_RETENTION_ROLE
- REMOVE_OR_MIGRATE_SUPERSEDED_ACTIVE_CONTENT
- RESET_REPLACEABLE_OUTPUT_AND_EVIDENCE
- RUN_REGRESSION
- FRESHLY_REEXECUTE
- VERIFY_KNOWN_SIGNATURE_ZERO
- RUN_HIDDEN_DEFECT_SWEEP
- VERIFY_TERMINAL_RUN_CONCLUSION
- REVIEW_REUSABLE_POLICY_CANDIDATES
- PROMOTE_ONLY_IF_EXPLICITLY_AUTHORIZED
- MAKE_CLOSURE_DECISION
defect_classes:
  SPECIFICATION_DEFECT: REUSABLE_POLICY_CANDIDATE_ONLY_UNTIL_AUTHORIZED
  TEST_HARNESS_OR_VALIDATOR_BUG: TEST_OR_VALIDATION_IMPLEMENTATION
  PRODUCT_MATERIALIZATION_OR_CONTRACT_GAP: PRODUCT_OR_CONTRACT_OWNER
  RUNTIME_OR_IMPLEMENTATION_BUG: IMPLEMENTATION_OR_RUNTIME
  EVIDENCE_OR_STATE_BUG: NON_NORMATIVE_EVIDENCE_OR_STATE
  EXTERNAL_AUTHORITY_GAP: EXTERNAL_OR_SHARED_AUTHORITY
material_remediation:
  required_for_every_remediable_defect: true
  audit_or_diagnosis_only: NOT_REMEDIATION
  evidence_only_without_owning_layer_change: NOT_REMEDIATION
  external_authority_gap: PRESERVE_UNRESOLVED_AND_BLOCK_APPLICABLE_CLOSURE
validator_applicability:
  owner: CANONICAL_PREFLIGHT_COMPILER
  applicability_must_be_resolved_before_validator_selection: true
  workflow_local_validator_selection_policy: FORBIDDEN
  workflow_may_orchestrate_compiled_plan_only: true
  stale_missing_or_out_of_domain_validator_target: BLOCK_AT_ADMISSION
active_consumer_and_projector_integrity:
  complete_active_workflow_inventory_required: true
  transitive_invoked_consumer_graph_required: true
  complete_projector_inventory_source: GOVERNANCE_SPECIFICATION_REGISTRY
  handwritten_projector_subset_may_define_completeness: false
  every_state_mutation_producer_must_project_complete_registered_set: true
  partial_current_projection: BLOCK_BEFORE_PERSISTENCE
  stale_current_reference_required_count: 0
persistence_transaction:
  pre_write_reconciliation_required: true
  post_write_reconciliation_required: true
  promotion_and_cleanup_are_one_closure_transaction: true
  superseded_active_content_may_survive_terminal_closure: false
  unknown_residual_disposition: BLOCK
  unjustified_residual_files_required_count: 0
residual_classification:
  semantic_content_review_required: true
  count_is_summary_not_classification: true
  required_dimensions:
  - CANONICAL_OWNER
  - FORWARD_REFERENCE
  - REVERSE_REFERENCE
  - RUNTIME_OR_WORKFLOW_REACHABILITY
  - TEST_REGRESSION_ROLE
  - HISTORICAL_RETENTION_ROLE
  dispositions:
    CURRENT_REQUIRED: KEEP_ACTIVE
    HISTORICAL_PROVENANCE: KEEP_NON_CURRENT
    NEGATIVE_REGRESSION_PATTERN: KEEP_AS_NON_CURRENT_TEST_OR_SIGNATURE
    SUPERSEDED_ACTIVE_CONTENT: REMOVE_OR_MIGRATE
    DEAD_OR_UNREFERENCED_ACTIVE_CONTENT: REMOVE
    TEMP_BACKUP_COPY_EMPTY_OR_INTERMEDIATE: REMOVE
    UNKNOWN: BLOCK
  mother_policy_refs:
  - WEB-GOV-03-S068
  - WEB-GOV-04-S082
historical_failure_semantics:
  historical_failed_evidence_may_be_deleted_only_because_it_failed: false
  historical_failed_evidence_may_receive_current_authority_credit: false
  historical_failed_evidence_may_receive_current_closure_credit: false
  known_failure_pattern_should_be_bound_as_negative_regression: true
  original_failure_evidence_role: PROVENANCE_ONLY
terminal_result_semantics:
  inner_step_pass_is_terminal_run_pass: false
  workflow_in_progress_may_project_terminal_pass: false
  terminal_success_required_for_closure_credit: true
  terminal_failure_cancel_timeout_or_skipped_blocks_closure_credit: true
  current_terminal_pass_projection_must_be_based_on_observed_terminal_conclusion: true
  same_run_preterminal_self_projection_of_terminal_pass: FORBIDDEN
  terminal_receipt_projection_must_be_external_to_or_after_terminal_conclusion: true
  outer_terminal_conclusion_is_closure_authority: true
  inner_job_or_step_success_may_close_outer_workflow: false
  queued_or_in_progress_workflow_may_close: false
retest_and_regression:
  clean_registered_baseline_required: true
  same_governance_uid_until_authorized_promotion: true
  fresh_reexecution_required: true
  known_remediable_signature_reproduction_count: 0
  same_signature_after_claimed_fix: REMEDIATION_FAILURE
  success_and_failure_path_regression_required_for_reusable_invariant: true
closure_gate:
  all_discovered_remediable_defects_materially_eliminated: REQUIRED
  new_blocking_defect_count: 0
  required_outputs_complete: REQUIRED
  external_authority_resolved_or_formally_non_applicable: REQUIRED_WHERE_CLOSURE_DEPENDS_ON_IT
  hidden_defect_sweep: PASS_REQUIRED
  complete_registered_current_projectors: PASS_REQUIRED
  complete_active_transitive_consumer_sweep: PASS_REQUIRED
  unjustified_residual_files: ZERO_REQUIRED
  stale_current_references: ZERO_REQUIRED
  terminal_run_conclusion: PASS_REQUIRED
  evidence_chain_complete: REQUIRED
  otherwise: BLOCK_ADVANCE
governance_maintenance_credit_isolation:
  applies_to:
  - GOVERNANCE_POLICY_OR_REGISTRY
  - REFERENCE_OR_RESIDUAL_CLEANUP
  - VALIDATOR_SCANNER_CLASSIFIER_PARSER_HARNESS
  - WORKFLOW_CI_OR_GATE
  - EVIDENCE_STATE_PROJECTOR_RESUME_LEDGER_OR_RECEIPT
  - NEGATIVE_REGRESSION_OR_HISTORICAL_EVIDENCE_MAINTENANCE
  product_stage_gap_reduction_credit: 0
  product_completion_credit: 0
  fresh_product_owner_evidence_required_to_change_product_denominator: true
  governance_maintenance_pass_is_product_stage_pass: false
design_remediation_candidate_boundary:
  input_source_or_architecture_gap_may_skip_design_remediation_to_manual_field_wait: false
  review_only_candidate_may_be_authority: false
  review_only_candidate_may_be_r7_input: false
  package_review_may_bind_multiple_blocker_identities: true
  true_authority_gap_requires_explicit_selection: true
  approved_candidate_requires_single_owner_materialization_before_ingestion: true
  governance_or_candidate_test_product_credit: 0
  fresh_product_reexecution_required_for_blocker_reduction: true
scope_and_reentry_boundary:
  execution_scope_manifest_required: true
  partial_work_unit_closure_may_grant_stage_exit: false
  remaining_scope_must_persist: true
  reusable_validator_literal_product_scope_or_count_as_denominator: BLOCK
  downstream_upstream_owner_mismatch: STOP_REOPEN_OWNER_AND_REVERIFY_IMPACTED_DESCENDANTS
  source_replay_without_source_defect_as_downstream_remediation: BLOCK
temporary_formalization_boundary:
  temporary_artifact_is_authority: false
  temporary_residual_zero_before_formal_full_line_freeze_release_or_closure: true
  temporary_residual_block_is_semantic_candidate_failure: false
  candidate_semantic_result_and_package_cleanliness_are_separate: true
