name: VIS-07 Evidence Timing Patch
on:
  push:
    branches: [acpos-vis07-staging]
    paths: [.github/workflows/vis07-evidence-wait-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait past canonical 180ms sidebar collapse before 1440 evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/vis07-validation.yml')
          s=p.read_text()
          old="await page.mouse.move(900,400);\n            await page.setViewportSize({width:1440,height:900});await page.waitForTimeout(100);"
          new="await page.mouse.move(900,400); await page.waitForTimeout(300);\n            await page.setViewportSize({width:1440,height:900});await page.waitForTimeout(300);"
          if old not in s:
              raise SystemExit('VIS-07 evidence timing target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit timing correction and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/vis07-validation.yml
          git rm .github/workflows/vis07-evidence-wait-patch.yml
          git commit -m "test(vis07): wait for canonical sidebar collapse in evidence [skip ci]"
          git push
