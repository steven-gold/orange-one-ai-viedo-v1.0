directive_summary: >-
  Close the Basic Design completeness loophole. Completeness is execution-detail completeness,
  not page count, prose volume, representative examples, or summary labels. Every applicable
  denominator must be enumerated and materialized row-by-row with exact identity and all applicable
  ownership, input/output, state, gate, permission, visual, next-step, recovery, cross-page, and
  acceptance bindings. Human-readable and machine-readable design deliverables must reconcile to
  the same exact denominator. Missing rows, missing required bindings, silent omissions,
  summary-only substitution, representative-sample substitution, or unclassified applicability
  must fail closed and block Basic Design Freeze.
