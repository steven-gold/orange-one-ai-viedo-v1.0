# governance-single-branch-current-validation
name: Current Governance Cleanup Validation

on:
  push:
    branches:
      - rebuild-v2.1.1

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: current-governance-cleanup-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install hash-locked verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock

      - name: Gate 01 - Promotion transaction contract
        run: python governance/ci/governance_promotion_transaction.py --self-test

      - name: Gate 02 - Stage definition and selected profile
        run: |
          set -euo pipefail
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/validate_selected_execution_profile_integrity.py

      - name: Gate 03 - Active consumers and governance layout
        run: |
          set -euo pipefail
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_governance_layout.py

      - name: Gate 04 - Mutation safety portability and domain isolation
        run: |
          set -euo pipefail
          python governance/ci/validate_structured_mutation_safety.py --self-test
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_governance_portability.py
          python governance/ci/validate_execution_domain_isolation.py

      - name: Gate 05 - Single-branch source and governance preformal
        run: python governance/ci/validate_successor_governance_preformal.py

      - name: Gate 06 - Source stage and product-neutral invariants
        run: |
          set -euo pipefail
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_product_neutral_entity_lifecycle.py

      - name: Gate 07 - Audit closure
        run: |
          set -euo pipefail
          python governance/ci/audit_closure_engine.py --self-test
          python governance/ci/audit_closure_engine.py

      - name: Gate 08 - Promotion readiness semantics and retired-path guards
        run: |
          set -euo pipefail
          python governance/ci/validate_governance_candidate_promotion_readiness.py --self-test
          test ! -e governance/ci/compile_stage_execution_preflight.py
          test ! -e governance/ci/stage_execution_adapters/stage02_functional_contract.py

      - name: Gate 09 - Full high-pressure Stage regression
        run: python governance/ci/test_stage_execution_engine.py
      - name: Gate 10 - External admission layer isolation
        run: |
          python .github/governance-source/active/source/09_TESTS/governance/validate_external_execution_admission.py
          python governance/ci/test_external_execution_admission.py
