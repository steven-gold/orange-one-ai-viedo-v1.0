  - index: 7
    style: Normal
    text: 'Design Status: DESIGN_CONTENT_COMPLETE · FORMAL_APPROVAL_NOT_SELF_GRANTED · RUNTIME_NOT_PROVEN_BY_DOCUMENT'
  - index: 8
    style: Normal
    text: 'Current design basis: rebuild-v2.1.1 · HEAD 9b25fe3ab4e304103d9b6980123d25bb2d2fadb3 · Governance GOV-REV-20260920-CROSS-STAGE-MATERIALIZATION-CONSUMER-READINESS-HARDENING
      (display v2.2.16)'
  - index: 10
    style: Heading 1
    text: 1. Design Identity / 設計定位
  - index: 11
    style: Normal
    text: 核心定位
  - index: 12
    style: Rule
    text: • 本文件是 ACPOS 全站 AI System Engineer、Self-Inspection、Self-Repair Proposal 與 Governed Evolution 的唯一系統邏輯 Owner。
  - index: 13
    style: Rule
    text: • 它負責重新解析 Current Truth、追蹤完整功能鏈、建立 Finding、分析 Root Cause、解析 Canonical Owner、計算 Change Impact、產生 Change Candidate、Simulation/Validation、準備 Authorized Execution、Deployment
      Verification、Rollback、Resume 與 Incident Learning。
  - index: 14
    style: Rule
    text: • 它不是 Current Authority 本身；AI 的 Finding、Root Cause、Patch Proposal、Simulation Result 或 Test PASS 都只是 Evidence/Candidate，不能自動升格為 Authority。
  - index: 15
    style: Rule
    text: • AI MAY inspect / classify / propose / simulate / verify；AI MUST_NOT self-approve、self-promote Current Governance、self-bypass Gate、self-claim Production
      PASS。
  - index: 16
    style: Heading 1
    text: 2. Purpose / Scope / Out-of-Scope / Owner Boundary
  - index: 17
    style: Heading 1
    text: 3. Canonical Owner Boundary / Cross-System References
  - index: 18
    style: Heading 1
    text: 4. System Architecture / 系統架構
  - index: 20
    style: Caption Small
    text: 圖 2｜AI System Engineer 必須沿完整 Functional Chain 追蹤，而不是只看 UI 或單一 API。
  - index: 21
    style: Heading 1
    text: 5. Current Truth Bootstrap Contract
  - index: 22
    style: Normal
    text: 任何 System Inspection、Change Planning、Validation、Execution 或「完成」宣告之前 MUST 先完成 Current Truth Bootstrap。
  - index: 23
    style: Heading 1
    text: 6. Functional Chain Trace Contract
  - index: 24
    style: Normal
    text: 每一個受治理操作的最小可追蹤鏈：
  - index: 25
    style: Normal
    text: Page → Control → System Trigger → Action → Gate → Permission → Validation → Payload → API → Runtime → DB/Provider → Audit → Response → UI Feedback
  - index: 26
    style: Heading 1
    text: 7. Inspection Scope / Modes / Denominator
  - index: 27
    style: Rule
    text: • Denominator MUST come from Current Authority / applicable REQUIRED universe，MUST_NOT 由舊報告、歷史數字或 executor local 常數決定。
  - index: 28
    style: Rule
    text: • Partial-scope PASS 只能關閉該 Work Unit；有 remaining required scope 時 Stage-exit credit MUST be 0。
  - index: 29
    style: Heading 1
    text: 8. Entity Inventory / Hierarchy
