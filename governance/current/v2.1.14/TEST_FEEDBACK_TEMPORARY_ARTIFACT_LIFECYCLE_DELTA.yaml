schema_version: 1
artifact_uid: V214-TEST-FEEDBACK-TEMPORARY-ARTIFACT-LIFECYCLE
artifact_type: GOVERNANCE_REVISION_COMPONENT
parent_revision: v2.1.14-product-neutral-interaction-topology-ai-continuity
normative_status: PART_OF_CURRENT_TEST_GOVERNANCE
standalone_authority: false
scope: ALL_GOVERNED_STAGE_TESTS

finding_classification:
  TEST_HARNESS_OR_VALIDATOR_BUG:
    may_be_corrected_without_business_authority: true
    failing_evidence_required: true
    correction_verification_required: true
    governance_promotion_required_when_rule_is_generalizable: true
  PRODUCT_OR_ARCHITECTURE_GAP:
    may_be_auto_filled_by_ai: false
    exact_authority_or_human_approved_contract_required: true
    unresolved_gap_remains_blocking: true
  EXTERNAL_AUTHORITY_GAP:
    may_be_inferred_from_semantics: false
    unresolved_reference_must_remain_explicit: true

stage_test_feedback_loop:
  required_sequence:
    - RUN_STAGE_TO_DISCOVERY_EXHAUSTION
    - RECORD_FINDINGS_WITH_SOURCE_EVIDENCE
    - CLASSIFY_FINDING
    - REGISTER_TEMPORARY_CORRECTION_ARTIFACT_IF_NEEDED
    - APPLY_ONLY_AUTHORIZED_OR_TEST_HARNESS_CORRECTION
    - VERIFY_CORRECTION_WITH_EXECUTION_EVIDENCE
    - PROMOTE_GENERALIZABLE_VERIFIED_GOVERNANCE_FIX_TO_PARENT_REVISION
    - RERUN_AFFECTED_PREVIOUS_BOUNDARY_WHEN_REQUIRED
    - RERUN_CURRENT_STAGE_UNDER_UPDATED_GOVERNANCE
    - COMPARE_WITH_ALL_PRIOR_FINDINGS
    - CLEAN_TEMPORARY_CORRECTION_ARTIFACTS
    - RUN_ZERO_RESIDUAL_SCAN
    - CLOSE_TEST_CYCLE_ONLY_AFTER_CLEANUP_PASS
  premature_final_retest_before_required_rule_promotion: FORBIDDEN
  green_ci_as_product_gap_resolution: FORBIDDEN
  test_harness_bug_as_product_truth_change: FORBIDDEN

temporary_correction_artifact_lifecycle:
  allowed: true
  canonical_temporary_root: governance/test-temporary
  current_authority_eligible: false
  production_authority_eligible: false
  required_registration_fields:
    - temporary_artifact_uid
    - source_finding_uid
    - target_stage
    - exact_scope
    - purpose
    - created_for_test_run
    - disposition
    - cleanup_condition
  allowed_dispositions:
    - PENDING_VERIFICATION
    - PROMOTE_TO_GOVERNANCE
    - DISCARD_AFTER_TEST
  promotion_requirements:
    governance_worthy_fix_must_be_integrated_into:
      - MOTHER_SPEC_OR_EQUIVALENT_NORMATIVE_RULE
      - RELEVANT_REGISTRY_OR_STAGE_CONTRACT
      - ENFORCEMENT_VALIDATOR
      - REGRESSION_TEST
    copying_or_moving_temporary_file_to_permanent_folder_without_normative_integration: FORBIDDEN
  cleanup_requirements:
    after_promotion_or_discard:
      - DELETE_TEMPORARY_FILES
      - DELETE_EMPTY_TEMPORARY_DIRECTORIES
      - REMOVE_TEMPORARY_CURRENT_POINTERS
      - EMIT_CLEANUP_RECEIPT
      - RUN_ZERO_RESIDUAL_SCAN
    stale_temporary_artifact_after_cleanup_condition: BLOCK
    empty_temporary_directory_after_cycle_close: BLOCK
    missing_cleanup_receipt: BLOCK
    current_pointer_to_temporary_artifact: BLOCK
  zero_residual_definition:
    no_temporary_files: true
    no_empty_temporary_directories: true
    no_temporary_authority_pointer: true
    no_standalone_duplicate_governance_policy_created_from_test_fix: true

historical_evidence_policy:
  immutable_historical_receipts_may_reference_retired_paths: true
  historical_reference_text_does_not_make_retired_file_current: true
  current_execution_may_not_require_retired_alias_or_temporary_artifact: true
  git_history_is_sufficient_to_preserve_deleted_retired_execution_helpers_when_receipts_are_pinned: true

closure_rules:
  verified_generalizable_fix_not_promoted: BLOCK
  temporary_artifact_cleanup_incomplete: BLOCK
  zero_residual_scan_failed: BLOCK
  unresolved_true_product_or_authority_gap: BLOCK
  no_unaccounted_regression_required: true
