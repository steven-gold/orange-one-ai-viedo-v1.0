name: Fresh CORE-01 Stage01 Stage02 Replay

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/run_fresh_core01_stage01_stage02_replay.py'

permissions:
  contents: write

jobs:
  fresh-replay:
    if: "${{ github.event.head_commit.message == 'test(core01): stage clean Stage-01 Stage-02 fresh replay' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      ACPOS_RUN_ROOT: 00_SOURCE_INTAKE/fresh_run_004
      STAGE02_PAGE_SCOPE: CORE-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Assert exact authorization and Current governance
        shell: bash
        run: |
          set -euo pipefail
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-CLEAR-STAGE01-STAGE02-RERUN-CORE01-R1.yaml
          grep -q 'GOV-REV-20260919-PROFILE-TOKEN-DECONTAMINATION-HARDENING' governance/specifications/REGISTRY.yaml
          test -d 00_SOURCE_INTAKE/fresh_run_003
          test -f 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
      - name: Compile fresh replay producer
        run: python -m py_compile .github/governance-maintenance/run_fresh_core01_stage01_stage02_replay.py
      - name: Clear prior Stage-01 Stage-02 data and execute fresh CORE-01 replay
        run: python .github/governance-maintenance/run_fresh_core01_stage01_stage02_replay.py
      - name: Verify exact cleanup and replay boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e 00_SOURCE_INTAKE/fresh_run_003
          test -d 00_SOURCE_INTAKE/fresh_run_004
          test ! -e 00_SOURCE_INTAKE/fresh_run_004/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01
          test ! -e 00_SOURCE_INTAKE/fresh_run_004/01_CLASSIFIED/ASSET-01
          test ! -e 00_SOURCE_INTAKE/fresh_run_004/02_BASE_BLUEPRINT/ASSET-01
          test ! -e 00_SOURCE_INTAKE/fresh_run_004/03_BLUEPRINT_BINDING/ASSET-01
          test ! -e 00_SOURCE_INTAKE/fresh_run_004/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01
          test ! -e governance/test/history/stage02
          git diff --check
      - name: Persist clean fresh CORE-01 Stage-01 and Stage-02 execution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          test -n "$(git diff --cached --name-only)" || { echo 'BLOCK: no fresh replay changes staged' >&2; exit 1; }
          git commit -m "test(core01): persist clean Stage-01 Stage-02 fresh replay" \
            -m "Execution-Authorization: USR-DIRECTIVE-20260919-CLEAR-STAGE01-STAGE02-RERUN-CORE01-R1" \
            -m "Scope: CORE-01 only; ASSET-01 generated data removed"
          git push origin HEAD:rebuild-v2.1.1
