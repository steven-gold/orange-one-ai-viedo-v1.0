name: IAM-01 preview final verify once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/iam01-preview-final-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source for browser tooling
        uses: actions/checkout@v4
        with:
          ref: new
          path: source
      - name: Checkout final preview
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          path: previewrepo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify exact preview and unified URLs
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=2669481980437d3c0264e495aa8a5cce43b70cc3
          test "$(git -C previewrepo rev-parse HEAD)" = "$EXPECTED"
          test -f previewrepo/preview/accounts.html
          test -f previewrepo/preview/iam01-assets/_next/static/chunks/2-yi9nccot1u4.css
          test -f previewrepo/preview/iam01-assets/_next/static/chunks/0837kap0r0242.css
          test "$(find previewrepo/preview/iam01-assets -type f | wc -l | tr -d ' ')" = 2
          if find previewrepo/preview/iam01-assets -type f ! -name '*.css' | grep -q .; then exit 1; fi
          BASE="https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/${EXPECTED}/preview"
          pages=(index.html core.html assets.html video.html edit.html qa.html db.html strategy.html info.html system.html accounts.html dev.html social.html erp.html aiapi.html qa-criteria.html strategy-admin.html knowledge-admin.html)
          test "${#pages[@]}" = 18
          for p in "${pages[@]}"; do
            code=$(curl -L --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 60 -sS -o "/tmp/$p" -w '%{http_code}' "$BASE/$p")
            echo "IAM01_UNIFIED_URL $p HTTP $code"
            test "$code" = 200
            test -s "/tmp/$p"
          done
          grep -q 'data-iam01-preview-mode="SEALED_STATIC_FAIL_CLOSED"' /tmp/accounts.html
          grep -q 'data-page-state="BLOCKED"' /tmp/accounts.html
          grep -q 'data-projection-reason="UI_PROJECTION_RUNTIME_NOT_BOUND"' /tmp/accounts.html
          ! grep -q '<script' /tmp/accounts.html
          echo "IAM01_UNIFIED_18_URLS_PASS"
      - name: Install isolated browser tooling
        working-directory: source
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Validate exact final IAM-01 preview in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo/preview
          python3 -m http.server 4175 > /tmp/iam01-final-static.log 2>&1 &
          static_pid=$!
          trap 'kill $static_pid || true; cat /tmp/iam01-final-static.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/accounts.html >/dev/null; then break; fi
            sleep 1
          done
          cd ../../source
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const runtimeRequests=[]; const scriptRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/'))runtimeRequests.push(`${r.method()} ${u.pathname}`);if(r.resourceType()==='script')scriptRequests.push(u.pathname);});
            await page.goto('http://127.0.0.1:4175/accounts.html',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:IAM-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            assert.equal(await page.locator('html').getAttribute('data-iam01-preview-mode'),'SEALED_STATIC_FAIL_CLOSED');
            const expected={
              'data-authority-status':'FINAL_LOCKED','data-authority-sections':'6','data-authority-components':'10','data-authority-controls':'14','data-frontend-l1-count':'9','data-backend-l1-count':'9',
              'data-control-registry-valid':'true','data-page-state':'BLOCKED','data-projection-status':'BLOCKED','data-projection-reason':'UI_PROJECTION_RUNTIME_NOT_BOUND','data-runtime-error-uid':'IAM-01-ERR-UNDEFINED',
              'data-projection-adapter-ready':'false','data-effectful-runtime-ready':'false','data-formal-runtime-status':'NOT_EXECUTED'
            };
            for(const [k,v] of Object.entries(expected)) assert.equal(await root.getAttribute(k),v,k);
            assert.equal(await page.locator('[data-section-id^="IAM-01-SEC-"]').count(),6);
            assert.equal(await page.locator('[data-component-id^="IAM-01-CMP-"]').count(),10);
            const controls=page.locator('[data-control-id^="IAM-01-"]');
            assert.equal(await controls.count(),14);
            for(let i=0;i<14;i++){
              const node=controls.nth(i);
              for(const attr of ['data-action-uid','data-gate-uid','data-permission-uid','data-effect-type','data-current-state','data-runtime-binding']) assert(await node.getAttribute(attr),`${i} ${attr}`);
            }
            assert.equal(await page.locator('script').count(),0);
            assert.deepEqual(runtimeRequests,[]);
            assert.deepEqual(scriptRequests,[]);
            assert.equal(await page.locator('[data-nav-id="ADMIN-NAV-02"]').getAttribute('href'),'accounts.html');
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('IAM01_FINAL_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('IAM01_FINAL_SEALED_PREVIEW_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
