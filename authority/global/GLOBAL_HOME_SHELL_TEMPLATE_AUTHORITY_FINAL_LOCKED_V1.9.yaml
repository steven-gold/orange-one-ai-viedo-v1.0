  path: SYSTEM_OPERATION_REGISTRY_REQUIRED
- port_uid: GHS-PORT-IDENTITY
  operation: resolveIdentityAccountAuthority
  path: SYSTEM_OPERATION_REGISTRY_REQUIRED
