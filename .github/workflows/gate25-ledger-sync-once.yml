name: ACPOS Gate25 One Shot Ledger Sync

on:
  push:
    branches: [new]
    paths:
      - ".github/workflows/gate25-ledger-sync-once.yml"

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Synchronize direct blockers into physical 1481 ledger
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ledgerPath='docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json';
          const directPath='docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DIRECT_ADAPTERS_2026-09-10.json';
          const statePath='CURRENT_EXECUTION_STATE.json';
          const evidencePath='docs/construction/evidence/GATE25_DIRECT_BLOCKER_LEDGER_SYNC_2026-09-10.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const direct=JSON.parse(fs.readFileSync(directPath,'utf8'));
          const state=JSON.parse(fs.readFileSync(statePath,'utf8'));
          const rows=new Map(ledger.entries.map(e=>[e.resource_key,e]));
          const before={...ledger.counts};
          let newlyBlocked=0;
          let alreadyBlocked=0;
          const synced=[];
          for(const blocker of direct.mapped_not_yet_executable||[]){
            const e=rows.get(blocker.resource_key);
            if(!e) throw new Error(`GATE25_DIRECT_LEDGER_RESOURCE_MISSING:${blocker.resource_key}`);
            if(e.disposition==='PASS') throw new Error(`GATE25_DIRECT_BLOCKER_ALREADY_PASS:${blocker.resource_key}`);
            if(e.disposition==='BLOCKED') alreadyBlocked++; else newlyBlocked++;
            e.disposition='BLOCKED';
            e.reason_code=blocker.reason_code;
            e.evidence_refs=Array.from(new Set([...(Array.isArray(e.evidence_refs)?e.evidence_refs:[]),directPath]));
            e.blocker_detail=blocker.detail;
            e.operation_ids=blocker.operation_ids;
            synced.push(blocker.resource_key);
          }
          const counts={PASS:0,BLOCKED:0,NOT_EXECUTED:0};
          for(const e of ledger.entries){
            if(!(e.disposition in counts)) throw new Error(`GATE25_INVALID_DISPOSITION:${e.resource_key}:${e.disposition}`);
            counts[e.disposition]++;
          }
          if(counts.PASS!==5) throw new Error(`GATE25_PASS_COUNT_CHANGED:${counts.PASS}`);
          if(counts.PASS+counts.BLOCKED+counts.NOT_EXECUTED!==1481) throw new Error('GATE25_DENOMINATOR_DRIFT');
          ledger.status='CURRENT_PARTIAL_DIRECT_25_PHYSICAL_LEDGER_SYNCED';
          ledger.captured_at='2026-09-10T16:08:00+08:00';
          ledger.counts=counts;
          ledger.direct_mapping_physical_sync={
            exact_direct_mapping_count:25,
            pass_readonly:5,
            blocker_resources:20,
            newly_blocked:newlyBlocked,
            already_blocked:alreadyBlocked,
            unclassified:0,
            evidence:directPath,
            sync_evidence:evidencePath,
            rule:'BLOCKED is evidence classification, not effectful PASS. No Production business row or provider call is fabricated by this sync.'
          };
          const evidence={
            document_id:'ACPOS_GATE25_DIRECT_BLOCKER_LEDGER_SYNC',
            status:'PHYSICAL_LEDGER_SYNCED',
            as_of:'2026-09-10T16:08:00+08:00',
            denominator:1481,
            direct_mapping_count:25,
            pass_readonly:5,
            blocker_resources:20,
            newly_blocked:newlyBlocked,
            already_blocked:alreadyBlocked,
            counts_before:before,
            counts_after:counts,
            synced_resource_keys:synced.sort(),
            source:directPath,
            rule:'This operation changes only formal acceptance disposition metadata. It does not execute mutations, create business rows, call external providers, or promote any blocked resource to PASS.'
          };
          state.as_of='2026-09-10T16:08:00+08:00';
          if(state.construction?.gate25_formal_acceptance_ledger){
            state.construction.gate25_formal_acceptance_ledger.dispositions=counts;
            state.construction.gate25_formal_acceptance_ledger.physical_counts_unchanged=undefined;
            state.construction.gate25_formal_acceptance_ledger.physical_direct_blocker_sync={
              status:'SYNCED',counts_before:before,counts_after:counts,newly_blocked:newlyBlocked,already_blocked:alreadyBlocked,evidence:evidencePath
            };
          }
          if(state.gate_scores?.['25']) state.gate_scores['25'].detail=`Formal denominator 1481. Physical ledger after direct-blocker sync: PASS=${counts.PASS}, BLOCKED=${counts.BLOCKED}, NOT_EXECUTED=${counts.NOT_EXECUTED}. Exact direct subset: 5 PASS_READONLY + 20 evidence-backed BLOCKED + 0 unclassified. Exhaustive effectful acceptance remains open.`;
          if(state.current_execution_queue?.incomplete?.[0]) state.current_execution_queue.incomplete[0].detail=`1481 exhaustive physical disposition/effectful acceptance remains open. Physical ledger now PASS=${counts.PASS}, BLOCKED=${counts.BLOCKED}, NOT_EXECUTED=${counts.NOT_EXECUTED}; direct 25 subset is 5 PASS + 20 evidence-backed BLOCKED.`;
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,(k,v)=>v===undefined?undefined:v,2)+'\n');
          fs.writeFileSync(evidencePath,JSON.stringify(evidence,null,2)+'\n');
          fs.writeFileSync(statePath,JSON.stringify(state,(k,v)=>v===undefined?undefined:v,2)+'\n');
          NODE
      - name: Commit ledger sync and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gate25-ledger-sync-once.yml
          git add CURRENT_EXECUTION_STATE.json docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json docs/construction/evidence/GATE25_DIRECT_BLOCKER_LEDGER_SYNC_2026-09-10.json
          git commit -m "chore(gate25): sync direct blockers into physical ledger"
          git push origin HEAD:new
