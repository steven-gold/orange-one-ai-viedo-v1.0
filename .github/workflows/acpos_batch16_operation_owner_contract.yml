name: ACPOS Batch 16 Operation Owner Contract Closure

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-16-operation-owner-contract
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 15 resume boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="dc72b52f0e147cc934ad3aaf87120ae44f2d3018"
          git cat-file -e "$BASE^{commit}"
          drift="$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test -z "$drift" || { echo "WORD DRIFT SINCE BATCH15"; printf '%s\n' "$drift"; exit 1; }
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH15 RESUME BOUNDARY / 31 DOCX / NO WORD DRIFT"

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Preflight executor syntax
        run: python -m py_compile __temp/batch_16_operation_owner_contract.py

      - name: Baseline target DOCX integrity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,json
          files=[
          "02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};report={}
          for fn in files:
              with zipfile.ZipFile(fn) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  for n in xmls: ET.fromstring(z.read(n))
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  text="".join((e.text or "") for e in root.iter(ns+"t"))
              assert "\x00" not in text,(fn,"NUL")
              ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
              assert not ctrl[:20],(fn,"CONTROL",ctrl[:20])
              hits=[x for x in bad if x in text]
              assert not hits,(fn,"MOJIBAKE",hits)
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,"REPLACEMENT")
              report[fn]={"xml_parts":len(xmls),"chars":len(text),"status":"PASS"}
          Path("__batch16_baseline_encoding.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH16 BASELINE DOCX INTEGRITY")
          PY

      - name: Apply Batch 16 canonical contracts
        run: python __temp/batch_16_operation_owner_contract.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch16_remediation_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["pre_definition_gaps"]==122,m
          assert m["unique_controls_touched"]==77,m
          assert m["effectful_fields_closed"]==81,m
          assert m["read_fields_closed"]==21,m
          assert m["operation_fields_closed"]==65,m
          assert m["runtime_owner_fields_closed"]==37,m
          assert m["gaps_closed"]==102,m
          assert m["post_definition_gaps"]==20,m
          assert (m["remaining_action"],m["remaining_gate_including_conflict"],m["remaining_permission"])==(7,8,5),m
          assert m["preserved_sys_gate_conflict"]==1,m
          assert m["public_routes_invented"]==0,m
          assert m["runtime_execution_claimed"] is False,m
          assert len(r["changed_docs"])==14,r["changed_docs"]
          assert len(r["contracts"])==77
          logic=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          lt="\n".join([p.text for p in logic.paragraphs]+[c.text for t in logic.tables for row in t.rows for c in row.cells])
          for token in [
            "ACPOS-20260921-BATCH-16-OPERATION-OWNER-CONTRACT-CLOSURE-V1",
            "EFFECTFUL_EXACT Operation/Owner fields",
            "READ_EXACT Operation/Owner fields",
            "BATCH16_MACHINE_JSON="
          ]: assert token in lt,token
          print("PASS: BATCH16 SEMANTIC 102 CLOSED; DEFINITION GAP 122 -> 20")
          PY

      - name: Convert fourteen DOCX files to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __render_qa_batch16/pdf
          while IFS= read -r f; do
            libreoffice --headless --convert-to pdf --outdir __render_qa_batch16/pdf "$f" >/dev/null
          done <<'EOF'
          02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          EOF

      - name: Post-conversion encoding and CJK audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          r=json.loads(Path("__batch16_remediation_report.json").read_text(encoding="utf-8"))
          files=r["changed_docs"];bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13};cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]");report={}
          for fn in files:
              p=Path(fn);pdf=Path("__render_qa_batch16/pdf")/(p.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(p) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  for n in xmls: ET.fromstring(z.read(n))
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in root.iter(ns+"t"))
              pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              for label,text in [("DOCX",src),("PDF",pdftext)]:
                  assert "\x00" not in text,(fn,label,"NUL")
                  ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
                  assert not ctrl[:20],(fn,label,"CONTROL",ctrl[:20])
                  hits=[x for x in bad if x in text]
                  assert not hits,(fn,label,"MOJIBAKE",hits)
                  assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,label,"REPLACEMENT")
              sc=len(cjk.findall(src));pc=len(cjk.findall(pdftext));assert sc>0,(fn,"NO_SOURCE_CJK")
              ratio=pc/sc;assert ratio>=0.97,(fn,"CJK_RETENTION",sc,pc,ratio)
              report[fn]={"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch16/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH16 ENCODING / CJK RETENTION")
          PY

      - name: Render full geometry and contact sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,math,shutil
          from PIL import Image
          r=json.loads(Path("__batch16_remediation_report.json").read_text(encoding="utf-8"))
          root=Path("__render_qa_batch16");pngroot=root/"png";contact=root/"contact";pngroot.mkdir(exist_ok=True);contact.mkdir(exist_ok=True)
          report={};total_pages=0
          for fn in r["changed_docs"]:
              p=Path(fn);pdf=root/"pdf"/(p.stem+".pdf");out=pngroot/p.stem;out.mkdir(exist_ok=True)
              subprocess.check_call(["pdftoppm","-png","-r","72",str(pdf),str(out/"page")],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              imgs=sorted(out.glob("page-*.png"));assert imgs,(fn,"NO_PNG")
              blank=[];edge=[];thumbs=[]
              for imf in imgs:
                  im=Image.open(imf).convert("L");w,h=im.size
                  mask=im.point(lambda x:255 if x<245 else 0)
                  bbox=mask.getbbox()
                  if bbox is None:blank.append(imf.name)
                  elif bbox[0]<=1 or bbox[1]<=1 or bbox[2]>=w-1 or bbox[3]>=h-1:edge.append((imf.name,bbox,(w,h)))
                  thumb=Image.open(imf).convert("RGB");thumb.thumbnail((180,255));thumbs.append(thumb.copy())
              assert not blank,(fn,"BLANK",blank)
              assert not edge,(fn,"EDGE_CLIP",edge[:10])
              cols=4;cellw=190;cellh=265;rows=math.ceil(len(thumbs)/cols)
              sheet=Image.new("RGB",(cols*cellw,rows*cellh),"white")
              for i,im in enumerate(thumbs):sheet.paste(im,((i%cols)*cellw+5,(i//cols)*cellh+5))
              sheet.save(contact/(p.stem+"_contact.jpg"),quality=82)
              total_pages+=len(imgs);report[fn]={"pages":len(imgs),"blank":0,"edge_clip":0,"status":"PASS"}
              shutil.rmtree(out)
          report["_summary"]={"documents":len(r["changed_docs"]),"pages":total_pages,"blank":0,"edge_clip":0,"status":"PASS"}
          (root/"geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH16 FULL GEOMETRY",report["_summary"])
          PY

      - name: Verify exact Batch 16 Word scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          base="dc72b52f0e147cc934ad3aaf87120ae44f2d3018"
          r=json.loads(Path("__batch16_remediation_report.json").read_text(encoding="utf-8"))
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"--","*.docx"],text=True)
          changed=sorted(x for x in out.splitlines() if x)
          expected=sorted(r["changed_docs"])
          assert changed==expected,{"changed":changed,"expected":expected}
          assert len(changed)==14
          Path("__batch16_changed_word_scope.txt").write_text("\n".join(changed)+"\n",encoding="utf-8")
          print("PASS: EXACT BATCH16 WORD SCOPE = 14")
          PY

      - name: Collect Batch 16 evidence
        shell: bash
        run: |
          mkdir -p __batch16_evidence
          cp __batch16_remediation_report.json __batch16_baseline_encoding.json __batch16_changed_word_scope.txt __batch16_evidence/
          cp __render_qa_batch16/encoding_integrity_report.json __render_qa_batch16/geometry_report.json __batch16_evidence/
          cp -R __render_qa_batch16/pdf __render_qa_batch16/contact __batch16_evidence/
          git rev-parse HEAD > __batch16_evidence/executor_head.txt
          git -c core.quotePath=false status --short > __batch16_evidence/status_before_commit.txt

      - name: Upload Batch 16 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-16-operation-owner-contract-evidence
          path: __batch16_evidence
          retention-days: 1
          if-no-files-found: error

      - name: Commit Batch 16 and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-word-batch-16"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            "02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"
          git rm -f __temp/batch_16_operation_owner_contract.py .github/workflows/acpos_batch16_operation_owner_contract.yml
          rm -rf __batch16_remediation_report.json __batch16_baseline_encoding.json __batch16_changed_word_scope.txt __batch16_evidence __render_qa_batch16
          git diff --cached --name-only
          test "$(git diff --cached --name-only -- '*.docx' | wc -l)" -eq 14
          git commit -m "docs(acpos): bind 102 operation and runtime owner contracts"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH16 COMMITTED AND TEMP TOOLING REMOVED"
