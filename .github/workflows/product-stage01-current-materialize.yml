name: Product Stage01 Current Pre-Stage Materialize
on:
  workflow_dispatch:
    inputs:
      units:
        description: Comma-separated governed units to materialize from canonical Word sources
        required: true
        default: GLOBAL-HOME-SHELL-NAVIGATION,WB01-DASHBOARD
      reason:
        description: Explicit operator authorization for pre-stage materialization only; does not enter Stage-01
        required: true
        default: explicit-clean-stage01-materialization
  workflow_run:
    workflows: ["Product Full Stage Lifecycle Validation"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: product-stage01-current-materialize
  cancel-in-progress: true
jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == '0921acpos')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve effective Stage01 pre-stage request
        id: request
        shell: bash
        env:
          DISPATCH_UNITS: ${{ inputs.units }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_HEAD: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REQ="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml"
            test -s "$REQ" || { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
            python - "$REQ" "$VALIDATED_HEAD" "$VALIDATION_RUN_ID" >> "$GITHUB_OUTPUT" <<'PY'
          import sys,yaml
          p,head,run=sys.argv[1:]
          d=yaml.safe_load(open(p,encoding='utf-8')) or {}
          if d.get('status')!='REQUESTED':
              print('skip=true')
              raise SystemExit(0)
          units=d.get('units') or []
          if isinstance(units,str):
              units=[x.strip() for x in units.split(',') if x.strip()]
          if not units:
              raise SystemExit('BLOCK:STAGE01_PRESTAGE_REQUEST_UNITS_EMPTY')
          print('skip=false')
          print('units='+','.join(map(str,units)))
          print('validated_head='+head)
          print('validation_run_id='+run)
          PY
          else
            test -n "$DISPATCH_UNITS" || { echo "BLOCK:DISPATCH_UNITS_EMPTY"; exit 43; }
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "units=$DISPATCH_UNITS" >> "$GITHUB_OUTPUT"
            echo "validated_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "validation_run_id=MANUAL_DISPATCH_LOCAL_REVALIDATION_REQUIRED" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop when no pending request
        if: steps.request.outputs.skip == 'true'
        run: echo "No pending Stage01 pre-stage request for this successful full-stage validation."
      - name: Resolve exact selected Current governance
        if: steps.request.outputs.skip != 'true'
        id: governance
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          STATUS="$(awk '$1=="status:" {print $2; exit}' "$SEL")"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          test "$STATUS" = "SELECTED_EXACT_CURRENT_SNAPSHOT"
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout exact Current governance
        if: steps.request.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - name: Set up governance Python
        if: steps.request.outputs.skip != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Load exact Current governance
        if: steps.request.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Verify exact-head governance receipts
        if: steps.request.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, yaml
          product=Path('.'); gov=Path('_governance_authority')
          sel=yaml.safe_load((product/'STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml').read_text()) or {}
          head=subprocess.check_output(['git','-C',str(gov),'rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','-C',str(gov),'rev-parse','HEAD^{tree}'],text=True).strip()
          root=gov/'.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml'
          expected={'governance_commit_sha':head,'governance_tree_sha':tree,'root_manifest_sha256':hashlib.sha256(root.read_bytes()).hexdigest()}
          if sel.get('status')!='SELECTED_EXACT_CURRENT_SNAPSHOT': raise SystemExit('BLOCK:CURRENT_GOVERNANCE_SELECTION_NOT_SELECTED')
          for k,v in expected.items():
              if str(sel.get(k) or '')!=v: raise SystemExit('BLOCK:PRESTAGE_EXACT_GOVERNANCE_BINDING_MISMATCH:'+k)
          ev=sel.get('exact_head_validation') or {}
          if ev.get('mother_neutrality_status')!='SUCCESS' or ev.get('stage_internal_validation_status')!='SUCCESS' or ev.get('gate_01_08_result')!='PASS':
              raise SystemExit('BLOCK:EXACT_HEAD_GOVERNANCE_VALIDATION_NOT_PASS')
          if str(ev.get('validated_head_sha') or '')!=head: raise SystemExit('BLOCK:EXACT_HEAD_VALIDATION_RECEIPT_SHA_DRIFT')
          print('PASS: exact Current governance selected')
          PY
      - name: Resolve selected Work Units
        if: steps.request.outputs.skip != 'true'
        id: selected
        env:
          SELECTED_UNITS: ${{ steps.request.outputs.units }}
        run: |
          set -euo pipefail
          WUS=()
          IFS=',' read -ra UNITS <<< "$SELECTED_UNITS"
          for RAW in "${UNITS[@]}"; do
            U="$(echo "$RAW" | xargs)"
            case "$U" in
              GLOBAL-HOME-SHELL-NAVIGATION) WUS+=("WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001") ;;
              WB01-DASHBOARD) WUS+=("WU-STAGE01-WB01-DASHBOARD-CLEAN-001") ;;
              *) echo "BLOCK:UNKNOWN_SELECTED_UNIT:$U"; exit 41 ;;
            esac
          done
          test "${#WUS[@]}" -gt 0
          CSV="$(IFS=,; echo "${WUS[*]}")"
          echo "work_units=$CSV" >> "$GITHUB_OUTPUT"
      - name: Fresh source review, projection and initial Work Unit materialization
        if: steps.request.outputs.skip != 'true'
        env:
          SELECTED_UNITS: ${{ steps.request.outputs.units }}
        run: |
          set -euo pipefail
          python .github/scripts/stage01_current_materialize.py --mode materialize --units "$SELECTED_UNITS" --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
      - name: Materialize exact Current governance load receipts
        if: steps.request.outputs.skip != 'true'
        env:
          SELECTED_WUS: ${{ steps.selected.outputs.work_units }}
          SELECTED_UNITS: ${{ steps.request.outputs.units }}
        run: |
          set -euo pipefail
          IFS=',' read -ra WUS <<< "$SELECTED_WUS"
          for WU in "${WUS[@]}"; do
            python .github/scripts/product_current_governance_load.py --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority" --stage STAGE-01 --work-unit "STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
          done
          python .github/scripts/stage01_current_materialize.py --mode refresh-manifest --units "$SELECTED_UNITS" --product-root "$GITHUB_WORKSPACE"
      - name: Prove clean initial Work Unit admission
        if: steps.request.outputs.skip != 'true'
        env:
          SELECTED_WUS: ${{ steps.selected.outputs.work_units }}
        run: |
          set -euo pipefail
          export GOVERNANCE_SOURCE_ROOT="$GITHUB_WORKSPACE/_governance_authority"
          IFS=',' read -ra WUS <<< "$SELECTED_WUS"
          for WU in "${WUS[@]}"; do
            export STAGE_EXECUTION_ROOT="$GITHUB_WORKSPACE"
            export STAGE_ACTIVE_WORK_UNIT="STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
            export STAGE_CURRENT_SCOPE="STAGE_EXECUTION/STAGE-01/$WU/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"
            python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-01
          done
      - name: Prove zero predecessor runtime dependency
        if: steps.request.outputs.skip != 'true'
        env:
          SELECTED_WUS: ${{ steps.selected.outputs.work_units }}
        run: |
          set -euo pipefail
          IFS=',' read -ra WUS <<< "$SELECTED_WUS"
          for WU in "${WUS[@]}"; do
            python - "$WU" <<'PY'
          import pathlib,sys,yaml
          wu=sys.argv[1]
          root=pathlib.Path('STAGE_EXECUTION/STAGE-01')/wu
          work=yaml.safe_load((root/'WORK_UNIT.yaml').read_text()) or {}
          assert work.get('work_unit_activation_kind')=='INITIAL_STAGE_WORK_UNIT'
          for k in ('predecessor_work_unit_uid','predecessor_work_unit_ref','predecessor_terminal_receipt_ref'):
              assert not str(work.get(k) or '').strip(), (wu,k)
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.yaml','.yml','.json'}: continue
              body=p.read_text(encoding='utf-8')
              if 'WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-001' in body or 'WU-STAGE01-WB01-DASHBOARD-001' in body:
                  raise SystemExit('BLOCK:PREDECESSOR_RUNTIME_REFERENCE:'+str(p))
          print('PASS: zero predecessor runtime dependency',wu)
          PY
          done
      - name: Persist admitted clean pre-stage resume
        if: steps.request.outputs.skip != 'true'
        env:
          SELECTED_UNITS: ${{ steps.request.outputs.units }}
        run: |
          python .github/scripts/stage01_current_materialize.py --mode mark-admitted --units "$SELECTED_UNITS" --product-root "$GITHUB_WORKSPACE"
      - name: Mark workflow-run request consumed
        if: steps.request.outputs.skip != 'true' && github.event_name == 'workflow_run'
        shell: bash
        env:
          VALIDATED_HEAD: ${{ steps.request.outputs.validated_head }}
          VALIDATION_RUN_ID: ${{ steps.request.outputs.validation_run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,yaml
          p=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          d['status']='CONSUMED'
          d['validated_head_sha']=os.environ['VALIDATED_HEAD']
          d['validation_run_id']=os.environ['VALIDATION_RUN_ID']
          p.write_text(yaml.safe_dump(d,sort_keys=False,allow_unicode=True),encoding='utf-8')
          PY
      - name: Commit admitted clean Stage01 pre-stage artifacts
        if: steps.request.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAGE_EXECUTION/STAGE-01 STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW
          git diff --cached --quiet && exit 41
          git commit -m "stage01: materialize selected clean initial Work Units"
          git push origin HEAD:0921acpos
