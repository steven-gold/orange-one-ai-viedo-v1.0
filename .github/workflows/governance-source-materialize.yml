name: Governance Source Exact Materialization

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-source/MATERIALIZE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-exact-source:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - name: Reconstruct and verify exact 75-file source
        run: python .github/governance-source/BOOTSTRAP_MATERIALIZER.py
      - name: Verify materialized path count and zero residue
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .github/governance-source/active/source -type f | wc -l | tr -d ' ')"
          test "$count" = "75"
          test -z "$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' \) -print -quit)"
          echo "PASS: materialized files=$count"
      - name: Commit exact source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/governance-source/active/.gitkeep
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/governance-source/active/source .github/governance-source/active/.gitkeep
          if git diff --cached --quiet; then
            echo 'BLOCK: materializer produced no source commit' >&2
            exit 1
          fi
          staged="$(git diff --cached --name-only)"
          bad="$(printf '%s\n' "$staged" | grep -Ev '^\.github/governance-source/active/(source/|\.gitkeep$)' || true)"
          test -z "$bad" || { echo "BLOCK: unexpected staged paths: $bad" >&2; exit 1; }
          git commit -m 'ci(governance-source): materialize exact verified 75-file source'
          git push origin HEAD:rebuild-v2.1.1
