name: QA01 Staging Final Closure Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-staging-final-closure-once.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authority, visual, registry and residual checks
        run: |
          set -euo pipefail
          git fetch origin new
          git diff --exit-code origin/new -- authority/pages/workspace/QA-01/ACPOS_QA-01_FINAL_LOCKED_ENCODING_DEDUP_CLEAN.yaml src/components/pages/QaVisual.module.css
          ! grep -R --line-number --fixed-strings 'QA-01-ST-CORRECTION-REQUIRED' src/domain/qa src/server/qa src/server/testing src/components/pages/QaControlRuntime.tsx src/components/pages/QaVisual.tsx
          ! grep -R --line-number -E 'QA-01-(BTN|ACT)-.*PUBLISH|QA-01-(BTN|ACT)-GATE-(PASS|FAIL)' src/components/pages/QaVisual.tsx src/components/pages/QaControlRuntime.tsx
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          p='authority/pages/workspace/QA-01/ACPOS_QA-01_FINAL_LOCKED_ENCODING_DEDUP_CLEAN.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          r=d['registries']
          assert len(r['controls'])==87
          assert len(r['actions'])==32
          assert len(r['integration_ports'])==10
          print('QA01_REGISTRY_PASS controls=87 actions=32 ports=10')
          PY
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  chromium:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        scenario: [CORRECTION, MANUAL_REQUIRED, AUTO, PRODUCTION]
    runs-on: ubuntu-latest
    env:
      ACPOS_QA_TEST_SCENARIO: ${{ matrix.scenario == 'PRODUCTION' && 'CORRECTION' || matrix.scenario }}
      NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ${{ matrix.scenario == 'PRODUCTION' && 'PRODUCTION' || 'TEST' }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Install ephemeral Playwright only
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact isolated QA-01 flow
        run: |
          npm run dev -- -p 3500 > /tmp/next.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://localhost:3500/qa >/dev/null 2>&1 && break; sleep 0.5; done
          cat > qa01-final.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const ctl=(p,id)=>p.locator(`[data-control-id="${id}"]`);
          const val=async(p,id)=>((await ctl(p,id).locator('strong').textContent())||'').trim();
          async function click(p,id){const e=ctl(p,id);await e.waitFor({state:'visible'});await p.waitForFunction(id=>{const x=document.querySelector(`[data-control-id="${id}"]`);return x instanceof HTMLButtonElement&&!x.disabled},id,{timeout:15000});await e.click();}
          async function state(p,s){await p.waitForFunction(s=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')===s,s,{timeout:15000});}
          async function dump(p,label){console.log(label,JSON.stringify({state:await p.locator('[data-page-uid="QA-01"]').getAttribute('data-page-state'),stage:await p.locator('[data-page-uid="QA-01"]').getAttribute('data-current-stage'),mode:await p.locator('[data-page-uid="QA-01"]').getAttribute('data-review-mode'),gate:await val(p,'QA-01-FLD-GATE-STATUS'),score:await val(p,'QA-01-FLD-TOTAL-SCORE'),manual:await val(p,'QA-01-FLD-MANUAL-STATE'),decision:await val(p,'QA-01-FLD-MANUAL-DECISION'),progress:await val(p,'QA-01-FLD-AUTO-PROGRESS'),error:await val(p,'QA-01-FLD-ERROR')}));}
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1600,height:1200}});const pageErrors=[];p.on('pageerror',e=>pageErrors.push(String(e)));try{
            await p.goto('http://localhost:3500/qa',{waitUntil:'networkidle'});await p.waitForSelector('[data-page-uid="QA-01"]');const sc=process.env.SCENARIO;
            assert(await p.locator('[data-page-uid="QA-01"]').getAttribute('data-authority-controls')==='87','authority control marker mismatch');assert(await p.locator('[data-page-uid="QA-01"]').getAttribute('data-registry-valid')==='true','registry invalid');
            if(sc!=='PRODUCTION')await p.waitForFunction(()=>{const e=document.querySelector('[data-control-id="QA-01-BTN-AUTO-START"]');return e instanceof HTMLButtonElement&&!e.disabled},null,{timeout:15000});
            if(sc==='CORRECTION'){
              await p.getByRole('button',{name:'MANUAL',exact:true}).click();await click(p,'QA-01-BTN-START-REVIEW');await state(p,'QA-01-ST-FAIL');assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='82','initial AI score mismatch');assert(await val(p,'QA-01-FLD-GATE-STATUS')==='FAIL','governed FAIL missing');const finding=ctl(p,'QA-01-BTN-FINDING-CREATE');assert(await finding.isDisabled(),'Finding must stay blocked without registry');assert(await finding.getAttribute('data-disabled-reason')==='AUTHORITY_GAP_QA_ISSUE_CATEGORY_REGISTRY','Finding authority gap reason mismatch');await ctl(p,'QA-01-INP-CORR-ACTION').fill('[TEST] original owner correction');await click(p,'QA-01-BTN-CORRECTION');await state(p,'QA-01-ST-CORRECTION');assert(await val(p,'QA-01-FLD-FAILED-VERSION')==='TEST-EDIT-OUTPUT-001','failed exact output mismatch');assert(await val(p,'QA-01-FLD-NEW-VERSION')==='TEST-EDIT-OUTPUT-002','verified new exact output mismatch');await click(p,'QA-01-BTN-RECHECK');await state(p,'QA-01-ST-PASS');assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='98','recheck AI score mismatch');assert(await val(p,'QA-01-FLD-GATE-STATUS')==='PASS','governed PASS missing');await click(p,'QA-01-BTN-RELEASE-CREATE');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-REL-PACKAGE"] strong')?.textContent==='TEST-RELEASE-CANDIDATE-001',null,{timeout:15000});assert(await p.locator('[data-action-uid="QA-01-ACT-GATE-PASS"],[data-action-uid="QA-01-ACT-GATE-FAIL"]').count()===0,'direct PASS/FAIL control exposed');assert(await p.locator('[data-control-id*="PUBLISH"],[data-action-uid*="PUBLISH"]').count()===0,'Publish exposed');await dump(p,'QA01_CORRECTION_FINAL');
            }else if(sc==='MANUAL_REQUIRED'){
              await p.getByRole('button',{name:'MANUAL',exact:true}).click();await click(p,'QA-01-BTN-START-REVIEW');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-GATE-STATUS"] strong')?.textContent==='MANUAL_REVIEW_REQUIRED',null,{timeout:15000});assert(await val(p,'QA-01-FLD-TOTAL-SCORE')==='97','manual AI score mismatch');const mb=p.locator('[data-component-uid="QA-01-CMP-MANUAL-DECISION"] button');assert(await mb.count()===2,'Manual Review mutation count must be exactly 2');const acts=await mb.evaluateAll(es=>es.map(e=>e.getAttribute('data-action-uid')).sort());assert(JSON.stringify(acts)===JSON.stringify(['QA-01-ACT-MANUAL-MODIFY','QA-01-ACT-MANUAL-PASS'].sort()),'Manual Review action IDs mismatch');assert(await p.locator('[data-component-uid="QA-01-CMP-SCORE"] input,[data-component-uid="QA-01-CMP-SCORE"] select,[data-component-uid="QA-01-CMP-SCORE"] textarea,[data-component-uid="QA-01-CMP-SCORE"] button').count()===0,'human score input/action exposed');await click(p,'QA-01-BTN-MANUAL-MODIFY');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-MANUAL-DECISION"] strong')?.textContent==='MODIFY_IN_PROGRESS',null,{timeout:15000});assert(await val(p,'QA-01-FLD-MANUAL-STATE')==='OPEN','Manual Modify must keep case open');await click(p,'QA-01-BTN-MANUAL-PASS');try{await state(p,'QA-01-ST-PASS')}catch(e){await dump(p,'QA01_MANUAL_FAILURE');throw e}assert(await val(p,'QA-01-FLD-MANUAL-STATE')==='CLOSED/PASSED','Manual case not closed');assert(await val(p,'QA-01-FLD-GATE-STATUS')==='PASS','Manual Pass did not re-evaluate normal gate');await dump(p,'QA01_MANUAL_FINAL');
            }else if(sc==='AUTO'){
              assert(await ctl(p,'QA-01-BTN-START-REVIEW').count()===0,'Manual Start visible in AUTO');const q=p.locator('[data-control-id="QA-01-LIST-REVIEWS"] [data-item-ref]');assert(await q.count()===2,'AUTO queue count mismatch');for(let i=0;i<2;i++)assert(await q.nth(i).isDisabled(),'AUTO queue may not be manually reordered/selected');await click(p,'QA-01-BTN-AUTO-START');await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-AUTO-PROGRESS"] strong')?.textContent==='2/2',null,{timeout:15000});assert((await val(p,'QA-01-FLD-ERROR')).includes('QA_LOW_SCORE_WARNING:TEST-QA-TASK-002'),'low-score-only warning missing');assert(await p.locator('[data-control-id*="PUBLISH"],[data-action-uid*="PUBLISH"]').count()===0,'AUTO Publish exposed');await dump(p,'QA01_AUTO_FINAL');
            }else{
              await p.waitForFunction(()=>document.querySelector('[data-control-id="QA-01-FLD-ERROR"] strong')?.textContent?.includes('UI_PROJECTION_RUNTIME_NOT_BOUND'),null,{timeout:15000});const r=await p.request.post('http://localhost:3500/v1/qa/reviews',{data:{project_id:'X',topic_id:'Y',output_version_id:'Z',qa_profile_id:'Q'}});assert(r.status()===503,`Production direct QA review expected 503 got ${r.status()}`);const body=await r.json();assert(body.reason_code==='QA_RUNTIME_NOT_BOUND',`Production fail-closed reason mismatch ${JSON.stringify(body)}`);await dump(p,'QA01_PRODUCTION_FINAL');
            }
            assert(pageErrors.length===0,`page errors: ${pageErrors.join(' | ')}`);console.log(`QA01_${sc}_PASS`);
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa01-final.cjs
