name: CORE01 lock boundary rerun once
on:
  push:
    paths:
      - '.github/workflows/core01-lock-boundary-rerun-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch lock/review actions to registered payload adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/CoreVisual.tsx'); s=p.read_text()
          anchor='import { requestCoreCandidateCreatePayload, requestCoreCandidateDecisionPayload } from "@/domain/core/coreCandidatePayloadAdapter";'
          add=anchor+'\nimport { requestCoreLockCommandPayload, type CoreLockCommandKind } from "@/domain/core/coreLockCommandPayloadAdapter";'
          assert anchor in s and 'coreLockCommandPayloadAdapter' not in s
          s=s.replace(anchor,add,1)
          req='  const requireBlueprintVersionRef = () => clientState.blueprint_version_ref || (reportBlock("CORE-01-ERR-BLUEPRINT-001:EXACT_BLUEPRINT_VERSION_REF_REQUIRED"), null);'
          s=s.replace(req,req+'\n  const requireDnaVersionRef = () => clientState.dna_version_ref || (reportBlock("CORE-01-ERR-DNA-LOCK-001:EXACT_DNA_VERSION_REF_REQUIRED"), null);',1)
          marker='  const runControl = (id: string) => {'
          helper='''  const runLockCommand = async (action: CoreActionUid, kind: CoreLockCommandKind) => {\n    if (kind === "DNA_LOCK" && !requireDnaVersionRef()) return;\n    if ((kind === "CORE_REVIEW" || kind === "MOTHER_LOCK") && !requireProjectVersionRef()) return;\n    if (kind === "CHILD_LOCK" && !requireBlueprintVersionRef()) return;\n    const payload = await requestCoreLockCommandPayload({ kind, project_id: clientState.project_id, project_version_ref: clientState.project_version_ref, dna_version_ref: clientState.dna_version_ref, blueprint_version_ref: clientState.blueprint_version_ref, topic_id: clientState.topic_id, evidence_refs: clientState.decision_evidence_refs });\n    if (!payload.ok) {\n      const error = kind === "DNA_LOCK" ? "CORE-01-ERR-DNA-LOCK-001" : kind === "CORE_REVIEW" ? "CORE-01-ERR-CONTEXT-001" : "CORE-01-ERR-LOCK-CONTRACT-001";\n      reportBlock(`${error}:${payload.reason_code}`);\n      return;\n    }\n    await runServerAction(action, { payload: payload.payload });\n  };\n\n'''
          assert marker in s; s=s.replace(marker,helper+marker,1)
          old='''      case "CORE-01-ACT-DNA-LOCK-REQUEST": case "CORE-01-ACT-CORE-REVIEW-SUBMIT": case "CORE-01-ACT-MOTHER-LOCK-REQUEST": if (!requireProjectId()) return; void runServerAction(action); return;\n      case "CORE-01-ACT-CHILD-LOCK-REQUEST": if (!requireBlueprintVersionRef()) return; void runServerAction(action); return;'''
          new='''      case "CORE-01-ACT-DNA-LOCK-REQUEST": void runLockCommand(action,"DNA_LOCK"); return;\n      case "CORE-01-ACT-CORE-REVIEW-SUBMIT": void runLockCommand(action,"CORE_REVIEW"); return;\n      case "CORE-01-ACT-MOTHER-LOCK-REQUEST": void runLockCommand(action,"MOTHER_LOCK"); return;\n      case "CORE-01-ACT-CHILD-LOCK-REQUEST": void runLockCommand(action,"CHILD_LOCK"); return;'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Contract and homepage locks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const core=fs.readFileSync('src/components/pages/CoreVisual.tsx','utf8');
          const adapter=fs.readFileSync('src/domain/core/coreLockCommandPayloadAdapter.ts','utf8');
          const port=fs.readFileSync('src/domain/core/coreClientPort.ts','utf8');
          const state=fs.readFileSync('src/domain/core/coreClientState.ts','utf8');
          if(core.includes('case "CORE-01-ACT-DNA-LOCK-REQUEST": case "CORE-01-ACT-CORE-REVIEW-SUBMIT"')) throw new Error('old empty lock calls remain');
          for(const x of ['DNA_LOCK','CORE_REVIEW','MOTHER_LOCK','CHILD_LOCK','REGISTERED_COMMAND_SCHEMA_ADAPTER_NOT_BOUND']) if(!adapter.includes(x)) throw new Error('lock adapter missing '+x);
          for(const x of ['DNA_LOCK_REGISTERED_COMMAND_SCHEMA_PAYLOAD_REQUIRED','CORE_REVIEW_REGISTERED_COMMAND_SCHEMA_PAYLOAD_REQUIRED','MOTHER_LOCK_REGISTERED_COMMAND_SCHEMA_PAYLOAD_REQUIRED','CHILD_LOCK_REGISTERED_COMMAND_SCHEMA_PAYLOAD_REQUIRED']) if(!port.includes(x)) throw new Error('port lock guard missing '+x);
          if(!state.includes('dna_version_ref')) throw new Error('DNAVersion exact ref missing');
          NODE
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium verifies lock buttons emit zero empty POST
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          (npm run start -- -p 3000 >/tmp/core-lock.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/core >/dev/null && break; sleep 1; done
          cat > check.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const posts = [];
            page.on('request', request => {
              if (request.method() === 'POST' && (request.url().includes('requestdnalock') || request.url().includes('submitcorereview') || request.url().includes('/locks/'))) posts.push(request.url());
            });
            await page.goto('http://127.0.0.1:3000/core', { waitUntil: 'networkidle' });
            const cases = [
              ['CORE-01-BTN-DNA-LOCK', 'EXACT_DNA_VERSION_REF_REQUIRED'],
              ['CORE-01-BTN-CORE-REVIEW', 'REQUIRED_PROJECT_VERSION_REF_MISSING'],
              ['CORE-01-BTN-PROJECT-LOCK', 'REQUIRED_PROJECT_VERSION_REF_MISSING'],
              ['CORE-01-BTN-CHILD-LOCK', 'EXACT_BLUEPRINT_VERSION_REF_REQUIRED'],
            ];
            for (const [id, reason] of cases) {
              await page.locator(`[data-control-id="${id}"]`).click();
              await page.waitForFunction(expected => document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes(expected), reason);
              if (posts.length) throw new Error(`${id} emitted empty lock POST`);
            }
            console.log('CORE01_LOCK_BOUNDARY_PASS posts=0');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node check.cjs
          rm check.cjs
      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/core01-lock-boundary-once.yml .github/workflows/core01-lock-boundary-rerun-once.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/CoreVisual.tsx .github/workflows/core01-lock-boundary-once.yml .github/workflows/core01-lock-boundary-rerun-once.yml
          git commit -m "fix(core): close lock and review payload boundary"
          git push origin HEAD:new
