gates:
- gate_uid: DEV-01-GATE-PAGE
  condition: identity + page:admin:DEV-01 VIEW + enterprise_development effective backend L1 + scope + condition + audit
- gate_uid: DEV-01-GATE-DISCOVERY-START
  condition: page gate + outreach.discovery.configure + valid existing StartCompanyDiscoveryRequest + Allowed Source + Rate/Policy
    pass + expected_version/idempotency where required
- gate_uid: DEV-01-GATE-DISCOVERY-RUNNING
  condition: page gate + outreach.discovery.configure + exact discovery job state RUNNING + state_guard + expected_version
    + idempotency + audit
- gate_uid: DEV-01-GATE-DISCOVERY-PAUSED
  condition: page gate + outreach.discovery.configure + exact discovery job state PAUSED + state_guard + expected_version
    + idempotency + audit
- gate_uid: DEV-01-GATE-DIRECTORY-READ
  condition: page gate + outreach.directory.read + authorized scope
- gate_uid: DEV-01-GATE-MERGE
  condition: page gate + outreach.directory.merge + two or more identity-resolved candidate refs + source evidence + preview
    operation available
- gate_uid: DEV-01-GATE-MERGE-CONFIRM
  condition: merge preview is current + explicit confirmation + expected_version + idempotency + audit; destructive delete
    forbidden
- gate_uid: DEV-01-GATE-EXPORT
  condition: page gate + exact export permission + classification/export policy + authorized scope
- gate_uid: DEV-01-GATE-MESSAGE-WRITE
  condition: page gate + outreach.message.write + exact audience/company context + governed candidate schema + personal-data
    policy pass
- gate_uid: DEV-01-GATE-MESSAGE-REVIEW
  condition: page gate + outreach.message.review + exact Candidate/version + policy result + current review context
- gate_uid: DEV-01-GATE-CAMPAIGN
  condition: page gate + outreach.batch.create + recipient source resolved + inclusion/exclusion + suppression check + existing
    campaign payload schema
- gate_uid: DEV-01-GATE-CAMPAIGN-APPROVAL
  condition: page gate + outreach.batch.approve + exact Campaign state REVIEW + recipient preview + suppression + content
    version + expected_version + idempotency + audit
- gate_uid: DEV-01-GATE-DELIVERY-READ
  condition: page gate + outreach.send.configure + authorized delivery projection
- gate_uid: DEV-01-GATE-DISPATCH
  condition: page gate + outreach.send.dispatch + exact Campaign state APPROVED + one-recipient-per-delivery contract + To
    count=1 + CC/BCC empty + suppression pass + delivery policy/schedule/rate pass + expected_version + idempotency + audit
- gate_uid: DEV-01-GATE-KILL-SWITCH
  condition: page gate + ops.kill_switch + explicit target scope + high-risk confirmation + reason + expected_version + idempotency
    + state_guard + audit; only render when applicable
