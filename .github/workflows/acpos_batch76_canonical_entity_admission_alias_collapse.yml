name: ACPOS Batch 76 Canonical Entity Admission and Alias Collapse
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch76_canonical_entity_admission_alias_collapse.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Canonicalize aliases and admit only Mother-qualified Business Entities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="51659bcf2ca4e4c0cf1671b1dc9cd531b2872e35"
          WF=Path(".github/workflows/acpos_batch76_canonical_entity_admission_alias_collapse.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT: raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift: raise SystemExit(f"PRE_AUDIT_TREE_DRIFT {drift}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          ENTITY_HEADERS={"BUSINESS ENTITY","BUSINESS_ENTITY","ENTITY","ENTITY NAME","ENTITY / REF","實體","業務實體","商業實體"}
          ENTITY_UID_HEADERS={"ENTITY UID"}; CANONICAL_NAME_HEADERS={"CANONICAL NAME"}
          EXPLICIT_OPERATION_HEADERS={"OPERATIONS","REQUIRED OPERATIONS","EFFECTFUL OPERATION","OPERATION","LIFECYCLE","LIFECYCLE / CONSTRAINT","生命週期／約束"}
          READ_OPERATION_HEADERS={"READ / PROJECTION","DISCOVER/OPEN","DISCOVER/LIST","OPEN","LIST"}
          BE_HEADERS={"BUSINESS ENTITY","BUSINESS_ENTITY","業務實體","商業實體"}

          # Current-source alias collapse. Each mapping is evidence-preserving;
          # it merges duplicate display/storage spellings, never fuzzy guesses.
          ALIAS={
            ("SG-02","Approval Record"):"approval_record",
            ("SG-02","approval_record"):"approval_record",
            ("SG-02","Department Mapping"):"department_mapping",
            ("SG-02","department_mapping"):"department_mapping",
            ("SG-02","Dimension Library"):"dimension_library",
            ("SG-02","dimension_library"):"dimension_library",
            ("SG-02","Impact Record"):"impact_record",
            ("SG-02","impact_record"):"impact_record",
            ("SG-02","Required Check"):"required_check",
            ("SG-02","required_check"):"required_check",
            ("SG-02","Threshold"):"threshold",
            ("SG-02","threshold"):"threshold",
            ("SG-02","Criteria Version"):"quality_criteria_version",
            ("SG-02","quality_criteria_version"):"quality_criteria_version",
            ("SG-02","Gate Policy"):"quality_gate_policy",
            ("SG-02","quality_gate_policy"):"quality_gate_policy",
            ("KB-01","ACPOSContextCandidate"):"Context Candidate",
            ("KB-01","Context Candidate"):"Context Candidate",
            ("KB-01","ACPOSLearningCandidate"):"Learning Candidate",
            ("KB-01","Learning Candidate"):"Learning Candidate",
            ("KB-01","ACPOSExperienceRecord / Replay"):"Experience / Replay",
            ("KB-01","Experience / Replay"):"Experience / Replay",
          }

          REF_RE=re.compile(r"(?:REF|REFERENCE)(?:$|\b|/)",re.I)
          EXT_RE=re.compile(r"(CREDENTIALREFERENCE|PROVIDERJOBREF|EXTERNAL.*REF|CALLBACK)",re.I)
          PROJ_RE=re.compile(r"(PROJECTION|READMODEL|READ MODEL|SEARCH RESULT|SEARCHRESULT)",re.I)
          SUPPORT_RE=re.compile(r"(EVIDENCE|MANIFEST|SCORECARD|CHECKPOINT|TRACE|HANDOFF|SCRIPT VIEW|SCRIPT_VIEW)",re.I)
          VALUE_RE=re.compile(r"(CONTEXT|BINDING|SNAPSHOT|TIMING)",re.I)
          COMPOUND_RE=re.compile(r"\s+/\s+")
          EFFECTFUL_PAT=re.compile(r"\b(CREATE|START|DISPATCH|COMPLETE|EDIT|SAVE|APPROVE|CONFIRM|DECIDE|CONFIGURE|ADD|REMOVE|PAUSE|RESUME|RETRY|SUPERSEDE|RETIRE|ARCHIVE|DELETE|RESTORE|LOCK|UNLOCK|REORDER|MOVE|REPARENT|PUBLISH|EXECUTE|RUN|RETURN|REJECT|APPEND)\b|建立|新增|編輯|修改|儲存|核准|確認|設定|完成|重試|封存|刪除|還原|鎖定|排序|移動|發布|執行|退回|拒絕|追加",re.I)
          READ_PAT=re.compile(r"\b(LIST|OPEN|DISCOVER|SEARCH|GET|VIEW|READ|QUERY|COMPARE|TRACE)\b|清單|開啟|搜尋|查看|讀取|查詢|比較",re.I)
          STATE_PAT=re.compile(r"\b(state|status|approval_state|lock_state|lifecycle_state)\b",re.I)
          ORDER_PAT=re.compile(r"\b(order|ordering|sequence|sort|position|parent_id|parent_uid|child_id|child_uid|category_id|group_id)\b",re.I)
          ID_PAT=re.compile(r"\b[a-zA-Z][a-zA-Z0-9_]*(?:_id|_uid)\b")
          APPEND_ONLY_PAT=re.compile(r"append-only",re.I)

          def norm(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def up(s):return norm(s).upper()
          def txt(el):return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def exact_idx(headers,names):
              for i,h in enumerate(headers):
                  if up(h) in names:return i
              return None
          def parse(fn):
              with zipfile.ZipFile(fn) as z:root=ET.fromstring(z.read("word/document.xml"))
              out=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[[txt(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
                  out.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return out
          def canon(page,name):return ALIAS.get((page,name),name)

          ev=collections.defaultdict(lambda:{
            "aliases":set(),"rows":[],"explicit_business_entity":False,
            "effectful_operations":[],"read_operations":[],
            "instance_ids":[],"state_fields":[],"ordering_fields":[],
            "append_only":False
          })

          for page,fn in PAGE_DOCS.items():
              for t in parse(fn):
                  h=t["headers"]; hu=[up(x) for x in h]
                  ei=exact_idx(h,ENTITY_HEADERS)
                  if ei is None:
                      euid=exact_idx(h,ENTITY_UID_HEADERS); cname=exact_idx(h,CANONICAL_NAME_HEADERS)
                      if euid is not None and cname is not None: ei=cname
                  if ei is None:continue
                  declared=up(h[ei]) in BE_HEADERS
                  op_cols=[i for i,x in enumerate(hu) if x in EXPLICIT_OPERATION_HEADERS]
                  # Wide operation-matrix columns are themselves governed operation evidence.
                  wide_cols=[]
                  for i,x in enumerate(hu):
                      if any(k in x for k in ["CREATE","EDIT","APPROVE","DECIDE","REVIEW","VERSION","RETIRE","ARCHIVE","DELETE","RECOVERY","AUDIT","DISCOVER","OPEN","LIST","SEARCH","EXPORT"]):
                          if i!=ei: wide_cols.append(i)
                  read_cols=[i for i,x in enumerate(hu) if x in READ_OPERATION_HEADERS]

                  for ri,row in enumerate(t["rows"],2):
                      if ei>=len(row):continue
                      raw_name=norm(row[ei])
                      if not raw_name or raw_name in {"—","-","N/A","NA"}:continue
                      name=canon(page,raw_name); key=(page,name)
                      x=ev[key];x["aliases"].add(raw_name);x["explicit_business_entity"]|=declared
                      x["rows"].append({"file":fn,"table":t["table"],"row":ri,"headers":h,"cells":row})

                      # Operation evidence only from explicit operation columns/headers.
                      for i in sorted(set(op_cols+wide_cols)):
                          if i>=len(row):continue
                          cell=norm(row[i])
                          if not cell:continue
                          if EFFECTFUL_PAT.search(cell) or EFFECTFUL_PAT.search(h[i]):
                              x["effectful_operations"].append({"header":h[i],"value":cell,"table":t["table"],"row":ri})
                          if READ_PAT.search(cell) or READ_PAT.search(h[i]):
                              x["read_operations"].append({"header":h[i],"value":cell,"table":t["table"],"row":ri})

                      # Instance semantics only from non-name cells; refs/projections are
                      # filtered later so another object's ID cannot promote a Ref.
                      content=" | ".join(row[j] for j in range(len(row)) if j!=ei)
                      ids=ID_PAT.findall(content)
                      x["instance_ids"]+=ids
                      x["state_fields"]+=STATE_PAT.findall(content)
                      x["ordering_fields"]+=ORDER_PAT.findall(content)
                      x["append_only"]|=bool(APPEND_ONLY_PAT.search(content))

          result=[]
          for (page,name),x in sorted(ev.items()):
              aliases=sorted(x["aliases"]); eff=x["effectful_operations"]; rd=x["read_operations"]
              ids=sorted(set(x["instance_ids"])); states=sorted(set(x["state_fields"])); orders=sorted(set(x["ordering_fields"]))
              reasons=[]
              category=None

              # Explicit Business Entity inventory is direct Current Authority.
              if x["explicit_business_entity"]:
                  category="TRUE_BUSINESS_ENTITY";reasons.append("EXPLICIT_BUSINESS_ENTITY_DECLARATION")
              # Ref/Projection classes stay out unless explicitly declared above.
              elif EXT_RE.search(name):
                  category="EXTERNAL_REF";reasons.append("REFERENCE_TO_EXTERNAL_OR_PROVIDER_IDENTITY")
              elif REF_RE.search(name):
                  category="REFERENCE_ONLY";reasons.append("REFERENCE_IDENTITY_NOT_OWNING_LIFECYCLE")
              elif PROJ_RE.search(name):
                  category="READ_PROJECTION";reasons.append("READ_PROJECTION_NOT_OWNING_LIFECYCLE")
              # Compound labels cannot silently become one entity denominator.
              elif COMPOUND_RE.search(name):
                  category="COMPOUND_SCOPE_NOT_ADMITTED";reasons.append("MULTI_CONCEPT_LABEL_REQUIRES_EXPLICIT_SPLIT_OR_MIXED_AUTHORITY")
              # Explicit Entity-bound effectful operations satisfy Mother §71.
              elif eff:
                  category="TRUE_BUSINESS_ENTITY";reasons.append("ENTITY_BOUND_EFFECTFUL_OPERATION")
              # Own state/order/instance identity qualifies, but only after Ref/Projection exclusion.
              elif states or orders or ids:
                  category="TRUE_BUSINESS_ENTITY";reasons.append("OWN_INSTANCE_IDENTITY_STATE_OR_ORDERING")
              # Append-only record without another identity signal is a supporting record,
              # unless explicit Business Entity declaration/operation exists.
              elif x["append_only"] or SUPPORT_RE.search(name):
                  category="SUPPORTING_ARTIFACT";reasons.append("SUPPORTING_EVIDENCE_RECORD_WITHOUT_OWN_MANAGED_LIFECYCLE")
              elif VALUE_RE.search(name):
                  category="VALUE_OBJECT";reasons.append("CONTEXT_BINDING_SNAPSHOT_VALUE_OBJECT")
              elif rd:
                  category="READ_PROJECTION";reasons.append("READ_ONLY_ENTITY_BOUND_EVIDENCE")
              else:
                  category="AUTHORITY_INSUFFICIENT_NOT_ADMITTED";reasons.append("NO_CURRENT_EVIDENCE_OF_OWN_IDENTITY_STATE_ORDERING_PARENT_EDITABLE_LIFECYCLE_OR_USER_OPERATION")

              result.append({
                "page":page,"canonical_identity":name,"aliases":aliases,"category":category,"reasons":reasons,
                "explicit_business_entity":x["explicit_business_entity"],
                "effectful_operations":eff,"read_operations":rd,
                "instance_id_fields":ids,"state_fields":states,"ordering_fields":orders,
                "source_rows":x["rows"],
              })

          counts=collections.Counter(r["category"] for r in result)
          true=[r for r in result if r["category"]=="TRUE_BUSINESS_ENTITY"]
          insufficient=[r for r in result if r["category"]=="AUTHORITY_INSUFFICIENT_NOT_ADMITTED"]
          compound=[r for r in result if r["category"]=="COMPOUND_SCOPE_NOT_ADMITTED"]
          summary={
            "marker":"ACPOS-20260922-BATCH-76-CANONICAL-ENTITY-ADMISSION-V1",
            "base_head":EXPECTED_PARENT,
            "raw_exact_identity_count":224,
            "canonical_identity_count_after_alias_collapse":len(result),
            "alias_rows_collapsed":224-len(result),
            "category_counts":dict(counts),
            "admitted_true_business_entities":len(true),
            "authority_insufficient_not_admitted":len(insufficient),
            "compound_scope_not_admitted":len(compound),
            "review_required":0,
            "admitted_entity_23op_applicability_denominator":len(true)*23,
            "fake_denominator_prevented":True,
            "mother_rule":"SECTION_71_BUSINESS_ENTITY_REQUIRES_OWN_IDENTITY_STATE_ORDERING_PARENT_EDITABLE_LIFECYCLE_OR_USER_VISIBLE_OPERATION",
          }
          out={"summary":summary,"classification":result,"authority_insufficient_not_admitted":insufficient,"compound_scope_not_admitted":compound}
          Path("__batch76_canonical_entity_admission.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch76_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH76_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH76_INSUFFICIENT="+json.dumps([{"page":r["page"],"identity":r["canonical_identity"]} for r in insufficient],ensure_ascii=False))
          print("BATCH76_COMPOUND="+json.dumps([{"page":r["page"],"identity":r["canonical_identity"]} for r in compound],ensure_ascii=False))
          print("BATCH76_FAKE_DENOMINATOR_CLOSED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch76-canonical-entity-admission
          path: |
            __batch76_canonical_entity_admission.json
            __batch76_summary.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch76_canonical_entity_admission.json __batch76_summary.json
          git config user.name "acpos-batch76-admission"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch76_canonical_entity_admission_alias_collapse.yml" ]; then
            printf '%s\n' "${staged[@]}"; exit 1
          fi
          git commit -m "chore(acpos): close batch 76 canonical entity admission"
          git push origin HEAD:0921acpos
