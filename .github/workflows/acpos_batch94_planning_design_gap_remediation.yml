      - name: Preliminary render modified DOCX
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fi
          mkdir -p __render94/pdf __render94/png
          git -c core.quotepath=false diff --name-only 93241332f4de47a0875ce6ea2d245f9281585879 | grep '\.docx$' > /tmp/changed94.txt
          while IFS= read -r f; do
            libreoffice --headless --convert-to pdf --outdir __render94/pdf "$f" >/tmp/lo94.log 2>&1 || { cat /tmp/lo94.log; exit 1; }
          done < /tmp/changed94.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pdfs=sorted(Path("__render94/pdf").glob("*.pdf"))
          if len(pdfs)!=18:raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          pages={}
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","110",str(pdf),str(Path("__render94/png")/slug)])
              pages[pdf.name]=len(list(Path("__render94/png").glob(slug+"-*.png")))
          pngs=list(Path("__render94/png").glob("*.png"))
          if not pngs:raise SystemExit("NO_PNG")
          Path("__batch94_render_manifest.json").write_text(json.dumps({"pdfs":len(pdfs),"pngs":len(pngs),"pages":pages},ensure_ascii=False,indent=2))
          print("BATCH94_RENDER="+json.dumps({"pdfs":len(pdfs),"pngs":len(pngs),"pages":pages},ensure_ascii=False,sort_keys=True))
          PY
