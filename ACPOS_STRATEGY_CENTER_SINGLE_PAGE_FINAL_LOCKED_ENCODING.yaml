- Page-owned global sidebar ordering
- Page-owned sibling menu ordering
- Recreate STR-02 as standalone current frontend page
- Recreate STR-03 as standalone current frontend page
- Recreate STR-04 as standalone current frontend page
- Recreate STR-05 as standalone current frontend page
- Recreate STR-06 as standalone current frontend page
- Second Strategy Center
- Second StrategyService
- Second StrategyFactPackService
- Direct operational write from STR-01
- Present inference as fact
- Use playbook as direct publish command
- Automatic project or budget change from opportunity
- Direct canon lock/task/budget/publish write from decision lab
- Manual retype of read-model data
- Unregistered write
- Unregistered API/path/permission inference
- Mock/fake strategy data
- Cross-source payload union inference
acceptance:
- uid: STR-CURRENT-ACC-01
  name: Single Current Page
  condition: Only admin:STR-01 renders as current Strategy Center frontend navigation target.
- uid: STR-CURRENT-ACC-02
  name: Five Current Views
  condition: 戰略總覽 / 情報與 Fact / 平台 Playbook / 趨勢與機會 / 決策實驗室 all exist inside the same current page.
- uid: STR-CURRENT-ACC-03
  name: R9 Source Coverage
  condition: STR-01~STR-06 source responsibilities, owners, sections, actions and prohibitions remain traceable.
- uid: STR-CURRENT-ACC-04
  name: No Menu Order Collision
  condition: Page files do not define global/sibling sidebar order; only Global Navigation Authority may order L1/L2 items.
- uid: STR-CURRENT-ACC-05
  name: No Legacy Standalone Navigation
  condition: STR-02~STR-06 are source aliases/registry references only and cannot render standalone current frontend navigation.
- uid: STR-CURRENT-ACC-06
  name: Action Source Isolation
  condition: Actions in combined views retain their originating page/service/schema binding and are never merged into guessed
    payloads.
- uid: STR-CURRENT-ACC-07
  name: Truthful Strategy Data
  condition: No inference-as-fact, fake confidence, mock candidates, fake health, or invented cost/capacity data.
- uid: STR-CURRENT-ACC-08
  name: Decision Boundary
  condition: Decision Lab cannot directly write canon lock, task, budget or publish state; handoff remains governed.
- uid: STR-CURRENT-ACC-09
  name: Truthful Runtime
  condition: Navigation/control/permission remap and runtime/E2E remain NOT_EXECUTED until actual implementation and tests
    exist.
construction_gate:
  static_ui_spec_ready: true
  effectful_runtime_ready: false
  before_runtime_enablement_required:
  - Global Navigation Registry update for one current Strategy Center target
  - Legacy STR-02~06 frontend navigation retirement
  - Page/Section/Control resource remap
  - Permission resource remap
  - View-to-source operation binding verification
  - State/server gate verification
  - Functional regression for all 58 R9 source controls
  - Sandbox validation
  - E2E validation
  ai_instruction: Read this encoding first. Render one Strategy Center admin page only. Do not reorder the global sidebar.
    Do not recreate STR-02~06 as pages. For each active View, use only the registered source-page sections/actions/operations.
    Unknown or missing binding => BLOCK + REPORT_AUTHORITY_GAP.
