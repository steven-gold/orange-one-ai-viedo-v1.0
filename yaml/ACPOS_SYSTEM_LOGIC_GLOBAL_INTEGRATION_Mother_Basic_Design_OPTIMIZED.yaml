    - row: 1
      cells:
      - Single time truth
      - Time-bearing systems exchange exact CanonicalTimePoint rational values + explicit timebase identity; float seconds alone are forbidden as cross-system authority.
    - row: 2
      cells:
      - Display-unit independence
      - Frame, millisecond, subframe and sample are UI/operation projections over the same canonical value; switching projection cannot mutate time.
    - row: 3
      cells:
      - Source identity
      - Frame rate/sample rate/source version are part of the binding needed to interpret a precise position.
    - row: 4
      cells:
      - Cross-stage handoff
      - ASSET/VIDEO/EDIT/VOICE/QA handoffs that carry timing MUST preserve canonical rational values or a lossless equivalent plus timebase metadata.
    - row: 5
      cells:
      - Video boundary
      - Video edits/visual render boundaries remain frame-addressable; audio/dialogue may refine below a frame without creating a video subframe cut.
    - row: 6
      cells:
      - Audio precision
      - Sample-level operations require exact sample-rate authority; millisecond operation is legal as a rational projection and may require deterministic quantization
        only at a sample-bound commit.
    - row: 7
      cells:
      - Subtitle precision
      - Subtitle cue timing may be millisecond-addressable; export-specific quantization is a target-format concern and must not overwrite canonical edit truth.
    - row: 8
      cells:
      - LipSync/Dialogue
      - Derived sync/binding status references canonical time + source/version fingerprint; derived status cannot become independent timing authority.
    - row: 9
      cells:
      - Failure propagation
      - Unknown/mismatched timebase or source version is an explicit blocker propagated to the consuming stage; no guessed defaults.
    - row: 10
      cells:
      - Audit evidence
      - Precision edits and quantization, when effectful, must be attributable to exact input version, unit, canonical before/after values and deterministic rule.
