          old='function gatePass(state:EditClientState,gateUid:string|null|undefined){if(!gateUid)return false;if(gateUid==="EDIT-01-GATE-CONTEXT-MUTABLE")return state.resolved.page_state_uid!=="EDIT-01-ST-PAGE-LOCKED"&&state.resolved.page_state_uid!=="EDIT-01-ST-PAGE-HANDED_OFF";if(gateUid==="EDIT-01-GATE-STANDALONE")return state.source_mode==="STANDALONE_UPLOAD"&&state.resolved.gate_state[gateUid]===true;return state.resolved.gate_state[gateUid]===true;}'
          new='function gatePass(state:EditClientState,gateUid:string|null|undefined){if(!gateUid)return false;if(gateUid==="EDIT-01-GATE-CONTEXT-MUTABLE")return state.resolved.page_state_uid!=="EDIT-01-ST-PAGE-LOCKED"&&state.resolved.page_state_uid!=="EDIT-01-ST-PAGE-HANDED_OFF";if(gateUid==="EDIT-01-GATE-STANDALONE")return state.source_mode==="STANDALONE_UPLOAD";return state.resolved.gate_state[gateUid]===true;}'
          if old not in s: raise SystemExit('gatePass token missing')
          s=s.replace(old,new)
          old='function readonlyValue(id:string,state:EditClientState,runtimeError:string|null){if(id==="EDIT-01-LBL-PAGE-STATE")return state.resolved.page_state_uid??"—";if(id==="EDIT-01-LBL-CURRENT-STAGE")return state.resolved.current_stage_uid??"—";if(id==="EDIT-01-LBL-STAGE-SCORE")return state.resolved.current_stage_score===null?"—":String(state.resolved.current_stage_score);if(id==="EDIT-01-LBL-ERROR-STATE")return runtimeError??state.resolved.current_error_uid??"—";if(id==="EDIT-01-FLD-PROJECT")return state.resolved.project_id??"—";if(id==="EDIT-01-FLD-TOPIC")return state.resolved.topic_id??"—";if(id==="EDIT-01-FLD-TASK")return state.resolved.task_id??"—";if(id==="EDIT-01-FLD-TIMECODE")return state.playhead===null?"—":String(state.playhead);if(id==="EDIT-01-LBL-BINDING-FINGERPRINT")return state.resolved.input_fingerprint??"—";if(id==="EDIT-01-LBL-LIPSYNC-SYNC-BINDING"||id==="EDIT-01-LBL-SUB-SYNC-BINDING")return state.resolved.dialogue_timing_binding_ref??"—";return state.resolved.values[id]??"—";}'
          new='function readonlyValue(id:string,state:EditClientState,runtimeError:string|null){if(id==="EDIT-01-LBL-PAGE-STATE")return state.resolved.page_state_uid??"—";if(id==="EDIT-01-LBL-CURRENT-STAGE")return state.resolved.current_stage_uid??"—";if(id==="EDIT-01-LBL-STAGE-SCORE")return state.resolved.current_stage_score===null?"—":String(state.resolved.current_stage_score);if(id==="EDIT-01-LBL-ERROR-STATE")return runtimeError??state.resolved.current_error_uid??"—";if(id==="EDIT-01-FLD-PROJECT")return state.resolved.project_id??"—";if(id==="EDIT-01-FLD-TOPIC")return state.resolved.topic_id??"—";if(id==="EDIT-01-FLD-TASK")return state.resolved.task_id??"—";if(id==="EDIT-01-FLD-CLIP-ID")return state.selected_clip_ref??state.resolved.values[id]??"—";if(id==="EDIT-01-FLD-TRACK-ID")return state.selected_track_ref??state.resolved.values[id]??"—";if(id==="EDIT-01-FLD-TIMECODE")return state.playhead===null?"—":String(state.playhead);if(id==="EDIT-01-LBL-BINDING-FINGERPRINT")return state.resolved.input_fingerprint??"—";if(id==="EDIT-01-LBL-LIPSYNC-SYNC-BINDING"||id==="EDIT-01-LBL-SUB-SYNC-BINDING")return state.resolved.dialogue_timing_binding_ref??"—";return state.resolved.values[id]??"—";}'
