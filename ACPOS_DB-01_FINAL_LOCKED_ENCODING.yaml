authority:
  id: ACPOS_DB-01_FINAL_LOCKED_ENCODING
  page_uid: admin:DB-01
  control_prefix: DB-01
  page_name_zh: 資料模型與追溯工作區
  page_name_en: Data Model & Traceability Workspace
  surface: ADMIN
  status: FINAL_LOCKED
  current_only: true
  single_page_workspace: true
  single_machine_authority: true
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  real_data_only: true
  missing_value_display: —
  purpose: 管理/Debug Viewer for ACPOS canonical data model, exact version lineage, relationships, traceability, schema/migration history, integrity findings and audit.
  boundary: DB-01 is not a generic CRUD table editor and never bypasses Domain Service, Permission, Audit, Version, Change Management or Migration governance.
layout:
  desktop_min_width: 1280px
  vertical_scroll: Main Workspace height:auto; overflow-y:auto; independent from Global Sidebar/Menu height
  below_min_width: Keep min-width=1280px; allow horizontal scroll; no alternate unregistered mobile page
  context_bar:
    width: 100%
    height: 56px
  primary_grid:
    columns: minmax(280px,1fr) minmax(760px,3fr) minmax(300px,1fr)
    approx: 20% / 60% / 20%
    gap: 16px
    align: start
  left_rail:
    min_width: 280px
    role: Entity/Table/Domain explorer
  center:
    min_width: 760px
    role: Schema inspector / Relation graph / Trace detail
    priority: highest
  right_rail:
    min_width: 300px
    role: Integrity / Version / Migration / Scope summary
  lower_rows: Lineage Trace, Migration History, Integrity Findings and Audit may extend full width
  tokens:
    control_height: 40px
    button_min_width: 88px
    primary_button_min_width: 120px
    button_radius: 10px
    panel_radius: 12px
    large_container_radius: 24px
    section_gap: 16px
    content_padding: 16px
    status_badge_height: 28px
    action_gap: 8px
    touch_target_min: 44px × 44px
  visual_override: FORBIDDEN; inherit Global Visual tokens only
database_contract:
  positioning: The data layer is Project -> Mother Structure Versions -> Production Topics -> Child Blueprint Versions; all Task/Job/Asset/Review/Decision/Release records must be traceable
    through explicit exact refs.
  required_trace_keys:
  - project_id
  - mother_structure_version_id
  - topic_id
  - child_blueprint_version_id
  - boundary_id
  - continuity_bridge_id
  core_entity_groups:
    CANON:
    - Project
    - ProjectStructureVersion / Mother Structure Version
    - StoryCoreVersion
    - WorldBibleVersion
    - ChapterArchitectureVersion
    - DNAVersion
    TOPIC_PRODUCTION:
    - ProductionTopic
    - TopicBlueprintVersion / Child Blueprint Version
    - Boundary
    - ContinuityBridge
    - CanonicalScriptVersion
    RUNTIME:
    - WorkPackage
    - DepartmentTask
    - ProviderJob
    - AssetOutputVersion
    - VideoOutputVersion
    - EditingOutputVersion
    - QAReviewRun
    GOVERNANCE:
    - DecisionAtom
    - Scorecard
    - Finding
    - CorrectionRequest
    - ManualReviewCase
    - QAGateDecision
    - ReleasePackage
    - AuditEvent
    SYSTEM:
    - AccountPermissionAssignment
    - SchemaMigrationHistory
    - Outbox/Inbox
    - Experience / Strategic Context refs
  immutability_rules:
  - Any version update creates a new record/version; prior canonical snapshot is not overwritten.
  - Published/locked based_on/source refs are immutable.
  - No physical delete of locked history.
  - Formal execution uses explicit version IDs/hashes; no latest/current/default resolution.
  referential_integrity:
  - FK/reference existence
  - version immutability
  - published based_on immutability
  - no orphan task/job/asset/review
  - tenant/project/department/server-side scope validation
  - traceability completeness is P0
  data_code_language: Database / API / Schema code remains English; UI labels follow i18n.
traceability_contract:
  input_types:
  - Task
  - Job
  - Asset
  - Review
  - Finding
  - Decision
  - Release
  - Any registered entity/version
  output: 'Exact clickable lineage: Source Entity -> Project -> Mother Structure Version -> Topic -> Child Blueprint Version -> Boundary -> Continuity Bridge -> Script/DNA/Input -> Task/Job/Output
    -> QA/Decision/Release.'
  rules:
  - Version must be a clickable exact entity/ref, not only a display string such as M1/C1.
  - Trace uses canonical IDs/refs/checksums, never filename guessing.
  - Broken/orphan refs are shown as explicit integrity findings; UI must not silently repair.
  - Historical source and published refs remain visible for audit.
schema_contract:
  viewer_sections:
  - Entity metadata
  - Table / Aggregate
  - Columns / Field types
  - Primary / Foreign Keys
  - Constraints
  - Indexes
  - Relations
  - Version rules
  - Data classification
  - Owner / Service
  - Migration provenance
  page_editing_policy: READ_ONLY_INSPECTION
  manual_sql: FORBIDDEN
  row_data_editor: FORBIDDEN
  schema_direct_write: FORBIDDEN
migration_contract:
  page_scope: READ_ONLY_MIGRATION_HISTORY_AND_STATUS
  visible_fields:
  - migration_id
  - checksum
  - approval_ref
  - bootstrap/dependency state
  - applied_by
  - applied_at
  - status
  - rollback_point/change_request_ref when available
  rules:
  - Migration checksum must be non-zero and verifiable.
  - Migration execution order/dependencies are explicit.
  - Destructive/high-risk DB migrations require System Lifecycle / Change Management / Sandbox / Human Approval.
  - DB-01 does not execute migration, rollback, raw DDL or Production write.
integrity_contract:
  checks:
  - Exact reference exists
  - FK/typed reference valid
  - Required lineage complete
  - Version/source snapshot immutable
  - No orphan Task/Job/Asset/Review
  - No superseded source used as current execution authority
  - Scope/tenant/project/department access valid
  - Migration history/checksum consistent
  - Audit/correlation trace exists for effectful writes
  finding_behavior: DB-01 surfaces integrity findings and affected refs. Repair is routed to the owning Domain/System Lifecycle workflow; DB-01 does not mutate production data to hide
    the error.
system_lifecycle_boundary:
  db01_can:
  - inspect
  - search/filter
  - trace exact lineage
  - view entity/schema/column/relation/index/constraint metadata
  - view migration history and status
  - view integrity findings
  - view audit/correlation refs
  db01_cannot:
  - run arbitrary SQL
  - edit production row directly
  - alter table/column/index directly
  - execute migration
  - rollback migration
  - restore backup
  - bypass Domain Service validation
  - bypass account permission or scope
  mutation_owner: System Lifecycle / Change Management / Sandbox / governed Domain Service
registries:
  sections:
  - section_uid: DB-01-SEC-01
    name: Context / Schema Head
    responsibility: Environment, schema/migration head, selected scope and data health
    visual_uid: DB-01-VIS-CONTEXT
  - section_uid: DB-01-SEC-02
    name: Entity Explorer
    responsibility: Domain/Entity/Table search, filter and exact selection
    visual_uid: DB-01-VIS-LEFT
  - section_uid: DB-01-SEC-03
    name: Schema Inspector
    responsibility: Entity/table/aggregate metadata, columns, constraints and indexes
    visual_uid: DB-01-VIS-SCHEMA
  - section_uid: DB-01-SEC-04
    name: Relation Graph
    responsibility: FK/typed refs, parent-child/version relations and exact clickable nodes
    visual_uid: DB-01-VIS-RELATION
  - section_uid: DB-01-SEC-05
    name: Traceability Path
    responsibility: Mother/Child/Topic/Boundary/Bridge/Source lineage from any registered object
    visual_uid: DB-01-VIS-TRACE
  - section_uid: DB-01-SEC-06
    name: Integrity Status
    responsibility: Reference/version/orphan/scope/checksum integrity summary
    visual_uid: DB-01-VIS-RIGHT
  - section_uid: DB-01-SEC-07
    name: Migration History
    responsibility: Migration ID/checksum/approval/dependency/status; read-only
    visual_uid: DB-01-VIS-MIGRATION
  - section_uid: DB-01-SEC-08
    name: Integrity Findings
    responsibility: Broken/orphan/mismatch findings and affected exact refs
    visual_uid: DB-01-VIS-FINDING
  - section_uid: DB-01-SEC-09
    name: Audit / Correlation
    responsibility: Actor/event/correlation/causation/change lineage
    visual_uid: DB-01-VIS-AUDIT
  - section_uid: DB-01-SEC-10
    name: Status / Boundary
    responsibility: Page state, disabled reason, source sync, System Lifecycle route
    visual_uid: DB-01-VIS-STATUS
  visuals:
  - visual_uid: DB-01-VIS-CONTEXT
    geometry: top full width; h>=56px
  - visual_uid: DB-01-VIS-LEFT
    geometry: primary grid left 20%; min 280px
  - visual_uid: DB-01-VIS-SCHEMA
    geometry: primary grid center upper; min 760px
  - visual_uid: DB-01-VIS-RELATION
    geometry: primary grid center lower; graph/list toggle within center only
  - visual_uid: DB-01-VIS-TRACE
    geometry: lower full-width trace strip / cards
  - visual_uid: DB-01-VIS-RIGHT
    geometry: primary grid right 20%; min 300px
  - visual_uid: DB-01-VIS-MIGRATION
    geometry: lower full-width table/card region
  - visual_uid: DB-01-VIS-FINDING
    geometry: lower full-width findings region
  - visual_uid: DB-01-VIS-AUDIT
    geometry: lower full-width audit trace region
  - visual_uid: DB-01-VIS-STATUS
    geometry: bottom full-width status/boundary row
  components:
  - component_uid: DB-01-CMP-CONTEXT
    section_uid: DB-01-SEC-01
    name: Database Context / Schema Head
  - component_uid: DB-01-CMP-EXPLORER
    section_uid: DB-01-SEC-02
    name: Domain / Entity Explorer
  - component_uid: DB-01-CMP-SCHEMA
    section_uid: DB-01-SEC-03
    name: Schema Metadata Inspector
  - component_uid: DB-01-CMP-COLUMNS
    section_uid: DB-01-SEC-03
    name: Columns / Constraints / Indexes
  - component_uid: DB-01-CMP-RELATIONS
    section_uid: DB-01-SEC-04
    name: Relations / Reference Graph
  - component_uid: DB-01-CMP-TRACE-INPUT
    section_uid: DB-01-SEC-05
    name: Trace Source Selector
  - component_uid: DB-01-CMP-TRACE-PATH
    section_uid: DB-01-SEC-05
    name: Exact Lineage Path Viewer
  - component_uid: DB-01-CMP-INTEGRITY
    section_uid: DB-01-SEC-06
    name: Integrity / Version Summary
  - component_uid: DB-01-CMP-MIGRATION
    section_uid: DB-01-SEC-07
    name: Migration History
  - component_uid: DB-01-CMP-FINDINGS
    section_uid: DB-01-SEC-08
    name: Integrity Finding List / Detail
  - component_uid: DB-01-CMP-AUDIT
    section_uid: DB-01-SEC-09
    name: Audit / Correlation Trace
  - component_uid: DB-01-CMP-STATUS
    section_uid: DB-01-SEC-10
    name: Page Status / System Lifecycle Boundary
  permissions:
  - permission_uid: DB_READ
    backend_scope: database.metadata.read
    purpose: Read database/entity/schema/relation/version metadata
  - permission_uid: DB_TRACE
    backend_scope: database.trace.read
    purpose: Resolve exact registered lineage and relation trace
  - permission_uid: DB_MIGRATION_READ
    backend_scope: database.migration.read
    purpose: Read migration/checksum/dependency/status history
  - permission_uid: DB_INTEGRITY_READ
    backend_scope: database.integrity.read
    purpose: Read integrity checks/findings
  - permission_uid: DB_AUDIT_READ
    backend_scope: audit.read
    purpose: Read permitted audit/correlation trace
  gates:
  - gate_uid: DB-01-GATE-PAGE
    condition: explicit account page permission + scope + condition + audit
  - gate_uid: DB-01-GATE-CONTEXT
    condition: environment/schema head resolved + authorized scope; no implicit tenant/project fallback
  - gate_uid: DB-01-GATE-ENTITY
    condition: selected entity/table is registered and permitted for current scope
  - gate_uid: DB-01-GATE-SCHEMA
    condition: selected entity has authoritative schema/entity/column/relation metadata
  - gate_uid: DB-01-GATE-RELATION
    condition: selected exact entity/ref has registered typed relations; no inferred relation from naming
  - gate_uid: DB-01-GATE-TRACE
    condition: source_type + exact source_id/version are present and authorized
  - gate_uid: DB-01-GATE-MIGRATION
    condition: migration history permission + registered migration/checksum manifest available
  - gate_uid: DB-01-GATE-INTEGRITY
    condition: integrity read source available for selected scope/entity/version
  - gate_uid: DB-01-GATE-AUDIT
    condition: audit read permission + exact correlation/entity/version scope
  errors:
  - error_uid: DB-01-ERR-CONTEXT-001
    context: Database context/environment/schema head unavailable or scope mismatch
    recovery: BLOCK data panels; resolve authorized context
  - error_uid: DB-01-ERR-ENTITY-001
    context: Entity/table not registered or outside allowed scope
    recovery: BLOCK selection; no database-name guessing
  - error_uid: DB-01-ERR-SCHEMA-001
    context: Schema/column/relation metadata missing or inconsistent
    recovery: Show explicit authority gap/integrity finding; do not synthesize schema
  - error_uid: DB-01-ERR-TRACE-001
    context: Trace source ref missing/orphan/mismatched
    recovery: Show broken path; do not silently repair or jump to latest
  - error_uid: DB-01-ERR-VERSION-001
    context: Version/source snapshot immutable lineage conflict
    recovery: BLOCK any governed downstream use and surface exact conflict
  - error_uid: DB-01-ERR-MIGRATION-001
    context: Migration/checksum/dependency history invalid or incomplete
    recovery: Show migration integrity blocker; route change to System Lifecycle
  - error_uid: DB-01-ERR-INTEGRITY-001
    context: FK/reference/orphan/scope/checksum integrity failure
    recovery: Show finding and affected exact refs; no direct production repair
  - error_uid: DB-01-ERR-AUDIT-001
    context: Audit/correlation trace unavailable or unauthorized
    recovery: Show read restriction / missing audit evidence
  - error_uid: DB-01-ERR-PERM-001
    context: Permission/scope denied
    recovery: Disable access/action and show actual reason
  - error_uid: DB-01-ERR-UNDEFINED-001
    context: Unlisted control/action/relation/mutation requested
    recovery: BLOCK + REPORT_AUTHORITY_GAP
  page_states:
  - state_uid: DB-01-ST-LOADING
    display: LOADING
    definition: Loading authorized Database Read Model
  - state_uid: DB-01-ST-READY
    display: READY
    definition: Database metadata/read model ready
  - state_uid: DB-01-ST-EMPTY
    display: EMPTY
    definition: Authorized query has no registered result
  - state_uid: DB-01-ST-ERROR
    display: ERROR
    definition: Real read/contract/integrity error
  - state_uid: DB-01-ST-POLICY
    display: POLICY_BLOCKED
    definition: Permission/data classification/scope blocks read
  - state_uid: DB-01-ST-CONFLICT
    display: VERSION_CONFLICT
    definition: Schema/version/source lineage mismatch
  - state_uid: DB-01-ST-READONLY
    display: READ_ONLY
    definition: Normal DB-01 operating mode; no production mutation
  - state_uid: DB-01-ST-ARCHIVED
    display: ARCHIVED
    definition: Historical schema/entity/migration/version context
  stages:
  - stage_uid: DB-01-STAGE-01-CONTEXT
    name: Resolve Context
    flow: Resolve environment/schema head/authorized scope
  - stage_uid: DB-01-STAGE-02-INSPECT
    name: Inspect Schema
    flow: Select registered entity -> schema/columns/constraints/indexes/relations
  - stage_uid: DB-01-STAGE-03-TRACE
    name: Trace Lineage
    flow: Exact source -> Mother/Topic/Child/Boundary/Bridge/Input/Output/QA/Audit path
  - stage_uid: DB-01-STAGE-04-INTEGRITY
    name: Integrity / Migration
    flow: Read integrity finding + migration history/checksum/dependencies
  - stage_uid: DB-01-STAGE-05-AUDIT
    name: Audit / Route Change
    flow: Read audit/correlation; mutation requests route to System Lifecycle / Change Management
  stage_transitions:
  - transition_uid: DB-01-STTR-01
    from_stage: DB-01-STAGE-01-CONTEXT
    to_stage: DB-01-STAGE-02-INSPECT
    trigger: select registered entity
    gate_uid: DB-01-GATE-ENTITY
  - transition_uid: DB-01-STTR-02
    from_stage: DB-01-STAGE-02-INSPECT
    to_stage: DB-01-STAGE-03-TRACE
    trigger: trace source selected
    gate_uid: DB-01-GATE-TRACE
  - transition_uid: DB-01-STTR-03
    from_stage: DB-01-STAGE-03-TRACE
    to_stage: DB-01-STAGE-04-INTEGRITY
    trigger: trace/integrity context resolved
    gate_uid: DB-01-GATE-INTEGRITY
  - transition_uid: DB-01-STTR-04
    from_stage: DB-01-STAGE-04-INTEGRITY
    to_stage: DB-01-STAGE-05-AUDIT
    trigger: audit/correlation ref selected
    gate_uid: DB-01-GATE-AUDIT
  action_effect_types:
  - effect_type: UI_ONLY
    allowed: filter/toggle/local display state
    forbidden: no DB/domain mutation
  - effect_type: CONTEXT_STATE
    allowed: select current registered entity/trace source/migration/finding
    forbidden: no implicit latest/default
  - effect_type: READ_MODEL_QUERY
    allowed: authorized schema/relation/trace/migration/integrity/audit query
    forbidden: no raw DB write/DDL/SQL
  actions:
  - action_uid: DB-01-ACT-NOOP
    label: Read display
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-PAGE
    effect_type: UI_ONLY
    owner: Database Read Model / DB-01
    success_contract: No business mutation
    error_uid: DB-01-ERR-CONTEXT-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-CONTEXT
    label: Set DB context
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-PAGE
    effect_type: CONTEXT_STATE
    owner: Database Read Model / DB-01
    success_contract: Authorized context selected; dependent selections cleared
    error_uid: DB-01-ERR-CONTEXT-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-SEARCH
    label: Search entity/table
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-PAGE
    effect_type: READ_MODEL_QUERY
    owner: Database Read Model / DB-01
    success_contract: Return only authorized registered entities/tables
    error_uid: DB-01-ERR-ENTITY-001
    query_contract: DatabaseReadModel.list_entities
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-FILTER
    label: Filter domain/type/state
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-PAGE
    effect_type: UI_ONLY
    owner: Database Read Model / DB-01
    success_contract: Filter current authorized entity list only
    error_uid: DB-01-ERR-ENTITY-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-ENTITY-SELECT
    label: Open entity schema
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-ENTITY
    effect_type: CONTEXT_STATE
    owner: Database Read Model / DB-01
    success_contract: Load exact registered entity/table metadata
    error_uid: DB-01-ERR-ENTITY-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-SCHEMA-REFRESH
    label: Refresh schema metadata
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-SCHEMA
    effect_type: READ_MODEL_QUERY
    owner: Database Read Model / DB-01
    success_contract: Refresh authoritative schema/column/index/constraint projection
    error_uid: DB-01-ERR-SCHEMA-001
    query_contract: DatabaseReadModel.get_entity_schema
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-RELATION-OPEN
    label: Open exact relation
    permission_uid: DB_TRACE
    gate_uid: DB-01-GATE-RELATION
    effect_type: CONTEXT_STATE
    owner: Database Read Model / DB-01
    success_contract: Navigate to exact related entity/version/ref
    error_uid: DB-01-ERR-TRACE-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-RELATION-MODE
    label: Graph / List view
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-SCHEMA
    effect_type: UI_ONLY
    owner: Database Read Model / DB-01
    success_contract: Change relation presentation only
    error_uid: DB-01-ERR-SCHEMA-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-TRACE
    label: Trace exact lineage
    permission_uid: DB_TRACE
    gate_uid: DB-01-GATE-TRACE
    effect_type: READ_MODEL_QUERY
    owner: Database Read Model / DB-01
    success_contract: Return exact canonical lineage and broken refs explicitly
    error_uid: DB-01-ERR-TRACE-001
    query_contract: TraceabilityReadModel.trace_entity_lineage
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-MIGRATION-SELECT
    label: Open migration detail
    permission_uid: DB_MIGRATION_READ
    gate_uid: DB-01-GATE-MIGRATION
    effect_type: CONTEXT_STATE
    owner: Database Read Model / DB-01
    success_contract: Load exact migration/checksum/dependency/status
    error_uid: DB-01-ERR-MIGRATION-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-MIGRATION-REFRESH
    label: Refresh migration history
    permission_uid: DB_MIGRATION_READ
    gate_uid: DB-01-GATE-MIGRATION
    effect_type: READ_MODEL_QUERY
    owner: Database Read Model / DB-01
    success_contract: Refresh migration/checksum manifest read model
    error_uid: DB-01-ERR-MIGRATION-001
    query_contract: MigrationReadModel.list_history
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-FINDING-SELECT
    label: Open integrity finding
    permission_uid: DB_INTEGRITY_READ
    gate_uid: DB-01-GATE-INTEGRITY
    effect_type: CONTEXT_STATE
    owner: Database Read Model / DB-01
    success_contract: Load exact affected refs and check result
    error_uid: DB-01-ERR-INTEGRITY-001
    query_contract: null
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-INTEGRITY-REFRESH
    label: Refresh integrity status
    permission_uid: DB_INTEGRITY_READ
    gate_uid: DB-01-GATE-INTEGRITY
    effect_type: READ_MODEL_QUERY
    owner: Database Read Model / DB-01
    success_contract: Refresh governed integrity/readiness checks; no automatic repair
    error_uid: DB-01-ERR-INTEGRITY-001
    query_contract: DatabaseIntegrityReadModel.list_findings
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-AUDIT-OPEN
    label: Open audit/correlation trace
    permission_uid: DB_AUDIT_READ
    gate_uid: DB-01-GATE-AUDIT
    effect_type: READ_MODEL_QUERY
    owner: Database Read Model / DB-01
    success_contract: Return authorized audit/correlation event lineage
    error_uid: DB-01-ERR-AUDIT-001
    query_contract: AuditReadModel.trace
    state_effect: Read/UI state only
  - action_uid: DB-01-ACT-SYSTEM-LIFECYCLE
    label: Open System Lifecycle change route
    permission_uid: DB_READ
    gate_uid: DB-01-GATE-PAGE
    effect_type: UI_ONLY
    owner: Database Read Model / DB-01
    success_contract: Navigate to governed System Lifecycle/Change Management route; no DB mutation from DB-01
    error_uid: DB-01-ERR-CONTEXT-001
    query_contract: null
    state_effect: Read/UI state only
  objects_refs:
  - object_uid: DB-01-OBJ-ENTITY
    entity: DatabaseEntityRef
    owner: Database Registry
    required_content: entity_id/name + owner_service + aggregate/table + classification + current schema ref
  - object_uid: DB-01-OBJ-SCHEMA
    entity: SchemaMetadata
    owner: Database Registry
    required_content: table/aggregate + columns + PK/FK + constraints + indexes + version rules
  - object_uid: DB-01-OBJ-RELATION
    entity: RelationRef
    owner: Database Registry
    required_content: source entity/ref + relation type + exact target entity/ref + FK/typed ref metadata
  - object_uid: DB-01-OBJ-VERSION
    entity: VersionLineageRef
    owner: Domain owner
    required_content: version_id/status + source_version_ref + hash/checksum + actor/reason/review/audit
  - object_uid: DB-01-OBJ-TRACE
    entity: TraceabilityPath
    owner: Traceability Read Model
    required_content: Project/Mother/Topic/Child/Boundary/Bridge/source/task/job/output/QA/release exact refs
  - object_uid: DB-01-OBJ-MIGRATION
    entity: SchemaMigrationHistory
    owner: System Lifecycle / Migration Authority
    required_content: migration_id + checksum + approval_ref + dependency/bootstrap + applied_by/at + status
  - object_uid: DB-01-OBJ-INTEGRITY
    entity: DatabaseIntegrityFinding
    owner: Database Integrity / QA
    required_content: check_id/type + affected exact refs + severity/status + reason + evidence + owner route
  - object_uid: DB-01-OBJ-AUDIT
    entity: AuditCorrelationTrace
    owner: Governance
    required_content: actor + event + correlation/causation + entity/version + before/after ref + timestamp
  controls:
  - control_uid: DB-01-FLD-ENV
    section_uid: DB-01-SEC-01
    component_uid: DB-01-CMP-CONTEXT
    visual_uid: DB-01-VIS-CONTEXT
    type: READONLY
