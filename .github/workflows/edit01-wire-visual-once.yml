name: EDIT01 wire governed controls
on:
  push:
    paths:
      - '.github/workflows/edit01-wire-visual-once.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix runtime adapter details
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/EditControlRuntime.tsx')
          s=p.read_text()
          s=s.replace('createContext, useContext, useEffect, useMemo, useReducer, useState, type ReactNode','createContext, useContext, useEffect, useMemo, useReducer, useState, type Dispatch, type ReactNode')
          s=s.replace('dispatch: React.Dispatch<Parameters<typeof reduceEditClientState>[1]>;','dispatch: Dispatch<Parameters<typeof reduceEditClientState>[1]>;')
          s=s.replace('  const localClick=()=>{\n    switch(controlId){','  const localClick=()=>{\n    setRuntimeError(null);\n    switch(controlId){')
          s=s.replace('    if(localClick()){setRuntimeError(null);return;}','    if(localClick())return;')
          p.write_text(s)
          PY
      - name: Wire EditVisual without geometry changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/EditVisual.tsx')
          s=p.read_text()
          import_line='import { EditRuntimeControl, EditRuntimeProvider } from "./EditControlRuntime";\n'
          anchor='import styles from "./EditVisual.module.css";\n'
          if import_line not in s:
              s=s.replace(anchor,import_line+anchor)
          start=s.index('function Control(')
          end=s.index('\nfunction Title(',start)
          replacement='''function Control({ spec, compact = false }: { spec: Spec; compact?: boolean }) {\n  return <EditRuntimeControl controlId={spec.id} kind={spec.kind} compact={compact} />;\n}\n'''
          s=s[:start]+replacement+s[end:]
          needle='  return <div className={styles.page} data-page-uid="EDIT-01"'
          if needle not in s:
              raise SystemExit('EDIT page root not found')
          s=s.replace(needle,'  return <EditRuntimeProvider><div className={styles.page} data-page-uid="EDIT-01"',1)
          ending='  </div>;\n}'
          if not s.endswith(ending):
              raise SystemExit('EDIT page ending not found')
          s=s[:-len(ending)]+'  </div></EditRuntimeProvider>;\n}'
          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const visual=fs.readFileSync('src/components/pages/EditVisual.tsx','utf8');
          const runtime=fs.readFileSync('src/components/pages/EditControlRuntime.tsx','utf8');
          const bindings=fs.readFileSync('src/domain/edit/editControlBindings.ts','utf8');
          if(!visual.includes('<EditRuntimeProvider>'))throw new Error('provider not wired');
          if(!visual.includes('EditRuntimeControl'))throw new Error('runtime control not wired');
          if(visual.includes('data-disabled-reason": "Gate not satisfied"'))throw new Error('legacy always-disabled control remains');
          if(!bindings.includes('EDIT-01-ACT-PLAY')||!bindings.includes('EDIT-01-ACT-HANDOFF'))throw new Error('authority actions missing');
          for(const bad of ['/v1/edit/actions','requestTaskExecution','createVoiceRuntimeProfile']){
            if(visual.includes(bad)||runtime.includes(bad))throw new Error('forbidden implementation '+bad);
          }
          NODE
          test "$(git hash-object src/components/pages/EditVisual.module.css)" = "6ec980b81fb6930a019d2b9ee6168e9d0f6f1d4e"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/edit01-wire-visual-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/EditVisual.tsx src/components/pages/EditControlRuntime.tsx .github/workflows/edit01-wire-visual-once.yml
          git commit -m "wire(edit): connect authority controls without layout drift"
          git push origin HEAD:new
