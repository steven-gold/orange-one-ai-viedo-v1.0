normative_keywords:
- 關鍵字: MUST
  中文語義: 必須
  執行效果: 缺失即不符合本文件。
- 關鍵字: MUST_NOT
  中文語義: 禁止
  執行效果: 任何實作不得違反。
- 關鍵字: REQUIRED
  中文語義: 驗收必要
  執行效果: 缺失不得 PASS。
- 關鍵字: BLOCK
  中文語義: 阻擋
  執行效果: 不得以 fallback、猜測或 UI workaround 繞過。
- 關鍵字: REVERIFY_REQUIRED
  中文語義: 需要重驗
  執行效果: 上游 Context/Decision/Version 改變後，相關對話產物不得沿用舊通過狀態。
- 關鍵字: REQUIRE_EXACT_BINDING
  中文語義: 等待精確綁定
  執行效果: 本設計需要正式 UID/Schema/Runtime owner，但 Current Authority 尚未在本文件中合法解析；不得猜。
- 關鍵字: REFERENCE_ONLY
  中文語義: 只引用
  執行效果: 本文件依賴另一 System Logic Owner；不得複製成第二 Authority。
highest_principle: ONE SHARED CONVERSATION CORE / ONE MESSAGE IDENTITY / ONE REFERENCE GRAPH / ONE RESUME
  SEMANTICS / ONE ASSISTANT ROLE
purpose_scope:
- 項目: Primary Purpose
  規範: 建立全站共用、可追溯、可分支、可恢復、可索引、可多 AI 討論、可由 Assistant 紀錄的 Conversation substrate，使對話不是孤立文字，而是可綁 Project/Topic/Task/Decision/Version/Context
    的工作狀態。
- 項目: System Role
  規範: Conversation Core 管理 conversation identity、message lineage、reference graph、branch/resume、participant
    aliases、assistant records、conversation-local memory projection；不取代 Domain Authority、Global Context
    Truth 或 AI Runtime Router。
- 項目: Included
  規範: Conversation、Thread、Branch、Message、AI Response Ref、Assistant Record、Multi-AI Session、Cross-AI Relation、Context
    Snapshot Ref、Context Fingerprint、Resume Pointer、Conversation Memory Projection、Attachment Ref、Parser、Events、Audit、Errors。
- 項目: Excluded
  規範: Provider/model route selection、Tool execution、Script compilation、Domain business decisions、Project/Topic
    Canon mutation、Experience global admission、external data retrieval engine、runtime queue/DLQ、Production
    deploy。
- 項目: User Experience Principle
  規範: Conversation-first：對話與其控制必須同一工作區；不可把 AI 輸入欄與對話歷史拆成兩個互不連續的頁面/流程。
- 項目: Core Inheritance
  規範: ACPOS-AI-01 owns truth/context/impact/experience governance；ACPOS-AI-03 owns provider/runtime execution；ACPOS-AI-02
    references both and owns conversation semantics only.
source_basis:
- 來源層: Current Governance v2.2.16
  本文件採用內容: ONE AUTHORITY、search-before-create、Current vs Evidence 分離、Work Unit/Resume、跨階段 consumer readiness、禁止假完成。
  禁止誤用: 不得把 Stage-local state 當 Conversation business authority。
- 來源層: ACPOS-AI-01 v4
