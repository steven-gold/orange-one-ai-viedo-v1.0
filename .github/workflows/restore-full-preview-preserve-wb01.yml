name: Restore Full Preview Preserve WB01
on:
  push:
    branches: [acpos-live-preview]
    paths: ['.github/workflows/restore-full-preview-preserve-wb01.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: acpos-live-preview
      - name: Preserve validated WB-01 output
        run: |
          rm -rf /tmp/wb01-current
          mkdir -p /tmp/wb01-current
          cp preview/index.html /tmp/wb01-current/index.html
          cp -R preview/_next /tmp/wb01-current/_next
      - name: Restore full prior preview then overlay WB-01
        run: |
          git checkout d685dab8fe87d613d4d36fbee19ff2cef42d808f -- preview
          cp /tmp/wb01-current/index.html preview/index.html
          mkdir -p preview/_next
          cp -R /tmp/wb01-current/_next/static/* preview/_next/static/
          test -f preview/core.html
          test -f preview/assets.html
          test -f preview/video.html
          test -f preview/edit.html
          test -f preview/qa.html
          test -f preview/db.html
          test -f preview/strategy.html
          test -f preview/info.html
          test -f preview/system.html
          grep -q '<script' preview/index.html
          if grep -q 'wb01-preview-runtime' preview/index.html; then exit 1; fi
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/restore-full-preview-preserve-wb01.yml
          git config user.name 'ACPOS Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A preview .github/workflows/restore-full-preview-preserve-wb01.yml
          git commit -m 'fix(preview): restore full site and preserve canonical WB-01 hydration'
          git push origin acpos-live-preview
