name: Refresh Current Governance Root Manifest
# retry-after-all-dead-paths-removed

on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - .github/workflows/refresh-root-manifest-current.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Refresh root manifest hashes
        run: |
          set -euo pipefail
          python .github/governance-source/active/source/09_TESTS/governance/refresh_governance_root_manifest.py
          rm .github/workflows/refresh-root-manifest-current.yml
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "chore(governance): refresh current root manifest hashes"
          git push origin HEAD:rebuild-v2.1.1
