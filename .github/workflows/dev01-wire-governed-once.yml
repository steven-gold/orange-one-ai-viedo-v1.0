name: DEV01 governed enterprise wiring
# rerun: 2
on:
  push:
    paths:
      - '.github/workflows/dev01-wire-governed-once.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire projection and governed controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/DevVisual.tsx'); s=p.read_text()
          anchor='import { devText, type DevTranslationKey } from "@/i18n/devCatalog";\n'
          ins='import { DevGovernedButton, DevRuntimeProvider, useDevGate, useDevRuntimeState } from "./DevControlRuntime";\n'
          if ins not in s:s=s.replace(anchor,anchor+ins,1)
          a=s.find('const EMPTY_VISUAL_STATE = {')
          if a>=0:
              b=s.find('} as const;\n\n',a)
              if b<0: raise SystemExit('EMPTY_VISUAL_STATE end missing')
              s=s[:a]+s[b+12:]
          s=s.replace('export function DevVisual() {','function DevVisualBody() {',1)
          hook='''  const { locale } = useI18n();\n  const [activeStage, setActiveStage] = useState<StageKey>("discovery");'''
          hook_new='''  const { locale } = useI18n();\n  const { projection, runtimeError } = useDevRuntimeState();\n  const discoveryRunning = useDevGate("DEV-01-GATE-DISCOVERY-RUNNING");\n  const discoveryPaused = useDevGate("DEV-01-GATE-DISCOVERY-PAUSED");\n  const mergePreviewAvailable = useDevGate("DEV-01-GATE-MERGE");\n  const mergeConfirmAvailable = useDevGate("DEV-01-GATE-MERGE-CONFIRM");\n  const candidateReviewAvailable = useDevGate("DEV-01-GATE-MESSAGE-REVIEW");\n  const campaignApprovalAvailable = useDevGate("DEV-01-GATE-CAMPAIGN-APPROVAL");\n  const approvedCampaignAvailable = useDevGate("DEV-01-GATE-DISPATCH");\n  const killSwitchApplicable = useDevGate("DEV-01-GATE-KILL-SWITCH");\n  const [activeStage, setActiveStage] = useState<StageKey>("discovery");'''
          if hook not in s: raise SystemExit('hook anchor missing')
          s=s.replace(hook,hook_new,1)
          repl={
          '<button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-DISCOVERY-START" disabled>{t("start")}</button>':'<DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-DISCOVERY-START">{t("start")}</DevGovernedButton>',
          '{EMPTY_VISUAL_STATE.discoveryRunning && <button className={styles.button} type="button" data-control-id="DEV-01-BTN-DISCOVERY-PAUSE" disabled>{t("pause")}</button>}':'{discoveryRunning && <DevGovernedButton className={styles.button} controlId="DEV-01-BTN-DISCOVERY-PAUSE">{t("pause")}</DevGovernedButton>}',
          '{EMPTY_VISUAL_STATE.discoveryPaused && <button className={styles.button} type="button" data-control-id="DEV-01-BTN-DISCOVERY-RESUME" disabled>{t("resume")}</button>}':'{discoveryPaused && <DevGovernedButton className={styles.button} controlId="DEV-01-BTN-DISCOVERY-RESUME">{t("resume")}</DevGovernedButton>}',
          '{EMPTY_VISUAL_STATE.discoveryRunning && <button className={styles.dangerButton} type="button" data-control-id="DEV-01-BTN-DISCOVERY-STOP" disabled>{t("stop")}</button>}':'{discoveryRunning && <DevGovernedButton className={styles.dangerButton} controlId="DEV-01-BTN-DISCOVERY-STOP">{t("stop")}</DevGovernedButton>}',
          '<button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-DIRECTORY-SEARCH" disabled>{t("searchCompany")}</button>':'<DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-DIRECTORY-SEARCH">{t("searchCompany")}</DevGovernedButton>',
          '{EMPTY_VISUAL_STATE.mergePreviewAvailable && <button className={styles.button} type="button" data-control-id="DEV-01-BTN-MERGE-PREVIEW" disabled>{t("previewMerge")}</button>}':'{mergePreviewAvailable && <DevGovernedButton className={styles.button} controlId="DEV-01-BTN-MERGE-PREVIEW">{t("previewMerge")}</DevGovernedButton>}',
          '{EMPTY_VISUAL_STATE.mergeConfirmAvailable && <button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-MERGE" disabled>{t("confirmMerge")}</button>}':'{mergeConfirmAvailable && <DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-MERGE">{t("confirmMerge")}</DevGovernedButton>}',
          '<button className={styles.button} type="button" data-control-id="DEV-01-BTN-EXPORT" disabled>{t("export")}</button>':'<DevGovernedButton className={styles.button} controlId="DEV-01-BTN-EXPORT">{t("export")}</DevGovernedButton>',
          '<button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-CANDIDATE-CREATE" disabled>{t("createCandidate")}</button>':'<DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-CANDIDATE-CREATE">{t("createCandidate")}</DevGovernedButton>',
          '{EMPTY_VISUAL_STATE.candidateReviewAvailable && <button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-CANDIDATE-DECIDE" disabled>{t("reviewCandidate")}</button>}':'{candidateReviewAvailable && <DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-CANDIDATE-DECIDE">{t("reviewCandidate")}</DevGovernedButton>}',
          '{EMPTY_VISUAL_STATE.candidateReviewAvailable && <button className={styles.button} type="button" data-control-id="DEV-01-BTN-CR-CREATE" disabled>{t("requestChange")}</button>}':'{candidateReviewAvailable && <DevGovernedButton className={styles.button} controlId="DEV-01-BTN-CR-CREATE">{t("requestChange")}</DevGovernedButton>}',
          '<button className={styles.button} type="button" data-control-id="DEV-01-BTN-CAMPAIGN-SEARCH" disabled>{t("searchAudience")}</button>':'<DevGovernedButton className={styles.button} controlId="DEV-01-BTN-CAMPAIGN-SEARCH">{t("searchAudience")}</DevGovernedButton>',
          '<button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-CAMPAIGN-CREATE" disabled>{t("createCampaign")}</button>':'<DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-CAMPAIGN-CREATE">{t("createCampaign")}</DevGovernedButton>',
          '{EMPTY_VISUAL_STATE.campaignApprovalAvailable && <button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-CAMPAIGN-APPROVE" disabled>{t("approveCampaign")}</button>}':'{campaignApprovalAvailable && <DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-CAMPAIGN-APPROVE">{t("approveCampaign")}</DevGovernedButton>}',
          '{EMPTY_VISUAL_STATE.approvedCampaignAvailable && <button className={styles.primaryButton} type="button" data-control-id="DEV-01-BTN-EMAIL-DISPATCH" disabled>{t("dispatch")}</button>}':'{approvedCampaignAvailable && <DevGovernedButton className={styles.primaryButton} controlId="DEV-01-BTN-EMAIL-DISPATCH">{t("dispatch")}</DevGovernedButton>}',
          '<button className={styles.button} type="button" data-control-id="DEV-01-BTN-REFRESH" disabled>{t("refresh")}</button>':'<DevGovernedButton className={styles.button} controlId="DEV-01-BTN-REFRESH">{t("refresh")}</DevGovernedButton>',
          '{EMPTY_VISUAL_STATE.killSwitchApplicable && (':'{killSwitchApplicable && (',
          '<button className={styles.dangerButton} type="button" data-control-id="DEV-01-BTN-KILL-SWITCH" disabled>{t("killSwitch")}</button>':'<DevGovernedButton className={styles.dangerButton} controlId="DEV-01-BTN-KILL-SWITCH">{t("killSwitch")}</DevGovernedButton>'}
          for old,new in repl.items():
              if old not in s: raise SystemExit('button anchor missing: '+old[:70])
              s=s.replace(old,new,1)
          old='''        {STAGES.map((item) => (\n          <button\n            key={item.key}\n            type="button"\n            className={`${styles.stageButton} ${activeStage === item.key ? styles.stageButtonActive : ""}`}\n            data-control-id={item.controlId}\n            aria-pressed={activeStage === item.key}\n            onClick={() => setActiveStage(item.key)}\n          >\n            {item.code} · {t(item.labelKey)}\n          </button>\n        ))}'''
          new='''        {STAGES.map((item) => (\n          <DevGovernedButton\n            key={item.key}\n            className={`${styles.stageButton} ${activeStage === item.key ? styles.stageButtonActive : ""}`}\n            controlId={item.controlId}\n            onUiClick={() => setActiveStage(item.key)}\n          >\n            {item.code} · {t(item.labelKey)}\n          </DevGovernedButton>\n        ))}'''
          if old not in s: raise SystemExit('stage map anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('data-page-state="VISUAL_ONLY_NO_BUSINESS_DATA"','data-page-state={projection?.page_state??"READ_ONLY"}',1)
          s=s.replace('<div className={styles.statusCell}><span>{t("authorizedScope")}</span><strong>—</strong></div>','<div className={styles.statusCell}><span>{t("authorizedScope")}</span><strong>{projection?.authorized_scope??"—"}</strong></div>',1)
          s=s.replace('<div className={styles.statusCell}><span>{t("runStatus")}</span><strong>—</strong></div>','<div className={styles.statusCell}><span>{t("runStatus")}</span><strong>{runtimeError??projection?.run_status??"—"}</strong></div>',1)
          s=s.replace('<p className={styles.phaseNote}>{t("visualPhase")}</p>','<p className={styles.phaseNote}>{runtimeError??projection?.page_state??t("noRealData")}</p>',1)
          if 'export function DevVisual(){return <DevRuntimeProvider><DevVisualBody/></DevRuntimeProvider>}' not in s:
              s=s.rstrip()+'\n\nexport function DevVisual(){return <DevRuntimeProvider><DevVisualBody/></DevRuntimeProvider>}\n'
          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('src/domain/dev/devControlBindings.ts','utf8');
          const v=fs.readFileSync('src/components/pages/DevVisual.tsx','utf8');
          const r=fs.readFileSync('src/components/pages/DevControlRuntime.tsx','utf8');
          const ids=[...b.matchAll(/"(DEV-01-BTN-[^"]+)":\{/g)].map(x=>x[1]);
          if(ids.length!==22||new Set(ids).size!==22)throw new Error(`expected 22 unique controls got ${ids.length}/${new Set(ids).size}`);
          if(v.includes('EMPTY_VISUAL_STATE')||v.includes('VISUAL_ONLY_NO_BUSINESS_DATA'))throw new Error('fixed visual-only state remains');
          for(const gate of ['DEV-01-GATE-DISCOVERY-RUNNING','DEV-01-GATE-DISCOVERY-PAUSED','DEV-01-GATE-MERGE','DEV-01-GATE-MERGE-CONFIRM','DEV-01-GATE-MESSAGE-REVIEW','DEV-01-GATE-CAMPAIGN-APPROVAL','DEV-01-GATE-DISPATCH','DEV-01-GATE-KILL-SWITCH'])if(!v.includes(gate))throw new Error(`missing conditional gate ${gate}`);
          for(const id of ids)if(!v.includes(id)&&!v.includes('item.controlId'))throw new Error(`control not rendered ${id}`);
          if(!r.includes('DEV_COMMAND_RUNTIME_NOT_BOUND'))throw new Error('fail-closed command boundary missing');
          for(const forbidden of ['/v1/outreach/discovery-jobs','/v1/outreach/campaigns','/v1/operations/kill-switch'])if(r.includes(forbidden))throw new Error('runtime renderer must not execute guessed endpoint directly');
          NODE
          test "$(git hash-object src/components/pages/DevVisual.module.css)" = "a6c3a26bf1145a6c4174cd97a13d47e05d472690"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/dev01-wire-governed-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/DevVisual.tsx src/domain/dev/devControlBindings.ts src/domain/dev/devProjectionPort.ts src/domain/dev/devCommandPort.ts src/components/pages/DevControlRuntime.tsx .github/workflows/dev01-wire-governed-once.yml
          git commit -m "wire(dev): replace fixed visual state with governed runtime gates"
          git push origin HEAD:new
