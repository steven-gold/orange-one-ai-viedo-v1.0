  source_text: ERP READONLY field controls are projection/presentation nodes, not independent execution entrypoints. Connector read fields are owned by ERPConnectorService because the exact Connector canonical boundary is
    uniformly owned by ERPConnectorService. Finance read fields are owned by FinanceGuardrailService because all exact READ_EXACT Finance operations are owned by FinanceGuardrailService; the separate EFFECTFUL exportProjection
    owner is excluded from this read-owner rule. Sync read fields already carry ERPConnectorService. For all twenty exact READONLY rows, field-level Operation is non-applicable and MUST remain '—'; source acquisition occurs
    through the owner service/read operations, not through a per-field Operation.
