name: One Shot Issue59 Semantic Baseline Rebind
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/one-shot-issue59-semantic-baseline-rebind.yml'
permissions:
  contents: write
concurrency:
  group: one-shot-issue59-semantic-baseline-rebind
  cancel-in-progress: true
jobs:
  rebind:
    if: github.actor != 'github-actions[bot]' && github.ref_name == 'rebuild-v2.1.1'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Rebind semantic authority baseline
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')" = "$BASE_HEAD"
          python - <<'PY'
          from pathlib import Path
          import hashlib,re,yaml
          base=Path('.github/governance-source/active/source/10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml')
          refp=Path('.github/governance-source/active/source/10_REGISTRY/REFERENCE_RULE_REGISTRY.yaml')
          val=Path('.github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py')
          anchor=yaml.safe_load(base.read_text(encoding='utf-8')) or {}
          refs=yaml.safe_load(refp.read_text(encoding='utf-8')) or {}
          snap=anchor.get('semantic_snapshot') or {}
          snap['stage_reference_rules']=refs.get('stage_reference_rules') or {}
          anchor['semantic_snapshot']=snap
          unhashed=dict(anchor); unhashed.pop('content_hash',None)
          h=hashlib.sha256(yaml.safe_dump(unhashed,allow_unicode=True,sort_keys=True,width=180).encode()).hexdigest()
          anchor['content_hash']=h
          base.write_text(yaml.safe_dump(anchor,allow_unicode=True,sort_keys=False,width=180),encoding='utf-8')
          txt=val.read_text(encoding='utf-8')
          pat=r"SEMANTIC_BASELINE_CONTENT_HASH = '[0-9a-f]{64}'"
          new="SEMANTIC_BASELINE_CONTENT_HASH = '"+h+"'"
          txt2,n=re.subn(pat,new,txt)
          if n!=1: raise SystemExit('SEMANTIC_HASH_LITERAL_OWNER_REPLACE_COUNT='+str(n))
          val.write_text(txt2,encoding='utf-8')
          print('SEMANTIC_BASELINE_CONTENT_HASH='+h)
          PY
          python governance/source-successor/materialize_derived_source_package.py
          VAL_BLOB="$(git hash-object .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py)"
          VAL_BLOB="$VAL_BLOB" python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('governance/specifications/REGISTRY.yaml')
          s=p.read_text(encoding='utf-8')
          key='".github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py"'
          pat=r'('+re.escape(key)+r':\s*)[0-9a-f]{40}'
          s2,n=re.subn(pat,lambda m:m.group(1)+os.environ['VAL_BLOB'],s)
          if n!=1: raise SystemExit('REFERENCE_SEMANTICS_TOOLCHAIN_REBIND_COUNT='+str(n))
          p.write_text(s2,encoding='utf-8')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/governance-source/active/source/10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml \
                  .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py \
                  .github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml \
                  .github/governance-source/active/source/11_EVIDENCE/audit/AUDIT_BASELINE.yaml \
                  .github/governance-source/active/source/11_EVIDENCE/audit/generated/GOVERNANCE_REQUIREMENT_INDEX.json \
                  .github/governance-source/active/source/CHECKSUMS.sha256 \
                  governance/specifications/REGISTRY.yaml
          git diff --cached --quiet && { echo "NO_REBIND_CHANGES"; exit 1; }
          git commit -m "fix(governance): rebind issue59 semantic authority baseline"
          test "$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')" = "$BASE_HEAD"
          git push origin HEAD:rebuild-v2.1.1
