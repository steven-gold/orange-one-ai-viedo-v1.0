name: ACPOS Gate25 Readonly Ledger Sync Once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Promote exact 23 Production readonly resources
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const ledgerPath='docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json';
          const evidencePath='docs/construction/evidence/GATE25_PRODUCTION_READONLY_INTERACTION_EVIDENCE_2026-09-10.json';
          const syncPath='docs/construction/evidence/GATE25_PRODUCTION_READONLY_INTERACTION_LEDGER_SYNC_2026-09-10.json';
          const formalTestPath='tests/release/formal-acceptance-ledger.test.mjs';
          const regressionPath='tests/release/gate25-production-readonly-ledger-sync.test.mjs';
          const evidence=JSON.parse(await readFile(evidencePath,'utf8'));
          if(evidence.status!=='PRODUCTION_ACCEPTED') throw new Error('EVIDENCE_NOT_ACCEPTED');
          if(evidence.production_release_sha!=='608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36') throw new Error('PRODUCTION_SHA_MISMATCH');
          if(evidence.workflow?.run_id!==34455072666 || evidence.workflow?.job_id!==102799444139 || evidence.workflow?.conclusion!=='success') throw new Error('WORKFLOW_EVIDENCE_INVALID');
          if(evidence.totals?.wb01!==14 || evidence.totals?.sg02!==9 || evidence.totals?.total!==23 || evidence.totals?.effectful_calls!==0) throw new Error('EVIDENCE_TOTALS_INVALID');
          const targets=[...evidence.wb01,...evidence.sg02];
          if(targets.length!==23 || new Set(targets.map(x=>x.resource_key)).size!==23) throw new Error('TARGET_SET_INVALID');
          const forbidden=new Set(evidence.forbidden_effectful_resources??[]);
          if(forbidden.size!==2) throw new Error('FORBIDDEN_SET_INVALID');
          for(const row of targets){
            if(row.outcome!=='PASS') throw new Error(`NON_PASS_${row.resource_key}`);
            if(forbidden.has(row.resource_key)) throw new Error(`EFFECTFUL_RESOURCE_INCLUDED_${row.resource_key}`);
          }
          if(evidence.wb01.some(x=>x.dashboard_read_http!==200 || x.drawer_state!=='READ_ONLY' || x.dialog_visible!==true || x.title_present!==true)) throw new Error('WB_EVIDENCE_INVALID');
          if(evidence.sg02.some(x=>x.projection_http!==200 || x.operation_id!=='getUiProjection' || x.drawer_visible!==true || x.heading_present!==true)) throw new Error('SG_EVIDENCE_INVALID');

          const ledger=JSON.parse(await readFile(ledgerPath,'utf8'));
          if(JSON.stringify(ledger.counts)!==JSON.stringify({PASS:5,BLOCKED:72,NOT_EXECUTED:1404})) throw new Error(`UNEXPECTED_LEDGER_BASELINE_${JSON.stringify(ledger.counts)}`);
          const byKey=new Map(ledger.entries.map(x=>[x.resource_key,x]));
          const before={...ledger.counts};
          const changed=[];
          for(const evidenceRow of targets){
            const row=byKey.get(evidenceRow.resource_key);
            if(!row) throw new Error(`LEDGER_RESOURCE_MISSING_${evidenceRow.resource_key}`);
            if(row.disposition!=='NOT_EXECUTED') throw new Error(`LEDGER_RESOURCE_NOT_PENDING_${evidenceRow.resource_key}_${row.disposition}`);
            row.disposition='PASS';
            row.reason_code='PRODUCTION_READONLY_INTERACTION_ACCEPTED';
            row.evidence_refs=[
              evidencePath,
              'GitHub Actions run 34455072666 job 102799444139',
              'Production release_sha=608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36'
            ];
            changed.push(row.resource_key);
          }
          const counts={PASS:0,BLOCKED:0,NOT_EXECUTED:0};
          for(const row of ledger.entries){
            if(!(row.disposition in counts)) throw new Error(`INVALID_DISPOSITION_${row.resource_key}`);
            counts[row.disposition]++;
          }
          if(ledger.entries.length!==1481) throw new Error(`DENOMINATOR_${ledger.entries.length}`);
          if(JSON.stringify(counts)!==JSON.stringify({PASS:28,BLOCKED:72,NOT_EXECUTED:1381})) throw new Error(`COUNT_MISMATCH_${JSON.stringify(counts)}`);
          ledger.counts=counts;
          await writeFile(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const sync={
            document_id:'ACPOS_GATE25_PRODUCTION_READONLY_INTERACTION_LEDGER_SYNC',
            status:'PHYSICAL_LEDGER_SYNCED',
            as_of:'2026-09-10T16:29:00+08:00',
            production_release_sha:evidence.production_release_sha,
            source:evidencePath,
            workflow:evidence.workflow,
            target_count:23,
            changed_count:changed.length,
            changed_resource_keys:changed,
            counts_before:before,
            counts_after:counts,
            excluded_effectful_resources:[...forbidden],
            rule:'Only the exact 23 successful Production read-only interactions are promoted from NOT_EXECUTED to PASS.'
          };
          await writeFile(syncPath,JSON.stringify(sync,null,2)+'\n');

          let formalTest=await readFile(formalTestPath,'utf8');
          const oldCount='assert.deepEqual(ledger.counts,{PASS:5,BLOCKED:72,NOT_EXECUTED:1404});';
          const newCount='assert.deepEqual(ledger.counts,{PASS:28,BLOCKED:72,NOT_EXECUTED:1381});';
          if(!formalTest.includes(oldCount)) throw new Error('FORMAL_TEST_BASELINE_NOT_FOUND');
          formalTest=formalTest.replace(oldCount,newCount);
          await writeFile(formalTestPath,formalTest);

          await writeFile(regressionPath,`import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("Gate25 Production readonly ledger sync promotes exact 23 and excludes effectful resources",async()=>{\n  const evidence=JSON.parse(await readFile("${evidencePath}","utf8"));\n  const sync=JSON.parse(await readFile("${syncPath}","utf8"));\n  const ledger=JSON.parse(await readFile("${ledgerPath}","utf8"));\n  assert.equal(evidence.status,"PRODUCTION_ACCEPTED");\n  assert.deepEqual(evidence.totals,{wb01:14,sg02:9,total:23,effectful_calls:0});\n  assert.equal(sync.changed_count,23);\n  assert.equal(new Set(sync.changed_resource_keys).size,23);\n  assert.deepEqual(sync.counts_before,{PASS:5,BLOCKED:72,NOT_EXECUTED:1404});\n  assert.deepEqual(sync.counts_after,{PASS:28,BLOCKED:72,NOT_EXECUTED:1381});\n  assert.deepEqual(ledger.counts,sync.counts_after);\n  const changed=new Set(sync.changed_resource_keys);\n  for(const key of evidence.forbidden_effectful_resources) assert.ok(!changed.has(key));\n  for(const row of ledger.entries.filter(x=>changed.has(x.resource_key))){\n    assert.equal(row.disposition,"PASS");\n    assert.equal(row.reason_code,"PRODUCTION_READONLY_INTERACTION_ACCEPTED");\n    assert.ok(row.evidence_refs.includes("${evidencePath}"));\n  }\n});\n`);
          console.log(JSON.stringify(sync));
          NODE
      - name: Validate synchronized ledger
        run: |
          node --test tests/release/formal-acceptance-ledger.test.mjs tests/release/gate25-production-readonly-ledger-sync.test.mjs
          node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit synchronized ledger and remove one-shot workflow
        run: |
          rm .github/workflows/gate25-readonly-ledger-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json \
                  docs/construction/evidence/GATE25_PRODUCTION_READONLY_INTERACTION_LEDGER_SYNC_2026-09-10.json \
                  tests/release/formal-acceptance-ledger.test.mjs \
                  tests/release/gate25-production-readonly-ledger-sync.test.mjs \
                  .github/workflows/gate25-readonly-ledger-sync-once.yml
          git commit -m "evidence(gate25): promote 23 Production readonly interactions"
          git push origin HEAD:new
