name: Temp 18 Page System Sync Gap Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - name: Cross-check current system rules against 18 pages
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          import json,re

          docs={
          "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
          "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
          "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
          "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
          "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
          "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
          "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
          }
          def text(fn):
              d=Document(fn)
              return '\n'.join([p.text for p in d.paragraphs]+[c.text for t in d.tables for r in t.rows for c in r.cells])
          T={k:text(v) for k,v in docs.items()}
          req={
            "CORE-01":{
              "QCP-CORE":["QCP-CORE-BASELINE-V1"],
              "criteria-version":["CriteriaVersion","criteria_version"],
              "concrete-eval":["目標／Blueprint 意圖符合","故事／邏輯結構","角色／DNA 規劃一致性"],
              "hard-block":["Rights / Policy","HARD BLOCK"],
            },
            "ASSET-01":{
              "image-profile":["QCP-ASSET-IMAGE-V1"],
              "audio-profile":["QCP-ASSET-AUDIO-V1"],
              "concrete-image":["人物／角色 DNA 一致性","構圖／取景","解剖／幾何／生成瑕疵"],
              "concrete-audio":["聲音身份／語意一致","雜訊／爆音／失真","音量／動態"],
            },
            "VIDEO-01":{
              "video-profile":["QCP-VIDEO-BASELINE-V1"],
              "dimensions":["Script Compliance","Character / Identity Stability","Motion / Body Continuity","Camera / Gaze"],
              "threshold":["95"],
            },
            "EDIT-01":{
              "edit-profile":["QCP-EDIT-FINAL-V1"],
              "lipsync":["嘴型／口型同步"],
              "subtitle":["字幕內容正確","字幕時間／可讀性／安全區"],
              "stage-map":["Stage 01 Assembly","Stage 02 Audio","Stage 03 Sync","Stage 04 Finalize"],
            },
            "QA-01":{
              "final-profile":["QCP-QA-FINAL-OUTPUT-V1"],
              "identity":["人物／角色一致性"],
              "frame":["幀間連續性"],
              "lip":["嘴型／口型同步"],
              "subtitle":["字幕內容正確","字幕時間／可讀性／安全區"],
              "required-checks":["Required Checks","Evidence Refs"],
            },
            "SYS-01":{
              "content-incomplete":["CONTENT_INCOMPLETE"],
              "criteria-lifecycle":["DRAFT","REVIEW","APPROVED"],
              "sg02-denom":["SG-02","12"],
              "stale-evidence":["STALE_QA_EVIDENCE"],
            },
            "DEV-01":{
              "qa-profile-ref":["criteria_version_id","scorecard_id"],
              "exact-deliverable":["exact output","checksum"],
              "rights-gate":["Rights","Policy"],
            },
            "SOC-01":{
              "qa-profile-ref":["criteria_version_id","scorecard_id"],
              "qa-gate":["qa_gate_status","PASS"],
              "blocking-findings":["open_blocking_findings"],
              "exact-content":["exact_content_ref","checksum"],
              "rights-policy":["Rights","Policy"],
            },
            "SG-02":{
              "profiles":["QCP-CORE-BASELINE-V1","QCP-ASSET-IMAGE-V1","QCP-ASSET-AUDIO-V1","QCP-VIDEO-BASELINE-V1","QCP-EDIT-FINAL-V1","QCP-QA-FINAL-OUTPUT-V1"],
              "submit-review":["CTRL-ADMIN-SG-02-ACT-04-ACT-SUBMIT-REVIEW","submitGovernedResourceReview"],
              "denominator":["Control Denominator = 12"],
              "checks":["QA-CHK-OUTPUT-IDENTITY","QA-CHK-RIGHTS","QA-CHK-RECHECK"],
            },
            "ADMIN-STR-01":{
              "qa-separation":["QA","strategy"],
              "export-governance":["exportProjection"],
            }
          }
          result={}
          for page,groups in req.items():
              result[page]={}
              for g,needles in groups.items():
                  result[page][g]={"needles":needles,"present":[n for n in needles if n.lower() in T[page].lower()],"pass":all(n.lower() in T[page].lower() for n in needles)}
          # Explicit current-definition contradictions / unresolved authority markers.
          patterns=[
            ("LOCK_REVIEW_UNRESOLVED",r'unresolved LockReview'),
            ("STALE_EDIT_PORT_COUNT",r'15 ports|13 operations'),
            ("OPERATION_REGISTRY_UNRESOLVED",r'exact current Operation Registry binding unresolved'),
            ("SOURCE_NOT_DEFINED",r'SOURCE_NOT_DEFINED'),
            ("REQUIRE_EXACT_BINDING",r'REQUIRE_EXACT_BINDING'),
            ("NO_PUBLIC_API_ID",r'NO_PUBLIC_API_ID_IN_CURRENT_AUTHORITY'),
            ("RUNTIME_IMPL_REQUIRED",r'NEW_AUTHORITY_RUNTIME_IMPLEMENTATION_REQUIRED'),
            ("MISSING_AT_VALIDATION",r'MISSING at validation'),
          ]
          contradictions={}
          for page,body in T.items():
              hits={}
              for label,pat in patterns:
                  m=re.findall(pat,body,re.I)
                  if m:hits[label]=len(m)
              contradictions[page]=hits
          print("SYNC_GAP_RESULT",json.dumps({"requirements":result,"markers":contradictions},ensure_ascii=False))
          PY
