render_rules:
  cards_only: true
  compact_card_requirement: true
  chart_policy:
    allowed:
    - linear_progress_bar_for_average_progress
    - linear_progress_bar_for_project_or_topic_progress_when_value_exists
    forbidden:
    - line_chart
    - bar_chart
    - area_chart
    - pie_chart
    - donut_chart
    - radar_chart
    - sparkline
    - trend_arrow
    - delta_badge
    - week_over_week
    - month_over_month
  secondary_metadata_policy: FORBIDDEN unless an allowed field exists in the section render schema
  fake_data_policy: FORBIDDEN; null or unavailable = —
  sorting: API response order only; no client sorting
  search_filter_pagination: FORBIDDEN in WB-01 Main Workspace and Drawer because no registered controls exist
  refresh_polling: Initial page load fetch once; each registered SECTION_OPEN may read again. No auto polling, timer, auto
    refresh or new Refresh control.
  external_links: FORBIDDEN unless a future registered control/action explicitly authorizes navigation
  topic_total_operation_time:
    required_location: Section 7 Project Progress -> each Topic row
    field: total_operation_time_seconds
    format: HHH:MM:SS
    missing: — + runtime/data-contract gap; never compute or guess
  progress_semantics: Business completion percentage only. Never use EDIT timeline/seek/playhead semantics.
control_contract:
  control_type: SECTION_OPEN
  operation_id: getDashboardReadModel
  method: GET
  path: /v1/dashboard/read-model
  workflow: READ_ONLY
  state_transition: NONE
  event: null
  authorization_model: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY
  server_guards:
  - identity
  - account_page_permission
  - account_section_permission
  - account_control_permission
  - scope
  - condition
  - classification_mask
  - audit
  trigger_surface: Each card header trailing 查看 button only
  card_body_clickable: false
  row_clickable: false
  drawer:
    component_uid: WB-01-CMP-DRAWER-PROJECTION
    visual_uid: WB-01-VIS-DRAWER-PROJECTION
    data_scope: the corresponding section render schema only; never expose unrelated dashboard/deep department payload
    fields: EXACTLY render_schema_registry[section_key].visible_fields plus permitted trace metadata; no empty fields[] ambiguity
    common_footer_metadata:
    - read_model_version
    - correlation_id
    footer_actions:
    - 關閉 / 关闭 / Close
    loading: skeleton preserving drawer geometry
    empty: empty state; no mock rows
    error: actual error code + permitted reason; no fabricated success
    focus_management: required
    escape_close_backdrop: inherit Global Visual
    audit_event: ui.interaction.audited
permission_and_render_gates:
  page_gate_uid: WB-01-GATE-PAGE-READ
  page_gate: identity + page:workspace:WB-01 VIEW + workspace.dashboard.view + scope + condition + classification + audit
  section_gate_uid: WB-01-GATE-SECTION-READ
  section_render_requires: page gate + exact section VIEW + exact field READ/MASK outcome
  control_gate_uid: WB-01-GATE-CONTROL-READ
  control_render_requires: visible section + exact control VIEW
  permission_denied_behavior: HIDDEN; do not render disabled unauthorized card/control
  field_mask_behavior: MASK using backend-provided mask; do not infer hidden value
  state_disabled_behavior: Only an authorized existing control may be Disabled while LOADING or temporarily unavailable by
    state; permission denial never uses Disabled.
  role_name_authorization: FORBIDDEN
states:
  LOADING: Use skeleton in exact card geometry; value must not temporarily display 0.
  EMPTY: Preserve exact geometry; show — / empty text only; no sample rows.
  ERROR: Preserve exact geometry; show real error state. Same registered 查看 control may be invoked again; do not create Retry
    button.
  POLICY_BLOCKED: If permission denied, hide. If an already-authorized resource receives a discloseable policy block from
    backend, show only permitted blocked reason.
  VERSION_CONFLICT: Show stale/conflict status; no write-resolution. User may invoke same read control again.
  REVIEW_REQUIRED: Display returned read-only review status/count only; no approve action.
  EXTERNAL_PENDING: Display returned Pending state only; never promote to Completed locally.
  READ_ONLY: Normal loaded mode; no edit/create/delete/approve/lock/publish controls.
  ARCHIVED: Mark historical data as Archived only when returned by Read Model; never treat as current.
state_transitions:
- INITIAL -> LOADING on page read
- LOADING -> READ_ONLY on successful authorized projection
- LOADING -> EMPTY on successful projection with no visible authorized data
- LOADING -> ERROR on read failure
- READ_ONLY/EMPTY/ERROR/VERSION_CONFLICT -> LOADING only when user invokes an existing registered SECTION_OPEN control or
  page is explicitly re-entered
- Any displayed section may present REVIEW_REQUIRED / EXTERNAL_PENDING / ARCHIVED only when those states are returned by the
  read model; these are presentation states, not WB-01 business mutations
- Permission loss -> HIDDEN/POLICY_BLOCKED according to backend disclosure policy; no client-side authorization inference
error_registry:
- error_uid: WB-01-ERR-READ-001
  context: Dashboard read failed
  recovery: Preserve geometry; show actual reason; allow re-invocation of same registered read control
- error_uid: WB-01-ERR-POLICY-001
  context: Permission/scope/classification/policy blocked
  recovery: Hide unauthorized content/control or show only discloseable blocked state
- error_uid: WB-01-ERR-SCHEMA-001
  context: Returned section object contains unsupported shape/key required for rendering
  recovery: Do not invent field; render defined keys only and report data-contract gap
- error_uid: WB-01-ERR-UNDEFINED-001
  context: Unregistered card/control/chart/action/field/navigation requested
  recovery: BLOCK + REPORT_AUTHORITY_GAP
