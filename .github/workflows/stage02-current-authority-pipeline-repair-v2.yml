name: Stage-02 Current Authority Pipeline Repair V2

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-current-authority-pipeline-repair-v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  repair-r6-r10:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Re-prove Current governance and WU-003 before repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
          python governance/ci/governance_resolver.py
          python governance/ci/validate_canonical_rule_registry.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          state=yaml.safe_load(Path('governance/test/ACTIVE_STATE.yaml').read_text()) or {}
          active=state.get('active_work_unit') or {}
          assert active.get('work_unit_uid') == 'WU-STAGE02-COMMON-ENGINE-003', active
          assert active.get('canonical_owner') == 'governance/ci/build_stage02_product_design_authority_intake_r6.py', active
          assert active.get('current_status') == 'IN_PROGRESS_COMMON_ENGINE_INTERRUPT', active
          assert int(active.get('product_blocker_credit') or 0) == 0
          assert state.get('execution',{}).get('current_stage') == 'STAGE-02-TESTED-BLOCKED'
          assert state.get('execution',{}).get('stage2',{}).get('stage_exit_allowed') is False
          print('PASS: exact WU-003 context resolved with zero product blocker credit')
          PY
          python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py

      - name: Patch canonical R5 persistence semantics without whole-workflow rewrite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          path=Path('.github/workflows/stage02-actual-test.yml')
          text=path.read_text(encoding='utf-8')
          start='      - name: Persist exact Current R5 request and synchronized Current projectors\n'
          end='      - name: Reconcile canonical preflight after Current R5 state persistence\n'
          assert text.count(start)==1, text.count(start)
          assert text.count(end)==1, text.count(end)
          payload=''
          replacement=base64.b64decode(payload).decode('utf-8')
          a=text.index(start)
          b=text.index(end,a)
          path.write_text(text[:a]+replacement+text[b:],encoding='utf-8')
          print('PASS: R5 persistence semantics patched to authorized-subset plus idempotent-noop behavior')
          PY

      - name: Build and validate Current R6-R10 authority pipeline
        shell: bash
        run: |
          set -euo pipefail
          python governance/ci/compile_stage_execution_preflight.py --materialize
          python governance/ci/compile_stage_execution_preflight.py --check
          python governance/ci/validate_current_stage2_required_outputs.py
          python governance/ci/build_stage02_product_design_authority_intake_r6.py
          python governance/ci/validate_stage02_product_design_authority_intake_r6.py
          python governance/ci/test_stage02_approved_product_authority_r7_negative.py
          python governance/ci/build_stage02_core01_product_authority_review_r8.py
          python governance/ci/validate_stage02_core01_product_authority_review_r8.py
          python governance/ci/build_stage02_asset01_product_authority_review_r9.py
          python governance/ci/validate_stage02_asset01_product_authority_review_r9.py
          python governance/ci/build_stage02_product_authority_approval_docket_r10.py
          python governance/ci/validate_stage02_product_authority_approval_docket_r10.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          r5=yaml.safe_load(Path('governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_REQUEST_R5.yaml').read_text()) or {}
          r6=yaml.safe_load(Path('governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml').read_text()) or {}
          r10=yaml.safe_load(Path('governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml').read_text()) or {}
          d5=r5.get('denominators') or {}
          d6=r6.get('denominators') or {}
          d10=r10.get('denominators') or {}
          assert d5.get('current_open_problems') == 150
          assert d5.get('product_design_authority_requests') == 146
          assert d5.get('external_authority_requests') == 4
          assert d6.get('current_open_stage02_problems') == 150
          assert d6.get('product_design_contract_blockers_locked_for_intake') == 146
          assert d6.get('external_authority_blockers_preserved_outside_product_intake') == 4
          assert len(r6.get('records') or []) == 146
          assert d10.get('total_product_authority_decisions') == 146
          assert d10.get('external_authority_decisions_preserved_outside_product_docket') == 4
          assert len(r10.get('records') or []) == 146
          assert d10.get('approved_decisions') == 0
          assert d10.get('r7_materializable_decisions') == 0
          assert d10.get('effective_stage02_blocker_reduction_claimed') == 0
          print('PASS: Current partition is exactly 146 product + 4 external = 150 with zero authority credit')
          PY

      - name: Prove bounded repair delta and persist evidence child
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed={
            '.github/workflows/stage02-actual-test.yml',
            'governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json',
            'governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml',
            'governance/test/stage02/STAGE02_CORE01_PRODUCT_AUTHORITY_REVIEW_R8.yaml',
            'governance/test/stage02/STAGE02_ASSET01_PRODUCT_AUTHORITY_REVIEW_R9.yaml',
            'governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml',
          }
          base=Path('00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT')
          for name in ['REQUIRED_FIELD_MANIFEST','FUNCTIONAL_CHAIN_MANIFEST','EFFECTIVE_CONTRACT_OVERLAY','DEPENDENCY_TOPOLOGY','DENOMINATOR_SNAPSHOT','CLASSIFICATION_RULESET','CHANGE_IMPACT_MAP','STAGE_EXECUTION_PREFLIGHT_RECEIPT','CURRENT_PROBLEM_REGISTER','RESOLUTION_LEDGER','GOVERNANCE_EXECUTION_CONTEXT_RECEIPT','EXECUTION_CYCLE_PREFLIGHT_RECEIPT']:
              allowed.add((base/f'{name}.yaml').as_posix())
          status=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True)
          actual={line[3:] for line in status.splitlines() if line.strip()}
          unexpected=sorted(actual-allowed)
          assert not unexpected, {'unexpected_repair_delta':unexpected,'actual':sorted(actual)}
          required={
            '.github/workflows/stage02-actual-test.yml',
            'governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml',
            'governance/test/stage02/STAGE02_CORE01_PRODUCT_AUTHORITY_REVIEW_R8.yaml',
            'governance/test/stage02/STAGE02_ASSET01_PRODUCT_AUTHORITY_REVIEW_R9.yaml',
            'governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml',
          }
          assert required.issubset(actual), {'missing_required_delta':sorted(required-actual),'actual':sorted(actual)}
          print(f'PASS: repair delta bounded changed={len(actual)}')
          PY
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage02-actual-test.yml governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml governance/test/stage02/STAGE02_CORE01_PRODUCT_AUTHORITY_REVIEW_R8.yaml governance/test/stage02/STAGE02_ASSET01_PRODUCT_AUTHORITY_REVIEW_R9.yaml governance/test/stage02/STAGE02_PRODUCT_AUTHORITY_APPROVAL_DOCKET_R10.yaml 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/*.yaml
          git commit -m 'test(stage02): persist current authority pipeline R6-R10 repair evidence'
          git push origin HEAD:rebuild-v2.1.1
          echo "REPAIR_EVIDENCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Revalidate persisted repair child with complete Full-Line
        shell: bash
        run: |
          set -euo pipefail
          python governance/ci/compile_stage_execution_preflight.py --check
          python governance/ci/validate_current_stage2_required_outputs.py
          python governance/ci/validate_stage02_product_design_authority_intake_r6.py
          python governance/ci/test_stage02_approved_product_authority_r7_negative.py
          python governance/ci/validate_stage02_core01_product_authority_review_r8.py
          python governance/ci/validate_stage02_asset01_product_authority_review_r9.py
          python governance/ci/validate_stage02_product_authority_approval_docket_r10.py
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          git diff --exit-code -- governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json
          python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py

      - name: Close WU-003 only after persisted repair PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,yaml
          path=Path('governance/test/ACTIVE_STATE.yaml')
          state=yaml.safe_load(path.read_text()) or {}
          active=state.get('active_work_unit') or {}
          assert active.get('work_unit_uid') == 'WU-STAGE02-COMMON-ENGINE-003', active
          assert int(active.get('product_blocker_credit') or 0) == 0
          old_attempt=state.get('stage02_active_attempt') or {}
          old_last_uid=old_attempt.get('last_closed_common_engine_work_unit_uid')
          old_last_run=old_attempt.get('common_engine_closure_full_line_run_id')
          old_last_job=old_attempt.get('common_engine_closure_full_line_job_id')
          evidence_head=os.environ['REPAIR_EVIDENCE_HEAD']
          run_id=int(os.environ['GITHUB_RUN_ID'])
          state['schema_version']=20
          state['status']='ACTIVE_STAGE2_TESTED_BLOCKED_CURRENT_GOVERNANCE'
          state['next_action']='AWAIT_OR_INGEST_SEPARATELY_APPROVED_CURRENT_STAGE02_AUTHORITY_REQUEST_R5_INPUTS; DO_NOT_MATERIALIZE_WITHOUT_APPROVED_AUTHORITY'
          state.pop('active_work_unit',None)
          state['resume_control']={
            'chat_memory_is_authority':False,
            'historical_stage2_results_are_current_state':False,
            'stage2_execution_requires_fresh_entry_resolution':False,
            'effectful_stage2_execution_before_entry_resolution':'PASS_ENTRY_RESOLVED',
            'current_resume_point':'STAGE2_TESTED_BLOCKED_OWNING_LAYER_REMEDIATION',
            'last_closed_work_unit_uid':'WU-STAGE02-COMMON-ENGINE-003',
            'last_closed_work_unit_result':'CLOSED_VERIFIED_NO_PRODUCT_CREDIT',
            'last_closed_work_unit_full_line_run_id':run_id,
            'last_closed_work_unit_evidence_head':evidence_head,
            'exact_next_action':'AWAIT_OR_INGEST_SEPARATELY_APPROVED_CURRENT_STAGE02_AUTHORITY_REQUEST_R5_INPUTS; DO_NOT_MATERIALIZE_WITHOUT_APPROVED_AUTHORITY',
          }
          sysrun=state.setdefault('full_lifecycle_governance_system_test',{})
          sysrun['full_line_github_result']='PASS_EXECUTION_SOURCE_HEAD'
          sysrun['full_line_verification_run_id']=run_id
          sysrun['persisted_head_revalidation_required']=True
          attempt=state.setdefault('stage02_active_attempt',{})
          attempt.pop('active_common_engine_work_unit_uid',None)
          attempt['previous_closed_common_engine_work_unit_uid']=old_last_uid
          attempt['previous_common_engine_closure_full_line_run_id']=old_last_run
          if old_last_job is not None:
              attempt['previous_common_engine_closure_full_line_job_id']=old_last_job
          attempt.pop('common_engine_closure_full_line_job_id',None)
          attempt['last_closed_common_engine_work_unit_uid']='WU-STAGE02-COMMON-ENGINE-003'
          attempt['common_engine_closure_full_line_run_id']=run_id
          attempt['common_engine_closure_source_head']=evidence_head
          attempt['common_engine_product_blocker_credit']=0
          attempt['next_action']='AWAIT_OR_INGEST_SEPARATELY_APPROVED_CURRENT_STAGE02_AUTHORITY_REQUEST_R5_INPUTS; DO_NOT_MATERIALIZE_WITHOUT_APPROVED_AUTHORITY'
          attempt['governance_status']='CURRENT_FROZEN_ATTEMPT_FRESHLY_REVALIDATED_BLOCKED'
          material=state.setdefault('stage02_material_remediation',{})
          material['status']='STRUCTURAL_REMEDIATION_FRESHLY_REEXECUTED_BLOCKED_ON_FUNCTIONAL_GAPS'
          material['external_authority_resolution_claimed']=False
          material['current_specification_mutated']=False
          problem=state.setdefault('stage02_current_problem_state',{})
          problem['bounded_completion_admissible_count']=0
          problem['exact_external_authority_required_count']=4
          problem['no_authorized_bounded_completion_basis_count']=146
          assert state.get('execution',{}).get('stage2',{}).get('stage_exit_allowed') is False
          path.write_text(yaml.safe_dump(state,sort_keys=False,allow_unicode=True),encoding='utf-8')
          print('PASS: WU-003 state closed with zero product credit and parent authority-ingestion boundary restored')
          PY
          python governance/ci/compile_stage_execution_preflight.py --materialize
          python governance/ci/compile_stage_execution_preflight.py --check
          python governance/ci/validate_current_stage2_required_outputs.py
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/ACTIVE_STATE.yaml governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/*.yaml
          git commit -m 'test(stage02): close current authority pipeline common-engine WU-003'
          git push origin HEAD:rebuild-v2.1.1

      - name: Revalidate exact WU-003 closure head
        shell: bash
        run: |
          set -euo pipefail
          python governance/ci/compile_stage_execution_preflight.py --check
          python governance/ci/validate_current_stage2_required_outputs.py
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          git diff --exit-code -- governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json
          python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          state=yaml.safe_load(Path('governance/test/ACTIVE_STATE.yaml').read_text()) or {}
          assert not state.get('active_work_unit')
          assert state.get('resume_control',{}).get('last_closed_work_unit_uid') == 'WU-STAGE02-COMMON-ENGINE-003'
          assert state.get('stage02_current_problem_state',{}).get('bounded_completion_admissible_count') == 0
          assert state.get('stage02_current_problem_state',{}).get('exact_external_authority_required_count') == 4
          assert state.get('stage02_current_problem_state',{}).get('no_authorized_bounded_completion_basis_count') == 146
          assert state.get('execution',{}).get('current_stage') == 'STAGE-02-TESTED-BLOCKED'
          assert state.get('execution',{}).get('stage2',{}).get('stage_exit_allowed') is False
          print('PASS: WU-003 closed; Stage-02 remains blocked only at explicit-authority boundary')
          PY

      - name: Remove one-shot V2 workflow and refresh final consumer evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage02-current-authority-pipeline-repair-v2.yml
          python governance/ci/validate_active_consumer_reference_integrity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json
          git commit -m 'chore(stage02): remove one-shot current authority pipeline repair v2'
          git push origin HEAD:rebuild-v2.1.1
          python governance/ci/compile_stage_execution_preflight.py --check
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          git diff --exit-code -- governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json
          python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
          echo "PASS: final persisted HEAD $(git rev-parse HEAD) retains no one-shot repair workflow"
