- 概念: CORE Canon / Production Package
  Canonical Owner: ACPOS-AI-04
  AI-07 行為: 只讀 exact approved/locked refs；不得在社群域改 CORE Canon。
- 概念: Media Production
  Canonical Owner: ACPOS-AI-05
  AI-07 行為: 引用 exact approved asset/release refs；不得建立第二素材庫。
- 概念: Email / CRM Business Development
  Canonical Owner: ACPOS-AI-06
  AI-07 行為: 不擁有 Email、Lead、CRM、Meeting/Proposal 等生命週期。
- 概念: Social Publishing
  Canonical Owner: ACPOS-AI-07
  AI-07 行為: 唯一 owner：Canonical Social Content → Platform Variant → Publish → Post Truth → Metrics。
- 概念: Strategy
  Canonical Owner: ACPOS-AI-08
