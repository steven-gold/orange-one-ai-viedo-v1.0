name: EDIT01 authority binding validation
on:
  push:
    paths:
      - '.github/workflows/edit01-local-wiring-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize EDIT control bindings from FINAL_LOCKED authority
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          path=Path('authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml')
          data=yaml.safe_load(path.read_text())
          controls=data['registries']['controls_fields']
          actions=data['registries']['actions']
          action_ids={x['action_uid'] for x in actions}
          control_matrix={x['control_uid']:x for x in data['binding_matrices']['control_to_section_component_visual_gate_permission']}
          action_matrix={x['action_uid']:x for x in data['binding_matrices']['action_to_permission_gate_effect']}
          assert len(controls)==160
          assert len(action_ids)==124
          assert len(control_matrix)==160
          assert len(action_matrix)==124
          out={}
          for control in controls:
              uid=control['control_uid']
              mapping=control_matrix[uid]
              action=control.get('action_uid')
              if action is not None:
                  assert action in action_ids
                  assert action in action_matrix
              out[uid]={
                  'action_uid':action,
                  'gate_uid':mapping.get('gate_uid'),
                  'permission_uid':mapping.get('permission_uid'),
                  'effect_type':action_matrix[action]['effect_type'] if action in action_matrix else None,
              }
          assert len(out)==160
          target=Path('src/domain/edit/editControlBindings.ts')
          target.write_text(
              '// GENERATED FROM EDIT-01 FINAL_LOCKED AUTHORITY. DO NOT HAND-EDIT.\n'
              +'export const EDIT_CONTROL_BINDINGS = '+json.dumps(out,ensure_ascii=False,separators=(',',':'))+' as const;\n'
              +'export type EditControlUid = keyof typeof EDIT_CONTROL_BINDINGS;\n'
              +'export const EDIT_MATERIALIZED_CONTROL_COUNT = 160 as const;\n'
              +'export const EDIT_MATERIALIZED_ACTION_COUNT = 124 as const;\n'
          )
          print('controls',len(out),'actions',len(action_ids),'control_actions',sum(1 for x in out.values() if x['action_uid']))
          PY
      - name: Verify authority and forbidden implementation drift
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('src/domain/edit/editControlBindings.ts','utf8');
          if(!b.includes('EDIT_MATERIALIZED_CONTROL_COUNT = 160')) throw new Error('EDIT control count mismatch');
          if(!b.includes('EDIT_MATERIALIZED_ACTION_COUNT = 124')) throw new Error('EDIT action count mismatch');
          for(const file of ['src/domain/edit/editClientPort.ts','src/domain/edit/editProjectionPort.ts','src/domain/edit/editClientState.ts']){
            const s=fs.readFileSync(file,'utf8');
            for(const bad of ['/v1/edit/actions','requestTaskExecution','createVoiceRuntimeProfile']) if(s.includes(bad)) throw new Error(file+' contains forbidden '+bad);
          }
          NODE
          test "$(git hash-object src/components/pages/EditVisual.module.css)" = "6ec980b81fb6930a019d2b9ee6168e9d0f6f1d4e"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated registry and self-clean
        run: |
          rm -f .github/workflows/edit01-local-wiring-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/edit/editControlBindings.ts .github/workflows/edit01-local-wiring-once.yml
          git commit -m "materialize(edit): bind 160 controls to FINAL_LOCKED authority"
          git push origin HEAD:new
