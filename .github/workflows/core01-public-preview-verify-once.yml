name: CORE01 public preview verify once
on:
  push:
    paths:
      - '.github/workflows/core01-public-preview-verify-once.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify pushed preview tree without invalid conditional-DOM grep
        run: |
          git fetch origin acpos-live-preview
          PREVIEW_SHA=$(git rev-parse origin/acpos-live-preview)
          test "$PREVIEW_SHA" = "a265264b7738be1778e6b94c4e1819dae3ef83e9"
          test $(git ls-tree -r --name-only "$PREVIEW_SHA" preview | grep -E '^preview/[^/]+\.html$' | wc -l) -eq 18
          git ls-tree -r --name-only "$PREVIEW_SHA" preview | grep -q '^preview/_next/static/chunks/'
          ! git ls-tree -r --name-only "$PREVIEW_SHA" preview | grep -q '^preview/_next/chunks/'
          git show "$PREVIEW_SHA":preview/index.html | grep -q 'data-page-uid="workspace:WB-01"'
          git show "$PREVIEW_SHA":preview/index.html | grep -q '\./_next/static/'
          git show "$PREVIEW_SHA":preview/core.html | grep -q 'data-page-uid="CORE-01"'
      - name: Chromium verify commit-specific rawcdn preview
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cat > public-preview-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const sha='a265264b7738be1778e6b94c4e1819dae3ef83e9';
            const base=`https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/${sha}/preview/`;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[];
            const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText}`));

            await page.goto(base+'index.html',{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('[data-page-uid="workspace:WB-01"]');
            const sections=await page.locator('[data-section-id^="SEC-WORKSPACE-WB-01-"]').count();
            const buttons=page.locator('[data-control-id^="CTRL-WORKSPACE-WB-01-"]');
            const count=await buttons.count();
            if(sections!==14||count!==14) throw new Error(`public homepage mismatch sections=${sections} controls=${count}`);
            for(let i=0;i<count;i++){
              await buttons.nth(i).click();
              const drawer=page.locator('[data-component-uid="WB-01-CMP-DRAWER-PROJECTION"]');
              await drawer.waitFor({state:'visible',timeout:10000});
              const state=await drawer.getAttribute('data-state');
              if(!['LOADING','ERROR','READ_ONLY'].includes(state)) throw new Error(`public drawer state ${state}`);
              if(await page.locator('#acpos-preview-drawer').count()) throw new Error('forbidden preview drawer');
              await page.keyboard.press('Escape');
              await drawer.waitFor({state:'detached'});
            }
            if(await page.locator('a[data-nav-id="NAV-02"]').getAttribute('href')!=='core.html') throw new Error('public preview nav is not core.html');
            if(pageErrors.length||failed.length) throw new Error(`public homepage browser errors page=${JSON.stringify(pageErrors)} failed=${JSON.stringify(failed)}`);

            await page.goto(base+'core.html',{waitUntil:'networkidle',timeout:60000});
            await page.locator('[data-page-uid="CORE-01"]').waitFor({state:'visible'});
            for(const id of ['CORE-01-CTL-PROJECT','CORE-01-CTL-TOPIC','CORE-01-LST-WORK-ITEMS','CORE-01-LST-THREADS']){
              if(await page.locator(`[data-control-id="${id}"] option`).count()!==1) throw new Error(`public CORE invented options ${id}`);
            }
            const posts=[];
            page.on('request',r=>{if(r.method()==='POST') posts.push(r.url())});
            await page.locator('[data-control-id="CORE-01-BTN-PROJECT-VALIDATE"]').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('REQUIRED_PROJECT_VERSION_REF_MISSING'));
            if(posts.length) throw new Error('public CORE emitted POST without exact ref '+posts.join(','));
            if(await page.locator('#acpos-preview-drawer').count()) throw new Error('CORE preview contamination');
            console.log('PUBLIC_STATIC_HYDRATION_PASS sections=14 controls=14 drawer=14/14');
            console.log('PUBLIC_CORE01_FAIL_CLOSED_PASS posts=0');
            console.log('PUBLIC_PAGE_ERRORS',pageErrors);
            console.log('PUBLIC_FAILED_REQUESTS',failed);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node public-preview-check.cjs
          rm -f public-preview-check.cjs
      - name: Self clean
        if: always()
        run: |
          rm -f .github/workflows/core01-public-preview-verify-once.yml public-preview-check.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/core01-public-preview-verify-once.yml
          git commit -m 'chore(core01): remove public preview verifier'
          git push origin HEAD:new
