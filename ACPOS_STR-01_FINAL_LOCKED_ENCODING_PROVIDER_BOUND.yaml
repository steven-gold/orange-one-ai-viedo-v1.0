hard_locks:
- Only workspace:STR-01 is the current executable Strategic Center workspace.
- Strategic Center is a Strategic Intelligence and human decision-support workspace, not an automatic decision/execution system.
- No raw AI response can directly become formal strategy decision, budget approval, workflow change, task, production action, release or publish.
- External intelligence cannot silently overwrite confirmed decisions/current governed internal truth.
- Single AI and Multi AI share the ACPOS AI Conversation Core; Multi AI asks the same question using the same Strategic Context.
- No manual Provider/Model picker; routing is handled by ACPOS API/Capability Router.
- Provider display in conversation is brand only; full technical API details remain in API Management.
- Strategy Recommendation, Strategy Alert, Resource Proposal and Decision Brief remain distinct outputs.
- Resource Proposal is a recommendation only; budget/capacity approval belongs to its owner module.
- Cross-module actions remain in A10 Finance / A04 Workflow / A08 Governance / Core or department owner; STR-01 must not duplicate them.
- Candidate/output/memory/history versions are immutable; revisions append new versions.
- Missing source, confidence, finance, capacity, KPI, risk, evidence or execution values remain —/incomplete; AI may not invent them.
- No unlisted Section/Component/Control/Action/State/Gate/Permission/Port/Business Sample Data.
- STR-01 strategic AI instructions are provider-neutral and bind only to the shared ACPOS Provider Adapter Authority V1.2.
- STR-01 must not store or author provider-specific prompt syntax, request JSON keys, model endpoint paths or secrets.
- SINGLE/MULTI/CROSS AI provider execution must resolve through the system-owned TEXT_CHAT ProviderModelProfile route.
- Provider fallback must recompile from canonical Strategic Context/Instruction; cross-provider compiled-prompt reuse is FORBIDDEN.
