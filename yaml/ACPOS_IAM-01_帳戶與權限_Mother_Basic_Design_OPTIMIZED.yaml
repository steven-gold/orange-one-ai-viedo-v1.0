    text: 10. Component Registry
  - index: 26
    style: Heading 1
    text: 11. Control Registry / 14 個 Current Controls
  - index: 28
    style: Normal
    text: 所有 Effectful Control 必須具有 Default / Hover / Focus / Loading / Disabled(reason) / Success / Error 狀態；Disabled 不可只有降透明度而沒有可讀原因。
  - index: 29
    style: Heading 1
    text: 12. Field & Form Contract / Schema 驅動欄位
  - index: 31
    style: Heading 1
    text: 13. Permission Model / 前台 9 L1 與後台 9 L1
  - index: 34
    style: Normal
    text: 「前台全部」與「後台總權限」都只是一鍵選取 Draft；不是 SUPER_ADMIN、不是 wildcard、不能繞過 MFA / approval / state / policy / audit。
  - index: 35
    style: Heading 1
    text: 14. Department Preset / Scope 與授權分離
  - index: 37
    style: Heading 1
    text: 15. Permission Materialization / L1 → Explicit Assignments
  - index: 38
    style: List Bullet
    text: 1. 讀取 Draft 中選定的前台／後台 L1。
  - index: 39
    style: List Bullet
    text: 2. 對每個 L1 解析其當下正式註冊的 resource / action / scope / condition 集合。
  - index: 40
    style: List Bullet
    text: 3. 展開成 Account Permission Assignment candidate rows；禁止 runtime parent/child inheritance。
  - index: 41
    style: List Bullet
    text: 4. 與目標帳號 current explicit assignments 做 diff。
  - index: 42
    style: List Bullet
    text: 5. 產生 Authorization Impact Preview：Added / Removed / Unchanged / Blocked。
  - index: 43
    style: List Bullet
    text: 6. 要求 explicit confirmation。
  - index: 44
    style: List Bullet
    text: 7. Additions 使用 assign；Removals 使用 revoke；帶 expected_version / correlation / idempotency / audit。
  - index: 45
    style: List Bullet
    text: 8. 全部 required operations 成功後才允許 COMPLETE。
  - index: 46
    style: List Bullet
    text: 9. Grant / Revoke 後刷新 Effective Permission 與 Navigation projection。
  - index: 47
    style: Normal
    text: Silent Future Grant 禁止：某 L1 日後新增 resource/action，不會自動授權既有帳號。必須重新編輯、Preview、明確 Apply。
  - index: 48
    style: Heading 1
    text: 16. Runtime / API Integration Ports
  - index: 50
    style: Heading 1
    text: 17. Runtime Authorization Binding / Effectful Operation Gate
  - index: 52
    style: Heading 1
