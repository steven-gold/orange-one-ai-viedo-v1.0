name: VIS-17 Strategy Center Validation V2
on:
  push:
    branches: [acpos-vis17-staging]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis17-staging
          fetch-depth: 0
      - name: Install and compile
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify route source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/app/admin/strategy -name page.tsx | wc -l | tr -d ' ')" = "1"
          grep -Fq 'href: "/admin/strategy"' src/components/shell/AppShell.tsx
          grep -Fq 'activeNavId="ADMIN-NAV-08"' src/app/admin/strategy/page.tsx
          grep -Fq 'data-page-uid="admin:STR-01"' src/components/pages/StrategyAdminVisual.tsx
          ! find src/app/admin/strategy -mindepth 2 -name page.tsx | grep -q .
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          nohup npm start -- --hostname 127.0.0.1 --port 3000 >/tmp/vis17-next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/admin/strategy >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vis17-next.log
          exit 1
      - name: Browser contract validation
        shell: bash
        run: |
          mkdir -p docs/construction/evidence/VIS-17
          cat > vis17-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            let businessRequests=0;
            page.on('request',r=>{ if(['xhr','fetch'].includes(r.resourceType())) businessRequests++; });
            await page.goto('http://127.0.0.1:3000/admin/strategy',{waitUntil:'networkidle'});
            const fail=m=>{throw new Error(m)};
            if(await page.locator('[data-page-uid="admin:STR-01"]').count()!==1) fail('page uid');
            if(await page.locator('[data-nav-id^="ADMIN-NAV-"]').count()!==9) fail('admin nav count');
            const nav=page.locator('[data-nav-id="ADMIN-NAV-08"]');
            if(await nav.getAttribute('aria-current')!=='page') fail('active nav');
            if(!(await nav.getAttribute('href'))?.endsWith('/admin/strategy')) fail('nav href');
            const expected=[
              ['STR-CURRENT-VIEW-OVERVIEW',['ACT-SEARCH','ACT-REFRESH','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-INTELLIGENCE-FACT',['ACT-CONFIGURE','ACT-APPROVE','ACT-SEARCH','ACT-EXPORT','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-PLAYBOOK',['ACT-DRAFT-SAVE','ACT-APPROVE','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-OPPORTUNITY',['ACT-CANDIDATE-CREATE','ACT-APPROVE','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-DECISION',['ACT-CANDIDATE-COMPARE','ACT-CANDIDATE-DECIDE','ACT-ADOPT-CONTEXT','ACT-NAV-OPEN']],
            ];
            if(await page.locator('[data-view-uid]').count()!==5) fail('view count');
            const viewResults=[];
            for(const [uid,actions] of expected){
              await page.locator(`[data-view-uid="${uid}"]`).click();
              if(await page.locator(`[data-current-view="${uid}"]`).count()!==1) fail(`switch ${uid}`);
              const actual=await page.locator('[data-action-id]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-action-id')));
              if(JSON.stringify(actual)!==JSON.stringify(actions)) fail(`actions ${uid}`);
              if(await page.locator('[data-action-id]:not(:disabled)').count()) fail(`enabled action ${uid}`);
              viewResults.push({uid,actions,allDisabled:true});
            }
            if(await page.locator('input,textarea,select').count()) fail('manual input');
            const text=await page.locator('body').innerText();
            if(/sample data|mock data|demo candidate|fake confidence/i.test(text)) fail('fake data');
            await page.locator('[data-view-uid="STR-CURRENT-VIEW-OVERVIEW"]').click();
            await page.screenshot({path:'docs/construction/evidence/VIS-17/vis17-1440-overview.png',fullPage:true});
            await page.locator('[data-view-uid="STR-CURRENT-VIEW-DECISION"]').click();
            await page.screenshot({path:'docs/construction/evidence/VIS-17/vis17-1440-decision.png',fullPage:true});
            const x0=await page.locator('.workspace-slot').evaluate(el=>el.getBoundingClientRect().x);
            await page.locator('.global-sidebar').hover();
            await page.waitForTimeout(250);
            const x1=await page.locator('.workspace-slot').evaluate(el=>el.getBoundingClientRect().x);
            if(Math.round(x0)!==78||Math.round(x1)!==78) fail(`workspace reflow ${x0}/${x1}`);
            await page.screenshot({path:'docs/construction/evidence/VIS-17/vis17-1440-expanded.png',fullPage:true});
            const lang=page.locator('button[aria-haspopup="listbox"]');
            await lang.click(); await page.locator('[role="option"]').filter({hasText:'English'}).click();
            if((await page.locator('h1').first().innerText()).trim()!=='Strategy Center Administration') fail('en locale');
            await lang.click(); await page.locator('[role="option"]').filter({hasText:'简体中文'}).click();
            if((await page.locator('h1').first().innerText()).trim()!=='战略中心后台') fail('zh-CN locale');
            await lang.click(); await page.locator('[role="option"]').filter({hasText:'繁體中文'}).click();
            if((await page.locator('h1').first().innerText()).trim()!=='戰略中心後台') fail('zh-TW locale');
            if(businessRequests!==0) fail(`business requests ${businessRequests}`);
            await page.setViewportSize({width:1200,height:800});
            await page.reload({waitUntil:'networkidle'});
            const geometry1200=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}));
            fs.writeFileSync('docs/construction/evidence/VIS-17/vis17-validation.json',JSON.stringify({route:'/admin/strategy',pageUid:'admin:STR-01',adminL1:9,activeNav:'ADMIN-NAV-08',currentViews:5,viewResults,effectfulRuntimeReady:false,controlResourceRemap:'NOT_EXECUTED',unregisteredManualInputs:false,fakeStrategyData:false,businessRequests,workspaceOriginX:Math.round(x0),workspaceOriginExpandedX:Math.round(x1),geometry1200,locales:['zh-TW','zh-CN','en'],runId:process.env.GITHUB_RUN_ID},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node ./vis17-check.cjs
          rm -f vis17-check.cjs
      - name: Update progress
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s=p.read_text()
          old='''  - id: VIS-17\n    group: ADMIN\n    page_uid: admin:STR-01\n    name: 戰略中心後台\n    status: NOT_STARTED\n'''
          new=f'''  - id: VIS-17\n    group: ADMIN\n    page_uid: admin:STR-01\n    name: 戰略中心後台\n    status: COMPLETE\n    scope: Single-page Strategy Center administration visual at /admin/strategy with five authority-defined Current Views, real-data-only empty projections, registered action/operation traceability, no parallel subpages, and all governed business actions disabled until resource/runtime remap.\n    evidence:\n      final_validation_run_id: {os.environ.get('GITHUB_RUN_ID')}\n      evidence_directory: docs/construction/evidence/VIS-17\n      validation_record: docs/construction/evidence/VIS-17/vis17-validation.json\n      typecheck: PASS\n      next_build: PASS\n      production_server: PASS\n      chromium_render_and_geometry: PASS\n      locale_switch_runtime: PASS\n      business_requests_during_validation: 0\n      current_views: 5\n      control_resource_remap: NOT_EXECUTED\n      effectful_runtime_ready: false\n'''
          if old not in s: raise SystemExit('VIS-17 block not found')
          s=s.replace(old,new,1).replace('visual_steps_complete: 17','visual_steps_complete: 18',1)
          s=s.replace('VIS-17 STR-01 is next and has not started.','VIS-17 admin:STR-01 is implemented and verified at /admin/strategy as one page with five Current Views. Governed business actions remain disabled until control/permission/runtime remap. VIS-18 KB-01 is next and has not started.',1)
          p.write_text(s)
          PY
      - name: Commit evidence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vis17-strategy-validation-v2.yml
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A docs/construction .github/workflows/vis17-strategy-validation-v2.yml
          git commit -m 'test(vis17): validate Strategy Center and record evidence'
          git push origin HEAD:acpos-vis17-staging
