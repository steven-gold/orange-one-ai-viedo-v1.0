name: Governance Full-Line High-Pressure System Gate

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-source/FULL_LINE_TRIGGER'
      - '.github/governance-source/FULL_LINE_FAILURE_DIAGNOSTICS.py'
      - '.github/workflows/governance-full-line-system-gate.yml'
      - '.github/workflows/governance-selected-profile-integrity.yml'
      - 'GOVERNANCE_CURRENT.yaml'
      - 'governance/ci/**'
      - 'governance/specifications/current/**'
      - 'governance/specifications/REGISTRY.yaml'
      - 'governance/test/ACTIVE_STATE.yaml'
      - 'governance/test/SELECTED_PROFILE_HISTORY_BINDING.yaml'
      - 'governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml'
      - 'governance/test/stage02/FIND-20260915-027_PROMOTION_PROJECTION_ATOMICITY.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-line-system-high-pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove exact 75-file source identity before system testing
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Enforce Current Specification mutation authorization
        run: python governance/ci/specification_mutation_guard.py
      - name: Resolve stable Current governance registry
        run: python governance/ci/governance_resolver.py
      - name: Validate canonical rule registry anti-drift binding
        run: python governance/ci/validate_canonical_rule_registry.py
      - name: Validate reusable governance portability and machine-layer profile isolation
        run: python governance/ci/validate_governance_portability.py
      - name: Validate neutral validation remediation closure protocol
        run: python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Validate Current governance layout and zero residual
        run: python governance/ci/validate_governance_layout.py
      - name: Validate authoring reference duplicate conflict and residual governance coverage
        run: python governance/ci/validate_authoring_reference_governance_coverage.py
      - name: Validate active consumer reference integrity
        run: python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Run Current Registry multidirectional stress 13 of 13
        run: python governance/ci/stress_test_governance_registry.py
      - name: Validate selected execution profile and profile-local evidence
        run: python governance/ci/validate_selected_execution_profile_integrity.py
      - name: Validate Stage-02 finding closure readiness under Current governance
        run: python governance/ci/validate_stage02_finding_closure_readiness.py
      - name: Run complete 75-file full-lifecycle high-pressure system gate
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
      - name: Expand exact Full-Line failure diagnostics
        if: ${{ failure() }}
        run: python .github/governance-source/FULL_LINE_FAILURE_DIAGNOSTICS.py
      - name: Prove verified source remained byte-clean after destructive suites
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/governance-source/active/source
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' -o -name '*.tmp' -o -name '*.bak' -o -name '*~' \) -print)"
          test -z "$bad" || { printf 'BLOCK: source runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: active 75-file source unchanged and runtime-residual free after full-line gate'
      - name: Upload full-line system evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: governance-full-line-system-evidence
          path: |
            .github/governance-source/SOURCE_IDENTITY_REPORT.json
            .github/governance-source/FULL_LINE_SYSTEM_GATE_RESULT.json
            .github/governance-source/FULL_LINE_FAILURE_DIAGNOSTICS.json
            governance/test/AUTHORING_REFERENCE_GOVERNANCE_COVERAGE_REPORT.json
            governance/test/ACTIVE_CONSUMER_REFERENCE_INTEGRITY_REPORT.json
            governance/test/STAGE02_FINDING_CLOSURE_READINESS.json
          if-no-files-found: error
