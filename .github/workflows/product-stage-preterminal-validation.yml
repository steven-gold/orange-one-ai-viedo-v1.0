name: Product Stage Preterminal Exact-Head Validation
on:
  workflow_dispatch:
    inputs:
      stage:
        required: true
        type: string
      work_units:
        required: true
        type: string
      expected_head:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
      - name: Prove exact candidate head
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_head }}"
      - name: Resolve Current governance
        id: governance
        run: |
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml)"
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Load exact governance runtime
        run: |
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Validate preterminal evidence without mutation
        env:
          STAGE: ${{ inputs.stage }}
          WORK_UNITS: ${{ inputs.work_units }}
        run: |
          set -euo pipefail
          python .github/scripts/full_stage_lifecycle_guard.py --mode execution-ready --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          IFS=',' read -ra WUS <<< "$WORK_UNITS"
          for WU in "${WUS[@]}"; do
            python .github/scripts/common_stage_preterminal.py --mode validate --stage "$STAGE" --work-unit "STAGE_EXECUTION/$STAGE/$WU/WORK_UNIT.yaml" --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
            python .github/scripts/common_stage_closure.py --mode preflight --stage "$STAGE" --work-unit "STAGE_EXECUTION/$STAGE/$WU/WORK_UNIT.yaml" --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          done
