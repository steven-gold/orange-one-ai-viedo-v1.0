states:
- state_uid: GHS-STATE-SIDEBAR-COLLAPSED
  meaning: 'Resting state: transparent 64px interaction rail; only 9 nav icons visible; no full-height sidebar panel/frame/background; workspace
    x78'
- state_uid: GHS-STATE-SIDEBAR-EXPANDED-OVERLAY
  meaning: Temporary 221px sidebar surface/frame visible with icon + single-line L1 labels; workspace remains x78; no child/submenu
- state_uid: GHS-STATE-LOGGED-OUT
  meaning: Header right shows Language + Login only
- state_uid: GHS-STATE-LOGGED-IN
  meaning: Header right shows Notification + To-do + Running + Language + Account. Permissions remain account-bound authorization data and are
    not rendered.
- state_uid: GHS-STATE-QUICK-LINK-GAP
  meaning: Displayed real status may remain; unresolved quick destination disabled + gap report
- state_uid: GHS-STATE-PAGE-BLANK
  meaning: No Page Authority loaded; workspace remains visually blank
state_transitions:
- SIDEBAR_COLLAPSED_ICON_ONLY -- pointerenter/focusin interaction rail --> SIDEBAR_EXPANDED_OVERLAY_WITH_SURFACE
- SIDEBAR_EXPANDED_OVERLAY_WITH_SURFACE -- pointerleave + no focus inside for 180ms --> SIDEBAR_COLLAPSED_ICON_ONLY and remove sidebar surface/frame
- SIDEBAR_EXPANDED_OVERLAY_WITH_SURFACE -- navigation complete --> SIDEBAR_COLLAPSED_ICON_ONLY immediately and remove sidebar surface/frame
- LOGGED_OUT -- authenticated session established --> LOGGED_IN
- LOGGED_IN -- session ended --> LOGGED_OUT
errors:
- error_uid: GHS-ERR-NAV-001
  context: nav target unresolved
  recovery: Block click; report gap; do not invent route
- error_uid: GHS-ERR-QUICK-001
  context: quick destination unresolved
  recovery: Disable that quick jump; retain authorized displayed value if available; report gap
- error_uid: GHS-ERR-IDENTITY-001
  context: account identity unresolved
  recovery: Do not fake name/avatar; show canonical generic user icon/login state allowed by identity authority
- error_uid: GHS-ERR-UNDEFINED-001
  context: unregistered header/sidebar/menu/status requested
  recovery: BLOCK + REPORT_AUTHORITY_GAP
ports:
- port_uid: GHS-PORT-NAV
  operation: resolveCanonicalNavigation
  path: SYSTEM_OPERATION_REGISTRY_REQUIRED
- port_uid: GHS-PORT-QUICK
  operation: resolveCanonicalQuickLink
  path: SYSTEM_OPERATION_REGISTRY_REQUIRED
- port_uid: GHS-PORT-ACCOUNT-SUMMARY
