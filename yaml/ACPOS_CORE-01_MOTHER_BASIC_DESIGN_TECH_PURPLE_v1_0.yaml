    text: CORE LockReview Exact Contract Clarification
  - index: 106
    style: Normal
    text: Earlier text that says the LockReview contract is unresolved is superseded for construction binding by migration 0042 and productionCoreGovernedRuntime.
      A MOTHER/CHILD request accepts scope + expected_version + correlation_id + idempotency_key + target_ref + request_reason + requested_scope_refs. requested_scope_refs
      MUST resolve exactly one APPROVED quality_criteria_version and at least one evidence ref. reviewer_path is derived by the database from APPROVED ALLOW account
      permission assignments for resource api:decideLockReview / EXECUTE, scope-compatible and excluding the requester. reviewer_count < 1 remains a runtime fail-closed
      condition; the AI MUST NOT invent a reviewer. expected_target_hash is persisted by the governed lock service.
  - index: 107
    style: Heading 2
    text: Page Construction Invariant
  - index: 108
    style: Normal
    text: The exact control denominator above is the only construction denominator for this page. Components/fields/visual IDs are not counted as additional controls.
      Existing source UIDs are preserved. A control classified UI_LOCAL_EXACT MUST NOT create a server write. A control classified SPEC_EXACT_RUNTIME_BLOCKED / NOT_EXECUTED
      MUST remain disabled or fail-closed until its runtime evidence exists.
