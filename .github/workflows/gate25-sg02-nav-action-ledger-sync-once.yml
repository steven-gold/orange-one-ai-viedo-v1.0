name: ACPOS Gate25 SG02 Nav Action Ledger Sync Once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Promote exact SG-02 NAV-OPEN Production action
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const ledgerPath='docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json';
          const inventoryPath='docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json';
          const evidencePath='docs/construction/evidence/GATE25_SG02_NAV_ACTION_EXISTING_PRODUCTION_EVIDENCE_2026-09-10.json';
          const sourceEvidencePath='docs/construction/evidence/GATE25_PRODUCTION_READONLY_INTERACTION_EVIDENCE_2026-09-10.json';
          const authorityPath='authority/pages/admin/SG-02/ACPOS_SG-02_QA_REVIEW_STANDARD_FINAL_LOCKED_ENCODING.yaml';
          const syncPath='docs/construction/evidence/GATE25_SG02_NAV_ACTION_LEDGER_SYNC_2026-09-10.json';
          const formalTestPath='tests/release/formal-acceptance-ledger.test.mjs';
          const devTestPath='tests/release/gate25-dev-stage-readonly-acceptance.test.mjs';
          const readonlySyncTestPath='tests/release/gate25-production-readonly-ledger-sync.test.mjs';
          const regressionPath='tests/release/gate25-sg02-nav-action-ledger-sync.test.mjs';
          const target='action:admin:SG-02:ACT-NAV-OPEN';
          const sourceControl='control:CTRL-ADMIN-SG-02-ACT-03-ACT-NAV-OPEN';

          const evidence=JSON.parse(await readFile(evidencePath,'utf8'));
          const sourceEvidence=JSON.parse(await readFile(sourceEvidencePath,'utf8'));
          const authority=await readFile(authorityPath,'utf8');
          const inventory=JSON.parse(await readFile(inventoryPath,'utf8'));
          if(evidence.status!=='CURRENT_PRODUCTION_EVIDENCE') throw new Error('SG_NAV_EVIDENCE_STATUS_INVALID');
          if(evidence.production_release_sha!=='608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36') throw new Error('SG_NAV_PRODUCTION_SHA_MISMATCH');
          if(evidence.source_execution?.workflow_run_id!==34455072666 || evidence.source_execution?.job_id!==102799444139 || evidence.source_execution?.status!=='SUCCESS') throw new Error('SG_NAV_EXECUTION_REF_INVALID');
          if(evidence.formal_action_resource!==target || evidence.source_control_resource!==sourceControl) throw new Error('SG_NAV_RESOURCE_MAPPING_INVALID');
          if(evidence.authority_mapping?.source_action_id!=='ACT-NAV-OPEN' || evidence.authority_mapping?.operation_id!=='getUiProjection' || evidence.authority_mapping?.method!=='GET' || evidence.effectful!==false) throw new Error('SG_NAV_AUTHORITY_MAPPING_INVALID');
          if(evidence.production_observation?.projection_http!==200 || evidence.production_observation?.drawer_visible!==true || evidence.production_observation?.heading_present!==true || evidence.production_observation?.outcome!=='PASS') throw new Error('SG_NAV_PRODUCTION_OBSERVATION_INVALID');
          const sourceRow=sourceEvidence.sg02?.find(row=>row.resource_key===sourceControl);
          if(!sourceRow || sourceRow.outcome!=='PASS' || sourceRow.projection_http!==200 || sourceRow.operation_id!=='getUiProjection' || sourceRow.drawer_visible!==true) throw new Error('SG_NAV_SOURCE_CONTROL_EVIDENCE_INVALID');
          if(!authority.includes('control_id: CTRL-ADMIN-SG-02-ACT-03-ACT-NAV-OPEN') || !authority.includes('source_action_id: ACT-NAV-OPEN') || !authority.includes('operation_id: getUiProjection')) throw new Error('SG_NAV_AUTHORITY_TEXT_MAPPING_MISSING');
          const inventoryRow=inventory.resources.find(row=>row.resource_key===target);
          if(!inventoryRow || inventoryRow.resource_type!=='ACTION' || !inventoryRow.allowed_actions?.includes('INVOKE')) throw new Error('SG_NAV_FORMAL_INVENTORY_MISSING');

          const ledger=JSON.parse(await readFile(ledgerPath,'utf8'));
          if(JSON.stringify(ledger.counts)!==JSON.stringify({PASS:28,BLOCKED:72,NOT_EXECUTED:1381})) throw new Error(`UNEXPECTED_LEDGER_BASELINE_${JSON.stringify(ledger.counts)}`);
          const row=ledger.entries.find(entry=>entry.resource_key===target);
          if(!row) throw new Error('SG_NAV_LEDGER_RESOURCE_MISSING');
          if(row.disposition!=='NOT_EXECUTED') throw new Error(`SG_NAV_LEDGER_RESOURCE_NOT_PENDING_${row.disposition}`);
          const before={...ledger.counts};
          row.disposition='PASS';
          row.reason_code='PRODUCTION_READONLY_ACTION_ACCEPTED';
          row.evidence_refs=[evidencePath,sourceEvidencePath,authorityPath,'GitHub Actions run 34455072666 job 102799444139','Production release_sha=608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36'];
          row.operation_ids=['getUiProjection'];
          const counts={PASS:0,BLOCKED:0,NOT_EXECUTED:0};
          for(const entry of ledger.entries){
            if(!(entry.disposition in counts)) throw new Error(`INVALID_DISPOSITION_${entry.resource_key}`);
            counts[entry.disposition]++;
          }
          if(ledger.entries.length!==1481) throw new Error(`DENOMINATOR_${ledger.entries.length}`);
          if(JSON.stringify(counts)!==JSON.stringify({PASS:29,BLOCKED:72,NOT_EXECUTED:1380})) throw new Error(`COUNT_MISMATCH_${JSON.stringify(counts)}`);
          ledger.counts=counts;
          ledger.status='CURRENT_PARTIAL_GATE25_PHYSICAL_LEDGER_SYNCED';
          ledger.production_release_sha=evidence.production_release_sha;
          await writeFile(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const sync={document_id:'ACPOS_GATE25_SG02_NAV_ACTION_LEDGER_SYNC',status:'PHYSICAL_LEDGER_SYNCED',as_of:new Date().toISOString(),production_release_sha:evidence.production_release_sha,source:evidencePath,source_execution:evidence.source_execution,target_count:1,changed_count:1,changed_resource_keys:[target],counts_before:before,counts_after:counts,excluded_effectful_resources:['control:CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE','control:CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE'],rule:'Only the exact formal ACT-NAV-OPEN mapped to the already-successful Production read-only SG-02 control is promoted.'};
          await writeFile(syncPath,JSON.stringify(sync,null,2)+'\n');

          let formalTest=await readFile(formalTestPath,'utf8');
          const formalOld='assert.deepEqual(ledger.counts,{PASS:28,BLOCKED:72,NOT_EXECUTED:1381});';
          const formalNew='assert.deepEqual(ledger.counts,{PASS:29,BLOCKED:72,NOT_EXECUTED:1380});';
          if(!formalTest.includes(formalOld)) throw new Error('FORMAL_TEST_BASELINE_NOT_FOUND');
          formalTest=formalTest.replace(formalOld,formalNew);
          await writeFile(formalTestPath,formalTest);

          let devTest=await readFile(devTestPath,'utf8');
          const devOld='  assert.deepEqual(ledger.counts,{PASS:28,BLOCKED:72,NOT_EXECUTED:1381});';
          const devNew='  assert.equal(ledger.entries.length,1481);\n  assert.equal(ledger.counts.PASS+ledger.counts.BLOCKED+ledger.counts.NOT_EXECUTED,1481);';
          if(!devTest.includes(devOld)) throw new Error('DEV_TEST_DYNAMIC_COUNT_NOT_FOUND');
          devTest=devTest.replace(devOld,devNew);
          await writeFile(devTestPath,devTest);

          let readonlySyncTest=await readFile(readonlySyncTestPath,'utf8');
          const readonlyOld='  assert.deepEqual(ledger.counts,sync.counts_after);';
          const readonlyNew='  assert.equal(ledger.entries.length,1481);\n  assert.deepEqual(sync.counts_after,{PASS:28,BLOCKED:72,NOT_EXECUTED:1381});';
          if(!readonlySyncTest.includes(readonlyOld)) throw new Error('READONLY_SYNC_DYNAMIC_COUNT_NOT_FOUND');
          readonlySyncTest=readonlySyncTest.replace(readonlyOld,readonlyNew);
          await writeFile(readonlySyncTestPath,readonlySyncTest);

          await writeFile(regressionPath,`import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("Gate25 SG-02 NAV-OPEN action is promoted only from exact existing Production evidence",async()=>{\n  const evidence=JSON.parse(await readFile("${evidencePath}","utf8"));\n  const sync=JSON.parse(await readFile("${syncPath}","utf8"));\n  const ledger=JSON.parse(await readFile("${ledgerPath}","utf8"));\n  assert.equal(evidence.status,"CURRENT_PRODUCTION_EVIDENCE");\n  assert.equal(evidence.effectful,false);\n  assert.equal(evidence.formal_action_resource,"${target}");\n  assert.equal(sync.changed_count,1);\n  assert.deepEqual(sync.changed_resource_keys,["${target}"]);\n  assert.deepEqual(sync.counts_before,{PASS:28,BLOCKED:72,NOT_EXECUTED:1381});\n  assert.deepEqual(sync.counts_after,{PASS:29,BLOCKED:72,NOT_EXECUTED:1380});\n  assert.deepEqual(ledger.counts,sync.counts_after);\n  const row=ledger.entries.find(x=>x.resource_key==="${target}");\n  assert.equal(row?.disposition,"PASS");\n  assert.equal(row?.reason_code,"PRODUCTION_READONLY_ACTION_ACCEPTED");\n  assert.ok(row?.evidence_refs.includes("${evidencePath}"));\n  for(const key of sync.excluded_effectful_resources){const effectful=ledger.entries.find(x=>x.resource_key===key);if(effectful)assert.notEqual(effectful.disposition,"PASS");}\n});\n`);
          console.log(JSON.stringify(sync));
          NODE
      - name: Validate synchronized ledger
        run: |
          node --test tests/release/formal-acceptance-ledger.test.mjs tests/release/gate25-dev-stage-readonly-acceptance.test.mjs tests/release/gate25-production-readonly-ledger-sync.test.mjs tests/release/gate25-sg02-nav-action-ledger-sync.test.mjs
          node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit synchronized ledger and remove one-shot workflow
        run: |
          rm .github/workflows/gate25-sg02-nav-action-ledger-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json \
                  docs/construction/evidence/GATE25_SG02_NAV_ACTION_LEDGER_SYNC_2026-09-10.json \
                  tests/release/formal-acceptance-ledger.test.mjs \
                  tests/release/gate25-dev-stage-readonly-acceptance.test.mjs \
                  tests/release/gate25-production-readonly-ledger-sync.test.mjs \
                  tests/release/gate25-sg02-nav-action-ledger-sync.test.mjs \
                  .github/workflows/gate25-sg02-nav-action-ledger-sync-once.yml
          git commit -m "evidence(gate25): promote SG-02 NAV-OPEN Production action"
          git push origin HEAD:new
