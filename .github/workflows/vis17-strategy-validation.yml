name: VIS-17 Strategy Center Validation
on:
  push:
    branches: [acpos-vis17-staging]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis17-staging
          fetch-depth: 0
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify single admin strategy route source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/app/admin/strategy -name page.tsx | wc -l | tr -d ' ')" = "1"
          grep -Fq 'href: "/admin/strategy"' src/components/shell/AppShell.tsx
          grep -Fq 'activeNavId="ADMIN-NAV-08"' src/app/admin/strategy/page.tsx
          grep -Fq 'data-page-uid="admin:STR-01"' src/components/pages/StrategyAdminVisual.tsx
          ! find src/app/admin/strategy -mindepth 2 -name page.tsx | grep -q .
      - name: Install Chromium validation runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          nohup npm start -- --hostname 127.0.0.1 --port 3000 >/tmp/vis17-next.log 2>&1 &
          echo $! >/tmp/vis17-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/strategy >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vis17-next.log
          exit 1
      - name: Chromium contract validation
        shell: bash
        run: |
          mkdir -p docs/construction/evidence/VIS-17
          cat > /tmp/vis17-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            let businessRequests = 0;
            page.on('request', req => { if (['xhr','fetch'].includes(req.resourceType())) businessRequests += 1; });
            await page.goto('http://127.0.0.1:3000/admin/strategy', {waitUntil:'networkidle'});
            const fail = (m)=>{ throw new Error(m); };
            if (await page.locator('[data-page-uid="admin:STR-01"]').count() !== 1) fail('STR-01 page UID missing');
            if (await page.locator('[data-nav-id^="ADMIN-NAV-"]').count() !== 9) fail('admin nav count != 9');
            const active = page.locator('[data-nav-id="ADMIN-NAV-08"]');
            if (await active.getAttribute('aria-current') !== 'page') fail('ADMIN-NAV-08 not active');
            if (!(await active.getAttribute('href'))?.endsWith('/admin/strategy')) fail('ADMIN-NAV-08 href mismatch');
            const expectedViews = [
              ['STR-CURRENT-VIEW-OVERVIEW',['ACT-SEARCH','ACT-REFRESH','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-INTELLIGENCE-FACT',['ACT-CONFIGURE','ACT-APPROVE','ACT-SEARCH','ACT-EXPORT','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-PLAYBOOK',['ACT-DRAFT-SAVE','ACT-APPROVE','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-OPPORTUNITY',['ACT-CANDIDATE-CREATE','ACT-APPROVE','ACT-NAV-OPEN']],
              ['STR-CURRENT-VIEW-DECISION',['ACT-CANDIDATE-COMPARE','ACT-CANDIDATE-DECIDE','ACT-ADOPT-CONTEXT','ACT-NAV-OPEN']],
            ];
            if (await page.locator('[data-view-uid]').count() !== 5) fail('view count != 5');
            const viewResults = [];
            for (const [uid, actions] of expectedViews) {
              await page.locator(`[data-view-uid="${uid}"]`).click();
              if (await page.locator(`[data-current-view="${uid}"]`).count() !== 1) fail(`view switch failed ${uid}`);
              const actual = await page.locator('[data-action-id]').evaluateAll(nodes => nodes.map(n => n.getAttribute('data-action-id')));
              if (JSON.stringify(actual) !== JSON.stringify(actions)) fail(`action mismatch ${uid}: ${JSON.stringify(actual)}`);
              const enabled = await page.locator('[data-action-id]:not(:disabled)').count();
              if (enabled !== 0) fail(`effectful action enabled ${uid}`);
              viewResults.push({uid, actions, allDisabled:true});
            }
            if (await page.locator('input, textarea, select').count() !== 0) fail('unregistered manual input rendered');
            const bodyText = await page.locator('body').innerText();
            if (/sample data|mock data|demo candidate|fake confidence/i.test(bodyText)) fail('fake/sample strategy data detected');
            await page.locator('[data-view-uid="STR-CURRENT-VIEW-OVERVIEW"]').click();
            await page.screenshot({path:'docs/construction/evidence/VIS-17/vis17-1440-overview.png', fullPage:true});
            await page.locator('[data-view-uid="STR-CURRENT-VIEW-DECISION"]').click();
            await page.screenshot({path:'docs/construction/evidence/VIS-17/vis17-1440-decision.png', fullPage:true});
            await page.locator('.global-sidebar').hover();
            await page.waitForTimeout(250);
            const beforeX = await page.locator('.workspace-slot').evaluate(el => el.getBoundingClientRect().x);
            await page.screenshot({path:'docs/construction/evidence/VIS-17/vis17-1440-expanded.png', fullPage:true});
            if (Math.round(beforeX) !== 78) fail(`workspace x != 78: ${beforeX}`);
            const lang = page.locator('button[aria-haspopup="listbox"]');
            await lang.click();
            await page.locator('[role="option"]').filter({hasText:'English'}).click();
            if ((await page.locator('h1').first().innerText()).trim() !== 'Strategy Center Administration') fail('en locale failed');
            await lang.click();
            await page.locator('[role="option"]').filter({hasText:'简体中文'}).click();
            if ((await page.locator('h1').first().innerText()).trim() !== '战略中心后台') fail('zh-CN locale failed');
            await lang.click();
            await page.locator('[role="option"]').filter({hasText:'繁體中文'}).click();
            if ((await page.locator('h1').first().innerText()).trim() !== '戰略中心後台') fail('zh-TW locale failed');
            if (businessRequests !== 0) fail(`business requests != 0: ${businessRequests}`);
            await page.setViewportSize({width:1200,height:800});
            await page.reload({waitUntil:'networkidle'});
            const geometry1200 = await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}));
            const result = {
              route:'/admin/strategy', pageUid:'admin:STR-01', adminL1:9, activeNav:'ADMIN-NAV-08',
              currentViews:5, viewResults, effectfulRuntimeReady:false, controlResourceRemap:'NOT_EXECUTED',
              unregisteredManualInputs:false, fakeStrategyData:false, businessRequests,
              workspaceOriginX:Math.round(beforeX), geometry1200,
              locales:['zh-TW','zh-CN','en'], runId:process.env.GITHUB_RUN_ID
            };
            fs.writeFileSync('docs/construction/evidence/VIS-17/vis17-validation.json', JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/vis17-check.cjs
      - name: Update truthful construction progress
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s=p.read_text()
          old='''  - id: VIS-17\n    group: ADMIN\n    page_uid: admin:STR-01\n    name: 戰略中心後台\n    status: NOT_STARTED\n'''
          new=f'''  - id: VIS-17\n    group: ADMIN\n    page_uid: admin:STR-01\n    name: 戰略中心後台\n    status: COMPLETE\n    scope: Single-page Strategy Center administration visual at /admin/strategy with five authority-defined Current Views, real-data-only empty projections, registered action/operation traceability, no parallel subpages, and all governed business actions disabled until resource/runtime remap.\n    evidence:\n      final_validation_run_id: {os.environ.get('GITHUB_RUN_ID')}\n      evidence_directory: docs/construction/evidence/VIS-17\n      validation_record: docs/construction/evidence/VIS-17/vis17-validation.json\n      typecheck: PASS\n      next_build: PASS\n      production_server: PASS\n      chromium_render_and_geometry: PASS\n      locale_switch_runtime: PASS\n      business_requests_during_validation: 0\n      current_views: 5\n      control_resource_remap: NOT_EXECUTED\n      effectful_runtime_ready: false\n'''
          if old not in s: raise SystemExit('VIS-17 NOT_STARTED block not found')
          s=s.replace(old,new,1)
          s=s.replace('visual_steps_complete: 17','visual_steps_complete: 18',1)
          s=s.replace('VIS-17 STR-01 is next and has not started.','VIS-17 admin:STR-01 is implemented and verified at /admin/strategy as one page with five Current Views. Governed business actions remain disabled until control/permission/runtime remap. VIS-18 KB-01 is next and has not started.',1)
          p.write_text(s)
          PY
      - name: Commit evidence, progress and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vis17-strategy-validation.yml
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A docs/construction .github/workflows/vis17-strategy-validation.yml
          git commit -m 'test(vis17): validate Strategy Center and record evidence'
          git push origin HEAD:acpos-vis17-staging
