function bad(reason_code:string,status=409):AssetRuntimeResult{return{ok:false,error_uid:'ASSET-01-ERR-CONTEXT-001',reason_code,correlation_id:createControlledTestRef('ASSET-PORT-ERROR'),status};}
export async function executeControlledAssetPort(request:AssetRuntimeRequest):Promise<AssetRuntimeResult|null>{if(!isControlledAssetServerTestMode())return null;const s=state();const ok=(value:unknown):AssetRuntimeResult=>({ok:true,value:{...((value&&typeof value==='object')?value as Record<string,unknown>:{}),test_metadata:s.metadata},correlation_id:request.correlation_id});switch(request.port_uid){
 case 'ASSET-01-PORT-LAYER-DOC-CREATE':if(!s.output_version_id)return bad('ASSET_VERSION_REQUIRED');s.layer_document_version+=1;s.layer_document_id=`TEST-LAYER-DOC-${s.layer_document_version}`;s.layer_id=null;s.last_event='LAYER_DOCUMENT_CREATED';return ok({layer_document_id:s.layer_document_id});
 case 'ASSET-01-PORT-LAYER-DOC-UPDATE':if(!s.layer_document_id||request.path_params?.layerDocumentId!==s.layer_document_id)return bad('EXACT_LAYER_DOCUMENT_REQUIRED');s.layer_document_version+=1;s.layer_document_id=`TEST-LAYER-DOC-${s.layer_document_version}`;s.last_event='LAYER_DOCUMENT_UPDATED_NEW_VERSION';return ok({layer_document_id:s.layer_document_id});
