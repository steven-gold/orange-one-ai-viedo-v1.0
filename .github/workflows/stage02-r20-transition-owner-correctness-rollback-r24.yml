name: Stage-02 R20 Transition Owner Correctness Rollback R24

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-r20-transition-owner-correctness-rollback-r24.yml'
      - 'governance/ci/classify_stage02_r20_transition_owner_invalidations_r24.py'
      - 'governance/ci/validate_stage02_r20_transition_owner_invalidations_r24.py'
      - 'governance/ci/rollback_stage02_invalid_r20_transition_owners_r24.py'
      - 'governance/ci/validate_stage02_r24_correctness_rollback.py'
      - 'governance/ci/run_current_stage2_r24_effective_reexecution.py'
      - 'governance/test/stage02/STAGE02_FUNCTIONAL_CHAIN_AUTO_REMEDIABILITY_R20.yaml'
      - 'governance/test/stage02/STAGE02_STATE_TRANSITION_LEDGER_DEPENDENCY_TRACE_R17.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify-rollback-reexecute:
    runs-on: ubuntu-latest
    env:
      STAGE02_FULL_LINE_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R24 implementation
        run: |
          python -m py_compile governance/ci/classify_stage02_r20_transition_owner_invalidations_r24.py
          python -m py_compile governance/ci/validate_stage02_r20_transition_owner_invalidations_r24.py
          python -m py_compile governance/ci/rollback_stage02_invalid_r20_transition_owners_r24.py
          python -m py_compile governance/ci/validate_stage02_r24_correctness_rollback.py
          python -m py_compile governance/ci/run_current_stage2_r24_effective_reexecution.py
      - name: Revalidate R17 and current R23 baseline
        run: |
          python governance/ci/validate_stage02_state_transition_ledger_dependency_trace_r17.py
          python governance/ci/validate_stage02_current_authority_payload_closures_r23.py
          python governance/ci/validate_stage02_r23_materialized_payload_closures.py
      - name: Classify invalid R20 transition mutation owner closures R24
        run: python governance/ci/classify_stage02_r20_transition_owner_invalidations_r24.py
      - name: Validate exact R24 invalidation set
        run: python governance/ci/validate_stage02_r20_transition_owner_invalidations_r24.py
      - name: Roll back only invalid R20 transition mutation owner closures
        run: python governance/ci/rollback_stage02_invalid_r20_transition_owners_r24.py
      - name: Validate corrected product ledger
        run: python governance/ci/validate_stage02_r24_correctness_rollback.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Fresh Stage-02 effective reexecution after R24 rollback
        run: python governance/ci/run_current_stage2_r24_effective_reexecution.py
      - name: Assert corrected fresh denominator and fail-closed state
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          receipt=yaml.safe_load(Path('governance/test/stage02/STAGE02_R24_CORRECTNESS_ROLLBACK_RECEIPT.yaml').read_text())
          result=json.loads(Path('.github/stage02-test/STAGE02_R24_EFFECTIVE_REEXECUTION_RESULT.json').read_text())
          assert receipt['before_product_materialization_total']==38, receipt
          assert receipt['removed_invalid_materialization_total']==4, receipt
          assert receipt['after_product_materialization_total']==34, receipt
          assert result['raw_discovery_gap_total']==171, result
          assert result['product_materialization_elimination_count']==34, result
          assert result['gap006_authority_elimination_count']==4, result
          assert result['total_effective_elimination_count']==38, result
          assert result['fresh_functional_gap_total']==133, result
          assert result['effective_gap_categories']=={
            'ACTION_WITHOUT_CONTROL_OR_TRIGGER':1,
            'AUDIT_EVENT_NODE_MISSING':13,
            'FAILURE_STATE_ERROR_BINDING_MISSING':44,
            'PAYLOAD_INPUT_CONTRACT_MISSING':34,
            'POST_ACTION_VALIDATION_NODE_MISSING':1,
            'STATE_TRANSITION_LEDGER_FIELD_MISSING':40,
          }, result
          assert result['correctness_correction']['replacement_value_materialized'] is False, result
          assert result['remaining_true_authority_gap']['target_uid']=='ASSET-01-ACT-CORRECTION-EXECUTE', result
          assert result['result']=='BLOCKED' and result['stage_exit_allowed'] is False, result
          assert result['current_specification_mutated'] is False and result['immutable_stage1_source_mutated'] is False, result
          assert result['website_construction_allowed'] is False and result['deployment_allowed'] is False, result
          print('PASS: corrected fresh Stage-02 denominator=133; state-transition ledger gaps=40; fail-closed')
          PY
      - name: Persist R24 correction and fresh evidence
        run: |
          paths=(
            '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
            'governance/test/stage02/STAGE02_R20_TRANSITION_OWNER_INVALIDATION_R24.yaml'
            'governance/test/stage02/STAGE02_R24_CORRECTNESS_ROLLBACK_RECEIPT.yaml'
            '.github/stage02-test/STAGE02_R24_EFFECTIVE_REEXECUTION_RESULT.json'
            'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
            'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml'
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'R24 outputs unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'test(stage02): rollback invalid R20 transition owners and persist R24 evidence'
          git push origin HEAD:rebuild-v2.1.1
