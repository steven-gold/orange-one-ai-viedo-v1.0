name: DEV-01 baseline audit once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/dev01-baseline-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Authority and runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          AUTH=authority/pages/admin/DEV-01/ACPOS_DEV-01_ENTERPRISE_AUTOMATION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml
          echo DEV01_BASE_HEAD=$(git rev-parse HEAD)
          echo DEV01_CSS_SHA256=$(sha256sum src/components/pages/DevVisual.module.css | awk '{print $1}')
          echo DEV01_SECTIONS=$(grep -c '^- section_uid: DEV-01-SEC-' "$AUTH")
          echo DEV01_COMPONENTS=$(grep -c '^- component_uid: DEV-01-CMP-' "$AUTH")
          echo DEV01_CONTROLS=$(grep -c '^- control_uid: DEV-01-' "$AUTH")
          echo DEV01_ACTIONS=$(grep -c '^- action_uid: DEV-01-ACT-' "$AUTH")
          echo DEV01_GATES=$(grep -c '^- gate_uid: DEV-01-GATE-' "$AUTH")
          echo DEV01_ERRORS=$(grep -c '^- error_uid: DEV-01-ERR-' "$AUTH")
          test "$(grep -c '^- section_uid: DEV-01-SEC-' "$AUTH")" = 9
          test "$(grep -c '^- component_uid: DEV-01-CMP-' "$AUTH")" = 15
          test "$(grep -c '^- control_uid: DEV-01-' "$AUTH")" = 22
          test "$(grep -c '^- action_uid: DEV-01-ACT-' "$AUTH")" = 22
          test "$(grep -c '^- gate_uid: DEV-01-GATE-' "$AUTH")" = 15
          test "$(grep -c '^- error_uid: DEV-01-ERR-' "$AUTH")" = 12
          test "$(grep -R 'configureDevProjectionResolver' src --exclude=devProjectionPort.ts | wc -l | tr -d ' ')" = 0
          test "$(grep -R 'configureDevCommandAdapter' src --exclude=devCommandPort.ts | wc -l | tr -d ' ')" = 0
          echo DEV01_BASELINE_RUNTIME_UNBOUND_CONFIRMED
      - name: Build baseline
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Baseline production browser
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 4173 > /tmp/dev01-baseline-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/dev01-baseline-next.log || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/admin/dev >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const nonGetV1=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/')&&r.method()!=='GET')nonGetV1.push(`${r.method()} ${u.pathname}`)});
            await page.goto('http://127.0.0.1:4173/admin/dev',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:DEV-01"]');
            await root.waitFor({state:'attached'});
            console.log('DEV01_BASE_PAGE_STATE',await root.getAttribute('data-page-state'));
            console.log('DEV01_BASE_SECTIONS',await page.locator('[data-section-id^="DEV-01-SEC-"]').count());
            console.log('DEV01_BASE_COMPONENTS',await page.locator('[data-component-id^="DEV-01-CMP-"]').count());
            console.log('DEV01_BASE_CONTROLS',await page.locator('[data-control-id^="DEV-01-"]').count());
            for(const id of ['DEV-01-BTN-STAGE-1','DEV-01-BTN-STAGE-2','DEV-01-BTN-STAGE-3','DEV-01-BTN-STAGE-4','DEV-01-BTN-STAGE-5','DEV-01-BTN-DISCOVERY-START']){
              console.log('DEV01_BASE_DISABLED',id,await page.locator(`[data-control-id="${id}"]`).isDisabled());
            }
            const stage2=page.locator('[data-control-id="DEV-01-BTN-STAGE-2"]');
            await stage2.click({force:true});
            console.log('DEV01_BASE_STAGE2_AFTER_FORCE',await page.locator('[data-section-id="DEV-01-SEC-04"]').count());
            const direct=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3ADEV-01',{cache:'no-store'});return{status:r.status,body:await r.json()}});
            console.log('DEV01_BASE_PROJECTION',JSON.stringify(direct));
            assert.equal(direct.status,503);
            assert.equal(direct.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            console.log('DEV01_BASE_NON_GET_V1',JSON.stringify(nonGetV1));
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('DEV01_BASE_WIDTH',width,'OVERFLOW',overflow);
            }
            console.log('DEV01_BASE_PAGE_ERRORS',JSON.stringify(pageErrors));
            console.log('DEV01_BASE_REQUEST_FAILED',JSON.stringify(failed));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
