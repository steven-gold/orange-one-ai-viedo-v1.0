name: ACPOS Batch 19 Operation Identity Namespace Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch19-operation-identity-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 18 audit boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="a1a54df49b7c6803d35ef3f60058f4ebfb25b4ee"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH18 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 19 operation identity audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch19_operation_identity_namespace_audit.py

      - name: Verify Batch 19 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch19_operation_identity_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["operation_items"]==13,s
          assert s["iam_same_uid_conflict"]==1,s
          assert s["local_local_false_positive"]==1,s
          assert s["action_identity_overload_review"]==1,s
          assert s["legitimate_noop_shared_read_identity"]==1,s
          print("PASS: BATCH19 CLASSIFICATION DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 19 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch19-operation-identity-namespace-audit
          path: |
            __batch19_operation_identity_audit.json
            __batch19_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 19 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch19_operation_identity_audit.json __batch19_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-19-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch19_operation_identity_namespace_audit.py .github/workflows/acpos_batch19_operation_identity_namespace_audit.yml
          git commit -m "chore(acpos): close batch 19 operation identity audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH19 AUDIT HARNESS REMOVED / CLEAN TREE"
