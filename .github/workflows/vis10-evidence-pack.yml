name: VIS-10 evidence pack
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-evidence-pack.yml
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - uses: actions/upload-artifact@v4
        with:
          name: vis10-manual-inspection
          path: docs/construction/evidence/VIS-10/*.png
          if-no-files-found: error
      - name: Self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git rm .github/workflows/vis10-evidence-pack.yml
          git commit -m "chore(vis10): remove temporary evidence pack workflow"
          git push origin HEAD:acpos-vis10-staging
