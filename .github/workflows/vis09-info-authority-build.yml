name: VIS-09 INFO authority promotion and page generation
on:
  push:
    branches:
      - acpos-vis09-staging
    paths:
      - .github/workflows/vis09-info-authority-build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis09-staging
          fetch-depth: 0
      - name: Run INFO construction
        run: python3 scripts/vis09_info_build.py
      - name: Commit exact VIS-09 changes
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add authority/pages/workspace/INFO-01/ACPOS_INFO-01_FINAL_LOCKED_ENCODING.yaml
          git add authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml
          git add authority/global/GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY_FINAL_LOCKED_V1.9.yaml
          git add authority/global/ACPOS_SYSTEM_AUTHORITY_FINAL_LOCKED_CURRENT.yaml
          git add authority/global/ACPOS_PAGE_INTEGRATION_MATRIX_FINAL_LOCKED_CURRENT.yaml
          git add authority/global/ACPOS_I18N_TRANSLATION_ENCODING_FINAL_LOCKED_V1.0.yaml
          git add src/i18n/catalog.ts src/i18n/infoCatalog.ts
          git add src/components/shell/AppShell.tsx
          git add src/components/pages/InfoVisual.tsx src/components/pages/InfoVisual.module.css
          git add src/app/info/page.tsx
          git commit -m "feat(vis09): promote latest information to front NAV-09"
          git rm .github/workflows/vis09-info-authority-build.yml scripts/vis09_info_build.py
          git commit -m "chore(vis09): remove one-time INFO construction tools"
          git push origin HEAD:acpos-vis09-staging
