name: ACPOS Batch 28 Fixed Point Strong Relation Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch28-fixed-point-strong-relation-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 27 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="14effbe24e0ee80068e076ef5e4d0a3ca3f630af"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH27 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 28 fixed-point strong relation audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch28_fixed_point_strong_relation_audit.py

      - name: Verify Batch 28 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch28_strong_relation_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_cells"]==324,s
          assert s["strong_unique_relation"]+s["strong_relation_conflict"]+s["no_strong_relation"]==324,s
          print("PASS: BATCH28 FIXED-POINT DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 28 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch28-fixed-point-strong-relation-audit
          path: |
            __batch28_strong_relation_audit.json
            __batch28_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 28 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch28_strong_relation_audit.json __batch28_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-28-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch28_fixed_point_strong_relation_audit.py .github/workflows/acpos_batch28_fixed_point_strong_relation_audit.yml
          git commit -m "chore(acpos): close batch 28 fixed-point audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH28 HARNESS REMOVED / CLEAN TREE"
