name: IAM-01 preview seal once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/iam01-preview-seal-once.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product source
        uses: actions/checkout@v4
        with:
          ref: new
          path: source
          fetch-depth: 0
      - name: Checkout cumulative preview
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          path: previewrepo
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build exact product source
        working-directory: source
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Capture truthful IAM-01 DOM
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npm run start -- -p 4173 > /tmp/iam01-preview-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/iam01-preview-next.log || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/admin/accounts >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          const fs=require('fs');
          const path=require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const pageErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:4173/admin/accounts',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:IAM-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:IAM-01"]')?.getAttribute('data-page-state')==='BLOCKED');
            assert.equal(await root.getAttribute('data-projection-reason'),'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.equal(await root.getAttribute('data-authority-sections'),'6');
            assert.equal(await root.getAttribute('data-authority-components'),'10');
            assert.equal(await root.getAttribute('data-authority-controls'),'14');
            assert.equal(await root.getAttribute('data-frontend-l1-count'),'9');
            assert.equal(await root.getAttribute('data-backend-l1-count'),'9');
            assert.equal(await page.locator('[data-control-id^="IAM-01-"]').count(),14);
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            const cssHrefs=await page.locator('link[rel="stylesheet"]').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('href')).filter(Boolean));
            assert(cssHrefs.length>0);
            await page.evaluate(()=>{
              document.documentElement.setAttribute('data-iam01-preview-mode','SEALED_STATIC_FAIL_CLOSED');
              document.querySelectorAll('script').forEach(n=>n.remove());
              document.querySelectorAll('link[rel="preload"][as="script"],link[rel="modulepreload"]').forEach(n=>n.remove());
              const navMap={
                '/':'index.html','/core':'core.html','/assets':'assets.html','/video':'video.html','/edit':'edit.html','/qa':'qa.html','/database':'db.html','/strategy':'strategy.html','/info':'info.html',
                '/admin/system':'system.html','/admin/accounts':'accounts.html','/admin/dev':'dev.html','/admin/social':'social.html','/admin/erp':'erp.html','/admin/aiapi':'aiapi.html','/admin/qa-criteria':'qa-criteria.html','/admin/strategy':'strategy-admin.html','/admin/knowledge':'knowledge-admin.html'
              };
              document.querySelectorAll('a[href]').forEach(a=>{
                const href=a.getAttribute('href');
                if(href && navMap[href]) a.setAttribute('href',navMap[href]);
              });
              document.querySelectorAll('img[src]').forEach(img=>{
                const src=img.getAttribute('src');
                if(src==='/brand/orange-one-logo.png') img.setAttribute('src','brand/orange-one-logo.png');
              });
              document.querySelectorAll('link[rel="preload"][as="image"]').forEach(link=>{
                const href=link.getAttribute('href');
                if(href==='/brand/orange-one-logo.png') link.setAttribute('href','brand/orange-one-logo.png');
              });
              document.querySelectorAll('link[rel="stylesheet"]').forEach(link=>{
                const href=link.getAttribute('href');
                if(href && href.includes('/_next/static/chunks/')) {
                  link.setAttribute('href','iam01-assets/_next/static/chunks/'+href.split('/').pop());
                }
              });
            });
            const html='<!DOCTYPE html>'+await page.locator('html').evaluate(el=>el.outerHTML);
            fs.rmSync('/tmp/iam01-stage',{recursive:true,force:true});
            fs.mkdirSync('/tmp/iam01-stage/iam01-assets/_next/static/chunks',{recursive:true});
            fs.writeFileSync('/tmp/iam01-stage/accounts.html',html);
            for(const href of cssHrefs){
              const url=new URL(href,'http://127.0.0.1:4173');
              const name=path.basename(url.pathname);
              const src=path.join(process.cwd(),'.next/static/chunks',name);
              assert(fs.existsSync(src),`missing css ${src}`);
              fs.copyFileSync(src,path.join('/tmp/iam01-stage/iam01-assets/_next/static/chunks',name));
            }
            console.log('IAM01_CAPTURE_CSS',cssHrefs.map(h=>path.basename(new URL(h,'http://x').pathname)).join(','));
            console.log('IAM01_CAPTURE_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Stage isolated cumulative preview update
        shell: bash
        run: |
          set -euo pipefail
          rm -f previewrepo/preview/accounts.html
          rm -rf previewrepo/preview/iam01-assets
          cp /tmp/iam01-stage/accounts.html previewrepo/preview/accounts.html
          cp -R /tmp/iam01-stage/iam01-assets previewrepo/preview/iam01-assets
          cd previewrepo
          changed=$(git status --porcelain | awk '{print $2}')
          echo "$changed"
          bad=$(printf '%s\n' "$changed" | grep -Ev '^(preview/accounts.html|preview/iam01-assets/)' || true)
          test -z "$bad" || { echo "Preview pollution: $bad" >&2; exit 1; }
          test -n "$changed"
      - name: Validate staged standalone preview
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo/preview
          python3 -m http.server 4174 > /tmp/iam01-static.log 2>&1 &
          static_pid=$!
          trap 'kill $static_pid || true; cat /tmp/iam01-static.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/accounts.html >/dev/null; then break; fi
            sleep 1
          done
          cd ../../source
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const runtimeRequests=[]; const scriptRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/'))runtimeRequests.push(`${r.method()} ${u.pathname}`);if(r.resourceType()==='script')scriptRequests.push(u.pathname);});
            await page.goto('http://127.0.0.1:4174/accounts.html',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:IAM-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            assert.equal(await page.locator('html').getAttribute('data-iam01-preview-mode'),'SEALED_STATIC_FAIL_CLOSED');
            const expected={
              'data-authority-status':'FINAL_LOCKED','data-authority-sections':'6','data-authority-components':'10','data-authority-controls':'14','data-frontend-l1-count':'9','data-backend-l1-count':'9',
              'data-control-registry-valid':'true','data-page-state':'BLOCKED','data-projection-status':'BLOCKED','data-projection-reason':'UI_PROJECTION_RUNTIME_NOT_BOUND','data-runtime-error-uid':'IAM-01-ERR-UNDEFINED',
              'data-projection-adapter-ready':'false','data-effectful-runtime-ready':'false','data-formal-runtime-status':'NOT_EXECUTED'
            };
            for(const [k,v] of Object.entries(expected)) assert.equal(await root.getAttribute(k),v,k);
            assert.equal(await page.locator('[data-section-id^="IAM-01-SEC-"]').count(),6);
            assert.equal(await page.locator('[data-component-id^="IAM-01-CMP-"]').count(),10);
            const controls=page.locator('[data-control-id^="IAM-01-"]');
            assert.equal(await controls.count(),14);
            for(let i=0;i<14;i++){
              const node=controls.nth(i);
              for(const attr of ['data-action-uid','data-gate-uid','data-permission-uid','data-effect-type','data-current-state','data-runtime-binding']) assert(await node.getAttribute(attr),`${i} ${attr}`);
            }
            assert.equal(await page.locator('script').count(),0);
            assert.deepEqual(runtimeRequests,[]);
            assert.deepEqual(scriptRequests,[]);
            assert.equal(await page.locator('[data-nav-id="ADMIN-NAV-02"]').getAttribute('href'),'accounts.html');
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('IAM01_STATIC_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('IAM01_STATIC_PREVIEW_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit and push sealed IAM-01 preview
        shell: bash
        run: |
          set -euo pipefail
          cd previewrepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/accounts.html preview/iam01-assets
          git commit -m 'sync(preview): seal isolated IAM-01 page'
          git push origin HEAD:acpos-live-preview
          echo "IAM01_PREVIEW_HEAD=$(git rev-parse HEAD)"
