    text: 13. Construction Mapping / 後續施工切片
  - index: 52
    style: Normal
    text: 1.  把 Sidebar width 變成 Shell 單一狀態來源，移除 overlay-only workspace 固定 left 規則。
  - index: 53
    style: Normal
    text: 2.  讓 Workspace left / width 或 grid column 與 Sidebar width 同步 transition。
  - index: 54
    style: Normal
    text: 3.  以 1024 / 1280 / 1440 / 1536 / 1920 驗證 collapsed + expanded 共 10 組 viewport/state。
  - index: 55
    style: Normal
    text: 4.  逐頁檢查最左側 Primary Action、Table header、Input、Conversation composer 不被遮住。
  - index: 56
    style: Normal
    text: 5.  重跑 Navigation visibility、Keyboard、Reduced Motion、Header overflow、Frontend/Admin switch。
  - index: 57
    style: Normal
    text: 6.  完成 Visual Review 後再進實際 Runtime/Business Logic；Word 本身不等於程式已施工。
