    rows:
    - row: 0
      cells:
      - QA eligibility binding
      - Required contract
    - row: 1
      cells:
      - exact_content_ref
      - Exact reviewed content/release candidate ref; alias/latest-only forbidden.
    - row: 2
      cells:
      - output_version_ref
      - Exact reviewed content/output version.
    - row: 3
      cells:
      - artifact_checksum
      - Must match the QA-reviewed artifact/content manifest.
    - row: 4
      cells:
      - criteria_profile_uid
      - Applicable governed QA profile.
    - row: 5
      cells:
      - criteria_version_id
      - Exact APPROVED criteria version.
    - row: 6
      cells:
      - quality_gate_policy_version
      - Exact gate policy version paired with the scorecard.
    - row: 7
      cells:
      - scorecard_id
      - Fresh scorecard for the exact version.
    - row: 8
      cells:
      - qa_gate_status
      - Must equal PASS for governed publish eligibility.
    - row: 9
      cells:
      - required_checks
      - All applicable hard checks PASS, including Rights/Policy/Provenance/Checksum where required.
    - row: 10
      cells:
      - open_blocking_findings
      - Must equal 0.
    - row: 11
      cells:
      - evidence_refs
      - Required-check / review / recheck / manual-case evidence lineage.
  - index: 21
    rows:
    - row: 0
      cells:
      - Gate condition
      - Required behavior
    - row: 1
      cells:
      - Exact target/content/account/policy valid
      - Continue to QA eligibility validation.
    - row: 2
      cells:
      - Missing exact version/checksum/criteria/scorecard/evidence
      - BLOCK before requestSocialTargetPublish.
    - row: 3
      cells:
      - Artifact/content changed after QA
      - Previous scorecard becomes stale; BLOCK until fresh recheck.
    - row: 4
      cells:
      - qa_gate_status != PASS
      - BLOCK.
    - row: 5
      cells:
      - required hard check FAIL or open_blocking_findings > 0
      - BLOCK regardless of aggregate score or business approval.
    - row: 6
      cells:
      - Eligibility PASS
      - May invoke existing requestSocialTargetPublish only; local request acceptance becomes PENDING_EXTERNAL, not POSTED.
    - row: 7
      cells:
      - External result
      - Only real adapter callback/result can transition external publish truth to POSTED/failed/other recorded state.
