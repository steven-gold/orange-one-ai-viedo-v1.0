name: Stage-02 Remediation Fresh Reexecution R1

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-remediation-reexecution-r1.yml'
      - 'governance/ci/prepare_stage02_reexecution_clean_baseline.py'
      - 'governance/ci/run_current_stage2_reexecution.py'
      - 'governance/ci/validate_stage02_successor_integrity.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage02-remediation-reexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance registry
        run: python governance/ci/governance_resolver.py

      - name: Validate canonical stage remediation closure protocol
        run: python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Validate legal Stage-02 blocked successor and pending product remediation state
        run: python governance/ci/validate_stage02_successor_integrity.py

      - name: Validate materialized owning-layer product contracts
        run: python governance/ci/validate_current_stage2_materialized_closure.py

      - name: Reset execution-only residue while preserving owning-layer remediation
        run: python governance/ci/prepare_stage02_reexecution_clean_baseline.py

      - name: Run complete full-line multidirectional high-pressure system gate before fresh reexecution
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py

      - name: Prove verified governance source remains byte-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/governance-source/active/source
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' -o -name '*.tmp' -o -name '*.bak' -o -name '*~' \) -print)"
          test -z "$bad" || { printf 'BLOCK: source runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: verified source remains byte-clean before fresh Stage-02 reexecution'

      - name: Execute fresh Stage-02 remediation reexecution from immutable Stage-01 authority
        env:
          STAGE02_FULL_LINE_CONFIRMED: '1'
        run: python governance/ci/run_current_stage2_reexecution.py

      - name: Validate successor integrity after fresh reexecution state mutation
        run: python governance/ci/validate_stage02_successor_integrity.py

      - name: Prove Current Specification and Stage-01 immutable inputs were not mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: reexecution mutated only non-normative evidence/state; owning-layer product fix remained intact'

      - name: Commit fresh reexecution evidence and synchronized Current state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/ACTIVE_STATE.yaml
          git add governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
          git add governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json
          git add governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml
          git add governance/test/stage02/STAGE02_REEXECUTION_CLEAN_BASELINE_RECEIPT_R1.yaml
          git add governance/test/stage02/STAGE02_DEFECT_SIGNATURE_REGRESSION_R1.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: fresh reexecution produced no persistent evidence/state change' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist remediation fresh reexecution R1'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload fresh Stage-02 reexecution evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-remediation-reexecution-r1
          path: |
            .github/stage02-test/STAGE02_REEXECUTION_RESULT.json
            governance/test/stage02/STAGE02_REEXECUTION_CLEAN_BASELINE_RECEIPT_R1.yaml
            governance/test/stage02/STAGE02_DEFECT_SIGNATURE_REGRESSION_R1.yaml
            governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json
            governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml
          if-no-files-found: error
