name: ACPOS final system audit
on:
  push:
    branches: [acpos-final-system-audit-20260903]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Product dependency audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck

      - name: Current Authority integrity and V1.3 integration
        shell: python
        run: |
          from pathlib import Path
          import re
          m=Path('authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml').read_text()
          s=Path('authority/global/ACPOS_SYSTEM_AUTHORITY_FINAL_LOCKED_CURRENT.yaml').read_text()
          x=Path('authority/global/ACPOS_PAGE_INTEGRATION_MATRIX_FINAL_LOCKED_CURRENT.yaml').read_text()
          v=Path('authority/global/ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT_FINAL_LOCKED_V1.3.yaml').read_text()
          shell=Path('authority/global/GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY_FINAL_LOCKED_V1.9.yaml').read_text()
          pages=re.findall(r'^  - (authority/pages/[^\n]+)$',m,re.M)
          assert len(pages)==18, len(pages)
          assert len(set(pages))==18
          for p in pages: assert Path(p).is_file(), p
          assert 'current_page_count: 18' in m
          assert 'front_l1_count: 9' in m and 'admin_l1_count: 9' in m
          assert 'version: V1.3' in m
          assert 'production_script_v1_3:' in m
          assert 'scope: INSTRUCTION_PROVIDER_ADAPTER_ONLY' in m
          assert 'version: V1.3' in v and 'new_page: false' in v and 'new_runtime_service: false' in v and 'new_provider_registry: false' in v and 'new_script_engine: false' in v
          assert 'provider_profile_current_owner: admin:AIAPI-01#provider_model_profiles' in v
          assert 'manual_provider_model_picker: FORBIDDEN' in v
          assert 'production_script: authority/global/ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT_FINAL_LOCKED_V1.3.yaml' in s
          assert 'page_count: 18' in x
          assert 'version: V1.9' in shell
          assert not list(Path('authority').rglob('*PRODUCTION_SCRIPT*V1.2*'))
          contracts=list(Path('authority/global').glob('*PRODUCTION_SCRIPT*'))
          assert len(contracts)==1 and contracts[0].name.endswith('V1.3.yaml'), [str(p) for p in contracts]
          assert not any('AIAPI-06' in p for p in pages)
          assert 'VALIDATION_REVIEW_ONLY' in m and 'production_script_authoring: false' in m
          print('CURRENT_AUTHORITY_INTEGRITY_PASS')

      - name: Construction scope and temporary artifact hygiene
        shell: python
        run: |
          from pathlib import Path
          allowed_current='final-system-audit-once.yml'
          stale=[]
          for p in Path('.github/workflows').glob('*'):
            n=p.name
            if n==allowed_current: continue
            if any(token in n for token in ['closure-validation-once','validation-once','global-18page-validation-once','v13-cross-page-binding-validation-once']): stale.append(str(p))
          assert not stale, stale
          assert not list(Path('.').glob('*.yaml')) and not list(Path('.').glob('*.yml'))
          for p in Path('authority').rglob('*'):
            if not p.is_file(): continue
            name=p.name.upper()
            if 'PRODUCTION_SCRIPT' in name: assert 'V1.3' in name, str(p)
          print('CONSTRUCTION_HYGIENE_PASS')

      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ''
        run: npm run build

      - name: Production 18-page route and projection truth
        run: |
          set -euo pipefail
          PORT=3301 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/final-prod.log 2>&1 & pid=$!
          trap 'cat /tmp/final-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3301/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const expected=[
            ['/', 'workspace:WB-01'],['/core','CORE-01'],['/assets','ASSET-01'],['/video','VIDEO-01'],['/edit','EDIT-01'],['/qa','QA-01'],['/database','admin:DB-01'],['/strategy','workspace:STR-01'],['/info','workspace:INFO-01'],
            ['/admin/system','admin:SYS-01'],['/admin/accounts','admin:IAM-01'],['/admin/dev','admin:DEV-01'],['/admin/social','admin:SOC-01'],['/admin/erp','admin:ERP-01'],['/admin/aiapi','admin:AIAPI-01'],['/admin/qa-criteria','admin:SG-02'],['/admin/strategy','admin:STR-01'],['/admin/knowledge','admin:KB-01']
          ];
          (async()=>{
            for(const [route,uid] of expected){
              const page=await fetch('http://127.0.0.1:3301'+route);
              if(!page.ok) throw new Error(`PAGE ${route} HTTP ${page.status}`);
              const res=await fetch('http://127.0.0.1:3301/v1/ui-projections/'+encodeURIComponent(uid));
              const text=await res.text();
              if(![200,503].includes(res.status)) throw new Error(`PROJECTION ${uid} HTTP ${res.status}: ${text}`);
              if(/TEST_ONLY|"synthetic"\s*:\s*true|TEST-RUN-|production_eligible"\s*:\s*false/.test(text)) throw new Error(`TEST DATA LEAK ${uid}`);
              if(res.status===503 && !/RUNTIME_NOT_BOUND|NOT_BOUND|NOT_CONFIGURED/.test(text)) throw new Error(`UNTRUTHFUL 503 ${uid}: ${text}`);
              console.log('PROD',route,uid,res.status);
            }
            console.log('PRODUCTION_18PAGE_TRUTH_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT

      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build

      - name: Controlled 18-page projection truth
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3302 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/final-ctrl.log 2>&1 & pid=$!
          trap 'cat /tmp/final-ctrl.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3302/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const uids=['workspace:WB-01','CORE-01','ASSET-01','VIDEO-01','EDIT-01','QA-01','admin:DB-01','workspace:STR-01','workspace:INFO-01','admin:SYS-01','admin:IAM-01','admin:DEV-01','admin:SOC-01','admin:ERP-01','admin:AIAPI-01','admin:SG-02','admin:STR-01','admin:KB-01'];
          (async()=>{
            let bound=0,unbound=0;
            for(const uid of uids){
              const res=await fetch('http://127.0.0.1:3302/v1/ui-projections/'+encodeURIComponent(uid));
              const text=await res.text();
              if(res.status===200){
                const d=JSON.parse(text),m=d.test_metadata;
                if(!m||m.data_classification!=='TEST_ONLY'||m.synthetic!==true||m.production_eligible!==false) throw new Error(`CLASSIFICATION ${uid}`);
                if(!d.page_state) throw new Error(`PAGE STATE MISSING ${uid}`);
                bound++; console.log('CTRL_BOUND',uid,d.page_state); continue;
              }
              if(res.status===503){
                if(!/RUNTIME_NOT_BOUND|NOT_BOUND|NOT_CONFIGURED/.test(text)) throw new Error(`UNTRUTHFUL CONTROLLED 503 ${uid}: ${text}`);
                if(/TEST_ONLY|"synthetic"\s*:\s*true|TEST-RUN-/.test(text)) throw new Error(`TEST DATA IN UNBOUND RESPONSE ${uid}`);
                unbound++; console.log('CTRL_UNBOUND',uid); continue;
              }
              throw new Error(`CONTROLLED ${uid} HTTP ${res.status}: ${text}`);
            }
            if(bound+unbound!==18) throw new Error(`CONTROLLED COUNT ${bound}+${unbound}`);
            console.log('CONTROLLED_18PAGE_TRUTH_PASS',`bound=${bound}`,`unbound=${unbound}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT

      - name: Install Chromium for audit only
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Controlled 18-page browser E2E
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3303 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/final-browser.log 2>&1 & pid=$!
          trap 'cat /tmp/final-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3303/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const{chromium}=require('playwright');
          const expected=[
            ['/', 'workspace:WB-01'],['/core','CORE-01'],['/assets','ASSET-01'],['/video','VIDEO-01'],['/edit','EDIT-01'],['/qa','QA-01'],['/database','admin:DB-01'],['/strategy','workspace:STR-01'],['/info','workspace:INFO-01'],
            ['/admin/system','admin:SYS-01'],['/admin/accounts','admin:IAM-01'],['/admin/dev','admin:DEV-01'],['/admin/social','admin:SOC-01'],['/admin/erp','admin:ERP-01'],['/admin/aiapi','admin:AIAPI-01'],['/admin/qa-criteria','admin:SG-02'],['/admin/strategy','admin:STR-01'],['/admin/knowledge','admin:KB-01']
          ];
          (async()=>{
            const b=await chromium.launch({headless:true}); const seen=new Set();
            for(const width of [1280,1440,1920]){
              for(const [route,uid] of expected){
                const p=await b.newPage({viewport:{width,height:1700}}),errs=[];
                p.on('pageerror',e=>errs.push('pageerror:'+e.message));
                p.on('console',m=>{if(m.type()==='error' && !/Failed to load resource.*503/.test(m.text()))errs.push('console:'+m.text())});
                const resp=await p.goto('http://127.0.0.1:3303'+route,{waitUntil:'networkidle',timeout:45000});
                if(!resp||!resp.ok()) throw new Error(`NAV ${route} ${resp?.status()}`);
                const root=p.locator('[data-page-uid]').first();
                await root.waitFor({state:'attached',timeout:15000});
                const actual=await root.getAttribute('data-page-uid');
                if(actual!==uid) throw new Error(`UID ${route}: expected ${uid} actual ${actual}`);
                if(width===1280){ if(seen.has(actual)) throw new Error(`DUPLICATE UID ${actual}`); seen.add(actual); }
                const state=await root.getAttribute('data-page-state');
                if(state==='LOADING') throw new Error(`STUCK LOADING ${uid}`);
                const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                if(overflow>0) throw new Error(`OVERFLOW ${uid} ${width}:${overflow}`);
                const body=(await p.locator('body').textContent())||'';
                if(body.includes('"use client"')||body.includes('function KnowledgeAdminVisual')||body.includes('const CONTROLS')) throw new Error(`SOURCE RENDERED ${uid}`);
                if(errs.length) throw new Error(`${uid} ${width}: ${errs.join(' | ')}`);
                console.log('BROWSER',width,route,actual,state||'NO_ROOT_STATE');
                await p.close();
              }
            }
            if(seen.size!==18) throw new Error(`UID COUNT ${seen.size}`);
            await b.close(); console.log('GLOBAL_18PAGE_BROWSER_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT

      - name: Final source residual and dirty-tree guard
        run: |
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/components/pages src/domain src/server/testing
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name '*closure-validation-once.yml' -o -name '*global-18page-validation-once.yml' -o -name '*v13-cross-page-binding-validation-once.yml' \) -print)"
          git diff --exit-code
