name: ACPOS Batch 40 System01 INFO Persistence Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch40-system01-info-persistence-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 39 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="1be8067f103dc2a1402771cfd4635b622a6dbe26"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH39 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 40 System01 INFO persistence audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch40_system01_info_persistence_audit.py

      - name: Verify Batch 40 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch40_system01_info_persistence_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["operations"]==3,s
          assert s["owner_paragraph_hits"]+s["owner_table_hits"]>0,s
          print("PASS: BATCH40 SYSTEM01 INFO PERSISTENCE EVIDENCE")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 40 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch40-system01-info-persistence-audit
          path: |
            __batch40_system01_info_persistence_audit.json
            __batch40_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 40 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch40_system01_info_persistence_audit.json __batch40_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-40-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch40_system01_info_persistence_audit.py .github/workflows/acpos_batch40_system01_info_persistence_audit.yml
          git commit -m "chore(acpos): close batch 40 system01 info persistence audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH40 HARNESS REMOVED / CLEAN TREE"
