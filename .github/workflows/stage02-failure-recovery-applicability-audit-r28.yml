name: Stage-02 Failure Recovery Applicability Audit R28

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-failure-recovery-applicability-audit-r28.yml'
      - 'governance/ci/audit_stage02_failure_recovery_applicability_r28.py'
      - 'governance/ci/validate_stage02_failure_recovery_applicability_r28.py'
      - 'governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_PROBLEM_RECONCILIATION_R26.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-applicability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R28 implementation
        run: |
          python -m py_compile governance/ci/audit_stage02_failure_recovery_applicability_r28.py
          python -m py_compile governance/ci/validate_stage02_failure_recovery_applicability_r28.py
      - name: Revalidate R26 current problem baseline
        run: python governance/ci/validate_stage02_current_problem_reconciliation_r26.py
      - name: Audit failure recovery applicability R28
        run: python governance/ci/audit_stage02_failure_recovery_applicability_r28.py
      - name: Validate R28 applicability audit
        run: python governance/ci/validate_stage02_failure_recovery_applicability_r28.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert no premature blocker reduction
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('governance/test/stage02/STAGE02_FAILURE_RECOVERY_APPLICABILITY_AUDIT_R28.yaml').read_text())
          den=d['denominators']
          assert den['failure_recovery_problems_audited']==44, den
          assert den['not_applicable_exact_proof_count'] + den['keep_gap_count'] == 44, den
          assert den['blocker_reduction_claimed']==0, den
          assert d['current_specification_mutated'] is False and d['immutable_stage1_source_mutated'] is False, d
          assert d['stage02_status']=='BLOCKED', d
          print(f"PASS: R28 audited=44 exact_NA={den['not_applicable_exact_proof_count']} keep={den['keep_gap_count']} blocker_reduction=0")
          PY
      - name: Persist R28 applicability audit
        run: |
          path='governance/test/stage02/STAGE02_FAILURE_RECOVERY_APPLICABILITY_AUDIT_R28.yaml'
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo 'R28 output unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'test(stage02): persist failure recovery applicability audit R28'
          git push origin HEAD:rebuild-v2.1.1
