name: Stage-02 Post-Action Validation Candidate Authoring R37

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-post-action-validation-candidate-authoring-r37.yml'
      - 'governance/ci/build_stage02_post_action_validation_candidate_authoring_r37.py'
      - 'governance/ci/validate_stage02_post_action_validation_candidate_authoring_r37.py'
      - 'governance/test/stage02/STAGE02_POST_ACTION_VALIDATION_DEPENDENCY_TRACE_R15.yaml'
      - 'governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_DECISION_STATUS_R33.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author-validate-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R37 implementation
        run: |
          python -m py_compile governance/ci/build_stage02_post_action_validation_candidate_authoring_r37.py
          python -m py_compile governance/ci/validate_stage02_post_action_validation_candidate_authoring_r37.py
      - name: Revalidate R15 and R33 baselines
        run: |
          python governance/ci/validate_stage02_post_action_validation_dependency_trace_r15.py
          python governance/ci/validate_stage02_current_decision_status_r33.py
      - name: Author post-action validation candidates
        run: python governance/ci/build_stage02_post_action_validation_candidate_authoring_r37.py
      - name: Validate post-action validation candidates
        run: python governance/ci/validate_stage02_post_action_validation_candidate_authoring_r37.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert candidate-only cycle
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('governance/test/stage02/STAGE02_POST_ACTION_VALIDATION_CANDIDATE_AUTHORING_R37.yaml').read_text())
          assert d['denominators']['input_gaps']==18
          assert d['denominators']['blocker_reduction_claimed']==0
          assert d['product_contract_materialized_this_cycle'] is False
          assert d['stage02_status']=='BLOCKED' and d['stage03_allowed'] is False
          print('PASS: R37 authoring only; no contract materialization or blocker reduction')
          PY
      - name: Persist R37 evidence
        run: |
          path='governance/test/stage02/STAGE02_POST_ACTION_VALIDATION_CANDIDATE_AUTHORING_R37.yaml'
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo 'R37 output unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'test(stage02): persist post-action validation candidates R37'
          git push origin HEAD:rebuild-v2.1.1
