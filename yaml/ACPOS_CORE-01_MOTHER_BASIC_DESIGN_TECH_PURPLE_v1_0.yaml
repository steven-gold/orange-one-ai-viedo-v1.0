    text: 'Single/Multi AI: no provider/model picker; Assigned AI Set is system-owned; Assistant is not third mode.'
  - index: 76
    style: List Bullet
    text: 'Decision Safety: AI output→Summary→Evaluation→Human Decision→Structured Decision→Candidate; score alone never locks.'
  - index: 77
    style: List Bullet
    text: 'Immutable Version: no overwrite; Return preserves old candidate/version.'
  - index: 78
