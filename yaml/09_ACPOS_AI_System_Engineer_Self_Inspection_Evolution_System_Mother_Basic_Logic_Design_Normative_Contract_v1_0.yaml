  - index: 77
    style: Normal
    text: 'Implementation handoff MUST preserve the following non-negotiable semantics:'
  - index: 78
    style: Rule
    text: • One Current Truth Bootstrap path；不得由每個 inspector 自己解讀 current version。
  - index: 79
    style: Rule
    text: • One Finding / Problem Register truth；scanner/validator/remediator 不得各自維護不同 denominator。
  - index: 80
    style: Rule
    text: • One Canonical Owner resolution model；修正 owner，不建立平行副本。
  - index: 81
    style: Rule
    text: • Functional Chain 必須可從 Page/Trigger 追到 Runtime/Data/Provider，再回 Audit/Response/UI Feedback。
  - index: 82
    style: Rule
    text: • Change Candidate 與 Current Authority 必須物理/語義分離；candidate 不可自動成 Current。
  - index: 83
    style: Rule
    text: • AI-09 不得擁有自己的自批權；Authorization 必須由外部授權 identity 完成。
  - index: 84
    style: Rule
    text: • Simulation/Test/Deploy/Production 四層證據不得互相替代。
  - index: 85
    style: Rule
    text: • Rollback/Resume/Checkpoint 必須與 effectful execution 一起施工，不是事後補文件。
  - index: 86
    style: Rule
    text: • Incident Learning 與 EvolutionCandidate 只能透過 Governed Adoption 改善未來規則。
  - index: 87
    style: Rule
    text: • 所有缺失 exact API/DB/permission/route/runtime identity 必須維持 REQUIRE_EXACT_BINDING，直到 Current Authority 實際存在。
  - index: 88
    style: Normal
    text: ACPOS-AI-09 Mother Basic Logic Design：DESIGN_CONTENT_COMPLETE
