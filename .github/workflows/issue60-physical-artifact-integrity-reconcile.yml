# retry-after-common-section-realignment
name: Issue60 Physical Artifact Integrity Reconcile
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - '.github/workflows/issue60-physical-artifact-integrity-reconcile.yml'
permissions:
  contents: write
concurrency:
  group: issue60-physical-artifact-integrity-reconcile
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Reconcile, validate, and persist diagnostic
        shell: bash
        run: |
          set -u
          BASE_HEAD="$(git rev-parse HEAD)"
          export BASE_HEAD
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          commands=[
            ["python","governance/source-successor/materialize_derived_source_package.py"],
            ["python","governance/source-successor/refresh_source_checksums.py"],
            ["python",".github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py"],
            ["python","governance/ci/audit_closure_engine.py","--self-test"],
            ["python","governance/ci/test_stage_execution_engine.py"],
            ["python","governance/source-successor/materialize_derived_source_package.py","--check"],
            ["python","governance/source-successor/refresh_source_checksums.py","--check"],
          ]
          results=[]
          overall=0
          for cmd in commands:
            cp=subprocess.run(cmd,text=True,capture_output=True)
            results.append({
              "command":" ".join(cmd),
              "returncode":cp.returncode,
              "stdout_tail":cp.stdout[-4000:],
              "stderr_tail":cp.stderr[-4000:],
            })
            if cp.returncode!=0:
              overall=1
          out={
            "artifact_type":"GOVERNANCE_RECONCILIATION_DIAGNOSTIC",
            "scope":"PHYSICAL_ARTIFACT_INTEGRITY",
            "base_head":os.environ["BASE_HEAD"],
            "result":"PASS" if overall==0 else "FAIL",
            "commands":results,
          }
          p=Path("governance/test/ISSUE60_PHYSICAL_ARTIFACT_INTEGRITY_RECONCILE.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          raise SystemExit(overall)
          PY
          RC=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RC" -eq 0 ]; then
            git add               .github/governance-source/active/source/10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml               .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py               .github/governance-source/active/source/11_EVIDENCE/audit/AUDIT_BASELINE.yaml               .github/governance-source/active/source/11_EVIDENCE/audit/generated/GOVERNANCE_REQUIREMENT_INDEX.json               .github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml               .github/governance-source/active/source/CHECKSUMS.sha256
          fi
          git add governance/test/ISSUE60_PHYSICAL_ARTIFACT_INTEGRITY_RECONCILE.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(governance): record physical artifact integrity reconcile"
            REMOTE_HEAD="$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$BASE_HEAD"
            git push origin HEAD:rebuild-v2.1.1
          fi
          exit "$RC"
