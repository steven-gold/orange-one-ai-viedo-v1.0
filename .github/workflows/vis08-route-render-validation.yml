name: VIS-08 STR-01 Route Render Validation

on:
  push:
    branches: [acpos-vis08-staging]
    paths:
      - '.github/workflows/vis08-route-render-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis08-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind NAV-08 to authorized route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/shell/AppShell.tsx')
          s=p.read_text()
          old='{ id: "NAV-08", labelKey: "global.nav.strategy", icon: "strategy" },'
          new='{ id: "NAV-08", labelKey: "global.nav.strategy", icon: "strategy", href: "/strategy" },'
          assert s.count(old)==1, f'NAV-08 source count={s.count(old)}'
          p.write_text(s.replace(old,new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser validation dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/vis08-server.log 2>&1 &
          echo $! > /tmp/vis08-server.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/strategy >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vis08-server.log
          exit 1
      - name: Chromium authority and geometry validation
        run: |
          mkdir -p docs/construction/evidence/VIS-08
          cat > /tmp/vis08.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const results={};
          async function inspect(width,height,name,expanded=false){
            const page=await browser.newPage({viewport:{width,height}});
            const business=[];
            page.on('request',r=>{ if(['xhr','fetch'].includes(r.resourceType())) business.push(r.url()); });
            const res=await page.goto('http://127.0.0.1:3000/strategy',{waitUntil:'networkidle'});
            if(!res || !res.ok()) throw new Error(`route ${res?.status()}`);
            const root=page.locator('[data-page-uid="workspace:STR-01"]');
            await root.waitFor();
            const attrs=await root.evaluate(el=>({
              sections:el.getAttribute('data-authority-sections'), visuals:el.getAttribute('data-authority-visuals'),
              components:el.getAttribute('data-authority-components'), controls:el.getAttribute('data-authority-controls'),
              registry:el.getAttribute('data-registry-valid')
            }));
            if(JSON.stringify(attrs)!==JSON.stringify({sections:'12',visuals:'12',components:'16',controls:'57',registry:'true'})) throw new Error(`attrs ${JSON.stringify(attrs)}`);
            const counts=await root.evaluate(el=>({
              controls:new Set([...el.querySelectorAll('[data-control-id]')].map(x=>x.getAttribute('data-control-id'))).size,
              sections:new Set([...el.querySelectorAll('[data-section-id]')].map(x=>x.getAttribute('data-section-id'))).size,
              visuals:new Set([...el.querySelectorAll('[data-visual-uid]')].map(x=>x.getAttribute('data-visual-uid'))).size,
              components:new Set([...el.querySelectorAll('[data-component-uid]')].map(x=>x.getAttribute('data-component-uid'))).size,
              enabled:el.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled])').length
            }));
            if(counts.controls!==57||counts.sections!==12||counts.visuals!==12||counts.components!==16||counts.enabled!==0) throw new Error(`counts ${JSON.stringify(counts)}`);
            const providerPicker=await root.locator('[data-control-id*="PROVIDER"], [data-control-id*="MODEL"]').count();
            if(providerPicker!==1) throw new Error(`provider/model controls ${providerPicker}`); // Provider Brand readonly only
            const providerBrand=await root.locator('[data-control-id="STR-01-FLD-PROVIDER-BRAND"]').count();
            if(providerBrand!==1) throw new Error('Provider Brand missing');
            const ws=page.locator('.workspace-slot');
            const sidebar=page.locator('.global-sidebar');
            const before=await ws.boundingBox();
            if(expanded){ await sidebar.hover(); await page.waitForTimeout(220); }
            const after=await ws.boundingBox();
            const side=await sidebar.boundingBox();
            if(expanded && Math.abs((before?.x??0)-(after?.x??0))>1) throw new Error('sidebar reflow');
            const dims=await root.evaluate(el=>({client:el.clientWidth,scroll:el.scrollWidth}));
            const primary=await page.locator('[data-section-id="STR-01-SEC-02"]').evaluate(el=>{
              const grid=el.closest('aside')?.parentElement; if(!grid) return null;
              const kids=[...grid.children].map(x=>x.getBoundingClientRect().width); return kids;
            });
            const language=page.locator('button[aria-haspopup="listbox"]');
            await language.click(); await page.locator('[role="option"]').nth(2).click();
            if(await root.locator('[data-control-id="STR-01-INP-TOPIC-SEARCH"]').count()!==1) throw new Error('en locale lost controls');
            await language.click(); await page.locator('[role="option"]').nth(1).click();
            if(await root.locator('[data-control-id="STR-01-INP-TOPIC-SEARCH"]').count()!==1) throw new Error('zh-CN locale lost controls');
            results[name]={attrs,counts,businessRequests:business.length,workspaceXBefore:before?.x,workspaceXAfter:after?.x,sidebarWidth:side?.width,page:dims,primaryWidths:primary};
            await page.screenshot({path:`docs/construction/evidence/VIS-08/${name}.png`,fullPage:true});
            await page.close();
          }
          await inspect(1600,1000,'vis08-1600-top',false);
          await inspect(1600,1000,'vis08-1600-expanded',true);
          await inspect(1440,1000,'vis08-1440-top',false);
          await inspect(1440,1000,'vis08-1440-expanded',true);
          await inspect(1200,1000,'vis08-1200-minwidth',false);
          await browser.close();
          if(results['vis08-1600-top'].page.scroll!==results['vis08-1600-top'].page.client) throw new Error(`1600 overflow ${JSON.stringify(results['vis08-1600-top'].page)}`);
          if(results['vis08-1440-top'].page.scroll!==results['vis08-1440-top'].page.client) throw new Error(`1440 overflow ${JSON.stringify(results['vis08-1440-top'].page)}`);
          if(results['vis08-1200-minwidth'].page.scroll<=results['vis08-1200-minwidth'].page.client) throw new Error(`1200 should horizontal scroll ${JSON.stringify(results['vis08-1200-minwidth'].page)}`);
          fs.writeFileSync('docs/construction/evidence/VIS-08/vis08-validation.json',JSON.stringify(results,null,2));
          JS
          node /tmp/vis08.mjs
      - name: Commit only formal route and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/shell/AppShell.tsx docs/construction/evidence/VIS-08
          git commit -m 'test(vis08): validate authorized STR-01 route and render [skip ci]'
          git push origin HEAD:acpos-vis08-staging
