    text: 全站共用 Layout、Header、Front/Admin Navigation 與 Workspace Mount 施工基準
  - index: 7
    style: Heading 1
    text: 1. Shell Identity / 設計目標
  - index: 9
    style: Heading 1
    text: 2. Coupled Reflow Geometry / 選單與工作區連動
  - index: 11
    style: Normal
    text: 圖 1　Sidebar 收合與展開時，Workspace 必須同步調整位置與可用寬度。
  - index: 15
    style: Heading 1
    text: 3. Header Contract / 上方固定欄
  - index: 17
    style: List Bullet
    text: Header 永遠固定於 viewport top；工作區 top = 68px，保留 10px vertical gutter。
  - index: 18
    style: List Bullet
    text: Header 不顯示 Permission Chip；權限屬 Account-bound Authorization。
  - index: 19
    style: List Bullet
    text: Page Title 由各 Page Authority 管理；Global Header 中央不再放頁名，避免與右側 Account Cluster 衝突。
  - index: 20
    style: List Bullet
    text: Popover / Language Menu 使用高於 Workspace 的 z-index，但不得改變 Sidebar/Workspace Geometry。
  - index: 21
    style: Heading 1
    text: 4. Front Navigation / 前台 9 個 L1
  - index: 24
    style: Heading 1
    text: 5. Admin Navigation / 後台 9 個 L1
  - index: 26
    style: Heading 1
    text: 6. Sidebar Interaction State Machine
  - index: 28
    style: List Bullet
    text: 建議共享 transition 160–200ms；`prefers-reduced-motion` 時近乎即時。
  - index: 29
    style: List Bullet
    text: Expanded Sidebar 仍固定 top=58px / bottom=0，但不是浮在 Workspace 上方；它是 Shell Grid 的第一欄。
  - index: 30
    style: List Bullet
    text: Workspace 自己的 horizontal overflow 只能處理 Page 內部 min-width；不得用 Sidebar Overlay 造成額外 occlusion。
  - index: 31
    style: List Bullet
    text: 所有 Page 必須能在兩種 Shell 寬度下維持 control 可操作、無遮蓋、無 off-screen primary action。
  - index: 32
    style: Heading 1
    text: 7. Workspace Mount / Page Integration Contract
  - index: 34
    style: Heading 1
    text: 8. Page Responsive Compatibility
  - index: 36
    style: Heading 1
    text: 9. Permission / Visibility / Active State
  - index: 37
    style: List Bullet
    text: Navigation 顯示只依 Account Permission Assignment 與 Canonical Navigation Authority。
  - index: 38
    style: List Bullet
    text: Permission denied：整個 Nav Item `HIDDEN`，剩餘項目維持原相對順序。
  - index: 39
    style: List Bullet
    text: Authorized but state blocked：既有 Control 可 `DISABLED` 並提供可讀原因。
  - index: 40
    style: List Bullet
    text: Active Front Item 由 canonical page ancestry 決定；Active Admin Item 由 exact admin page UID 決定；禁止用 URL 字串猜測。
  - index: 41
    style: List Bullet
    text: Surface Switch 只顯示使用者有權限進入的合法目標；沒有合法目標時 fail-closed。
  - index: 42
    style: Heading 1
    text: 10. Controls / A11y / i18n
  - index: 44
    style: List Bullet
    text: 支援 zh-TW / zh-CN / en；ORANGE ONE、ACPOS、AI、API、QA 等固定術語依全域規則處理。
  - index: 45
    style: List Bullet
    text: Focus 不得只靠顏色；Selected/Active 同時使用背景／邊框／狀態屬性。
  - index: 46
    style: List Bullet
    text: 收合 Sidebar 時 Nav Label 可視上隱藏，但 Icon 必須具有完整 aria-label。
  - index: 47
    style: Heading 1
    text: 11. Error / Recovery
  - index: 49
    style: Heading 1
    text: 12. Acceptance Matrix
  - index: 51
