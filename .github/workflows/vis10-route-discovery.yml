name: VIS-10 SYS-01 route discovery
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-route-discovery.yml
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
          fetch-depth: 0
      - name: Scan route resolver evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          exts={'.yaml','.yml','.json','.md','.txt','.js','.jsx','.ts','.tsx','.css','.html'}
          rows=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts: continue
              try: lines=p.read_text(errors='ignore').splitlines()
              except Exception: continue
              for i,line in enumerate(lines,1):
                  low=line.lower()
                  if ('sys-01' in low or 'admin-nav-01' in low or '/admin' in low) and any(k in low for k in ['route','path','href','url','page_uid','nav_id','sys-01','admin-nav-01','/admin']):
                      rows.append({'path':str(p),'line':i,'text':line.strip()})
          Path('/tmp/vis10-route-discovery.json').write_text(json.dumps({'matches':rows,'count':len(rows)},ensure_ascii=False,indent=2))
          print('matches',len(rows))
          for r in rows: print(f"{r['path']}:{r['line']}: {r['text']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vis10-route-discovery
          path: /tmp/vis10-route-discovery.json
      - name: Self-clean workflow
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git rm .github/workflows/vis10-route-discovery.yml
          git commit -m "chore(vis10): remove temporary route discovery workflow"
          git push origin HEAD:acpos-vis10-staging
