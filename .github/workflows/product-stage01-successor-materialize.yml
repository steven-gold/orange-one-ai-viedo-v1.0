name: Product Stage01 Successor Materialize
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/product-stage01-successor-materialize.yml'
      - '.github/scripts/stage01_successor_materialize.py'
      - '.github/scripts/stage01_operation_runtime.py'
      - '.github/scripts/stage01_ops/**'
permissions:
  contents: write
concurrency:
  group: product-stage01-prestage-materialize-v3
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact selected Current governance
        id: governance
        run: |
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          STATUS="$(awk '$1=="status:" {print $2; exit}' "$SEL")"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          test "$STATUS" = "SELECTED_EXACT_CURRENT_SNAPSHOT" || exit 31
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || exit 32
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout exact Current governance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - name: Set up governance Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Load exact Current governance
        run: |
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Verify exact-head governance receipts for pre-stage materialization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, yaml
          product=Path('.')
          gov=Path('_governance_authority')
          sel=yaml.safe_load((product/'STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml').read_text()) or {}
          if sel.get('status')!='SELECTED_EXACT_CURRENT_SNAPSHOT':
              raise SystemExit('BLOCK:CURRENT_GOVERNANCE_SELECTION_NOT_SELECTED')
          head=subprocess.check_output(['git','-C',str(gov),'rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','-C',str(gov),'rev-parse','HEAD^{tree}'],text=True).strip()
          root=gov/'.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml'
          root_hash=hashlib.sha256(root.read_bytes()).hexdigest()
          expected={
              'governance_commit_sha':head,
              'governance_tree_sha':tree,
              'root_manifest_sha256':root_hash,
          }
          for k,v in expected.items():
              if str(sel.get(k) or '')!=v:
                  raise SystemExit('BLOCK:PRESTAGE_EXACT_GOVERNANCE_BINDING_MISMATCH:'+k)
          ev=sel.get('exact_head_validation') or {}
          if ev.get('mother_neutrality_status')!='SUCCESS':
              raise SystemExit('BLOCK:MOTHER_NEUTRALITY_EXACT_HEAD_RECEIPT_NOT_SUCCESS')
          if ev.get('stage_internal_validation_status')!='SUCCESS' or ev.get('gate_01_08_result')!='PASS':
              raise SystemExit('BLOCK:STAGE_INTERNAL_EXACT_HEAD_RECEIPT_NOT_SUCCESS')
          if str(ev.get('validated_head_sha') or '')!=head:
              raise SystemExit('BLOCK:EXACT_HEAD_VALIDATION_RECEIPT_SHA_DRIFT')
          if not ev.get('mother_neutrality_run_id') or not ev.get('stage_internal_validation_run_id'):
              raise SystemExit('BLOCK:EXACT_HEAD_VALIDATION_RUN_RECEIPT_MISSING')
          print('PASS: exact-head governance receipts verified for pre-stage materialization; fresh inline validation remains required at Stage entry')
          PY
      - name: Fresh source projection and successor registration materialization
        run: python .github/scripts/stage01_successor_materialize.py --mode materialize --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
      - name: Materialize exact Current governance load receipts
        run: |
          set -euo pipefail
          for WU in WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001 WU-STAGE01-WB01-DASHBOARD-REENTRY-001; do
            python .github/scripts/product_current_governance_load.py --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority" --stage STAGE-01 --work-unit "STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
          done
          python .github/scripts/stage01_successor_materialize.py --mode refresh-manifest --product-root "$GITHUB_WORKSPACE"
      - name: Prove successor admission before persistence
        run: |
          set -euo pipefail
          export GOVERNANCE_SOURCE_ROOT="$GITHUB_WORKSPACE/_governance_authority"
          for WU in WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001 WU-STAGE01-WB01-DASHBOARD-REENTRY-001; do
            export STAGE_EXECUTION_ROOT="$GITHUB_WORKSPACE"
            export STAGE_ACTIVE_WORK_UNIT="STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
            export STAGE_CURRENT_SCOPE="STAGE_EXECUTION/STAGE-01/$WU/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"
            python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-01
          done
      - name: Persist admitted successor resume
        run: python .github/scripts/stage01_successor_materialize.py --mode mark-admitted --product-root "$GITHUB_WORKSPACE"
      - name: Commit admitted successor artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAGE_EXECUTION/STAGE-01 STAGE_EXECUTION/SHARED_AUTHORITY/V232_REALIGNMENT
          git diff --cached --quiet && exit 41
          git commit -m "stage01: materialize admitted HOME and WB01 successors"
          git push origin HEAD:0921acpos
