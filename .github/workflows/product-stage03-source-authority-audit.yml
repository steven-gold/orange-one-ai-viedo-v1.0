name: Product Stage03 Source Authority Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/product-stage03-source-authority-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-source-authority:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with: {ref: 0921acpos, fetch-depth: 1}
    - name: Extract immutable DOCX visual-authority facts
      run: |
        python - <<'PY'
        from pathlib import Path
        import zipfile, xml.etree.ElementTree as ET
        W='{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
        files={
          'HOME':Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-001/00_SOURCE_INTAKE/RAW_SOURCE/SRC-DOCX-334A4679600F092B733B/ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx'),
          'WB01':Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-001/00_SOURCE_INTAKE/RAW_SOURCE/SRC-DOCX-2B1908530B5BD312A392/ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx'),
        }
        terms=('typography','font','字型','字體','字級','line height','line-height','行高','letter spacing','letter-spacing','token','color','顏色','色彩','紫','visual authority','design system','global visual','global_web_visual','style definition','visual style')
        def txt(node):
          return ''.join((t.text or '') for t in node.iter(W+'t')).strip()
        for label,path in files.items():
          if not path.is_file(): raise SystemExit('MISSING_RAW_DOCX:'+str(path))
          with zipfile.ZipFile(path) as z:
            root=ET.fromstring(z.read('word/document.xml'))
          body=root.find(W+'body')
          records=[]
          for child in list(body):
            if child.tag==W+'p':
              s=txt(child)
              if s: records.append(('P',s))
            elif child.tag==W+'tbl':
              for tr in child.findall(W+'tr'):
                cells=[]
                for tc in tr.findall(W+'tc'):
                  s=txt(tc)
                  cells.append(s)
                row=' | '.join(cells).strip()
                if row: records.append(('T',row))
          hits=[]
          for i,(kind,s) in enumerate(records):
            low=s.casefold()
            if any(term.casefold() in low for term in terms):
              lo=max(0,i-2); hi=min(len(records),i+3)
              hits.append((i,records[lo:hi]))
          print('===SOURCE_AUTHORITY_AUDIT',label,'records',len(records),'hits',len(hits),'===')
          shown=set()
          for i,ctx in hits[:180]:
            key=tuple(ctx)
            if key in shown: continue
            shown.add(key)
            print('---MATCH_INDEX',i,'---')
            for kind,s in ctx:
              print(kind, s[:1800])
        PY
