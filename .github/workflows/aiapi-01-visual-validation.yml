name: AIAPI-01 Browser Visual Validation

on:
  push:
    branches:
      - aiapi-01-current-authority-runtime

permissions:
  contents: write

jobs:
  visual:
    if: ${{ !contains(github.event.head_commit.message, 'validation-artifacts:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aiapi-01-current-authority-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/aiapi-next.log 2>&1 &
          echo $! > /tmp/aiapi-next.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/admin/aiapi >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aiapi-next.log
          exit 1
      - name: Browser render validation
        run: |
          mkdir -p .validation/aiapi-01
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const widths=[[1280,900],[1440,1000],[1920,1080]];
            const results=[];
            for(const [width,height] of widths){
              const page=await browser.newPage({viewport:{width,height}});
              const consoleErrors=[]; const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              const response=await page.goto('http://127.0.0.1:3000/admin/aiapi',{waitUntil:'networkidle'});
              await page.waitForSelector('[data-page-uid="admin:AIAPI-01"]');
              const pageUid=await page.getAttribute('[data-page-uid="admin:AIAPI-01"]','data-page-uid');
              const buttons=await page.locator('[data-view-switch]').count();
              const metrics=await page.evaluate(()=>({
                innerWidth:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                bodyScrollWidth:document.body.scrollWidth,
                pageState:document.querySelector('[data-page-uid="admin:AIAPI-01"]')?.getAttribute('data-page-state'),
                bindingState:document.querySelector('[data-page-uid="admin:AIAPI-01"]')?.getAttribute('data-current-ui-binding-status')
              }));
              await page.screenshot({path:`.validation/aiapi-01/aiapi-${width}.png`,fullPage:true});
              if(width===1440){
                for(const view of ['AIAPI-01-VIEW-OVERVIEW','AIAPI-01-VIEW-PROVIDER-API','AIAPI-01-VIEW-ROUTING-TEST','AIAPI-01-VIEW-OPERATIONS']){
                  await page.click(`[data-view-switch="${view}"]`);
                  await page.waitForTimeout(120);
                  await page.screenshot({path:`.validation/aiapi-01/${view}.png`,fullPage:true});
                }
              }
              results.push({width,height,status:response?.status(),pageUid,buttons,consoleErrors,pageErrors,...metrics});
              if(response?.status()!==200||pageUid!=='admin:AIAPI-01'||buttons!==4||pageErrors.length) throw new Error(`AIAPI visual gate failed @${width}`);
              await page.close();
            }
            fs.writeFileSync('.validation/aiapi-01/metrics.json',JSON.stringify(results,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit validation evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .validation/aiapi-01
          git commit -m 'validation-artifacts: AIAPI-01 browser screenshots'
          git push origin HEAD:aiapi-01-current-authority-runtime
