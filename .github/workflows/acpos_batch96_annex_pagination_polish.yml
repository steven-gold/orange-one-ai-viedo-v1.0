name: ACPOS Batch 96 Annex Pagination Polish
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch96_annex_pagination_polish.yml
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Apply formatting-only annex pagination polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Pt
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          import hashlib, json, re, subprocess, zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="4a04d2c59a5535e564e1075b1f8d0afbd0ea6dfe"
          WF=Path(".github/workflows/acpos_batch96_annex_pagination_polish.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")

          TARGETS=[
            Path("ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
            Path("ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
            Path("ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
            Path("ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
            Path("ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
            Path("ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
          ]
          MARKER="[ACPOS-20260922-PLANNING-DESIGN-CLOSURE-ANNEX-V1]"
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          def semantic_text(path):
              with zipfile.ZipFile(path) as z:
                  root=ET.fromstring(z.read("word/document.xml"))
              return "\n".join((x.text or "") for x in root.iter(W+"t"))
          def hash_text(s): return hashlib.sha256(s.encode("utf-8")).hexdigest()

          manifest=[]
          for p in TARGETS:
              if not p.exists(): raise SystemExit(f"MISSING_TARGET {p}")
              before=semantic_text(p)
              d=Document(p)
              alltext="\n".join(x.text for x in d.paragraphs)+"\n"+"\n".join(" | ".join(c.text for c in r.cells) for t in d.tables for r in t.rows)
              if MARKER not in alltext: raise SystemExit(f"ANNEX_MARKER_MISSING {p}")

              found=False
              for para in d.paragraphs:
                  if MARKER in para.text:
                      found=True
                  if found:
                      pf=para.paragraph_format
                      pf.space_before=Pt(0); pf.space_after=Pt(0); pf.line_spacing=1.0
                      if para.style and para.style.name=="Heading 1":
                          for run in para.runs: run.font.size=Pt(12)
                      elif para.style and para.style.name=="Heading 2":
                          for run in para.runs: run.font.size=Pt(10.5)

              body=list(d.element.body)
              marker_idx=None
              for i,el in enumerate(body):
                  texts="".join(t.text or "" for t in el.iter(qn("w:t")))
                  if MARKER in texts:
                      marker_idx=i
                      break
              if marker_idx is None: raise SystemExit(f"BODY_MARKER_MISSING {p}")

              annex_tables=0
              annex_rows=0
              for el in body[marker_idx+1:]:
                  if el.tag != qn("w:tbl"):
                      continue
                  table=next((t for t in d.tables if t._tbl is el),None)
                  if table is None: raise SystemExit(f"TABLE_BINDING_FAIL {p}")
                  annex_tables+=1
                  for row in table.rows:
                      annex_rows+=1
                      trPr=row._tr.get_or_add_trPr()
                      if trPr.find(qn("w:cantSplit")) is None:
                          trPr.append(OxmlElement("w:cantSplit"))
                      for cell in row.cells:
                          for para in cell.paragraphs:
                              pf=para.paragraph_format
                              pf.space_before=Pt(0); pf.space_after=Pt(0); pf.line_spacing=1.0
                              for run in para.runs:
                                  run.font.size=Pt(8)

              d.save(p)
              after=semantic_text(p)
              if before != after:
                  raise SystemExit(f"SEMANTIC_TEXT_CHANGED {p}")
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad: raise SystemExit(f"ZIP_BAD {p} {bad}")
              manifest.append({
                  "file":str(p),
                  "semantic_sha256_before":hash_text(before),
                  "semantic_sha256_after":hash_text(after),
                  "annex_tables_formatted":annex_tables,
                  "annex_rows_cant_split":annex_rows
              })

          changed=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          expected=sorted([str(p) for p in TARGETS]+[str(WF)])
          if sorted(changed)!=expected:
              raise SystemExit("WRITE_SET_FAIL expected="+repr(expected)+" actual="+repr(sorted(changed)))
          Path("__batch96_manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH96_FORMATTING_ONLY_PASS="+json.dumps({"documents":len(TARGETS),"semantic_text_changes":0,"targets":[str(x) for x in TARGETS]},ensure_ascii=False,sort_keys=True))
          PY
      - name: Render polished DOCX
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fi
          mkdir -p __render96/pdf __render96/png
          for f in             "ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"; do
              libreoffice --headless --convert-to pdf --outdir __render96/pdf "$f" >/tmp/lo96.log 2>&1 || { cat /tmp/lo96.log; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pdfs=sorted(Path("__render96/pdf").glob("*.pdf"))
          if len(pdfs)!=6: raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          pages={}
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","110",str(pdf),str(Path("__render96/png")/slug)])
              pages[pdf.name]=len(list(Path("__render96/png").glob(slug+"-*.png")))
          pngs=list(Path("__render96/png").glob("*.png"))
          Path("__batch96_render_manifest.json").write_text(json.dumps({"pdfs":len(pdfs),"pngs":len(pngs),"pages":pages},ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH96_RENDER="+json.dumps({"pdfs":len(pdfs),"pngs":len(pngs),"pages":pages},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch96-annex-pagination-polish-render
          path: |
            __render96/pdf/*.pdf
            __render96/png/*.png
            __batch96_manifest.json
            __batch96_render_manifest.json
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch96-polished-docx
          path: |
            ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
            ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
            ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
            ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
            ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
            ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          retention-days: 2
      - name: Commit formatting-only polish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __render96 __batch96_manifest.json __batch96_render_manifest.json
          git config user.name "acpos-batch96-word-polish"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch96_annex_pagination_polish.yml
          git add             "ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"
          git commit -m "style(acpos): compact planning design annex pagination"
          git push origin HEAD:0921acpos
