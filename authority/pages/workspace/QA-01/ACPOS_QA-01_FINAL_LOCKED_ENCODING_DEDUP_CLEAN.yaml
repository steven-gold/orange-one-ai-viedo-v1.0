  - component_uid: QA-01-CMP-SCRIPT
    section_uid: QA-01-SEC-04
    name: QA Validation Script
  - component_uid: QA-01-CMP-CRITERIA
    section_uid: QA-01-SEC-04
    name: Approved QA Criteria / Gate Policy
  - component_uid: QA-01-CMP-EVIDENCE
    section_uid: QA-01-SEC-05
    name: Evidence / Required Checks
  - component_uid: QA-01-CMP-SCORE
    section_uid: QA-01-SEC-06
    name: QA Scorecard
  - component_uid: QA-01-CMP-GATE
    section_uid: QA-01-SEC-06
    name: QA Gate Decision
  - component_uid: QA-01-CMP-FINDING-LIST
    section_uid: QA-01-SEC-07
