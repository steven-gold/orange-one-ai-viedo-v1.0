state_error_contract:
  states:
    LOADING: Preserve geometry; skeleton; controls disabled where applicable.
    READY: Permission + scope + condition + state/server gate decide visible/enabled.
    EMPTY: Show empty state; no fake data.
    ERROR: Show actual error code + reason; do not invent unregistered recovery action.
    POLICY_BLOCKED: Authorized but blocked -> registered control disabled with reason; permission denied -> hidden.
    VERSION_CONFLICT: Block effectful write; force overwrite forbidden.
    EXTERNAL_PENDING: Show pending; fake success forbidden.
    READ_ONLY: Read controls remain; effectful controls gated/hidden.
    ARCHIVED: Read-only; writes forbidden.
  backend_gate_order:
  - identity
  - account_permission
  - scope
  - condition
  - state_guard
  - expected_version_when_write
  - idempotency_when_side_effect
  - audit
forbidden_matrix:
- Second AI API Center
- Standalone parallel AI API page/workspace/navigation
- Second Provider Registry
- Second Secret Database
- Second Router
- Provider bypass
- Frontend route override
- Plaintext API Key reveal/export/log/audit/persistence
- Unverified callback marked success
- Production secret used in sandbox
- Fake Provider
- Fake Model
- Fake pricing
- Fake capability
- Fake limits
- Fake health/test result
- Hidden inferred click action
- Unregistered API path/permission inference
acceptance:
- uid: AIAPI-01-ACC-01
  name: Single Current Page
  condition: Only admin:AIAPI-01 renders as current frontend AI API page.
- uid: AIAPI-01-ACC-02
  name: Four Practical Views
  condition: All four views exist inside the same page and do not create new navigation routes.
- uid: AIAPI-01-ACC-03
  name: Provider Profile
  condition: Profile create/update/view/list/test/retire map only to registered operations.
- uid: AIAPI-01-ACC-04
  name: Credential
  condition: Credential set/delete supported; raw secret never returned/displayed.
- uid: AIAPI-01-ACC-05
  name: Professional Description
  condition: Each selected Provider/Model resolves the fixed professional description panel from registered metadata/projections;
    missing = —.
- uid: AIAPI-01-ACC-06
  name: Capability Governance
  condition: Capability/configure/approve/enable policies remain governed.
- uid: AIAPI-01-ACC-07
  name: Route & Sandbox
  condition: Candidate/limits/preflight/quarantine/sandbox/route decision functions are present without frontend override.
- uid: AIAPI-01-ACC-08
  name: Compile Audit
  condition: Instruction/compiler/constraints/adapter/prompt-template audit functions are present.
- uid: AIAPI-01-ACC-09
  name: Job & Cost
  condition: Job/attempt/callback/artifact/cost/budget/incident functions are represented.
- uid: AIAPI-01-ACC-10
  name: No Duplicate / No Legacy UI
  condition: No parallel AI API Center and no retired standalone frontend page tokens in current encoding.
- uid: AIAPI-01-ACC-11
  name: Truthful Runtime
  condition: Registry/permission/navigation remap remains NOT_EXECUTED until actual implementation/tests exist.
construction_gate:
  static_ui_may_use_this_encoding: true
  effectful_runtime_enablement: BLOCK_UNTIL_REGISTRY_PERMISSION_NAVIGATION_REMAP_AND_TESTS
  before_runtime_enablement_required:
  - Navigation Registry migration
  - Page/Section/Control resource remap
  - Permission resource remap
  - API binding verification
  - Runtime binding verification
  - Secret handling verification
  - Sandbox validation
  - Regression validation
  - E2E validation
  ai_instruction: Read this encoding first. Do not reconstruct retired multi-page AI API UI. Do not invent missing values
    or APIs. If any required binding is absent, BLOCK and REPORT_AUTHORITY_GAP.
