exact_scope:
  purpose: >-
    Consolidate all empirically observed successful and failed Stage-02 governance execution patterns into a product-neutral, execution-profile-neutral, reusable end-to-end Mother Governance successor. Repair the reusable process so planning, authority resolution, applicability, validator selection, persistence, Current-state projection, evidence, remediation, cleanup, revalidation, resume and closure form one machine-enforceable closed loop rather than disconnected clauses or workflow-local conventions.
  empirical_inputs:
