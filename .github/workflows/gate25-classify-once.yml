name: ACPOS Gate25 One Shot NOT_EXECUTED Classification

on:
  push:
    branches: [new]
    paths:
      - ".github/workflows/gate25-classify-once.yml"

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Classify remaining formal resources
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const inventory=JSON.parse(fs.readFileSync('docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json','utf8'));
          const registry=fs.readFileSync('03_api/operation_registry.yaml','utf8');
          const inv=new Map(inventory.resources.map(r=>[r.resource_key,r]));
          const remaining=ledger.entries.filter(e=>e.disposition==='NOT_EXECUTED').map(e=>({...e,...inv.get(e.resource_key)}));
          const inc=(obj,key)=>obj[key]=(obj[key]||0)+1;
          const pageOf=(r)=>{
            const parent=String(r.parent_resource_key||'');
            const pm=parent.match(/^section:(.+?):[^:]+$/);
            if(pm) return pm[1];
            const key=String(r.resource_key||'');
            const am=key.match(/^action:(.+?):ACT-/);
            return am?am[1]:'UNRESOLVED';
          };
          const familyOf=(r)=>{
            const k=String(r.resource_key||'');
            if(r.resource_type==='CONTROL') return 'CONTROL';
            for(const [family,pattern] of [
              ['NAV_OPEN',/:ACT-NAV-OPEN$/],['REFRESH',/:ACT-REFRESH$/],['SEARCH',/:ACT-SEARCH$/],['EXPORT',/:ACT-EXPORT$/],
              ['APPROVE',/:ACT-APPROVE$/],['CONFIGURE',/:ACT-CONFIGURE$/],['SAVE',/:ACT-(?:SAVE|DRAFT-SAVE)$/],
              ['VALIDATE',/:ACT-(?:VALIDATE|DRAFT-VALIDATE)$/],['CREATE',/:ACT-CREATE$/],['DELETE',/:ACT-DELETE$/],
              ['RETRY',/:ACT-RETRY$/],['EXECUTE',/:ACT-EXECUTE$/],['SUBMIT',/:ACT-SUBMIT$/],['CANCEL',/:ACT-CANCEL$/]
            ]) if(pattern.test(k)) return family;
            return 'OTHER_ACTION';
          };
          const by_type={},by_page={},by_risk={},by_family={},registry_ref={YES:0,NO:0};
          const page_family={};
          const registryReferenced=[];
          for(const r of remaining){
            const page=pageOf(r),family=familyOf(r),risk=String(r.risk_tier||'UNSPECIFIED');
            inc(by_type,r.resource_type);inc(by_page,page);inc(by_risk,risk);inc(by_family,family);
            page_family[page]=page_family[page]||{};inc(page_family[page],family);
            const exact=registry.includes(String(r.resource_key));
            inc(registry_ref,exact?'YES':'NO');
            if(exact) registryReferenced.push(r.resource_key);
          }
          const topPages=Object.entries(by_page).sort((a,b)=>b[1]-a[1]).map(([page,count])=>({page,count,families:page_family[page]}));
          const evidence={
            document_id:'ACPOS_GATE25_NOT_EXECUTED_CLASSIFICATION',
            status:'CURRENT_MACHINE_CLASSIFICATION_NO_DISPOSITION_PROMOTION',
            as_of:'2026-09-10T16:15:00+08:00',
            denominator:1481,
            ledger_counts:ledger.counts,
            remaining_not_executed:remaining.length,
            by_resource_type:by_type,
            by_risk_tier:by_risk,
            by_action_family:by_family,
            exact_resource_key_referenced_in_current_operation_registry:registry_ref,
            registry_referenced_not_executed_resource_keys:registryReferenced.sort(),
            by_page:topPages,
            rule:'Classification is analysis evidence only. It does not promote any resource to PASS or BLOCKED. Each disposition change still requires exact per-resource evidence or a defensible shared blocker contract.'
          };
          fs.writeFileSync('docs/construction/evidence/GATE25_NOT_EXECUTED_CLASSIFICATION_2026-09-10.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
      - name: Commit classification and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gate25-classify-once.yml
          git add docs/construction/evidence/GATE25_NOT_EXECUTED_CLASSIFICATION_2026-09-10.json
          git commit -m "docs(gate25): classify remaining NOT_EXECUTED resources"
          git push origin HEAD:new
