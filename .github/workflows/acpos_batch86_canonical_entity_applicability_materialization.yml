name: ACPOS Batch 86 Canonical Entity Applicability Materialization
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch86_canonical_entity_applicability_materialization.yml
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Revalidate Batch85 preflight and materialize canonical matrices
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="3bd78458b22212557486118b40572c9c4daaf693"
          ACTUAL_PARENT="$(git rev-parse HEAD^)"
          test "$ACTUAL_PARENT" = "$EXPECTED_PARENT" || { echo "EXACT_HEAD_PARENT_FAIL $ACTUAL_PARENT"; exit 1; }

          BASE85="e4910e871b9fe1ded87262e95d8f3b22e60884a4"
          CURRENT_TREE="$(git rev-parse "$EXPECTED_PARENT^{tree}")"
          BASE85_TREE="$(git rev-parse "$BASE85^{tree}")"
          test "$CURRENT_TREE" = "$BASE85_TREE" || { echo "PREFLIGHT_TREE_DRIFT current=$CURRENT_TREE base85=$BASE85_TREE"; exit 1; }

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/steven-gold/orange-one-ai-viedo-v1.0/actions/artifacts/10683316594/zip"             -o /tmp/batch85.zip
          rm -rf /tmp/b85 && mkdir -p /tmp/b85
          unzip -q /tmp/batch85.zip -d /tmp/b85

          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt
          from docx.enum.text import WD_BREAK
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          import collections, json, re, subprocess, zipfile

          EXPECTED_PARENT="3bd78458b22212557486118b40572c9c4daaf693"
          CURRENT_TREE=subprocess.check_output(["git","rev-parse",f"{EXPECTED_PARENT}^{{tree}}"],text=True).strip()
          PREF=Path("/tmp/b85/__batch85_bounded_applicability_preflight.json")
          data=json.loads(PREF.read_text(encoding="utf-8"))
          summary=data["summary"]
          candidate=data["completion_candidate"]
          score=data["function_admission_scorecard"]
          ledger=data["auto_completion_scope_ledger"]

          if summary["entity_operation_applicability_denominator"]!=2300: raise SystemExit("DENOMINATOR_DRIFT")
          if summary["candidate_required"]!=237 or summary["candidate_not_applicable"]!=2063: raise SystemExit("CANDIDATE_COUNT_DRIFT")
          if score["authorized_functional_additions"]!=0: raise SystemExit("FUNCTIONAL_EXPANSION_FORBIDDEN")
          if any(ledger[k]!=0 for k in ["new_business_entities","new_operations","new_runtime_or_api"]): raise SystemExit("SCOPE_EXPANSION_FORBIDDEN")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          by_page=collections.defaultdict(list)
          for row in candidate: by_page[row["page"]].append(row)

          def set_repeat_table_header(row):
              trPr=row._tr.get_or_add_trPr()
              tblHeader=OxmlElement('w:tblHeader')
              tblHeader.set(qn('w:val'),"true")
              trPr.append(tblHeader)

          def set_cell_text(cell,text,bold=False,size=7):
              cell.text=""
              p=cell.paragraphs[0]
              r=p.add_run(str(text))
              r.bold=bold
              r.font.size=Pt(size)

          def evidence_text(row):
              basis=row["candidate_basis"]
              ev=row.get("evidence") or []
              refs=[]
              for e in ev:
                  refs.append(f"T{e.get('table')}R{e.get('row')}[{e.get('value','')}]")
              refs="; ".join(refs[:6])
              if basis=="CURRENT_EXPLICIT":
                  return f"Current explicit applicability preserved. {refs}".strip()
              if basis=="CURRENT_OPERATION_EVIDENCE_NORMALIZATION":
                  return f"Current entity-bound operation evidence normalized to REQUIRED. {refs}".strip()
              if basis=="CURRENT_MATRIX_DASH_NORMALIZATION":
                  return f"Current lifecycle matrix dash normalized to NOT_APPLICABLE; no operation is authorized in this current matrix cell. {refs}".strip()
              return f"Current exact tree {CURRENT_TREE}: zero entity-bound operation evidence for this entity/operation. Mother §71 forbids speculative CRUD/sibling-feature expansion; current revision authorizes no new behavior."

          modified=[]
          matrix_rows_written=0
          for page,fn in PAGE_DOCS.items():
              rows=sorted(by_page.get(page,[]),key=lambda x:(x["entity"],x["operation"]))
              unresolved=[x for x in rows if x["candidate_basis"]!="CURRENT_EXPLICIT"]
              if not unresolved:
                  continue
              doc=Document(fn)
              p=doc.add_paragraph()
              p.add_run().add_break(WD_BREAK.PAGE)
              h=doc.add_paragraph()
              h.style="Heading 2" if "Heading 2" in [s.name for s in doc.styles] else doc.styles["Normal"]
              h.add_run("Canonical Business Entity Operation Applicability Matrix / 業務實體操作適用性矩陣")
              intro=doc.add_paragraph()
              intro.add_run(
                "Authority: Current Word design + Mother §71 bounded completion. "
                "本矩陣只正規化既有行為與目前未授權行為；不得據此新增 Business Entity、Operation、Runtime 或 API。 "
                f"Current tree: {CURRENT_TREE}."
              )
              table=doc.add_table(rows=1,cols=4)
              try: table.style="Table Grid"
              except Exception: pass
              hdr=table.rows[0]
              set_repeat_table_header(hdr)
              for c,t in zip(hdr.cells,["Entity","Operation","Applicability","Authority Evidence"]):
                  set_cell_text(c,t,bold=True,size=7)
              for x in rows:
                  cells=table.add_row().cells
                  vals=[x["entity"],x["operation"],x["candidate_decision"],evidence_text(x)]
                  for c,v in zip(cells,vals): set_cell_text(c,v,size=7)
                  matrix_rows_written+=1
              doc.save(fn)
              modified.append(fn)

          # SYS-01: normalize the old relationship label and append a complete long-form
          # hierarchy/reference relation matrix. This adds no new runtime behavior.
          sysfn=PAGE_DOCS["SYS-01"]
          doc=Document(sysfn)
          for t in doc.tables:
              headers=[re.sub(r"\s+"," ",c.text.strip()) for c in t.rows[0].cells] if t.rows else []
              if len(headers)>=3 and headers[0]=="Parent" and headers[1]=="Child" and headers[2]=="Cardinality":
                  for r in t.rows[1:]:
                      if len(r.cells)>=2 and re.sub(r"\s+"," ",r.cells[1].text.strip())=="Conversation / Thread":
                          r.cells[1].text="Shared Conversation Core Reference"

          hp=doc.add_paragraph()
          hp.add_run().add_break(WD_BREAK.PAGE)
          hh=doc.add_paragraph()
          hh.style="Heading 2" if "Heading 2" in [s.name for s in doc.styles] else doc.styles["Normal"]
          hh.add_run("Canonical Entity Hierarchy / Reference Relation Matrix / 實體階層與參照關係矩陣")
          doc.add_paragraph(
            "Authority: SYS-01 current relationship summary + Current shared-owner boundaries + Mother §71. "
            "Unsupported cascade/move behavior remains NOT_APPLICABLE or NO_CASCADE; no new effectful operation is introduced."
          )

          edges=[
            {
              "parent":"System Change","child":"Change Candidate","class":"HIERARCHY","cardinality":"1:N",
              "creation_entry":"Create/attach Change Candidate inside the selected System Change context.",
              "payload_or_reference_binding":"system_change_uid + candidate_uid/version_ref",
              "ordering_semantics":"created_at/version sequence; manual REORDER is NOT_APPLICABLE.",
              "permission":"SYS governed-change permission + Change Candidate owner permission; fail closed.",
              "state_dependency":"Parent System Change must exist/current; candidate lifecycle is bound to that change context.",
              "version_dependency":"Exact candidate/version reference is bound to the current System Change revision.",
              "move_or_reparent":"NOT_APPLICABLE — no current move/reparent operation is authorized.",
              "archive_or_delete_propagation":"NO_CASCADE — preserve candidate/audit lineage; child owner governs retirement.",
              "upstream_change_impact":"Material System Change mutation marks affected candidate evidence REVERIFY_REQUIRED.",
              "downstream_revalidation":"Candidate validation/decision descendants require fresh revalidation when impacted."
            },
            {
              "parent":"System Change","child":"Shared Conversation Core Reference","class":"SHARED_OWNER_REFERENCE","cardinality":"1:N",
              "creation_entry":"Create/select thread through Shared Conversation Core; SYS stores reference only.",
              "payload_or_reference_binding":"system_change_uid + conversation_id + thread_id",
              "ordering_semantics":"Shared Conversation Core owns thread/message ordering; SYS-local reorder is NOT_APPLICABLE.",
              "permission":"SYS context access + Shared Conversation Core permission; fail closed.",
              "state_dependency":"Reference is valid only for the bound System Change context; thread lifecycle remains shared-owner controlled.",
              "version_dependency":"Stable conversation/thread IDs plus exact context/decision-link revision where applicable.",
              "move_or_reparent":"NOT_APPLICABLE — SYS cannot reparent shared Conversation Core entities.",
              "archive_or_delete_propagation":"NO_CASCADE — preserve shared conversation history; shared owner controls retention.",
              "upstream_change_impact":"System Change context mutation requires linked context/decision-reference impact review.",
              "downstream_revalidation":"Affected shared context/decision links become REVERIFY_REQUIRED."
            },
            {
              "parent":"System Change","child":"Decision Record","class":"HIERARCHY","cardinality":"1:N",
              "creation_entry":"Record governed decision from the current System Change context.",
              "payload_or_reference_binding":"system_change_uid + decision_record_uid + reason/evidence_ref",
              "ordering_semantics":"Append-only decision timestamp/order; manual reorder is NOT_APPLICABLE.",
              "permission":"Decision-governance permission within SYS change context; fail closed.",
              "state_dependency":"Decision requires a current System Change and applicable candidate/change state.",
              "version_dependency":"Decision/evidence lineage is append-only and bound to the System Change revision.",
              "move_or_reparent":"NOT_APPLICABLE — decision records are not reparented.",
              "archive_or_delete_propagation":"NO_CASCADE — preserve decision/audit evidence.",
              "upstream_change_impact":"Material parent/candidate mutation requires decision-context impact review.",
              "downstream_revalidation":"Affected decision consumers and change-state projections require revalidation."
            },
            {
              "parent":"System Change","child":"Validation Run","class":"HIERARCHY","cardinality":"1:N",
              "creation_entry":"Start Validation Run against the exact current System Change/candidate version.",
              "payload_or_reference_binding":"system_change_uid + validation_run_uid + candidate/version_ref",
              "ordering_semantics":"created_at/run-attempt sequence; manual reorder is NOT_APPLICABLE.",
              "permission":"Execution/Test owner permission + SYS change access; fail closed.",
              "state_dependency":"Validation Run requires an existing current change/candidate baseline.",
              "version_dependency":"Run is bound to exact candidate/change revision; changed input invalidates prior acceptance credit.",
              "move_or_reparent":"NOT_APPLICABLE — Validation Run identity is immutable to its tested context.",
              "archive_or_delete_propagation":"NO_CASCADE — preserve validation evidence/history.",
              "upstream_change_impact":"Parent/candidate version change marks affected run evidence REVERIFY_REQUIRED.",
              "downstream_revalidation":"Fresh validation is required for impacted successors before closure."
            },
            {
              "parent":"Maintenance Alert","child":"System Change","class":"TRIGGER_REFERENCE","cardinality":"0..1",
              "creation_entry":"Open/create governed System Change from an eligible Maintenance Alert context.",
              "payload_or_reference_binding":"maintenance_alert_ref + system_change_uid",
              "ordering_semantics":"NOT_APPLICABLE — trigger/reference relation.",
              "permission":"Maintenance/change-governance permission; fail closed.",
              "state_dependency":"Alert must be current/eligible and change intake must be permitted.",
              "version_dependency":"Current alert snapshot/reference is preserved; System Change has its own revision lifecycle.",
              "move_or_reparent":"NOT_APPLICABLE — trigger/reference relation.",
              "archive_or_delete_propagation":"NO_CASCADE — closing an alert must not delete System Change history.",
              "upstream_change_impact":"Material alert change requires impact review of the linked System Change intake.",
              "downstream_revalidation":"Affected System Change context becomes REVERIFY_REQUIRED when its trigger evidence changes."
            },
            {
              "parent":"Evidence / Reference","child":"All entities","class":"REFERENCE_ONLY","cardinality":"N:M read link",
              "creation_entry":"Attach an existing governed evidence/reference to the target entity.",
              "payload_or_reference_binding":"evidence_ref/reference_uid + target_entity_uid",
              "ordering_semantics":"NOT_APPLICABLE — N:M evidence/reference link.",
              "permission":"Evidence read/bind permission + target-entity permission; fail closed.",
              "state_dependency":"Target entity and referenced evidence must both resolve to Current-valid identities.",
              "version_dependency":"Exact evidence/version/checksum reference is preserved.",
              "move_or_reparent":"NOT_APPLICABLE — reference link is rebound only through an explicit governed binding change.",
              "archive_or_delete_propagation":"NO_CASCADE — preserve immutable provenance and audit references.",
              "upstream_change_impact":"Evidence supersession/change marks exact consumers REVERIFY_REQUIRED.",
              "downstream_revalidation":"All impacted reference consumers require fresh evidence resolution/revalidation."
            },
          ]
          fields=[
            ("relation_class","Relation Class"),
            ("cardinality","Cardinality"),
            ("creation_entry","Creation Entry"),
            ("payload_or_reference_binding","Payload / Reference Binding"),
            ("ordering_semantics","Ordering Semantics"),
            ("permission","Permission"),
            ("state_dependency","State Dependency"),
            ("version_dependency","Version Dependency"),
            ("move_or_reparent","Move / Reparent"),
            ("archive_or_delete_propagation","Archive / Delete Propagation"),
            ("upstream_change_impact","Upstream Change Impact"),
            ("downstream_revalidation","Downstream Revalidation"),
          ]
          ht=doc.add_table(rows=1,cols=5)
          try: ht.style="Table Grid"
          except Exception: pass
          set_repeat_table_header(ht.rows[0])
          for c,t in zip(ht.rows[0].cells,["Parent","Child","Field","Value","Authority Evidence"]):
              set_cell_text(c,t,bold=True,size=7)
          for e in edges:
              e2=dict(e); e2["relation_class"]=e["class"]
              for key,label in fields:
                  cells=ht.add_row().cells
                  vals=[
                    e["parent"],e["child"],label,e2[key],
                    f"SYS-01 Current relation + owner boundary; Mother §71; current tree {CURRENT_TREE}"
                  ]
                  for c,v in zip(cells,vals): set_cell_text(c,v,size=7)
          doc.save(sysfn)
          if sysfn not in modified: modified.append(sysfn)

          # Structural and ZIP validation.
          if len(modified)!=17:
              raise SystemExit(f"MODIFIED_PAGE_COUNT_DRIFT {len(modified)} {sorted(modified)}")
          for fn in modified:
              with zipfile.ZipFile(fn) as z:
                  bad=z.testzip()
                  if bad: raise SystemExit(f"ZIP_BAD {fn} {bad}")

          # Re-open and verify canonical matrix row counts.
          expected_by_page=collections.Counter(x["page"] for x in candidate)
          materialized=collections.Counter()
          for page,fn in PAGE_DOCS.items():
              if fn not in modified: continue
              d=Document(fn)
              for t in d.tables:
                  if not t.rows: continue
                  headers=[re.sub(r"\s+"," ",c.text.strip()) for c in t.rows[0].cells]
                  if headers==["Entity","Operation","Applicability","Authority Evidence"]:
                      for r in t.rows[1:]:
                          if len(r.cells)>=4:
                              entity=re.sub(r"\s+"," ",r.cells[0].text.strip())
                              op=re.sub(r"\s+"," ",r.cells[1].text.strip())
                              app=re.sub(r"\s+"," ",r.cells[2].text.strip())
                              ev=re.sub(r"\s+"," ",r.cells[3].text.strip())
                              if not entity or not op or app not in {"REQUIRED","OPTIONAL","NOT_APPLICABLE"} or not ev:
                                  raise SystemExit(f"CANONICAL_MATRIX_ROW_INVALID {page} {entity} {op} {app}")
                              materialized[page]+=1
              if materialized[page]!=expected_by_page[page]:
                  raise SystemExit(f"MATRIX_ROW_COUNT_FAIL {page} expected={expected_by_page[page]} actual={materialized[page]}")

          print("BATCH86_MATRIX_ROWS_WRITTEN",matrix_rows_written)
          print("BATCH86_MODIFIED_DOCS",len(modified))
          print("BATCH86_MATERIALIZATION_PASS")
          Path("__batch86_manifest.json").write_text(json.dumps({
            "marker":"ACPOS-20260922-BATCH-86-CANONICAL-ENTITY-APPLICABILITY-MATERIALIZATION-V1",
            "parent":EXPECTED_PARENT,
            "tree_before":CURRENT_TREE,
            "modified_docs":sorted(modified),
            "matrix_rows_written":matrix_rows_written,
            "candidate_required":summary["candidate_required"],
            "candidate_not_applicable":summary["candidate_not_applicable"],
            "new_functions":0,
            "hierarchy_edges_completed":6,
          },ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Render all modified Word documents
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fi
          mkdir -p __render86/pdf __render86/png
          python - <<'PY' > /tmp/b86_files.txt
          import json
          x=json.load(open("__batch86_manifest.json"))
          for f in x["modified_docs"]: print(f)
          PY
          while IFS= read -r f; do
            libreoffice --headless --convert-to pdf --outdir __render86/pdf "$f" >/tmp/lo86.log 2>&1 || { cat /tmp/lo86.log; exit 1; }
          done < /tmp/b86_files.txt
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          out=Path("__render86/png")
          pdfs=sorted(Path("__render86/pdf").glob("*.pdf"))
          if len(pdfs)!=17: raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          total=0
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","96",str(pdf),str(out/slug)])
          pngs=list(out.glob("*.png"))
          if not pngs: raise SystemExit("NO_RENDER_PNG")
          print("BATCH86_RENDER_PDF_COUNT",len(pdfs))
          print("BATCH86_RENDER_PNG_COUNT",len(pngs))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch86-materialization-evidence
          path: |
            __batch86_manifest.json
          retention-days: 2

      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch86-word-render
          path: |
            __render86/pdf/*.pdf
            __render86/png/*.png
          retention-days: 2

      - name: Commit materialized Word documents and close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __render86 __batch86_manifest.json
          git config user.name "acpos-batch86-materializer"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch86_canonical_entity_applicability_materialization.yml
          git add -- '*.docx'
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          doc_count=0
          for f in "${staged[@]}"; do
            if [[ "$f" == *.docx ]]; then doc_count=$((doc_count+1)); fi
          done
          if [ "$doc_count" -ne 17 ]; then
            printf '%s\n' "${staged[@]}"
            echo "STAGED_DOC_COUNT_FAIL $doc_count"
            exit 1
          fi
          git commit -m "fix(acpos): materialize canonical entity applicability matrices"
          git push origin HEAD:0921acpos
