    title: Full-line and targeted gates hard-code Stage-02 NOT_EXECUTED and would reject a legal Stage-02 successor test state
    evidence: "Before the new Stage-02 test, both governance-full-line-system-gate.yml and targeted-stage01-stage02.yml invoke validate_stage02_zero_residual.py unconditionally; that validator intentionally accepts only the clean-reset NOT_EXECUTED predecessor state."
