schema_version: 24
role: STABLE_GOVERNANCE_ENTRYPOINT_COMPATIBILITY_SHIM
repository_branch: rebuild-v2.1.1

registry_ref: governance/specifications/REGISTRY.yaml
resolver_ref: governance/ci/governance_resolver.py
active_test_state_ref: governance/test/ACTIVE_STATE.yaml

rules:
  this_file_may_define_governance_version: false
  direct_version_named_governance_path: FORBIDDEN
  all_active_consumers_must_resolve_via_registry: true
  version_label_change_may_break_resolution: false
  latest_may_be_selected_by_filename_sort: false
  unverified_candidate_may_be_selected_automatically: false

preservation:
  main_branch: NO_MUTATION
  new_branch: NO_MUTATION
  all_other_pages: NO_MUTATION

status: USE_REGISTRY_FOR_GOVERNANCE_AND_TEST_STATE_FOR_EXECUTION
