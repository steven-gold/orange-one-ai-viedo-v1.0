    text: 1. Product Scope / 產品責任與硬邊界
  - index: 6
    style: List Bullet
    text: KB-01 是「知識與經驗治理」頁，不是一般檔案櫃、聊天歷史、搜尋入口或第二套 INFO 頁。
  - index: 7
    style: List Bullet
    text: Source → Acquisition → Normalize → Evidence/Citation → Context Candidate 與 Execution → Experience → Replay → Learning → Knowledge Draft → Human Review →
      Approved Version 形成兩條可追溯主鏈。
  - index: 8
    style: List Bullet
    text: Approved Knowledge 可作為後續 AI / Strategy / Production 的 Context Input，但仍受 Scope、Permission、Current Truth 與版本條件限制。
  - index: 9
    style: List Bullet
    text: Conversation 訊息、AI 回覆、未驗證搜索結果、未完成 Outcome 不可直接標成 Approved Knowledge。
