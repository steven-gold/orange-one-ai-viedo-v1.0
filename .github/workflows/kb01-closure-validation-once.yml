name: KB-01 closure validation
on:
  push:
    branches: [acpos-kb01-closure-20260903]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Product audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: KB authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re
          a=Path('authority/pages/admin/KB-01/ACPOS_KB-01_FINAL_LOCKED_ENCODING.yaml').read_text()
          v=Path('src/components/pages/KnowledgeAdminVisual.tsx').read_text()
          p=Path('src/domain/knowledge/knowledgeRuntimePort.ts').read_text()
          c=Path('src/domain/knowledge/knowledgeRuntimeContract.ts').read_text()
          s=Path('src/server/testing/controlledKnowledgeTestRuntime.ts').read_text()
          registry_counts={k:int(n) for k,n in re.findall(r'(?m)^([a-z_]+_registry):\s*\n\s+count:\s*(\d+)',a)}
          print('KB_REGISTRY_COUNTS',registry_counts)
          expected={'section_registry':16,'component_registry':22,'field_registry':127,'control_registry':27,'action_registry':21,'gate_registry':17,'error_registry':14}
          for key,count in expected.items(): assert registry_counts.get(key)==count,(key,registry_counts.get(key),count)
          visual_controls=set(re.findall(r'KB-01-CTL-[A-Z0-9-]+',v))
          runtime_actions=set(re.findall(r'KB-01-ACT-[A-Z0-9-]+',p))
          visual_gates=set(re.findall(r'KB-01-GATE-[A-Z0-9-]+',v))
          runtime_errors=set(re.findall(r'KB-01-ERR-[0-9]{3}',c))
          print('KB_SOURCE_COUNTS',len(visual_controls),len(runtime_actions),len(visual_gates),len(runtime_errors))
          assert len(visual_controls)==27
          assert len(runtime_actions)==21
          assert len(visual_gates)==17
          assert len(runtime_errors)==14
          for uid in ['KB-01-VIEW-OVERVIEW','KB-01-VIEW-SOURCE','KB-01-VIEW-SEARCH','KB-01-VIEW-EXPERIENCE','KB-01-VIEW-REVIEW']:
            assert uid in a and uid in v
          assert 'const EFFECTFUL_RUNTIME_READY = false' in v
          assert 'data-runtime-binding="NOT_EXECUTED"' in v
          assert '<dd>NOT_EXECUTED</dd>' in v
          assert 'KnowledgeProjectionTestMetadata' in p
          assert 'KB01_TEST_PROJECTION_FORBIDDEN_IN_PRODUCTION' in p
          assert 'TEST_ONLY' in s and 'production_eligible: false' in s
          assert 'NO_CANON_BLUEPRINT_WRITE' in a and 'CONVERSATION_NOT_APPROVED_KNOWLEDGE' in a
          assert 'real_data_only: true' in a
          print('KB_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ''
        run: npm run build
      - name: Production KB must fail closed
        run: |
          set -euo pipefail
          PORT=3281 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/kb-prod.log 2>&1 & pid=$!; trap 'cat /tmp/kb-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3281/admin/knowledge >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/kb-prod.json -w '%{http_code}' 'http://127.0.0.1:3281/v1/ui-projections/admin%3AKB-01'); cat /tmp/kb-prod.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/kb-prod.json
          ! grep -q 'TEST_ONLY' /tmp/kb-prod.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled KB projection truth
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3282 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/kb-api.log 2>&1 & pid=$!; trap 'cat /tmp/kb-api.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3282/admin/knowledge >/dev/null && break || sleep 1; done
          curl -fsS 'http://127.0.0.1:3282/v1/ui-projections/admin%3AKB-01' >/tmp/kb.json
          python <<'PY'
          import json,re
          d=json.load(open('/tmp/kb.json'));m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY' and m['synthetic'] is True and m['production_eligible'] is False
          assert d['page_state']=='READY'
          assert len(d['control_enabled'])==27
          text=json.dumps(d,ensure_ascii=False)
          assert 'TEST-KB-' in text
          assert not re.search(r'\bsk-[A-Za-z0-9_-]{8,}',text)
          assert 'raw_secret' not in text and 'credential_plaintext' not in text
          print('KB_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled KB browser flow
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3283 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/kb-browser.log 2>&1 & pid=$!; trap 'cat /tmp/kb-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3283/admin/knowledge >/dev/null && break || sleep 1; done
          node <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),errors=[];
          for(const width of [1280,1440,1920]){const p=await b.newPage({viewport:{width,height:1700}});p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto('http://127.0.0.1:3283/admin/knowledge',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:KB-01"]')?.getAttribute('data-page-state')==='READY');const root=p.locator('[data-page-uid="admin:KB-01"]');if(await root.getAttribute('data-section-registry-count')!=='16'||await root.getAttribute('data-component-registry-count')!=='22'||await root.getAttribute('data-field-registry-count')!=='127'||await root.getAttribute('data-control-registry-count')!=='27'||await root.getAttribute('data-action-registry-count')!=='21')throw new Error('registry count');if(await root.getAttribute('data-effectful-runtime-ready')!=='false')throw new Error('runtime truth');const o=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(o>0)throw new Error(`overflow ${width}:${o}`);await p.close()}
          const p=await b.newPage({viewport:{width:1440,height:1800}});await p.goto('http://127.0.0.1:3283/admin/knowledge',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:KB-01"]')?.getAttribute('data-page-state')==='READY');
          const views=['KB-01-VIEW-OVERVIEW','KB-01-VIEW-SOURCE','KB-01-VIEW-SEARCH','KB-01-VIEW-EXPERIENCE','KB-01-VIEW-REVIEW'];
          for(const uid of views){await p.locator(`[data-view-uid="${uid}"]`).click();if(await p.locator('[data-current-view]').getAttribute('data-current-view')!==uid)throw new Error(`view ${uid}`);if(!p.url().endsWith('/admin/knowledge'))throw new Error('parallel route');const buttons=p.locator('[data-action-id]');for(let i=0;i<await buttons.count();i++){if(!(await buttons.nth(i).isDisabled()))throw new Error(`effectful enabled ${uid}`);if(await buttons.nth(i).getAttribute('data-runtime-binding')!=='NOT_EXECUTED')throw new Error(`runtime binding ${uid}`)}}
          const body=(await p.locator('body').textContent())||'';
          if(body.includes('"use client"')||body.includes('const CONTROLS')||body.includes('function KnowledgeAdminVisual'))throw new Error('source code rendered in UI');
          if(!body.includes('NOT_EXECUTED'))throw new Error('runtime truth not visible');
          if(errors.length)throw new Error(errors.join('\n'));console.log('KB_BROWSER_INTERACTION_PASS');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/knowledge src/components/pages/KnowledgeAdminVisual.tsx src/server/testing/controlledKnowledgeTestRuntime.ts
          ! grep -nE '<script|</script>' src/components/pages/KnowledgeAdminVisual.tsx
          git diff --exit-code
