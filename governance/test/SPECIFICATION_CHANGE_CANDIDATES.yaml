- finding_uid: FIND-20260915-012
  class: TEST_HARNESS_OR_VALIDATOR_BUG
  title: Stage remediation closure protocol validator over-captured later YAML lists when checking ordered_steps
  evidence: GitHub targeted run 34880186352 job 104097264544 on SHA dabe81cead54d1fbc4209a39a98845196dab5849 failed MANDATORY_STAGE_CYCLE_ORDER_DRIFT
    because the regex parsed the correct 12 mandatory ordered steps plus later remediation/evidence lists as if they were ordered_steps.
  disposition: RESOLVED_VALIDATOR_PARSER_ONLY
  specification_change_required: false
  formal_specification_mutated_for_fix: false
  current_specification_may_be_modified_from_this_finding_alone: false
  resolution: Replaced the over-broad regex with indentation-bounded ordered_steps parsing without changing the normative 12-step denominator
    or order. Targeted run 34880434917 passed every step and full-line run 34880434934 passed the protocol validator plus 75/75 source identity,
    13/13 registry stress, 11/11 lifecycle, 20/20 PRE_FORMAL, 17/17 mandatory exact denominators, no skip/timeout, and zero source residual on
    SHA df6e2c9b6b4501d2e5e2f03d66bb4661909111be.
- finding_uid: FIND-20260915-013
  class: TEST_HARNESS_OR_VALIDATOR_BUG
  title: Stage remediation closure protocol validator required a frozen Stage-02 UID before Stage-02 entry
  evidence: After stale cross-UID Stage-02 active evidence was cleared on SHA d5223b0f7cb74f24b3b9bca7b1984deecf977be1, targeted run 34887229186
    job 104120765693 failed because validate_stage_test_remediation_closure_protocol.py required 'frozen_specification_uid' even though ACTIVE_STATE
    correctly represented STAGE-01-CLOSED with Stage-02 result NOT_EXECUTED.
  disposition: RESOLVED_VALIDATOR_SCOPE_ONLY
  specification_change_required: false
  formal_specification_mutated_for_fix: false
  current_specification_may_be_modified_from_this_finding_alone: false
  resolution: 'Validator now treats STAGE-01-CLOSED / Stage-02 NOT_EXECUTED as a pre-entry state: a Stage-02 frozen UID is forbidden before entry
    and the pending freeze marker must be null. Once a stage is entered, its frozen UID must equal the active Registry UID. Targeted run 34887538993
    completed SUCCESS and Full-Line run 34887539030 completed SUCCESS on SHA 96a57a2886b5492f9a5a1236a51cd9aad602de40; the Full-Line log proved
    Stage-02 tracked artifact/evidence residual count=0, exact Stage-01 ledger restoration, 13/13 Registry stress, 11/11 lifecycle, 20/20 PRE_FORMAL,
    17/17 mandatory suites with exact denominators, no skip/timeout, and source runtime residual=0.'
