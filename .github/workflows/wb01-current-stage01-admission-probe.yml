name: WB01 Current Stage01 Admission Probe

on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/wb01-current-stage01-admission-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product execution workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0921acpos
          path: product
          fetch-depth: 0
      - name: Checkout current governance workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rebuild-v2.1.1
          path: governance
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install governance verifier dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/governance/ci/requirements-governance.lock
      - name: Run current Stage-01 admission probe
        shell: bash
        run: |
          set +e
          mkdir -p product/STAGE_EXECUTION/REENTRY_DIAGNOSTICS
          export STAGE_EXECUTION_ROOT="$GITHUB_WORKSPACE/product"
          export STAGE_ACTIVE_WORK_UNIT="STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-001/WORK_UNIT.yaml"
          export STAGE_CURRENT_SCOPE="STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-001/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"
          output="$(cd governance && python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-01 2>&1)"
          rc=$?
          {
            echo "artifact_type: CURRENT_STAGE_ADMISSION_PROBE_RESULT"
            echo "work_unit_uid: WU-STAGE01-WB01-DASHBOARD-001"
            echo "stage_uid: STAGE-01"
            echo "governance_branch: rebuild-v2.1.1"
            echo "product_branch: 0921acpos"
            echo "exit_code: $rc"
            if [ "$rc" -eq 0 ]; then echo "result: PASS"; else echo "result: BLOCKED"; fi
            echo "output: |-"
            printf '%s\n' "$output" | sed 's/^/  /'
          } > product/STAGE_EXECUTION/REENTRY_DIAGNOSTICS/WB01_STAGE01_CURRENT_ADMISSION.yaml
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAGE_EXECUTION/REENTRY_DIAGNOSTICS/WB01_STAGE01_CURRENT_ADMISSION.yaml
          git commit -m "test(stage): persist WB01 current Stage01 admission probe"
          git push origin HEAD:0921acpos
