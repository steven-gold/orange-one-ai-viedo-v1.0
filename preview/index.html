<style>
:root{color-scheme:dark;--bg:#050816;--deep:#070b1d;--surface:#0c1026;--surface2:#111936;--input:#0a0f24;--popup:#0b1027;--purple:#8b5cff;--purple2:#6e35ff;--ph:#b38cff;--active:rgba(139,92,255,.28);--hover:rgba(139,92,255,.18);--border:rgba(142,112,255,.28);--sub:rgba(142,112,255,.18);--ba:rgba(179,140,255,.46);--text:#f3f5ff;--text2:#aeb7d9;--muted:#7f88a8;--ok:#50d890;--warn:#f3b84b;--err:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}body{overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.48;cursor:not-allowed}.shell{width:100vw;height:100vh;min-width:1024px}.header{position:fixed;z-index:100;inset:0 0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 30px;background:rgba(5,5,20,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.brand{width:104px;height:48px;display:flex;align-items:center;overflow:hidden}.brand img{width:100%;max-height:48px;object-fit:contain;filter:brightness(0) invert(1)}.head-actions{display:flex;align-items:center;gap:8px}.head-btn,.lang{height:36px;border:1px solid var(--sub);border-radius:10px;background:rgba(17,25,54,.72);color:var(--text2);padding:0 11px}.head-btn{min-width:52px}.lang-wrap{position:relative}.lang{width:72px;cursor:pointer}.lang-menu{display:none;position:absolute;right:0;top:44px;width:190px;padding:6px;border:1px solid var(--border);border-radius:12px;background:rgba(11,16,39,.98);box-shadow:0 18px 42px rgba(0,0,0,.34)}.lang-menu.open{display:block}.lang-menu button{width:100%;height:40px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;padding:0 10px}.lang-menu button:hover{background:var(--hover)}.account{min-width:132px}.sidebar{position:fixed;z-index:90;left:0;top:58px;bottom:0;width:64px;padding:16px 10px;background:transparent;overflow:visible;transition:width .12s}.sidebar:hover,.sidebar:focus-within{width:221px;padding-left:15px;padding-right:15px}.side-bg{position:absolute;z-index:-1;inset:0 auto 0 0;width:221px;opacity:0;background:rgba(5,7,24,.94);border-right:1px solid var(--border);box-shadow:12px 0 30px rgba(0,0,0,.25);transition:opacity .12s}.sidebar:hover .side-bg,.sidebar:focus-within .side-bg{opacity:1}.nav{display:flex;flex-direction:column;gap:8px;width:44px}.sidebar:hover .nav,.sidebar:focus-within .nav{width:191px}.nav a,.nav button{height:44px;width:44px;display:flex;align-items:center;gap:12px;padding:0 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text2);text-decoration:none;overflow:hidden;white-space:nowrap}.sidebar:hover .nav a,.sidebar:hover .nav button,.sidebar:focus-within .nav a,.sidebar:focus-within .nav button{width:191px}.nav a:hover,.nav button:hover{background:var(--hover);color:var(--text)}.nav .active{background:var(--active);border-color:var(--ba);color:var(--text)}.ico{width:20px;flex:0 0 20px;text-align:center}.nav-label{opacity:0;transform:translateX(-4px);transition:.1s}.sidebar:hover .nav-label,.sidebar:focus-within .nav-label{opacity:1;transform:none}.workspace{position:fixed;left:78px;top:68px;right:16px;bottom:16px;overflow:auto}.page{min-width:1280px;padding:16px;display:grid;gap:16px}.panel,.context{min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.015)}.panel{padding:16px}.title{margin:0 0 12px;font-size:14px;font-weight:650;color:var(--text)}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.grid{display:grid;gap:8px}.field{min-width:0;display:grid;gap:5px;padding:8px 10px;border:1px solid var(--sub);border-radius:10px;background:rgba(10,15,36,.72)}.field span,.ctl span{color:var(--muted);font-size:11px}.field strong{font-size:13px;font-weight:500;color:var(--text2)}.ctl{display:grid;gap:5px;min-width:0}.ctl input,.ctl select,.ctl textarea{width:100%;height:40px;border:1px solid var(--sub);border-radius:10px;background:var(--input);padding:0 10px}.btn{min-height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text2);padding:0 11px;font-size:12px}.primary{background:linear-gradient(135deg,var(--purple2),var(--purple));color:var(--text)}.empty{display:grid;place-items:center;border:1px dashed var(--sub);border-radius:10px;color:var(--muted);background:rgba(5,8,22,.45);min-height:80px}.notice{min-height:54px;display:grid;place-items:center;border:1px dashed var(--sub);border-radius:10px;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--sub);margin:14px 0}.badge{font-size:11px;color:var(--muted)}
/* dashboard */.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.kpi{grid-column:span 2;height:136px}.wide8{grid-column:span 8;height:300px}.wide4{grid-column:span 4;height:300px}.info{grid-column:span 4;height:220px}.full{grid-column:span 12;height:210px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.card h2{font-size:14px;margin:0}.view{height:32px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);font-size:12px}.kpi-val{font-size:32px;font-weight:700;margin-top:28px}.card .empty{height:calc(100% - 48px);margin-top:10px}
/* core */.context{min-height:72px;padding:8px 12px}.core-context{display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr) auto minmax(190px,1.2fr) minmax(210px,1.3fr);gap:8px;align-items:center}.three{display:grid;grid-template-columns:minmax(260px,1fr) minmax(720px,3fr) minmax(300px,1fr);gap:16px;align-items:start}.center,.right{display:grid;gap:16px}.messages{min-height:452px}.messages .empty{min-height:390px}.decision{min-height:290px}.runtime{height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between}.composer{min-height:120px;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:end}.composer textarea{min-height:96px;resize:vertical}.right .btn{width:100%}
/* asset/video */.asset-context{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px;align-items:center}.asset-bind{grid-template-columns:repeat(3,minmax(0,1fr))}.preview{min-height:500px}.preview-box{min-height:360px;border:1px solid var(--sub);border-radius:18px;background:var(--input);display:grid;place-items:center;color:var(--muted)}.runtime-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.handoff{grid-template-columns:repeat(4,minmax(0,1fr))}.video-context{display:grid;grid-template-columns:repeat(8,minmax(95px,1fr));gap:8px;align-items:center}.viewer{width:100%;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--sub);border-radius:18px;background:#050816;color:var(--muted)}.transport{display:grid;grid-template-columns:auto minmax(180px,1fr) minmax(90px,auto) auto auto;gap:8px;align-items:end;margin-top:10px}.eval-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.manifest-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1439px){.kpi{grid-column:span 4}.asset-bind{grid-template-columns:repeat(2,minmax(0,1fr))}.eval-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.manifest-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<script>
const I={
'zh-TW':{dashboard:'儀表板',core:'專案 / 專題',assets:'素材',video:'影片',edit:'剪輯配音',database:'資料庫',strategy:'戰略中心',info:'最新資訊',no:'目前無資料',view:'查看',projectCount:'專案總數',running:'執行中',pending:'待處理',review:'待審查',completed:'已完成',avg:'平均進度',projectProgress:'專案進度',companyProgress:'公司整體進度',production:'生產總覽',notifications:'通知',announcement:'公司公告',news:'AI / 產業新聞',status:'系統狀態',recent:'近期完成',context:'Context / 執行',conversation:'對話工作區',threads:'對話紀錄',newThread:'＋ 新增對話',messages:'訊息工作區',decision:'評估 / 人工決策',projectState:'Project Core 狀態',blueprint:'Blueprint 狀態',topicPkg:'Topic Production Package',downstream:'下游就緒狀態',version:'Candidate / Version',binding:'Blueprint / Script / DNA 綁定',assetList:'Asset Manifest / 素材清單',preview:'預覽 / 比較',reuse:'Reuse First / Generate Missing',correction:'修正對話',layer:'Layer / Patch',runtime:'Runtime / Provider',score:'評分 / 版本 / 決策',handoff:'Exact Handoff Manifest',onlyModify:'僅 Modify 狀態顯示',onlyImage:'僅圖像相容素材顯示',videoList:'Production List / 綁定輸入',mainPreview:'主預覽 / 比較',videoDecision:'版本 / 評分 / 決策',correctionScope:'修正範圍',aiCorrection:'AI 語意修正',evaluation:'VIDEO 評估 / Issue',manifest:'Exact Output Manifest / Lock / Handoff',audit:'State / Error / Audit',onlyCorrection:'僅 Correction 狀態顯示',noCandidate:'無 Candidate：維持單一 Current Viewer'},
'zh-CN':{dashboard:'仪表板',core:'项目 / 专题',assets:'素材',video:'影片',edit:'剪辑配音',database:'数据库',strategy:'战略中心',info:'最新资讯',no:'目前无数据',view:'查看',projectCount:'专案总数',running:'执行中',pending:'待处理',review:'待审查',completed:'已完成',avg:'平均进度',projectProgress:'专案进度',companyProgress:'公司整体进度',production:'生产总览',notifications:'通知',announcement:'公司公告',news:'AI / 产业新闻',status:'系统状态',recent:'近期完成',context:'Context / 执行',conversation:'对话工作区',threads:'对话记录',newThread:'＋ 新增对话',messages:'消息工作区',decision:'评估 / 人工决策',projectState:'Project Core 状态',blueprint:'Blueprint 状态',topicPkg:'Topic Production Package',downstream:'下游就绪状态',version:'Candidate / Version',binding:'Blueprint / Script / DNA 绑定',assetList:'Asset Manifest / 素材清单',preview:'预览 / 比较',reuse:'Reuse First / Generate Missing',correction:'修正对话',layer:'Layer / Patch',runtime:'Runtime / Provider',score:'评分 / 版本 / 决策',handoff:'Exact Handoff Manifest',onlyModify:'仅 Modify 状态显示',onlyImage:'仅图像兼容素材显示',videoList:'Production List / 绑定输入',mainPreview:'主预览 / 比较',videoDecision:'版本 / 评分 / 决策',correctionScope:'修正范围',aiCorrection:'AI 语义修正',evaluation:'VIDEO 评估 / Issue',manifest:'Exact Output Manifest / Lock / Handoff',audit:'State / Error / Audit',onlyCorrection:'仅 Correction 状态显示',noCandidate:'无 Candidate：维持单一 Current Viewer'},
en:{dashboard:'Dashboard',core:'Project / Topic',assets:'Assets',video:'Video',edit:'Editing & Voice',database:'Database',strategy:'Strategy Center',info:'Latest Information',no:'No data',view:'View',projectCount:'Company Project Count',running:'Running Projects',pending:'Pending Actions',review:'Pending Reviews',completed:'Completed Projects',avg:'Average Progress',projectProgress:'Project Progress',companyProgress:'Company Progress',production:'Production Summary',notifications:'Notifications',announcement:'Company Announcements',news:'AI / Industry News',status:'System Status',recent:'Recent Completions',context:'Context / Execution',conversation:'Conversation Workspace',threads:'Conversation Threads',newThread:'+ New Conversation',messages:'Message Workspace',decision:'Evaluation / Human Decision',projectState:'Project Core State',blueprint:'Blueprint State',topicPkg:'Topic Production Package',downstream:'Downstream Readiness',version:'Candidate / Version',binding:'Blueprint / Script / DNA Binding',assetList:'Asset Manifest / List',preview:'Preview / Compare',reuse:'Reuse First / Generate Missing',correction:'Correction Conversation',layer:'Layer / Patch',runtime:'Runtime / Provider',score:'Score / Version / Decision',handoff:'Exact Handoff Manifest',onlyModify:'Visible only in Modify state',onlyImage:'Visible only for image-compatible assets',videoList:'Production List & Bound Input',mainPreview:'Main Preview / Compare',videoDecision:'Version / Score / Decision',correctionScope:'Correction Scope',aiCorrection:'AI Semantic Correction',evaluation:'VIDEO Evaluation / Issue',manifest:'Exact Output Manifest / Lock / Handoff',audit:'State / Error / Audit',onlyCorrection:'Visible only in Correction state',noCandidate:'No Candidate: keep one Current Viewer'}};
let lang=localStorage.getItem('acpos.preview.lang')||'zh-TW';
const t=k=>I[lang][k]||k;
const field=(label)=>`<div class="field"><span>${label}</span><strong>—</strong></div>`;
const ctl=(label,type='select')=>`<label class="ctl"><span>${label}</span>${type==='textarea'?'<textarea disabled></textarea>':type==='input'?'<input disabled placeholder="—">':`<select disabled><option>—</option></select>`}</label>`;
const btn=(label,p=false)=>`<button class="btn ${p?'primary':''}" disabled>${label}</button>`;
function shellNav(route){document.querySelectorAll('#nav [data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===route));document.querySelectorAll('[data-i]').forEach(n=>{const k=n.dataset.i;if(I[lang][k])n.textContent=t(k)});document.documentElement.lang=lang==='zh-TW'?'zh-Hant-TW':lang==='zh-CN'?'zh-Hans-CN':'en';document.getElementById('langBtn').textContent=lang}
function dashboard(){const cards=[[t('projectCount'),'kpi'],[t('running'),'kpi'],[t('pending'),'kpi'],[t('review'),'kpi'],[t('completed'),'kpi'],[t('avg'),'kpi'],[t('projectProgress'),'wide8'],[t('companyProgress'),'wide4'],[t('production'),'wide8'],[t('notifications'),'wide4'],[t('announcement'),'info'],[t('news'),'info'],[t('status'),'info'],[t('recent'),'full']];return `<div class="page"><div class="dash">${cards.map(([x,c],i)=>`<section class="card ${c}" data-order="${i+1}"><div class="card-head"><h2>${x}</h2><button class="view">${t('view')}</button></div>${c==='kpi'?'<div class="kpi-val">—</div>':`<div class="empty">${t('no')}</div>`}</section>`).join('')}</div></div>`}
function core(){return `<div class="page" data-page-uid="CORE-01" data-vis-step="VIS-02"><section class="context"><div class="core-context">${ctl('Project')}${btn(lang==='en'?'Create Project':'建立 Project',true)}${ctl('Topic')}${btn(lang==='en'?'Create Topic':'建立 Topic',true)}${field('Mode: PROJECT_CORE / TOPIC_PRODUCTION')}${field('Naming Authority = ACPOS_SYSTEM')}</div></section><div class="three"><aside><section class="panel"><h2 class="title">Work Items</h2><div class="empty">—</div><div class="divider"></div><h2 class="title">${t('threads')}</h2>${btn(t('newThread'))}<div class="empty" style="margin-top:10px;min-height:430px">—</div></section></aside><div class="center"><section class="panel"><div class="row"><h2 class="title" style="margin-right:auto">${t('conversation')}</h2>${btn('SINGLE AI')}${btn('MULTI AI')}${field('Assigned AI Set / Route')}${btn(lang==='en'?'Assistant Record':'Assistant 紀錄')}</div></section><section class="panel messages"><h2 class="title">${t('messages')}</h2><div class="empty">—</div></section><section class="panel decision"><h2 class="title">${t('decision')}</h2><div class="grid" style="grid-template-columns:1fr 1fr">${field('Assistant Summary')}${field('CORE Evaluation / Criteria Version / Evidence')}</div><div style="margin-top:10px">${ctl(lang==='en'?'Human Decision':'人工決策','textarea')}</div><div class="row" style="margin-top:8px">${btn('Create Candidate',true)}${btn('Confirm Candidate',true)}${btn('Return to Modify')}</div></section><section class="panel runtime"><span>Current Runtime Stage</span><strong>—</strong></section><section class="panel composer">${btn(lang==='en'?'Attachment':'附件')}${btn(lang==='en'?'Reference':'參考資料')}<label class="ctl"><span></span><textarea disabled placeholder="${lang==='en'?'Enter message; @ calls AI / Data / Reference / Assistant':'輸入訊息；@ 叫用 AI / Data / Reference / Assistant'}"></textarea></label>${btn(lang==='en'?'Send':'傳送',true)}</section></div><aside class="right"><section class="panel"><h2 class="title">${t('projectState')}</h2><div class="empty">—</div><div class="grid" style="margin-top:10px">${['Validate Project Draft','Confirm Project Draft','Generate Story Candidate Set','Request DNA Lock','Submit Project Core Review','Request Project Lock'].map(x=>btn(x)).join('')}</div><div class="divider"></div><h2 class="title">${t('blueprint')}</h2><div class="empty">—</div><div class="grid" style="margin-top:10px">${['Create Blueprint','Validate Blueprint','Approve Blueprint','Request Child Lock'].map(x=>btn(x)).join('')}</div></section><section class="panel"><h2 class="title">${t('topicPkg')}</h2>${field('Topic Production Scope / Contract Refs')}${btn('View Canonical Production Script')}${field('Production Package / Blueprint / DNA / Script refs')}<div class="divider"></div><h2 class="title">${t('downstream')}</h2>${field('ASSET Boundary Readiness')}${field('VIDEO Boundary Readiness')}${field('EDIT Boundary Readiness')}</section><section class="panel"><h2 class="title">${t('version')}</h2>${btn('Compare Candidate')}${field('Current Candidate / Confirmed Version')}<div class="divider"></div>${field('Lock Review Status / Block Reason')}</section></aside></div></div>`}
const assetBind=['Locked Blueprint / Child Lock','ASSET Script Role / Section / Hash','DNA / Identity / Continuity Refs','Asset Manifest Item ID / Purpose','Input Fingerprint','Filename Authority = ACPOS_SYSTEM','Canonical Filename','Output Artifact ID / Exact Version','Checksum','Rights / Policy','Approved Instruction Package'];
function assets(){return `<div class="page" data-page-uid="ASSET-01" data-vis-step="VIS-03"><section class="context"><div class="asset-context">${ctl('Project')}${ctl('Topic')}${field('Production Task')}${field('Task Status')}${btn('AUTO / MANUAL')}${btn(lang==='en'?'Execute':'執行',true)}${field('Current Stage')}</div></section><div class="three"><aside><section class="panel"><h2 class="title">${t('assetList')}</h2>${ctl(lang==='en'?'Search Assets':'搜尋素材','input')}${ctl('Filter')}<div class="empty" style="min-height:420px;margin-top:8px">Asset Items</div></section></aside><div class="center"><section class="panel"><h2 class="title">${t('binding')}</h2><div class="grid asset-bind">${assetBind.map(field).join('')}</div><div class="row" style="margin-top:8px">${btn('View Blueprint')}${btn('View ASSET Script')}</div></section><section class="panel preview"><div class="row"><h2 class="title" style="margin-right:auto">${t('preview')}</h2>${['Single','A/B','A/B/C','−','+','Fit','Reference'].map(x=>btn(x)).join('')}</div><div class="preview-box">—</div><div class="row" style="margin-top:10px">${field('Selected Versions')}${btn('View Result Detail')}</div></section><section class="panel"><h2 class="title">${t('reuse')}</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">${['Required','Reuse','Missing','Deferred'].map(field).join('')}</div></section><section class="panel"><h2 class="title">${t('correction')}</h2><div class="notice">${t('onlyModify')}</div></section><section class="panel"><h2 class="title">${t('layer')}</h2><div class="notice">${t('onlyImage')}</div></section></div><aside class="right"><section class="panel"><h2 class="title">${t('score')}</h2>${['ASSET Criteria Version','Dimension UID / Label / Weight / Score / Hard Block','Overall Score','Issue Summary'].map(field).join('')}${btn('Re-evaluate')}<div class="divider"></div>${btn('Version History')}${btn('Restore as New Version')}<div class="divider"></div>${btn('Confirm Version',true)}${btn('Modify Version')}${btn('Lock Exact Version')}</section></aside></div><section class="panel"><h2 class="title">${t('runtime')}</h2><div class="grid runtime-grid">${['Route State','Provider / Model','Provider Job State','Attempt','Callback','Retry Eligibility','Correlation / Trace'].map(field).join('')}${btn('Retry')}${btn('View Runtime Detail')}</div></section><section class="panel"><h2 class="title">${t('handoff')}</h2><div class="grid handoff">${['ASSET VERSION','LAYER COMPOSITE','BLUEPRINT','SCRIPT HASH','DNA','MANIFEST ITEMS','CANONICAL FILENAME','CHECKSUM','SCORECARD','RIGHTS','CONTRACT HASH'].map(field).join('')}${btn('Handoff → VIDEO',true)}</div></section></div>`}
function video(){const bound=['Blueprint / ChildLock Ref','Input Fingerprint','VIDEO Script Role / Section / Hash','DNA / Continuity Refs','Approved Asset IDs / Versions','Filename / Checksum / Purpose Binding','Rights / Policy','Approved Instruction Package'];const evals=['VIDEO-01-SCORE-SCRIPT','VIDEO-01-SCORE-IDENTITY','VIDEO-01-SCORE-MOTION','VIDEO-01-SCORE-CAMERA','VIDEO-01-SCORE-SCENE','VIDEO-01-SCORE-TIMING','VIDEO-01-SCORE-TECH','VIDEO-01-SCORE-ASSET','VIDEO-01-SCORE-RIGHTS'];return `<div class="page" data-page-uid="VIDEO-01" data-vis-step="VIS-04"><section class="context"><div class="video-context">${ctl('Project')}${ctl('Topic')}${ctl('Production Task')}${field('Task Status')}${btn('AUTO / MANUAL')}${btn(lang==='en'?'Execute':'執行',true)}${btn('View Blueprint')}${btn('View VIDEO Script / Instruction')}</div></section><div class="three"><aside><section class="panel"><h2 class="title">${t('videoList')}</h2>${ctl(lang==='en'?'Search Scene / Shot':'搜尋 Scene / Shot','input')}${ctl('Filter')}<div class="empty" style="min-height:150px;margin-top:8px">Scene / Shot Item</div><div class="divider"></div><div class="grid">${bound.map(field).join('')}</div></section></aside><div class="center"><section class="panel preview"><div class="row"><h2 class="title" style="margin-right:auto">${t('mainPreview')}</h2>${btn('Compare')}${ctl('Version A / Current')}<span class="badge">${t('noCandidate')}</span></div><div class="viewer">—</div><div class="transport">${btn('Play/Pause')}<label class="ctl"><span>Seek</span><input type="range" value="0" disabled></label>${field('Timecode')}${btn('Volume/Mute')}${btn('Fullscreen')}</div></section></div><aside class="right"><section class="panel"><h2 class="title">${t('videoDecision')}</h2>${field('Current Exact Video Version')}${field('Candidate Version')}${field('VIDEO Criteria Version')}<div class="divider"></div>${field('Overall Score')}${field('Issue Summary')}<div class="divider"></div>${btn('View VIDEO Score')}${btn('Confirm Version',true)}${btn('Modify')}${btn('Lock')}${btn('Handoff → EDIT')}</section></aside></div><section class="panel"><h2 class="title">${t('correctionScope')}</h2><div class="notice">${t('onlyCorrection')}</div></section><div class="grid" style="grid-template-columns:1.78fr 1fr"><section class="panel"><h2 class="title">${t('aiCorrection')}</h2><div class="notice">${t('onlyCorrection')}</div></section><section class="panel"><h2 class="title">Provider Runtime</h2><div class="grid" style="grid-template-columns:1fr 1fr">${['Approved Route / Capability','Provider Brand / Model','Provider Job State','Attempt / Callback','Retry Eligibility','Correlation / Trace'].map(field).join('')}${btn('Retry')}${btn('View Runtime Detail')}</div></section></div><section class="panel"><h2 class="title">${t('evaluation')}</h2><div class="grid eval-grid">${evals.map(field).join('')}${btn('Re-evaluate')}${btn('Create Finding')}${btn('Open Issue')}</div></section><section class="panel"><h2 class="title">${t('manifest')}</h2><div class="grid manifest-grid">${['Exact Video Version ID','Shot Version refs','Layer Version refs','Script Section Hash','Asset Dependency Fingerprint','Output URI / Composite Ref','Checksum','Scorecard / Criteria Ref','Evidence refs','Handoff Contract Hash'].map(field).join('')}</div></section><section class="panel"><h2 class="title">${t('audit')}</h2><div class="grid manifest-grid">${['Page State','DepartmentTask State','Error UID / Reason','Disabled Reason','Audit / Trace'].map(field).join('')}</div></section></div>`}
function render(){let route=(location.hash||'#/').slice(1);if(!['/','/core','/assets','/video'].includes(route))route='/';shellNav(route);document.getElementById('app').innerHTML=route==='/'?dashboard():route==='/core'?core():route==='/assets'?assets():video();}
document.getElementById('langBtn').onclick=()=>document.getElementById('langMenu').classList.toggle('open');document.querySelectorAll('#langMenu [data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('acpos.preview.lang',lang);document.getElementById('langMenu').classList.remove('open');render()});window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
