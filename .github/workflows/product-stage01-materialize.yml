name: Product Stage01 Successor Step Execute
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Explicit operator authorization to enter Stage-01 effectful execution
        required: true
        default: explicit-stage01-entry
permissions:
  contents: write
jobs:
  execute:
    uses: ./.github/workflows/product-stage-successor-execute-reusable.yml
    with:
      stage: STAGE-01
      work_units: WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-REENTRY-001,WU-STAGE01-WB01-DASHBOARD-REENTRY-001
    secrets: inherit
