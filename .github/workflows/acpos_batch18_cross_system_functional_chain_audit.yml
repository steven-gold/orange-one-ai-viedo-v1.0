name: ACPOS Batch 18 Cross System Functional Chain Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch18-cross-system-functional-chain-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 17 closure boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="3e8d73368d340da6a081fa717d50aaf6013062ac"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH17 CLOSED / 31 DOCX / NO WORD DRIFT"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 18 cross-system functional-chain audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch18_cross_system_functional_chain_audit.py

      - name: Verify audit output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch18_functional_chain_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["root_docx"]==31,s
          assert s["page_contracts"]==18,s
          assert s["system_contracts"]==9,s
          assert s["page_control_uids"]>0 and s["unique_page_control_uids"]>0,s
          print("PASS: BATCH18 AUDIT DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 18 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch18-cross-system-functional-chain-audit
          path: |
            __batch18_functional_chain_audit.json
            __batch18_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 18 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch18_functional_chain_audit.json __batch18_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-18-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch18_cross_system_functional_chain_audit.py .github/workflows/acpos_batch18_cross_system_functional_chain_audit.yml
          git commit -m "chore(acpos): close batch 18 functional-chain audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH18 AUDIT HARNESS REMOVED / CLEAN TREE"
