name: Stage-02 Material Remediation R1

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-material-remediation-r1.yml'
      - 'governance/ci/materialize_current_stage2_closure_artifacts.py'
      - 'governance/ci/validate_current_stage2_materialized_closure.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-stage02-structural-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Re-prove exact 75-file governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance registry
        run: python governance/ci/governance_resolver.py

      - name: Validate canonical stage remediation protocol
        run: python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Validate fresh Stage-02 blocked predecessor result
        run: python governance/ci/validate_stage02_state_integrity.py

      - name: Materialize bounded Stage-02 owning-layer structural contracts
        run: python governance/ci/materialize_current_stage2_closure_artifacts.py

      - name: Validate materialized Stage-02 product contracts against immutable source registries
        run: python governance/ci/validate_current_stage2_materialized_closure.py

      - name: Prove Current Specification and Stage-01 immutable inputs remained byte-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: remediation changed only Stage-02 owning-layer output/evidence'

      - name: Commit materialized Stage-02 product artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          git add governance/test/stage02/STAGE02_MATERIAL_REMEDIATION_RECEIPT_R1.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: materializer produced no tracked owning-layer change' >&2
            exit 1
          fi
          git commit -m 'feat(stage02): materialize bounded structural contracts'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-material-remediation-r1
          path: |
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
            governance/test/stage02/STAGE02_MATERIAL_REMEDIATION_RECEIPT_R1.yaml
          if-no-files-found: error
