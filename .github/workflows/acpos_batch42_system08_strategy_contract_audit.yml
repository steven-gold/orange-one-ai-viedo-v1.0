name: ACPOS Batch 42 System08 Strategy Contract Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch42-system08-strategy-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 41 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="a0eca38e60aebc788e94529306cb609466f31a81"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH41 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 42 System08 strategy contract audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch42_system08_strategy_contract_audit.py

      - name: Verify Batch 42 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch42_system08_strategy_contract_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["operations"]==2,s
          assert s["owner_paragraph_hits"]+s["owner_table_hits"]>0,s
          print("PASS: BATCH42 SYSTEM08 STRATEGY CONTRACT EVIDENCE")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 42 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch42-system08-strategy-contract-audit
          path: |
            __batch42_system08_strategy_contract_audit.json
            __batch42_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 42 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch42_system08_strategy_contract_audit.json __batch42_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-42-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch42_system08_strategy_contract_audit.py .github/workflows/acpos_batch42_system08_strategy_contract_audit.yml
          git commit -m "chore(acpos): close batch 42 system08 strategy contract audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH42 HARNESS REMOVED / CLEAN TREE"
