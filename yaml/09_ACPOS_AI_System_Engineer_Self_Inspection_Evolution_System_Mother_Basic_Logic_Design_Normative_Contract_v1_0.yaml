    text: 30. Security / Classification / Secrets
  - index: 61
    style: Rule
    text: • System inspection MUST honor actor/project/object classification and permission scope；診斷便利性不得繞過資料隔離。
  - index: 62
    style: Rule
    text: • AI-09 MUST NOT emit raw secrets/tokens/credentials into prompt, log, finding, evidence, error, export or Word。
  - index: 63
    style: Rule
    text: • Secret handling MUST use reference/secret manager identity；lack of exact secret binding = REQUIRE_EXACT_BINDING。
  - index: 64
    style: Rule
    text: • Production write, deployment, permission/RLS/security change MUST require stronger authorization than read-only inspection。
  - index: 65
    style: Rule
    text: • Security Finding SHOULD trigger containment before ordinary remediation planning when active risk exists。
  - index: 66
    style: Rule
    text: • Inspection evidence containing sensitive data MUST carry classification/retention/redaction requirements。
  - index: 67
    style: Rule
    text: • Cross-project fallback or cross-tenant evidence reuse without authority MUST be BLOCK。
  - index: 68
    style: Rule
    text: • AI MUST NOT weaken gate/permission/classification to make validation pass。
