authority:
  id: ACPOS_WB01_UI_PROJECTION_SQL_PERMISSION_MAPPING
  version: V1.0
  status: FINAL_LOCKED
  current_only: true
  revision: 2026-09-05-KEEP-SECTION-READ-SQL-GAP
  scope: WB-01_PAGE_GATE_AUTHORIZE_AND_EXPLICIT_READ_GAPS_ONLY
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
approval:
  user_approved: true
  approved_on: '2026-09-05'
  approved_scope:
  - Lock WB-01 page-gate permission alias to catalog resource_key and VIEW action
  - Name authorize SQL tables and columns already present in 0001/0003
  - Record remaining identity, assignment-status, scope/condition, and read-SQL gaps
  - Point identity actor to ACPOS_PRODUCTION_IDENTITY_RUNTIME_CONTRACT cookie session
  - Lock page-gate assignment status predicate to APPROVED
  - Lock page-gate effect precedence to DENY_WINS
  - Lock page-gate scope/condition to empty-object match
  - Lock audit payload_hash to SHA-256 hex
  - Lock section/control/field authorize SQL on named catalog resource_keys
  - Keep section read SQL unnamed until Current Authority names SELECT/FROM/WHERE
  - Live operational rows do not authorize table-name inference
  - Do not bind configureUiProjectionRuntime in this revision
  - Do not change /health/ready to 200
source:
  derived_from:
  - authority/pages/workspace/WB-01/ACPOS_WB-01_FINAL_LOCKED_ENCODING.yaml
  - 06_permission/account_permission_catalog.yaml
  - database/migrations/0001_canonical_schema.sql
  - database/migrations/0003_account_permission_authorization.sql
  - src/server/shared/uiProjectionRuntime.ts
  - src/server/dashboard/readModelRuntime.ts
  - src/domain/dashboard/readModelContract.ts
  - authority/runtime/ACPOS_PRODUCTION_IDENTITY_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml
page:
  page_uid: workspace:WB-01
  page_permission_label: workspace.dashboard.view
  catalog_resource_id: PERM-PAGE-WORKSPACE-WB-01
  catalog_resource_key: page:workspace:WB-01
  catalog_resource_type: PAGE
  required_action: VIEW
  authorization_source: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY
  inheritance: FORBIDDEN
  alias_rule: workspace.dashboard.view is the WB-01 page_permission label and maps only to page:workspace:WB-01 VIEW. It is not a catalog resource_key.
  uuidv5_namespace: a5cde652-06f2-521b-933a-785801354eca
  database_resource_id_rule: permission_resources.resource_id = UUIDv5(uuidv5_namespace, catalog_resource_id)
ports:
  ui_projection: configureUiProjectionRuntime
  dashboard_read_model: configureDashboardRuntime
  health_ready_probe:
    page_uid: workspace:WB-01
    route: GET /health/ready
    current_fail_closed_reason: UI_PROJECTION_RUNTIME_NOT_BOUND
authorize:
  required_guards:
  - identity
  - account_page_permission
  - scope
  - condition
  - classification
  - audit
  identity:
    actor_table: app_users
    actor_column: user_id
    identity_contract: authority/runtime/ACPOS_PRODUCTION_IDENTITY_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml
    canonical_actor: NAMED
    identity_transport: INTERNAL_COOKIE_SESSION
    cookie_name: acpos_session
    gap_reason: Cookie session can resolve app_users.user_id. Page-gate still needs dashboard read SQL.
    missing_identity_reason_code: IDENTITY_RUNTIME_NOT_BOUND
  page_assignment_probe:
    tables:
    - permission_resources
    - account_permission_assignments
    locked_predicates:
    - permission_resources.resource_key = page:workspace:WB-01
    - permission_resources.resource_type = PAGE
    - permission_resources.active = true
    - account_permission_assignments.resource_id = permission_resources.resource_id
    - account_permission_assignments.user_id = actor user_id
    - account_permission_assignments.action = VIEW
    - account_permission_assignments.status = APPROVED
    - account_permission_assignments.effective_from <= now()
    - account_permission_assignments.effective_to IS NULL OR account_permission_assignments.effective_to > now()
    sql: |
      SELECT a.account_permission_assignment_id, a.effect, a.status, a.scope, a.condition, a.gate_profile
      FROM account_permission_assignments a
      JOIN permission_resources r ON r.resource_id = a.resource_id
      WHERE a.user_id = $actor_user_id
        AND r.resource_key = 'page:workspace:WB-01'
        AND r.resource_type = 'PAGE'
        AND r.active = true
        AND a.action = 'VIEW'
        AND a.status = 'APPROVED'
        AND a.effective_from <= now()
        AND (a.effective_to IS NULL OR a.effective_to > now())
    effect_evaluation:
      precedence: DENY_WINS
      deny_reason_code: PERMISSION_DENIED
      missing_allow_reason_code: PERMISSION_OR_SCOPE_DENIED
      steps:
      - If any returned row has effect DENY, deny
      - Else if any returned row has effect ALLOW, allow
      - Else deny
    evaluation_order:
    - sql_probe
    - scope_evaluation
    - condition_evaluation
    - effect_evaluation
    scope_evaluation:
      catalog_requirement: explicit_account_scope_match
      request_scope: EMPTY_OBJECT
      request_scope_reason: UiProjectionRequest names page_uid and correlation_id only. WB-01 page-gate does not name workspace_id or company_id.
      matcher: CONSTRAINT_SUBSET
      fail_reason_code: PERMISSION_OR_SCOPE_DENIED
      rules:
      - assignment.scope must be a JSON object
      - Every key in assignment.scope must exist on request_scope with equal JSON value
      - Empty object {} has no extra constraints and matches
      - Invented request scope keys are forbidden
    condition_evaluation:
      catalog_requirement: assignment_condition_evaluates_true
      empty_object: TRUE
      empty_object_reason: condition jsonb defaults to empty object in 0001/0003
      unknown_keys: FAIL_CLOSED
      fail_reason_code: PERMISSION_OR_SCOPE_DENIED
      rules:
      - assignment.condition must be a JSON object
      - Empty object {} evaluates true
      - Any non-empty condition fails because Current Authority does not name operators or keys
  section_control_field_probes:
    inheritance_from_page: FORBIDDEN
    section_resource_key_pattern: 'section:workspace:WB-01:{section_key}'
    section_action: VIEW
    control_resource_key_pattern: 'control:CTRL-WORKSPACE-WB-01-{CONTROL_SUFFIX}'
    control_action: VIEW
    field_action: READ
    bind_in_this_revision: false
    reuse_page_assignment_evaluation: true
    sql: |
      SELECT a.account_permission_assignment_id, a.effect, a.status, a.scope, a.condition, a.gate_profile
      FROM account_permission_assignments a
      JOIN permission_resources r ON r.resource_id = a.resource_id
      WHERE a.user_id = $actor_user_id
        AND r.resource_key = $resource_key
        AND r.resource_type = $resource_type
        AND r.active = true
        AND a.action = $action
        AND a.status = 'APPROVED'
        AND a.effective_from <= now()
        AND (a.effective_to IS NULL OR a.effective_to > now())
    section_resource_keys:
    - section:workspace:WB-01:company_project_count
    - section:workspace:WB-01:company_running_project_count
    - section:workspace:WB-01:company_pending_action_count
    - section:workspace:WB-01:company_pending_review_count
    - section:workspace:WB-01:company_completed_project_count
    - section:workspace:WB-01:company_average_progress
    - section:workspace:WB-01:project_progress_overview
    - section:workspace:WB-01:company_progress_summary
    - section:workspace:WB-01:production_summary
    - section:workspace:WB-01:notifications
    - section:workspace:WB-01:company_announcements
    - section:workspace:WB-01:industry_news
    - section:workspace:WB-01:system_status_summary
    - section:workspace:WB-01:recent_completions
    control_resource_keys:
    - control:CTRL-WORKSPACE-WB-01-COMPANY-PROJECT-COUNT-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-RUNNING-PROJECT-COUNT-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-PENDING-ACTION-COUNT-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-PENDING-REVIEW-COUNT-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-COMPLETED-PROJECT-COUNT-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-AVERAGE-PROGRESS-OPEN
    - control:CTRL-WORKSPACE-WB-01-PROJECT-PROGRESS-OVERVIEW-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-PROGRESS-SUMMARY-OPEN
    - control:CTRL-WORKSPACE-WB-01-PRODUCTION-SUMMARY-OPEN
    - control:CTRL-WORKSPACE-WB-01-NOTIFICATIONS-OPEN
    - control:CTRL-WORKSPACE-WB-01-COMPANY-ANNOUNCEMENTS-OPEN
    - control:CTRL-WORKSPACE-WB-01-INDUSTRY-NEWS-OPEN
    - control:CTRL-WORKSPACE-WB-01-SYSTEM-STATUS-SUMMARY-OPEN
    - control:CTRL-WORKSPACE-WB-01-RECENT-COMPLETIONS-OPEN
    field_resource_keys:
    - field:FIELD-WORKSPACE-WB-01-COMPANY-PROJECT-COUNT
    - field:FIELD-WORKSPACE-WB-01-COMPANY-RUNNING-PROJECT-COUNT
    - field:FIELD-WORKSPACE-WB-01-COMPANY-PENDING-ACTION-COUNT
    - field:FIELD-WORKSPACE-WB-01-COMPANY-PENDING-REVIEW-COUNT
    - field:FIELD-WORKSPACE-WB-01-COMPANY-COMPLETED-PROJECT-COUNT
    - field:FIELD-WORKSPACE-WB-01-COMPANY-AVERAGE-PROGRESS
    - field:FIELD-WORKSPACE-WB-01-PROJECT-PROGRESS-OVERVIEW
    - field:FIELD-WORKSPACE-WB-01-COMPANY-PROGRESS-SUMMARY
    - field:FIELD-WORKSPACE-WB-01-PRODUCTION-SUMMARY
    - field:FIELD-WORKSPACE-WB-01-NOTIFICATIONS
    - field:FIELD-WORKSPACE-WB-01-COMPANY-ANNOUNCEMENTS
    - field:FIELD-WORKSPACE-WB-01-INDUSTRY-NEWS
    - field:FIELD-WORKSPACE-WB-01-SYSTEM-STATUS-SUMMARY
    - field:FIELD-WORKSPACE-WB-01-RECENT-COMPLETIONS
    field_resource_key_pattern: 'field:FIELD-WORKSPACE-WB-01-{FIELD_SUFFIX}'
    gap_reason: authorize SQL is named; dashboard read SQL is still an Authority gap
read:
  operation_id: getDashboardReadModel
  method_path: GET /v1/dashboard/read-model
  contract: src/domain/dashboard/readModelContract.ts
  workflow: READ_ONLY
  section_sql_mapping: AUTHORITY_GAP
  section_sql_deferred_until: CURRENT_AUTHORITY_NAMES_SELECT_FROM_WHERE
  sections_without_sql:
  - company_project_count
  - company_running_project_count
  - company_pending_action_count
  - company_pending_review_count
  - company_completed_project_count
  - company_average_progress
  - project_progress_overview
  - company_progress_summary
  - production_summary
  - notifications
  - company_announcements
  - industry_news
  - system_status_summary
  - recent_completions
  gap_reason: WB-01 data_binding names read-model fields only. Section values appear after live operations. Current Authority does not name SELECT/FROM/WHERE. Table-name inference is forbidden. User 2026-09-05 kept this gap.
audit:
  table: audit_events
  required_columns:
  - action
  - entity_type
  - entity_id
  - actor_id
  - actor_type
  - correlation_id
  - occurred_at
  - payload_hash
  payload_hash_algorithm: SHA-256
  payload_hash_encoding: hex
  payload_hash_column_type: char(64)
  bind_in_this_revision: false
forbidden:
  - Invent resource_key workspace.dashboard.view
  - Derive PAGE VIEW from SURFACE/L1/L2/L3 parent VIEW
  - Infer company_project_count from COUNT(projects)
  - Bind configureUiProjectionRuntime or configureDashboardRuntime while remaining_blockers is non-empty
  - Treat CONTROLLED_TEST dashboard projection as production read SQL
  - Change official site /health/ready to 200
  - Claim production ready
remaining_blockers:
  - WB01_SECTION_READ_SQL_NOT_DEFINED
adapter_bind_allowed: false
production_ready_claim_allowed: false
next_action: CLOSE_WB01_PROJECTION_MAPPING_GAPS
