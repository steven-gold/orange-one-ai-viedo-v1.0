name: IAM-01 closure validation

on:
  push:
    branches: [acpos-iam01-closure-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: IAM authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          auth=Path('authority/pages/admin/IAM-01/ACPOS_IAM-01_ACCOUNT_PERMISSION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          src='\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*') if p.is_file())
          bindings=Path('src/domain/iam/iamControlBindings.ts').read_text()
          contract=Path('src/domain/iam/iamRuntimeContract.ts').read_text()
          visual=Path('src/components/pages/IamVisual.tsx').read_text()
          pats={
            'sections':r'^\s*-?\s*section_uid:\s*(IAM-01-SEC-[A-Z0-9-]+)',
            'components':r'^\s*-?\s*component_uid:\s*(IAM-01-CMP-[A-Z0-9-]+)',
            'controls':r'^\s*-?\s*control_uid:\s*(IAM-01-[A-Z0-9-]+)',
            'actions':r'^\s*-?\s*action_uid:\s*(IAM-01-ACT-[A-Z0-9-]+)',
            'gates':r'^\s*-?\s*gate_uid:\s*(IAM-01-GATE-[A-Z0-9-]+)',
            'errors':r'^\s*-?\s*error_uid:\s*(IAM-01-ERR-[A-Z0-9-]+)',
            'ports':r'^\s*-?\s*port_uid:\s*(IAM-01-PORT-[A-Z0-9-]+)',
          }
          expected={'sections':6,'components':10,'controls':14,'actions':13,'gates':5,'errors':7,'ports':9}
          failed=False
          ids={k:set(re.findall(p,auth,re.M)) for k,p in pats.items()}
          for k,v in ids.items():
            print(k,len(v),sorted(v))
            if len(v)!=expected[k]: print('COUNT_MISMATCH',k,len(v),expected[k]);failed=True
            missing=sorted(x for x in v if x not in src)
            print('source_missing',k,len(missing),missing)
            if missing: failed=True
          sm=re.search(r'state_machine:\s*\n\s*states:\s*\n(?P<body>.*?)\n\s*transitions:',auth,re.S)
          states=set(re.findall(r'^\s*-\s+([A-Z_]+)\s*$',sm.group('body') if sm else '',re.M))
          expected_states={'LIST','CREATE_BASIC','CREATE_PERMISSION','CREATE_PREVIEW','EDIT_BASIC','EDIT_PERMISSION','EDIT_PREVIEW','APPLYING','COMPLETE','BLOCKED','ERROR'}
          print('states',len(states),sorted(states))
          if states!=expected_states: failed=True
          controls=set(re.findall(r'"(IAM-01-[A-Z0-9-]+)":\s*\{',bindings))
          print('binding_controls',len(controls))
          if controls!=ids['controls']: failed=True
          for required in ['IAM_SECTION_UIDS','IAM_COMPONENT_UIDS','IAM_ACTION_UIDS','IAM_GATE_UIDS','IAM_ERROR_UIDS','IAM_PORT_UIDS','IAM_PAGE_STATES','IAM_FRONT_L1','IAM_ADMIN_L1']:
            if required not in contract: print('CONTRACT_REGISTRY_MISSING',required);failed=True
          if 'TEST-IAM-FIELD-' in visual or 'TEST-IDENTITY-CANDIDATE-' in visual:
            print('PRODUCT_UI_HARDCODES_CONTROLLED_IDENTITY_SCHEMA');failed=True
          if 'No wildcard admin:* grant' not in auth or 'Department / Job Title / Role Name never grants permission' not in auth:
            print('IAM_HARD_LOCK_MISSING');failed=True
          if failed: sys.exit(1)
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production IAM must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3131 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/iam-prod.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3131/admin/accounts >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/iam-prod.json -w '%{http_code}' 'http://127.0.0.1:3131/v1/ui-projections/admin%3AIAM-01')
          cat /tmp/iam-prod.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/iam-prod.json
          ! grep -q 'TEST_ONLY' /tmp/iam-prod.json
          ! grep -q 'production_eligible' /tmp/iam-prod.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled IAM browser interactions
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        shell: bash
        run: |
          set -euo pipefail
          PORT=3132 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/iam-controlled.log 2>&1 &
          pid=$!; trap 'cat /tmp/iam-controlled.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3132/admin/accounts >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/iam-controlled.json -w '%{http_code}' 'http://127.0.0.1:3132/v1/ui-projections/admin%3AIAM-01')
          cat /tmp/iam-controlled.json
          test "$code" = "200"
          grep -q '"data_classification":"TEST_ONLY"' /tmp/iam-controlled.json
          grep -q '"production_eligible":false' /tmp/iam-controlled.json
          grep -q 'TEST-IAM-FIELD-IDENTITY-CANDIDATE' /tmp/iam-controlled.json
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1000}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3132/admin/accounts',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`IAM route ${res&&res.status()} at ${width}`);
              const nodes=page.locator('[data-control-id]');
              if(await nodes.count()!==14)throw new Error(`IAM control count ${await nodes.count()} at ${width}`);
              const unique=await nodes.evaluateAll(ns=>new Set(ns.map(n=>n.getAttribute('data-control-id'))).size);
              if(unique!==14)throw new Error(`IAM unique control count ${unique} at ${width}`);
              if(width>=1440){const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>0)throw new Error(`IAM horizontal overflow ${overflow} at ${width}`);}
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3132/admin/accounts',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:IAM-01"]');
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            const state=s=>page.waitForFunction(x=>document.querySelector('[data-page-uid="admin:IAM-01"]')?.getAttribute('data-page-state')===x,s);
            const responseJson=async p=>{const text=await p.text();let json;try{json=JSON.parse(text)}catch{throw new Error(`Non-JSON ${p.status()} ${text}`)};if(p.status()!==200)throw new Error(`HTTP ${p.status()} ${text}`);return json;};
            const previewCount=async label=>page.getByText(label,{exact:true}).locator('..').locator('strong').textContent();
            await state('LIST');
            if((await root.getAttribute('data-control-registry-valid'))!=='true')throw new Error('IAM registry invalid');
            if((await root.getAttribute('data-projection-adapter-ready'))!=='true'||(await root.getAttribute('data-effectful-runtime-ready'))!=='true')throw new Error('IAM controlled adapters not bound');
            const body=(await page.locator('body').textContent())||'';
            if(!body.includes('[TEST] Existing operator A')||!body.includes('[TEST] Existing operator B'))throw new Error('IAM account directory missing');
            if(!body.includes('[TEST] Identity Candidate Ref')||!body.includes('[TEST] Organization Scope Ref'))throw new Error('IAM dynamic schema missing');
            const edit=q('IAM-01-BTN-EDIT');
            if(!(await edit.isDisabled())||(await edit.getAttribute('data-disabled-reason'))!=='IAM_ACCOUNT_SELECTION_REQUIRED')throw new Error('Edit selection guard missing');
            if((await q('IAM-01-CTL-BASIC-DATA').getAttribute('aria-disabled'))!=='true')throw new Error('Basic data context guard missing');

            const search=q('IAM-01-CTL-SEARCH');await search.fill('operator A');
            let w=page.waitForResponse(r=>r.url().endsWith('/v1/search')&&r.request().method()==='POST');await search.press('Enter');await responseJson(await w);
            await page.waitForFunction(()=>document.querySelectorAll('[data-account-id]').length===1);
            const account=page.locator('[data-account-id="TEST-IAM-ACCOUNT-001"]');await account.click();
            if(!(await page.locator('body').textContent())?.includes('TEST_SCOPE_A'))throw new Error('Account detail not projection-bound');
            if(await edit.isDisabled())throw new Error('Edit disabled after selection');await edit.click();await state('EDIT_BASIC');
            const identity=page.locator('[data-field-uid="TEST-IAM-FIELD-IDENTITY-CANDIDATE"]'),scope=page.locator('[data-field-uid="TEST-IAM-FIELD-ORG-SCOPE"]');
            if(await identity.inputValue()!=='TEST-IDENTITY-CANDIDATE-001'||await scope.inputValue()!=='TEST-ORG-SCOPE-A')throw new Error('Edit basic data not hydrated');
            const preset=q('IAM-01-SEL-DEPT-PRESET');await preset.selectOption('TEST-IAM-PRESET-EDITING');
            const frontGroup=q('IAM-01-GRP-FRONT-L1'),backGroup=q('IAM-01-GRP-BACK-L1');
            if(!(await frontGroup.locator('label').filter({hasText:'FRONT-L1-05'}).locator('input').isChecked())||!(await frontGroup.locator('label').filter({hasText:'FRONT-L1-06'}).locator('input').isChecked()))throw new Error('Preset did not prefill frontend draft');
            if(await backGroup.locator('input:checked').count()!==0)throw new Error('Preset silently granted backend');
            const save=q('IAM-01-BTN-SAVE-DRAFT');w=page.waitForResponse(r=>r.url().endsWith('/v1/drafts')&&r.request().method()==='POST');await save.click();await responseJson(await w);
            const validate=q('IAM-01-BTN-VALIDATE');await page.waitForFunction(()=>!document.querySelector('[data-control-id="IAM-01-BTN-VALIDATE"]')?.hasAttribute('disabled'));w=page.waitForResponse(r=>r.url().includes('/validate')&&r.request().method()==='POST');await validate.click();await responseJson(await w);await state('EDIT_PERMISSION');
            const preview=q('IAM-01-BTN-PREVIEW');w=page.waitForResponse(r=>r.url().includes('/authorization-impact')&&r.request().method()==='POST');await preview.click();const editPreview=await responseJson(await w);
            if(editPreview.value?.added?.length!==2||editPreview.value?.removed?.length!==3||editPreview.value?.blocked?.length!==0)throw new Error(`Edit preview API delta mismatch ${JSON.stringify(editPreview)}`);
            await state('EDIT_PREVIEW');
            if(await previewCount('ADDED')!=='2'||await previewCount('REMOVED')!=='3'||await previewCount('BLOCKED')!=='0')throw new Error('Edit preview UI delta mismatch');
            const complete=q('IAM-01-BTN-COMPLETE');if(await complete.isDisabled())throw new Error('Complete disabled after preview');page.once('dialog',d=>d.accept());await complete.click();await state('COMPLETE');
            if(!(await page.locator('body').textContent())?.includes('2 L1'))throw new Error('Completed edit projection not refreshed');
            const audit=q('IAM-01-BTN-AUDIT');await audit.click();await page.waitForFunction(()=>document.querySelector('[data-audit-open="true"]'));
            const auditText=(await page.locator('[data-audit-open="true"]').textContent())||'';if(!auditText.includes('governed account approved TEST-IAM-ACCOUNT-001'))throw new Error('Audit missing completed edit');

            await search.fill('');w=page.waitForResponse(r=>r.url().endsWith('/v1/search')&&r.request().method()==='POST');await search.press('Enter');await responseJson(await w);await page.waitForFunction(()=>document.querySelectorAll('[data-account-id]').length===2);
            const add=q('IAM-01-BTN-ADD');await add.click();await state('CREATE_BASIC');
            if(await identity.inputValue()!==''||await scope.inputValue()!=='')throw new Error('Create did not reset basic data');
            await identity.fill('TEST-IDENTITY-CANDIDATE-NEW');await scope.fill('TEST-ORG-SCOPE-NEW');await preset.selectOption('TEST-IAM-PRESET-EDITING');
            w=page.waitForResponse(r=>r.url().endsWith('/v1/drafts')&&r.request().method()==='POST');await save.click();await responseJson(await w);
            await page.waitForFunction(()=>!document.querySelector('[data-control-id="IAM-01-BTN-VALIDATE"]')?.hasAttribute('disabled'));w=page.waitForResponse(r=>r.url().includes('/validate')&&r.request().method()==='POST');await validate.click();await responseJson(await w);await state('CREATE_PERMISSION');
            w=page.waitForResponse(r=>r.url().includes('/authorization-impact')&&r.request().method()==='POST');await preview.click();const createPreview=await responseJson(await w);
            if(createPreview.value?.added?.length!==2||createPreview.value?.removed?.length!==0||createPreview.value?.blocked?.length!==0)throw new Error(`Create preview API delta mismatch ${JSON.stringify(createPreview)}`);
            await state('CREATE_PREVIEW');if(await previewCount('ADDED')!=='2'||await previewCount('REMOVED')!=='0')throw new Error('Create preview UI delta mismatch');
            page.once('dialog',d=>d.accept());await complete.click();await state('COMPLETE');await page.waitForFunction(()=>document.querySelectorAll('[data-account-id]').length===3);
            if(await page.locator('[data-account-id="TEST-IAM-ACCOUNT-NEW-001"]').count()!==1)throw new Error('New governed account missing');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('IAM_BROWSER_INTERACTION_PASS');
            await page.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/iam src/server/iam src/server/testing/controlledIamTestRuntime.ts src/components/pages/IamControlRuntime.tsx src/components/pages/IamVisual.tsx
          git diff --exit-code
