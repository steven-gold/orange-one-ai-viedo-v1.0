name: SYS-01 preview final verify once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/sys01-preview-final-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source for browser tooling
        uses: actions/checkout@v4
        with:
          ref: new
          path: source
      - name: Checkout sealed preview
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          path: previewrepo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install isolated browser tooling
        working-directory: source
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Validate final sealed SYS-01 preview head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C previewrepo rev-parse HEAD)" = "7ff504c9ae939bdbdf23521242a095e7aa5462b7"
          test -f previewrepo/preview/system.html
          test -f previewrepo/preview/sys01-assets/_next/static/chunks/2-yi9nccot1u4.css
          test -f previewrepo/preview/sys01-assets/_next/static/chunks/0837kap0r0242.css
          test "$(find previewrepo/preview/sys01-assets -type f | wc -l | tr -d ' ')" = "2"
          if find previewrepo/preview/sys01-assets -type f ! -name '*.css' | grep -q .; then
            echo 'Unexpected SYS-01 preview runtime asset remains' >&2
            exit 1
          fi
          cd previewrepo/preview
          python3 -m http.server 4173 > /tmp/sys01-final-preview.log 2>&1 &
          static_pid=$!
          trap 'kill $static_pid || true; cat /tmp/sys01-final-preview.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/system.html >/dev/null; then break; fi
            sleep 1
          done
          cd ../../source
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const runtimeRequests=[]; const scriptRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/'))runtimeRequests.push(`${r.method()} ${u.pathname}`);if(r.resourceType()==='script')scriptRequests.push(u.pathname);});
            await page.goto('http://127.0.0.1:4173/system.html',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:SYS-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            assert.equal(await page.locator('html').getAttribute('data-sys01-preview-mode'),'SEALED_STATIC_FAIL_CLOSED');
            assert.equal(await root.getAttribute('data-authority-status'),'FINAL_LOCKED');
            assert.equal(await root.getAttribute('data-authority-sections'),'8');
            assert.equal(await root.getAttribute('data-authority-controls'),'12');
            assert.equal(await root.getAttribute('data-implementation-status'),'NOT_EXECUTED');
            assert.equal(await root.getAttribute('data-projection-status'),'BLOCKED');
            assert.equal(await root.getAttribute('data-projection-reason'),'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.equal(await root.getAttribute('data-system-context-resolved'),'false');
            assert.equal(await root.getAttribute('data-active-conversation-context-resolved'),'false');
            assert.equal(await root.getAttribute('data-mode-gate-ready'),'false');
            assert.equal(await root.getAttribute('data-multi-ai-route-ready'),'false');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert.equal(await root.getAttribute('data-ai-mode'),'SINGLE_AI');
            assert.equal(await page.locator('[data-section-id^="SEC-ADMIN-SYS-01-"]').count(),8);
            const controls=page.locator('[data-control-id^="SYS-01-"]');
            assert.equal(await controls.count(),12);
            for(let i=0;i<12;i++){
              const node=controls.nth(i);
              assert(await node.getAttribute('data-action-uid'));
              assert(await node.getAttribute('data-permission-uid'));
              assert(await node.getAttribute('data-enabled-in-visual-phase'));
            }
            assert.equal(await page.locator('#SYS-01-BTN-SINGLE-AI').isDisabled(),true);
            assert.equal(await page.locator('#SYS-01-BTN-MULTI-AI').isDisabled(),true);
            assert.equal(await page.locator('#SYS-01-BTN-SEND').isDisabled(),true);
            assert.equal(await page.locator('#SYS-01-BTN-CANDIDATE-CREATE').isDisabled(),true);
            assert.equal(await page.locator('script').count(),0);
            assert.deepEqual(runtimeRequests,[]);
            assert.deepEqual(scriptRequests,[]);
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('SYS01_FINAL_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('SYS01_FINAL_SEALED_PREVIEW_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
