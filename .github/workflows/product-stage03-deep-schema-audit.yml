name: Product Stage03 Deep Schema Audit
# rerun-marker: 2026-09-25-v225-post-vra-atomic
# exact-head-rerun: 2026-09-25T10:06+08:00
# schema-contract-rerun: 2026-09-25-vra-artifact-native
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/product-stage03-deep-schema-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wu:
        - WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-001
        - WU-STAGE03-WB01-DASHBOARD-001
    steps:
    - uses: actions/checkout@v4
      with: {ref: 0921acpos, fetch-depth: 1}
    - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
    - name: Audit Stage03 required-field materialization
      env: {WU: '${{ matrix.wu }}'}
      run: |
        python - <<'PY'
        from pathlib import Path
        import os,yaml,json
        b=Path('STAGE_EXECUTION/STAGE-03')/os.environ['WU']
        def y(n):
          p=b/n
          if not p.is_file(): return {}
          o=yaml.safe_load(p.read_text()) or {}
          return o if isinstance(o,dict) else {}
        findings=[]
        vd=y('VISUAL_DESIGN_SPEC_PACKAGE.yaml')
        for k in ['design_version','visual_inheritance_matrix_ref','visual_reference_annotation_ref','visual_scenario_evidence_set_ref','visual_geometry_contract_ref']:
          if not vd.get(k): findings.append('VDSP_MISSING:'+k)
        existing_visual_authority=vd.get('visual_authority_ref') or vd.get('shared_visual_authority_ref')
        if not existing_visual_authority:
          if not vd.get('visual_style_definition_ref'):
            findings.append('VDSP_MISSING_CONDITIONAL_VISUAL_STYLE_DEFINITION_REF')
        elif vd.get('visual_style_definition_ref'):
          findings.append('VDSP_UNAUTHORIZED_STYLE_DEFINITION_WHEN_EXISTING_AUTHORITY_APPLIES')
        vra=y('VISUAL_REFERENCE_ANNOTATION.yaml')
        rows=vra.get('annotations') or []
        vra_fields=vra.get('required_row_fields') or []
        if not rows: findings.append('VRA_ROWS_EMPTY')
        if not vra_fields: findings.append('VRA_REQUIRED_FIELD_MANIFEST_EMPTY')
        required_scenario_count=int(vra.get('required_scenario_count') or 0)
        if required_scenario_count<=0 or int(vra.get('annotation_count') or -1)!=required_scenario_count or len(rows)!=required_scenario_count:
          findings.append('VRA_DENOMINATOR_NOT_COMPLETE')
        if vra.get('scenario_annotation_coverage_complete') is not True:
          findings.append('VRA_SCENARIO_COVERAGE_NOT_COMPLETE')
        for i,row in enumerate(rows):
          if not isinstance(row,dict): findings.append(f'VRA_ROW_INVALID:{i}'); continue
          for k in vra_fields:
            if k not in row or row[k] in (None,'',[]): findings.append(f'VRA_ROW_{i}_MISSING:{k}')
        vim=y('VISUAL_INHERITANCE_MATRIX.yaml')
        rows=vim.get('rows') or []
        vim_fields=vim.get('required_row_fields') or []
        if not rows: findings.append('VIM_ROWS_EMPTY')
        if not vim_fields: findings.append('VIM_REQUIRED_FIELD_MANIFEST_EMPTY')
        for i,row in enumerate(rows):
          if not isinstance(row,dict): findings.append(f'VIM_ROW_INVALID:{i}'); continue
          for k in vim_fields:
            if k not in row or row[k] in (None,'',[]): findings.append(f'VIM_ROW_{i}_MISSING:{k}')
        g=y('VISUAL_GEOMETRY_CONTRACT.yaml')
        ty=g.get('typography_baseline_rows') or []
        ty_fields=g.get('typography_baseline_required_fields') or []
        if not ty: findings.append('TYPOGRAPHY_BASELINE_ROWS_EMPTY')
        if not ty_fields: findings.append('TYPOGRAPHY_REQUIRED_FIELD_MANIFEST_EMPTY')
        for i,row in enumerate(ty):
          if not isinstance(row,dict): findings.append(f'TYPO_ROW_INVALID:{i}'); continue
          for k in ty_fields:
            if k not in row or row[k] in (None,'',[]): findings.append(f'TYPO_ROW_{i}_MISSING:{k}')
        print(json.dumps({'wu':os.environ['WU'],'finding_total':len(findings),'findings':findings},ensure_ascii=False,indent=2))
        if findings: raise SystemExit(3)
        PY
