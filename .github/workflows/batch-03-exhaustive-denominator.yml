name: ACPOS Batch 03 Exhaustive Denominator Ledger

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-03-exhaustive-denominator
  cancel-in-progress: false

jobs:
  close-batch-03:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Apply exhaustive denominator ledger
        run: python __temp/batch_03_exhaustive_denominator.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          p="ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          d=Document(p)
          t="\n".join([x.text for x in d.paragraphs]+[c.text for tb in d.tables for r in tb.rows for c in r.cells])
          for n in [
            "ACPOS-20260921-BATCH-03-EXHAUSTIVE-DENOMINATOR-LEDGER-V1",
            "18-Page Denominator Summary","MACHINE_LEDGER_JSON=",
            "AIAPI-01","ASSET-01","CORE-01","DB-01","DEV-01","EDIT-01","ERP-01","IAM-01","INFO-01",
            "KB-01","QA-01","SG-02","SOC-01","STR-01","SYS-01","VIDEO-01","WB-01","ADMIN-STR-01",
            "Raw missing Action","Raw missing Gate","Raw missing Permission","Raw missing Operation","Raw missing Runtime Owner"
          ]:
              assert n in t,n
          print("PASS: BATCH-03 DENOMINATOR SEMANTIC LEDGER")
          PY

      - name: Render and geometry QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          from PIL import Image,ImageChops
          p=Path("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          qa=Path("__render_qa_batch03");pdf=qa/"pdf";png=qa/"png"
          pdf.mkdir(parents=True,exist_ok=True);png.mkdir(parents=True,exist_ok=True)
          subprocess.run(["libreoffice","--headless","--convert-to","pdf","--outdir",str(pdf),str(p)],check=True,stdout=subprocess.DEVNULL)
          pf=pdf/(p.stem+".pdf")
          info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
          pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
          od=png/p.stem;od.mkdir(parents=True,exist_ok=True)
          subprocess.run(["pdftoppm","-png","-r","120",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
          imgs=sorted(od.glob("page-*.png"));assert len(imgs)==pages
          blank=[];edge=[]
          for i,img in enumerate(imgs,1):
              im=Image.open(img).convert("RGB")
              diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
              bb=diff.getbbox()
              if bb is None: blank.append(i);continue
              l,t,r,b=bb
              if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2: edge.append(i)
          txt=subprocess.check_output(["pdftotext","-layout",str(pf),"-"],text=True,errors="replace")
          assert "ACPOS-20260921-BATCH-03-EXHAUSTIVE-DENOMINATOR-LEDGER-V1" in txt
          assert not blank,blank
          assert not edge,edge
          report={"documents":1,"pages":pages,"blank":blank,"edge":edge}
          (qa/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          print("PASS: BATCH-03 RENDER/GEOMETRY QA")
          PY

      - name: Verify exact batch-03 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={"ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"}
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-03 CHANGE SCOPE EXACT 1 WORD")
          PY

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-03-denominator-evidence
          path: __render_qa_batch03
          retention-days: 1

      - name: Commit batch 03 and clean temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch03
          git rm __temp/batch_03_exhaustive_denominator.py .github/workflows/batch-03-exhaustive-denominator.yml
          git config user.name "acpos-word-batch-03"
          git config user.email "actions@users.noreply.github.com"
          git add ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          git commit -m "docs(acpos): materialize 18-page exhaustive denominator ledger"
          git push
