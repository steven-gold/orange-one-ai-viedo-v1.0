name: CORE-01 Approved Stage02 Contract Source Migration

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/migrate_approved_stage02_contract_to_core01_source.py'

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'fix(core01): migrate approved Stage-02 contract into source authority' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify Current identity and approved predecessor materialization
        run: |
          grep -q 'GOV-REV-20260919-PROFILE-TOKEN-DECONTAMINATION-HARDENING' governance/specifications/REGISTRY.yaml
          grep -q 'WU-STAGE02-CORE01-COMPLETENESS-REMEDIATION-R3' governance/test/ACTIVE_STATE.yaml
          grep -q 'canonical_owner_materialization: true' 00_SOURCE_INTAKE/fresh_run_005/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/FUNCTIONAL_CHAIN_SPEC.yaml
      - name: Migrate approved canonical successor contracts into source authority
        run: python .github/governance-maintenance/migrate_approved_stage02_contract_to_core01_source.py
      - name: Verify migration preserved 2026-09-11 completeness source
        run: |
          grep -q 'stage02_approved_successor_source_migration:' 00_SOURCE_INTAKE/fresh_run_005/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          grep -q 'stage02_completeness_contract:' 00_SOURCE_INTAKE/fresh_run_005/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          grep -q 'binding_semantics: DATA_OR_DRAFT_STATE_ONLY' 00_SOURCE_INTAKE/fresh_run_005/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          git diff --check
      - name: Persist source authority migration
        run: |
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add 00_SOURCE_INTAKE/fresh_run_005/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(core01): persist approved Stage-02 contract source migration' \
            -m 'Execution-Authorization: USR-DIRECTIVE-20260919-CORE01-STAGE02-COMPLETENESS-R3'
          git push origin HEAD:rebuild-v2.1.1
