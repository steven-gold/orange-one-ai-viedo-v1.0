name: EDIT01 Retrigger Full Closure Once
on:
  push:
    branches: [edit01-functional-staging]
    paths: ['.github/workflows/edit01-retrigger-full-closure-once.yml']
permissions:
  contents: write
jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit01-functional-staging
          fetch-depth: 0
      - name: Retrigger full closure and self-clean
        run: |
          set -euo pipefail
          printf '\n# rerun-after-exact-correction-uids\n' >> .github/workflows/edit01-full-closure-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/edit01-retrigger-full-closure-once.yml
          git add .github/workflows/edit01-full-closure-staging.yml
          git commit -m 'test(edit): rerun full closure after exact correction UID fix'
          git push origin HEAD:edit01-functional-staging
