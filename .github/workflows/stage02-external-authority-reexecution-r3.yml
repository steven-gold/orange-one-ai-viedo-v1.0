name: Stage-02 External-Authority-Aware Fresh Reexecution R3

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/SHARED_OWNER_PORT_MAP_R3.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/**'
      - 'governance/ci/validate_current_stage2_external_authority_resolution_r3.py'
      - 'governance/ci/validate_stage02_remediation_reset_continuity_r3.py'
      - 'governance/ci/prepare_stage02_external_authority_reexecution_clean_baseline_r3.py'
      - 'governance/ci/run_current_stage2_external_authority_reexecution_r3.py'
      - 'governance/ci/validate_current_stage2_external_authority_reexecution_r3.py'
      - '.github/workflows/stage02-external-authority-reexecution-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  external-authority-aware-reexecution-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Re-prove exact 75-file governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance registry
        run: python governance/ci/governance_resolver.py

      - name: Validate canonical remediation closure protocol
        run: python governance/ci/validate_stage_test_remediation_closure_protocol.py

      - name: Validate current blocked Stage-02 successor before reset
        run: python governance/ci/validate_stage02_successor_integrity.py

      - name: Validate all owning-layer remediation including exact GAP-006 successor
        run: |
          python governance/ci/validate_current_stage2_materialized_closure.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_r3.py

      - name: Reset only R3 execution evidence while preserving verified remediation
        run: python governance/ci/prepare_stage02_external_authority_reexecution_clean_baseline_r3.py

      - name: Re-prove remediation continuity immediately after clean reset
        run: python governance/ci/validate_stage02_remediation_reset_continuity_r3.py

      - name: Run complete full-line multidirectional high-pressure SYSTEM gate
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py

      - name: Prove verified governance source remains byte-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/governance-source/active/source
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' -o -name '*.tmp' -o -name '*.bak' -o -name '*~' \) -print)"
          test -z "$bad" || { printf 'BLOCK: source runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: verified governance source remains byte-clean before R3 fresh Stage-02 reexecution'

      - name: Execute fresh external-authority-aware Stage-02 R3 reexecution
        env:
          STAGE02_FULL_LINE_CONFIRMED: '1'
        run: python governance/ci/run_current_stage2_external_authority_reexecution_r3.py

      - name: Validate fresh R3 result and known-signature zero reproduction
        run: |
          python governance/ci/validate_current_stage2_external_authority_reexecution_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_r3.py
          python governance/ci/validate_stage02_successor_integrity.py

      - name: Prove formal Current Specification and immutable Stage-01 inputs were not mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: R3 acceptance mutated only non-normative evidence/state; Stage-01 and Current Specification remain unchanged'

      - name: Commit fresh R3 evidence and synchronized blocked state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/ACTIVE_STATE.yaml
          git add governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
          git add governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json
          git add governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml
          git add governance/test/stage02/STAGE02_EXTERNAL_AUTHORITY_REEXECUTION_CLEAN_BASELINE_RECEIPT_R3.yaml
          git add governance/test/stage02/STAGE02_DEFECT_SIGNATURE_REGRESSION_R3.yaml
          git add .github/stage02-test/STAGE02_EXTERNAL_AUTHORITY_REEXECUTION_RESULT_R3.json
          if git diff --cached --quiet; then
            echo 'BLOCK: R3 fresh reexecution produced no persistent evidence/state change' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist external-authority-aware fresh reexecution R3'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R3 fresh reexecution evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-external-authority-reexecution-r3
          path: |
            .github/stage02-test/STAGE02_EXTERNAL_AUTHORITY_REEXECUTION_RESULT_R3.json
            governance/test/stage02/STAGE02_EXTERNAL_AUTHORITY_REEXECUTION_CLEAN_BASELINE_RECEIPT_R3.yaml
            governance/test/stage02/STAGE02_DEFECT_SIGNATURE_REGRESSION_R3.yaml
            governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json
            governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml
          if-no-files-found: error
