effective_normative_set_contract:
  formula: COMMON_BUNDLES + STAGE_REFS + PROFILE_REFS + ARTIFACT_SPECIFIC_REFS + DEPENDENCY_CLOSURE_REFS
  all_layers_required: true
  deduplicate_by_section_uid: true
  unresolved_or_ambiguous_ref: BLOCK
  missing_common_bundle: BLOCK
  missing_item_specific_ref: BLOCK
  extra_ref_may_influence_execution_only_after_registration: false
governance_load_receipt_contract:
  required_before_any_stage_operation: true
  required_before_code_write: true
  must_precede_execution_timestamp: true
  required_fields:
  - receipt_uid
  - execution_uid
  - run_uid
  - work_unit_or_stage_operation_uid
  - governance_revision
  - root_manifest_hash
  - common_bundle_uids
  - stage_normative_section_uids
  - profile_normative_section_uids
  - artifact_specific_normative_section_uids
  - dependency_normative_section_uids
  - effective_normative_set_hash
  - resolved_section_receipts
  - loaded_artifact_receipts
  - acceptance_audit_blueprint_ref
  - loaded_at
  - loader_version
  - status
  - section_registry_hash
  - target_manifest_hash
  resolved_section_receipt_fields:
  - section_uid
  - document_id
  - canonical_path
  - section_anchor
  - document_sha256
  status_required: PASS
  invalidate_on_governance_revision_change: true
  invalidate_on_root_manifest_hash_change: true
  invalidate_on_section_registry_hash_change: true
  invalidate_on_target_manifest_change: true
  hash_algorithm: SHA256_CANONICAL_JSON_SORTED
  effective_normative_set_hash_algorithm: SHA256_SORTED_SECTION_UIDS_NEWLINE
  receipt_must_bind_current_root_manifest_file_hash: true
  receipt_must_bind_current_section_registry_file_hash: true
  receipt_must_bind_target_manifest_hash: true
typed_uid_resolution_contract:
  uid_types:
    NORMATIVE_SECTION_UID:
      pattern: ^WEB-GOV-[0-9]{2}-S
      access:
      - READ
      write_target: false
    GOVERNANCE_REGISTRY_UID:
      pattern: ^REG-
      access:
      - READ
      - GOVERNANCE_MAINTENANCE_WRITE
      construction_write_target: false
    PROGRAM_ARTIFACT_UID:
      pattern: ^PA-
      access:
      - READ
      - WRITE_REGISTERED_TARGET_ONLY
      construction_write_target: true
  section_resolution_chain:
  - SECTION_UID
  - SECTION_NUMBER_REGISTRY
  - DOCUMENT_ID
  - CANONICAL_PATH
  - SECTION_UID_ANCHOR
  - ROOT_MANIFEST_DOCUMENT_SHA256
  exactly_one_resolution_required: true
  free_text_or_fuzzy_fallback: BLOCK
  cross_document_substitution: BLOCK
write_target_lock_contract:
  required_binding_fields:
  - program_artifact_uid
  - work_unit_uid
  - page_uid_or_scope_uid
  - owner_uid
  - construction_profile
  - canonical_path
  - canonical_filename
  - expected_current_hash
  - producer_stage_uid
  actual_target_must_equal_registered_canonical_target: true
  valid_other_registered_artifact_is_not_valid_target: true
  normative_document_write_during_construction: BLOCK
  governance_registry_write_during_construction: BLOCK
  unregistered_write_target: BLOCK
  prewrite_hash_mismatch: BLOCK
governance_revision: v2.2.6-profile-token-decontamination-hardening
reference_rule_registry_ref: REG-REFERENCE-RULE-001
semantic_authority_baseline_ref: REG-SEMANTIC-AUTHORITY-BASELINE-001
typed_identity_authority_registry_ref: REG-PROGRAM-IDENTITY-AUTHORITY-001
typed_runtime_reference_contract:
  registry_ref: REG-PROGRAM-IDENTITY-AUTHORITY-001
  fields:
    program_artifact_uid: PROGRAM_ARTIFACT
    work_unit_uid: WORK_UNIT
    page_uid_or_scope_uid: PAGE_OR_SCOPE
