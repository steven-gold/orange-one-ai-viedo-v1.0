authority:
  id: CORE_PAGE_VISUAL_AUTHORITY_FINAL
  page_uid: CORE-01
  version: V2.0
  status: FINAL_LOCKED
  current_only: true
  legacy_merge: FORBIDDEN
  route: /core
  scope: CORE-01 Main Workspace only
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY@V1.9
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY@V1.0
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  vertical_length: UNBOUNDED; Main Workspace overflow-y:auto; sections extend downward by content
  department_boundary: CORE owns Project Core + Topic Production Scope/Canonical Script source; ASSET/VIDEO/EDIT/VOICE internals are not defined
    here
  parallel_authority_for_same_page: FORBIDDEN
  system_authority: ACPOS_SYSTEM_AUTHORITY@V1.0
  navigation_authority: ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY@V1.0
  production_script_authority: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.3
creation_authorization_policy:
  source: USER_CURRENT_REQUIREMENT_2026-08-31
  scope:
  - CORE-01-ACT-PROJECT-CREATE
  - CORE-01-ACT-TOPIC-CREATE
  account_identity_source: Authenticated current account resolved by IAM-01 / account permission runtime
  required_permissions:
    CORE-01-ACT-PROJECT-CREATE: CORE_PROJECT_WRITE
    CORE-01-ACT-TOPIC-CREATE: CORE_TOPIC_WRITE
  authorization_order: Resolve authenticated account -> resolve exact registered permission -> only then open registered draft form/schema -> gate -> mutation
  iam_not_ready_behavior: BLOCK
  unauthenticated_behavior: BLOCK
  missing_permission_behavior: BLOCK
  test_only_permission_bypass: FORBIDDEN
  control_behavior_when_denied: Control remains clickable for permission evaluation; creation mutation is forbidden; show denial in existing Runtime Stage Strip.
  denial_reason_codes:
  - AUTHENTICATED_ACCOUNT_REQUIRED
  - IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND
  - REQUIRED_PERMISSION_MISSING
  denial_notice_zh_tw: 建立功能已拒絕：必須由已登入帳號通過帳號權限驗證；帳號權限系統尚未完成或目前帳號缺少所需權限。
  security_rule: Client denial is UX only; server authorization is mandatory and direct API bypass must also be denied.
system_filename_governance:
  authority: ACPOS_SYSTEM
  level: GLOBAL_SYSTEM_HIGHEST_RULE
  core_page_behavior: READ_ONLY_REFERENCE_ONLY
  core_supplies:
  - project_id / project_version_ref
  - topic_id / topic_version_ref
  - blueprint_version_ref
  - dna_refs
  - canonical_script_ref
  - production_package_ref
  forbidden:
  - CORE-local filename formula
  - manual filename input
  - manual rename
  - filename parsing as business authority
  - department-local naming override
  rule: Canonical filename / artifact identity / version / checksum naming governance belongs to ACPOS_SYSTEM. CORE only supplies upstream source
    identity refs; downstream departments consume exact IDs/versions and system-issued canonical filenames.
layout:
  desktop_min_width: 1280px
  page_vertical: Main Workspace is NOT bound to Global Sidebar/Menu height; height:auto; overflow-y:auto; sections extend downward
  below_min_width: Keep min-width=1280px and allow horizontal scroll; do not invent alternate page/drawer/mobile workflow
  context_bar:
    height: 56px
    width: 100%
  primary_grid:
    columns: minmax(260px,1fr) minmax(720px,3fr) minmax(300px,1fr)
    approx: 20% / 60% / 20%
    gap: 16px
    align: start
  left_rail:
    min_width: 260px
    position: top-aligned
    thread_list_internal_scroll: only when list content > 520px
  center:
    min_width: 720px
    priority: conversation-first
  right_rail:
    min_width: 300px
    position: top-aligned
  tokens:
    control_height: 40px
    button_min_width: 88px
    primary_button_min_width: 120px
    button_radius: 10px
    panel_radius: 12px
    large_container_radius: 24px
    section_gap: 16px
    content_padding: 16px
    field_min_width: 120px
    textarea_min_height: 96px
    status_badge_height: 28px
    action_gap: 8px
    touch_target_min: 44px × 44px
    at_popup_width: 250px
    at_popup_row_height: 36px
  visual_override: FORBIDDEN; inherit Global Visual tokens only
page_modes:
  PROJECT_CORE:
    enter_when: Project selected; Topic not selected
    purpose: 建立/討論/修正/確認 Project Core
    editable_work_items:
    - STORY
    - CHAPTER
    - WORLD_SETTING
    - DNA
    - BLUEPRINT
    read_only_context:
    - Project metadata
    - Current confirmed versions
    - Naming Authority Ref
    topic_rule: Create Topic is enabled only after Project has the required confirmed/locked source state; Topic does not recreate Story/World/DNA/Blueprint.
  TOPIC_PRODUCTION:
    enter_when: Locked/confirmed Project + valid Topic selected
    purpose: 讀取 Project Canon/Blueprint，設定 Topic production scope，建立/確認 Canonical Production Script source/package readiness
    editable_work_items:
    - TOPIC_SCOPE
    - PRODUCTION_SCRIPT
    read_only_upstream:
    - STORY
    - CHAPTER
    - WORLD_SETTING
    - DNA
    - BLUEPRINT
    production_task_selector: FORBIDDEN in CORE page
    downstream_rule: Expose read-only ASSET / VIDEO / EDIT boundary readiness only; no downstream execution controls or internals.
conversation_policy:
  single_multi_same_context: true
  assistant_is_third_mode: false
  provider_model_picker: FORBIDDEN
  assigned_ai_set: Resolved by ACPOS shared AI Router/Capability Assignment; page read-only
  right_click_message_actions:
  - 引用此訊息
  - 繼續討論此主題
  - 分析此內容
  - 加入決策清單
  - 建立分支討論
  - 複製此訊息
  hover_message_toolbar: FORBIDDEN
  branch_discussion_is_production_topic: false
  same_problem_rule: All selected AI receive the same Original User Question plus the same Exact Relevant Context for the current turn.
  exact_relevant_context:
  - Project
  - Topic if applicable
  - Work Item
  - Thread
  - Attachment refs
  - Reference refs
  - Context Package
  response_traceability: Every Single/Multi AI response remains bound to the same governed conversation_id/thread_id, original question identity, exact context fingerprint and source response identity.
  mode_fluidity: Switching SINGLE/MULTI inside the same Conversation MUST NOT create a new Work Item, Topic, Thread, Candidate or Version solely because AI participation changed.
  finalization_reentry: All Single/Multi/branch messages remain Conversation Evidence and re-enter the single Conversation Finalization Pipeline.
decision_flow:
- AI_RESPONSES
- ASSISTANT_SUMMARY
- CORE_EVALUATION
- HUMAN_DECISION
- ASSISTANT_STRUCTURED_DECISION
- CANDIDATE_CREATE
- CANDIDATE_DECISION
- DOMAIN_REVIEW_REQUEST_IF_APPLICABLE
registries:
  sections:
  - section_uid: CORE-01-SEC-01
    name: Context Bar
    responsibility: Project / Topic exact context; create/select; page mode derived; naming authority read-only ref
    visual_uid: CORE-01-VIS-CONTEXT
  - section_uid: CORE-01-SEC-02
    name: Work Item / Thread Navigation
    responsibility: Current mode work items, thread list, new thread; cross-work-item mixing forbidden
    visual_uid: CORE-01-VIS-LEFT
  - section_uid: CORE-01-SEC-03
    name: Conversation Header
    responsibility: Current work item, Single/Multi AI, Assigned AI Set read-only, Assistant Record
    visual_uid: CORE-01-VIS-CENTER-HEADER
  - section_uid: CORE-01-SEC-04
    name: Message Workspace
    responsibility: User/AI/System/Assistant messages; right-click message operation menu
    visual_uid: CORE-01-VIS-MESSAGES
  - section_uid: CORE-01-SEC-05
    name: Evaluation / Human Decision
    responsibility: Assistant Summary, approved CORE evaluation, human decision, structured decision, candidate decision
    visual_uid: CORE-01-VIS-DECISION
  - section_uid: CORE-01-SEC-06
    name: Runtime Stage Strip
    responsibility: Current conversational decision stage only; domain lock remains right-rail governed
    visual_uid: CORE-01-VIS-RUNTIME
  - section_uid: CORE-01-SEC-07
    name: Input Composer
    responsibility: Attachment/reference/message/@ parser/send; no page-level provider/model picker
    visual_uid: CORE-01-VIS-COMPOSER
  - section_uid: CORE-01-SEC-08
    name: Project Core / Blueprint State Rail
    responsibility: Read model + permitted Project/DNA/Blueprint review actions
    visual_uid: CORE-01-VIS-RIGHT-CORE
  - section_uid: CORE-01-SEC-09
    name: Topic Production Package / Downstream Readiness
    responsibility: Topic scope, Canonical Script, naming authority ref, ASSET/VIDEO/EDIT readiness read-only
    visual_uid: CORE-01-VIS-RIGHT-TOPIC
  - section_uid: CORE-01-SEC-10
    name: Version / Lock Review State Rail
    responsibility: Candidate/version compare state, immutable version refs, project/topic lock review status
    visual_uid: CORE-01-VIS-RIGHT-VERSION
  visuals:
  - visual_uid: CORE-01-VIS-CONTEXT
    geometry: top full width; h=56px
  - visual_uid: CORE-01-VIS-LEFT
    geometry: primary grid left ~20%; min 260px; content-height; thread list may internally scroll >520px
  - visual_uid: CORE-01-VIS-CENTER-HEADER
    geometry: primary grid center top; min 720px
  - visual_uid: CORE-01-VIS-MESSAGES
    geometry: center main; min-height 420px; grows with content; message history may internally scroll after configured max while page remains
      scrollable
  - visual_uid: CORE-01-VIS-DECISION
    geometry: center below messages; full center width; content-height
  - visual_uid: CORE-01-VIS-RUNTIME
    geometry: center below decision; h=40px; horizontal stage strip
  - visual_uid: CORE-01-VIS-COMPOSER
    geometry: center below runtime; min-height 104px; content-height
  - visual_uid: CORE-01-VIS-RIGHT-CORE
    geometry: primary grid right top ~20%; min 300px
  - visual_uid: CORE-01-VIS-RIGHT-TOPIC
    geometry: right rail below Project Core/Blueprint; content-height
  - visual_uid: CORE-01-VIS-RIGHT-VERSION
    geometry: right rail below Topic package; content-height
  components:
  - component_uid: CORE-01-CMP-CONTEXT
    section_uid: CORE-01-SEC-01
    name: Project/Topic Context Controls
  - component_uid: CORE-01-CMP-NAV
    section_uid: CORE-01-SEC-02
    name: Mode-aware Work Item Navigation
  - component_uid: CORE-01-CMP-THREADS
    section_uid: CORE-01-SEC-02
    name: Conversation Thread History
  - component_uid: CORE-01-CMP-CONV-HEADER
    section_uid: CORE-01-SEC-03
    name: Conversation Header / AI Mode
  - component_uid: CORE-01-CMP-MESSAGES
    section_uid: CORE-01-SEC-04
    name: Message Stream
  - component_uid: CORE-01-CMP-MESSAGE-MENU
    section_uid: CORE-01-SEC-04
    name: Right-click Message Operation Menu
  - component_uid: CORE-01-CMP-SUMMARY
    section_uid: CORE-01-SEC-05
    name: Assistant Summary
  - component_uid: CORE-01-CMP-EVALUATION
    section_uid: CORE-01-SEC-05
    name: CORE Evaluation
  - component_uid: CORE-01-CMP-HUMAN-DECISION
    section_uid: CORE-01-SEC-05
    name: Human Decision / Structured Decision
  - component_uid: CORE-01-CMP-RUNTIME
    section_uid: CORE-01-SEC-06
    name: Runtime Stage Strip
  - component_uid: CORE-01-CMP-COMPOSER
    section_uid: CORE-01-SEC-07
    name: Message Composer
  - component_uid: CORE-01-CMP-PROJECT-STATE
    section_uid: CORE-01-SEC-08
    name: Project Core State Card
  - component_uid: CORE-01-CMP-BLUEPRINT-STATE
    section_uid: CORE-01-SEC-08
    name: Blueprint State Card
  - component_uid: CORE-01-CMP-TOPIC-PACKAGE
    section_uid: CORE-01-SEC-09
    name: Topic Production Package Card
  - component_uid: CORE-01-CMP-DOWNSTREAM
    section_uid: CORE-01-SEC-09
    name: ASSET/VIDEO/EDIT Boundary Readiness
  - component_uid: CORE-01-CMP-VERSION
    section_uid: CORE-01-SEC-10
    name: Candidate / Version Compare Card
  - component_uid: CORE-01-CMP-LOCK-REVIEW
    section_uid: CORE-01-SEC-10
    name: Lock Review Status / Request Controls
  permissions:
  - permission_uid: CORE_USE
    backend_scope: page.view
    purpose: Enter CORE-01 / read projection
  - permission_uid: CORE_CONVERSATION
    backend_scope: conversation.write
    purpose: Create thread/send message
  - permission_uid: CORE_CANDIDATE_CREATE
    backend_scope: candidate.create
    purpose: Create candidate from confirmed decision context
  - permission_uid: CORE_CANDIDATE_DECIDE
    backend_scope: candidate.decide
    purpose: Accept/reject immutable candidate
  - permission_uid: CORE_PROJECT_WRITE
    backend_scope: entity.write + core.project.write
    purpose: Create/validate Project draft; submit core review
  - permission_uid: CORE_PROJECT_CONFIRM
    backend_scope: core.project.confirm
    purpose: Confirm Project draft into core modeling
  - permission_uid: CORE_STORY_WRITE
    backend_scope: core.story.write
    purpose: Create Story Candidate Set
  - permission_uid: CORE_DNA_LOCK
    backend_scope: dna.lock.request
    purpose: Request DNA lock review
  - permission_uid: CORE_BLUEPRINT_WRITE
    backend_scope: core.blueprint.write
    purpose: Create/modify Blueprint through registered operations
  - permission_uid: CORE_BLUEPRINT_REVIEW
    backend_scope: core.blueprint.review
    purpose: Validate Blueprint
  - permission_uid: CORE_BLUEPRINT_APPROVE
    backend_scope: core.blueprint.approve
    purpose: Approve Blueprint to child-review readiness
  - permission_uid: CORE_LOCK_REQUEST
    backend_scope: core.lock.request
    purpose: Request Mother/Child lock review
  - permission_uid: CORE_TOPIC_WRITE
    backend_scope: entity.write
    purpose: Create Topic from valid Project/Topic draft lineage
  - permission_uid: CORE_SCRIPT_READ
    backend_scope: core.script.read
    purpose: Read Canonical Production Script
  gates:
  - gate_uid: CORE-01-GATE-PAGE
    condition: Authorized CORE-01 page + exact user/project scope
  - gate_uid: CORE-01-GATE-PROJECT-CONTEXT
    condition: Exact Project ref/version resolved; no stale context
  - gate_uid: CORE-01-GATE-PROJECT-DRAFT
    condition: Project draft fields satisfy registered createProjectDraft contract
  - gate_uid: CORE-01-GATE-PROJECT-CONFIRM
    condition: Validated Project Draft + exact adopt refs + expected_version pass
  - gate_uid: CORE-01-GATE-PROJECT-CORE-READY
    condition: Project Core required Story/Chapter/World/DNA/Blueprint refs are confirmed per current authority; no unresolved hard block
  - gate_uid: CORE-01-GATE-PROJECT-LOCK-READY
    condition: Project is eligible for registered Mother Lock request; unresolved LockReview evidence/reviewer-path contract stays BLOCKED
  - gate_uid: CORE-01-GATE-TOPIC-CREATE
    condition: Project source is confirmed/locked as required + valid Topic draft/contract lineage exists; no fake topic_code/boundary/bridge
  - gate_uid: CORE-01-GATE-TOPIC-CONTEXT
    condition: Exact Topic belongs to current Project and is not stale
  - gate_uid: CORE-01-GATE-WORK-ITEM
    condition: Selected work item is allowed by current mode; cross-mode edit forbidden
  - gate_uid: CORE-01-GATE-THREAD
    condition: Project + mode work item resolved; thread scope matches current context
  - gate_uid: CORE-01-GATE-MESSAGE
    condition: Active thread + non-empty message + conversation permission; provider/model manual selection absent
  - gate_uid: CORE-01-GATE-MULTI-AI
    condition: Assigned AI Set / capability route resolved by ACPOS shared Router; page cannot assign provider/model
  - gate_uid: CORE-01-GATE-SUMMARY
    condition: AI response set belongs to current context/thread and is complete enough for Assistant Summary
  - gate_uid: CORE-01-GATE-EVALUATION
    condition: Approved CORE Criteria Version resolved for current target + evidence refs valid
  - gate_uid: CORE-01-GATE-HUMAN-DECISION
    condition: Summary + evaluation ready; no stale candidate/context
  - gate_uid: CORE-01-GATE-CANDIDATE-CREATE
    condition: Structured human decision confirmed + exact source refs + immutable parent/version lineage
  - gate_uid: CORE-01-GATE-CANDIDATE-DECIDE
    condition: Current immutable Candidate exists + decision reason/evidence valid
  - gate_uid: CORE-01-GATE-STORY
    condition: Project mode + exact project version + story candidate request valid
  - gate_uid: CORE-01-GATE-DNA-LOCK
    condition: Project mode + exact DNA Candidate Version eligible for registered lock request
  - gate_uid: CORE-01-GATE-BLUEPRINT-CREATE
    condition: Current Topic/Project source satisfies registered createBlueprint precondition; no legacy page inference
  - gate_uid: CORE-01-GATE-BLUEPRINT-VALIDATE
    condition: Exact Blueprint Version in BLUEPRINT_DRAFT and review permission
  - gate_uid: CORE-01-GATE-BLUEPRINT-APPROVE
    condition: Exact Blueprint Version in BLUEPRINT_REVIEW and approval permission
  - gate_uid: CORE-01-GATE-CHILD-LOCK
    condition: Exact Blueprint/Topic package eligible for Child Lock request; unresolved lock review contract stays BLOCKED
  - gate_uid: CORE-01-GATE-CORE-REVIEW
    condition: Project Core candidate refs complete for submitCoreReview
  - gate_uid: CORE-01-GATE-CANONICAL-SCRIPT
    condition: Topic mode + exact Topic ref + canonical script exists; read-only
  - gate_uid: CORE-01-GATE-NAMING
    condition: ACPOS_SYSTEM Naming Authority Ref resolvable; page cannot invent filename
  errors:
  - error_uid: CORE-01-ERR-CONTEXT-001
    context: Project/Topic context missing, mismatched or stale
    recovery: Reset to exact Project; disable mutations until context resolves
  - error_uid: CORE-01-ERR-TOPIC-LINEAGE-001
    context: createTopic canonical lineage incomplete
    recovery: BLOCK Topic create; do not fabricate topic_code/boundary/bridge
  - error_uid: CORE-01-ERR-WORK-ITEM-001
    context: Work item not valid for current mode
    recovery: BLOCK edit; switch to permitted Project/Topic work item
  - error_uid: CORE-01-ERR-THREAD-001
    context: Thread belongs to another work item/context
    recovery: Do not mix history; load matching thread or create new thread
  - error_uid: CORE-01-ERR-AI-ROUTE-001
    context: Assigned AI Set/capability route unavailable
    recovery: BLOCK send/multi execution that needs route; wait system Router
  - error_uid: CORE-01-ERR-CONVERSATION-001
    context: Conversation write/generation failed
    recovery: Preserve thread/draft; show real error/retry eligibility
  - error_uid: CORE-01-ERR-CRITERIA-001
    context: CORE criteria version missing/not approved
    recovery: BLOCK evaluation; no generic score schema fallback
  - error_uid: CORE-01-ERR-DECISION-001
    context: Human decision missing/invalid/stale
    recovery: Return to decision; do not create/decide Candidate
  - error_uid: CORE-01-ERR-CANDIDATE-001
    context: Candidate source refs/version lineage invalid
    recovery: BLOCK decision/lock; create a new valid Candidate only
  - error_uid: CORE-01-ERR-VERSION-001
    context: Attempt to overwrite confirmed/immutable version
    recovery: BLOCK overwrite; append new Candidate/Version only
  - error_uid: CORE-01-ERR-DNA-LOCK-001
    context: DNA lock precondition/permission invalid
    recovery: Disable request + show exact blocker
  - error_uid: CORE-01-ERR-BLUEPRINT-001
    context: Blueprint operation state/ref invalid
    recovery: BLOCK operation; preserve last valid Blueprint Version
  - error_uid: CORE-01-ERR-LOCK-CONTRACT-001
    context: LockReview required evidence/reviewer-path/expected hash cannot be resolved
    recovery: BLOCK lock request/decision; do not fabricate IDs or reviewer
  - error_uid: CORE-01-ERR-NAMING-001
    context: ACPOS_SYSTEM Naming Authority Ref unavailable
    recovery: BLOCK downstream package readiness; no CORE-local filename fallback
  - error_uid: CORE-01-ERR-PERM-001
    context: Permission/scope denied
    recovery: For Project/Topic creation keep the control clickable for permission evaluation, block mutation, and show the actual permission reason in the existing Runtime Stage Strip; other controls follow registered permission behavior.
  - error_uid: CORE-01-ERR-UNDEFINED-001
    context: Unlisted Section/Component/Control/Action/Gate/State/Port requested
    recovery: BLOCK + REPORT_AUTHORITY_GAP; AI may not fill gap
  page_states:
  - state_uid: CORE-01-ST-EMPTY
    display: EMPTY
    definition: No Project selected
  - state_uid: CORE-01-ST-READY
    display: READY
    definition: Exact Project/Topic/work item/thread context ready
  - state_uid: CORE-01-ST-RESPONDING
    display: RESPONDING
    definition: Conversation request/AI response active
  - state_uid: CORE-01-ST-EVALUATING
    display: EVALUATING
    definition: Assistant summary / CORE evaluation processing
  - state_uid: CORE-01-ST-WAIT-HUMAN
    display: WAIT_HUMAN_DECISION
    definition: Summary/evaluation ready; waiting human decision
  - state_uid: CORE-01-ST-CANDIDATE
    display: CANDIDATE_READY
    definition: Immutable candidate exists and awaits/has decision
  - state_uid: CORE-01-ST-REVIEW
    display: REVIEW_PENDING
    definition: Project/DNA/Blueprint/Topic package lock review requested
  - state_uid: CORE-01-ST-LOCKED
    display: LOCKED
    definition: Current domain object projection reports authoritative lock/confirmed immutable state
  - state_uid: CORE-01-ST-ERROR
    display: ERROR/BLOCKED
    definition: Real contract/runtime/permission error
  stages:
  - stage_uid: CORE-01-STAGE-01-CONTEXT
    name: Resolve Context
    flow: Resolve Project/Topic/work item/thread + assigned AI route refs; no provider picker.
  - stage_uid: CORE-01-STAGE-02-CONVERSE
    name: Converse / Analyze
    flow: User input → shared AI routing → Single/Multi responses; no formal data write from raw AI response.
  - stage_uid: CORE-01-STAGE-03-SUMMARY-EVAL
    name: Assistant Summary / CORE Evaluation
    flow: Assistant summary + task-bound approved CORE criteria/evidence.
  - stage_uid: CORE-01-STAGE-04-HUMAN-DECIDE
    name: Human Decision
    flow: Human decision → Assistant structured decision → final confirm or return modify.
  - stage_uid: CORE-01-STAGE-05-CANDIDATE
    name: Candidate / Domain Review Ready
    flow: Create/decide immutable Candidate; domain-specific Project/DNA/Blueprint/Topic lock request remains gated by its registered action.
  events:
  - event_uid: CORE-01-EVT-CONTEXT-RESOLVED
    event: context.resolved
  - event_uid: CORE-01-EVT-CONVERSATION-SENT
    event: conversation.message.sent
  - event_uid: CORE-01-EVT-AI-RESPONSES-READY
    event: ai.responses.ready
  - event_uid: CORE-01-EVT-EVALUATION-READY
    event: core.evaluation.ready
  - event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    event: human.decision.confirmed
  - event_uid: CORE-01-EVT-CANDIDATE-CREATED
    event: candidate.created
  - event_uid: CORE-01-EVT-CANDIDATE-DECIDED
    event: candidate.decided
  stage_transitions:
  - transition_uid: CORE-01-STTR-01
    from_stage: CORE-01-STAGE-01-CONTEXT
    to_stage: CORE-01-STAGE-02-CONVERSE
    trigger_event_uid: CORE-01-EVT-CONTEXT-RESOLVED
    gate_uid: CORE-01-GATE-WORK-ITEM
  - transition_uid: CORE-01-STTR-02
    from_stage: CORE-01-STAGE-02-CONVERSE
    to_stage: CORE-01-STAGE-03-SUMMARY-EVAL
    trigger_event_uid: CORE-01-EVT-AI-RESPONSES-READY
    gate_uid: CORE-01-GATE-SUMMARY
  - transition_uid: CORE-01-STTR-03
    from_stage: CORE-01-STAGE-03-SUMMARY-EVAL
    to_stage: CORE-01-STAGE-04-HUMAN-DECIDE
    trigger_event_uid: CORE-01-EVT-EVALUATION-READY
    gate_uid: CORE-01-GATE-EVALUATION
  - transition_uid: CORE-01-STTR-04
    from_stage: CORE-01-STAGE-04-HUMAN-DECIDE
    to_stage: CORE-01-STAGE-02-CONVERSE
    trigger_event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    gate_uid: CORE-01-GATE-HUMAN-DECISION
  - transition_uid: CORE-01-STTR-05
    from_stage: CORE-01-STAGE-04-HUMAN-DECIDE
    to_stage: CORE-01-STAGE-05-CANDIDATE
    trigger_event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    gate_uid: CORE-01-GATE-CANDIDATE-CREATE
  objects_refs:
  - object_uid: CORE-01-REF-PROJECT
    entity: ProjectRef
    owner: ACPOS Project
    required_content: exact project id/version/status/source hash
  - object_uid: CORE-01-REF-TOPIC
    entity: TopicRef
    owner: ACPOS Topic
    required_content: exact topic id/version/project lineage/contract refs
  - object_uid: CORE-01-OBJ-THREAD
    entity: ConversationThread
    owner: AI Conversation Core
    required_content: project/topic/work_item/thread id + history scope
  - object_uid: CORE-01-OBJ-MESSAGE
    entity: ConversationMessage
    owner: AI Conversation Core
    required_content: message id/type/thread/source refs/version
