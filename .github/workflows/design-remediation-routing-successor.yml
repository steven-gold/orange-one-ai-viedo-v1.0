name: Design Remediation Routing Governance Successor

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-DESIGN-REMEDIATION-ROUTING-HARDENING-R3.yaml'

permissions:
  contents: write

jobs:
  materialize-authorized-successor:
    if: "${{ github.event.head_commit.message == 'chore(governance): authorize design remediation routing successor R3' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Assert exact authorization parent and current governance
        shell: bash
        run: |
          set -euo pipefail
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-DESIGN-REMEDIATION-ROUTING-HARDENING-R3.yaml
          grep -q 'GOV-REV-20260918-RESIDUAL-CLASSIFICATION-HARDENING' governance/specifications/REGISTRY.yaml
          test -f .github/governance-maintenance/materialize_design_remediation_routing_successor.py
      - name: Materialize authorized successor and targeted validation
        run: python .github/governance-maintenance/materialize_design_remediation_routing_successor.py
      - name: Verify transaction hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/governance-maintenance/materialize_design_remediation_routing_successor.py
          test ! -e .github/workflows/design-remediation-routing-successor.yml
          test ! -d governance/test/temporary
          git status --short
      - name: Persist atomic successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "feat(governance): promote design remediation routing hardening" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260918-MOTHER-DESIGN-REMEDIATION-ROUTING-HARDENING-R3" \
            -m "Spec-Change-Scope: MOTHER_DESIGN_REMEDIATION_ROUTING_HARDENING"
          git push origin HEAD:rebuild-v2.1.1
