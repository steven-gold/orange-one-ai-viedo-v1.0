name: STR-01 workspace closure validation

on:
  push:
    branches: [acpos-strws01-closure-20260902]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and audit
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: STR authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          auth=Path('authority/pages/workspace/STR-01/ACPOS_STR-01_FINAL_LOCKED_ENCODING_PROVIDER_BOUND.yaml').read_text()
          src='\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*') if p.is_file())
          bindings=Path('src/domain/strategy/strategyControlBindings.ts').read_text()
          contract=Path('src/domain/strategy/strategyRuntimeContract.ts').read_text()
          catalog=Path('src/i18n/strategyCatalog.ts').read_text()
          pats={
            'sections':r'^\s*-?\s*section_uid:\s*(STR-01-SEC-[A-Z0-9-]+)',
            'visuals':r'^\s*-?\s*visual_uid:\s*(STR-01-VIS-[A-Z0-9-]+)',
            'components':r'^\s*-?\s*component_uid:\s*(STR-01-CMP-[A-Z0-9-]+)',
            'permissions':r'^\s*-?\s*permission_uid:\s*(STR_[A-Z0-9_]+)',
            'gates':r'^\s*-?\s*gate_uid:\s*(STR-01-GATE-[A-Z0-9-]+)',
            'errors':r'^\s*-?\s*error_uid:\s*(STR-01-ERR-[A-Z0-9-]+)',
            'states':r'^\s*-?\s*state_uid:\s*(STR-01-ST-[A-Z0-9_-]+)',
            'stages':r'^\s*-?\s*stage_uid:\s*(STR-01-STAGE-[A-Z0-9-]+)',
            'actions':r'^\s*-?\s*action_uid:\s*(STR-01-ACT-[A-Z0-9-]+)',
            'objects':r'^\s*-?\s*object_uid:\s*(STR-01-OBJ-[A-Z0-9-]+)',
            'controls':r'^\s*-?\s*control_uid:\s*(STR-01-[A-Z0-9-]+)',
            'ports':r'^\s*-?\s*port_uid:\s*(STR-01-PORT-[A-Z0-9-]+)',
          }
          expected={'sections':12,'visuals':12,'components':16,'permissions':5,'gates':11,'errors':9,'states':9,'stages':6,'actions':11,'objects':12,'controls':57,'ports':6}
          ids={k:set(re.findall(p,auth,re.M)) for k,p in pats.items()}; failed=False
          provider_send_alias='STR-01-PORT-SEND'
          if provider_send_alias in ids['ports']:
            ids['ports'].remove(provider_send_alias)
          for k,v in ids.items():
            print(k,len(v),sorted(v))
            if len(v)!=expected[k]: print('COUNT_MISMATCH',k,len(v),expected[k]); failed=True
            missing=sorted(x for x in v if x not in src)
            print('source_missing',k,len(missing),missing)
            if missing: failed=True
          print('provider_send_alias',provider_send_alias,provider_send_alias in src)
          if provider_send_alias not in src: failed=True
          controls=set(re.findall(r'"(STR-01-[A-Z0-9-]+)":\{"action_uid"',bindings))
          print('binding_controls',len(controls))
          if controls!=ids['controls']:
            print('CONTROL_BINDING_SET_MISMATCH',sorted(ids['controls']-controls),sorted(controls-ids['controls'])); failed=True
          for uid in ids['controls']:
            if uid not in catalog: print('CATALOG_CONTROL_MISSING',uid); failed=True
          if 'provider_picker: FORBIDDEN' not in auth: print('PROVIDER_PICKER_BOUNDARY_MISSING'); failed=True
          if 'new_controls: 0' not in auth or 'new_actions: 0' not in auth or 'new_ports: 0' not in auth: print('PROVIDER_BINDING_ADDED_SURFACE'); failed=True
          if 'STRATEGY_PORT_COUNT=STRATEGY_PORT_UIDS.length' not in contract: print('FORMAL_PORT_COUNT_CONTRACT_MISSING'); failed=True
          if failed: sys.exit(1)
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production STR must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3121 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/str-prod.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3121/strategy >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/str-prod.json -w '%{http_code}' 'http://127.0.0.1:3121/v1/ui-projections/workspace%3ASTR-01')
          cat /tmp/str-prod.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/str-prod.json
          ! grep -q 'TEST_ONLY' /tmp/str-prod.json
          ! grep -q 'production_eligible' /tmp/str-prod.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled STR browser interactions
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        shell: bash
        run: |
          set -euo pipefail
          PORT=3122 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/str-controlled.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3122/strategy >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/str-controlled.json -w '%{http_code}' 'http://127.0.0.1:3122/v1/ui-projections/workspace%3ASTR-01')
          cat /tmp/str-controlled.json
          test "$code" = "200"
          grep -q '"data_classification":"TEST_ONLY"' /tmp/str-controlled.json
          grep -q '"production_eligible":false' /tmp/str-controlled.json
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:900}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3122/strategy',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`STR route ${res&&res.status()} at ${width}`);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>0)throw new Error(`STR horizontal overflow ${overflow} at ${width}`);
              const count=await page.locator('[data-control-id]').count();
              if(count!==57)throw new Error(`STR control count ${count} at ${width}`);
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3122/strategy',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="workspace:STR-01"]');
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="workspace:STR-01"]')?.getAttribute('data-page-state')==='READY');
            if((await root.getAttribute('data-registry-valid'))!=='true')throw new Error('STR registry invalid');
            if((await q('STR-01-FLD-ACTUAL').locator('strong').textContent())!=='—')throw new Error('Missing actual result must remain —');
            if((await q('STR-01-FLD-EXECUTION-STATE').locator('strong').textContent())!=='OWNER_EXECUTION_NOT_PERFORMED')throw new Error('Owner execution truth missing');
            const body=(await page.locator('body').textContent())||'';
            if(/provider\s*(picker|select)|model\s*(picker|select)/i.test(body))throw new Error('Forbidden provider/model picker present');
            const attachment=q('STR-01-BTN-ATTACH');
            if(!(await attachment.isDisabled()))throw new Error('Attachment must fail closed without registered shared attachment binding');
            if((await attachment.getAttribute('data-disabled-reason'))!=='STRATEGY_ATTACHMENT_FLOW_NOT_BOUND')throw new Error('Attachment missing explicit fail-closed reason');
            const search=q('STR-01-INP-TOPIC-SEARCH');await search.fill('Capacity');
            if(await q('STR-01-LST-TOPICS').getByRole('button',{name:'[TEST] Market expansion strategy'}).count())throw new Error('Topic search did not filter non-matching topic');
            if(await q('STR-01-LST-TOPICS').getByRole('button',{name:'[TEST] Capacity risk strategy'}).count()!==1)throw new Error('Topic search removed matching topic');
            await search.fill('');
            const topic=q('STR-01-LST-TOPICS').getByRole('button',{name:'[TEST] Market expansion strategy'});
            if(await topic.count()!==1||await topic.isDisabled())throw new Error('Topic selection unavailable');
            await topic.click();
            const multi=q('STR-01-TGL-MODE').getByRole('button',{name:'Multi AI'});
            if(await multi.isDisabled())throw new Error('Multi AI unavailable with governed route');
            await multi.click();
            if((await root.getAttribute('data-strategy-mode'))!=='MULTI_AI')throw new Error('Multi AI mode did not switch');
            const msg=q('STR-01-INP-MESSAGE');
            if(await msg.isDisabled())throw new Error('Message composer disabled after topic/context ready');
            await msg.fill('TEST strategic question');
            const send=q('STR-01-BTN-SEND');if(await send.isDisabled())throw new Error('Send disabled with valid message');
            const sendWait=page.waitForResponse(r=>r.url().includes('/messages')&&r.request().method()==='POST');
            await send.click();const sendRes=await sendWait;if(sendRes.status()!==200)throw new Error(`Send HTTP ${sendRes.status()}`);
            const sendBody=await sendRes.json();if(sendBody.test_metadata?.data_classification!=='TEST_ONLY'||sendBody.test_metadata?.production_eligible!==false)throw new Error('Send response not TEST_ONLY');
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="workspace:STR-01"]')?.getAttribute('data-page-state')==='RESPONDING');
            if(await msg.inputValue()!=='TEST strategic question')throw new Error('Send cleared message before active generation could be stopped');
            if(!(await q('STR-01-VIEW-CONVERSATION').textContent())?.includes('[TEST AI] Controlled strategic response'))throw new Error('Conversation projection did not refresh after Send');
            const stop=q('STR-01-BTN-STOP');if(await stop.isDisabled())throw new Error('Stop disabled while generation active');
            const stopWait=page.waitForResponse(r=>r.url().includes('/generation/stop')&&r.request().method()==='POST');await stop.click();const stopRes=await stopWait;if(stopRes.status()!==200)throw new Error(`Stop HTTP ${stopRes.status()}`);
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="workspace:STR-01"]')?.getAttribute('data-page-state')==='READY');
            if(await msg.inputValue()!=='')throw new Error('Stop did not clear completed composer message');
            const compare=q('STR-01-BTN-COMPARE');if(await compare.isDisabled())throw new Error('Compare disabled with two governed exact refs');
            const compareWait=page.waitForResponse(r=>r.url().includes('/v1/candidates/compare')&&r.request().method()==='GET');await compare.click();const compareRes=await compareWait;if(compareRes.status()!==200)throw new Error(`Compare HTTP ${compareRes.status()}`);
            const review=q('STR-01-BTN-SUBMIT-REVIEW');if(await review.isDisabled())throw new Error('Review disabled for candidate ready');
            const reviewWait=page.waitForResponse(r=>r.url().includes('/submitstrategyreview')&&r.request().method()==='POST');await review.click();const reviewRes=await reviewWait;if(reviewRes.status()!==200)throw new Error(`Review HTTP ${reviewRes.status()}`);
            await page.waitForFunction(()=>document.querySelector('[data-control-id="STR-01-FLD-REVIEW-STATE"] strong')?.textContent==='REVIEW_REQUIRED');
            const adopt=q('STR-01-BTN-ADOPT');if(await adopt.isDisabled())throw new Error('Adopt disabled after human review gate');
            const adoptWait=page.waitForResponse(r=>r.url().includes('/adoptascontextcandidate')&&r.request().method()==='POST');await adopt.click();const adoptRes=await adoptWait;if(adoptRes.status()!==200)throw new Error(`Adopt HTTP ${adoptRes.status()}`);
            await page.waitForFunction(()=>document.querySelector('[data-control-id="STR-01-FLD-REVIEW-STATE"] strong')?.textContent==='ADOPTED_CONTEXT');
            if((await q('STR-01-FLD-EXECUTION-STATE').locator('strong').textContent())!=='OWNER_EXECUTION_NOT_PERFORMED')throw new Error('STR performed owner execution illegally');
            const audit=q('STR-01-BTN-AUDIT');if(await audit.isDisabled())throw new Error('Audit disabled');await audit.click();if(!(await page.locator('[data-audit-trace-drawer="true"]').isVisible()))throw new Error('Audit drawer did not open');await page.keyboard.press('Escape');
            const owner=q('STR-01-BTN-OPEN-OWNER');if(await owner.isDisabled())throw new Error('Open Owner disabled in controlled registered route');await owner.click();await page.waitForURL('**/admin/erp');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('STR_BROWSER_INTERACTION_PASS');
            await page.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/strategy src/server/testing/controlledStrategyWorkspaceTestRuntime.ts src/components/pages/StrategyControlRuntime.tsx src/components/pages/StrategyVisual.tsx
          git diff --exit-code
