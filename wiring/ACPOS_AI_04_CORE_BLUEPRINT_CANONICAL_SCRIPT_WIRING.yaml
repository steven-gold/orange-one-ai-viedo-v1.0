  Operations: materialize / validate / hash / reproject
  Normative meaning: projection only
- Entity: DNA Enrichment
  Operations: deriveCandidate / resolve / lock topic-scoped details
  Normative meaning: no silent Base DNA mutation
- Entity: Topic Blueprint
  Operations: buildCandidate / crossReview / compare / confirm / childLock
  Normative meaning: immutable version lineage
- Entity: Production Package
  Operations: build / validate / markReady / exportRefs
  Normative meaning: exact handoff only
- Entity: Change Request
  Operations: open / impactScan / authorize / materializeNewVersion
  Normative meaning: no in-place overwrite
- Entity: Handoff
  Operations: verifyReadiness / navigate / persistContext
  Normative meaning: no downstream execution
formalization_layers:
- Layer: Conversation / AI response
  Editable?: 'Yes'
  Authority?: 'No'
  Rule: may propose, analyze, compare; never direct write canonical owner
- Layer: Working Draft
  Editable?: 'Yes'
  Authority?: 'No'
  Rule: same-context working state; resumable
- Layer: Human Decision
  Editable?: recorded
  Authority?: Decision evidence
  Rule: explicit adopt/merge/revise/reject intent
- Layer: Candidate
  Editable?: 'No'
  Authority?: Candidate only
  Rule: immutable source refs + lineage
- Layer: Compare/Review
  Editable?: 'No'
  Authority?: Evaluation evidence
  Rule: criteria/diff/risk; cannot auto-lock
- Layer: Confirmed Version
  Editable?: 'No'
  Authority?: Yes within entity scope
  Rule: new version, no overwrite
- Layer: Lock Review
  Editable?: 'No'
  Authority?: Gate boundary
  Rule: reviewer/evidence/hash required
- Layer: Locked Version
  Editable?: 'No'
  Authority?: Canonical
  Rule: may be superseded only by authorized new version
