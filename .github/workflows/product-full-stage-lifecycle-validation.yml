name: Product Full Stage Lifecycle Validation
# Read-only structural/specification audit. It never executes product operations.
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml'
      - 'STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate-lifecycle-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact selected Current governance
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          test -s "$SEL"
          test "$(awk '$1=="status:" {print $2; exit}' "$SEL")" = "SELECTED_EXACT_CURRENT_SNAPSHOT"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Load exact governance runtime
        run: |
          set -euo pipefail
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock

      - name: Validate Mother definitions and simplified lifecycle contract
        run: |
          set -euo pipefail
          (
            cd _governance_authority
            python governance/ci/stage_execution_engine.py --definition-audit-all
            python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          )
          python -m py_compile \
            .github/scripts/full_stage_lifecycle_guard.py \
            .github/scripts/stage_lifecycle_gate.py \
            .github/scripts/current_stage_execute.py \
            .github/scripts/common_stage_human_gate.py \
            .github/scripts/common_stage_preterminal.py \
            .github/scripts/common_stage_closure.py \
            .github/scripts/common_stage_closure_adapter.py \
            .github/scripts/common_stage_terminalizer.py \
            .github/scripts/common_successor_binding_resolver.py \
            .github/scripts/common_successor_materialize.py \
            .github/scripts/common_successor_work_unit_builder.py

          python .github/scripts/full_stage_lifecycle_guard.py --mode plan --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/stage_lifecycle_gate.py --mode validate-all --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_stage_closure_adapter.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_stage_terminalizer.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_successor_work_unit_builder.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"

      - name: Prove duplicate orchestration state has been removed
        run: |
          set -euo pipefail
          forbidden=(
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/CURRENT_EXECUTION_RESOLUTION.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/CURRENT_REMEDIATION_STATE.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/CURRENT_STAGE01_RESUME_REQUEST.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/CURRENT_STAGE_EXECUTION_REQUEST.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_DEFECT_LEDGER.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_TRANSITION_MATRIX.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_PERMISSION_CONTINUITY_MATRIX.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_RUNTIME_ADAPTER_REGISTRY.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/COMMON_STAGE_CLOSURE_PROTOCOL.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/COMMON_TERMINAL_RECEIPT_PERSISTENCE_PROTOCOL.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/COMMON_NORMALIZED_EVIDENCE_PROTOCOL.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/COMMON_SUCCESSOR_MATERIALIZATION_PROTOCOL.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_HANDOFF_INPUT_ORIGIN_MATRIX.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_OPERATION_BINDING_PROFILE_REGISTRY.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_PREENTRY_CONVERGENCE_MATRIX.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_LIFECYCLE_DRIVER_REQUEST.yaml
            STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml
          )
          for p in "${forbidden[@]}"; do
            test ! -e "$p" || { echo "BLOCK:DUPLICATE_ORCHESTRATION_STATE_REMAINS:$p"; exit 41; }
          done

      - name: Prove execution and validation responsibilities are separated
        run: |
          set -euo pipefail
          ! grep -q "CURRENT_STAGE_EXECUTION_REQUEST" .github/workflows/product-stage-lifecycle-driver.yml
          ! grep -q "gh run watch" .github/workflows/product-stage-lifecycle-driver.yml
          ! grep -q "Wait for independent exact-head outer validation" .github/workflows/product-stage-lifecycle-driver.yml
          ! grep -q "current_stage_execute.py" .github/workflows/product-full-stage-lifecycle-validation.yml
          ! grep -q "common_successor_materialize.py --mode materialize" .github/workflows/product-full-stage-lifecycle-validation.yml
          echo "PASS: validation is read-only and lifecycle execution has one driver"
