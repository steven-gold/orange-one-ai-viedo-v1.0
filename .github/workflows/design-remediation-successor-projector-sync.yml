name: Design Remediation Successor Projector Sync

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-DESIGN-REMEDIATION-SUCCESSOR-PROJECTOR-SYNC-R5.yaml'

permissions:
  contents: write

jobs:
  synchronize-successor-projectors:
    if: "${{ github.event.head_commit.message == 'chore(governance): authorize successor projector sync R5' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Assert current successor and authorization
        shell: bash
        run: |
          set -euo pipefail
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-DESIGN-REMEDIATION-SUCCESSOR-PROJECTOR-SYNC-R5.yaml
          grep -q 'GOV-REV-20260918-DESIGN-REMEDIATION-ROUTING-HARDENING' governance/specifications/REGISTRY.yaml
          test -f .github/governance-maintenance/sync_design_remediation_successor_projectors.py
      - name: Static-compile projector sync helper
        run: python -m py_compile .github/governance-maintenance/sync_design_remediation_successor_projectors.py
      - name: Synchronize projectors and run complete local gate
        run: python .github/governance-maintenance/sync_design_remediation_successor_projectors.py
      - name: Verify transaction hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/governance-maintenance/sync_design_remediation_successor_projectors.py
          test ! -e .github/workflows/design-remediation-successor-projector-sync.yml
          test ! -d governance/test/temporary
          git status --short
      - name: Persist projector synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "fix(governance): synchronize design remediation successor projectors" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260918-DESIGN-REMEDIATION-SUCCESSOR-PROJECTOR-SYNC-R5" \
            -m "Spec-Change-Scope: DESIGN_REMEDIATION_SUCCESSOR_PROJECTOR_SYNCHRONIZATION"
          git push origin HEAD:rebuild-v2.1.1
