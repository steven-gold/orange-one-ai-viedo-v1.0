document:
  paragraphs:
  - index: 0
    style: Normal
    text: 'SOC-01 社群發布

      Mother Basic Design · Functional Completion · Social Publishing Governance

      ORANGE ONE · admin:SOC-01'
  - index: 1
    style: Normal
    text: 本版沿用 SOC-01 單頁五階段架構，補齊母規範要求的產品定位、Entity × Operation、功能加入/降級規則、Market Target Discovery、Content Package、Publish Policy、External State Truth、Functional Chain、權限／狀態／錯誤、Visual
      Geometry、A11y、Acceptance 與施工映射。
  - index: 2
    style: Normal
    text: 核心優化：保留「平台能力 → 帳號與目標 → 內容包 → 發佈計畫 → 結果與紀錄」五階段，不重建第二套社群系統；將公開市場目標探索、Signal Qualification 與來源治理收斂到「帳號與目標」階段，直接重用 Shared Acquisition / Target Directory / Manual
      Action / Publishing Runtime。
  - index: 4
    style: Normal
    text: 圖 1｜SOC-01 帳號與目標：Target Discovery、Target Directory、Market Signal 與 Governance Rail。
  - index: 5
    style: Heading 1
    text: 1. Page Identity / 頁面定位與產品目標
  - index: 7
    style: Heading 1
    text: 2. Scope / 需求、角色、Out-of-Scope 與非功能要求
  - index: 9
    style: Heading 1
    text: 3. Business Entity × Operation / 產品實體與操作矩陣
  - index: 11
    style: Heading 1
    text: 4. Entity Hierarchy / 資料、身份與生命週期關係
  - index: 12
    style: Normal
    text: Platform Capability → Social Account Binding → Social Target Discovery Job → Social Market Target → Content Package / Candidate → Target Posting Policy
      → Publish Request → External Result / Metrics / Interaction。Manual Action、Evidence、Audit、Version、Correlation、Suppression / Rights / Policy 為跨鏈治理層。
  - index: 13
    style: Normal
    text: Market Signal 優化層只存在於「Discovery Result 的判讀與排序」：它必須保留 Source / Canonical URL / External ID / Published/Discovered Time / Topic Match / Evidence / Capability
      / Status，且不得變成第二套 Engagement Database。
  - index: 14
    style: Heading 1
    text: 5. Five-Stage Functional Workbench / 五階段工作區
  - index: 16
    style: Heading 1
    text: 6. Content Optimization / 母規範缺口補齊與 UX 優化
  - index: 19
    style: Normal
    text: 圖 2｜SOC-01 Content Package、Publish Plan 與 Results：Approval / Publish / External State 三層分離。
  - index: 20
    style: Heading 1
    text: 7. Interaction Topology / Layout / Visual Geometry
  - index: 22
    style: Heading 1
    text: 8. Functional Chain / 端到端功能鏈
  - index: 24
    style: Heading 1
    text: 9. Operations / Actions / Integration Ports
  - index: 26
    style: Normal
    text: UI stage-select actions與 Detail Open 是 client/UI state，不應被錯誤施工成 API。正式 effectful action 只能使用已註冊 operation；缺少 exact binding 時必須 BLOCK。
  - index: 27
    style: Heading 1
    text: 10. Form / Input Contract / 欄位規格
  - index: 29
    style: Heading 1
    text: 11. Control Registry / 控制分母與顯示策略
  - index: 30
    style: Normal
    text: Current 控制分母：9 Sections / 67 Controls / 21 Actions / 14 Gates / 16 Permissions。Word 不用把低頻 read-only control 做成大卡片；施工時仍需保持每個 control → section/component/visual/action/gate/permission
      的可追溯綁定。
  - index: 32
    style: Heading 1
    text: 12. Gate / Permission / Security Boundary
  - index: 35
    style: Heading 1
    text: 13. State Model / Transition / Truthful Status
  - index: 37
    style: Heading 1
    text: 14. Error / Recovery / Partial Failure
  - index: 39
    style: Heading 1
    text: 15. Data / Lineage / External Integration Boundary
  - index: 41
    style: Heading 1
    text: 16. i18n / Accessibility / Responsive / Visual States
  - index: 43
    style: Heading 1
    text: 17. Acceptance Matrix / Definition of Done
  - index: 45
    style: Heading 1
    text: 18. Hard Locks / 施工不可破壞規則
  - index: 46
    style: List Bullet
    text: 不得新增第二套 Social Publishing / Platform Registry / Account Registry / Target DB / Credential Store / Adapter / Scheduler / Analytics。
  - index: 47
    style: List Bullet
    text: 五個 Stage 是同頁 UI context；切換不得改變 Business State 或丟失 exact refs。
  - index: 48
    style: List Bullet
    text: 平台能力、Health、Policy、External Status 只能來自真實 registered projection。
  - index: 49
    style: List Bullet
    text: Raw credential 不得預設顯示、記錄於普通 UI state 或寫入文件範例。
  - index: 50
    style: List Bullet
    text: verifySocialAccountBinding / verifySocialTargetCapability 保持 service-runtime operation，不新增使用者 Verify 按鈕。
  - index: 51
    style: List Bullet
    text: Content Candidate APPROVE 不會 Publish；Publish Request 成功不等於 external POSTED。
  - index: 52
    style: List Bullet
    text: 特定公司 Mention/Tag 強制人工審查；Mass Commenting/Tagging/Cold Outreach 禁止。
  - index: 53
    style: List Bullet
    text: Direct Message 只有官方 API、帳號權限與平台政策明確允許時才能存在。
  - index: 54
    style: List Bullet
    text: Withdrawal 沒有正式 mutation 時保持 read-only，不新增 Withdraw button。
  - index: 55
    style: List Bullet
    text: 未知欄位、未註冊 operation、permission 或 provider behavior 必須 Fail Closed。
  - index: 56
    style: Heading 1
    text: 19. Construction Mapping / 實作順序與驗收方式
  - index: 58
    style: Normal
    text: Word 完成只代表 SOC-01 Basic Design 已補齊。正式施工完成仍必須有實際 Implementation、Runtime、Database、Permission、External Integration、Browser/E2E、Production Evidence；不得用文件完成替代系統完成。
  - index: 60
    style: Heading 1
    text: 2026-09-21 Machine Authority Construction Closure / 機器權威施工綁定封板
  - index: 61
    style: Normal
