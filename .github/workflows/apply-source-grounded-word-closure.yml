name: Apply Source Grounded Word Closure

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin 165c6440cb53b1b45ec96905241fb4d56dc3b867 --depth=1
      - run: python -m pip install --quiet pyyaml python-docx
      - name: Rebuild exact source report
        run: python __temp_tools__/source_grounded_binding_builder.py
      - name: Apply Word closure
        run: python __temp_tools__/apply_source_grounded_word_closure.py
      - name: Structural validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from docx import Document
          marker='ACPOS-20260921-SOURCE-GROUNDED-CONSTRUCTION-CLOSURE-V1'
          report=json.load(open('__temp_reports__/word_patch_report.json'))
          assert report['updated_count']==28, report['updated_count']
          pages=sorted(Path('.').glob('ACPOS_*.docx'))
          target_pages=[p for p in pages if p.name not in ['ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx','ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx','ACPOS_LOGIN_IDENTITY_ENTRY_Mother_Basic_Design_OPTIMIZED.docx']]
          parents=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          for p in target_pages+parents+[Path('00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx')]:
              d=Document(p)
              joined='\n'.join(x.text for x in d.paragraphs)
              assert marker in joined,p.name
          # old fabricated closure markers must be gone from 01-09
          for p in parents:
              d=Document(p)
              joined='\n'.join(x.text for x in d.paragraphs)
              assert 'ACPOS-20260921-EXACT-BINDING-CLOSURE' not in joined,p.name
              assert 'UNIFIED-CONTROL-RUNTIME-MATRIX-V3' not in joined,p.name
              # prior generic numeric policy identifiers must be absent
              for bad in ['CONV_UI_INITIAL_LOAD_MESSAGES','CONV_UI_LAZY_LOAD_MESSAGES','CONV_CONTEXT_INPUT_HARD_CAP_TOKENS','CONV_RETENTION_AFTER_PROJECT_CLOSE_DAYS']:
                  assert bad not in joined,(p.name,bad)
          print('PASS: source-grounded closure structurally present and prior generic closure removed')
          PY
      - name: Commit final Word content
        shell: bash
        run: |
          git config user.name "acpos-source-grounded-closure"
          git config user.email "actions@users.noreply.github.com"
          git add 00_INDEX*.docx 0[1-9]_ACPOS_*.docx ACPOS_*.docx __temp_reports__/word_patch_report.json
          git commit -m "docs(acpos): replace generic bindings with source-grounded exact closure"
          git push
