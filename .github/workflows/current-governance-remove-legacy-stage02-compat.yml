name: current-governance-remove-legacy-stage02-compat
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/current-governance-remove-legacy-stage02-compat.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Remove legacy Stage-02 compatibility chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,yaml
          R=Path('.')

          # 1) Current Stage-02 adapter: common normalized contract only; no historical compatibility module.
          p=R/'governance/ci/stage_execution_semantic_adapters.yaml'
          d=yaml.safe_load(p.read_text(encoding='utf-8'))
          s2=d['stages']['STAGE-02']
          s2['scanner_mode']='NORMALIZED_COMMON_EVIDENCE_CONTRACT'
          for k in [
            'python_compatibility_module','compatibility_current_execution_authority',
            'compatibility_may_resolve_current_scope','compatibility_state_source'
          ]:
            s2.pop(k,None)
          s2['current_execution_state_source']='PRODUCT_STAGE_EXECUTION_CURRENT_SCOPE_AND_RESUME'
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=220),encoding='utf-8',newline='\n')

          # 2) Common engine no longer depends on a legacy wrapper/module.
          p=R/'governance/ci/stage_execution_engine.py'
          t=p.read_text(encoding='utf-8')
          t=t.replace('import argparse, importlib, json, os, subprocess, sys','import argparse, json, os, subprocess, sys')
          t='\n'.join([line for line in t.splitlines() if not line.startswith('LEGACY_WRAPPER=')])
          # remove duplicate ADAPTERS assignment if present
          lines=t.splitlines()
          seen=False; out=[]
          for line in lines:
            if line.startswith('ADAPTERS='):
              if seen: continue
              seen=True
            out.append(line)
          t='\n'.join(out)+'\n'
          old="""def validate_definition():
    entry,reg,gov,profile,adapters=data()
    stages=validate_definition_data(profile,adapters)
    wrapper=LEGACY_WRAPPER.read_text(encoding='utf-8')
    if 'UNSUPPORTED_STAGE_UNTIL_MATCHING_CURRENT_EVIDENCE_EXISTS' in wrapper or "STAGE='STAGE-02'" in wrapper: fail('LEGACY_STAGE02_COMMON_ENGINE_LOGIC_STILL_IN_WRAPPER')
    if 'compatibility_main' not in wrapper: fail('STAGE02_COMPATIBILITY_WRAPPER_NOT_DELEGATING')
    return entry,reg,gov,profile,adapters,stages
"""
          new="""def validate_definition():
    entry,reg,gov,profile,adapters=data()
    stages=validate_definition_data(profile,adapters)
    return entry,reg,gov,profile,adapters,stages
"""
          if old not in t: raise SystemExit('VALIDATE_DEFINITION_PATTERN_NOT_FOUND')
          t=t.replace(old,new)
          t=re.sub(r'\ndef compatibility_main\(stage_uid\):.*?\n\ndef main\(\):', '\n\ndef main():', t, flags=re.S)
          p.write_text(t,encoding='utf-8')

          # 3) Regression suite now asserts the compatibility chain is absent.
          p=R/'governance/ci/test_stage_execution_engine.py'
          t=p.read_text(encoding='utf-8')
          start=t.index("wrapper=(ROOT/'governance/ci/compile_stage_execution_preflight.py').read_text")
          end=t.index("\n\n# Full selected-profile multidirectional audit",start)
          replacement="""assert not (ROOT/'governance/ci/compile_stage_execution_preflight.py').exists()
assert not (ROOT/'governance/ci/stage_execution_adapters/stage02_functional_contract.py').exists()
s2=adapters['stages']['STAGE-02']
assert s2.get('scanner_mode')=='NORMALIZED_COMMON_EVIDENCE_CONTRACT'
for forbidden in ('python_compatibility_module','compatibility_current_execution_authority','compatibility_may_resolve_current_scope','compatibility_state_source'):
    assert forbidden not in s2, f'LEGACY_STAGE02_COMPATIBILITY_FIELD_STILL_PRESENT:{forbidden}'
common=(ROOT/'governance/ci/stage_execution_engine.py').read_text(encoding='utf-8')
tree=ast.parse(common)
for node in ast.walk(tree):
    if isinstance(node,(ast.Assign,ast.AnnAssign)):
        targets=node.targets if isinstance(node,ast.Assign) else [node.target]
        for target in targets:
            if isinstance(target,ast.Name) and target.id=='STAGE':
                value=node.value
                if isinstance(value,ast.Constant) and value.value=='STAGE-02':
                    raise AssertionError('COMMON_ENGINE_STAGE02_LITERAL_ASSIGNMENT')
for node in ast.walk(tree):
    if isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id=='fail':
        for arg in node.args:
            if isinstance(arg,ast.Constant) and isinstance(arg.value,str) and arg.value.startswith('UNSUPPORTED_STAGE_UNTIL_MATCHING_CURRENT_EVIDENCE_EXISTS'):
                raise AssertionError('COMMON_ENGINE_STAGE02_ONLY_REJECTION')
print(f'PASS: common Stage Execution Engine negative regression {cases}/39')
print('PASS: Stage-02 current execution has no historical compatibility module or test-state scope resolver')
"""
          t=t[:start]+replacement+t[end:]
          p.write_text(t,encoding='utf-8')

          # 4) Governance workflow is validation/control only; no product effectful execute mode.
          p=R/'.github/workflows/common-stage-execution-engine.yml'
          t=p.read_text(encoding='utf-8')
          t=t.replace('options: [plan, admission-check, execute, validate-evidence, validate-terminal]',
                      'options: [plan, admission-check, validate-evidence, validate-terminal]')
          t=re.sub(r'\n            execute\)\n.*?\n              ;;', '', t, flags=re.S)
          p.write_text(t,encoding='utf-8')

          # 5) Remove obsolete compatibility files.
          for rel in [
            'governance/ci/compile_stage_execution_preflight.py',
            'governance/ci/stage_execution_adapters/stage02_functional_contract.py',
            'governance/ci/stage_execution_adapters/__init__.py',
          ]:
            q=R/rel
            if q.exists(): q.unlink()

          # 6) Self-delete this one-time cleanup workflow.
          selfp=R/'.github/workflows/current-governance-remove-legacy-stage02-compat.yml'
          if selfp.exists(): selfp.unlink()

          # 7) Fail if the retired current-execution chain still appears outside explicit negative guards.
          forbidden=[
            'stage_execution_adapters.stage02_functional_contract',
            'HISTORICAL_GOVERNANCE_TEST_STATE_ONLY',
            "compatibility_main('STAGE-02')",
          ]
          bad=[]
          for f in list((R/'governance').rglob('*'))+list((R/'.github/workflows').glob('*')):
            if not f.is_file() or f.suffix.lower() not in {'.py','.yaml','.yml','.md'}: continue
            txt=f.read_text(encoding='utf-8',errors='ignore')
            for token in forbidden:
              if token in txt: bad.append((str(f),token))
          if bad: raise SystemExit('STALE_CURRENT_CONSUMER:'+repr(bad))
          PY
      - name: Validate cleaned Current Governance
        shell: bash
        run: |
          set -euo pipefail
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/test_stage_execution_engine.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_governance_layout.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_product_neutral_entity_lifecycle.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          CURRENT="$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')"
          test "$CURRENT" = "${GITHUB_SHA}"
          git commit -m "fix(governance): remove historical Stage-02 compatibility chain"
          git push origin HEAD:rebuild-v2.1.1
