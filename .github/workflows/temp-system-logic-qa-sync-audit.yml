name: Temp System Logic QA Sync Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - name: Audit 01-09 system logic sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import json,re
          files=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          assert len(files)==9,[p.name for p in files]
          out={}
          needles=[
            'ACPOS-20260921-CONCRETE-BUSINESS-CONTENT-CLOSURE-V1',
            'QCP-CORE-BASELINE-V1',
            'QCP-ASSET-IMAGE-V1',
            'QCP-ASSET-AUDIO-V1',
            'QCP-VIDEO-BASELINE-V1',
            'QCP-EDIT-FINAL-V1',
            'QCP-QA-FINAL-OUTPUT-V1',
            'CTRL-ADMIN-SG-02-ACT-04-ACT-SUBMIT-REVIEW',
            'submitGovernedResourceReview',
            'SG-02 Current Control Denominator = 12',
            'CONTENT_INCOMPLETE',
          ]
          stale=[
            'Control Denominator = 11',
            'Expected Control Denominator | 11',
            'RUNTIME_BINDING_VALIDATION | NOT_EXECUTED',
            'No dimensions registered yet',
          ]
          for p in files:
              d=Document(p)
              text='\n'.join([x.text for x in d.paragraphs]+[c.text for t in d.tables for r in t.rows for c in r.cells])
              out[p.name]={
                'found':{n:(n in text) for n in needles},
                'stale':{n:(n in text) for n in stale},
                'qa_terms':{n:(n in text) for n in [
                    '人物／角色一致性','幀間連續性','嘴型／口型同步','字幕內容正確','字幕時間／可讀性／安全區','音訊技術品質',
                    'Business Content Completeness Gate','Concrete Criteria','DRAFT→REVIEW→APPROVED'
                ]}
              }
          print('SYSTEM_SYNC_AUDIT',json.dumps(out,ensure_ascii=False))
          PY
