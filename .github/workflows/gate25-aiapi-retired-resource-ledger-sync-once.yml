name: ACPOS Gate25 AIAPI Retired Resource Ledger Sync Once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Classify exact 5 retired AIAPI formal resources
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const ledgerPath='docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json';
          const inventoryPath='docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json';
          const authorityPath='authority/pages/admin/AIAPI-01/ACPOS_AIAPI-01_FINAL_LOCKED_ENCODING.yaml';
          const navigationPath='authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml';
          const pageCatalogPath='src/server/shared/pageCatalogProjectionRuntime.ts';
          const evidencePath='docs/construction/evidence/GATE25_AIAPI_02_03_RETIRED_PERMISSION_RESOURCE_EVIDENCE_2026-09-10.json';
          const syncPath='docs/construction/evidence/GATE25_AIAPI_02_03_RETIRED_PERMISSION_RESOURCE_LEDGER_SYNC_2026-09-10.json';
          const formalTestPath='tests/release/formal-acceptance-ledger.test.mjs';
          const regressionPath='tests/release/gate25-aiapi-retired-permission-resource-ledger-sync.test.mjs';
          const targets=[
            'action:admin:AIAPI-02:ACT-CONFIGURE',
            'action:admin:AIAPI-02:ACT-KILL-SWITCH',
            'action:admin:AIAPI-02:ACT-NAV-OPEN',
            'action:admin:AIAPI-03:ACT-CONFIGURE',
            'action:admin:AIAPI-03:ACT-NAV-OPEN',
          ];

          const [authority,navigation,pageCatalog]=await Promise.all([
            readFile(authorityPath,'utf8'),
            readFile(navigationPath,'utf8'),
            readFile(pageCatalogPath,'utf8'),
          ]);
          if(!authority.includes('canonical_frontend_page_uid: admin:AIAPI-01')) throw new Error('CURRENT_AIAPI_CANONICAL_PAGE_NOT_CONFIRMED');
          if(!authority.includes('former_multi_page_frontend_definitions: RETIRED_FROM_CURRENT_UI')) throw new Error('AIAPI_LEGACY_RETIREMENT_NOT_CONFIRMED');
          if(!authority.includes('standalone_parallel_pages: FORBIDDEN')) throw new Error('AIAPI_PARALLEL_PAGE_RULE_NOT_CONFIRMED');
          if(!navigation.includes('page_uid: admin:AIAPI-01')) throw new Error('CURRENT_NAV_AIAPI01_MISSING');
          if(navigation.includes('page_uid: admin:AIAPI-02') || navigation.includes('page_uid: admin:AIAPI-03')) throw new Error('RETIRED_AIAPI_PAGE_STILL_IN_CURRENT_NAVIGATION');
          if(!pageCatalog.includes('"admin:AIAPI-01": "page:admin:AIAPI-01"')) throw new Error('CURRENT_PAGE_CATALOG_AIAPI01_MISSING');
          if(pageCatalog.includes('"admin:AIAPI-02"') || pageCatalog.includes('"admin:AIAPI-03"')) throw new Error('RETIRED_AIAPI_PAGE_STILL_IN_CURRENT_PAGE_CATALOG');

          const inventory=JSON.parse(await readFile(inventoryPath,'utf8'));
          const inventoryByKey=new Map(inventory.resources.map(x=>[x.resource_key,x]));
          for(const key of targets){
            const row=inventoryByKey.get(key);
            if(!row) throw new Error(`FORMAL_RESOURCE_MISSING_${key}`);
            if(row.resource_type!=='ACTION') throw new Error(`FORMAL_RESOURCE_TYPE_${key}_${row.resource_type}`);
          }

          const ledger=JSON.parse(await readFile(ledgerPath,'utf8'));
          if(JSON.stringify(ledger.counts)!==JSON.stringify({PASS:29,BLOCKED:72,NOT_EXECUTED:1380})) throw new Error(`UNEXPECTED_LEDGER_BASELINE_${JSON.stringify(ledger.counts)}`);
          const byKey=new Map(ledger.entries.map(x=>[x.resource_key,x]));
          const before={...ledger.counts};
          const changed=[];
          for(const key of targets){
            const row=byKey.get(key);
            if(!row) throw new Error(`LEDGER_RESOURCE_MISSING_${key}`);
            if(row.disposition!=='NOT_EXECUTED') throw new Error(`LEDGER_RESOURCE_NOT_PENDING_${key}_${row.disposition}`);
            row.disposition='BLOCKED';
            row.reason_code='RETIRED_CURRENT_UI_PERMISSION_RESOURCE_ACTIVE_IN_PRODUCTION_INVENTORY';
            row.evidence_refs=[evidencePath,authorityPath,navigationPath,pageCatalogPath,inventoryPath];
            row.blocker_detail='Production permission inventory still contains an ACTION owned by retired AIAPI-02/03 page identity, while Current Authority, Current navigation, and Current page catalog allow only admin:AIAPI-01. No Current executable page owner exists; reconstructing the retired page is forbidden.';
            row.operation_ids=[key.split(':').at(-1)];
            changed.push(key);
          }
          const counts={PASS:0,BLOCKED:0,NOT_EXECUTED:0};
          for(const row of ledger.entries){
            if(!(row.disposition in counts)) throw new Error(`INVALID_DISPOSITION_${row.resource_key}`);
            counts[row.disposition]++;
          }
          if(ledger.entries.length!==1481) throw new Error(`DENOMINATOR_${ledger.entries.length}`);
          if(JSON.stringify(counts)!==JSON.stringify({PASS:29,BLOCKED:77,NOT_EXECUTED:1375})) throw new Error(`COUNT_MISMATCH_${JSON.stringify(counts)}`);
          ledger.counts=counts;
          await writeFile(ledgerPath,JSON.stringify(ledger,null,2)+'\n');

          const evidence={
            document_id:'ACPOS_GATE25_AIAPI_02_03_RETIRED_PERMISSION_RESOURCE_EVIDENCE',
            status:'CURRENT_AUTHORITY_BLOCKER_EVIDENCE',
            as_of:new Date().toISOString(),
            target_count:targets.length,
            target_resource_keys:targets,
            current_canonical_page_uid:'admin:AIAPI-01',
            retired_page_uids:['admin:AIAPI-02','admin:AIAPI-03'],
            facts:{
              aiapi_authority_single_page:true,
              former_multi_page_frontend_definitions:'RETIRED_FROM_CURRENT_UI',
              standalone_parallel_pages:'FORBIDDEN',
              current_navigation_has_aiapi01:true,
              current_navigation_has_aiapi02_or_03:false,
              current_page_catalog_has_aiapi01:true,
              current_page_catalog_has_aiapi02_or_03:false,
              production_formal_inventory_contains_all_targets:true
            },
            evidence_refs:[authorityPath,navigationPath,pageCatalogPath,inventoryPath],
            rule:'These five resources are not accepted operations. They are blocked because the active Production permission inventory retains retired page-owned ACTION resources with no Current executable page owner. Do not recreate legacy pages to satisfy them.'
          };
          await writeFile(evidencePath,JSON.stringify(evidence,null,2)+'\n');

          const sync={
            document_id:'ACPOS_GATE25_AIAPI_02_03_RETIRED_PERMISSION_RESOURCE_LEDGER_SYNC',
            status:'PHYSICAL_LEDGER_SYNCED',
            as_of:new Date().toISOString(),
            target_count:targets.length,
            changed_count:changed.length,
            changed_resource_keys:changed,
            counts_before:before,
            counts_after:counts,
            source:evidencePath,
            rule:'Only the exact five AIAPI-02/03 ACTION resources proven retired by Current Authority/navigation/page catalog are moved from NOT_EXECUTED to BLOCKED.'
          };
          await writeFile(syncPath,JSON.stringify(sync,null,2)+'\n');

          let formalTest=await readFile(formalTestPath,'utf8');
          const oldCount='assert.deepEqual(ledger.counts,{PASS:29,BLOCKED:72,NOT_EXECUTED:1380});';
          const newCount='assert.deepEqual(ledger.counts,{PASS:29,BLOCKED:77,NOT_EXECUTED:1375});';
          if(!formalTest.includes(oldCount)) throw new Error('FORMAL_TEST_CURRENT_COUNT_BASELINE_NOT_FOUND');
          formalTest=formalTest.replace(oldCount,newCount);
          await writeFile(formalTestPath,formalTest);

          await writeFile(regressionPath,`import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("Gate25 blocks exact five retired AIAPI-02/03 Production permission resources without recreating legacy pages",async()=>{\n  const evidence=JSON.parse(await readFile("${evidencePath}","utf8"));\n  const sync=JSON.parse(await readFile("${syncPath}","utf8"));\n  const ledger=JSON.parse(await readFile("${ledgerPath}","utf8"));\n  assert.equal(evidence.status,"CURRENT_AUTHORITY_BLOCKER_EVIDENCE");\n  assert.equal(evidence.target_count,5);\n  assert.equal(sync.changed_count,5);\n  assert.deepEqual(sync.counts_before,{PASS:29,BLOCKED:72,NOT_EXECUTED:1380});\n  assert.deepEqual(sync.counts_after,{PASS:29,BLOCKED:77,NOT_EXECUTED:1375});\n  const changed=new Set(sync.changed_resource_keys);\n  assert.equal(changed.size,5);\n  for(const row of ledger.entries.filter(x=>changed.has(x.resource_key))){\n    assert.equal(row.disposition,"BLOCKED");\n    assert.equal(row.reason_code,"RETIRED_CURRENT_UI_PERMISSION_RESOURCE_ACTIVE_IN_PRODUCTION_INVENTORY");\n    assert.ok(row.evidence_refs.includes("${evidencePath}"));\n  }\n});\n`);

          console.log(JSON.stringify(sync));
          NODE
      - name: Validate synchronized ledger
        run: |
          node --test tests/release/formal-acceptance-ledger.test.mjs tests/release/gate25-aiapi-retired-permission-resource-ledger-sync.test.mjs
          node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit synchronized ledger and remove one-shot workflow
        run: |
          rm .github/workflows/gate25-aiapi-retired-resource-ledger-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json \
                  docs/construction/evidence/GATE25_AIAPI_02_03_RETIRED_PERMISSION_RESOURCE_EVIDENCE_2026-09-10.json \
                  docs/construction/evidence/GATE25_AIAPI_02_03_RETIRED_PERMISSION_RESOURCE_LEDGER_SYNC_2026-09-10.json \
                  tests/release/formal-acceptance-ledger.test.mjs \
                  tests/release/gate25-aiapi-retired-permission-resource-ledger-sync.test.mjs \
                  .github/workflows/gate25-aiapi-retired-resource-ledger-sync-once.yml
          git commit -m "evidence(gate25): block retired AIAPI-02/03 formal resources"
          git push origin HEAD:new
