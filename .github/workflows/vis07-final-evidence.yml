name: VIS-07 Final Clean Evidence
on:
  push:
    branches: [acpos-vis07-staging]
    paths: [.github/workflows/vis07-final-evidence.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/vis07-final.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:3000/database >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/vis07-final.log; exit 1
      - name: Capture canonical collapsed and expanded evidence
        run: |
          node <<'NODE'
          const fs=require('fs');const {chromium}=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1600,height:900}});const page=await ctx.newPage();await page.goto('http://127.0.0.1:3000/database',{waitUntil:'networkidle'});const ws=page.locator('.workspace-slot');
          const m=()=>page.evaluate(()=>{const w=document.querySelector('.workspace-slot'),s=document.querySelector('.global-sidebar'),r=document.querySelector('[data-page-uid="admin:DB-01"]');return{client:w.clientWidth,scroll:w.scrollWidth,workspaceX:w.getBoundingClientRect().x,sidebar:s.getBoundingClientRect().width,page:r.getBoundingClientRect().width}});
          let wide=await m();if(wide.scroll!==wide.client||wide.workspaceX!==78||wide.sidebar!==64)throw Error('1600 collapsed geometry '+JSON.stringify(wide));await page.screenshot({path:'docs/construction/evidence/VIS-07/vis07-1600-top.png'});
          await page.locator('.global-sidebar').hover();await page.waitForTimeout(250);let exp=await m();if(exp.sidebar!==221||exp.workspaceX!==78)throw Error('expanded geometry '+JSON.stringify(exp));await page.screenshot({path:'docs/construction/evidence/VIS-07/vis07-1600-expanded.png'});
          await page.mouse.move(900,400);await page.waitForTimeout(300);await page.setViewportSize({width:1440,height:900});await page.waitForTimeout(300);let mid=await m();if(mid.sidebar!==64||mid.workspaceX!==78||mid.scroll!==mid.client)throw Error('1440 collapsed geometry '+JSON.stringify(mid));await page.screenshot({path:'docs/construction/evidence/VIS-07/vis07-1440-top.png'});
          await ws.evaluate(e=>e.scrollTop=Math.round((e.scrollHeight-e.clientHeight)/2));await page.waitForTimeout(120);await page.screenshot({path:'docs/construction/evidence/VIS-07/vis07-1440-middle.png'});await ws.evaluate(e=>e.scrollTop=e.scrollHeight);await page.waitForTimeout(120);await page.screenshot({path:'docs/construction/evidence/VIS-07/vis07-1440-bottom.png'});await ws.evaluate(e=>{e.scrollTop=0;e.scrollLeft=0});
          await page.setViewportSize({width:1200,height:900});await page.waitForTimeout(200);let narrow=await m();if(narrow.page<1280||narrow.scroll<=narrow.client)throw Error('1200 min-width '+JSON.stringify(narrow));await page.screenshot({path:'docs/construction/evidence/VIS-07/vis07-1200-minwidth.png'});
          const out={source_sha:process.env.GITHUB_SHA,route:'/database',final_clean_evidence:true,workspace_1600:wide,expanded_1600:exp,workspace_1440:mid,workspace_1200:narrow,sidebar_collapse_wait_ms:300,authority_files_modified:false};fs.writeFileSync('docs/construction/evidence/VIS-07/vis07-final-evidence.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Persist evidence and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/construction/evidence/VIS-07
          git rm .github/workflows/vis07-final-evidence.yml
          git commit -m "test(vis07): persist final clean DB-01 evidence [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with: {name: vis07-db01-final-clean-evidence, path: "docs/construction/evidence/VIS-07"}
