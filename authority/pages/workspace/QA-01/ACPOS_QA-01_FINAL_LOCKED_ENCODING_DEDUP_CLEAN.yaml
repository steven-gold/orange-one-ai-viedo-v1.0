  integration_ports:
  - port_uid: QA-01-PORT-PROJECTION
    boundary: Read page projection
    operation: getUiProjection
    method_path: GET /v1/ui-projections/{pageUid}
    permission: page/control account authorization + qa.task.read
    state_event: read only
    exposure: All read-only page projections; no invented data
  - port_uid: QA-01-PORT-START
    boundary: Start QA Review
    operation: startQaReview
    method_path: POST /v1/qa/reviews
    permission: api:startQaReview + account authorization
    state_event: NOT_STARTED→IN_REVIEW; event name resolved by system operation registry
    exposure: QA-01-ACT-START-REVIEW; exact project/topic/output_version_ids/qa_profile_id
  - port_uid: QA-01-PORT-SCORECARD
    boundary: QA Scorecard
    operation: submitScorecard
    method_path: POST /v1/scorecards
    permission: qa.score.write
    state_event: scorecard.submitted; gate state follows QA policy
    exposure: SYSTEM/AI generated scorecard persistence only; no human Scorecard action
  - port_uid: QA-01-PORT-FINDING
    boundary: Finding
    operation: createFinding
    method_path: POST /v1/findings
    permission: finding.write
    state_event: IN_REVIEW→FINDING_OPEN | finding.created
    exposure: QA-01-ACT-FINDING-CREATE
  - port_uid: QA-01-PORT-CORRECTION
    boundary: Correction Request
    operation: createCorrectionRequest
    method_path: POST /v1/correction-requests
    permission: correction.create
    state_event: FINDING_OPEN→CORRECTION_REQUIRED | correction.requested
    exposure: QA-01-ACT-CORRECTION-REQUEST; target original owner; QA does not execute edit
  - port_uid: QA-01-PORT-RECHECK
    boundary: Recheck
    operation: startRecheck
    method_path: POST /v1/state-commands/qareview/startrecheck
    permission: api:startRecheck + qa.gate.decide
    state_event: CORRECTION_REQUIRED→RECHECK; event name resolved by system operation registry
    exposure: QA-01-ACT-RECHECK-START; verified new version required
  - port_uid: QA-01-PORT-PASS
    boundary: QA PASS
    operation: decidePass
    method_path: POST /v1/state-commands/qareview/decidepass
    permission: qa.gate.decide
    state_event: IN_REVIEW/RECHECK→PASS; event name resolved by system operation registry
    exposure: Internal dispatch after generated result confirmation or governed AUTO flow; no direct PASS UI
  - port_uid: QA-01-PORT-FAIL
    boundary: QA FAIL
    operation: decideFail
    method_path: POST /v1/state-commands/qareview/decidefail
    permission: qa.gate.decide
    state_event: IN_REVIEW/RECHECK→FAIL; event name resolved by system operation registry
    exposure: Internal dispatch after generated result confirmation or governed AUTO flow; no direct FAIL UI
  - port_uid: QA-01-PORT-RELEASE
    boundary: Release Candidate
    operation: createReleasePackage
    method_path: POST /v1/release-packages
    permission: release.create
    state_event: PASS→ReleasePackage candidate available; ReleaseService owns later approval/release
    exposure: QA-01-ACT-RELEASE-CREATE; no approveRelease/publish control
  - port_uid: QA-01-PORT-AUTO-TOPIC
    boundary: AUTO Topic QA Orchestration
    operation: startAutoTopicQaReview
    method_path: SYSTEM_OPERATION_REGISTRY_REQUIRED; frontend MUST NOT invent URL
    permission: qa.auto.review + exact account/topic scope authorization
    state_event: Sequential per-task canonical QA states; QA_LOW_SCORE_WARNING only for below-threshold total score
    exposure: QA-01-ACT-AUTO-START; max active=1; no reorder/create/skip; no auto publish
acceptance:
- acceptance_uid: QA-01-ACC-01
  item: Single Page + Global Visual
  condition: Only QA-01 executable current QA workspace; old split QA functions merged as sections; Global Shell/Visual inherited
- acceptance_uid: QA-01-ACC-02
  item: Exact Output
  condition: Review always binds explicit output version/artifact/checksum/provenance; no latest/current/default
- acceptance_uid: QA-01-ACC-03
  item: QA Is Judge, Not Editor
  condition: No Script/Asset/Video/Edit mutation control exists; correction routes to original owner
- acceptance_uid: QA-01-ACC-04
  item: Approved QA Criteria
  condition: Scorecard renders task-bound approved CriteriaVersion/QualityGatePolicy; no local threshold or generic schema
- acceptance_uid: QA-01-ACC-05
  item: Hard Gate
  condition: Evidence/Rights/Policy/Checksum/Provenance/Required Check failure overrides numeric score
- acceptance_uid: QA-01-ACC-06
  item: Finding Closure
  condition: No direct Close Finding action; verified new exact version + Recheck required
- acceptance_uid: QA-01-ACC-07
  item: Manual Review
  condition: Required/open ManualReviewCase blocks PASS/Release; page does not fabricate case approval operation
- acceptance_uid: QA-01-ACC-08
  item: Recheck Compare
  condition: Before/After only when verified new exact version exists; otherwise single viewer 100% and no empty B pane
- acceptance_uid: QA-01-ACC-09
  item: Release Boundary
  condition: QA creates ReleasePackage candidate only; no approveRelease or Publish control
- acceptance_uid: QA-01-ACC-10
  item: Permission
  condition: Effectful action uses only registered QA/finding/correction/release permissions plus API account authorization
- acceptance_uid: QA-01-ACC-11
  item: Scrollable Page
  condition: Main Workspace height:auto; overflow-y:auto; not tied to global sidebar height
- acceptance_uid: QA-01-ACC-12
  item: Machine Binding
  condition: Every visible control resolves Section/Component/Visual/Action/Gate/Permission; unlisted=BLOCK
- acceptance_uid: QA-01-ACC-14
  item: AUTO / MANUAL Review Modes
  condition: AUTO reviews all authorized QA tasks in current Topic sequentially with max active=1; MANUAL selects one item at a time
- acceptance_uid: QA-01-ACC-15
  item: Low Score Warning
  condition: AUTO popup warning only when total score is below bound Criteria/Policy threshold; frontend has no hard-coded threshold
- acceptance_uid: QA-01-ACC-16
  item: QA Localization / Evidence
  condition: Video/Edit viewer supports ±1 frame, exact timecode and point/range evidence binding without upstream mutation/manual Evidence
    ID
- acceptance_uid: QA-01-ACC-17
  item: Exact Correction Binding
  condition: Finding/Scorecard/InstructionPackage/OriginalOwner refs auto-bound; Root Cause canonical enum; manual system-ID typing forbidden
- acceptance_uid: QA-01-ACC-13
  item: System/AI Scoring Only
  condition: Scorecard is System/AI generated. Scorecard area contains no human scoring/decision control. Human 修改/通過 exists only inside
    a triggered governed ManualReviewCase.
- acceptance_uid: QA-01-ACC-18
  item: Conditional Manual Review
  condition: 'Only when governed ManualReviewCase is required/open, exactly two human functions render: 修改 and 通過. Manual Review Pass is
    not direct QA Gate PASS and cannot bypass hard gates.'
hard_locks:
- Only QA-01 is the current executable QA workspace page.
- Old QA-02/QA-03/QA-04 functions are integrated into QA-01 sections; AI must not recreate them as separate current pages.
- QA cannot edit Canonical Script, Asset Version, Video Version or Editing Version.
- QA cannot directly execute upstream correction. QA creates CorrectionRequest to the original owner and later rechecks a verified NEW exact
  output version.
- No direct Close Finding button without verified new version + recheck result.
- No generic/default scorecard and no QA-local numeric threshold. Use bound approved QA CriteriaVersion and QualityGatePolicy.
- Hard blocks override numeric score.
- QA PASS does not equal Publish.
- Create Release Candidate/Package is the last QA-owned visible release action; ReleaseService owns later approval/release and PublishingService
  owns publish.
- No approveRelease or Publish button in QA-01 without a separate explicit current permission/control authority.
- No manual filename input/rename and no filename parsing as authority.
- No fake provider, score, evidence, version, runtime, checksum, rights or policy values; missing = —.
- No unlisted Section/Component/Control/Action/State/Gate/Permission/Port/Business Sample Data.
- 'AUTO is Topic-scoped sequential QA: existing authorized task order only, max active task=1, no AI reorder/create/skip.'
- In AUTO, only a below-threshold total score emits QA_LOW_SCORE_WARNING. Hard-block/rights/policy/evidence problems remain BLOCKED and are
  not mislabeled as low-score warnings.
- AUTO never publishes and never creates a Release Candidate from score alone.
- Top Context Bar is read-only context chips; Project/Topic/QATask/TargetOutput/State are never input/select controls on QA-01.
- Finding Evidence IDs and Correction system IDs/owner/lineage are auto-bound from exact context; manual system-ID typing is forbidden.
- System/AI performs QA scoring. Scorecard area has no human action after scoring.
- 'Only when a governed ManualReviewCase is required/open after scoring, the Human sees exactly two Manual Review functions: 修改 / 通過.'
- Manual Review 通過 closes/passes the Manual Review requirement and returns to normal QA Gate evaluation; it is not direct QA Gate PASS and
  cannot bypass Hard Gate/Rights/Policy/Evidence blockers.
- Manual Review 修改 enters the governed modification flow for that ManualReviewCase/current evaluated item; it must not become a blank scoring
  form.
