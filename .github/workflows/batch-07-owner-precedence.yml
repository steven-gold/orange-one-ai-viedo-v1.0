name: ACPOS Batch 07 Canonical Owner Precedence

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-07-owner-precedence
  cancel-in-progress: false

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Verify no Word drift since Batch 06
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="8cf44f68d3e105540fc5f1ad93f25350665035c9"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-06")
          PY

      - name: Preflight script syntax
        run: python -m py_compile __temp/batch_07_owner_precedence.py

      - name: Baseline DOCX encoding audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,json
          fn="ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13}
          with zipfile.ZipFile(fn) as z:
              xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
              errs=[]
              for n in xmls:
                  try:ET.fromstring(z.read(n))
                  except Exception as e:errs.append((n,str(e)))
              assert not errs,errs
              root=ET.fromstring(z.read("word/document.xml"))
              ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
              text="".join((e.text or "") for e in root.iter(ns+"t"))
          assert "\x00" not in text
          ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
          assert not ctrl[:20],ctrl[:20]
          hits=[x for x in bad if x in text]
          assert not hits,hits
          assert "\ufffd" not in unicodedata.normalize("NFC",text)
          Path("__batch07_baseline_encoding.json").write_text(json.dumps({"xml_parts":len(xmls),"chars":len(text),"status":"PASS"},ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-07 BASELINE ENCODING")
          PY

      - name: Apply Batch 07 owner precedence closure
        run: python __temp/batch_07_owner_precedence.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch07_owner_precedence_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["denominator"]==310,m
          assert m["owner_classification"]=={"CANONICAL_OWNER_ROW_ABSENT":28,"CANONICAL_OWNER_ROW_FIELD_UNDEFINED":282},m["owner_classification"]
          assert m["alias_observation"]=={"ALIAS_VALUE_CONFLICT":54,"NO_ALIAS_VALUE":210,"UNIQUE_ALIAS_VALUE":46},m["alias_observation"]
          assert m["admissible_direct_binding"]==0,m
          assert len(r["ledger"])==310,len(r["ledger"])
          d=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          t="\n".join([p.text for p in d.paragraphs]+[c.text for tb in d.tables for row in tb.rows for c in row.cells])
          for token in [
            "ACPOS-20260921-BATCH-07-CANONICAL-OWNER-PRECEDENCE-V1",
            "Canonical Owner-Row Precedence",
            "CANONICAL_OWNER_ROW_FIELD_UNDEFINED",
            "CANONICAL_OWNER_ROW_ABSENT",
            "BATCH07_MACHINE_JSON=",
            "DEV-01-GATE-MESSAGE-REVIEW"
          ]: assert token in t,token
          print("PASS: BATCH-07 SEMANTIC OWNER PRECEDENCE 310/310")
          PY

      - name: Convert DOCX to PDF
        shell: bash
        run: |
          mkdir -p __render_qa_batch07/pdf
          libreoffice --headless --convert-to pdf --outdir __render_qa_batch07/pdf             ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx

      - name: Post-conversion encoding and garble audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          docx=Path("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          pdf=Path("__render_qa_batch07/pdf")/(docx.stem+".pdf")
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed={9,10,12,13}
          with zipfile.ZipFile(docx) as z:
              xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
              errs=[]
              for n in xmls:
                  try:ET.fromstring(z.read(n))
                  except Exception as e:errs.append((n,str(e)))
              assert not errs,errs
              root=ET.fromstring(z.read("word/document.xml"))
              ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
              src="".join((e.text or "") for e in root.iter(ns+"t"))
          pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
          for label,text in [("DOCX",src),("PDF",pdftext)]:
              assert "\x00" not in text,(label,"NUL")
              ctrl=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed]
              assert not ctrl[:20],(label,ctrl[:20])
              hits=[x for x in bad if x in text]
              assert not hits,(label,hits)
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(label,"NFC_REPLACEMENT")
          cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          sc=len(cjk.findall(src));pc=len(cjk.findall(pdftext));assert sc>0
          ratio=pc/sc;assert ratio>=0.97,(sc,pc,ratio)
          report={"xml_parts":len(xmls),"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch07/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-07 ENCODING/GARBLE INTEGRITY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Render PNGs geometry and contact sheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,math
          from PIL import Image,ImageChops,ImageDraw
          p=Path("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          qa=Path("__render_qa_batch07");pdf=qa/"pdf";png=qa/"png"/p.stem;contact=qa/"contact"
          png.mkdir(parents=True,exist_ok=True);contact.mkdir(parents=True,exist_ok=True)
          pf=pdf/(p.stem+".pdf")
          info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
          pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
          subprocess.run(["pdftoppm","-png","-r","140",str(pf),str(png/"page")],check=True,stdout=subprocess.DEVNULL)
          imgs=sorted(png.glob("page-*.png"));assert len(imgs)==pages
          blank=[];edge=[];thumbs=[]
          for i,img in enumerate(imgs,1):
              im=Image.open(img).convert("RGB")
              diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
              bb=diff.getbbox()
              if bb is None:blank.append(i)
              else:
                  l,t,r,b=bb
                  if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
              th=im.copy();th.thumbnail((420,594))
              canvas=Image.new("RGB",(440,630),"white");canvas.paste(th,((440-th.width)//2,10))
              ImageDraw.Draw(canvas).text((10,610),f"page {i}",fill="black");thumbs.append(canvas)
          assert not blank,blank
          assert not edge,edge
          cols=4;rows=math.ceil(len(thumbs)/cols)
          sheet=Image.new("RGB",(cols*440,rows*630),"white")
          for i,th in enumerate(thumbs):sheet.paste(th,((i%cols)*440,(i//cols)*630))
          sheet.save(contact/(p.stem+".jpg"),quality=88)
          report={"documents":1,"pages":pages,"blank":blank,"edge":edge}
          Path("__render_qa_batch07/geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH-07 RENDER/GEOMETRY",json.dumps(report,ensure_ascii=False))
          PY

      - name: Verify exact Batch 07 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={"ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"}
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-07 CHANGE SCOPE EXACT 1 WORD")
          PY

      - name: Collect evidence
        run: |
          cp __batch07_owner_precedence_report.json __render_qa_batch07/
          cp __batch07_baseline_encoding.json __render_qa_batch07/

      - name: Upload Batch 07 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-07-owner-precedence-evidence
          path: __render_qa_batch07
          retention-days: 1

      - name: Commit Batch 07 and remove temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch07 __temp/__pycache__ __batch07_owner_precedence_report.json __batch07_baseline_encoding.json
          git rm __temp/batch_07_owner_precedence.py .github/workflows/batch-07-owner-precedence.yml
          git config user.name "acpos-word-batch-07"
          git config user.email "actions@users.noreply.github.com"
          git add ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          git commit -m "docs(acpos): enforce canonical owner-row precedence for 310 gaps"
          git push
