name: Governance v2.1.12 Stage Test Correction Promotion Policy Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-stage-test-correction-promotion-policy-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate Stage Test correction-promotion operational policy
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_stage_test_correction_promotion_policy.py
      - name: Upload machine-readable correction-promotion policy result
        uses: actions/upload-artifact@v4
        with:
          name: stage-test-correction-promotion-policy
          path: stage_test_correction_promotion_policy_result.json
          if-no-files-found: error
