name: Current Governance Selected Execution Profile Integrity Gate

on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-profile-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce explicit authorization before Current Specification mutation
        run: python governance/ci/specification_mutation_guard.py
      - name: Regression test specification mutation cycle boundary
        run: python governance/ci/test_specification_mutation_guard_cycle_boundary.py
      - name: Resolve active governance through stable registry
        run: python governance/ci/governance_resolver.py
      - name: Validate canonical rule registry anti-drift binding
        run: python governance/ci/validate_canonical_rule_registry.py
      - name: Validate reusable governance portability and machine-layer profile isolation
        run: python governance/ci/validate_governance_portability.py
      - name: Validate neutral validation remediation closure protocol
        run: python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Validate governance layout and zero residual
        run: python governance/ci/validate_governance_layout.py
      - name: Validate authoring reference duplicate conflict and residual governance coverage
        run: python governance/ci/validate_authoring_reference_governance_coverage.py
      - name: Validate active consumer reference integrity
        run: python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Validate structured mutation selector safety
        run: |
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_structured_mutation_safety.py --self-test
      - name: Stress test registry resolution and fail-closed invariants
        run: python governance/ci/stress_test_governance_registry.py
      - name: Validate selected execution profile and profile-local evidence
        run: python governance/ci/validate_selected_execution_profile_integrity.py
      - name: Validate common Stage Execution Engine across selected profile
        run: python governance/ci/stage_execution_engine.py --definition-audit-all
      - name: Regression test common Stage Execution Engine
        run: python governance/ci/test_stage_execution_engine.py
      - name: Regression test Stage-01 frozen-projection execution scanner
        run: python governance/ci/validate_stage01_frozen_projection_execution.py --self-test
      - name: Regression test product-neutral content integrity engine
        run: python governance/ci/test_content_integrity_engine.py
      - name: Regression test typography computed metrics evidence validator
        run: python governance/ci/test_typography_metrics_evidence.py
      - name: Validate profile-local finding closure readiness
        run: python governance/test/validate_selected_profile_finding_closure.py
      - name: Upload profile-local finding closure readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: selected-profile-finding-closure-readiness
          path: governance/test/FINDING_CLOSURE_READINESS.json
          if-no-files-found: error
