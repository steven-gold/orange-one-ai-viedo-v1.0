name: Stage-02 Functional Material Remediation R3

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - governance/ci/materialize_current_stage2_functional_remediation_r3.py
      - governance/ci/validate_current_stage2_functional_remediation_r3.py
      - .github/workflows/stage02-functional-material-remediation-r3.yml

permissions:
  contents: write

jobs:
  materialize-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify exact governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Freeze formal Current Specification
        run: python governance/ci/specification_mutation_guard.py
      - name: Verify R3 classification exists and structural Stage-02 remains valid
        run: |
          test -f governance/test/stage02/STAGE02_FUNCTIONAL_REMEDIABILITY_CLASSIFICATION_R3.yaml
          python governance/ci/validate_current_stage2_materialized_closure.py
      - name: Materialize only strict R3-admissible product contract closures
        run: python governance/ci/materialize_current_stage2_functional_remediation_r3.py
      - name: Validate exact R3 remediation set
        run: python governance/ci/validate_current_stage2_functional_remediation_r3.py
      - name: Prove frozen authority and immutable predecessor inputs unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: only Stage-02 owning product/contract output + non-normative receipt changed'
      - name: Commit materialized Stage-02 functional closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml \
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml \
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/PAGE_CONSTRUCTION_SPEC_PACKAGE.yaml \
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/PAGE_CONSTRUCTION_SPEC_PACKAGE.yaml \
            governance/test/stage02/STAGE02_FUNCTIONAL_MATERIAL_REMEDIATION_R3_RECEIPT.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: no owning-layer material remediation was produced' >&2
            exit 1
          fi
          git commit -m 'fix(stage02): materialize 17 bounded functional closures R3'
          git push origin HEAD:rebuild-v2.1.1
      - name: Upload remediation receipt and ledgers
        uses: actions/upload-artifact@v4
        with:
          name: stage02-functional-material-remediation-r3
          path: |
            governance/test/stage02/STAGE02_FUNCTIONAL_MATERIAL_REMEDIATION_R3_RECEIPT.yaml
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml
            00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml
          if-no-files-found: error
