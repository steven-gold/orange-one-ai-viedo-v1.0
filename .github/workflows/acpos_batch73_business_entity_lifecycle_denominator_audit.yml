name: ACPOS Batch 73 Business Entity Lifecycle Denominator Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch73_business_entity_lifecycle_denominator_audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build Business Entity lifecycle and hierarchy denominator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections, json, re, subprocess, zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="6e2a85908672f8933439c7936c3d2ce488ce5de1"
          WF=Path(".github/workflows/acpos_batch73_business_entity_lifecycle_denominator_audit.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift:
              raise SystemExit(f"PRE_AUDIT_TREE_DRIFT {drift}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          REQUIRED_OPS=[
            "DISCOVER_OR_LIST","SELECT_OR_OPEN","CREATE","CREATION_MODE","PARENT_BIND",
            "CATEGORY_OR_GROUP_BIND","DRAFT","RESUME","EDIT","SAVE","VALIDATE",
            "CONFIRM_OR_APPROVE","VERSION","REVISE","LOCK_OR_UNLOCK","REORDER",
            "MOVE_OR_REPARENT","ARCHIVE_OR_DELETE","RESTORE","DEPENDENCY_IMPACT",
            "AUDIT","ERROR_RECOVERY","NEXT_STEP",
          ]
          HIER_FIELDS=[
            "parent_identity","child_identity","cardinality","creation_entry","payload_or_reference_binding",
            "ordering_semantics","permission","state_dependency","version_dependency","move_or_reparent",
            "archive_or_delete_propagation","upstream_change_impact","downstream_revalidation","authority_evidence",
          ]
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          OP_ALIASES={
            "DISCOVER_OR_LIST":["DISCOVER_OR_LIST","DISCOVER","LIST","清單","列表","瀏覽","查詢"],
            "SELECT_OR_OPEN":["SELECT_OR_OPEN","SELECT","OPEN","選擇","開啟","查看"],
            "CREATE":["CREATE","新增","建立","創建"],
            "CREATION_MODE":["CREATION_MODE","CREATE MODE","建立模式","新增模式"],
            "PARENT_BIND":["PARENT_BIND","PARENT BIND","父層綁定","父項綁定"],
            "CATEGORY_OR_GROUP_BIND":["CATEGORY_OR_GROUP_BIND","CATEGORY BIND","GROUP BIND","分類綁定","群組綁定"],
            "DRAFT":["DRAFT","草稿"],
            "RESUME":["RESUME","續作","繼續"],
            "EDIT":["EDIT","編輯","修改"],
            "SAVE":["SAVE","儲存","保存"],
            "VALIDATE":["VALIDATE","VALIDATION","驗證","校驗"],
            "CONFIRM_OR_APPROVE":["CONFIRM_OR_APPROVE","CONFIRM","APPROVE","確認","核准","審批"],
            "VERSION":["VERSION","版本"],
            "REVISE":["REVISE","REVISION","修訂","改版"],
            "LOCK_OR_UNLOCK":["LOCK_OR_UNLOCK","LOCK","UNLOCK","鎖定","解鎖"],
            "REORDER":["REORDER","排序","重排"],
            "MOVE_OR_REPARENT":["MOVE_OR_REPARENT","REPARENT","MOVE","移動","改掛","變更父層"],
            "ARCHIVE_OR_DELETE":["ARCHIVE_OR_DELETE","ARCHIVE","DELETE","封存","刪除"],
            "RESTORE":["RESTORE","還原","恢復"],
            "DEPENDENCY_IMPACT":["DEPENDENCY_IMPACT","DEPENDENCY","IMPACT","依賴影響","影響分析"],
            "AUDIT":["AUDIT","稽核","審計"],
            "ERROR_RECOVERY":["ERROR_RECOVERY","RECOVERY","ROLLBACK","錯誤恢復","復原","回滾"],
            "NEXT_STEP":["NEXT_STEP","NEXT ACTION","下一步","下一動作"],
          }
          ENTITY_HEADERS=["BUSINESS ENTITY","BUSINESS_ENTITY","ENTITY","ENTITY NAME","實體","業務實體","商業實體","對象"]
          APPLICABILITY_TERMS=["REQUIRED","OPTIONAL","NOT_APPLICABLE","N/A","NA","必須","必填","選用","可選","不適用"]
          AUTH_TERMS=["AUTHORITY","AUTHORITY EVIDENCE","AUTHORITY REF","EVIDENCE","權威","依據","證據"]
          HIER_ALIASES={
            "parent_identity":["PARENT","PARENT ID","PARENT UID","父","父層","父項"],
            "child_identity":["CHILD","CHILD ID","CHILD UID","子","子層","子項"],
            "cardinality":["CARDINALITY","基數","一對多","一對一","多對多"],
            "creation_entry":["CREATION ENTRY","CREATE ENTRY","新增入口","建立入口"],
            "payload_or_reference_binding":["PAYLOAD","REFERENCE BINDING","REF BINDING","REFERENCE","引用綁定","參照綁定"],
            "ordering_semantics":["ORDERING","ORDER","SORT","排序"],
            "permission":["PERMISSION","AUTH","權限"],
            "state_dependency":["STATE DEPENDENCY","STATE","狀態依賴"],
            "version_dependency":["VERSION DEPENDENCY","VERSION","版本依賴"],
            "move_or_reparent":["REPARENT","MOVE","移動","改掛","變更父層"],
            "archive_or_delete_propagation":["ARCHIVE","DELETE PROPAGATION","DELETE","封存","刪除傳播","級聯刪除"],
            "upstream_change_impact":["UPSTREAM CHANGE","IMPACT","上游變更","影響"],
            "downstream_revalidation":["REVALIDATION","REVALIDATE","下游重驗","重新驗證"],
            "authority_evidence":["AUTHORITY","EVIDENCE","權威","證據","依據"],
          }

          def norm(s):
              return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def txt(el):
              return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def upper(s): return norm(s).upper()
          def has_any(s, aliases):
              u=upper(s)
              return any(a.upper() in u for a in aliases)
          def match_header(headers, aliases):
              for i,h in enumerate(headers):
                  if has_any(h,aliases): return i
              return None

          def parse_doc(path):
              with zipfile.ZipFile(path) as z:
                  root=ET.fromstring(z.read("word/document.xml"))
              tables=[]
              paras=[norm("".join((x.text or "") for x in p.iter(W+"t"))) for p in root.iter(W+"p")]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[]
                  for tr in trs:
                      rows.append([txt(c) for c in list(tr) if c.tag==W+"tc"])
                  headers=rows[0] if rows else []
                  tables.append({"table":ti,"headers":headers,"rows":rows[1:]})
              return paras,tables

          entities=[]
          operation_evidence=[]
          hierarchy_edges=[]
          entity_table_hits=[]
          hierarchy_table_hits=[]

          for page,fn in PAGE_DOCS.items():
              paras,tables=parse_doc(fn)
              page_text="\n".join(paras)
              for t in tables:
                  headers=t["headers"]
                  # Entity-bearing tables require an explicit entity-like header,
                  # or an operation-matrix header with row labels in first column.
                  ei=match_header(headers,ENTITY_HEADERS)
                  op_cols={}
                  for op,aliases in OP_ALIASES.items():
                      idx=match_header(headers,aliases)
                      if idx is not None: op_cols[op]=idx
                  applicability_col=match_header(headers,APPLICABILITY_TERMS)
                  authority_col=match_header(headers,AUTH_TERMS)

                  if ei is not None:
                      entity_table_hits.append({"page":page,"file":fn,"table":t["table"],"headers":headers})
                      for ri,row in enumerate(t["rows"],2):
                          if ei>=len(row): continue
                          name=norm(row[ei])
                          if not name or name in {"—","-","N/A","NA"}: continue
                          # Reject obvious header-like or generic labels.
                          if upper(name) in {upper(x) for x in ENTITY_HEADERS}: continue
                          ent={"page":page,"file":fn,"table":t["table"],"row":ri,"entity":name}
                          entities.append(ent)
                          for op,idx in op_cols.items():
                              if idx<len(row) and norm(row[idx]):
                                  val=norm(row[idx])
                                  operation_evidence.append({
                                    **ent,"operation":op,"raw_value":val,
                                    "has_applicability":has_any(val,APPLICABILITY_TERMS),
                                    "authority_evidence":norm(row[authority_col]) if authority_col is not None and authority_col<len(row) else "",
                                  })

                  # Long-form operation matrix where first column holds operation names.
                  if headers and len(headers)>=2:
                      first_header=upper(headers[0])
                      if any(x in first_header for x in ["OPERATION","操作","LIFECYCLE","生命週期"]):
                          for ri,row in enumerate(t["rows"],2):
                              if not row:continue
                              opname=norm(row[0])
                              matched=[]
                              for op,aliases in OP_ALIASES.items():
                                  if has_any(opname,aliases):matched.append(op)
                              if matched:
                                  operation_evidence.append({
                                    "page":page,"file":fn,"table":t["table"],"row":ri,
                                    "entity":"__TABLE_LEVEL__","operation":matched[0],
                                    "raw_value":" | ".join(row[1:]),
                                    "has_applicability":any(has_any(c,APPLICABILITY_TERMS) for c in row[1:]),
                                    "authority_evidence":" | ".join(c for c in row[1:] if has_any(c,AUTH_TERMS)),
                                  })

                  # Hierarchy edge table: must carry distinguishable parent and child columns.
                  pi=match_header(headers,HIER_ALIASES["parent_identity"])
                  ci=match_header(headers,HIER_ALIASES["child_identity"])
                  if pi is not None and ci is not None and pi!=ci:
                      hierarchy_table_hits.append({"page":page,"file":fn,"table":t["table"],"headers":headers})
                      field_cols={f:match_header(headers,aliases) for f,aliases in HIER_ALIASES.items()}
                      for ri,row in enumerate(t["rows"],2):
                          parentv=norm(row[pi]) if pi<len(row) else ""
                          childv=norm(row[ci]) if ci<len(row) else ""
                          if not parentv and not childv:continue
                          rec={"page":page,"file":fn,"table":t["table"],"row":ri}
                          for f,idx in field_cols.items():
                              rec[f]=norm(row[idx]) if idx is not None and idx<len(row) else ""
                          hierarchy_edges.append(rec)

          # Deduplicate entity identities only within the same page; keep source evidence.
          ent_sources=collections.defaultdict(list)
          for e in entities:
              key=(e["page"],e["entity"])
              ent_sources[key].append({k:e[k] for k in ["file","table","row"]})
          entity_keys=sorted(ent_sources)

          op_by_entity=collections.defaultdict(lambda:collections.defaultdict(list))
          table_level_ops=collections.defaultdict(lambda:collections.defaultdict(list))
          for x in operation_evidence:
              target=table_level_ops if x["entity"]=="__TABLE_LEVEL__" else op_by_entity
              target[(x["page"],x["entity"])][x["operation"]].append(x)

          # Build denominator only from physically enumerated entity identities.
          # Table-level lifecycle rows are evidence for the page, but never silently
          # assigned to every entity unless the document explicitly binds them.
          denominator=[]
          for page,entity in entity_keys:
              opmap=op_by_entity.get((page,entity),{})
              for op in REQUIRED_OPS:
                  ev=opmap.get(op,[])
                  if ev:
                      vals=sorted(set(x["raw_value"] for x in ev))
                      has_app=any(x["has_applicability"] for x in ev)
                      auth=sorted(set(x["authority_evidence"] for x in ev if x["authority_evidence"]))
                      disposition="EXPLICIT_CELL_WITH_APPLICABILITY" if has_app else "EXPLICIT_CELL_NO_CANONICAL_APPLICABILITY"
                  else:
                      vals=[];auth=[]
                      disposition="NO_ENTITY_BOUND_OPERATION_EVIDENCE"
                  denominator.append({
                    "page":page,"entity":entity,"operation":op,
                    "disposition":disposition,"raw_values":vals,
                    "authority_evidence":auth,
                  })

          # Hierarchy completeness only for physically identified edges.
          hierarchy_missing=[]
          for e in hierarchy_edges:
              miss=[f for f in HIER_FIELDS if not norm(e.get(f,""))]
              if miss:
                  hierarchy_missing.append({
                    "page":e["page"],"table":e["table"],"row":e["row"],
                    "parent":e.get("parent_identity",""),"child":e.get("child_identity",""),
                    "missing_fields":miss,
                  })

          by_disp=collections.Counter(x["disposition"] for x in denominator)
          by_page_entities=collections.Counter(p for p,_ in entity_keys)
          unresolved_pairs=[x for x in denominator if x["disposition"]!="EXPLICIT_CELL_WITH_APPLICABILITY"]
          no_bound=[x for x in denominator if x["disposition"]=="NO_ENTITY_BOUND_OPERATION_EVIDENCE"]
          explicit_no_app=[x for x in denominator if x["disposition"]=="EXPLICIT_CELL_NO_CANONICAL_APPLICABILITY"]

          page_table_level={p:sorted(opmap.keys()) for (p,e),opmap in table_level_ops.items() if e=="__TABLE_LEVEL__"}

          pages_without_entities=sorted(set(PAGE_DOCS)-set(p for p,_ in entity_keys))
          pages_without_hierarchy=sorted(set(PAGE_DOCS)-set(e["page"] for e in hierarchy_edges))

          summary={
            "marker":"ACPOS-20260922-BATCH-73-BUSINESS-ENTITY-LIFECYCLE-DENOMINATOR-V1",
            "base_head":EXPECTED_PARENT,
            "page_docs":len(PAGE_DOCS),
            "business_entity_identities":len(entity_keys),
            "business_entity_source_rows":len(entities),
            "entities_by_page":dict(by_page_entities),
            "required_operation_types":len(REQUIRED_OPS),
            "entity_operation_denominator":len(denominator),
            "explicit_with_applicability":by_disp.get("EXPLICIT_CELL_WITH_APPLICABILITY",0),
            "explicit_without_canonical_applicability":len(explicit_no_app),
            "no_entity_bound_operation_evidence":len(no_bound),
            "unresolved_entity_operation_pairs":len(unresolved_pairs),
            "pages_without_enumerated_entity_identity":pages_without_entities,
            "hierarchy_edges":len(hierarchy_edges),
            "hierarchy_edges_with_missing_required_fields":len(hierarchy_missing),
            "pages_without_physical_hierarchy_edges":pages_without_hierarchy,
            "entity_tables":len(entity_table_hits),
            "hierarchy_tables":len(hierarchy_table_hits),
            "pages_with_table_level_lifecycle_evidence":len(page_table_level),
          }
          out={
            "summary":summary,
            "required_operations":REQUIRED_OPS,
            "entities":[{"page":p,"entity":e,"sources":ent_sources[(p,e)]} for p,e in entity_keys],
            "entity_operation_denominator":denominator,
            "unresolved_entity_operation_pairs":unresolved_pairs,
            "hierarchy_edges":hierarchy_edges,
            "hierarchy_missing_required_fields":hierarchy_missing,
            "page_table_level_lifecycle_evidence":page_table_level,
            "entity_table_hits":entity_table_hits,
            "hierarchy_table_hits":hierarchy_table_hits,
          }
          Path("__batch73_entity_lifecycle_denominator.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch73_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH73_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH73_DENOMINATOR_BUILT")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch73-business-entity-lifecycle-denominator
          path: |
            __batch73_entity_lifecycle_denominator.json
            __batch73_summary.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch73_entity_lifecycle_denominator.json __batch73_summary.json
          git config user.name "acpos-batch73-audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch73_business_entity_lifecycle_denominator_audit.yml" ]; then
            printf '%s\n' "${staged[@]}"
            exit 1
          fi
          git commit -m "chore(acpos): close batch 73 entity lifecycle denominator harness"
          git push origin HEAD:0921acpos
