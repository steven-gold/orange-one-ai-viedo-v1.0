  authority_ref_unique: true
  consumer_source_uid_must_resolve_to_captured_raw_source: true
  authority_evidence_ref_required: true
  must_preserve_until_authoritative_resolution: true
  drop_or_silent_ignore: BLOCK
  ai_auto_fill: BLOCK
  ai_inference_as_resolution: BLOCK
  similarity_or_alias_substitution_as_resolution: BLOCK
  default_value_as_resolution: BLOCK
  false_satisfied_or_resolved_state: BLOCK
  blueprint_carry_forward_required: true
  blueprint_carry_field: unresolved_external_authority_refs
  blueprint_carry_must_preserve_gap_uid_authority_ref_and_disposition: true
  resolution_requires: [AUTHORITATIVE_SOURCE_MATERIALIZED, EXACT_AUTHORITY_REF_MATCH, AUTHORITY_CONTENT_HASH, AUTHORITY_EVIDENCE_REF]
  applies_through: [SOURCE_FACT_MATERIALIZATION, RESPONSIBILITY_CLASSIFICATION, BASE_BLUEPRINT, BLUEPRINT_BINDING, COMPILER, RUNTIME_CONSTRUCTION, VALIDATION_QA, RELEASE_GATE]
