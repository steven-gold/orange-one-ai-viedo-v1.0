name: INFO01 authority bindings
on:
  push:
    paths:
      - '.github/workflows/info01-bindings-once.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate control bindings
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import json,yaml
          p=Path('authority/pages/workspace/INFO-01/ACPOS_INFO-01_FINAL_LOCKED_ENCODING.yaml')
          d=yaml.safe_load(p.read_text())
          controls=d['registries']['controls']
          actions={x['action_uid']:x for x in d['registries']['actions']}
          bindings=d['control_bindings']
          assert len(controls)==66 and len(bindings)==66 and len(actions)==17
          by_control={x['control_uid']:x for x in controls}
          out={}
          for b in bindings:
              uid=b['control_uid']; c=by_control[uid]; action=b['action_uid']
              assert action in actions
              assert c['section_uid']==b['section_uid'] and c['component_uid']==b['component_uid'] and c['visual_uid']==b['visual_uid']
              assert c['action_uid']==action and c['gate_uid']==b['gate_uid'] and c['permission_uid']==b['permission_uid']
              a=actions[action]
              out[uid]={'action_uid':action,'gate_uid':b['gate_uid'],'permission_uid':b['permission_uid'],'effect_type':a['effect_type'],'operation':a.get('operation'),'method_path':a.get('method_path'),'error_uid':a['error_uid']}
          assert len(out)==66
          Path('src/domain/info/infoControlBindings.ts').write_text('// GENERATED FROM INFO-01 FINAL_LOCKED AUTHORITY. DO NOT HAND-EDIT.\nexport const INFO_CONTROL_BINDINGS = '+json.dumps(out,ensure_ascii=False,separators=(',',':'))+' as const;\nexport type InfoControlUid = keyof typeof INFO_CONTROL_BINDINGS;\nexport const INFO_MATERIALIZED_CONTROL_COUNT = 66 as const;\nexport const INFO_MATERIALIZED_ACTION_COUNT = 17 as const;\n')
          PY
      - name: Validate
        run: |
          node - <<'NODE'
          const s=require('fs').readFileSync('src/domain/info/infoControlBindings.ts','utf8');
          for(const x of ['INFO-01-ACT-REFRESH','INFO-01-ACT-SEARCH','INFO-01-ACT-EXPORT','INFO-01-ACT-ADOPT-CONTEXT','INFO-01-ACT-CANDIDATE-DECIDE'])if(!s.includes(x))throw new Error('missing '+x);
          if(!s.includes('INFO_MATERIALIZED_CONTROL_COUNT = 66'))throw new Error('control count');
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/info01-bindings-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/info/infoControlBindings.ts .github/workflows/info01-bindings-once.yml
          git commit -m "materialize(info): bind 66 controls to FINAL_LOCKED authority"
          git push origin HEAD:new
