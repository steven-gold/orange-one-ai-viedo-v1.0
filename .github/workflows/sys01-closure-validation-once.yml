name: SYS-01 closure validation

on:
  push:
    branches:
      - acpos-sys01-closure-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: SYS authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re
          auth=Path('authority/pages/admin/SYS-01/ACPOS_SYS-01_SYSTEM_LIFECYCLE_AI_FINAL_DESIGN_ENCODING.yaml').read_text()
          visual=Path('src/components/pages/SystemVisual.tsx').read_text()
          contract=Path('src/domain/system/systemRuntimeContract.ts').read_text()
          projection=Path('src/domain/system/systemProjectionPort.ts').read_text()
          controlled=Path('src/server/testing/controlledSystemTestRuntime.ts').read_text()
          shared=Path('src/server/shared/uiProjectionRuntime.ts').read_text()
          controls=set(re.findall(r'control_uid:\s*(SYS-01-[A-Z0-9-]+)',auth))
          sections=set(re.findall(r'(SEC-ADMIN-SYS-01-[A-Z0-9-]+)',auth))
          print('SYS_AUTHORITY_COUNTS',{'controls':len(controls),'sections':len(sections)})
          assert 'SYS_CURRENT_CONTROL_COUNT = 12' in contract
          assert 'SYS_SECTION_COUNT = 8' in contract
          registry=set(re.findall(r'control_uid:\s*"(SYS-01-[A-Z0-9-]+)"',contract))
          assert len(registry)==12
          assert registry.issubset(controls)
          assert all(x in visual for x in registry)
          for err in ['SYS-01-ERR-AI-MODE-CONTEXT','SYS-01-ERR-MULTI-AI-ROUTE','SYS-01-ERR-COUNCIL-MODE']:
            assert err in auth and err in visual
          assert 'SystemProjectionTestMetadata' in projection
          assert 'production_eligible!==false' in projection
          assert 'test_metadata:TEST_METADATA' in controlled
          assert 'controlledSystemProjection' in shared and 'admin:SYS-01' in shared
          assert 'data-effectful-runtime-ready="false"' in visual
          for cid in ['SYS-01-BTN-ATTACH','SYS-01-BTN-SEND','SYS-01-BTN-STOP','SYS-01-BTN-CANDIDATE-CREATE','SYS-01-BTN-CR-CREATE','SYS-01-BTN-NAV-OPEN','SYS-01-BTN-SANDBOX-TEST']:
            assert cid in visual
          assert 'manual_provider_picker: FORBIDDEN' in auth
          assert 'direct_provider_sdk_or_secret_editor: FORBIDDEN' in auth
          assert 'no_parallel_system_rule: true' in auth
          print('SYS_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production SYS must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3201 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/sys-prod.log 2>&1 &
          pid=$!; trap 'cat /tmp/sys-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3201/admin/system >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/sys-prod-proj.json -w '%{http_code}' 'http://127.0.0.1:3201/v1/ui-projections/admin%3ASYS-01')
          cat /tmp/sys-prod-proj.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/sys-prod-proj.json
          ! grep -q 'TEST_ONLY' /tmp/sys-prod-proj.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled SYS projection classification
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3202 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/sys-controlled.log 2>&1 &
          pid=$!; trap 'cat /tmp/sys-controlled.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3202/admin/system >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/sys-controlled-proj.json -w '%{http_code}' 'http://127.0.0.1:3202/v1/ui-projections/admin%3ASYS-01')
          test "$code" = "200"
          python <<'PY'
          import json
          d=json.load(open('/tmp/sys-controlled-proj.json'))
          m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY'
          assert m['synthetic'] is True
          assert m['production_eligible'] is False
          assert d['page_state']=='READY'
          assert d['system_change_id']=='TEST-SYS-CHANGE-001'
          assert d['conversation_id']=='TEST-SYS-CONVERSATION-001'
          assert d['thread_id']=='TEST-SYS-THREAD-001'
          assert d['branch_id']=='TEST-SYS-BRANCH-001'
          assert d['multi_ai_route_available'] is True
          print('SYS_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled SYS browser interactions
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3203 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/sys-browser.log 2>&1 &
          pid=$!; trap 'cat /tmp/sys-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3203/admin/system >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1300}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3203/admin/system',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`SYS route ${res&&res.status()} ${width}`);
              await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:SYS-01"]')?.getAttribute('data-page-state')==='READY');
              const root=page.locator('[data-page-uid="admin:SYS-01"]');
              if(await root.getAttribute('data-authority-controls')!=='12')throw new Error('SYS control count mismatch');
              if(await root.getAttribute('data-authority-sections')!=='8')throw new Error('SYS section count mismatch');
              if(await root.getAttribute('data-data-classification')!=='TEST_ONLY'||await root.getAttribute('data-production-eligible')!=='false')throw new Error('SYS classification missing');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>0)throw new Error(`SYS horizontal overflow ${overflow} ${width}`);
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1500}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3203/admin/system',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:SYS-01"]')?.getAttribute('data-page-state')==='READY');
            const root=page.locator('[data-page-uid="admin:SYS-01"]');
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            const before={change:(await page.locator('header strong').last().textContent())||'',body:(await page.locator('body').textContent())||''};
            if(!before.body.includes('TEST-SYS-CHANGE-001')||!before.body.includes('TEST-SYS-CONVERSATION-001')||!before.body.includes('TEST-SYS-THREAD-001')||!before.body.includes('TEST-SYS-BRANCH-001'))throw new Error('SYS exact context refs missing');
            if(await root.getAttribute('data-system-context-resolved')!=='true'||await root.getAttribute('data-active-conversation-context-resolved')!=='true'||await root.getAttribute('data-mode-gate-ready')!=='true'||await root.getAttribute('data-multi-ai-route-ready')!=='true')throw new Error('SYS mode gates not resolved');
            const draft=q('SYS-01-INP-MESSAGE');
            await draft.fill('保留同一 SYSTEM_CHANGE_ID 的設計討論草稿。');
            if(!(await q('SYS-01-BTN-SINGLE-AI').getAttribute('aria-pressed')==='true'))throw new Error('SYS Single AI not initial');
            await q('SYS-01-BTN-MULTI-AI').click();
            if(await root.getAttribute('data-ai-mode')!=='MULTI_AI')throw new Error('SYS Multi AI switch failed');
            const discussion=q('SYS-01-BTN-COUNCIL-DISCUSSION'),parallel=q('SYS-01-BTN-COUNCIL-PARALLEL');
            if(await discussion.isHidden()||await parallel.isHidden()||await parallel.isDisabled())throw new Error('SYS council controls unavailable');
            await parallel.click();
            if(await root.getAttribute('data-council-mode')!=='PARALLEL')throw new Error('SYS Parallel switch failed');
            await discussion.click();
            if(await root.getAttribute('data-council-mode')!=='DISCUSSION')throw new Error('SYS Discussion switch failed');
            const bodyAfterModes=(await page.locator('body').textContent())||'';
            if(!bodyAfterModes.includes('TEST-SYS-CHANGE-001')||!bodyAfterModes.includes('TEST-SYS-CONVERSATION-001')||!bodyAfterModes.includes('TEST-SYS-THREAD-001')||!bodyAfterModes.includes('TEST-SYS-BRANCH-001'))throw new Error('SYS context changed during mode switch');
            if(await draft.inputValue()!=='保留同一 SYSTEM_CHANGE_ID 的設計討論草稿。')throw new Error('SYS draft reset during mode switch');
            await q('SYS-01-BTN-SINGLE-AI').click();
            if(await root.getAttribute('data-ai-mode')!=='SINGLE_AI')throw new Error('SYS Single AI restore failed');
            if(await draft.inputValue()!=='保留同一 SYSTEM_CHANGE_ID 的設計討論草稿。')throw new Error('SYS draft reset returning Single AI');
            for(const id of ['SYS-01-BTN-ATTACH','SYS-01-BTN-SEND','SYS-01-BTN-STOP','SYS-01-BTN-CANDIDATE-CREATE','SYS-01-BTN-CR-CREATE','SYS-01-BTN-NAV-OPEN','SYS-01-BTN-SANDBOX-TEST']){
              if(!(await q(id).isDisabled()))throw new Error(`${id} must remain disabled in visual/not-executed phase`);
            }
            if(await root.getAttribute('data-effectful-runtime-ready')!=='false')throw new Error('SYS effectful runtime falsely ready');
            const body=(await page.locator('body').textContent())||'';
            if(/provider picker|secret editor/i.test(body))throw new Error('SYS forbidden provider/secret surface');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('SYS_BROWSER_INTERACTION_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/system src/server/testing/controlledSystemTestRuntime.ts src/components/pages/SystemVisual.tsx
          test ! -e .github/workflows/sys01-runtime-fix-once.yml
          git diff --exit-code
