name: rawcdn endpoint diagnostic once
on:
  push:
    paths:
      - '.github/workflows/rawcdn-endpoint-diagnostic-once.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Inspect old and new public endpoints
        shell: bash
        run: |
          set +e
          OLD='https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/ff7ec14aa121fce5ca2f334cc373c0f9158e8fbc/preview/index.html'
          NEW='https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/a265264b7738be1778e6b94c4e1819dae3ef83e9/preview/index.html'
          NEW_CORE='https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/a265264b7738be1778e6b94c4e1819dae3ef83e9/preview/core.html'
          DEV='https://raw.githack.com/steven-gold/orange-one-ai-viedo-v1.0/a265264b7738be1778e6b94c4e1819dae3ef83e9/preview/index.html'
          RAW='https://raw.githubusercontent.com/steven-gold/orange-one-ai-viedo-v1.0/a265264b7738be1778e6b94c4e1819dae3ef83e9/preview/index.html'
          i=0
          for url in "$OLD" "$NEW" "$NEW_CORE" "$DEV" "$RAW"; do
            i=$((i+1))
            echo "===== ENDPOINT $i ====="
            echo "$url"
            curl -L --connect-timeout 15 --max-time 45 -sS -D "/tmp/h$i" -o "/tmp/b$i" -w 'http_code=%{http_code} content_type=%{content_type} size=%{size_download} remote_ip=%{remote_ip}\n' "$url"
            code=$?
            echo "curl_exit=$code"
            echo '--- headers ---'
            sed -n '1,30p' "/tmp/h$i"
            echo '--- body facts ---'
            wc -c "/tmp/b$i"
            grep -o 'data-page-uid="[^"]*"' "/tmp/b$i" | head -3
            grep -o '<title>[^<]*</title>' "/tmp/b$i" | head -1
            head -c 300 "/tmp/b$i" | tr '\n' ' '; echo
          done
          exit 0
      - name: Self clean
        if: always()
        run: |
          rm -f .github/workflows/rawcdn-endpoint-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rawcdn-endpoint-diagnostic-once.yml
          git commit -m 'chore(preview): remove rawcdn endpoint diagnostic'
          git push origin HEAD:new
