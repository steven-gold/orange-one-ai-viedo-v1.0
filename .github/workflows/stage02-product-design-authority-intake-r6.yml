name: Stage-02 Product Design Authority Intake R6

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_product_design_authority_intake_r6.py'
      - 'governance/ci/validate_stage02_product_design_authority_intake_r6.py'
      - '.github/workflows/stage02-product-design-authority-intake-r6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-product-design-authority-intake-r6
  cancel-in-progress: false

jobs:
  authority-intake-r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Re-prove exact 75-file governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance registry and closure protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_validation_remediation_closure_protocol.py

      - name: Revalidate current external-authority-aware Stage-02 truth before intake generation
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
          python governance/ci/validate_current_stage2_materialized_closure_external_aware_r3.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_external_aware_r3.py

      - name: Build exact 150-record fail-closed Authority Intake contract
        run: python governance/ci/build_stage02_product_design_authority_intake_r6.py

      - name: Validate R6 request identity and no-authority-value invariant
        run: python governance/ci/validate_stage02_product_design_authority_intake_r6.py

      - name: Prove R6 did not mutate product/spec/Stage-01/Stage-02 outputs
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R6 is intake machinery/evidence only; no product authority or owning-layer output was fabricated'

      - name: Verify blocker reduction remains zero before approved authority ingestion
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          assert d['normative_authority'] is False
          assert d['denominators']['product_design_contract_blockers_locked_for_intake'] == 150
          assert d['denominators']['approved_product_authority_bindings_present_in_this_package'] == 0
          assert d['denominators']['materializable_from_this_package'] == 0
          assert d['denominators']['effective_stage02_blocker_reduction_claimed'] == 0
          assert d['stage02_status'] == 'BLOCKED'
          assert d['stage03_allowed'] is False
          assert d['website_construction_allowed'] is False
          assert d['deployment_allowed'] is False
          print('PASS: 150 remain product-authority blocked; no false denominator reduction')
          PY

      - name: Commit R6 intake contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R6 generated no persistent intake artifact' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist product authority intake contract R6'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R6 intake contract
        uses: actions/upload-artifact@v4
        with:
          name: stage02-product-design-authority-intake-r6
          path: governance/test/stage02/STAGE02_PRODUCT_DESIGN_AUTHORITY_INTAKE_R6.yaml
          if-no-files-found: error
