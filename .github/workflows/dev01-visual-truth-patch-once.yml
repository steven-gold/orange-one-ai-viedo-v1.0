name: DEV-01 visual truth patch
on:
  push:
    branches: [acpos-dev01-closure-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore(dev): add one-time visual truth patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-dev01-closure-20260903
      - name: Patch DEV runtime truth attributes
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/pages/DevVisual.tsx')
          s=p.read_text()
          old='''      data-page-gate-ready={String(pageGateReady)}\n      data-active-stage={activeStage}\n'''
          new='''      data-page-gate-ready={String(pageGateReady)}\n      data-active-stage={activeStage}\n      data-data-classification={projection?.test_metadata?.data_classification}\n      data-production-eligible={projection?.test_metadata ? String(projection.test_metadata.production_eligible) : undefined}\n      data-discovery-job-ref={projection?.values.discovery_job_ref}\n      data-company-ref={projection?.values.company_ref}\n      data-message-candidate-ref={projection?.values.message_candidate_ref}\n      data-campaign-ref={projection?.values.campaign_ref}\n      data-delivery-ref={projection?.values.delivery_ref}\n      data-recipient-count={projection?.values.recipient_count}\n      data-delivery-to-count={projection?.values.delivery_to_count}\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Commit product patch
        run: |
          git config user.name steven-gold
          git config user.email proorangeone@gmail.com
          git add src/components/pages/DevVisual.tsx
          git commit -m 'fix(dev): expose controlled runtime truth'
          git push origin HEAD:acpos-dev01-closure-20260903
