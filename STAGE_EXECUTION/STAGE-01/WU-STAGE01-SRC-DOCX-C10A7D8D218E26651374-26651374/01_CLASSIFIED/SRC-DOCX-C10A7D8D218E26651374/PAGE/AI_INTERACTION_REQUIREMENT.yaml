- source_node_uid: SN-FDB3E655355845275EE17CFF
  document_order_index: 3875
  source_text: Campaign
- source_node_uid: SN-46D6ED9F48C1CEA221A5E58C
  document_order_index: 3952
  source_text: Global cross-campaign hard gate.
- source_node_uid: SN-FEB2383FF651B3524E138CA1
  document_order_index: 4188
  source_text: ERP remains financial truth owner.
- source_node_uid: SN-F19B57738723A97E24F29538
  document_order_index: 4292
  source_text: AI06-INV-001 ONE Company Master authority; duplicate enterprise stores are forbidden.
- source_node_uid: SN-FAD430C0696A2080B01FE82C
  document_order_index: 4311
  source_text: AI06-INV-002 Discovery MUST reuse the registered shared acquisition/source mechanism; no DEV-specific crawler fork.
- source_node_uid: SN-8CECFACA2B79312CE5B24382
  document_order_index: 4329
  source_text: AI06-INV-003 Every factual company claim used for qualification or personalization MUST bind Evidence + Source + Verified/Freshness time.
- source_node_uid: SN-6DBC7BFD552536F10161D26F
  document_order_index: 4348
  source_text: AI06-INV-004 AI MUST_NOT invent recent activity, partnership history, revenue, need, customer, contact identity or email address.
- source_node_uid: SN-7EDC61B49DCFB92504838DBF
  document_order_index: 4366
  source_text: AI06-INV-005 Potential Need is inference unless supported by explicit evidence; inference MUST be labeled and MUST_NOT be presented as fact.
- source_node_uid: SN-CD4B475793CEF9F30E318895
  document_order_index: 4385
  source_text: AI06-INV-006 Company identity MUST NOT be resolved by display name alone.
- source_node_uid: SN-E243C9DE94FD02C116F61738
  document_order_index: 4403
  source_text: AI06-INV-007 Registration/jurisdiction identifiers are preferred identity anchors when available.
- source_node_uid: SN-7EF4D0947B8EADE224316A2C
  document_order_index: 4422
  source_text: AI06-INV-008 Domain, official website, aliases and evidence may support identity resolution but MUST preserve confidence/reason.
- source_node_uid: SN-97569DB54CF3F33B708B831B
  document_order_index: 4440
  source_text: AI06-INV-009 Merge MUST require preview before effectful confirm.
- source_node_uid: SN-7D242BBE3A367D47024E1CE8
  document_order_index: 4459
  source_text: AI06-INV-010 Merge MUST preserve aliases, source evidence, contacts, history and lineage; destructive duplicate delete is forbidden.
- source_node_uid: SN-3EE693E76558640E33DFB1F3
  document_order_index: 4477
  source_text: AI06-INV-011 Existing Company Master MUST be enriched rather than recreated when identity matches.
- source_node_uid: SN-3B87DACB8504FB7BEB980880
  document_order_index: 4514
  source_text: AI06-INV-013 Guessed email patterns are forbidden.
- source_node_uid: SN-01FEB4F2C501800EDE561B9D
  document_order_index: 4570
  source_text: AI06-INV-016 Contact Evidence must remain inspectable after delivery.
- source_node_uid: SN-FB08AACB1CCFAAFB2EC7711D
  document_order_index: 4588
  source_text: AI06-INV-017 Qualification MUST expose fit, intent and timing reasons; opaque score-only decisions are insufficient.
- source_node_uid: SN-DA166A26E457C79F1D7D75C0
  document_order_index: 4607
  source_text: AI06-INV-018 Fit Score does not replace Evidence or eligibility.
- source_node_uid: SN-719A8BF10E93E93E1CAFA5A1
  document_order_index: 4625
  source_text: AI06-INV-019 Ignored/blocked signals MUST retain disposition reason when governance requires auditability.
- source_node_uid: SN-2722EABEC2995855BE2DD053
  document_order_index: 4662
  source_text: AI06-INV-021 Message Candidate is not approved content.
- source_node_uid: SN-5B6477D68395DC61DE2B6FA8
  document_order_index: 4755
  source_text: AI06-INV-026 Compliance decision vocabulary is PASS / REVIEW / BLOCK unless Current Authority says otherwise.
- source_node_uid: SN-7D0B72DFDEC41348905613D3
  document_order_index: 4773
  source_text: AI06-INV-027 REVIEW cannot silently become PASS.
- source_node_uid: SN-F04C7506B4F070E3DFF82980
  document_order_index: 4810
  source_text: AI06-INV-029 Global Suppression applies across Campaigns.
- source_node_uid: SN-CC329C5BC0F68878329926F3
  document_order_index: 4829
  source_text: AI06-INV-030 Unsubscribe is an immediate hard stop for future prohibited outreach.
- source_node_uid: SN-CF13EEE59712C8BFC6FA05EA
  document_order_index: 4847
  source_text: AI06-INV-031 Suppression MUST be checked during selection, before Campaign approval and immediately before dispatch.
- source_node_uid: SN-CC82C35901455606596EF83F
  document_order_index: 4866
  source_text: AI06-INV-032 Recipient selection MUST resolve to exact authorized recipient_refs; filter/query text is not a recipient list.
- source_node_uid: SN-2709A05307A4A6BFE76FBE95
  document_order_index: 4884
  source_text: AI06-INV-033 Duplicate recipient_ref inside one Campaign MUST collapse to one logical recipient.
- source_node_uid: SN-5995A5715411F1073E94C024
  document_order_index: 4903
  source_text: AI06-INV-034 Campaign is the formal batch container; no Audience DB or BulkSend DB may be introduced.
- source_node_uid: SN-419EC810DD11FC332833E24B
  document_order_index: 4921
  source_text: AI06-INV-035 Campaign approval is distinct from dispatch.
- source_node_uid: SN-A196BB2E52745E49F1F107C7
  document_order_index: 4940
  source_text: AI06-INV-036 Campaign Preview MUST show exact eligible/blocked/suppressed/no-valid-contact/duplicate counts.
- source_node_uid: SN-132B49AF6F32089C4FC60B17
  document_order_index: 4977
  source_text: AI06-INV-038 Dispatch MUST fail closed if recipient denominator cannot be resolved exactly.
- source_node_uid: SN-E6AE806606039B872A6315D6
  document_order_index: 4995
  source_text: AI06-INV-039 One Campaign MAY contain many recipient_refs.
- source_node_uid: SN-576489E3CFFF174C86CE5E81
  document_order_index: 5014
  source_text: AI06-INV-040 Every actual outbound email MUST have exactly one To recipient.
- source_node_uid: SN-ED48B96F64CC213029065683
  document_order_index: 5032
  source_text: AI06-INV-041 Outbound outreach email CC and BCC MUST be empty.
- source_node_uid: SN-88EBAFA18F48E30B432D6DD5
  document_order_index: 5051
  source_text: AI06-INV-042 Campaign-level bulk dispatch MUST fan out into IndividualDelivery units.
- source_node_uid: SN-5186B4B912967EBFD90976C8
  document_order_index: 5069
  source_text: AI06-INV-043 One Campaign/recipient pair permits at most ONE_ACTIVE_DELIVERY unless explicit governed resend exists.
- source_node_uid: SN-B45077229F8E84E98EEA67FA
  document_order_index: 5088
  source_text: AI06-INV-044 Partial campaign success MUST never be reported as COMPLETE.
- source_node_uid: SN-EAC5512E1FBBCA8E7CE98085
  document_order_index: 5106
  source_text: AI06-INV-045 Aggregate campaign result MUST preserve per-recipient succeeded/blocked/failed detail.
- source_node_uid: SN-3FD40670731A219EF79D3510
  document_order_index: 5125
  source_text: AI06-INV-046 Dispatch MUST enforce sender authorization.
- source_node_uid: SN-0E2069A2B423EBA94D6ED2AF
  document_order_index: 5143
  source_text: AI06-INV-047 Dispatch MUST enforce schedule/timezone/send-window policy.
- source_node_uid: SN-45381E3F4C1467AC5FFD20E4
  document_order_index: 5162
  source_text: AI06-INV-048 Dispatch MUST enforce current rate/cap/cooldown policy.
- source_node_uid: SN-D151419DA81C6485D4E68640
  document_order_index: 5180
  source_text: AI06-INV-049 Dispatch MUST enforce suppression and compliance again at effect time.
- source_node_uid: SN-62FA89F85870AEC8A7C56EC2
  document_order_index: 5199
  source_text: AI06-INV-050 Dispatch MUST use idempotency to prevent duplicate side effects.
- source_node_uid: SN-1FDF5D2B832FE8F1EF8D034C
  document_order_index: 5236
  source_text: AI06-INV-052 Kill Switch MUST stop legal target scope and MUST be audited with reason/actor/time.
- source_node_uid: SN-70F58177A8209DAD4C9D68BC
  document_order_index: 5254
  source_text: AI06-INV-053 Kill Switch MUST_NOT retroactively alter already completed deliveries.
- source_node_uid: SN-3168C669EE25A4513424BE8C
  document_order_index: 5310
  source_text: AI06-INV-056 Same idempotency key with materially different payload MUST be rejected.
- source_node_uid: SN-FC5225C40EEEEE7D07A71D05
  document_order_index: 5365
  source_text: AI06-INV-059 Bounce MUST update contact/delivery health according to governed classification.
- source_node_uid: SN-8D6E972D650E2120032DAA94
  document_order_index: 5384
  source_text: AI06-INV-060 Complaint MUST trigger policy/sender/contact protection workflow as applicable.
- source_node_uid: SN-10AF777C95D689BD5607A05A
  document_order_index: 5402
  source_text: AI06-INV-061 Reply MUST bind exact prior delivery/contact/company/campaign.
- source_node_uid: SN-EC14C11A1BA304E661B749C2
  document_order_index: 5421
  source_text: AI06-INV-062 Received reply MUST stop or reevaluate remaining automated follow-up according to policy.
- source_node_uid: SN-2711F7CB314FCF60B31AAD61
  document_order_index: 5439
  source_text: AI06-INV-063 Positive reply MUST be eligible for Human Owner assignment.
- source_node_uid: SN-8819C899ED99DD7381B0FD4A
  document_order_index: 5458
  source_text: AI06-INV-064 Follow-up count and interval are configuration/policy values; Mother MUST_NOT hardcode arbitrary numbers.
- source_node_uid: SN-6A2B4071F1C04D3774691DA5
  document_order_index: 5476
  source_text: AI06-INV-065 Follow-up is finite; infinite automated sequences are forbidden.
- source_node_uid: SN-F4B3DE03D41B89CC5C9EE3CC
  document_order_index: 5495
  source_text: AI06-INV-066 Unsubscribe, suppression, complaint block and invalid contact supersede pending follow-up.
- source_node_uid: SN-C3405E0ACF2D33FA4EF69209
  document_order_index: 5513
  source_text: AI06-INV-067 Human Owner assignment does not rewrite source evidence or Company identity.
- source_node_uid: SN-E84EF942C2B86FE85B602F9F
  document_order_index: 5550
  source_text: AI06-INV-069 Opportunity outcome MUST remain traceable to originating Company, Contact, Campaign and evidence lineage.
- source_node_uid: SN-BB1B4DF78E0D152CF893BAD8
  document_order_index: 5569
  source_text: AI06-INV-070 Revenue Attribution MUST reference ERP/finance truth; AI06 MUST_NOT invent revenue amounts.
- source_node_uid: SN-DC59A34B436A91C5EC245C96
  document_order_index: 5587
  source_text: AI06-INV-071 Campaign Cost and Deal Revenue must remain separate facts before ROI derivation.
- source_node_uid: SN-8AC0AB1EE65F6908A250C6DE
  document_order_index: 5606
  source_text: AI06-INV-072 Experience/Learning MUST use outcome evidence and MUST NOT self-adopt without admission rules.
- source_node_uid: SN-3C79BE03C59BAF457400CEEB
  document_order_index: 5624
  source_text: AI06-INV-073 External facts with stale evidence MUST be refreshed or marked stale before use in new personalization.
- source_node_uid: SN-F4F974AEAED72BD0ACA22702
  document_order_index: 5643
  source_text: AI06-INV-074 Deleted/retired source does not erase historical evidence needed for sent-message audit.
- source_node_uid: SN-7B009922EBCB27230890F9BC
  document_order_index: 5661
  source_text: AI06-INV-075 Evidence retention and contact privacy/retention are distinct policies and MUST be separately governed.
- source_node_uid: SN-EEBF29446C2728A60B40915C
  document_order_index: 5680
  source_text: AI06-INV-076 PII/secret data MUST follow classification and least-access rules.
- source_node_uid: SN-339E68BF870BB414BCC731B0
  document_order_index: 5828
  source_text: AI06-INV-084 Audit MUST retain Human Edits separately from AI draft.
- source_node_uid: SN-8C605BC2CF0C81BAC36F5925
  document_order_index: 5846
  source_text: AI06-INV-085 Production connector absence MUST be represented as NOT_PROVEN/BLOCKED, never simulated success.
