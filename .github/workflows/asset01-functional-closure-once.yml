name: ASSET01 Functional Closure Once
on:
  push:
    branches: [new]
    paths: ['.github/workflows/asset01-functional-closure-once.yml']
permissions:
  contents: write
jobs:
  asset01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Assert workflow-only trigger and locked visuals
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/asset01-functional-closure-once.yml"
          test "$(git hash-object src/components/pages/AssetVisual.module.css)" = "80220b164df59a3a4d03ee3ac6886b844d785552"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          git hash-object authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml >/tmp/asset_authority_before
          echo ASSET01_BASELINE_PASS
      - name: Patch ASSET-01 controlled runtime closure
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def write(path: str, content: str):
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(content)

          write('src/domain/asset/controlledAssetClientTestRuntime.ts', r'''import { createControlledTestMetadata, createControlledTestRef, isControlledTestMode } from "@/domain/testing/controlledTestData";
import type { AssetClientState } from "./assetClientState";
import type { AssetNormalizedProjection } from "./assetProjectionPort";
import type { AssetInvokeResult } from "./assetClientPort";
import type { AssetActionUid } from "./assetRuntimeContract";

let lastProjection: AssetNormalizedProjection | null = null;
let correctionCandidateRef: string | null = null;
let approvedCorrectionRef: string | null = null;
let lockedVersionRef: string | null = null;

export function controlledAssetClientTestMode(){ return isControlledTestMode(); }
export function rememberControlledAssetProjection(next: AssetNormalizedProjection){ lastProjection=next; }

function cloneProjection(source: AssetNormalizedProjection): AssetNormalizedProjection {
  return {
    ...source,
    values:{...source.values},
    lists:Object.fromEntries(Object.entries(source.lists).map(([k,v])=>[k,[...v]])),
    filters:Object.fromEntries(Object.entries(source.filters).map(([k,v])=>[k,[...v]])),
    gate_state:{...source.gate_state},
  };
}
function record(value:unknown):Record<string,unknown>{ return value&&typeof value==='object'?value as Record<string,unknown>:{}; }
function text(value:unknown){ return typeof value==='string'&&value.trim()?value:null; }
function metadata(){ return createControlledTestMetadata('ASSET-01-CLIENT'); }
function fail(error_uid:AssetInvokeResult extends infer _T ? any : never, reason_code:string):AssetInvokeResult{
  return {ok:false,error_uid,reason_code,correlation_id:createControlledTestRef('ASSET-SHARED-ERROR')};
}

export function buildControlledAssetRequest(input:{action_uid:AssetActionUid;control_uid:string;control_value?:unknown;state:Readonly<AssetClientState>;projection:AssetNormalizedProjection|null;correction_request:string}){
  const p=input.projection??lastProjection;
  if(!p) throw new Error('ASSET_TEST_PROJECTION_REQUIRED');
  const taskId=p.task_id;
  const outputVersionId=p.output_version_id;
  const layerDocumentId=p.layer_document_id;
  const layerId=p.layer_id;
  const patchId=p.patch_id;
  const common={test_metadata:metadata(),project_ref:input.state.project_ref,topic_ref:input.state.topic_ref,asset_ref:input.state.asset_ref};
  switch(input.action_uid){
    case 'ASSET-01-ACT-FLOW-START':
    case 'ASSET-01-ACT-TASK-RETRY':
      if(!taskId)throw new Error('TASK_ID_REQUIRED');
      return {path_params:{taskId},payload:{...common,mode:input.state.mode}};
    case 'ASSET-01-ACT-CORRECTION-EXECUTE':
      if(!taskId)throw new Error('TASK_ID_REQUIRED');
      return {path_params:{taskId},payload:{...common,correction_request:input.correction_request,approved_correction_ref:approvedCorrectionRef,source_asset_version_id:outputVersionId}};
    case 'ASSET-01-ACT-EVALUATE':
      return {payload:{...common,target_output_version_id:outputVersionId}};
    case 'ASSET-01-ACT-CANDIDATE-CONFIRM':
      if(!taskId||!outputVersionId)throw new Error('EXACT_OUTPUT_REQUIRED');
      return {path_params:{taskId,outputVersionId},payload:{...common,decision:'CONFIRM',exact_output_version_id:outputVersionId}};
    case 'ASSET-01-ACT-FINDING-CREATE':
      return {payload:{...common,target_output_version_id:outputVersionId}};
    case 'ASSET-01-ACT-HANDOFF':
      if(!outputVersionId||lockedVersionRef!==outputVersionId)throw new Error('LOCKED_ASSET_VERSION_REQUIRED');
      return {payload:{...common,locked_asset_version_ref:lockedVersionRef,blueprint_ref:p.values['ASSET-01-FLD-BLUEPRINT'],script_hash:p.values['ASSET-01-FLD-HANDOFF-SCRIPT-HASH'],dna_ref:p.values['ASSET-01-FLD-DNA'],canonical_filename:p.values['ASSET-01-FLD-CANONICAL-FILENAME'],checksum:p.values['ASSET-01-FLD-CHECKSUM'],scorecard_ref:p.values['ASSET-01-FLD-HANDOFF-SCORECARD'],rights_ref:p.values['ASSET-01-FLD-RIGHTS'],contract_hash:p.values['ASSET-01-FLD-HANDOFF-CONTRACT-HASH']}};
    case 'ASSET-01-ACT-LAYER-DOC-CREATE':
      if(!outputVersionId)throw new Error('ASSET_VERSION_REQUIRED');
      return {payload:{...common,asset_version_id:outputVersionId}};
    case 'ASSET-01-ACT-LAYER-DOC-UPDATE':
      if(!layerDocumentId)throw new Error('LAYER_DOCUMENT_REQUIRED');
      return {path_params:{layerDocumentId},payload:{...common,asset_version_id:outputVersionId}};
    case 'ASSET-01-ACT-LAYER-ADD':
      if(!layerDocumentId)throw new Error('LAYER_DOCUMENT_REQUIRED');
      return {path_params:{layerDocumentId},payload:{...common,layer_type:'CHARACTER_BODY'}};
    case 'ASSET-01-ACT-LAYER-DELETE':
    case 'ASSET-01-ACT-LAYER-DUPLICATE':
    case 'ASSET-01-ACT-LAYER-REORDER':
      if(!layerDocumentId||!layerId)throw new Error('EXACT_LAYER_REQUIRED');
      return {path_params:{layerDocumentId,layerId},payload:{...common}};
    case 'ASSET-01-ACT-LAYER-PROPERTIES':
    case 'ASSET-01-ACT-LAYER-MASK':
      if(!layerDocumentId||!layerId)throw new Error('EXACT_LAYER_REQUIRED');
      return {path_params:{layerDocumentId,layerId},payload:{...common,value:input.control_value}};
    case 'ASSET-01-ACT-PATCH-CREATE':
      if(!outputVersionId||!layerDocumentId)throw new Error('PATCH_SOURCE_REQUIRED');
      return {payload:{...common,source_asset_version_id:outputVersionId,layer_document_id:layerDocumentId,preserve_constraints:'BLUEPRINT_DNA_UNAFFECTED'}};
    case 'ASSET-01-ACT-PATCH-PREVIEW':
      if(!patchId)throw new Error('PATCH_ID_REQUIRED');
      return {path_params:{patchId},payload:{...common}};
    case 'ASSET-01-ACT-PATCH-ACCEPT':
    case 'ASSET-01-ACT-PATCH-REJECT':
      if(!patchId)throw new Error('PATCH_ID_REQUIRED');
      return {path_params:{patchId},payload:{...common,decision:input.action_uid.endsWith('ACCEPT')?'ACCEPT':'REJECT'}};
    case 'ASSET-01-ACT-CORRECTION-GENERATE':
      return {payload:{...common,correction_request:input.correction_request,source_asset_version_id:outputVersionId}};
    case 'ASSET-01-ACT-CORRECTION-APPROVE':
      return {payload:{...common,correction_candidate_ref:correctionCandidateRef}};
    case 'ASSET-01-ACT-RESTORE-AS-NEW':
    case 'ASSET-01-ACT-VERSION-LOCK':
      if(!outputVersionId)throw new Error('ASSET_VERSION_REQUIRED');
      return {payload:{...common,asset_version_id:outputVersionId}};
    default:
      return {payload:common};
  }
}

export async function invokeControlledAssetSharedOperation(operation_id:string,input:{payload?:unknown}):Promise<AssetInvokeResult>{
  if(!isControlledTestMode())return fail('ASSET-01-ERR-CONTEXT-001','CONTROLLED_ASSET_TEST_MODE_DISABLED');
  const correlation_id=createControlledTestRef('ASSET-SHARED');
  const payload=record(input.payload);
  if(operation_id==='generateCorrectionScriptCandidate'){
    const request=text(payload.correction_request);
    if(!request)return fail('ASSET-01-ERR-CORRECTION-001','CORRECTION_REQUEST_REQUIRED');
    correctionCandidateRef=createControlledTestRef('ASSET-CORRECTION-CANDIDATE'); approvedCorrectionRef=null;
    return {ok:true,value:{operation_id,correction_candidate_ref:correctionCandidateRef,test_metadata:metadata()},correlation_id};
  }
  if(operation_id==='approveCorrectionScriptCandidate'){
    if(!correctionCandidateRef)return fail('ASSET-01-ERR-CORRECTION-001','CORRECTION_CANDIDATE_REQUIRED');
    approvedCorrectionRef=correctionCandidateRef;
    return {ok:true,value:{operation_id,approved_candidate_ref:approvedCorrectionRef,test_metadata:metadata()},correlation_id};
  }
  if(operation_id==='restoreAssetVersionAsNewDraft'){
    if(!lastProjection?.output_version_id)return fail('ASSET-01-ERR-VERSION-001','ASSET_VERSION_REQUIRED');
    const next=cloneProjection(lastProjection),restored=createControlledTestRef('ASSET-RESTORED-VERSION');
    next.output_version_id=restored;
    next.page_state='CANDIDATE_OUTPUT';
    next.values['ASSET-01-FLD-OUTPUT-ID']=restored;
    next.values['ASSET-01-FLD-TASK-STATUS']='CANDIDATE_OUTPUT';
    next.values['ASSET-01-FLD-STAGE']='ASSET-01-STAGE-03-LAYER-COMPOSITE';
    next.values['ASSET-01-FLD-CANONICAL-FILENAME']='[TEST] ORANGE_ONE_ASSET_RESTORED.png';
    next.values['ASSET-01-FLD-CHECKSUM']=createControlledTestRef('CHECKSUM');
    next.lists['ASSET-01-LST-COMPARE-VERSIONS']=[...(next.lists['ASSET-01-LST-COMPARE-VERSIONS']??[]),{ref:restored,label:`[TEST] Restored ${restored}`}].slice(-3);
    Object.assign(next.gate_state,{'ASSET-01-GATE-CANDIDATE':true,'ASSET-01-GATE-EVALUATION':true,'ASSET-01-GATE-COMPARE':true,'ASSET-01-GATE-CONFIRM':false,'ASSET-01-GATE-LOCK':false,'ASSET-01-GATE-HANDOFF':false});
    lockedVersionRef=null; lastProjection=next;
    return {ok:true,value:{operation_id,projection:next,test_metadata:metadata()},correlation_id};
  }
  if(operation_id==='lockAssetVersion'){
    if(!lastProjection?.output_version_id||lastProjection.page_state!=='CONFIRMED')return fail('ASSET-01-ERR-VERSION-001','CONFIRMED_ASSET_VERSION_REQUIRED');
    lockedVersionRef=lastProjection.output_version_id;
    const next=cloneProjection(lastProjection); next.page_state='LOCKED';
    next.values['ASSET-01-FLD-TASK-STATUS']='LOCKED'; next.values['ASSET-01-FLD-STAGE']='ASSET-01-STAGE-05-FINALIZE';
    next.values['ASSET-01-FLD-HANDOFF-ASSET-VERSION']=lockedVersionRef;
    Object.assign(next.gate_state,{'ASSET-01-GATE-HANDOFF':true,'ASSET-01-GATE-LOCK':true}); lastProjection=next;
    return {ok:true,value:{operation_id,locked_asset_version_ref:lockedVersionRef,projection:next,test_metadata:metadata()},correlation_id};
  }
  return fail('ASSET-01-ERR-CONTEXT-001','CONTROLLED_SHARED_OPERATION_UNSUPPORTED');
}

export async function prepareControlledAssetEvaluation(){
  if(!lastProjection?.output_version_id)throw new Error('ASSET_OUTPUT_REQUIRED');
  return {target_output_version_id:lastProjection.output_version_id,criteria_version_id:'TEST-ASSET-CRITERIA-V1',test_metadata:metadata()};
}
export async function prepareControlledAssetCorrectionExecution(){
  if(!lastProjection?.task_id||!lastProjection.output_version_id||!approvedCorrectionRef)throw new Error('APPROVED_CORRECTION_REQUIRED');
  return {task_id:lastProjection.task_id,source_asset_version_id:lastProjection.output_version_id,approved_candidate_ref:approvedCorrectionRef,affected_scope:'TEST_ONLY_EXACT_ASSET_SCOPE',test_metadata:metadata()};
}
''')

          write('src/server/testing/controlledAssetTestRuntime.ts', r'''import type { AssetActionUid,AssetRuntimeRequest,AssetRuntimeResult } from "@/domain/asset/assetRuntimeContract";
import { ASSET_ACTION_UIDS } from "@/domain/asset/assetRuntimeContract";
