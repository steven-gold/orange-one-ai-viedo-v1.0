name: ACPOS Batch 10 Owner Collision Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-10-owner-collision-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_10_owner_collision_audit.py
      - name: Verify no Word drift since Batch 09
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="d0dc12f34bda1b798ad153218052aa36aa699fd3"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-09")
          PY
      - name: Run owner collision audit
        run: python __temp/batch_10_owner_collision_audit.py
      - name: Upload Batch 10 collision evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-10-owner-collision-audit
          path: __batch10_owner_collision_audit.json
          retention-days: 1
