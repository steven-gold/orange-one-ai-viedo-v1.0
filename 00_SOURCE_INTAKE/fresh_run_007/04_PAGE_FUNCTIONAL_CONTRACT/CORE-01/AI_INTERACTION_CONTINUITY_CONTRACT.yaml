  singular_pipeline: true
  conversation_truth_rule: Conversation History is evidence/history, not Canonical Work Item truth.
  steps:
  - order: 1
    name: Resolve Exact Context
    formal_write: false
  - order: 2
    name: Conversation / Analysis
    formal_write: false
  - order: 3
    name: Incremental Capture
    owner_ref: AI Conversation Core
    formal_write: false
  - order: 4
    name: Assistant Summary
    object_uid: CORE-01-OBJ-SUMMARY
    formal_write: false
  - order: 5
    name: CORE Evaluation
    object_uid: CORE-01-OBJ-EVALUATION
    formal_write: false
  - order: 6
    name: Human Decision
    object_uid: CORE-01-OBJ-HUMAN-DECISION
    formal_write: false
  - order: 7
    name: Assistant Structured Decision
    object_uid: CORE-01-OBJ-STRUCTURED-DECISION
    self_approval: FORBIDDEN
    formal_write: false
  - order: 8
    name: Create Immutable Candidate
    action_uid: CORE-01-ACT-CANDIDATE-CREATE
    formal_write: true
  - order: 9
    name: Candidate Decision
    action_uids:
    - CORE-01-ACT-CANDIDATE-ACCEPT
    - CORE-01-ACT-CANDIDATE-RETURN
    formal_write: true
  - order: 10
    name: Domain-specific Confirm/Lock/Version
    owner_rule: EXISTING_DOMAIN_OWNER
    append_new_version_no_overwrite: true
    formal_write: true
  return_modify:
    action_uid: CORE-01-ACT-CANDIDATE-RETURN
    preserve:
    - returned_candidate
    - reason_and_evidence
    - conversation_history
    - exact_base_version_lineage
    next: RESUME_GOVERNED_DISCUSSION_THEN_CREATE_NEW_IMMUTABLE_CANDIDATE
  forbidden:
  - LAST_AI_RESPONSE_EQUALS_FINAL_VERSION
  - MULTI_AI_MAJORITY_VOTE_EQUALS_FORMAL_DECISION
  - ASSISTANT_SUMMARY_AUTO_CONFIRMS
  - OVERWRITE_CONFIRMED_OR_LOCKED_VERSION
  - RAW_CONVERSATION_DIRECT_TO_CANON
