    audit_event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    illegal_transition_tests:
    - test_uid: CORE01-STTR-04-ILLEGAL-WRONG-FROM
      reject_when: current_stage != CORE-01-STAGE-04-HUMAN-DECIDE
    - test_uid: CORE01-STTR-04-ILLEGAL-TRIGGER
      reject_when: trigger_event_uid != CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    - test_uid: CORE01-STTR-04-ILLEGAL-GATE
      reject_when: CORE-01-GATE-HUMAN-DECISION != PASS
    - test_uid: CORE01-STTR-04-ILLEGAL-REPLAY
      reject_when: transition already committed or current_stage == CORE-01-STAGE-02-CONVERSE
  - transition_uid: CORE-01-STTR-05
    from_stage: CORE-01-STAGE-04-HUMAN-DECIDE
    to_stage: CORE-01-STAGE-05-CANDIDATE
    trigger_event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    gate_uid: CORE-01-GATE-CANDIDATE-CREATE
    mutation_owner: CORE-01
    failure_state: CORE-01-ST-ERROR
    recovery:
      retain_stage: CORE-01-STAGE-04-HUMAN-DECIDE
      action: PRESERVE_CONFIRMED_STRUCTURED_DECISION_RESOLVE_CANDIDATE_SOURCE_LINEAGE_THEN_RETRY_CREATE
      retry_condition: CORE-01-GATE-CANDIDATE-CREATE_PASS_AND_CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    audit_event_uid: CORE-01-EVT-HUMAN-DECISION-CONFIRMED
    illegal_transition_tests:
    - test_uid: CORE01-STTR-05-ILLEGAL-WRONG-FROM
      reject_when: current_stage != CORE-01-STAGE-04-HUMAN-DECIDE
    - test_uid: CORE01-STTR-05-ILLEGAL-TRIGGER
