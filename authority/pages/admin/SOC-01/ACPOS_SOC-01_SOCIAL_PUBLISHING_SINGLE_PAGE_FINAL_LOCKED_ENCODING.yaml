authority:
  id: ACPOS_SOC-01_SOCIAL_PUBLISHING_SINGLE_PAGE_AUTHORITY
  page_uid: admin:SOC-01
  page_name_zh: 社群發布
  page_name_en: Social Publishing
  surface: ADMIN
  status: FINAL_LOCKED
  current_only: true
  file_spec_status: FILE_SPEC_COMPLETE
  system_implementation_status: NOT_EXECUTED
  single_page_workspace: true
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY V1.9
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY
  authorization_model: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY
  backend_l1_key: social_publishing
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  purpose: One current Social Publishing workspace that composes existing platform capability, account/target, content package,
    publishing policy/request, and results/history capabilities into one same-page workflow without creating parallel publishing
    services, registries, databases, adapters, schedulers, analytics stores or provider/API-key systems.
  truthful_status_rule: This file completes page design/encoding only. Application code, master merge, runtime, external platform
    verification, Sandbox, Regression, E2E and production deployment are not executed by this file.
source_alignment:
  primary_authority: ACPOS_SINGLE_AUTHORITY_CONSTRUCTION_MASTER_FINAL.yaml / R9 Social Publishing capability set
  source_capability_clusters:
  - Platform registry / target-type capability / policy / health / enable-disable
  - Social account binding / credential governance / target discovery / target directory / manual actions
  - Release Candidate -> platform-specific Content Package / metadata / thumbnail / candidate review
  - Target posting policy / cooldown / daily-weekly limits / scheduling / publish request / manual assist
  - Post status / target history / metrics / interactions / callbacks / incidents / withdrawal history (read-only)
  current_consolidation_rule: Historical segmented source pages are non-executable provenance. Current UI renders one admin:SOC-01
    workspace only; source service/operation/data owners remain preserved and single.
  business_development_policy_alignment:
  - Master Message may produce platform-native variants; identical blind cross-platform copy is forbidden.
  - Initial governed pattern is AI/draft assistance -> human Campaign/content approval -> scheduled publish, subject to current
    policy authority.
  - Mention/Tag a specific target company forces human approval.
  - Auto mass commenting/tagging/cold outreach on other enterprise pages is forbidden.
  - Direct Message is allowed only if official API/account permission/policy explicitly allows; no cold-DM assumption.
single_system_contract:
  current_ui_owner: admin:SOC-01
  service_owners:
  - REUSE PublishingAdapterService
  - REUSE PublishingService
  - REUSE PublishingAnalyticsService
  - REUSE EnterpriseSocialOutreachGovernance
  - REUSE existing Governance/Policy/Projection owners
  existing_data_owners:
  - social_account_bindings
  - social_target_discovery_jobs
  - social_market_targets
  - social_manual_actions
  - existing publishing/content/candidate/audit projections
  forbidden_parallel_components:
  - second social publishing system
  - second social platform registry
  - second social account registry
  - second social target directory/database
  - second credential store
  - second publishing adapter/router
  - second content package engine
  - second publish scheduler/queue
  - second publishing analytics database
  - second manual action system
  - page-local provider/API-key system
  - bulkSocialPublish endpoint/service invented by page
workflow:
  canonical_user_flow: Platform & Capability -> Accounts & Targets -> Content Package -> Publish Plan -> Results & Records
  stage_navigation: Same-page UI context only; never routes to separate current social pages.
  cross_stage_context: Carry exact authorized platform/account/target/content-package/policy/publish references forward; effectful
    operations never resolve formal inputs via latest/current/default aliases.
  stages:
  - stage_uid: SOC-01-STAGE-01-PLATFORM
    key: platform
    label: 平台能力
    owner: REUSE PublishingAdapterService + Governance owner
    purpose: Inspect and govern real registered social platforms, target-type capabilities, policy/health and enable-disable
      state without guessing platform support.
    actions:
    - SOC-01-ACT-PLATFORM-CONFIG
    - SOC-01-ACT-KILL-SWITCH
  - stage_uid: SOC-01-STAGE-02-ACCOUNT-TARGET
    key: account_target
    label: 帳號與目標
    owner: REUSE PublishingAdapterService
    purpose: Bind authorized social accounts, keep credentials masked, create governed social target discovery, use target
      directory, request join/verification and complete manual actions.
    actions:
    - SOC-01-ACT-ACCOUNT-BIND
    - SOC-01-ACT-CREDENTIAL-REVEAL
    - SOC-01-ACT-ACCOUNT-UNBIND
    - SOC-01-ACT-TARGET-DISCOVERY
    - SOC-01-ACT-TARGET-JOIN
    - SOC-01-ACT-MANUAL-COMPLETE
    - SOC-01-ACT-SEARCH
  - stage_uid: SOC-01-STAGE-03-CONTENT
    key: content
    label: 內容包
    owner: REUSE PublishingService + existing Draft/Candidate owner
    purpose: Bind an exact Release Candidate/source and create platform-native content package variants, metadata/thumbnail/policy
      review and governed Draft/Candidate decision.
    actions:
    - SOC-01-ACT-CONTENT-SAVE
    - SOC-01-ACT-CANDIDATE-DECIDE
  - stage_uid: SOC-01-STAGE-04-PUBLISH
    key: publish
    label: 發佈計畫
    owner: REUSE PublishingService
    purpose: Configure exact target posting policy and create governed publish requests using bound content package/channel
      account, schedule/cooldown/frequency/approval constraints.
    actions:
    - SOC-01-ACT-POLICY-CONFIG
    - SOC-01-ACT-PUBLISH-REQUEST
  - stage_uid: SOC-01-STAGE-05-RECORDS
    key: records
    label: 結果與紀錄
    owner: REUSE PublishingAnalyticsService
    purpose: Inspect real external status, target/frequency history, metrics/interactions, manual actions, callbacks/incidents
      and withdrawal status/history without inventing mutation actions.
    actions:
    - SOC-01-ACT-SEARCH
    - SOC-01-ACT-REFRESH
layout:
  desktop_min_width: 1280
  page_context_bar: 100% x 56px
  workflow_stage_bar: 100% x 52px; five compact segmented stages
  primary_workspace: 72% width; active stage only
  governance_rail: 28% width; current-stage blockers/readiness only
  detail_drawer: 480-560px; evidence/history/audit/credential access/callback/incident details only
  stage_action_dock: 56px local bottom action row; only current legal stage actions; max one primary CTA per context
  main_workspace: height:auto; overflow-y:auto
  below_1280: min-width=1280px + horizontal scroll
  visual_rule: Inherit Global Visual; no local palette/theme, no card-per-field layout, no fake charts/counters, no page-specific
    global shell.
