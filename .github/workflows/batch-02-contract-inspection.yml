name: ACPOS Batch 02 Contract Inspection

on:
  push:
    branches: [0921acpos]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - run: python __temp/batch_02_inspect.py
