authority:
  id: ACPOS_PRODUCTION_DATABASE_RUNTIME_CONTRACT
  version: V1.1
  status: FINAL_LOCKED
  current_only: true
  revision: 2026-09-11-MIGRATION-TRUTH-EXTERNALIZED
  scope: PRODUCTION_DATABASE_DRIVER_AND_CONNECTION_ENV_CONTRACT_ONLY
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
approval:
  user_approved: true
  approved_on: '2026-09-05'
  approved_scope:
  - Set live Neon target to wild-wave-25661146
  - Name production database driver and environment keys
  - Bind register() to @neondatabase/serverless against wild-wave only after Current Database Migration Authority and checksum manifest validation pass
  - Permit /health/ready 200 only after the database and identity control-plane checks pass
  - Do not infer complete production runtime acceptance from control-plane readiness
  - Do not invent UI projection or IAM adapters
source:
  derived_from:
  - Vercel project orange-one-acpos-test Neon integration environment key names
  - Live Neon API project ORANGEONEACPOSStaging
  - User confirmation that wild-wave is the authority target
live_neon_target:
  neon_project_id: wild-wave-25661146
  neon_project_name: ORANGEONEACPOSStaging
  region_id: aws-us-east-1
  pg_version: 18
  database_name: neondb
  production_branch_name: main
  production_branch_id: br-shy-cherry-auiol4oy
  production_endpoint_id: ep-hidden-hat-auu8r1b0
  git_new_preview_branch_name: preview/new
  git_new_preview_branch_id: br-quiet-firefly-aumuvjht
driver:
  package: "@neondatabase/serverless"
  reason: Existing Vercel Neon integration exposes DATABASE_URL for this Next.js serverless app
  forbidden_until_new_authority:
  - pg
  - postgres
  - "@vercel/postgres"
  - prisma
  - drizzle-orm
connection_env:
  DATABASE_URL:
    required: true
    usage: pooled application reads and writes after runtime binding
    commit_value: false
  DATABASE_URL_UNPOOLED:
    required: true
    usage: migrations and DDL only
    commit_value: false
  NEON_PROJECT_ID:
    required: true
    expected_value: wild-wave-25661146
    usage: identity guard against connecting the superseded tiny-dust project
platform_alias_keys_not_required_by_app:
  - POSTGRES_URL
  - POSTGRES_PRISMA_URL
  - POSTGRES_URL_NON_POOLING
  - POSTGRES_HOST
  - POSTGRES_DATABASE
  - POSTGRES_USER
  - POSTGRES_PASSWORD
  - PGHOST
  - PGDATABASE
  - PGUSER
  - PGPASSWORD
  - PGHOST_UNPOOLED
  - POSTGRES_URL_NO_SSL
  - NEON_AUTH_BASE_URL
  - VITE_NEON_AUTH_URL
bootstrap:
  driver_binding_requirement: DATABASE_DRIVER_MUST_BIND_BEFORE_READINESS
  package_json_dependency: REQUIRED
  identity_guard: NEON_PROJECT_ID must equal wild-wave-25661146
  migration_guard: CURRENT_DATABASE_MIGRATION_AUTHORITY_AND_CHECKSUM_MANIFEST_MUST_PASS
  production_ready_claim_allowed_from_this_contract_alone: false
required_schema:
  authority_path: authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml
  migration_root: database/migrations/
  checksum_manifest: database/migrations/migration_checksum_manifest.yaml
  mutable_migration_count_embedded: false
  historical_execution_state_embedded: false
  target: wild-wave-25661146 / neondb / PG 18 / br-shy-cherry-auiol4oy
forbidden:
  - Commit DATABASE_URL or password values
  - Bind configureUiProjectionRuntime or other configure*Runtime adapters without Current Authority SQL/permission mapping
  - Treat CONTROLLED_TEST as production binding
  - Return control-plane ready while the database binding or identity readiness probe is failing
  - Drop, skip, reorder, or infer application of any migration outside Current Database Migration Authority and checksum validation
  - Claim target schema completeness from another project, branch, historical snapshot, or stale migration count
