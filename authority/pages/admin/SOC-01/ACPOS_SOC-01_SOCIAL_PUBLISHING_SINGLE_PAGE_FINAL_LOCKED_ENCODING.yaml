form_contracts:
  BindSocialAccountRequest:
    context_fields:
    - scope
    - expected_version
    - correlation_id
    - idempotency_key
    business_fields:
    - name: platform_key
      required: true
    - name: display_name
      required: true
    - name: login_identifier
      required: true
    - name: auth_mode
      required: true
      enum:
      - OFFICIAL_OAUTH_OR_TOKEN
      - MANUAL_BROWSER_CREDENTIAL
      - CUSTOM_SECRET
    - name: credential_value
      required: true
      type: secret
    - name: credential_username
      required: false
    - name: external_account_ref
      required: false
    ui_rule: credential_value is input-only secret and never re-rendered as normal field value.
  CreateSocialTargetDiscoveryRequest:
    context_fields:
    - scope
    - expected_version
    - correlation_id
    - idempotency_key
    business_fields:
    - name: job_name
      required: true
    - name: platform_key
      required: true
    - name: target_types
      required: true
      type: string_list
    - name: categories
      required: true
      type: string_list
    - name: keywords
      required: true
      type: string_list
    - name: market
      required: false
    - name: language
      required: false
    - name: minimum_scale
      required: false
      type: integer
    - name: exclude_keywords
      required: false
      type: string_list
    - name: mode
      required: true
      enum:
      - CONTINUOUS
      - SINGLE_RUN
    ui_rule: Required search conditions remain in the main form; optional market/language/minimum_scale/exclude_keywords may
      live in Advanced Conditions drawer. No source/crawler fields invented.
  ConfigureSocialTargetPolicyRequest:
    context_fields:
    - scope
    - expected_version
    - correlation_id
    - idempotency_key
    business_fields:
    - name: target_id
      required: false
      rule: URL path id canonical; optional body copy must match path
    - name: minimum_interval_hours
      required: true
      type: integer
    - name: daily_limit
      required: true
      type: integer
    - name: weekly_limit
      required: true
      type: integer
    - name: same_content_cooldown_hours
      required: false
      type: integer
    - name: similar_content_cooldown_hours
      required: false
      type: integer
    - name: allowed_time_window
      required: false
      type: json/object
    - name: target_rule_notes
      required: false
      type: string
    ui_rule: Do not add local auto_publish / human_approval request keys. Such policy semantics are read from current governed
      projection and can be edited only when an exact existing governed resource binding is available.
  RequestSocialTargetPublishRequest:
    context_fields:
    - scope
    - expected_version
    - correlation_id
    - idempotency_key
    business_fields:
    - name: target_id
      required: false
      rule: URL path id canonical; optional body copy must match path
    - name: content_package_id
      required: true
    - name: channel_account_id
      required: true
    - name: schedule_at
      required: false
    - name: content_hash
      required: false
    - name: content_similarity_key
      required: false
    ui_rule: Registered operation is target-scoped. Page must not invent bulkSocialPublish. If future UX permits multi-select,
      it may only orchestrate independent exact existing requests with unique idempotency and truthful per-target partial
      result; no new endpoint.
operations:
- operation_id: getUiProjection
  method: GET
  path: /v1/ui-projections/{pageUid}
  owner: Projection / source page read owner
  permission: SOURCE_R9_PAGE_SECTION_FIELD_ACCOUNT_AUTHORIZATION
  request_contract: N/A_READ
- operation_id: configureGovernedResource
  method: PATCH
  path: /v1/governance/resources/{id}
  owner: Existing Governance/Policy owner
  permission: SOURCE_R9_OPERATION_PERMISSION_BY_OPERATION_ID
  request_contract: USE_SOURCE_R9_REQUEST_CONTRACT_BY_OPERATION_ID
- operation_id: setKillSwitch
  method: POST
  path: /v1/operations/kill-switch
  owner: Existing Operations Governance
  permission: ops.kill_switch
  request_contract: USE_SOURCE_R9_REQUEST_CONTRACT_BY_OPERATION_ID
- operation_id: bindSocialAccount
