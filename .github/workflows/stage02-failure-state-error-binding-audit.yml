name: Stage02 Failure State Error Binding Current Authority Audit

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/run_current_stage2_failure_state_error_binding_audit.py'
      - '.github/workflows/stage02-failure-state-error-binding-audit.yml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-state-error-binding-current-authority-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage02-failure-state-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Enforce Current Specification mutation authorization
        run: python governance/ci/specification_mutation_guard.py
      - name: Validate remediation closure protocol; this audit is diagnostic only
        run: python governance/ci/validate_stage_test_remediation_closure_protocol.py
      - name: Validate Stage-02 legal successor state
        run: python governance/ci/validate_stage02_state_integrity.py
      - name: Run fresh 44-action failure-state/error-binding authority audit
        run: python governance/ci/run_current_stage2_failure_state_error_binding_audit.py
      - name: Prove ASSET Stage-01 source and Current Specification remained byte-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml \
            governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
      - name: Upload diagnostic failure-state/error-binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-failure-state-error-binding-current-authority-audit
          path: .github/stage02-failure-state/FAILURE_STATE_ERROR_BINDING_CURRENT_AUTHORITY_AUDIT.json
          if-no-files-found: error
