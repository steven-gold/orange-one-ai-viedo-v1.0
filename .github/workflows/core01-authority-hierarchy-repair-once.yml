name: CORE01 Authority Hierarchy Repair Once
on:
  push:
    branches: [new]
    paths:
      - .github/workflows/core01-authority-hierarchy-repair-once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Repair hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml')
          s=p.read_text()
          old='''  parallel_authority_for_same_page: FORBIDDEN\ncreation_authorization_policy:\n'''
          new='''  parallel_authority_for_same_page: FORBIDDEN\n  system_authority: ACPOS_SYSTEM_AUTHORITY@V1.0\n  navigation_authority: ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY@V1.0\n  production_script_authority: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.3\ncreation_authorization_policy:\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  security_rule: Client denial is UX only; server authorization is mandatory and direct API bypass must also be denied.\n  system_authority: ACPOS_SYSTEM_AUTHORITY@V1.0\n  navigation_authority: ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY@V1.0\n  production_script_authority: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.3\nsystem_filename_governance:\n'''
          new='''  security_rule: Client denial is UX only; server authorization is mandatory and direct API bypass must also be denied.\nsystem_filename_governance:\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml').read_text()
          assert s.index('  system_authority: ACPOS_SYSTEM_AUTHORITY@V1.0') < s.index('creation_authorization_policy:')
          assert s.index('  navigation_authority: ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY@V1.0') < s.index('creation_authorization_policy:')
          assert s.index('  production_script_authority: ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT@V1.3') < s.index('creation_authorization_policy:')
          block=s.split('creation_authorization_policy:',1)[1].split('system_filename_governance:',1)[0]
          for forbidden in ['\n  system_authority:', '\n  navigation_authority:', '\n  production_script_authority:']:
              assert forbidden not in block
          print('AUTHORITY_HIERARCHY_PASS')
          PY
      - name: Compile regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json >/tmp/audit.json || true
          node - <<'NODE'
          const a=require('/tmp/audit.json'); if(a.metadata.vulnerabilities.total!==0)process.exit(1); console.log('AUDIT_ZERO_PASS')
          NODE
          npm run typecheck
          npm run build
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          echo REGRESSION_PASS
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- next-env.d.ts tsconfig.json 2>/dev/null || true
          git add authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          git diff --cached --check
          git commit -m "fix(core): restore authority hierarchy after permission gate"
          git push origin new
      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          if [ -f .github/workflows/core01-authority-hierarchy-repair-once.yml ]; then
            git rm -f .github/workflows/core01-authority-hierarchy-repair-once.yml
            git commit -m "chore: remove CORE01 authority hierarchy repair workflow"
            git push origin new
          fi
