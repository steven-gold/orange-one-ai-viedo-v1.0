name: ACPOS Batch 63 Stale Composite Lexical Cleanup

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch63-stale-composite-cleanup
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 62 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="d3eeb687015fe1f0220fce0a99629e129e5e5d39"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH62 WORD BOUNDARY"

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Apply Batch 63 lexical cleanup
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch63_stale_composite_lexical_cleanup.py

      - name: Verify Batch 63 semantics
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch63_cleanup_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["legacy_r9_r5_remaining"]==0,m
          assert m["ambiguous_locator_remaining"]==0,m
          assert m["stale_composite_lexical_remaining"]==0,m
          assert m["stale_composite_replacements"]==3,m
          assert m["target_exact_rows"]==2,m
          assert m["atomic_ports_verified"]==2,m
          assert m["reverse_binding_rows"]>=4,m
          assert m["dispatch_exactly_one_port"] is True,m
          assert m["public_api_created"] is False,m
          assert m["runtime_execution_claimed"] is False,m
          print("PASS: BATCH63 SEMANTICS")
          PY

      - name: Convert System Logic DOCX to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __render_qa_batch63/pdf
          libreoffice --headless --convert-to pdf --outdir __render_qa_batch63/pdf \
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx" >/dev/null

      - name: Full render encoding geometry QA
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,math,shutil
          from PIL import Image
          fn="ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          p=Path(fn);pdf=Path("__render_qa_batch63/pdf")/(p.stem+".pdf")
          root=Path("__render_qa_batch63");(root/"pages").mkdir(exist_ok=True);(root/"contact").mkdir(exist_ok=True)
          with zipfile.ZipFile(p) as z:
              for n in [x for x in z.namelist() if x.endswith(".xml") or x.endswith(".rels")]:ET.fromstring(z.read(n))
              doc=ET.fromstring(z.read("word/document.xml"));ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
              src="".join((e.text or "") for e in doc.iter(ns+"t"))
          txt=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          assert not [x for x in bad if x in src or x in txt]
          cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          sc=len(cjk.findall(src));pc=len(cjk.findall(txt));ratio=pc/sc if sc else 1
          assert ratio>=0.97,(sc,pc,ratio)
          subprocess.check_call(["pdftoppm","-jpeg","-jpegopt","quality=88","-r","110",str(pdf),str(root/"pages"/"page")],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          imgs=sorted((root/"pages").glob("page-*.jpg"));assert imgs
          blank=[];edge=[];thumbs=[]
          for i,imf in enumerate(imgs,1):
              im=Image.open(imf).convert("L");w,h=im.size;b=im.point(lambda x:255 if x<245 else 0).getbbox()
              if b is None:blank.append(i)
              elif b[0]<=1 or b[1]<=1 or b[2]>=w-1 or b[3]>=h-1:edge.append((i,b,(w,h)))
              th=Image.open(imf).convert("RGB");th.thumbnail((180,255));thumbs.append(th.copy())
          assert not blank,blank
          assert not edge,edge[:10]
          cols=5;cw=190;ch=265;rows=math.ceil(len(thumbs)/cols);sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
          for i,im in enumerate(thumbs):sheet.paste(im,((i%cols)*cw+5,(i//cols)*ch+5))
          sheet.save(root/"contact"/"system_logic_contact.jpg",quality=85)
          rep={"documents":1,"pages":len(imgs),"blank":0,"edge_clip":0,"cjk_ratio":ratio,"status":"PASS"}
          (root/"qa_report.json").write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH63 WORD QA",rep)
          PY

      - name: Verify exact Word scope
        shell: bash
        run: |
          set -euo pipefail
          out="$(git -c core.quotePath=false diff --name-only d3eeb687015fe1f0220fce0a99629e129e5e5d39 HEAD -- '*.docx')"
          test "$out" = "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          echo "PASS: EXACT WORD SCOPE = SYSTEM LOGIC ONLY"

      - name: Collect Batch 63 evidence
        shell: bash
        run: |
          mkdir -p __batch63_evidence
          cp __batch63_cleanup_report.json __batch63_evidence/
          cp __render_qa_batch63/qa_report.json __batch63_evidence/
          cp -R __render_qa_batch63/contact __batch63_evidence/
          cp -R __render_qa_batch63/pages __batch63_evidence/

      - name: Upload Batch 63 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch63-stale-composite-lexical-cleanup-evidence
          path: __batch63_evidence
          retention-days: 2
          if-no-files-found: error

      - name: Commit Batch 63 and remove tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-word-batch-63"
          git config user.email "actions@users.noreply.github.com"
          git add -- "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git rm -f __temp/batch63_stale_composite_lexical_cleanup.py .github/workflows/acpos_batch63_stale_composite_lexical_cleanup.yml
          rm -rf __batch63_cleanup_report.json __batch63_evidence __render_qa_batch63
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(git diff --cached --name-only -- '*.docx' | wc -l)" -eq 1
          git commit -m "docs(acpos): remove stale edit composite binding literals"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH63 COMMITTED / CLEAN TREE"
