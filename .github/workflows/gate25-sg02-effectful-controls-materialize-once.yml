name: ACPOS Gate25 SG02 Effectful Controls Materialize Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-sg02-effectful-controls-materialize-once.yml'
      - 'scripts/gate25-production-sg02-effectful-controls-diagnostic.mjs'

permissions:
  contents: write

jobs:
  materialize-sg02-effectful-control-blockers:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_EXPECT_RELEASE_SHA: 608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install product dependencies
        run: npm ci
      - name: Install browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Execute authenticated Production SG02 effectful control diagnostic
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/gate25-production-sg02-effectful-controls-diagnostic.mjs
          node scripts/gate25-production-sg02-effectful-controls-diagnostic.mjs | tee "$RUNNER_TEMP/sg02-effectful.log"
      - name: Materialize exact SG02 effectful control blockers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          line=next((x for x in (Path(os.environ['RUNNER_TEMP'])/'sg02-effectful.log').read_text().splitlines() if x.startswith('SG02_EFFECTFUL_CONTROL_DIAGNOSTIC ')),None)
          assert line, 'SG02 diagnostic payload missing'
          diagnostic=json.loads(line.split(' ',1)[1])
          assert diagnostic['production_release_sha']==os.environ['ACPOS_EXPECT_RELEASE_SHA']
          assert diagnostic['projection_http']==200
          assert diagnostic['mutation_count']==0
          assert diagnostic['real_criteria_present'] is False, diagnostic
          expected={
            'CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE':'configureGovernedResource',
            'CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE':'approveGovernedResource',
          }
          observed={c['control_id']:c for c in diagnostic['controls']}
          assert set(observed)==set(expected)
          for cid,operation in expected.items():
            c=observed[cid]
            assert c['operation_id']==operation
            if c['enabled'] is False:
              assert c['disabled_reason']==f'SG02_CONTROL_GATE_BLOCKED:{cid}'

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_SG02_EFFECTFUL_CONTROL_PRODUCTION_BLOCKERS_2026-09-10.json')
          direct_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DIRECT_ADAPTERS_2026-09-10.json')
          authority_path=Path('authority/pages/admin/SG-02/ACPOS_SG-02_QA_REVIEW_STANDARD_FINAL_LOCKED_ENCODING.yaml')
          runtime_path=Path('src/domain/qaCriteria/qaCriteriaRuntimePort.ts')
          visual_path=Path('src/components/pages/QaCriteriaVisual.tsx')
          ledger=json.loads(ledger_path.read_text())
          assert ledger['denominator']['total']==1481
          before=dict(ledger['counts'])
          assert before=={'PASS':47,'BLOCKED':139,'NOT_EXECUTED':1295},before
          entries={e['resource_key']:e for e in ledger['entries']}
          pairs=[
            ('control:CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE','action:admin:SG-02:ACT-CONFIGURE','configureGovernedResource'),
            ('control:CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE','action:admin:SG-02:ACT-APPROVE','approveGovernedResource'),
          ]
          for control_key,action_key,_ in pairs:
            assert entries[control_key]['disposition']=='NOT_EXECUTED',(control_key,entries[control_key]['disposition'])
            assert entries[action_key]['disposition']=='BLOCKED',(action_key,entries[action_key]['disposition'])
            assert entries[action_key]['reason_code']=='REAL_GOVERNED_CRITERIA_CONTENT_REQUIRED',(action_key,entries[action_key]['reason_code'])

          gate_defects=diagnostic.get('gate_alignment_defects',[])
          evidence={
            'document_id':'ACPOS_GATE25_SG02_EFFECTFUL_CONTROL_PRODUCTION_BLOCKERS',
            'status':'BLOCKED',
            'recorded_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':os.environ['ACPOS_EXPECT_RELEASE_SHA'],
            'deployment_url':os.environ['ACPOS_DEPLOYMENT_URL'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'resource_count':2,
            'mutation_count':0,
            'page_state':diagnostic['page_state'],
            'real_criteria_present':False,
            'controls':diagnostic['controls'],
            'gate_alignment_defects':gate_defects,
            'formal_resources':[p[0] for p in pairs],
            'paired_blocked_actions':[p[1] for p in pairs],
            'rule':'Production SG-02 has no real QualityCriteriaVersion lineage, while the paired formal ACTION resources are already BLOCKED as REAL_GOVERNED_CRITERIA_CONTENT_REQUIRED. Any effectful control that remains enabled is additionally recorded as a Production UI gate-alignment defect; no sample or hardcoded criteria may be created solely for acceptance.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          run_ref=f'GitHub Actions: ACPOS Gate25 SG02 Effectful Controls Materialize run_id={os.environ["GITHUB_RUN_ID"]}'
          for control_key,action_key,operation in pairs:
            cid=control_key.split('control:',1)[1]
            control=observed[cid]
            e=entries[control_key]
            e['disposition']='BLOCKED'
            e['reason_code']='REAL_GOVERNED_CRITERIA_CONTENT_REQUIRED'
            e['evidence_refs']=[str(evidence_path),run_ref,str(direct_path),str(authority_path),str(runtime_path),str(visual_path)]
            e['blocker_detail']='Authenticated Production SG-02 has no real QualityCriteriaVersion lineage and the paired ACTION is blocked on real governed criteria content. Sample/hardcoded Production criteria are forbidden.' + (' Production UI gate-alignment defect: this effectful control is currently enabled despite the missing real criteria prerequisite.' if control['enabled'] is True else '')
            e['operation_ids']=[operation]
          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for e in ledger['entries']:counts[e['disposition']]+=1
          assert counts=={'PASS':47,'BLOCKED':141,'NOT_EXECUTED':1293},counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':2,'gate_alignment_defects':gate_defects},ensure_ascii=False))
          PY
      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit SG02 effectful control evidence and ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_SG02_EFFECTFUL_CONTROL_PRODUCTION_BLOCKERS_2026-09-10.json
          git commit -m 'evidence(gate25): block 2 SG02 effectful controls on real criteria prerequisite'
          git push origin HEAD:new
