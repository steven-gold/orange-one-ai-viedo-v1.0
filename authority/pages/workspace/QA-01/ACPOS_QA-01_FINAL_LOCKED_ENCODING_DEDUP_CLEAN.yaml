review_modes:
  default: AUTO
  control:
    type: SEGMENTED_CONTROL
    options:
    - AUTO
    - MANUAL
    location: QA Review Queue header / left rail
    mode_switch_rule: Changing mode never changes Project/Topic identity and never deletes existing review results.
  AUTO:
    scope: CURRENT_EXACT_PROJECT_AND_TOPIC
    task_source: All authorized QA tasks belonging to selected Topic in canonical existing order
    task_order: KEEP_EXISTING_ORDER
    ai_may_reorder: false
    ai_may_create_task: false
    ai_may_skip_pending_task: false
    parallel: FORBIDDEN
    max_active_task: 1
    completed_task: Do not auto-rerun governed completed QA result unless verified NEW output requires RECHECK.
    sequence:
    - Resolve next QA task under current Topic
    - Resolve exact TargetOutputVersion; no latest/current/default alias
    - Load QAValidationScriptView + approved CriteriaVersion + QualityGatePolicy + Evidence + Rights/Policy
    - Start/continue QA review using registered runtime authority
    - System/AI generates Scorecard + required checks + evidence/hard-gate result
    - Persist governed review result
    - 'If total score is below bound CriteriaVersion/QualityGatePolicy threshold: emit QA_LOW_SCORE_WARNING and mark NEEDS_ATTENTION'
    - 'If score is not below threshold and no hard block: no warning popup; continue automatically'
    - Hard block / rights / policy / evidence failure remains BLOCKED in queue/status and is not mislabeled as low-score warning
    - Release current slot
    - Load next Topic QA task until queue exhausted
    low_score_warning_only: true
    warning_contract:
      event: QA_LOW_SCORE_WARNING
      trigger: total_score below bound task criteria/policy threshold
      payload:
      - project_id
      - topic_id
      - qa_task_id
      - qa_review_id
      - target_output_version_id
      - scorecard_id
      - total_score
      - criteria_version_id
      - quality_gate_policy_version
      ui: Warning notification + Queue NEEDS_ATTENTION badge; frontend never hard-codes the threshold
    human_intervention: Passing/non-low-score items continue without popup. A score below the bound Criteria/Policy threshold emits the warning
      defined by this page. Whether a ManualReviewCase is also required is decided by the governed QA/Manual Review policy. Only when Manual
      Review is triggered does the Human see 修改 / 通過.
    release_boundary: AUTO review never publishes. Release Candidate remains governed by existing QA release eligibility/action.
  MANUAL:
    scope: CURRENT_AUTHORIZED_QUEUE
    selection: Human selects one QA task/review at a time from QA Review Queue.
    context: Selection resolves exact Project / Topic / QATask / TargetOutputVersion into read-only Context Bar.
    start: Start Review visible/enabled only for NOT_STARTED selected item with QA-01-GATE-START PASS.
    evaluation: System/AI generates Scorecard first.
    human_interaction: System/AI scores the selected task. Scorecard area remains read-only. Only if a governed ManualReviewCase is triggered
      does the Manual Review area show 修改 / 通過.
    next_task: No automatic next-task start after confirmation; Human selects/starts the next item.
manual_review_contract:
  trigger: Existing governed ManualReviewCase required/open after System/AI scoring
  visibility: HIDDEN when no ManualReviewCase is required/open
  human_functions:
  - 修改
  - 通過
  modify:
    label_zh: 修改
    label_en: Modify
    meaning: Enter governed modification flow for the current ManualReviewCase/current evaluated item. Never open a blank scoring form.
    backend_binding: RESOLVE_FROM_EXISTING_GOVERNED_MANUAL_REVIEW_AUTHORITY
    if_missing: BLOCK + REPORT_AUTHORITY_GAP; frontend must not invent endpoint or permission
  pass:
    label_zh: 通過
    label_en: Pass
    meaning: Pass/close the current ManualReviewCase and return to normal QA Gate evaluation. Not equivalent to direct QA Gate PASS; cannot
      override Hard Gate/Rights/Policy/Evidence blockers.
    backend_binding: RESOLVE_FROM_EXISTING_GOVERNED_MANUAL_REVIEW_AUTHORITY
    if_missing: BLOCK + REPORT_AUTHORITY_GAP; frontend must not invent endpoint or permission
  forbidden:
  - human action in Scorecard area
  - blank manual score entry
  - direct manual QA Gate PASS button as substitute for Manual Review Pass
  - Manual Review buttons when no ManualReviewCase is required/open
