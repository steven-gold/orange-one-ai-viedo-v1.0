exact_scope:
  purpose: >-
    Harden the reusable Mother Governance so every conversation and execution cycle resolves Current Truth and task layer before any current-state judgment or effectful work, and so governance-maintenance work cannot be confused with a product Stage work unit or receive product completion credit.
  permitted_normative_changes:
    - Define one mandatory SESSION_BOOTSTRAP_RESUME_GATE with ordered resolution of live repository/branch/head, formal Registry/Current Governance entry, Mother 01 through 04, Current Canonical Authority, Active Work Unit or legal Work Unit resolution, Canonical Owner Mapping, Resume Point, Current Audit/Evidence, selected execution profile, entry/dependency/DoD/gates/transition.
    - Define fail-closed behavior when required Current identity, owner, resume, evidence, authority, revision or reference is missing, stale, ambiguous or contradictory.
    - Define TASK_LAYER_CLASSIFICATION separating GOVERNANCE_MAINTENANCE, PRODUCT_STAGE_EXECUTION, TEST_OR_VALIDATION_MAINTENANCE, EVIDENCE_STATE_MAINTENANCE and DEPLOYMENT_OR_PRODUCTION operations before Work Unit execution.
    - Require that Stage/profile/run identities never select Current Governance or redefine the current primary task.
    - Define WORK_UNIT_RESOLUTION_GATE when no legal Active Work Unit exists, deriving a successor only from registered authority/change request/impact/dependency/applicability evidence and forbidding AI invention.
    - Explicitly prohibit governance cleanup, validator/harness repair, evidence/state repair and CI/gate repair from receiving product-stage gap reduction or product completion credit.
    - Strengthen canonical-reference and context continuity so stale/deleted/superseded owners fail before execution and reference migration uses the complete active/transitive consumer set.
    - Require terminal closure to depend on observed outer terminal conclusion, not inner-step success or an in-progress workflow.
    - Reconcile duplicated Mother clauses without lowering any existing requirement.
  permitted_supporting_changes:
    - .github/governance-source/active/source/12_DOCS/mother-spec/**
    - .github/governance-source/active/source/10_REGISTRY/**
    - .github/governance-source/** only for checksum/source-identity synchronization caused by the authorized Mother successor
    - governance/specifications/current/**
    - governance/specifications/REGISTRY.yaml
    - GOVERNANCE_CURRENT.yaml
    - governance/ci/**
    - governance/test/**
    - .github/workflows/** only where required to enforce the authorized Mother rules
  excluded_scope:
    - ACPOS product or business behavior changes
    - Supplying unresolved Stage-02 product or external authority values
    - Product materialization or product gap remediation
    - Entering any product Stage as the primary task
    - Stage-03 progression
    - Website feature construction
    - Production deployment
    - Deleting valid historical provenance

