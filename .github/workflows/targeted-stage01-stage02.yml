name: Current Governance Stage01 Reset Integrity Gate

on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage01-reset-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce explicit authorization before Current Specification mutation
        run: python governance/ci/specification_mutation_guard.py
      - name: Resolve active governance through stable registry
        run: python governance/ci/governance_resolver.py
      - name: Validate canonical rule registry anti-drift binding
        run: python governance/ci/validate_canonical_rule_registry.py
      - name: Validate reusable governance portability through canonical taxonomy
        run: python governance/ci/validate_governance_portability.py
      - name: Validate neutral validation remediation closure protocol
        run: python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Validate governance layout and zero residual
        run: python governance/ci/validate_governance_layout.py
      - name: Validate authoring reference duplicate conflict and residual governance coverage
        run: python governance/ci/validate_authoring_reference_governance_coverage.py
      - name: Validate active consumer reference integrity
        run: python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Stress test registry resolution and fail-closed invariants
        run: python governance/ci/stress_test_governance_registry.py
      - name: Validate Stage-01 artifacts bind to current governance by Registry UID
        run: python governance/ci/validate_stage01_registry_binding.py
      - name: Validate Stage-02 predecessor or legal external-authority-aware successor/remediation state integrity
        run: python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
