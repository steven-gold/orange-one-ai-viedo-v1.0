          kind: scalar
          scalar_type: string
        work_item_uid:
          min_length: 1
          kind: scalar
          scalar_type: string
        context_hash:
          min_length: 1
          kind: scalar
          scalar_type: string
        attachment_refs:
          items:
            kind: opaque_ref
            source_authority_term: attachment_ref returned by the global attachment/reference boundary
            no_new_entity: true
          default: []
          kind: array
        reference_refs:
          items:
            kind: opaque_ref
            source_authority_term: reference refs
            no_new_entity: true
          default: []
          kind: array
        mention_refs:
          items:
            kind: opaque_ref
            source_authority_term: '@ parser target ref'
            no_new_entity: true
          default: []
