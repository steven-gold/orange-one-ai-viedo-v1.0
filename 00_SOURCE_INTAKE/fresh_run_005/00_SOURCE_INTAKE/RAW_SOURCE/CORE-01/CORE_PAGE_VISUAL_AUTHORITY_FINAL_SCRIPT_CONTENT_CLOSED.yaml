    allowed_change: Local layout/menu/copy state only
    forbidden: No domain mutation
  - effect_type: CONTEXT_STATE
    allowed_change: Change selected Project/Topic/work item/thread in UI
    forbidden: No cross-project implicit fallback
  - effect_type: CONVERSATION_WRITE
    allowed_change: Create thread/send message
    forbidden: Cannot formalize AI output directly
  - effect_type: CANDIDATE_CREATE
    allowed_change: Create immutable candidate
    forbidden: Cannot overwrite existing candidate/version
  - effect_type: CANDIDATE_DECISION
    allowed_change: Record candidate decision
    forbidden: Cannot auto-lock by score
