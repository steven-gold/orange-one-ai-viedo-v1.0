      - source_response_ids
      - work_item_uid
      optional:
      - parent_candidate_ref
      fields:
        target_ref:
          kind: opaque_ref
          source_authority_term: target ref
          no_new_entity: true
        human_decision_ref:
          kind: object_ref
          object_uid: CORE-01-OBJ-HUMAN-DECISION
          no_new_entity: true
        structured_decision_ref:
          kind: object_ref
          object_uid: CORE-01-OBJ-STRUCTURED-DECISION
          no_new_entity: true
        source_response_ids:
          items:
            kind: scalar
            scalar_type: string
          min_items: 1
          kind: array
        work_item_uid:
          min_length: 1
          kind: scalar
          scalar_type: string
        parent_candidate_ref:
          nullable: true
          kind: object_ref
          object_uid: CORE-01-OBJ-CANDIDATE
          no_new_entity: true
      server_derived:
