name: ACPOS Migration Authority Current Cleanup Once

on:
  push:
    branches: [new]
    paths:
      - .github/workflows/migration-authority-current-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace mixed historical migration snapshot with Current governance contract
        run: |
          cat > authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml <<'YAML'
          authority:
            id: ACPOS_DATABASE_MIGRATION_AUTHORITY
            version: V1.1
            status: FINAL_LOCKED
            current_only: true
            revision: 2026-09-11-CURRENT-GOVERNANCE-ONLY
            scope: DATABASE_MIGRATION_BOOTSTRAP_CHECKSUM_AND_EXECUTION_GOVERNANCE
            undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP

          current_target:
            neon_project_id: wild-wave-25661146
            database_name: neondb
            production_branch_name: main
            production_branch_id: br-shy-cherry-auiol4oy
            production_endpoint_id: ep-hidden-hat-auu8r1b0
            pg_version: 18
            target_guard: NEON_PROJECT_ID_MUST_MATCH_CURRENT_TARGET

          artifact_bindings:
            migration_root: database/migrations/
            checksum_manifest: database/migrations/migration_checksum_manifest.yaml
            applied_history_relation: schema_migration_history
            mutable_registered_migration_count_embedded: false
            mutable_applied_migration_count_embedded: false
            mutable_production_reconciliation_embedded: false
            staging_or_restore_snapshot_state_embedded: false

          governance:
            registration_source: database/migrations/migration_checksum_manifest.yaml
            ordering: REGISTERED_MIGRATION_ORDER
            checksum_match_required: true
            missing_registered_migration: BLOCK
            unregistered_migration_file: BLOCK
            checksum_drift: BLOCK
            duplicate_migration_id: BLOCK
            skip_or_reorder: FORBIDDEN
            production_apply_requires:
              - exact Current target identity
              - registered checksum match
              - unapplied predecessor closure
              - transactional execution where migration contract permits
              - schema_migration_history write only after successful apply
            production_verification_requires:
              - schema_migration_history reconciled against checksum manifest
              - no checksum mismatch
              - no duplicate migration id
              - no unregistered applied migration
            migration_payload_history:
              rule: Applied migration lineage is immutable evidence; later schema corrections require a new registered migration unless a separately approved historical correction is already part of the repository checksum authority.
              execution_evidence_owner: docs/construction/evidence/
              repository_history_owner: Git history

          current_state_policy:
            mutable_environment_state_embedded: false
            current_state_owner: CURRENT_EXECUTION_STATE.json
            production_evidence_owner: docs/construction/evidence/
            migration_history_owner: database/migrations/migration_checksum_manifest.yaml
            rule: Current migration counts, apply dates, release SHAs, temporary validation branches, restore snapshots, staging row counts and Production reconciliation results are execution evidence, not Current Authority.

          preserved_history_policy:
            migration_files_are_not_deleted_or_renamed_for_authority_cleanup: true
            checksum_manifest_is_not_rewritten_to_hide_history: true
            historical_execution_evidence_is_not_runtime_authority: true

          forbidden:
            - Use a superseded Neon project or branch as Current production authority.
            - Infer Production migration completeness from staging, preview, restore, or another project.
            - Embed a fixed migration ceiling or mutable applied migration count in this Current Authority.
            - Treat an old release SHA, temporary validation branch, restore snapshot, row count, or acceptance result as a permanent migration rule.
            - Delete or rename an applied migration merely to remove historical naming.
            - Bypass checksum validation or schema_migration_history reconciliation.
          YAML

          node <<'NODE'
          const fs=require('node:fs');
          const p='tests/release/authority.test.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old=/test\("Current-only manifest does not embed mutable historical migration execution state", \(\) => \{[\s\S]*?\n\}\);/;
          if(!old.test(s)) throw new Error('migration authority regression anchor missing');
          s=s.replace(old,`test("Current-only authority does not embed mutable historical migration execution state", () => {\n  assert.match(manifest, /historical_execution_evidence_owner: database\\/migrations\\/migration_checksum_manifest\\.yaml/);\n  assert.match(manifest, /mutable_production_state_embedded: false/);\n  assert.doesNotMatch(manifest, /post_migration_validation:/);\n  assert.doesNotMatch(manifest, /production_integrity_checklist:/);\n  assert.doesNotMatch(manifest, /CR-R9-/);\n  assert.match(migrationAuthority, /current_state_policy:/);\n  assert.match(migrationAuthority, /mutable_environment_state_embedded:\\s*false/);\n  assert.match(migrationAuthority, /mutable_registered_migration_count_embedded:\\s*false/);\n  assert.match(migrationAuthority, /mutable_applied_migration_count_embedded:\\s*false/);\n  assert.match(migrationAuthority, /historical_execution_evidence_is_not_runtime_authority:\\s*true/);\n  assert.doesNotMatch(migrationAuthority, /current_production_reconciliation:/);\n  assert.doesNotMatch(migrationAuthority, /tiny-dust/);\n  assert.doesNotMatch(migrationAuthority, /migration_chain_0001_0015_on_this_target/);\n});`);
          fs.writeFileSync(p,s);
          NODE

          cat > tests/release/migration-authority-current-governance.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const authority=await readFile("authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml","utf8");
          test("Migration Current Authority is governance-only and delegates mutable execution truth",()=>{
            assert.match(authority,/registration_source: database\/migrations\/migration_checksum_manifest\.yaml/);
            assert.match(authority,/applied_history_relation: schema_migration_history/);
            assert.match(authority,/checksum_match_required: true/);
            assert.match(authority,/current_state_owner: CURRENT_EXECUTION_STATE\.json/);
            assert.match(authority,/historical_execution_evidence_is_not_runtime_authority: true/);
            assert.doesNotMatch(authority,/materialized_migration_count:/);
            assert.doesNotMatch(authority,/production_applied_migration_count:/);
            assert.doesNotMatch(authority,/current_production_reconciliation:/);
            assert.doesNotMatch(authority,/temporary_0002_validation:/);
            assert.doesNotMatch(authority,/staging_0003_pre_correction_preflight:/);
            assert.doesNotMatch(authority,/CR-R9-/);
            assert.doesNotMatch(authority,/tiny-dust/);
          });
          TEST
      - name: Show direct consumers before validation
        run: |
          grep -R -n "ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml\|current_production_reconciliation:\|materialized_migration_count:" tests src scripts authority .github --exclude='migration-authority-current-cleanup-once.yml' || true
      - name: Validate stale Current migration state is absent
        run: |
          set -euo pipefail
          ! grep -q "tiny-dust\|current_production_reconciliation:\|materialized_migration_count:\|production_applied_migration_count:\|CR-R9-\|0001-0015" authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml
          grep -q "current_state_owner: CURRENT_EXECUTION_STATE.json" authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml
          grep -q "checksum_manifest: database/migrations/migration_checksum_manifest.yaml" authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml
      - run: npm ci
      - run: npm test
      - name: Commit clean tree without one-shot
        run: |
          set -euo pipefail
          git rm .github/workflows/migration-authority-current-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml tests/release/authority.test.mjs tests/release/migration-authority-current-governance.test.mjs
          git commit -m "chore: reduce migration authority to current governance"
          git push origin HEAD:new
