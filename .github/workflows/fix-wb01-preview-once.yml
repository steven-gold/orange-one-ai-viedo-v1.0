name: Fix WB01 preview once
on:
  push:
    paths:
      - '.github/workflows/fix-wb01-preview-once.yml'
permissions:
  contents: write
jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate source and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Start production server
        run: |
          (npm run start -- -p 3000 >/tmp/acpos-next.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/acpos-next.log
          exit 1
      - name: Materialize and verify WB01
        run: |
          mkdir -p /tmp/wb01
          curl -fsS http://127.0.0.1:3000/ > /tmp/wb01/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wb01/index.html')
          s=p.read_text()
          assert 'data-page-uid="workspace:WB-01"' in s
          assert 'data-state="EMPTY"' in s
          assert s.count('data-section-id="SEC-WORKSPACE-WB-01-') >= 14
          assert 'SEC-WORKSPACE-WB-01-COMPANY-PROJECT-COUNT' in s
          assert 'SEC-WORKSPACE-WB-01-PROJECT-PROGRESS-OVERVIEW' in s
          assert 'SEC-WORKSPACE-WB-01-PRODUCTION-SUMMARY' in s
          assert 'SEC-WORKSPACE-WB-01-RECENT-COMPLETIONS' in s
          PY
      - name: Rewrite static preview paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wb01/index.html')
          s=p.read_text()
          s=s.replace('href="/_next/','href="_next/').replace('src="/_next/','src="_next/')
          s=s.replace('href="/brand/','href="brand/').replace('src="/brand/','src="brand/')
          nav={'/':'index.html','/core':'core.html','/assets':'assets.html','/video':'video.html','/edit':'edit.html','/qa':'qa.html','/database':'db.html','/strategy':'strategy.html','/info':'info.html','/admin/system':'system.html','/admin/accounts':'accounts.html','/admin/dev':'dev.html','/admin/social':'social.html','/admin/erp':'erp.html','/admin/aiapi':'aiapi.html','/admin/qa-criteria':'qa-criteria.html','/admin/strategy':'strategy-admin.html','/admin/knowledge':'knowledge-admin.html'}
          for route,target in sorted(nav.items(),key=lambda x:len(x[0]),reverse=True): s=s.replace(f'href="{route}"',f'href="{target}"')
          p.write_text(s)
          PY
      - name: Sync WB01 and matching build chunks to original preview
        run: |
          git fetch origin acpos-live-preview
          git worktree add -B acpos-live-preview /tmp/acpos-preview origin/acpos-live-preview
          cp /tmp/wb01/index.html /tmp/acpos-preview/preview/index.html
          rm -rf /tmp/acpos-preview/preview/_next
          mkdir -p /tmp/acpos-preview/preview/_next
          cp -R .next/static /tmp/acpos-preview/preview/_next/static
          cd /tmp/acpos-preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/index.html preview/_next
          git commit -m 'fix(preview): render WB-01 dashboard instead of loading-only shell'
          git push origin HEAD:acpos-live-preview
      - name: Verify pushed preview
        run: |
          git fetch origin acpos-live-preview
          git show origin/acpos-live-preview:preview/index.html >/tmp/pushed-index.html
          grep -q 'data-page-uid="workspace:WB-01"' /tmp/pushed-index.html
          grep -q 'data-state="EMPTY"' /tmp/pushed-index.html
          test $(grep -o 'data-section-id="SEC-WORKSPACE-WB-01-' /tmp/pushed-index.html | wc -l) -ge 14
          ! grep -q '>載入中</div></main>' /tmp/pushed-index.html
          echo PREVIEW_SHA=$(git rev-parse origin/acpos-live-preview)
      - name: Self clean
        run: |
          rm -f .github/workflows/fix-wb01-preview-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-wb01-preview-once.yml
          git commit -m 'chore(preview): remove WB-01 one-shot workflow'
          git push origin HEAD:new