          if 'VIDEO-01-TEST-' in s or 'VIDEO-01-CONTROLLED' in s: raise SystemExit('VIDEO server pseudo token remains')
          w(p,s)
          p='src/components/pages/VideoVisual.tsx';s=r(p)
