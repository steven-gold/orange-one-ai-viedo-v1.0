normative_definition:
- Dimension: Business Goal
  Normative Definition: 以真實 Fact/Evidence、內部狀態、資源/成本/風險、歷史 Experience 為基礎，產生可比較、可審查、可回饋的策略選項。
- Dimension: Primary User
  Normative Definition: 管理層、策略分析者、授權決策者。
- Dimension: Primary Object
  Normative Definition: Strategy Topic / Strategic Question / Strategy Candidate / Decision Candidate。
- Dimension: Human Boundary
  Normative Definition: AI 分析與建議；人類作正式決策；Owner Module 作 effectful execution。
- Dimension: Version Boundary
  Normative Definition: Strategy Output / Candidate / Scenario / Decision Brief / Memory append-only；revision
    產生新版本。
- Dimension: Truth Boundary
  Normative Definition: Fact、Inference、Assumption、Risk/Opportunity、Recommendation、Decision 必須分層，不得互相偷升格。
scope:
- Type: IN SCOPE
  Included / Excluded: Strategic Context、Fact Pack、Question/Constraint、Analysis、Forecast/Pattern、Risk/Opportunity、Option、Resource
    Impact、Scenario、Multi-AI Same-Baseline、Cross-Review、Consensus/Disagreement、Decision Candidate、Human
    Review、Decision Ledger、Expected-vs-Actual、Strategic Experience Candidate。
- Type: OUT OF SCOPE
  Included / Excluded: Shared Conversation persistence、Provider routing、ERP booking/approval、Workflow
    command、Production action、Email/Social publish、Authority mutation、system deployment。
- Type: REFERENCES
  Included / Excluded: AI-01 Global Brain / Context；AI-02 Conversation & Multi-AI Core；AI-03 Execution
    Router；AI-06/07 business outcomes；AI-09 System Lifecycle。
- Type: NO SECOND SYSTEM
  Included / Excluded: 不得建立 Strategy 專屬的第二套 Conversation Engine、Context Engine、Provider Router、Fact Store、Experience
    Engine、Workflow Engine 或 Approval Engine。
