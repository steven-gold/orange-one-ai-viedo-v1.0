            '{ id: "EDIT-01-FLD-VOICE-PROVIDER", kind: "readonly" }':'{ id: "EDIT-01-FLD-VOICE-PROVIDER", kind: "mode-select" }',
            '{ id: "EDIT-01-FLD-VOICE-MODEL", kind: "readonly" }':'{ id: "EDIT-01-FLD-VOICE-MODEL", kind: "mode-select" }',
            '{ id: "EDIT-01-FLD-MUSIC-ASSET", kind: "readonly" }':'{ id: "EDIT-01-FLD-MUSIC-ASSET", kind: "mode-select" }',
            '{ id: "EDIT-01-FLD-SFX-ASSET", kind: "readonly" }':'{ id: "EDIT-01-FLD-SFX-ASSET", kind: "mode-select" }',
          }
          for a,b in repl.items():
            if a not in s: raise SystemExit('missing EditVisual token: '+a)
            s=s.replace(a,b)
          old='function Control({ spec, compact = false }: { spec: Spec; compact?: boolean }) {\n  return <EditRuntimeControl controlId={spec.id} kind={spec.kind} compact={compact} />;\n}'
          new='function Control({ spec, compact = false, scopeRef }: { spec: Spec; compact?: boolean; scopeRef?: string }) {\n  return <EditRuntimeControl controlId={spec.id} kind={spec.kind} compact={compact} scopeRef={scopeRef} />;\n}'
          if old not in s: raise SystemExit('Control wrapper token missing')
          s=s.replace(old,new)
          old='<Control key={`${track.uid}-${id}`} spec={spec} compact />'
          new='<Control key={`${track.uid}-${id}`} spec={spec} compact scopeRef={track.uid} />'
          if old not in s: raise SystemExit('track control token missing')
          s=s.replace(old,new)
          p.write_text(s)

