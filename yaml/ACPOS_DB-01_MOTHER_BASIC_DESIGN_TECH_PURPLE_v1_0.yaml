      - Context
      - Recovery
    - row: 1
      cells:
      - DB-01-ERR-CONTEXT-001
      - Database context/environment/schema head unavailable or scope mismatch
      - BLOCK data panels; resolve authorized context
    - row: 2
      cells:
      - DB-01-ERR-ENTITY-001
      - Entity/table not registered or outside allowed scope
      - BLOCK selection; no database-name guessing
    - row: 3
      cells:
      - DB-01-ERR-SCHEMA-001
      - Schema/column/relation metadata missing or inconsistent
      - Show explicit authority gap/integrity finding; do not synthesize schema
    - row: 4
      cells:
      - DB-01-ERR-TRACE-001
      - Trace source ref missing/orphan/mismatched
      - Show broken path; do not silently repair or jump to latest
    - row: 5
      cells:
      - DB-01-ERR-VERSION-001
      - Version/source snapshot immutable lineage conflict
      - BLOCK any governed downstream use and surface exact conflict
    - row: 6
      cells:
      - DB-01-ERR-MIGRATION-001
      - Migration/checksum/dependency history invalid or incomplete
      - Show migration integrity blocker; route change to System Lifecycle
    - row: 7
      cells:
