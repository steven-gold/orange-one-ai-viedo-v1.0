    rows:
    - row: 0
      cells:
      - Error UID
      - Context
      - Recovery
    - row: 1
      cells:
      - QA-01-ERR-CONTEXT-001
      - Project/Topic/QATask/TargetOutputVersion missing, stale or mismatched
      - BLOCK review; resolve exact context; no implicit latest/default
    - row: 2
      cells:
      - QA-01-ERR-OUTPUT-001
      - Output artifact/version/checksum/provenance invalid
      - BLOCK viewer/score/gate; preserve review context
    - row: 3
      cells:
      - QA-01-ERR-SCRIPT-001
      - QAValidationScriptView missing/hash/department mismatch
      - BLOCK scoring; no generic QA script fallback
    - row: 4
      cells:
      - QA-01-ERR-CRITERIA-001
      - QA CriteriaVersion/QualityGatePolicy missing or unapproved
      - BLOCK scoring/gate; no local default threshold
    - row: 5
      cells:
      - QA-01-ERR-EVIDENCE-001
      - Required evidence/checksum/provenance/check missing
      - BLOCK gate/release; show exact missing evidence
    - row: 6
      cells:
      - QA-01-ERR-RIGHTS-001
      - Rights/Policy invalid or unavailable
      - HARD BLOCK; numeric score cannot override
    - row: 7
      cells:
      - QA-01-ERR-FINDING-001
      - Finding payload/source/scope/evidence invalid
      - BLOCK finding create; preserve current review
    - row: 8
      cells:
      - QA-01-ERR-CORRECTION-001
      - Correction request lacks failed version/original owner/source instruction/revalidation scope
      - BLOCK request; QA never executes upstream edit
    - row: 9
      cells:
      - QA-01-ERR-RECHECK-001
      - New output absent, same as failed version, or correction linkage invalid
      - BLOCK recheck; wait verified new exact version
    - row: 10
      cells:
      - QA-01-ERR-GATE-001
      - PASS/FAIL decision prerequisites invalid or stale
      - BLOCK decision; refresh exact review state
    - row: 11
      cells:
      - QA-01-ERR-MANUAL-001
      - Required ManualReviewCase unresolved/open
      - BLOCK PASS/Release; show manual review blocker
    - row: 12
      cells:
      - QA-01-ERR-RELEASE-001
      - Release candidate eligibility refs invalid
      - BLOCK package creation; no publish fallback
    - row: 13
      cells:
      - QA-01-ERR-PERM-001
      - Permission/scope denied
      - Disable action + show actual reason
    - row: 14
      cells:
      - QA-01-ERR-UNDEFINED-001
      - Unlisted Section/Component/Control/Action/Gate/Permission/Port requested
      - BLOCK + REPORT_AUTHORITY_GAP
    - row: 15
      cells:
      - QA-01-ERR-AUTO-001
      - AUTO cannot resolve Topic QA queue / exact next-task context
      - BLOCK current item; preserve queue; no reorder/create/skip
    - row: 16
      cells:
      - QA-01-ERR-EVIDENCE-CAPTURE-001
      - Evidence capture lacks exact output/version/checksum/provenance or valid point/range
      - BLOCK capture only; no manual Evidence ID fallback
    - row: 17
      cells:
      - QA-01-ERR-MANUAL-ACTION-001
      - Manual Review Modify/Pass requested but governed ManualReviewCase or mutation authority missing/stale
      - BLOCK Manual Review action; do not invent API/permission
