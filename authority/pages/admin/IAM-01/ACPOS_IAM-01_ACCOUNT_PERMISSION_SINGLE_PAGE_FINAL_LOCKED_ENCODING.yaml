  rule: Expand proposed L1 selections to exact current resource/action assignments, compute delta, show allow/deny/removed/unchanged and blockers.
    No apply.
- action_uid: IAM-01-ACT-COMPLETE
  effect: ORCHESTRATED_EXISTING_OPERATIONS
