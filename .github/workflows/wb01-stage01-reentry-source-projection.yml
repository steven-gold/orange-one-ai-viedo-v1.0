name: WB01 Stage01 Reentry Source Projection

on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/wb01-stage01-reentry-source-projection.yml'

permissions:
  contents: write

jobs:
  rebuild-source-pair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0921acpos
          path: product
          fetch-depth: 0
      - name: Checkout current governance workline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rebuild-v2.1.1
          path: governance
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install governance verifier dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/governance/ci/requirements-governance.lock
      - name: Rebuild and validate current source projection pair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rebuild_wb01_projection.py <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import copy, hashlib, sys, zipfile, yaml

          product=Path("product").resolve()
          gov=Path("governance").resolve()
          pkg=gov/".github/governance-source/active/source"
          tests=pkg/"09_TESTS/governance"
          sys.path.insert(0,str(tests))
          import governance_stage1_pipeline_guard as g

          source_uid="SRC-DOCX-2B1908530B5BD312A392"
          governed_unit_uid="workspace:WB-01"
          filename="ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"
          source=product/filename
          if not source.is_file():
              raise SystemExit("BLOCK:SOURCE_DOCX_MISSING")
          source_sha=g.file_sha(source)
          source_blob=g.git_blob_sha(source)

          old=product/"STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-001"
          old_audit=yaml.safe_load((old/f"00_SOURCE_INTAKE/SOURCE_PROJECTIONS/{source_uid}/SOURCE_DOCUMENT_CONTENT_AUDIT.yaml").read_text(encoding="utf-8")) or {}
          if old_audit.get("source_sha256")!=source_sha or old_audit.get("result")!="PASS":
              raise SystemExit("BLOCK:PREDECESSOR_CONTENT_AUDIT_NOT_REUSABLE")

          wu=product/"STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-REENTRY-001"
          intake=wu/"00_SOURCE_INTAKE"
          raw_rel=f"00_SOURCE_INTAKE/RAW_SOURCE/{source_uid}/{filename}"
          raw=wu/raw_rel
          raw.parent.mkdir(parents=True,exist_ok=True)
          raw.write_bytes(source.read_bytes())
          if g.file_sha(raw)!=source_sha or g.git_blob_sha(raw)!=source_blob:
              raise SystemExit("BLOCK:RAW_SOURCE_COPY_IDENTITY_DRIFT")

          rawcap={
            "artifact_uid":"RAW-CAPTURE-WU-STAGE01-WB01-DASHBOARD-REENTRY-001",
            "artifact_type":"RAW_SOURCE_REFERENCE_MANIFEST",
            "status":"CURRENT_RAW_SOURCE_CAPTURE",
            "capture_root":"00_SOURCE_INTAKE/RAW_SOURCE",
            "records":[{
              "source_uid":source_uid,
              "source_format":"DOCX",
              "projection_required":True,
              "governed_unit_uid":governed_unit_uid,
              "source_role":"MIXED_GOVERNED_UNIT_VISUAL_SOURCE_INPUT",
              "source_domain_scope":"MIXED_GOVERNED_UNIT_VISUAL",
              "source_path":filename,
              "target_path":raw_rel,
              "source_git_blob_sha":source_blob,
              "target_git_blob_sha":source_blob,
              "content_mutated":False,
            }]
          }
          capstate={
            "run_uid":"WU-STAGE01-WB01-DASHBOARD-REENTRY-001",
            "state":"CAPTURE_CLOSED",
            "next_step":"SOURCE_DOCUMENT_CONTENT_AUDIT",
            "recapture_allowed":False,
          }
          intake.mkdir(parents=True,exist_ok=True)
          (intake/"RAW_SOURCE_REFERENCE_MANIFEST.yaml").write_text(yaml.safe_dump(rawcap,sort_keys=False,allow_unicode=True),encoding="utf-8")
          (intake/"RAW_SOURCE_CAPTURE_STATE.yaml").write_text(yaml.safe_dump(capstate,sort_keys=False,allow_unicode=True),encoding="utf-8")

          contract=g._projection_contract(pkg)
          pc=contract["projection"]
          rc=contract["reconciliation"]
          fc=contract["pair_freeze"]
          lc=contract["raw_source_lock"]
          cc=contract["source_document_content_readiness_audit"]
          bc=contract["frozen_binary_source_part_materialization"]
          proj_dir=intake/"SOURCE_PROJECTIONS"/source_uid
          proj_dir.mkdir(parents=True,exist_ok=True)

          audit={
            "schema_version":1,
            "artifact_uid":f"CONTENT-AUDIT-{source_uid}-REENTRY-001",
            "artifact_type":"SOURCE_DOCUMENT_CONTENT_AUDIT",
            "source_uid":source_uid,
            "source_sha256":source_sha,
            "governed_unit_uid":governed_unit_uid,
            "audit_standard_uid":old_audit.get("audit_standard_uid"),
            "required_design_domain_uids":old_audit.get("required_design_domain_uids") or [],
            "observed_design_domain_uids":old_audit.get("observed_design_domain_uids") or [],
            "missing_required_design_domain_uids":old_audit.get("missing_required_design_domain_uids") or [],
            "matrix_integrity":old_audit.get("matrix_integrity") or {},
            "visual_source_integrity":old_audit.get("visual_source_integrity") or {},
            "render_integrity":old_audit.get("render_integrity") or {},
            "open_downstream_states":old_audit.get("open_downstream_states") or {},
            "unresolved_required_gap_count":0,
            "contradiction_count":0,
            "result":"PASS",
          }
          audit["evidence_content_hash"]=g._hash_without(audit,"evidence_content_hash")
          (proj_dir/"SOURCE_DOCUMENT_CONTENT_AUDIT.yaml").write_text(yaml.safe_dump(audit,sort_keys=False,allow_unicode=True),encoding="utf-8")

          lock={
            "schema_version":1,
            "artifact_uid":f"LOCK-{source_uid}-REENTRY-001",
            "artifact_type":"RAW_SOURCE_IMMUTABILITY_RECEIPT",
            "source_uid":source_uid,
            "source_path":filename,
            "source_git_blob_sha":source_blob,
            "source_sha256":source_sha,
            "content_readiness_audit_uid":audit["artifact_uid"],
            "lock_state":lc["terminal_lock_state"],
            "writable":False,
            "mutation_policy":"NEW_SOURCE_REVISION_NEW_PROJECTION_NEW_RECONCILIATION",
          }
          lock["content_hash"]=g._hash_without(lock,"content_hash")
          (proj_dir/"RAW_SOURCE_IMMUTABILITY_RECEIPT.yaml").write_text(yaml.safe_dump(lock,sort_keys=False,allow_unicode=True),encoding="utf-8")

          inv=g.derive_docx_inventory(raw)
          with zipfile.ZipFile(raw,"r") as z:
              for row in g._binary_parts_from_inventory(inv):
                  dst=g._binary_ref(wu,bc,source_uid,row)
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(z.read(row["package_part_path"]))

          den=[
            {"denominator_uid":"DEN-PACKAGE-PART","denominator_type":"PACKAGE_PART","required_count":len(inv["package_parts"]),"projected_count":len(inv["package_parts"])},
            {"denominator_uid":"DEN-RELATIONSHIP","denominator_type":"RELATIONSHIP","required_count":len(inv["relationships"]),"projected_count":len(inv["relationships"])},
            {"denominator_uid":"DEN-XML-NODE","denominator_type":"XML_NODE","required_count":len(inv["source_nodes"]),"projected_count":len(inv["source_nodes"])},
          ]
          projection={
            "schema_version":1,
            "artifact_uid":f"PROJ-{source_uid}-REENTRY-001",
            "artifact_type":"CANONICAL_SOURCE_PROJECTION",
            "projection_schema_uid":pc["schema_uid"],
            "projection_schema_revision":pc["schema_revision"],
            "projection_role":pc["role"],
            "normative_authority":False,
            "source_identity":{
              "source_uid":source_uid,
              "source_path":filename,
              "source_format":"DOCX",
              "source_git_blob_sha":source_blob,
              "source_sha256":source_sha,
              "raw_source_lock_receipt_uid":lock["artifact_uid"],
            },
            "extraction_identity":{
              "extractor_uid":"CURRENT-GOVERNANCE-DOCX-INVENTORY",
              "extractor_version":"1",
              "extraction_run_uid":"WB01-STAGE01-REENTRY-001",
              "extraction_evidence_ref":"SOURCE_PROJECTION_RECONCILIATION_EVIDENCE.yaml",
            },
            "serialization_contract":{
              "yaml_profile":"YAML_1_2_SAFE_SUBSET",
              "encoding":"UTF-8",
              "line_ending":"LF",
              "key_order_contract_uid":pc["schema_uid"],
              "anchors_aliases":"FORBIDDEN",
              "implicit_custom_tags":"FORBIDDEN",
            },
            "denominator_rows":den,
            "package_parts":inv["package_parts"],
            "relationships":inv["relationships"],
            "source_nodes":inv["source_nodes"],
            "projection_content_hash":None,
            "status":"PROJECTION_COMPLETE",
          }
          projection["projection_content_hash"]=g._hash_without(projection,"projection_content_hash")
          (proj_dir/"CANONICAL_SOURCE_PROJECTION.yaml").write_text(yaml.safe_dump(projection,sort_keys=False,allow_unicode=True),encoding="utf-8")

          zero={k:0 for k in rc["zero_loss_count_field_order"]}
          evidence={
            "schema_version":1,
            "artifact_uid":f"RECON-{source_uid}-REENTRY-001",
            "artifact_type":"SOURCE_PROJECTION_RECONCILIATION_EVIDENCE",
            "validator_uid":rc["validator_uid"],
            "source_uid":source_uid,
            "raw_source_sha256":source_sha,
            "projection_uid":projection["artifact_uid"],
            "projection_content_hash":projection["projection_content_hash"],
            "projection_schema_uid":pc["schema_uid"],
            "projection_schema_revision":pc["schema_revision"],
            "source_inventory_hashes":{
              "package_parts_hash":inv["package_parts_hash"],
              "relationships_hash":inv["relationships_hash"],
              "source_nodes_hash":inv["source_nodes_hash"],
            },
            "zero_loss_counts":zero,
            "reverse_trace":"COMPLETE",
            "unsupported_count":0,
            "result":"PASS",
          }
          evidence["evidence_content_hash"]=g._hash_without(evidence,"evidence_content_hash")
          (proj_dir/"SOURCE_PROJECTION_RECONCILIATION_EVIDENCE.yaml").write_text(yaml.safe_dump(evidence,sort_keys=False,allow_unicode=True),encoding="utf-8")

          denom_hash=g.stable_hash_obj(den)
          pair_hash=g.sha256_bytes((source_sha+"\n"+projection["projection_content_hash"]+"\n"+evidence["evidence_content_hash"]+"\n"+pc["schema_uid"]+"\n"+str(pc["schema_revision"])+"\n"+denom_hash+"\n").encode())
          freeze={
            "schema_version":1,
            "artifact_uid":f"FREEZE-{source_uid}-REENTRY-001",
            "artifact_type":"SOURCE_PROJECTION_FREEZE_RECEIPT",
            "source_uid":source_uid,
            "raw_source_sha256":source_sha,
            "raw_source_git_blob_sha":source_blob,
            "projection_uid":projection["artifact_uid"],
            "projection_content_hash":projection["projection_content_hash"],
            "projection_schema_uid":pc["schema_uid"],
            "projection_schema_revision":pc["schema_revision"],
            "reconciliation_evidence_uid":evidence["artifact_uid"],
            "reconciliation_evidence_hash":evidence["evidence_content_hash"],
            "source_denominator_hash":denom_hash,
            "pair_hash":pair_hash,
            "lock_state":fc["lock_state"],
            "raw_source_writable":False,
            "projection_writable":False,
            "mutation_disposition":fc["mutation_disposition"],
            "next_step":fc["next_step"],
            "status":fc["status"],
          }
          (proj_dir/"SOURCE_PROJECTION_FREEZE_RECEIPT.yaml").write_text(yaml.safe_dump(freeze,sort_keys=False,allow_unicode=True),encoding="utf-8")

          result=g.validate_pre_stage_source_projection(pkg,wu,rawcap,capstate)
          if result["failures"]:
              raise SystemExit("BLOCK:PROJECTION_REENTRY_VALIDATION:"+repr(result["failures"]))
          out={
            "artifact_type":"SOURCE_PROJECTION_REENTRY_RESULT",
            "work_unit_uid":"WU-STAGE01-WB01-DASHBOARD-REENTRY-001",
            "governed_unit_uid":governed_unit_uid,
            "source_uid":source_uid,
            "raw_source_sha256":source_sha,
            "projection_uid":projection["artifact_uid"],
            "projection_content_hash":projection["projection_content_hash"],
            "pair_hash":pair_hash,
            "package_part_count":len(inv["package_parts"]),
            "relationship_count":len(inv["relationships"]),
            "source_node_count":len(inv["source_nodes"]),
            "validator_uid":"VAL-GOV-026",
            "result":"PASS",
          }
          (wu/"SOURCE_PROJECTION_REENTRY_RESULT.yaml").write_text(yaml.safe_dump(out,sort_keys=False,allow_unicode=True),encoding="utf-8")
          print(yaml.safe_dump(out,sort_keys=False))
          PY
          python /tmp/rebuild_wb01_projection.py
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-REENTRY-001
          git commit -m "fix(stage01): rebuild WB01 current source projection pair"
          git push origin HEAD:0921acpos
