    style: List Bullet
    text: Cost cap may block or alter eligible route set only through approved policy; it MUST NOT reduce required capability, output quality, rights or Task Contract.
  - index: 113
    style: List Bullet
    text: Estimate and actual cost MUST be distinguished. Missing actual ≠ zero.
  - index: 114
    style: List Bullet
