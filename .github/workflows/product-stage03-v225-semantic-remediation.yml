    - name: Validate exact semantic matrix and physical evidence
      run: |
        set -euo pipefail
        python - <<'PY'
        from pathlib import Path
        import yaml, re, xml.etree.ElementTree as ET
        _cache={}
        def y(p):
          key=str(Path(p))
          if key not in _cache:
            _cache[key]=yaml.safe_load(Path(p).read_text()) or {}
          return _cache[key]
        def get(o,path):
          cur=o
          for k in path:
            cur=cur[k] if isinstance(k,int) else cur[k]
          return cur
        for wu in ['WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-001','WU-STAGE03-WB01-DASHBOARD-001']:
          b=Path('STAGE_EXECUTION/STAGE-03')/wu
          mx=y(b/'NORMATIVE_EXECUTION_MATRIX.yaml')
          assert mx['coverage']['required_normative_section_total']==29
          assert mx['coverage']['represented_normative_section_total']==29
          assert mx['coverage']['arbitrary_normative_section_fallback_count']==0
          assert not any(str(r.get('requirement_uid','')).startswith('NORMATIVE_SECTION_COVERAGE:') for r in mx['rows'])
          for r in mx['rows']:
            assert all(k in r for k in ['normative_section_uid','required_artifact_type','artifact_ref','row_identity','field_path','validator_uid','closure_gate'])
            obj=y(r['artifact_ref'])
            val=get(obj,r['field_path'])
            if r['applicability']=='REQUIRED':
              assert val is not None and val!='' and val!=[], (wu,r)
          rf=y(b/'REQUIRED_FIELD_MANIFEST.yaml')
          assert rf['manifest_semantics']=='EXACT_ROW_AND_REQUIRED_FIELD_CONTRACT'
          assert len(rf['row_contracts'])>=6
          vr=y(b/'VISUAL_REFERENCE_ANNOTATION.yaml')
          assert vr['scenario_annotation_coverage_complete'] is True
          assert len(vr['annotations'])==int(vr['required_scenario_count'])
          for row in vr['annotations']:
            for f in vr['required_row_fields']:
              assert f in row and row[f] not in (None,'',[])
          ss=y(b/'VISUAL_SCENARIO_EVIDENCE_SET.yaml')
          assert ss['scenario_to_function_coverage_complete'] is True
          for row in ss['scenarios']:
            for f in ss['required_scenario_row_fields']:
              assert f in row and row[f] not in (None,'',[]) 
            assert (b/row['evidence_ref']).is_file()
          hh=y(b/'EVIDENCE/CROSS_STAGE_HANDOFF_READINESS_LEDGER.yaml')
          assert hh['required_edge_total']==3 and hh['consumer_ready_total']==3
          for row in hh['required_edges']:
            for f in hh['required_edge_fields']:
              assert f in row
          # physical evidence existence for every Mother-79 scenario annotation
          vra=y(b/'VISUAL_REFERENCE_ANNOTATION.yaml')
          for ar in vra.get('annotations',[]):
            ev=str(ar.get('evidence_ref') or '')
            assert ev, (wu,'ANNOTATION_EVIDENCE_REF_MISSING',ar.get('scenario_uid'))
            pp=Path(ev) if ev.startswith('STAGE_EXECUTION/') else b/ev
            assert pp.is_file(), (wu,ev)
        print('PASS: Stage03 semantic/physical row-field audit Home+WB01')
        PY
        for WU in WU-STAGE03-GLOBAL-HOME-SHELL-NAVIGATION-001 WU-STAGE03-WB01-DASHBOARD-001; do
          export ACPOS_PRODUCT_ROOT="$GITHUB_WORKSPACE"
          export ACPOS_ACTIVE_WORK_UNIT="STAGE_EXECUTION/STAGE-03/$WU/WORK_UNIT.yaml"
          export ACPOS_CURRENT_SCOPE="STAGE_EXECUTION/STAGE-03/$WU/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"
          python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-03
        done
