name: ACPOS Gate25 ERP Finance Action Gate Blocker Materialize Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-erp-finance-action-gate-blocker-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize-erp-finance-action-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify existing Production gate evidence and materialize exact ACTION blockers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          source_evidence_path=Path('docs/construction/evidence/GATE25_ERP_FINANCE_PRODUCTION_GATE_BLOCKERS_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_ERP_FINANCE_ACTION_PRODUCTION_GATE_BLOCKERS_2026-09-10.json')
          authority_path=Path('authority/pages/admin/ERP-01/ACPOS_ERP-01_ERP_FINANCE_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml')
          binding_path=Path('src/domain/erp/erpControlBindings.ts')
          assert source_evidence_path.exists() and authority_path.exists() and binding_path.exists()
          source=json.loads(source_evidence_path.read_text())
          assert source['status']=='BLOCKED'
          assert source['production_release_sha']=='608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36'
          assert source['page_gate'] is True and source['finance_gate'] is False and source['mutation_count']==0

          expected={
            'action:admin:ERP-02:erp.finance.get_factpack':('ERP-01-BTN-FACTPACK','ERP-01-ACT-FACTPACK','getERPFinanceFactPack'),
            'action:admin:ERP-02:erp.capacity.get_guardrails':('ERP-01-BTN-GUARDRAILS','ERP-01-ACT-GUARDRAILS','getERPCapacityGuardrails'),
            'action:admin:ERP-02:erp.forecast.get':('ERP-01-BTN-FORECAST','ERP-01-ACT-FORECAST','getERPForecast'),
          }
          source_controls={c['control_id']:c for c in source['controls']}
          authority=authority_path.read_text()
          bindings=binding_path.read_text()
          for _,(control_id,action_uid,operation_id) in expected.items():
            c=source_controls[control_id]
            assert c['enabled'] is False and c['disabled_reason']=='ERP-01-GATE-FINANCE'
            assert c['action_uid']==action_uid and c['permission_uid']=='ERP-01-PERM-FINANCE'
            assert operation_id in authority
            assert control_id in bindings and action_uid in bindings

          ledger=json.loads(ledger_path.read_text())
          assert ledger['denominator']['total']==1481
          before=dict(ledger['counts'])
          entries={e['resource_key']:e for e in ledger['entries']}
          for key in expected:
            assert key in entries, f'missing ledger action: {key}'
            assert entries[key]['disposition']=='NOT_EXECUTED', f'{key} expected NOT_EXECUTED, got {entries[key]["disposition"]}'

          evidence={
            'document_id':'ACPOS_GATE25_ERP_FINANCE_ACTION_PRODUCTION_GATE_BLOCKERS',
            'status':'BLOCKED',
            'recorded_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':source['production_release_sha'],
            'source_control_gate_evidence':str(source_evidence_path),
            'source_production_run_id':source['github_run_id'],
            'prior_diagnostic_run_id':source['prior_diagnostic_run_id'],
            'resource_count':3,
            'mutation_count':0,
            'blocking_gate_uid':'ERP-01-GATE-FINANCE',
            'blocking_permission_uid':'ERP-01-PERM-FINANCE',
            'actions':[{'resource_key':key,'current_control_id':v[0],'current_action_uid':v[1],'operation_id':v[2]} for key,v in expected.items()],
            'rule':'These exact formal ERP finance ACTION resources are BLOCKED because their authoritative Current controls/actions are the same operations proven disabled in authenticated Production by ERP-01-GATE-FINANCE=false. No operation was invoked or force-executed.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          for key,(control_id,action_uid,operation_id) in expected.items():
            e=entries[key]
            e['disposition']='BLOCKED'
            e['reason_code']='PRODUCTION_ERP_FINANCE_GATE_FALSE'
            e['evidence_refs']=[str(evidence_path),str(source_evidence_path),'GitHub Actions: ACPOS Gate25 ERP Finance Gate Diagnostic run_id=34486930610',str(authority_path),str(binding_path)]
            e['blocker_detail']='The formal finance read action maps to a Current ERP action whose authenticated Production control is disabled by ERP-01-GATE-FINANCE=false / ERP-01-PERM-FINANCE; executing around the gate is forbidden.'
            e['operation_ids']=[operation_id,action_uid,'ERP-01-GATE-FINANCE','ERP-01-PERM-FINANCE']

          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for e in ledger['entries']: counts[e['disposition']]+=1
          assert sum(counts.values())==1481
          assert counts['PASS']==before['PASS']
          assert counts['BLOCKED']==before['BLOCKED']+3
          assert counts['NOT_EXECUTED']==before['NOT_EXECUTED']-3
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':3},ensure_ascii=False))
          PY
      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit ACTION blocker evidence and ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_ERP_FINANCE_ACTION_PRODUCTION_GATE_BLOCKERS_2026-09-10.json
          git commit -m 'evidence(gate25): block 3 ERP Finance formal actions on Production gate'
          git push origin HEAD:new
