- Concept: Truth / Context
  Canonical Owner: ACPOS-AI-01
  CORE consumes/produces: exact Context / evidence refs
  Forbidden: CORE 自建 Context truth
- Concept: Conversation
  Canonical Owner: ACPOS-AI-02
  CORE consumes/produces: threads/messages/branch decisions
  Forbidden: CORE 自建 message history
- Concept: Provider execution
  Canonical Owner: ACPOS-AI-03
  CORE consumes/produces: provider-neutral canonical script / structured instruction source
  Forbidden: CORE 選 Provider/Model 或保存 Provider prompt
- Concept: Project Canon
  Canonical Owner: ACPOS-AI-04
  CORE consumes/produces: Story/Chapter/World/Base DNA/Project Structure Version
  Forbidden: downstream silent overwrite
- Concept: Topic Production Contract
  Canonical Owner: ACPOS-AI-04
