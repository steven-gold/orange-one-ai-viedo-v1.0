name: ACPOS Batch68 QA-approved Word writeback
on:
  push:
    branches:
      - 0921acpos
    paths:
      - .github/workflows/acpos_batch68_word_writeback.yml
permissions:
  contents: write
jobs:
  writeback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rebuild QA-approved Word XML exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, html, os, re, subprocess, tempfile, zipfile

          EXPECTED_PARENT = "e906883b42b784315078900f0c68bc91545d672c"
          WORKFLOW = Path(".github/workflows/acpos_batch68_word_writeback.yml")
          parent = subprocess.check_output(["git","rev-parse","HEAD^"], text=True).strip()
          if parent != EXPECTED_PARENT:
              raise SystemExit(f"PRE_WRITE_IDENTITY_RECHECK_FAIL parent={parent} expected={EXPECTED_PARENT}")

          docs = sorted(Path(".").glob("*.docx"))
          if len(docs) != 31:
              raise SystemExit(f"DOCX_BOUNDARY_PREWRITE_FAIL count={len(docs)}")

          baseline = {
            "02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"2261b32fd78594cb8324341030d644fecfd817235703179ac81ace5231c3a3ce",
            "03_ACPOS_AI_Execution_Script_Compiler_Tool_AIAPI_Runtime_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"3b2eadd3eafc18df0055fc4301c8b100341d9b8b571dd920017943b249231ecc",
            "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"af795b3dbce19fa0b4cfb1c5d19183812141c91b5e2a71b29d125497a5d059a3",
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"441435c5e35aaf0e2fad69f1e13231c2c3d463724b51d4188e675a081a8c8759",
            "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"c9438b0ab599be23f699e1a05a6ace3bbe0ebc40a5f1b7444925c7187fa695d5",
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"2d29f078ee91aed4ff48ad0bab424f1312366a36801af91c873ddea203642daa",
            "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx":"213e76e1642dae75936d66c825bfa97b8dba3e3cbfe6dd89e44a355e5037cec5",
            "ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx":"748d899b024f1c725a458c6008d74beded63f6cb78f893e15160cf5d08825536",
            "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx":"e5e94c4a73b22337ccbab1ae419eedb64af542ff7cdc9009f18a494520557338",
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx":"47df738a55ff10add34c03a69deb094ba87efa8b634f566894f1952f3b70502f",
          }
          target = {
            "02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"8183697cd706f6729fa7e4709c1cd6463c18c5641c0fbfc3cfbc21403b4ebc25",
            "03_ACPOS_AI_Execution_Script_Compiler_Tool_AIAPI_Runtime_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"3ea8951ec21473c5a488d934a5681fee92860e3f136b9dd4a7e560c0019d3333",
            "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"62ad1a911361fbb5c60239308c8d8c5001f0e9999441a8f3c28498adf3e66b8a",
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"984263036a3ddb980d5e095bdec379a81477b93a395ed04fd84405d17ff720d7",
            "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"c1d5a97795bfa6e0cf55fb1b8a88e39294417d91e990713f72c4c66572a6bfd6",
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":"31a3495e505bf5e841a5430b754040bf0f8c2a3058666dafb8494db7811a42b9",
            "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx":"23f118c02d012872099b79ce1af423faf0f0f573c0760256678ec22a8c9ec13d",
            "ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx":"0d50f5add08f32b128464c7e974af33af64804b1ac4e7258d96535455f1894f7",
            "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx":"5b85b4fa66404157617762d712a64f8c31d24b444073fa8de5b3f11ef1135bf1",
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx":"c8155825d14433614b77ff5877d4ee5cc481d0bea547d9c1f5b46e5a57b47908",
          }
          changes = {
            "02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":{2017:"POST /v1/conversations/{CONVERSATION_ID}/messages",2051:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",2069:"POST /v1/conversations/{CONVERSATION_ID}/messages",2077:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE",2173:"—",2191:"POST /v1/conversations/{CONVERSATION_ID}/messages",2204:"POST /v1/conversations/{CONVERSATION_ID}/generation/stop",2243:"POST /v1/conversations/{CONVERSATION_ID}/messages",2264:"—",2363:"STR-01 / shared registered service",2389:"STR-01 / shared registered service",2674:"attachConversationContext"},
            "03_ACPOS_AI_Execution_Script_Compiler_Tool_AIAPI_Runtime_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":{2150:"quality.criteria.configure",2163:"governance.approve"},
            "04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":{2112:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",2164:"CORE-01-ACT-CANDIDATE-EVALUATE",2177:"CORE-01-ACT-HUMAN-DECISION-RECORD",2268:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE",2730:"CORE-01-ACT-CANDIDATE-EVALUATE",2741:"CORE-01-ACT-HUMAN-DECISION-RECORD"},
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":{7168:"ACT-NAV-OPEN",7174:"Projection / source page read owner",7181:"ACT-NAV-OPEN",7187:"Projection / source page read owner",7194:"ACT-NAV-OPEN",7200:"Projection / source page read owner",7207:"ACT-NAV-OPEN",7213:"Projection / source page read owner",7220:"ACT-NAV-OPEN",7226:"Projection / source page read owner",7233:"ACT-NAV-OPEN",7239:"Projection / source page read owner",7246:"ACT-NAV-OPEN",7252:"Projection / source page read owner",7259:"ACT-NAV-OPEN",7265:"Projection / source page read owner",7304:"Projection / source page read owner"},
            "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":{1748:"—",2463:"—",2536:"Projection / source page read owner",2575:"Projection / source page read owner",2614:"Projection / source page read owner",2640:"Projection / source page read owner",2692:"Projection / source page read owner",2744:"Projection / source page read owner"},
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":{1953:"attachConversationContext",2043:"AIAPI Page Operation-specific Form / Provider Profile Field Contract",2152:"Projection / source page read owner",3198:"REFERENCE_ONLY",3250:"REFERENCE_ONLY",3402:"REFERENCE_ONLY",3415:"REFERENCE_ONLY",3428:"REFERENCE_ONLY",3441:"REFERENCE_ONLY",3454:"REFERENCE_ONLY",3467:"REFERENCE_ONLY",3480:"REFERENCE_ONLY",3493:"REFERENCE_ONLY",3532:"REFERENCE_ONLY"},
            "ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx":{445:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",452:"CORE-01-ACT-CANDIDATE-EVALUATE",459:"CORE-01-ACT-HUMAN-DECISION-RECORD",466:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE",1719:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",1771:"CORE-01-ACT-CANDIDATE-EVALUATE",1784:"CORE-01-ACT-HUMAN-DECISION-RECORD",1875:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE"},
            "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx":{1486:"attachConversationContext"},
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx":{2361:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",2376:"CORE-01-ACT-CANDIDATE-EVALUATE",2391:"CORE-01-ACT-HUMAN-DECISION-RECORD",2436:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE",5976:"—",6636:"—",6654:"attachConversationContext",8842:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",8853:"CORE-01-ACT-CANDIDATE-EVALUATE",8864:"CORE-01-ACT-HUMAN-DECISION-RECORD",8886:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE",10833:"—",10844:"—",10857:"attachConversationContext",14491:"CORE-01-ACT-ASSISTANT-SUMMARY-CREATE",14509:"CORE-01-ACT-ASSISTANT-STRUCTURED-DECISION-CREATE",14788:"—",14797:"—",14808:"attachConversationContext",16421:"A repeated Action UID may be shared only when Current Canonical Authority proves one semantic action identity. STR-01-ACT-NOOP is a passive UI marker and MUST NOT be used as the Action identity of operation-bearing READ_EXACT controls; STR-01-BTN-ATTACH and STR-01-VIEW-CONVERSATION bind Action=—. CORE effectful operations createAssistantSummary, evaluateCoreCandidate, recordCoreHumanDecision and createAssistantStructuredDecision use distinct Action UIDs.",16422:"Block when one effectful Action UID fans out to materially different mutation operations, or when a passive NOOP marker is counted as an Operation Action identity.",16594:"attachConversationContext"},
          }

          ROWS09 = base64.b64decode("")
          LOGIC = base64.b64decode("")

          tpat = re.compile(rb'(<w:t(?:\s+[^>]*)?>)(.*?)(</w:t>)', re.S)
          def replace_t(xml, repl):
              ms = list(tpat.finditer(xml))
              out, pos = [], 0
              for idx, m in enumerate(ms):
                  if idx not in repl:
                      continue
                  out.append(xml[pos:m.start(2)])
                  out.append(html.escape(repl[idx], quote=False).encode("utf-8"))
                  pos = m.end(2)
              out.append(xml[pos:])
              return b"".join(out)

          def table_span(xml, marker):
              x = xml.find(marker)
              if x < 0:
                  raise RuntimeError("marker missing")
              starts = [m.start() for m in re.finditer(rb'<w:tbl>', xml)]
              ends = [m.end() for m in re.finditer(rb'</w:tbl>', xml)]
              for s,e in zip(starts,ends):
                  if s < x < e:
                      return s,e
              raise RuntimeError("table span missing")

          def cell_span(xml, match):
              s = xml.rfind(b'<w:tc>', 0, match.start())
              e = xml.find(b'</w:tc>', match.end()) + len(b'</w:tc>')
              if s < 0 or e < len(b'</w:tc>'):
                  raise RuntimeError("cell span missing")
              return s,e

          def patch_str(xml):
              ms = list(tpat.finditer(xml))
              edits = []
              for idx in (520,526,1153,1868):
                  if ms[idx].group(2) != b"STR-01-ACT-NOOP":
                      raise RuntimeError(f"STR source text mismatch at {idx}")
                  s,e = cell_span(xml, ms[idx])
                  cell = xml[s:e]
                  if idx in (520,526):
                      cell2 = cell.replace(b'<w:r/>', b'<w:r><w:t>\xe2\x80\x94</w:t></w:r>', 1)
                      cell2 = cell2.replace(b'<w:t>STR-01-ACT-NOOP</w:t>', b'', 1)
                  else:
                      cell2 = cell.replace(b'<w:t>STR-01-ACT-NOOP</w:t>', b'<w:t>\xe2\x80\x94</w:t>', 1)
                  edits.append((s,e,cell2))
              out = xml
              for s,e,cell2 in sorted(edits, reverse=True):
                  out = out[:s] + cell2 + out[e:]
              return out

          for name in target:
              p = Path(name)
              with zipfile.ZipFile(p, "r") as zin:
                  xml = zin.read("word/document.xml")
              got = hashlib.sha256(xml).hexdigest()
              if got != baseline[name]:
                  raise SystemExit(f"BASELINE_XML_HASH_FAIL {name} got={got} expected={baseline[name]}")

              if name.startswith("ACPOS_STR-01_"):
                  patched = patch_str(xml)
              else:
                  patched = replace_t(xml, changes.get(name, {}))
                  if name.startswith("09_"):
                      s,e = table_span(patched, b"Reference UID</w:t>")
                      close = patched.rfind(b"</w:tbl>", s, e)
                      patched = patched[:close] + ROWS09 + patched[close:]
                  if name.startswith("ACPOS_SYSTEM_LOGIC_"):
                      sec = patched.rfind(b"<w:sectPr")
                      if sec < 0:
                          raise SystemExit("SYSTEM_LOGIC_SECTPR_NOT_FOUND")
                      patched = patched[:sec] + LOGIC + patched[sec:]

              got2 = hashlib.sha256(patched).hexdigest()
              if got2 != target[name]:
                  raise SystemExit(f"TARGET_XML_HASH_FAIL {name} got={got2} expected={target[name]}")

              tmp = p.with_suffix(".docx.tmp")
              with zipfile.ZipFile(p, "r") as zin, zipfile.ZipFile(tmp, "w") as zout:
                  for info in zin.infolist():
                      data = patched if info.filename == "word/document.xml" else zin.read(info.filename)
                      zout.writestr(info, data)
              with zipfile.ZipFile(tmp, "r") as zchk:
                  bad = zchk.testzip()
                  if bad is not None:
                      raise SystemExit(f"DOCX_ZIP_INTEGRITY_FAIL {name} member={bad}")
                  if hashlib.sha256(zchk.read("word/document.xml")).hexdigest() != target[name]:
                      raise SystemExit(f"POST_WRITE_XML_HASH_FAIL {name}")
              os.replace(tmp, p)

          # Remove harness BEFORE the commit: final tree under test has only the 10 Word changes.
          WORKFLOW.unlink()

          changed = subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT], text=True).splitlines()
          expected_changed = sorted(list(target.keys()) + [str(WORKFLOW)])
          if sorted(changed) != expected_changed:
              raise SystemExit(f"WRITESET_FAIL changed={changed}")
          if len(list(Path(".").glob("*.docx"))) != 31:
              raise SystemExit("DOCX_BOUNDARY_POSTWRITE_FAIL")

          print("BATCH68_WRITEBACK_PRECOMMIT_PASS")
          print("MODIFIED_DOCX=10")
          print("ROOT_DOCX=31")
          for name in sorted(target):
              print(f"TARGET_XML_SHA256 {target[name]} {name}")
          PY

      - name: Commit exact tested tree and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-batch68-writeback"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 11 ]; then
            printf '%s\n' "${staged[@]}"
            echo "Expected 10 Word changes + harness deletion in staged set"
            exit 1
          fi
          git commit -m "fix(acpos): close bidirectional document contract defects"
          git push origin HEAD:0921acpos
