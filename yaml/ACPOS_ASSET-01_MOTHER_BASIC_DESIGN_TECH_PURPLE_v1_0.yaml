  - index: 1
    style: Title
    text: '素材生產工作區

      Mother Basic Design｜科技紫重製版'
  - index: 2
    style: Normal
    text: 從 exact Blueprint / Canonical Script / DNA / Asset Manifest 到 Reuse First、Generate Missing、Layer/Patch、Evaluate/Decision、Exact Handoff 的可施工 Basic Design。
  - index: 5
    style: Normal
    text: 本文件不是「圖庫示意」：視覺稿內只使用 Current Authority 正式 Section / Control / Gate / State 與 exact-ref placeholder；沒有假專案、假素材數量、假 Provider、假版本、假評分。
