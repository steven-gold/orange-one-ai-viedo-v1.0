name: ACPOS Batch 98 Word Physical Text Integrity Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch98_word_physical_text_integrity_audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
      - name: Audit OOXML text encoding pollution revisions and renderability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,re,json,collections,subprocess,unicodedata,os
          EXPECTED_PARENT="0e19a84aee974d41eb950349ea5d4c3e750dc9f3"
          p=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if p!=EXPECTED_PARENT: raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {p}")
          docs=sorted(Path(".").glob("*.docx"))
          if len(docs)!=31: raise SystemExit(f"DOCX_COUNT_FAIL {len(docs)}")
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          bad_sequences=[
            "ï¿½","Ã","Â","â€™","â€œ","â€","æ–‡","ä¸­æ–‡","�","\x00",
            "LOREM IPSUM","FIXME","TODO:","TBD:","PLACEHOLDER_TEXT"
          ]
          pollution_patterns=[
            r"\bR9(?:\.\d+)?\b",r"\bR5\b",r"\bOLD VERSION\b",r"\bDEPRECATED\b",
            r"\bTEMP(?:ORARY)?\b",r"\bTODO\b",r"\bTBD\b",r"\bFIXME\b",r"\bLOREM\b",
            r"待補(?:齊)?",r"待定",r"未定義",r"PLACEHOLDER"
          ]
          invalid_controls=set(chr(i) for i in list(range(0,9))+[11,12]+list(range(14,32)))
          reports=[]
          hard=[]
          pollution=[]
          revision=[]
          duplicates=[]
          total_chars=0
          for doc in docs:
            rec={"file":doc.name,"zip_ok":False,"xml_parts":0,"chars":0,"paragraphs":0,"tables":0}
            try:
              with zipfile.ZipFile(doc) as z:
                bad=z.testzip()
                if bad: hard.append({"file":doc.name,"type":"ZIP_CRC_FAIL","value":bad})
                else: rec["zip_ok"]=True
                names=z.namelist()
                xmls=[n for n in names if n.endswith(".xml")]
                text_parts=[]
                for name in xmls:
                  try:
                    raw=z.read(name)
                    root=ET.fromstring(raw)
                    rec["xml_parts"]+=1
                    if name=="word/document.xml":
                      rec["paragraphs"]=sum(1 for _ in root.iter(W+"p"))
                      rec["tables"]=sum(1 for _ in root.iter(W+"tbl"))
                    for t in root.iter(W+"t"):
                      if t.text:text_parts.append(t.text)
                    if any(x.tag==W+"ins" for x in root.iter()):
                      revision.append({"file":doc.name,"type":"TRACKED_INSERTION","part":name})
                    if any(x.tag==W+"del" for x in root.iter()):
                      revision.append({"file":doc.name,"type":"TRACKED_DELETION","part":name})
                  except ET.ParseError as e:
                    hard.append({"file":doc.name,"type":"XML_PARSE_FAIL","part":name,"error":str(e)})
                if "word/comments.xml" in names:
                  revision.append({"file":doc.name,"type":"COMMENTS_PART_PRESENT"})
                text="\n".join(text_parts)
                rec["chars"]=len(text); total_chars+=len(text)
                for ch in text:
                  if ch in invalid_controls:
                    hard.append({"file":doc.name,"type":"ILLEGAL_CONTROL_CHAR","code":ord(ch)})
                  if unicodedata.category(ch)=="Cs":
                    hard.append({"file":doc.name,"type":"SURROGATE_CHAR","code":ord(ch)})
                for seq in bad_sequences:
                  if seq and seq in text:
                    hard.append({"file":doc.name,"type":"MOJIBAKE_OR_PLACEHOLDER_SEQUENCE","value":seq})
                for pat in pollution_patterns:
                  for m in re.finditer(pat,text,re.I):
                    s=max(0,m.start()-90);e=min(len(text),m.end()+150)
                    pollution.append({"file":doc.name,"pattern":pat,"match":m.group(0),"context":re.sub(r"\s+"," ",text[s:e])})
                # exact long paragraph duplicate within same document; diagnostics only
                root=ET.fromstring(z.read("word/document.xml"))
                pars=[]
                for p in root.iter(W+"p"):
                  s="".join((t.text or "") for t in p.iter(W+"t"))
                  s=re.sub(r"\s+"," ",s).strip()
                  if len(s)>=120:pars.append(s)
                c=collections.Counter(pars)
                for s,n in c.items():
                  if n>1:
                    duplicates.append({"file":doc.name,"count":n,"text":s[:300]})
            except Exception as e:
              hard.append({"file":doc.name,"type":"DOCX_OPEN_FAIL","error":repr(e)})
            reports.append(rec)
          out={
            "marker":"ACPOS-20260922-BATCH-98-WORD-PHYSICAL-TEXT-INTEGRITY-AUDIT-V1",
            "base_head":EXPECTED_PARENT,
            "docx_count":len(docs),
            "total_chars":total_chars,
            "hard_text_integrity_findings":hard,
            "pollution_candidates":pollution,
            "revision_comment_residuals":revision,
            "long_exact_duplicate_paragraphs":duplicates,
            "documents":reports
          }
          Path("__batch98_text_integrity.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH98_TEXT_SUMMARY="+json.dumps({
            "docx":len(docs),"hard":len(hard),"pollution":len(pollution),
            "revision_comment_residuals":len(revision),"long_duplicate_paragraphs":len(duplicates)
          },ensure_ascii=False,sort_keys=True))
          PY
          mkdir -p __render98/pdf
          while IFS= read -r -d '' f; do
            libreoffice --headless --convert-to pdf --outdir __render98/pdf "$f" >/tmp/lo98.log 2>&1 || { echo "RENDER_FAIL $f"; cat /tmp/lo98.log; exit 1; }
          done < <(find . -maxdepth 1 -name '*.docx' -print0 | sort -z)
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,re
          pdfs=sorted(Path("__render98/pdf").glob("*.pdf"))
          if len(pdfs)!=31:raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          bad=[];pages=0
          for pdf in pdfs:
            info=subprocess.check_output(["pdfinfo",str(pdf)],text=True,errors="replace")
            m=re.search(r"^Pages:\s+(\d+)",info,re.M)
            if not m:bad.append({"pdf":pdf.name,"type":"PDFINFO_PAGECOUNT_MISSING"});continue
            pc=int(m.group(1));pages+=pc
            if pc<=0:bad.append({"pdf":pdf.name,"type":"ZERO_PAGES"})
            txt=subprocess.check_output(["pdftotext",str(pdf),"-"],text=True,errors="replace")
            if "\ufffd" in txt:bad.append({"pdf":pdf.name,"type":"PDF_TEXT_REPLACEMENT_CHAR"})
          data=json.loads(Path("__batch98_text_integrity.json").read_text(encoding="utf-8"))
          data["render_summary"]={"pdf_count":len(pdfs),"page_count":pages,"render_findings":bad}
          Path("__batch98_text_integrity.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH98_RENDER_SUMMARY="+json.dumps({"pdf_count":len(pdfs),"page_count":pages,"findings":len(bad)},sort_keys=True))
          print("BATCH98_AUDIT_EXECUTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch98-word-physical-text-integrity-audit
          path: __batch98_text_integrity.json
          retention-days: 3
      - name: Close audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __render98 __batch98_text_integrity.json
          git config user.name "acpos-batch98-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch98_word_physical_text_integrity_audit.yml
          git commit -m "chore(acpos): close batch 98 Word text integrity audit"
          git push origin HEAD:0921acpos
