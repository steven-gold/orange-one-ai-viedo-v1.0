name: ACPOS Batch 117 Persistence Owner Source Resolution
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch117_persistence_owner_source_resolution.yml
permissions:
  contents: write
jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Extract exact Word authority for 20 persistence gaps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import re,json,subprocess,collections,zipfile

          BASE="87d9ed775573b023babf7e37bee2eaae08b19935"
          if subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()!=BASE:
              raise SystemExit("EXACT_PARENT_FAIL")

          controls=[
            "KB-01-CTL-SOURCE-CREATE","KB-01-CTL-SOURCE-SAVE","KB-01-CTL-SOURCE-PAUSE",
            "KB-01-CTL-SOURCE-RESUME","KB-01-CTL-SOURCE-RETIRE","KB-01-CTL-INGEST-START",
            "KB-01-CTL-INGEST-RETRY","KB-01-CTL-CONTEXT-CREATE","KB-01-CTL-LEARNING-CREATE",
            "KB-01-CTL-DRAFT-FROM-EXP","KB-01-CTL-DRAFT-SAVE","KB-01-CTL-APPROVE",
            "KB-01-CTL-RETURN","KB-01-CTL-REJECT",
            "CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE","CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE",
            "CTRL-ADMIN-STR-02-ACT-01-ACT-CONFIGURE","CTRL-ADMIN-STR-02-ACT-02-ACT-APPROVE",
            "CTRL-ADMIN-STR-03-ACT-02-ACT-APPROVE","CTRL-ADMIN-STR-05-ACT-02-ACT-APPROVE"
          ]
          operations=[
            "createKnowledgeSource","updateKnowledgeSource","pauseKnowledgeSource","resumeKnowledgeSource",
            "retireKnowledgeSource","createAcquisitionJob","retryAcquisitionJob","createContextCandidate",
            "createLearningCandidate","createKnowledgeDraftFromExperience","saveKnowledgeDraft",
            "approveKnowledgeDraft","returnKnowledgeDraft","rejectKnowledgeDraft",
            "configureGovernedResource","approveGovernedResource"
          ]
          entity_terms=[
            "KnowledgeSource","AcquisitionJob","ContextCandidate","LearningCandidate","KnowledgeDraft",
            "KnowledgeVersion","Experience","QualityGovernance","Quality Standard","QualityStandard",
            "QARule","QA Rule","Review Criterion","ReviewCriteria","GovernedResource",
            "StrategyPolicy","PlatformPlaybook","OpportunityCandidate","StrategyCandidate",
            "StrategyService","KnowledgeExperienceService","ACPOSContextEngine","ACPOSEvolutionEngine",
            "IAM_RUNTIME","QualityGovernance owner","Persistence Owner","transaction boundary",
            "canonical owner","canonical_owner","resource_type","target_ref"
          ]

          def norm(s):return re.sub(r"\s+"," ",(s or "").strip())
          docs=sorted(Path(".").glob("*.docx"))
          if len(docs)!=31:raise SystemExit(f"DOCX_COUNT_FAIL {len(docs)}")

          exact_control_hits={x:[] for x in controls}
          op_hits={x:[] for x in operations}
          entity_hits={x:[] for x in entity_terms}
          owner_tables=[]
          keyword_sections=[]
          for path in docs:
              d=Document(path)
              # paragraphs with neighborhood
              paras=d.paragraphs
              for i,p in enumerate(paras):
                  s=norm(p.text)
                  if not s:continue
                  for x in controls:
                      if x in s: exact_control_hits[x].append({"file":path.name,"kind":"P","loc":i+1,"text":s})
                  for x in operations:
                      if x in s: op_hits[x].append({"file":path.name,"kind":"P","loc":i+1,"text":s})
                  for x in entity_terms:
                      if x.lower() in s.lower(): entity_hits[x].append({"file":path.name,"kind":"P","loc":i+1,"text":s})
                  if re.search(r"owner|authority|entity|lifecycle|persistence|transaction|quality|knowledge|candidate|draft",s,re.I):
                      if path.name in {
                        "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
                        "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
                        "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
                        "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
                        "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
                        "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
                        "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
                      }:
                        prev=norm(paras[i-1].text) if i>0 else ""
                        nxt=norm(paras[i+1].text) if i+1<len(paras) else ""
                        keyword_sections.append({"file":path.name,"loc":i+1,"prev":prev,"text":s,"next":nxt})
              # tables
              for ti,t in enumerate(d.tables,1):
                  rows=[[norm(c.text) for c in r.cells] for r in t.rows]
                  if not rows:continue
                  h=rows[0]
                  joined_table="\n".join(" | ".join(r) for r in rows)
                  table_interesting=bool(re.search(r"owner|authority|entity|lifecycle|persistence|transaction|quality|knowledge|candidate|draft",joined_table,re.I))
                  if table_interesting:
                      owner_tables.append({"file":path.name,"table":ti,"headers":h,"rows":rows[:80]})
                  for ri,row in enumerate(rows,1):
                      s=" | ".join(row)
                      for x in controls:
                          if x in s: exact_control_hits[x].append({"file":path.name,"kind":f"T{ti}","loc":ri,"headers":h,"cells":row})
                      for x in operations:
                          if x in s: op_hits[x].append({"file":path.name,"kind":f"T{ti}","loc":ri,"headers":h,"cells":row})
                      for x in entity_terms:
                          if x.lower() in s.lower(): entity_hits[x].append({"file":path.name,"kind":f"T{ti}","loc":ri,"headers":h,"cells":row})

          # avoid huge output: keep exact hits complete; entity/owner contexts targeted.
          keep_files={
            "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          }
          owner_tables=[x for x in owner_tables if x["file"] in keep_files]
          out={
            "marker":"ACPOS-20260923-BATCH-117-PERSISTENCE-OWNER-SOURCE-RESOLUTION-V1",
            "base":BASE,
            "control_hits":exact_control_hits,
            "operation_hits":op_hits,
            "entity_hits":entity_hits,
            "owner_tables":owner_tables,
            "keyword_sections":keyword_sections[:1600],
          }
          Path("__batch117_resolution.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH117_SUMMARY="+json.dumps({
            "controls":len(controls),
            "control_hits":sum(len(v) for v in exact_control_hits.values()),
            "operation_hits":sum(len(v) for v in op_hits.values()),
            "entity_hits":sum(len(v) for v in entity_hits.values()),
            "owner_tables":len(owner_tables),
            "keyword_sections":len(keyword_sections)
          },ensure_ascii=False,sort_keys=True))
          print("BATCH117_SOURCE_RESOLUTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch117-persistence-owner-source-resolution
          path: __batch117_resolution.json
          retention-days: 3
      - name: Close resolver
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch117_resolution.json
          git config user.name "acpos-batch117-resolver"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch117_persistence_owner_source_resolution.yml
          git commit -m "chore(acpos): close batch 117 persistence owner source resolution"
          git push origin HEAD:0921acpos
