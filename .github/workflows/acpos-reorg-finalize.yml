name: ACPOS authority staging finalizer
on:
  push:
    branches: [acpos-reorg-staging]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[acpos-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-reorg-staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python .acpos-temp/finalize.py
      - run: git diff --check
      - name: Commit finalized authorities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authority
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize ACPOS current authorities [acpos-finalized]"
          git push origin HEAD:acpos-reorg-staging
