    name: Viewer QA Localization / Evidence Capture
  - component_uid: QA-01-CMP-MANUAL-DECISION
    section_uid: QA-01-SEC-07
    name: Manual Review Modify / Pass Decision
  permissions:
  - permission_uid: QA_USE
    backend_codes:
    - qa.task.read
    purpose: Enter/read QA page, task/review/output/script/evidence projections
  - permission_uid: QA_SCORE
    backend_codes:
    - qa.score.write
    purpose: Persist QA scorecard
  - permission_uid: QA_GATE
    backend_codes:
    - qa.gate.decide
    purpose: Start recheck / decide QA PASS or FAIL where authorized
  - permission_uid: QA_FINDING
    backend_codes:
    - finding.write
    purpose: Create QA finding
  - permission_uid: QA_CORRECTION
    backend_codes:
    - correction.create
    purpose: Create correction request to original owner
  - permission_uid: QA_RELEASE
    backend_codes:
    - release.create
    purpose: Create release candidate/package only
  - permission_uid: QA_AUTO
    backend: qa.auto.review
    purpose: Start/operate Topic-scoped sequential AUTO QA review; no publish/release-approval authority
  gates:
  - gate_uid: QA-01-GATE-PAGE
    condition: authorized QA page/task scope + exact account permission
  - gate_uid: QA-01-GATE-CONTEXT
    condition: exact Project + Topic + QATask + TargetOutputVersion resolved; no latest/default alias
  - gate_uid: QA-01-GATE-START
    condition: context PASS + output_version_ids explicit + qa_profile_id resolved + not superseded
  - gate_uid: QA-01-GATE-VIEWER
    condition: exact output artifact/checksum/provenance resolvable for current QA review
  - gate_uid: QA-01-GATE-COMPARE
    condition: state=RECHECK + original failed exact version + verified new exact version both resolvable
  - gate_uid: QA-01-GATE-SCRIPT
    condition: QAValidationScriptView exact id/version/hash + department=QA
  - gate_uid: QA-01-GATE-CRITERIA
    condition: approved QA CriteriaVersion + QualityGatePolicyVersion for exact target output
  - gate_uid: QA-01-GATE-EVIDENCE
    condition: evidence refs, checksum, provenance, required checks, rights/policy refs resolved
  - gate_uid: QA-01-GATE-SCORE
    condition: IN_REVIEW or RECHECK + target version explicit + criteria + evidence + required checks
  - gate_uid: QA-01-GATE-FINDING
    condition: active QA review + exact source/output/evidence + severity/category/affected_scope valid
  - gate_uid: QA-01-GATE-CORRECTION
    condition: finding_or_scorecard + failed version + affected_scope + original_owner + source_instruction_package + revalidation_requirements
  - gate_uid: QA-01-GATE-RECHECK
    condition: CORRECTION_REQUIRED + verified NEW exact output version exists + correction request linkage valid
  - gate_uid: QA-01-GATE-PASS
    condition: latest re/score evaluation satisfies bound criteria/policy + no hard block + blocking findings closed + manual review closed
      if required + rights/policy valid
  - gate_uid: QA-01-GATE-FAIL
    condition: active review/recheck + sufficient evidence for governed FAIL decision
  - gate_uid: QA-01-GATE-RELEASE
    condition: QA PASS + all findings closed + manual review closed + rights valid + policy valid + exact output versions + release.create
      permission
  - gate_uid: QA-01-GATE-MANUAL
    condition: manual review required or existing ManualReviewCase ref; QA page is read/projection unless separately governed
  - gate_uid: QA-01-GATE-AUTO
    condition: mode=AUTO + exact Project/Topic resolved + authorized Topic QA queue exists + QA_AUTO permission; each task still resolves
      exact output/script/criteria/evidence
  - gate_uid: QA-01-GATE-EVIDENCE-CAPTURE
    condition: active QA review + exact output/version/checksum/provenance + supported viewer position/range context
  - gate_uid: QA-01-GATE-MANUAL-DECISION
    condition: Governed ManualReviewCase exists + required/open + exact QA review/output/scorecard context resolved + separately governed
      Manual Review mutation authority resolved. If mutation authority is unresolved, controls are BLOCKED and frontend reports authority
      gap.
  errors:
  - error_uid: QA-01-ERR-CONTEXT-001
    context: Project/Topic/QATask/TargetOutputVersion missing, stale or mismatched
    recovery: BLOCK review; resolve exact context; no implicit latest/default
  - error_uid: QA-01-ERR-OUTPUT-001
    context: Output artifact/version/checksum/provenance invalid
    recovery: BLOCK viewer/score/gate; preserve review context
  - error_uid: QA-01-ERR-SCRIPT-001
    context: QAValidationScriptView missing/hash/department mismatch
    recovery: BLOCK scoring; no generic QA script fallback
  - error_uid: QA-01-ERR-CRITERIA-001
    context: QA CriteriaVersion/QualityGatePolicy missing or unapproved
    recovery: BLOCK scoring/gate; no local default threshold
  - error_uid: QA-01-ERR-EVIDENCE-001
    context: Required evidence/checksum/provenance/check missing
    recovery: BLOCK gate/release; show exact missing evidence
  - error_uid: QA-01-ERR-RIGHTS-001
    context: Rights/Policy invalid or unavailable
    recovery: HARD BLOCK; numeric score cannot override
  - error_uid: QA-01-ERR-FINDING-001
    context: Finding payload/source/scope/evidence invalid
    recovery: BLOCK finding create; preserve current review
  - error_uid: QA-01-ERR-CORRECTION-001
    context: Correction request lacks failed version/original owner/source instruction/revalidation scope
    recovery: BLOCK request; do not execute upstream edit in QA
  - error_uid: QA-01-ERR-RECHECK-001
    context: New output absent, same as failed version, or correction linkage invalid
    recovery: BLOCK recheck; wait verified new exact version
  - error_uid: QA-01-ERR-GATE-001
    context: PASS/FAIL decision prerequisites invalid or stale
    recovery: BLOCK decision; refresh exact review state
  - error_uid: QA-01-ERR-MANUAL-001
    context: Required ManualReviewCase unresolved/open
    recovery: BLOCK PASS/Release; show manual review blocker
  - error_uid: QA-01-ERR-RELEASE-001
    context: Release candidate eligibility refs invalid
    recovery: BLOCK package creation; no publish fallback
  - error_uid: QA-01-ERR-PERM-001
    context: Permission/scope denied
    recovery: Disable action + show actual reason
  - error_uid: QA-01-ERR-UNDEFINED-001
    context: Unlisted Section/Component/Control/Action/Gate/Permission/Port requested
    recovery: BLOCK + REPORT_AUTHORITY_GAP
  - error_uid: QA-01-ERR-AUTO-001
    context: AUTO cannot resolve Topic QA queue / exact next-task context
    recovery: BLOCK AUTO current item; preserve queue; no reorder/create/skip; report exact missing ref
  - error_uid: QA-01-ERR-EVIDENCE-CAPTURE-001
    context: Evidence capture lacks exact output/version/checksum/provenance or valid point/range
    recovery: BLOCK capture only; preserve viewer; no manual Evidence ID fallback
  - error_uid: QA-01-ERR-MANUAL-ACTION-001
    context: Manual Review Modify/Pass requested but governed ManualReviewCase or mutation authority is missing/stale
    recovery: BLOCK Manual Review action; preserve case/review context; resolve existing governed Manual Review authority; do not invent
      API/permission
  page_states:
  - state_uid: QA-01-ST-NOT-STARTED
    display: NOT_STARTED
    definition: Exact QA task/output may be resolved; review not started
  - state_uid: QA-01-ST-IN-REVIEW
    display: IN_REVIEW
    definition: QA review active
  - state_uid: QA-01-ST-FINDING
    display: FINDING_OPEN
    definition: One or more findings open
  - state_uid: QA-01-ST-CORRECTION
    display: CORRECTION_REQUIRED
    definition: Correction requested to original owner
  - state_uid: QA-01-ST-RECHECK
    display: RECHECK
    definition: Verified new version under recheck
  - state_uid: QA-01-ST-BLOCKED
    display: BLOCKED
    definition: Hard gate / rights / policy / evidence / manual review blocker
  - state_uid: QA-01-ST-PASS
    display: PASS
    definition: Governed QA PASS
  - state_uid: QA-01-ST-FAIL
    display: FAIL
    definition: Governed QA FAIL
  - state_uid: QA-01-ST-SUPERSEDED
    display: SUPERSEDED
    definition: Review/version superseded; read-only trace
  - state_uid: QA-01-ST-ERROR
    display: ERROR
    definition: Real runtime/contract/permission error
  stages:
  - stage_uid: QA-01-STAGE-01-RESOLVE
    name: Resolve / Start Review
    flow: Validate QAHandoff/QATask/exact output/script/criteria/rights/policy -> startQaReview
  - stage_uid: QA-01-STAGE-02-VALIDATE
    name: Score / Evidence
    flow: Review exact output -> required checks -> evidence -> QA scorecard
  - stage_uid: QA-01-STAGE-03-FINDING
    name: Finding / Manual Review
    flow: Create findings; surface ManualReviewCase when required; QA does not edit upstream
  - stage_uid: QA-01-STAGE-04-RECHECK
    name: Correction / Recheck
    flow: CreateCorrectionRequest -> original owner creates NEW output -> startRecheck -> re-score
  - stage_uid: QA-01-STAGE-05-GATE
    name: QA Gate / Release Candidate
    flow: decide PASS/FAIL; if eligible createReleasePackage candidate -> ReleaseService
  stage_transitions:
  - transition_uid: QA-01-STTR-01
    from_stage: QA-01-STAGE-01-RESOLVE
    to_stage: QA-01-STAGE-02-VALIDATE
    trigger: QA-01-ACT-START-REVIEW
    gate_uid: QA-01-GATE-START
  - transition_uid: QA-01-STTR-02
    from_stage: QA-01-STAGE-02-VALIDATE
    to_stage: QA-01-STAGE-03-FINDING
    trigger: Finding/manual review needed
    gate_uid: QA-01-GATE-FINDING
  - transition_uid: QA-01-STTR-03
    from_stage: QA-01-STAGE-03-FINDING
    to_stage: QA-01-STAGE-04-RECHECK
    trigger: QA-01-ACT-CORRECTION-REQUEST then verified new output
    gate_uid: QA-01-GATE-RECHECK
  - transition_uid: QA-01-STTR-04
    from_stage: QA-01-STAGE-04-RECHECK
    to_stage: QA-01-STAGE-05-GATE
    trigger: Recheck score/evidence completed
    gate_uid: QA-01-GATE-SCORE
  - transition_uid: QA-01-STTR-05
    from_stage: QA-01-STAGE-02-VALIDATE
    to_stage: QA-01-STAGE-05-GATE
    trigger: No correction/manual blocker and scoring complete
    gate_uid: QA-01-GATE-PASS
  - transition_uid: QA-01-STTR-06
    from_stage: QA-01-STAGE-05-GATE
    to_stage: QA-01-STAGE-05-GATE
    trigger: PASS -> QA-01-ACT-RELEASE-CREATE
    gate_uid: QA-01-GATE-RELEASE
  action_effect_types:
  - effect_type: UI_ONLY
    allowed: Viewer/filter/drawer/local state
    forbidden: No business mutation
  - effect_type: CONTEXT_STATE
    allowed: Change current exact review/finding selection
    forbidden: No implicit cross-project fallback
  - effect_type: QA_REVIEW_START
    allowed: Create QAReviewRun via registered operation
    forbidden: No invented output/criteria refs
  - effect_type: SCORE_MUTATION
    allowed: Persist immutable QA scorecard
    forbidden: No local scoring schema/threshold
  - effect_type: FINDING_CREATE
    allowed: Create append-only QA finding
    forbidden: No upstream output mutation
  - effect_type: CORRECTION_CREATE
    allowed: Create correction request to original owner
    forbidden: QA cannot execute upstream edit
  - effect_type: QA_RECHECK_START
    allowed: Start recheck after verified new output
    forbidden: Cannot close finding without new version/recheck
  - effect_type: QA_GATE_DECISION
    allowed: Authorized PASS/FAIL decision
    forbidden: No hard-gate bypass
  - effect_type: RELEASE_CANDIDATE_CREATE
    allowed: Create release package candidate
    forbidden: No release approval or publish
  - effect_type: AUTO_QA_ORCHESTRATION
    allow: Sequential Topic QA using exact refs and existing QA operations
    forbid: Parallel/reorder/create/skip; score-only release/publish
  - effect_type: EVIDENCE_CONTEXT
    allow: Bind exact viewer point/frame/range to Finding/Evidence draft
    forbid: Upstream mutation or manual unverified Evidence ID
  - effect_type: MANUAL_REVIEW_MUTATION
    allow: Modify or Pass an existing governed ManualReviewCase when required
    forbid: Blank scoring, direct QA Gate bypass, invented Manual Review endpoint/permission
