name: Mother Spec Neutrality Promotion
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/mother-spec-neutrality-promotion.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: python3 -m pip install pyyaml
      - name: Materialize neutral portable governance candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, json, lzma, re, tarfile, textwrap, yaml, zipfile

          ROOT=Path('.')
          SRC=ROOT/'.github/governance-source/active/source'
          MOTHER=SRC/'12_DOCS/mother-spec'
          CUR=ROOT/'governance/specifications/current'
          REG=ROOT/'governance/specifications/REGISTRY.yaml'
          ENTRY=ROOT/'GOVERNANCE_CURRENT.yaml'
          PROFILE=SRC/'10_REGISTRY/GOVERNANCE_LIFECYCLE_STAGE_REGISTRY.yaml'
          SEM=SRC/'10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml'
          SEC=SRC/'10_REGISTRY/SECTION_NUMBER_REGISTRY.yaml'
          PROTECTED=SRC/'10_REGISTRY/PROTECTED_CURRENT_ARTIFACT_REGISTRY.yaml'
          ROOT_MANIFEST=SRC/'10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml'
          INV=SRC/'10_REGISTRY/STAGE_EXECUTION_INVARIANT_REGISTRY.yaml'
          NEW_UID='GOV-REV-20260915-NEUTRAL-PORTABLE-GOVERNANCE'
          NEW_VERSION='v2.2.0'
          NEW_REVISION='v2.2.0-neutral-portable-governance'
          PROFILE_UID='ACPOS-WEB-DELIVERY-PROFILE-11'

          def load(p):
              return yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          def dump(p,d):
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=160),encoding='utf-8')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def hobj(d):
              x=dict(d); x.pop('content_hash',None)
              return hashlib.sha256(yaml.safe_dump(x,allow_unicode=True,sort_keys=True,width=160).encode()).hexdigest()
          def replace_section(text,uid,body):
              anchor=f'<!-- SECTION_UID: {uid} -->'
              start=text.find(anchor)
              if start<0: raise SystemExit(f'MISSING_SECTION:{uid}')
              nxt=text.find('<!-- SECTION_UID:',start+len(anchor))
              end=len(text) if nxt<0 else nxt
              return text[:start]+anchor+'\n'+textwrap.dedent(body).strip()+'\n\n'+text[end:]
          def replace_fixed_stage_tokens(text):
              caps={
                1:'SOURCE_INTAKE_CAPABILITY',2:'FUNCTIONAL_CONTRACT_CAPABILITY',3:'VISUAL_DESIGN_CAPABILITY',4:'FOUNDATION_FREEZE_CAPABILITY',
                5:'IMPLEMENTATION_CAPABILITY',6:'VERIFICATION_QA_CAPABILITY',7:'RELEASE_CANDIDATE_CAPABILITY',8:'PRE_PRODUCTION_ACCEPTANCE_CAPABILITY',
                9:'PRODUCTION_CUTOVER_CAPABILITY',10:'PRODUCTION_ACCEPTANCE_CAPABILITY',11:'CLOSURE_OPERATIONS_CAPABILITY'}
              for i,name in caps.items():
                  pats=[rf'\bSTAGE[-_ ]?0?{i}\b',rf'\bStage[-_ ]?0?{i}\b',rf'\bstage[-_ ]?0?{i}\b']
                  for pat in pats: text=re.sub(pat,name,text)
              replacements={
                'Stage Identity':'Lifecycle / Approval / Acceptance / Ownership Boundary Identity',
                'Lifecycle Stage Registry':'Execution Profile Registry',
                'lifecycle Stage Registry':'execution profile registry',
                'Lifecycle Stage':'Execution Profile Step',
                'lifecycle Stage':'execution profile step',
                'Stage Contract':'Execution Profile Step Contract',
                'Stage UID':'Profile Step UID','stage UID':'profile step UID','Producer Stage':'Producer Work Unit',
                'Cross Stage':'Cross Work Unit','cross-stage':'cross-work-unit','Cross-stage':'Cross-work-unit',
                'Stage-specific':'Profile-specific','stage-specific':'profile-specific',
                'Stage execution':'Governed execution','stage execution':'governed execution',
                'Stage test':'Validation cycle','stage test':'validation cycle',
                'Stage closure':'Work-unit closure','stage closure':'work-unit closure',
                'Stage close':'Work-unit close','stage close':'work-unit close',
                'Stage exit':'Work-unit exit','stage exit':'work-unit exit',
                'Stage-Gated':'Dependency-Gated','stage-gated':'dependency-gated',
                'STAGE_EXECUTION_PREFLIGHT_RECEIPT':'EXECUTION_CYCLE_PREFLIGHT_RECEIPT',
              }
              for a,b in replacements.items(): text=text.replace(a,b)
              text=re.sub(r'\b11[- ]Stage\b','selected-profile step set',text,flags=re.I)
              text=re.sub(r'\b11 stages\b','selected-profile step set',text,flags=re.I)
              text=re.sub(r'\bStages?\s+1[–-]4\b','foundation-capability subset',text,flags=re.I)
              text=re.sub(r'\bStages?\s+5[–-]11\b','delivery-capability subset',text,flags=re.I)
              return text

          # ---- Mother 01: keep reusable source/design authority, remove execution-instance choreography. ----
          p=MOTHER/'01_BLUEPRINT_DESIGN_GOVERNANCE.md'; t=p.read_text(encoding='utf-8')
          t=replace_section(t,'WEB-GOV-01-S063',r'''
          ## 63. Source-Domain Extraction / Authority Isolation

          Source intake MUST enumerate the complete declared source universe before responsibility classification. Extraction MUST preserve source identity, location, hash, semantic responsibility candidates, and unresolved external Authority references without inventing missing product behavior.

          Classification MUST be responsibility-based rather than file-name-, folder-, syntax-, or execution-step-based. A source unit that mixes Page, Visual, Data, Runtime, Provider, Permission, Audit, or Shared-Owner responsibilities MUST be decomposed until each terminal unit has one governed responsibility or explicit `MIXED_ALLOWED` evidence.

          Raw Source remains immutable evidence. Derived classifications, manifests, blueprints, tests, generated files, and validation output MUST_NOT become replacement source Authority merely because they are newer or more structured.
          ''')
          t=replace_section(t,'WEB-GOV-01-S064',r'''
          ## 64. Responsibility Classification / Base Blueprint Materialization

          Every classified responsibility MUST resolve to one Canonical Owner, one current lineage, and one legal downstream consumer set before Base Blueprint materialization.

          Page and Visual responsibilities MUST have independent editable owners. Their materialized blueprints MAY share registered references, but one blueprint MUST_NOT silently absorb the other's responsibility or become a second Authority copy.

          Base Blueprint compilation MUST consume current classified artifacts and registered shared references only. Required responsibility loss, duplicate ownership, unresolved mixed responsibility, stale source hash, or direct post-classification Raw Source bypass MUST block closure.
          ''')
          t=replace_section(t,'WEB-GOV-01-S064-05',r'''
          ## 64.5 Validation-Cycle Reset / Replay Boundary

          A fresh validation or remediation cycle MUST begin from the registered immutable inputs plus authorized owning-layer corrections. Prior generated outputs, caches, temporary artifacts, stale evidence, or previous-result summaries MUST_NOT be reused as current completion credit.

          Reset MUST remove replaceable execution residue while preserving immutable source and externally owned Authority. If the governing policy revision changes, current-cycle evidence becomes historical for closure and a new cycle MUST freeze the new policy identity before verification resumes.
          ''')
          t=replace_section(t,'WEB-GOV-01-S065',r'''
          ## 65. Source Enumeration Completeness / Blueprint Domain Separation

          Source enumeration MUST be independently provable before classification. The enumerated source denominator MUST be preserved through mapping, source-fact materialization, responsibility classification, Page Base Blueprint, Visual Base Blueprint, and binding so that downstream processing cannot silently shrink the source universe.

          Page and Visual blueprint compilation MUST remain separate work units with explicit inputs, outputs, hashes, owners, and a binding artifact. A combined editable Page+Visual owner, unexplained source loss, or downstream denominator shrink is blocking.
          ''')
          t=replace_section(t,'WEB-GOV-01-S069',r'''
          ## 69. Source Context / Supersession / Dependency Contract

          Current source context MUST expose source identity, supersession decisions, unresolved Authority references, forward dependencies, reverse dependencies, and exact consumer impact. A superseded Current owner MUST_NOT remain concurrently active with its replacement.

          A legal successor may add or supersede facts only through explicit lineage. It MUST_NOT erase predecessor truth, rewrite immutable source, or convert an unresolved external Authority reference into a locally inferred value.
          ''')
          t=replace_section(t,'WEB-GOV-01-S072',r'''
          ## 72. Functional / Visual / Interaction Authority Boundary

          Functional topology, interaction topology, visual projection, implementation, verification, and Production acceptance MUST remain bound by explicit Authority boundaries rather than by fixed lifecycle step numbers.

          The authority that owns functional behavior defines required operations, context transitions, workbench cohesion, and allowed separation. Visual Design Authority MAY change geometry and presentation only within an approved change set and MUST preserve functional semantics unless a higher-level authorized contract change exists. Implementation MUST consume the approved contracts; it MUST_NOT invent topology or visual behavior to fit code.

          Verification and Production acceptance MUST prove semantic continuity from functional contract through visual projection and runtime behavior for every applicable governed journey.
          ''')
          t=replace_section(t,'WEB-GOV-01-S073',r'''
          ## 73. Canonical Execution-Cycle Preflight / Effective Contract Truth

          Before material remediation or construction begins, every governed execution cycle MUST compile one canonical preflight from the Current policy, selected execution profile when one exists, exact dependency closure, required-field/applicability rules, Current Authority, and immutable predecessor inputs.

          The preflight MUST materialize one required-field manifest, functional-chain manifest, effective-contract overlay, dependency topology, denominator snapshot, classification ruleset, change-impact map, `EXECUTION_CYCLE_PREFLIGHT_RECEIPT`, one Current problem register, and one append-only resolution ledger when those artifacts are applicable.

          All scanners, validators, classifiers, trace builders, and remediation executors MUST consume the same canonical preflight. A local hard-coded subset, stale denominator, prior-run report, or execution-profile copy that weakens common policy MUST_NOT claim canonical completeness.
          ''')
          if 'WEB-GOV-01-S074' not in t:
              t += textwrap.dedent(r'''

              <!-- SECTION_UID: WEB-GOV-01-S074 -->
              ## 74. Reusable Policy / Execution Profile / Run-State Layer Separation

              Reusable Mother Policy MUST be product-neutral, project-neutral, execution-profile-neutral, and validation-run-neutral. It MUST define semantic invariants, Authority boundaries, applicability rules, evidence requirements, closure conditions, and fail-closed behavior without requiring a fixed numbered sequence, fixed step names, fixed step count, run identifier, retry label, workflow path, test-script name, or provider-specific implementation path.

              A project MAY select an `EXECUTION_PROFILE` that binds the reusable policy to concrete step identities, names, order, concurrency, input/output contracts, and a profile-local denominator. Those bindings are project execution metadata, not global Mother Policy. The selected profile MUST NOT weaken or redefine common policy, and every profile-required step MUST close before profile completion.

              `RUN_STATE`, generated evidence, CI implementation, validators, temporary artifacts, and historical evidence MUST remain separate layers. Evidence MAY prove policy compliance but MUST_NOT become policy Authority merely by being promoted, copied, generated, newer, or marked PASS.

              Promotion into reusable policy MUST run a contamination scan, canonical-rule-owner check, contradiction/supersession check, active-consumer projection audit, and portability test against differently named execution profiles. Any execution-instance identifier or profile-local denominator found in reusable policy without an explicit non-normative example classification MUST block promotion.
              ''')
          t=re.sub(r'(?m)^version:\s*2\.1\.0\s*$','version: 2.2.0',t)
          p.write_text(replace_fixed_stage_tokens(t),encoding='utf-8')

          # ---- Mother 02: replace universal ordered lists with semantic gate graph/profile contract. ----
          p=MOTHER/'02_IMPLEMENTATION_DELIVERY_STANDARD.md'; t=p.read_text(encoding='utf-8')
          t=replace_section(t,'WEB-GOV-02-S004',r'''
          ## 4. 施工能力與 Gate Catalog（順序由依賴與適用性決定）

          正式施工 MUST 依 Authority、dependency graph、applicability 與 selected execution profile 計算所需 Gate；Mother Policy MUST_NOT 以固定編號或固定總數宣告所有網站都必須採用同一流程。

          可適用能力至少涵蓋：Source/Blueprint Intake、Requirement/Acceptance Binding、Dependency Mapping、Design/Visual Authority、Repository Owner Resolution、Contract Materialization、Frontend/Control/Action、Runtime/Data/Database、Authentication/Authorization/Security、Audit/Error/Recovery、External/Async/Storage、Unit/Integration/Permission/Browser E2E、Visual/Responsive/i18n/Accessibility、Build/Deployment、Production Identity/Smoke/Page/Control/Data/Effectful Acceptance、Monitoring/Backup/Rollback 與 Final Reconciliation。

          每個 REQUIRED Gate MUST 定義 prerequisites、inputs、outputs、owner、validator、evidence、failure behavior、invalidation rule 與 closure condition。僅在 prerequisites 已滿足且 Authority 允許時 MAY 並行；不得以固定流水號取代依賴關係，也不得跳過 applicable REQUIRED Gate。
          ''')
          t=replace_section(t,'WEB-GOV-02-S054A',r'''
          ## 54A. Page / Capability Full-Lifecycle Applicability Gate

          Pilot、正式施工或重新施工 MUST 從該 Scope 的最早未被有效 Current evidence 覆蓋之 Authority boundary 開始，並沿 dependency graph 關閉全部 applicable REQUIRED capabilities。不得從既有 UI、Runtime、Test 或中段 Commit 開始後冒充完整生命週期驗證。

          Full-lifecycle closure MUST prove Source Truth、Canonical Classification、Naming/Owner、Requirement/Architecture、Functional Chain、Design/Visual、Acceptance Baseline、Implementation、State/Error/Audit、Executable Verification、Build/Deployment identity、Production Runtime acceptance、Monitoring/Recovery 與 Final Reconciliation 中所有 applicable Gate 已閉環。

          Execution Profile MAY 將這些能力綁成具體步驟與順序；該 profile 的 step count 與 step names 僅為 profile-local denominator。Mother Policy 只要求 dependencies、applicability 與 closure truth，不要求固定步驟數。
          ''')
          t=replace_section(t,'WEB-GOV-02-S065',r'''
          ## 65. Dependency-Gated Governance Validation Before Website Reconstruction

          Governance package MUST be validated and locked before formal website reconstruction begins. Validation freezes one candidate policy identity, executes the applicable definition/regression/portability gates, records every reproduced defect, and prohibits normative mutation during an active validation cycle.

          A reproduced governance defect MUST close the active validation attempt as failed or blocked before policy editing. Repair occurs in a separately authorized candidate, followed by fresh validation. A released policy remains immutable; later defects create a successor policy revision and invalidate only affected acceptance evidence.

          Formal website implementation, deployment, or Production Acceptance MUST remain blocked until the selected policy revision and execution profile, when applicable, satisfy their release conditions.
          ''')
          t=replace_section(t,'WEB-GOV-02-S067',r'''
          ## 67. Execution Profile Machine Contract

          A project that requires a concrete lifecycle MUST materialize exactly one selected `EXECUTION_PROFILE`. The profile MAY define any evidence-justified number of ordered or partially concurrent steps and MUST declare its own profile-local denominator.

          Every profile step MUST define: step UID, semantic capability, scope mode, prerequisites/entry gate, inputs, input origins, operations, outputs, producers, validators, required evidence, failure/invalidation behavior, exit condition, and legal successor relation.

          Profile step names, numeric identities, counts, and ordering MUST NOT become reusable Mother Policy. The selected profile MUST inherit common policy without weakening it. Profile completion requires every applicable profile-required step to close; a profile-local 11-step ACPOS lifecycle therefore remains 11/11 for ACPOS while a different website MAY legally use a different profile.
          ''')
          t=replace_section(t,'WEB-GOV-02-S068',r'''
          ## 68. Mode-Aware Governance Validation

          Governance validation MUST select one explicit mode appropriate to the requested decision: definition/pre-formal audit, selected-profile execution validation, or release-final validation.

          Definition audit validates governance definitions, registries, references, schemas, compilers, package self-containment, portability, layer separation, and hygiene; it MUST_NOT require product/Production evidence that cannot yet legally exist.

          Selected-profile validation consumes only the current profile step, its persisted predecessor/foundation artifacts, common policy, and exact dependency closure. Release-final validation requires every applicable product, profile, deployment, and Production acceptance evidence item.
          ''')
          t=replace_section(t,'WEB-GOV-02-S069',r'''
          ## 69. Output Producer / Input Origin Binding

          Every required work-unit input MUST resolve to exactly one legal origin: predecessor output, persisted foundation output, Current Authority/Project Configuration, shared-owner contract, or previous-scope closure contract. Every output MUST resolve to an explicit producer operation.

          Missing, future-only, cyclic, duplicated, unresolved, or profile-inapplicable origin/producer bindings MUST block closure. Aggregate outputs require a named compile/reconciliation owner and MUST_NOT appear as unowned side effects.
          ''')
          t=replace_section(t,'WEB-GOV-02-S070',r'''
          ## 70. Pre-Execution Governance Load Gate

          Every mutating execution item, work unit, profile operation, and program-construction action MUST load governance before execution. `NO_GOVERNANCE_LOAD_RECEIPT = NO_EXECUTION`.

          The effective normative set MUST be compiled from common reusable policy, the selected execution-profile binding when applicable, Construction Profile requirements, artifact-specific normative refs, and exact dependency closure. A `GOVERNANCE_LOAD_RECEIPT` MUST bind execution identity, evidence-cycle identity, Work Unit/profile-step identity when applicable, governance UID, Root Manifest hash, effective normative-set hash, resolved Section UID receipts, dependency artifact hashes, acceptance blueprint identity, timestamp, and loader identity/version.

          Required normative refs that are missing, ambiguous, stale, non-current, or sourced from non-authoritative run state MUST block execution.
          ''')
          t=replace_section(t,'WEB-GOV-02-S073',r'''
          ## 73. Dependency-Ordered Materialization / Incremental Impact Validation / Single Current Problem State

          Formal remediation MUST execute in dependency order: shared/root Authority and contract primitives -> reusable runtime/transport/state contracts -> dependent business operations -> leaf behavior -> visual/interaction binding. A downstream leaf MUST_NOT be repeatedly patched while an unresolved upstream owner can change its admissibility or expected value.

          Each accepted remediation batch MUST write only to the canonical owning layer, append a machine-readable resolution entry, and validate the affected reverse-dependency closure. Complete sweeps remain mandatory at registered checkpoints, after common-engine changes, before governed-cycle closure, before policy/release freeze, and whenever indexed validation diverges from a full sweep.

          There MUST be one active `CURRENT_PROBLEM_REGISTER` for the governed cycle and one append-only `RESOLUTION_LEDGER`. Per-run reports and snapshots are evidence only. New denominators MUST derive from physical scan plus exact authorized successor reconciliation, never from predecessor reports or hard-coded expected counts.
          ''')
          t=re.sub(r'(?m)^version:\s*2\.1\.0\s*$','version: 2.2.0',t)
          p.write_text(replace_fixed_stage_tokens(t),encoding='utf-8')

          # ---- Mother 03: replace governance-test run choreography with reusable cycle invariants. ----
          p=MOTHER/'03_EXECUTION_CONTROL_STANDARD.md'; t=p.read_text(encoding='utf-8')
          t=replace_section(t,'WEB-GOV-03-S046',r'''
          ## 46. Governance Specification Development / Validation Lock Discipline

          A released governance revision is immutable. A successor candidate MAY change reusable policy only under an explicit, pre-existing exact-scope authorization and MUST preserve predecessor history.

          Every formal validation cycle MUST freeze the candidate governance UID/hash and immutable input baseline before execution. Normative mutation during that validation cycle invalidates its acceptance result. Test fixtures carry observable facts only; expected outcomes belong to the external harness and MUST_NOT instruct validators what conclusion to return.

          Reproduced defects MUST be recorded, classified by owning layer, repaired in a successor candidate or non-policy owning layer as applicable, and freshly revalidated. Product-specific evidence MAY be test input but MUST_NOT become a common-policy dependency.
          ''')
          t=replace_section(t,'WEB-GOV-03-S051',r'''
          ## 51. Validation-Cycle Retry / Relock Execution Control

          When a locked policy revision later exposes a reproduced defect, the locked revision remains immutable. A successor candidate MUST be created under explicit authorization; unrelated changes MUST NOT be carried into the defect scope.

          Fresh retry/replay MUST begin from registered immutable inputs plus authorized owning-layer remediation, with prior generated outputs and stale test residue removed. The retry MUST bind immutable input hashes, candidate governance UID/hash, evidence-cycle identity, output root, and clean-start evidence.

          If candidate normative bytes change after the retry begins, that retry is invalid for closure and MUST restart under the new candidate identity. Prior-result reuse, fixture patching to manufacture PASS, and stale-output carry-forward are forbidden.
          ''')
          t=replace_section(t,'WEB-GOV-03-S052',r'''
          ## 52. Source Enumeration Before Classification / Dual-Blueprint Dependency Order

          Source intake MUST close Raw Source Capture before Source Structure Enumeration; enumeration MUST close before segment mapping; source facts MUST materialize before responsibility classification; Page and Visual Base Blueprint compilation MUST remain separate; binding occurs only after both current blueprint hashes exist.

          Validators MUST distinguish predecessor closure facts from legal successor activity. Starting a registered legal successor MUST NOT retroactively invalidate an otherwise valid predecessor merely because the global execution state has advanced. Illegal skip, proof loss, Authority identity drift, or unregistered successor remains fail-closed.

          Semantic granularity is responsibility-based rather than syntax-based. Every candidate terminal unit MUST be homogeneous across Owner, Lifecycle, Approval, Version, Acceptance Scope, Planning Domain, Release/Rollback Identity, Applicability, and Closure Identity, or carry explicit `MIXED_ALLOWED` evidence. Every applicable work unit MUST re-run this check for its own terminal units.
          ''')
          t=replace_section(t,'WEB-GOV-03-S058',r'''
          ## 58. Universal Closure Evidence Continuity / Ledger Synchronization / Terminal CI Receipt

          Closure continuity applies to every governed work unit and selected execution-profile step. A legal successor MUST NOT erase, revert, or silently rewrite proven predecessor facts. Closure mutation semantics are `MERGE_APPEND_OR_EXPLICIT_SUPERSEDE`.

          Current execution/evidence ledgers MUST synchronize as one logical transaction for the affected scope, including immutable baseline identity, governance UID, work-unit/profile-step identity when applicable, artifact/evidence plans, dependency indexes, unresolved Authority identity, gate state, and next legal transition. Material drift MUST block closure.

          Materialization evidence and terminal CI receipt are separate identities. Terminal receipt MUST externally bind provider, repository/project, head SHA, evidence-cycle identity, job denominator, and conclusion without requiring self-writing into the same commit. Required evidence must parse and pass its schema/field validator; presence alone is not evidence validity.

          Unresolved Authority continuity is exact, not count-only. AI inference, alias substitution, default filling, or evidence-reference drift MUST_NOT resolve external Authority.
          ''')
          t=replace_section(t,'WEB-GOV-03-S059',r'''
          ## 59. Validation Feedback / Specification Evolution Closed Loop

          Every governed validation cycle MUST durably record reproduced bugs, gaps, validator/harness defects, evidence defects, implementation deviations, unresolved contracts, and suspected reusable policy deficiencies. Finishing planned assertions alone is not closure.

          Each issue MUST be classified by one primary owner: reusable policy, validation/harness implementation, product/contract materialization, runtime/implementation, non-normative evidence/state, or external/shared Authority. Product-specific evidence becomes a common-policy candidate only when recurrence/generalizability is proven.

          Reusable-policy candidates remain non-normative until explicit authorization, atomic successor promotion, multidirectional regression, active-consumer projection verification, and full Current-policy revalidation pass. A provider/project adapter MUST expose exactly one Current governance entry; historical candidates and evidence MUST remain non-current.
          ''')
          t=replace_section(t,'WEB-GOV-03-S060',r'''
          ## 60. Universal Business-Entity Completeness / Product-Neutral Execution Gate

          Business Entity completeness is a common semantic invariant. Source-intake capability extracts entity/relationship candidates; functional-contract capability materializes entity inventory, operation/hierarchy matrices, functional contracts, state dependencies, and unresolved Authority gaps; visual-design capability binds applicable operations to approved interaction/visual entries; freeze capability locks the accepted denominator; implementation consumes it without invention; verification and Production acceptance execute applicable lifecycle behavior.

          Required entity/operation/hierarchy/functional/visual continuity gaps MUST block the capability that owns them. Automatic functional completion is allowed only for a uniquely necessary minimal closure inside authorized dependency bounds; two or more materially distinct viable behaviors constitute an Authority gap and MUST block AI autofill.

          Logic and visual state MUST remain synchronized for user-visible or observable operations. Indexed validation MAY optimize performance but MUST NOT change the semantic denominator or suppress an impacted validator.
          ''')
          t=replace_section(t,'WEB-GOV-03-S061',r'''
          ## 61. Interaction Topology / Workbench Continuity Execution Control

          Governed execution MUST preserve one authoritative interaction topology from functional contract through approved visual projection, implementation, verification, Production acceptance, and later revision.

          Functional-contract Authority owns workbench boundaries, operation order, context/state continuity, allowed separation, cross-surface handoff, and conditional AI-interaction identity. Visual Design Authority owns approved projection and geometry but MUST NOT silently redefine functional topology. Implementation MUST consume both without invention or omission.

          Verification/Production acceptance MUST prove actual journey continuity, context handoff, revision lineage, branch isolation/adoption, and AI decision boundary when applicable. Discovery of a required topology change MUST reopen the owning contract/design Authority rather than be solved ad hoc downstream.
          ''')
          t=replace_section(t,'WEB-GOV-03-S062',r'''
          ## 62. Canonical Execution Engine / Checkpoint Control / Clean-Restart Rule

          Every governed execution cycle MUST use one canonical engine contract: `Global Preflight -> Frozen Canonical Manifests -> Dependency-Ordered Batch Execution -> Local Impact Validation -> Checkpoint Reconciliation -> Final Fresh Full Sweep`.

          Selected execution profiles MAY specialize operations and artifact schemas, but MUST consume the same common required-field, applicability, classification, effective-overlay, denominator, Authority, and evidence rules. Profile-local copies MUST_NOT diverge from common policy.

          Before remediation, the engine MUST validate `EXECUTION_CYCLE_PREFLIGHT_RECEIPT`. After each batch it MUST update the affected reverse-dependency closure and append `RESOLUTION_LEDGER`; full sweeps are mandatory after shared/common-engine changes, registered category closure, before cycle closure, and before policy/release freeze.

          Harness defects MUST NOT consume product blocker credit or create product Authority. Authorized normative promotion invalidates prior-cycle closure credit under the old UID; generated outputs/derived state are reset, immutable predecessor/external Authority is preserved at its owner, and fresh execution restarts under the new UID.
          ''')
          t=t.replace('Every construction stage MUST','Every governed construction work unit MUST').replace('Every execution stage MUST','Every governed execution cycle MUST')
          t=re.sub(r'(?m)^version:\s*2\.1\.0\s*$','version: 2.2.0',t)
          p.write_text(replace_fixed_stage_tokens(t),encoding='utf-8')

          # ---- Mother 04: audit policy neutral; profile-specific identities audited as profile metadata. ----
          p=MOTHER/'04_AUDIT_PROGRESS_STANDARD.md'; t=p.read_text(encoding='utf-8')
          t=replace_section(t,'WEB-GOV-04-S068',r'''
          ## 68. Governance Revision Lock / Anti-Moving-Target Audit

          Audit MUST distinguish immutable released policy, mutable authorized successor candidate, and frozen validation-cycle candidate. For every formal validation cycle Audit MUST verify the baseline/candidate hash at start and closure, exact authorized change scope, immutable released predecessor, fact-only fixtures, recomputed results, and zero normative mutation during the active cycle.

          A new defect after release creates a new defect record and successor candidate; affected prior evidence becomes `REVERIFY_REQUIRED`. Website construction MUST remain blocked until the selected governance release and execution profile, when applicable, satisfy their release gates.
          ''')
          t=replace_section(t,'WEB-GOV-04-S069',r'''
          ## 69. Classified Extraction / Base Blueprint Audit

          Source-intake audit MUST recompute physical source -> enumeration -> mapping -> source facts -> responsibility classification -> Page/Visual Base Blueprint -> binding lineage rather than accept filename presence.

          Every required source segment must have one legal disposition; every classified artifact one responsibility scope/Canonical Owner unless explicit mixed evidence exists; Page/Visual editable owners must remain separate; blueprint inputs must match current classified hashes; Current outputs must be referenced by the current evidence-cycle manifest; stale prior output/temp/cache/residual must be zero or explicitly historical.
          ''')
          t=replace_section(t,'WEB-GOV-04-S072',r'''
          ## 72. Management Registry / Layer Classification Audit

          Formal governance audit MUST verify physical Current instances for Naming, Blueprint, Audit, Review, Acceptance, Section, Protected Current, Root Manifest, Construction Artifact, semantic Authority, and the selected Execution Profile Registry when a profile is active.

          Every management artifact MUST declare its layer classification. Reusable `POLICY` MUST NOT contain execution-instance authority; `EXECUTION_PROFILE` MAY contain project-local step identities/counts but MUST declare `global_normative_authority: false`; `RUN_STATE`, `IMPLEMENTATION`, and `HISTORICAL_EVIDENCE` MUST NOT become reusable policy Authority.

          Missing registry, duplicate current registry, stale hash, unresolved canonical path, layer contradiction, or schema mismatch is blocking.
          ''')
          t=replace_section(t,'WEB-GOV-04-S073',r'''
          ## 73. Pre-formal Multidirection Stress / Portability Audit

