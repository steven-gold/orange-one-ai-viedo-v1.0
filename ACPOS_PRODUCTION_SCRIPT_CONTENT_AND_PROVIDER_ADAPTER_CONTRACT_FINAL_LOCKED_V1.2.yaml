normalized_instruction_contract:
  common_required:
  - canonical_instruction_id
  - department
  - task_id
  - script_view_id
  - script_view_hash
  - input_fingerprint
  - capability_requirement
  - canonical_instruction_zh_tw
  - reference_inputs
  - output_contract
  - preserve_constraints
  - forbidden_constraints
  ASSET:
    capability_resolution:
      image_generation: TEXT_TO_IMAGE
      image_correction_or_edit: IMAGE_EDIT
      voice_asset_generation: TEXT_TO_VOICE
      voice_asset_transformation: VOICE_TO_VOICE
      music_or_sfx_generation: OTHER + required additional_capability declared by enabled ProviderModelProfile
      reference_only_item: NO_PROVIDER_EXECUTION
  VIDEO:
    capability_resolution:
      new_video_generation: TEXT_TO_VIDEO
      local_video_correction_or_edit: VIDEO_EDIT
      provider_specific_scene_processing: OTHER only when enabled profile declares the exact additional_capability
  EDIT_VOICE:
    capability_resolution:
      timeline_assembly_edit: EXISTING EDIT specialized runtime; Provider Profile used only when a registered external/AI operation is invoked
      voice_generation: TEXT_TO_VOICE
      voice_transformation: VOICE_TO_VOICE
      video_or_lipsync_external_operation: VIDEO_EDIT or OTHER with exact additional_capability
      music_or_sfx_external_generation: OTHER with exact additional_capability
      subtitle_or_mix_internal_operation: Existing EDIT/VOICE runtime unless an enabled profile explicitly declares the needed capability
  CORE:
    capability_resolution:
      canonical_script_candidate_generation: TEXT_CHAT
      canonical_script_analysis_or_revision_candidate: TEXT_CHAT
    compile_rule: CORE Canonical Script authoring contract remains provider-neutral. The existing Router resolves an enabled TEXT_CHAT Provider+Model Profile;
      provider syntax is introduced only by the existing Prompt Adapter/Profile.
  STRATEGY_CENTER:
    capability_resolution:
      single_ai_strategy_response: TEXT_CHAT
      multi_ai_independent_response: TEXT_CHAT
      cross_review: TEXT_CHAT
      cross_comparison: TEXT_CHAT
      revision: TEXT_CHAT
      evidence_check: TEXT_CHAT
    canonical_context_fields:
    - ORIGINAL_USER_QUESTION
    - SHARED_STRATEGIC_CONTEXT
    - EXACT_SOURCE_FACTS_AND_EVIDENCE
    - TARGET_RESPONSE_REFS
    - REQUIRED_ANCESTRY_ONLY
    - CURRENT_USER_INSTRUCTION
    strategic_contract_refs:
    - workspace:STR-01#strategic_context_contract
    - workspace:STR-01#strategy_analysis_contract
    - workspace:STR-01#strategy_output_contract
    compile_rules:
    - The canonical strategic instruction is provider-neutral and preserves the exact user question, governed strategic context, evidence/source refs, and current
      operation type.
    - For SINGLE_AI, compile one canonical instruction through one system-resolved eligible TEXT_CHAT ProviderModelProfile.
    - For MULTI_AI independent responses, every selected participant receives the same canonical question/context/evidence basis; each participant is compiled
      separately through its own system-owned route/profile.
    - For CROSS_REVIEW/CROSS_COMPARISON/REVISION/EVIDENCE_CHECK, TARGET_RESPONSE_REFS are AI statements under review and never become SOURCE FACT merely because
      another AI cites or agrees with them.
    - Provider-specific prompt syntax exists only after the existing Provider Prompt Adapter renders the selected profile.
    - Cross-provider fallback recompiles from the same canonical strategic meaning using the target profile; compiled prompt reuse across providers is forbidden.
    response_normalization:
      required_analysis_fields_ref: workspace:STR-01#strategy_analysis_contract.mandatory_output_fields
      structured_output_contract_ref: workspace:STR-01#strategy_output_contract
      provider_brand_visibility: Brand only in conversation response UI; full model/capability details remain API Management.
      raw_ai_decision_status: NEVER_FORMAL_DECISION
    assistant_boundary: STR AI Meeting Assistant remains owned by its existing assistant/conversation runtime and secretary contract. This strategic instruction
      binding does not convert the assistant into a strategic analyst or a third AI mode.
provider_adapter_contract:
  owner: EXISTING ACPOS Provider Prompt Adapter / AI API Router / ProviderGateway
  profile_owner: admin:AIAPI-06#provider_model_profiles
  configured_profile_policy: Every enabled Provider+Model has exactly one explicit profile. No vendor/model is hardcoded in department scripts.
  configured_profiles_in_this_contract: []
  reason_no_vendor_profiles_embedded: Actual configured Provider+Model profiles are runtime/admin data. Current source authority defines the profile schema and
    shows configured_profiles as runtime-populated; this contract must not fabricate live vendor/model configurations.
  required_profile_fields:
  - provider_id
  - model_id
  - capability_type
  - adapter_type
  - base_url
  - endpoint_path
  - http_method
  - secret_env_ref
  - timeout_seconds
  - request_template
  - response_text_path
  - enabled
  - profile_version
  - prompt_template
  conditional_profile_fields:
  - preferred_language
  - max_context
  - additional_capabilities
  - data_classifications
  - supports_references
  - rights_compatible
  - health_status
  - profile_test_evidence
  adapter_types:
    OPENAI_COMPATIBLE_CHAT:
      runtime_handler: ProviderGateway.openai_compatible_chat
      request_contract:
        required_template_keys:
        - model
        - messages
        optional_template_keys:
        - temperature
        - max_tokens
        - response_format
        compile_rule: canonical instruction + scoped context -> messages; model is taken from configured profile; unsupported keys removed
    GENERIC_JSON_HTTP:
      runtime_handler: ProviderGateway.generic_json_http
      request_contract:
        required_profile_keys:
        - request_template
        - response_text_path
        compile_rule: Render the Provider+Model request_template from the approved compiled instruction and canonical context; secret is injected from secret_env_ref
          only at gateway runtime.
  canonical_placeholder_namespace:
  - '{{canonical_instruction}}'
  - '{{model_id}}'
  - '{{task_id}}'
  - '{{department}}'
  - '{{reference_inputs}}'
  - '{{output_contract}}'
  - '{{preserve_constraints}}'
  - '{{forbidden_constraints}}'
  - '{{capability_requirement}}'
  profile_prompt_rule: prompt_template MUST contain {{canonical_instruction}} and preserve canonical meaning. Provider-specific syntax belongs only to the profile
    template.
  request_template_rule: request_template may map canonical placeholders to arbitrary Provider-specific JSON keys. The department never knows those keys.
  reference_gate: If canonical instruction requires reference media, selected profile must supports_references=true and must accept the required reference media
    class; otherwise route is BLOCKED.
  rights_gate: If output requires rights-compatible route, selected profile must rights_compatible=true.
  data_classification_gate: Task data classification must be explicitly allowed by selected profile/member route.
  capability_gate: capability_type must equal required canonical capability, or required additional_capability must be explicitly declared. Silent capability
    downgrade is forbidden.
  health_test_gate: Only enabled/healthy profiles that pass existing Provider Profile test/health policy may enter production routing.
  fallback_rule: Cross-provider fallback recompiles from canonical meaning using the target Provider+Model profile. Reusing Provider A compiled prompt for Provider
    B is forbidden.
  conversion_pipeline:
  - 1 Resolve exact Department Script View/Section
  - 2 Build NormalizedInstruction from department content schema
  - 3 Resolve required capability
  - 4 Router selects eligible enabled Provider+Model profile from configured candidate group
  - 5 Provider Prompt Adapter renders profile prompt_template with canonical meaning
  - 6 Payload compiler renders adapter request using profile request_template / adapter schema
  - 7 Gateway injects secret from secret_env_ref and executes
  - 8 Response/callback is normalized and validated using existing response/error/callback contracts
  - '9 Persist lineage: canonical_instruction_id → provider_profile_id/version → compiled_prompt_hash → API_request_hash → job/result'
  mapping_completion_definition: A Provider+Model is fully mapped when its existing AIAPI-06 profile contains capability_type + adapter_type + prompt_template
    + request_template + response selector + secret reference + enabled/test/health state. No department code change is required.
acceptance:
- uid: SCRIPT-ADAPTER-ACC-01
  pass: ASSET production script has 8 deterministic content sections under its existing production role.
- uid: SCRIPT-ADAPTER-ACC-02
  pass: VIDEO production script has 8 deterministic content sections under its existing video role.
- uid: SCRIPT-ADAPTER-ACC-03
  pass: EDIT+VOICE existing 8 roles each have a field-level content schema; no new role/page is created.
- uid: SCRIPT-ADAPTER-ACC-04
  pass: Three existing CorrectionScriptCandidate flows have field-level content contracts; no second correction engine is created.
- uid: SCRIPT-ADAPTER-ACC-05
  pass: Provider translation uses only existing InstructionCompiler/Router/ProviderGateway and existing AIAPI-06 profiles.
- uid: SCRIPT-ADAPTER-ACC-06
  pass: 'Only the two existing adapter types are used: OPENAI_COMPATIBLE_CHAT and GENERIC_JSON_HTTP.'
- uid: SCRIPT-ADAPTER-ACC-07
  pass: No concrete vendor/model profile is fabricated; each actual API is mapped by one explicit enabled AIAPI-06 ProviderModelProfile.
- uid: SCRIPT-ADAPTER-ACC-08
  pass: Cross-provider fallback recompiles from canonical meaning; no raw prompt reuse.
- uid: SCRIPT-ADAPTER-ACC-09
  pass: QA is excluded from production/correction script authoring contract.
- uid: SCRIPT-ADAPTER-ACC-10
  pass: No existing department Control/Action/Gate/Port count changes.
- uid: SCRIPT-ADAPTER-ACC-11
  pass: CORE Canonical Production Script AI authoring resolves TEXT_CHAT through the same existing AIAPI-06 ProviderModelProfile registry.
- uid: SCRIPT-ADAPTER-ACC-12
  pass: CORE contains its Canonical Script content/binding contract directly; no separate CORE Script Engine authority is created.
- uid: SCRIPT-ADAPTER-ACC-13
  pass: STR-01 strategic AI uses TEXT_CHAT through the same existing AIAPI-06 ProviderModelProfile registry and Provider Prompt Adapter.
- uid: SCRIPT-ADAPTER-ACC-14
  pass: STR-01 creates no local Provider/Model picker, router, prompt compiler, provider registry, or provider-specific strategic script.
