name: Temp Authority Table Inspection

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - run: python __temp_tools__/inspect_authority_tables.py
      - run: |
          git config user.name "acpos-authority-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add __temp_reports__/authority_table_shapes.json
          git commit -m "chore(temp): inspect exact authority table shapes"
          git push
