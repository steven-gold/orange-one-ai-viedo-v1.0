name: ACPOS Post Deploy Smoke

on:
  deployment_status:
  workflow_run:
    workflows: ["ACPOS Release Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Deployment URL to smoke
        required: false
        default: https://orange-one-acpos-test.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url || 'https://orange-one-acpos-test.vercel.app' }}
      ACPOS_EXPECT_READY: "0"
      ACPOS_EXPECT_RELEASE_SHA: ${{ github.event.deployment.sha || github.event.workflow_run.head_sha || github.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate remote smoke script syntax
        run: |
          node --check scripts/post-deploy-smoke.mjs
          node --check scripts/post-deploy-browser-smoke.mjs
      - name: Run deployed ACPOS HTTP smoke
        run: node scripts/post-deploy-smoke.mjs
      - name: Install current browser audit dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run deployed ACPOS browser smoke
        run: node scripts/post-deploy-browser-smoke.mjs
