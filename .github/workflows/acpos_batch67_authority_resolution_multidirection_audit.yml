name: ACPOS Batch 67 Authority Resolution Multidirection Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch67-authority-resolution-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 66 clean Word boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="c8223a3886cc0a493bb37876651df0d06cb201be"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH66 WORD BOUNDARY"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 67 authority resolution audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch67_authority_resolution_multidirection_audit.py

      - name: Verify audit completeness
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch67_authority_resolution_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_uid_count"]>=30,s
          assert s["target_uids_found"]>0,s
          assert s["operations_found"]>0,s
          print("PASS: BATCH67 AUTHORITY RESOLUTION AUDIT")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 67 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch67-authority-resolution-multidirection-audit
          path: |
            __batch67_authority_resolution_audit.json
            __batch67_summary.json
          retention-days: 2
          if-no-files-found: error

      - name: Remove Batch 67 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch67_authority_resolution_audit.json __batch67_summary.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-67-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch67_authority_resolution_multidirection_audit.py .github/workflows/acpos_batch67_authority_resolution_multidirection_audit.yml
          git commit -m "chore(acpos): close batch 67 authority resolution audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH67 HARNESS REMOVED / CLEAN TREE"
