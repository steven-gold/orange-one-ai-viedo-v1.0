name: CORE01 Current Head Real Flow E2E Retry Once
on:
  push:
    branches: [new]
    paths:
      - .github/workflows/core01-current-head-real-flow-e2e-retry-once.yml
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Assert workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/core01-current-head-real-flow-e2e-retry-once.yml"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          echo PRODUCT_UNCHANGED_BEFORE_RETRY
      - name: Runner-only IAM substitute
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/domain/core/coreCreationPermissionAdapter.ts'); s=p.read_text()
          old='if (!current) return { allowed: false, reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND", required_permission_uid };'
          assert old in s; p.write_text(s.replace(old,'if (!current) return { allowed: true, required_permission_uid };',1))
          p=Path('src/server/testing/controlledCoreTestRuntime.ts'); s=p.read_text()
          old='''    authorize: async (request) => {\n      if (request.port_uid === "CORE-01-PORT-PROJECT-CREATE" || request.port_uid === "CORE-01-PORT-TOPIC-CREATE") {\n        return { allowed: false, reason_code: "IAM_ACCOUNT_PERMISSION_RUNTIME_NOT_BOUND" };\n      }\n      return { allowed: true };\n    },\n'''
          assert old in s; p.write_text(s.replace(old,'    authorize: async () => ({ allowed: true }),\n',1))
          PY
          git diff --check
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json >/tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json');if(a.metadata.vulnerabilities.total)process.exit(1);console.log('AUDIT_ZERO_PASS')"
          npm run typecheck
          npm run build
      - name: Browser
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          nohup npm run start -- -p 3000 >/tmp/core-next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/core >/dev/null && break; sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const A=(v,m)=>{if(!v)throw new Error(m)};
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({permissions:['clipboard-read','clipboard-write']});
            const p=await c.newPage();
            const errors=[],fails=[],controls=new Set(),actions=new Set();
            p.on('pageerror',e=>errors.push(String(e))); p.on('requestfailed',r=>fails.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            const cap=async()=>{for(const x of await p.locator('[data-control-id]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-control-id')).filter(Boolean)))controls.add(x);for(const x of await p.locator('[data-action-uid]').evaluateAll(ns=>ns.map(n=>n.getAttribute('data-action-uid')).filter(Boolean)))actions.add(x)};
            const click=async id=>{const n=p.locator(`[data-control-id="${id}"]`).first();await n.waitFor({state:'visible'});await n.click({timeout:10000})};
            const waitIdle=async()=>p.waitForFunction(()=>Array.from(document.querySelectorAll('button[data-control-id]')).every(b=>!b.disabled),null,{timeout:10000}).catch(()=>{});
            const text=async(s,t)=>p.waitForFunction(([a,b])=>(document.querySelector(a)?.textContent||'').includes(b),[s,t]);
            const reason=async x=>p.waitForFunction(v=>(document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')||'').startsWith(v),x);
            const snap=async label=>{const buttons=await p.locator('button[data-control-id]').evaluateAll(ns=>ns.map(n=>({id:n.getAttribute('data-control-id'),disabled:n.disabled,action:n.getAttribute('data-action-uid'),runtime:n.getAttribute('data-runtime-binding')})));const out={projectOptions:await p.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count(),topicOptions:await p.locator('[data-control-id="CORE-01-CTL-TOPIC"] option').count(),threadOptions:await p.locator('[data-control-id="CORE-01-LST-THREADS"] select option').count(),workOptions:await p.locator('[data-control-id="CORE-01-LST-WORK-ITEMS"] select option').count(),buttons};console.log(`STATE_${label}=${JSON.stringify(out)}`)};
            const menu=async()=>{const n=p.locator('[data-message-role="USER"]').first();await n.waitFor({state:'visible'});await n.click({button:'right'});await p.locator('[data-component-uid="CORE-01-CMP-MESSAGE-MENU"] [data-control-id="CORE-01-MENU-QUOTE"]').waitFor({state:'visible'});await cap()};
            await p.goto('http://127.0.0.1:3000/core',{waitUntil:'networkidle'}); await p.locator('[data-page-uid="CORE-01"][data-page-state="READY"]').waitFor(); await cap(); await snap('EMPTY');
            await click('CORE-01-BTN-PROJECT-CREATE'); await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-CTL-PROJECT"] option').length>1); await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','[TEST] DRAFT'); await waitIdle(); await snap('PROJECT_CREATED');
            await click('CORE-01-BTN-PROJECT-VALIDATE'); await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','VALIDATED'); await waitIdle();
            await click('CORE-01-BTN-PROJECT-CONFIRM'); await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','CORE_MODELING'); await waitIdle();
            await click('CORE-01-BTN-STORY-CANDIDATE'); await text('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]','TEST-STORY-SET-'); await waitIdle();
            await click('CORE-01-BTN-NEW-THREAD'); await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-LST-THREADS"] select option').length>1); await waitIdle();
            await click('CORE-01-BTN-MULTI-AI'); await reason('AI_MODE=MULTI'); await click('CORE-01-BTN-SINGLE-AI'); await reason('AI_MODE=SINGLE');
            await click('CORE-01-BTN-ASSISTANT-RECORD'); await p.locator('[data-assistant-record-overlay="true"]').waitFor(); await click('CORE-01-BTN-ASSISTANT-RECORD');
            await click('CORE-01-BTN-ATTACHMENT'); await reason('ATTACHMENT_ATTACHED:TEST-CORE-ATTACHMENT-'); await click('CORE-01-BTN-REFERENCE'); await reason('REFERENCE_ATTACHED:TEST-CORE-REFERENCE-');
            await p.locator('[data-control-id="CORE-01-FLD-MESSAGE"]').fill('@Assistant current head real flow'); await click('CORE-01-BTN-SEND'); await p.locator('[data-message-role="USER"]').waitFor(); await p.locator('[data-message-role="SIMULATED_AI"]').waitFor(); await text('[data-control-id="CORE-01-FLD-ASSISTANT-SUMMARY"]','SIMULATED_EXTERNAL'); await waitIdle();
            await menu(); await click('CORE-01-MENU-QUOTE'); await reason('MESSAGE_QUOTED:TEST-MSG-'); await menu(); await click('CORE-01-MENU-CONTINUE'); await reason('MESSAGE_CONTEXT_CONTINUED:TEST-MSG-'); await menu(); await click('CORE-01-MENU-DECISION'); await reason('DECISION_EVIDENCE_ADDED:TEST-MSG-'); await menu(); await click('CORE-01-MENU-COPY'); await reason('MESSAGE_COPIED:TEST-MSG-'); await menu(); let n=await p.locator('[data-message-role="SIMULATED_AI"]').count(); await click('CORE-01-MENU-ANALYZE'); await p.waitForFunction(x=>document.querySelectorAll('[data-message-role="SIMULATED_AI"]').length>x,n); await waitIdle(); await menu(); await click('CORE-01-MENU-BRANCH'); await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-LST-THREADS"] select option').length>=3); await waitIdle(); A(await p.locator('[data-message-role]').count()===0,'branch history leak');
            await p.locator('[data-control-id="CORE-01-FLD-HUMAN-DECISION"]').fill('TEST decision'); await click('CORE-01-BTN-CANDIDATE-CREATE'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','CANDIDATE'); await waitIdle(); await click('CORE-01-BTN-CANDIDATE-COMPARE'); await text('[data-candidate-compare-read-model="true"]','[TEST] Compared 1 exact candidate'); await waitIdle(); await click('CORE-01-BTN-RETURN-MODIFY'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','RETURNED'); await waitIdle(); await click('CORE-01-BTN-CANDIDATE-CREATE'); await p.waitForFunction(()=>{const v=document.querySelector('[data-control-id="CORE-01-FLD-VERSION-STATE"]')?.textContent||'';return v.includes('CANDIDATE')&&!Array.from(document.querySelectorAll('button[data-control-id]')).some(b=>b.disabled)}); await click('CORE-01-BTN-CANDIDATE-CONFIRM'); await text('[data-control-id="CORE-01-FLD-VERSION-STATE"]','ACCEPTED'); await waitIdle();
            await click('CORE-01-BTN-DNA-LOCK'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','DNA_LOCK_REVIEW_REQUESTED'); await waitIdle(); await click('CORE-01-BTN-CORE-REVIEW'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','CORE_REVIEW_REQUESTED'); await waitIdle(); await click('CORE-01-BTN-PROJECT-LOCK'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','MOTHER_LOCK_REVIEW_REQUESTED'); await waitIdle();
            await click('CORE-01-BTN-TOPIC-CREATE'); await p.waitForFunction(()=>document.querySelectorAll('[data-control-id="CORE-01-CTL-TOPIC"] option').length>1); await text('[data-control-id="CORE-01-FLD-PAGE-MODE"]','TOPIC_PRODUCTION'); await waitIdle(); await snap('TOPIC_CREATED');
            await click('CORE-01-BTN-BLUEPRINT-CREATE'); await text('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]','BLUEPRINT_DRAFT'); await waitIdle(); await click('CORE-01-BTN-BLUEPRINT-VALIDATE'); await text('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]','BLUEPRINT_REVIEW'); await waitIdle(); await click('CORE-01-BTN-BLUEPRINT-APPROVE'); await text('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]','READY_FOR_CHILD_REVIEW'); await waitIdle(); await click('CORE-01-BTN-CHILD-LOCK'); await text('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]','CHILD_LOCK_REVIEW_REQUESTED'); await waitIdle(); await click('CORE-01-BTN-CANONICAL-SCRIPT'); await text('[data-control-id="CORE-01-FLD-PACKAGE"]','[TEST] Canonical Script Bound'); await waitIdle();
            await cap(); A(controls.size===50,`controls ${controls.size}/50`); A(actions.size===34,`actions ${actions.size}/34`); A(errors.length===0,`page errors ${errors}`); A(fails.length===0,`request failures ${fails}`); console.log(`CORE01_CURRENT_HEAD_REAL_FLOW_PASS controls=${controls.size} actions=${actions.size}`); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Restore and prove no product changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/core01-current-head-real-flow-e2e-retry-once.yml"
          echo PRODUCT_TREE_UNCHANGED_AFTER_RETRY
      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          if [ -f .github/workflows/core01-current-head-real-flow-e2e-retry-once.yml ]; then
            git rm -f .github/workflows/core01-current-head-real-flow-e2e-retry-once.yml
            git commit -m "chore: remove CORE01 current head real flow retry workflow"
            git push origin new
          fi
