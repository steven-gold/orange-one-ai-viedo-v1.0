name: Stage-03 Visual Governance Promotion Closure

"on":
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - governance/test/spec_change_authorizations/USR-DIRECTIVE-20260920-STAGE03-VISUAL-MATERIALIZATION-HARDENING-R2.yaml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage03-gov-r2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install governance dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock authorization parent SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Promote v2.2.15 with pre-push mutation guard
        run: python .github/governance-maintenance/promote_stage03_visual_materialization_governance_r2.py
