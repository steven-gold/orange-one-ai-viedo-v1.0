name: Semantic Baseline Consumer Sync

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/sync_semantic_baseline_consumer.py'

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message == 'chore(governance): stage semantic baseline consumer sync' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify authorization and run atomic consumer sync
        run: |
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260919-MOTHER-PROMOTION-ATOMIC-SYNC-REPAIR-R2.yaml
          python .github/governance-maintenance/sync_semantic_baseline_consumer.py
      - name: Validate hygiene
        run: |
          git diff --check
          test ! -d governance/test/temporary
      - name: Persist sync
        run: |
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "fix(governance): synchronize semantic baseline program guard consumer" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260919-MOTHER-PROMOTION-ATOMIC-SYNC-REPAIR-R2"
          git push origin HEAD:rebuild-v2.1.1
