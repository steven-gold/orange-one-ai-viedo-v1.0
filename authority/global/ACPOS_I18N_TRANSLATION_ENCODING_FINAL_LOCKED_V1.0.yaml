runtime_encoding:
  locale_type: 'zh-TW | zh-CN | en'
  storage_key: acpos.locale
  initial_resolution_order:
    - persisted_valid_locale
    - zh-TW
  switching_behavior: Re-render visible UI from the same translation catalog; do not reload or mutate business data solely because locale changed.
  business_value_preservation: true
  fixed_term_preservation: true
  unsupported_locale: BLOCK
  missing_key: BLOCK
  translation_key_audit_required: true

construction_acceptance:
  - Exactly three supported locales: zh-TW, zh-CN, en.
  - ORANGE ONE remains unchanged in all locales.
  - Registered fixed terms remain unchanged.
  - No visible UI string bypasses the translation catalog except user/business/external-source data and registered fixed terms.
  - No future page keys are fabricated before that page enters construction.
  - Missing key cannot silently fall back to another language.
