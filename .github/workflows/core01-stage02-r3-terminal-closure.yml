name: CORE-01 Stage-02 R3 Terminal Closure

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/governance-maintenance/close_core01_stage02_r3.py'

permissions:
  contents: write
  actions: read

jobs:
  close-stage02:
    if: "${{ github.event.head_commit.message == 'test(core01): close Stage-02 R3 after terminal validation' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Compile closure helper
        run: python -m py_compile .github/governance-maintenance/close_core01_stage02_r3.py
      - name: Close Stage-02 from exact terminal evidence
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
        run: python .github/governance-maintenance/close_core01_stage02_r3.py
      - name: Validate closed Current state before persistence
        run: |
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_profile_history_binding.py
          python governance/test/validate_selected_profile_finding_closure.py
      - name: Verify closure hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d governance/test/temporary
          test ! -e 00_SOURCE_INTAKE/fresh_run_005/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01
          test "$(git rev-parse HEAD:00_SOURCE_INTAKE/fresh_run_005/00_SOURCE_INTAKE/RAW_SOURCE/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml)" = "9490f3bcc28c5511bc04d6c3ce53c026e3c4667f"
      - name: Persist Stage-02 terminal closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          test -n "$(git diff --cached --name-only)" || { echo 'BLOCK: no closure changes staged' >&2; exit 1; }
          git commit -m "test(core01): persist verified Stage-02 R3 terminal closure" \
            -m "Execution-Authorization: USR-DIRECTIVE-20260919-COMPLETE-CORE01-STAGE02-R3" \
            -m "Scope: CORE-01 Stage-02 closed; Stage-03 not started"
          git push origin HEAD:rebuild-v2.1.1
