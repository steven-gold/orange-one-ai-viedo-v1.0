page_contract:
  purpose: 管理 Criteria Version、Dimension、Threshold、Department Applicability、Required Check、Gate Policy 與 Approval；作為後台 Review Standard / QA 審查項目治理面，不是專案
    pending QA queue。
  review_standard_semantics:
    is_project_pending_queue: false
    is_runtime_qa_workspace: false
    governs_review_standards: true
    historical_review_criteria_must_remain_reproducible: true
  data_bindings:
  - criteria_versions
  - dimensions
  - policies
  - mappings
  - approvals
  allowed_action_ids:
  - ACT-CONFIGURE
  - ACT-APPROVE
  - ACT-NAV-OPEN
  page_permissions:
  - quality.criteria.configure
  - quality.criteria.approve
  expected_control_count: 11
quality_governance_contract:
  owner: QualityGovernance
  objects:
  - quality_criteria_version
  - quality_gate_policy
  - dimension_library
  - required_check
  - threshold
  - department_mapping
  lifecycle:
  - DRAFT
  - REVIEW
  - APPROVED
  - ACTIVE
  - SUPERSEDED
  - RETIRED
  hard_rule: 品質門檻不可硬編碼；任何變動需版本、Impact、Approval 與受影響任務 Revalidation。
  criteria_version_policy:
    active_criteria_immutable: true
    criteria_change_requires_approved_new_version: true
    historical_result_retains_original_criteria_version: true
