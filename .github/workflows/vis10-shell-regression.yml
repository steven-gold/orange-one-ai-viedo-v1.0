name: VIS-10 global shell regression
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-shell-regression.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Next build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium --with-deps
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/vis10-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/admin/system >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vis10-next.log
          exit 1
      - name: Validate all front routes and SYS-01
        run: node .acpos-temp/vis10-shell-regression.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: vis10-shell-regression-evidence
          path: |
            docs/construction/evidence/VIS-10/vis10-final-*.png
            docs/construction/evidence/VIS-10/vis10-final-regression.json
          if-no-files-found: error
      - name: Commit exact evidence and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/evidence/VIS-10/vis10-final-1440-collapsed.png \
                  docs/construction/evidence/VIS-10/vis10-final-1440-expanded.png \
                  docs/construction/evidence/VIS-10/vis10-final-1440-bottom.png \
                  docs/construction/evidence/VIS-10/vis10-final-1200.png \
                  docs/construction/evidence/VIS-10/vis10-final-front-admin-entry.png \
                  docs/construction/evidence/VIS-10/vis10-final-regression.json
          git commit -m "test(vis10): persist final Global Shell and SYS-01 regression evidence"
          git rm .github/workflows/vis10-shell-regression.yml .acpos-temp/vis10-shell-regression.cjs
          git commit -m "chore(vis10): remove temporary shell regression tools"
          git push origin HEAD:acpos-vis10-staging
