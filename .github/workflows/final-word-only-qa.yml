name: Final Word-Only QA

on:
  push:
    branches: [0921acpos]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DOCX and render tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          python -m pip install --quiet python-docx pillow

      - name: Structural and semantic QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          from docx import Document

          ROOT=Path('.')
          MARK='ACPOS-20260921-SOURCE-GROUNDED-CONSTRUCTION-CLOSURE-V2'
          expected={
            'ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':14,
            'ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':50,
            'ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':85,
            'ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':85,
            'ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':160,
            'ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':87,
            'ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':49,
            'ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':57,
            'ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':66,
            'ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx':12,
            'ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx':14,
            'ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx':22,
            'ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx':67,
            'ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx':42,
            'ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx':17,
            'ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx':11,
            'ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx':19,
            'ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx':27,
          }
          parents=sorted(ROOT.glob('0[1-9]_ACPOS_*.docx'))
          index=ROOT/'00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx'
          all_docs=sorted(ROOT.glob('*.docx'))

          assert len(all_docs)==31, len(all_docs)
          assert len(parents)==9, len(parents)
          assert len(expected)==18

          bad=[]
          page_results={}
          for fn,denom in expected.items():
              p=ROOT/fn
              assert p.exists(), fn
              d=Document(p)
              para='\n'.join(x.text for x in d.paragraphs)
              assert MARK in para, (fn,'marker')
              found=None
              matrix_rows=None
              runtime_bad=[]
              for t in d.tables:
                  rr=[[c.text.strip() for c in r.cells] for r in t.rows]
                  if not rr: continue
                  hdr=rr[0]
                  if hdr==['Authority','Value']:
                      m={r[0]:r[1] for r in rr[1:] if len(r)>=2}
                      if 'Expected Control Denominator' in m:
                          found=m
                  if 'Control UID' in hdr and 'Runtime Status' in hdr and 'Method / Path' in hdr:
                      hm={x:i for i,x in enumerate(hdr)}
                      data=[r for r in rr[1:] if any(c.strip() for c in r)]
                      if matrix_rows is None or len(data)>matrix_rows:
                          matrix_rows=len(data)
                      for r in data:
                          status=r[hm['Runtime Status']].strip()
                          method=r[hm['Method / Path']].strip()
                          effect=r[hm['Action UID']].strip()+' '+r[hm['Label']].strip()
                          if status=='UI_LOCAL_EXACT' and re.match(r'^(POST|PATCH|PUT|DELETE)\b',method,re.I):
                              runtime_bad.append((r[hm['Control UID']],status,method))
                          if status=='READ_EXACT' and re.match(r'^(POST|PATCH|PUT|DELETE)\b',method,re.I):
                              runtime_bad.append((r[hm['Control UID']],status,method))
              assert found is not None,(fn,'authority table')
              assert int(found['Expected Control Denominator'])==denom,(fn,found)
              assert int(found['Unique Control Rows'])==denom,(fn,found)
              assert found['Denominator Gate']=='PASS',(fn,found)
              assert matrix_rows==denom,(fn,'matrix_rows',matrix_rows,'expected',denom)
              assert not runtime_bad,(fn,runtime_bad[:10])
              page_results[fn]={'denominator':denom,'matrix_rows':matrix_rows,'status':'PASS'}

          for p in parents:
              d=Document(p)
              text='\n'.join(x.text for x in d.paragraphs)
              assert MARK in text,p.name
              for forbidden in [
                  'ACPOS-20260921-EXACT-BINDING-CLOSURE',
                  'UNIFIED-CONTROL-RUNTIME-MATRIX-V3',
                  'ACPOS-20260921-SOURCE-GROUNDED-CONSTRUCTION-CLOSURE-V1',
                  'CONV_UI_INITIAL_LOAD_MESSAGES',
                  'CONV_UI_LAZY_LOAD_MESSAGES',
                  'CONV_CONTEXT_INPUT_HARD_CAP_TOKENS',
                  'CONV_RETENTION_AFTER_PROJECT_CLOSE_DAYS',
              ]:
                  assert forbidden not in text,(p.name,forbidden)

          # Runtime truth: unsupported old values must be replaced by exact source values or explicit not-defined.
          d2=Document([p for p in parents if p.name.startswith('02_')][0])
          t2='\n'.join([x.text for x in d2.paragraphs]+[c.text for t in d2.tables for r in t.rows for c in r.cells])
          for key,val in [
            ('CONVERSATION_RECENT_HISTORY_ROWS','30'),
            ('CONVERSATION_RECENT_HISTORY_TEXT_CHARS','2200'),
            ('CONVERSATION_DECISION_LEDGER_QUERY_LIMIT','80'),
            ('CONVERSATION_EXACT_SOURCE_MESSAGE_TEXT_CHARS','4000'),
            ('CONVERSATION_UI_INITIAL_VISIBLE_MESSAGES','SOURCE_NOT_DEFINED'),
            ('CONVERSATION_UI_LAZY_LOAD_PAGE_SIZE','SOURCE_NOT_DEFINED'),
            ('CONVERSATION_SUMMARY_TRIGGER','SOURCE_NOT_DEFINED'),
            ('CONVERSATION_RETENTION_TTL','SOURCE_NOT_DEFINED'),
          ]:
              assert key in t2,(key,'missing')
              assert re.search(re.escape(key)+r'.{0,220}'+re.escape(val),t2,re.S),(key,val)

          d3=Document([p for p in parents if p.name.startswith('03_')][0])
          t3='\n'.join([x.text for x in d3.paragraphs]+[c.text for t in d3.tables for r in t.rows for c in r.cells])
          for key,val in [
            ('PROVIDER_QUEUE_CAPACITY','100'),
            ('PROVIDER_QUEUE_MAX_ATTEMPTS','3'),
            ('PROVIDER_QUEUE_LEASE_SECONDS','120'),
            ('PROVIDER_QUEUE_BACKOFF_SECONDS','30,120,300'),
            ('PROVIDER_WORKER_MAX_BATCH','10'),
            ('PROVIDER_PROFILE_TIMEOUT_SECONDS','DYNAMIC_REQUIRED_PROFILE_VALUE'),
          ]:
              assert key in t3,(key,'missing')
              assert re.search(re.escape(key)+r'.{0,220}'+re.escape(val),t3,re.S),(key,val)

          # Known truth boundaries must remain visible, not silently converted to PASS.
          checks={
            'ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx':['NOT_EXECUTED'],
            'ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx':['NOT_EXECUTED'],
            'ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx':['saveDraft','exportProjection','createCandidate','compareCandidates','rejectStrategyCandidate','adoptAsContextCandidate','runtime-blocked'],
            'ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':['160 Controls','124 Actions','22 Integration Ports','20 unique port operations'],
            'ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx':['api:decideLockReview','LOCK_EVIDENCE_REQUIRED','reviewer_path'],
          }
          for fn,needles in checks.items():
              d=Document(ROOT/fn)
              text='\n'.join([x.text for x in d.paragraphs]+[c.text for t in d.tables for r in t.rows for c in r.cells])
              for n in needles:
                  assert n in text,(fn,n)

          # Index must carry V2 marker and all 18 denominator rows.
          di=Document(index)
          itext='\n'.join([x.text for x in di.paragraphs]+[c.text for t in di.tables for r in t.rows for c in r.cells])
          assert MARK in itext
          for denom in expected.values():
              assert str(denom) in itext

          result={'docx_count':31,'parent_docs':9,'page_docs':18,'page_results':page_results,'semantic_status':'PASS'}
          Path('qa').mkdir(exist_ok=True)
          Path('qa/semantic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          print('PASS: FINAL STRUCTURAL + SEMANTIC QA')
          PY

      - name: LibreOffice render QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          from PIL import Image,ImageChops

          root=Path('.')
          qa=Path('qa')
          pdf=qa/'pdf'; png=qa/'png'
          pdf.mkdir(parents=True,exist_ok=True); png.mkdir(parents=True,exist_ok=True)

          # 28 documents changed by the source-grounded closure.
          docs=[
            root/'00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx',
            *sorted(root.glob('0[1-9]_ACPOS_*.docx')),
            root/'ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx',
            root/'ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx',
            root/'ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx',
          ]
          assert len(docs)==28
          report={'documents':{},'total_pages':0,'blank_pages':[],'edge_touch_pages':[]}
          for doc in docs:
              subprocess.run(['libreoffice','--headless','--convert-to','pdf','--outdir',str(pdf),str(doc)],check=True,stdout=subprocess.DEVNULL)
              p=pdf/(doc.stem+'.pdf')
              info=subprocess.check_output(['pdfinfo',str(p)],text=True,errors='replace')
              pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              od=png/doc.stem; od.mkdir(parents=True,exist_ok=True)
              subprocess.run(['pdftoppm','-f','1','-l',str(pages),'-png','-r','72',str(p),str(od/'page')],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob('page-*.png'))
              assert len(imgs)==pages,(doc.name,pages,len(imgs))
              blank=[];edge=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert('RGB')
                  diff=ImageChops.difference(im,Image.new('RGB',im.size,'white'))
                  bb=diff.getbbox()
                  if bb is None:
                      blank.append(i); continue
                  l,t,r,b=bb
                  if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:
                      edge.append(i)
              report['documents'][doc.name]={'pages':pages,'blank':blank,'edge_touch':edge,'pdf_bytes':p.stat().st_size}
              report['total_pages']+=pages
              report['blank_pages'] += [[doc.name,x] for x in blank]
              report['edge_touch_pages'] += [[doc.name,x] for x in edge]

          # Blank or page-edge collision is a hard failure for final render QA.
          assert not report['blank_pages'],report['blank_pages'][:20]
          assert not report['edge_touch_pages'],report['edge_touch_pages'][:20]
          (qa/'render.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'documents':len(report['documents']),'total_pages':report['total_pages'],'blank_pages':0,'edge_touch_pages':0},ensure_ascii=False))
          print('PASS: FINAL LIBREOFFICE RENDER QA')
          PY
