            '{ id: "EDIT-01-CTL-RULER", kind: "overview" }':'{ id: "EDIT-01-CTL-RULER", kind: "timeline" }',
            '{ id: "EDIT-01-CTL-PLAYHEAD", kind: "overview" }':'{ id: "EDIT-01-CTL-PLAYHEAD", kind: "timeline" }',
            '{ id: "EDIT-01-CTL-MARKER-RAIL", kind: "overview" }':'{ id: "EDIT-01-CTL-MARKER-RAIL", kind: "timeline" }',
            '{ id: "EDIT-01-FLD-API-PROVIDER", kind: "readonly" }':'{ id: "EDIT-01-FLD-API-PROVIDER", kind: "mode-select" }',
