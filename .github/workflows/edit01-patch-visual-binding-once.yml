name: EDIT01 Patch Visual Binding Once
on:
  push:
    branches: [edit01-functional-staging]
    paths: ['.github/workflows/edit01-patch-visual-binding-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit01-functional-staging
          fetch-depth: 0
      - name: Bind existing visual regions to runtime and self-clean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/EditVisual.tsx')
          s=p.read_text()
          replacements=[
          ('import { EditRuntimeControl, EditRuntimeProvider } from "./EditControlRuntime";','import { EditRuntimeControl, EditRuntimeProvider, useEditRuntimeState } from "./EditControlRuntime";'),
          ('export function EditVisual() {\n  const { locale } = useI18n();','export function EditVisual() { return <EditRuntimeProvider><EditVisualBody /></EditRuntimeProvider>; }\n\nfunction EditVisualBody() {\n  const { state } = useEditRuntimeState();\n  const { locale } = useI18n();'),
          ('return <EditRuntimeProvider><div className={styles.page} data-page-uid="EDIT-01" data-vis-step="VIS-05" data-page-state="EMPTY" data-authority-controls="160" data-registry-valid={registryValid ? "true" : "false"}>','return <div className={styles.page} data-page-uid="EDIT-01" data-vis-step="VIS-05" data-page-state={state.resolved.page_state_uid ?? "EDIT-01-ST-PAGE-EMPTY"} data-current-stage={state.resolved.current_stage_uid ?? undefined} data-stage-phase={state.resolved.current_stage_phase ?? undefined} data-authority-controls="160" data-registry-valid={registryValid ? "true" : "false"}>'),
          ('<div className={styles.bindingCards}>{["Blueprint / Script", "DNA", "Asset ID / Version", "Filename / Checksum", "Binding Status"].map((label) => <div className={styles.bindingCard} key={label}><span>{label}</span><strong>—</strong></div>)}</div>','<div className={styles.bindingCards}><div className={styles.bindingCard}><span>Blueprint</span><strong>{state.resolved.locked_blueprint_ref ?? "—"}</strong></div><div className={styles.bindingCard}><span>Production Package</span><strong>{state.resolved.production_package_ref ?? "—"}</strong></div><div className={styles.bindingCard}><span>Input Manifest</span><strong>{state.resolved.input_manifest_ref ?? "—"}</strong></div><div className={styles.bindingCard}><span>Input Fingerprint</span><strong>{state.resolved.input_fingerprint ?? "—"}</strong></div><div className={styles.bindingCard}><span>Binding Status</span><strong>{state.resolved.gate_state["EDIT-01-GATE-BINDING-INTEGRITY"] ? "BOUND" : "—"}</strong></div></div>'),
          ('<div className={styles.hiddenRegistry} aria-hidden="true">{mediaConditional.map((spec) => <Control key={spec.id} spec={spec} />)}</div>','<div className={state.source_mode === "STANDALONE_UPLOAD" ? styles.stack : styles.hiddenRegistry} aria-hidden={state.source_mode === "STANDALONE_UPLOAD" ? undefined : "true"}>{mediaConditional.map((spec) => <Control key={spec.id} spec={spec} />)}</div>'),
          ('<div className={styles.viewer} data-component-uid="EDIT-01-CMP-PREVIEW">—</div>','<div className={styles.viewer} data-component-uid="EDIT-01-CMP-PREVIEW" data-preview-ref={state.resolved.preview_uri ?? undefined}>{state.resolved.preview_uri ?? "—"}</div>'),
          ('<div className={styles.conditionNotice}>{editUiText(locale, "correctionUnavailable")}</div>\n        <div className={styles.hiddenRegistry} aria-hidden="true">{apiConditional.map((spec) => <Control key={spec.id} spec={spec} />)}</div>','{state.resolved.gate_state["EDIT-01-GATE-CORRECTION"] ? null : <div className={styles.conditionNotice}>{editUiText(locale, "correctionUnavailable")}</div>}\n        <div className={state.resolved.gate_state["EDIT-01-GATE-CORRECTION"] ? styles.stack : styles.hiddenRegistry} aria-hidden={state.resolved.gate_state["EDIT-01-GATE-CORRECTION"] ? undefined : "true"}>{apiConditional.map((spec) => <Control key={spec.id} spec={spec} />)}</div>'),
          ('<div className={styles.hiddenRegistry} aria-hidden="true">\n          <section data-section-id="EDIT-01-SEC-09" data-component-uid="EDIT-01-CMP-VOICE">{VOICE.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n          <section data-section-id="EDIT-01-SEC-10" data-component-uid="EDIT-01-CMP-AUDIO">{AUDIO.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n          <section data-section-id="EDIT-01-SEC-11" data-component-uid="EDIT-01-CMP-LIPSYNC">{LIPSYNC.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n          <section data-section-id="EDIT-01-SEC-12" data-component-uid="EDIT-01-CMP-SUBTITLE">{SUBTITLE.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n        </div>','<section className={state.inspector_tab === "VOICE" ? styles.inspectorGrid : styles.hiddenRegistry} aria-hidden={state.inspector_tab === "VOICE" ? undefined : "true"} data-section-id="EDIT-01-SEC-09" data-component-uid="EDIT-01-CMP-VOICE">{VOICE.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n        <section className={state.inspector_tab === "AUDIO" ? styles.inspectorGrid : styles.hiddenRegistry} aria-hidden={state.inspector_tab === "AUDIO" ? undefined : "true"} data-section-id="EDIT-01-SEC-10" data-component-uid="EDIT-01-CMP-AUDIO">{AUDIO.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n        <section className={state.inspector_tab === "LIPSYNC" ? styles.inspectorGrid : styles.hiddenRegistry} aria-hidden={state.inspector_tab === "LIPSYNC" ? undefined : "true"} data-section-id="EDIT-01-SEC-11" data-component-uid="EDIT-01-CMP-LIPSYNC">{LIPSYNC.map((spec) => <Control key={spec.id} spec={spec} />)}</section>\n        <section className={state.inspector_tab === "SUBTITLE" ? styles.inspectorGrid : styles.hiddenRegistry} aria-hidden={state.inspector_tab === "SUBTITLE" ? undefined : "true"} data-section-id="EDIT-01-SEC-12" data-component-uid="EDIT-01-CMP-SUBTITLE">{SUBTITLE.map((spec) => <Control key={spec.id} spec={spec} />)}</section>'),
          ('<div className={styles.stageRail} data-section-id="EDIT-01-SEC-16" data-component-uid="EDIT-01-CMP-STAGE-RAIL">{STAGES.map((stage, index) => <div key={stage} data-stage-uid={stage}><span>{index + 1}</span><strong>{stage.replace("EDIT-01-STAGE-", "")}</strong><em>—</em></div>)}</div>','<div className={styles.stageRail} data-section-id="EDIT-01-SEC-16" data-component-uid="EDIT-01-CMP-STAGE-RAIL">{STAGES.map((stage, index) => <div key={stage} data-stage-uid={stage} data-stage-active={state.resolved.current_stage_uid === stage ? "true" : undefined}><span>{index + 1}</span><strong>{stage.replace("EDIT-01-STAGE-", "")}</strong><em>{state.resolved.current_stage_uid === stage ? state.resolved.current_stage_phase ?? "—" : "—"}</em></div>)}</div>'),
          ('</div></EditRuntimeProvider>;\n}','</div>;\n}')]
          for old,new in replacements:
              if old not in s: raise SystemExit('TARGET_NOT_FOUND: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          test "$(git hash-object src/components/pages/EditVisual.module.css)" = "6ec980b81fb6930a019d2b9ee6168e9d0f6f1d4e"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/edit01-patch-visual-binding-once.yml
          git add src/components/pages/EditVisual.tsx
          git commit -m 'feat(edit): bind EDIT-01 locked visual regions to runtime state'
          git push origin HEAD:edit01-functional-staging
