name: IAM-01 validation assertion fix

on:
  push:
    branches:
      - acpos-iam01-closure-20260903

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-iam01-closure-20260903
      - name: Guard
        id: guard
        run: |
          msg=$(git log -1 --format=%s)
          if [ "$msg" = "chore(iam): add one-time validation assertion fix" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - name: Fix validation assertion
        if: steps.guard.outputs.run == 'yes'
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/iam01-closure-validation-once.yml')
          s=p.read_text()
          old="          assert 'explicit_confirmation' in clienttest and 'previewAuthorizationImpact' in clienttest\n"
          new="          assert 'explicit_confirmation' in clienttest and '/authorization-impact' in clienttest and 'previewAuthorizationImpact' in servertest\n"
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Commit
        if: steps.guard.outputs.run == 'yes'
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add .github/workflows/iam01-closure-validation-once.yml
          git commit -m "test(iam): correct operation coverage assertion"
          git push origin HEAD:acpos-iam01-closure-20260903
