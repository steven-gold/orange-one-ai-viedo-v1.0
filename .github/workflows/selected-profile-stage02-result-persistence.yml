name: Persist Selected Profile Stage02 Current Evidence

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/selected-profile-stage02-result-persistence.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Download exact successful fresh evidence
        run: |
          rm -rf /tmp/stage02-current-evidence
          mkdir -p /tmp/stage02-current-evidence
          gh run download 35040165635 -n stage02-actual-test-evidence -D /tmp/stage02-current-evidence
          test -f /tmp/stage02-current-evidence/.github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json
      - name: Persist exact evidence and synchronize active projections
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, yaml

          ROOT = Path('.')
          source = Path('/tmp/stage02-current-evidence/.github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json')
          raw = source.read_bytes()
          evidence = json.loads(raw)
          CURRENT_UID = 'GOV-REV-20260916-FULL-LINE-SOURCE-INTEGRITY-CLOSURE'
          ATTEMPT = 'STAGE02-FRESH-20260916-003'
          SOURCE_SHA = '312c06a3dddb2509d884a5f1ef6f636d893e9826'
          RUN_ID = 35040165635
          ARTIFACT_ID = 10424976911
          ARTIFACT_SHA = '823b91f54ae1f082f7e036da0a0f7dbfecc03c75ca8e8f9984ff04837fc7ad64'

          expected = {
              'artifact_type': 'NON_NORMATIVE_STAGE02_ACTUAL_TEST_EVIDENCE',
              'stage_uid': 'STAGE-02',
              'source_head_sha': SOURCE_SHA,
              'actual_product_stage_test_started': True,
              'actual_product_stage_test_completed': True,
              'result': 'BLOCKED',
              'fresh_functional_gap_total': 150,
              'closure_blocker_total': 13,
              'preserved_external_authority_union_count': 8,
              'current_specification_mutated': False,
              'ai_autofill_used': False,
              'inference_used': False,
              'prior_stage2_results_used': False,
              'stage_exit_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
              'physical_stage2_product_artifact_root_present': False,
          }
          for k, v in expected.items():
              assert evidence.get(k) == v, (k, evidence.get(k), v)
          pages = evidence.get('pages') or {}
          assert set(pages) == {'CORE-01', 'ASSET-01'}
          assert pages['CORE-01']['functional_chain_fresh_scan']['gap_count'] == 45
          assert pages['CORE-01']['closure_blocker_count'] == 7
          assert pages['ASSET-01']['functional_chain_fresh_scan']['gap_count'] == 105
          assert pages['ASSET-01']['closure_blocker_count'] == 6
          outputs = evidence.get('official_stage_output_denominator') or []
          mandatory = evidence.get('execution_profile_mandatory_output_subset') or []
          assert len(outputs) == 17 and len(set(outputs)) == 17
          assert len(mandatory) == 12 and set(mandatory).issubset(set(outputs))

          # Preserve exact runtime evidence bytes as the active tracked evidence.
          (ROOT/'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json').write_bytes(raw)

          class_counts = Counter()
          category_counts = Counter()
          for pdata in pages.values():
              scan = pdata.get('functional_chain_fresh_scan') or {}
              class_counts.update(scan.get('gap_classes') or {})
              category_counts.update(scan.get('gap_categories') or {})
          assert sum(category_counts.values()) == 150
          assert class_counts == Counter({'ARCHITECTURE_GAP':112,'INPUT_SOURCE_GAP':34,'AUTHORITY_GAP':4})

          findings = {
              'schema_version': 11,
              'artifact_type': 'STAGE02_CURRENT_FINDINGS',
              'normative_authority': False,
              'stage_uid': 'STAGE-02',
              'attempt_uid': ATTEMPT,
              'frozen_governance_uid': CURRENT_UID,
              'source_cycle': 'FRESH_CURRENT_GOVERNANCE_STAGE02_ATTEMPT_003',
              'source_head_sha': SOURCE_SHA,
              'source_workflow_run_id': RUN_ID,
              'source_artifact_id': ARTIFACT_ID,
              'source_artifact_sha256': ARTIFACT_SHA,
              'fresh_functional_gap_total': 150,
              'fresh_closure_blocker_total': 13,
              'gap_classes': dict(class_counts),
              'gap_categories': dict(category_counts),
              'page_results': {
                  uid: {
                      'functional_gap_count': pages[uid]['functional_chain_fresh_scan']['gap_count'],
                      'closure_blocker_count': pages[uid]['closure_blocker_count'],
                      'closure_blockers': pages[uid]['closure_blockers'],
                  } for uid in ('CORE-01','ASSET-01')
              },
              'official_stage_output_denominator_count': 17,
              'current_manifest_mandatory_stage_output_subset_count': 12,
              'preserved_external_authority_union_count': 8,
              'preserved_external_authority_union_gap_uids': evidence['preserved_external_authority_union_gap_uids'],
              'prior_stage2_results_used': False,
              'result': 'BLOCKED',
              'current_specification_mutated': False,
              'immutable_stage1_source_mutated': False,
              'stage03_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
              'next_action': 'OWNING_LAYER_REMEDIATION_OF_150_FUNCTIONAL_GAPS_AND_13_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
          }
          (ROOT/'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml').write_text(
              yaml.safe_dump(findings, sort_keys=False, allow_unicode=True), encoding='utf-8')

          state_path = ROOT/'governance/test/ACTIVE_STATE.yaml'
          state = yaml.safe_load(state_path.read_text(encoding='utf-8')) or {}
          state['schema_version'] = max(int(state.get('schema_version') or 0), 13)
          state['specification_uid'] = CURRENT_UID
          ex = state['execution']
          ex['current_stage'] = 'STAGE-02-TESTED-BLOCKED'
          ex['stage2'] = {
              'result':'TEST_EXECUTED_BLOCKED','stage_entry_gate':'PASS','stage_exit_allowed':False,
              'prior_results_authoritative_for_next_run':False,'prior_results_used_in_current_run':False,
              'artifact_root_present':False,'revalidation_required_under_current_governance':False,
              'prior_results_authoritative_for_current_governance':False,
          }
          ex['website_construction_allowed'] = False
          ex['deployment_allowed'] = False
          attempt = state['stage02_active_attempt']
          attempt.update({
              'attempt_uid':ATTEMPT,'frozen_governance_uid':CURRENT_UID,'source_execution_sha':SOURCE_SHA,
              'source_workflow_run_id':RUN_ID,'source_artifact_id':ARTIFACT_ID,'source_artifact_sha256':ARTIFACT_SHA,
              'active_evidence_present':True,'active_findings_present':True,
              'active_evidence_ref':'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json',
              'active_findings_ref':'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml',
              'fresh_functional_gap_total':150,'fresh_closure_blocker_total':13,
              'preserved_external_authority_union_count':8,'official_stage_output_denominator_count':17,
              'current_manifest_mandatory_stage_output_subset_count':12,'product_or_contract_material_remediation_started':False,
              'next_action':'OWNING_LAYER_REMEDIATION_OF_150_FUNCTIONAL_GAPS_AND_13_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
              'governance_status':'CURRENT_FROZEN_ATTEMPT_FRESHLY_REVALIDATED_BLOCKED',
              'closure_credit_under_current_governance':True,'fresh_revalidation_required':False,
          })
          runtime = state['stage2_result_evidence']
          runtime['tracked_current_evidence_ref'] = 'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
          runtime['artifact_provenance_recorded_in_active_attempt'] = True
          protocol = state['stage_execution_remediation_closure_protocol']
          protocol['frozen_specification_uid'] = CURRENT_UID
          protocol['binding_status'] = 'CURRENT_POLICY_FRESH_REVALIDATION_PASS_BLOCKED_RESULT'
          state['stage02_current_problem_state'] = {
              'fresh_functional_gap_total':150,'fresh_closure_blocker_total':13,
              'architecture_gap_total':112,'input_source_gap_total':34,'authority_gap_total':4,
              'external_authority_union_count':8,'current_specification_mutated':False,
              'immutable_stage1_source_mutated':False,'prior_stage2_results_used':False,
          }
          state['status'] = 'ACTIVE_STAGE2_TESTED_BLOCKED_CURRENT_GOVERNANCE'
          state['next_action'] = 'OWNING_LAYER_REMEDIATION_OF_150_FUNCTIONAL_GAPS_AND_13_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED'
          state['governance_revision_transition']['fresh_revalidation_required'] = False
          state_path.write_text(yaml.safe_dump(state, sort_keys=False, allow_unicode=True), encoding='utf-8')

          ledger_path = ROOT/'governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml'
          ledger = yaml.safe_load(ledger_path.read_text(encoding='utf-8')) or {}
          # Preserve every finding byte-semantically; only synchronize the active Stage-02 projection.
          projection = ledger.setdefault('current_stage2_execution', {})
          projection.clear()
          projection.update({
              'state':'TEST_EXECUTED_BLOCKED','attempt_uid':ATTEMPT,'frozen_governance_uid':CURRENT_UID,
              'raw_discovery_gap_count':150,'product_materialization_elimination_count':0,
              'external_authority_elimination_count':0,'total_fresh_elimination_count':0,
              'current_functional_gap_count':150,'current_closure_blocker_count':13,
              'official_stage_output_denominator_count':17,'current_manifest_mandatory_stage_output_subset_count':12,
              'preserved_external_authority_union_count':8,'active_evidence_present':True,'active_findings_present':True,
              'stage_exit_allowed':False,'website_construction_allowed':False,'deployment_allowed':False,
              'historical_counts_may_be_treated_as_current':False,'prior_stage2_results_used':False,
              'source_execution_sha':SOURCE_SHA,'source_workflow_run_id':RUN_ID,'source_artifact_id':ARTIFACT_ID,
              'source_artifact_sha256':ARTIFACT_SHA,'reexecution_cycle':'FRESH_CURRENT_GOVERNANCE_STAGE02_ATTEMPT_003',
              'next_action':'OWNING_LAYER_REMEDIATION_OF_150_FUNCTIONAL_GAPS_AND_13_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
          })
          ledger_path.write_text(yaml.safe_dump(ledger, sort_keys=False, allow_unicode=True, width=1000), encoding='utf-8')
          PY
      - name: Validate synchronized current state
        run: |
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Commit synchronized non-normative evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/ACTIVE_STATE.yaml governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml
          git diff --cached --check
          git commit -m 'test(stage02): persist current-governance fresh evidence' -m 'Source-Run: 35040165635' -m 'Source-Artifact: 10424976911' -m 'Frozen-Governance: GOV-REV-20260916-FULL-LINE-SOURCE-INTEGRITY-CLOSURE' -m 'Normative-Specification-Mutation: false'
          git push origin HEAD:rebuild-v2.1.1
