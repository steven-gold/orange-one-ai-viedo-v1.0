name: CORE01 Candidate boundary once
on:
  push:
    paths:
      - '.github/workflows/core01-candidate-boundary-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch CORE Candidate actions to registered payload adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/CoreVisual.tsx'); s=p.read_text()
          anchor='import { requestCoreMessageSendPayload, requestCoreThreadCreatePayload } from "@/domain/core/coreConversationPayloadAdapter";'
          add=anchor+'\nimport { requestCoreCandidateCreatePayload, requestCoreCandidateDecisionPayload } from "@/domain/core/coreCandidatePayloadAdapter";'
          assert anchor in s and 'coreCandidatePayloadAdapter' not in s
          s=s.replace(anchor,add,1)
          old='''      case "CORE-01-ACT-CANDIDATE-CREATE": if (!humanDecision.trim()) { reportBlock("CORE-01-ERR-DECISION-001:HUMAN_DECISION_REQUIRED"); return; } void runServerAction(action, { payload: { human_decision: humanDecision.trim(), evidence_refs: clientState.decision_evidence_refs } }); return;\n      case "CORE-01-ACT-CANDIDATE-ACCEPT": case "CORE-01-ACT-CANDIDATE-RETURN": { const candidateRef = requireCandidateRef(); if (candidateRef) void runServerAction(action, { path_params: { id: candidateRef } }); return; }'''
          new='''      case "CORE-01-ACT-CANDIDATE-CREATE": {\n        const decisionText=humanDecision.trim();\n        if (!decisionText) { reportBlock("CORE-01-ERR-DECISION-001:HUMAN_DECISION_REQUIRED"); return; }\n        void (async()=>{\n          const payload=await requestCoreCandidateCreatePayload({ human_decision:decisionText, evidence_refs:clientState.decision_evidence_refs, project_id:clientState.project_id, topic_id:clientState.topic_id, work_item:clientState.work_item });\n          if(!payload.ok){ reportBlock(`CORE-01-ERR-CANDIDATE-001:${payload.reason_code}`); return; }\n          await runServerAction(action,{payload:payload.payload});\n        })(); return;\n      }\n      case "CORE-01-ACT-CANDIDATE-ACCEPT": case "CORE-01-ACT-CANDIDATE-RETURN": {\n        const candidateRef=requireCandidateRef(); if(!candidateRef)return;\n        const decisionText=humanDecision.trim();\n        void (async()=>{\n          const payload=await requestCoreCandidateDecisionPayload({ candidate_ref:candidateRef, decision:action==="CORE-01-ACT-CANDIDATE-ACCEPT"?"ACCEPT":"RETURN", reason_text:decisionText, evidence_refs:clientState.decision_evidence_refs });\n          if(!payload.ok){ reportBlock(`CORE-01-ERR-DECISION-001:${payload.reason_code}`); return; }\n          await runServerAction(action,{path_params:{id:candidateRef},payload:payload.payload});\n        })(); return;\n      }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Contract and homepage locks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const core=fs.readFileSync('src/components/pages/CoreVisual.tsx','utf8');
          const adapter=fs.readFileSync('src/domain/core/coreCandidatePayloadAdapter.ts','utf8');
          const port=fs.readFileSync('src/domain/core/coreClientPort.ts','utf8');
          if(core.includes('payload: { human_decision: humanDecision.trim()')) throw new Error('guessed Candidate create payload remains');
          if(core.includes('runServerAction(action, { path_params: { id: candidateRef } })')) throw new Error('Candidate decision still missing payload');
          for(const x of ['requestCoreCandidateCreatePayload','requestCoreCandidateDecisionPayload']) if(!core.includes(x)) throw new Error('Candidate adapter not wired '+x);
          for(const x of ['CREATE','DECISION','REGISTERED_SCHEMA_ADAPTER_NOT_BOUND']) if(!adapter.includes(x)) throw new Error('Candidate adapter contract missing '+x);
          for(const x of ['CANDIDATE_CREATE_REGISTERED_SCHEMA_PAYLOAD_REQUIRED','CANDIDATE_DECISION_REGISTERED_SCHEMA_PAYLOAD_REQUIRED']) if(!port.includes(x)) throw new Error('Candidate port guard missing '+x);
          NODE
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium verifies Candidate fail-closed mutations
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          (npm run start -- -p 3000 >/tmp/core-candidate.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/core >/dev/null && break; sleep 1; done
          cat > check.cjs <<'NODE'
          const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage(),posts=[];p.on('request',r=>{if(r.method()==='POST'&&r.url().includes('/v1/candidates'))posts.push(r.url())});await p.goto('http://127.0.0.1:3000/core',{waitUntil:'networkidle'});await p.locator('[data-control-id="CORE-01-FLD-HUMAN-DECISION"]').fill('confirmed decision');await p.locator('[data-control-id="CORE-01-BTN-CANDIDATE-CREATE"]').click();await p.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('CANDIDATE_CREATE_REGISTERED_SCHEMA_ADAPTER_NOT_BOUND'));if(posts.length)throw new Error('Candidate create emitted guessed POST');await p.locator('[data-control-id="CORE-01-BTN-CANDIDATE-CONFIRM"]').click();await p.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('EXACT_CANDIDATE_REF_REQUIRED'));if(posts.length)throw new Error('Candidate accept emitted POST without ref');await p.locator('[data-control-id="CORE-01-BTN-RETURN-MODIFY"]').click();await p.waitForFunction(()=>document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason')?.includes('EXACT_CANDIDATE_REF_REQUIRED'));if(posts.length)throw new Error('Candidate return emitted POST without ref');console.log('CORE01_CANDIDATE_BOUNDARY_PASS posts=0');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
          rm check.cjs
      - name: Commit and self clean
        run: |
          rm -f .github/workflows/core01-candidate-boundary-once.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/CoreVisual.tsx .github/workflows/core01-candidate-boundary-once.yml
          git commit -m "fix(core): close Candidate payload boundary"
          git push origin HEAD:new
