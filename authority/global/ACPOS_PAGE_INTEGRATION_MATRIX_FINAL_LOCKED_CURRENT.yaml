  - Project metadata and confirmed Project versions
  - Approved/confirmed decision context
  - Governed Strategy/Information context candidates when explicitly adopted
  - Current system naming/version governance
  produces:
  - Story / Chapter / World / DNA / Blueprint candidate and confirmed versions
  - Topic Production Scope
  - Canonical Production Script candidate/confirmed version
  - Production Package readiness and exact source refs
  - Conversation / decision / candidate records
