name: Mother Successor Projector Sync R5
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-SUCCESSOR-PROJECTOR-SYNC-R6.yaml'

permissions:
  contents: write

jobs:
  materialize-projector-sync:
    if: "${{ github.event.head_commit.message == 'chore(governance): authorize mother successor projector sync R6' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify exact pre-write context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4d1828e324d28d39d38f9f63ca2c55f2aa1f9c3c"
          test "$(git rev-parse HEAD^{tree})" != ""
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-SUCCESSOR-PROJECTOR-SYNC-R6.yaml
          grep -q 'GOV-REV-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING' governance/specifications/REGISTRY.yaml
      - name: Install verifier dependency
        run: python -m pip install --quiet pyyaml
      - name: Materialize projector synchronization and run complete local gate
        run: python .github/governance-maintenance/materialize_mother_successor_projector_sync_r5.py
      - name: Verify transaction hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/governance-maintenance/materialize_mother_successor_projector_sync_r5.py
          test ! -e .github/workflows/mother-successor-projector-sync-r5.yml
          git diff --check
          git status --short
      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "fix(governance): synchronize mother successor current projectors"             -m "Spec-Change-Authorization: USR-DIRECTIVE-20260918-MOTHER-SUCCESSOR-PROJECTOR-SYNC-R6"             -m "Spec-Change-Scope: MOTHER_SUCCESSOR_PROJECTOR_SYNCHRONIZATION"
          git push origin HEAD:rebuild-v2.1.1
