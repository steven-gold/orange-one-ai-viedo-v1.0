    size: LIST_ITEM
    action_or_behavior: READ_ONLY：顯示 Import Job 真實狀態
    enable_gate: EDIT-01-GATE-STANDALONE；有 Import Job
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-LST-MEDIA
    order: '05'
    type: list
    label: 已綁定輸入 / Session 媒體
    size: LIST_ITEM
    action_or_behavior: PROJECT_TASK=READ_ONLY；STANDALONE=EDIT-01-ACT-MEDIA-SELECT
    enable_gate: EDIT-01-GATE-SOURCE；PROJECT_TASK 不可 Picker；Standalone 只可選本 Session Media
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-CTL-DROP-TIMELINE
    order: '06'
    type: drag/drop
    label: 拖放至 Timeline
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-CLIP-INSERT
    enable_gate: EDIT-01-GATE-DRAFT；PROJECT_TASK 只允許 Production Package 已授權 placement/ref；STANDALONE 可從 Session Media 拖放
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-UPLOAD-SPEC
    order: '07'
    type: button
    label: 上傳腳本 / 規格
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-STANDALONE-SPEC-IMPORT
    enable_gate: EDIT-01-GATE-STANDALONE；STANDALONE_UPLOAD only
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-PLAY
    order: '01'
    type: transport button
    label: 播放
