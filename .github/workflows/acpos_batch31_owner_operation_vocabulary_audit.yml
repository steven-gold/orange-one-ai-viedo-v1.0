name: ACPOS Batch 31 Owner Operation Vocabulary Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch31-owner-operation-vocabulary-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 30 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="c17e7bbf4ddf9208c6a80cea659627f84ede87a9"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH30 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 31 vocabulary audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch31_owner_operation_vocabulary_audit.py

      - name: Verify Batch 31 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch31_operation_vocabulary_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["s05_paragraph_hits"]+s["s05_table_row_hits"]>0,s
          assert s["s02_paragraph_hits"]+s["s02_table_row_hits"]>0,s
          print("PASS: BATCH31 OWNER VOCABULARY EVIDENCE")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 31 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch31-owner-operation-vocabulary-audit
          path: |
            __batch31_operation_vocabulary_audit.json
            __batch31_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 31 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch31_operation_vocabulary_audit.json __batch31_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-31-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch31_owner_operation_vocabulary_audit.py .github/workflows/acpos_batch31_owner_operation_vocabulary_audit.yml
          git commit -m "chore(acpos): close batch 31 operation vocabulary audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH31 HARNESS REMOVED / CLEAN TREE"
