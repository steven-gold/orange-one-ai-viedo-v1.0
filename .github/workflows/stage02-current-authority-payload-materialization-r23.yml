name: Stage-02 Current Authority Payload Closure + Materialization R23

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-current-authority-payload-materialization-r23.yml'
      - 'governance/ci/classify_stage02_current_authority_payload_closures_r23.py'
      - 'governance/ci/validate_stage02_current_authority_payload_closures_r23.py'
      - 'governance/ci/materialize_stage02_r23_current_authority_payload_closures.py'
      - 'governance/ci/validate_stage02_r23_materialized_payload_closures.py'
      - 'governance/ci/run_current_stage2_r23_effective_reexecution.py'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/STAGE2_EXTERNAL_AUTHORITY_MATERIALIZATION_EVIDENCE.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/GAP-006/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml'
      - 'governance/test/stage02/STAGE02_PAYLOAD_DEPENDENCY_TRACE_R14.yaml'
      - '.github/stage02-test/STAGE02_R22_EFFECTIVE_REEXECUTION_RESULT.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify-materialize-reexecute:
    runs-on: ubuntu-latest
    env:
      STAGE02_FULL_LINE_CONFIRMED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R23 implementation
        run: |
          python -m py_compile governance/ci/classify_stage02_current_authority_payload_closures_r23.py
          python -m py_compile governance/ci/validate_stage02_current_authority_payload_closures_r23.py
          python -m py_compile governance/ci/materialize_stage02_r23_current_authority_payload_closures.py
          python -m py_compile governance/ci/validate_stage02_r23_materialized_payload_closures.py
          python -m py_compile governance/ci/run_current_stage2_r23_effective_reexecution.py
      - name: Revalidate R22 current baseline and current external authority chain
        run: |
          python governance/ci/validate_stage02_r22_materialized_closures.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
      - name: Classify exact Current Authority payload closures R23
        run: python governance/ci/classify_stage02_current_authority_payload_closures_r23.py
      - name: Validate R23 Current Authority payload classification
        run: python governance/ci/validate_stage02_current_authority_payload_closures_r23.py
      - name: Materialize only exact R23 Current Authority payload closures
        run: python governance/ci/materialize_stage02_r23_current_authority_payload_closures.py
      - name: Validate exact R23 payload materialization set
        run: python governance/ci/validate_stage02_r23_materialized_payload_closures.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Fresh Stage-02 effective reexecution after R23
        run: python governance/ci/run_current_stage2_r23_effective_reexecution.py
      - name: Assert fresh R23 denominator and fail-closed state
        run: |
          python - <<'PY'
          import json
          import yaml
          from pathlib import Path

          receipt = yaml.safe_load(Path('governance/test/stage02/STAGE02_R23_BOUNDED_MATERIALIZATION_RECEIPT.yaml').read_text())
          result = json.loads(Path('.github/stage02-test/STAGE02_R23_EFFECTIVE_REEXECUTION_RESULT.json').read_text())
          n = receipt['materialized_now_total']
          assert isinstance(n, int) and 1 <= n <= 4, (n, receipt)
          assert receipt['before_materialized_product_total'] == 38, receipt
          assert receipt['after_materialized_product_total'] == 38 + n, receipt
          assert result['raw_discovery_gap_total'] == 171, result
          assert result['product_materialization_elimination_count'] == 38 + n, result
          assert result['r23_current_authority_payload_elimination_count'] == n, result
          assert result['gap006_authority_elimination_count'] == 4, result
          assert result['total_effective_elimination_count'] == 42 + n, result
          assert result['fresh_functional_gap_total'] == 129 - n, result
          assert result['remaining_payload_gap_total'] == 34 - n, result
          assert result['effective_gap_categories'] == {
              'ACTION_WITHOUT_CONTROL_OR_TRIGGER': 1,
              'AUDIT_EVENT_NODE_MISSING': 13,
              'FAILURE_STATE_ERROR_BINDING_MISSING': 44,
              'PAYLOAD_INPUT_CONTRACT_MISSING': 34 - n,
              'POST_ACTION_VALIDATION_NODE_MISSING': 1,
              'STATE_TRANSITION_LEDGER_FIELD_MISSING': 36,
          }, result
          assert result['remaining_r22_authority_gap']['target_uid'] == 'ASSET-01-ACT-CORRECTION-EXECUTE', result
          assert result['remaining_r22_authority_gap']['category'] == 'POST_ACTION_VALIDATION_NODE_MISSING', result
          assert result['operation_registry_used_as_payload_authority'] is False, result
          assert result['result'] == 'BLOCKED' and result['stage_exit_allowed'] is False, result
          assert result['website_construction_allowed'] is False and result['deployment_allowed'] is False, result
          assert result['current_specification_mutated'] is False and result['immutable_stage1_source_mutated'] is False, result
          assert result['prior_stage2_results_used_as_scan_input'] is False, result
          print(f'PASS: R23 fresh effective denominator={129-n}; exact Current Authority payload eliminations={n}; Stage-02 fail-closed')
          PY
      - name: Persist R23 materialization and fresh evidence
        run: |
          paths=(
            '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
            'governance/test/stage02/STAGE02_CURRENT_AUTHORITY_PAYLOAD_CLOSURE_R23.yaml'
            'governance/test/stage02/STAGE02_R23_BOUNDED_MATERIALIZATION_RECEIPT.yaml'
            '.github/stage02-test/STAGE02_R23_EFFECTIVE_REEXECUTION_RESULT.json'
            'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
            'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml'
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'R23 outputs unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'test(stage02): persist R23 current authority payload closures and fresh evidence'
          git push origin HEAD:rebuild-v2.1.1
