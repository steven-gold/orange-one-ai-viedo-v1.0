name: Mother Context Task-Layer Successor Materializer

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING-R4.yaml'
      - '.github/workflows/mother-context-task-layer-successor.yml'

permissions:
  contents: write

jobs:
  materialize-authorized-successor:
    if: "${{ github.event.head_commit.message == 'chore(governance): authorize mother context task-layer hardening R4' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Assert exact authorization parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bd70c47add89b0383e74a8c3176682e4b9e34779"
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING-R4.yaml
      - name: Bind materializer to R4 and normalize Mother EOF output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/governance-maintenance/materialize_mother_context_task_layer_successor.py')
          t=p.read_text(encoding='utf-8')
          old='USR-DIRECTIVE-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING-R2'
          new='USR-DIRECTIVE-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING-R4'
          if t.count(old) != 1:
              raise SystemExit(f'expected one R2 materializer binding, got {t.count(old)}')
          t=t.replace(old,new)
          old3="p3.write_text(t3.rstrip() + SECTIONS_03 + '\\n', encoding='utf-8')"
          new3="p3.write_text((t3.rstrip() + SECTIONS_03).rstrip() + '\\n', encoding='utf-8')"
          old4="p4.write_text(t4.rstrip() + SECTIONS_04 + '\\n', encoding='utf-8')"
          new4="p4.write_text((t4.rstrip() + SECTIONS_04).rstrip() + '\\n', encoding='utf-8')"
          if t.count(old3) != 1 or t.count(old4) != 1:
              raise SystemExit(f'EOF patch target drift: p3={t.count(old3)} p4={t.count(old4)}')
          p.write_text(t.replace(old3,new3).replace(old4,new4),encoding='utf-8')
          PY
      - name: Materialize authorized Mother successor and run targeted validators
        run: python .github/governance-maintenance/materialize_mother_context_task_layer_successor.py
      - name: Verify transaction diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/governance-maintenance/materialize_mother_context_task_layer_successor.py
          test ! -e .github/workflows/mother-context-task-layer-successor.yml
          git status --short
      - name: Persist atomic successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "feat(governance): promote mother context task-layer hardening" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING-R4" \
            -m "Spec-Change-Scope: MOTHER_CONTEXT_TASK_LAYER_HARDENING"
          git push origin HEAD:rebuild-v2.1.1
