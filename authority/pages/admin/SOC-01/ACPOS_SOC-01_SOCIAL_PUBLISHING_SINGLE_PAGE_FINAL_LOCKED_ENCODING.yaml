gates:
- gate_uid: SOC-01-GATE-PAGE
  condition: identity + effective backend L1 social_publishing + exact source account permissions + scope + condition + classification
    + audit; frontend visibility is not authorization
- gate_uid: SOC-01-GATE-READ
  condition: page gate + exact read permission + authorized scope + classification/mask
- gate_uid: SOC-01-GATE-PLATFORM-CONFIG
  condition: page gate + exact governed resource ref/version + configureGovernedResource authorization + state/policy + expected
    version + idempotency where side-effect + audit
- gate_uid: SOC-01-GATE-KILL
  condition: page gate + actual high-risk applicable operation + ops.kill_switch + exact target/scope/reason + confirmation
    + audit
- gate_uid: SOC-01-GATE-ACCOUNT
  condition: page gate + exact account_id/platform + source operation authorization + expected version + idempotency + state
    guard + audit
- gate_uid: SOC-01-GATE-CREDENTIAL
  condition: page gate + social.credential.reveal + explicit governed request fields/reason from source schema + audit; raw
    secret never in normal projection
- gate_uid: SOC-01-GATE-DISCOVERY
  condition: page gate + social.target.discovery + exact CreateSocialTargetDiscoveryRequest + allowed platform/capability/policy
    + expected version + idempotency + audit
- gate_uid: SOC-01-GATE-TARGET-JOIN
  condition: page gate + exact target state DISCOVERED|READY_TO_JOIN + social.target.join + target capability result + expected
    version + idempotency + audit
- gate_uid: SOC-01-GATE-MANUAL
  condition: page gate + actual MANUAL_ACTION_REQUIRED or PENDING_ADMIN_APPROVAL context + social.manual_action.complete +
    exact action ref/version + audit
- gate_uid: SOC-01-GATE-CONTENT
  condition: page gate + exact Release Candidate/content draft/candidate refs + existing Draft/Candidate owner + source schema
    + audit
- gate_uid: SOC-01-GATE-CANDIDATE
  condition: content gate + exact candidate id/version + candidate.decide + legal candidate state + audit
- gate_uid: SOC-01-GATE-POLICY
  condition: page gate + exact target_id JOINED/eligible + social.schedule.configure + ConfigureSocialTargetPolicyRequest
    + expected version + idempotency + audit
- gate_uid: SOC-01-GATE-PUBLISH
  condition: page gate + target READY_TO_POST + exact content package + bound channel account + rights/policy/approval + cooldown/frequency/time-window
    + social.publish.request + RequestSocialTargetPublishRequest + expected version + idempotency + audit
- gate_uid: SOC-01-GATE-RECORDS
  condition: page gate + authorized operational read/search/refresh; external result must come from recorded projection/callback,
    never synthetic UI state
