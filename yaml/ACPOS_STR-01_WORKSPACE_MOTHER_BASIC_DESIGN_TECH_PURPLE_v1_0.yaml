  - index: 35
    rows:
    - row: 0
      cells:
      - Design Item / 設計項目
      - Canonical Planning Design Contract / 正式規劃設計契約
    - row: 1
      cells:
      - Project Scope
      - STR-01／戰略工作區 current Word planning/basic-design scope；僅補設計規範，不改變已存在產品 Authority。
    - row: 2
      cells:
      - Business Goal
      - 在同一 Strategy Workspace 保留 topic/context/conversation continuity，讓受權限控制的使用者完成 TEXT_CHAT 型策略討論、分析、建議與決策支援。
    - row: 3
      cells:
      - Target User / Role Definition
      - 具 STR-01 戰略工作區與對話權限的內部策略使用者／決策參與者。
    - row: 4
      cells:
      - Functional Requirements
      - 建立或恢復策略 context、TEXT_CHAT 對話、引用 evidence/context、查看分析與 recommendation、形成決策支援／resource proposal／feedback 並安全 handoff。
    - row: 5
      cells:
      - Non-functional Requirements
      - Conversation/thread continuity、Exact context fingerprint、Audit、Fail Closed、不得將 Assistant output 自動視為 Human approval。
    - row: 6
      cells:
      - Out-of-Scope Definition
      - 禁止建立第二 Conversation Core、禁止繞過 Human Decision/Approval、禁止為缺失能力發明新的 runtime/provider。
    - row: 7
      cells:
      - Glossary
      - STR-01 使用本文既有 Entity / Operation / State / Owner / Evidence / Version 名詞；同義詞不得建立第二 identity。
    - row: 8
      cells:
      - Naming Registry Initial State
      - Page UID=STR-01；Owner File=ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx；Current canonical filename only；禁止 copy/backup/alternate owner。
    - row: 9
      cells:
      - Authority
      - Current STR-01 Word + Mother 01→04；缺產品選擇時 BLOCK，不由本附錄猜測。
  - index: 36
    rows:
    - row: 0
      cells:
      - Design Item / 設計項目
      - Canonical Planning Design Contract / 正式規劃設計契約
    - row: 1
      cells:
      - Color Tokens
      - SHARED_OWNER_REFERENCE → current Global Home / Shell Design System tech-purple token set; existing page-local approved override, if any, remains authoritative.
    - row: 2
      cells:
      - Typography Tokens
      - SHARED_OWNER_REFERENCE → current Global Design System typography; page-local text hierarchy may only use registered heading/body/label/technical text roles.
    - row: 3
      cells:
      - Spacing Tokens
      - Use registered gap/padding/spacing tokens; existing exact page gaps remain authoritative; no ad-hoc pixel drift.
    - row: 4
      cells:
      - Component States
      - Default / Hover / Focus / Active / Loading / Disabled / Success / Error MUST NOT change the approved component footprint unless the current component contract
        explicitly allows it.
    - row: 5
      cells:
      - Primary Layout
      - Use this Word's existing Primary Grid / Section / Workspace layout as the page-local authority; this annex introduces no second grid.
    - row: 6
      cells:
      - Navigation Region
      - Global Header and collapsible/overlay Sidebar remain shared shell regions; page Workspace starts in the registered content region.
    - row: 7
      cells:
      - Responsive Behavior
      - Use the current page responsive rule and shared shell breakpoint owner; semantic order and functional topology MUST remain stable across reflow.
    - row: 8
      cells:
      - Design Ownership
      - Page owns page-local layout/components; Global Shell owns shared header/sidebar/tokens; references only, no duplicated shared payload.
  - index: 37
    rows:
    - row: 0
      cells:
      - Design Item / 設計項目
      - Canonical Planning Design Contract / 正式規劃設計契約
    - row: 1
      cells:
      - Viewport / Breakpoint UID
      - SHARED_OWNER_REFERENCE → current Global Home breakpoint contract; page-specific breakpoint/reflow rules in this Word override only where explicitly registered.
    - row: 2
      cells:
      - Container Width / Min / Max
      - Retain current Global Shell + page Primary Grid width contract. No page-local implicit width may override an existing exact dimension.
    - row: 3
      cells:
      - Grid Columns / Span / Gutter / Outer Margin
      - Use the existing page Primary Grid / section mapping and current gap/margin values; any structural grid change requires Change Set.
    - row: 4
      cells:
      - Section Bounding Rules
      - Every registered Section remains within its current Workspace region; sticky/fixed/overlay areas MUST NOT occlude required controls.
    - row: 5
      cells:
      - Component / Control / Field Width / Height Rules
      - Use current Control/Field Dimensions or shared component token. State transitions MUST NOT cause layout jump.
    - row: 6
      cells:
      - Min / Max Width / Height
      - Inherit current exact values where present; otherwise shared component minimums apply. Required input/button content may not compress below its registered
        usable size.
    - row: 7
      cells:
      - Gap / Padding / Alignment
      - Use current page spacing/grid tokens; alignment changes outside token tolerance require Visual Review.
    - row: 8
      cells:
      - Aspect Ratio
      - NOT_APPLICABLE unless the current page declares an image/video/preview ratio; when declared, the exact current ratio remains authoritative.
    - row: 9
      cells:
      - Overflow / Scroll Rule
      - No hidden overflow for actionable content. Long technical values use existing ellipsis + tooltip/drawer rule; large tables may use the current controlled
        horizontal-scroll rule.
    - row: 10
      cells:
      - Collapse / Stack / Wrap Rule
      - Reflow may stack/collapse only within the current responsive contract; semantic order, required adjacency and operation order MUST NOT change.
    - row: 11
      cells:
      - Z-order / Overlay Rule
      - Global Header / Sidebar overlay / Dialog / Drawer layers remain above Workspace without blocking required content; overlay expansion MUST NOT reflow the primary
        Workspace unless explicitly specified.
    - row: 12
      cells:
      - Text Capacity / Truncation / Wrap Rule
      - Required labels/status/error text may not be clipped. Long IDs/technical values use controlled ellipsis with recoverable full value; no silent semantic truncation.
    - row: 13
      cells:
      - Asset Object-fit / Object-position
      - REFERENCE_ONLY → current Asset Binding owner when a formal visual asset exists; otherwise NOT_APPLICABLE.
    - row: 14
      cells:
      - Locked Visual Anchors
      - Bound to the Visual Anchor Registry in this annex; unlisted regions are not implicitly editable.
    - row: 15
      cells:
      - Allowed Tolerance / Diff Threshold
      - 'Locked anchors and structural grid: zero unapproved drift. Token-level micro adjustment is allowed only inside current Design Token/Layout rules; structural
        changes require Change Set + re-review.'
    - row: 16
      cells:
      - Geometry Failure Set
      - Detect overlap, clipping, horizontal overflow, unapproved scroll, control compression, unexpected wrap/stack, aspect drift, misalignment, sticky/fixed occlusion
        and header/sidebar/workspace collision.
