name: SOC-01 closure validation
on:
  push:
    branches: [acpos-soc01-closure-20260903]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Product audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: SOC authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re
          a=Path('authority/pages/admin/SOC-01/ACPOS_SOC-01_SOCIAL_PUBLISHING_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml').read_text()
          v=Path('src/components/pages/SocVisual.tsx').read_text(); r=Path('src/components/pages/SocControlRuntime.tsx').read_text(); p=Path('src/domain/social/socProjectionPort.ts').read_text(); c=Path('src/domain/social/controlledSocClientTestRuntime.ts').read_text(); s=Path('src/server/testing/controlledSocTestRuntime.ts').read_text()
          controls=set(re.findall(r'control_uid:\s*(SOC-01-[A-Z0-9-]+)',a)); sections=set(re.findall(r'section_uid:\s*(SOC-01-SEC-[0-9]+)',a)); actions=set(re.findall(r'action_uid:\s*(SOC-01-ACT-[A-Z0-9-]+)',a)); gates=set(re.findall(r'gate_uid:\s*(SOC-01-GATE-[A-Z0-9-]+)',a)); errors=set(re.findall(r'error_uid:\s*(SOC-01-ERR-[A-Z0-9-]+)',a))
          print('SOC_AUTHORITY_COUNTS',len(controls),len(sections),len(actions),len(gates),len(errors))
          assert len(sections)==9 and len(actions)==21 and len(gates)==14
          assert all(x in v or x in Path('src/domain/social/socControlBindings.ts').read_text() for x in controls)
          assert 'SocProjectionTestMetadata' in p and 'SOC_TEST_PROJECTION_FORBIDDEN_IN_PRODUCTION' in p
          assert 'ensureControlledSocClientTestRuntime' in r and 'SocSearchInput' in r
          assert 'TEST_ONLY' in c and 'production_eligible:false' in c
          assert 'TEST-SOC-01' in s and 'production_eligible: false' in s
          assert 'system_implementation_status: NOT_EXECUTED' in a and 'second social publishing system' in a and 'bulkSocialPublish endpoint/service invented by page' in a
          print('SOC_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ''
        run: npm run build
      - name: Production SOC must fail closed
        run: |
          set -euo pipefail
          PORT=3231 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/soc-prod.log 2>&1 & pid=$!; trap 'cat /tmp/soc-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3231/admin/social >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/soc-prod.json -w '%{http_code}' 'http://127.0.0.1:3231/v1/ui-projections/admin%3ASOC-01'); cat /tmp/soc-prod.json
          test "$code" = "503"; grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/soc-prod.json; ! grep -q 'TEST_ONLY' /tmp/soc-prod.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: Controlled SOC API classification
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3232 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/soc-api.log 2>&1 & pid=$!; trap 'cat /tmp/soc-api.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3232/admin/social >/dev/null && break || sleep 1; done
          curl -fsS 'http://127.0.0.1:3232/v1/ui-projections/admin%3ASOC-01' >/tmp/soc.json
          python <<'PY'
          import json
          d=json.load(open('/tmp/soc.json')); m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY' and m['synthetic'] is True and m['production_eligible'] is False
          assert len(d['gate_state'])==14 and d['page_state'] in ['READY','REVIEW_REQUIRED','EXTERNAL_PENDING']
          assert '••••' in d['values']['SOC-01-FLD-CREDENTIAL-STATUS']
          print('SOC_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled SOC browser flow
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: |
          set -euo pipefail
          PORT=3233 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/soc-browser.log 2>&1 & pid=$!; trap 'cat /tmp/soc-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3233/admin/social >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),errors=[];
          for(const width of [1280,1440,1920]){const p=await b.newPage({viewport:{width,height:1400}});p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto('http://127.0.0.1:3233/admin/social',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:SOC-01"]')?.getAttribute('data-projection-status')==='BOUND');const root=p.locator('[data-page-uid="admin:SOC-01"]');if(await root.getAttribute('data-data-classification')!=='TEST_ONLY'||await root.getAttribute('data-production-eligible')!=='false')throw new Error('classification');const o=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(o>0)throw new Error(`overflow ${width}:${o}`);await p.close()}
          const p=await b.newPage({viewport:{width:1440,height:1600}});await p.goto('http://127.0.0.1:3233/admin/social',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('[data-page-uid="admin:SOC-01"]')?.getAttribute('data-projection-status')==='BOUND');const root=p.locator('[data-page-uid="admin:SOC-01"]'),q=id=>p.locator(`[data-control-id="${id}"]`).first();
          await q('SOC-01-BTN-DETAIL').click();if(await root.getAttribute('data-detail-open')!=='true')throw new Error('detail');
          await q('SOC-01-TAB-STAGE-2').click();const search=q('SOC-01-INP-TARGET-SEARCH');await search.fill('test target');await search.press('Enter');await p.waitForFunction(()=>document.querySelector('[data-control-id="SOC-01-FLD-CURRENT-STATE"]')?.textContent?.includes('search executed'));
          await q('SOC-01-BTN-ACCOUNT-BIND').click();await q('SOC-01-BTN-CREDENTIAL-REVEAL').click();if(!((await q('SOC-01-FLD-CREDENTIAL-STATUS').textContent())||'').includes('MASKED'))throw new Error('masked');await q('SOC-01-BTN-TARGET-DISCOVERY').click();await q('SOC-01-BTN-TARGET-JOIN').click();await q('SOC-01-BTN-MANUAL-COMPLETE').click();
          await q('SOC-01-TAB-STAGE-3').click();await q('SOC-01-BTN-CONTENT-SAVE').click();await q('SOC-01-BTN-CANDIDATE-DECIDE').click();
          await q('SOC-01-TAB-STAGE-4').click();await q('SOC-01-BTN-POLICY-CONFIG').click();await q('SOC-01-BTN-PUBLISH').click();
          await q('SOC-01-TAB-STAGE-5').click();const rs=q('SOC-01-INP-RECORD-SEARCH');await rs.fill('post');await rs.press('Enter');await q('SOC-01-BTN-REFRESH').click();
          if(errors.length)throw new Error(errors.join('\n'));console.log('SOC_BROWSER_INTERACTION_PASS');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual guard
        run: |
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/social src/components/pages/SocControlRuntime.tsx src/components/pages/SocVisual.tsx
          git diff --exit-code
