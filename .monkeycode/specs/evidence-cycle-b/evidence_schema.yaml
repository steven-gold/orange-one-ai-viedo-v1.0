schema_version: 1
spec_uid: SPEC-EVIDENCE-CYCLE-B-001
title: Blocker B - Product-cycle evidence schema (Current Evidence Sync + Evidence State Closure)
status: SPECIFICATION_ONLY
audience: product-line evidence generator (branch 0921acpos) targeting governance package (branch rebuild-v2.1.1)
values_policy: REAL_RUN_DATA_ONLY
note: >
  This schema is derived strictly from the consumer validators. Every constraint below carries the
  authoritative source (file:line). The generator MUST populate values from real product execution
  (GitHub runs + standalone subprocess suite results). It MUST NOT synthesize, estimate, or reuse
  stale values.

authority:
  consumers:
    - 09_TESTS/governance/validate_current_test_evidence.py
    - 09_TESTS/governance/validate_evidence_state_closure.py
    - 09_TESTS/governance/test_v2_1_8_successor_evidence_sync_bugfix.py
    - 09_TESTS/governance/test_v2_1_9_evidence_state_closure.py
    - 09_TESTS/governance/test_v2_1_12_successor_state_evidence_parse.py
    - 09_TESTS/governance/test_high_pressure_hardening.py
    - 09_TESTS/governance/test_bugfix_regressions.py
  registry_prerequisites:
    - 10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml
    - 10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml
    - 10_REGISTRY/REVIEW_PROGRESS_LEDGER.yaml
    - 10_REGISTRY/GOVERNANCE_ACCEPTANCE_AUDIT_BLUEPRINT.yaml
    - 10_REGISTRY/SECTION_NUMBER_REGISTRY.yaml
  revision_rule: >-
    current revision R = GOVERNANCE_ROOT_MANIFEST.governance_revision major.minor.patch, e.g. v2.2.25.
    GOVERNANCE_CANDIDATE_STATE.candidate MUST carry the same major.minor.patch.
    validate_current_test_evidence.py:16-23.

result_key_to_suite:
  high_pressure_suite: test_high_pressure_hardening.py
  execution_governance_load: test_execution_load_guard.py
  multidirection_stress_repair: test_prefomal_stress_repairs.py
  stage1_minimal_control: test_stage1_source_to_blueprint_minimal_control.py
  v2_1_0_inherited_regression: test_v2_1_0_regressions.py
  post_v1_8_regression: test_v2_1_0_post_v1_8_regressions.py
  v2_1_6_cross_lifecycle_regression: test_bugfix_regressions.py
  v2_1_7_phase_authority_regression: test_v2_1_7_phase_authority_bugfix.py
  v2_1_8_successor_evidence_sync_regression: test_v2_1_8_successor_evidence_sync_bugfix.py
  v2_1_9_evidence_state_closure_regression: test_v2_1_9_evidence_state_closure.py
  v2_1_10_closure_evidence_continuity_regression: test_v2_1_10_closure_evidence_continuity.py
  v2_1_11_binding_authority_receipt_schema_regression: test_v2_1_11_binding_authority_receipt_schema.py
  v2_1_12_successor_state_evidence_parse_regression: test_v2_1_12_successor_state_evidence_parse.py
  v2_1_13_stage_execution_invariant_regression: test_v2_1_13_stage_execution_invariants.py
  v2_1_14_test_feedback_spec_evolution_regression: test_v2_1_14_test_feedback_spec_evolution.py
  v2_1_14_product_neutral_entity_lifecycle_regression: test_v2_1_14_product_neutral_entity_lifecycle.py

denominator_source:
  current: SEMANTIC_AUTHORITY_BASELINE.mandatory_regression_assets
  predecessor: GOVERNANCE_CANDIDATE_STATE.fresh_revalidation.predecessor_mandatory_regression_assets
  exact_string_formula: '"{expected_total}/{expected_passed} PASS"'
  matrix_string_formula: '"{suite_count}/{suite_count} SUITES PASS"'
  reference_semantic_cases_formula: '"{semantic_total}/{semantic_passed} PASS"'
  reference_semantic_fuzz_formula: '"{fuzz_total}/{fuzz_blocked} BLOCKED; {escaped} ESCAPED"'
  wrapper_string: "BLOCKED_TOOL_TIMEOUT; MONOLITHIC WRAPPER NOT COMPLETED"
  constituent_string_formula: '"19/19 PASS; MANDATORY REGRESSION MATRIX {suite_count}/{suite_count} SUITES PASS"'

files:

  - path: 11_EVIDENCE/audit/GOVERNANCE_CANDIDATE_STATE.yaml
    required_keys: [candidate, formal_test_started, completion_claim, fresh_revalidation, preformal_execution]
    constraints:
      candidate:
        type: string
        match: '^v\d+\.\d+\.\d+'
        must_equal: "GOVERNANCE_ROOT_MANIFEST.governance_revision major.minor.patch"
        source: validate_current_test_evidence.py:16-23
      formal_test_started:
        type: bool
        must_be: false
        source: validate_evidence_state_closure.py:32
      completion_claim:
        type: string
        must_start_with: PREFORMAL_V
        must_not_contain: [FORMAL_FREEZE, PRODUCTION_RELEASE]
        source: validate_evidence_state_closure.py:33-35
      fresh_revalidation:
        type: object
        keys:
          required: {type: bool}
          current_source_revision: {type: string, when: required_true, must_equal: root_revision, source: 'validate_current_test_evidence.py:28'}
          current_closure_credit: {type: bool, when: required_true, must_be: false, source: 'validate_current_test_evidence.py:29'}
          predecessor_evidence_current_closure_credit: {type: bool, when: required_true, must_be: false, source: 'validate_current_test_evidence.py:30'}
          embedded_preformal_execution_role: {type: enum, when: required_true, must_be: HISTORICAL_PREDECESSOR_EVIDENCE_ONLY, source: 'validate_current_test_evidence.py:31'}
          predecessor_wrapper_result_role: {type: enum, when: required_true, must_be: HISTORICAL_PREDECESSOR_EVIDENCE_ONLY, source: 'validate_current_test_evidence.py:32'}
          persisted_head_full_line_required: {type: bool, when: required_true, must_be: true, source: 'validate_current_test_evidence.py:33'}
          historical_evidence_may_close_successor: {type: bool, when: required_true, must_be: false, source: 'validate_current_test_evidence.py:34'}
          predecessor_evidence_revisions:
            type: object
            when: required_true
            keys:
              high_pressure: {must_equal: 'HIGH_PRESSURE_HARDENING_RESULT.governance_revision', source: 'validate_current_test_evidence.py:76-77'}
              reference_semantic: {must_equal: 'REFERENCE_SEMANTIC_REPAIR_RESULT.governance_revision', source: 'validate_current_test_evidence.py:78'}
              machine_review_target_revision: {must_equal: 'REVIEW_PROGRESS_LEDGER.machine_review_plan[0].target_revision', source: 'validate_current_test_evidence.py:170'}
          predecessor_mandatory_regression_assets:
            type: list
            when: required_true
            item_shape: 'same as SEMANTIC_AUTHORITY_BASELINE.mandatory_regression_assets'
            must_differ_from_current: 'at least one of changed/added/removed non-empty'
            source: validate_current_test_evidence.py:100-111
      preformal_execution:
        type: object
        keys:
          '<result_key>': {must_equal: '<total>/<passed> PASS', source: 'validate_current_test_evidence.py:141-145'}
          reference_semantic_cases: {must_equal: '28/28 PASS', source: 'validate_current_test_evidence.py:154-155'}
          reference_semantic_fuzz: {must_equal: '46/46 BLOCKED; 0 ESCAPED', source: 'validate_current_test_evidence.py:156-157'}
          preformal_definition_audit: {must_equal: BLOCKED_TOOL_TIMEOUT, source: 'validate_current_test_evidence.py:159'}
          preformal_constituent_checks: {must_equal: '19/19 PASS', source: 'validate_current_test_evidence.py:160'}
          preformal_total_constituents: {must_equal: '20/20 PASS INCLUDING MANDATORY REGRESSION MATRIX CONSTITUENT', source: 'validate_current_test_evidence.py:160'}
          monolithic_wrapper_result: {must_equal: NOT_COMPLETED_TOOL_TIMEOUT, source: 'validate_current_test_evidence.py:160'}
          github_prior_phase_replay: {must_equal: SUCCESS, source: 'validate_evidence_state_closure.py:26'}
          github_prior_phase_replay_run_id: {must_equal: 34734265713, source: 'validate_evidence_state_closure.py:26'}
          github_successor_replay: {must_equal: SUCCESS, source: 'validate_evidence_state_closure.py:28'}
          github_successor_replay_run_id: {must_equal: 34734730080, source: 'validate_evidence_state_closure.py:28'}
          github_page_replay_content_audit: {must_equal: SUCCESS, source: 'validate_evidence_state_closure.py:30'}
          github_page_replay_content_audit_run_id: {must_equal: 34734730080, source: 'validate_evidence_state_closure.py:30'}

  - path: 11_EVIDENCE/audit/HIGH_PRESSURE_HARDENING_RESULT.yaml
    required_keys: [governance_revision, results]
    constraints:
      governance_revision:
        when_fresh: must_equal GOVERNANCE_CANDIDATE_STATE.fresh_revalidation.predecessor_evidence_revisions.high_pressure
        when_not_fresh: must_start_with candidate
        source: validate_current_test_evidence.py:77,82
      results:
        '<result_key>': {must_equal: '<total>/<passed> PASS', source: 'validate_current_test_evidence.py:146'}
        mandatory_regression_matrix: {must_equal: '{suite_count}/{suite_count} SUITES PASS'}
        reference_semantic_cases: {must_equal: '28/28 PASS'}
        reference_semantic_fuzz: {must_equal: '46/46 BLOCKED; 0 ESCAPED'}
        preformal_global: {must_equal: 'BLOCKED_TOOL_TIMEOUT; MONOLITHIC WRAPPER NOT COMPLETED', source: 'validate_current_test_evidence.py:164'}
        preformal_constituent_checks: {must_equal: '19/19 PASS; MANDATORY REGRESSION MATRIX {suite_count}/{suite_count} SUITES PASS', source: 'validate_current_test_evidence.py:166'}
    registration_required:
      root_manifest_membership: '10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml current_artifacts OR validators'
      source: test_high_pressure_hardening.py:115-120
      tests: [root_manifest_omission_HIGH_PRESSURE_HARDENING_RESULT.yaml, test_bugfix_regressions]

  - path: 11_EVIDENCE/audit/REFERENCE_SEMANTIC_REPAIR_RESULT.yaml
    required_keys: [governance_revision, results]
    constraints:
      governance_revision:
        when_fresh: must_equal GOVERNANCE_CANDIDATE_STATE.fresh_revalidation.predecessor_evidence_revisions.reference_semantic
        source: validate_current_test_evidence.py:78
      results:
        '<result_key excluding high_pressure_suite and execution_governance_load>': {must_equal: '<total>/<passed> PASS', source: 'validate_current_test_evidence.py:147-149'}
        reference_semantic_cases: {must_equal: '28/28 PASS'}
        fuzz_total: {must_equal: '46/46 BLOCKED; 0 ESCAPED', note: 'key name is fuzz_total here, not reference_semantic_fuzz', source: 'validate_current_test_evidence.py:156'}
        preformal_global: {must_equal: 'BLOCKED_TOOL_TIMEOUT; MONOLITHIC WRAPPER NOT COMPLETED'}
        preformal_constituent_checks: {must_equal: '19/19 PASS; MANDATORY REGRESSION MATRIX {suite_count}/{suite_count} SUITES PASS'}

  - path: 11_EVIDENCE/audit/GOVERNANCE_DEFECT_LEDGER.yaml
    required_keys: [defects]
    constraints:
      defects:
        type: list_of_objects
        keys: [defect_uid, status]
        rules:
          - {rule: 'no defect with uid matching ^DEF-V21[89]- may carry status containing GITHUB_REPLAY_PENDING or FIXED_PREFORMAL_REVERIFY_PENDING', source: 'validate_evidence_state_closure.py:42-44'}
          - {rule: 'exactly one defect_uid == DEF-V219-IMMUTABLE-PACKAGE-EVIDENCE-STATE-DRIFT-001 with status FIXED_PREFORMAL_VERIFIED', source: 'validate_evidence_state_closure.py:45-47'}
          - {rule: 'must contain DEF-V218-PREDECESSOR-VALIDATOR-SUCCESSOR-REJECTION-001', source: 'test_v2_1_9_evidence_state_closure.py:46'}
          - {rule: 'must contain DEF-V212-PREDECESSOR-CURRENT-STATE-LOCK-001', source: 'test_v2_1_12_successor_state_evidence_parse.py:82'}
          - {rule: 'a DEF-V212-* pending replay status is permitted (future successor)', source: 'test_v2_1_12_successor_state_evidence_parse.py:82-84'}

  - path: 11_EVIDENCE/audit/GITHUB_REPLAY_CLOSURE_RESULT.yaml
    required_keys: [status, evidence, stale_state_closure]
    constraints:
      status: {must_equal: PASS, source: 'validate_evidence_state_closure.py:49'}
      evidence:
        v218_successor_linkage_final: {run_id: 34733833659, result: SUCCESS_6_OF_6, head_sha_required: true, source: 'validate_evidence_state_closure.py:52-59'}
        pre_page_replay: {run_id: 34734265713, result: SUCCESS_5_OF_5, head_sha_required: true}
        page_blueprint_replay_after_hash_correction: {run_id: 34734528373, result: SUCCESS_6_OF_6, head_sha_required: true}
        page_replay_content_audit_closure: {run_id: 34734730080, result: SUCCESS_7_OF_7, head_sha_required: true}
      stale_state_closure:
        github_replay_pending_remaining: {must_equal: 0}
        fixed_preformal_reverify_pending_remaining: {must_equal: 0}
        human_formal_review_pending_preserved: {must_be: true}
        formal_test_executed: {must_be: false}
        formal_freeze_claimed: {must_be: false}
        production_release_claimed: {must_be: false}

coupled_registry_updates:
  - path: 10_REGISTRY/REVIEW_PROGRESS_LEDGER.yaml
    required:
      governance_revision:
        when_fresh: must_equal root_revision
        when_not_fresh: must_start_with candidate
        source: validate_current_test_evidence.py:79,82
      machine_review_plan:
        shape: 'list length 1'
        item: {status: PASS, target_revision: '<predecessor_evidence_revisions.machine_review_target_revision>', verification_method: MACHINE_RECOMPUTED_BY_VAL-GOV-032}
        source: validate_current_test_evidence.py:169-172
      machine_review_policy.historical_revision_evidence: {when_fresh: must_equal REVERIFY_REQUIRED, source: 'validate_current_test_evidence.py:173-174'}
      machine_review_progress: {required: 1, approved: 1, pending: 0, percentage: 100, source: 'validate_current_test_evidence.py:175-177'}
      required_review_plan: {length: 1, item_status: PENDING, source: 'validate_evidence_state_closure.py:69-71'}
      progress.approved: {must_equal: 0, source: 'validate_evidence_state_closure.py:72-73'}
      current_results: {rule: 'must be non-empty IF progress.approved > 0', source: 'validate_current_test_evidence.py:178-181'}
  - path: 10_REGISTRY/GOVERNANCE_ACCEPTANCE_AUDIT_BLUEPRINT.yaml
    required:
      governance_revision: {when_fresh: must_equal root_revision, source: 'validate_current_test_evidence.py:80'}
      current_test_evidence_sync_contract: {state: ALREADY_COMPLIANT_VERIFY_ONLY}
      test_runner_isolation_contract: {state: ALREADY_COMPLIANT_VERIFY_ONLY}
  - path: 10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml
    required:
      add_member: '11_EVIDENCE/audit/HIGH_PRESSURE_HARDENING_RESULT.yaml to current_artifacts or validators'
      then_refresh: '09_TESTS/governance/refresh_governance_root_manifest.py'
  - path: 10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml
    required:
      add_to_required_root_manifest_paths: '11_EVIDENCE/audit/HIGH_PRESSURE_HARDENING_RESULT.yaml'
      recompute_content_hash: 'sha256(yaml.safe_dump(anchor_without_content_hash, sort_keys=True, width=180))'
      re_anchor_literals:
        - 09_TESTS/governance/validate_reference_semantics.py:7
        - '10_REGISTRY/SPECIFICATION_MANIFEST.yaml (synchronized mirror)'
      rule: 'SEMANTIC_BASELINE_CONTENT_HASH literal owner must be exactly one canonical Python owner'
      source: validate_reference_semantics.py:32-46,55
  - path: CHECKSUMS.sha256
    required: regenerate after all edits
  - path: 10_REGISTRY/SECTION_NUMBER_REGISTRY.yaml
    required: 'verify referenced section uids resolve; blocked by Blocker C anchors'
    note: 'Only relevant if B introduces new references; no direct B field depends on it'

external_blockers:
  - id: A
    check: external_trust_root
    reason: 'WEB_GOVERNANCE_TRUST_ROOT external immutable package hash set; not committed to repo'
  - id: C
    check: section_registry / execution_governance_load
    reason: 'mother-spec anchors WEB-GOV-01-S084, WEB-GOV-04-S005, WEB-GOV-03-S062A pending authoritative version'
