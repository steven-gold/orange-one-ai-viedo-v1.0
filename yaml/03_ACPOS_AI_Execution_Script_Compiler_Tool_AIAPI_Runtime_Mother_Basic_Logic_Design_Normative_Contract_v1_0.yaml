    text: 22. Artifact / Version / Output Handoff Contract
  - index: 92
    style: List Bullet
    text: Provider result is not automatically a canonical ASSET/VIDEO/EDIT/VOICE/CORE output. AI03 hands off a normalized candidate/result plus exact lineage to
      downstream owner.
  - index: 93
    style: List Bullet
    text: Artifact identity MUST be versioned; retry/fallback output MUST NOT overwrite a prior approved artifact.
  - index: 94
    style: List Bullet
    text: If output contract requires checksum, canonical filename, media metadata or provenance, those fields MUST be present before downstream promotion.
  - index: 95
    style: List Bullet
    text: Partial result is promotable only if the downstream output contract explicitly allows partial semantics; otherwise PARTIAL_RESULT remains non-terminal for
      business handoff.
