    formal_output: Confirmed Chapter Version
    finalization_operation_uid: CORE-01-DOMAIN-OP-MATERIALIZE-CHAPTER-VERSION
  - work_item: WORLD_SETTING
    required_upstream:
    - Confirmed Story
    - Confirmed Chapter
    formal_output: Confirmed World Version
    finalization_operation_uid: CORE-01-DOMAIN-OP-MATERIALIZE-WORLD-VERSION
  - work_item: DNA
    required_upstream:
    - Confirmed Story
    - Confirmed Chapter
    - Confirmed World
    formal_output: Confirmed/Locked DNA Versions
    finalization_action_uid: CORE-01-ACT-DNA-LOCK-REQUEST
  - work_item: BLUEPRINT
    required_upstream:
    - Confirmed Story
    - Confirmed Chapter
    - Confirmed World
    - Required DNA
    formal_output: Confirmed/Approved Blueprint Version
    finalization_action_uids:
    - CORE-01-ACT-BLUEPRINT-VALIDATE
    - CORE-01-ACT-BLUEPRINT-APPROVE
    - CORE-01-ACT-CHILD-LOCK-REQUEST
  topic_production_order:
  - work_item: TOPIC_SCOPE
    required_upstream:
    - Confirmed/locked Project Canon
    - Blueprint
    - DNA refs
    formal_output: Confirmed Topic Production Scope
    finalization_operation_uid: CORE-01-DOMAIN-OP-MATERIALIZE-TOPIC-SCOPE
  - work_item: PRODUCTION_SCRIPT
    required_upstream:
    - Exact Topic
    - Project Blueprint
    - Topic Scope
    - source candidate lineage
    formal_output: Confirmed Canonical Production Script
    finalization_operation_uid: CORE-01-DOMAIN-OP-MATERIALIZE-CANONICAL-SCRIPT
    authoring_contract_ref: CORE-01-CONTRACT-TOPIC-CANONICAL-PRODUCTION-SCRIPT
  conversation_cycle_rules:
    first_create: Create or resolve the first thread under exact Project/Topic + Work Item; no unrelated history.
    resume_unfinished: Return to the same unfinished thread/cycle; do not create duplicate draft versions.
    modify_before_confirm: Continue current conversation cycle; immutable candidate replacement requires a new Candidate.
    modify_after_confirm_or_lock: Start a new revision Conversation bound to exact base version; prior version and prior thread remain immutable/read-only history.
    branch_discussion: Branch stays under the same Work Item and is not a production Topic/formal truth until adopted through finalization.
    switch_work_item: Load selected Work Item Conversation; confirmed upstream outputs enter Context; raw prior-item chat is not merged.
  known_authority_gaps_open: []
  chapter_world_gap_resolution:
    GAP-CORE-01-WI-CHAPTER-FINALIZATION: CORE-01-DOMAIN-OP-MATERIALIZE-CHAPTER-VERSION
    GAP-CORE-01-WI-WORLD-FINALIZATION: CORE-01-DOMAIN-OP-MATERIALIZE-WORLD-VERSION
