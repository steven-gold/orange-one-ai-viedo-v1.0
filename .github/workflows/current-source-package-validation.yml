name: Current Source Package Validation
on:
  push:
    branches:
      - rebuild-v2.1.1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-package-successor-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Validate integrated source package
        run: |
          set -euo pipefail
          test "$(python -c "import yaml; d=yaml.safe_load(open('governance/source-package/CURRENT_SOURCE_PACKAGE_INTEGRATION.yaml')) or {}; print(d.get('status'))")" = "INTEGRATED_CURRENT_WORKLINE"
          python governance/source-package/materialize_derived_source_package.py --check
          python governance/source-package/refresh_source_checksums.py --check
          python governance/ci/validate_current_source_package.py
      - name: Diagnose mandatory regression failures
        if: failure()
        run: |
          python .github/governance-source/active/source/09_TESTS/governance/test_high_pressure_hardening.py || true
