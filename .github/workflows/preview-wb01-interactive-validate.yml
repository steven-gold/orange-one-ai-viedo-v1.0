name: Preview WB-01 Interactive Validation
on:
  push:
    branches: [preview-interactive-wb01-staging]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inject preview runtime and static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check preview/preview-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview/index.html')
          text=p.read_text()
          tag='<script src="preview-runtime.js"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html missing </body>')
              text=text.replace('</body>', tag+'</body>', 1)
              p.write_text(text)
          if p.read_text().count(tag) != 1:
              raise SystemExit('preview runtime tag count must equal 1')
          PY
          grep -q '<script src="preview-runtime.js"></script>' preview/index.html
          grep -q 'data-control-id="CTRL-WORKSPACE-WB-01-COMPANY-PROJECT-COUNT-OPEN"' preview/index.html
          grep -q 'aria-haspopup="listbox"' preview/index.html
      - name: Install isolated browser test harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/acpos-preview-pw
          mkdir -p /tmp/acpos-preview-pw
          cd /tmp/acpos-preview-pw
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install chromium --with-deps
      - name: Browser interaction validation
        shell: bash
        run: |
          set -euo pipefail
          REPO_DIR="$PWD"
          python3 -m http.server 8000 --directory "$REPO_DIR/preview" >/tmp/preview-http.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          cat > /tmp/acpos-preview-pw/preview-wb01.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');
          test('homepage language and view controls are interactive without fake data', async ({ page }) => {
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/index.html', {waitUntil:'networkidle'});

            const language=page.locator('button[aria-haspopup="listbox"]');
            await expect(language).toHaveText('zh-TW');
            await language.click();
            await expect(page.locator('#acpos-preview-language-menu')).toBeVisible();
            await page.getByRole('option', {name:/English/}).click();
            await expect(language).toHaveText('en');
            await expect(page.locator('[data-nav-id="NAV-01"] .nav-label')).toHaveText('Dashboard');
            const first=page.locator('section[data-section-id="SEC-WORKSPACE-WB-01-COMPANY-PROJECT-COUNT"]');
            await expect(first.locator('h2')).toHaveText('Company Project Count');
            await expect(first.locator('button[data-control-id]')).toHaveText('View');

            await first.locator('button[data-control-id]').click();
            const drawer=page.locator('#acpos-preview-drawer');
            await expect(drawer).toBeVisible();
            await expect(drawer.locator('h2')).toHaveText('Company Project Count');
            await expect(drawer.locator('.content')).toContainText('—');
            await expect(drawer.locator('.note')).toContainText('does not fabricate');
            await drawer.locator('.close').click();
            await expect(drawer).toHaveCount(0);

            await language.click();
            await page.getByRole('option', {name:/简体中文/}).click();
            await expect(language).toHaveText('zh-CN');
            await expect(first.locator('h2')).toHaveText('专案总数');
            await first.locator('button[data-control-id]').click();
            await expect(page.locator('#acpos-preview-drawer h2')).toHaveText('专案总数');
            await expect(page.locator('#acpos-preview-drawer .note')).toContainText('不伪造实际营运数据');
            if (errors.length) throw new Error('page errors: '+JSON.stringify(errors));
          });
          JS
          cd /tmp/acpos-preview-pw
          npx playwright test preview-wb01.spec.js --browser=chromium --reporter=line
      - name: Self-clean and commit validated preview
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preview-wb01-interactive-validate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'ACPOS Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/index.html preview/preview-runtime.js .github 2>/dev/null || git add preview/index.html preview/preview-runtime.js
          git commit -m 'feat(preview): enable WB-01 language and view interactions'
          git push origin HEAD:preview-interactive-wb01-staging
