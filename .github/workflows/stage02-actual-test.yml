          assert set(actual).issubset(set(expected)), {'unexpected_staged_delta': actual, 'authorized': expected}
          if not tracked:
              assert actual == expected, {'mode': 'FIRST_MATERIALIZATION', 'expected': expected, 'actual': actual}
              mode = 'FIRST_MATERIALIZATION'
          else:
