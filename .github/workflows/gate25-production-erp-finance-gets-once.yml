name: ACPOS Gate25 ERP Finance GET Production Acceptance Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-production-erp-finance-gets-once.yml'

permissions:
  contents: write

jobs:
  erp-finance-gets:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_EXPECT_RELEASE_SHA: 608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Install browser audit dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Execute exact 3 ERP Finance GET Production controls
        shell: bash
        run: |
          node --check scripts/gate25-production-erp-finance-gets-acceptance.mjs
          node scripts/gate25-production-erp-finance-gets-acceptance.mjs | tee "$RUNNER_TEMP/erp-finance-gets.log"

      - name: Materialize exact per-resource PASS evidence and synchronize ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          log=Path(os.environ['RUNNER_TEMP'])/'erp-finance-gets.log'
          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          evidence_path=Path('docs/construction/evidence/GATE25_ERP_FINANCE_GET_PRODUCTION_EXECUTION_2026-09-10.json')
          prefix='GATE25_ERP_FINANCE_GET_PRODUCTION_EVIDENCE '
          payload=[line for line in log.read_text().splitlines() if line.startswith(prefix)]
          assert len(payload)==1, f'expected one ERP finance GET evidence payload, got {len(payload)}'
          resources=json.loads(payload[0][len(prefix):])
          assert len(resources)==3 and len({r['resource_key'] for r in resources})==3
          assert all(r['outcome']=='PASS' and r['method']=='GET' and r['http_status']==200 and r['runtime_control_enabled'] for r in resources)
          ledger=json.loads(ledger_path.read_text())
          assert ledger['denominator']['total']==1481
          entries={entry['resource_key']:entry for entry in ledger['entries']}
          before=dict(ledger['counts'])
          for resource in resources:
            assert resource['resource_key'] in entries, f'missing ledger entry: {resource["resource_key"]}'
            assert entries[resource['resource_key']]['disposition']=='NOT_EXECUTED', f'{resource["resource_key"]} expected NOT_EXECUTED, got {entries[resource["resource_key"]]["disposition"]}'
          evidence={
            'document_id':'ACPOS_GATE25_ERP_FINANCE_GET_PRODUCTION_EXECUTION',
            'status':'PASS',
            'executed_at':datetime.now(timezone.utc).isoformat(),
            'production_release_sha':os.environ['ACPOS_EXPECT_RELEASE_SHA'],
            'deployment_url':os.environ['ACPOS_DEPLOYMENT_URL'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'resource_count':3,
            'mutation_count':0,
            'resources':resources,
            'rule':'PASS applies only to these exact ERP finance GET-only controls after authenticated Production UI invocation returns HTTP 200, the Current control is enabled, browser runtime errors are absent, and no effectful request is emitted.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          run_ref=f'GitHub Actions: ACPOS Gate25 ERP Finance GET Production Acceptance run_id={os.environ["GITHUB_RUN_ID"]}'
          for resource in resources:
            entry=entries[resource['resource_key']]
            entry['disposition']='PASS'
            entry['reason_code']='PRODUCTION_ERP_FINANCE_GET_RUNTIME_PASS'
            entry['evidence_refs']=[str(evidence_path),run_ref,'scripts/gate25-production-erp-finance-gets-acceptance.mjs','src/components/pages/ErpControlRuntime.tsx','src/domain/erp/erpRuntimeContract.ts']
            entry['blocker_detail']=None
            entry['operation_ids']=[resource['operation_id']]
          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for entry in ledger['entries']:
            counts[entry['disposition']]+=1
          assert sum(counts.values())==1481
          assert counts['PASS']==before['PASS']+3
          assert counts['BLOCKED']==before['BLOCKED']
          assert counts['NOT_EXECUTED']==before['NOT_EXECUTED']-3
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'before':before,'after':counts,'resource_count':3},ensure_ascii=False))
          PY

      - name: Validate synchronized ledger
        run: node scripts/release-formal-acceptance-ledger.mjs

      - name: Commit ERP Finance GET evidence and ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_ERP_FINANCE_GET_PRODUCTION_EXECUTION_2026-09-10.json
          git commit -m 'evidence(gate25): pass 3 ERP Finance Production GET controls'
          git push origin HEAD:new
