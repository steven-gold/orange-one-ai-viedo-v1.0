name: Stage-02 External Authority Recovery Validation

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-external-authority-recovery-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-exact-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove Current governance and exact WU context
        shell: bash
        run: |
          set -euo pipefail
          python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
          python governance/ci/governance_resolver.py
          python governance/ci/validate_canonical_rule_registry.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/specification_mutation_guard.py
          python -c "import yaml; s=yaml.safe_load(open('governance/test/ACTIVE_STATE.yaml')) or {}; a=s.get('active_work_unit') or {}; assert a.get('work_unit_uid')=='WU-STAGE02-AUTHORITY-RECOVERY-001'; assert a.get('canonical_owner')=='governance/ci/validate_current_stage2_external_authority_resolution_r3.py'; assert int(a.get('product_blocker_credit') or 0)==0; print('PASS: exact authority recovery WU resolved')"
      - name: Verify exact restored Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml)" = 465329b6fb19b8e44c3083a9f280015ee95cc55c
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/ASYNC/ACPOS_PRODUCTION_ASYNC_QUEUE_RUNTIME_CONTRACT_FINAL_LOCKED_V1.0.yaml)" = ac3619b3bc547ce06f244c239fa69d3cac78da76
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/GAP-005/ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT_FINAL_LOCKED_V1.3.yaml)" = 12ef6d233e09f84571dd5d694ae8e3789ae70502
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/GAP-006/ACPOS_SHARED_RUNTIME_OPERATION_AUTHORITY_V1.0.yaml)" = 12dbdf59a60df5b1cb3d3b18666209c05bb0c0a3
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/GAP-008/ACPOS_AIAPI-01_FINAL_LOCKED_ENCODING.yaml)" = dd9f05e295af57cc833e90d1a12030c8198580c6
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/GAP-008/ACPOS_SYSTEM_AUTHORITY_FINAL_LOCKED_CURRENT.yaml)" = b09b7ca50313172ea021d9da0c8d57f2942f7b19
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/GAP-008/operation_registry.yaml)" = 7d234cc2f2f831b82f2007403c71d4008b46a012
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/EXTERNAL_AUTHORITY/STAGE2_EXTERNAL_AUTHORITY_MATERIALIZATION_EVIDENCE.yaml)" = ff99fd8c48f4593c5ef5cdeab1d49c5caa027cfd
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/SHARED_OWNER_PORT_MAP.yaml)" = 93f395264d7deec54dc86ddc286e484a8368c239
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/SHARED_OWNER_PORT_MAP_R2.yaml)" = 65f821ad766994716f4336e961b1b160b5aac457
          test "$(git hash-object 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/SHARED_OWNER_PORT_MAP_R3.yaml)" = acb56fc7df74b50c3ef808dc29b0ef2e668bc92b
          echo 'PASS: all exact historical authority blobs restored byte-identically'
      - name: Materialize Current preflight and validate R3 authority resolution
        shell: bash
        run: |
          set -euo pipefail
          python governance/ci/compile_stage_execution_preflight.py --materialize
          python governance/ci/compile_stage_execution_preflight.py --check
          python governance/ci/validate_current_stage2_required_outputs.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/specification_mutation_guard.py
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
      - name: Run complete Current Full-Line after exact authority recovery
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
