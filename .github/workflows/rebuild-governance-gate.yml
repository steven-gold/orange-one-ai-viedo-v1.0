        run: python governance/ci/validate_current_v218_page_base_blueprint.py
  current-v219-page-replay-successor-audit-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v219_page_replay_successor_audit.py
  current-v219-evidence-successor-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
