name: KB-01 validation once

on:
  push:
    branches: [new]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scope and visual lock guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=b31845c8f236bbf95d2a9241b9588a921ebd6c94
          git diff --name-only "$BASE" HEAD | tee /tmp/kb01-changed.txt
          if grep -Eq '^(src/app/page.tsx|src/components/pages/DashboardVisual.tsx|src/components/pages/DashboardVisual.module.css)$' /tmp/kb01-changed.txt; then
            echo 'Protected WB-01 file changed' >&2
            exit 1
          fi
          unexpected=$(grep -Ev '^(src/components/pages/KnowledgeAdminVisual.tsx|src/domain/knowledge/knowledgeRuntimePort.ts|.github/workflows/kb01-validation-once.yml)$' /tmp/kb01-changed.txt || true)
          test -z "$unexpected" || { echo "Unexpected diff: $unexpected" >&2; exit 1; }
          test "$(git rev-parse HEAD:src/components/pages/KnowledgeAdminVisual.module.css)" = "a588454cd1ae74d0aa85109d4983bc7555912b20"
      - name: Authority and registry count guard
        run: |
          node <<'NODE'
          const fs=require('fs');
          const authority=fs.readFileSync('authority/pages/admin/KB-01/ACPOS_KB-01_FINAL_LOCKED_ENCODING.yaml','utf8');
          const visual=fs.readFileSync('src/components/pages/KnowledgeAdminVisual.tsx','utf8');
          const runtime=fs.readFileSync('src/domain/knowledge/knowledgeRuntimePort.ts','utf8');
          const actionBlock=authority.split('action_registry:')[1].split('gate_registry:')[0];
          const controlBlock=authority.split('control_registry:')[1].split('action_registry:')[0];
          const authActions=[...actionBlock.matchAll(/A:([A-Z0-9-]+)::/g)].map(m=>'KB-01-ACT-'+m[1]);
          const codeActions=[...runtime.matchAll(/uid: "(KB-01-ACT-[A-Z0-9-]+)"/g)].map(m=>m[1]);
          const authControls=[...controlBlock.matchAll(/T:([A-Z0-9-]+)::/g)].map(m=>'KB-01-CTL-'+m[1]);
          const codeControls=[...visual.matchAll(/uid: "(KB-01-CTL-[A-Z0-9-]+)"/g)].map(m=>m[1]);
          const fieldArrays=[...visual.matchAll(/fields: \[([^\]]*)\]/g)];
          const fields=fieldArrays.reduce((n,m)=>n+([...(m[1].matchAll(/"[^"]+"/g))].length),0);
          const sections=(visual.split('const FIELD_GROUPS')[0].match(/\{ section: \d+, name:/g)||[]).length;
          const components=[...visual.split('const FIELD_GROUPS')[0].matchAll(/suffix: "[A-Z0-9-]+", name:/g)].length;
          const same=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);
          if(!same(authActions,codeActions)||authActions.length!==21) throw new Error(`action mismatch ${authActions.length}/${codeActions.length}`);
          if(!same(authControls,codeControls)||authControls.length!==27) throw new Error(`control mismatch ${authControls.length}/${codeControls.length}`);
          if(sections!==16||components!==22||fields!==127) throw new Error(`visual count mismatch ${sections}/${components}/${fields}`);
          if(!runtime.includes('KB01_PROJECTION_STATE_UNREGISTERED')) throw new Error('page-state fail-closed guard missing');
          if(!runtime.includes('/v1/ui-projections/admin%3AKB-01')) throw new Error('projection read-model route missing');
          console.log({sections,components,fields,controls:codeControls.length,actions:codeActions.length});
          NODE
      - name: Install
        run: npm ci
      - name: npm audit
        continue-on-error: true
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Residual scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '\b(TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME)\b|@ts-ignore|@ts-nocheck|@ts-expect-error|\bdebugger\b|console\.(log|debug)\b' src/components/pages/KnowledgeAdminVisual.tsx src/domain/knowledge/knowledgeRuntimePort.ts; then
            echo 'Residual marker found' >&2
            exit 1
          fi
      - name: Temporary Playwright install
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
      - name: Production browser validation
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/kb01-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/kb01-next.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/knowledge >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto('http://127.0.0.1:3000/admin/knowledge',{waitUntil:'networkidle'});
            await page.waitForSelector('[data-page-uid="admin:KB-01"][data-page-state="ERROR"]',{timeout:15000});
            const root=page.locator('[data-page-uid="admin:KB-01"]');
            assert.equal(await root.getAttribute('data-section-registry-count'),'16');
            assert.equal(await root.getAttribute('data-component-registry-count'),'22');
            assert.equal(await root.getAttribute('data-field-registry-count'),'127');
            assert.equal(await root.getAttribute('data-control-registry-count'),'27');
            assert.equal(await root.getAttribute('data-action-registry-count'),'21');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert.equal(await root.getAttribute('data-projection-status'),'BLOCKED');
            assert((await page.locator('body').innerText()).includes('UI_PROJECTION_RUNTIME_NOT_BOUND'));
            const projection=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3AKB-01');return {status:r.status,body:await r.json()};});
            assert.equal(projection.status,503);
            assert.equal(projection.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            const views=[
              ['KB-01-VIEW-OVERVIEW','KB-01-VIEW-OVERVIEW'],
              ['KB-01-VIEW-SOURCE','KB-01-VIEW-SOURCE'],
              ['KB-01-VIEW-SEARCH','KB-01-VIEW-SEARCH'],
              ['KB-01-VIEW-EXPERIENCE','KB-01-VIEW-EXPERIENCE'],
              ['KB-01-VIEW-REVIEW','KB-01-VIEW-REVIEW'],
            ];
            for(const [button,current] of views){
              await page.locator(`[data-view-uid="${button}"]`).click();
              assert.equal(await page.locator('[data-current-view]').getAttribute('data-current-view'),current);
              const traced=page.locator('button[data-action-id]');
              for(let i=0;i<await traced.count();i++){
                const b=traced.nth(i);
                assert.notEqual(await b.getAttribute('data-action-owner'),'UNRESOLVED');
                assert.equal(await b.getAttribute('data-runtime-binding'),'NOT_EXECUTED');
                assert((await b.getAttribute('data-blocked-reason'))?.length>0);
              }
            }
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              assert(overflow<=0,`horizontal overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('KB01_BROWSER_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Product tree residue check
        run: |
          test -z "$(git status --porcelain package.json package-lock.json src authority)"
