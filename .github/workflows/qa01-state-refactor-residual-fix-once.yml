name: QA01 State Refactor Residual Fix Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-state-refactor-residual-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact residual fix and validate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/server/testing/controlledQaTestRuntime.ts')
          s=p.read_text()
          old='return pass(request.correlation_id,{qa_review_id:state.qa_review_ref});'
          new='return pass(request.correlation_id,{qa_review_id:next.qa_review_ref});'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          npm ci
          npx tsc --noEmit
          git diff --check
          rm .github/workflows/qa01-state-refactor-residual-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/testing/controlledQaTestRuntime.ts .github/workflows/qa01-state-refactor-residual-fix-once.yml
          git commit -m 'fix(qa): remove stale controlled runtime state reference'
          git push origin HEAD:qa01-functional-staging
