    owner。
  禁止誤用: 本文件只引用，不重新建立第二套 Context/Truth/Experience 規則。
- 來源層: AI Conversation Intelligence Architecture Update
  本文件採用內容: 唯一 AI Conversation Core、Assistant=紀錄整理引擎、Conversation Continuity、Decision Memory、Context Resolver
    邊界、Extension 模式。
  禁止誤用: 不得把舊設計敘述當成 Runtime 已存在證據。
- 來源層: STR Conversation-First FINAL LOCKED design
  本文件採用內容: '#AI/#AST/#CONV/#BR、Single/Multi 索引、Cross-AI、Assistant secretary、Branch、@/# parser、chronology、message
    relations。'
  禁止誤用: STR-specific layout/market functions不升格為全站 shared business authority。
- 來源層: Current construction master / historical domain specs
  本文件採用內容: conversation_id/thread_id、branch operation、shared conversation usages、legacy exact names作為搜尋與
    reconcile 線索。
  禁止誤用: 歷史/舊版 master 不可壓過 Current Governance；exact binding 仍需 Current-admissible owner。
layers:
- Layer: L1 Surface Integration
  Owner / Responsibility: Domain page/workspace renders the shared conversation surface.
  Hard Boundary: MUST_NOT fork core message/reference/branch logic.
- Layer: L2 Conversation Identity
  Owner / Responsibility: Conversation/Thread/Branch lifecycle, lineage and scope.
  Hard Boundary: Identity is ACPOS-owned, not Provider-owned.
- Layer: L3 Message Graph
  Owner / Responsibility: Immutable message identity, sequence, reply/reference/review edges.
  Hard Boundary: Timeline and relation graph are separate projections.
- Layer: L4 Coordination
  Owner / Responsibility: Single AI, Multi-AI session aliases, Cross-AI relation metadata.
  Hard Boundary: Aliases ≠ provider/model/role authority.
- Layer: L5 Assistant
  Owner / Responsibility: Meeting secretary/record engine.
  Hard Boundary: MUST_NOT act as independent analyst or third AI mode.
- Layer: L6 Continuity
  Owner / Responsibility: Context snapshot ref/fingerprint, resume pointer, stale detection.
  Hard Boundary: Actual Context truth owned by ACPOS-AI-01.
- Layer: L7 Runtime Bridge
  Owner / Responsibility: Dispatch intent, execution job ref, provider brand result.
  Hard Boundary: Execution/routing owned by ACPOS-AI-03.
