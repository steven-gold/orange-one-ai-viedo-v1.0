name: ACPOS Batch 14 Status Semantics

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-14-status-semantics
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install runtime
        run: python -m pip install --quiet python-docx
      - name: Verify no Word drift since Batch 13
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="0e116b28d18af69b031fb03497a75ed78dcd7f83"
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"HEAD","--","*.docx"],text=True)
          changed=[x for x in out.splitlines() if x]
          assert changed==[],changed
          print("PASS: NO WORD DRIFT SINCE BATCH-13")
          PY
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_14_status_semantics.py
      - name: Inspect status semantics
        run: python __temp/batch_14_status_semantics.py
