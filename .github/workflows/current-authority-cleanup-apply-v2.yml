name: Apply Current Authority Pollution Cleanup V2
on:
  push:
    branches: [current-authority-pollution-cleanup]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ github.event.head_commit.message != 'cleanup: apply current authority pollution fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Current Authority cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          def r(p): return Path(p).read_text()
          def w(p,s): Path(p).write_text(s)
          def x(p,a,b,n=1):
              s=r(p)
              if s.count(a)!=n: raise SystemExit(f'{p}: expected {n}, got {s.count(a)} for {a[:80]}')
              w(p,s.replace(a,b,n))
          x('src/components/pages/CoreVisual.tsx','data-layout="CORE-01-PRIMARY-GRID"','data-layout="primary-grid"')
          x('src/components/pages/EditControlRuntime.tsx',',"EDIT-01-ACT-EVAL-JUMP":"EDIT-01-CMP-TIMELINE"','')
          p='src/server/testing/controlledQaTestRuntime.ts';s=r(p)
          a='const done=(Number(next.values["QA-01-FLD-AUTO-PROGRESS-DONE"]??0)+1);next.values["QA-01-FLD-AUTO-PROGRESS-DONE"]=done;next.values["QA-01-FLD-AUTO-PROGRESS"]=`${done}/2`;'
          b='const prior=String(next.values["QA-01-FLD-AUTO-PROGRESS"]??"0/2"),done=Math.min(2,(Number.parseInt(prior.split("/")[0]??"0",10)||0)+1);next.values["QA-01-FLD-AUTO-PROGRESS"]=`${done}/2`;'
          if a not in s: raise SystemExit('QA pollution pattern missing')
          w(p,s.replace(a,b,1))
          p='src/domain/asset/controlledAssetClientTestRuntime.ts';s=r(p)
          s=s.replace('let approvedCorrectionRef: string | null = null;','let approvedCorrectionRef: string | null = null;\nlet lockedVersionRef: string | null = null;',1)
          s=s.replace('locked_version_ref: projection.values["ASSET-01-TEST-LOCK-REF"],','locked_version_ref: lockedVersionRef,',1)
          s=s.replace('const lockRef = `TEST-ASSET-LOCK-${projection.output_version_id}`;\n    next.page_state = "LOCKED";','const lockRef = `TEST-ASSET-LOCK-${projection.output_version_id}`;\n    lockedVersionRef = lockRef;\n    next.page_state = "LOCKED";',1)
          s=s.replace('    next.values["ASSET-01-TEST-LOCK-REF"] = lockRef;\n','',1)
          s=s.replace('    next.output_version_id = restoredVersionRef;','    lockedVersionRef = null;\n    next.output_version_id = restoredVersionRef;',1)
          if 'ASSET-01-TEST-LOCK-REF' in s: raise SystemExit('ASSET client pseudo field remains')
          w(p,s)
          p='src/server/testing/controlledAssetTestRuntime.ts';s=r(p)
          s=s.replace('test_run_id: "TEST-RUN-ASSET-01-CONTROLLED",','test_run_id: "TEST-RUN-ASSET-CONTROLLED-01",',1)
          s=s.replace('  const lockedRef = state.output_version_id ? `TEST-ASSET-LOCK-${state.output_version_id}` : "—";\n','',1)
          a='      "ASSET-01-TEST-LOCK-REF": lockedRef,\n      "ASSET-01-TEST-HANDOFF-REF": state.handoff_ref ?? "—",'
          b='      "ASSET-01-FLD-TRACE": state.handoff_ref ?? (state.job_counter ? `TEST-ASSET-TRACE-${state.job_counter}` : "—"),'
          if a not in s: raise SystemExit('ASSET server pseudo fields missing')
          s=s.replace(a,b,1)
          if 'ASSET-01-TEST-' in s or 'ASSET-01-CONTROLLED' in s: raise SystemExit('ASSET pseudo token remains')
          w(p,s)
          p='src/domain/video/controlledVideoClientTestRuntime.ts';s=r(p)
