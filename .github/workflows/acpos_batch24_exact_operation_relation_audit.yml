name: ACPOS Batch 24 Same Owner Exact Operation Relation Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch24-exact-operation-relation-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 23 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="e3a9a6364c00863ca1b9b2511e4f1573a71a7630"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH23 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 24 exact operation relation audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch24_exact_operation_relation_audit.py

      - name: Verify Batch 24 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch24_exact_operation_relation_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["target_cells"]==341,s
          assert s["exact_operation_unique_relation"]+s["exact_operation_relation_conflict"]+s["no_exact_operation_relation"]==341,s
          print("PASS: BATCH24 EXACT OPERATION RELATION DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 24 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch24-exact-operation-relation-audit
          path: |
            __batch24_exact_operation_relation_audit.json
            __batch24_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 24 audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch24_exact_operation_relation_audit.json __batch24_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-24-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch24_exact_operation_relation_audit.py .github/workflows/acpos_batch24_exact_operation_relation_audit.yml
          git commit -m "chore(acpos): close batch 24 exact operation relation audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH24 AUDIT HARNESS REMOVED / CLEAN TREE"
