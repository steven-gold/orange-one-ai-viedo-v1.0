name: Product STAGE-08 Execute Entry
on:
  workflow_dispatch:
    inputs:
      work_units:
        description: Comma-separated Current STAGE-08 Work Unit UIDs
        required: true
        type: string
jobs:
  execute:
    uses: ./.github/workflows/product-stage-lifecycle-driver.yml
    with:
      stage: STAGE-08
      work_units: ${{ inputs.work_units }}
    secrets: inherit
