    - IMAGE_EDIT
    - TEXT_TO_VOICE
    - VOICE_TO_VOICE
    - OTHER_WHEN_REGISTERED
    - NO_PROVIDER_EXECUTION_REFERENCE_ONLY
    first_production_free_prompt: FORBIDDEN
    provider_picker: FORBIDDEN
  handoff_in:
  - CORE Production Package
  handoff_out:
  - ASSET -> VIDEO exact asset handoff
  experience_signals:
  - provider/model route
