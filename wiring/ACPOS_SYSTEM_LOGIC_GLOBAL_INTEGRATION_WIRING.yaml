brain_layers:
- Layer: BRAIN-01
  Owner Concept: SYSTEM_STATE
  責任: 全站 exact state/version/relationship projection；不替代 domain record
- Layer: BRAIN-02
  Owner Concept: CONTEXT
  責任: 依 page/operation/account/scope 選出 exact authorized context；建立 ContextPackage / Candidate
- Layer: BRAIN-03
  Owner Concept: CONVERSATION
  責任: CORE / Strategy / System AI 共用 thread/branch/context continuity core
- Layer: BRAIN-04
  Owner Concept: MEMORY
  責任: Conversation / Working / Decision / Version / Operational memory
- Layer: BRAIN-05
  Owner Concept: DECISION_GOVERNANCE
  責任: AI output 保持 candidate/analysis，直到 Human / Governance decision 完成
- Layer: BRAIN-06
  Owner Concept: VERSION_LINEAGE
  責任: exact version/hash/checksum/provenance；禁止 silent overwrite
- Layer: BRAIN-07
  Owner Concept: ORCHESTRATION
  責任: 解析合法下一步、handoff、dependency，不越權執行 domain action
- Layer: BRAIN-08
  Owner Concept: AI_EXECUTION
  責任: Provider-neutral instruction → capability → eligible profile → adapter → provider → normalized result
- Layer: BRAIN-09
  Owner Concept: EXPERIENCE
  責任: 從真實執行/結果/QA/成本/延遲形成 ExperienceRecord
- Layer: BRAIN-10
  Owner Concept: EVOLUTION
  責任: Experience → pattern → LearningCandidate → governed adoption
- Layer: BRAIN-11
  Owner Concept: EXTERNAL_DATA_ACQUISITION
  責任: 共用 crawl/search/fetch/ingest runtime；頁面只提交 domain intent
- Layer: BRAIN-12
  Owner Concept: GOVERNANCE_OBSERVABILITY
  責任: Permission / Policy / Classification / Audit / Error / Health / Truthful State
core_production_flow:
- 階段: CORE
  Owner Page: CORE-01
  輸入: Project / Topic / Context / Decisions
  輸出 / 下一步: Blueprint / DNA / Canonical Production Script
- 階段: ASSET
  Owner Page: ASSET-01
  輸入: Exact Blueprint / DNA / Script refs
  輸出 / 下一步: Asset Versions + evaluation + handoff
- 階段: VIDEO
  Owner Page: VIDEO-01
  輸入: Exact upstream refs + approved assets
  輸出 / 下一步: Video Versions + evaluation + handoff
- 階段: EDIT+VOICE
  Owner Page: EDIT-01
  輸入: Exact video/audio/script refs
  輸出 / 下一步: Integrated Edit / Render / Output Version
- 階段: QA
  Owner Page: QA-01
  輸入: Exact finished output + criteria_version_ref
  輸出 / 下一步: Pass / Finding / Correction Request / Recheck
production_flow_invariants:
- 每階段必須消費 exact upstream refs，不用 latest/current/default alias
- AUTO / MANUAL 只改 progression behavior，不改 Source Truth
- 任何修改建立新 version，禁止 silent overwrite
- QA 不自己生成替代媒體；Correction 回到真正的 production owner
identity_permission_page_gate:
- 瀏覽器攜帶 acpos_session HttpOnly Cookie
- Identity Runtime 解析 runtime session → READY account → non-disabled app_users actor
- Shell 取得 visible_page_uids，只顯示授權 Front/Admin L1
- 進入 Page 時再執行 exact page / section / action / control / API / field permission + scope + state gate
- Effectful write 額外要求 expected_version、idempotency、correlation、audit
- Permission denied = HIDDEN；authorized but state blocked = DISABLED + reason
ai_provider_routing:
- 步驟: Context Resolution
  系統行為: Current user + page operation → authorized scope → exact object/version/decision/source refs →
    conflict check → fingerprint → ACPOSContextPackage
- 步驟: Conversation
  系統行為: CORE / Strategy / System AI 共用 Conversation Core，但各 domain context 彼此隔離；mode switch 不得 silent
    reset
- 步驟: Instruction
  系統行為: Domain 產生 provider-neutral canonical instruction；Provider syntax 不得寫進 department script
- 步驟: Capability
  系統行為: 依 operation 確定 required capability；硬性 permission/policy/rights/classification/health 先過 Gate
- 步驟: Route
  系統行為: AIAPI-01 Router 從 eligible ProviderModelProfiles 排序；前端不得 override
- 步驟: Provider Adapter
  系統行為: 將 canonical instruction 轉 Provider-specific request；credential 只用 Secret Reference
- 步驟: Result
  系統行為: Normalize / validate / persist route-job-attempt-result lineage；回到 domain owner 做 evaluation /
    version / decision
ai_authority_boundary: Raw AI Output 永遠不是 Canonical Decision、Approved Knowledge 或 Production Truth。正式化需要對應
  Domain 的 Review / Approve / Adopt Gate。
shared_acquisition_consumers:
- Consumer: KB-01
  允許模式: WEB_CRAWL / WEB_FETCH / SEARCH / RSS / DOCUMENT / RECRAWL
  Output Target: Knowledge evidence / citation pipeline
- Consumer: INFO-01
  允許模式: SEARCH / WEB_FETCH / WEB_CRAWL
  Output Target: Fact / Evidence / Context Candidate
- Consumer: admin STR-01
  允許模式: SEARCH / WEB_CRAWL / WEB_FETCH / RECRAWL
  Output Target: Strategy source / watchlist / fact / trend
- Consumer: DEV-01
  允許模式: SEARCH / CRAWL / FETCH / JSON / CONTINUOUS
  Output Target: Company discovery evidence → directory
- Consumer: SOC-01
  允許模式: SEARCH / FETCH / JSON
  Output Target: Social target discovery evidence
shared_acquisition_rule: Shared Acquisition Runtime 統一負責 robots/rights/domain/rate/retry/snapshot/dedupe/normalize/evidence/audit。Page
  不可建立第二套 crawler，亦不可把 raw crawl result 直接寫成 Canon / Knowledge / Strategy Truth。
data_queue_version_audit:
- Layer: PostgreSQL + RLS
  Hard Rule: Canonical data owner per domain；RLS / permission 不可由前端取代
- Layer: Queue / Worker / DLQ
  Hard Rule: Async job 狀態與 retry/failure 由共用 runtime 管理；Frontend 不直接改 Job State
- Layer: Version / Lineage
  Hard Rule: 每次 revision 新增版本；Exact base/version/ref 必須保留；Asset/Output 不覆蓋原版本
- Layer: Integration Event
  Hard Rule: 只通知跨頁狀態；source domain object 仍是 truth owner
- Layer: Audit
  Hard Rule: Effectful operation 必須 correlation + actor + action + target + result / error；不得記錄 raw secret
- Layer: Evidence
  Hard Rule: Test/Production Evidence 證明執行結果，不成為產品 Authority
cross_page_handoff:
- Producer: CORE-01
  Handoff Object: Blueprint / Script / DNA refs
  Consumer: ASSET-01
  Gate: exact version + lock / approval state
- Producer: ASSET-01
  Handoff Object: Asset Version / Handoff
  Consumer: VIDEO-01
  Gate: accepted output + required lineage
- Producer: VIDEO-01
  Handoff Object: Video Version / Handoff
  Consumer: EDIT-01
  Gate: accepted output + required lineage
- Producer: EDIT-01
  Handoff Object: Final Output / QA Handoff
  Consumer: QA-01
  Gate: render complete + exact output version
- Producer: QA-01
  Handoff Object: Correction Request
  Consumer: Owning production page
  Gate: target exact source version + finding evidence
- Producer: INFO/KB/STR Admin
  Handoff Object: Context Candidate
  Consumer: Consumer Domain
  Gate: consumer review / adoption owner
- Producer: AIAPI-01
  Handoff Object: Route Decision / Provider Result
  Consumer: Owning Domain
  Gate: capability/permission/route lineage + normalized result
failure_recovery:
- Failure Class: IDENTITY / AUTH
  處置: Fail-closed；未授權內容/控制不顯示；不可 client bypass
- Failure Class: VERSION_CONFLICT
  處置: 停止 effectful write → reload exact version → review diff → resubmit
- Failure Class: MISSING AUTHORITY
  處置: BLOCK + REPORT_AUTHORITY_GAP；不得猜 operation / field / owner
- Failure Class: PROVIDER / EXTERNAL
  處置: 保留 pending/failed/degraded 真實狀態；不可 fake success
- Failure Class: QUEUE / ASYNC
  處置: 依 registered retry policy；retry 建立/保留獨立 attempt lineage
- Failure Class: DATA INCOMPLETE
  處置: 顯示 — / incomplete / stale / masked；不得以 0 或 sample 補值
- Failure Class: CROSS-STAGE HANDOFF
  處置: 缺 physical / schema-valid / required-field-complete input 時，阻擋 successor 並 re-enter owning predecessor
- Failure Class: AUDIT / EVIDENCE
  處置: 沒有 fresh evidence 不得宣告 runtime / deploy / production complete
acceptance:
- Acceptance UID: SYS-ACC-01
  PASS 條件: 18 個 Current Page 都有唯一 owner / route / permission / integration role。
- Acceptance UID: SYS-ACC-02
  PASS 條件: Front 9 + Admin 9；Global Shell adaptive reflow 不遮住 Workspace。
- Acceptance UID: SYS-ACC-03
  PASS 條件: Identity → Permission → Page Gate → Operation Gate 順序不可繞過。
- Acceptance UID: SYS-ACC-04
  PASS 條件: CORE→ASSET→VIDEO→EDIT→QA exact version handoff 完整。
- Acceptance UID: SYS-ACC-05
  PASS 條件: Provider selection 只在 AIAPI-01 / shared router；department picker 不存在。
- Acceptance UID: SYS-ACC-06
  PASS 條件: Context / Conversation / AI Output 不會自動變成 Canon / Approved Knowledge。
- Acceptance UID: SYS-ACC-07
  PASS 條件: Shared Acquisition 只有一套 runtime；KB/INFO/STR/DEV/SOC 不重複建 crawler。
- Acceptance UID: SYS-ACC-08
  PASS 條件: Async lifecycle / retry / failure / audit 保留完整 attempt lineage。
- Acceptance UID: SYS-ACC-09
  PASS 條件: No fake data / fake success / missing-as-zero / secret plaintext。
- Acceptance UID: SYS-ACC-10
  PASS 條件: Word/Authority 完整 ≠ application/runtime/deployment complete；完成宣告必須另有 fresh evidence。
verification_evidence_layers:
- Layer: DESIGN
  必須證明的事: 頁面、Shell、Navigation、Interaction、State、Error、Recovery 與 acceptance 定義完整；僅代表可施工。
- Layer: CLIENT
  必須證明的事: DOM / visual / keyboard / responsive / i18n / disabled reason 與 no-fake-data 行為符合設計。
- Layer: SERVER
  必須證明的事: Identity、Permission、Scope、State Guard、Version、Idempotency、Audit 均由 Server 執行，不能只靠前端。
- Layer: RUNTIME + DB
  必須證明的事: Canonical owner、migration、RLS、version lineage、transaction / persistence 可重現。
- Layer: ASYNC + PROVIDER
  必須證明的事: Queue / Worker / DLQ、Provider route / adapter / callback / retry 保留 exact attempt lineage。
- Layer: E2E
  必須證明的事: Browser 跨頁 handoff、negative paths、correction round-trip、shared runtime integration 實際通過。
- Layer: PRODUCTION
  必須證明的事: Exact deployed SHA、remote acceptance、Production data/runtime readiness 與 external provider evidence
    都存在。
