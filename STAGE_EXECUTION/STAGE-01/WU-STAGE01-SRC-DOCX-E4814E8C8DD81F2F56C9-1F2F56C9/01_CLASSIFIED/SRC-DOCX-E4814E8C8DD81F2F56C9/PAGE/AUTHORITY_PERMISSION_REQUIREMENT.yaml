  document_order_index: 35472
  source_text: '施工 AI MUST resolve UI behavior from this order: page machine authority → exact control row → action/gate/permission → payload/schema → operation/method/path → runtime/persistence owner → source runtime status.
    If a row is SPEC_EXACT_RUNTIME_BLOCKED or SPEC_EXACT_RUNTIME_NOT_EXECUTED, the UI definition is known but effectful enablement is forbidden until implementation evidence closes. If a quantitative value is SOURCE_NOT_DEFINED,
    do not choose a “reasonable” number.'
- source_node_uid: SN-7FF5020EEC983B8DFDE884BE
  document_order_index: 36290
  source_text: 本節只補齊既有 Current source 已可證明的設計契約。既有 Control / Action / Gate / Permission / Owner / Operation / Route 優先；SOURCE_NOT_DEFINED、NO_PUBLIC_API_ID_IN_CURRENT_AUTHORITY、SPEC_EXACT_RUNTIME_BLOCKED 不得由 Word 自行發明或升格為 Runtime
    完成。
- source_node_uid: SN-F8DE12671FC1CB3E0177AAE6
