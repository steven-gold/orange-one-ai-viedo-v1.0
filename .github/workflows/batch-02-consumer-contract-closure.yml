name: ACPOS Batch 02 Consumer Contract Closure

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-02-consumer-contract-closure
  cancel-in-progress: false

jobs:
  close-batch-02:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Apply batch 02
        run: python __temp/batch_02_inspect.py

      - name: Semantic closure verification
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          marker="ACPOS-20260921-BATCH-02-CONSUMER-CONTRACT-CLOSURE-V1"
          checks={
          "ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx":["requestSocialTargetPublish","artifact_checksum","criteria_version_id","scorecard_id","open_blocking_findings","PENDING_EXTERNAL"],
          "ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx":["22 Ports / 20 unique operations","OWNER_ORCHESTRATED_RUNTIME_EXACT_NO_PUBLIC_ROUTE","EDIT-01-BTN-ADD-MEDIA","EDIT-01-BTN-VOICE-GENERATE","NO_PUBLIC_API_ID_IN_CURRENT_AUTHORITY","NOT_EXECUTED / IMPLEMENTATION_REQUIRED"],
          "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx":["saveDraft","exportProjection","createCandidate","compareCandidates","rejectStrategyCandidate","adoptAsContextCandidate","SPEC_EXACT_RUNTIME_BLOCKED","SOURCE_NOT_DEFINED"],
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":["EDIT-01-BTN-ADD-MEDIA","EDIT-01-BTN-VOICE-GENERATE","NO_PUBLIC_API_ID_IN_CURRENT_AUTHORITY"],
          "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx":["saveDraft","exportProjection","createCandidate","compareCandidates","rejectStrategyCandidate","adoptAsContextCandidate","SPEC_EXACT_RUNTIME_BLOCKED"],
          }
          def txt(fn):
              d=Document(fn)
              return "\n".join([p.text for p in d.paragraphs]+[c.text for t in d.tables for r in t.rows for c in r.cells])
          for fn,needles in checks.items():
              t=txt(fn)
              assert marker in t,fn
              for n in needles: assert n in t,(fn,n)
          print("PASS: BATCH-02 SEMANTIC CLOSURE 5/5")
          PY

      - name: Render and geometry QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          from PIL import Image,ImageChops
          docs=[
          Path("ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx"),
          Path("ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
          Path("ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx"),
          Path("05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"),
          Path("08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx"),
          ]
          qa=Path("__render_qa_batch02"); pdf=qa/"pdf"; png=qa/"png"
          pdf.mkdir(parents=True,exist_ok=True); png.mkdir(parents=True,exist_ok=True)
          report={"docs":{},"pages":0,"blank":[],"edge":[]}
          for p in docs:
              subprocess.run(["libreoffice","--headless","--convert-to","pdf","--outdir",str(pdf),str(p)],check=True,stdout=subprocess.DEVNULL)
              pf=pdf/(p.stem+".pdf")
              info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
              pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
              od=png/p.stem; od.mkdir(parents=True,exist_ok=True)
              subprocess.run(["pdftoppm","-png","-r","120",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
              imgs=sorted(od.glob("page-*.png")); assert len(imgs)==pages
              blank=[];edge=[]
              for i,img in enumerate(imgs,1):
                  im=Image.open(img).convert("RGB")
                  diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
                  bb=diff.getbbox()
                  if bb is None: blank.append(i); continue
                  l,t,r,b=bb
                  if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2: edge.append(i)
              extracted=subprocess.check_output(["pdftotext","-layout",str(pf),"-"],text=True,errors="replace")
              assert "ACPOS-20260921-BATCH-02-CONSUMER-CONTRACT-CLOSURE-V1" in extracted,p.name
              report["docs"][p.name]={"pages":pages,"blank":blank,"edge":edge}
              report["pages"]+=pages
              report["blank"] += [(p.name,x) for x in blank]
              report["edge"] += [(p.name,x) for x in edge]
          assert not report["blank"],report["blank"]
          assert not report["edge"],report["edge"]
          (qa/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"documents":5,"pages":report["pages"],"blank":0,"edge":0},ensure_ascii=False))
          print("PASS: BATCH-02 RENDER/GEOMETRY QA 5/5")
          PY

      - name: Verify exact batch-02 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
          "ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          }
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-02 CHANGE SCOPE EXACT 5 WORD")
          PY

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-02-render-evidence
          path: __render_qa_batch02
          retention-days: 1

      - name: Commit batch 02 and clean temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch02
          git rm __temp/batch_02_inspect.py .github/workflows/batch-02-consumer-contract-closure.yml
          git config user.name "acpos-word-batch-02"
          git config user.email "actions@users.noreply.github.com"
          git add             ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx             ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx             ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx             05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx             08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          git commit -m "docs(acpos): close batch-02 consumer contract gaps"
          git push
