name: ACPOS Batch 50 System04 CORE Contract Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch50-system04-core-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 49 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="080e03e202859604c646fe55edc89c0f67737549"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH49 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 50 System04 CORE contract audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch50_system04_core_contract_audit.py

      - name: Verify Batch 50 denominator
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch50_system04_core_contract_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["system04_cells"]==53,s
          assert s["unique_controls"]>0 and s["operations"]>0,s
          assert sum(s["by_field"].values())==53,s
          print("PASS: BATCH50 SYSTEM04 DENOMINATOR")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 50 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch50-system04-core-contract-audit
          path: |
            __batch50_system04_core_contract_audit.json
            __batch50_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 50 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch50_system04_core_contract_audit.json __batch50_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-50-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch50_system04_core_contract_audit.py .github/workflows/acpos_batch50_system04_core_contract_audit.yml
          git commit -m "chore(acpos): close batch 50 system04 core contract audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH50 HARNESS REMOVED / CLEAN TREE"
