name: Preview Navigation Restore Once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          fetch-depth: 0

      - name: Install preview navigation bridge
        shell: bash
        run: |
          set -euo pipefail
          cat > preview/preview-navigation.js <<'JS'
          (() => {
            "use strict";
            const ROUTES = Object.freeze({
              "/":"index.html",
              "/core":"core.html",
              "/assets":"assets.html",
              "/video":"video.html",
              "/edit":"edit.html",
              "/qa":"qa.html",
              "/database":"db.html",
              "/strategy":"strategy.html",
              "/info":"info.html",
              "/admin/system":"system.html",
              "/admin/accounts":"accounts.html",
              "/admin/dev":"dev.html",
              "/admin/social":"social.html",
              "/admin/erp":"erp.html",
              "/admin/aiapi":"aiapi.html",
              "/admin/qa-criteria":"qa-criteria.html",
              "/admin/strategy":"strategy-admin.html",
              "/admin/knowledge":"knowledge-admin.html"
            });
            const TESTS = Object.freeze({
              "admin":["[data-control-uid='GHS-CTL-SURFACE-ADMIN']","/admin/system"],
              "front":["[data-control-uid='GHS-CTL-SURFACE-FRONT']","/"],
              "core":["[data-nav-id='NAV-02']","/core"],
              "assets":["[data-nav-id='NAV-03']","/assets"],
              "video":["[data-nav-id='NAV-04']","/video"],
              "edit":["[data-nav-id='NAV-05']","/edit"],
              "qa":["[data-nav-id='NAV-06']","/qa"],
              "database":["[data-nav-id='NAV-07']","/database"],
              "strategy":["[data-nav-id='NAV-08']","/strategy"],
              "info":["[data-nav-id='NAV-09']","/info"],
              "accounts":["[data-nav-id='ADMIN-NAV-02']","/admin/accounts"],
              "dev":["[data-nav-id='ADMIN-NAV-03']","/admin/dev"],
              "social":["[data-nav-id='ADMIN-NAV-04']","/admin/social"],
              "erp":["[data-nav-id='ADMIN-NAV-05']","/admin/erp"],
              "aiapi":["[data-nav-id='ADMIN-NAV-06']","/admin/aiapi"],
              "qa-criteria":["[data-nav-id='ADMIN-NAV-07']","/admin/qa-criteria"],
              "strategy-admin":["[data-nav-id='ADMIN-NAV-08']","/admin/strategy"],
              "knowledge-admin":["[data-nav-id='ADMIN-NAV-09']","/admin/knowledge"]
            });
            const flatUrl = (file) => new URL(file, location.href).href;
            const routeFromAnchor = (anchor) => {
              const raw = anchor.getAttribute("href") || "";
              if (raw.startsWith("/")) {
                try { return new URL(raw, location.origin).pathname.replace(/\/$/, "") || "/"; } catch { return null; }
              }
              return null;
            };
            const rewriteAnchor = (anchor) => {
              const route = routeFromAnchor(anchor);
              if (!route || !ROUTES[route]) return;
              anchor.dataset.previewCanonicalRoute = route;
              anchor.setAttribute("href", flatUrl(ROUTES[route]));
            };
            const rewriteAll = () => document.querySelectorAll("a[href]").forEach(rewriteAnchor);
            document.addEventListener("click", (event) => {
              const target = event.target instanceof Element ? event.target.closest("a[href]") : null;
              if (!target) return;
              const canonical = target.dataset.previewCanonicalRoute || routeFromAnchor(target);
              if (!canonical || !ROUTES[canonical]) return;
              event.preventDefault();
              event.stopImmediatePropagation();
              location.assign(flatUrl(ROUTES[canonical]));
            }, true);
            const observer = new MutationObserver(rewriteAll);
            observer.observe(document.documentElement, {subtree:true, childList:true, attributes:true, attributeFilter:["href"]});
            rewriteAll();
            document.documentElement.dataset.previewNavigation = "READY";
            const selftest = new URLSearchParams(location.search).get("acpos-nav-selftest");
            if (selftest && TESTS[selftest]) {
              const [selector, forcedRoute] = TESTS[selftest];
              setTimeout(() => {
                const anchor = document.querySelector(selector);
                if (!anchor) {
                  document.documentElement.dataset.previewNavigationSelftest = "MISSING_ANCHOR";
                  return;
                }
                anchor.setAttribute("href", forcedRoute);
                document.documentElement.dataset.previewNavigationSelftest = "CLICKING";
                anchor.click();
              }, 900);
            }
          })();
          JS
          node --check preview/preview-navigation.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          tag='<script src="./preview-navigation.js" data-acpos-preview-navigation="true"></script>'
          pages=sorted(Path('preview').glob('*.html'))
          if not pages:
              raise SystemExit('no preview html pages')
          for p in pages:
              rel=str(p)
              old=subprocess.check_output(['git','show',f'HEAD:{rel}'], text=True)
              if tag in old:
                  raise SystemExit(f'{rel}: navigation tag already existed unexpectedly')
              if '</body>' not in old:
                  raise SystemExit(f'{rel}: no body close')
              new=old.replace('</body>',tag+'</body>',1)
              p.write_text(new,encoding='utf-8')
              if new.replace(tag,'',1)!=old:
                  raise SystemExit(f'{rel}: content drift beyond navigation tag')
          print(f'PREVIEW_NAV_INJECT_PASS html_count={len(pages)}')
          PY

      - name: Browser validate full front and admin navigation
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          (python3 -m http.server 8090 >/tmp/acpos-nav-http.log 2>&1 & echo $! >/tmp/acpos-nav-http.pid)
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          mkdir -p /tmp/acpos-nav-dom
          test_nav(){
            local start="$1" test="$2" expected="$3"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4500 --dump-dom "http://127.0.0.1:8090/${start}?acpos-nav-selftest=${test}" > "/tmp/acpos-nav-dom/${test}.html"
            grep -F "data-page-uid=\"${expected}\"" "/tmp/acpos-nav-dom/${test}.html" >/dev/null
            grep -F 'data-preview-navigation="READY"' "/tmp/acpos-nav-dom/${test}.html" >/dev/null
            echo "PREVIEW_NAV_PASS test=${test} expected=${expected}"
          }
          test_nav index.html admin admin:SYS-01
          test_nav system.html front workspace:WB-01
          test_nav index.html core CORE-01
          test_nav index.html assets ASSET-01
          test_nav index.html video VIDEO-01
          test_nav index.html edit EDIT-01
          test_nav index.html qa QA-01
          test_nav index.html database admin:DB-01
          test_nav index.html strategy workspace:STR-01
          test_nav index.html info workspace:INFO-01
          test_nav system.html accounts admin:IAM-01
          test_nav system.html dev admin:DEV-01
          test_nav system.html social admin:SOC-01
          test_nav system.html erp admin:ERP-01
          test_nav system.html aiapi admin:AIAPI-01
          test_nav system.html qa-criteria admin:SG-02
          test_nav system.html strategy-admin admin:STR-01
          test_nav system.html knowledge-admin admin:KB-01
          kill "$(cat /tmp/acpos-nav-http.pid)" || true
          echo PREVIEW_NAV_FULL_MATRIX_PASS

      - name: Publish navigation-only preview patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/preview-navigation.js preview/*.html
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          bad=[n for n in names if n!='preview/preview-navigation.js' and not (n.startswith('preview/') and n.endswith('.html'))]
          if bad: raise SystemExit(f'PREVIEW_NAV_SCOPE_FAIL {bad}')
          if 'preview/preview-navigation.js' not in names: raise SystemExit('navigation bridge missing from staged files')
          print(f'PREVIEW_NAV_SCOPE_READY changed={len(names)}')
          PY
          git commit -m "fix(preview): keep front and admin navigation on static preview"
          git push origin HEAD:acpos-live-preview
          echo "PREVIEW_NAV_COMMIT=$(git rev-parse HEAD)"

      - name: Verify published scope
        shell: bash
        run: |
          set -euo pipefail
          test -f preview/preview-navigation.js
          grep -F 'data-acpos-preview-navigation="true"' preview/index.html >/dev/null
          grep -F 'data-acpos-preview-navigation="true"' preview/system.html >/dev/null
          echo PREVIEW_NAV_PUBLISHED_PASS
