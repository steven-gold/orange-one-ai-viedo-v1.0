name: IAM-01 save diagnostic
on:
  push:
    branches: [acpos-iam01-closure-20260902]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build controlled
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
        run: npm run build
      - name: POST IAM draft payload
        shell: bash
        run: |
          set -euo pipefail
          PORT=3133 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST npm run start >/tmp/iam-diag.log 2>&1 &
          pid=$!; trap 'cat /tmp/iam-diag.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3133/admin/accounts >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/save.json -w '%{http_code}' -X POST 'http://127.0.0.1:3133/v1/drafts' \
            -H 'content-type: application/json' -H 'x-correlation-id: IAM-DIAG-SAVE-001' \
            --data '{"page_uid":"admin:IAM-01","draft_id":"TEST-IAM-DRAFT-001","draft_type":"iam_account","mode":"EDIT","account_id":"TEST-IAM-ACCOUNT-001","basic_data":{"TEST-IAM-FIELD-IDENTITY-CANDIDATE":"TEST-IDENTITY-CANDIDATE-001","TEST-IAM-FIELD-ORG-SCOPE":"TEST-ORG-SCOPE-A"},"front_l1":["FRONT-L1-05","FRONT-L1-06"],"admin_l1":[],"test_metadata":{"data_classification":"TEST_ONLY","synthetic":true,"production_eligible":false}}')
          echo "HTTP=$code"
          cat /tmp/save.json
          exit 1
