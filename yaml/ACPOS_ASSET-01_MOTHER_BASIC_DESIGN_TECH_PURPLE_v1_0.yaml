    style: Heading 1
    text: 1. Current Truth / Source Precedence
  - index: 8
    style: List Bullet
    text: Current Truth 以 GitHub branch 0921acpos; live HEAD resolves fresh at audit time 與 Current Authority Manifest 為準；聊天內容只作搜尋線索。
  - index: 9
    style: List Bullet
    text: 頁面 Authority：authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml。
  - index: 10
    style: List Bullet
    text: '視覺：GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY；科技紫 Primary #8B5CFF / Secondary #6E35FF。'
  - index: 11
    style: List Bullet
    text: Shell：頂部 58px 全寬；左側預設 64px icon-only，hover/focus 才出現 221px Overlay；workspace 不 reflow。
  - index: 12
    style: List Bullet
    text: Naming：ACPOS_SYSTEM 唯一治理 Canonical Filename / Artifact Identity / Version / Checksum；ASSET 不可手動命名或 Rename。
  - index: 13
    style: List Bullet
    text: Unknown / unregistered behavior：BLOCK + REPORT_AUTHORITY_GAP。
