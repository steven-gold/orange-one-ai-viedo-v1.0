name: ACPOS Batch 17 Final Definition Closure

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch17-final-definition-closure
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 17 audit resume boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="98171c9989147690db2acd75228923d91bb2d92b"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH17 AUDIT RESUME / 31 DOCX / NO WORD DRIFT"

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Baseline nine DOCX integrity
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,unicodedata,json
          files=[
          "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
          "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          "ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          ]
          bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"];allowed={9,10,12,13};report={}
          for fn in files:
              with zipfile.ZipFile(fn) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  for n in xmls:ET.fromstring(z.read(n))
                  root=ET.fromstring(z.read("word/document.xml"))
                  ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  text="".join((e.text or "") for e in root.iter(ns+"t"))
              assert "\x00" not in text,(fn,"NUL")
              assert not [(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed][:20],(fn,"CONTROL")
              assert not [x for x in bad if x in text],(fn,"MOJIBAKE")
              assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,"REPLACEMENT")
              report[fn]={"chars":len(text),"status":"PASS"}
          Path("__batch17_baseline_encoding.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH17 BASELINE INTEGRITY")
          PY

      - name: Apply Batch 17 final closure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch17_final_definition_closure.py

      - name: Semantic verification
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          r=json.loads(Path("__batch17_remediation_report.json").read_text(encoding="utf-8"))
          m=r["machine"]
          assert m["pre_definition_gaps"]==20,m
          assert (m["dev_permission_na"],m["edit_action_na"],m["kb_action_gate_na"])==(5,2,10),m
          assert m["sys_gate_bindings"]==3,m
          assert m["new_canonical_gate_definitions"]==2,m
          assert m["resolved_sys_nav_conflict"]==1,m
          assert m["sys_nav_gate"]=="SOURCE_PAGE_GATE",m
          assert m["na_reclassified"]==17,m
          assert m["gaps_closed"]==20 and m["post_definition_gaps"]==0,m
          assert m["invented_api_routes"]==0 and m["invented_operations"]==0 and m["invented_runtime_owners"]==0 and m["invented_permissions"]==0,m
          assert m["runtime_execution_claimed"] is False,m
          assert len(r["changed_docs"])==9,r["changed_docs"]
          logic=Document("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          lt="\n".join([p.text for p in logic.paragraphs]+[c.text for t in logic.tables for row in t.rows for c in row.cells])
          for token in [
            "ACPOS-20260921-BATCH-17-REMAINING-DEFINITION-CLOSURE-V1",
            "Post-batch Definition Binding Gap",
            "SOURCE_PAGE_GATE",
            "BATCH17_MACHINE_JSON="
          ]:assert token in lt,token
          print("PASS: BATCH17 SEMANTIC DEFINITION GAP 20 -> 0")
          PY

      - name: Convert nine DOCX files to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __render_qa_batch17/pdf
          while IFS= read -r f; do libreoffice --headless --convert-to pdf --outdir __render_qa_batch17/pdf "$f" >/dev/null; done <<'EOF'
          01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx
          05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          EOF

      - name: Post-conversion encoding and CJK audit
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata
          r=json.loads(Path("__batch17_remediation_report.json").read_text(encoding="utf-8"))
          files=r["changed_docs"];bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"];allowed={9,10,12,13};cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]");report={}
          for fn in files:
              p=Path(fn);pdf=Path("__render_qa_batch17/pdf")/(p.stem+".pdf")
              assert pdf.exists() and pdf.stat().st_size>0,(fn,"PDF_MISSING")
              with zipfile.ZipFile(p) as z:
                  xmls=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
                  for n in xmls:ET.fromstring(z.read(n))
                  root=ET.fromstring(z.read("word/document.xml"));ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in root.iter(ns+"t"))
              pdftext=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              for label,text in [("DOCX",src),("PDF",pdftext)]:
                  assert "\x00" not in text,(fn,label,"NUL")
                  assert not [(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed][:20],(fn,label,"CONTROL")
                  assert not [x for x in bad if x in text],(fn,label,"MOJIBAKE")
                  assert "\ufffd" not in unicodedata.normalize("NFC",text),(fn,label,"REPLACEMENT")
              sc=len(cjk.findall(src));pc=len(cjk.findall(pdftext));assert sc>0,(fn,"NO_SOURCE_CJK")
              ratio=pc/sc;assert ratio>=0.97,(fn,"CJK_RETENTION",sc,pc,ratio)
              report[fn]={"source_cjk":sc,"pdf_cjk":pc,"cjk_ratio":ratio,"status":"PASS"}
          Path("__render_qa_batch17/encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH17 ENCODING / CJK")
          PY

      - name: Render geometry and contact sheets
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import subprocess,json,math,shutil
          from PIL import Image
          r=json.loads(Path("__batch17_remediation_report.json").read_text(encoding="utf-8"))
          root=Path("__render_qa_batch17");pngroot=root/"png";contact=root/"contact";pngroot.mkdir(exist_ok=True);contact.mkdir(exist_ok=True)
          report={};total=0
          for fn in r["changed_docs"]:
              p=Path(fn);pdf=root/"pdf"/(p.stem+".pdf");out=pngroot/p.stem;out.mkdir(exist_ok=True)
              subprocess.check_call(["pdftoppm","-png","-r","72",str(pdf),str(out/"page")],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              imgs=sorted(out.glob("page-*.png"));assert imgs,(fn,"NO_PNG")
              blank=[];edge=[];thumbs=[]
              for imf in imgs:
                  im=Image.open(imf).convert("L");w,h=im.size;mask=im.point(lambda x:255 if x<245 else 0);bbox=mask.getbbox()
                  if bbox is None:blank.append(imf.name)
                  elif bbox[0]<=1 or bbox[1]<=1 or bbox[2]>=w-1 or bbox[3]>=h-1:edge.append((imf.name,bbox,(w,h)))
                  th=Image.open(imf).convert("RGB");th.thumbnail((180,255));thumbs.append(th.copy())
              assert not blank,(fn,"BLANK",blank);assert not edge,(fn,"EDGE_CLIP",edge[:10])
              cols=4;cellw=190;cellh=265;rows=math.ceil(len(thumbs)/cols);sheet=Image.new("RGB",(cols*cellw,rows*cellh),"white")
              for i,im in enumerate(thumbs):sheet.paste(im,((i%cols)*cellw+5,(i//cols)*cellh+5))
              sheet.save(contact/(p.stem+"_contact.jpg"),quality=82)
              total+=len(imgs);report[fn]={"pages":len(imgs),"blank":0,"edge_clip":0,"status":"PASS"};shutil.rmtree(out)
          report["_summary"]={"documents":len(r["changed_docs"]),"pages":total,"blank":0,"edge_clip":0,"status":"PASS"}
          (root/"geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH17 GEOMETRY",report["_summary"])
          PY

      - name: Verify exact Batch 17 Word scope
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import subprocess,json
          from pathlib import Path
          base="98171c9989147690db2acd75228923d91bb2d92b"
          r=json.loads(Path("__batch17_remediation_report.json").read_text(encoding="utf-8"))
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only",base,"--","*.docx"],text=True)
          changed=sorted(x for x in out.splitlines() if x);expected=sorted(r["changed_docs"])
          assert changed==expected,{"changed":changed,"expected":expected}
          assert len(changed)==9
          Path("__batch17_changed_word_scope.txt").write_text("\n".join(changed)+"\n",encoding="utf-8")
          print("PASS: EXACT BATCH17 WORD SCOPE = 9")
          PY

      - name: Collect evidence
        shell: bash
        run: |
          mkdir -p __batch17_evidence
          cp __batch17_remediation_report.json __batch17_baseline_encoding.json __batch17_changed_word_scope.txt __batch17_evidence/
          cp __render_qa_batch17/encoding_integrity_report.json __render_qa_batch17/geometry_report.json __batch17_evidence/
          cp -R __render_qa_batch17/pdf __render_qa_batch17/contact __batch17_evidence/
          git rev-parse HEAD > __batch17_evidence/executor_head.txt

      - name: Upload Batch 17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch17-final-definition-closure-evidence
          path: __batch17_evidence
          retention-days: 1
          if-no-files-found: error

      - name: Commit Batch 17 and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-word-batch-17"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            "01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx" \
            "05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx" \
            "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git rm -f __temp/batch17_final_definition_closure.py .github/workflows/acpos_batch17_final_definition_closure.yml
          rm -rf __batch17_remediation_report.json __batch17_baseline_encoding.json __batch17_changed_word_scope.txt __batch17_evidence __render_qa_batch17
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(git diff --cached --name-only -- '*.docx' | wc -l)" -eq 9
          git commit -m "docs(acpos): close final 20 definition binding gaps"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH17 COMMITTED / TEMP TOOLING REMOVED / CLEAN TREE"
