name: ACPOS Gate25 Current Unbound Formal Action Ledger Sync Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-current-unbound-actions-ledger-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - name: Classify exact 5 Current-page unbound formal actions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          ledger_path = Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          inventory_path = Path('docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json')
          evidence_path = Path('docs/construction/evidence/GATE25_CURRENT_PAGE_UNBOUND_FORMAL_ACTION_EVIDENCE_2026-09-10.json')

          targets = {
              'action:admin:IAM-01:ACT-NAV-OPEN': {
                  'page_uid': 'admin:IAM-01',
                  'action_uid': 'ACT-NAV-OPEN',
                  'authority': 'authority/pages/admin/IAM-01/ACPOS_IAM-01_ACCOUNT_PERMISSION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml',
              },
              'action:admin:KB-01:ACT-NAV-OPEN': {
                  'page_uid': 'admin:KB-01',
                  'action_uid': 'ACT-NAV-OPEN',
                  'authority': 'authority/pages/admin/KB-01/ACPOS_KB-01_FINAL_LOCKED_ENCODING.yaml',
              },
              'action:admin:SOC-01:ACT-NAV-OPEN': {
                  'page_uid': 'admin:SOC-01',
                  'action_uid': 'ACT-NAV-OPEN',
                  'authority': 'authority/pages/admin/SOC-01/ACPOS_SOC-01_SOCIAL_PUBLISHING_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml',
              },
              'action:admin:AIAPI-01:ACT-NAV-OPEN': {
                  'page_uid': 'admin:AIAPI-01',
                  'action_uid': 'ACT-NAV-OPEN',
                  'authority': 'authority/pages/admin/AIAPI-01/ACPOS_AIAPI-01_FINAL_LOCKED_ENCODING.yaml',
              },
              'action:admin:AIAPI-01:ACT-REFRESH': {
                  'page_uid': 'admin:AIAPI-01',
                  'action_uid': 'ACT-REFRESH',
                  'authority': 'authority/pages/admin/AIAPI-01/ACPOS_AIAPI-01_FINAL_LOCKED_ENCODING.yaml',
              },
          }

          ledger = json.loads(ledger_path.read_text())
          inventory = json.loads(inventory_path.read_text())
          inventory_keys = {r['resource_key'] for r in inventory['resources']}
          entries = {e['resource_key']: e for e in ledger['entries']}

          assert ledger['denominator']['total'] == 1481
          assert len(targets) == 5

          observations = []
          for resource_key, meta in targets.items():
              assert resource_key in inventory_keys, f'missing Production formal inventory resource: {resource_key}'
              assert resource_key in entries, f'missing ledger entry: {resource_key}'
              entry = entries[resource_key]
              assert entry['disposition'] == 'NOT_EXECUTED', f'{resource_key} expected NOT_EXECUTED, got {entry["disposition"]}'
              authority_path = Path(meta['authority'])
              assert authority_path.exists(), f'missing Current authority: {authority_path}'
              authority_text = authority_path.read_text()
              assert meta['action_uid'] not in authority_text, f'{resource_key} action UID unexpectedly exists in Current authority'
              observations.append({
                  'resource_key': resource_key,
                  'page_uid': meta['page_uid'],
                  'formal_inventory_present': True,
                  'current_authority_path': meta['authority'],
                  'current_authority_action_uid_present': False,
                  'disposition': 'BLOCKED',
                  'reason_code': 'CURRENT_FORMAL_ACTION_UID_NOT_BOUND_BY_CURRENT_PAGE_AUTHORITY',
              })

          before = dict(ledger['counts'])
          evidence = {
              'document_id': 'ACPOS_GATE25_CURRENT_PAGE_UNBOUND_FORMAL_ACTION_EVIDENCE',
              'status': 'CURRENT_EVIDENCE',
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'source_inventory': str(inventory_path),
              'ledger': str(ledger_path),
              'rule': 'A Production formal ACTION cannot be promoted to PASS or exercised by a fabricated UI interaction when its exact action UID is absent from the FINAL_LOCKED Current page authority. It remains BLOCKED until the Production permission inventory is remapped/deactivated or Current Authority explicitly registers an executable owner.',
              'targets': observations,
              'count': 5,
          }
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n')

          for resource_key, meta in targets.items():
              entry = entries[resource_key]
              entry['disposition'] = 'BLOCKED'
              entry['reason_code'] = 'CURRENT_FORMAL_ACTION_UID_NOT_BOUND_BY_CURRENT_PAGE_AUTHORITY'
              entry['evidence_refs'] = [
                  str(evidence_path),
                  meta['authority'],
                  str(inventory_path),
              ]
              entry['blocker_detail'] = 'Production formal permission inventory contains this ACTION, but the exact action UID is absent from the FINAL_LOCKED Current page authority. No executable Current binding is authorized; fabricating a UI/runtime owner is forbidden. Resolve by authoritative inventory remap/deactivation or explicit Current Authority registration.'
              entry['operation_ids'] = [meta['action_uid']]

          counts = {'PASS': 0, 'BLOCKED': 0, 'NOT_EXECUTED': 0}
          for entry in ledger['entries']:
              counts[entry['disposition']] += 1
          assert sum(counts.values()) == ledger['denominator']['total'] == 1481
          assert counts['PASS'] == before['PASS']
          assert counts['BLOCKED'] == before['BLOCKED'] + 5
          assert counts['NOT_EXECUTED'] == before['NOT_EXECUTED'] - 5
          ledger['counts'] = counts
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n')

          print(json.dumps({'before': before, 'after': counts, 'targets': list(targets)}, ensure_ascii=False))
          PY

      - name: Validate synchronized ledger
        shell: bash
        run: |
          node scripts/validate-production-formal-acceptance-ledger.mjs

      - name: Commit synchronized ledger and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_CURRENT_PAGE_UNBOUND_FORMAL_ACTION_EVIDENCE_2026-09-10.json
          git rm .github/workflows/gate25-current-unbound-actions-ledger-sync-once.yml
          git commit -m 'evidence(gate25): block five unbound Current formal actions'
          git push origin HEAD:new
