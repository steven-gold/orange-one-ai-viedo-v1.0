name: Stage-02 Actual Product Test After Full-Line Gate

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-actual-test.yml'
      - 'governance/ci/validate_stage02_entry_receipts.py'
      - '.github/governance-source/active/source/10_REGISTRY/REVIEW_PROGRESS_LEDGER.yaml'
      - '.github/governance-source/FULL_LINE_TRIGGER'
      - 'governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml'
      - 'governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml'
      - 'governance/ci/run_current_stage2_actual_test.py'
      - 'governance/ci/validate_stage02_state_integrity.py'
      - 'governance/ci/validate_stage02_successor_integrity.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Stage-02 execution mode
        required: true
        default: actual-test
        type: choice
        options:
          - actual-test
      page_scope:
        description: Stage-02 page scope
        required: true
        default: CORE-01
        type: choice
        options:
          - CORE-01
          - ALL_REQUIRED_PAGES

permissions:
  contents: read
  actions: read

jobs:
  preexecution-admission-boundary-regression:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Prove pending preformal review blocks before product execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          review_path = Path('.github/governance-source/active/source/10_REGISTRY/REVIEW_PROGRESS_LEDGER.yaml')
          state_path = Path('governance/test/ACTIVE_STATE.yaml')
          review = yaml.safe_load(review_path.read_text(encoding='utf-8')) or {}
          state = yaml.safe_load(state_path.read_text(encoding='utf-8')) or {}
          projected = state.get('pending_governance_review') or {}
          rows = [
              row for row in (review.get('required_review_plan') or [])
              if isinstance(row, dict) and row.get('review_item_uid') == 'REV-GOV-001'
          ]
          assert len(rows) == 1, rows
          status = rows[0].get('status')
          projected_status = projected.get('status')
          if projected_status == 'APPROVED':
              assert projected.get('approval_source') == 'EXPLICIT_USER_DIRECTIVE', projected
              print('PASS: explicit user review decision is projected in Current State; pending-plan negative case not applicable')
          elif status == 'PENDING':
              cp = subprocess.run(
                  [sys.executable, 'governance/ci/compile_stage_execution_preflight.py', '--admission-check'],
                  text=True, capture_output=True,
              )
              combined = (cp.stdout or '') + '\n' + (cp.stderr or '')
              assert cp.returncode != 0, 'pending review unexpectedly admitted product execution'
              assert 'PREEXECUTION_PREFORMAL_REVIEW_PROJECTION_NOT_APPROVED' in combined, combined
              print('PASS: REV-GOV-001=PENDING blocks in pre-execution admission before Stage-02 actual execution')
          elif status == 'APPROVED':
              print('PASS: source review plan is APPROVED; pending-review negative regression is not applicable')
          else:
              raise SystemExit(f'BLOCK: unexpected REV-GOV-001 status {status!r}')
          PY

  stage02-actual-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'actual-test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      STAGE02_PAGE_SCOPE: ${{ inputs.page_scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Enforce Current Specification mutation authorization
        run: python governance/ci/specification_mutation_guard.py
      - name: Resolve stable Current governance registry
        run: python governance/ci/governance_resolver.py
      - name: Validate canonical rule registry anti-drift binding
        run: python governance/ci/validate_canonical_rule_registry.py
      - name: Validate reusable governance portability and machine-layer profile isolation
        run: python governance/ci/validate_governance_portability.py
      - name: Validate canonical validation remediation closure protocol
        run: python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Validate Current governance layout
        run: python governance/ci/validate_governance_layout.py
      - name: Validate authoring reference governance coverage
        run: python governance/ci/validate_authoring_reference_governance_coverage.py
      - name: Validate active consumer reference integrity
        run: python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Validate structured mutation selector safety
        run: python governance/ci/validate_structured_mutation_safety.py
      - name: Run Current Registry multidirectional stress 13 of 13
        run: python governance/ci/stress_test_governance_registry.py
      - name: Validate selected execution profile and historical predecessor binding
        run: python governance/ci/validate_selected_execution_profile_integrity.py
      - name: Validate profile-local finding closure readiness
        run: python governance/test/validate_selected_profile_finding_closure.py
      - name: Validate Stage-02 admission predecessor state
        run: python governance/ci/validate_stage02_state_integrity.py
      - name: Validate Stage-02 frozen governance and clean baseline entry receipts
        run: python governance/ci/validate_stage02_entry_receipts.py
      - name: Prove pre-execution completion path before Stage-02 execution
        run: python governance/ci/compile_stage_execution_preflight.py --admission-check
      - name: Run complete 75-file full-lifecycle high-pressure system gate on exact Stage-02 execution SHA
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
      - name: Prove verified source remained byte-clean before Stage-02 actual test
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/governance-source/active/source
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' -o -name '*.tmp' -o -name '*.bak' -o -name '*~' \) -print)"
          test -z "$bad" || { printf 'BLOCK: source runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: exact source remains byte-clean before Stage-02 actual test'
      - name: Execute fresh Stage-02 actual test
        run: python governance/ci/run_current_stage2_actual_test.py
      - name: Prove Current Specification and immutable Stage-01 inputs were not mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml

          scope = yaml.safe_load(Path('governance/test/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml').read_text(encoding='utf-8')) or {}
          refs = [str(x) for x in (scope.get('dependency_closure_refs') or [])]
          roots = []
          for ref in refs:
              marker = '/04_PAGE_FUNCTIONAL_CONTRACT/'
              if ref.startswith('00_SOURCE_INTAKE/fresh_run_') and marker in ref:
                  roots.append(ref.split(marker, 1)[0])
          roots = sorted(set(roots))
          if len(roots) != 1:
              raise SystemExit(f'BLOCK: expected exactly one Current Stage-01/02 run root from scope dependency refs, got {roots}')
          run_root = Path(roots[0])
          for rel in ('02_BASE_BLUEPRINT', '03_BLUEPRINT_BINDING'):
              target = run_root / rel
              if not target.is_dir():
                  raise SystemExit(f'BLOCK: immutable Stage-01 input root missing: {target}')
              cp = subprocess.run(['git','diff','--exit-code','--',str(target)])
              if cp.returncode != 0:
                  raise SystemExit(f'BLOCK: immutable Stage-01 inputs mutated: {target}')
          print(f'PASS: immutable Stage-01 inputs unchanged under Current run root {run_root}')
          PY
      - name: Upload fresh Stage-02 actual test evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-actual-test-evidence
          path: |
            .github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json
            governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml
            governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml
            .github/governance-source/SOURCE_IDENTITY_REPORT.json
            .github/governance-source/FULL_LINE_SYSTEM_GATE_RESULT.json
            governance/test/FINDING_CLOSURE_READINESS.json
          if-no-files-found: error
