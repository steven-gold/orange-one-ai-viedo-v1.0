name: Promote v2.1.15 Stage Execution Optimization

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/promote-v215-stage-execution-optimization.yml'
      - 'governance/ci/promote_v215_stage_execution_optimization.py'
      - 'governance/ci/.v215_promotion_payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-v215-no-pycache
      AUTH_UID: AUTH-20260915-STAGE02-EXECUTION-OPTIMIZATION
      SPEC_SCOPE: STAGE02_TEST_PROVEN_DEFECT_CONSOLIDATION_AND_CANONICAL_EXECUTION_OPTIMIZATION
      GOV_UID: GOV-REV-20260915-STAGE-EXECUTION-OPTIMIZATION
      GOV_VERSION: v2.1.15
      PACKAGE_SHA256: 1a72520c4806f4cea57ba233724fd3f92529836e87e9eebf217aa57e647e1b7f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governance dependencies
        run: python -m pip install pyyaml
      - name: Verify authorization preexists promotion parent
        run: |
          test -f "governance/test/spec_change_authorizations/${AUTH_UID}.yaml"
          grep -F "authorization_uid: ${AUTH_UID}" "governance/test/spec_change_authorizations/${AUTH_UID}.yaml"
          grep -F 'authority_source: EXPLICIT_USER_DIRECTIVE' "governance/test/spec_change_authorizations/${AUTH_UID}.yaml"
          grep -F 'single_use: true' "governance/test/spec_change_authorizations/${AUTH_UID}.yaml"
          grep -F 'status: APPROVED_FOR_EXACT_SCOPE' "governance/test/spec_change_authorizations/${AUTH_UID}.yaml"
      - name: Reconstruct and materialize v2.1.15 candidate
        run: python governance/ci/promote_v215_stage_execution_optimization.py
      - name: Compile governance baseline
        run: python .github/governance-source/active/source/09_TESTS/governance/compile_governance_baseline.py
      - name: Refresh governance root manifest
        run: python .github/governance-source/active/source/09_TESTS/governance/refresh_governance_root_manifest.py
      - name: Refresh exact source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.github/governance-source/active/source')
          forbidden={'__pycache__','.next','dist','build','coverage','playwright-report','test-results','node_modules'}
          suffix={'.pyc','.pyo','.tmp','.bak','.swp'}
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.name=='CHECKSUMS.sha256':
                  continue
              if any(x in p.parts for x in forbidden) or p.suffix in suffix or p.name.endswith('~'):
                  continue
              rel=p.relative_to(root).as_posix()
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          (root/'CHECKSUMS.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print(f'PASS: checksums regenerated entries={len(rows)}')
          PY
      - name: Build external trust snapshot for candidate validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,yaml
          root=Path('.github/governance-source/active/source')
          forbidden={'__pycache__','.next','dist','build','coverage','playwright-report','test-results','node_modules'}
          suffix={'.pyc','.pyo','.tmp','.bak','.swp'}
          files=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or any(x in p.parts for x in forbidden) or p.suffix in suffix or p.name.endswith('~'):
                  continue
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          sem=yaml.safe_load((root/'10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml').read_text()) or {}
          out={'schema_version':1,'trust_model':'EXTERNAL_IMMUTABLE_PACKAGE_HASH_SET','package_files':files,'semantic_authority_content_hash':sem.get('content_hash')}
          Path('/tmp/acpos-v215-trust.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(f'PASS: trust snapshot files={len(files)} semantic={out["semantic_authority_content_hash"]}')
          PY
      - name: Run complete Mother Governance preformal gate and mandatory regression matrix
        env:
          WEB_GOVERNANCE_TRUST_ROOT: /tmp/acpos-v215-trust.json
        run: python .github/governance-source/active/source/09_TESTS/governance/validate_governance.py --mode PRE_FORMAL_DEFINITION_AUDIT
      - name: Assert v2.1.15 full-source invariants explicitly
        run: |
          python .github/governance-source/active/source/09_TESTS/governance/validate_section_registry.py
          python .github/governance-source/active/source/09_TESTS/governance/governance_lifecycle_stage_contract_guard.py
          python .github/governance-source/active/source/09_TESTS/governance/governance_management_contract_guard.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_construction_artifact_index.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_product_neutral_entity_lifecycle.py
          python .github/governance-source/active/source/09_TESTS/governance/test_execution_load_guard.py
          python .github/governance-source/active/source/09_TESTS/governance/test_high_pressure_hardening.py
          python .github/governance-source/active/source/09_TESTS/governance/test_bugfix_regressions.py
      - name: Assert compact Current projection and optimization contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          manifest=yaml.safe_load(Path('governance/specifications/current/SPECIFICATION_MANIFEST.yaml').read_text()) or {}
          registry=yaml.safe_load(Path('governance/specifications/REGISTRY.yaml').read_text()) or {}
          optimize=yaml.safe_load(Path('governance/specifications/current/STAGE_EXECUTION_OPTIMIZATION.yaml').read_text()) or {}
          bounded=yaml.safe_load(Path('governance/specifications/current/BOUNDED_FUNCTIONAL_COMPLETION.yaml').read_text()) or {}
          defect=yaml.safe_load(Path('governance/test/STAGE02_EXECUTION_OPTIMIZATION_DEFECT_CONSOLIDATION.yaml').read_text()) or {}
          assert manifest['artifact_uid']=='GOV-REV-20260915-STAGE-EXECUTION-OPTIMIZATION', manifest
          assert manifest['display_version']=='v2.1.15', manifest
          assert registry['active_specification']['governance_uid']==manifest['artifact_uid'], registry
          assert registry['active_specification']['display_version']=='v2.1.15', registry
          comps={x['uid'] for x in manifest['components']}
          assert 'GOV-COMP-STAGE-EXECUTION-OPTIMIZATION' in comps, comps
          assert optimize['canonical_stage_preflight']['required_before_first_product_or_contract_remediation'] is True
          assert optimize['role_safe_functional_closure']['pre_materialized_exact_value_absence_alone_is_authority_gap'] is False
          assert optimize['role_safe_functional_closure']['one_role_correct_minimal_closure']=='AUTO_REMEDIABLE'
          assert optimize['role_safe_functional_closure']['two_or_more_materially_distinct_viable_product_behaviors']=='AUTHORITY_GAP'
          assert optimize['dependency_ordered_execution']['local_reverse_impact_validation_after_every_batch'] is True
          assert optimize['problem_state_model']['one_current_problem_register'] is True
          assert optimize['problem_state_model']['append_only_resolution_ledger'] is True
          assert bounded['rules']['BOUNDED_FUNCTIONAL_COMPLETION']['minimal_closure_set_required'] is True
          assert defect['promotion_authorization_uid']=='AUTH-20260915-STAGE02-EXECUTION-OPTIMIZATION'
          assert len(defect['test_proven_defects'])==10, len(defect['test_proven_defects'])
          print('PASS: compact v2.1.15 Current projection and 10 test-proven defect mappings')
          PY
      - name: Assert source package shape and version
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('.github/governance-source/active/source')
          files=[p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc']
          assert len(files)==75, len(files)
          sec=yaml.safe_load((root/'10_REGISTRY/SECTION_NUMBER_REGISTRY.yaml').read_text()) or {}
          inv=yaml.safe_load((root/'10_REGISTRY/STAGE_EXECUTION_INVARIANT_REGISTRY.yaml').read_text()) or {}
          assert len(sec.get('sections') or [])==314, len(sec.get('sections') or [])
          assert len(inv.get('stage_execution_invariants') or {})==41, len(inv.get('stage_execution_invariants') or {})
          print('PASS: full Mother Source files=75 sections=314 invariants=41')
          PY
      - name: Remove one-shot promotion transport before atomic commit
        run: |
          rm -rf governance/ci/.v215_promotion_payload
          rm -f governance/ci/promote_v215_stage_execution_optimization.py
          rm -f .github/workflows/promote-v215-stage-execution-optimization.yml
      - name: Create single atomic authorized promotion commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "governance: promote v2.1.15 stage execution optimization" -m "Spec-Change-Authorization: ${AUTH_UID}" -m "Spec-Change-Scope: ${SPEC_SCOPE}"
      - name: Verify protected specification mutation authorization and single-use scope
        run: python governance/ci/specification_mutation_guard.py
      - name: Reassert promoted commit identity before push
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          m=yaml.safe_load(Path('governance/specifications/current/SPECIFICATION_MANIFEST.yaml').read_text()) or {}
          r=yaml.safe_load(Path('governance/specifications/REGISTRY.yaml').read_text()) or {}
          assert m['artifact_uid']=='GOV-REV-20260915-STAGE-EXECUTION-OPTIMIZATION'
          assert r['active_specification']['governance_uid']==m['artifact_uid']
          print('PASS: atomic promotion commit resolves new governance UID')
          PY
      - name: Push atomic promotion
        run: git push origin HEAD:rebuild-v2.1.1
