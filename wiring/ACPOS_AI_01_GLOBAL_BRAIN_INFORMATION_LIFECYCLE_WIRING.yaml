  不得做的事: 不得擴張到使用者沒有授權的新 Business Function。
- 來源層: System convergence candidate / related design material
  本文件可用範圍: 既有跨頁概念、11 Brain layers、Context ordering、shared external acquisition、system objects。
  不得做的事: Candidate ≠ Current Runtime；不得由 candidate 宣稱 API/DB 已存在。
- 來源層: Current Page/Domain Authority
  本文件可用範圍: 正式施工時用於 Exact Binding 與 Page-native behavior。
  不得做的事: 本 Word 不自行創造不存在的 Control、Action、API、DB、Permission UID。
brain_layers:
- Layer: BRAIN-01
  Name: SYSTEM_STATE
  責任: 全站受治理物件的 owner/state/exact version/relationship/blocker 投影。
  硬邊界: MUST_NOT 成為第二業務資料庫。
- Layer: BRAIN-02
  Name: CONTEXT
  責任: 為單次 operation 組裝 authorized exact context。
  硬邊界: Formal execution 必須 freeze snapshot。
- Layer: BRAIN-03
  Name: CONVERSATION
  責任: 共用 conversation/thread/branch/assistant mechanics。
  硬邊界: 詳細規則由 02；不得 page-local fork。
- Layer: BRAIN-04
  Name: MEMORY_EXPERIENCE
  責任: 記憶、Operational Memory、Validated Experience。
  硬邊界: Conversation text 本身不是 Experience。
- Layer: BRAIN-05
  Name: DECISION_GOVERNANCE
  責任: 將分析、候選、人工/政策決策、Authority 分層。
  硬邊界: AI output 不能直接成 Canon。
- Layer: BRAIN-06
  Name: VERSION_LINEAGE
  責任: exact version/hash/provenance/parent-child lineage。
  硬邊界: latest/current/default alias 不得替代 formal exact ref。
- Layer: BRAIN-07
  Name: ORCHESTRATION
  責任: 合法 next action、cross-page handoff、dependency/impact。
  硬邊界: 不得越權修改 Domain owner。
- Layer: BRAIN-08
  Name: AI_EXECUTION
  責任: 提供給 03 的 Context/Capability/Policy input contract。
  硬邊界: 本文件不定 provider payload syntax。
- Layer: BRAIN-09
  Name: EVOLUTION
  責任: Experience → Learning Candidate → Governed Adoption。
  硬邊界: no self-rule rewrite。
- Layer: BRAIN-10
  Name: GOVERNANCE_OBSERVABILITY
  責任: Permission/Policy/Audit/Correlation/Error/Health。
  硬邊界: fake success 禁止。
- Layer: BRAIN-11
  Name: EXTERNAL_ACQUISITION
  責任: 共用 crawl/search/fetch/ingestion 輸入契約。
  硬邊界: Raw external data 不得直接寫 Canon。
information_lifecycle:
- Phase: SOURCE
  輸入: Domain rows / decisions / KB / evidence / external snapshot
  輸出: Typed source refs
  阻擋條件: 來源無 owner、無 scope、無 version/snapshot、權限不足。
- Phase: RESOLVE
  輸入: Actor + operation + object refs
  輸出: Resolved scope & authority set
  阻擋條件: Project/Object ambiguous；cross-project fallback。
- Phase: RETRIEVE
  輸入: Resolved need
  輸出: Candidate source set
  阻擋條件: Required source missing；rights/classification 不允許。
- Phase: CONFLICT
  輸入: Candidate source set
  輸出: Conflict-free or ConflictRecord
  阻擋條件: Unresolved REQUIRED conflict。
- Phase: BUDGET
  輸入: Required + optional context
  輸出: Normalized context set
  阻擋條件: Mandatory context 超過可執行 budget。
- Phase: FREEZE
  輸入: Normalized context
  輸出: ContextSnapshot + fingerprint
  阻擋條件: Exact refs 不完整；snapshot 無法重現。
- Phase: EXECUTE
  輸入: Frozen ContextSnapshot
  輸出: Raw result / Tool outcome
  阻擋條件: Stale context、permission、policy、health preflight fail。
- Phase: CANDIDATE
  輸入: Raw result
  輸出: Governed candidate
  阻擋條件: Validation/normalization fail。
- Phase: ADOPT
  輸入: Candidate + evidence
  輸出: Decision / authoritative version
  阻擋條件: Reviewer/owner/required evidence 缺失。
- Phase: OBSERVE
  輸入: Execution/outcome
  輸出: Audit + measurements
  阻擋條件: 不可把未確認 outcome 當成功。
- Phase: EXPERIENCE
  輸入: Validated outcome
  輸出: ExperienceRecord / LearningCandidate
  阻擋條件: 只有聊天或模擬，沒有真實 outcome。
entity_inventory:
- Entity: ACPOSStateProjection
  Purpose: Whole-site owner/state/version/relationship projection
  Authority / Boundary: Derived projection；不覆蓋 Domain row
  Owner Layer: BRAIN-01
- Entity: ACPOSContextNeed
  Purpose: 描述 operation 需要哪些 Context 類型與嚴格度
  Authority / Boundary: Need contract；不是資料內容
  Owner Layer: BRAIN-02
- Entity: ACPOSContextCandidate
  Purpose: 由合法 refs 組成、待 consumer adoption 的 Context 候選
  Authority / Boundary: Candidate only
  Owner Layer: BRAIN-02
- Entity: ACPOSContextSnapshot
  Purpose: 單次正式執行凍結的 exact context
  Authority / Boundary: Immutable execution input evidence
  Owner Layer: BRAIN-02
- Entity: ACPOSContextFingerprint
  Purpose: Snapshot canonical digest + identity tuple
  Authority / Boundary: 用於 stale/compare/replay
  Owner Layer: BRAIN-02/06
- Entity: ACPOSConflictRecord
  Purpose: 同一 claim 或 dependency 的矛盾記錄
  Authority / Boundary: 不得以 silent overwrite 解決
  Owner Layer: BRAIN-02/05
- Entity: ACPOSDecisionReference
  Purpose: 已確認決策之 exact ref
  Authority / Boundary: T1；不可由 AI raw output 自建
  Owner Layer: BRAIN-05
- Entity: ACPOSIntegrationEvent
  Purpose: 跨頁事件通知 envelope
  Authority / Boundary: 通知不是 mutation Authority
  Owner Layer: BRAIN-07/10
- Entity: ACPOSImpactSet
  Purpose: 變更影響的正反向 dependency closure
  Authority / Boundary: 觸發 REVERIFY_REQUIRED
  Owner Layer: BRAIN-07
- Entity: ACPOSExperienceRecord
  Purpose: 由真實執行/QA/business outcome 形成的經驗
  Authority / Boundary: T3；immutable evidence-linked
  Owner Layer: BRAIN-04/09
- Entity: ACPOSLearningCandidate
  Purpose: 由多筆 Experience 推導的改善候選
  Authority / Boundary: 不得 self-adopt
  Owner Layer: BRAIN-09
- Entity: AcquisitionIntent
  Purpose: Domain 對外部資料的需求宣告
  Authority / Boundary: Domain owns intent；shared runtime owns acquisition
  Owner Layer: BRAIN-11
- Entity: RawSourceSnapshot
  Purpose: 外部來源 immutable snapshot
  Authority / Boundary: T4 source evidence；不直接成 business truth
  Owner Layer: BRAIN-11
- Entity: AcquisitionEvidence
  Purpose: 來源、時間、rights、hash、citation-ready evidence
  Authority / Boundary: 支援 adoption/review
  Owner Layer: BRAIN-11
- Entity: HumanDecisionQueueItem
  Purpose: 需要人工/授權判定的 conflict/adoption/change item
  Authority / Boundary: AI 不可自動代決
  Owner Layer: BRAIN-05/10
