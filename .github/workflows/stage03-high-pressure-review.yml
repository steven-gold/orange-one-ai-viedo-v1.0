name: Stage-03 CORE-01 High-Pressure Review

"on":
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - governance/ci/stress_test_stage03_core01.py
      - .github/workflows/stage03-high-pressure-review.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  high-pressure-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage03-review-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock exact review SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run CORE-01 Stage-03 multidimensional high-pressure review
        run: python governance/ci/stress_test_stage03_core01.py
      - name: Upload Stage-03 high-pressure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage03-core01-high-pressure-review
          retention-days: 30
          if-no-files-found: error
          path: governance/test/stage03/STAGE03_HIGH_PRESSURE_REVIEW_REPORT.json
