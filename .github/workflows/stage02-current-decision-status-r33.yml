name: Stage-02 Current Decision Status R33

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-current-decision-status-r33.yml'
      - 'governance/ci/build_stage02_current_decision_status_r33.py'
      - 'governance/ci/validate_stage02_current_decision_status_r33.py'
      - 'governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_PROBLEM_RECONCILIATION_R30.yaml'
      - 'governance/test/stage02/STAGE02_OWNING_LAYER_REMEDIATION_INPUT_PACKET_R31.yaml'
      - 'governance/test/stage02/STAGE02_FINDING_CREATE_CONTROL_TRIGGER_CANDIDATE_REVIEW_R32.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate-current-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R33 implementation
        run: |
          python -m py_compile governance/ci/build_stage02_current_decision_status_r33.py
          python -m py_compile governance/ci/validate_stage02_current_decision_status_r33.py
      - name: Revalidate R30 R31 R32 baselines
        run: |
          python governance/ci/validate_stage02_current_problem_reconciliation_r30.py
          python governance/ci/validate_stage02_owning_layer_remediation_input_packet_r31.py
          python governance/ci/validate_stage02_finding_create_control_trigger_candidate_review_r32.py
      - name: Build R33 current decision and input status
        run: python governance/ci/build_stage02_current_decision_status_r33.py
      - name: Validate R33 current decision and input status
        run: python governance/ci/validate_stage02_current_decision_status_r33.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert 129 blocker denominator remains fail-closed
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          s=yaml.safe_load(Path('governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_DECISION_STATUS_R33.yaml').read_text())
          i=yaml.safe_load(Path('governance/test/stage02/STAGE02_OWNING_LAYER_REMEDIATION_INPUT_PACKET_R33.yaml').read_text())
          assert s['denominators']['current_effective_problems']==129, s
          assert s['denominators']['true_product_authority_gaps_proven']==1, s
          assert s['denominators']['unresolved_functional_contract_gaps']==128, s
          assert s['denominators']['effective_stage02_blocker_reduction_claimed']==0, s
          assert i['denominators']['pending_product_authority_decisions']==1, i
          assert i['denominators']['pending_owning_layer_contract_inputs']==128, i
          assert i['denominators']['provided_inputs']==0, i
          assert s['stage02_status']=='BLOCKED' and s['stage03_allowed'] is False, s
          print('PASS: R33 blocker denominator=129; authority pending=1; unresolved contract pending=128; reduction=0')
          PY
      - name: Persist R33 current status
        run: |
          paths=(
            'governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_DECISION_STATUS_R33.yaml'
            'governance/test/stage02/STAGE02_OWNING_LAYER_REMEDIATION_INPUT_PACKET_R33.yaml'
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'R33 outputs unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'test(stage02): persist current Product Authority decision status R33'
          git push origin HEAD:rebuild-v2.1.1
