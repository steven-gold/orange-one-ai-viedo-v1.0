    text: 這份 Word 的合法下一步不是直接施工。依 Mother Basic Design / Visual governance，先由 Human Reviewer 檢視 ASSET-01 的工作區比例、科技紫風格、5 種狀態與功能對位；若需要調整，修改 Visual Candidate；只有 Selected
      Approved Candidate 形成後，才可進 Authority Update / Design Freeze / Implementation Handoff。
