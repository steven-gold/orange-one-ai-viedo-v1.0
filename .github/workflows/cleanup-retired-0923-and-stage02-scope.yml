name: cleanup-retired-0923-and-stage02-scope
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/cleanup-retired-0923-and-stage02-scope.yml
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyYAML
      - name: Audit Stage-01 universe and remove wrong Stage-02 entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml,json,hashlib,shutil,subprocess
          P=Path('.').resolve()
          S1=P/'STAGE_EXECUTION/STAGE-01'
          S2=P/'STAGE_EXECUTION/STAGE-02'
          def y(p):
              d=yaml.safe_load(p.read_text(encoding='utf-8'))
              if not isinstance(d,dict): raise SystemExit('MAPPING_REQUIRED:'+str(p))
              return d
          # Stage-01 must remain fully closed.
          r=y(S1/'CURRENT_STAGE01_RESUME.yaml')
          c=y(S1/'CLOSURE/STAGE01_CLOSURE_CANDIDATE.yaml')
          if r.get('closed_pass_source_count')!=31 or r.get('stage_exit_authorized') is not True:
              raise SystemExit('STAGE01_NOT_CLOSED_31_OF_31')
          if c.get('status')!='ALL_REQUIRED_PAGES_STAGE1_CLOSED' or c.get('stage_exit_authorized') is not True:
              raise SystemExit('STAGE01_CLOSURE_NOT_CURRENT')
          wus=sorted([d for d in S1.iterdir() if d.is_dir() and d.name.startswith('WU-') and (d/'WORK_UNIT.yaml').is_file()])
          if len(wus)!=31: raise SystemExit('STAGE01_WORK_UNIT_COUNT:'+str(len(wus)))
          rows=[]
          for W in wus:
              wu=y(W/'WORK_UNIT.yaml')
              term=y(W/'WORK_UNIT_TERMINAL_RECEIPT.yaml')
              scope=wu.get('scope') or {}
              page=scope.get('page_uid')
              source=scope.get('source_uid')
              if wu.get('current_status')!='CLOSED_PASS' or term.get('result')!='PASS':
                  raise SystemExit('STAGE01_WU_NOT_PASS:'+W.name)
              rows.append({
                'work_unit_uid':W.name,
                'page_uid':page,
                'source_uid':source,
                'canonical_name':wu.get('canonical_name'),
                'source_file':scope.get('source_file'),
                'terminal_result':term.get('result')
              })
          # Wrong Stage-02 CORE-only entry was created from stale compatibility assumption; remove it entirely.
          removed=[]
          if S2.exists():
              for p in sorted(S2.rglob('*'), reverse=True):
                  if p.is_file(): removed.append(str(p.relative_to(P)))
              shutil.rmtree(S2)
          # Build audit only, not a selected Stage-02 work unit.
          pages=[x['page_uid'] for x in rows if x.get('page_uid')]
          unique=[]
          for p in pages:
              if p not in unique: unique.append(p)
          audit={
            'artifact_uid':'STAGE02-SCOPE-RESOLUTION-AUDIT',
            'artifact_type':'STAGE02_SCOPE_RESOLUTION_AUDIT',
            'authority_basis':'CURRENT_STAGE01_CLOSED_WORK_UNIT_UNIVERSE',
            'stage01_required_source_count':31,
            'stage01_closed_work_unit_count':31,
            'stage01_rows':rows,
            'observed_page_uid_count':len(unique),
            'observed_page_uids':unique,
            'wrong_core01_stage02_entry_removed':True,
            'removed_stage02_paths':removed,
            'scope_selection_status':'PENDING_CURRENT_SCOPE_CLASSIFICATION',
            'selected_stage02_work_unit_uid':None,
            'selected_stage02_page_uid':None,
            'stage02_effectful_operation_started':False,
            'next_step':'CLASSIFY_STAGE02_REQUIRED_PAGE_UNIVERSE_FROM_CURRENT_STAGE01_ROWS_AND_LIFECYCLE_SCOPE_MODE'
          }
          out=P/'STAGE_EXECUTION/STAGE-02-SCOPE-RESOLUTION-AUDIT.yaml'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(yaml.safe_dump(audit,allow_unicode=True,sort_keys=False,width=240),encoding='utf-8',newline='\n')
          # Stage-01 resume stays at Stage-02 resolution gate, no selected Stage-02 WU.
          r['resume_point']='STAGE02_WORK_UNIT_RESOLUTION_GATE'
          r['next_stage_uid']='STAGE-02'
          r['stage_exit_authorized']=True
          r['stage02_selected_work_unit_uid']=None
          r['stage02_selected_page_uid']=None
          r['checkpoint_reason']='STAGE01_CLOSED_STAGE02_SCOPE_REQUIRES_DYNAMIC_RESOLUTION_NO_STALE_CORE01_ASSUMPTION'
          r['status']='STAGE01_CLOSED_STAGE02_SCOPE_RESOLUTION_PENDING'
          (S1/'CURRENT_STAGE01_RESUME.yaml').write_text(yaml.safe_dump(r,allow_unicode=True,sort_keys=False,width=240),encoding='utf-8',newline='\n')
          # Self-delete this temporary workflow.
          wf=P/'.github/workflows/cleanup-retired-0923-and-stage02-scope.yml'
          if wf.exists(): wf.unlink()
          print(json.dumps({
            'stage01_work_units':31,
            'stage01_closed':True,
            'observed_page_uid_count':len(unique),
            'observed_page_uids':unique,
            'removed_wrong_stage02_path_count':len(removed)
          },ensure_ascii=False,indent=2))
          PY
          git config user.name acpos-governance-bot
          git config user.email actions@users.noreply.github.com
          git add -A STAGE_EXECUTION .github/workflows/cleanup-retired-0923-and-stage02-scope.yml
          CURRENT="$(git ls-remote origin refs/heads/0921acpos | awk '{print $1}')"
          test "$CURRENT" = "${GITHUB_SHA}"
          git commit -m "fix(stage02): remove stale CORE-01 entry and audit current scope"
          git push origin HEAD:0921acpos
      - name: Delete retired 0923 branch and historical runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Delete every historical Actions run whose head_branch is the retired transport branch.
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=tmp-word-binary-handoff-20260923&per_page=100" --jq '.workflow_runs[].id' || true)"
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" || true
          done
          # Delete branch ref itself. 404 after deletion is acceptable only on verification.
          git push origin --delete tmp-word-binary-handoff-20260923
          if git ls-remote --heads origin tmp-word-binary-handoff-20260923 | grep -q .; then
            echo "retired branch still exists" >&2
            exit 1
          fi
          echo "PASS: retired 0923 branch ref deleted and historical branch runs removed"
