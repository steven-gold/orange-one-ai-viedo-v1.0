name: VIS-14 ERP validation
on:
  push:
    branches: [acpos-vis14-staging]
    paths: [.github/workflows/vis14-erp-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis14-staging
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start production server
        run: |
          (npm start -- -p 3000 > /tmp/vis14-server.log 2>&1 & echo $! > /tmp/vis14-server.pid)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/admin/erp >/dev/null && exit 0; sleep 1; done
          cat /tmp/vis14-server.log
          exit 1
      - name: Chromium validation
        run: |
          cat > vis14-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            let business=0;
            const p=await b.newPage({viewport:{width:1440,height:900}});
            p.on('request',r=>{if(['xhr','fetch'].includes(r.resourceType()))business++});
            await p.goto('http://127.0.0.1:3000/admin/erp',{waitUntil:'networkidle'});
            const page=p.locator('[data-page-uid="admin:ERP-01"]');
            assert(await page.count()===1,'page uid');
            assert(Number(await page.getAttribute('data-authority-control-count'))===42,'control registry count');
            assert(await p.locator('.global-sidebar [data-nav-id]').count()===9,'admin nav count');
            assert(await p.locator('[aria-current="page"]').getAttribute('data-nav-id')==='ADMIN-NAV-05','active nav');
            assert(await p.locator('a[href="/admin/erp"][data-nav-id="ADMIN-NAV-05"]').count()===1,'route binding');
            const g=await p.evaluate(()=>{const w=document.querySelector('.workspace-slot'),ctx=document.querySelector('[data-section-id="ERP-01-SEC-01"]'),bar=document.querySelector('[data-section-id="ERP-01-SEC-02"]');return {x:Math.round(w.getBoundingClientRect().x),client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth,contextHeight:Math.round(ctx.getBoundingClientRect().height),viewHeight:Math.round(bar.getBoundingClientRect().height)}});
            assert(g.x===78&&g.client===g.scroll&&g.contextHeight===56&&g.viewHeight===52,'1440 geometry '+JSON.stringify(g));
            const unionControls=new Set();
            const unionSections=new Set();
            const tabs=['ERP-01-BTN-TAB-FINANCE','ERP-01-BTN-TAB-CONNECTOR','ERP-01-BTN-TAB-SYNC'];
            const sections=['ERP-01-SEC-03','ERP-01-SEC-04','ERP-01-SEC-05'];
            for(let i=0;i<tabs.length;i++){
              await p.locator(`[data-control-id="${tabs[i]}"]`).click(); await p.waitForTimeout(70);
              assert(await p.locator(`[data-section-id="${sections[i]}"]`).count()===1,'missing view section '+sections[i]);
              (await p.locator('[data-control-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-control-id')))).forEach(x=>unionControls.add(x));
              (await p.locator('[data-section-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-section-id')))).forEach(x=>unionSections.add(x));
              await p.screenshot({path:`vis14-1440-view-${i+1}.png`,fullPage:false});
            }
            assert(unionControls.size===42,'control union '+unionControls.size);
            assert(unionSections.size===8,'section union '+unionSections.size+' '+JSON.stringify([...unionSections]));
            assert(await p.getByText('0',{exact:true}).count()===0,'fake zero value');
            assert(await p.getByText('ERP_write_from_ACPOS',{exact:false}).count()===0,'writeback surface rendered');
            for(const id of [...unionControls].filter(id=>id?.includes('-BTN-')&&!id.includes('-TAB-'))){const el=p.locator(`[data-control-id="${id}"]`);if(await el.count())assert(await el.first().isDisabled(),id+' enabled');}
            await p.locator('.global-sidebar').hover();await p.waitForTimeout(180);
            const ex=await p.evaluate(()=>({x:Math.round(document.querySelector('.workspace-slot').getBoundingClientRect().x),side:Math.round(document.querySelector('.global-sidebar').getBoundingClientRect().width)}));
            assert(ex.x===78&&ex.side===221,'sidebar '+JSON.stringify(ex));await p.screenshot({path:'vis14-1440-expanded.png'});
            for(const locale of ['zh-CN','en','zh-TW']){await p.locator('button[aria-label="Language"],button[aria-label="語言"],button[aria-label="语言"]').first().click();await p.locator('[role="option"]').filter({hasText:locale}).first().click();}
            const p1600=await b.newPage({viewport:{width:1600,height:900}});await p1600.goto('http://127.0.0.1:3000/admin/erp',{waitUntil:'networkidle'});const g16=await p1600.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});assert(g16.client===g16.scroll,'1600 overflow '+JSON.stringify(g16));await p1600.screenshot({path:'vis14-1600.png'});
            const p1200=await b.newPage({viewport:{width:1200,height:900}});await p1200.goto('http://127.0.0.1:3000/admin/erp',{waitUntil:'networkidle'});const g12=await p1200.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});assert(g12.scroll>=1280&&g12.page>=1280&&g12.scroll>g12.client,'1200 expected scroll '+JSON.stringify(g12));await p1200.screenshot({path:'vis14-1200-minwidth.png'});
            assert(business===0,'business requests '+business);
            fs.mkdirSync('docs/construction/evidence/VIS-14',{recursive:true});
            fs.writeFileSync('docs/construction/evidence/VIS-14/vis14-validation.json',JSON.stringify({route:'/admin/erp',pageUid:'admin:ERP-01',authoritySections:8,authorityControls:42,sourceControlsAccounted:29,adminL1:9,activeNav:'ADMIN-NAV-05',workspace1440:g,sidebarExpanded:ex,viewport1600:g16,viewport1200:g12,localeSequence:['zh-TW','zh-CN','en','zh-TW'],businessRequests:business,enabledEffectfulBusinessControls:0,financeReadExportOnly:true,externalErpWriteback:false,rawSecretRendered:false,missingAsZero:false,noFakeBusinessData:true},null,2));
            for(const f of fs.readdirSync('.').filter(x=>x.startsWith('vis14-')&&x.endsWith('.png')))fs.renameSync(f,'docs/construction/evidence/VIS-14/'+f);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node vis14-check.cjs
      - name: Update truthful construction progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s=p.read_text()
          s=s.replace('current_task: VIS-14_ADMIN_ERP-01_VISUAL_POSITIONING','current_task: VIS-15_ADMIN_AIAPI-01_VISUAL_POSITIONING')
          s=s.replace('last_completed_task: VIS-13_ADMIN_SOC-01_VISUAL_POSITIONING','last_completed_task: VIS-14_ADMIN_ERP-01_VISUAL_POSITIONING')
          s=s.replace('navigation_revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01-DEV01-SOC01','navigation_revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01-DEV01-SOC01-ERP01')
          s=s.replace('  - id: VIS-14\n    group: ADMIN\n    page_uid: admin:ERP-01\n    name: ERP\n    status: NOT_STARTED',f'''  - id: VIS-14\n    group: ADMIN\n    page_uid: admin:ERP-01\n    name: ERP\n    status: COMPLETE\n    evidence:\n      final_validation_run_id: {os.environ['GITHUB_RUN_ID']}\n      evidence_directory: docs/construction/evidence/VIS-14\n      typecheck: PASS\n      next_build: PASS\n      production_server: PASS\n      chromium_render_and_geometry: PASS\n      locale_switch_runtime: PASS\n      business_requests_during_validation: 0''')
          s=s.replace('  visual_steps_complete: 14','  visual_steps_complete: 15')
          old='  truthful_progress_note: VIS-00 through VIS-13 visual positioning are implemented and verified. VIS-12 implements admin:DEV-01 at /admin/dev with evidence; VIS-13 implements admin:SOC-01 at /admin/social with exact same-page five-stage authority binding and evidence. Historical evidence is not rewritten. VIS-14 ERP-01 is next and has not started. Page business/runtime logic remains blocked until VIS-00 through VIS-18 are complete.'
          new='  truthful_progress_note: VIS-00 through VIS-14 visual positioning are implemented and verified. VIS-14 implements the single current admin:ERP-01 at /admin/erp with Finance / ERP Connection / Sync & Data Quality same-page views, preserving read/export-only finance, no ERP writeback, secret-reference-only and missing-value truth boundaries. Historical evidence is not rewritten. VIS-15 AIAPI-01 is next and has not started. Page business/runtime logic remains blocked until VIS-00 through VIS-18 are complete.'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit evidence progress and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/evidence/VIS-14 docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "test(vis14): add ERP validation evidence and progress"
          git rm .github/workflows/vis14-erp-validation.yml
          git commit -m "chore(vis14): remove ERP validation workflow"
          git push origin HEAD:acpos-vis14-staging
