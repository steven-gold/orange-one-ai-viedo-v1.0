name: Sync WB-01 Phase2 Preview
on:
  push:
    branches: [acpos-live-preview]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
          fetch-depth: 0
      - name: Checkout current construction source
        uses: actions/checkout@v4
        with:
          ref: new
          path: .source
      - name: Build current new branch
        working-directory: .source
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build
      - name: Start production server
        working-directory: .source
        run: |
          set -euo pipefail
          nohup npm start -- --hostname 127.0.0.1 --port 3000 >/tmp/acpos-preview-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/acpos-preview-next.log
          exit 1
      - name: Validate WB-01 runtime pending semantics
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/wb01-api.json -w '%{http_code}' http://127.0.0.1:3000/v1/dashboard/read-model)
          test "$code" = "503"
          grep -Fq 'WB-01-ERR-READ-001' /tmp/wb01-api.json
          grep -Fq 'DASHBOARD_RUNTIME_NOT_BOUND' /tmp/wb01-api.json
      - name: Materialize current routes into existing preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview
          mkdir -p preview/_next preview/brand
          cp -R .source/.next/static preview/_next/static
          cp .source/public/brand/orange-one-logo.png preview/brand/orange-one-logo.png
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path
          routes = {
              '/': 'index.html', '/core': 'core.html', '/assets': 'assets.html', '/video': 'video.html',
              '/edit': 'edit.html', '/qa': 'qa.html', '/database': 'db.html', '/strategy': 'strategy.html', '/info': 'info.html',
              '/admin/system': 'system.html', '/admin/accounts': 'accounts.html', '/admin/dev': 'dev.html',
              '/admin/social': 'social.html', '/admin/erp': 'erp.html', '/admin/aiapi': 'aiapi.html',
              '/admin/qa-criteria': 'qa-criteria.html', '/admin/strategy': 'strategy-admin.html', '/admin/knowledge': 'knowledge-admin.html',
          }
          preview=Path('preview')
          route_links=sorted(routes.items(), key=lambda kv: len(kv[0]), reverse=True)
          static_css='''<style data-preview-static-shell>\n.global-sidebar:hover,.global-sidebar:focus-within{width:221px;padding-left:15px;padding-right:15px}.global-sidebar:hover .sidebar-surface,.global-sidebar:focus-within .sidebar-surface{opacity:1}.global-sidebar:hover .nav-list,.global-sidebar:focus-within .nav-list{width:191px}.global-sidebar:hover .nav-item,.global-sidebar:focus-within .nav-item{width:191px}.global-sidebar:hover .nav-label,.global-sidebar:focus-within .nav-label{opacity:1;transform:none}.language-button{cursor:default}\n</style>'''
          for route,filename in routes.items():
              with urllib.request.urlopen('http://127.0.0.1:3000'+route,timeout=15) as response:
                  html=response.read().decode('utf-8')
                  if response.status!=200: raise RuntimeError(f'{route}: HTTP {response.status}')
              html=re.sub(r'<script\b[^>]*>.*?</script>','',html,flags=re.I|re.S)
              html=re.sub(r'<link\b(?=[^>]*\bas=["\']script["\'])[^>]*>','',html,flags=re.I)
              html=html.replace('href="/_next/','href="_next/').replace("href='/_next/","href='_next/")
              html=html.replace('src="/_next/','src="_next/').replace("src='/_next/","src='_next/")
              html=html.replace('src="/brand/','src="brand/').replace("src='/brand/","src='brand/")
              html=html.replace('href="/brand/','href="brand/').replace("href='/brand/","href='brand/")
              for href,target in route_links:
                  html=html.replace(f'href="{href}"',f'href="{target}"').replace(f"href='{href}'",f"href='{target}'")
              html=html.replace('</head>',static_css+'</head>',1)
              preview.joinpath(filename).write_text(html,encoding='utf-8')
          PY
      - name: Validate preview output
        shell: bash
        run: |
          set -euo pipefail
          test "$(find preview -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')" = "18"
          grep -Fq 'data-page-uid="workspace:WB-01"' preview/index.html
          test "$(grep -o 'data-section-id="SEC-WORKSPACE-WB-01-' preview/index.html | wc -l | tr -d ' ')" = "14"
          test "$(grep -o 'data-control-id="CTRL-WORKSPACE-WB-01-' preview/index.html | wc -l | tr -d ' ')" = "14"
          ! grep -Fq 'correction rate' preview/index.html
          ! grep -Fq '素材總數' preview/index.html
          ! grep -Fq '影片產出數' preview/index.html
          ! grep -R 'href="/_next/' preview/*.html
          ! grep -R 'src="/_next/' preview/*.html
          ! grep -R '<script' preview/*.html
          test -s preview/brand/orange-one-logo.png
          test -d preview/_next/static
          echo 'WB01_PHASE2_PREVIEW=PASS'
      - name: Commit synchronized preview and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-wb01-phase2-preview.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'ACPOS Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A preview .github 2>/dev/null || git add -A preview
          git commit -m 'feat(preview): deploy WB-01 phase2 validated preview'
          git push origin HEAD:acpos-live-preview
