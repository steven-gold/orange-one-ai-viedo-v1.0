      - INFO-01-BTN-REFRESH
      - refreshProjection
      - Global Brain / ACPOSStateProjection + Projection Audit
      - Refresh rematerializes a derived projection for an exact domain version. It must not create a second canonical domain row; projection state/version and audit
        lineage remain reconstructable.
    - row: 2
      cells:
      - INFO-01-BTN-SEARCH
      - searchProjection
      - Global Brain / SemanticIndexResult + Search Audit
      - Search persists only search/index result pointers, scope and audit/evidence needed to dereference exact source/version/evidence. Search score/result is not
        canonical truth.
    - row: 3
      cells:
      - INFO-01-BTN-EXPORT
      - exportProjection
      - Global Brain / Export Artifact + Export Audit
      - Export persists an authorized derived export artifact and audit lineage for the exact projection/scope. Export output does not become a second canonical owner
        for domain data.
