name: VIS-10 SYS-01 registry discovery
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-sys01-discovery.yml
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
          fetch-depth: 0
      - name: Scan repository for exact SYS-01 definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          pats=[re.compile(r'admin:SYS-01'),re.compile(r'SEC-ADMIN-SYS-01'),re.compile(r'SYS-01-[A-Z0-9_-]+')]
          exts={'.yaml','.yml','.json','.md','.txt','.js','.jsx','.ts','.tsx','.css','.html'}
          rows=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts: continue
              try: text=p.read_text(errors='ignore')
              except Exception: continue
              hits=[]
              for i,line in enumerate(text.splitlines(),1):
                  if any(rx.search(line) for rx in pats): hits.append({'line':i,'text':line.strip()})
              if hits: rows.append({'path':str(p),'hits':hits})
          tokens={}
          for row in rows:
              for h in row['hits']:
                  for tok in re.findall(r'SYS-01-[A-Z0-9_-]+',h['text']):
                      tokens.setdefault(tok,[]).append({'path':row['path'],'line':h['line'],'text':h['text']})
          out={'files':rows,'unique_sys01_tokens':tokens,'unique_token_count':len(tokens)}
          Path('/tmp/sys01-discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('files_with_hits',len(rows))
          print('unique_tokens',len(tokens))
          for row in rows: print(row['path'],len(row['hits']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vis10-sys01-discovery
          path: /tmp/sys01-discovery.json
      - name: Self-clean workflow
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git rm .github/workflows/vis10-sys01-discovery.yml
          git commit -m "chore(vis10): remove temporary SYS-01 discovery workflow"
          git push origin HEAD:acpos-vis10-staging
