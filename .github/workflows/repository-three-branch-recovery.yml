name: Repository authorized branch authority guard

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install authority parser dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Validate current branch against repository branch authority
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path('governance/BRANCH_AUTHORITY_LOCK.yaml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']

          if data.get('status') != 'ACTIVE':
              raise SystemExit('BLOCK: branch authority lock is not ACTIVE')
          if data.get('scope') != repo:
              raise SystemExit(f'BLOCK: branch authority scope mismatch: {data.get("scope")} != {repo}')

          allowed = data.get('allowed_branch_targets_without_new_branch_creation') or []
          if branch not in allowed:
              raise SystemExit(f'BLOCK: branch {branch} is not an authorized persistent target')

          creation = data.get('branch_creation_policy') or {}
          if creation.get('default') != 'FORBIDDEN':
              raise SystemExit('BLOCK: branch creation default must remain FORBIDDEN')
          if creation.get('explicit_user_authorization_required') is not True:
              raise SystemExit('BLOCK: explicit user authorization requirement missing')

          execution = data.get('execution_policy') or {}
          if execution.get('cross_branch_copy_or_merge_without_explicit_user_authority') != 'FORBIDDEN':
              raise SystemExit('BLOCK: cross-branch authority protection missing')
          if execution.get('if_target_branch_is_ambiguous') != 'BLOCK_WRITE_AND_REPORT':
              raise SystemExit('BLOCK: ambiguous target must fail closed')

          enforcement = data.get('enforcement') or {}
          expected = '.github/workflows/repository-three-branch-recovery.yml'
          if enforcement.get('operational_guard_workflow') != expected:
              raise SystemExit('BLOCK: operational guard workflow binding drift')

          print(f'AUTHORIZED_BRANCH_TARGET_OK repository={repo} branch={branch}')
          print('PASS: guard is read-only; no branch ref rewrite or deletion is performed')
          PY
