name: Verify Public CORE-01
on:
  push:
    branches: [acpos-live-preview]
    paths: [.github/workflows/verify-public-core01.yml]
permissions:
  contents: write
jobs:
  public-core01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify actual rawcdn preview
        run: |
          cat > verify-public-core01.mjs <<'EOF'
          import { chromium } from 'playwright';
          const commit='d7bd6d7a36d1d763431478b581e11e5ac277a86a';
          const base=`https://rawcdn.githack.com/steven-gold/orange-one-ai-viedo-v1.0/${commit}/preview/`;
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1100}});
          await page.goto(base+'core.html',{waitUntil:'networkidle',timeout:30000});
          await page.locator('[data-page-uid="CORE-01"]').waitFor();
          const buttons=page.locator('[data-page-uid="CORE-01"] button[data-control-id]');
          const disabled=await buttons.evaluateAll(xs=>xs.filter(x=>x.disabled).length);
          if(disabled!==0) throw new Error(`public preview has ${disabled} dead buttons`);
          const stage=page.locator('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong');
          await page.locator('[data-control-id="CORE-01-BTN-ASSISTANT-RECORD"]').click();
          await page.waitForFunction(()=>document.querySelector('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong')?.textContent?.includes('ASSISTANT_RECORD_OPEN'),null,{timeout:5000});
          await page.locator('[data-control-id="CORE-01-BTN-TOPIC-CREATE"]').click();
          await page.waitForFunction(()=>document.querySelector('[data-control-id="CORE-01-FLD-RUNTIME-STAGE"] strong')?.textContent?.includes('REQUIRED_PROJECT_REF_MISSING'),null,{timeout:5000});
          const href=await page.locator('a[data-nav-id="NAV-03"]').getAttribute('href');
          if(href!=='assets.html') throw new Error(`bad assets href: ${href}`);
          await page.locator('a[data-nav-id="NAV-03"]').click();
          await page.waitForLoadState('domcontentloaded');
          if(!page.url().endsWith('/preview/assets.html')) throw new Error(`assets navigation failed: ${page.url()}`);
          if((await page.locator('[data-page-uid="ASSET-01"]').count())!==1) throw new Error('ASSET-01 preview missing');
          await browser.close();
          EOF
          node verify-public-core01.mjs
      - name: Self-clean
        run: |
          git config user.name "ACPOS Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/verify-public-core01.yml
          git add -A .github/workflows/verify-public-core01.yml
          git commit -m "chore(preview): remove public CORE-01 verification workflow"
          git push origin acpos-live-preview
