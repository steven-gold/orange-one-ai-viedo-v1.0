name: VIS-07 Route Patch
on:
  push:
    branches: [acpos-vis07-staging]
    paths: [.github/workflows/vis07-route-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NAV-07 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/shell/AppShell.tsx')
          s=p.read_text()
          old='{ id: "NAV-07", labelKey: "global.nav.database", icon: "database" },'
          new='{ id: "NAV-07", labelKey: "global.nav.database", icon: "database", href: "/database" },'
          if old not in s:
              raise SystemExit('NAV-07 unlinked item not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit exact route patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/shell/AppShell.tsx
          git rm .github/workflows/vis07-route-patch.yml
          git commit -m "feat(vis07): route NAV-07 to DB-01 [skip ci]"
          git push
