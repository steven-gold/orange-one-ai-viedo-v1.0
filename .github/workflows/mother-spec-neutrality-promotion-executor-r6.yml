name: Hardened Mother Spec Neutrality Promotion Executor R6
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/mother-spec-neutrality-promotion-executor-r6.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: python3 -m pip install pyyaml
      - name: Canonicalize Mother EOF in generator before hashes and run full R5 gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          p=Path('.github/workflows/mother-spec-neutrality-promotion.yml')
          t=p.read_text(encoding='utf-8')
          old="p.write_text(replace_fixed_stage_tokens(t),encoding='utf-8')"
          new="p.write_text(replace_fixed_stage_tokens(t).rstrip()+'\\n',encoding='utf-8')"
          count=t.count(old)
          if count != 4:
              raise SystemExit(f'EXPECTED_4_MOTHER_WRITES_FOUND_{count}')
          p.write_text(t.replace(old,new),encoding='utf-8')
          d=yaml.safe_load(Path('.github/workflows/mother-spec-neutrality-promotion-executor-r5.yml').read_text())
          step=next(s for s in d['jobs']['promote']['steps'] if s.get('name')=='Execute full R4 promotion with location-independent final source identity proof')
          subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
      - name: Persist authorized neutral governance promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOVERNANCE_CURRENT.yaml governance .github/governance-source
          git reset -- .github/workflows || true
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "governance(spec): promote neutral portable mother policy v2.2.0" -m "Authorization: USR-DIRECTIVE-20260915-MOTHER-SPEC-NEUTRALITY-AUDIT" -m "Separates reusable POLICY from ACPOS EXECUTION_PROFILE, removes Stage/Run-specific authority pollution, preserves structural parent sections and historical execution evidence, requires fresh revalidation after authority promotion, and canonicalizes Mother EOF before hashing."
          git push origin HEAD:rebuild-v2.1.1
