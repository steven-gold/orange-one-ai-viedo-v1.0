name: ACPOS Batch 105 EDIT Grouped Precision Timeline Upgrade
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch105_edit_grouped_precision_timeline_upgrade.yml
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install DOCX and render tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
      - name: Apply EDIT grouped precision design and system contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.enum.text import WD_BREAK
          import subprocess, zipfile, json, re

          BASE="a1a5a792ef85c406cc051e024259e62c0ae9881f"
          if subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()!=BASE:
              raise SystemExit("EXACT_PARENT_FAIL")

          EDIT=Path("ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx")
          SYS=Path("05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx")
          GLOBAL=Path("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          targets=[EDIT,SYS,GLOBAL]
          for p in targets:
              if not p.exists(): raise SystemExit(f"MISSING {p}")

          def doc_text(doc):
              out=[p.text for p in doc.paragraphs]
              def walk(t):
                  for r in t.rows:
                      for c in r.cells:
                          out.extend(p.text for p in c.paragraphs)
                          for nt in c.tables: walk(nt)
              for t in doc.tables: walk(t)
              return "\n".join(out)

          def add_table(doc, heads, rows, widths=None):
              t=doc.add_table(rows=1,cols=len(heads)); t.style="Table Grid"
              for i,h in enumerate(heads): t.rows[0].cells[i].text=h
              for row in rows:
                  cells=t.add_row().cells
                  for i,v in enumerate(row): cells[i].text=str(v)
              return t

          def page_break(doc):
              p=doc.add_paragraph(); p.add_run().add_break(WD_BREAK.PAGE)

          # ---------------- EDIT-01 ----------------
          d=Document(EDIT)
          MARK="[ACPOS-EDIT-01-GROUPED-PRECISION-TIMELINE-V1]"
          if MARK not in doc_text(d):
              page_break(d)
              d.add_heading("Grouped Precision Timeline Upgrade｜分組式精密時間軸升級",level=1)
              d.add_paragraph(MARK+" This section is normative for EDIT-01 planning/basic design. It changes the presentation and precision-control topology while preserving the seven underlying track responsibilities, existing Working Draft/version lineage, existing effectful operations, permissions, DialogueTimingBinding, Stage Evaluation, Finalize and QA handoff authorities. It creates no parallel editing truth and no new public API.")

              d.add_heading("A. Design Decision / 設計裁決",level=2)
              add_table(d,["Decision","Normative Rule"],[
                ("Underlying editing responsibilities","Keep seven independent responsibilities: Video, Overlay, Voice, Music, SFX, Subtitle, LipSync/Dialogue sync evidence. They MUST NOT be merged into one storage track or lose independent version/invalidation semantics."),
                ("Default UI topology","Render three display groups: VISUAL, AUDIO, DIALOGUE. Grouping is a view/projection layer only; collapsing a group MUST NOT delete, merge, mute, reorder, retime, or rewrite underlying clips."),
                ("VISUAL group","Contains Video + Overlay lanes. Default expanded in ASSEMBLY; may collapse to a summary row in AUDIO/SYNC/FINALIZE."),
                ("AUDIO group","Contains Voice + Music + SFX lanes. Default expanded in AUDIO. Waveform and channel/sample controls are shown only when relevant."),
                ("DIALOGUE group","Contains Subtitle as the editable lane; LipSync + DialogueTimingBinding render as status/overlay layers attached to dialogue/voice segments rather than permanent full-height tracks."),
                ("Stage Focus","ASSEMBLY→VISUAL focus; AUDIO→AUDIO focus; SYNC→DIALOGUE + Voice focus; FINALIZE→three collapsed summaries with warnings/errors expanded automatically."),
                ("Focus override","User may manually expand/collapse any group without changing Stage state. Blocking warnings may force affected group visible but MUST NOT mutate edit data."),
                ("Market-pattern boundary","Role/lane grouping, audio-unit precision and sample-level refinement are adopted only as interaction patterns. External product behavior is non-authority; ACPOS Canonical Time and existing governance remain authoritative."),
              ])

              d.add_heading("B. Track Group Registry / 軌道群組註冊",level=2)
              add_table(d,["Group UID","Display Group","Child Responsibilities","Default State","Summary when Collapsed","Edit Authority"],[
                ("EDIT-01-TG-VISUAL","VISUAL","Video; Overlay","EXPANDED @ ASSEMBLY","clip count; overlay count; visible warnings","Existing LOCAL_WORKING_DRAFT_EXACT visual edit primitives"),
                ("EDIT-01-TG-AUDIO","AUDIO","Voice; Music; SFX","EXPANDED @ AUDIO","voice take count; music count; SFX count; peak/warning state","Existing LOCAL_WORKING_DRAFT_EXACT audio edit primitives"),
                ("EDIT-01-TG-DIALOGUE","DIALOGUE","Subtitle editable lane; LipSync status overlay; DialogueTimingBinding status rail","EXPANDED @ SYNC","cue count; bound count; stale count; sync health","Subtitle local edit + existing completeSubtitle/completeLipSync + read projections"),
              ])

              d.add_heading("C. Stage-driven Focus Matrix / 階段聚焦矩陣",level=2)
              add_table(d,["Stage","VISUAL","AUDIO","DIALOGUE","Primary Inspector","Auto-open Conditions"],[
                ("ASSEMBLY","EXPANDED","COLLAPSED","COLLAPSED","Clip/visual inspector","visual source/binding/geometry warning"),
                ("AUDIO","COLLAPSED","EXPANDED","COLLAPSED","Voice/Music/SFX inspector","missing source, peak/clipping, sample-rate/timebase problem"),
                ("SYNC","SUMMARY","VOICE FOCUS","EXPANDED","Dialogue precision + binding inspector","stale LipSync/subtitle/binding fingerprint mismatch"),
                ("FINALIZE","SUMMARY","SUMMARY","SUMMARY","Final validation/output inspector","any blocking warning expands its owning group"),
                ("QA HANDOFF","READ_ONLY SUMMARY","READ_ONLY SUMMARY","READ_ONLY SUMMARY","handoff evidence","no edit; exact locked refs only"),
              ])

              d.add_heading("D. Precision Mode / 時間精度操作",level=2)
              add_table(d,["Responsibility","Normal Display/Edit Unit","Precision Mode","Nudge / Trim Rule","Hard Boundary"],[
                ("Video","HH:MM:SS:FF / frame","FRAME","±1 frame; frame-boundary trim","Video edit MUST remain frame-aligned; subframe/sample may not create a video cut."),
                ("Overlay","frame-relative visual placement","FRAME","±1 frame; visual snap","Render placement remains video-frame aligned."),
                ("Voice","frame-oriented overview","MILLISECOND / SUBFRAME / SAMPLE","±10 ms; ±1 ms; ±1 subframe; ±1 sample where source/sample-rate is exact","Sample mode requires exact sample rate and audio source binding."),
                ("Music","frame/ms overview","MILLISECOND / SAMPLE","±10 ms; ±1 ms; ±1 sample when exact","No silent resampling assumption; conversion requires known sample-rate semantics."),
                ("SFX","frame/ms overview","MILLISECOND / SAMPLE","±10 ms; ±1 ms; ±1 sample when exact","Transient placement may refine below frame but must retain exact canonical time."),
                ("Subtitle","HH:MM:SS.mmm","MILLISECOND","±10 ms normal; ±1 ms precision","Cue start/end must stay ordered and within legal program duration; export may quantize only by target-format rule."),
                ("LipSync","derived sync status, not a movable permanent lane","SUBFRAME / SAMPLE reference","navigate/jump to mismatch; edit underlying Voice/Subtitle/Visual owner","LipSync status cannot become independent timing truth."),
                ("DialogueTimingBinding","exact binding/status rail","CANONICAL_RATIONAL","not directly nudged","Binding follows exact segment/source/version/timebase fingerprint; mismatch→STALE/REVERIFY_REQUIRED."),
              ])

              d.add_heading("E. Canonical Time Contract / 正式時間真值",level=2)
              add_table(d,["Field / Concept","Normative Contract"],[
                ("Canonical truth","Every editable time point/duration MUST be representable as an exact rational value. Float seconds MUST NOT be the sole canonical value."),
                ("Rational representation","time_numerator:int64 + time_denominator:int64>0, normalized by GCD; associated project/source timebase identity is mandatory."),
                ("Frame representation","frame_index + frame_rate_num/frame_rate_den maps exactly to the rational time. 23.976/29.97/59.94 MUST NOT be rounded to integer fps."),
                ("Audio sample representation","sample_index + sample_rate_hz maps exactly to sample_index/sample_rate_hz seconds. Sample-rate identity is mandatory before SAMPLE mode."),
                ("Millisecond UI","Milliseconds are an edit/display projection. ±1 ms converts to canonical rational time and MUST use deterministic rounding/quantization only when the target responsibility requires it."),
                ("Subframe UI","SUBFRAME is a view/edit refinement between video frames. It is valid for audio/dialogue timing, never as a video-cut boundary."),
                ("Conversion","FRAME↔MS↔SUBFRAME↔SAMPLE conversion MUST be deterministic from the same canonical rational value; changing display unit MUST NOT change canonical time."),
                ("Unknown timebase","Unknown/mismatched frame rate, sample rate or binding fingerprint blocks precision mutation; UI shows explicit reason and preserves current draft."),
              ])

              d.add_heading("F. Precision Controls / 精密操作控制契約",level=2)
              add_table(d,["Control UID","Type","Label / Choices","Visibility","Action Binding","State / Failure"],[
                ("EDIT-01-CTL-TIMELINE-GROUP","Disclosure group","VISUAL / AUDIO / DIALOGUE","Always","VIEW_PROJECTION_ONLY","collapse/expand changes appearance only"),
                ("EDIT-01-CTL-PRECISION-MODE","Segmented/select","AUTO / FRAME / MILLISECOND / SUBFRAME / SAMPLE","Selected clip/segment","LOCAL_WORKING_DRAFT_EXACT projection/edit context","unsupported mode disabled with reason"),
                ("EDIT-01-BTN-NUDGE-COARSE","Button pair","−10 ms / +10 ms","audio/dialogue precision context","LOCAL_WORKING_DRAFT_EXACT","disabled when selected responsibility is frame-only"),
                ("EDIT-01-BTN-NUDGE-FINE","Button pair","−1 ms / +1 ms","audio/dialogue precision context","LOCAL_WORKING_DRAFT_EXACT","exact rational conversion required"),
                ("EDIT-01-BTN-NUDGE-FRAME","Button pair","−1 frame / +1 frame","frame-capable context","LOCAL_WORKING_DRAFT_EXACT","project frame rate must resolve"),
                ("EDIT-01-BTN-NUDGE-SAMPLE","Button pair","−1 sample / +1 sample","audio + SAMPLE mode","LOCAL_WORKING_DRAFT_EXACT","exact sample rate/source required"),
                ("EDIT-01-LBL-PRECISION-READOUT","Read-only technical value","timecode + ms/subframe/sample offset","Selected clip/segment","READ_EXACT projection","must expose exact selected unit and timebase"),
                ("EDIT-01-LBL-SYNC-HEALTH","Status rail","BOUND / STALE / REVERIFY / BLOCKED","DIALOGUE summary/expanded","existing DialogueTimingBinding reads","click jumps to affected segment; does not self-repair"),
              ])

              d.add_heading("G. End-to-End Functional Chain / 從輸入到交付",level=2)
              add_table(d,["Step","Input","Operation / Rule","Output / Next Gate"],[
                ("1 Input Binding","Locked Blueprint + Production Package + source versions","Resolve exact project frame rate, audio sample rates, source timebase/fingerprint","Timebase readiness; unresolved→BLOCK"),
                ("2 Working Draft","Bound sources","Create/restore existing Working Draft lineage; no new parallel timeline truth","Current editing draft/version"),
                ("3 Timeline Projection","Working Draft","Project seven responsibilities into 3 UI groups; apply Stage Focus","Grouped timeline view only"),
                ("4 Selection","clip/segment","Resolve responsibility + source/version + editable range","Precision context"),
                ("5 Precision Choice","precision context","AUTO selects legal unit; user may choose FRAME/MS/SUBFRAME/SAMPLE if applicable","Exact unit + conversion contract"),
                ("6 Edit Mutation","canonical start/end/duration","Apply existing LOCAL_WORKING_DRAFT_EXACT edit primitive using exact rational time","new working-draft timing state"),
                ("7 Validation","edited timing + source timebase","bounds/order/overlap/timebase/sample-rate/frame-boundary checks","PASS or explicit failure without partial mutation"),
                ("8 Dialogue Invalidation","Voice/Subtitle/visual timing/version changed","Recompute fingerprint impact; affected LipSync/Subtitle/DialogueTimingBinding becomes STALE/REVERIFY_REQUIRED","SYNC gate blocks until repaired"),
                ("9 Stage Evaluation","current stage output","existing Stage Evaluation dimensions + precision/sync readiness","WAIT_CONFIRMATION on PASS"),
                ("10 Human Confirm","stage PASS evidence","existing Stage Confirm authority","next Stage focus"),
                ("11 Render/Finalize","exact draft/version + bindings","existing startEditRender/finalize/lock flow","immutable output version"),
                ("12 QA Handoff","locked/final exact refs","existing handoffVoiceToQA/QA handoff contract","read-only grouped timeline summary + evidence"),
              ])

              d.add_heading("H. Failure / Recovery / Undo / Version Rules",level=2)
              add_table(d,["Condition","Required Behavior"],[
                ("Unknown frame/sample rate","BLOCK precision mutation; preserve draft; expose source/timebase reason."),
                ("Illegal unit for responsibility","Disable control; never coerce Video cut to subframe/sample."),
                ("Millisecond not exactly sample-aligned","Preserve requested canonical rational time; only quantize when committing to a sample-bound operation and record deterministic quantization/result."),
                ("Timing edit invalidates sync","Mark exact affected DialogueTimingBinding/LipSync/Subtitle dependency STALE; do not silently regenerate."),
                ("Collapsed group contains blocker","Show warning badge and auto-expand on Jump to Issue."),
                ("Undo/Redo","Operates on underlying Working Draft mutations, not display-group collapse/expand state."),
                ("Save version","Existing saveEditVersion captures exact canonical timing values/timebase identities and predecessor lineage."),
                ("Restore version","Existing restoreEditVersionAsDraft restores into a new draft lineage; no in-place rewrite of historical timing."),
              ])

              d.add_heading("I. Visual Geometry / Timeline Density",level=2)
              add_table(d,["Element","Geometry / Behavior"],[
                ("Collapsed group row","28–32 px target height; label + compact counts + health/warning badges."),
                ("Normal child lane","38–44 px target height; clip blocks + minimal metadata."),
                ("Focused precision lane","64–72 px target height; waveform/cue detail + precision readout."),
                ("LipSync / Binding","status overlay/rail attached to DIALOGUE/Voice; MUST NOT consume a permanent full-height lane by default."),
                ("Track header","Visual: visibility/lock; Audio: mute/solo/lock; Dialogue: cue/binding health. Do not render irrelevant repeated controls."),
                ("Horizontal zoom","Zoom changes visible temporal density only; canonical time remains unchanged."),
                ("Vertical density","Group collapse/focus changes lane height only; no clip timing mutation."),
                ("Warning visibility","Collapsed groups must retain blocker/warning count; hidden state may never hide blocking issues."),
              ])

              d.add_heading("J. Website-structure Visual Preview / 網站結構預覽",level=2)
              add_table(d,["Timeline Region","Collapsed / Focused Preview"],[
                ("Time ruler","00:00:00:00 ───── 00:00:05:00 ───── 00:00:10:00; selected unit indicator at right."),
                ("VISUAL","▼ VISUAL | Video lane | Overlay lane during ASSEMBLY; otherwise ▶ VISUAL · clips/overlays/warnings summary."),
                ("AUDIO","▶ AUDIO · Voice/Music/SFX counts; AUDIO Stage expands Voice/Music/SFX and selected waveform."),
                ("DIALOGUE","▶ DIALOGUE · cues/bound/stale summary; SYNC Stage expands Subtitle + sync health rail; LipSync is overlay/status, not permanent lane."),
                ("Precision strip","Selected item → [AUTO][FRAME][MS][SUBFRAME][SAMPLE] + legal nudge buttons + exact timebase/readout."),
                ("Inspector","Shows selected responsibility, source/version, canonical time, displayed unit, validation state and dependency impact."),
              ])

              d.add_heading("K. Acceptance / Audit / Definition of Done",level=2)
              add_table(d,["Audit Item","PASS Condition"],[
                ("Grouping semantics","3 UI groups render while seven underlying responsibilities remain independently addressable and version/invalidation-safe."),
                ("View-only collapse","Expand/collapse/focus produces zero edit mutation."),
                ("Precision applicability","Video/Overlay cannot create subframe/sample cuts; Audio can reach ms/sample when source authority exists; Subtitle supports ms precision."),
                ("Canonical time","No float-seconds-only canonical timing; exact rational conversion is deterministic."),
                ("Display conversion","Changing FRAME/MS/SUBFRAME/SAMPLE display does not change canonical time."),
                ("Dialogue sync","Voice/Subtitle/visual timing changes invalidate exact affected binding and block SYNC until reverified."),
                ("Failure safety","Unknown/mismatched timebase/sample rate fails closed without partial edit."),
                ("Stage focus","ASSEMBLY/AUDIO/SYNC/FINALIZE views focus the correct group without changing Stage authority."),
                ("Versioning","Save/restore retains exact timing + timebase + lineage."),
                ("Render/Handoff","Existing Render/Finalize/QA authorities consume exact version/bindings; no new public API invented."),
                ("Visual QA","Updated grouped timeline must be visually reviewed before Design Freeze; the table above is the current structural preview contract."),
              ])
              d.save(EDIT)

          # ---------------- System 05 ----------------
          d=Document(SYS)
          MARK="[ACPOS-SYS05-EDIT-PRECISION-TIME-PIPELINE-V1]"
          if MARK not in doc_text(d):
              page_break(d)
              d.add_heading("EDIT Precision Time & Grouped Timeline System Contract",level=1)
              d.add_paragraph(MARK+" Shared production-system contract for EDIT-01. Page-level grouping is a presentation projection; the underlying creative-production entities, Working Draft/version lineage, stage gates and exact operation owners remain unchanged.")

              d.add_heading("1. Shared Data Contracts",level=2)
              add_table(d,["Contract","Required Fields / Semantics"],[
                ("CanonicalTimePoint","time_numerator:int64; time_denominator:int64>0; normalized exact rational; timebase_ref; source_version_ref; no float-only truth."),
                ("VideoTimebase","frame_rate_num; frame_rate_den; frame_index when frame-addressed; drop/non-drop display is presentation metadata, not arithmetic truth."),
                ("AudioTimebase","sample_rate_hz; sample_index when sample-addressed; channel/source binding; resampling must be explicit, never inferred."),
                ("PrecisionEditContext","responsibility; selected_source_ref; selected_version_ref; legal_units; active_unit; range_start/end CanonicalTimePoint; snap/quantization rule."),
                ("TimelineDisplayGroup","group_uid; child_responsibilities; expanded/collapsed/focused display state. This state is non-authoritative view preference unless explicitly persisted as user UI preference."),
                ("DialogueSyncHealth","segment_id; dialogue_binding_id; fingerprint; voice_ref; subtitle_ref; visual_ref; status BOUND/STALE/REVERIFY_REQUIRED/BLOCKED; issue reason."),
              ])

              d.add_heading("2. Exact Conversion / Quantization Rules",level=2)
              add_table(d,["From / To","System Rule"],[
                ("Frame → Canonical","frame_index × frame_rate_den / frame_rate_num."),
                ("Sample → Canonical","sample_index / sample_rate_hz."),
                ("Millisecond → Canonical","millisecond_value / 1000 exactly; no binary-float authority."),
                ("Canonical → Frame display","Display mapping may round for ruler/readout, but video mutation commits only to legal exact frame boundaries."),
                ("Canonical → Sample","Only when exact sample_rate_hz resolves; deterministic nearest/legal sample rule must be recorded when quantization is required."),
                ("Canonical → Subtitle ms","Expose millisecond projection; exact canonical value remains available for internal comparison/versioning."),
                ("Unit switch","Pure representation change; MUST NOT change the CanonicalTimePoint."),
              ])

              d.add_heading("3. System Pipeline",level=2)
              add_table(d,["Phase","Producer","Consumer","Contract"],[
                ("Input readiness","Blueprint/Production Package/source bindings","Editing runtime","Resolve exact frame/audio timebase before precision edit is enabled."),
                ("Draft lineage","Editing runtime","EDIT-01","Bind/create/restore existing Working Draft; exact predecessor/source fingerprint."),
                ("Grouped projection","EDIT-01 view model","Timeline UI","Seven responsibilities → VISUAL/AUDIO/DIALOGUE groups; no persistence merge."),
                ("Precision mutation","EDIT local editor","Working Draft","Use existing local edit authority with CanonicalTimePoint; no new public endpoint."),
                ("Validation","Editing runtime/local validator","Stage gate","Check boundary, duration, overlap, timebase, sample-rate and responsibility-specific precision."),
                ("Dependency invalidation","Timing/version mutation","Dialogue sync subsystem","Mark affected binding/LipSync/subtitle dependency stale; no automatic silent repair."),
                ("Stage evaluation","Current stage output","Human confirmation gate","Precision + sync readiness contributes to existing stage evaluation."),
                ("Render/finalize","Existing render/lock operations","Immutable output/version","Consume exact canonical timing/version refs."),
                ("QA handoff","Existing handoff","QA","Transmit locked exact refs + timing/sync evidence; grouped UI becomes read-only summary."),
              ])

              d.add_heading("4. Failure-State Matrix",level=2)
              add_table(d,["Failure","System Response","Recovery"],[
                ("TIMEBASE_UNRESOLVED","BLOCK precision mutation","resolve authoritative frame/sample rate and re-open context"),
                ("PRECISION_UNIT_NOT_APPLICABLE","disable requested unit","select legal unit for responsibility"),
                ("SAMPLE_RATE_MISMATCH","BLOCK sample edit or require explicit governed resampling path","bind correct source/rate or authorized resample result"),
                ("FRAME_ALIGNMENT_REQUIRED","reject non-frame video boundary","snap/choose legal frame boundary"),
                ("DIALOGUE_BINDING_STALE","BLOCK SYNC PASS/Render/Lock where applicable","reverify/regenerate through existing authorized flow"),
                ("CANONICAL_TIME_OUT_OF_RANGE","reject mutation; no partial write","correct range and retry"),
                ("CONVERSION_DRIFT_DETECTED","fail closed","recompute from canonical rational source; never chain rounded projections"),
              ])

              d.add_heading("5. Invalidation and Versioning",level=2)
              add_table(d,["Mutation","Required Impact"],[
                ("Video/Overlay timing","new Working Draft timing state; invalidate dependent dialogue visual fingerprint when segment overlap/reference is affected."),
                ("Voice timing/version","new draft state; affected LipSync + Subtitle/DialogueTimingBinding → STALE/REVERIFY_REQUIRED."),
                ("Subtitle timing/version","new draft state; affected dialogue binding becomes STALE/REVERIFY_REQUIRED."),
                ("Music/SFX timing","new draft state; no DialogueTimingBinding invalidation unless explicitly bound to a governed dialogue/event dependency."),
                ("Display group collapse/focus","no content/version mutation."),
                ("Precision unit switch","no content/version mutation."),
              ])

              d.add_heading("6. System DoD",level=2)
              d.add_paragraph("PASS only when exact rational time is preserved end-to-end; frame/sample-rate identities are resolvable where required; illegal precision modes fail closed; group projection never changes edit truth; timing/version mutations produce correct dependency invalidation; existing Stage Evaluation, Human Confirm, Render/Lock and QA Handoff authorities remain unchanged.")
              d.save(SYS)

          # ---------------- Global Integration ----------------
          d=Document(GLOBAL)
          MARK="[ACPOS-GLOBAL-CANONICAL-TIME-INTEGRATION-V1]"
          if MARK not in doc_text(d):
              page_break(d)
              d.add_heading("Shared Canonical Time Integration Contract｜共享正式時間整合契約",level=1)
              d.add_paragraph(MARK+" Cross-system rule for media/time-bearing design contracts. EDIT-01 is the first explicit consumer; other pages may reference this contract but MUST NOT create competing time truth.")

              add_table(d,["Integration Rule","Normative Requirement"],[
                ("Single time truth","Time-bearing systems exchange exact CanonicalTimePoint rational values + explicit timebase identity; float seconds alone are forbidden as cross-system authority."),
                ("Display-unit independence","Frame, millisecond, subframe and sample are UI/operation projections over the same canonical value; switching projection cannot mutate time."),
                ("Source identity","Frame rate/sample rate/source version are part of the binding needed to interpret a precise position."),
                ("Cross-stage handoff","ASSET/VIDEO/EDIT/VOICE/QA handoffs that carry timing MUST preserve canonical rational values or a lossless equivalent plus timebase metadata."),
                ("Video boundary","Video edits/visual render boundaries remain frame-addressable; audio/dialogue may refine below a frame without creating a video subframe cut."),
                ("Audio precision","Sample-level operations require exact sample-rate authority; millisecond operation is legal as a rational projection and may require deterministic quantization only at a sample-bound commit."),
                ("Subtitle precision","Subtitle cue timing may be millisecond-addressable; export-specific quantization is a target-format concern and must not overwrite canonical edit truth."),
                ("LipSync/Dialogue","Derived sync/binding status references canonical time + source/version fingerprint; derived status cannot become independent timing authority."),
                ("Failure propagation","Unknown/mismatched timebase or source version is an explicit blocker propagated to the consuming stage; no guessed defaults."),
                ("Audit evidence","Precision edits and quantization, when effectful, must be attributable to exact input version, unit, canonical before/after values and deterministic rule."),
              ])

              d.add_heading("Cross-System Functional Chain",level=2)
              d.add_paragraph("Source/Blueprint Authority → Exact Timebase Resolution → CanonicalTimePoint → Page/Runtime Projection Unit → Authorized Edit/Read → Validation/Quantization if required → Version/Dependency Invalidation → Stage Evaluation → Human Confirm → Render/Lock → QA/Handoff. Any unresolved node fails closed; downstream consumers must not repair by guessing.")
              d.save(GLOBAL)

          # Package integrity and change manifest.
          for p in targets:
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad: raise SystemExit(f"ZIP_BAD {p} {bad}")
          changed=[x for x in subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",BASE],text=True).splitlines() if x.endswith(".docx")]
          if sorted(changed)!=sorted(str(x) for x in targets):
              raise SystemExit("MODIFIED_SCOPE_FAIL "+repr(changed))
          Path("__batch105_manifest.json").write_text(json.dumps({"modified_docx":changed},ensure_ascii=False,indent=2))
          print("BATCH105_WRITE_PASS="+json.dumps({"modified_docx":len(changed),"files":changed},ensure_ascii=False))
          PY
      - name: Structural and semantic validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          import re,json
          files={
            "EDIT":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS":"05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "GLOBAL":"ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          }
          def txt(fn):
              d=Document(fn); out=[p.text for p in d.paragraphs]
              for t in d.tables:
                  for r in t.rows: out.append(" | ".join(c.text for c in r.cells))
              return "\n".join(out)
          E=txt(files["EDIT"]); S=txt(files["SYS"]); G=txt(files["GLOBAL"])
          req_edit=[
            "[ACPOS-EDIT-01-GROUPED-PRECISION-TIMELINE-V1]",
            "EDIT-01-TG-VISUAL","EDIT-01-TG-AUDIO","EDIT-01-TG-DIALOGUE",
            "MILLISECOND / SUBFRAME / SAMPLE","time_numerator:int64","sample_index + sample_rate_hz",
            "LOCAL_WORKING_DRAFT_EXACT","DialogueTimingBinding","Website-structure Visual Preview",
            "ASSEMBLY","AUDIO","SYNC","FINALIZE","QA HANDOFF"
          ]
          req_sys=["[ACPOS-SYS05-EDIT-PRECISION-TIME-PIPELINE-V1]","CanonicalTimePoint","PrecisionEditContext","TIMEBASE_UNRESOLVED","CONVERSION_DRIFT_DETECTED","Grouped projection"]
          req_global=["[ACPOS-GLOBAL-CANONICAL-TIME-INTEGRATION-V1]","Single time truth","Display-unit independence","Cross-stage handoff","Failure propagation"]
          miss=[("EDIT",x) for x in req_edit if x not in E]+[("SYS",x) for x in req_sys if x not in S]+[("GLOBAL",x) for x in req_global if x not in G]
          if miss: raise SystemExit("REQUIRED_CONTRACT_MISSING "+repr(miss))
          forbidden=[
            ("EDIT",E,r"7\s*→\s*3\s*條真正合併"),
            ("EDIT",E,r"float seconds.*canonical"),
          ]
          # specific safety assertions
          if "Float seconds MUST NOT be the sole canonical value" not in E: raise SystemExit("FLOAT_SAFETY_MISSING")
          if "Video edit MUST remain frame-aligned" not in E: raise SystemExit("VIDEO_FRAME_BOUNDARY_MISSING")
          if "collapse/expand changes appearance only" not in E: raise SystemExit("VIEW_ONLY_COLLAPSE_MISSING")
          print("BATCH105_STRUCTURAL_PASS="+json.dumps({"required_contracts":"PASS","missing":0},sort_keys=True))
          PY
      - name: Render three modified Word files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __r105/pdf __r105/png
          while IFS= read -r f; do
            libreoffice --headless --convert-to pdf --outdir __r105/pdf "$f" >/tmp/lo105.log 2>&1 || { cat /tmp/lo105.log; exit 1; }
          done <<'EOF'
          ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx
          05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          EOF
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pdfs=sorted(Path("__r105/pdf").glob("*.pdf"))
          if len(pdfs)!=3: raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          pages={}; total=0
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","125",str(pdf),str(Path("__r105/png")/slug)])
              imgs=sorted(Path("__r105/png").glob(slug+"-*.png"))
              if not imgs: raise SystemExit(f"NO_PNG {pdf}")
              pages[pdf.name]=len(imgs); total+=len(imgs)
          Path("__batch105_render.json").write_text(json.dumps({"pdf_count":3,"png_count":total,"pages":pages},ensure_ascii=False,indent=2))
          print("BATCH105_RENDER_PASS="+json.dumps({"pdf_count":3,"png_count":total,"pages":pages},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch105-edit-grouped-precision-timeline
          path: |
            *.docx
            __r105/pdf/*.pdf
            __r105/png/*.png
            __batch105_manifest.json
            __batch105_render.json
          retention-days: 3
      - name: Commit and push upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __r105 __batch105_manifest.json __batch105_render.json
          git config user.name "acpos-batch105-design"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch105_edit_grouped_precision_timeline_upgrade.yml
          git add *.docx
          git commit -m "feat(acpos): upgrade EDIT grouped precision timeline design contracts"
          git push origin HEAD:0921acpos
