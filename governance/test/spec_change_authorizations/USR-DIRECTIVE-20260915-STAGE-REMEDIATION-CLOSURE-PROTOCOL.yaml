status: APPROVED_FOR_EXACT_SCOPE

exact_scope:
  - Add a normative governance component defining the mandatory test-remediation-rerun closure protocol for every lifecycle stage.
  - Require a full-line multidirectional high-pressure system gate to pass before each fresh physical-file/product stage test or retest.
  - Require every test-discovered remediable bug or gap to be corrected at its owning layer and materially eliminated; audit-only or repeated BLOCKED-only loops may not count as remediation or closure.
  - Require generated test/stage outputs and runtime evidence to be reset to the same clean predecessor baseline before a fresh rerun, while retaining authorized fixes at their owning source/specification/implementation layer.
  - Require reruns to prove previously discovered defect signatures are eliminated and to sweep for additional hidden defects before stage closure.
  - Prohibit advancement to the next stage while any remediable defect remains unresolved or any required closure artifact is absent.
  - Require the pilot full-lifecycle path to be corrected and closed across all stages before other pages consume the completed governance rule set at scale.
  - Bind the new component into Current Specification manifest and Registry with a new immutable governance UID in the same atomic mutation commit.

not_authorized:
  - Inventing product behavior, payloads, transitions, controls, API contracts, or authority solely to make a test pass.
  - Auto-resolving the eight preserved unresolved external authority references without authoritative resolution evidence.
  - Treating a successful audit that still reports a remediable product gap as remediation completion.
  - Marking a stage closed while a previously discovered remediable defect signature still reproduces.
  - Reusing this authorization for unrelated product behavior or future unrelated specification mutations.

provenance:
  conversation_instruction_summary: "User requires the governance process to be: full-line multidirectional high-pressure system test PASS, fresh physical-file actual test, discover bugs/gaps, correct them, update the governing rule when the defect exposes a reusable governance deficiency, reset test outputs to a clean predecessor baseline, rerun to verify the defect is actually gone and expose hidden defects, then only advance to the next stage; only after the full pilot lifecycle is corrected should other pages consume the completed governance system. Audit -> BLOCKED -> audit -> BLOCKED without material remediation is forbidden."
  ai_may_expand_scope: false
  ai_may_reuse_authorization: false
