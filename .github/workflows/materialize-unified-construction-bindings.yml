name: Materialize Unified Construction Binding Matrix

on:
  push:
    branches:
      - 0921acpos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Materialize unified matrix
        run: python __temp_tools__/materialize_unified_control_runtime_matrix.py
      - name: Validate unified matrix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from docx import Document
          marker='ACPOS-20260921-UNIFIED-CONTROL-RUNTIME-MATRIX'
          docs=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          assert len(docs)==9
          report=json.loads(Path('__authority_extract__/UNIFIED_CONSTRUCTION_BINDING_REPORT.json').read_text(encoding='utf-8'))
          assert len(report['targets'])==9
          zero=[]
          for p in docs:
              d=Document(p)
              text='\n'.join(x.text for x in d.paragraphs)
              assert marker in text, p.name
              assert 'Construction Lookup Invariant' in text, p.name
              rec=report['targets'][p.name]
              assert rec['status']=='UPDATED', rec
              if rec['rows']==0: zero.append(p.name)
          assert not zero, f'ZERO_UNIFIED_ROWS:{zero}'
          # every source page with an explicit control denominator must materialize at least one row
          for uid,p in report['pages'].items():
              assert p['control_rows'] >= 0
          print('PASS: unified construction matrix exists in 9/9 docs')
          print(json.dumps({k:v['rows'] for k,v in report['targets'].items()},ensure_ascii=False))
          PY
      - name: Commit unified matrices
        shell: bash
        run: |
          git config user.name "acpos-unified-binding"
          git config user.email "actions@users.noreply.github.com"
          git add 0[1-9]_ACPOS_*.docx __authority_extract__/UNIFIED_CONSTRUCTION_BINDING_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(acpos): add unified page-control-runtime construction matrix"
          git push
