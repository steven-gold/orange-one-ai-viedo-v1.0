name: VIS-08 STR-01 Static Validation

on:
  push:
    branches: [acpos-vis08-staging]
    paths:
      - src/i18n/strategyCatalog.ts
      - src/components/pages/StrategyVisual.tsx
      - src/components/pages/StrategyVisual.module.css
      - .github/workflows/vis08-static-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate STR-01 static authority bindings
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          tsx=Path('src/components/pages/StrategyVisual.tsx').read_text()
          cat=Path('src/i18n/strategyCatalog.ts').read_text()
          shell=Path('src/components/shell/AppShell.tsx').read_text()
          ids=re.findall(r's\("(STR-01-[^"]+)"',tsx)
          sections=set(re.findall(r'data-section-id="([^"]+)"',tsx))
          visuals=set(re.findall(r'data-visual-uid="([^"]+)"',tsx))
          components=set(re.findall(r'data-component-uid="([^"]+)"',tsx))
          labels=re.findall(r'\["(STR-01-[^"]+)",',cat)
          assert len(ids)==57 and len(set(ids))==57, (len(ids),len(set(ids)))
          assert len(labels)==57 and len(set(labels))==57, (len(labels),len(set(labels)))
          assert set(ids)==set(labels)
          assert len(sections)==12, len(sections)
          assert len(visuals)==12, len(visuals)
          assert len(components)==16, len(components)
          assert 'data-page-uid="workspace:STR-01"' in tsx
          assert 'data-authority-controls="57"' in tsx
          assert not Path('src/app/strategy/page.tsx').exists()
          nav8=re.search(r'\{ id: "NAV-08"[^\n]+',shell)
          assert nav8 and 'href:' not in nav8.group(0), nav8.group(0) if nav8 else 'missing NAV-08'
          forbidden=['ProviderModelPicker','ModelPicker','provider_model_picker','budget approval','publish control']
          for token in forbidden:
              assert token not in tsx
          print('VIS08_STATIC_PASS sections=12 visuals=12 components=16 controls=57 route=UNDEFINED_NOT_INVENTED')
          PY
      - name: Verify formal diff scope
        run: |
          git diff --name-only ee1f5e1e44cf8c897fd86a13370d2e0885fae3aa...HEAD | grep -v '^.github/workflows/vis08-static-validation.yml$' | sort > /tmp/actual
          printf '%s\n' 'src/components/pages/StrategyVisual.module.css' 'src/components/pages/StrategyVisual.tsx' 'src/i18n/strategyCatalog.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/vis08-static-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(vis08): remove temporary static validation workflow [skip ci]'
            git push origin HEAD:acpos-vis08-staging
          fi
