schema_version: 1
artifact_uid: GOV-COMP-STAGE-TEST-REMEDIATION-CLOSURE-PROTOCOL
artifact_type: GOVERNANCE_SPECIFICATION_COMPONENT
normative_status: ACTIVE_TEST_SPECIFICATION_COMPONENT
formal_current_authority: false
common_scope: PRODUCT_AND_SYSTEM_NEUTRAL

purpose:
  statement: Every lifecycle stage test must operate as a defect-elimination closure loop. Test discovery without material remediation is diagnostic only and may never be counted as stage progress or closure.
  primary_outcome: DISCOVERED_REMEDIABLE_DEFECTS_ARE_MATERIALLY_ELIMINATED_AND_PROVEN_NON_REPRODUCIBLE_BEFORE_STAGE_ADVANCE
  fail_closed: true

non_negotiable_principles:
  audit_pass_with_product_gap_still_present_is_remediation_success: false
  repeated_audit_blocked_loop_counts_as_progress: false
  discovered_remediable_gap_may_be_left_for_later_stage: false
  hidden_bug_search_required_after_known_bug_fix: true
  actual_test_must_be_fresh_from_clean_predecessor_baseline: true
  prior_test_result_may_be_reused_as_current_result: false
  ai_may_invent_missing_product_authority_to_close_gap: false
  external_authority_gap_may_be_auto_resolved: false

mandatory_stage_cycle:
  ordered_steps:
    - CLEAN_PREDECESSOR_BASELINE_RESET
    - FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_GATE
    - FRESH_PHYSICAL_FILE_STAGE_TEST
    - DEFECT_AND_GAP_ROOT_CAUSE_CLASSIFICATION
    - MATERIAL_REMEDIATION_AT_OWNING_LAYER
    - REUSABLE_GOVERNANCE_RULE_PROMOTION_WHEN_REQUIRED
    - TEST_OUTPUT_AND_RUNTIME_EVIDENCE_CLEAN_RESET
    - FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_REGRESSION
    - FRESH_PHYSICAL_FILE_STAGE_RETEST
    - KNOWN_DEFECT_SIGNATURE_ZERO_REPRODUCTION_CHECK
    - HIDDEN_DEFECT_MULTIDIRECTIONAL_SWEEP
    - STAGE_CLOSURE_DECISION
  order_may_be_skipped: false
  stage_advance_before_cycle_closure: BLOCK

clean_predecessor_baseline_reset:
  required_before_first_test_and_every_retest: true
  remove_generated_stage_outputs_from_prior_attempt: true
  remove_prior_attempt_runtime_evidence_from_active_input_path: true
  remove_cache_tmp_bak_pyc_and_other_execution_residue: true
  preserve_immutable_predecessor_authority_inputs: true
  preserve_authorized_fixes_at_their_owning_source_or_specification_layer: true
  rollback_meaning: RESET_TEST_OUTPUTS_AND_TEST_STATE_TO_THE_SAME_PREDECESSOR_BASELINE_NOT_REVERT_THE_FIX
  baseline_identity_receipt_required: true

pre_test_system_gate:
  gate: FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_GATE
  required_before_every_fresh_physical_stage_test_or_retest: true
  pass_required: true
  skip_timeout_partial_or_denominator_drift: FAIL
  governance_definition_pass_may_mark_product_stage_pass: false

fresh_physical_file_stage_test:
  actual_files_required: true
  stage_specific_loading_required: true
  prior_stage_test_result_reuse: FORBIDDEN
  previous_blocked_count_as_current_denominator_without_rescan: FORBIDDEN
  ai_autofill_to_make_test_pass: FORBIDDEN
  semantic_inference_without_registered_authority: FORBIDDEN
  fresh_result_receipt_required: true

defect_root_cause_classification:
  required_for_every_discovered_issue: true
  classes:
    SPECIFICATION_DEFECT:
      owner: GOVERNANCE_SPECIFICATION
      meaning: Reusable normative rule is missing, contradictory, incomplete, or permits recurrence.
    TEST_HARNESS_OR_VALIDATOR_BUG:
      owner: TEST_OR_VALIDATION_IMPLEMENTATION
      meaning: Normative rule is correct but the detector or execution harness is wrong.
    PRODUCT_MATERIALIZATION_OR_CONTRACT_GAP:
      owner: CURRENT_STAGE_PRODUCT_OR_CONTRACT_OUTPUT
      meaning: Required product behavior or contract is authorized but has not been materially represented at the owning stage.
    EXTERNAL_AUTHORITY_GAP:
      owner: EXTERNAL_OR_SHARED_AUTHORITY
      meaning: Required exact authority is absent and cannot be invented locally.
  one_primary_owner_required: true
  duplicate_finding_without_root_cause_update: BLOCK

material_remediation:
  required_for_every_remediable_defect: true
  audit_or_diagnosis_only: NOT_REMEDIATION
  evidence_only_without_owning_layer_change: NOT_REMEDIATION
  legal_elimination_count_zero_with_reproducible_remediable_gap: BLOCK_CLOSURE
  product_gap_with_sufficient_current_authority:
    action: MATERIALIZE_MINIMAL_AUTHORIZED_CLOSURE_AT_OWNING_STAGE
    bounded_completion_must_follow: BOUNDED_FUNCTIONAL_COMPLETION
    generic_feature_invention: FORBIDDEN
  harness_or_validator_bug:
    action: FIX_HARNESS_OR_VALIDATOR_WITHOUT_RELAXING_NORMATIVE_RULE
  external_authority_gap:
    action: PRESERVE_UNRESOLVED_AND_BLOCK_STAGE_UNTIL_AUTHORITATIVE_RESOLUTION
    ai_inference_or_autofill: FORBIDDEN
  remediation_receipt_must_identify:
    - defect_signature
    - owning_layer
    - changed_artifact_or_authoritative_resolution
    - before_state
    - after_state
    - regression_target

reusable_governance_rule_promotion:
  when_required: ROOT_CAUSE_CLASSIFIED_AS_SPECIFICATION_DEFECT_OR_GENERALIZABLE_RULE_DEFICIENCY
  stage_may_close_before_required_rule_is_normatively_captured: false
  finding_must_be_recorded_first: true
  mutation_control_ref: SPECIFICATION_MUTATION_CONTROL.yaml
  explicit_user_specification_change_directive_required: true
  atomic_uid_registry_manifest_update_required: true
  test_failure_alone_is_mutation_authority: false
  product_specific_data_may_be_promoted_as_generic_rule_without_evidence: false

retest_and_regression:
  reset_after_fix_required: true
  same_predecessor_baseline_identity_required: true
  full_line_system_regression_must_pass_before_retest: true
  fresh_stage_retest_required: true
  every_previous_remediable_defect_signature_must_reproduce_count: 0
  material_elimination_denominator_must_equal_discovered_remediable_denominator: true
  newly_discovered_defect_restarts_same_stage_cycle: true
  same_signature_reappears_after_claimed_fix:
    classification: REMEDIATION_FAILURE
    stage_state: BLOCKED
    completion_credit: 0
    required_action: REOPEN_ROOT_CAUSE_AND_FIX_OWNING_LAYER

hidden_defect_sweep:
  required_after_known_defect_signatures_reach_zero: true
  multidirectional: true
  negative_path: true
  boundary_and_dependency_paths: true
  state_transition_and_failure_paths: true
  payload_input_output_paths: true
  authority_and_permission_paths: true
  asynchronous_and_provider_paths_when_applicable: true
  no_new_blocking_defect_required_for_closure: true

stage_closure_gate:
  all_discovered_remediable_defects_materially_eliminated: REQUIRED
  previous_defect_signature_reproduction_count: 0
  new_blocking_defect_count: 0
  required_stage_outputs_complete: REQUIRED
  required_external_authority_resolved_or_formally_non_applicable: REQUIRED
  final_full_line_high_pressure_system_gate: PASS_REQUIRED
  fresh_stage_retest: PASS_REQUIRED
  hidden_defect_sweep: PASS_REQUIRED
  evidence_chain_complete: REQUIRED
  otherwise: BLOCK_STAGE_ADVANCE

pilot_to_scale_out_policy:
  pilot_scope_source: TEST_EXECUTION_STATE_DECLARED_PILOT_PAGE_SET
  pilot_must_complete_all_required_lifecycle_stages_before_scale_out: true
  final_full_line_system_gate_after_pilot_lifecycle_required: true
  known_defect_regression_shield_required: true
  other_pages_may_consume_completed_governance_before_pilot_full_lifecycle_closure: false
  repeated_known_defect_on_later_page:
    classification: GOVERNANCE_OR_MATERIALIZATION_REGRESSION
    stage_state: BLOCKED
    required_action: FIX_BEFORE_CONTINUING_PAGE_SCALE_OUT
  purpose: Stabilize the complete governance and stage-execution system on the pilot path before applying it broadly, so later pages do not repeatedly rediscover already-known structural defects.

required_evidence_classes:
  - CLEAN_BASELINE_RESET_RECEIPT
  - FULL_LINE_SYSTEM_HIGH_PRESSURE_RECEIPT
  - FRESH_STAGE_TEST_RECEIPT
  - DEFECT_ROOT_CAUSE_LEDGER
  - MATERIAL_REMEDIATION_RECEIPT
  - DEFECT_SIGNATURE_REGRESSION_RECEIPT
  - HIDDEN_DEFECT_SWEEP_RECEIPT
  - STAGE_CLOSURE_RECEIPT

status: ACTIVE
