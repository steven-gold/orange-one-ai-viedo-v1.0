name: ACPOS Batch 03 Remaining Gap Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - run: python __temp/batch_03_remaining_gap_audit.py
