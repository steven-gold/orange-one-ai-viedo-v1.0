name: Integrated Source Package Materialization
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: source-package-successor-materialization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Materialize internal derived source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python governance/source-successor/materialize_derived_source_package.py
          if git diff --quiet; then
            echo "No derived changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             .github/governance-source/active/source/10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml             .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py             .github/governance-source/active/source/11_EVIDENCE/audit/AUDIT_BASELINE.yaml             .github/governance-source/active/source/11_EVIDENCE/audit/generated/GOVERNANCE_REQUIREMENT_INDEX.json             .github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml             .github/governance-source/active/source/CHECKSUMS.sha256
          git commit -m "chore(source-candidate): materialize derived source package"
          git push origin HEAD:rebuild-v2.1.1
          gh workflow run source-package-successor-validation.yml --ref rebuild-v2.1.1
