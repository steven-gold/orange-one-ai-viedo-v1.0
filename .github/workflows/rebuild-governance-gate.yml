name: Governance v2.1.7 Prior-Stage Replay Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prior-stage-v216-segment-mapping-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify previous Segment Mapping checkpoint remains valid
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v216_workspace.py
  current-v217-phase-authority-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify legal Segment-to-Source-Fact predecessor state and downstream blocks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v217_phase_authority.py
  sealed-v216-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify predecessor sealed runtime remains exact
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_sealed_v216_runtime.py
