layout:
  desktop_min_width: 1280px
  vertical_scroll: Main Workspace height:auto; overflow-y:auto; independent from Global Sidebar/Menu height
  below_min_width: Keep min-width=1280px; allow horizontal scroll; do not invent alternate mobile page/workflow
  context_bar:
    width: 100%
    height: 56px
  primary_grid:
    columns: minmax(280px,1fr) minmax(720px,3fr) minmax(300px,1fr)
    approx: 20% / 60% / 20%
    gap: 16px
    align: start
  left_rail:
    min_width: 280px
    role: Scope / Source Health / Alert Feed
  center:
    min_width: 720px
    role: Fact Pack / Fact-Inference / Evidence / Source Detail
    priority: highest
  right_rail:
    min_width: 300px
    role: Freshness / Completeness / Confidence / Research Queue
  lower_rows: Context Candidate Review / Citation / Action Dock / Audit may extend full width
  tokens:
    control_height: 40px
    button_min_width: 88px
    primary_button_min_width: 120px
    button_radius: 10px
    panel_radius: 12px
    large_container_radius: 24px
    section_gap: 16px
    content_padding: 16px
    field_min_width: 120px
    status_badge_height: 28px
    action_gap: 8px
    touch_target_min: 44px × 44px
  visual_override: FORBIDDEN; inherit Global Visual tokens only
information_contract:
  knowledge_firewall_workflow: WF-KNOW-01
  canonical_states:
  - SOURCE_REGISTERED
  - INGESTION_PENDING
  - NORMALIZED
  - FACT_PACK
  - CONTEXT_CANDIDATE
  - REVIEW_REQUIRED
  - ADOPTED
  - REJECTED
  - RETIRED
  fact_minimum_contract:
  - source
  - source_time
  - scope
  - completeness
  - confidence
  - classification
  fact_inference_rules:
  - FACT and INFERENCE must be visibly separated; inference/recommendation must never be rendered as a fact.
  - A fact requires traceable source/evidence and source time in the authorized read model.
  - Stale information remains visibly STALE; it is not relabeled as a current fact.
  - Missing/incomplete source data remains incomplete; AI must not fabricate values.
  - No page-local numeric freshness/confidence/completeness threshold may be invented; render governed read-model/policy values.
  source_health_rules:
  - Source health is read-only operational data.
  - Authorization uses explicit Account Permission Assignment + scope + condition + classification masking + audit.
  - Provider secrets and unregistered owner database reads are never rendered.
  research_rules:
  - Research Queue / Research Run is visible as read-model status only.
  - INFO-01 does not invent a Start Research / Cancel Research action without a registered operation.
  - Research result must enter the evidence/fact/context-candidate governance path before it can be adopted.
fact_pack_contract:
  required_view_blocks:
  - Fact Pack identity/reference
  - FACT list
  - INFERENCE / Recommendation list when present
  - Evidence list
  - Source Metadata
  - Freshness
  - Completeness
  - Confidence
  - Citation
  selection_rule: In-page selection only; no parallel current fact-pack page is required.
  export_rule: Export uses registered exportProjection and authorized exact scope/projection request only.
  no_fake_metrics: true
context_candidate_contract:
  meaning: Evidence-backed external information packaged as a governed Context Candidate for review/adoption.
  visible_blocks:
  - Context Scope
  - Fact Selection
  - Citation Check
  - Candidate Preview
  - Adoption Review
  - Decision / Result
  adoption_rule: Adopt Context records governed context adoption only. It does not directly rewrite Project/Topic Canon, Lock, Priority, Budget,
    Task, Release or Publish.
  downstream_payload_boundary:
  - context_candidate
  - source_evidence
  - adoption_review_only
  decision_rule: adoptContextCandidate and decideCandidate remain separate registered operations. INFO-01 does not invent a local sequence or
    merge their state machines; server/state gates decide availability.
action_payload_contracts:
  common_effectful_context:
  - scope
  - expected_version
  - correlation_id
  - idempotency_key
  refreshProjection:
    schema: RefreshProjectionRequest
    additional_fields: Use registered Business Payload Registry only; do not infer page-union fields.
  searchProjection:
    schema: SearchProjectionRequest
    additional_fields: Use registered Business Payload Registry only; do not invent search parameters.
  exportProjection:
    schema: ExportProjectionRequest
    additional_fields:
    - projection_type
    - scope_ref
    - format
  adoptContextCandidate:
    schema: AdoptContextCandidateRequest
    additional_fields:
    - context_candidate_id
    - decision_reason
  decideCandidate:
    schema: DecideCandidateRequest
    additional_fields:
    - candidate_id
    - decision
