acceptance:
- acceptance_uid: DB-01-ACC-01
  item: Single Page / Global Visual
  condition: Only admin:DB-01 current database page; Global Shell/Visual inherited
- acceptance_uid: DB-01-ACC-02
  item: Read-only Data Model Viewer
  condition: No raw SQL, row editor, direct DDL or production data mutation control exists
- acceptance_uid: DB-01-ACC-03
  item: Exact Traceability
  condition: Task/Job/Asset/Review/Decision/Release can trace exact Project/Mother/Topic/Child/Boundary/Bridge/source refs
- acceptance_uid: DB-01-ACC-04
  item: Clickable Versions
  condition: Version/refs are exact selectable entities, not display-only M1/C1 aliases
- acceptance_uid: DB-01-ACC-05
  item: Immutable History
  condition: Prior canonical/published/locked versions are not updated or physically deleted
- acceptance_uid: DB-01-ACC-06
  item: Integrity
  condition: FK/ref existence, no orphan, version immutability, trace completeness and scope validation are visible
- acceptance_uid: DB-01-ACC-07
  item: Migration
  condition: Migration ID/checksum/approval/dependency/status are inspectable; execution/rollback absent from DB-01
- acceptance_uid: DB-01-ACC-08
  item: System Lifecycle Boundary
  condition: Schema/Production DB mutation routes to governed System Lifecycle / Change Management / Sandbox
- acceptance_uid: DB-01-ACC-09
  item: No Silent Repair
  condition: Broken/orphan refs become explicit findings; UI never rewrites refs or falls back to latest
- acceptance_uid: DB-01-ACC-10
  item: Permission / Classification
  condition: Read access uses explicit account permission/scope/classification; no role-name inference
- acceptance_uid: DB-01-ACC-11
  item: Scrollable Page
  condition: Main Workspace height:auto; overflow-y:auto; not tied to sidebar height
- acceptance_uid: DB-01-ACC-12
  item: Machine Binding
  condition: Every visible control resolves Section/Component/Visual/Action/Gate/Permission; unlisted=BLOCK
hard_locks:
- Only admin:DB-01 is the current database/data-model/traceability page defined by this authority.
- DB-01 is a governed read/debug workspace, not a generic CRUD database editor.
- No manual SQL console, raw row editor, direct DDL, direct Production DB write, migration execute or rollback button.
- Any schema/data mutation must use its owning Domain Service or System Lifecycle / Change Management / Sandbox path.
- All formal refs use exact IDs/versions/hashes/checksums; no latest/current/default or filename-based inference.
- Locked/published/history records are immutable; no physical delete of locked history.
- Broken/orphan/mismatched refs are shown explicitly; DB-01 must not silently repair them.
- Database/API/Schema code remains English; UI labels use ACPOS i18n resources.
- No fake table count, fake row count, fake migration status, fake checksum, fake health or fake integrity result; missing = —.
- No unlisted Section/Component/Control/Action/State/Gate/Permission/Port/Business Sample Data.
