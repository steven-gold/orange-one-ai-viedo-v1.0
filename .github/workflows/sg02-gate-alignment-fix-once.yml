name: ACPOS SG02 Gate Alignment Fix Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/sg02-gate-alignment-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-sg02-gate-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact Current Authority lifecycle gate correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server/shared/pageCatalogProjectionRuntime.ts')
          s=p.read_text()
          old='''  const first = versions[0] ?? null;\n  const [canConfigure, canApprove] = await Promise.all([\n'''
          new='''  const first = versions[0] ?? null;\n  const criteriaStatus = asText(first?.status);\n  const [canConfigure, canApprove] = await Promise.all([\n'''
          assert s.count(old)==1, f'SG02_FIRST_STATUS_PATCH_CARDINALITY_{s.count(old)}'
          s=s.replace(old,new,1)
          old_config='''      "CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE": canConfigure,\n'''
          new_config='''      "CTRL-ADMIN-SG-02-ACT-01-ACT-CONFIGURE": canConfigure && criteriaStatus === "DRAFT",\n'''
          assert s.count(old_config)==1, f'SG02_CONFIGURE_PATCH_CARDINALITY_{s.count(old_config)}'
          s=s.replace(old_config,new_config,1)
          old_approve='''      "CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE": canApprove,\n'''
          new_approve='''      "CTRL-ADMIN-SG-02-ACT-02-ACT-APPROVE": canApprove && criteriaStatus === "REVIEW",\n'''
          assert s.count(old_approve)==1, f'SG02_APPROVE_PATCH_CARDINALITY_{s.count(old_approve)}'
          s=s.replace(old_approve,new_approve,1)
          p.write_text(s)
          assert 'canConfigure && criteriaStatus === "DRAFT"' in s
          assert 'canApprove && criteriaStatus === "REVIEW"' in s
          PY
      - name: Remove temporary SG02 acceptance workflows and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gate25-sg02-effectful-controls-materialize-once.yml
          rm -f scripts/gate25-production-sg02-effectful-controls-diagnostic.mjs
          rm -f .github/workflows/sg02-gate-alignment-fix-once.yml
      - name: Install dependencies
        run: npm ci
      - name: Typecheck corrected runtime
        run: npm run typecheck
      - name: Validate SG02 release contracts
        run: node --test tests/release/sg02-quality-criteria-materialization.test.mjs tests/release/page-catalog-projection.test.mjs tests/release/gate25-sg02-readonly-acceptance.test.mjs
      - name: Commit clean SG02 lifecycle correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/shared/pageCatalogProjectionRuntime.ts
          git add -A .github/workflows scripts/gate25-production-sg02-effectful-controls-diagnostic.mjs
          git diff --cached --check
          git commit -m 'fix(gate25): align SG02 controls with criteria lifecycle'
          git push origin HEAD:new
