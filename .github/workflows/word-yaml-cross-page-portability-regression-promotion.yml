name: Word YAML Cross-Page Portability Regression Closure
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - "governance/test/spec_change_authorizations/USR-DIRECTIVE-20260923-WORD-YAML-CROSS-PAGE-PORTABILITY-REGRESSION-R3.yaml"
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Close missing cross-page source-projection portability regression
        run: python .github/governance-maintenance/promote_word_yaml_cross_page_portability_regression.py --mode promote
