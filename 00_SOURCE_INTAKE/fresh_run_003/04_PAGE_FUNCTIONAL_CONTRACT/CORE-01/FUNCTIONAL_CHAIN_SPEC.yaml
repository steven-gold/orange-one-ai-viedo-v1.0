    state_event: READY_FOR_MOTHER_REVIEW→IN_REVIEW | lock.review_requested
    exposure: CORE-01-ACT-MOTHER-LOCK-REQUEST; unresolved LockReview evidence/reviewer contract = BLOCK
    request_schema:
      schema_uid: CORE01-SCHEMA-MOTHER-LOCK-REQUEST
      path_params: []
      required:
      - project_version_ref
