name: Stage-02 Functional Remediability Classification R3

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - governance/ci/classify_current_stage2_functional_remediability_r3.py
      - .github/workflows/stage02-functional-remediability-classification-r3.yml

permissions:
  contents: write

jobs:
  classify-strict-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py
      - name: Validate Stage-02 successor state
        run: python governance/ci/validate_stage02_successor_integrity.py
      - name: Validate materialized Stage-02 structural root
        run: python governance/ci/validate_current_stage2_materialized_closure.py
      - name: Run missing-field-specific strict R3 classifier
        run: python governance/ci/classify_current_stage2_functional_remediability_r3.py
      - name: Prove formal Current Specification and immutable Stage-01 inputs unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: R3 mutated only non-normative classification evidence'
      - name: Commit R3 evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_FUNCTIONAL_REMEDIABILITY_CLASSIFICATION_R3.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R3 produced no evidence change' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist strict functional remediability classification R3'
          git push origin HEAD:rebuild-v2.1.1
      - name: Upload R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-functional-remediability-classification-r3
          path: governance/test/stage02/STAGE02_FUNCTIONAL_REMEDIABILITY_CLASSIFICATION_R3.yaml
          if-no-files-found: error
