 'ASSET-01-GATE-CONFIRM':wait&&s.evaluated&&!s.failed,'ASSET-01-GATE-LOCK':s.confirmed&&!s.handed_off,'ASSET-01-GATE-HANDOFF':s.locked&&!s.handed_off,'ASSET-01-GATE-RETRY':s.failed,'ASSET-01-GATE-COMPARE':s.compare_versions.length>=1&&s.compare_versions.length<=3};}
function projection(s:TestState){const output=s.output_version_id??s.output_artifact_id;return{
 page_state:s.page_state,task_id:s.task_id,output_version_id:s.output_version_id,layer_document_id:s.layer_document_id,layer_id:s.layer_id,patch_id:s.patch_id,
 values:{
  'ASSET-01-FLD-TASK-STATUS':s.task_status,'ASSET-01-FLD-STAGE':s.stage,'ASSET-01-FLD-MANIFEST-REQUIRED':'1','ASSET-01-FLD-MANIFEST-REUSE':s.output_version_id?'1':'0','ASSET-01-FLD-MANIFEST-MISSING':s.output_version_id?'0':'1','ASSET-01-FLD-MANIFEST-DEFERRED':'0',
