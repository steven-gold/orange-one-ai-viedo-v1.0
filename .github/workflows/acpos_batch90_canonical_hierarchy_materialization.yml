name: ACPOS Batch 90 Canonical Hierarchy Materialization
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch90_canonical_hierarchy_materialization.yml
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Apply canonical hierarchy and residual cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, zipfile, json
          from docx import Document
          from docx.table import _Row
          from copy import deepcopy

          EXPECTED_PARENT="6ff442df2ed61a562959828fe394e34fc4db1f86"
          WF=Path(".github/workflows/acpos_batch90_canonical_hierarchy_materialization.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")

          TARGETS={
            "DEV":Path("ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx"),
            "WB":Path("ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"),
            "IAM":Path("ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx"),
            "KB":Path("ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx"),
            "SYS":Path("ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"),
          }
          HIER_HEADERS=[
            "Parent Identity","Child Identity","Cardinality","Creation Entry",
            "Payload / Reference Binding","Ordering Semantics","Permission",
            "State Dependency","Version Dependency","Move / Reparent",
            "Archive / Delete Propagation","Upstream Change Impact",
            "Downstream Revalidation","Authority Evidence"
          ]

          def norm(s): return re.sub(r"\s+"," ",(s or "").strip())
          def headers(table): return [norm(c.text) for c in table.rows[0].cells] if table.rows else []
          def set_cell(cell,text):
              if not cell.paragraphs: cell.add_paragraph()
              p=cell.paragraphs[0]
              if p.runs:
                  p.runs[0].text=text
                  for r in p.runs[1:]: r.text=""
              else:
                  p.add_run(text)
              for extra in cell.paragraphs[1:]:
                  for r in extra.runs: r.text=""
          def set_row(row,vals):
              if len(row.cells)!=len(vals):
                  raise RuntimeError(f"ROW_WIDTH_FAIL {len(row.cells)} != {len(vals)}")
              for c,v in zip(row.cells,vals): set_cell(c,v)
          def find_tables(doc,expected):
              return [t for t in doc.tables if headers(t)==expected]
          def append_table_after(doc, after_table, rows):
              t=doc.add_table(rows=1, cols=len(HIER_HEADERS))
              t.style=after_table.style
              set_row(t.rows[0],HIER_HEADERS)
              for vals in rows:
                  set_row(t.add_row(),vals)
              after_table._tbl.addnext(t._tbl)
              return t

          # DEV: remove residual compound display labels; no entity semantics change.
          doc=Document(TARGETS["DEV"])
          changed=0
          for t in doc.tables:
              for row in t.rows:
                  for c in row.cells:
                      if norm(c.text)=="Campaign / Audience":
                          set_cell(c,"Campaign with Audience Projection"); changed+=1
                      elif norm(c.text)=="Discovery Profile / Topic":
                          set_cell(c,"Discovery Profile with Topic Filter"); changed+=1
          if changed!=2: raise RuntimeError(f"DEV_DISPLAY_REWRITE_COUNT {changed}")
          doc.save(TARGETS["DEV"])

          # WB: keep read-projection matrix but remove it from Business Entity canonical header namespace.
          doc=Document(TARGETS["WB"])
          tabs=find_tables(doc,["Entity","Operation","Applicability","Authority Evidence"])
          if len(tabs)!=1: raise RuntimeError(f"WB_MATRIX_COUNT {len(tabs)}")
          set_cell(tabs[0].rows[0].cells[0],"Projection / Read Model")
          doc.save(TARGETS["WB"])

          # IAM: preserve legacy summary as evidence-only and add canonical BE hierarchy for true entities only.
          doc=Document(TARGETS["IAM"])
          tabs=find_tables(doc,["Parent","Child / Relation","責任邊界"])
          if len(tabs)!=1: raise RuntimeError(f"IAM_LEGACY_COUNT {len(tabs)}")
          legacy=tabs[0]
          set_row(legacy.rows[0],["Relationship Context","Related Object / Relation","責任邊界"])
          iam_rows=[
            [
              "ACCOUNT","PERMISSION-DRAFT","1:0..1 current draft context",
              "Open Create/Edit in same-page 3-Step flow; Draft context is created/preserved before Preview/Complete.",
              "account_id + registered schema context + selected L1 draft + correlation/idempotency context",
              "Step order Basic Data → L1 Permission → Preview/Complete; manual REORDER is NOT_APPLICABLE.",
              "IAM-01-GATE-MANAGE + IAM-01-GATE-DRAFT; iam.permission.configure; fail closed.",
              "Account exists/current; registered schema resolvable; draft remains non-effective until apply.",
              "Exact account/draft context; apply requires fresh preview + expected_version + idempotency/state guard.",
              "NOT_APPLICABLE — draft stays bound to the selected Account.",
              "NO_CASCADE — closing/restarting edit context does not delete Account or audit truth.",
              "Account/schema/permission-source change invalidates stale Draft/Preview assumptions.",
              "Fresh validation + authorization-impact preview required before Complete.",
              "IAM-01 Table 5 Account→Permission Draft; Tables 9,20,21,22; Table 24 Data Truth; Mother §71."
            ],
            [
              "ACCOUNT","PERM-ASSIGNMENT","1:N",
              "Complete Apply expands current L1 draft to exact resource/action assignments and invokes assign/revoke operations.",
              "accountId + exact resource/action + expected_version + idempotency + actor/correlation + delta",
              "Assignment set has no user-managed order; REORDER is NOT_APPLICABLE.",
              "IAM-01-GATE-COMPLETE + exact action authorization; iam.permission.configure; fail closed.",
              "Fresh Preview, no blocker, explicit confirm, exact account state; Assignment is effective only after successful apply.",
              "expected_version + current effective-permission snapshot; stale preview/version blocks apply.",
              "NOT_APPLICABLE — assignment is owned by the target Account/resource/action tuple.",
              "NO_CASCADE — removal is explicit revoke; audit/correlation history is preserved.",
              "Draft/L1 mapping or Account permission change recomputes delta and invalidates stale preview.",
              "Refresh effective permission and Admin navigation; partial apply remains non-final and only missing delta may retry.",
              "IAM-01 Tables 18-25; /v1/iam/accounts/{accountId}/permissions; Table 5 L1 choice→Explicit Permission Assignments; Mother §71."
            ]
          ]
          append_table_after(doc, legacy, iam_rows)
          doc.save(TARGETS["IAM"])

          # KB: preserve legacy source/derived summary as evidence-only; canonical hierarchy uses only true BE identities.
          doc=Document(TARGETS["KB"])
          tabs=find_tables(doc,["父層 / Source","子層 / Derived Object","強制關係"])
          if len(tabs)!=1: raise RuntimeError(f"KB_LEGACY_COUNT {len(tabs)}")
          legacy=tabs[0]
          set_row(legacy.rows[0],["Source Context","Derived Object / Relation","強制關係"])
          kb_rows=[
            [
              "KnowledgeSource","Acquisition Run","1:N",
              "Submit KnowledgeAcquisitionIntent value object to Shared Acquisition Runtime; create/retry governed Acquisition Run.",
              "source_ref + scope + acquisition_mode + correlation_id + idempotency_key; Runtime owns fetch/retry/snapshot/dedupe.",
              "Run creation/attempt sequence; manual REORDER is NOT_APPLICABLE.",
              "knowledge.source.read + knowledge.ingestion.execute + authorized scope/rights/classification; fail closed.",
              "KnowledgeSource must be current and allowed by rights/classification/state; retired source cannot silently restart.",
              "Exact source_ref/source version + run identity/checkpoint; historical run evidence remains immutable.",
              "NOT_APPLICABLE — Run stays bound to its source_ref.",
              "NO_CASCADE — retiring Source does not delete immutable Run/Snapshot/Evidence history.",
              "Source scope/rights/classification/version change invalidates future-run assumptions and affected unresolved consumers.",
              "Fresh run/consumer verification required where source authority materially changes; historical evidence is preserved.",
              "KB-01 Tables 5,7,11,13,15,17-20; CreateKnowledgeAcquisitionIntentRequest; Mother §71."
            ],
            [
              "Experience / Replay","Learning Candidate","N:M via experience_refs",
              "Create Learning Candidate only from real execution with OUTCOME_COMPLETE and resolvable lineage.",
              "experience_refs + scope + pattern + proposed_improvement + evidence_refs + limitations + correlation/idempotency",
              "No user-managed sibling order; REORDER is NOT_APPLICABLE.",
              "knowledge.experience.read + knowledge.learning.create; exact scope/evidence gate; fail closed.",
              "Experience outcome must be complete; missing real outcome forbids learning creation.",
              "Exact experience/evidence refs and lineage; supersession preserves prior evidence.",
              "NOT_APPLICABLE — candidate references exact Experience records; no reparent operation is authorized.",
              "NO_CASCADE — Experience remains immutable; Learning Candidate may be superseded/rejected by its owner.",
              "Material evidence/outcome correction requires candidate impact review and invalidates unsupported assumptions.",
              "Affected Learning Candidate review/adoption evidence becomes REVERIFY_REQUIRED before downstream governance use.",
              "KB-01 Tables 5,7,11,13,15,17-20; CreateACPOSLearningCandidateRequest; Mother §71."
            ],
            [
              "Experience / Replay","KnowledgeVersion","N:M evidence lineage",
              "Create Knowledge Draft/Version from Experience, then save draft and enter mandatory Human Review.",
              "exact experience/evidence refs + knowledge_id + expected_version + title/type/scope/classification + citations/outcomes",
              "Version sequence is governed; manual REORDER is NOT_APPLICABLE.",
              "knowledge.experience.read + knowledge draft/review permissions + mandatory review gates; fail closed.",
              "Real Experience/outcome evidence must resolve; KnowledgeVersion follows DRAFT→REVIEW→APPROVED/RETURNED/REJECTED→SUPERSEDED/RETIRED.",
              "expected_version + exact prior approved version + evidence/citation refs; Approved version is immutable.",
              "NOT_APPLICABLE — new version supersedes exact prior; reparent is not an authorized operation.",
              "NO_CASCADE — supersession/retirement preserves prior approved version and evidence lineage.",
              "Changed experience/citation/outcome before approval requires diff/impact review; approved immutable versions are not overwritten.",
              "Mandatory checks + Human Review rerun for impacted Draft/Review candidate before approval.",
              "KB-01 Tables 5,7,11,13,15,17-20; SaveKnowledgeDraftRequest + Knowledge APPROVE gate; Mother §71."
            ]
          ]
          append_table_after(doc, legacy, kb_rows)
          doc.save(TARGETS["KB"])

          # SYS: pivot existing field/value evidence into canonical 14-column hierarchy for true BE edges only.
          doc=Document(TARGETS["SYS"])
          sum_tabs=find_tables(doc,["Parent","Child","Cardinality","Creation / Bind","Impact & Revalidation"])
          fv_tabs=find_tables(doc,["Parent","Child","Field","Value","Authority Evidence"])
          if len(sum_tabs)!=1 or len(fv_tabs)!=1:
              raise RuntimeError(f"SYS_SOURCE_TABLE_COUNT summary={len(sum_tabs)} fieldvalue={len(fv_tabs)}")
          summary=sum_tabs[0]; fv=fv_tabs[0]
          set_row(summary.rows[0],["Relationship Context","Related Object","Cardinality","Creation / Bind Summary","Impact & Revalidation Summary"])
          set_row(fv.rows[0],["Relationship Context","Related Object","Field","Value","Authority Evidence"])

          # Build field-value map.
          fmap={}
          for row in fv.rows[1:]:
              vals=[norm(c.text) for c in row.cells]
              if len(vals)<5: continue
              p,c,f,v,e=vals[:5]
              fmap.setdefault((p,c),{})[f]=(v,e)

          sys_pairs=[
            ("System Change","Change Candidate"),
            ("System Change","Decision Record"),
            ("System Change","Validation Run"),
          ]
          sys_rows=[]
          field_map=[
            ("Cardinality","Cardinality"),
            ("Creation Entry","Creation Entry"),
            ("Payload / Reference Binding","Payload / Reference Binding"),
            ("Ordering Semantics","Ordering Semantics"),
            ("Permission","Permission"),
            ("State Dependency","State Dependency"),
            ("Version Dependency","Version Dependency"),
            ("Move / Reparent","Move / Reparent"),
            ("Archive / Delete Propagation","Archive / Delete Propagation"),
            ("Upstream Change Impact","Upstream Change Impact"),
            ("Downstream Revalidation","Downstream Revalidation"),
          ]
          for p,c in sys_pairs:
              m=fmap.get((p,c),{})
              missing=[src for _,src in field_map if src not in m]
              if missing: raise RuntimeError(f"SYS_FIELD_MISSING {p}->{c}: {missing}")
              vals=[p,c]
              vals += [m[src][0] for _,src in field_map]
              evs=sorted(set(m[src][1] for _,src in field_map if m[src][1]))
              vals.append(" | ".join(evs))
              if len(vals)!=14: raise RuntimeError(f"SYS_ROW_WIDTH {len(vals)}")
              sys_rows.append(vals)
          append_table_after(doc, fv, sys_rows)
          doc.save(TARGETS["SYS"])

          # Integrity and exact write set.
          for p in TARGETS.values():
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad: raise RuntimeError(f"ZIP_BAD {p} {bad}")

          changed=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          expected=sorted([str(p) for p in TARGETS.values()]+[str(WF)])
          if sorted(changed)!=expected:
              raise SystemExit("WRITE_SET_FAIL expected="+repr(expected)+" actual="+repr(sorted(changed)))
          print("BATCH90_PATCH_PASS")
          PY
      - name: Structural verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from docx import Document
          import re,json
          H=[
            "Parent Identity","Child Identity","Cardinality","Creation Entry",
            "Payload / Reference Binding","Ordering Semantics","Permission",
            "State Dependency","Version Dependency","Move / Reparent",
            "Archive / Delete Propagation","Upstream Change Impact",
            "Downstream Revalidation","Authority Evidence"
          ]
          def n(s):return re.sub(r"\s+"," ",(s or "").strip())
          def hs(t):return [n(c.text) for c in t.rows[0].cells] if t.rows else []
          result={}
          # WB canonical BE header must be gone.
          wb=Document("ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx")
          assert sum(1 for t in wb.tables if hs(t)==["Entity","Operation","Applicability","Authority Evidence"])==0
          assert sum(1 for t in wb.tables if hs(t)==["Projection / Read Model","Operation","Applicability","Authority Evidence"])==1
          result["WB_PROJECTION_MATRIX"]=1

          dev=Document("ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx")
          flat=[n(c.text) for t in dev.tables for r in t.rows for c in r.cells]
          assert "Campaign / Audience" not in flat and "Discovery Profile / Topic" not in flat
          result["DEV_COMPOUND_RESIDUAL"]=0

          for page,fn,expected_rows in [
            ("IAM","ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",2),
            ("KB","ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",3),
            ("SYS","ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",3),
          ]:
              d=Document(fn)
              tabs=[t for t in d.tables if hs(t)==H]
              assert len(tabs)==1,(page,len(tabs))
              assert len(tabs[0].rows)-1==expected_rows,(page,len(tabs[0].rows)-1)
              for r in tabs[0].rows[1:]:
                  vals=[n(c.text) for c in r.cells]
                  assert len(vals)==14 and all(vals),(page,vals)
              result[page+"_CANONICAL_HIERARCHY"]=expected_rows

          # Old parallel parent/child canonical-looking headers must be gone.
          for fn in [
            "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
          ]:
              d=Document(fn)
              for t in d.tables:
                  h=" | ".join(hs(t)).upper()
                  if hs(t)==H: continue
                  assert not (("PARENT" in h and "CHILD" in h) or ("父" in h and "子" in h)),(fn,hs(t))
          result["PARALLEL_HIERARCHY_HEADERS"]=0
          print("BATCH90_STRUCTURAL_PASS="+json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
      - name: Render modified DOCX
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fi
          mkdir -p __render90/pdf __render90/png
          for f in             "ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx"             "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx"             "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx"             "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"; do
              libreoffice --headless --convert-to pdf --outdir __render90/pdf "$f" >/tmp/lo90.log 2>&1 || { cat /tmp/lo90.log; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          pdfs=sorted(Path("__render90/pdf").glob("*.pdf"))
          if len(pdfs)!=5: raise SystemExit(f"PDF_COUNT_FAIL {len(pdfs)}")
          counts={}
          for pdf in pdfs:
              slug=re.sub(r"[^A-Za-z0-9_.-]+","_",pdf.stem)
              subprocess.check_call(["pdftoppm","-png","-r","110",str(pdf),str(Path("__render90/png")/slug)])
              counts[pdf.name]=len(list(Path("__render90/png").glob(slug+"-*.png")))
          pngs=list(Path("__render90/png").glob("*.png"))
          if not pngs: raise SystemExit("NO_RENDER_PNG")
          Path("__batch90_render_manifest.json").write_text(json.dumps({"pdf_count":len(pdfs),"png_count":len(pngs),"pages":counts},ensure_ascii=False,indent=2))
          print("BATCH90_RENDER="+json.dumps({"pdf_count":len(pdfs),"png_count":len(pngs),"pages":counts},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch90-hierarchy-materialization-render
          path: |
            __render90/pdf/*.pdf
            __render90/png/*.png
            __batch90_render_manifest.json
          retention-days: 2
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __render90 __batch90_render_manifest.json
          git config user.name "acpos-batch90-materializer"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch90_canonical_hierarchy_materialization.yml
          git add             "ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx"             "ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx"             "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx"             "ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx"             "ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx"
          git commit -m "fix(acpos): canonicalize entity hierarchy and remove residual false denominators"
          git push origin HEAD:0921acpos
