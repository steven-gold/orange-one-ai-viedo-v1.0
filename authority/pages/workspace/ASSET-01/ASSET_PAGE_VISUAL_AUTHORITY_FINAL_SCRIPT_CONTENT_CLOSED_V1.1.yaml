  - section_uid: ASSET-01-SEC-02
    name: Asset Manifest / List
    responsibility: 目前 Task 的素材需求、Reuse/Missing 狀態、素材清單與搜尋；不建立自由素材 Picker
    visual_uid: ASSET-01-VIS-LEFT
  - section_uid: ASSET-01-SEC-03
    name: Blueprint / Script / DNA Binding
    responsibility: Locked Blueprint、ASSET Script Role/Section、DNA、Manifest Item、Canonical Filename、Checksum、Rights/Policy 唯讀綁定
