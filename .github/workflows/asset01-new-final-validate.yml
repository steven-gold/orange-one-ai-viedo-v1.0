name: ASSET01 New Final Validate
on:
  push:
    branches: [new]
    paths: ['.github/workflows/asset01-new-final-validate.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Verify clean product parent and scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9fe74297643db4a5cbc33f65a0e68cd3c5724720"
          test "$(git hash-object src/components/pages/AssetVisual.module.css)" = "80220b164df59a3a4d03ee3ac6886b844d785552"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          git diff --exit-code 3924f6594cde11f5439aaeddf6b6bdc33faa58d5 9fe74297643db4a5cbc33f65a0e68cd3c5724720 -- authority/
          python3 - <<'PY'
          import subprocess
          expected = {
            'src/components/pages/AssetControlRuntime.tsx',
            'src/components/pages/AssetVisual.tsx',
            'src/domain/asset/assetClientPort.ts',
            'src/domain/asset/assetClientState.ts',
            'src/domain/asset/assetProjectionPort.ts',
            'src/domain/asset/assetRequestAdapter.ts',
            'src/domain/asset/controlledAssetClientTestRuntime.ts',
            'src/server/asset/assetRuntime.ts',
            'src/server/shared/departmentRouteFactory.ts',
            'src/server/shared/uiProjectionRuntime.ts',
            'src/server/testing/controlledAssetTestRuntime.ts',
          }
          actual = set(subprocess.check_output([
            'git','diff','--name-only',
            '3924f6594cde11f5439aaeddf6b6bdc33faa58d5',
            '9fe74297643db4a5cbc33f65a0e68cd3c5724720'
          ], text=True).splitlines())
          assert actual == expected, f'scope mismatch: missing={expected-actual}, extra={actual-expected}'
          print('ASSET01_NEW_CLEAN_SCOPE_PASS files=11')
          PY
      - name: Install audit typecheck and TEST build
        run: |
          set -euo pipefail
          npm ci
          npm audit
          npm run typecheck
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=TEST npm run build
      - name: Load exact validated browser test and Chromium
        run: |
          set -euo pipefail
          git fetch origin b94ebe63d7285eac2fdd3715f6cccad43dbbaa76
          git show b94ebe63d7285eac2fdd3715f6cccad43dbbaa76:scripts/asset01-staging-e2e.mjs > scripts/.asset01-new-e2e.mjs
          test "$(git hash-object scripts/.asset01-new-e2e.mjs)" = "0a4360fff51e3a47233cbdb6b77e59ec6103671d"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser E2E on clean new product tree
        run: |
          set -euo pipefail
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=TEST npm run start -- -H 127.0.0.1 -p 3000 >/tmp/asset-new.log 2>&1 &
          echo $! >/tmp/asset-new.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/assets >/dev/null && break; sleep 1; done
          node scripts/.asset01-new-e2e.mjs
          kill $(cat /tmp/asset-new.pid) || true
      - name: Production fail closed on new
        run: |
          set -euo pipefail
          rm -rf .next
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=PRODUCTION npm run build
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=PRODUCTION npm run start -- -H 127.0.0.1 -p 3001 >/tmp/asset-new-prod.log 2>&1 &
          echo $! >/tmp/asset-new-prod.pid
          for i in $(seq 1 60); do curl -sS http://127.0.0.1:3001/assets >/dev/null && break; sleep 1; done
          code=$(curl -sS -o /tmp/proj.json -w '%{http_code}' http://127.0.0.1:3001/v1/ui-projections/ASSET-01)
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/proj.json
          code=$(curl -sS -o /tmp/exec.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-asset-action-uid: ASSET-01-ACT-FLOW-START' --data '{}' http://127.0.0.1:3001/v1/tasks/TEST-ASSET-TASK-001/execute)
          test "$code" = "503"
          grep -q 'ASSET_RUNTIME_NOT_BOUND' /tmp/exec.json
          kill $(cat /tmp/asset-new-prod.pid) || true
          echo ASSET01_NEW_PRODUCTION_FAIL_CLOSED_PASS
      - name: Final residual audit
        run: |
          set -euo pipefail
          npm ci
          npm audit
          rm -f scripts/.asset01-new-e2e.mjs
          git restore --source=HEAD --worktree -- next-env.d.ts tsconfig.json
          test "$(git hash-object src/components/pages/AssetVisual.module.css)" = "80220b164df59a3a4d03ee3ac6886b844d785552"
          git diff --exit-code 3924f6594cde11f5439aaeddf6b6bdc33faa58d5 9fe74297643db4a5cbc33f65a0e68cd3c5724720 -- authority/
          if grep -RniE 'TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|debugger|console\.debug' src/domain/asset src/server/asset src/server/testing/controlledAssetTestRuntime.ts src/components/pages/AssetControlRuntime.tsx src/components/pages/AssetVisual.tsx; then exit 1; fi
          test -z "$(git status --porcelain -- next-env.d.ts tsconfig.json scripts/.asset01-new-e2e.mjs)"
          echo ASSET01_NEW_RESIDUAL_PASS
      - name: Self-clean validation workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/asset01-new-final-validate.yml
          git commit -m 'chore: remove ASSET01 new final validation workflow'
          git push origin HEAD:new
