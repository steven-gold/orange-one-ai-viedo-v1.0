name: Product Stage01 Validated Entry Orchestrator
on:
  push:
    branches: [0921acpos]
    paths:
      - 'STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml'
      - '.github/workflows/product-stage01-validated-entry.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: product-stage01-validated-entry
  cancel-in-progress: false

jobs:
  enter-stage01:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve pending request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml
          p=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml')
          if not p.is_file():
              print('requested=false')
              raise SystemExit(0)
          d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          if d.get('status')!='REQUESTED':
              print('requested=false')
              raise SystemExit(0)
          units=d.get('units') or []
          if isinstance(units,str):
              units=[x.strip() for x in units.split(',') if x.strip()]
          expected=['GLOBAL-HOME-SHELL-NAVIGATION','WB01-DASHBOARD']
          if units!=expected:
              raise SystemExit('BLOCK:STAGE01_REQUEST_UNIT_SET_DRIFT:'+repr(units))
          if d.get('auto_enter_stage01') is not True:
              raise SystemExit('BLOCK:STAGE01_AUTO_ENTER_NOT_AUTHORIZED')
          if d.get('future_stage_preproduction')!='FORBIDDEN':
              raise SystemExit('BLOCK:FUTURE_STAGE_PREPRODUCTION_POLICY_DRIFT')
          effectful=list(map(str,d.get('effectful_stage_range') or []))
          if effectful!=['STAGE-01','STAGE-02','STAGE-03','STAGE-04']:
              raise SystemExit('BLOCK:EFFECTFUL_STAGE_RANGE_DRIFT:'+repr(effectful))
          print('requested=true')
          print('units='+','.join(units))
          print('work_units=WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001,WU-STAGE01-WB01-DASHBOARD-CLEAN-001')
          PY

      - name: Stop when request is already consumed
        if: steps.request.outputs.requested != 'true'
        run: echo "No pending Stage01 validated-entry request."

      - name: Resolve exact selected Current governance
        if: steps.request.outputs.requested == 'true'
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          test -s "$SEL"
          STATUS="$(awk '$1=="status:" {print $2; exit}' "$SEL")"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          test "$STATUS" = "SELECTED_EXACT_CURRENT_SNAPSHOT"
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Current governance
        if: steps.request.outputs.requested == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1

      - name: Set up Python
        if: steps.request.outputs.requested == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Load exact Current governance runtime
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock

      - name: Full lifecycle pre-entry gate on request head
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          (
            cd _governance_authority
            python governance/ci/stage_execution_engine.py --definition-audit-all
            python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          )
          python -m py_compile             .github/scripts/full_stage_lifecycle_guard.py             .github/scripts/stage_lifecycle_gate.py             .github/scripts/current_stage_execute.py             .github/scripts/common_stage_closure.py             .github/scripts/common_stage_closure_adapter.py             .github/scripts/common_stage_terminalizer.py             .github/scripts/common_successor_materialize.py             .github/scripts/common_successor_work_unit_builder.py             .github/scripts/stage01_current_materialize.py
          python .github/scripts/common_stage_closure_adapter.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_successor_work_unit_builder.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_stage_terminalizer.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/stage_lifecycle_gate.py --mode self-test --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/full_stage_lifecycle_guard.py --mode execution-ready --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"

      - name: Materialize fresh Stage01 pre-stage from canonical Word
        if: steps.request.outputs.requested == 'true'
        env:
          SELECTED_UNITS: ${{ steps.request.outputs.units }}
        run: |
          set -euo pipefail
          python .github/scripts/stage01_current_materialize.py             --mode materialize             --units "$SELECTED_UNITS"             --product-root "$GITHUB_WORKSPACE"             --governance-root "$GITHUB_WORKSPACE/_governance_authority"

      - name: Bind Current governance and prove Stage01 admission
        if: steps.request.outputs.requested == 'true'
        env:
          SELECTED_WUS: ${{ steps.request.outputs.work_units }}
          SELECTED_UNITS: ${{ steps.request.outputs.units }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra WUS <<< "$SELECTED_WUS"
          for WU in "${WUS[@]}"; do
            python .github/scripts/product_current_governance_load.py               --product-root "$GITHUB_WORKSPACE"               --governance-root "$GITHUB_WORKSPACE/_governance_authority"               --stage STAGE-01               --work-unit "STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
          done
          python .github/scripts/stage01_current_materialize.py             --mode refresh-manifest             --units "$SELECTED_UNITS"             --product-root "$GITHUB_WORKSPACE"
          export GOVERNANCE_SOURCE_ROOT="$GITHUB_WORKSPACE/_governance_authority"
          for WU in "${WUS[@]}"; do
            export STAGE_EXECUTION_ROOT="$GITHUB_WORKSPACE"
            export STAGE_ACTIVE_WORK_UNIT="STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
            export STAGE_CURRENT_SCOPE="STAGE_EXECUTION/STAGE-01/$WU/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"
            python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-01
          done
          python .github/scripts/stage01_current_materialize.py             --mode mark-admitted             --units "$SELECTED_UNITS"             --product-root "$GITHUB_WORKSPACE"

      - name: Prove no future-stage preproduction and zero operation credit
        if: steps.request.outputs.requested == 'true'
        env:
          SELECTED_WUS: ${{ steps.request.outputs.work_units }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,yaml
          governed={'GLOBAL-HOME-SHELL-NAVIGATION','workspace:WB-01'}
          for stage in [f'STAGE-{i:02d}' for i in range(2,12)]:
              root=Path('STAGE_EXECUTION')/stage
              if not root.exists():
                  continue
              for wp in root.glob('WU-*/WORK_UNIT.yaml'):
                  d=yaml.safe_load(wp.read_text(encoding='utf-8')) or {}
                  if d.get('governed_unit_uid') in governed:
                      raise SystemExit('BLOCK:FUTURE_STAGE_WORK_UNIT_PREPRODUCED:'+str(wp))
          for wu in os.environ['SELECTED_WUS'].split(','):
              root=Path('STAGE_EXECUTION/STAGE-01')/wu
              state=yaml.safe_load((root/'EXECUTION_STATE.yaml').read_text()) or {}
              assert state.get('completed_operations')==[], (wu,state.get('completed_operations'))
              assert state.get('current_operation')=='SOURCE_STRUCTURE_ENUMERATION', (wu,state.get('current_operation'))
              receipts=root/'EVIDENCE/OPERATION_RECEIPTS'
              assert not receipts.exists() or not any(receipts.iterdir()), wu
          print('PASS: Stage01 prestage has zero effectful operation credit and no Stage02-11 preproduction')
          PY

      - name: Mark request consumed by validated pre-stage materialization
        if: steps.request.outputs.requested == 'true'
        env:
          SOURCE_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,yaml
          p=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          d['status']='CONSUMED'
          d['validated_head_sha']=os.environ['SOURCE_HEAD']
          d['validation_run_id']=os.environ['RUN_ID']
          d['prestage_materialization_result']='PASS'
          d['effectful_entry_status']='PENDING_MATERIALIZED_HEAD_REVALIDATION'
          p.write_text(yaml.safe_dump(d,sort_keys=False,allow_unicode=True),encoding='utf-8')
          PY

      - name: Persist Stage01 pre-stage by compare-and-swap
        if: steps.request.outputs.requested == 'true'
        id: persist_prestage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 0921acpos --depth=1
          test "$(git rev-parse origin/0921acpos)" = "${{ github.sha }}" || {
            echo "BLOCK:REMOTE_ADVANCED_BEFORE_PRESTAGE_PERSIST"
            exit 52
          }
          git add STAGE_EXECUTION/STAGE-01 STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW
          git diff --cached --quiet && { echo "BLOCK:NO_PRESTAGE_DELTA"; exit 53; }
          git commit -m "stage01: persist validated clean pre-stage materialization"
          NEW_HEAD="$(git rev-parse HEAD)"
          git push origin HEAD:0921acpos
          echo "materialized_head=$NEW_HEAD" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact materialized Stage01 head
        if: steps.request.outputs.requested == 'true'
        env:
          SELECTED_WUS: ${{ steps.request.outputs.work_units }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.persist_prestage.outputs.materialized_head }}"
          python .github/scripts/full_stage_lifecycle_guard.py --mode execution-ready --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/stage_lifecycle_gate.py --mode self-test --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          export GOVERNANCE_SOURCE_ROOT="$GITHUB_WORKSPACE/_governance_authority"
          IFS=',' read -ra WUS <<< "$SELECTED_WUS"
          for WU in "${WUS[@]}"; do
            export STAGE_EXECUTION_ROOT="$GITHUB_WORKSPACE"
            export STAGE_ACTIVE_WORK_UNIT="STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
            export STAGE_CURRENT_SCOPE="STAGE_EXECUTION/STAGE-01/$WU/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"
            python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-01
          done

      - name: Execute first registered Stage01 operation checkpoint
        if: steps.request.outputs.requested == 'true'
        env:
          SELECTED_WUS: ${{ steps.request.outputs.work_units }}
        run: |
          set -euo pipefail
          python .github/scripts/current_stage_execute.py             --stage STAGE-01             --work-units "$SELECTED_WUS"             --product-root "$GITHUB_WORKSPACE"             --governance-root "$GITHUB_WORKSPACE/_governance_authority"

      - name: Verify first effectful checkpoint and persist entry receipt
        if: steps.request.outputs.requested == 'true'
        env:
          SELECTED_WUS: ${{ steps.request.outputs.work_units }}
          MATERIALIZED_HEAD: ${{ steps.persist_prestage.outputs.materialized_head }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,yaml
          wus=os.environ['SELECTED_WUS'].split(',')
          for wu in wus:
              root=Path('STAGE_EXECUTION/STAGE-01')/wu
              state=yaml.safe_load((root/'EXECUTION_STATE.yaml').read_text()) or {}
              assert state.get('completed_operations')==['SOURCE_STRUCTURE_ENUMERATION'], (wu,state.get('completed_operations'))
              assert state.get('current_operation')=='SOURCE_SEGMENT_MAPPING', (wu,state.get('current_operation'))
              assert (root/'EVIDENCE/OPERATION_RECEIPTS/SOURCE_STRUCTURE_ENUMERATION.yaml').is_file(), wu
          receipt={
            'artifact_type':'STAGE01_EFFECTFUL_ENTRY_RECEIPT',
            'stage_uid':'STAGE-01',
            'work_units':wus,
            'pre_effectful_materialized_head_sha':os.environ['MATERIALIZED_HEAD'],
            'orchestrator_run_id':os.environ['RUN_ID'],
            'full_stage_revalidation':'PASS',
            'runtime_inline_admission':'PASS',
            'executed_operation_uid':'SOURCE_STRUCTURE_ENUMERATION',
            'next_operation_uid':'SOURCE_SEGMENT_MAPPING',
            'future_stage_preproduction':False,
            'status':'PASS_FIRST_EFFECTFUL_CHECKPOINT',
            'completion_credit':0,
          }
          p=Path('STAGE_EXECUTION/STAGE-01/STAGE01_EFFECTFUL_ENTRY_RECEIPT.yaml')
          p.write_text(yaml.safe_dump(receipt,sort_keys=False,allow_unicode=True),encoding='utf-8')
          reqp=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/STAGE01_PRESTAGE_EXECUTION_REQUEST.yaml')
          req=yaml.safe_load(reqp.read_text(encoding='utf-8')) or {}
          req['effectful_entry_status']='PASS_FIRST_OPERATION_CHECKPOINT'
          req['effectful_entry_materialized_head_sha']=os.environ['MATERIALIZED_HEAD']
          req['effectful_entry_run_id']=os.environ['RUN_ID']
          reqp.write_text(yaml.safe_dump(req,sort_keys=False,allow_unicode=True),encoding='utf-8')
          print('PASS: first Stage01 effectful checkpoint is exact and future stages remain unproduced')
          PY

      - name: Persist first Stage01 operation by compare-and-swap
        if: steps.request.outputs.requested == 'true'
        id: persist_operation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 0921acpos --depth=1
          test "$(git rev-parse origin/0921acpos)" = "${{ steps.persist_prestage.outputs.materialized_head }}" || {
            echo "BLOCK:REMOTE_ADVANCED_BEFORE_OPERATION_PERSIST"
            exit 54
          }
          git add STAGE_EXECUTION/STAGE-01 STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW
          git diff --cached --quiet && { echo "BLOCK:NO_OPERATION_DELTA"; exit 55; }
          git commit -m "stage01: enter validated first operation checkpoint"
          NEW_HEAD="$(git rev-parse HEAD)"
          git push origin HEAD:0921acpos
          echo "operation_head=$NEW_HEAD" >> "$GITHUB_OUTPUT"

      - name: Report persisted Stage01 entry
        if: steps.request.outputs.requested == 'true'
        run: |
          echo "STAGE01_PRESTAGE_HEAD=${{ steps.persist_prestage.outputs.materialized_head }}"
          echo "STAGE01_OPERATION_HEAD=${{ steps.persist_operation.outputs.operation_head }}"
          echo "STAGE01_FIRST_OPERATION=SOURCE_STRUCTURE_ENUMERATION"
