name: Governance v2.1.5 Sealed Stage-1 Test Gate

on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-lock-and-fresh-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify v2.1.5 seal, current pointer, fresh workspace, and source structure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_current_v215_workspace.py

  sealed-v2-1-5-stage1-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact sealed runtime and run Stage-1 31/31
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python governance/ci/validate_sealed_v215_runtime.py
