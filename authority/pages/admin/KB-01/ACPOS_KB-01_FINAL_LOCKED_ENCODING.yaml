section_registry:
  count: 16
  format: S:nn::order::name::responsibility
  rows:
  - S:01::1::Page Context / View Navigation::頁面標題、Active View、授權範圍、全域頁內 Search、View 切換。
  - S:02::2::Knowledge Overview::來源、Ingestion、Experience、Knowledge Review、Approved Knowledge 的治理摘要與警示。
  - S:03::3::Source Directory::Knowledge Source 搜尋、篩選、清單、選取。
  - S:04::4::Source Detail / Governance::來源 Scope、Rights、Classification、Freshness、Retention、Status 設定。
  - S:05::5::Research / Ingestion Queue::Research/Ingestion 執行、進度、Normalization、Failure、Retry。
  - S:06::6::Search / Result Explorer::Approved/traceable Knowledge、Fact、Evidence 的 Search/Filter/Result。
  - S:07::7::Citation / Evidence Detail::Citation、Source Metadata、Source Time/Version、Classification、Freshness、Evidence。
  - S:08::8::Context Candidate Builder::將選取的 Knowledge/Fact/Evidence 組成共用 ACPOSContextCandidate。
  - S:09::9::Experience Directory::ACPOSExperienceRecord 搜尋、篩選、Outcome Completeness。
  - S:10::10::Experience Replay::以 ACPOSStateProjection + ACPOSExperienceRecord 重播 Input→Route→Output→Evaluation→Correction→Outcome。
  - S:11::11::Root Cause / Learning Candidate::Root Cause、Pattern、限制與 ACPOSLearningCandidate 建立。
  - S:12::12::Knowledge Review Queue::Knowledge Draft 待審查清單、狀態、優先序。
  - S:13::13::Knowledge Draft / Evidence Review::Draft Content、Fact/Inference 分類、Citation/Outcome Validation。
  - S:14::14::Version Diff / Supersession::Draft vs Previous Approved Knowledge Version 差異與 supersedes 關係。
  - S:15::15::Review Decision Rail::Mandatory Checklist、Approve / Return / Reject、Review Rationale。
  - S:16::16::Status / Error / Audit::Correlation、Error、Audit、State/Disabled Reason、最近操作結果。
