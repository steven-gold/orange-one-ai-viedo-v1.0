name: Sync VIS-08 Preview Navigation
on:
  push:
    branches: [acpos-live-preview]
    paths: ['.github/workflows/sync-vis08-preview-nav.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-live-preview
      - name: Enable NAV-08 in existing preview pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['preview/index.html','preview/edit.html','preview/qa.html']
          pattern=re.compile(r'<button disabled>(?P<body><span class="ico">◎</span><span class="nav-label"[^>]*>.*?戰略中心.*?</span>)</button>')
          for f in files:
            p=Path(f); s=p.read_text();
            s2,n=pattern.subn(r'<a href="strategy.html">\g<body></a>',s,count=1)
            if n!=1: raise SystemExit(f'NAV-08 replacement count={n} in {f}')
            p.write_text(s2)
          PY
      - name: Commit exact preview nav changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/index.html preview/edit.html preview/qa.html
          git rm .github/workflows/sync-vis08-preview-nav.yml
          git commit -m 'preview(vis08): enable Strategy navigation across preview shell [skip ci]'
          git push origin HEAD:acpos-live-preview
