name: CORE01 Functional Closure Once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0

      - name: Verify authority and visual locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/app/page.tsx)" = "95e88cd0171721f3cb21459f42a6f39e4a322ead"
          test "$(git hash-object src/components/pages/DashboardVisual.tsx)" = "aa3a8a9472ee6c471503d8990654233a6ee02edd"
          test "$(git hash-object src/components/pages/DashboardVisual.module.css)" = "4f2656bf7db9fdbbf0531730b181215606b3120e"
          test "$(git hash-object src/components/pages/CoreVisual.module.css)" = "c9b0215dc2d174b77c558e617125e6ec2ecd9fbd"
          grep -q 'page_uid: CORE-01' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml
          test "$(grep -c '^  - control_uid: CORE-01-' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml)" = "50"
          test "$(grep -c '^  - action_uid: CORE-01-ACT-' authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml)" = "34"
          test ! -e .github/workflows/video01-interaction-closure-once.yml
          echo AUTHORITY_VISUAL_LOCK_PASS

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Next server
        shell: bash
        run: |
          nohup npm run start -- -p 3000 >/tmp/core01-next.log 2>&1 &
          echo $! >/tmp/core01-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/core >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/core01-next.log
          exit 1

      - name: Chromium full CORE control closure
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ permissions: ['clipboard-read', 'clipboard-write'] });
          const page = await context.newPage();
          const pageErrors = [];
          const failedRequests = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('requestfailed', r => failedRequests.push(`${r.method()} ${r.url()} ${r.failure()?.errorText || ''}`));

          const controls = new Set();
          const actions = new Set();
          async function captureRegistry() {
            for (const id of await page.locator('[data-control-id]').evaluateAll(nodes => nodes.map(n => n.getAttribute('data-control-id')).filter(Boolean))) controls.add(id);
            for (const id of await page.locator('[data-action-uid]').evaluateAll(nodes => nodes.map(n => n.getAttribute('data-action-uid')).filter(Boolean))) actions.add(id);
          }
          async function click(id) {
            const node = page.locator(`[data-control-id="${id}"]`).first();
            await node.waitFor({ state: 'visible' });
            await node.click();
          }
          async function rootReason(prefix) {
            await page.waitForFunction(p => (document.querySelector('[data-page-uid="CORE-01"]')?.getAttribute('data-runtime-reason') || '').startsWith(p), prefix);
          }
          async function waitText(selector, text) {
            await page.waitForFunction(([s, t]) => (document.querySelector(s)?.textContent || '').includes(t), [selector, text]);
          }
          async function rightClickFirstUser() {
            const user = page.locator('[data-message-role="USER"]').first();
            await user.waitFor({ state: 'visible' });
            await user.click({ button: 'right' });
            await page.locator('[data-component-uid="CORE-01-CMP-MESSAGE-MENU"] [data-control-id="CORE-01-MENU-QUOTE"]').waitFor({ state: 'visible' });
            await captureRegistry();
          }

          await page.goto('http://127.0.0.1:3000/core', { waitUntil: 'networkidle' });
          await page.locator('[data-page-uid="CORE-01"][data-page-state="READY"]').waitFor();
          await captureRegistry();
          assert((await page.locator('[data-control-id="CORE-01-CTL-PROJECT"] option').count()) === 1, 'initial project projection must be empty');

          await click('CORE-01-BTN-PROJECT-CREATE');
          await page.waitForFunction(() => document.querySelectorAll('[data-control-id="CORE-01-CTL-PROJECT"] option').length > 1);
          assert((await page.locator('[data-control-id="CORE-01-CTL-PROJECT"]').inputValue()).startsWith('TEST-PROJ-'), 'project exact ref not selected');
          await waitText('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]', '[TEST] DRAFT');

          await click('CORE-01-BTN-PROJECT-VALIDATE');
          await waitText('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]', '[TEST] VALIDATED');
          await click('CORE-01-BTN-PROJECT-CONFIRM');
          await waitText('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]', '[TEST] CORE_MODELING');
          await waitText('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]', 'TEST-DNA-V1');

          await click('CORE-01-BTN-STORY-CANDIDATE');
          await waitText('[data-component-uid="CORE-01-CMP-PROJECT-STATE"]', 'TEST-STORY-SET-');

          await click('CORE-01-BTN-NEW-THREAD');
          await page.waitForFunction(() => document.querySelectorAll('[data-control-id="CORE-01-LST-THREADS"] select option').length > 1);
          assert((await page.locator('[data-control-id="CORE-01-LST-THREADS"] select').inputValue()).startsWith('TEST-CONV-'), 'thread exact ref not selected');

          await click('CORE-01-BTN-MULTI-AI');
          await rootReason('AI_MODE=MULTI');
          await click('CORE-01-BTN-SINGLE-AI');
          await rootReason('AI_MODE=SINGLE');

          await click('CORE-01-BTN-ASSISTANT-RECORD');
          await page.locator('[data-assistant-record-overlay="true"]').waitFor({ state: 'visible' });
          await click('CORE-01-BTN-ASSISTANT-RECORD');
          assert((await page.locator('[data-assistant-record-overlay="true"]').count()) === 0, 'assistant record did not close');

          await click('CORE-01-BTN-ATTACHMENT');
          await rootReason('ATTACHMENT_ATTACHED:TEST-CORE-ATTACHMENT-');
          await click('CORE-01-BTN-REFERENCE');
          await rootReason('REFERENCE_ATTACHED:TEST-CORE-REFERENCE-');

          const composer = page.locator('[data-control-id="CORE-01-FLD-MESSAGE"]');
          await composer.fill('@Assistant CORE closure test message');
          await click('CORE-01-BTN-SEND');
          await page.locator('[data-message-role="USER"]').first().waitFor({ state: 'visible' });
          await page.locator('[data-message-role="SIMULATED_AI"]').first().waitFor({ state: 'visible' });
          await waitText('[data-control-id="CORE-01-FLD-ASSISTANT-SUMMARY"]', '[TEST][SIMULATED_EXTERNAL]');
          await waitText('[data-control-id="CORE-01-FLD-EVALUATION"]', '[TEST] CORE evaluation fixture');

          await rightClickFirstUser();
          await click('CORE-01-MENU-QUOTE');
          await rootReason('MESSAGE_QUOTED:TEST-MSG-');
          await rightClickFirstUser();
          await click('CORE-01-MENU-CONTINUE');
          await rootReason('MESSAGE_CONTEXT_CONTINUED:TEST-MSG-');
          await rightClickFirstUser();
          await click('CORE-01-MENU-DECISION');
          await rootReason('DECISION_EVIDENCE_ADDED:TEST-MSG-');
          await rightClickFirstUser();
          await click('CORE-01-MENU-COPY');
          await rootReason('MESSAGE_COPIED:TEST-MSG-');
          await rightClickFirstUser();
          const simulatedBefore = await page.locator('[data-message-role="SIMULATED_AI"]').count();
          await click('CORE-01-MENU-ANALYZE');
          await page.waitForFunction(n => document.querySelectorAll('[data-message-role="SIMULATED_AI"]').length > n, simulatedBefore);
          await rightClickFirstUser();
          await click('CORE-01-MENU-BRANCH');
          await page.waitForFunction(() => document.querySelectorAll('[data-control-id="CORE-01-LST-THREADS"] select option').length >= 3);
          assert((await page.locator('[data-message-role]').count()) === 0, 'branch did not isolate local message history');

          const decision = page.locator('[data-control-id="CORE-01-FLD-HUMAN-DECISION"]');
          await decision.fill('TEST human governed decision');
          await click('CORE-01-BTN-CANDIDATE-CREATE');
          await waitText('[data-control-id="CORE-01-FLD-VERSION-STATE"]', 'CANDIDATE');
          await waitText('[data-control-id="CORE-01-FLD-STRUCTURED-DECISION"]', '[TEST] Structured human decision');
          await click('CORE-01-BTN-CANDIDATE-COMPARE');
          await waitText('[data-candidate-compare-read-model="true"]', '[TEST] Compared 1 exact candidate');
          await click('CORE-01-BTN-RETURN-MODIFY');
          await waitText('[data-control-id="CORE-01-FLD-VERSION-STATE"]', 'RETURNED');
          await click('CORE-01-BTN-CANDIDATE-CREATE');
          await waitText('[data-control-id="CORE-01-FLD-VERSION-STATE"]', 'CANDIDATE');
          await click('CORE-01-BTN-CANDIDATE-CONFIRM');
          await waitText('[data-control-id="CORE-01-FLD-VERSION-STATE"]', 'ACCEPTED');

          await click('CORE-01-BTN-DNA-LOCK');
          await waitText('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]', 'DNA_LOCK_REVIEW_REQUESTED');
          await click('CORE-01-BTN-CORE-REVIEW');
          await waitText('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]', 'CORE_REVIEW_REQUESTED');
          await click('CORE-01-BTN-PROJECT-LOCK');
          await waitText('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]', 'MOTHER_LOCK_REVIEW_REQUESTED');
          assert(!(await page.locator('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]').textContent()).includes('LOCKED'), 'review request must not fabricate final LOCKED state');

          await click('CORE-01-BTN-TOPIC-CREATE');
          await page.waitForFunction(() => document.querySelectorAll('[data-control-id="CORE-01-CTL-TOPIC"] option').length > 1);
          assert((await page.locator('[data-control-id="CORE-01-CTL-TOPIC"]').inputValue()).startsWith('TEST-TOPIC-'), 'topic exact ref not selected');
          await waitText('[data-control-id="CORE-01-FLD-PAGE-MODE"]', 'TOPIC_PRODUCTION');
          await waitText('[data-control-id="CORE-01-FLD-TOPIC-SCOPE"]', '[TEST] TOPIC_SCOPE');

          await click('CORE-01-BTN-BLUEPRINT-CREATE');
          await waitText('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]', 'BLUEPRINT_DRAFT');
          await click('CORE-01-BTN-BLUEPRINT-VALIDATE');
          await waitText('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]', 'BLUEPRINT_REVIEW');
          await click('CORE-01-BTN-BLUEPRINT-APPROVE');
          await waitText('[data-component-uid="CORE-01-CMP-BLUEPRINT-STATE"]', 'READY_FOR_CHILD_REVIEW');
          await click('CORE-01-BTN-CHILD-LOCK');
          await waitText('[data-control-id="CORE-01-FLD-LOCK-REVIEW"]', 'CHILD_LOCK_REVIEW_REQUESTED');
          await click('CORE-01-BTN-CANONICAL-SCRIPT');
          await waitText('[data-control-id="CORE-01-FLD-PACKAGE"]', '[TEST] Canonical Script Bound');
          await waitText('[data-control-id="CORE-01-FLD-DOWNSTREAM-ASSET"]', 'REVIEW_PENDING — NOT PRODUCTION READY');

          await captureRegistry();
          assert(controls.size === 50, `registered control coverage expected 50 got ${controls.size}: ${[...controls].sort().join(',')}`);
          assert(actions.size === 34, `registered action coverage expected 34 got ${actions.size}: ${[...actions].sort().join(',')}`);
          assert(pageErrors.length === 0, `page errors: ${pageErrors.join(' | ')}`);
          assert(failedRequests.length === 0, `failed requests: ${failedRequests.join(' | ')}`);
          console.log(`CORE01_FUNCTIONAL_CLOSURE_PASS controls=${controls.size} actions=${actions.size}`);
          console.log('TEST_ONLY_PROJECT_TOPIC_THREAD_MESSAGE_CANDIDATE_BLUEPRINT_LOCK_REQUESTS_PASS');
          console.log('EXTERNAL_AI_EXECUTION=SIMULATED_EXTERNAL_NOT_FORMAL_E2E');
          await browser.close();
          NODE

      - name: Production fail-closed static assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'process.env.ACPOS_RUNTIME_MODE !== "PRODUCTION"' src/server/testing/controlledCoreTestRuntime.ts
          grep -q 'process.env.NEXT_PUBLIC_ACPOS_RUNTIME_MODE !== TEST_MODE_DISABLED_VALUE' src/domain/testing/controlledTestData.ts
          grep -q 'production_eligible: false' src/domain/testing/controlledTestData.ts
          grep -q 'final_lock_granted: false' src/server/testing/controlledCoreTestRuntime.ts
          grep -q 'SIMULATED_EXTERNAL' src/server/testing/controlledCoreTestRuntime.ts
          echo PRODUCTION_FAIL_CLOSED_ASSERTIONS_PASS

      - name: Server log on failure
        if: failure()
        run: cat /tmp/core01-next.log || true

      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          git rm -f .github/workflows/core01-functional-closure-once.yml
          git commit -m "chore: remove CORE01 functional closure once workflow"
          git push origin new
