name: Product Clean Bootstrap Validation
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/scripts/stage01_current_materialize.py'
      - '.github/scripts/stage01_ops/**'
      - '.github/scripts/full_stage_lifecycle_guard.py'
      - '.github/scripts/stage_lifecycle_gate.py'
      - '.github/workflows/product-clean-bootstrap-validation.yml'
      - '.github/workflows/product-stage-lifecycle-driver.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact selected Current governance
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          test -s "$SEL"
          test "$(awk '$1=="status:" {print $2; exit}' "$SEL")" = "SELECTED_EXACT_CURRENT_SNAPSHOT"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Load Current governance
        run: |
          set -euo pipefail
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock

      - name: Validate clean Stage01 materialization contract
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/stage01_current_materialize.py .github/scripts/stage01_ops/*.py
          python .github/scripts/stage01_current_materialize.py --mode materialize --units "GLOBAL-HOME-SHELL-NAVIGATION,WB01-DASHBOARD" --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/full_stage_lifecycle_guard.py --mode execution-ready --stage STAGE-01 --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"

          for WU in WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001 WU-STAGE01-WB01-DASHBOARD-CLEAN-001; do
            python .github/scripts/product_current_governance_load.py --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority" --stage STAGE-01 --work-unit "STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml"
            python .github/scripts/stage_lifecycle_gate.py --mode assert-work-unit-entry --stage STAGE-01 --work-unit "STAGE_EXECUTION/STAGE-01/$WU/WORK_UNIT.yaml" --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          done

          python - <<'PY'
          from pathlib import Path
          import yaml
          roots=[
            Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-CLEAN-001'),
            Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-CLEAN-001')
          ]
          for root in roots:
              work=yaml.safe_load((root/'WORK_UNIT.yaml').read_text()) or {}
              state=yaml.safe_load((root/'EXECUTION_STATE.yaml').read_text()) or {}
              assert work.get('current_status')=='READY_FOR_EXECUTION'
              assert state.get('status')=='READY_FOR_EXECUTION'
              assert state.get('completed_operations')==[]
              assert state.get('current_operation')=='SOURCE_STRUCTURE_ENUMERATION'
              receipts=root/'EVIDENCE/OPERATION_RECEIPTS'
              assert not receipts.exists() or not any(receipts.iterdir())
          print('PASS: clean Stage01 bootstrap contains only specification-bound inputs and zero execution credit')
          PY
