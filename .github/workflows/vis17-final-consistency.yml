name: VIS-17 Final Consistency
on:
  push:
    branches: [acpos-vis17-staging]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis17-staging
          fetch-depth: 0
      - name: Typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify STR-01 final consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -A8 'nav_id: ADMIN-NAV-08' authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml | grep -Fq 'route: /admin/strategy'
          grep -Fq 'href: "/admin/strategy"' src/components/shell/AppShell.tsx
          grep -Fq 'activeNavId="ADMIN-NAV-08"' src/app/admin/strategy/page.tsx
          grep -Fq 'data-page-uid="admin:STR-01"' src/components/pages/StrategyAdminVisual.tsx
          grep -Fq 'pageName: "战略中心后台"' src/i18n/strategyAdminCatalog.ts
          grep -Fq '"Candidate Queue": "候选队列"' src/i18n/strategyAdminCatalog.ts
          grep -Fq '"ACT-NAV-OPEN": "打开详情"' src/i18n/strategyAdminCatalog.ts
          test ! -e .github/workflows/vis17-strategy-validation.yml
          test ! -e .github/workflows/vis17-strategy-validation-v2.yml
          test -s docs/construction/evidence/VIS-17/vis17-validation.json
          grep -Fq 'status: COMPLETE' docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          echo 'VIS17_FINAL_CONSISTENCY=PASS'
      - name: Self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vis17-final-consistency.yml
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A .github/workflows/vis17-final-consistency.yml
          git commit -m 'chore(vis17): remove final consistency verifier'
          git push origin HEAD:acpos-vis17-staging
