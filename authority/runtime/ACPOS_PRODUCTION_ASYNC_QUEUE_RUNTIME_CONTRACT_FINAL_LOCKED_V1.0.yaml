authority:
  id: ACPOS_PRODUCTION_ASYNC_QUEUE_RUNTIME_CONTRACT
  version: V1.0
  status: FINAL_LOCKED
  current_only: true
  revision: 2026-09-07-PROVIDER-EXECUTION-QUEUE-MATERIALIZATION
  scope: PRODUCTION_ASYNC_QUEUE_WORKER_DLQ
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  derived_from:
  - authority/global/ACPOS_PRODUCTION_SCRIPT_CONTENT_AND_PROVIDER_ADAPTER_CONTRACT_FINAL_LOCKED_V1.3.yaml
  - authority/pages/admin/AIAPI-01/ACPOS_AIAPI-01_FINAL_LOCKED_ENCODING.yaml
  - database/migrations/0001_canonical_schema.sql
  - database/migrations/0008_provider_router_runtime_closure.sql
  - 03_api/operation_registry.yaml

reuse_contract:
  second_queue_system: FORBIDDEN
  queue_registry: public.queues
  worker_registry: public.workers
  delivery_envelope: public.outbox_events
  consumer_idempotency_receipt: public.inbox_events
  dead_letter_store: public.dead_letters
  replay_approval_store: public.replay_candidates
  provider_router: acpos_runtime.provider_route_preflights + acpos_runtime.provider_route_decisions + acpos_runtime.provider_route_attempts
  rule: Extend the canonical outbox envelope for lease/retry state; do not create a parallel queue table.

topology:
  queues:
  - queue_key: acpos.provider.execution.v1
    purpose: Execute governed ProviderGateway requests after provider route preflight.
    capacity: 100
    status: READY
    policy:
      max_attempts: 3
      lease_seconds: 120
      backoff_seconds:
      - 30
      - 120
      - 300
      ordering: FIFO_AVAILABLE_AT
      claim: FOR_UPDATE_SKIP_LOCKED
      restart_recovery: LEASE_EXPIRY_RECLAIM
      idempotency_scope: QUEUE_ID_PLUS_IDEMPOTENCY_KEY
  workers:
  - worker_key: acpos.provider.execution.worker.v1
    queue_key: acpos.provider.execution.v1
    capability:
      handler: PROVIDER_EXECUTION
      supported_event_types:
      - ACPOS_PROVIDER_EXECUTION_REQUESTED
      - ACPOS_QUEUE_RUNTIME_PROBE
    execution_model: ON_DEMAND_AUTHENTICATED_DRAIN_PLUS_DAILY_RECOVERY_CRON
    cron_path: /v1/internal/queue/provider-execution/drain
    cron_schedule: '0 0 * * *'
    auth: CRON_SECRET_BEARER
    max_batch: 10
    hobby_plan_constraint: Native Vercel Cron is recovery-only because Hobby permits daily frequency only.
    on_demand_rule: Effectful enqueue paths may invoke the same authenticated worker runtime immediately; cron remains restart/recovery safety net.

outbox_delivery_extension:
  migration: 0019_async_queue_delivery_runtime
  required_columns:
  - queue_id
  - idempotency_key
  - available_at
  - claimed_by_worker_id
  - lease_until
  - attempt_count
  - max_attempts
  - last_error_code
  - dead_lettered_at
  terminal_success: published_at IS NOT NULL
  terminal_failure: dead_lettered_at IS NOT NULL
  claimable_predicate:
  - published_at IS NULL
  - dead_lettered_at IS NULL
  - available_at <= now()
  - attempt_count < max_attempts
  - claimed_by_worker_id IS NULL OR lease_until < now()

worker_contract:
  heartbeat: Update public.workers.last_heartbeat_at and health on every drain.
  claim:
    atomic: true
    lock: FOR UPDATE SKIP LOCKED
    lease_required: true
    attempt_increment_on_claim: true
  success:
  - insert public.inbox_events receipt using consumer_name + event_id uniqueness
  - set outbox_events.published_at
  - clear claim and lease
  failure:
  - persist last_error_code
  - never store provider request secret
  - if attempt_count < max_attempts, clear claim/lease and set available_at using governed backoff
  - if attempt_count >= max_attempts, insert public.dead_letters and set dead_lettered_at
  restart_recovery:
  - expired lease is claimable by a current READY worker
  - stale worker heartbeat never grants extra authority
  dlq_replay:
    automatic: FORBIDDEN
    approval: public.replay_candidates required
    same_idempotency_key_reuse: REQUIRED

on_demand_authenticated_probe:
  operation_id: runProviderQueueProbe
  path: /v1/aiapi/queue/probe
  method: POST
  permission: page:admin:AIAPI-01
  purpose: Production runtime proof of enqueue, idempotency, claim, handler, inbox receipt, publish, expired-lease recovery, retry, DLQ, heartbeat and cleanup.
  external_provider_call: FORBIDDEN
  cleanup_required: true
  success_evidence:
  - queue row READY
  - worker row READY
  - claimed = 1
  - inbox_receipt = 1
  - published = 1
  - idempotent_enqueue = true
  - lease_recovered = true
  - retry_observed = true
  - dlq_observed = true
  - residual_probe_rows = 0
  - worker heartbeat updated
  primary_worker_acceptance_path: true
  recovery_cron_independent: true

provider_execution_contract:
  enqueue_after:
  - approved provider capability
  - enabled provider profile
  - credential reference is bound
  - route preflight has an eligible member
  event_type: ACPOS_PROVIDER_EXECUTION_REQUESTED
  payload_rules:
  - provider secret plaintext FORBIDDEN
  - credential header plaintext FORBIDDEN
  - canonical instruction may be represented by governed compiled prompt reference/hash
  - correlation_id REQUIRED
  worker_handler:
    current_status: FAIL_CLOSED_UNTIL_EXTERNAL_PROVIDER_ADAPTER_MATERIALIZED
    missing_adapter_reason: PROVIDER_EXTERNAL_ADAPTER_EXECUTION_NOT_MATERIALIZED
  queue_runtime_probe:
    event_type: ACPOS_QUEUE_RUNTIME_PROBE
    external_provider_call: FORBIDDEN
    business_table_mutation: FORBIDDEN
    purpose: Production operational proof of claim, heartbeat, idempotency, success and cleanup.

security:
  cron_secret_env: CRON_SECRET
  missing_cron_secret: HTTP_503
  invalid_cron_secret: HTTP_401
  plaintext_secret_in_db: FORBIDDEN
  plaintext_secret_in_log: FORBIDDEN
  public_unauthenticated_drain: FORBIDDEN

acceptance:
- queue_registry_row_exists
- worker_registry_row_exists
- worker_heartbeat_recent
- enqueue_idempotency_duplicate_blocked
- atomic_claim_pass
- lease_expiry_recovery_pass
- retry_pass
- dlq_after_max_attempts_pass
- inbox_receipt_idempotency_pass
- production_runtime_probe_pass
- provider_execution_remains_fail_closed_without_real provider secret/adapter

completion_claim:
  gate_23_pass_requires:
  - migration applied in Production
  - cron worker deployed and authenticated
  - Authenticated Production HTTP probe proves queue + claim + success + inbox + heartbeat + cleanup
  - Production failure probe proves retry + DLQ + no residual unsafe data
  gate_22_independent: true
