name: Stage-02 Current Problem Reconciliation R26

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-current-problem-reconciliation-r26.yml'
      - 'governance/ci/build_stage02_current_problem_reconciliation_r26.py'
      - 'governance/ci/validate_stage02_current_problem_reconciliation_r26.py'
      - 'governance/test/stage02/STAGE02_FUNCTIONAL_CONTRACT_REMEDIATION_PROBLEM_REGISTER_R19.yaml'
      - 'governance/test/stage02/STAGE02_POST_ACTION_SIGNAL_ROLE_RECLASSIFICATION_R22.yaml'
      - 'governance/test/stage02/STAGE02_R24_CORRECTNESS_ROLLBACK_RECEIPT.yaml'
      - 'governance/test/stage02/STAGE02_POST_ACTION_SIGNAL_INVALIDATION_R25.yaml'
      - 'governance/test/stage02/STAGE02_R25_CORRECTNESS_ROLLBACK_RECEIPT.yaml'
      - '.github/stage02-test/STAGE02_R25_EFFECTIVE_REEXECUTION_RESULT.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-current-problems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R26 implementation
        run: |
          python -m py_compile governance/ci/build_stage02_current_problem_reconciliation_r26.py
          python -m py_compile governance/ci/validate_stage02_current_problem_reconciliation_r26.py
      - name: Revalidate corrected R25 baseline
        run: |
          python governance/ci/validate_stage02_post_action_signal_invalidations_r25.py
          python governance/ci/validate_stage02_r25_correctness_rollback.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.github/stage02-test/STAGE02_R25_EFFECTIVE_REEXECUTION_RESULT.json').read_text())
          assert x['fresh_functional_gap_total']==150, x
          assert x['product_materialization_elimination_count']==17, x
          assert x['gap006_authority_elimination_count']==4, x
          assert x['effective_gap_categories']=={
            'ACTION_WITHOUT_CONTROL_OR_TRIGGER':1,
            'AUDIT_EVENT_NODE_MISSING':13,
            'FAILURE_STATE_ERROR_BINDING_MISSING':44,
            'PAYLOAD_INPUT_CONTRACT_MISSING':34,
            'POST_ACTION_VALIDATION_NODE_MISSING':18,
            'STATE_TRANSITION_LEDGER_FIELD_MISSING':40,
          }, x
          print('PASS: corrected R25 baseline=150')
          PY
      - name: Build exact current 150-problem reconciliation R26
        run: python governance/ci/build_stage02_current_problem_reconciliation_r26.py
      - name: Validate R26 current problem reconciliation
        run: python governance/ci/validate_stage02_current_problem_reconciliation_r26.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert R26 fail-closed current baseline
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          x=yaml.safe_load(Path('governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_PROBLEM_RECONCILIATION_R26.yaml').read_text())
          d=x['denominators']
          assert d['fresh_effective_problems']==150 and d['r19_exact_matched_problems']==150, x
          assert d['r24_invalid_materializations_recorded']==4, x
          assert d['r25_invalid_materializations_recorded']==17, x
          assert d['r22_product_authority_classifications_superseded']==1, x
          assert d['deterministic_materialization_candidates']==0, x
          assert d['product_authority_gaps_proven']==0, x
          assert x['stage02_effective_blocker_count']==150 and x['stage02_status']=='BLOCKED', x
          assert x['next_execution_gate']=='FUNCTIONAL_CONTRACT_OWNING_LAYER_REMEDIATION_INPUT_REQUIRED', x
          assert x['stage03_allowed'] is False and x['website_construction_allowed'] is False and x['deployment_allowed'] is False, x
          print('PASS: R26 current 150 problems are fully recorded and fail-closed')
          PY
      - name: Persist R26 current problem reconciliation
        run: |
          path='governance/test/stage02/STAGE02_CURRENT_FUNCTIONAL_CONTRACT_PROBLEM_RECONCILIATION_R26.yaml'
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo 'R26 output unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'test(stage02): persist current 150-problem reconciliation R26'
          git push origin HEAD:rebuild-v2.1.1
