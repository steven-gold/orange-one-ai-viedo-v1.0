  source_text: System 09 is the Canonical Owner for these three SYS-01 controls. Two effectful controls had no Gate defined and now receive explicit owner-defined Gate UIDs. SYS-01-BTN-NAV-OPEN had a preserved conflict between
    CURRENT_VIEW_AND_SOURCE_ACTION_GATE and SOURCE_PAGE_GATE. The later exact binding of operation=getUiProjection and Runtime Owner='Projection / source page read owner', together with ops.read and UI_LOCAL_OR_READ_SOURCE,
    disambiguates the control to the source-page read domain; SOURCE_PAGE_GATE is therefore the canonical Gate. The mutation-oriented CURRENT_VIEW_AND_SOURCE_ACTION_GATE is not transferred.
