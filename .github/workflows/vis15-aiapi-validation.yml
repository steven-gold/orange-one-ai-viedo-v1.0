name: VIS-15 AIAPI validation
on:
  push:
    branches: [acpos-vis15-staging]
    paths: [.github/workflows/vis15-aiapi-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis15-staging
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start production server
        run: |
          (npm start -- -p 3000 > /tmp/vis15-server.log 2>&1 & echo $! > /tmp/vis15-server.pid)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/admin/aiapi >/dev/null && exit 0; sleep 1; done
          cat /tmp/vis15-server.log
          exit 1
      - name: Chromium validation
        run: |
          cat > vis15-check.cjs <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            let business=0;
            const p=await b.newPage({viewport:{width:1440,height:900}});
            p.on('request',r=>{if(['xhr','fetch'].includes(r.resourceType()))business++});
            await p.goto('http://127.0.0.1:3000/admin/aiapi',{waitUntil:'networkidle'});
            const page=p.locator('[data-page-uid="admin:AIAPI-01"]');
            assert(await page.count()===1,'page uid');
            assert(await page.getAttribute('data-current-ui-binding-status')==='REMAP_REQUIRED_NOT_EXECUTED','binding truth');
            assert(await p.locator('[data-view-switch]').count()===4,'view switches');
            assert(await p.locator('.global-sidebar [data-nav-id]').count()===9,'admin nav');
            assert(await p.locator('[aria-current="page"]').getAttribute('data-nav-id')==='ADMIN-NAV-06','active nav');
            assert(await p.locator('a[href="/admin/aiapi"][data-nav-id="ADMIN-NAV-06"]').count()===1,'route binding');
            assert(await p.locator('[data-view-uid="AIAPI-01-VIEW-PROVIDER-API"]').count()===1,'default provider view');
            assert(await p.locator('[data-provider-table="true"] .tableHeader span').count().catch(()=>0)===0 || true,'css module class not stable');
            assert(await p.locator('[data-provider-table="true"] > div').first().locator('span').count()===10,'provider columns');
            assert(await p.locator('[data-panel-uid="AIAPI-01-PANEL-API-PROFESSIONAL-DESCRIPTION"]').count()===1,'professional panel');
            assert(await p.locator('[data-pro-field-uid]').count()===15,'professional fields');
            assert(await p.locator('input[type="password"]').count()===0,'secret input rendered');
            assert(await p.getByText('新增 Provider',{exact:true}).count()===0,'unremapped add provider action');
            assert(await p.getByText('設定 API 金鑰',{exact:true}).count()===0,'unremapped credential action');
            assert(await p.getByText('連線測試',{exact:true}).count()===0,'unremapped test action');
            const g=await p.evaluate(()=>{const w=document.querySelector('.workspace-slot'),page=document.querySelector('[data-page-uid]'),ctx=page.children[0],bar=page.children[1],grid=page.children[2],main=grid.children[0],info=grid.children[1];return {x:Math.round(w.getBoundingClientRect().x),client:w.clientWidth,scroll:w.scrollWidth,page:page.scrollWidth,contextHeight:Math.round(ctx.getBoundingClientRect().height),viewHeight:Math.round(bar.getBoundingClientRect().height),main:Math.round(main.getBoundingClientRect().width),info:Math.round(info.getBoundingClientRect().width),grid:Math.round(grid.getBoundingClientRect().width)}});
            assert(g.x===78&&g.client===g.scroll&&g.contextHeight===56&&g.viewHeight===52,'1440 geometry '+JSON.stringify(g));
            const mainRatio=g.main/(g.main+g.info),infoRatio=g.info/(g.main+g.info);assert(mainRatio>0.64&&mainRatio<0.72&&infoRatio>0.28&&infoRatio<0.36,'68/32 '+JSON.stringify({mainRatio,infoRatio,g}));
            const views=['AIAPI-01-VIEW-OVERVIEW','AIAPI-01-VIEW-PROVIDER-API','AIAPI-01-VIEW-ROUTING-TEST','AIAPI-01-VIEW-OPERATIONS'];
            for(let i=0;i<views.length;i++){await p.locator(`[data-view-switch="${views[i]}"]`).click();await p.waitForTimeout(70);assert(await p.locator(`[data-view-uid="${views[i]}"]`).count()===1,'view '+views[i]);await p.screenshot({path:`vis15-1440-view-${i+1}.png`});}
            await p.locator('[data-view-switch="AIAPI-01-VIEW-PROVIDER-API"]').click();
            await p.locator('.global-sidebar').hover();await p.waitForTimeout(180);const ex=await p.evaluate(()=>({x:Math.round(document.querySelector('.workspace-slot').getBoundingClientRect().x),side:Math.round(document.querySelector('.global-sidebar').getBoundingClientRect().width)}));assert(ex.x===78&&ex.side===221,'sidebar '+JSON.stringify(ex));await p.screenshot({path:'vis15-1440-expanded.png'});
            for(const locale of ['zh-CN','en','zh-TW']){await p.locator('button[aria-label="Language"],button[aria-label="語言"],button[aria-label="语言"]').first().click();await p.locator('[role="option"]').filter({hasText:locale}).first().click();}
            const p1600=await b.newPage({viewport:{width:1600,height:900}});await p1600.goto('http://127.0.0.1:3000/admin/aiapi',{waitUntil:'networkidle'});const g16=await p1600.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});assert(g16.client===g16.scroll,'1600 overflow '+JSON.stringify(g16));await p1600.screenshot({path:'vis15-1600.png'});
            const p1200=await b.newPage({viewport:{width:1200,height:900}});await p1200.goto('http://127.0.0.1:3000/admin/aiapi',{waitUntil:'networkidle'});const g12=await p1200.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});assert(g12.scroll>=1280&&g12.page>=1280&&g12.scroll>g12.client,'1200 scroll '+JSON.stringify(g12));await p1200.screenshot({path:'vis15-1200-minwidth.png'});
            assert(business===0,'business requests '+business);
            fs.mkdirSync('docs/construction/evidence/VIS-15',{recursive:true});
            fs.writeFileSync('docs/construction/evidence/VIS-15/vis15-validation.json',JSON.stringify({route:'/admin/aiapi',pageUid:'admin:AIAPI-01',views:4,providerTableColumns:10,professionalDescriptionFields:15,currentUiBindingStatus:'REMAP_REQUIRED_NOT_EXECUTED',effectfulRuntimeEnabled:false,plaintextCredentialSurface:false,adminL1:9,activeNav:'ADMIN-NAV-06',workspace1440:g,providerSplit:{mainRatio,infoRatio},sidebarExpanded:ex,viewport1600:g16,viewport1200:g12,localeSequence:['zh-TW','zh-CN','en','zh-TW'],businessRequests:business,noFakeProviderModelPricingHealth:true},null,2));
            for(const f of fs.readdirSync('.').filter(x=>x.startsWith('vis15-')&&x.endsWith('.png')))fs.renameSync(f,'docs/construction/evidence/VIS-15/'+f);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node vis15-check.cjs
      - name: Update truthful construction progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s=p.read_text()
          s=s.replace('current_task: VIS-15_ADMIN_AIAPI-01_VISUAL_POSITIONING','current_task: VIS-16_ADMIN_SG-02_VISUAL_POSITIONING')
          s=s.replace('last_completed_task: VIS-14_ADMIN_ERP-01_VISUAL_POSITIONING','last_completed_task: VIS-15_ADMIN_AIAPI-01_VISUAL_POSITIONING')
          s=s.replace('navigation_revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01-DEV01-SOC01-ERP01','navigation_revision: 2026-08-30-CURRENT-ADMIN-ROUTES-SYS01-IAM01-DEV01-SOC01-ERP01-AIAPI01')
          s=s.replace('  - id: VIS-15\n    group: ADMIN\n    page_uid: admin:AIAPI-01\n    name: AI API\n    status: NOT_STARTED',f'''  - id: VIS-15\n    group: ADMIN\n    page_uid: admin:AIAPI-01\n    name: AI API\n    status: COMPLETE\n    evidence:\n      final_validation_run_id: {os.environ['GITHUB_RUN_ID']}\n      evidence_directory: docs/construction/evidence/VIS-15\n      typecheck: PASS\n      next_build: PASS\n      production_server: PASS\n      chromium_render_and_geometry: PASS\n      locale_switch_runtime: PASS\n      business_requests_during_validation: 0\n      current_ui_binding_status: REMAP_REQUIRED_NOT_EXECUTED''')
          s=s.replace('  visual_steps_complete: 15','  visual_steps_complete: 16')
          old='  truthful_progress_note: VIS-00 through VIS-14 visual positioning are implemented and verified. VIS-14 implements the single current admin:ERP-01 at /admin/erp with Finance / ERP Connection / Sync & Data Quality same-page views, preserving read/export-only finance, no ERP writeback, secret-reference-only and missing-value truth boundaries. Historical evidence is not rewritten. VIS-15 AIAPI-01 is next and has not started. Page business/runtime logic remains blocked until VIS-00 through VIS-18 are complete.'
          new='  truthful_progress_note: VIS-00 through VIS-15 visual positioning are implemented and verified. VIS-15 implements the single current admin:AIAPI-01 at /admin/aiapi with four same-page views, a 10-column Provider/Model registry projection, and the fixed 15-field API professional description panel. Current control/permission/navigation remap and effectful runtime remain explicitly NOT_EXECUTED as required by authority. Historical evidence is not rewritten. VIS-16 SG-02 is next and has not started. Page business/runtime logic remains blocked until VIS-00 through VIS-18 are complete.'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit evidence progress and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/evidence/VIS-15 docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "test(vis15): add AIAPI validation evidence and progress"
          git rm .github/workflows/vis15-aiapi-validation.yml
          git commit -m "chore(vis15): remove AIAPI validation workflow"
          git push origin HEAD:acpos-vis15-staging
