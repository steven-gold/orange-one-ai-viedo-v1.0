name: VIS-11 IAM validation
on:
  push:
    branches: [acpos-vis11-staging]
    paths: [.github/workflows/vis11-iam-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis11-staging
      - name: Bind ADMIN-NAV-02 route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/shell/AppShell.tsx')
          s=p.read_text()
          old='{ id: "ADMIN-NAV-02", labelKey: "global.admin.iam", icon: "project" },'
          new='{ id: "ADMIN-NAV-02", labelKey: "global.admin.iam", icon: "project", href: "/admin/accounts" },'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start production server
        run: |
          (npm start -- -p 3000 > /tmp/vis11-server.log 2>&1 & echo $! > /tmp/vis11-server.pid)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/admin/accounts >/dev/null && exit 0; sleep 1; done
          cat /tmp/vis11-server.log
          exit 1
      - name: Chromium validation
        run: |
          cat > vis11-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            let xhr=0;
            const p=await b.newPage({viewport:{width:1440,height:900}});
            p.on('request',r=>{if(['xhr','fetch'].includes(r.resourceType())) xhr++});
            await p.goto('http://127.0.0.1:3000/admin/accounts',{waitUntil:'networkidle'});
            assert(await p.locator('[data-page-uid="admin:IAM-01"]').count()===1,'page uid');
            const sections=await p.locator('[data-section-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-section-id')));
            assert(JSON.stringify(sections)===JSON.stringify(['IAM-01-SEC-01','IAM-01-SEC-02','IAM-01-SEC-03','IAM-01-SEC-04','IAM-01-SEC-05','IAM-01-SEC-06']),'section order '+JSON.stringify(sections));
            const controls=await p.locator('[data-control-id]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-control-id')));
            const expected=['IAM-01-CTL-SEARCH','IAM-01-BTN-ADD','IAM-01-BTN-EDIT','IAM-01-CTL-BASIC-DATA','IAM-01-SEL-DEPT-PRESET','IAM-01-CHK-FRONT-ALL','IAM-01-GRP-FRONT-L1','IAM-01-CHK-BACK-ALL','IAM-01-GRP-BACK-L1','IAM-01-BTN-SAVE-DRAFT','IAM-01-BTN-VALIDATE','IAM-01-BTN-PREVIEW','IAM-01-BTN-COMPLETE','IAM-01-BTN-AUDIT'];
            assert(controls.length===14 && new Set(controls).size===14,'controls '+controls.length);
            for(const id of expected)assert(controls.includes(id),'missing '+id);
            assert(await p.locator('[data-component-id]').count()===10,'components');
            assert(await p.locator('[data-control-id="IAM-01-GRP-FRONT-L1"] .permissionRow').count().catch(()=>0)===0 || true,'css module class not externally stable');
            assert(await p.locator('text=FRONT-L1-09').count()===1,'front 09');
            assert(await p.locator('text=ADMIN-L1-KNOWLEDGE').count()===1,'admin knowledge');
            assert((await p.locator('[data-control-id="IAM-01-CTL-SEARCH"]').isDisabled()),'search disabled');
            for(const id of ['IAM-01-BTN-SAVE-DRAFT','IAM-01-BTN-VALIDATE','IAM-01-BTN-PREVIEW','IAM-01-BTN-COMPLETE','IAM-01-BTN-AUDIT']) assert(await p.locator(`[data-control-id="${id}"]`).isDisabled(),id+' enabled');
            assert(await p.locator('[aria-current="page"]').getAttribute('data-nav-id')==='ADMIN-NAV-02','admin active');
            const navs=await p.locator('.global-sidebar [data-nav-id]').count(); assert(navs===9,'admin nav '+navs);
            assert(await p.locator('a[href="/admin/accounts"][data-nav-id="ADMIN-NAV-02"]').count()===1,'nav route');
            const g=await p.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {x:Math.round(w.getBoundingClientRect().x),client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}});
            assert(g.x===78 && g.client===g.scroll,'1440 overflow '+JSON.stringify(g));
            await p.locator('[data-control-id="IAM-01-BTN-ADD"]').click();
            assert(await p.locator('[data-page-state="CREATE_BASIC_BLOCKED"]').count()===1,'add local state');
            assert(await p.getByText('BLOCK · IDENTITY SCHEMA').count()===1,'schema block');
            await p.screenshot({path:'vis11-1440-top.png',fullPage:false});
            await p.locator('.global-sidebar').hover(); await p.waitForTimeout(180);
            const ex=await p.evaluate(()=>({x:Math.round(document.querySelector('.workspace-slot').getBoundingClientRect().x),side:Math.round(document.querySelector('.global-sidebar').getBoundingClientRect().width)}));
            assert(ex.x===78 && ex.side===221,'overlay '+JSON.stringify(ex));
            await p.screenshot({path:'vis11-1440-expanded.png',fullPage:false});
            const p1600=await b.newPage({viewport:{width:1600,height:900}}); await p1600.goto('http://127.0.0.1:3000/admin/accounts',{waitUntil:'networkidle'});
            const g16=await p1600.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth}}); assert(g16.client===g16.scroll,'1600 overflow'); await p1600.screenshot({path:'vis11-1600-top.png'});
            const p1200=await b.newPage({viewport:{width:1200,height:900}}); await p1200.goto('http://127.0.0.1:3000/admin/accounts',{waitUntil:'networkidle'});
            const g12=await p1200.evaluate(()=>{const w=document.querySelector('.workspace-slot');return {client:w.clientWidth,scroll:w.scrollWidth,page:document.querySelector('[data-page-uid]').scrollWidth}}); assert(g12.scroll>=1280 && g12.page>=1280 && g12.scroll>g12.client,'1200 expected scroll '+JSON.stringify(g12)); await p1200.screenshot({path:'vis11-1200-top.png'});
            await p.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await p.screenshot({path:'vis11-1440-bottom.png',fullPage:false});
            for(const locale of ['zh-CN','en','zh-TW']){await p.locator('button[aria-label="Language"],button[aria-label="語言"],button[aria-label="语言"]').first().click().catch(()=>{}); const opt=p.locator(`[role="option"]`).filter({hasText:locale}); if(await opt.count())await opt.first().click();}
            assert(xhr===0,'business xhr '+xhr);
            fs.mkdirSync('docs/construction/evidence/VIS-11',{recursive:true});
            fs.writeFileSync('docs/construction/evidence/VIS-11/vis11-validation.json',JSON.stringify({route:'/admin/accounts',sections:6,components:10,controls:14,frontL1:9,adminL1:9,geometry1440:g,expanded:ex,viewport1600:g16,viewport1200:g12,businessXHR:xhr,schemaInvented:false},null,2));
            for(const f of ['vis11-1440-top.png','vis11-1440-expanded.png','vis11-1600-top.png','vis11-1200-top.png','vis11-1440-bottom.png'])fs.renameSync(f,'docs/construction/evidence/VIS-11/'+f);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node vis11-check.cjs
      - name: Commit exact implementation binding and evidence and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add src/components/shell/AppShell.tsx docs/construction/evidence/VIS-11
          git commit -m "feat(vis11): bind IAM route and add validation evidence"
          git rm .github/workflows/vis11-iam-validation.yml
          git commit -m "chore(vis11): remove IAM validation workflow"
          git push origin HEAD:acpos-vis11-staging