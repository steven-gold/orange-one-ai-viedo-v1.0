name: CORE01 Dependency Diagnostic Once
on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/core01-dependency-diagnostic-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Dependency consistency and audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls --all >/tmp/npm-ls.txt 2>&1 || { cat /tmp/npm-ls.txt; exit 1; }
          npm audit --json >/tmp/audit-all.json || true
          npm audit --omit=dev --json >/tmp/audit-prod.json || true
          python3 <<'PY'
          import json
          for label,path in [('ALL','/tmp/audit-all.json'),('PROD','/tmp/audit-prod.json')]:
              data=json.load(open(path))
              meta=data.get('metadata',{}).get('vulnerabilities',{})
              print(f'{label}_VULNERABILITY_COUNTS={json.dumps(meta,sort_keys=True)}')
              vulns=data.get('vulnerabilities',{})
              for name,item in sorted(vulns.items()):
                  via=[]
                  for v in item.get('via',[]):
                      if isinstance(v,str): via.append(v)
                      elif isinstance(v,dict): via.append(f"{v.get('title','')} [{v.get('severity','')}] {v.get('range','')}")
                  print(f'{label}_VULN package={name} severity={item.get("severity")} direct={item.get("isDirect")} range={item.get("range")} fix={json.dumps(item.get("fixAvailable"),sort_keys=True)} via={"; ".join(via)}')
          PY
          echo NPM_DEPENDENCY_DIAGNOSTIC_COMPLETE
      - name: Self clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin new
          git checkout new
          git reset --hard origin/new
          git rm -f .github/workflows/core01-dependency-diagnostic-once.yml
          git commit -m "chore: remove CORE01 dependency diagnostic workflow"
          git push origin new
