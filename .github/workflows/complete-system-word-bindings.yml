name: Complete System Word Exact Bindings

on:
  push:
    branches:
      - 0921acpos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Apply 01-09 exact binding closure
        run: python __temp_tools__/complete_system_word_bindings.py
      - name: Structural verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from docx import Document
          marker='ACPOS-20260921-EXACT-BINDING-CLOSURE'
          targets=sorted(Path('.').glob('0[1-9]_ACPOS_*.docx'))
          assert len(targets)==9, [str(x) for x in targets]
          report=json.loads(Path('__authority_extract__/SYSTEM_BINDING_CLOSURE_REPORT.json').read_text(encoding='utf-8'))
          assert len(report['targets'])==9
          for p in targets:
              d=Document(p)
              text='\n'.join(x.text for x in d.paragraphs)
              assert marker in text, p.name
              assert 'Legacy REQUIRE_EXACT_BINDING Resolution Ledger' in text, p.name
              assert 'Construction Handoff Rule' in text, p.name
              rec=report['targets'][p.name]
              assert rec['status']=='UPDATED', (p.name,rec)
              for src in rec.get('sources',[]):
                  assert src.get('status')!='MISSING', (p.name,src)
          print('PASS: 9/9 DOCX structurally validated with exact binding closure')
          PY
      - name: Commit completed Word authorities
        shell: bash
        run: |
          git config user.name "acpos-binding-closure"
          git config user.email "actions@users.noreply.github.com"
          git add 0[1-9]_ACPOS_*.docx __authority_extract__/SYSTEM_BINDING_CLOSURE_REPORT.json
          if git diff --cached --quiet; then
            echo "No Word changes"
            exit 0
          fi
          git commit -m "docs(acpos): materialize 01-09 exact construction bindings"
          git push
