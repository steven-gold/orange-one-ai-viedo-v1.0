name: VIS-11 tracker finalize
on:
  push:
    branches: [acpos-vis11-staging]
    paths: [.github/workflows/vis11-tracker-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis11-staging
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Apply and validate truthful tracker
        run: python .acpos-temp/vis11_tracker.py
      - name: Commit exact tracker and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "docs(vis11): mark IAM-01 visual complete"
          git rm .github/workflows/vis11-tracker-finalize.yml .acpos-temp/vis11_tracker.py
          git commit -m "chore(vis11): remove tracker finalize tools"
          git push origin HEAD:acpos-vis11-staging
