name: TEMP R9 0003 Catalog Materialize

on:
  push:
    branches: [r9-0003-catalog-materialize-20260904]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r9-0003-catalog-materialize-20260904
          fetch-depth: 1

      - name: Download verified R9 Authority package
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/r9-authority.zip \
            https://raw.githubusercontent.com/steven-gold/ORANGE_ONE_ACPOS_v1.0.x/develop/ACPOS_AI_SEQUENCED_SINGLE_AUTHORITY_CONSTRUCTION_PACKAGE.zip
          test "$(git hash-object /tmp/r9-authority.zip)" = "ef5ab5064c0cbd2ddbbaed6a977d0e5866d7ec0e"
          rm -rf /tmp/r9-authority
          mkdir -p /tmp/r9-authority
          unzip -q /tmp/r9-authority.zip -d /tmp/r9-authority
          MASTER="$(find /tmp/r9-authority -type f -name 'ACPOS_SINGLE_AUTHORITY_CONSTRUCTION_MASTER_AI_SEQUENCED_FINAL.yaml' -print -quit)"
          test -n "$MASTER"
          test "$(stat -c%s "$MASTER")" = "19351748"
          printf '%s\n' "$MASTER" > /tmp/r9-master-path

      - name: Extract exact Account Permission Catalog bytes
        run: |
          set -euo pipefail
          MASTER="$(cat /tmp/r9-master-path)"
          mkdir -p 06_permission
          MASTER="$MASTER" python3 - <<'PY'
          from pathlib import Path
          import hashlib, os

          master = Path(os.environ['MASTER'])
          lines = master.read_text(encoding='utf-8').splitlines(True)
          out = []
          grab = False
          for line in lines:
              if line.startswith('  account_permission_catalog:'):
                  grab = True
              elif grab and line.startswith('  service_identity_catalog:'):
                  break
              if grab:
                  out.append(line[2:] if line.startswith('  ') else line)

          if not out or not out[0].startswith('account_permission_catalog:'):
              raise SystemExit('CATALOG_SECTION_NOT_FOUND')

          payload = ''.join(out).encode('utf-8')
          expected_sha = 'e2a5f05867ba317ca968e8b71e8412e1b8d643392009d90ddee7cc1df325cb2c'
          actual_sha = hashlib.sha256(payload).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'CATALOG_SHA_MISMATCH:{actual_sha}')
          if len(payload) != 2762474:
              raise SystemExit(f'CATALOG_SIZE_MISMATCH:{len(payload)}')

          text = payload.decode('utf-8')
          resource_count = sum(1 for line in text.splitlines() if line.startswith('  - resource_id:'))
          sensitive_count = sum(1 for line in text.splitlines() if line.strip() == 'resource_type: SENSITIVE_PERMISSION')
          if resource_count != 3650:
              raise SystemExit(f'CATALOG_RESOURCE_COUNT_MISMATCH:{resource_count}')
          if sensitive_count != 2:
              raise SystemExit(f'CATALOG_SENSITIVE_COUNT_MISMATCH:{sensitive_count}')

          Path('06_permission/account_permission_catalog.yaml').write_bytes(payload)
          print('catalog_sha256=', actual_sha)
          print('catalog_bytes=', len(payload))
          print('resource_count=', resource_count)
          print('sensitive_count=', sensitive_count)
          PY

      - name: Commit exact catalog only
        run: |
          set -euo pipefail
          git config user.name "acpos-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 06_permission/account_permission_catalog.yaml
          git diff --cached --exit-code && { echo 'NO_CATALOG_CHANGE'; exit 0; } || true
          git commit -m "authority(permission): materialize exact account permission catalog"
          git push origin HEAD:r9-0003-catalog-materialize-20260904
