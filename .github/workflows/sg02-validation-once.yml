name: SG-02 validation once

on:
  pull_request:
    branches: [new]
    paths:
      - "src/domain/qaCriteria/**"
      - "src/components/pages/QaCriteriaVisual.tsx"
      - "src/components/pages/QaCriteriaVisual.module.css"
      - "authority/pages/admin/SG-02/**"
      - ".github/workflows/sg02-validation-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Authority and product guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          authority = Path('authority/pages/admin/SG-02/ACPOS_SG-02_QA_REVIEW_STANDARD_FINAL_LOCKED_ENCODING.yaml').read_text()
          port = Path('src/domain/qaCriteria/qaCriteriaRuntimePort.ts').read_text()
          visual = Path('src/components/pages/QaCriteriaVisual.tsx').read_text()
          states = ['LOADING','READY','EMPTY','ERROR','POLICY_BLOCKED','VERSION_CONFLICT','REVIEW_REQUIRED','EXTERNAL_PENDING','READ_ONLY','ARCHIVED']
          assert 'expected_control_count: 11' in authority
          assert 'effectful_runtime_ready: false' in authority
          assert 'data-authority-control-count="11"' in visual
          for state in states:
              assert f'- {state}' in authority, state
              assert f'"{state}"' in port, state
          assert 'SG02_PROJECTION_STATE_UNREGISTERED' in port
          assert 'new Set<QaCriteriaPageState>' in port
          print('AUTHORITY_GUARD_PASS states=10 controls=11 effectful_runtime_ready=false')
          PY
          git diff --exit-code origin/new -- src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css src/components/pages/QaCriteriaVisual.module.css

      - name: Residual scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|@ts-expect-error|debugger|console\.log|console\.debug' src/domain/qaCriteria/qaCriteriaRuntimePort.ts src/components/pages/QaCriteriaVisual.tsx; then
            echo 'Residual marker found' >&2
            exit 1
          fi

      - name: Product dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/sg02-next.log 2>&1 &
          echo $! >/tmp/sg02-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/admin/qa-criteria >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sg02-next.log
          exit 1

      - name: Verify production routes fail closed
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/projection.json -w '%{http_code}' http://127.0.0.1:3000/v1/ui-projections/admin%3ASG-02)
          test "$status" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/projection.json

          status=$(curl -sS -o /tmp/configure.json -w '%{http_code}' -X PATCH http://127.0.0.1:3000/v1/governance/resources/sg02-validation -H 'content-type: application/json' --data '{"resource_type":"quality_criteria_version","resource_id":"sg02-validation","config_patch_json":{},"reason":"validation"}')
          test "$status" = "503"
          grep -q 'IAM01_RUNTIME_NOT_BOUND' /tmp/configure.json

          status=$(curl -sS -o /tmp/approve.json -w '%{http_code}' -X POST http://127.0.0.1:3000/v1/governance/resources/sg02-validation/approve -H 'content-type: application/json' --data '{"resource_type":"quality_criteria_version","resource_id":"sg02-validation","rationale":"validation"}')
          test "$status" = "503"
          grep -q 'IAM01_RUNTIME_NOT_BOUND' /tmp/approve.json
          echo 'FAIL_CLOSED_RUNTIME_PASS projection=503 configure=503 approve=503'

      - name: Install temporary browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          git diff --exit-code -- package.json package-lock.json

      - name: Chromium browser smoke and authority-state rejection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const width of [1280, 1440, 1920]) {
              const page = await browser.newPage({ viewport: { width, height: 1080 } });
              const pageErrors = [];
              const requestFailures = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              page.on('requestfailed', r => requestFailures.push(`${r.method()} ${r.url()} ${r.failure()?.errorText || ''}`));
              await page.goto('http://127.0.0.1:3000/admin/qa-criteria', { waitUntil: 'networkidle' });
              const controls = await page.locator('[data-control-id]').count();
              if (controls !== 11) throw new Error(`width ${width}: controls=${controls}`);
              const body = await page.locator('body').innerText();
              if (!body.includes('UI_PROJECTION_RUNTIME_NOT_BOUND')) throw new Error(`width ${width}: missing projection fail-closed UX`);
              const overflow = await page.evaluate(() => Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth));
              if (overflow !== 0) throw new Error(`width ${width}: overflow=${overflow}`);
              const readControls = page.locator('[data-operation-id="getUiProjection"]');
              const readCount = await readControls.count();
              if (readCount !== 9) throw new Error(`width ${width}: getUiProjection controls=${readCount}`);
              for (let i = 0; i < 8; i++) {
                await readControls.nth(i).click();
                await page.locator('[data-detail-drawer="SG-02"]').waitFor({ state: 'visible' });
                await page.locator('[data-detail-drawer="SG-02"] button[aria-label="Close"]').click();
              }
              if (pageErrors.length) throw new Error(`width ${width}: pageerrors=${pageErrors.join(' | ')}`);
              if (requestFailures.length) throw new Error(`width ${width}: requestfailures=${requestFailures.join(' | ')}`);
              console.log(`BROWSER_WIDTH_PASS width=${width} controls=11 overflow=0 pageerrors=0 requestfailures=0`);
              await page.close();
            }

            const page = await browser.newPage({ viewport: { width: 1440, height: 1080 } });
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            await page.route('**/v1/ui-projections/admin%3ASG-02', async route => {
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ page_state: 'UNREGISTERED_STATE', values: {}, control_enabled: {} }),
              });
            });
            await page.goto('http://127.0.0.1:3000/admin/qa-criteria', { waitUntil: 'networkidle' });
            const body = await page.locator('body').innerText();
            if (!body.includes('SG02_PROJECTION_ADAPTER_REJECTED')) throw new Error('unregistered state did not fail closed');
            const state = await page.locator('[data-page-uid="admin:SG-02"]').getAttribute('data-page-state');
            if (state !== 'READ_ONLY') throw new Error(`unexpected fallback page state ${state}`);
            if (pageErrors.length) throw new Error(`invalid-state pageerrors=${pageErrors.join(' | ')}`);
            console.log('UNREGISTERED_STATE_FAIL_CLOSED_PASS');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Repository diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json
          changed=$(git diff --name-only origin/new...HEAD | sort)
          echo "$changed"
          echo "$changed" | grep -qx '.github/workflows/sg02-validation-once.yml'
          echo "$changed" | grep -qx 'src/domain/qaCriteria/qaCriteriaRuntimePort.ts'
          test "$(echo "$changed" | sed '/^$/d' | wc -l)" = "2"
