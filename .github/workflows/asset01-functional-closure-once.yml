  'ASSET-01-FLD-ROUTE':'TEST-ROUTE-TEXT_TO_IMAGE','ASSET-01-FLD-PROVIDER':s.provider,'ASSET-01-FLD-JOB':s.job_id??'—','ASSET-01-FLD-ATTEMPT':String(s.attempt),'ASSET-01-FLD-CALLBACK':s.callback,'ASSET-01-FLD-RETRY-ELIGIBILITY':s.failed?'ELIGIBLE':'NOT_ELIGIBLE','ASSET-01-FLD-TRACE':`TEST_ONLY | ${s.last_event}`,
