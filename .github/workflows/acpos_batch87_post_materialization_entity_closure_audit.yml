name: ACPOS Batch 87 Post-Materialization Entity Closure Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch87_post_materialization_entity_closure_audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fresh read current Word entity applicability and hierarchy closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="47c5f279d32d0f0c62d6fb670ef5cc1751d40fd8"
          WF=Path(".github/workflows/acpos_batch87_post_materialization_entity_closure_audit.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          OPS=[
            "DISCOVER_OR_LIST","SELECT_OR_OPEN","CREATE","CREATION_MODE","PARENT_BIND",
            "CATEGORY_OR_GROUP_BIND","DRAFT","RESUME","EDIT","SAVE","VALIDATE",
            "CONFIRM_OR_APPROVE","VERSION","REVISE","LOCK_OR_UNLOCK","REORDER",
            "MOVE_OR_REPARENT","ARCHIVE_OR_DELETE","RESTORE","DEPENDENCY_IMPACT",
            "AUDIT","ERROR_RECOVERY","NEXT_STEP",
          ]
          HIER_HEADERS=[
            "Parent Identity","Child Identity","Cardinality","Creation Entry",
            "Payload / Reference Binding","Ordering Semantics","Permission",
            "State Dependency","Version Dependency","Move / Reparent",
            "Archive / Delete Propagation","Upstream Change Impact",
            "Downstream Revalidation","Authority Evidence"
          ]
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          def norm(s): return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def txt(el): return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def parse(fn):
              with zipfile.ZipFile(fn) as z:
                  root=ET.fromstring(z.read("word/document.xml"))
              tables=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs: continue
                  rows=[]
                  for tr in trs:
                      rows.append([txt(c) for c in list(tr) if c.tag==W+"tc"])
                  tables.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return tables

          all_docs=sorted(Path(".").glob("*.docx"))
          if len(all_docs)!=31: raise SystemExit(f"DOCX_COUNT_FAIL {len(all_docs)}")

          app_rows=[]
          app_tables=[]
          hier_rows=[]
          hier_tables=[]
          residual_compound=[]
          duplicate_entity_op=[]
          invalid_app=[]
          missing_evidence=[]

          forbidden_exact={
            "AssistantSummary / CoreEvaluation","ConversationThread / Message",
            "HumanDecision / StructuredDecision","Campaign / Audience",
            "Discovery Profile / Topic","KnowledgeAcquisitionIntent / Run",
            "Conversation / Thread"
          }

          for page,fn in PAGE_DOCS.items():
              tables=parse(fn)
              # Residual exact compound scan over all table cells.
              for t in tables:
                  for row in t["rows"]:
                      for cell in row:
                          if norm(cell) in forbidden_exact:
                              residual_compound.append({"page":page,"file":fn,"table":t["table"],"value":norm(cell)})

              for t in tables:
                  h=[norm(x) for x in t["headers"]]
                  if h==["Entity","Operation","Applicability","Authority Evidence"]:
                      app_tables.append({"page":page,"file":fn,"table":t["table"],"rows":len(t["rows"])})
                      for ri,row in enumerate(t["rows"],2):
                          if len(row)<4: 
                              invalid_app.append({"page":page,"table":t["table"],"row":ri,"reason":"ROW_TOO_SHORT","cells":row}); continue
                          e,o,a,ev=map(norm,row[:4])
                          rec={"page":page,"file":fn,"table":t["table"],"row":ri,"entity":e,"operation":o,"applicability":a,"authority_evidence":ev}
                          app_rows.append(rec)
                          if not e or o not in OPS or a not in {"REQUIRED","OPTIONAL","NOT_APPLICABLE"}:
                              invalid_app.append({**rec,"reason":"INVALID_REQUIRED_FIELD"})
                          if not ev:
                              missing_evidence.append(rec)
                  if h==HIER_HEADERS:
                      hier_tables.append({"page":page,"file":fn,"table":t["table"],"rows":len(t["rows"])})
                      for ri,row in enumerate(t["rows"],2):
                          vals=[norm(x) for x in row[:len(HIER_HEADERS)]]
                          rec={"page":page,"file":fn,"table":t["table"],"row":ri}
                          for k,v in zip(HIER_HEADERS,vals): rec[k]=v
                          hier_rows.append(rec)

          # Exact denominator checks.
          by_pair=collections.Counter((x["page"],x["entity"],x["operation"]) for x in app_rows)
          duplicate_entity_op=[
            {"page":p,"entity":e,"operation":o,"count":n}
            for (p,e,o),n in by_pair.items() if n!=1
          ]
          entities=sorted(set((x["page"],x["entity"]) for x in app_rows))
          by_entity=collections.defaultdict(set)
          for x in app_rows: by_entity[(x["page"],x["entity"])].add(x["operation"])
          entity_op_incomplete=[
            {"page":p,"entity":e,"operation_count":len(ops),"missing_operations":sorted(set(OPS)-ops)}
            for (p,e),ops in sorted(by_entity.items()) if ops!=set(OPS)
          ]
          counts=collections.Counter(x["applicability"] for x in app_rows)
          by_page=collections.Counter(x["page"] for x in app_rows)
          pages_without_matrix=sorted(set(PAGE_DOCS)-set(x["page"] for x in app_tables))

          # Hierarchy: if a canonical 14-column hierarchy table exists, every row must
          # have every field. If relationship prose exists without a canonical table,
          # it is not silently credited here.
          hier_incomplete=[]
          for x in hier_rows:
              miss=[k for k in HIER_HEADERS if not norm(x.get(k,""))]
              if miss: hier_incomplete.append({"page":x["page"],"table":x["table"],"row":x["row"],"missing_fields":miss})

          # Search entity-hierarchy-ish tables that are not canonical 14-field tables.
          noncanonical_hierarchy_tables=[]
          for page,fn in PAGE_DOCS.items():
              for t in parse(fn):
                  hu=" | ".join(norm(x).upper() for x in t["headers"])
                  if ("PARENT" in hu and "CHILD" in hu) or ("父" in hu and "子" in hu):
                      if [norm(x) for x in t["headers"]]!=HIER_HEADERS:
                          noncanonical_hierarchy_tables.append({"page":page,"file":fn,"table":t["table"],"headers":t["headers"]})

          summary={
            "marker":"ACPOS-20260922-BATCH-87-POST-MATERIALIZATION-ENTITY-CLOSURE-AUDIT-V1",
            "base_head":EXPECTED_PARENT,
            "docx_files":len(all_docs),
            "page_docs":len(PAGE_DOCS),
            "applicability_tables":len(app_tables),
            "pages_without_applicability_matrix":pages_without_matrix,
            "applicability_rows":len(app_rows),
            "unique_business_entities_from_matrix":len(entities),
            "operation_types":len(OPS),
            "required":counts.get("REQUIRED",0),
            "optional":counts.get("OPTIONAL",0),
            "not_applicable":counts.get("NOT_APPLICABLE",0),
            "invalid_applicability_rows":len(invalid_app),
            "missing_authority_evidence_rows":len(missing_evidence),
            "duplicate_entity_operation_pairs":len(duplicate_entity_op),
            "entity_operation_incomplete":len(entity_op_incomplete),
            "residual_forbidden_compound_rows":len(residual_compound),
            "hierarchy_tables":len(hier_tables),
            "hierarchy_rows":len(hier_rows),
            "hierarchy_rows_incomplete":len(hier_incomplete),
            "noncanonical_parent_child_tables":len(noncanonical_hierarchy_tables),
            "applicability_rows_by_page":dict(by_page),
          }

          out={
            "summary":summary,
            "applicability_tables":app_tables,
            "invalid_applicability_rows":invalid_app,
            "missing_authority_evidence_rows":missing_evidence,
            "duplicate_entity_operation_pairs":duplicate_entity_op,
            "entity_operation_incomplete":entity_op_incomplete,
            "residual_forbidden_compound_rows":residual_compound,
            "hierarchy_tables":hier_tables,
            "hierarchy_rows":hier_rows,
            "hierarchy_rows_incomplete":hier_incomplete,
            "noncanonical_parent_child_tables":noncanonical_hierarchy_tables,
          }
          Path("__batch87_entity_closure_audit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch87_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH87_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH87_NONCANONICAL_HIERARCHY="+json.dumps(noncanonical_hierarchy_tables,ensure_ascii=False))

          # Applicability closure is hard-gated. Hierarchy findings are emitted and
          # only pass when canonical hierarchy rows are field-complete and no older
          # parent/child table remains as an unresolved parallel denominator.
          if len(app_rows)!=2300: raise SystemExit("APPLICABILITY_DENOMINATOR_FAIL")
          if len(entities)!=100: raise SystemExit("BUSINESS_ENTITY_COUNT_FAIL")
          if pages_without_matrix: raise SystemExit("PAGE_MATRIX_MISSING")
          if invalid_app or missing_evidence or duplicate_entity_op or entity_op_incomplete or residual_compound:
              raise SystemExit("APPLICABILITY_CLOSURE_FAIL")
          if hier_incomplete or noncanonical_hierarchy_tables:
              raise SystemExit("HIERARCHY_CLOSURE_FAIL")
          print("BATCH87_ENTITY_APPLICABILITY_AND_HIERARCHY_CLOSED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acpos-batch87-post-materialization-entity-closure-audit
          path: |
            __batch87_entity_closure_audit.json
            __batch87_summary.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Close harness on success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch87_entity_closure_audit.json __batch87_summary.json
          git config user.name "acpos-batch87-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch87_post_materialization_entity_closure_audit.yml
          git commit -m "chore(acpos): close batch 87 post-materialization entity audit"
          git push origin HEAD:0921acpos
