exact_scope:
  purpose: >-
    Harden the existing reusable Mother Governance and existing Current machine owners so every conversation and execution cycle resolves Current Truth and the primary task layer before any current-state judgment or effectful work, and so governance-maintenance work cannot be confused with a product Stage work unit or receive product completion credit.
  permitted_normative_changes:
    - Reconcile all four Mother documents as one successor package; preserve existing requirements and add only missing task-context closure rules.
    - Add one mandatory SESSION_BOOTSTRAP_RESUME_GATE with ordered live repository/branch/head, Registry/Current entry, Mother 01 through 04, Current Canonical Authority, task layer, Work Unit/owner, Resume, Evidence, selected profile and entry/DoD/gate/transition resolution.
    - Add fail-closed behavior for missing, stale, ambiguous or contradictory Current identity, authority, owner, resume, evidence, revision or reference.
    - Add TASK_LAYER_CLASSIFICATION separating GOVERNANCE_MAINTENANCE, PRODUCT_STAGE_EXECUTION, TEST_OR_VALIDATION_MAINTENANCE, EVIDENCE_STATE_MAINTENANCE and DEPLOYMENT_OR_PRODUCTION.
    - Lock the primary task so Stage/profile/run identities cannot redefine Current Governance or silently redirect the requested governance-maintenance task into a product Stage.
    - Add WORK_UNIT_RESOLUTION_GATE when no legal Active Work Unit exists; successor derivation may use registered Authority, authorized change request, impact, dependency and applicability evidence only; AI invention is forbidden.
    - Prohibit governance cleanup, validator/harness repair, evidence/state repair, reference repair and CI/gate repair from receiving product-stage gap reduction or product completion credit.
    - Strengthen stale/deleted/superseded owner fail-closed behavior and complete active/transitive reference reconciliation.
    - Require observed outer terminal conclusion for terminal closure credit; inner-step success or in-progress workflow is never terminal PASS.
    - Update only the existing canonical machine owners for execution-cycle and validation/remediation/closure policy; do not create a parallel policy component.
  permitted_supporting_changes:
    - .github/governance-source/active/source/** only for authorized Mother successor, section/management machine bindings, compiled baseline, root-manifest, checksum and source-identity synchronization
    - .github/governance-source/VERIFY_SOURCE_IDENTITY.py
    - .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
    - governance/specifications/current/**
    - governance/specifications/REGISTRY.yaml
    - GOVERNANCE_CURRENT.yaml
    - governance/ci/**
    - governance/test/**
    - temporary governance-maintenance materializer/workflow that must delete itself in the successor commit
  excluded_scope:
    - ACPOS product or business behavior changes
    - Supplying unresolved Stage-02 product or external Authority values
    - Product materialization or product gap remediation
    - Entering any product Stage as the primary task
    - Stage-03 progression
    - Website feature construction
    - Production deployment
    - Deleting valid historical provenance

