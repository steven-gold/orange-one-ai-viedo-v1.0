  - index: 28
    style: Heading 2
    text: 8.1 Source → Approved Knowledge
  - index: 29
    style: Normal
    text: Intent → Authorized Scope → Create/Select KnowledgeSource → Rights/Classification/Freshness/Retention Validation → Acquisition Intent → Shared Runtime Job
      → Immutable Snapshot → Normalize → Evidence/Citation → Search/Review → Knowledge Draft → Version Diff → Mandatory Checks → Human Decision → Approved Version
      → Eligible Context Input。
  - index: 30
    style: Heading 2
    text: 8.2 Search → Context Candidate
  - index: 31
    style: Normal
    text: Query + Scope → Authorized Search Results → Select exact refs → Open Citation/Evidence → Local Basket add/remove → Purpose + Scope → Conflict / Version
      / Classification Gate → Create ACPOSContextCandidate → READY_FOR_CONSUMER_REVIEW → Consumer-domain adoption。
  - index: 32
    style: Heading 2
    text: 8.3 Real Execution → Learning
  - index: 33
    style: Normal
    text: Real Execution → ACPOSExperienceRecord → Outcome Completeness → Replay exact lineage → Compare Attempt/Version → Root Cause / Pattern → Create Learning
      Candidate → Governed review outside KB or create Knowledge Draft → Human Knowledge Review。
