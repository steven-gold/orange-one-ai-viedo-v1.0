name: ACPOS Batch 114 Normalized Basic Design Functional Completeness Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch114_normalized_basic_design_functional_completeness_audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Audit planning and basic-design specification coverage only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="8500a8b0bb5814b6c02df4dbf150d731be75eb9f"
          WF=Path(".github/workflows/acpos_batch114_normalized_basic_design_functional_completeness_audit.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          SYSTEM_DOCS={
            "SYSTEM-01":"01_ACPOS_Global_Intelligent_Brain_Information_Lifecycle_Mother_Basic_Logic_Design_Normative_Contract_v4.docx",
            "SYSTEM-02":"02_ACPOS_AI_Conversation_Memory_MultiAI_Assistant_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-03":"03_ACPOS_AI_Execution_Script_Compiler_Tool_AIAPI_Runtime_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-04":"04_ACPOS_CORE_AI_Blueprint_Canonical_Script_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-05":"05_ACPOS_Creative_Production_AI_ASSET_VIDEO_EDIT_VOICE_QA_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-06":"06_ACPOS_Enterprise_Business_Development_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-07":"07_ACPOS_Social_Publishing_AI_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-08":"08_ACPOS_Strategy_Intelligence_MultiAI_Decision_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
            "SYSTEM-09":"09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx",
          }
          GLOBAL_DOCS={
            "INDEX":"00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx",
            "HOME":"ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx",
            "LOGIN":"ACPOS_LOGIN_IDENTITY_ENTRY_Mother_Basic_Design_OPTIMIZED.docx",
            "GLOBAL-INTEGRATION":"ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx",
          }
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          def n(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def txt(el):return n("".join((x.text or "") for x in el.iter(W+"t")))
          def extract(fn):
              with zipfile.ZipFile(fn) as z:root=ET.fromstring(z.read("word/document.xml"))
              units=[]
              tables=[]
              for pi,p in enumerate(root.iter(W+"p"),1):
                  s=txt(p)
                  if s:units.append({"kind":"P","loc":pi,"text":s})
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[]
                  for ri,tr in enumerate(trs,1):
                      row=[txt(c) for c in list(tr) if c.tag==W+"tc"]
                      rows.append(row)
                      s=" | ".join(row)
                      if s:units.append({"kind":f"T{ti}","loc":ri,"text":s})
                  tables.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return "\n".join(x["text"] for x in units),units,tables
          def hit(text,pats):
              return any(re.search(p,text,re.I) for p in pats)
          def group_score(text,groups):
              return sum(1 for pats in groups if hit(text,pats))
          def ev(units,pats,limit=3):
              out=[]
              for u in units:
                  if hit(u["text"],pats):
                      out.append({"loc":f'{u["kind"]}:{u["loc"]}',"text":u["text"][:420]})
                      if len(out)>=limit:break
              return out

          PAGE_RULES={
            "REQUIREMENT_DEFINITION":{
              "groups":[
                [r"BUSINESS GOAL",r"PRODUCT GOAL",r"PURPOSE",r"頁面定位",r"產品目標"],
                [r"TARGET USER",r"PRIMARY USER",r"USER / ROLE",r"使用者",r"角色"],
                [r"FUNCTIONAL REQUIRE",r"REQUIRED OPERATION",r"CAPABILIT",r"功能需求",r"功能"],
                [r"NON[- ]?FUNCTIONAL",r"A11Y",r"I18N",r"SECURITY",r"IDEMPOT",r"AUDIT",r"非功能"],
                [r"OUT[- ]?OF[- ]?SCOPE",r"NO DUPLICATE",r"不得建立",r"禁止"]
              ],"need":4
            },
            "ARCHITECTURE_NAV_FLOW":{
              "groups":[
                [r"ARCHITECTURE",r"MODULE",r"SYSTEM BOUNDARY",r"架構",r"模組"],
                [r"DEPENDENC",r"SHARED OWNER",r"OWNER / BOUNDARY",r"依賴",r"邊界"],
                [r"NAVIGATION",r"ROUTE",r"ENTRY",r"RETURN",r"HANDOFF",r"導航",r"路由",r"入口"],
                [r"USER FLOW",r"BUSINESS FLOW",r"REQUIRED CHAIN",r"FLOW",r"流程"],
                [r"DATA FLOW",r"PAYLOAD",r"INPUT SOURCE",r"資料流",r"輸入"]
              ],"need":4
            },
            "PAGE_REGISTRY_IDENTITY":{
              "groups":[
                [r"PAGE UID",r"PAGE IDENTITY"],
                [r"CANONICAL NAME",r"DISPLAY NAME",r"頁面名稱"],
                [r"ROUTE",r"ENTRY"],
                [r"REQUIRED PERMISSION",r"PERMISSION"],
                [r"OWNER",r"DESIGN OWNER",r"IMPLEMENTATION OWNER"]
              ],"need":4
            },
            "DESIGN_SYSTEM_LAYOUT":{
              "groups":[
                [r"COLOR TOKEN",r"COLOR",r"色彩",r"科技紫"],
                [r"TYPOGRAPHY",r"FONT",r"字體"],
                [r"SPACING",r"GAP",r"PADDING",r"間距"],
                [r"GRID",r"CONTAINER",r"LAYOUT",r"版面"],
                [r"BREAKPOINT",r"RESPONSIVE",r"RWD",r"響應式"]
              ],"need":4
            },
            "CONTROL_SPEC":{
              "groups":[
                [r"CONTROL UID"],
                [r"CANONICAL NAME",r"LABEL KEY",r"LABEL"],
                [r"TYPE"],
                [r"POSITION",r"DIMENSION",r"WIDTH",r"HEIGHT"],
                [r"DEFAULT STATE",r"HOVER STATE",r"FOCUS STATE",r"ACTIVE STATE",r"LOADING STATE",r"DISABLED STATE"],
                [r"ERROR STATE",r"SUCCESS STATE"],
                [r"VISIBILITY",r"PERMISSION REFERENCE",r"ACTION REFERENCE",r"PERMISSION",r"ACTION"]
              ],"need":5
            },
            "FIELD_SPEC":{
              "groups":[
                [r"FIELD UID"],
                [r"CANONICAL NAME",r"LABEL KEY",r"LABEL"],
                [r"PLACEHOLDER",r"DEFAULT VALUE"],
                [r"REQUIRED",r"VALIDATION RULE",r"LENGTH",r"RANGE"],
                [r"READ[- ]?ONLY",r"DISABLED"],
                [r"PERMISSION",r"LOCALIZATION",r"I18N"]
              ],"need":4
            },
            "ENTITY_LIFECYCLE_HIERARCHY":{
              "groups":[
                [r"ENTITY",r"BUSINESS ENTITY"],
                [r"OPERATION",r"APPLICABILITY"],
                [r"PARENT IDENTITY",r"CHILD IDENTITY",r"HIERARCHY",r"父層",r"子層"],
                [r"STATE",r"VERSION",r"LIFECYCLE",r"狀態",r"版本",r"生命週期"]
              ],"need":3
            },
            "FUNCTIONAL_CHAIN_PLANNING":{
              "groups":[
                [r"BUSINESS INTENT",r"INTENT"],
                [r"PRECONDITION",r"ENTRY"],
                [r"CONTROL",r"TRIGGER"],
                [r"GATE",r"PERMISSION"],
                [r"ACTION",r"VALIDATION"],
                [r"PAYLOAD",r"INPUT / OUTPUT",r"INPUT SOURCE"],
                [r"OWNER",r"DATA",r"PROVIDER"],
                [r"AUDIT",r"FEEDBACK",r"RESPONSE"],
                [r"SUCCESS STATE",r"NEXT STATE",r"NEXT STEP"],
                [r"FAILURE",r"RETRY",r"RECOVERY",r"ROLLBACK"]
              ],"need":7
            },
            "CROSS_PAGE_FLOW":{
              "groups":[
                [r"CROSS[- ]?PAGE",r"SHARED OWNER",r"HANDOFF",r"跨頁"],
                [r"SOURCE PAGE",r"EXIT STATE",r"EXPORT"],
                [r"TARGET PAGE",r"TARGET ENTRY",r"ENTRY STATE"],
                [r"NAVIGATION",r"ROUTING",r"BACK",r"CANCEL"],
                [r"PERMISSION",r"FAILURE",r"RESUME"],
                [r"AUDIT",r"EVIDENCE"]
              ],"need":3
            },
            "INTERACTION_TOPOLOGY_CONTINUITY":{
              "groups":[
                [r"FUNCTIONAL WORKBENCH",r"WORKBENCH",r"WORKSPACE",r"工作台"],
                [r"INTERACTION TOPOLOGY",r"ADJACENC",r"SEPARATION",r"互動拓撲"],
                [r"CONTEXT",r"STATE CONTINUITY",r"THREAD",r"CONVERSATION",r"上下文",r"對話"],
                [r"HANDOFF",r"NEXT STEP",r"NEXT ACTION"],
                [r"AI",r"ASSISTANT",r"MULTI[- ]?AI",r"AI IDENTITY"]
              ],"need":2
            },
            "VISUAL_GEOMETRY":{
              "groups":[
                [r"VIEWPORT",r"BREAKPOINT"],
                [r"CONTAINER",r"GRID",r"GUTTER",r"MARGIN"],
                [r"WIDTH",r"HEIGHT",r"MIN",r"MAX",r"DIMENSION"],
                [r"GAP",r"PADDING",r"ALIGN"],
                [r"OVERFLOW",r"SCROLL",r"WRAP",r"STACK",r"COLLAPSE"],
                [r"Z[- ]?ORDER",r"OVERLAY"],
                [r"TEXT CAPACITY",r"TRUNCATION",r"ELLIPSIS"],
                [r"ASPECT RATIO",r"OBJECT[- ]?FIT",r"OBJECT[- ]?POSITION"],
                [r"TOLERANCE",r"DIFF THRESHOLD"]
              ],"need":6
            },
            "VISUAL_ANCHOR_PREVIEW":{
              "groups":[
                [r"VISUAL ANCHOR",r"ANCHOR UID"],
                [r"POSITION RULE",r"DIMENSION RULE",r"RELATIONSHIP RULE",r"LOCK STATUS"],
                [r"CANONICAL VISUAL",r"CURRENT CANONICAL VISUAL",r"VISUAL UID"],
                [r"GENERATION MANIFEST",r"GENERATION UID"],
                [r"VISUAL PREVIEW",r"PREVIEW"],
                [r"VISUAL REVIEW",r"VISUAL APPROVED",r"APPROVAL STATUS"],
                [r"VISUAL DRIFT",r"CHANGE SET"]
              ],"need":4
            },
            "ASSET_BINDING":{
              "groups":[
                [r"ASSET UID",r"ASSET REGISTRY"],
                [r"ASSET TYPE",r"FILE REFERENCE",r"SOURCE TYPE"],
                [r"WIDTH",r"HEIGHT",r"ASPECT RATIO"],
                [r"CROP",r"OBJECT FIT",r"OBJECT POSITION"],
                [r"ASSET BIND",r"COMPONENT UID",r"SECTION UID"],
                [r"LOCK",r"APPROVED",r"STATUS"]
              ],"need":3
            },
            "A11Y_I18N":{
              "groups":[
                [r"A11Y",r"ACCESSIBILITY",r"ARIA",r"KEYBOARD",r"FOCUS",r"無障礙"],
                [r"I18N",r"LOCALIZATION",r"LANGUAGE",r"語系",r"多語"]
              ],"need":2
            },
            "AUDIT_ACCEPTANCE_DOD":{
              "groups":[
                [r"AUDIT UID",r"AUDIT BASELINE",r"AUDIT ITEM"],
                [r"ACCEPTANCE MATRIX",r"ACCEPTANCE"],
                [r"REQUIRED",r"OPTIONAL",r"NOT_APPLICABLE"],
                [r"PASS CONDITION",r"PARTIAL CONDITION",r"FAIL CONDITION"],
                [r"REQUIRED TEST",r"REQUIRED EVIDENCE",r"REQUIRED GATE"],
                [r"DEFINITION OF DONE",r"\bDOD\b"]
              ],"need":4
            },
            "DESIGN_FREEZE_PACKAGE":{
              "groups":[
                [r"DESIGN FREEZE",r"DESIGN_FROZEN",r"FREEZE"],
                [r"LAYOUT MAPPING",r"COMPONENT MAPPING"],
                [r"CONTROL / FIELD MAPPING",r"CONTROL.*FIELD"],
                [r"ASSET MAPPING"],
                [r"RESPONSIVE SPEC"],
                [r"CURRENT CANONICAL VISUAL",r"CANONICAL VISUAL"],
                [r"GENERATION MANIFEST"],
                [r"AUDIT BASELINE",r"ACCEPTANCE MATRIX"],
                [r"DEFINITION OF DONE"],
                [r"DESIGN VERSION",r"VERSION"]
              ],"need":6
            },
          }

          docs={}
          for page,fn in PAGE_DOCS.items():
              full,units,tables=extract(fn)
              docs[page]={"file":fn,"text":full,"units":units,"tables":tables}

          page_results={}
          missing=[]
          for page,d in docs.items():
              checks={}
              for name,rule in PAGE_RULES.items():
                  s=group_score(d["text"],rule["groups"])
                  ok=s>=rule["need"]
                  checks[name]={"pass":ok,"score":s,"need":rule["need"]}
                  if not ok:
                      # gather evidence for every partially-hit group to support manual review
                      evidence=[]
                      for gi,pats in enumerate(rule["groups"],1):
                          e=ev(d["units"],pats,1)
                          if e:evidence.append({"group":gi,"hit":e[0]})
                      missing.append({"page":page,"check":name,"score":s,"need":rule["need"],"evidence":evidence})
              page_results[page]=checks

          # Exact current materializations that are design-planning content.
          app_tables=app_rows=hier_tables=hier_rows=0
          for page,d in docs.items():
              for t in d["tables"]:
                  h=[n(x) for x in t["headers"]]
                  if h==["Entity","Operation","Applicability","Authority Evidence"]:
                      app_tables+=1;app_rows+=len(t["rows"])
                  if h==[
                    "Parent Identity","Child Identity","Cardinality","Creation Entry",
                    "Payload / Reference Binding","Ordering Semantics","Permission",
                    "State Dependency","Version Dependency","Move / Reparent",
                    "Archive / Delete Propagation","Upstream Change Impact",
                    "Downstream Revalidation","Authority Evidence"
                  ]:
                      hier_tables+=1;hier_rows+=len(t["rows"])

          # Supporting system/global design docs: only static planning/design contract domains.
          support_files={**SYSTEM_DOCS,**GLOBAL_DOCS}
          support_missing=[]
          SUPPORT_RULES={
            "OWNER_BOUNDARY":[r"OWNER",r"BOUNDARY"],
            "DEPENDENCY_REFERENCE":[r"DEPENDENC",r"REFERENCE",r"SHARED"],
            "DESIGN_CONTRACT":[r"DESIGN",r"CONTRACT",r"SPEC"],
            "AUDIT_ACCEPTANCE":[r"AUDIT",r"ACCEPTANCE",r"EVIDENCE"],
          }
          for uid,fn in support_files.items():
              full,_,_=extract(fn)
              for name,pats in SUPPORT_RULES.items():
                  if not hit(full,pats):
                      support_missing.append({"document":uid,"check":name})

          # EDIT precision/grouped timeline exact closure checks
          edit_text=docs["EDIT-01"]["text"]
          sys05_full,_,_=extract(SYSTEM_DOCS["SYSTEM-05"])
          global_full,_,_=extract(GLOBAL_DOCS["GLOBAL-INTEGRATION"])
          precision_required=[
            "[ACPOS-EDIT-01-GROUPED-PRECISION-TIMELINE-V1]",
            "[ACPOS-EDIT-01-LEGACY-VISUAL-SUPERSESSION-V1]",
            "EDIT-01-TG-VISUAL","EDIT-01-TG-AUDIO","EDIT-01-TG-DIALOGUE",
            "MILLISECOND / SUBFRAME / SAMPLE","time_numerator:int64",
            "Video edit MUST remain frame-aligned","collapse/expand changes appearance only"
          ]
          precision_missing=[x for x in precision_required if x not in edit_text]
          legacy_residual=[
            x for x in [
              "min-height 320px; Video/Overlay/Voice/Music/SFX/Subtitle/LipSync + Dialogue Binding Guard",
              "AUDIO/SYNC 畫面把 Voice/Music/SFX/Subtitle/LipSync 放在同一 Timeline"
            ] if x in edit_text
          ]
          system_precision_missing=[x for x in [
            "[ACPOS-SYS05-EDIT-PRECISION-TIME-PIPELINE-V1]",
            "CanonicalTimePoint","PrecisionEditContext","TIMEBASE_UNRESOLVED","CONVERSION_DRIFT_DETECTED"
          ] if x not in sys05_full]
          global_precision_missing=[x for x in [
            "[ACPOS-GLOBAL-CANONICAL-TIME-INTEGRATION-V1]",
            "Single time truth","Display-unit independence","Cross-stage handoff","Failure propagation"
          ] if x not in global_full]
          if precision_missing or legacy_residual or system_precision_missing or global_precision_missing:
              raise SystemExit("EDIT_PRECISION_CLOSURE_FAIL "+repr({
                "edit_missing":precision_missing,"legacy_residual":legacy_residual,
                "system_missing":system_precision_missing,"global_missing":global_precision_missing
              }))

          # Deep internal-function/system completeness audit.
          # This is stricter than coverage: an explicit fail-closed Authority Gap is
          # safe, but it is still NOT counted as functionally complete.
          all_specs={**PAGE_DOCS,**SYSTEM_DOCS,**GLOBAL_DOCS}
          all_extracted={}
          for uid,fn in all_specs.items():
              all_extracted[uid]=extract(fn)

          gap_markers=[
            r"AUTHORITY_GAP_BLOCKED",r"INTENTIONAL_FAIL_CLOSED_AUTHORITY_GAP",
            r"SOURCE_NOT_DEFINED",r"RESOLVE_FROM_[A-Z0-9_]+",
            r"NO_AUTHORIZED_[A-Z0-9_]+",r"OWNER_UNDEFINED",
            r"BLOCKED_NO_CANONICAL_[A-Z0-9_]+"
          ]
          critical_headers={
            "Action UID","Gate","Permission / Auth Resource","Permission",
            "Operation","Runtime Owner","Persistence Owner",
            "Current Runtime Owner","Current Persistence Owner",
            "Runtime Status","Current status"
          }
          critical_missing=[]
          authority_gap_rows=[]
          uid_field_values=collections.defaultdict(lambda:collections.defaultdict(list))
          prose_gap_candidates=[]
          uid_re=re.compile(r"^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+){1,}(?:[._][A-Z0-9]+)*$")

          for doc_uid,(full,units,tables) in all_extracted.items():
              fn=all_specs[doc_uid]
              for u in units:
                  if any(re.search(p,u["text"],re.I) for p in gap_markers):
                      prose_gap_candidates.append({"document":doc_uid,"file":fn,"loc":f'{u["kind"]}:{u["loc"]}',"text":u["text"][:520]})
              for t in tables:
                  h=[n(x) for x in t["headers"]]
                  if "Control UID" not in h:
                      continue
                  ci=h.index("Control UID")
                  for ri,row in enumerate(t["rows"],2):
                      row=[n(x) for x in row]
                      if ci>=len(row) or not row[ci]:
                          continue
                      ident=row[ci]
                      if not uid_re.match(ident.upper()):
                          continue
                      amap={h[i]:row[i] if i<len(row) else "" for i in range(len(h))}
                      # Only contract tables that actually declare these dimensions.
                      for fld in sorted(critical_headers.intersection(amap)):
                          val=n(amap.get(fld,""))
                          # Empty canonical functional fields are incomplete unless the
                          # row itself is explicitly NOT_APPLICABLE.
                          status=" | ".join([amap.get("Runtime Status",""),amap.get("Current status","")]).upper()
                          if not val and "NOT_APPLICABLE" not in status:
                              critical_missing.append({"document":doc_uid,"file":fn,"control_uid":ident,"field":fld,"table":t["table"],"row":ri})
                          if val and any(re.search(p,val,re.I) for p in gap_markers):
                              authority_gap_rows.append({"document":doc_uid,"file":fn,"control_uid":ident,"field":fld,"value":val,"table":t["table"],"row":ri})
                          if fld in {"Operation","Runtime Owner","Persistence Owner","Current Runtime Owner","Current Persistence Owner","Permission / Auth Resource","Permission"} and val:
                              uid_field_values[ident][fld].append({"document":doc_uid,"file":fn,"value":val,"table":t["table"],"row":ri})

          def placeholder(v):
              u=n(v).upper()
              if u in {"","—","-","N/A","N/A_READ_ONLY","NOT_APPLICABLE","UNCHANGED","SOURCE_NOT_DEFINED"}: return True
              return bool(re.search(r"AUTHORITY_GAP|RESOLVE_FROM_|NO_AUTHORIZED_|OWNER_UNDEFINED|BLOCKED_NO_CANONICAL",u))

          cross_document_conflicts=[]
          for ident,fields in uid_field_values.items():
              for fld,recs in fields.items():
                  vals=sorted(set(r["value"] for r in recs if not placeholder(r["value"])))
                  if len(vals)>1:
                      cross_document_conflicts.append({"control_uid":ident,"field":fld,"values":vals,"evidence":recs})

          # System-contract completeness dimensions.
          system_dimensions={
            "PURPOSE_SCOPE":[r"PURPOSE",r"SCOPE",r"POSITION",r"BOUNDARY"],
            "OWNER_AUTHORITY":[r"OWNER",r"AUTHORITY",r"CANONICAL"],
            "ENTITY_DATA":[r"ENTITY",r"DATA",r"SCHEMA",r"MODEL",r"REGISTRY"],
            "FUNCTION_OPERATION":[r"FUNCTION",r"OPERATION",r"ACTION",r"CAPABIL"],
            "INPUT_OUTPUT":[r"INPUT",r"OUTPUT",r"PAYLOAD",r"RESPONSE"],
            "DEPENDENCY_INTEGRATION":[r"DEPENDENC",r"INTEGRATION",r"REFERENCE",r"HANDOFF"],
            "STATE_LIFECYCLE":[r"STATE",r"LIFECYCLE",r"TRANSITION",r"STATUS"],
            "PERMISSION_SECURITY":[r"PERMISSION",r"AUTH",r"SECURITY",r"ROLE"],
            "FAILURE_RECOVERY":[r"FAIL",r"ERROR",r"RETRY",r"RECOVERY",r"ROLLBACK"],
            "AUDIT_EVIDENCE":[r"AUDIT",r"EVIDENCE",r"EVENT"],
            "VERSION_CHANGE":[r"VERSION",r"CHANGE",r"LOCK",r"FREEZE"],
            "ACCEPTANCE_DOD":[r"ACCEPTANCE",r"PASS",r"DEFINITION OF DONE",r"\bDOD\b"],
          }
          system_dimension_missing=[]
          system_dimension_matrix={}
          for uid,fn in SYSTEM_DOCS.items():
              full=all_extracted[uid][0]
              row={}
              for dim,pats in system_dimensions.items():
                  ok=hit(full,pats)
                  row[dim]=ok
                  if not ok:
                      system_dimension_missing.append({"system":uid,"file":fn,"dimension":dim})
              system_dimension_matrix[uid]=row

          # Global integration and index must cover the current Word corpus.
          global_text=all_extracted["GLOBAL-INTEGRATION"][0]
          global_page_missing=[p for p in PAGE_DOCS if p not in global_text]
          index_text=all_extracted["INDEX"][0]
          all_root_files=set(str(p.name) for p in Path(".").glob("*.docx"))
          expected_root_files=set(all_specs.values())
          root_set_delta={
            "missing_physical":sorted(expected_root_files-all_root_files),
            "unexpected_physical":sorted(all_root_files-expected_root_files)
          }
          index_file_missing=sorted(fn for fn in expected_root_files if fn!="00_INDEX_ACPOS_Mother_Compliant_Basic_Design_Master.docx" and fn not in index_text)

          # Cross-page flow coverage is reported separately because some pages may
          # legitimately have no outbound transition; absence is a review candidate,
          # not automatically a blocker.
          cross_page_flow_candidates=[]
          for page,fn in PAGE_DOCS.items():
              full=all_extracted[page][0]
              if not hit(full,[r"FLOW UID",r"CROSS[- ]?PAGE",r"NAVIGATION / ROUTING",r"HANDOFF",r"TARGET PAGE",r"SOURCE PAGE"]):
                  cross_page_flow_candidates.append({"page":page,"file":fn})

          # Per-page formal functional-contract audit with applicability-aware
          # semantics. UI-local/read-only/owner-orchestrated rows are not forced
          # to invent API/persistence bindings. Effectful business mutations must
          # name an exact Persistence Owner.
          page_function_matrix={}
          page_function_gaps=[]
          formal_placeholder_re=re.compile(
            r"^(?:|—|-|TBD|TODO|PLACEHOLDER|SOURCE_NOT_DEFINED|OWNER_UNDEFINED|"
            r"RESOLVE_FROM_[A-Z0-9_]+|AUTHORITY_GAP_BLOCKED|INTENTIONAL_FAIL_CLOSED_AUTHORITY_GAP|"
            r"NO_AUTHORIZED_[A-Z0-9_]+|BLOCKED_NO_CANONICAL_[A-Z0-9_]+)$",re.I
          )
          mutating_op_re=re.compile(
            r"^(?:create|update|save|approve|reject|return|retire|pause|resume|start|retry|submit|"
            r"configure|set|delete|archive|restore|cancel|generate|execute|import|upload|handoff|"
            r"adopt|finalize|lock|unlock|publish|apply|compile|remove|add|mark|assign|unassign|"
            r"revoke|rotate|materialize|persist|commit)",re.I
          )
          read_op_re=re.compile(
            r"^(?:get|list|search|compare|preview|read|open|refresh|inspect|fetch|discover|view|"
            r"resolve|check|validate|test)",re.I
          )
          def bad_formal(v):
              return bool(formal_placeholder_re.match(n(v)))
          def dash(v):
              return n(v).upper() in {"","—","-"}
          def valid_value(v,allow_na=False):
              u=n(v).upper()
              if allow_na and u in {"N/A","N/A_READ_ONLY","NOT_APPLICABLE","—","-"}:
                  return True
              return bool(n(v)) and not bad_formal(v)

          for page,fn in PAGE_DOCS.items():
              full,units,tables=all_extracted[page]
              explicit_na_action=("EXPLICIT-NA-ACTION-SEMANTICS" in full)
              contract_tables=0
              control_rows=0
              effectful_mutation_rows=0
              read_rows=0
              ui_local_rows=0
              owner_orchestrated_rows=0
              unique_controls=set()
              local_gaps=[]

              for t in tables:
                  h=[n(x) for x in t["headers"]]
                  if "Control UID" not in h:
                      continue
                  formal_cols=set(h).intersection({
                    "Action UID","Gate","Permission / Auth Resource","Permission",
                    "Payload / Schema","Payload","Operation","Method / Path",
                    "Runtime Owner","Persistence Owner","Current Runtime Owner",
                    "Current Persistence Owner","Runtime Status","Current status"
                  })
                  if not formal_cols:
                      continue
                  contract_tables+=1
                  ci=h.index("Control UID")

                  for ri,row0 in enumerate(t["rows"],2):
                      row=[n(x) for x in row0]
                      if ci>=len(row) or not row[ci]:
                          continue
                      uid=row[ci]
                      if not uid_re.match(uid.upper()):
                          continue
                      control_rows+=1
                      unique_controls.add(uid)
                      amap={h[i]:row[i] if i<len(row) else "" for i in range(len(h))}
                      status=n(amap.get("Runtime Status") or amap.get("Current status")).upper()
                      operation=n(amap.get("Operation"))
                      ui_local=status.startswith("UI_LOCAL") or status=="LOCAL_WORKING_DRAFT_EXACT"
                      owner_orchestrated=status in {
                        "OWNER_ORCHESTRATED_RUNTIME_EXACT_NO_PUBLIC_ROUTE",
                        "ORCHESTRATES_EXISTING_EXACT_OPERATIONS"
                      }
                      read_semantic=(status=="READ_EXACT") or bool(read_op_re.match(operation))
                      mutation_semantic=bool(mutating_op_re.match(operation)) and not read_semantic
                      if ui_local: ui_local_rows+=1
                      if owner_orchestrated: owner_orchestrated_rows+=1
                      if read_semantic: read_rows+=1
                      if mutation_semantic: effectful_mutation_rows+=1

                      def add_gap(dim,vals):
                          local_gaps.append({
                            "page":page,"file":fn,"control_uid":uid,"dimension":dim,
                            "table":t["table"],"row":ri,"values":[n(x) for x in vals],
                            "status":status,"operation":operation
                          })
                      def require_one(dim,cols,allow_na=False):
                          present=[n(amap.get(col)) for col in cols if col in amap]
                          if not present:
                              return
                          if not any(valid_value(v,allow_na=allow_na) for v in present):
                              add_gap(dim,present)

                      # UI-local and local-working-draft rows are complete by local
                      # semantics and must not invent API/DB bindings.
                      if ui_local:
                          continue

                      # Owner-orchestrated controls intentionally expose no public
                      # Operation/Method. Their exact page contract is Action/Gate/
                      # Permission/Runtime Owner plus a separate owner-orchestrated
                      # payload/outcome/failure table.
                      if owner_orchestrated:
                          require_one("ACTION",["Action UID"])
                          require_one("GATE",["Gate"])
                          require_one("PERMISSION",["Permission / Auth Resource","Permission"])
                          require_one("RUNTIME_OWNER",["Runtime Owner","Current Runtime Owner"])
                          continue

                      # Formal server/read contracts.
                      if "Action UID" in amap:
                          av=n(amap.get("Action UID"))
                          if dash(av) and not explicit_na_action:
                              add_gap("ACTION",[av])
                          elif not dash(av) and bad_formal(av):
                              add_gap("ACTION",[av])
                      require_one("GATE",["Gate"])
                      require_one("PERMISSION",["Permission / Auth Resource","Permission"])
                      require_one("OPERATION",["Operation"])
                      require_one("METHOD_PATH",["Method / Path"])
                      require_one("RUNTIME_OWNER",["Runtime Owner","Current Runtime Owner"])
                      require_one("RUNTIME_STATUS",["Runtime Status","Current status"])

                      # Payload is mandatory for business mutation where the table
                      # declares a payload column; path/query-only reads may be N/A.
                      if mutation_semantic:
                          require_one("PAYLOAD",["Payload / Schema","Payload"],allow_na=False)

                      # Persistence semantics: read/search/compare/refresh do not
                      # require a business persistence owner. Business mutations do.
                      if mutation_semantic:
                          require_one("PERSISTENCE_OWNER",["Persistence Owner","Current Persistence Owner"])
                      elif read_semantic:
                          require_one("PERSISTENCE_OWNER",["Persistence Owner","Current Persistence Owner"],allow_na=True)

              dedup={}
              for g in local_gaps:
                  k=(g["control_uid"],g["dimension"])
                  dedup.setdefault(k,g)
              local_gaps=list(dedup.values())
              page_function_gaps.extend(local_gaps)
              rule_failures=[name for name,res in page_results[page].items() if not res["pass"]]
              page_function_matrix[page]={
                "file":fn,
                "formal_contract_tables":contract_tables,
                "formal_control_rows":control_rows,
                "unique_controls":len(unique_controls),
                "effectful_business_mutation_rows":effectful_mutation_rows,
                "read_rows":read_rows,
                "ui_local_rows":ui_local_rows,
                "owner_orchestrated_rows":owner_orchestrated_rows,
                "formal_function_gaps":len(local_gaps),
                "formal_gap_details":local_gaps,
                "basic_design_rule_failures":rule_failures,
                "status":"COMPLETE" if not local_gaps and not rule_failures else "PARTIAL"
              }

          incomplete_pages=[p for p,m in page_function_matrix.items() if m["status"]!="COMPLETE"]
          page_function_gap_unique_controls=sorted(set(g["control_uid"] for g in page_function_gaps))

          # Fresh physical-content integrity across the exact 31-Word corpus.
          docx_integrity_errors=[]
          revision_comment_residuals=[]
          hard_text_corruption=[]
          for fn in sorted(expected_root_files):
              try:
                  with zipfile.ZipFile(fn) as z:
                      bad=z.testzip()
                      if bad:
                          docx_integrity_errors.append({"file":fn,"error":"CRC:"+bad})
                          continue
                      names=set(z.namelist())
                      for name in [x for x in names if x.endswith(".xml")]:
                          data=z.read(name)
                          try:
                              ET.fromstring(data)
                          except Exception as e:
                              docx_integrity_errors.append({"file":fn,"part":name,"error":"XML_PARSE:"+str(e)})
                      if "word/document.xml" in names:
                          raw=z.read("word/document.xml").decode("utf-8","replace")
                          if re.search(r"<w:(?:ins|del)\\b",raw):
                              revision_comment_residuals.append({"file":fn,"type":"tracked_change"})
                          if "\\ufffd" in raw:
                              hard_text_corruption.append({"file":fn,"type":"replacement_character"})
                      if "word/comments.xml" in names:
                          try:
                              root=ET.fromstring(z.read("word/comments.xml"))
                              if list(root):
                                  revision_comment_residuals.append({"file":fn,"type":"comments"})
                          except Exception as e:
                              docx_integrity_errors.append({"file":fn,"part":"word/comments.xml","error":"XML_PARSE:"+str(e)})
              except Exception as e:
                  docx_integrity_errors.append({"file":fn,"error":str(e)})

          # Deduplicate the same intentional Authority Gap mirrored in a system
          # contract and its page contract.
          unique_gap_controls=sorted(set(x["control_uid"] for x in authority_gap_rows))
          unique_missing_controls=sorted(set(x["control_uid"] for x in critical_missing))

          internal_blockers=[]
          if authority_gap_rows: internal_blockers.append("OPEN_AUTHORITY_GAP")
          if critical_missing: internal_blockers.append("CRITICAL_CONTROL_FIELD_MISSING")
          if cross_document_conflicts: internal_blockers.append("CROSS_DOCUMENT_CONTROL_CONFLICT")
          if system_dimension_missing: internal_blockers.append("SYSTEM_CONTRACT_DIMENSION_MISSING")
          if global_page_missing: internal_blockers.append("GLOBAL_INTEGRATION_PAGE_COVERAGE_MISSING")
          if root_set_delta["missing_physical"] or root_set_delta["unexpected_physical"]: internal_blockers.append("WORD_CORPUS_SET_DRIFT")
          if index_file_missing: internal_blockers.append("INDEX_CURRENT_FILE_COVERAGE_MISSING")
          if page_function_gaps: internal_blockers.append("PAGE_FORMAL_FUNCTION_CONTRACT_GAP")
          if incomplete_pages: internal_blockers.append("PAGE_BASIC_DESIGN_INCOMPLETE")
          if docx_integrity_errors: internal_blockers.append("DOCX_INTEGRITY_ERROR")
          if revision_comment_residuals: internal_blockers.append("REVISION_COMMENT_RESIDUAL")
          if hard_text_corruption: internal_blockers.append("HARD_TEXT_CORRUPTION")

          internal={
            "marker":"ACPOS-20260922-BATCH-114-INTERNAL-FUNCTION-SYSTEM-COMPLETENESS-V1",
            "strict_completion_status":"COMPLETE" if not internal_blockers else "PARTIAL",
            "internal_blockers":internal_blockers,
            "open_authority_gap_rows":len(authority_gap_rows),
            "open_authority_gap_unique_controls":len(unique_gap_controls),
            "open_authority_gap_control_uids":unique_gap_controls,
            "critical_missing_rows":len(critical_missing),
            "critical_missing_unique_controls":len(unique_missing_controls),
            "critical_missing_control_uids":unique_missing_controls,
            "cross_document_control_conflicts":len(cross_document_conflicts),
            "system_contract_dimensions":len(SYSTEM_DOCS)*len(system_dimensions),
            "system_contract_dimension_missing":len(system_dimension_missing),
            "global_page_missing":global_page_missing,
            "index_file_missing":index_file_missing,
            "word_corpus_set_delta":root_set_delta,
            "cross_page_flow_review_candidates":cross_page_flow_candidates,
            "authority_gap_rows":authority_gap_rows,
            "critical_missing":critical_missing,
            "cross_document_conflicts":cross_document_conflicts,
            "system_dimension_missing":system_dimension_missing,
            "system_dimension_matrix":system_dimension_matrix,
            "prose_gap_candidates":prose_gap_candidates[:250],
            "page_function_matrix":page_function_matrix,
            "page_formal_function_gaps":page_function_gaps,
            "page_formal_function_gap_unique_controls":page_function_gap_unique_controls,
            "incomplete_pages":incomplete_pages,
            "docx_integrity_errors":docx_integrity_errors,
            "revision_comment_residuals":revision_comment_residuals,
            "hard_text_corruption":hard_text_corruption,
          }
          Path("__batch114_internal_completeness.json").write_text(json.dumps(internal,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH114_INTERNAL_SUMMARY="+json.dumps({
            "strict_completion_status":internal["strict_completion_status"],
            "blockers":internal_blockers,
            "authority_gap_rows":len(authority_gap_rows),
            "authority_gap_unique_controls":len(unique_gap_controls),
            "critical_missing_rows":len(critical_missing),
            "cross_document_conflicts":len(cross_document_conflicts),
            "system_dimension_missing":len(system_dimension_missing),
            "global_page_missing":len(global_page_missing),
            "index_file_missing":len(index_file_missing),
            "cross_page_flow_review_candidates":len(cross_page_flow_candidates),
            "complete_pages":sum(1 for x in page_function_matrix.values() if x["status"]=="COMPLETE"),
            "incomplete_pages":len(incomplete_pages),
            "page_formal_function_gaps":len(page_function_gaps),
            "page_formal_function_gap_unique_controls":len(page_function_gap_unique_controls),
            "docx_integrity_errors":len(docx_integrity_errors),
            "revision_comment_residuals":len(revision_comment_residuals),
            "hard_text_corruption":len(hard_text_corruption)
          },ensure_ascii=False,sort_keys=True))
          if internal["strict_completion_status"]!="COMPLETE":
              raise SystemExit("STRICT_INTERNAL_COMPLETENESS_NOT_COMPLETE "+repr({
                "blockers":internal["internal_blockers"],
                "authority_gap_controls":internal["open_authority_gap_control_uids"],
                "critical_missing_controls":internal["critical_missing_control_uids"],
                "cross_document_conflicts":internal["cross_document_conflicts"],
                "system_dimension_missing":internal["system_dimension_missing"],
                "global_page_missing":internal["global_page_missing"],
                "index_file_missing":internal["index_file_missing"],
                "incomplete_pages":internal["incomplete_pages"],
                "page_function_gaps":internal["page_formal_function_gaps"][:25],
                "docx_integrity_errors":internal["docx_integrity_errors"],
                "revision_comment_residuals":internal["revision_comment_residuals"],
                "hard_text_corruption":internal["hard_text_corruption"]
              }))
          print("BATCH114_STRICT_INTERNAL_COMPLETE_PASS")


          bycheck=collections.Counter(x["check"] for x in missing)
          bypage=collections.Counter(x["page"] for x in missing)
          summary={
            "marker":"ACPOS-20260922-BATCH-114-NORMALIZED-BASIC-DESIGN-FUNCTIONAL-COMPLETENESS-V1",
            "base_head":EXPECTED_PARENT,
            "scope":"WORD_PLANNING_AND_BASIC_DESIGN_SPECIFICATION_ONLY",
            "page_docs":len(PAGE_DOCS),
            "page_design_check_types":len(PAGE_RULES),
            "page_design_denominator":len(PAGE_DOCS)*len(PAGE_RULES),
            "candidate_design_gaps":len(missing),
            "candidate_design_gaps_by_check":dict(bycheck),
            "candidate_design_gaps_by_page":dict(bypage),
            "support_design_docs":len(support_files),
            "support_design_missing":len(support_missing),
            "entity_applicability_tables":app_tables,
            "entity_applicability_rows":app_rows,
            "canonical_hierarchy_tables":hier_tables,
            "canonical_hierarchy_rows":hier_rows,
            "excluded_from_scope":[
              "RUNTIME_EXECUTION_VERIFICATION","API_DEPLOYMENT","DATABASE_MIGRATION",
              "STAGE_EXECUTION","PRODUCTION_ACCEPTANCE","EXTERNAL_PROVIDER_E2E",
              "OTHER_BRANCH_EXECUTION_STATE"
            ]
          }
          out={"summary":summary,"page_results":page_results,"candidate_design_gaps":missing,"support_missing":support_missing}
          Path("__batch114_planning_design_audit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch114_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH114_BASELINE_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH114_BASELINE_CANDIDATE_GAPS="+json.dumps([{"page":x["page"],"check":x["check"],"score":x["score"],"need":x["need"]} for x in missing],ensure_ascii=False))
          print("BATCH114_BASELINE_SUPPORT_MISSING="+json.dumps(support_missing,ensure_ascii=False))
          if missing:
              raise SystemExit("PLANNING_DESIGN_GAPS_NONZERO")
          if support_missing:
              raise SystemExit("SUPPORT_DESIGN_GAPS_NONZERO")
          if app_tables!=17 or app_rows!=2300:
              raise SystemExit(f"ENTITY_APPLICABILITY_DRIFT tables={app_tables} rows={app_rows}")
          if hier_tables!=3 or hier_rows!=8:
              raise SystemExit(f"HIERARCHY_DRIFT tables={hier_tables} rows={hier_rows}")
          print("BATCH114_BASELINE_DESIGN_CLOSURE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acpos-batch114-normalized-basic-design-functional-completeness-audit
          path: |
            __batch114_planning_design_audit.json
            __batch114_summary.json
            __batch114_internal_completeness.json
          retention-days: 2
      - name: Close harness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch114_planning_design_audit.json __batch114_summary.json __batch114_internal_completeness.json
          git config user.name "acpos-batch114-design-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch114_normalized_basic_design_functional_completeness_audit.yml
          git commit -m "chore(acpos): close batch 114 normalized basic design functional completeness audit"
          git push origin HEAD:0921acpos
