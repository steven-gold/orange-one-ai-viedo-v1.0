owner_boundary:
- 概念: Context / Truth / Experience
  Canonical Owner: ACPOS-AI-01
  AI-07 行為: 讀取 exact Context/Truth；不得建立 page-local context store。
- 概念: Conversation / Memory
  Canonical Owner: ACPOS-AI-02
