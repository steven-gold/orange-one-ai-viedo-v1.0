accessibility:
  collapsed_nav: Every icon keeps canonical accessible name; no subtitle
  auto_expand: keyboard focusin expands label layer; focusout collapses after delay
  quick_status: Each chip has accessible name including label and current authorized value/count
  language: Keyboard-selectable; current locale announced
  account: Account/Login button accessible name reflects actual session state
  active_nav: aria-current or selected semantics; not color-only
forbidden:
- AI Workspace L1 item
- separate Editing L1 and Voice L1
- System Admin L1 item in place of Database/Strategy Center
- more or fewer than 8 L1 items unless authority is revised
- Dashboard child menu/subtitle/chevron
- two-line L1 menu subtitles
- manual sidebar pin/collapse toggle
- workspace reflow when sidebar temporarily expands
- header page identity center title
- Help/Settings/Search/System Status/Provider Health as global header controls
- fake permission/notification/todo/running/account data
- invented quick-link routes
- generated logo
- shell KPI/business cards
- mobile alternate shell under 1280
- any L1 child menu/submenu/accordion/chevron/secondary subtitle line
- persistent visible 64px sidebar background/frame/border/glow while collapsed
- glass/card row containers around collapsed icons
- collapsed sidebar label text; collapsed state is ICON ONLY
- Permission chip/field/summary in Global Header
- rendering account permission list/role summary as a header quick-status item
acceptance:
- uid: GHS-ACC-01
  item: L1 Menu Exactness
  pass: Exactly 8 direct flat L1 items in exact order; every item has no child menu/submenu/subtitle/chevron
- uid: GHS-ACC-02
  item: No AI Workspace
  pass: AI Workspace absent from navigation/control/i18n
- uid: GHS-ACC-03
  item: Editing + Voice Merge
  pass: One L1 剪輯配音 only; no separate Editing/Voice rows
- uid: GHS-ACC-04
  item: All L1 Flat / No Subtitle
  pass: NAV-01..NAV-08 are direct L1 leaves; no child/submenu, no second line, no chevron. Lower-level navigation belongs to destination Page
    Authority.
- uid: GHS-ACC-05
  item: Auto Collapse
  pass: Resting state is transparent 64px icon-only interaction rail with no visible sidebar frame. Hover/focus renders 221px sidebar surface
    overlay; collapse after 180ms; no manual pin; workspace always x78.
- uid: GHS-ACC-06
  item: Header Left
  pass: Canonical ORANGE ONE logo only
- uid: GHS-ACC-07
  item: Header Right Order
  pass: Authenticated order exactly Notification → To-do → Running → Language → Account
- uid: GHS-ACC-08
  item: Logged-out Header
  pass: Only Language + Login shown; no fake account quick data
- uid: GHS-ACC-09
  item: Quick Status
  pass: Notification + To-do + Running use real account projections and are clickable via canonical quick-link resolver; Permission is not rendered
- uid: GHS-ACC-10
  item: Language
  pass: Immediately left of Account; options zh-TW/zh-CN/en; UI locale only
- uid: GHS-ACC-11
  item: Workspace Width
  pass: Content slot begins x78/y68 and does not reflow when menu auto-expands
- uid: GHS-ACC-12
  item: No Header Extras
  pass: No Help/Settings/Search/System Status/center Page Identity/Quick Create
- uid: GHS-ACC-13
  item: Real Data
  pass: No fake quick counts/permission/account identity
- uid: GHS-ACC-14
  item: No Route Inference
  pass: Navigation and quick destinations resolve from canonical authorities; unresolved = block/report gap
- uid: GHS-ACC-15
  item: Page Boundary
  pass: Global Shell never injects dashboard/department business content
- uid: GHS-ACC-16
  item: Machine Closure
  pass: All control UIDs resolve action/gate/permission/component/visual; zero unresolved internal refs
- uid: GHS-ACC-17
  item: Collapsed Icon-Only Visual
  pass: Canonical collapsed-state reference and runtime rest state show only 8 icons. No full-height sidebar surface/frame/background/border/glow
    and no 221px expanded-menu demo is visible until actual hover/focus.
- uid: GHS-ACC-18
  item: Permission Is Account-Bound, Not Header UI
  pass: No Permission control/field/chip exists in Header. Permissions are configured by Account Creation/Management and consumed only as authorization
    outcomes.
