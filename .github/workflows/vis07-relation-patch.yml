name: VIS-07 Relation Patch
on:
  push:
    branches: [acpos-vis07-staging]
    paths: [.github/workflows/vis07-relation-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one relation view visible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/DbVisual.tsx'); s=p.read_text()
          old='<div className={styles.relationGrid}><Control spec={RELATIONS[1]}/><Control spec={RELATIONS[2]}/></div>'
          new='<div className={styles.relationGrid}><Control spec={RELATIONS[1]}/><div className={styles.registryOnly}><Control spec={RELATIONS[2]}/></div></div>'
          if old not in s: raise SystemExit('relation view target not found')
          p.write_text(s.replace(old,new,1))
          c=Path('src/components/pages/DbVisual.module.css'); css=c.read_text()
          if '.registryOnly{display:none!important}' not in css: css += '\n.registryOnly{display:none!important}\n'
          c.write_text(css)
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/DbVisual.tsx src/components/pages/DbVisual.module.css
          git rm .github/workflows/vis07-relation-patch.yml
          git commit -m "fix(vis07): keep DB relation graph/list mutually exclusive [skip ci]"
          git push
