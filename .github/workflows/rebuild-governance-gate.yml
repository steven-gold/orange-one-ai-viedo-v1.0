name: Governance v2.1.12 Stage-02 Functional Chain Preflight Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-v218-upstream-projection-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_upstream_projection.py
  current-v218-phase-successor-authority-gate:
    runs-on: ubuntu-24.04
