name: ACPOS Gate25 API 06-07 Non Current Resource Ledger Sync Once

on:
  push:
    branches: [new]

permissions:
  contents: write

jobs:
  sync-ledger:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Classify exact 5 API-06 through API-07 non-Current formal resources
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          const ledgerPath='docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json';
          const inventoryPath='docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json';
          const navigationPath='authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml';
          const pageCatalogPath='src/server/shared/pageCatalogProjectionRuntime.ts';
          const adminAuthorityDir='authority/pages/admin';
          const evidencePath='docs/construction/evidence/GATE25_API_06_07_NON_CURRENT_PERMISSION_RESOURCE_EVIDENCE_2026-09-10.json';
          const syncPath='docs/construction/evidence/GATE25_API_06_07_NON_CURRENT_PERMISSION_RESOURCE_LEDGER_SYNC_2026-09-10.json';
          const formalTestPath='tests/release/formal-acceptance-ledger.test.mjs';
          const regressionPath='tests/release/gate25-api-06-07-non-current-permission-resource-ledger-sync.test.mjs';
          const targets=[
            'action:admin:API-06:ACT-APPROVE',
            'action:admin:API-06:ACT-NAV-OPEN',
            'action:admin:API-06:ACT-REPLAY',
            'action:admin:API-07:ACT-NAV-OPEN',
            'action:admin:API-07:ACT-SEARCH',
          ];
          const pageUids=['admin:API-06','admin:API-07'];
          const [navigation,pageCatalog,adminAuthorityEntries]=await Promise.all([
            readFile(navigationPath,'utf8'),
            readFile(pageCatalogPath,'utf8'),
            readdir(adminAuthorityDir),
          ]);
          for(const pageUid of pageUids){
            const dirName=pageUid.split(':')[1];
            if(adminAuthorityEntries.includes(dirName)) throw new Error(`NON_CURRENT_API_HAS_CURRENT_AUTHORITY_DIR_${pageUid}`);
            if(navigation.includes(`page_uid: ${pageUid}`)) throw new Error(`NON_CURRENT_API_IN_CURRENT_NAVIGATION_${pageUid}`);
            if(pageCatalog.includes(`"${pageUid}"`)) throw new Error(`NON_CURRENT_API_IN_CURRENT_PAGE_CATALOG_${pageUid}`);
          }
          const inventory=JSON.parse(await readFile(inventoryPath,'utf8'));
          const inventoryByKey=new Map(inventory.resources.map(x=>[x.resource_key,x]));
          for(const key of targets){
            const row=inventoryByKey.get(key);
            if(!row) throw new Error(`FORMAL_RESOURCE_MISSING_${key}`);
            if(row.resource_type!=='ACTION') throw new Error(`FORMAL_RESOURCE_TYPE_${key}_${row.resource_type}`);
          }
          const ledger=JSON.parse(await readFile(ledgerPath,'utf8'));
          if(JSON.stringify(ledger.counts)!==JSON.stringify({PASS:29,BLOCKED:103,NOT_EXECUTED:1349})) throw new Error(`UNEXPECTED_LEDGER_BASELINE_${JSON.stringify(ledger.counts)}`);
          const byKey=new Map(ledger.entries.map(x=>[x.resource_key,x]));
          const before={...ledger.counts};
          const changed=[];
          for(const key of targets){
            const row=byKey.get(key);
            if(!row) throw new Error(`LEDGER_RESOURCE_MISSING_${key}`);
            if(row.disposition!=='NOT_EXECUTED') throw new Error(`LEDGER_RESOURCE_NOT_PENDING_${key}_${row.disposition}`);
            row.disposition='BLOCKED';
            row.reason_code='NON_CURRENT_PAGE_PERMISSION_RESOURCE_ACTIVE_IN_PRODUCTION_INVENTORY';
            row.evidence_refs=[evidencePath,navigationPath,pageCatalogPath,inventoryPath,'authority/pages/admin'];
            row.blocker_detail='Production formal permission inventory contains an ACTION owned by admin:API-06/07, but no corresponding Current admin Authority directory, Current navigation page, or Current page-catalog owner exists. Gate25 cannot execute or accept the resource until authority explicitly remaps or deactivates it; inventing a Current page is forbidden.';
            row.operation_ids=[key.split(':').at(-1)];
            changed.push(key);
          }
          const counts={PASS:0,BLOCKED:0,NOT_EXECUTED:0};
          for(const row of ledger.entries){
            if(!(row.disposition in counts)) throw new Error(`INVALID_DISPOSITION_${row.resource_key}`);
            counts[row.disposition]++;
          }
          if(ledger.entries.length!==1481) throw new Error(`DENOMINATOR_${ledger.entries.length}`);
          if(JSON.stringify(counts)!==JSON.stringify({PASS:29,BLOCKED:108,NOT_EXECUTED:1344})) throw new Error(`COUNT_MISMATCH_${JSON.stringify(counts)}`);
          ledger.counts=counts;
          await writeFile(ledgerPath,JSON.stringify(ledger,null,2)+'\n');
          const evidence={
            document_id:'ACPOS_GATE25_API_06_07_NON_CURRENT_PERMISSION_RESOURCE_EVIDENCE',
            status:'CURRENT_AUTHORITY_BLOCKER_EVIDENCE',
            as_of:new Date().toISOString(),
            target_count:targets.length,
            target_resource_keys:targets,
            non_current_page_uids:pageUids,
            facts:{current_admin_authority_dirs_absent:true,current_navigation_pages_absent:true,current_page_catalog_owners_absent:true,production_formal_inventory_contains_all_targets:true},
            evidence_refs:['authority/pages/admin',navigationPath,pageCatalogPath,inventoryPath],
            rule:'These five resources are not accepted operations. They remain active in the formal Production permission denominator but have no Current page authority/navigation/catalog owner. They are BLOCKED until formally remapped or deactivated; no page may be invented for acceptance.'
          };
          await writeFile(evidencePath,JSON.stringify(evidence,null,2)+'\n');
          const sync={document_id:'ACPOS_GATE25_API_06_07_NON_CURRENT_PERMISSION_RESOURCE_LEDGER_SYNC',status:'PHYSICAL_LEDGER_SYNCED',as_of:new Date().toISOString(),target_count:targets.length,changed_count:changed.length,changed_resource_keys:changed,counts_before:before,counts_after:counts,source:evidencePath,rule:'Only the exact five still-NOT_EXECUTED API-06/07 ACTION resources proven to lack a Current page owner are moved to BLOCKED.'};
          await writeFile(syncPath,JSON.stringify(sync,null,2)+'\n');
          let formalTest=await readFile(formalTestPath,'utf8');
          const oldCount='assert.deepEqual(ledger.counts,{PASS:29,BLOCKED:103,NOT_EXECUTED:1349});';
          const newCount='assert.deepEqual(ledger.counts,{PASS:29,BLOCKED:108,NOT_EXECUTED:1344});';
          if(!formalTest.includes(oldCount)) throw new Error('FORMAL_TEST_CURRENT_COUNT_BASELINE_NOT_FOUND');
          formalTest=formalTest.replace(oldCount,newCount);
          await writeFile(formalTestPath,formalTest);
          await writeFile(regressionPath,`import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("Gate25 blocks exact five API-06/07 Production permission resources that lack a Current page owner",async()=>{\n  const evidence=JSON.parse(await readFile("${evidencePath}","utf8"));\n  const sync=JSON.parse(await readFile("${syncPath}","utf8"));\n  const ledger=JSON.parse(await readFile("${ledgerPath}","utf8"));\n  assert.equal(evidence.status,"CURRENT_AUTHORITY_BLOCKER_EVIDENCE");\n  assert.equal(evidence.target_count,5);\n  assert.equal(sync.changed_count,5);\n  assert.deepEqual(sync.counts_before,{PASS:29,BLOCKED:103,NOT_EXECUTED:1349});\n  assert.deepEqual(sync.counts_after,{PASS:29,BLOCKED:108,NOT_EXECUTED:1344});\n  const changed=new Set(sync.changed_resource_keys);\n  assert.equal(changed.size,5);\n  for(const row of ledger.entries.filter(x=>changed.has(x.resource_key))){\n    assert.equal(row.disposition,"BLOCKED");\n    assert.equal(row.reason_code,"NON_CURRENT_PAGE_PERMISSION_RESOURCE_ACTIVE_IN_PRODUCTION_INVENTORY");\n    assert.ok(row.evidence_refs.includes("${evidencePath}"));\n  }\n});\n`);
          console.log(JSON.stringify(sync));
          NODE
      - name: Validate synchronized ledger
        run: |
          node --test tests/release/formal-acceptance-ledger.test.mjs tests/release/gate25-api-06-07-non-current-permission-resource-ledger-sync.test.mjs
          node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit synchronized ledger and remove one-shot workflow
        run: |
          rm .github/workflows/gate25-api-06-07-non-current-ledger-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json \
                  docs/construction/evidence/GATE25_API_06_07_NON_CURRENT_PERMISSION_RESOURCE_EVIDENCE_2026-09-10.json \
                  docs/construction/evidence/GATE25_API_06_07_NON_CURRENT_PERMISSION_RESOURCE_LEDGER_SYNC_2026-09-10.json \
                  tests/release/formal-acceptance-ledger.test.mjs \
                  tests/release/gate25-api-06-07-non-current-permission-resource-ledger-sync.test.mjs \
                  .github/workflows/gate25-api-06-07-non-current-ledger-sync-once.yml
          git commit -m "evidence(gate25): block non-Current API-06/07 formal resources"
          git push origin HEAD:new
