name: VIS-10 active navigation correction
on:
  push:
    branches:
      - acpos-vis10-staging
    paths:
      - .github/workflows/vis10-active-nav-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Apply canonical active navigation state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/globals.css')
          s=p.read_text()
          anchor='''.nav-item:hover,
          .nav-item:focus-visible {
            color: var(--text-primary);
            background: var(--purple-hover);
            border-color: var(--border-subtle);
          }
          '''
          addition=anchor+'''.nav-item.is-active .nav-icon {
            color: var(--text-primary);
            border-radius: 6px;
            box-shadow: 0 0 0 6px rgba(139, 92, 255, 0.24), 0 0 16px rgba(139, 92, 255, 0.22);
          }
          .global-sidebar.is-expanded .nav-item.is-active {
            color: var(--text-primary);
            background: linear-gradient(90deg, rgba(139, 92, 255, 0.30), rgba(92, 62, 190, 0.20));
            border-color: var(--border-active);
            box-shadow: inset 0 0 18px rgba(139, 92, 255, 0.08), 0 0 14px rgba(139, 92, 255, 0.12);
          }
          '''
          if anchor not in s: raise SystemExit('nav state anchor missing')
          p.write_text(s.replace(anchor,addition,1))
          PY
          grep -Fq '.nav-item.is-active .nav-icon' src/app/globals.css
          grep -Fq '.global-sidebar.is-expanded .nav-item.is-active' src/app/globals.css
      - name: Commit exact file and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add src/app/globals.css
          git commit -m "fix(vis10): restore Global Shell active navigation state"
          git rm .github/workflows/vis10-active-nav-fix.yml
          git commit -m "chore(vis10): remove temporary active-nav workflow"
          git push origin HEAD:acpos-vis10-staging
