name: ACPOS Gate25 ERP Connector Sync Diagnostic Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-erp-connector-sync-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  production-diagnostic:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    env:
      ACPOS_DEPLOYMENT_URL: https://orange-one-acpos-test.vercel.app
      ACPOS_PRODUCTION_E2E_EMAIL: admin
      ACPOS_PRODUCTION_E2E_PASSWORD: ${{ secrets.ADMIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ACPOS_EXPECT_RELEASE_SHA: 608e9c46ef6f85ba4d127d3015b73ff1b5aa8e36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install product dependencies
        run: npm ci
      - name: Install browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Execute authenticated Production ERP connector/sync diagnostic
        run: |
          node --check scripts/gate25-production-erp-connector-sync-diagnostic.mjs
          node scripts/gate25-production-erp-connector-sync-diagnostic.mjs
