schema_version: 2
artifact_uid: GOV-COMP-STAGE-TEST-REMEDIATION-CLOSURE-PROTOCOL
artifact_type: GOVERNANCE_SPECIFICATION_COMPONENT
normative_status: ACTIVE_CURRENT_GOVERNANCE_COMPONENT
common_scope: ALL_LIFECYCLE_STAGES_ALL_PAGES

purpose:
  statement: Every lifecycle stage operates as one canonical execution-remediation-closure cycle. Discovery without material remediation is diagnostic only and may never count as stage progress or closure.
  primary_outcome: DISCOVERED_REMEDIABLE_DEFECTS_ARE_MATERIALLY_ELIMINATED_AND_PROVEN_NON_REPRODUCIBLE_BEFORE_STAGE_ADVANCE
  fail_closed: true

canonical_execution_model:
  single_rule_set: true
  governance_calibration_uses_same_execution_rules_as_later_pages: true
  later_pages_must_resolve_the_same_active_registry: true
  alternate_lifecycle_rule_set_for_scale_out: FORBIDDEN
  execution_rules_may_diverge_between_calibration_and_later_pages: false

non_negotiable_principles:
  audit_pass_with_product_gap_still_present_is_remediation_success: false
  repeated_audit_blocked_loop_counts_as_progress: false
  discovered_remediable_gap_may_be_left_for_later_stage: false
  hidden_bug_search_required_after_known_bug_fix: true
  fresh_execution_must_start_from_clean_predecessor_baseline: true
  prior_stage_result_may_be_reused_as_current_result: false
  ai_may_invent_missing_product_authority_to_close_gap: false
  external_authority_gap_may_be_auto_resolved: false
  stage_may_mix_results_from_different_governance_uids: false

stage_specification_freeze:
  required_at_stage_entry: true
  frozen_governance_uid_receipt_required: true
  frozen_predecessor_baseline_receipt_required: true
  current_specification_registry_and_manifest_are_immutable_during_stage: true
  ordinary_mid_stage_normative_promotion: FORBIDDEN
  candidate_ledger_entry_changes_current_governance: false
  stage_output_created_under_different_governance_uid_may_be_combined: false
  specification_uid_drift_during_stage: BLOCK_STAGE
  ordinary_defect_owning_layer_only:
    product_or_contract_gap: CURRENT_STAGE_PRODUCT_OR_CONTRACT_OUTPUT
    harness_or_validator_bug: TEST_OR_VALIDATION_IMPLEMENTATION
    runtime_or_implementation_bug: IMPLEMENTATION_OR_RUNTIME
    evidence_or_state_bug: NON_NORMATIVE_EVIDENCE_OR_STATE
    external_authority_gap: EXTERNAL_OR_SHARED_AUTHORITY
  rule: Stage execution MUST NOT rewrite Current Specification merely because a product, implementation, validator, harness, state, or evidence defect was discovered.

mandatory_stage_cycle:
  ordered_steps:
    - STAGE_CURRENT_SPECIFICATION_BASELINE_FREEZE
    - CLEAN_PREDECESSOR_BASELINE_RESET
    - FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_GATE
    - FRESH_PHYSICAL_FILE_STAGE_EXECUTION
    - DEFECT_AND_GAP_ROOT_CAUSE_CLASSIFICATION_AND_LEDGER
    - MATERIAL_REMEDIATION_AT_OWNING_LAYER
    - EXECUTION_OUTPUT_AND_RUNTIME_EVIDENCE_CLEAN_RESET
    - FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_REGRESSION
    - FRESH_PHYSICAL_FILE_STAGE_REEXECUTION
    - KNOWN_DEFECT_SIGNATURE_ZERO_REPRODUCTION_CHECK
    - HIDDEN_DEFECT_MULTIDIRECTIONAL_SWEEP
    - STAGE_END_GOVERNANCE_CONSOLIDATION_REVIEW
    - CONSOLIDATED_NORMATIVE_PROMOTION_IF_AUTHORIZED_AND_REQUIRED
    - POST_PROMOTION_FULL_LINE_AND_STAGE_RESTART_IF_PROMOTED
    - STAGE_CLOSURE_DECISION
  order_may_be_skipped: false
  stage_advance_before_cycle_closure: BLOCK
  conditional_step_rule: CONSOLIDATED_NORMATIVE_PROMOTION_IF_AUTHORIZED_AND_REQUIRED may be NOT_APPLICABLE only when Stage-End review proves that no required reusable governance deficiency remains.

clean_predecessor_baseline_reset:
  required_before_first_execution_and_every_reexecution: true
  remove_generated_stage_outputs_from_prior_attempt: true
  remove_prior_attempt_runtime_evidence_from_active_input_path: true
  remove_cache_tmp_bak_pyc_and_other_execution_residue: true
  preserve_immutable_predecessor_authority_inputs: true
  preserve_authorized_fixes_at_their_owning_non_normative_or_product_layer: true
  rollback_meaning: RESET_EXECUTION_OUTPUTS_AND_STATE_TO_THE_SAME_PREDECESSOR_BASELINE_NOT_REVERT_THE_FIX
  baseline_identity_receipt_required: true

pre_execution_system_gate:
  gate: FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_GATE
  required_before_every_fresh_physical_stage_execution_or_reexecution: true
  pass_required: true
  skip_timeout_partial_or_denominator_drift: FAIL
  governance_definition_pass_may_mark_product_stage_pass: false

fresh_physical_file_stage_execution:
  actual_files_required: true
  stage_specific_loading_required: true
  prior_stage_result_reuse: FORBIDDEN
  previous_blocked_count_as_current_denominator_without_rescan: FORBIDDEN
  ai_autofill_to_make_execution_pass: FORBIDDEN
  semantic_inference_without_registered_authority: FORBIDDEN
  fresh_result_receipt_required: true

defect_root_cause_classification:
  required_for_every_discovered_issue: true
  classes:
    SPECIFICATION_DEFECT:
      owner: GOVERNANCE_SPECIFICATION
      handling_during_stage: RECORD_CANDIDATE_ONLY
      meaning: A reusable normative rule is missing, contradictory, incomplete, or permits recurrence.
    TEST_HARNESS_OR_VALIDATOR_BUG:
      owner: TEST_OR_VALIDATION_IMPLEMENTATION
      meaning: The normative rule is correct but the detector or execution harness is wrong.
    PRODUCT_MATERIALIZATION_OR_CONTRACT_GAP:
      owner: CURRENT_STAGE_PRODUCT_OR_CONTRACT_OUTPUT
      meaning: Required product behavior or contract is authorized but has not been materially represented at the owning stage.
    RUNTIME_OR_IMPLEMENTATION_BUG:
      owner: IMPLEMENTATION_OR_RUNTIME
      meaning: The stage contract is valid but implementation or runtime behavior violates it.
    EVIDENCE_OR_STATE_BUG:
      owner: NON_NORMATIVE_EVIDENCE_OR_STATE
      meaning: Product/specification truth is unchanged but tracked state or evidence is stale, inconsistent, or malformed.
    EXTERNAL_AUTHORITY_GAP:
      owner: EXTERNAL_OR_SHARED_AUTHORITY
      meaning: Required exact authority is absent and cannot be invented locally.
  one_primary_owner_required: true
  duplicate_finding_without_root_cause_update: BLOCK

stage_candidate_ledger:
  required_for_every_suspected_reusable_governance_deficiency: true
  ledger_ref: governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml
  normative_authority: false
  candidate_may_change_current_specification_mid_stage: false
  candidate_may_be_treated_as_active_rule: false
  candidate_must_identify:
    - originating_stage
    - defect_signature
    - observed_evidence
    - proposed_generalizable_rule
    - affected_scope
    - reason_product_specific_fix_is_insufficient
  ordinary_product_specific_issue_may_be_promoted_as_generic_rule: false

material_remediation:
  required_for_every_remediable_defect: true
  audit_or_diagnosis_only: NOT_REMEDIATION
  evidence_only_without_owning_layer_change: NOT_REMEDIATION
  legal_elimination_count_zero_with_reproducible_remediable_gap: BLOCK_CLOSURE
  product_gap_with_sufficient_current_authority:
    action: MATERIALIZE_MINIMAL_AUTHORIZED_CLOSURE_AT_OWNING_STAGE
    bounded_completion_must_follow: BOUNDED_FUNCTIONAL_COMPLETION
    generic_feature_invention: FORBIDDEN
  harness_or_validator_bug:
    action: FIX_HARNESS_OR_VALIDATOR_WITHOUT_RELAXING_NORMATIVE_RULE
  runtime_or_implementation_bug:
    action: FIX_IMPLEMENTATION_AT_OWNING_RUNTIME_OR_CODE_LAYER
  evidence_or_state_bug:
    action: CORRECT_ONLY_NON_NORMATIVE_EVIDENCE_OR_STATE
  external_authority_gap:
    action: PRESERVE_UNRESOLVED_AND_BLOCK_STAGE_UNTIL_AUTHORITATIVE_RESOLUTION_OR_FORMAL_NON_APPLICABILITY
    ai_inference_or_autofill: FORBIDDEN
  remediation_receipt_must_identify:
    - defect_signature
    - owning_layer
    - changed_artifact_or_authoritative_resolution
    - before_state
    - after_state
    - regression_target

retest_and_regression:
  reset_after_fix_required: true
  same_predecessor_baseline_identity_required: true
  same_frozen_governance_uid_required_until_stage_end_consolidation: true
  full_line_system_regression_must_pass_before_reexecution: true
  fresh_stage_reexecution_required: true
  every_previous_remediable_defect_signature_must_reproduce_count: 0
  material_elimination_denominator_must_equal_discovered_remediable_denominator: true
  newly_discovered_defect_restarts_same_stage_cycle: true
  same_signature_reappears_after_claimed_fix:
    classification: REMEDIATION_FAILURE
    stage_state: BLOCKED
    completion_credit: 0
    required_action: REOPEN_ROOT_CAUSE_AND_FIX_OWNING_LAYER

hidden_defect_sweep:
  required_after_known_defect_signatures_reach_zero: true
  multidirectional: true
  negative_path: true
  boundary_and_dependency_paths: true
  state_transition_and_failure_paths: true
  payload_input_output_paths: true
  authority_and_permission_paths: true
  asynchronous_and_provider_paths_when_applicable: true
  no_new_blocking_defect_required_for_stage_end_review: true

stage_end_governance_consolidation_review:
  mandatory_for_every_stage_attempt_after_known_defects_reach_zero_and_hidden_sweep_passes: true
  current_specification_remains_frozen_during_review: true
  review_inputs_required:
    - STAGE_FROZEN_GOVERNANCE_RECEIPT
    - DEFECT_ROOT_CAUSE_LEDGER
    - MATERIAL_REMEDIATION_RECEIPTS
    - DEFECT_SIGNATURE_REGRESSION_RECEIPT
    - HIDDEN_DEFECT_SWEEP_RECEIPT
    - SPECIFICATION_CHANGE_CANDIDATES_FOR_THIS_STAGE
  every_stage_candidate_must_receive_disposition: true
  permitted_candidate_dispositions:
    - REQUIRED_FOR_CONSOLIDATED_PROMOTION
    - REJECTED_PRODUCT_SPECIFIC
    - REJECTED_NOT_SUPPORTED_BY_EVIDENCE
    - NOT_APPLICABLE
  required_reusable_governance_deficiency_may_remain_unresolved_at_stage_closure: false
  max_atomic_promotion_transactions_per_stage_attempt: 1
  promotion_may_occur_before_stage_end_review: false
  promotion_may_be_split_into_incremental_mid_stage_mutations: false

consolidated_normative_promotion:
  only_when_stage_end_review_identifies_required_reusable_governance_deficiency: true
  explicit_user_specification_change_directive_required: true
  mutation_control_ref: SPECIFICATION_MUTATION_CONTROL.yaml
  finding_must_preexist_promotion: true
  authorization_receipt_must_preexist_promotion_commit: true
  single_atomic_promotion_commit_required: true
  immutable_governance_uid_must_change: true
  registry_and_manifest_update_in_same_atomic_commit: true
  all_required_candidates_for_that_stage_attempt_must_be_consolidated_together: true
  unrelated_scope_expansion: FORBIDDEN
  product_specific_data_may_be_promoted_as_generic_rule_without_evidence: false
  promotion_changes_current_stage_acceptance_basis: true
  previous_stage_acceptance_evidence_remains_historical_only: true
  previous_stage_attempt_may_close_after_promotion_without_restart: false

post_promotion_restart:
  required_when_consolidated_normative_promotion_occurs: true
  required_sequence:
    - FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_GATE_ON_NEW_UID
    - RESET_TO_SAME_CLEAN_PREDECESSOR_BASELINE
    - RECORD_NEW_STAGE_FROZEN_GOVERNANCE_RECEIPT
    - RESTART_STAGE_FROM_FIRST_MANDATORY_STEP
  new_uid_full_line_pass_required: true
  same_predecessor_baseline_identity_required: true
  mix_pre_promotion_and_post_promotion_stage_evidence: FORBIDDEN
  completion_credit_from_invalidated_pre_promotion_attempt: 0

fatal_specification_contradiction_exception:
  ordinary_execution_path: NOT_APPLICABLE
  may_interrupt_stage_only_when_current_specification_baseline_is_proven_invalid: true
  qualifying_conditions:
    - CURRENT_RULES_ARE_MUTUALLY_CONTRADICTORY_FOR_REQUIRED_STAGE_BEHAVIOR
    - CURRENT_RULES_MAKE_REQUIRED_STAGE_ACCEPTANCE_LOGICALLY_IMPOSSIBLE
    - CURRENT_RULES_DEFINE_AN_INVALID_OR_SELF_CONTRADICTORY_ACCEPTANCE_BASELINE
  non_qualifying_conditions:
    - PRODUCT_MATERIALIZATION_OR_CONTRACT_GAP
    - TEST_HARNESS_OR_VALIDATOR_BUG
    - RUNTIME_OR_IMPLEMENTATION_BUG
    - EVIDENCE_OR_STATE_BUG
    - EXTERNAL_AUTHORITY_GAP
    - CONVENIENCE_OR_DESIRE_TO_MAKE_GATE_PASS
  required_sequence:
    - STOP_CURRENT_STAGE
    - RECORD_BLOCKING_SPECIFICATION_DEFECT_AND_FATAL_CONTRADICTION_EVIDENCE
    - MARK_CURRENT_STAGE_ATTEMPT_NON_AUTHORITATIVE_FOR_CLOSURE
    - OBTAIN_NEW_EXPLICIT_USER_SPECIFICATION_CHANGE_AUTHORIZATION
    - APPLY_SINGLE_ATOMIC_GOVERNANCE_REPAIR_WITH_NEW_UID_AND_REGISTRY_MANIFEST_BINDING
    - PASS_FULL_LINE_MULTIDIRECTIONAL_HIGH_PRESSURE_SYSTEM_GATE
    - RESET_TO_SAME_CLEAN_PREDECESSOR_BASELINE
    - RESTART_STAGE_FROM_FIRST_MANDATORY_STEP
  ai_may_self_authorize_exception: false
  exception_may_be_used_to_bypass_owning_layer_remediation: false
  completion_credit_from_interrupted_attempt: 0

stage_closure_gate:
  stage_execution_used_one_final_governance_uid_from_freeze_through_closure: REQUIRED
  all_discovered_remediable_defects_materially_eliminated: REQUIRED
  previous_defect_signature_reproduction_count: 0
  new_blocking_defect_count: 0
  required_stage_outputs_complete: REQUIRED
  required_external_authority_resolved_or_formally_non_applicable: REQUIRED
  stage_end_governance_consolidation_review: PASS_REQUIRED
  required_reusable_governance_deficiency_remaining: 0
  final_full_line_high_pressure_system_gate: PASS_REQUIRED
  fresh_stage_reexecution: PASS_REQUIRED
  hidden_defect_sweep: PASS_REQUIRED
  evidence_chain_complete: REQUIRED
  otherwise: BLOCK_STAGE_ADVANCE

governance_calibration_completion_and_scale_out:
  pilot_scope_source: EXECUTION_STATE_DECLARED_PILOT_PAGE_SET
  pilot_must_complete_all_required_lifecycle_stages_before_scale_out: true
  all_known_remediable_defect_signatures_must_be_zero: true
  no_new_blocking_hidden_defects_required: true
  every_stage_closure_receipt_required: true
  final_full_line_system_gate_after_pilot_lifecycle_required: true
  governance_calibration_completion_receipt_required: true
  after_calibration_completion:
    other_pages_may_directly_consume_same_active_governance: true
    other_pages_must_follow_same_stage_cycle: true
    alternate_execution_rule_set_for_other_pages: FORBIDDEN
    new_governance_version_required_only_when_future_evidence_justifies_authorized_normative_change: true
  repeated_known_defect_on_later_page:
    classification: GOVERNANCE_OR_MATERIALIZATION_REGRESSION
    stage_state: BLOCKED
    required_action: FIX_BEFORE_CONTINUING_PAGE_SCALE_OUT

required_evidence_classes:
  - STAGE_FROZEN_GOVERNANCE_RECEIPT
  - CLEAN_BASELINE_RESET_RECEIPT
  - FULL_LINE_SYSTEM_HIGH_PRESSURE_RECEIPT
  - FRESH_STAGE_EXECUTION_RECEIPT
  - DEFECT_ROOT_CAUSE_LEDGER
  - MATERIAL_REMEDIATION_RECEIPT
  - DEFECT_SIGNATURE_REGRESSION_RECEIPT
  - HIDDEN_DEFECT_SWEEP_RECEIPT
  - STAGE_END_GOVERNANCE_CONSOLIDATION_RECEIPT
  - CONSOLIDATED_PROMOTION_RECEIPT_WHEN_APPLICABLE
  - POST_PROMOTION_STAGE_RESTART_RECEIPT_WHEN_APPLICABLE
  - STAGE_CLOSURE_RECEIPT

status: ACTIVE
