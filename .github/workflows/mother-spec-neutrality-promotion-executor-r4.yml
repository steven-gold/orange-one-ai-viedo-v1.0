name: Hardened Mother Spec Neutrality Promotion Executor R4
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - .github/workflows/mother-spec-neutrality-promotion-executor-r4.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: python3 -m pip install pyyaml
      - name: Materialize R3 neutral candidate and authority projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          d=yaml.safe_load(Path('.github/workflows/mother-spec-neutrality-promotion-executor-r3.yml').read_text())
          step=next(s for s in d['jobs']['promote']['steps'] if s.get('name')=='Materialize neutral candidate and neutral closure validator')
          subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
      - name: Validate all neutral governance gates
        shell: bash
        run: |
          python3 governance/ci/validate_governance_layout.py
          python3 governance/ci/stress_test_governance_registry.py
          python3 governance/ci/validate_validation_remediation_closure_protocol.py
          python3 governance/ci/validate_governance_portability.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          d=yaml.safe_load(Path('.github/workflows/mother-spec-neutrality-promotion.yml').read_text())
          for name in ['Validate neutral policy and profile separation','Validate compiled source governance','Ensure superseded active components are gone and history is not destroyed']:
              step=next(s for s in d['jobs']['promote']['steps'] if s.get('name')==name)
              subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
      - name: Exhaustive parent-aware Mother Current source and immutable-baseline audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,yaml,json
          R=Path('.'); M=R/'.github/governance-source/active/source/12_DOCS/mother-spec'; C=R/'governance/specifications/current'; P=R/'.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_LIFECYCLE_STAGE_REGISTRY.yaml'
          failures=[]; docs=[]; alluids=[]
          fixed_stage=re.compile(r'(?i)\bstage(?:[-_ ]?0?\d{1,2}|\d{1,2})\b'); fixed_den=re.compile(r'(?i)\b(?:11[- ]?stage|exactly eleven ordered stages|fixed lifecycle)\b'); retry=re.compile(r'\bR\d{1,3}\b')
          for p in sorted(M.glob('*.md')):
              t=p.read_text(encoding='utf-8'); anchors=list(re.finditer(r'<!-- SECTION_UID:\s*([^\s]+)\s*-->',t)); u=[m.group(1) for m in anchors]; alluids += u; bad=[]; structural_parents=[]; true_empty=[]
              if fixed_stage.search(t): bad.append('fixed-stage')
              if fixed_den.search(t): bad.append('fixed-denominator')
              if retry.search(t): bad.append('retry-id')
              if '.github/workflows/' in t or 'governance/test/' in t: bad.append('implementation-test-path')
              if len(u)!=len(set(u)): bad.append('duplicate-section-uid')
              for i,m in enumerate(anchors):
                  end=anchors[i+1].start() if i+1<len(anchors) else len(t); uid=m.group(1); lines=[x.strip() for x in t[m.end():end].splitlines() if x.strip()]
                  if len(lines)<2:
                      next_uid=anchors[i+1].group(1) if i+1<len(anchors) else ''
                      heading_only=(len(lines)==1 and lines[0].startswith('#'))
                      direct_child=bool(next_uid.startswith(uid+'-'))
                      if heading_only and direct_child:
                          structural_parents.append(uid)
                      else:
                          true_empty.append(uid)
              if true_empty: bad.append('true-empty-section:'+','.join(true_empty))
              if bad: failures.append(p.name+':'+','.join(bad))
              docs.append({'file':p.name,'sections':len(u),'structural_parent_sections':structural_parents,'true_empty_sections':true_empty,'failures':bad})
          if len(alluids)!=len(set(alluids)): failures.append('cross-document-section-uid-duplicate')
          man=yaml.safe_load((C/'SPECIFICATION_MANIFEST.yaml').read_text()) or {}; comps=man.get('components') or []; files=[x.get('file') for x in comps]
          if len(comps)!=7 or len(files)!=len(set(files)): failures.append('current-component-set-invalid')
          if {x.name for x in C.glob('*.yaml')} != set(files)|{'SPECIFICATION_MANIFEST.yaml'}: failures.append('current-physical-manifest-drift')
          auids=[]
          for f in files:
              d=yaml.safe_load((C/f).read_text()) or {}; txt=(C/f).read_text(); auids.append(d.get('artifact_uid'))
              if d.get('formal_current_authority') is not True or d.get('layer_classification')!='POLICY': failures.append('current-authority-layer-invalid:'+f)
              if fixed_stage.search(txt) or fixed_den.search(txt) or retry.search(txt): failures.append('current-execution-instance-pollution:'+f)
              if '.github/workflows/' in txt or 'governance/test/' in txt: failures.append('current-implementation-test-path:'+f)
          if None in auids or len(auids)!=len(set(auids)): failures.append('current-artifact-uid-invalid')
          for old in ['STAGE_EXECUTION_OPTIMIZATION.yaml','STAGE_TEST_REMEDIATION_CLOSURE_PROTOCOL.yaml','TEST_FEEDBACK_TEMPORARY_ARTIFACT_LIFECYCLE.yaml']:
              if (C/old).exists(): failures.append('superseded-active-residual:'+old)
          prof=yaml.safe_load(P.read_text()) or {}
          if prof.get('layer_classification')!='EXECUTION_PROFILE' or prof.get('global_normative_authority') is not False or prof.get('profile_local_denominator')!=11 or len(prof.get('stages') or [])!=11: failures.append('acpos-execution-profile-invalid')
          reg=yaml.safe_load((R/'governance/specifications/REGISTRY.yaml').read_text()) or {}; entry=yaml.safe_load((R/'GOVERNANCE_CURRENT.yaml').read_text()) or {}; state=yaml.safe_load((R/'governance/test/ACTIVE_STATE.yaml').read_text()) or {}
          uid='GOV-REV-20260915-NEUTRAL-PORTABLE-GOVERNANCE'
          if (reg.get('active_specification') or {}).get('governance_uid')!=uid: failures.append('registry-current-uid-invalid')
          if entry.get('registry_ref')!='governance/specifications/REGISTRY.yaml': failures.append('root-registry-ref-invalid')
          if ((entry.get('selected_execution_profile') or {}).get('global_normative_authority')) is not False: failures.append('root-profile-authority-invalid')
          if state.get('specification_uid')!=uid: failures.append('active-state-current-uid-invalid')
          trans=state.get('governance_revision_transition') or {}
          if trans.get('fresh_revalidation_required') is not True or trans.get('predecessor_attempt_may_close_under_current_governance') is not False: failures.append('predecessor-evidence-revalidation-boundary-invalid')
          ex=state.get('execution') or {}
          if ex.get('website_construction_allowed') is not False or ex.get('deployment_allowed') is not False: failures.append('product-gate-opened-during-governance-promotion')
          out={'status':'PASS' if not failures else 'FAIL','mother_documents':docs,'mother_section_total':len(alluids),'current_policy_components':len(files),'acpos_profile_steps':len(prof.get('stages') or []),'failures':failures}; print(json.dumps(out,ensure_ascii=False,indent=2))
          if failures: raise SystemExit(1)
          PY
          python3 .github/governance-source/active/source/11_TEST/VERIFY_GITHUB_MATERIALIZED_SOURCE.py
          git diff --name-only HEAD -- governance/test/stage01 | grep -q . && { echo STAGE01_MUTATED; exit 1; } || true
          echo 'PASS: immutable Stage-01 baseline untouched; external-authority source evidence therefore unchanged'
      - name: Persist authorized neutral governance promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOVERNANCE_CURRENT.yaml governance .github/governance-source
          git reset -- .github/workflows || true
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "governance(spec): promote neutral portable mother policy v2.2.0" -m "Authorization: USR-DIRECTIVE-20260915-MOTHER-SPEC-NEUTRALITY-AUDIT" -m "Separates reusable POLICY from ACPOS EXECUTION_PROFILE, removes Stage/Run-specific authority pollution, preserves structural parent sections and historical execution evidence, and requires fresh revalidation after authority promotion."
          git push origin HEAD:rebuild-v2.1.1
