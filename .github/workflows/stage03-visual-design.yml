name: Stage-03 Visual Design Product Execution
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/test/ACTIVE_STATE.yaml'
      - 'governance/test/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml'
      - 'governance/ci/run_current_stage3_visual_design.py'
      - 'governance/ci/validate_active_consumer_reference_integrity.py'
      - '.github/workflows/stage03-visual-design.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage03-actual-execution:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[stage03-execute]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-stage03-pycache
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, fetch-depth: 0}
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Lock exact execution SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Validate Stage-03 reusable producer
        run: python governance/ci/run_current_stage3_visual_design.py --self-test
      - name: Run canonical Full-Line before Stage-03 product execution
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
      - name: Validate common Stage-03 admission
        run: |
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-03
      - name: Execute fresh Stage-03 visual design to review boundary
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python governance/ci/run_current_stage3_visual_design.py --execute
      - name: Validate normalized Stage-03 evidence
        run: python governance/ci/stage_execution_engine.py --validate-evidence --stage STAGE-03 --evidence governance/test/stage03/STAGE03_LATEST_TEST_EVIDENCE.json
      - name: Validate shared projectors after Stage-03 execution
        run: |
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_selected_execution_profile_integrity.py
      - name: Persist Stage-03 product execution atomically
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "test(stage03): persist CORE-01 visual design review boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
