name: VIDEO-01 runtime classification patch once

on:
  push:
    branches:
      - acpos-video01-closure-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-video01-closure-20260902
      - name: Guard trigger
        id: guard
        run: |
          msg=$(git log -1 --format=%s)
          if [ "$msg" = "chore(video): add one-time runtime classification patch" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - name: Patch controlled projection classification
        if: steps.guard.outputs.run == 'yes'
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/domain/video/videoProjectionPort.ts')
          s=p.read_text()
          if 'isControlledTestMode' not in s:
            s='import{isControlledTestMode}from"@/domain/testing/controlledTestData";\n'+s
          old='export type VideoNormalizedProjection={page_state:string|null;task_id:string|null;current_version_id:string|null;candidate_version_id:string|null;current_uri:string|null;candidate_uri:string|null;versions:readonly VideoProjectionVersion[];values:Readonly<Record<string,string>>;lists:Readonly<Record<string,readonly VideoListItem[]>>;filters:Readonly<Record<string,readonly VideoListItem[]>>;gate_state:Readonly<Record<string,boolean>>};'
          new='export type VideoProjectionTestMetadata={data_classification:"TEST_ONLY";synthetic:true;test_dataset_id:string;test_run_id:string;created_for_validation:true;production_eligible:false};\nexport type VideoNormalizedProjection={page_state:string|null;task_id:string|null;current_version_id:string|null;candidate_version_id:string|null;current_uri:string|null;candidate_uri:string|null;versions:readonly VideoProjectionVersion[];values:Readonly<Record<string,string>>;lists:Readonly<Record<string,readonly VideoListItem[]>>;filters:Readonly<Record<string,readonly VideoListItem[]>>;gate_state:Readonly<Record<string,boolean>>;test_metadata?:VideoProjectionTestMetadata};'
          assert old in s
          s=s.replace(old,new,1)
          old='if(!resolver)return{ok:false as const,error_uid:"VIDEO-01-ERR-CONTEXT-001",reason_code:"VIDEO_PROJECTION_ADAPTER_NOT_BOUND",correlation_id};try{return{ok:true as const,projection:await resolver.resolve(raw),correlation_id};catch'
          if old in s:
            raise SystemExit('unexpected malformed source')
          needle='if(!resolver)return{ok:false as const,error_uid:"VIDEO-01-ERR-CONTEXT-001",reason_code:"VIDEO_PROJECTION_ADAPTER_NOT_BOUND",correlation_id};try{return{ok:true as const,projection:await resolver.resolve(raw),correlation_id};}catch'
          repl='if(!resolver){if(isControlledTestMode()&&raw&&typeof raw==="object"&&(raw as Partial<VideoNormalizedProjection>).test_metadata?.data_classification==="TEST_ONLY"&&(raw as Partial<VideoNormalizedProjection>).test_metadata?.production_eligible===false)return{ok:true as const,projection:raw as VideoNormalizedProjection,correlation_id};return{ok:false as const,error_uid:"VIDEO-01-ERR-CONTEXT-001",reason_code:"VIDEO_PROJECTION_ADAPTER_NOT_BOUND",correlation_id};}try{const projection=await resolver.resolve(raw);if(projection.test_metadata!==undefined&&!isControlledTestMode())throw new Error("VIDEO_TEST_PROJECTION_FORBIDDEN_IN_PRODUCTION");return{ok:true as const,projection,correlation_id};}catch'
          assert needle in s
          s=s.replace(needle,repl,1)
          p.write_text(s)

          p=Path('src/server/testing/controlledVideoTestRuntime.ts')
          s=p.read_text()
          needle='filters:{"VIDEO-01-CTL-FILTER":[{ref:"ALL",label:"All"},{ref:"READY",label:"Ready"},{ref:"REVIEW",label:"Review"}]},gate_state:gates()};}'
          assert needle in s
          s=s.replace(needle,'filters:{"VIDEO-01-CTL-FILTER":[{ref:"ALL",label:"All"},{ref:"READY",label:"Ready"},{ref:"REVIEW",label:"Review"}]},gate_state:gates(),test_metadata:TEST_METADATA};}',1)
          p.write_text(s)

          p=Path('src/components/pages/VideoVisual.tsx')
          s=p.read_text()
          needle='data-authority-controls="85" data-registry-valid={registryValid?"true":"false"} data-runtime-reason={runtimeReason??undefined}'
          assert needle in s
          s=s.replace(needle,'data-authority-controls="85" data-registry-valid={registryValid?"true":"false"} data-data-classification={projection?.test_metadata?.data_classification} data-production-eligible={projection?.test_metadata?String(projection.test_metadata.production_eligible):undefined} data-runtime-reason={runtimeReason??undefined}',1)
          p.write_text(s)
      - name: Commit product patch
        if: steps.guard.outputs.run == 'yes'
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add src/domain/video/videoProjectionPort.ts src/server/testing/controlledVideoTestRuntime.ts src/components/pages/VideoVisual.tsx
          git commit -m "fix(video): isolate controlled projection metadata"
          git push origin HEAD:acpos-video01-closure-20260902
