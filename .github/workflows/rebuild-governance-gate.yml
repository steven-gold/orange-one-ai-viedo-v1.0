name: Governance v2.1.8 CORE-ASSET Pre-Page Replay Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v218-pre-page-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact pre-Page replay checkpoint under v2.1.8
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          run=Path('00_SOURCE_INTAKE/fresh_run_003')
          s=yaml.safe_load((run/'EXECUTION_STATE.yaml').read_text())
          r=yaml.safe_load((run/'V218_REPLAY_STATE.yaml').read_text())
          lock=yaml.safe_load(Path('governance/current/v2.1.8/FULL_PACKAGE_LOCK.yaml').read_text())
          assert s['governance_candidate_overlay']=='v2.1.8'
          assert s['state']=='RESPONSIBILITY_CLASSIFICATION_COMPLETED'
          assert s['responsibility_classification_completed'] is True
          assert s['classification_artifact_count']==52
          assert s['blueprint_materialization_started'] is False
          assert s['page_base_blueprint_started'] is False
          assert not (run/'02_BASE_BLUEPRINT').exists()
          assert r['source_checkpoint_commit']=='90cbd4b5fee1b7aea25a0c15ca3b661bab605960'
          assert r['old_page_blueprint_bytes_reuse']=='FORBIDDEN'
          assert lock['source_package_sha256']=='a108845fbde176cbd20a5f9df4217c68b6512686dedc00ffc8c44e9cc2b04753'
          print('PASS: CORE-01 / ASSET-01 restored to pre-Page Blueprint checkpoint and governed by v2.1.8')
          PY
  current-v218-phase-successor-authority-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_phase_authority.py
  current-v218-responsibility-classification-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_classification.py
  current-v218-upstream-projection-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_upstream_projection.py
  sealed-v216-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_sealed_v216_runtime.py
