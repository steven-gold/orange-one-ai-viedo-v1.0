  detail_floor_reference:
    source: USER_UPLOADED_ACPOS_CORE01_CONSTRUCTION_BLUEPRINT_PACKAGE_2026-09-11
    requirement: REUSABLE_GOVERNANCE_OUTPUT_CONTRACT_DETAIL_MUST_BE_AT_LEAST_AS_COMPLETE_AS_REFERENCE_PACKAGE
    required_generic_equivalents:
      - CURRENT_TRUTH_AND_SOURCE_MAP
      - NAMING_AND_TYPED_IDENTITY_RESOLUTION
      - SCOPE_AND_GATE_STATUS
      - CHANGE_SET_AND_IMPACT_MAP
      - PAGE_OR_CAPABILITY_DESIGN_CONTRACT
      - SECTION_COMPONENT_CONTROL_FIELD_BINDING
      - BUSINESS_ENTITY_AND_OPERATION_LIFECYCLE
