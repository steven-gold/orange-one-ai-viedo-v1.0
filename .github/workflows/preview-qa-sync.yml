name: Sync QA Preview Link
on:
  push:
    branches: [acpos-live-preview]
    paths: [.github/workflows/preview-qa-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only QA nav item
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview/index.html')
          s=p.read_text()
          old='<button disabled><span class="ico">✓</span><span class="nav-label">QA</span></button>'
          new='<a href="qa.html" data-route="/qa"><span class="ico">✓</span><span class="nav-label">QA</span></a>'
          if old not in s:
              raise SystemExit('QA disabled nav item not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit synchronized preview and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          git rm .github/workflows/preview-qa-sync.yml
          git commit -m "feat(preview): enable QA-01 navigation [skip ci]"
          git push
