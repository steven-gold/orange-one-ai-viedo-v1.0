governance:
  ai_build_rules:
  - rule_uid: EDIT-01-AI-RULE-01
    rule: 先建立本文件 Section/Component/UID Registry，再建立 UI；不得先自行設計。
  - rule_uid: EDIT-01-AI-RULE-02
    rule: Control UID、Label、位置、Action UID、Enable Gate 必須逐一對照，不可省略任何欄位。
  - rule_uid: EDIT-01-AI-RULE-03
    rule: 每個可執行 control 必須有唯一 Action；每個 Action 必須具有明確 Effect Type、success/error contract。
  - rule_uid: EDIT-01-AI-RULE-04
    rule: 若實際服務/API 名稱與本文邏輯不衝突，可綁定既有服務；不得改變本文 UI/flow/UID。
  - rule_uid: EDIT-01-AI-RULE-05
    rule: 若任何其他來源與本文 EDIT 規劃衝突，以本文為準；不得混合兼容兩套 UI。
  - rule_uid: EDIT-01-AI-RULE-06
    rule: 建立完必須跑 Visual Contract、Control Contract、State Transition、Permission、Evaluation Gate、Version Immutability、Standalone Upload 測試。
  - rule_uid: EDIT-01-AI-RULE-07
    rule: PROJECT_TASK 首次生產不得要求使用者輸入剪輯/配音/配樂/SFX/字幕/對嘴腳本，也不得顯示素材 Picker；資料只由 Locked Blueprint Production Package 自動解析。
  - rule_uid: EDIT-01-AI-RULE-08
    rule: DNA/Asset 只能依 Blueprint→Script Section→Binding Manifest→Exact Asset ID/Version/filename/checksum 解析；任何 mismatch=BLOCK，禁止 AI 搜尋替代。
  - rule_uid: EDIT-01-AI-RULE-09
    rule: 專案修改若需要新增/更換 Script/DNA/Asset binding，只能退回藍圖修正；EDIT 不跨部門定義也不自行建立新來源。
  - rule_uid: EDIT-01-AI-RULE-10
    rule: 各部門文件只定義本部門內部實作與自身 Inbound/Outbound boundary；不得在 EDIT 文件定義 VIDEO/ASSET/QA 內部流程。
  forbidden_rules:
  - 禁止新增任何剪輯、配音、字幕、QA、版本、輸出功能子頁或平行後製頁；所有功能維持 EDIT-01 單頁。
  - 禁止引用或回填本文 CURRENT ONLY 以外的歷史切版比例、固定側欄幾何、舊展示圖、舊部門專屬色票或按鈕樣式。
  - API/AI、人工 Timeline、Voice/Audio/LipSync/Subtitle/QA/Version/Output 必須操作同一 Working Draft/Version lineage；不得建立平行工作區。
  - 禁止以普通 Seek/Progress slider 取代 Timeline、Playhead、Range、Ruler、Zoom、Marker；主 Preview 必須維持 16:9。
  - 禁止 AI 建立任何未列入本文件 UID 白名單的功能、來源模式、Asset Picker、Provider fallback、跨部門內部流程、替代 Layout 或視覺 Token；未列 UID/Token 即視為不存在。
  - 禁止建立 Sample Data / 假 Job / 假 Version / 假 Score / 假 Evidence / 假 Output。
  - 禁止將 VIEW / UI_ONLY control 綁成寫入資料庫 Action；禁止將 Side-effect button 留成無 Action UID。
  - 禁止用「TBD / 依情況 / 由 AI 決定 / 可自行擴充 / 類似其他頁面」作為工程定義。
  - 任何未列 UID 的物件不得生成；需要新增功能時必須先更新本權威文件再施工。
  final_acceptance_matrix:
  - acceptance_uid: EDIT-01-ACC-01
    item: 只有 EDIT-01 單頁；不存在功能子頁
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-02
    item: Word 圖像與 Section/Control UID Registry 同步
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-03
    item: 兩種 Source Mode 均依規則運作：PROJECT_TASK 自動載入 Blueprint/Package/Bindings；STANDALONE 無 Project/Task 且使用 Session Upload
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-04
    item: Timeline 為主編輯器；Playhead/Range/Zoom/Marker/Snap/Frame Nudge 完整
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-05
    item: 人工 Split/Trim/Move/Delete/Duplicate/Transition/Speed/Volume/Fade 可 Undo/Redo；Replace Source 僅 Standalone，PROJECT_TASK 禁止直接換來源
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-06
    item: PROJECT_TASK Correction / STANDALONE：中文需求或合法 Scope → Correction Script Candidate → Compare → Execute/Apply → Stage Recheck
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-07
    item: Voice/Music/SFX/Mix/LipSync/Subtitle 全同頁且不繞過各自 service permission
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-08
    item: Stage Evaluation Issue → Marker/Range → Correction → Recheck → Closed
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-09
    item: Save New Version 不覆寫；Lock Exact Version；Restore 只產生新 Draft
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-10
    item: Blocking QA 阻擋 Render/Lock/Handoff
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-11
    item: Render 失敗不得產生假 Output；Output 必須有 Manifest/Checksum/Version Ref
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-12
    item: 所有可見控制均有 UID，所有可執行控制均有明確 Action UID/Effect Type，未定義控制=0
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-13
    item: 不得出現任何未列白名單的替代規劃或 AI 自行擴充內容
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-14
    item: 上游影片任務完成並符合其 Outbound Handoff 後，EDIT 必須出現待辦/Task Ready；選定 Project/Topic/Task 後自動 Resolve Blueprint/Package/Input Manifest
    condition: 必須 PASS
  - acceptance_uid: EDIT-01-ACC-15
    item: PROJECT_TASK 首次生產 AUTO/MANUAL 都零腳本手動輸入；MANUAL 只控制 Stage 前進/確認
    condition: 必須 PASS
