review_findings:
  request_identity:
    accepted_exact_binding: false
    observations:
    - Production Script V1.3 provides api_request_hash and job/result lineage, but does not explicitly bind the S061 field request_identity.
    - System Authority and Page Integration Matrix do not explicitly declare request_identity as this provider lifecycle binding.
  queued:
    accepted_exact_binding: false
    observations:
    - Queue Authority defines enqueue/claimability mechanics, but this audit does not equate queue existence or available_at state with the named S061 queued binding without an explicit binding.
    - ASSET page status/representation language is not accepted as provider lifecycle Authority.
  running:
    accepted_exact_binding: false
    observations:
    - Queue claim/lease mechanics are not accepted as the named S061 running binding without an explicit lifecycle binding.
    - ASSET page status/representation language is not accepted as provider lifecycle Authority.
  cancel:
    accepted_exact_binding: false
    observations:
    - No explicit provider-execution cancel lifecycle binding was identified in the enumerated Current Authority sources.
  callback_result_provenance:
    accepted_exact_binding: false
    observations:
    - AIAPI-01 defines callback read fields and prohibits unverified callback success, but that read model is not accepted as an explicit callback_result_provenance lifecycle binding.
    - Page Integration Matrix callback projection references are not accepted as lifecycle provenance ownership.
  output_persistence:
    accepted_exact_binding: false
    observations:
    - AIAPI-01 artifact read fields and Production Script job/result lineage do not explicitly bind S061 output_persistence for CORE-01 and ASSET-01 provider execution.
  audit_correlation:
    accepted_exact_binding: false
    observations:
    - Queue Authority requires correlation_id for provider execution payloads, while other Authorities require audit in separate contexts; this audit forbids composing those independent statements into audit_correlation without an explicit binding.
