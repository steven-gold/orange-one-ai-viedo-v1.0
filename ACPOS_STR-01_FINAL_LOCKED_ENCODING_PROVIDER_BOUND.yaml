  integration_ports:
  - port_uid: STR-01-PORT-PROJECTION
    boundary: Strategic Center Projection
    operation: getUiProjection
    method_path: GET /v1/ui-projections/{pageUid}
    permission: page/strategy read
    state_event: READ_ONLY
    exposure: all read-only strategic page data
  - port_uid: STR-01-PORT-CONVERSATION
    boundary: Strategic Conversation
    operation: sendConversationMessage
    method_path: POST /v1/conversations/{conversationId}/messages
    permission: conversation.write
    state_event: Conversation ACTIVE→ACTIVE | conversation.message.sent
    exposure: Single/Multi AI through shared conversation core; provider mode/router remains system-owned
  - port_uid: STR-01-PORT-STOP
    boundary: Conversation Control
    operation: stopConversationGeneration
    method_path: POST /v1/conversations/{conversationId}/generation/stop
    permission: conversation.write
    state_event: stop current generation only
    exposure: current conversation only
  - port_uid: STR-01-PORT-COMPARE
    boundary: Strategy Candidate Compare
    operation: compareCandidates
    method_path: GET /v1/candidates/compare
    permission: candidate.read
    state_event: READ_ONLY
    exposure: exact candidate refs only
  - port_uid: STR-01-PORT-REVIEW
    boundary: Strategy Review
    operation: submitStrategyReview
    method_path: POST /v1/state-commands/strategycandidate/submitstrategyreview
    permission: strategy.decision.propose
    state_event: StrategyCandidate:CANDIDATE→REVIEW_REQUIRED | ai.strategy.review_requested
    exposure: human review request; no auto approval
  - port_uid: STR-01-PORT-ADOPT
    boundary: Strategy Context Adoption
    operation: adoptAsContextCandidate
    method_path: POST /v1/state-commands/strategycandidate/adoptascontextcandidate
    permission: strategy.decision.approve
    state_event: StrategyCandidate:REVIEW_REQUIRED→ADOPTED | ai.strategy.context_adopted
    exposure: governed context adoption only; owner module executes later
acceptance:
- acceptance_uid: STR-01-ACC-01
  item: Single Page / Global Visual
  condition: Only workspace:STR-01; Global Shell/Visual inherited; no parallel Strategic Center page
- acceptance_uid: STR-01-ACC-02
  item: Strategic Context
  condition: Market/industry/competition/internal/resource/cost/risk/governance sources expose exact ref/time/version/confidence; no AI fill
- acceptance_uid: STR-01-ACC-03
  item: Single / Multi AI
  condition: Same conversation template; same issue/context in Multi AI; no manual Provider/Model picker; Assistant always exists
- acceptance_uid: STR-01-ACC-04
  item: Analysis Transparency
  condition: Basis/assumptions/opportunities/risks/uncertainty/evidence and option comparison are visible before review
