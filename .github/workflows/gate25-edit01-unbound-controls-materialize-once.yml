name: ACPOS Gate25 EDIT-01 Unbound Controls Materialize Once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/gate25-edit01-unbound-controls-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize exact ten unbound EDIT-01 formal controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          ledger_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json')
          inventory_path=Path('docs/construction/evidence/PRODUCTION_FORMAL_CONTROL_ACTION_INVENTORY_2026-09-10.json')
          diagnostic_path=Path('docs/construction/evidence/GATE25_EDIT01_FORMAL_IDENTITY_DIAGNOSTIC_2026-09-11.json')
          authority_path=Path('authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml')
          evidence_path=Path('docs/construction/evidence/GATE25_EDIT01_UNBOUND_FORMAL_CONTROLS_2026-09-11.json')

          targets=[
            'control:CTRL-WORKSPACE-EDIT-01-APPROVED-VIDEO-HANDOFF-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-CANDIDATE-OUTPUT-PANEL-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-DECISION-DOCK-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-EDITING-SCRIPT-VIEW-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-PROJECT-TOPIC-TASK-TREE-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-QA-HANDOFF-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-SCORECARD-PANEL-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-TASK-HEADER-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-TIMELINE-WORK-AREA-OPEN',
            'control:CTRL-WORKSPACE-EDIT-01-VOICE-SUBTITLE-REFS-OPEN',
          ]
          assert len(targets)==10 and len(set(targets))==10

          ledger=json.loads(ledger_path.read_text())
          inventory=json.loads(inventory_path.read_text())
          diagnostic=json.loads(diagnostic_path.read_text())
          authority=authority_path.read_text()
          assert ledger['counts']=={'PASS':51,'BLOCKED':194,'NOT_EXECUTED':1236},ledger['counts']
          assert ledger['denominator']=={'controls':1155,'actions':326,'total':1481}
          assert inventory['denominator']=={'controls':1155,'actions':326,'total':1481}
          assert diagnostic['status']=='READ_ONLY_CLASSIFICATION_COMPLETE'
          assert diagnostic['mutation_scope']=='NONE_LEDGER_READ_ONLY'
          assert diagnostic['stats']['total']==36
          assert diagnostic['classification_by_disposition'].get('NO_CURRENT_EXACT_OWNER::NOT_EXECUTED')==10
          assert 'status: FINAL_LOCKED' in authority
          assert 'current_only: true' in authority
          assert 'legacy_merge: FORBIDDEN' in authority

          rows={x['resource_key']:x for x in diagnostic['rows']}
          entries={x['resource_key']:x for x in ledger['entries']}
          formal={x['resource_key']:x for x in inventory['resources']}
          for key in targets:
            assert key in rows and key in entries and key in formal,key
            assert rows[key]['classification']=='NO_CURRENT_EXACT_OWNER',rows[key]
            assert rows[key]['authority_exact'] is False
            assert rows[key]['src_exact'] is False
            assert rows[key]['disposition']=='NOT_EXECUTED'
            assert entries[key]['disposition']=='NOT_EXECUTED'
            assert formal[key]['resource_type']=='CONTROL'

          now=datetime.now(timezone(timedelta(hours=8))).isoformat()
          evidence={
            'document_id':'ACPOS_GATE25_EDIT01_UNBOUND_FORMAL_CONTROLS',
            'status':'PHYSICAL_ALIGNMENT_BLOCKERS_VERIFIED',
            'recorded_at':now,
            'production_release_sha':ledger['production_release_sha'],
            'resource_count':10,
            'resource_type':'CONTROL',
            'resources':targets,
            'diagnostic':str(diagnostic_path),
            'current_authority':str(authority_path),
            'formal_inventory':str(inventory_path),
            'classification':'NO_CURRENT_EXACT_OWNER',
            'authority_exact':False,
            'src_exact':False,
            'reason_code':'CURRENT_FORMAL_CONTROL_UID_NOT_BOUND_BY_CURRENT_PAGE_AUTHORITY',
            'rule':'These ten active Production formal CONTROL identities have neither an exact FINAL_LOCKED EDIT-01 authority owner nor an exact src binding. Do not infer semantic aliases or recreate retired UI. Resolve by authoritative catalog remap/deactivation or explicit Current Authority registration.'
          }
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          for key in targets:
            row=entries[key]
            row['disposition']='BLOCKED'
            row['reason_code']='CURRENT_FORMAL_CONTROL_UID_NOT_BOUND_BY_CURRENT_PAGE_AUTHORITY'
            row['evidence_refs']=[str(evidence_path),str(diagnostic_path),str(authority_path),str(inventory_path)]
            row['blocker_detail']='Active Production formal CONTROL has no exact owner in FINAL_LOCKED Current EDIT-01 Authority and no exact src binding. Semantic remap or retired-control reconstruction is forbidden.'
            row['operation_ids']=[key.removeprefix('control:')]

          counts={'PASS':0,'BLOCKED':0,'NOT_EXECUTED':0}
          for row in ledger['entries']:
            counts[row['disposition']]+=1
          assert counts=={'PASS':51,'BLOCKED':204,'NOT_EXECUTED':1226},counts
          ledger['counts']=counts
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'changed':10,'counts':counts},ensure_ascii=False))
          PY
      - name: Validate synchronized formal ledger
        run: node scripts/release-formal-acceptance-ledger.mjs
      - name: Commit exact EDIT-01 blockers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/construction/evidence/PRODUCTION_FORMAL_ACCEPTANCE_DISPOSITION_2026-09-10.json
          git add docs/construction/evidence/GATE25_EDIT01_UNBOUND_FORMAL_CONTROLS_2026-09-11.json
          git commit -m 'evidence(gate25): block 10 unbound EDIT-01 formal controls'
          git push origin HEAD:new
