authority:
  id: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY
  version: V1.9
  status: FINAL_LOCKED_COMPLETE
  current_only: true
  supersedes:
  - GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY V1.8 and earlier shell/menu variants
  scope: GLOBAL_FIXED_HEADER_AUTO_COLLAPSE_SIDEBAR_QUICK_STATUS_LANGUAGE_ACCOUNT_WORKSPACE_SLOT_ONLY
  undefined: BLOCK + REPORT_AUTHORITY_GAP
  real_data_only: true
  revision: 2026-08-30-USER-APPROVED-INFO-NAV09
user_decisions_2026_08_28:
- Delete AI Workspace from L1 navigation
- 'Merge Editing and Voice into one L1 item: 剪輯配音'
- 'L1 navigation is exactly: 儀表板 / 專案/專題 / 素材 / 影片 / 剪輯配音 / QA / 資料庫 / 戰略中心 / 最新資訊'
- Dashboard L1 has no child/sub-title
- Top-left = canonical ORANGE ONE logo
- Logo color may be adapted for background contrast when explicitly approved by the user; artwork content, geometry, typography, crop, and intrinsic aspect ratio remain unchanged
- Top-right = account login/account information
- Immediately left of account = language selector
- Sidebar auto-collapses by default to maximize workspace visual width
- All nine navigation items are direct first-level L1 entries; no child menu, no submenu, no subtitle/secondary line for any L1 item
- Collapsed sidebar has no visible sidebar panel/frame/background; only the nine icons remain visible
- Expanded menu surface/frame appears only while pointer/focus activates the navigation rail
- Remove Permission from the top-right header cluster
- Account permissions are bound to the account and configured when the account is created / managed; Global Shell consumes authorization outcomes
  but does not render a Permission field
- 'Authenticated top-right order is exactly: Notification / To-do / Running / Language / Account'
shell_boundary:
  owns:
  - fixed_header
  - canonical_brand
  - account_quick_status_cluster
  - language_selector
  - account_entry
  - auto_collapse_sidebar
  - l1_navigation
  - page_content_slot_boundary
  does_not_own:
  - dashboard_business_content
  - department_page_content
  - page_specific_header
  - page_specific_sidebar
  - page_runtime
  - page_forms
  - business_data_inside_quick_destination
  workspace_without_page_authority: BLANK_BY_DESIGN
geometry:
  header:
    height: 58px
    position: fixed top
    width: 100%
    radius: '0'
    left_logo_anchor: x≈30px
    right_padding: 16px
    center_page_identity: REMOVED_FROM_GLOBAL_HEADER; page title belongs to Page Authority to prevent collision with account quick-status cluster
  sidebar:
    resting_state: AUTO_COLLAPSED_ICON_ONLY_NO_PANEL
    collapsed_width: 64px interaction rail
    expanded_overlay_width: 221px
    top: 58px
    bottom: '0'
    position: fixed left
    padding_top: 16px
    padding_horizontal_collapsed: 10px
    padding_horizontal_expanded: 15px
    menu_row_height: 44px
    menu_gap: 8px
    row_radius: 10px
    icon_size: 20px
    label_size: 16px
    workspace_reflow_on_auto_expand: false
    collapsed_surface: TRANSPARENT_NONE
    collapsed_border: NONE
    collapsed_shadow: NONE
    collapsed_glow: NONE
    collapsed_visible_elements: NAV ICONS ONLY; no full-height sidebar frame/panel/background
    expanded_surface: Render standard Global Sidebar surface only while expanded overlay is active
  workspace_slot:
    origin_x: 78px
    origin_y: 68px
    right_inset: 16px
    bottom_inset: 16px
    sidebar_gutter: 14px
    header_gutter: 10px
    rule: Workspace x remains 78px in both collapsed and temporary expanded-overlay states. Auto-expanded sidebar overlays the left edge without
      shrinking/reflowing Page Authority content.
    shell_outer_card: FORBIDDEN
    shell_padding: NONE
    shell_radius: NONE
  header_right_cluster:
    order_left_to_right:
    - Notification
    - To-do
    - Running
    - Language
    - Account
    item_height: 36px
    gap: 8px
    counter_min_width: 52px
    language_width: 72px
    account_min_width: 132px
    account_max_width: 220px
    overflow: Account display name ellipsis; quick counters never wrap; no second header row
visual:
  inherits: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY
  override: FORBIDDEN
  header_surface: rgba(5,5,20,0.94) + blur 14px; bottom edge 1px rgba(139,92,255,0.28)
  sidebar_surface: 'COLLAPSED: NONE/transparent; EXPANDED OVERLAY ONLY: rgba(5,7,24,0.92) + blur 14px + right violet hairline / soft inner glow'
  nav_default: 'COLLAPSED: icon only, no row card/background. EXPANDED: transparent row with single-line L1 label.'
  nav_hover: Hover/focus activates expanded sidebar surface first; row hover may use subtle violet surface inside expanded overlay only.
  nav_active: 'COLLAPSED: compact icon halo/active marker only; no sidebar panel. EXPANDED: violet glass gradient + border + soft glow + white
    label.'
  active_count: 0 or 1; never >1
  quick_status: Compact clickable buttons for Notification / To-do / Running only; no Permission field. Counts/status come from real account projections.
auto_collapse_sidebar:
  component_uid: GHS-CMP-SIDEBAR-AUTO-REVEAL
  visual_uid: GHS-VIS-SIDEBAR-AUTO-REVEAL
  default_state: COLLAPSED_ICON_ONLY_NO_PANEL
  expanded_state: EXPANDED_OVERLAY_221_WITH_SURFACE
  manual_pin_toggle: FORBIDDEN
  expand_triggers:
  - pointerenter sidebar
  - keyboard focusin on any sidebar nav item
  collapse_triggers:
  - pointerleave sidebar AND focus not inside -> collapse after 180ms
  - route/navigation completed -> collapse immediately
  - Escape while sidebar expanded and focus not required -> collapse
  no_reflow: true
  workspace_origin_during_both_states: x=78px
  keyboard: Tab focus expands sidebar so labels are visible; focus leaving entire sidebar collapses after 180ms
  collapsed_render: ONLY 9 canonical navigation icons visible. No visible sidebar panel, no vertical rail background, no frame, border, glow,
    row card, label, subtitle, or 221px expanded menu surface.
  expanded_render: 221px menu surface appears ONLY at runtime after pointerenter/focusin. It is absent from the canonical collapsed-state screenshot.
  interaction_rail: Invisible/transparent 64px hit rail aligned left beneath Header; contains 44x44 icon hit targets. The rail itself must not
    look like a sidebar panel.
  icon_hit_target: 44x44px per L1 item; icon 20px; Default icon-only has no enclosing row/card. Active icon may use compact active halo/highlight
    but not a full-height sidebar frame.
  surface_visibility: VISIBLE_ONLY_WHEN_EXPANDED_OVERLAY_ACTIVE
  reference_visual_rule: The canonical collapsed-state reference image must show ONLY the 9 navigation icons. It must NOT draw the 221px expanded
    menu surface anywhere in the same collapsed-state main screenshot. Expanded state may be documented only in text/spec or a separately labeled
    secondary figure.
brand:
  component_uid: GHS-CMP-BRAND
  visual_uid: GHS-VIS-BRAND
  position: top-left header
  asset: canonical ORANGE ONE logo only
  text: ORANGE ONE if canonical brand lockup includes text
  click_action: NONE
  color_policy:
    user_approved_color_adaptation: true
    current_dark_header: WHITE_MONOCHROME
    rule: Color may change only for approved background contrast; artwork content, geometry, typography, crop, and intrinsic aspect ratio must remain unchanged.
  forbidden:
  - redraw
  - stretch
  - generated replacement
  - recolor outside explicit user approval
header_account_cluster:
  component_uid: GHS-CMP-ACCOUNT-QUICK-CLUSTER
  visual_uid: GHS-VIS-ACCOUNT-QUICK-CLUSTER
  authenticated_order:
  - Notification
  - To-do
  - Running
  - Language
  - Account
  unauthenticated_order:
  - Language
  - Login
  notification:
    display: real unread/attention count or 0
    click: Quick navigate ACCOUNT_NOTIFICATION_CENTER
  todo:
    display: real pending to-do count or 0
    click: Quick navigate ACCOUNT_TODO_QUEUE
  running:
    display: real running/in-progress count or 0
    click: Quick navigate ACCOUNT_RUNNING_QUEUE
  language:
    display: current locale code/label
    options:
    - zh-TW
    - zh-CN
    - en
    click: Open language selector
    business_mutation: false
  account:
    logged_out: 顯示登入 / Login；click OPEN_LOGIN
    logged_in: 顯示 canonical avatar + display name/account info + caret；click OPEN_ACCOUNT_MENU
    fake_identity: FORBIDDEN
  permission_model:
    render_in_header: false
    source: Account-bound authorization configured at account creation/account management
    shell_usage: Consume authorization outcome only for navigation/control visibility and access gates
    configuration_owner: Account Creation / Account Management Authority
    forbidden: Do not render a Permission chip/field/count in Global Header
