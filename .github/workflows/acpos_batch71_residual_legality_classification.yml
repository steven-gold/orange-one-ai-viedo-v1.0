name: ACPOS Batch 71 Residual Legality Classification
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch71_residual_legality_classification.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify Batch70 residual candidates under established closure rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections, json, re, subprocess, zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="6f846ef61e3603576ca9ea0fb596feebdfa1f9cb"
          WF=Path(".github/workflows/acpos_batch71_residual_legality_classification.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT:
              raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift:
              raise SystemExit(f"PRE_AUDIT_TREE_DRIFT {drift}")

          PAGES={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          ACTIVE={"EFFECTFUL_EXACT","READ_EXACT"}
          MISSING={"","—","-","SOURCE_NOT_DEFINED","UNCHANGED"}
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"

          def norm(s): return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def missing(v): return norm(v) in MISSING
          def txt(el): return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def hfind(headers,*needles):
              hs=[norm(x).lower() for x in headers]
              for n in needles:
                  n=n.lower()
                  for i,h in enumerate(hs):
                      if n in h:return i
              return None

          def parse(fn):
              out=[]
              with zipfile.ZipFile(fn) as z:
                  root=ET.fromstring(z.read("word/document.xml"))
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs: continue
                  h=[txt(c) for c in list(trs[0]) if c.tag==W+"tc"]
                  ci=hfind(h,"control uid","target uid")
                  if ci is None: continue
                  ix={
                    "uid":ci,
                    "type":hfind(h,"control type","type"),
                    "label":hfind(h,"label"),
                    "action":hfind(h,"action uid","action"),
                    "gate":hfind(h,"gate uid","gate"),
                    "permission":hfind(h,"permission","auth resource"),
                    "payload":hfind(h,"payload / schema","payload","schema"),
                    "operation":hfind(h,"operation"),
                    "method":hfind(h,"method / path","method","path"),
                    "runtime_owner":hfind(h,"runtime owner"),
                    "persistence":hfind(h,"persistence owner"),
                    "runtime_status":hfind(h,"runtime status"),
                  }
                  for ri,tr in enumerate(trs[1:],2):
                      cells=[txt(c) for c in list(tr) if c.tag==W+"tc"]
                      uid=cells[ci] if ci<len(cells) else ""
                      if not uid or uid in {"—","-"}: continue
                      r={k:(cells[i] if i is not None and i<len(cells) else "") for k,i in ix.items()}
                      r.update({"file":fn,"table":ti,"row":ri})
                      out.append(r)
              return out

          def compose(rr):
              active=[r for r in rr if r.get("runtime_status") in ACTIVE]
              pool=active if active else rr
              if not pool:return None
              fields=["type","label","action","gate","permission","payload","operation","method","runtime_owner","persistence","runtime_status"]
              base=max(pool,key=lambda r:sum(not missing(r.get(f,"")) for f in fields)).copy()
              values={}
              for f in fields:
                  vals=sorted(set(norm(r.get(f,"")) for r in pool if not missing(r.get(f,""))))
                  values[f]=vals
                  if missing(base.get(f,"")) and len(vals)==1: base[f]=vals[0]
              base["_values"]=values
              return base

          passive=[]
          direct_action=[]
          operation_missing=[]
          gate_missing=[]
          permission_missing=[]
          runtime_owner_missing=[]
          method_missing=[]
          payload_missing=[]
          persistence_missing=[]
          multi_value=[]

          exact_controls=0
          for page,fn in PAGES.items():
              byuid=collections.defaultdict(list)
              for r in parse(fn): byuid[r["uid"]].append(r)
              for uid,rr in byuid.items():
                  r=compose(rr)
                  if not r or r.get("runtime_status") not in ACTIVE: continue
                  exact_controls+=1
                  st=norm(r.get("runtime_status",""))
                  op=norm(r.get("operation",""))
                  action=norm(r.get("action",""))
                  typ=norm(r.get("type","")).upper()

                  if missing(op):
                      if st=="READ_EXACT" and (typ=="READONLY" or missing(action) or action.upper().endswith("ACT-NOOP")):
                          passive.append({"page":page,"uid":uid,"type":r.get("type",""),"action":action,"runtime_owner":r.get("runtime_owner",""),"gate":r.get("gate",""),"permission":r.get("permission","")})
                          for f in ["runtime_status","runtime_owner"]:
                              vals=r["_values"].get(f,[])
                              if len(vals)>1:multi_value.append({"page":page,"uid":uid,"field":f,"values":vals})
                          continue
                      operation_missing.append({"page":page,"uid":uid,"status":st,"action":action,"type":r.get("type","")})
                      continue

                  if missing(action):
                      direct_action.append({"page":page,"uid":uid,"operation":op,"type":r.get("type",""),"status":st})

                  if missing(r.get("gate","")):gate_missing.append({"page":page,"uid":uid,"operation":op})
                  if missing(r.get("permission","")):permission_missing.append({"page":page,"uid":uid,"operation":op})
                  if missing(r.get("runtime_owner","")):runtime_owner_missing.append({"page":page,"uid":uid,"operation":op})
                  if missing(r.get("method","")):method_missing.append({"page":page,"uid":uid,"operation":op,"status":st})
                  if st=="EFFECTFUL_EXACT":
                      if missing(r.get("payload","")):payload_missing.append({"page":page,"uid":uid,"operation":op})
                      if missing(r.get("persistence","")):persistence_missing.append({"page":page,"uid":uid,"operation":op})

                  for f in ["operation","runtime_status","method","payload","persistence"]:
                      vals=r["_values"].get(f,[])
                      if len(vals)>1:
                          multi_value.append({"page":page,"uid":uid,"field":f,"values":vals})

          true_gap_total=sum(map(len,[operation_missing,gate_missing,permission_missing,runtime_owner_missing,method_missing,payload_missing,persistence_missing]))
          summary={
            "marker":"ACPOS-20260922-BATCH-71-RESIDUAL-LEGALITY-CLASSIFICATION-V1",
            "base_head":EXPECTED_PARENT,
            "exact_controls":exact_controls,
            "batch70_canonical_candidate_cells":223,
            "passive_read_bindings":len(passive),
            "direct_operation_action_bindings":len(direct_action),
            "operation_missing":len(operation_missing),
            "gate_missing":len(gate_missing),
            "permission_missing":len(permission_missing),
            "runtime_owner_missing":len(runtime_owner_missing),
            "method_missing":len(method_missing),
            "payload_missing":len(payload_missing),
            "persistence_missing":len(persistence_missing),
            "multi_value_conflicts":len(multi_value),
            "true_gap_total":true_gap_total,
          }
          detail={
            "summary":summary,
            "passive_read_bindings":passive,
            "direct_operation_action_bindings":direct_action,
            "operation_missing":operation_missing,
            "gate_missing":gate_missing,
            "permission_missing":permission_missing,
            "runtime_owner_missing":runtime_owner_missing,
            "method_missing":method_missing,
            "payload_missing":payload_missing,
            "persistence_missing":persistence_missing,
            "multi_value_conflicts":multi_value,
          }
          Path("__batch71_legality_classification.json").write_text(json.dumps(detail,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch71_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH71_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if true_gap_total or multi_value:
              print("BATCH71_TRUE_GAPS_PRESENT")
          else:
              print("BATCH71_ZERO_TRUE_CONTRACT_GAPS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch71-residual-legality-classification
          path: |
            __batch71_legality_classification.json
            __batch71_summary.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch71_legality_classification.json __batch71_summary.json
          git config user.name "acpos-batch71-search"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch71_residual_legality_classification.yml" ]; then
            printf '%s\n' "${staged[@]}"
            exit 1
          fi
          git commit -m "chore(acpos): close batch 71 legality search harness"
          git push origin HEAD:0921acpos
