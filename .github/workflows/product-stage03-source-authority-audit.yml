name: Product Stage03 Source Authority Audit
on:
  push:
    branches: [0921acpos]
    paths:
      - '.github/workflows/product-stage03-source-authority-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-source-authority:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with: {ref: 0921acpos, fetch-depth: 1}
    - name: Extract exact immutable DOCX authority ranges
      run: |
        python - <<'PY'
        from pathlib import Path
        import zipfile, xml.etree.ElementTree as ET, hashlib
        W='{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
        files={
          'HOME':(Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-GLOBAL-HOME-SHELL-NAVIGATION-001/00_SOURCE_INTAKE/RAW_SOURCE/SRC-DOCX-334A4679600F092B733B/ACPOS_GLOBAL_HOME_SHELL_NAVIGATION_Mother_Basic_Design_OPTIMIZED.docx'),[(0,118),(118,160)]),
          'WB01':(Path('STAGE_EXECUTION/STAGE-01/WU-STAGE01-WB01-DASHBOARD-001/00_SOURCE_INTAKE/RAW_SOURCE/SRC-DOCX-2B1908530B5BD312A392/ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx'),[(0,28),(80,108),(180,222),(232,250)])
        }
        def txt(node): return ''.join((t.text or '') for t in node.iter(W+'t')).strip()
        for label,(path,ranges) in files.items():
          raw=path.read_bytes()
          print('===SOURCE_FILE',label,'sha256',hashlib.sha256(raw).hexdigest(),'size',len(raw),'===')
          with zipfile.ZipFile(path) as z: root=ET.fromstring(z.read('word/document.xml'))
          body=root.find(W+'body'); rec=[]
          for child in list(body):
            if child.tag==W+'p':
              s=txt(child)
              if s: rec.append(('P',s))
            elif child.tag==W+'tbl':
              for tr in child.findall(W+'tr'):
                cells=[txt(tc) for tc in tr.findall(W+'tc')]
                row=' | '.join(cells).strip()
                if row: rec.append(('T',row))
          print('===RECORD_COUNT',label,len(rec),'===')
          for lo,hi in ranges:
            print(f'===RANGE {label} {lo}:{hi}===')
            for i in range(lo,min(hi,len(rec))):
              kind,s=rec[i]
              print(f'{i:04d} {kind} {s}')
        PY
