name: Stage-02 Functional Chain Auto-Remediability R20

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-functional-chain-auto-remediability-r20.yml'
      - 'governance/ci/classify_stage02_functional_chain_auto_remediability_r20.py'
      - 'governance/ci/validate_stage02_functional_chain_auto_remediability_r20.py'
      - 'governance/test/stage02/STAGE02_FUNCTIONAL_CONTRACT_REMEDIATION_PROBLEM_REGISTER_R19.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/FUNCTIONAL_CHAIN_SPEC.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/BUSINESS_ENTITY_OPERATION_MATRIX.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/ASSET-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/FUNCTIONAL_CHAIN_SPEC.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/BUSINESS_ENTITY_OPERATION_MATRIX.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT/CORE-01/AUTO_COMPLETION_SCOPE_LEDGER.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify-functional-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R20 implementation
        run: |
          python -m py_compile governance/ci/classify_stage02_functional_chain_auto_remediability_r20.py
          python -m py_compile governance/ci/validate_stage02_functional_chain_auto_remediability_r20.py
      - name: Revalidate R19 source register
        run: python governance/ci/validate_stage02_functional_contract_remediation_problem_register_r19.py
      - name: Build full Stage-02 functional-chain deterministic closure classification
        run: python governance/ci/classify_stage02_functional_chain_auto_remediability_r20.py
      - name: Validate exact 150 denominator, complete source bundle, and safety boundary
        run: python governance/ci/validate_stage02_functional_chain_auto_remediability_r20.py
      - name: Prove Current Specification unchanged
        run: git diff --exit-code HEAD^ HEAD -- governance/specifications/current
      - name: Persist R20 evidence
        run: |
          output='governance/test/stage02/STAGE02_FUNCTIONAL_CHAIN_AUTO_REMEDIABILITY_R20.yaml'
          if [ -z "$(git status --porcelain -- "$output")" ]; then
            echo 'R20 output unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$output"
          git commit -m 'test(stage02): persist corrected full-chain auto-remediability R20'
          git push origin HEAD:rebuild-v2.1.1
