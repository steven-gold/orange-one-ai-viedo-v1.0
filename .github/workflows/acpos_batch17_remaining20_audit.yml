name: ACPOS Batch 17 Remaining 20 Gap Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch17-remaining20-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 16 closed content boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="fda43701a3ff71c2eef918beeb115c41aee4c6cc"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH16 CLOSED CONTENT BOUNDARY"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run remaining 20 exact-relation audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch17_remaining20_audit.py

      - name: Verify audit denominator
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch17_remaining20_audit.json").read_text(encoding="utf-8"))
          assert r["target_count"]==20,r["target_count"]
          assert r["summary"]["by_field"]=={"permission":5,"action":7,"gate":8},r["summary"]
          assert r["summary"]["by_page"]=={"DEV-01":5,"EDIT-01":2,"KB-01":10,"SYS-01":3},r["summary"]
          print("PASS: BATCH17 REMAINING20 DENOMINATOR",json.dumps(r["summary"],ensure_ascii=False))
          PY

      - name: Upload Batch 17 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch17-remaining20-gap-audit
          path: |
            __batch17_remaining20_audit.json
            __batch17_remaining20_audit.tsv
          retention-days: 1
          if-no-files-found: error

      - name: Remove audit harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch17_remaining20_audit.json __batch17_remaining20_audit.tsv
          git config user.name "acpos-word-batch-17-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch17_remaining20_audit.py .github/workflows/acpos_batch17_remaining20_audit.yml
          git commit -m "chore(acpos): close batch 17 remaining-gap audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH17 AUDIT HARNESS REMOVED"
