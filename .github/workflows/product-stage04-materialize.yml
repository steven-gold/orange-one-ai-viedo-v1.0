name: Product Stage04 Execute
# One-operation Stage-04 execution under the common engine authority.
# Each `stage_execution_engine.py --execute` invocation runs exactly one
# governed operation (PYTHON_STAGE_OPERATION_V1); the closure step runs only
# after all four operations of a governed unit have passed and materializes the
# handoff readiness ledger, normalized evidence and terminal receipt.
#
# This workflow intentionally keeps the historically registered workflow file
# so it stays dispatchable; the legacy bulk seal path is gone (it is fail-closed
# in the engine).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Operator note for this Stage-04 one-operation run
        required: false
        default: manual
permissions:
  contents: write
concurrency:
  group: product-stage04-execute
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product workline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Checkout current governance authority
        uses: actions/checkout@v4
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: rebuild-v2.1.1
          path: _governance_authority
          fetch-depth: 1
      - name: Load current governance authority
        run: |
          rm -rf governance .github/governance-source
          cp -R _governance_authority/governance ./governance
          mkdir -p .github
          cp -R _governance_authority/.github/governance-source .github/governance-source
          GOV_HEAD="$(git -C _governance_authority rev-parse HEAD)"
          GOV_UID="$(python -c "import yaml; from pathlib import Path; m=yaml.safe_load(Path('_governance_authority/governance/specifications/current/SPECIFICATION_MANIFEST.yaml').read_text()) or {}; print(m.get('artifact_uid') or '')")"
          GOV_VER="$(python -c "import yaml; from pathlib import Path; m=yaml.safe_load(Path('_governance_authority/governance/specifications/current/SPECIFICATION_MANIFEST.yaml').read_text()) or {}; print(m.get('display_version') or '')")"
          test -n "$GOV_HEAD"
          test -n "$GOV_UID"
          test -n "$GOV_VER"
          echo "ACPOS_GOVERNANCE_HEAD=$GOV_HEAD" >> "$GITHUB_ENV"
          echo "ACPOS_GOVERNANCE_UID=$GOV_UID" >> "$GITHUB_ENV"
          echo "ACPOS_GOVERNANCE_VERSION=$GOV_VER" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Execute Stage04 operations and closure
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          for WU in WU-STAGE04-GLOBAL-HOME-SHELL-NAVIGATION-001 WU-STAGE04-WB01-DASHBOARD-001; do
            WUDIR="STAGE_EXECUTION/STAGE-04/${WU}"
            STATUS="$(python -c "import yaml; d=yaml.safe_load(open('$WUDIR/WORK_UNIT.yaml')); print(d.get('current_status') or d.get('status') or '')")"
            case "$STATUS" in
              CLOSED*) echo "SKIP already-closed $WU"; continue ;;
            esac

            export ACPOS_PRODUCT_ROOT="$GITHUB_WORKSPACE"
            export ACPOS_ACTIVE_WORK_UNIT="${WUDIR}/WORK_UNIT.yaml"
            export ACPOS_CURRENT_SCOPE="${WUDIR}/CURRENT_EXECUTION_SCOPE_MANIFEST.yaml"

            python governance/ci/stage_execution_engine.py --admission-check --stage STAGE-04

            for STEP in 1 2 3 4; do
              DONE="$(python -c "import yaml; d=yaml.safe_load(open('$WUDIR/EXECUTION_STATE.yaml')); print(len(d.get('completed_operations') or []))")"
              if [ "$DONE" -ge 4 ]; then break; fi
              python governance/ci/stage_execution_engine.py --execute --stage STAGE-04
            done

            python .github/scripts/stage04_closure.py \
              --stage STAGE-04 \
              --work-unit "$WUDIR" \
              --product-root "$GITHUB_WORKSPACE" \
              --head-sha "$HEAD_SHA" \
              --run-id "$RUN_ID" \
              --gov "$ACPOS_GOVERNANCE_UID" \
              --gver "$ACPOS_GOVERNANCE_VERSION"

            EVIDENCE="${WUDIR}/EVIDENCE/STAGE04_NORMALIZED_EVIDENCE.json"
            RECEIPT="${WUDIR}/WORK_UNIT_TERMINAL_RECEIPT.yaml"
            python governance/ci/stage_execution_engine.py --validate-evidence --stage STAGE-04 --evidence "$EVIDENCE"
            python governance/ci/stage_execution_engine.py --validate-terminal-receipt --stage STAGE-04 --evidence "$EVIDENCE" --receipt "$RECEIPT"
          done
      - name: Commit Stage04 one-operation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAGE_EXECUTION/STAGE-04
          git diff --cached --quiet && exit 0
          git commit -m "stage04: execute one-operation foundation freeze and bind terminal receipts"
          for attempt in 1 2 3 4; do
            git fetch origin 0921acpos
            git rebase origin/0921acpos || { git rebase --abort || true; echo "BLOCK:REBASE_CONFLICT"; exit 21; }
            if git push origin HEAD:0921acpos; then exit 0; fi
            echo "RETRY_PUSH_ATTEMPT=$attempt"
            sleep 2
          done
          echo "BLOCK:REMOTE_ADVANCED_AFTER_RETRY_BUDGET"
          exit 22
