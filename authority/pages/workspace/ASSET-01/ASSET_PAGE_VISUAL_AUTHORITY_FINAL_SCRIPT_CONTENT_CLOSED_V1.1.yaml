system_filename_governance:
  authority: ACPOS_SYSTEM
  rule: ASSET、VIDEO、EDIT 的輸出檔名與 artifact identity 由 ACPOS_SYSTEM 統一治理；任何部門頁面不得自行產生、重新命名或覆寫 Canonical Filename。
  page_behavior: READ_ONLY
  required_runtime_fields:
  - output_artifact_id
  - canonical_filename
  - exact_version_id
  - extension_or_format
  - checksum
  - naming_policy_version
  - source_binding_ref
  forbidden:
  - manual rename
  - department-local filename formula
  - filename parsing as business authority
  - path guessing
  - reuse of stale filename without exact version/checksum
  downstream_reference: 下游 Script/Manifest 必須引用 exact artifact/reference ID + Version + Canonical Filename + Checksum；實際業務身分與路由以 exact ID/ref 為準，不得解析 filename
    字串推論。
layout:
  desktop_min_width: 1280px
  vertical_scroll: Main workspace independent from Global Menu/Sidebar height; overflow-y:auto
  primary_grid:
    left: 20% min 260px
    center: 60% preview-first
    right: 20% min 280px
  lower_rows: Layer/Correction/Runtime/Handoff may extend full width below primary grid
  tokens:
    control_height: 40px
    button_radius: 10px
    panel_radius: 12px
    large_container_radius: 24px
    section_gap: 16px
    content_padding: 16px
  visual_override: FORBIDDEN
auto_manual:
  shared_input_rule: AUTO and MANUAL both auto-resolve exact Blueprint/Script/DNA/Manifest/Naming/Instruction/Route. First production has no manual script
    prompt.
  AUTO: Execute current task/stage → candidate → ASSET evaluation → WAIT_CONFIRMATION → Confirm/Modify. Only after Confirm automatically advance to next
    scheduled task.
  MANUAL: Same data and execution rules; after Confirm the next task requires user start.
  error: Queue/task stays on failing item; no skip/reorder/create by AI.
