# exact-head post-source-materialization validation: current-registry-clean Stage
name: Current Governance Stage Internal Validation
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: current-governance-stage-internal-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install hash-locked verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock

      - name: Gate 01 - Canonical governance rule registry
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'governance/ci')
          from canonical_rule_registry import load_registry
          reg=load_registry()
          print('PASS: canonical rule registry',reg['registry_uid'],reg['registry_digest'])
          PY

      - name: Gate 02 - Stage definition and selected profile
        run: |
          set -euo pipefail
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/validate_selected_execution_profile_integrity.py

      - name: Gate 03 - Governance integrity and portability
        run: |
          set -euo pipefail
          python governance/ci/validate_active_consumer_reference_integrity.py
          python governance/ci/validate_governance_layout.py
          python governance/ci/validate_structured_mutation_safety.py --self-test
          python governance/ci/validate_structured_mutation_safety.py
          python governance/ci/validate_governance_portability.py
          python governance/ci/validate_execution_domain_isolation.py

      - name: Gate 04 - Integrated source and governance preformal
        run: |
          set -euo pipefail
          python governance/ci/validate_successor_governance_preformal.py

      - name: Gate 05 - Stage and product-neutral invariants
        run: |
          set -euo pipefail
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_product_neutral_entity_lifecycle.py

      - name: Gate 06 - Internal deterministic audit closure
        run: |
          set -euo pipefail
          python governance/ci/audit_closure_engine.py --self-test
          python governance/ci/audit_closure_engine.py

      - name: Gate 07 - Full high-pressure Stage regression
        run: python governance/ci/test_stage_execution_engine.py

      - name: Gate 08 - External admission layer isolation
        run: |
          set -euo pipefail
          python .github/governance-source/active/source/09_TESTS/governance/validate_external_execution_admission.py
          python governance/ci/test_external_execution_admission.py

      - name: Publish exact-head Stage internal validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=error ;;
          esac
          export STATE
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          payload={
            "state":os.environ["STATE"],
            "context":"Governance/Stage Internal Validation",
            "description":"Word-derived Current Governance Stage validation on exact HEAD",
            "target_url":f'{os.environ["GITHUB_SERVER_URL"]}/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }
          req=urllib.request.Request(
            f"https://api.github.com/repos/{repo}/statuses/{sha}",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization":f'Bearer {os.environ["GH_TOKEN"]}',
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json",
            },
            method="POST",
          )
          with urllib.request.urlopen(req) as r:
            if r.status not in (200,201):
              raise SystemExit(f"status publish failed: {r.status}")
          PY
