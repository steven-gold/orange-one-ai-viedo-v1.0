name: Product Stage03 Human Visual Review
on:
  workflow_dispatch:
    inputs:
      work_units:
        description: Comma-separated Stage03 Work Unit UIDs
        required: true
        type: string
      action:
        description: Human review action
        required: true
        type: choice
        options: [APPROVE, REJECT, REQUEST_CHANGES]
permissions:
  contents: write
  actions: write
jobs:
  record:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 0921acpos, fetch-depth: 0}
      - name: Record governed human decision
        env:
          WUS: ${{ inputs.work_units }}
          ACTION: ${{ inputs.action }}
          REVIEWER: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "$REVIEWER"
          git config user.email "$REVIEWER@users.noreply.github.com"
          IFS=',' read -ra ROWS <<< "$WUS"
          for WU in "${ROWS[@]}"; do
            python .github/scripts/stage03_human_review_record.py --work-unit "$WU" --action "$ACTION" --reviewer "$REVIEWER" --product-root "$GITHUB_WORKSPACE"
          done
          git add STAGE_EXECUTION/STAGE-03
          git diff --cached --quiet && { echo "BLOCK:NO_HUMAN_REVIEW_DELTA"; exit 41; }
          git commit -m "stage03: record governed human visual review"
          git push origin HEAD:0921acpos
      - name: Resume lifecycle only after approval
        if: inputs.action == 'APPROVE'
        env:
          WUS: ${{ inputs.work_units }}
        run: gh workflow run product-stage-lifecycle-driver.yml --ref 0921acpos -f stage=STAGE-03 -f work_units="$WUS"
