authority:
  id: ACPOS_STRATEGY_CENTER_SINGLE_PAGE_FINAL_LOCKED_ENCODING
  encoding_schema: ACPOS_STRATEGY_CENTER_SINGLE_PAGE_FINAL_LOCKED_V1
  surface: admin
  page_uid: admin:STR-01
  page_id: STR-01
  page_name_zh: 戰略中心後台
  page_name_en: Strategy Center Administration
  status: FINAL_LOCKED
  current_only: true
  single_page_workspace: true
  single_machine_authority: true
  global_shell: GLOBAL_HOME_SHELL_TEMPLATE_AUTHORITY@V1.9
  global_visual: GLOBAL_WEB_VISUAL_SYSTEM_AUTHORITY@V1.0
  visual_override: FORBIDDEN
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP
  real_data_only: true
  missing_value_display: —
  system_authority: ACPOS_SYSTEM_AUTHORITY@V1.0
  navigation_authority: ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY@V1.0
global_navigation_guard:
  page_owns_global_menu_order: false
  sidebar_in_reference_image: ILLUSTRATIVE_ONLY
  navigation_order_source: GLOBAL_NAVIGATION_AUTHORITY_ONLY
  page_may_declare:
  - navigation_path
  - active_menu_key
  - current_page_uid
  page_must_not_declare:
  - global_order
  - sibling_order
  - full_sidebar_structure
  - insert_before
  - insert_after
  duplicate_navigation_target: BLOCK
  menu_reorder_by_page_file: FORBIDDEN
  rule: The Strategy Center page may identify itself as strategy_center but cannot move ERP, QA, Social, System Maintenance, or any sibling menu.
current_page_policy:
  frontend_page_count: 1
  canonical_frontend_page_uid: admin:STR-01
  canonical_active_menu_key: strategy_center
  same_page_view_switching: true
  new_route_per_view: false
  standalone_parallel_strategy_pages: FORBIDDEN
  legacy_page_navigation_render: FORBIDDEN
  navigation_rule: Only one current Strategy Center navigation target may render.
  route_inference: FORBIDDEN
runtime_truth:
  file_spec: COMPLETE
  encoding_file: COMPLETE
  frontend_single_page_registry_remap: IMPLEMENTATION_REQUIRED_NOT_EXECUTED
  navigation_registry_remap: IMPLEMENTATION_REQUIRED_NOT_EXECUTED
  control_resource_remap: IMPLEMENTATION_REQUIRED_NOT_EXECUTED
  permission_resource_remap: IMPLEMENTATION_REQUIRED_NOT_EXECUTED
  application_implementation: NOT_EXECUTED
  runtime_binding_validation: NOT_EXECUTED
  functional_tests: NOT_EXECUTED
  sandbox_validation: NOT_EXECUTED
  regression_validation: NOT_EXECUTED
  e2e_validation: NOT_EXECUTED
  production_deployment: NOT_EXECUTED
  completion_claim_rule: Encoding/file authority complete does not mean frontend/runtime/remap/deployment complete.
page_contract:
  role: SINGLE_PAGE_STRATEGY_ADMINISTRATION
  owner_boundary:
  - StrategyService
  - StrategyFactPackService
  owner_merge: FORBIDDEN
  service_rebuild: FORBIDDEN
  default_view_uid: STR-CURRENT-VIEW-OVERVIEW
  view_switching:
    same_page_only: true
    preserve_current_scope: true
    preserve_selected_object: true
    preserve_query_state: true
    preserve_unsubmitted_form_state: true
    cross_view_auto_submit: FORBIDDEN
  views:
  - view_uid: STR-CURRENT-VIEW-OVERVIEW
    label_zh: 戰略總覽
    position: 1
    responsibility:
    - Intelligence Summary
    - Source Health
    - Fact Quality
    - Watchlist
    - Risk Alert
    - Candidate Queue
    allowed_action_ids:
    - ACT-SEARCH
    - ACT-REFRESH
    - ACT-NAV-OPEN
  - view_uid: STR-CURRENT-VIEW-INTELLIGENCE-FACT
    label_zh: 情報與 Fact
    position: 2
    responsibility:
    - Source Registry
    - Watchlist
    - Scope Policy
    - Source Quality
    - Retention
    - Fact Registry
    - Cohort Builder
    - Market Map
    - Completeness
    - Confidence
    - Citation
    allowed_action_ids:
    - ACT-CONFIGURE
    - ACT-APPROVE
    - ACT-SEARCH
    - ACT-EXPORT
    - ACT-NAV-OPEN
    action_rule: Actions must retain their source owner/page binding; do not union incompatible action payloads.
  - view_uid: STR-CURRENT-VIEW-PLAYBOOK
    label_zh: 平台 Playbook
    position: 3
    responsibility:
    - Platform Profile
    - Account Scope
    - Playbook
    - Hypothesis
    - Evidence
    - Version History
    - Approval
    allowed_action_ids:
    - ACT-DRAFT-SAVE
    - ACT-APPROVE
    - ACT-NAV-OPEN
  - view_uid: STR-CURRENT-VIEW-OPPORTUNITY
    label_zh: 趨勢與機會
    position: 4
    responsibility:
    - Trend Engine
    - Momentum Engine
    - Forecast Engine
    - Opportunity Queue
    - Confidence
    - Evidence
    - Review
    allowed_action_ids:
    - ACT-CANDIDATE-CREATE
    - ACT-APPROVE
    - ACT-NAV-OPEN
  - view_uid: STR-CURRENT-VIEW-DECISION
    label_zh: 決策實驗室
    position: 5
    responsibility:
    - Decision Context
    - Option Comparison
    - Evidence
    - Risk / Cost / Capacity
    - Decision Gate
    - Core Review Handoff
    - Audit
    allowed_action_ids:
    - ACT-CANDIDATE-COMPARE
    - ACT-CANDIDATE-DECIDE
    - ACT-ADOPT-CONTEXT
    - ACT-NAV-OPEN
layout_contract:
  single_main_workspace: true
  secondary_tabs:
  - STR-CURRENT-VIEW-OVERVIEW
  - STR-CURRENT-VIEW-INTELLIGENCE-FACT
  - STR-CURRENT-VIEW-PLAYBOOK
  - STR-CURRENT-VIEW-OPPORTUNITY
  - STR-CURRENT-VIEW-DECISION
  default_view: STR-CURRENT-VIEW-OVERVIEW
  default_structure:
    top_context: Page title + Current View + governed actions
    summary_row: Real projections only; missing = —
    main_work_area: Current View table/cards/projection
    right_information_panel: Current View professional description / owner / permissions / boundaries
    bottom_view_mapping: Optional construction/reference only; must not become global menu.
  table_contract:
    long_value: ELLIPSIS + DRAWER_FOR_FULL_VALUE
    row_action_visibility: EXPLICIT_WHEN_REGISTERED
    hidden_row_click_action: FORBIDDEN
    sample_or_mock_data: FORBIDDEN
  drawer_modal_contract:
    read_detail: DRAWER
    effectful_action: FORM_MODAL
    focus_management: REQUIRED
  responsive:
    mobile_only_second_page: FORBIDDEN
    behavior: Follow Global responsive authority; reflow within the same current page.
view_action_binding_rules:
  general:
  - Render only action IDs registered for the active Current View and authorized by Account Permission + State/Server Gate.
  - Do not create a universal action payload by merging incompatible schemas.
  - Action invocation must retain the registered service/operation/schema owner for the selected business object.
  - ACT-NAV-OPEN opens registered detail/drawer/context only; it must not create a standalone subpage.
  overview:
    view_uid: STR-CURRENT-VIEW-OVERVIEW
    actions:
    - ACT-SEARCH
    - ACT-REFRESH
    - ACT-NAV-OPEN
  intelligence_fact:
    view_uid: STR-CURRENT-VIEW-INTELLIGENCE-FACT
    actions:
    - ACT-CONFIGURE
    - ACT-APPROVE
    - ACT-SEARCH
    - ACT-EXPORT
    - ACT-NAV-OPEN
  playbook:
    view_uid: STR-CURRENT-VIEW-PLAYBOOK
    actions:
    - ACT-DRAFT-SAVE
    - ACT-APPROVE
    - ACT-NAV-OPEN
  opportunity:
    view_uid: STR-CURRENT-VIEW-OPPORTUNITY
    actions:
    - ACT-CANDIDATE-CREATE
    - ACT-APPROVE
    - ACT-NAV-OPEN
  decision:
    view_uid: STR-CURRENT-VIEW-DECISION
    actions:
    - ACT-CANDIDATE-COMPARE
    - ACT-CANDIDATE-DECIDE
    - ACT-ADOPT-CONTEXT
    - ACT-NAV-OPEN
operation_policy:
  source: current registered operation registry
  reuse_existing_operations: true
  invent_new_operation: FORBIDDEN
  known_operations_by_view:
    STR-CURRENT-VIEW-OVERVIEW:
    - getUiProjection
    - refreshProjection
    - searchProjection
    STR-CURRENT-VIEW-INTELLIGENCE-FACT:
    - approveGovernedResource
    - configureGovernedResource
    - exportProjection
    - getUiProjection
    - searchProjection
    STR-CURRENT-VIEW-PLAYBOOK:
    - approveGovernedResource
    - getUiProjection
    - saveDraft
    STR-CURRENT-VIEW-OPPORTUNITY:
    - approveGovernedResource
    - createCandidate
    - getUiProjection
    STR-CURRENT-VIEW-DECISION:
    - adoptAsContextCandidate
    - compareCandidates
    - getUiProjection
    - rejectStrategyCandidate
  unresolved_operation: DO_NOT_INFER; resolve from current registered operation registry or BLOCK
input_behavior:
  existing_read_model_data: AUTO_PROJECT_DO_NOT_RETYPE
  context_data: AUTO_CARRY_FORWARD_WHEN_AVAILABLE
  manual_input_default: FORBIDDEN_UNLESS_REGISTERED_BY_EFFECTFUL_ACTION_SCHEMA
  editable_input_source:
  - 07_ui/interaction_registry.yaml#controls.form_schema
  - 03_api/business_payload_registry.yaml#registered business payload schema
  database_field_implies_manual_input: false
data_and_truth_rules:
  fact_rule: Never present inference as fact.
  confidence_rule: Confidence must come from registered projection/evidence logic; do not invent a score.
  source_health_rule: Real projection only; do not manually mark healthy.
  candidate_rule: Candidate is not an approved strategy decision.
  playbook_rule: Playbook is not a direct publish command.
  opportunity_rule: Opportunity cannot automatically change project or budget.
  decision_rule: Strategy Decision Lab cannot directly write canon lock, task, budget, or publish state.
  finance_guardrail: Risk/Cost/Capacity finance-derived fields remain permission-gated and may MASK/DENY.
  missing_value: —
state_contract:
  allowed_states:
  - LOADING
  - READY
  - EMPTY
  - ERROR
  - POLICY_BLOCKED
  - VERSION_CONFLICT
  - REVIEW_REQUIRED
  - EXTERNAL_PENDING
  - READ_ONLY
  - ARCHIVED
  base_transitions:
  - LOADING -> EMPTY|READY|ERROR|POLICY_BLOCKED
  - READY -> EXTERNAL_PENDING|VERSION_CONFLICT|REVIEW_REQUIRED|READ_ONLY|ARCHIVED
  server_gate_order:
  - identity
  - account_permission
  - scope
  - condition
  - state_guard
  - expected_version_when_write
  - idempotency_when_side_effect
  - audit
  role_name_authorization: FORBIDDEN
forbidden_matrix:
- Page-owned global sidebar ordering
- Page-owned sibling menu ordering
- Second Strategy Center
- Second StrategyService
- Second StrategyFactPackService
- Present inference as fact
- Use playbook as direct publish command
- Automatic project or budget change from opportunity
- Direct canon lock/task/budget/publish write from decision lab
- Manual retype of read-model data
- Unregistered write
- Unregistered API/path/permission inference
- Mock/fake strategy data
- Cross-source payload union inference
- Standalone parallel Strategy Center subpages
acceptance:
- uid: STR-CURRENT-ACC-01
  name: Single Current Page
  condition: Only admin:STR-01 renders as current Strategy Center frontend navigation target.
- uid: STR-CURRENT-ACC-02
  name: Five Current Views
  condition: 戰略總覽 / 情報與 Fact / 平台 Playbook / 趨勢與機會 / 決策實驗室 all exist inside the same current page.
- uid: STR-CURRENT-ACC-03
  name: Current View Coverage
  condition: All five Current View responsibilities, owners, actions and prohibitions remain traceable inside admin:STR-01.
- uid: STR-CURRENT-ACC-04
  name: No Menu Order Collision
  condition: Page files do not define global/sibling sidebar order; only Global Navigation Authority may order L1/L2 items.
- uid: STR-CURRENT-ACC-05
  name: No Parallel Strategy Pages
  condition: All Strategy administration functions remain inside admin:STR-01 same-page views.
- uid: STR-CURRENT-ACC-06
  name: Action Source Isolation
  condition: Actions in combined views retain their originating page/service/schema binding and are never merged into guessed payloads.
- uid: STR-CURRENT-ACC-07
  name: Truthful Strategy Data
  condition: No inference-as-fact, fake confidence, mock candidates, fake health, or invented cost/capacity data.
- uid: STR-CURRENT-ACC-08
  name: Decision Boundary
  condition: Decision Lab cannot directly write canon lock, task, budget or publish state; handoff remains governed.
- uid: STR-CURRENT-ACC-09
  name: Truthful Runtime
  condition: Navigation/control/permission remap and runtime/E2E remain NOT_EXECUTED until actual implementation and tests exist.
construction_gate:
  static_ui_spec_ready: true
  effectful_runtime_ready: false
  before_runtime_enablement_required:
  - Global Navigation Registry binding for the current Strategy Center target
  - Page/Section/Control resource remap
  - Permission resource remap
  - View-to-operation binding verification
  - State/server gate verification
  - Functional regression for all Current Strategy Center controls
  - Sandbox validation
  - E2E validation
  ai_instruction: Read this encoding first. Render one Strategy Center admin page only. Do not reorder the global sidebar or create parallel subpages.
    For each active View, use only registered Current sections/actions/operations. Unknown or missing binding => BLOCK + REPORT_AUTHORITY_GAP.
