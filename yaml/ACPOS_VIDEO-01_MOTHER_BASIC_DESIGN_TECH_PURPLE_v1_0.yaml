  - index: 27
    rows:
    - row: 0
      cells:
      - Control UID
      - Operation
      - Method / Path
      - Payload / Schema
      - Persistence Owner
      - Semantics
    - row: 1
      cells:
      - VIDEO-01-BTN-EXECUTE
      - startVideoGenerationFlow
      - POST /v1/video-runtime-runs
      - StartVideoGenerationFlowRequest
      - System 05 / ProductionWorkItem + VideoOutputVersion Generation Lineage + Audit
      - Starts generation only from exact admitted production input/bindings. Job/run creation is not output confirmation; provider/runtime success requires separate
        evidence.
    - row: 2
      cells:
      - VIDEO-01-BTN-CONFIRM
      - confirmVideoCandidate
      - POST /v1/video-runtime-runs/{runId}/candidates/{videoOutputVersionId}/confirm
      - ConfirmVideoCandidateRequest
      - System 05 / VideoOutputVersion Confirmed State + Decision Evidence/Audit
      - Confirmation binds exact candidate/output version and authorized decision evidence, producing immutable confirmed lineage without overwriting prior VideoOutputVersion.
    - row: 3
      cells:
      - VIDEO-01-BTN-LOCK
      - lockVideoVersion
      - POST /v1/state-commands/videoversion/lock
      - LockVideoVersionRequest
      - public.production_output_version_locks
      - Reuses exact Current lock route/persistence. Lock binds exact video output version/hash and governed decision evidence; request/command is not self-approval.
    - row: 4
      cells:
      - VIDEO-01-BTN-HANDOFF
      - handoffVideoToEdit
      - POST /v1/video-runtime-runs/{runId}/handoff-to-edit
      - HandoffVideoToEditRequest
      - System 05 / HandoffManifest + VideoOutputVersion Provenance/Audit
      - VIDEO→EDIT handoff must include exact VideoOutputVersion + Scene/Shot lineage + Asset/Script/DNA refs + continuity + rights/policy; successor admission remains
        separate.
    - row: 5
      cells:
      - VIDEO-01-BTN-GEN-CORRECTION
      - generateCorrectionScriptCandidate
      - POST /v1/state-commands/correctionscript/generate
      - GenerateVideoCorrectionScriptCandidateRequest
      - public.correction_script_versions
      - Reuses exact Current correction-script generation route. Persists a candidate/version with exact source/output/findings/context refs; candidate is not approved
        correction authority.
    - row: 6
      cells:
      - VIDEO-01-BTN-APPROVE-CORRECTION
      - approveCorrectionScriptCandidate
      - POST /v1/state-commands/correctionscript/approve
      - ApproveVideoCorrectionScriptCandidateRequest
      - public.correction_script_versions
      - Reuses exact Current approval route. Human/authorized approval binds exact correction script candidate/version; prior versions remain immutable.
    - row: 7
      cells:
      - VIDEO-01-BTN-EXEC-CORRECTION
      - executeVideoCorrection
      - POST /v1/video-runtime-runs/{runId}/corrections/execute
      - ExecuteVideoCorrectionRequest
      - System 05 / VideoOutputVersion + Correction/Delta Lineage + Audit
      - Executes only an approved correction script/delta against exact selected source version. Correction produces a new VideoOutputVersion and preserves unchanged
        shot lineage.
    - row: 8
      cells:
      - VIDEO-01-BTN-RETRY
      - retryVideoTask
      - POST /v1/video-runtime-runs/{runId}/tasks/{taskId}/retry
      - RetryVideoTaskRequest
      - System 05 / ProductionWorkItem Retry Attempt + Video Generation Audit
      - Retry binds exact failed task/attempt/version and preserves failure evidence; it cannot erase prior attempts or change scope silently.
    - row: 9
      cells:
      - VIDEO-01-BTN-EVALUATE
      - evaluateVideoCandidate
      - POST /v1/video-runtime-runs/{runId}/candidates/{videoOutputVersionId}/evaluations
      - EvaluateVideoCandidateRequest
      - System 05 / EvaluationResult + Video Evidence/Audit
      - Evaluation records score/evidence/findings against exact criteria and VideoOutputVersion. Score alone cannot auto-confirm, lock or handoff.
    - row: 10
      cells:
      - VIDEO-01-BTN-FINDING
      - createVideoFinding
      - POST /v1/video-runtime-runs/{runId}/candidates/{videoOutputVersionId}/findings
      - CreateVideoFindingRequest
      - System 05 / Finding + Video Evidence/Audit
      - Finding binds exact source VideoOutputVersion/shot or scene lineage, category, severity, evidence and expected correction; no silent acceptance.
