name: ACPOS Batch 04 Direct Binding Classification

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-04-direct-binding-classification
  cancel-in-progress: false

jobs:
  close-batch-04:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Preflight script syntax
        run: python -m py_compile __temp/batch_04_direct_binding_classification.py

      - name: Apply batch 04 classification
        run: python __temp/batch_04_direct_binding_classification.py

      - name: Semantic verification
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          p="ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          d=Document(p)
          t="\n".join([x.text for x in d.paragraphs]+[c.text for tb in d.tables for r in tb.rows for c in r.cells])
          required=[
            "ACPOS-20260921-BATCH-04-DIRECT-BINDING-CLASSIFICATION-V1",
            "DEFINITION_BINDING_GAP",
            "LEGITIMATE_NA_UI_LOCAL",
            "LEGITIMATE_NA_READ_PRESENTATION",
            "CLOSED_BY_OWNER_LOCAL_COMMAND",
            "READ_OWNER_BOUND_OPERATION_UNSPECIFIED",
            "KNOWN_RUNTIME_BLOCKER",
            "SOURCE_RESOLUTION_REQUIRED",
            "Mandatory Conversion Integrity Guard",
            "ENC-01","ENC-02","ENC-03","ENC-04","ENC-05","ENC-06","ENC-07","ENC-08",
            "BATCH04_MACHINE_JSON="
          ]
          for x in required:
              assert x in t,x
          print("PASS: BATCH-04 SEMANTIC CLASSIFICATION")
          PY

      - name: Convert DOCX to PDF
        shell: bash
        run: |
          mkdir -p __render_qa_batch04/pdf
          libreoffice --headless --convert-to pdf --outdir __render_qa_batch04/pdf             ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx

      - name: Encoding and garble integrity audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,unicodedata

          docx=Path("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          pdf=Path("__render_qa_batch04/pdf")/(docx.stem+".pdf")
          outdir=Path("__render_qa_batch04")
          outdir.mkdir(exist_ok=True)

          bad_tokens=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"]
          allowed_ctrl={9,10,12,13}

          with zipfile.ZipFile(docx) as z:
              xml_names=[n for n in z.namelist() if n.endswith(".xml") or n.endswith(".rels")]
              xml_errors=[]
              for n in xml_names:
                  b=z.read(n)
                  try:
                      ET.fromstring(b)
                  except Exception as e:
                      xml_errors.append((n,str(e)))
              assert not xml_errors,xml_errors

              root=ET.fromstring(z.read("word/document.xml"))
              ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
              source_text="".join((el.text or "") for el in root.iter(ns+"t"))

          pdf_text=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")

          def scan(label,text):
              assert "\x00" not in text,(label,"NUL")
              ctr=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ord(ch) not in allowed_ctrl]
              assert not ctr[:20],(label,"CONTROL_CHAR",ctr[:20])
              hits=[x for x in bad_tokens if x in text]
              assert not hits,(label,"MOJIBAKE",hits)
              # NFC normalization must not itself introduce replacement characters.
              n=unicodedata.normalize("NFC",text)
              assert "\ufffd" not in n,(label,"NFC_REPLACEMENT")
              return len(text)

          scan("DOCX_SOURCE",source_text)
          scan("PDF_EXTRACT",pdf_text)

          cjk_re=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          src_cjk=len(cjk_re.findall(source_text))
          pdf_cjk=len(cjk_re.findall(pdf_text))
          assert src_cjk>0,("NO_SOURCE_CJK",src_cjk)
          ratio=pdf_cjk/src_cjk
          assert ratio>=0.97,("CJK_RETENTION_TOO_LOW",src_cjk,pdf_cjk,ratio)

          critical=[
            "ACPOS-20260921-BATCH-04-DIRECT-BINDING-CLASSIFICATION-V1",
            "DEFINITION_BINDING_GAP",
            "SOURCE_NOT_DEFINED",
            "Mandatory Conversion Integrity Guard",
            "Runtime Owner",
            "Direct Binding Classification"
          ]
          missing=[x for x in critical if x not in pdf_text]
          assert not missing,("CRITICAL_PHRASE_LOST",missing)

          report={
            "docx":str(docx),
            "pdf":str(pdf),
            "xml_parts_parsed":len(xml_names),
            "source_chars":len(source_text),
            "pdf_chars":len(pdf_text),
            "source_cjk":src_cjk,
            "pdf_cjk":pdf_cjk,
            "cjk_retention_ratio":ratio,
            "mojibake_hits":[],
            "control_char_failures":0,
            "critical_phrases_retained":critical,
            "status":"PASS"
          }
          (outdir/"encoding_integrity_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          print("PASS: BATCH-04 ENCODING/GARBLE INTEGRITY")
          PY

      - name: Render and geometry QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          from PIL import Image,ImageChops
          p=Path("ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx")
          qa=Path("__render_qa_batch04"); pdf=qa/"pdf"; png=qa/"png"
          png.mkdir(parents=True,exist_ok=True)
          pf=pdf/(p.stem+".pdf")
          info=subprocess.check_output(["pdfinfo",str(pf)],text=True,errors="replace")
          pages=int(next(x.split(":",1)[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
          od=png/p.stem;od.mkdir(parents=True,exist_ok=True)
          subprocess.run(["pdftoppm","-png","-r","120",str(pf),str(od/"page")],check=True,stdout=subprocess.DEVNULL)
          imgs=sorted(od.glob("page-*.png"));assert len(imgs)==pages
          blank=[];edge=[]
          for i,img in enumerate(imgs,1):
              im=Image.open(img).convert("RGB")
              diff=ImageChops.difference(im,Image.new("RGB",im.size,"white"))
              bb=diff.getbbox()
              if bb is None:blank.append(i);continue
              l,t,r,b=bb
              if l<=2 or t<=2 or r>=im.width-2 or b>=im.height-2:edge.append(i)
          assert not blank,blank
          assert not edge,edge
          report={"documents":1,"pages":pages,"blank":blank,"edge":edge}
          (qa/"geometry_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          print("PASS: BATCH-04 RENDER/GEOMETRY QA")
          PY

      - name: Verify exact batch-04 change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={"ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"}
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","--"],text=True)
          changed={x for x in out.splitlines() if x}
          assert changed==allowed,{"missing":sorted(allowed-changed),"unexpected":sorted(changed-allowed)}
          print("PASS: BATCH-04 CHANGE SCOPE EXACT 1 WORD")
          PY

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-04-classification-and-encoding-evidence
          path: __render_qa_batch04
          retention-days: 1

      - name: Commit batch 04 and clean temporary tooling
        shell: bash
        run: |
          rm -rf __render_qa_batch04 __temp/__pycache__
          git rm __temp/batch_04_direct_binding_classification.py .github/workflows/batch-04-direct-binding-classification.yml
          git config user.name "acpos-word-batch-04"
          git config user.email "actions@users.noreply.github.com"
          git add ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          git commit -m "docs(acpos): classify direct binding gaps and enforce encoding guard"
          git push
