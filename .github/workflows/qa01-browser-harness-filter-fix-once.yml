name: QA01 Browser Harness Filter Fix Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-browser-harness-filter-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch harness only and self-clean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/qa01-browser-closure-once.yml')
          s=p.read_text()
          old="page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));"
          new="page.on('requestfailed',r=>{const e=r.failure()?.errorText||'';if(r.url().includes('/v1/ui-projections/QA-01')&&e==='net::ERR_ABORTED')return;failed.push(`${r.method()} ${r.url()} ${e}`)});"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          rm .github/workflows/qa01-browser-harness-filter-fix-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qa01-browser-closure-once.yml .github/workflows/qa01-browser-harness-filter-fix-once.yml
          git commit -m 'test(qa): ignore expected aborted QA projection cleanup request'
          git push origin HEAD:qa01-functional-staging
