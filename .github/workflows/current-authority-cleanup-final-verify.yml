name: Current Authority Cleanup Final Verify
on:
  push:
    branches: [current-authority-pollution-cleanup]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove build-generated drift before validation
        run: |
          git checkout 0291475b81acd243cd52b8f922ee63d74d5a1d3b -- next-env.d.ts tsconfig.json
          rm -f tsconfig.tsbuildinfo
      - name: Current-only pollution scan
        run: |
          python3 <<'PY'
          from pathlib import Path
          pages={
            'WB-01':'authority/pages/workspace/WB-01/ACPOS_WB-01_FINAL_LOCKED_ENCODING.yaml',
            'CORE-01':'authority/pages/workspace/CORE-01/CORE_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED.yaml',
            'ASSET-01':'authority/pages/workspace/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml',
            'VIDEO-01':'authority/pages/workspace/VIDEO-01/VIDEO_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml',
            'EDIT-01':'authority/pages/workspace/EDIT-01/ACPOS_EDIT-01_FINAL_LOCKED_ENCODING_SCRIPT_CONTENT_CLOSED_V1.1.yaml',
            'QA-01':'authority/pages/workspace/QA-01/ACPOS_QA-01_FINAL_LOCKED_ENCODING_DEDUP_CLEAN.yaml',
            'DB-01':'authority/pages/admin/DB-01/ACPOS_DB-01_FINAL_LOCKED_ENCODING.yaml',
          }
          src='\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx','.css'})
          banned=[
            'CORE-01-PRIMARY-GRID','EDIT-01-ACT-EVAL-JUMP','QA-01-FLD-AUTO-PROGRESS-DONE',
            'ASSET-01-TEST-LOCK-REF','ASSET-01-TEST-HANDOFF-REF','ASSET-01-CONTROLLED',
            'VIDEO-01-TEST-LOCK-REF','VIDEO-01-TEST-HANDOFF-REF','VIDEO-01-CONTROLLED',
            'EDIT-01-TEST-LAST-ACTION','EDIT-01-TEST-INTERNAL-CORRECTION-ACTION','EDIT-01-TEST-LOCK-REF','EDIT-01-TEST-HANDOFF-REF','EDIT-01-CONTROLLED',
            '/v1/database/read-model'
          ]
          remain=[x for x in banned if x in src]
          if remain: raise SystemExit('CONFIRMED_POLLUTION_REMAINS='+','.join(remain))
          if Path('src/app/v1/database/read-model/route.ts').exists(): raise SystemExit('DB_UNREGISTERED_ROUTE_REMAINS')
          if Path('src/server/testing/controlledDbTestRuntime.ts').exists(): raise SystemExit('DB_UNREGISTERED_TEST_RUNTIME_REMAINS')
          checks={
            'ASSET_RUNTIME_LOCK_MEMORY':('src/domain/asset/controlledAssetClientTestRuntime.ts','lockedVersionRef'),
            'VIDEO_RUNTIME_LOCK_MEMORY':('src/components/pages/VideoVisual.tsx','lockedVersionRef.current'),
            'EDIT_RUNTIME_LOCK_MEMORY':('src/domain/edit/controlledEditClientTestRuntime.ts','lockedVersionRef'),
            'QA_REGISTERED_PROGRESS_ONLY':('src/server/testing/controlledQaTestRuntime.ts','QA-01-FLD-AUTO-PROGRESS'),
            'DB_FORMAL_FAIL_CLOSED':('src/domain/database/dbClientPort.ts','DB_CLIENT_RUNTIME_NOT_BOUND'),
          }
          for name,(p,needle) in checks.items():
            if needle not in Path(p).read_text(): raise SystemExit(name+'_MISSING')
          for uid,p in pages.items():
            if not Path(p).exists(): raise SystemExit('CURRENT_AUTHORITY_MISSING='+uid)
          print('CURRENT_AUTHORITY_CONFIRMED_POLLUTION_ZERO pages=7')
          print('CURRENT_AUTHORITY_CONFLICT_REPAIR_PASS asset_lock=runtime video_lock=runtime edit_lock=runtime qa_progress=registered db_read=fail_closed')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Typecheck and production build
        run: |
          npm ci
          npm run typecheck
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=TEST_ONLY npm run build
      - name: Browser smoke current pages
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE=TEST_ONLY npm run start -- -p 3107 > /tmp/acpos.log 2>&1 &
          echo $! > /tmp/acpos.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3107/ >/dev/null && break; sleep 1; done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const routes=['/','/core','/assets','/video','/edit','/qa','/database'];
            for(const route of routes){
              const response=await page.goto('http://127.0.0.1:3107'+route,{waitUntil:'domcontentloaded'});
              if(!response || response.status()>=500) throw new Error(`PAGE_HTTP_FAIL ${route} ${response?.status()}`);
              await page.waitForTimeout(350);
              const body=await page.locator('body').innerText();
              if(!body.trim()) throw new Error(`PAGE_EMPTY ${route}`);
              const controls=await page.locator('[data-control-id]').count();
              if(route!=='/' && controls===0) throw new Error(`PAGE_CONTROL_ZERO ${route}`);
              console.log(`CURRENT_PAGE_BROWSER_PASS route=${route} controls=${controls}`);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(curl -s -o /tmp/db-undefined.out -w '%{http_code}' -X POST http://127.0.0.1:3107/v1/database/read-model)" = "404"
          echo 'DB_UNREGISTERED_HTTP_ROUTE_ABSENT status=404'
          kill $(cat /tmp/acpos.pid) || true
      - name: Remove temporary validation and build drift
        run: |
          git checkout 0291475b81acd243cd52b8f922ee63d74d5a1d3b -- next-env.d.ts tsconfig.json
          rm -f tsconfig.tsbuildinfo
          git rm -f \
            .github/current_authority_cleanup.py \
            .github/workflows/current-authority-pollution-audit.yml \
            .github/workflows/current-authority-cleanup-apply.yml \
            .github/workflows/current-authority-cleanup-apply-v2.yml \
            .github/workflows/current-authority-cleanup-apply-v3.yml \
            .github/workflows/current-authority-cleanup-final-verify.yml
      - name: Commit validated clean state
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "cleanup: validate and remove temporary tooling"
          git push origin HEAD:current-authority-pollution-cleanup
