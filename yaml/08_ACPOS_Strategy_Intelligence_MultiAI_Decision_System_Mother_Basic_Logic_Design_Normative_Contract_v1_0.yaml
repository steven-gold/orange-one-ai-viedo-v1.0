    text: 圖 1｜策略智能的受治理生命週期；分析、比較與多 AI 討論只形成決策候選，正式決策仍需 Human Review。
  - index: 7
    style: Heading 1
    text: 1. Design Identity / 設計定位
  - index: 8
    style: Normal
    text: 核心定位
  - index: 9
    style: Rule
    text: • 本文件是 ACPOS Strategy Intelligence 的系統邏輯 Owner；它定義如何從受治理資料形成可追溯策略分析、選項比較、Multi-AI 討論、Decision Candidate 與 Decision Ledger。
  - index: 10
    style: Rule
    text: • 它不是 Conversation Core（AI-02）、不是 Provider Router（AI-03）、不是企業開發執行器（AI-06）、不是社群發布執行器（AI-07）、也不是系統自我修改器（AI-09）。
  - index: 11
    style: Rule
    text: • AI 的策略建議、共識、Alert 或 Resource Proposal 都不是正式公司決策；只有授權 Human Decision 才能形成 Decision Ledger 結果。
  - index: 12
    style: Rule
    text: • 策略中心可以顯示、建議與導航到 Owner Module；Finance / Workflow / Governance / Production 的 effectful action 必須留在原 Owner。
  - index: 14
    style: Heading 1
