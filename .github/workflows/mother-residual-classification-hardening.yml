name: Mother Residual Classification Hardening
on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-RESIDUAL-CLASSIFICATION-HARDENING-R1.yaml'
permissions:
  contents: write
jobs:
  materialize-successor:
    if: "${{ github.event.head_commit.message == 'chore(governance): authorize mother residual classification hardening R1' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify exact pre-write context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "201bdcb9069eb253120320c639b61fc8317a523b"
          test -f governance/test/spec_change_authorizations/USR-DIRECTIVE-20260918-MOTHER-RESIDUAL-CLASSIFICATION-HARDENING-R1.yaml
          grep -q 'GOV-REV-20260918-MOTHER-CONTEXT-TASK-LAYER-HARDENING' governance/specifications/REGISTRY.yaml
      - name: Install verifier dependency
        run: python -m pip install --quiet pyyaml
      - name: Materialize successor and run complete local gate
        run: python .github/governance-maintenance/materialize_mother_residual_classification_hardening.py
      - name: Verify transaction hygiene
        run: |
          set -euo pipefail
          test ! -e .github/governance-maintenance/materialize_mother_residual_classification_hardening.py
          test ! -e .github/workflows/mother-residual-classification-hardening.yml
          git diff --check
      - name: Commit and push exact successor
        run: |
          set -euo pipefail
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A
          git commit -m "feat(governance): promote semantic residual classification hardening" \
            -m "Spec-Change-Authorization: USR-DIRECTIVE-20260918-MOTHER-RESIDUAL-CLASSIFICATION-HARDENING-R1" \
            -m "Spec-Change-Scope: MOTHER_SEMANTIC_RESIDUAL_CLASSIFICATION_HARDENING"
          git push origin HEAD:rebuild-v2.1.1
