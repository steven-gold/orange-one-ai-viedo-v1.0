name: Stage-02 CORE-01 Product Authority Review R8

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - 'governance/ci/build_stage02_core01_product_authority_review_r8.py'
      - 'governance/ci/validate_stage02_core01_product_authority_review_r8.py'
      - '.github/workflows/stage02-core01-product-authority-review-r8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage02-core01-product-authority-review-r8
  cancel-in-progress: false

jobs:
  core01-product-authority-review-r8:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1

      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Compile R8 review machinery
        run: |
          python -m py_compile governance/ci/build_stage02_core01_product_authority_review_r8.py
          python -m py_compile governance/ci/validate_stage02_core01_product_authority_review_r8.py

      - name: Re-prove exact 75-file governance source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py

      - name: Enforce frozen Current Specification
        run: python governance/ci/specification_mutation_guard.py

      - name: Resolve Current governance and remediation protocol
        run: |
          set -euo pipefail
          python governance/ci/governance_resolver.py
          python governance/ci/validate_validation_remediation_closure_protocol.py

      - name: Revalidate current external-authority-aware Stage-02 truth
        run: |
          set -euo pipefail
          python governance/ci/validate_stage02_successor_integrity_external_aware_r3.py
          python governance/ci/validate_current_stage2_materialized_closure_external_aware_r3.py
          python governance/ci/validate_current_stage2_functional_remediation_r3.py
          python governance/ci/validate_current_stage2_external_authority_resolution_r3.py
          python governance/ci/validate_stage02_remediation_reset_continuity_external_aware_r3.py
          python governance/ci/validate_stage02_product_design_authority_intake_r6.py

      - name: Build exact CORE-01 40-decision review contract
        run: python governance/ci/build_stage02_core01_product_authority_review_r8.py

      - name: Validate R8 exact identities, source context, and zero-authority-value invariant
        run: python governance/ci/validate_stage02_core01_product_authority_review_r8.py

      - name: Prove R8 did not mutate specification, Stage-01, or Stage-02 product output
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/04_PAGE_FUNCTIONAL_CONTRACT
          echo 'PASS: R8 is review evidence only; no Current Specification, Stage-01, or Stage-02 product contract mutation'

      - name: Verify CORE-01 blocker reduction remains zero
        run: |
          python - <<'PY'
          import yaml
          p='governance/test/stage02/STAGE02_CORE01_PRODUCT_AUTHORITY_REVIEW_R8.yaml'
          d=yaml.safe_load(open(p, encoding='utf-8'))
          assert d['denominators']['core01_open_product_authority_decisions'] == 40
          assert d['denominators']['approved_bindings_in_review_package'] == 0
          assert d['denominators']['materializable_bindings_in_review_package'] == 0
          assert d['denominators']['effective_stage02_blocker_reduction_claimed'] == 0
          assert d['stage02_status'] == 'BLOCKED'
          assert d['stage03_allowed'] is False
          assert d['website_construction_allowed'] is False
          assert d['deployment_allowed'] is False
          print('PASS: CORE-01 remains 40 product-authority decisions; Stage-02 effective blocker total remains 150')
          PY

      - name: Commit R8 review contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/stage02/STAGE02_CORE01_PRODUCT_AUTHORITY_REVIEW_R8.yaml
          if git diff --cached --quiet; then
            echo 'BLOCK: R8 generated no persistent review contract' >&2
            exit 1
          fi
          git commit -m 'test(stage02): persist CORE-01 product authority review R8'
          git push origin HEAD:rebuild-v2.1.1

      - name: Upload R8 review contract
        uses: actions/upload-artifact@v4
        with:
          name: stage02-core01-product-authority-review-r8
          path: governance/test/stage02/STAGE02_CORE01_PRODUCT_AUTHORITY_REVIEW_R8.yaml
          if-no-files-found: error
