name: Stage-02 Finding Create Control Trigger Candidate Review R32

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-finding-create-control-trigger-candidate-review-r32.yml'
      - 'governance/ci/build_stage02_finding_create_control_trigger_candidate_review_r32.py'
      - 'governance/ci/validate_stage02_finding_create_control_trigger_candidate_review_r32.py'
      - 'governance/test/stage02/STAGE02_ACTION_CONTROL_TRIGGER_DEPENDENCY_TRACE_R18.yaml'
      - 'governance/test/stage02/STAGE02_OWNING_LAYER_REMEDIATION_INPUT_PACKET_R31.yaml'
      - '00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE/ASSET-01/ASSET_PAGE_VISUAL_AUTHORITY_FINAL_SCRIPT_CONTENT_CLOSED_V1.1.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-review-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile R32 implementation
        run: |
          python -m py_compile governance/ci/build_stage02_finding_create_control_trigger_candidate_review_r32.py
          python -m py_compile governance/ci/validate_stage02_finding_create_control_trigger_candidate_review_r32.py
      - name: Revalidate current 129 problem and input baseline
        run: |
          python governance/ci/validate_stage02_current_problem_reconciliation_r30.py
          python governance/ci/validate_stage02_owning_layer_remediation_input_packet_r31.py
          python governance/ci/validate_stage02_action_control_trigger_dependency_trace_r18.py
      - name: Build Finding Create behavior candidates and chain review
        run: python governance/ci/build_stage02_finding_create_control_trigger_candidate_review_r32.py
      - name: Validate R32 candidate review
        run: python governance/ci/validate_stage02_finding_create_control_trigger_candidate_review_r32.py
      - name: Prove frozen Current Specification and immutable Stage-1 Raw authority unchanged
        run: |
          git diff --exit-code -- governance/specifications/current
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/00_SOURCE_INTAKE/RAW_SOURCE
      - name: Assert no product behavior selection or blocker reduction
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('governance/test/stage02/STAGE02_FINDING_CREATE_CONTROL_TRIGGER_CANDIDATE_REVIEW_R32.yaml').read_text())
          r=d['review_result']
          assert r['reasonable_candidate_count']==2, r
          assert r['unique_minimal_behavior_proven'] is False, r
          assert r['product_authority_decision_required'] is True, r
          assert r['classification']=='AUTHORITY_GAP_MULTIPLE_REASONABLE_PRODUCT_BEHAVIORS', r
          assert r['owning_layer_contract_value_materialized'] is False, r
          assert r['blocker_reduction_credit']==0, r
          assert d['product_behavior_selected_by_ai'] is False, d
          assert d['stage02_status']=='BLOCKED' and d['stage03_allowed'] is False, d
          print('PASS: R32 proves two reasonable behaviors, zero unique selection, zero materialization, zero blocker reduction')
          PY
      - name: Persist R32 candidate review
        run: |
          path='governance/test/stage02/STAGE02_FINDING_CREATE_CONTROL_TRIGGER_CANDIDATE_REVIEW_R32.yaml'
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo 'R32 output unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'test(stage02): persist Finding Create control trigger candidate review R32'
          git push origin HEAD:rebuild-v2.1.1
