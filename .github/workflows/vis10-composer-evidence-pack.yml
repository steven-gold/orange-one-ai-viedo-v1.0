name: VIS-10 composer evidence pack
on:
  push:
    branches: [acpos-vis10-composer-remediation]
    paths:
      - .github/workflows/vis10-composer-evidence-pack.yml
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-composer-remediation
      - uses: actions/upload-artifact@v4
        with:
          name: vis10-composer-manual-inspection
          path: |
            docs/construction/evidence/VIS-10/vis10-composer-1440-top.png
            docs/construction/evidence/VIS-10/vis10-composer-1440-expanded.png
            docs/construction/evidence/VIS-10/vis10-composer-1440-bottom.png
      - name: Self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git rm .github/workflows/vis10-composer-evidence-pack.yml
          git commit -m "chore(vis10): remove composer evidence pack workflow"
          git push origin HEAD:acpos-vis10-composer-remediation
