name: ACPOS Batch 09 Same Owner Relation Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch-09-same-owner-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install --quiet python-docx
      - name: Preflight syntax
        run: python -m py_compile __temp/batch_09_same_owner_relation_audit.py
      - name: Run same-owner exact relation audit
        run: python __temp/batch_09_same_owner_relation_audit.py
      - name: Upload Batch 09 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch-09-same-owner-relation-audit
          path: __batch09_same_owner_relation_audit.json
          retention-days: 1
