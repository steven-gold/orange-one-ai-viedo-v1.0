purpose: 全公司首頁總覽；以卡片摘要顯示公司專案、進度、Topic 總作業時間、待處理／待審查、生產、通知、公司公告、AI／產業新聞、系統狀態與近期完成。各部門細節必須回各自部門頁查看。
authority_decisions:
- decision_uid: WB-01-DECISION-001-CORRECTION-RATE
  subject: Correction Rate conflict
  decision: DO_NOT_RENDER
  reason: The page-specific 14 Section/Field/Control registry and UT-R9-DASH-003 require exactly six KPI cards and contain
    no correction-rate field/control. A seventh KPI is forbidden until canonically registered.
- decision_uid: WB-01-DECISION-002-HEADER
  subject: Dashboard page-local header/context bar ambiguity
  decision: NO_PAGE_LOCAL_HEADER
  reason: Global Shell owns header/page identity and explicitly forbids page_specific_header. CMP-CONTEXT-BAR may exist as
    shell infrastructure but WB-01 shall not render a 15th visible business section.
- decision_uid: WB-01-DECISION-003-TRIGGER
  subject: Section open trigger surface
  decision: HEADER_TRAILING_VIEW_BUTTON_ONLY
  reason: Each canonical SECTION_OPEN control has exactly one visible trigger. Cards and list rows are not clickable.
- decision_uid: WB-01-DECISION-004-POLICY
  subject: Hidden vs disabled
  decision: PERMISSION_DENIED=HIDDEN; STATE_TEMPORARILY_UNAVAILABLE=DISABLED
  reason: Permission does not render unauthorized content/control. Disabled is reserved for authorized controls blocked by
    current UI/read state.
- decision_uid: WB-01-DECISION-005-RETRY
  subject: Error retry
  decision: NO_NEW_RETRY_CONTROL
  reason: No Retry control is registered. A user may invoke the same registered 查看/SECTION_OPEN control again after an error;
    label and identity remain unchanged.
layout:
  main_workspace:
    display: CSS_GRID
    columns: repeat(12, minmax(0, 1fr))
    gap: 16px
    align_items: start
    height: auto
    overflow_y: auto
    min_width: 1280px
    content_padding: 16px
    no_page_local_header: true
  desktop_ge_1440:
    kpi: 6 cards, each span 2, one row
    project_progress: span 8
    company_progress: span 4
    production_summary: span 8
    notifications: span 4
    announcements_news_status: each span 4
    recent_completions: span 12
  desktop_1280_1439:
    kpi: 3 + 3, each span 4, exact canonical order
    remaining_sections: same 8/4, 4/4/4, 12/12 spans as >=1440; no 'where possible' discretion
  below_1280: Keep Main Workspace min-width=1280px and horizontal scroll. No alternate mobile workflow, stacking, drawer conversion
    or section reordering.
  visibility_reflow: Within each row group, authorized visible sections pack left-to-right in canonical order without changing
    each section's span. Never migrate a section to a different row group and never stretch to fill a denied sibling.
  card_common:
    panel_style: GLOBAL_VISUAL_PANEL_ONLY
    padding: 16px
    inner_gap: 12px
    header_height: 40px
    view_button_height: 40px
    view_button_min_width: 88px
    section_icon: NONE
    decorative_asset: NONE
    loading_empty_error_preserve_geometry: true
