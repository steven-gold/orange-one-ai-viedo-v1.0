name: Governance v2.1.8 Successor Linkage and Evidence Sync Gate
on:
  push:
    branches: [rebuild-v2.1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-v218-upstream-projection-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Replay sealed Segment Mapping and Source Facts through isolated historical authority projection
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_upstream_projection.py
  current-v218-phase-successor-authority-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact successor Gate chain and unresolved external Authority preservation
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_phase_authority.py
  current-v218-responsibility-classification-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate 52/52 Classification directly in current successor workspace
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_classification.py
  current-v218-page-base-blueprint-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate Page Blueprint directly and allow only legal later successors
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_page_base_blueprint.py
  current-v218-candidate-record-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify v2.1.8 local Pre-formal denominators, hashes, successor contract, and Evidence sync policy
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_current_v218_candidate_record.py
  sealed-v216-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify exact sealed v2.1.6 runtime, Stage-1 33/33, and lifecycle 11/11
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python governance/ci/validate_sealed_v216_runtime.py
