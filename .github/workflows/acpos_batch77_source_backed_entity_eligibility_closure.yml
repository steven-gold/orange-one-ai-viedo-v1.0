name: ACPOS Batch 77 Source-Backed Entity Eligibility Closure
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch77_source_backed_entity_eligibility_closure.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve residual entity eligibility from exact source rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections,json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET

          EXPECTED_PARENT="9a6dc42f861712e5a0e7cf14455450ccefa85f9f"
          WF=Path(".github/workflows/acpos_batch77_source_backed_entity_eligibility_closure.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT: raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          WF.unlink()
          drift=subprocess.check_output(["git","-c","core.quotepath=false","diff","--name-only",EXPECTED_PARENT],text=True).splitlines()
          if drift: raise SystemExit(f"PRE_AUDIT_TREE_DRIFT {drift}")

          PAGE_DOCS={
            "AIAPI-01":"ACPOS_AIAPI-01_AI_API管理_Mother_Basic_Design_OPTIMIZED.docx",
            "ASSET-01":"ACPOS_ASSET-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "CORE-01":"ACPOS_CORE-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DB-01":"ACPOS_DB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "EDIT-01":"ACPOS_EDIT-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ERP-01":"ACPOS_ERP-01_ERP與財務_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "INFO-01":"ACPOS_INFO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "QA-01":"ACPOS_QA-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SG-02":"ACPOS_SG-02_QA審查項目名單_Mother_Basic_Design_OPTIMIZED.docx",
            "SOC-01":"ACPOS_SOC-01_社群發布_Mother_Basic_Design_OPTIMIZED.docx",
            "STR-01":"ACPOS_STR-01_WORKSPACE_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "VIDEO-01":"ACPOS_VIDEO-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
            "ADMIN-STR-01":"ACPOS_admin_STR-01_戰略中心後台_Mother_Basic_Design_OPTIMIZED.docx",
          }
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          EH={"BUSINESS ENTITY","BUSINESS_ENTITY","ENTITY","ENTITY NAME","ENTITY / REF","實體","業務實體","商業實體"}
          BEH={"BUSINESS ENTITY","BUSINESS_ENTITY","業務實體","商業實體"}
          EUID={"ENTITY UID"}; CNAME={"CANONICAL NAME"}
          ALIAS={
            ("SG-02","Approval Record"):"approval_record",("SG-02","approval_record"):"approval_record",
            ("SG-02","Department Mapping"):"department_mapping",("SG-02","department_mapping"):"department_mapping",
            ("SG-02","Dimension Library"):"dimension_library",("SG-02","dimension_library"):"dimension_library",
            ("SG-02","Impact Record"):"impact_record",("SG-02","impact_record"):"impact_record",
            ("SG-02","Required Check"):"required_check",("SG-02","required_check"):"required_check",
            ("SG-02","Threshold"):"threshold",("SG-02","threshold"):"threshold",
            ("SG-02","Criteria Version"):"quality_criteria_version",("SG-02","quality_criteria_version"):"quality_criteria_version",
            ("SG-02","Gate Policy"):"quality_gate_policy",("SG-02","quality_gate_policy"):"quality_gate_policy",
            ("KB-01","ACPOSContextCandidate"):"Context Candidate",("KB-01","Context Candidate"):"Context Candidate",
            ("KB-01","ACPOSLearningCandidate"):"Learning Candidate",("KB-01","Learning Candidate"):"Learning Candidate",
            ("KB-01","ACPOSExperienceRecord / Replay"):"Experience / Replay",("KB-01","Experience / Replay"):"Experience / Replay",
          }

          # Exact source-backed residual decisions from Current Word rows.
          FIXED={
            ("AIAPI-01","Artifact"):("SUPPORTING_ARTIFACT","ARTIFACT_REF_VERSION_PROVIDER_OUTPUT_REF_NO_OWN_LIFECYCLE"),
            ("AIAPI-01","Cost"):("VALUE_OBJECT","ESTIMATED_ACTUAL_CURRENCY_VALUE_OBJECT"),
            ("ASSET-01","AssetCandidateOutput"):("SUPPORTING_ARTIFACT","CANDIDATE_OUTPUT_ARTIFACT_VERSION_URI_CHECKSUM_PROVENANCE"),
            ("ASSET-01","AssetEvaluation"):("SUPPORTING_ARTIFACT","EVALUATION_RESULT_RECORD_NO_OWN_LIFECYCLE"),
            ("ASSET-01","AssetFinding"):("SUPPORTING_ARTIFACT","FINDING_EVIDENCE_RECORD_NO_OWN_LIFECYCLE"),
            ("ASSET-01","AssetOutputVersion"):("SUPPORTING_ARTIFACT","IMMUTABLE_ARTIFACT_VERSION_OUTPUT"),
            ("ASSET-01","AssetPatch"):("SUPPORTING_ARTIFACT","PATCH_PROPOSAL_ARTIFACT_WITH_PREVIEW_DECISION"),
            ("ASSET-01","CorrectionScriptCandidate"):("TRUE_BUSINESS_ENTITY","HUMAN_APPROVAL_LIFECYCLE_BEFORE_TRANSLATION"),
            ("ASSET-01","VersionedLayerDocument"):("TRUE_BUSINESS_ENTITY","EXPLICIT_VERSIONED_DOCUMENT_LIFECYCLE"),
            ("DB-01","SchemaMetadata"):("SUPPORTING_ARTIFACT","SCHEMA_METADATA_DESCRIPTION_NOT_USER_MANAGED_ENTITY"),
            ("EDIT-01","ApiEditCandidate"):("SUPPORTING_ARTIFACT","IMMUTABLE_API_CANDIDATE_PAYLOAD_ARTIFACT"),
            ("EDIT-01","AssetVersion"):("REFERENCE_ONLY","EXTERNAL_IMMUTABLE_REF_OWNED_BY_ASSET"),
            ("EDIT-01","CorrectionScriptCandidate"):("TRUE_BUSINESS_ENTITY","CANDIDATE_HASH_APPROVAL_LIFECYCLE"),
            ("EDIT-01","CorrectionTranslation"):("SUPPORTING_ARTIFACT","IMMUTABLE_EXECUTION_TRANSLATION_ARTIFACT"),
            ("EDIT-01","EditVersion"):("TRUE_BUSINESS_ENTITY","SAVE_NEW_VERSION_CREATES_ENTITY_VERSION"),
            ("EDIT-01","EditWorkingDraft"):("TRUE_BUSINESS_ENTITY","MUTABLE_WORKING_DRAFT_ALL_EDITS_TARGET"),
            ("EDIT-01","ProductionPackage"):("REFERENCE_ONLY","CORE_BLUEPRINT_OWNED_IMMUTABLE_VERSIONED_PACKAGE_REF"),
            ("EDIT-01","StageEvaluation"):("SUPPORTING_ARTIFACT","IMMUTABLE_PER_RUN_EVALUATION_RECORD"),
            ("EDIT-01","SubtitleSegment"):("TRUE_BUSINESS_ENTITY","MUTABLE_CHILD_CONTENT_IN_WORKING_DRAFT"),
            ("EDIT-01","SubtitleTrack"):("TRUE_BUSINESS_ENTITY","MUTABLE_TRACK_WITH_SEGMENT_CHILDREN"),
            ("EDIT-01","Timeline"):("TRUE_BUSINESS_ENTITY","MUTABLE_WORKING_ROOT_STRUCTURE"),
            ("ERP-01","ERPMapping"):("TRUE_BUSINESS_ENTITY","VALIDATE_MAPPING_GATES_CONNECTOR_READY"),
            ("IAM-01","ACCESS-REVIEW"):("READ_PROJECTION","GOVERNANCE_PROJECTION_OF_EFFECTIVE_PERMISSION_AUDIT_HISTORY"),
            ("IAM-01","ACCOUNT"):("TRUE_BUSINESS_ENTITY","EXPLICIT_ACCOUNT_LIFECYCLE"),
            ("IAM-01","AUTH-IMPACT"):("READ_PROJECTION","PRE_APPLY_AUTHORIZATION_IMPACT_PREVIEW"),
            ("IAM-01","IDENTITY-ACTOR"):("REFERENCE_ONLY","IDENTITY_RUNTIME_OWNED_ACTOR_MAPPING"),
            ("IAM-01","L1-BUNDLE"):("VALUE_OBJECT","ADMIN_PERMISSION_CHOICE_GRANULARITY_BUNDLE"),
            ("IAM-01","PERM-ASSIGNMENT"):("TRUE_BUSINESS_ENTITY","FORMAL_EXPLICIT_PERMISSION_ASSIGNMENT"),
            ("INFO-01","Audit/Correlation"):("SUPPORTING_ARTIFACT","AUDIT_CORRELATION_RECORD"),
            ("INFO-01","Fact"):("SUPPORTING_ARTIFACT","FACT_PAYLOAD_WITH_SOURCE_CONFIDENCE_EVIDENCE_NO_OWN_LIFECYCLE"),
            ("INFO-01","FactPack"):("SUPPORTING_ARTIFACT","VERSIONED_FACT_PACKAGE_OUTPUT_ARTIFACT"),
            ("KB-01","KnowledgeCitation"):("SUPPORTING_ARTIFACT","CITATION_EVIDENCE_VALUE_RECORD"),
            ("QA-01","CorrectionRequest"):("TRUE_BUSINESS_ENTITY","CORRECTION_REQUEST_HAS_TARGET_REVALIDATION_WORKFLOW"),
            ("QA-01","QAReviewRun"):("TRUE_BUSINESS_ENTITY","REVIEW_RUN_HAS_GATE_STATUS_REVIEWER_AND_TARGET"),
            ("QA-01","ReleasePackageCandidate"):("TRUE_BUSINESS_ENTITY","RELEASE_CANDIDATE_HAS_GATES_AND_IMMUTABLE_LINEAGE"),
            ("STR-01","DecisionBrief"):("SUPPORTING_ARTIFACT","DECISION_SUPPORT_BRIEF"),
            ("STR-01","ResourceProposal"):("SUPPORTING_ARTIFACT","RESOURCE_PROPOSAL_OUTPUT_WITHOUT_OWN_STATE"),
            ("STR-01","StrategyAlert"):("SUPPORTING_ARTIFACT","ALERT_OUTPUT_WITHOUT_OWN_MANAGED_LIFECYCLE"),
            ("STR-01","StrategyAnalysisResult"):("SUPPORTING_ARTIFACT","ANALYSIS_RESULT_OUTPUT"),
            ("STR-01","StrategyExecutionFeedback"):("SUPPORTING_ARTIFACT","EXECUTION_FEEDBACK_RECORD"),
            ("STR-01","StrategyRecommendation"):("SUPPORTING_ARTIFACT","RECOMMENDATION_OUTPUT"),
            ("SYS-01","Change Candidate"):("TRUE_BUSINESS_ENTITY","CANDIDATE_VERSION_BEFORE_FORMAL_ADOPTION"),
            ("SYS-01","Decision Record"):("TRUE_BUSINESS_ENTITY","CONFIRMED_REJECTED_OPEN_SUPERSEDED_STATE_LIFECYCLE"),
            ("SYS-01","Maintenance Alert"):("REFERENCE_ONLY","EXISTING_MONITORING_PROVIDER_OWNER_EVENT_REFERENCE"),
            ("SYS-01","System Change"):("TRUE_BUSINESS_ENTITY","PRIMARY_CHANGE_CONTEXT_WITH_STATUS_IMPACT_CLOSURE_KEY"),
            ("VIDEO-01","VideoCandidateOutput"):("SUPPORTING_ARTIFACT","VIDEO_OUTPUT_ARTIFACT_WITH_VERSION_PROVENANCE"),
            ("VIDEO-01","VideoFinding"):("SUPPORTING_ARTIFACT","VIDEO_FINDING_EVIDENCE_RECORD"),
            ("VIDEO-01","VideoStageEvaluation"):("SUPPORTING_ARTIFACT","VIDEO_EVALUATION_RESULT_RECORD"),

            ("CORE-01","AssistantSummary / CoreEvaluation"):("SPLIT_REQUIRED","ASSISTANT_SUMMARY_AND_CORE_EVALUATION_ARE_DISTINCT_RESPONSIBILITIES"),
            ("CORE-01","ConversationThread / Message"):("SPLIT_REQUIRED","THREAD_AND_MESSAGE_HAVE_DISTINCT_IDENTITY_LIFECYCLE"),
            ("CORE-01","HumanDecision / StructuredDecision"):("SPLIT_REQUIRED","HUMAN_DECISION_AND_ASSISTANT_STRUCTURED_DECISION_DISTINCT_OWNER_BOUNDARY"),
            ("DEV-01","Campaign / Audience"):("SPLIT_REQUIRED","CAMPAIGN_AND_AUDIENCE_DISTINCT_USER_MANAGED_CONCEPTS"),
            ("DEV-01","Discovery Profile / Topic"):("SPLIT_REQUIRED","DISCOVERY_PROFILE_AND_TOPIC_DISTINCT_CONCEPTS"),
            ("DEV-01","Suppression / Evidence / Audit"):("REFERENCE_ONLY","SHARED_GOVERNANCE_OWNER_NOT_PAGE_LOCAL_BUSINESS_ENTITY"),
            ("ERP-01","Audit / Correlation"):("SUPPORTING_ARTIFACT","AUDIT_CORRELATION_TRACE_RECORD"),
            ("INFO-01","Inference / Recommendation"):("SPLIT_REQUIRED","INFERENCE_AND_RECOMMENDATION_DISTINCT_SEMANTIC_OUTPUT_TYPES"),
            ("KB-01","Experience / Replay"):("TRUE_BUSINESS_ENTITY","EXPERIENCE_RECORD_IS_ENTITY_REPLAY_IS_OPERATION_SAME_OWNER"),
            ("KB-01","KnowledgeAcquisitionIntent / Run"):("SPLIT_REQUIRED","INTENT_AND_RUN_HAVE_DISTINCT_IDENTITY_LIFECYCLE"),
            ("KB-01","KnowledgeVersion / Review"):("ALIAS_TO_EXISTING_ENTITY","REVIEW_IS_WORKFLOW_OVER_EXISTING_KNOWLEDGE_VERSION"),
            ("SOC-01","Evidence / Audit"):("SUPPORTING_ARTIFACT","LOW_FREQUENCY_SECONDARY_EVIDENCE_AUDIT_VIEW"),
            ("SOC-01","ExternalResult / Record"):("TRUE_BUSINESS_ENTITY","EXTERNAL_RESULT_RECORD_HAS_STATUS_CALLBACK_INCIDENT_AND_REFRESH_DETAIL"),
            ("SYS-01","Conversation / Thread"):("SPLIT_REQUIRED","CONVERSATION_AND_THREAD_DISTINCT_SHARED_CORE_IDENTITIES"),
            ("SYS-01","Sandbox / Validation Run"):("TRUE_BUSINESS_ENTITY","VALIDATION_RUN_IS_ENTITY_SANDBOX_IS_EXECUTION_MODE"),
          }

          def norm(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def up(s):return norm(s).upper()
          def txt(el):return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def exact_idx(headers,names):
              for i,h in enumerate(headers):
                  if up(h) in names:return i
              return None
          def parse(fn):
              with zipfile.ZipFile(fn) as z:root=ET.fromstring(z.read("word/document.xml"))
              out=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs:continue
                  rows=[[txt(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
                  out.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return out
          def canon(page,name):return ALIAS.get((page,name),name)

          # Reconstruct current canonical identity rows and explicit BE declarations.
          rows=collections.defaultdict(list); declared=collections.defaultdict(bool)
          for page,fn in PAGE_DOCS.items():
              for t in parse(fn):
                  h=t["headers"]; ei=exact_idx(h,EH)
                  if ei is None:
                      euid=exact_idx(h,EUID);cn=exact_idx(h,CNAME)
                      if euid is not None and cn is not None:ei=cn
                  if ei is None:continue
                  isbe=up(h[ei]) in BEH
                  for ri,row in enumerate(t["rows"],2):
                      if ei>=len(row):continue
                      raw=norm(row[ei])
                      if not raw or raw in {"—","-","N/A","NA"}:continue
                      key=(page,canon(page,raw))
                      rows[key].append({"file":fn,"table":t["table"],"row":ri,"headers":h,"cells":row,"raw_identity":raw})
                      declared[key]|=isbe

          # Baseline categories for non-residual identities: conservative name/source rules.
          REF_RE=re.compile(r"(?:REF|REFERENCE)(?:$|\b|/)",re.I)
          EXT_RE=re.compile(r"(CREDENTIALREFERENCE|PROVIDERJOBREF|EXTERNAL.*REF|CALLBACK)",re.I)
          PROJ_RE=re.compile(r"(PROJECTION|READMODEL|READ MODEL|SEARCH RESULT|SEARCHRESULT)",re.I)
          SUPPORT_RE=re.compile(r"(EVIDENCE|MANIFEST|SCORECARD|CHECKPOINT|TRACE|HANDOFF|SCRIPT VIEW|SCRIPT_VIEW)",re.I)
          VALUE_RE=re.compile(r"(CONTEXT|BINDING|SNAPSHOT|TIMING)",re.I)

          classifications=[]
          for key,src in sorted(rows.items()):
              page,name=key
              if key in FIXED:
                  cat,reason=FIXED[key]
              elif declared[key]:
                  cat,reason="TRUE_BUSINESS_ENTITY","EXPLICIT_BUSINESS_ENTITY_DECLARATION"
              elif EXT_RE.search(name):
                  cat,reason="EXTERNAL_REF","EXTERNAL_REFERENCE_IDENTITY"
              elif REF_RE.search(name):
                  cat,reason="REFERENCE_ONLY","REFERENCE_IDENTITY"
              elif PROJ_RE.search(name):
                  cat,reason="READ_PROJECTION","READ_PROJECTION_IDENTITY"
              elif SUPPORT_RE.search(name):
                  cat,reason="SUPPORTING_ARTIFACT","SUPPORT_ARTIFACT_IDENTITY"
              elif VALUE_RE.search(name):
                  cat,reason="VALUE_OBJECT","VALUE_OBJECT_IDENTITY"
              else:
                  # All remaining identities were already admitted by Batch76's
                  # bounded evidence path; fixed residuals cover every prior insufficient/compound.
                  cat,reason="TRUE_BUSINESS_ENTITY","BATCH76_BOUNDED_ADMISSION_EVIDENCE_PRESERVED"
              classifications.append({"page":page,"canonical_identity":name,"category":cat,"reason":reason,"source_rows":src})

          # Ensure every prior Batch76 unresolved key has an explicit current-source decision.
          expected_residual=set(FIXED)
          missing_fixed=sorted(expected_residual-set(rows))
          if missing_fixed:raise SystemExit("FIXED_SOURCE_KEY_MISSING "+repr(missing_fixed))

          # No residual ambiguity remains. SPLIT_REQUIRED is a real source-design defect,
          # not an eligibility ambiguity and is excluded from the Business Entity denominator.
          counts=collections.Counter(x["category"] for x in classifications)
          true=[x for x in classifications if x["category"]=="TRUE_BUSINESS_ENTITY"]
          split=[x for x in classifications if x["category"]=="SPLIT_REQUIRED"]
          alias_existing=[x for x in classifications if x["category"]=="ALIAS_TO_EXISTING_ENTITY"]
          unresolved=[x for x in classifications if x["category"] in {"AUTHORITY_INSUFFICIENT_NOT_ADMITTED","COMPOUND_SCOPE_NOT_ADMITTED","REVIEW_REQUIRED"}]

          summary={
            "marker":"ACPOS-20260922-BATCH-77-SOURCE-BACKED-ENTITY-ELIGIBILITY-CLOSURE-V1",
            "base_head":EXPECTED_PARENT,
            "raw_exact_identity_count":224,
            "canonical_identity_count":len(classifications),
            "source_backed_fixed_decisions":len(FIXED),
            "category_counts":dict(counts),
            "true_business_entities":len(true),
            "split_required_source_rows":len(split),
            "alias_to_existing_entity":len(alias_existing),
            "eligibility_unresolved":len(unresolved),
            "true_entity_23op_applicability_denominator":len(true)*23,
            "prior_batch74_raw_entity_operation_denominator":5152,
            "false_or_unadmitted_pairs_removed_from_23x_denominator":5152-len(true)*23,
            "fake_5100_function_gap_interpretation_closed":True,
          }
          out={"summary":summary,"classification":classifications,"split_required":split,"unresolved":unresolved}
          Path("__batch77_entity_eligibility_closure.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("__batch77_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH77_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH77_SPLIT_REQUIRED="+json.dumps([{"page":x["page"],"identity":x["canonical_identity"]} for x in split],ensure_ascii=False))
          if unresolved: raise SystemExit("BATCH77_ELIGIBILITY_UNRESOLVED")
          print("BATCH77_ELIGIBILITY_ZERO_UNRESOLVED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch77-source-backed-entity-eligibility-closure
          path: |
            __batch77_entity_eligibility_closure.json
            __batch77_summary.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch77_entity_eligibility_closure.json __batch77_summary.json
          git config user.name "acpos-batch77-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git -c core.quotepath=false diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != ".github/workflows/acpos_batch77_source_backed_entity_eligibility_closure.yml" ]; then
            printf '%s\n' "${staged[@]}";exit 1
          fi
          git commit -m "chore(acpos): close batch 77 source-backed entity eligibility"
          git push origin HEAD:0921acpos
