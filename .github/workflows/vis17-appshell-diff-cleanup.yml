name: VIS-17 AppShell Diff Cleanup
on:
  push:
    branches: [acpos-vis17-staging]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis17-staging
          fetch-depth: 0
      - name: Restore exact AppShell and add only STR-01 href
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new
          git show origin/new:src/components/shell/AppShell.tsx > src/components/shell/AppShell.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/shell/AppShell.tsx')
          s=p.read_text()
          old='  { id: "ADMIN-NAV-08", labelKey: "global.admin.strategy", icon: "strategy" },'
          new='  { id: "ADMIN-NAV-08", labelKey: "global.admin.strategy", icon: "strategy", href: "/admin/strategy" },'
          if s.count(old) != 1:
              raise SystemExit(f'expected one ADMIN-NAV-08 source line, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff -- src/components/shell/AppShell.tsx
          test "$(git diff origin/new --numstat -- src/components/shell/AppShell.tsx | awk '{print $1+$2}')" = "2"
          grep -Fq 'href: "/admin/strategy"' src/components/shell/AppShell.tsx
      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vis17-appshell-diff-cleanup.yml
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add -A src/components/shell/AppShell.tsx .github/workflows/vis17-appshell-diff-cleanup.yml
          git commit -m 'chore(vis17): minimize AppShell change to STR-01 href only'
          git push origin HEAD:acpos-vis17-staging
