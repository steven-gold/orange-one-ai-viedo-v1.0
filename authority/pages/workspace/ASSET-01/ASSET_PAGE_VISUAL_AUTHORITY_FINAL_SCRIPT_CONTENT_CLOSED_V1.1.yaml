layer_patch_contract:
  eligibility: Only image-compatible asset types; Voice/Music/SFX do not render Layer/Patch controls.
  system_position: ACPOS Versioned Layer Document / AssetPatch Runtime; Photoshop-like interaction model only.
  external_integration: No Adobe Photoshop API, PSD import/export, or PSD compatibility is implied unless separately defined.
  layer_types:
  - BACKGROUND
  - CHARACTER_BODY
  - FACE
  - EYES
  - NOSE
  - MOUTH
  - HAIR
  - COSTUME
  - PROPS
  - FOREGROUND
  - EFFECTS
  - TEXT_UI
  - MASK
  - ADJUSTMENT
  blend_modes:
  - NORMAL
  - MULTIPLY
  - SCREEN
  - OVERLAY
  - SOFT_LIGHT
  - HARD_LIGHT
  - COLOR_DODGE
  - LINEAR_DODGE
  - COLOR_BURN
  - LINEAR_BURN
  - DIFFERENCE
  - EXCLUSION
  mutation_rules:
  - accepted document/layer mutation increments layer document version
  - locked layers reject destructive mutation until explicitly unlocked
  - opacity range 0.0..1.0
  - parent layer belongs to same document
  - z_index unique and compact
  - accepted patch creates new ASSET_VERSION + new LAYER_DOCUMENT_VERSION; never overwrite source
scorecard:
  source: Task-bound Approved ASSET Criteria Version
  ui_fields:
  - criteria_version_id
  - dimension_uid
  - label
  - weight
  - score
  - hard_block
  - evidence_refs
  - overall_score
  - issue_summary
  rule: Do not hard-code a second scoring scheme in ASSET page. Render the approved ASSET criteria bound to current task.
