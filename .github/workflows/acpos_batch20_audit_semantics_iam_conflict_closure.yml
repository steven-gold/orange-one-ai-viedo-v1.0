name: ACPOS Batch 20 Audit Semantics IAM Conflict Closure

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch20-audit-semantics-iam-closure
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 19 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="9248e011612f72b7ee8c8b04f71bbe68db9ede63"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH19 CONTENT BOUNDARY / 31 DOCX"

      - name: Install Word QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          python -m pip install --quiet python-docx pillow

      - name: Apply Batch 20 closure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch20_audit_semantics_iam_conflict_closure.py

      - name: Verify Batch 20 semantics
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch20_remediation_report.json").read_text(encoding="utf-8"))
          m=r["machine"];s=r["summary"]
          assert m["iam_same_uid_permission_conflict_closed"]==1,m
          assert m["global_operation_name_false_blockers_reclassified"]==13,m
          assert m["local_local_false_positive_reclassified"]==1,m
          assert m["corrected_blocker_count"]==0,m
          assert s["corrected_blocker_count"]==0,s
          assert (m["transport_unbound"],m["effectful_payload_unbound"],m["effectful_persistence_owner_unbound"])==(80,137,124),m
          assert r["iam_post_values"]==["iam.user.create/configure + iam.permission.configure"],r["iam_post_values"]
          assert len(r["changed_docs"])==3,r["changed_docs"]
          print("PASS: BATCH20 CORRECTED BLOCKER COUNT 0")
          PY

      - name: Convert three DOCX files to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __render_qa_batch20/pdf
          while IFS= read -r f; do libreoffice --headless --convert-to pdf --outdir __render_qa_batch20/pdf "$f" >/dev/null; done <<'EOF'
          09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx
          ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx
          ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx
          EOF

      - name: Encoding CJK and geometry QA
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,subprocess,re,json,math,shutil
          from PIL import Image
          r=json.loads(Path("__batch20_remediation_report.json").read_text(encoding="utf-8"))
          root=Path("__render_qa_batch20");(root/"contact").mkdir(exist_ok=True);(root/"png").mkdir(exist_ok=True)
          cjk=re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]");bad=["\ufffd","ï¿½","â€™","â€œ","â€","Ã¤","Ã¥","Ã©","Ã¨","Â©","Â®"];rep={};total=0
          for fn in r["changed_docs"]:
              p=Path(fn);pdf=root/"pdf"/(p.stem+".pdf")
              with zipfile.ZipFile(p) as z:
                  rootxml=ET.fromstring(z.read("word/document.xml"));ns="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
                  src="".join((e.text or "") for e in rootxml.iter(ns+"t"))
              txt=subprocess.check_output(["pdftotext","-layout",str(pdf),"-"],text=True,errors="strict")
              assert not [x for x in bad if x in src or x in txt],(fn,"MOJIBAKE")
              sc=len(cjk.findall(src));pc=len(cjk.findall(txt));assert sc>0 and pc/sc>=0.97,(fn,sc,pc)
              out=root/"png"/p.stem;out.mkdir(exist_ok=True)
              subprocess.check_call(["pdftoppm","-png","-r","72",str(pdf),str(out/"page")],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              imgs=sorted(out.glob("page-*.png"));assert imgs
              blank=[];edge=[];thumbs=[]
              for imf in imgs:
                  im=Image.open(imf).convert("L");w,h=im.size;mask=im.point(lambda x:255 if x<245 else 0);bbox=mask.getbbox()
                  if bbox is None:blank.append(imf.name)
                  elif bbox[0]<=1 or bbox[1]<=1 or bbox[2]>=w-1 or bbox[3]>=h-1:edge.append((imf.name,bbox,(w,h)))
                  th=Image.open(imf).convert("RGB");th.thumbnail((180,255));thumbs.append(th.copy())
              assert not blank,(fn,"BLANK",blank);assert not edge,(fn,"EDGE",edge[:5])
              cols=4;cw=190;ch=265;rows=math.ceil(len(thumbs)/cols);sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for i,im in enumerate(thumbs):sheet.paste(im,((i%cols)*cw+5,(i//cols)*ch+5))
              sheet.save(root/"contact"/(p.stem+"_contact.jpg"),quality=82)
              total+=len(imgs);rep[fn]={"pages":len(imgs),"cjk_ratio":pc/sc,"blank":0,"edge_clip":0,"status":"PASS"};shutil.rmtree(out)
          rep["_summary"]={"documents":len(r["changed_docs"]),"pages":total,"blank":0,"edge_clip":0,"status":"PASS"}
          (root/"qa_report.json").write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS: BATCH20 WORD QA",rep["_summary"])
          PY

      - name: Verify exact Word scope
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import subprocess,json
          from pathlib import Path
          r=json.loads(Path("__batch20_remediation_report.json").read_text(encoding="utf-8"))
          out=subprocess.check_output(["git","-c","core.quotePath=false","diff","--name-only","9248e011612f72b7ee8c8b04f71bbe68db9ede63","--","*.docx"],text=True)
          changed=sorted(x for x in out.splitlines() if x);expected=sorted(r["changed_docs"])
          assert changed==expected,{"changed":changed,"expected":expected}
          print("PASS: EXACT WORD SCOPE = 3")
          PY

      - name: Collect evidence
        shell: bash
        run: |
          mkdir -p __batch20_evidence
          cp __batch20_remediation_report.json __batch20_evidence/
          cp __render_qa_batch20/qa_report.json __batch20_evidence/
          cp -R __render_qa_batch20/pdf __render_qa_batch20/contact __batch20_evidence/

      - name: Upload Batch 20 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch20-audit-semantics-iam-conflict-closure-evidence
          path: __batch20_evidence
          retention-days: 1
          if-no-files-found: error

      - name: Commit Batch 20 and remove tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acpos-word-batch-20"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            "09_ACPOS_AI_System_Engineer_Self_Inspection_Evolution_System_Mother_Basic_Logic_Design_Normative_Contract_v1.0.docx" \
            "ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx" \
            "ACPOS_SYSTEM_LOGIC_GLOBAL_INTEGRATION_Mother_Basic_Design_OPTIMIZED.docx"
          git rm -f __temp/batch20_audit_semantics_iam_conflict_closure.py .github/workflows/acpos_batch20_audit_semantics_iam_conflict_closure.yml
          rm -rf __batch20_remediation_report.json __batch20_evidence __render_qa_batch20
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(git diff --cached --name-only -- '*.docx' | wc -l)" -eq 3
          git commit -m "docs(acpos): harden audit identity semantics and close IAM conflict"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH20 COMMITTED / CLEAN TREE"
