name: QA01 Clean Head Static Final Once

on:
  push:
    branches: [qa01-functional-staging]
    paths:
      - '.github/workflows/qa01-clean-head-static-final-once.yml'

permissions:
  contents: write

jobs:
  final-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate clean QA-01 product head
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npx tsc --noEmit
          npm run build
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          b=Path('src/domain/qa/qaControlBindings.ts').read_text()
          controls=set(re.findall(r'"(QA-01-(?:BTN|FLD|INP|SEL|SEG|LIST|VIEW|CTL)-[A-Z0-9-]+)"',b))
          actions=set(re.findall(r'"(QA-01-ACT-[A-Z0-9-]+)"',b))
          ports=set(re.findall(r'"(QA-01-PORT-[A-Z0-9-]+)"',b))
          assert len(controls)==87,(len(controls),'controls')
          assert len(actions)==32,(len(actions),'actions')
          assert len(ports)==10,(len(ports),'ports')
          diff=subprocess.check_output(['git','diff','origin/new...HEAD','--name-only'],text=True).splitlines()
          assert not any(x.startswith('authority/') for x in diff),[x for x in diff if x.startswith('authority/')]
          assert not any(x.endswith('.css') for x in diff),[x for x in diff if x.endswith('.css')]
          assert not any(x.startswith('.github/workflows/qa01-') and not x.endswith('qa01-clean-head-static-final-once.yml') for x in diff),[x for x in diff if x.startswith('.github/workflows/qa01-')]
          print('QA01_CLEAN_STATIC_PASS controls=87 actions=32 ports=10 authority_diff=0 css_diff=0')
          PY
          rm .github/workflows/qa01-clean-head-static-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qa01-clean-head-static-final-once.yml
          git commit -m 'chore(qa): remove final one-time static workflow'
          git push origin HEAD:qa01-functional-staging
