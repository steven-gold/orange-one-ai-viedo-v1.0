name: ACPOS Batch 88 Entity Hierarchy Source Resolution
on:
  push:
    branches: [0921acpos]
    paths:
      - .github/workflows/acpos_batch88_entity_hierarchy_source_resolution.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve exact residual rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess,zipfile
          import xml.etree.ElementTree as ET
          EXPECTED_PARENT="47c5f279d32d0f0c62d6fb670ef5cc1751d40fd8"
          WF=Path(".github/workflows/acpos_batch88_entity_hierarchy_source_resolution.yml")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          if parent!=EXPECTED_PARENT: raise SystemExit(f"EXACT_HEAD_PARENT_FAIL {parent}")
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          FILES={
            "DEV-01":"ACPOS_DEV-01_企業自動開發系統_Mother_Basic_Design_OPTIMIZED.docx",
            "IAM-01":"ACPOS_IAM-01_帳戶與權限_Mother_Basic_Design_OPTIMIZED.docx",
            "KB-01":"ACPOS_KB-01_知識庫_Mother_Basic_Design_OPTIMIZED.docx",
            "SYS-01":"ACPOS_SYS-01_系統維護與生命週期工作區_Mother_Basic_Design_OPTIMIZED.docx",
            "WB-01":"ACPOS_WB-01_MOTHER_BASIC_DESIGN_TECH_PURPLE_v1.0.docx",
          }
          def norm(s):return re.sub(r"\s+"," ",(s or "").replace("\n"," | ").strip())
          def txt(el):return norm("".join((x.text or "") for x in el.iter(W+"t")))
          def tables(fn):
              with zipfile.ZipFile(fn) as z: root=ET.fromstring(z.read("word/document.xml"))
              out=[]
              for ti,tbl in enumerate(root.iter(W+"tbl"),1):
                  trs=[x for x in list(tbl) if x.tag==W+"tr"]
                  if not trs: continue
                  rows=[[txt(c) for c in list(tr) if c.tag==W+"tc"] for tr in trs]
                  out.append({"table":ti,"headers":rows[0] if rows else [],"rows":rows[1:]})
              return out

          result={}
          for page,fn in FILES.items():
              result[page]=[]
              for t in tables(fn):
                  h=[norm(x) for x in t["headers"]]
                  joined=" | ".join(h).upper()
                  hit=False
                  if page=="DEV-01":
                      hit=any(any(v in cell for v in ["Campaign / Audience","Discovery Profile / Topic"]) for cell in h+t["rows"][0] if isinstance(cell,str)) if t["rows"] else False
                      if not hit:
                          hit=any(any(norm(c)==v for c in row for v in ["Campaign / Audience","Discovery Profile / Topic"]) for row in t["rows"])
                  elif page in {"IAM-01","KB-01","SYS-01"}:
                      hit=(("PARENT" in joined and "CHILD" in joined) or ("父" in joined and "子" in joined))
                  elif page=="WB-01":
                      hit=(h==["Entity","Operation","Applicability","Authority Evidence"])
                  if hit:
                      result[page].append({"file":fn,"table":t["table"],"headers":h,"rows":t["rows"]})

          summary={p:[{"table":x["table"],"rows":len(x["rows"]),"headers":x["headers"]} for x in xs] for p,xs in result.items()}
          Path("__batch88_source_resolution.json").write_text(json.dumps({"summary":summary,"tables":result},ensure_ascii=False,indent=2),encoding="utf-8")
          print("BATCH88_SUMMARY="+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print("BATCH88_SOURCE_RESOLUTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acpos-batch88-entity-hierarchy-source-resolution
          path: __batch88_source_resolution.json
          retention-days: 2
      - name: Close harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch88_source_resolution.json
          git config user.name "acpos-batch88-source"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/acpos_batch88_entity_hierarchy_source_resolution.yml
          git commit -m "chore(acpos): close batch 88 entity hierarchy source resolution"
          git push origin HEAD:0921acpos
