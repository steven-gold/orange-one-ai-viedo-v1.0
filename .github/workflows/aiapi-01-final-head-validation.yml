name: AIAPI-01 Final Head Validation

on:
  push:
    branches:
      - aiapi-01-current-authority-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authority status guard
        run: |
          grep -F 'data-current-ui-binding-status="REMAP_REQUIRED_NOT_EXECUTED"' src/components/pages/AiApiVisual.tsx
          ! grep -F 'READ_PROJECTION_BOUND_EFFECTFUL_REMAP_BLOCKED' src/components/pages/AiApiVisual.tsx
          grep -F 'AIAPI01_PROJECTION_STATE_UNREGISTERED' src/domain/aiApi/aiApiRuntimePort.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/aiapi-next.log 2>&1 &
          echo $! > /tmp/aiapi-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/admin/aiapi >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aiapi-next.log
          exit 1
      - name: Chromium fail-closed and layout smoke
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const width of [1280, 1440, 1920]) {
              const page = await browser.newPage({viewport:{width,height:900}});
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              const response = await page.goto('http://127.0.0.1:3000/admin/aiapi', {waitUntil:'domcontentloaded'});
              if (!response || response.status() !== 200) throw new Error(`PAGE_HTTP_${response?.status()}`);
              await page.waitForTimeout(1200);
              const root = page.locator('[data-page-uid="admin:AIAPI-01"]');
              if (await root.getAttribute('data-current-ui-binding-status') !== 'REMAP_REQUIRED_NOT_EXECUTED') throw new Error('REMAP_STATUS_DRIFT');
              if (await root.getAttribute('data-page-state') !== 'ERROR') throw new Error(`EXPECTED_FAIL_CLOSED_ERROR_GOT_${await root.getAttribute('data-page-state')}`);
              const switches = page.locator('[data-view-switch]');
              if (await switches.count() !== 4) throw new Error('VIEW_COUNT_DRIFT');
              for (let i = 0; i < 4; i++) await switches.nth(i).click();
              const metrics = await page.evaluate(() => ({scrollWidth: document.documentElement.scrollWidth, innerWidth: window.innerWidth}));
              if (metrics.scrollWidth > metrics.innerWidth) throw new Error(`HORIZONTAL_OVERFLOW_${width}_${metrics.scrollWidth}`);
              if (pageErrors.length) throw new Error(`PAGEERROR_${pageErrors.join('|')}`);
              const projection = await page.request.get('http://127.0.0.1:3000/v1/ui-projections/admin%3AAIAPI-01');
              if (projection.status() !== 503) throw new Error(`EXPECTED_PROJECTION_503_GOT_${projection.status()}`);
              console.log(`AIAPI_BROWSER_PASS width=${width} pageState=ERROR projection=503 overflow=0 views=4`);
              await page.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/aiapi-next.log || true
