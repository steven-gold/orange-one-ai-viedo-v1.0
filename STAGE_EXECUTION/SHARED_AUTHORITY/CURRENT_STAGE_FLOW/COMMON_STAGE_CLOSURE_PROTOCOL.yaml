artifact_type: PRODUCT_COMMON_STAGE_CLOSURE_PROTOCOL
status: CURRENT
normative_authority: false
owner: COMMON_STAGE_CLOSURE_PROTOCOL
applies_to: [STAGE-01, STAGE-02, STAGE-03, STAGE-04, STAGE-05, STAGE-06, STAGE-07, STAGE-08, STAGE-09, STAGE-10, STAGE-11]
implementation:
  closure_orchestrator: .github/scripts/common_stage_closure.py
  cross_stage_handoff_builder: .github/scripts/common_cross_stage_handoff_builder.py
  normalized_evidence_compiler: .github/scripts/common_stage_closure_adapter.py
  terminalizer: .github/scripts/common_stage_terminalizer.py
  canonical_normalized_evidence_filename: EVIDENCE/NORMALIZED_STAGE_EVIDENCE.json
  canonical_terminal_receipt_filename: WORK_UNIT_TERMINAL_RECEIPT.yaml
closure_order:
- VERIFY_FULL_STAGE_EXECUTION_READY_GATE
- VERIFY_CURRENT_GOVERNANCE
- VERIFY_CURRENT_WORK_UNIT_AND_SCOPE
- VERIFY_REGISTERED_OPERATION_DENOMINATOR_COMPLETE
- VERIFY_OPERATION_RECEIPT_CHAIN
- VERIFY_REGISTERED_OUTPUT_DENOMINATOR_PHYSICAL
- VERIFY_SCANNER_RESULT_DENOMINATOR
- VERIFY_VALIDATOR_RESULT_DENOMINATOR
- VERIFY_ZERO_OPEN_GAP_AND_HIDDEN_DEFECT
- BUILD_CROSS_STAGE_HANDOFF_FROM_EXACT_INPUT_AND_EXECUTION_BINDING_RESOLUTION
- COMPILE_MOTHER_ENGINE_NORMALIZED_EVIDENCE
- VALIDATE_NORMALIZED_EVIDENCE_WITH_CURRENT_MOTHER_ENGINE
- REQUIRE_OUTER_EXACT_HEAD_TERMINAL_SUCCESS
- MATERIALIZE_MOTHER_ENGINE_TERMINAL_RECEIPT
- VALIDATE_TERMINAL_RECEIPT_WITH_CURRENT_MOTHER_ENGINE
- PERSIST_CLOSED_STATE_AND_RESUME
- AUTHORIZE_ONLY_REGISTERED_SUCCESSOR
rules:
  operation_executor_may_claim_stage_closure: false
  stage_specific_closure_semantics: FORBIDDEN
  scanner_or_validator_summary_without_physical_result: FORBIDDEN
  handoff_without_exact_successor_binding_resolution: FORBIDDEN
  terminal_receipt_before_normalized_evidence_validation: FORBIDDEN
  successor_materialization_before_terminal_pass: FORBIDDEN
  pass_with_open_gap_or_blocker: FORBIDDEN
  pass_with_state_matrix_evidence_conflict: FORBIDDEN
  historical_pass_credit: 0
completion_credit: 0
