normative_keywords:
- 關鍵字: MUST
  中文語義: 必須
  執行效果: 缺失即不符合規格；Formal execution 不得自行略過。
- 關鍵字: MUST_NOT
  中文語義: 禁止
  執行效果: 任何實作不得違反。
- 關鍵字: REQUIRED
  中文語義: 驗收必要
  執行效果: 缺失時該項不可 PASS。
- 關鍵字: BLOCK
  中文語義: 阻擋
  執行效果: 停止 effectful execution，保留可診斷狀態。
- 關鍵字: REVIEW_REQUIRED
  中文語義: 需授權審查
  執行效果: AI 可準備候選與證據，不可自行批准。
- 關鍵字: REQUIRE_EXACT_BINDING
  中文語義: 施工時需 Current Authority 精確綁定
  執行效果: 設計不假造 API／DB／Permission UID／Route；沒有合法 binding 時施工 fail-closed。
- 關鍵字: REFERENCE_ONLY
  中文語義: 僅引用
  執行效果: 不得複製成第二套 Authority。
highest_principle: ONE CONCEPT / ONE OWNER / REFERENCE, DO NOT COPY
purpose_scope:
- 項目: Primary Purpose
  規範: 建立一套全站共用、可追溯、版本確定、權限可控的資訊與 Context 生命週期，使所有 Domain AI／Tool／Workflow 在執行前取得同一種合法 Context，不由各頁自行拼湊。
- 項目: System Role
  規範: ACPOS 是全站中央智能協調層，不是單一聊天框、不只是 Provider Router、也不是第二套業務資料庫。
- 項目: Owner Scope
  規範: Whole-site State Projection、Context Resolution、Truth Classification、Cross-page Relationship/Impact、Information
    Retrieval、Knowledge/Experience admission、Conflict、Human Decision Queue、Shared External Acquisition
    contract、Evolution governance、Audit/Observability。
- 項目: Out of Scope 02
  規範: Conversation UI、thread/branch/memory mechanics 的詳細行為由 ACPOS-AI-02 定義；本文件只定其必須遵守的 Context/Truth 邊界。
- 項目: Out of Scope 03
  規範: Compiler、Tool Calling、Provider Router、Job orchestration 的詳細 runtime 由 ACPOS-AI-03 定義；本文件只定其 Context、Evidence、Version、Event
    依賴。
- 項目: Out of Scope 04–09
  規範: 各 Domain business behavior 由其 System Logic Owner 定義；本文件不得重複或新增 Domain 功能。
- 項目: No Second Database
  規範: ACPOSStateProjection、ContextSnapshot、ExperienceRecord 等是跨頁智能契約；不得複製 Domain canonical business rows
    形成第二真相。
source_basis:
- 來源層: Current Governance v2.2.16
  本文件可用範圍: 治理順序、ONE AUTHORITY、search-before-create、Design/Implementation/Evidence 分層、Work Unit/Resume、跨階段完整性、禁止假完成。
  不得做的事: 不得把 product/profile-local Stage state 當本文件產品功能 Authority。
- 來源層: User-confirmed AI System Logic handoff
