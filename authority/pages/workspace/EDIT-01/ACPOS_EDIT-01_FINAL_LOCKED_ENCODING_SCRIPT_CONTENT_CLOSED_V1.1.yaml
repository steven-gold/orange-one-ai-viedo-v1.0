  controls_fields:
  - control_uid: EDIT-01-CTL-SOURCE-MODE
    order: '01'
    type: segmented
    label: 來源模式
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-SOURCE-MODE-SET；值只允許 PROJECT_TASK / STANDALONE_UPLOAD
    enable_gate: EDIT-01-GATE-CONTEXT-MUTABLE；頁面未鎖定時可切換；切換必須執行 Context Reset
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-FLD-PROJECT
    order: '02'
    type: select
    label: Project
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-CONTEXT-PROJECT-SET
    enable_gate: EDIT-01-GATE-CONTEXT-MUTABLE；PROJECT_TASK 顯示且必填；STANDALONE_UPLOAD 隱藏且值必須為 null
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-FLD-TOPIC
    order: '03'
    type: select
    label: Topic
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-CONTEXT-TOPIC-SET
    enable_gate: EDIT-01-GATE-CONTEXT-MUTABLE；有 Project 才啟用；Standalone 不顯示
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-FLD-TASK
    order: '04'
    type: select
    label: Production Task
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-CONTEXT-TASK-SET
    enable_gate: EDIT-01-GATE-CONTEXT-MUTABLE；PROJECT_TASK 必填；STANDALONE_UPLOAD 禁止
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-CTL-EXECUTION-MODE
    order: '05'
    type: segmented
    label: AUTO / MANUAL
    size: FIELD_M
    action_or_behavior: EDIT-01-ACT-EXECUTION-MODE-SET
    enable_gate: EDIT-01-GATE-CONTEXT-MUTABLE；PROJECT_TASK + Context Integrity PASS；兩模式皆零首次手動輸入
    default_state: AUTO
  - control_uid: EDIT-01-BTN-FLOW-START
    order: '06'
    type: primary button
    label: 開始 / 繼續
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-FLOW-START-CONTINUE
    enable_gate: EDIT-01-GATE-CONTEXT-INTEGRITY；Context Integrity PASS；AUTO=連續跑 Stage，MANUAL=執行目前 Stage
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-BLUEPRINT-VIEW
    order: '07'
    type: button
    label: 查看藍圖
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-BLUEPRINT-VIEW
    enable_gate: EDIT-01-GATE-CONTEXT-INTEGRITY；PROJECT_TASK + Locked Blueprint Ref exists
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-PACKAGE-VIEW
    order: 08
    type: button
    label: 查看生產包
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-PACKAGE-VIEW
    enable_gate: EDIT-01-GATE-CONTEXT-INTEGRITY；PROJECT_TASK + Production Package exists
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-MANIFEST-VIEW
    order: 09
    type: button
    label: 查看輸入清單
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-MANIFEST-VIEW
    enable_gate: EDIT-01-GATE-BINDING-INTEGRITY；Execution Input Manifest resolved
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-STAGE-CONFIRM
    order: '10'
    type: primary button
    label: 確認目前階段
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-STAGE-CONFIRM
    enable_gate: EDIT-01-GATE-STAGE-PASS；MANUAL + Stage Score PASS + no Hard Block
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-STAGE-MODIFY
    order: '11'
    type: button
    label: 修改目前階段
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-STAGE-MODIFY
    enable_gate: EDIT-01-GATE-CORRECTION；Stage Score FAIL or user chooses correction
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-BTN-RETURN-BLUEPRINT
    order: '12'
    type: button
    label: 退回藍圖修正
    size: BUTTON_M/ICON_S
    action_or_behavior: EDIT-01-ACT-RETURN-BLUEPRINT
    enable_gate: EDIT-01-GATE-BLUEPRINT-RETURN；PROJECT_TASK；需要新增/更換 Script/Asset/DNA binding 時唯一合法路徑
    default_state: DISABLED until Gate
  - control_uid: EDIT-01-LBL-PENDING-TASK
