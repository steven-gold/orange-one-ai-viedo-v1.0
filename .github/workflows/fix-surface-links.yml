name: Fix frontend admin links
on:
  push:
    branches: [new]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
      - name: Patch global shell surface links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/shell/AppShell.tsx')
          s=p.read_text()
          old='''          <a\n            className="surface-switch-button"\n            href={surface === "admin" ? "/" : "/admin/system"}\n            aria-label={surface === "admin" ? t("global.header.frontend") : t("global.header.admin")}\n          >\n            {surface === "admin" ? t("global.header.frontend") : t("global.header.admin")}\n          </a>'''
          new='''          <div className="surface-switch-group" aria-label={`${t("global.header.frontend")} / ${t("global.header.admin")}`}>\n            <a\n              className="surface-switch-button"\n              href="/"\n              aria-label={t("global.header.frontend")}\n              aria-current={surface === "front" ? "page" : undefined}\n            >\n              {t("global.header.frontend")}\n            </a>\n            <a\n              className="surface-switch-button"\n              href="/admin/system"\n              aria-label={t("global.header.admin")}\n              aria-current={surface === "admin" ? "page" : undefined}\n            >\n              {t("global.header.admin")}\n            </a>\n          </div>'''
          if s.count(old) != 1:
              raise SystemExit(f'AppShell target count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          c=Path('src/app/globals.css')
          css=c.read_text()
          marker='''\n.account-button {\n  min-width: 132px;'''
          addition='''\n.surface-switch-group {\n  height: 36px;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  padding: 3px;\n  border: 1px solid var(--border-subtle);\n  border-radius: var(--button-radius);\n  background: rgba(17, 25, 54, 0.52);\n}\n.surface-switch-group .surface-switch-button {\n  min-width: 62px;\n  height: 28px;\n  padding: 0 10px;\n  border: 1px solid transparent;\n  background: transparent;\n}\n.surface-switch-group .surface-switch-button[aria-current="page"] {\n  color: var(--text-primary);\n  background: var(--purple-active);\n  border-color: var(--border-active);\n}\n'''
          if css.count(marker) != 1:
              raise SystemExit(f'globals marker count={css.count(marker)}')
          if '.surface-switch-group {' in css:
              raise SystemExit('surface switch group already exists')
          c.write_text(css.replace(marker, addition+marker, 1))
          PY
      - name: Verify source contract
        run: |
          set -euo pipefail
          grep -Fq 'className="surface-switch-group"' src/components/shell/AppShell.tsx
          grep -Fq 'href="/"' src/components/shell/AppShell.tsx
          grep -Fq 'href="/admin/system"' src/components/shell/AppShell.tsx
          grep -Fq 'aria-current={surface === "front" ? "page" : undefined}' src/components/shell/AppShell.tsx
          grep -Fq 'aria-current={surface === "admin" ? "page" : undefined}' src/components/shell/AppShell.tsx
      - name: Build
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Commit fix and self-clean
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-surface-links.yml
          git config user.name 'steven-gold'
          git config user.email 'proorangeone@gmail.com'
          git add src/components/shell/AppShell.tsx src/app/globals.css .github/workflows/fix-surface-links.yml
          git commit -m 'fix(shell): show frontend and admin links persistently'
          git push origin HEAD:new
