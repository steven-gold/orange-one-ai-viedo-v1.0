name: STR01 wire governed controls
on:
  push:
    paths:
      - '.github/workflows/str01-wire-visual-once.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace legacy Strategy renderer only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/pages/StrategyVisual.tsx');s=p.read_text()
          s=s.replace('import { useMemo, useReducer } from "react";','import { useMemo } from "react";')
          s=s.replace('import { INITIAL_STRATEGY_CLIENT_STATE, reduceStrategyClientState, type StrategyClientAction, type StrategyClientState } from "@/domain/strategy/strategyClientState";\n','')
          anchor='import styles from "./StrategyVisual.module.css";\n'
          s=s.replace(anchor,'import { StrategyRuntimeControl, StrategyRuntimeProvider, useStrategyRuntimeState } from "./StrategyControlRuntime";\n'+anchor,1)
          start=s.index('type ControlProps=')
          end=s.index('\nfunction Title(',start)
          s=s[:start]+'function Control({spec}:{spec:Spec}){return <StrategyRuntimeControl id={spec.id} kind={spec.kind}/>;}\n'+s[end:]
          old='export function StrategyVisual(){const{locale}=useI18n();const[state,dispatch]=useReducer(reduceStrategyClientState,INITIAL_STRATEGY_CLIENT_STATE);'
          new='function StrategyVisualBody(){const{locale}=useI18n();const{state}=useStrategyRuntimeState();'
          if old not in s: raise SystemExit('Strategy state anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('const C=({spec}:{spec:Spec})=><Control spec={spec} state={state} dispatch={dispatch}/>;','const C=({spec}:{spec:Spec})=><Control spec={spec}/>;',1)
          s=s.rstrip()
          if not s.endswith('}'): raise SystemExit('Strategy ending missing')
          s=s+'\nexport function StrategyVisual(){return <StrategyRuntimeProvider><StrategyVisualBody/></StrategyRuntimeProvider>;}\n'
          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=fs.readFileSync('src/components/pages/StrategyVisual.tsx','utf8');
          const r=fs.readFileSync('src/components/pages/StrategyControlRuntime.tsx','utf8');
          const b=fs.readFileSync('src/domain/strategy/strategyControlBindings.ts','utf8');
          if(!v.includes('StrategyRuntimeProvider')||!v.includes('StrategyRuntimeControl'))throw new Error('runtime renderer missing');
          if(v.includes('Gate not satisfied'))throw new Error('legacy gate shell remains');
          if(!b.includes('STRATEGY_MATERIALIZED_CONTROL_COUNT = 57'))throw new Error('binding count missing');
          for(const bad of ['provider picker','ProviderModel picker','requestTaskExecution'])if(v.includes(bad)||r.includes(bad))throw new Error('forbidden '+bad);
          NODE
          test "$(git hash-object src/components/pages/StrategyVisual.module.css)" = "7bd15572bbb3a594033b39470bf95cc050ddddf9"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/str01-wire-visual-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/StrategyVisual.tsx src/components/pages/StrategyControlRuntime.tsx .github/workflows/str01-wire-visual-once.yml
          git commit -m "wire(strategy): connect 57 governed controls without layout drift"
          git push origin HEAD:new
