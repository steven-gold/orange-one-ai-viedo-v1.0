name: VIS-10 resolve SYS-01 route
on:
  push:
    branches: [acpos-vis10-staging]
    paths: [.github/workflows/vis10-resolve-route.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acpos-vis10-staging
      - name: Resolve canonical admin route and tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nav=Path('authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml')
          s=nav.read_text()
          old='''  - order: 1\n    nav_id: ADMIN-NAV-01\n    label:\n      zh-TW: 系統維護\n      en: System Maintenance\n    page_uid: admin:SYS-01\n    permission_bundle: ADMIN-L1-SYSTEM\n    unauthorized: HIDDEN\n'''
          new='''  - order: 1\n    nav_id: ADMIN-NAV-01\n    label:\n      zh-TW: 系統維護\n      en: System Maintenance\n    page_uid: admin:SYS-01\n    route: /admin/system\n    permission_bundle: ADMIN-L1-SYSTEM\n    unauthorized: HIDDEN\n'''
          if old not in s: raise SystemExit('ADMIN-NAV-01 anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('revision: 2026-08-30-USER-APPROVED-INFO-NAV09','revision: 2026-08-30-USER-APPROVED-SYS01-ADMIN-ROUTE',1)
          nav.write_text(s)
          p=Path('docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml')
          s=p.read_text()
          s=s.replace('''  current_task_blockers:\n  - CANONICAL_ROUTE_RESOLVER_MISSING\n  - PRESERVED_25_CONTROL_REGISTRY_UID_SOURCE_MISSING\n''','''  current_task_blockers:\n  - PRESERVED_25_CONTROL_REGISTRY_UID_SOURCE_MISSING\n''',1)
          s=s.replace('''      canonical_route_resolver:\n        state: MISSING\n        finding: ADMIN-NAV-01 binds admin:SYS-01, but Current Authority/repo contains no literal route/path/href/URL resolver for this page.\n        rule: Do not invent /admin/system or any other route.\n''','''      canonical_route_resolver:\n        state: RESOLVED\n        route: /admin/system\n        finding: Same-repository main architecture defines system_maintenance routePrefix /admin/system; user confirmed SYS-01 is entered through the frontend Admin/Backend entry and then the admin menu.\n        source_ref: main@3554d8b679199c118ed8872cdf1f3893ce9427ee:src/config/navigation.ts\n''',1)
          s=s.replace('''    - Publish/identify canonical literal route resolver for admin:SYS-01 / ADMIN-NAV-01.\n    - Publish/identify exact authoritative UID registry for the preserved 25 SYS-01 controls, including section/action/component/visual bindings where required.\n''','''    - Publish/identify exact authoritative UID registry for the preserved 25 SYS-01 controls, including section/action/component/visual bindings where required.\n''',1)
          p.write_text(s)
          PY
          ruby -e 'require "yaml"; YAML.load_file("authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml"); YAML.load_file("docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml"); puts "YAML PASS"'
          grep -q 'route: /admin/system' authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml
          test "$(grep -c 'CANONICAL_ROUTE_RESOLVER_MISSING' docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml)" -eq 0
      - name: Commit exact files and self-clean
        run: |
          git config user.name "steven-gold"
          git config user.email "proorangeone@gmail.com"
          git add authority/global/ACPOS_CURRENT_NAVIGATION_PERMISSION_AUTHORITY_FINAL_LOCKED.yaml docs/construction/ACPOS_WEBSITE_CONSTRUCTION_PROGRESS.yaml
          git commit -m "fix(vis10): resolve canonical SYS-01 admin route"
          git rm .github/workflows/vis10-resolve-route.yml
          git commit -m "chore(vis10): remove temporary route resolver workflow"
          git push origin HEAD:acpos-vis10-staging
