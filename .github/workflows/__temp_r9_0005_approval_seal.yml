name: TEMP R9 0005 Approval Seal

on:
  push:
    branches: [r9-0005-approval-seal-20260904]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r9-0005-approval-seal-20260904
          fetch-depth: 1
      - name: Record CR-R9-0005 and fix 0005 YAML indentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ap = Path('authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml')
          mp = Path('authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml')
          a = ap.read_text(encoding='utf-8')
          m = mp.read_text(encoding='utf-8')

          def rep(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old,new,1)

          a=rep(a,
            '  revision: 2026-09-04-DATABASE-MIGRATION-0005-TEMP-VALIDATION-PASS-PENDING-STAGING-APPROVAL',
            '  revision: 2026-09-04-DATABASE-MIGRATION-0005-STAGING-APPROVED-PENDING-EXECUTION',
            'authority revision')

          a=rep(a,
            '          staging_0005_preflight:',
            """cr_r9_0005_approval:
  status: APPROVED
  approved_on: '2026-09-04'
  approved_by: HUMAN_USER
  approval_ref: CR-R9-0005
  approved_scope: APPLY_VALIDATED_0005_TO_STAGING_ONLY
  pre_0005_restore_branch_id: br-wispy-water-b3mbb2se
staging_0005_preflight:""",
            'approval insertion / preflight indent')

          a=rep(a,
            """  0005_state: TEMP_VALIDATION_PASS_PENDING_CR_R9_0005_STAGING_APPROVAL
    0005_temporary_execution: PASS
    0005_staging_execution: FORBIDDEN_UNTIL_EXPLICIT_CR_R9_0005_STAGING_APPROVAL
    0006_state: BLOCKED_PENDING_0005""",
            """  0005_state: STAGING_APPROVED_PENDING_EXECUTION
  0005_temporary_execution: PASS
  0005_staging_execution: APPROVED_PENDING_EXECUTION
  0006_state: BLOCKED_PENDING_0005""",
            'authority 0005 gates')

          m=rep(m,
            '  revision: 2026-09-04-DATABASE-MIGRATION-0005-TEMP-VALIDATION-PASS-PENDING-STAGING-APPROVAL',
            '  revision: 2026-09-04-DATABASE-MIGRATION-0005-STAGING-APPROVED-PENDING-EXECUTION',
            'manifest revision')
          m=rep(m,
            '    0005_gate: TEMP_VALIDATION_PASS_PENDING_CR_R9_0005_STAGING_APPROVAL',
            '    0005_gate: STAGING_APPROVED_PENDING_EXECUTION',
            'manifest 0005 gate')
          m=rep(m,
            '    0005_staging_execution: NOT_EXECUTED_REQUIRES_EXPLICIT_HUMAN_APPROVAL',
            """    0005_staging_execution: APPROVED_PENDING_EXECUTION
    0005_approval_ref: CR-R9-0005""",
            'manifest staging approval')

          ap.write_text(a,encoding='utf-8')
          mp.write_text(m,encoding='utf-8')
          PY
          git diff --check
          git config user.name "acpos-authority-bot"
          git config user.email "actions@users.noreply.github.com"
          git add authority/global/ACPOS_DATABASE_MIGRATION_AUTHORITY_FINAL_LOCKED_V1.0.yaml authority/ACPOS_CURRENT_AUTHORITY_MANIFEST_FINAL_LOCKED.yaml
          git commit -m "docs(authority): record CR-R9-0005 staging approval"
          git push origin HEAD:r9-0005-approval-seal-20260904
