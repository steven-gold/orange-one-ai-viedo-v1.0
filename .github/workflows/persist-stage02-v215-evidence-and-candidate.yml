name: Persist Stage02 v2.1.15 Evidence and Projection-Atomicity Candidate

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/persist-stage02-v215-evidence-and-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Download exact successful fresh Stage-02 evidence artifact
        run: |
          rm -rf /tmp/stage02-v215-evidence
          mkdir -p /tmp/stage02-v215-evidence
          gh run download 34937106161 -n stage02-actual-test-evidence -D /tmp/stage02-v215-evidence
          test -f /tmp/stage02-v215-evidence/.github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json
      - name: Persist active evidence, successor state, findings, and specification candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, shutil, yaml

          ROOT = Path('.')
          src = Path('/tmp/stage02-v215-evidence/.github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json')
          raw = src.read_bytes()
          evidence = json.loads(raw)

          expected = {
              'artifact_type': 'NON_NORMATIVE_STAGE02_ACTUAL_TEST_EVIDENCE',
              'stage_uid': 'STAGE-02',
              'source_head_sha': 'ae42ef7ba4d650330ec073702a505dbed85fa299',
              'actual_product_stage_test_started': True,
              'actual_product_stage_test_completed': True,
              'result': 'BLOCKED',
              'fresh_functional_gap_total': 150,
              'closure_blocker_total': 13,
              'preserved_external_authority_union_count': 8,
              'current_specification_mutated': False,
              'ai_autofill_used': False,
              'inference_used': False,
              'prior_stage2_results_used': False,
              'stage_exit_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
          }
          for k, v in expected.items():
              assert evidence.get(k) == v, (k, evidence.get(k), v)
          outputs = evidence.get('official_stage_output_denominator') or []
          mandatory = evidence.get('current_manifest_mandatory_stage_output_subset') or []
          assert len(outputs) == 17 and len(outputs) == len(set(outputs)), outputs
          assert len(mandatory) == 12 and set(mandatory).issubset(set(outputs)), mandatory
          pages = evidence.get('pages') or {}
          assert set(pages) == {'CORE-01','ASSET-01'}
          assert pages['CORE-01']['functional_chain_fresh_scan']['gap_count'] == 45
          assert pages['CORE-01']['closure_blocker_count'] == 7
          assert pages['ASSET-01']['functional_chain_fresh_scan']['gap_count'] == 105
          assert pages['ASSET-01']['closure_blocker_count'] == 6

          # Persist the artifact bytes themselves as the active Stage-02 evidence; do not reconstruct the 150-gap result.
          latest = ROOT / 'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
          latest.write_bytes(raw)

          findings = {
              'schema_version': 10,
              'artifact_type': 'STAGE02_CURRENT_FINDINGS',
              'normative_authority': False,
              'stage_uid': 'STAGE-02',
              'attempt_uid': 'STAGE02-FRESH-20260915-002',
              'frozen_governance_uid': 'GOV-REV-20260915-STAGE-EXECUTION-OPTIMIZATION',
              'source_cycle': 'FRESH_V2_1_15_AUTHORITY_DRIVEN_OUTPUT_DENOMINATOR',
              'source_head_sha': evidence['source_head_sha'],
              'source_workflow_run_id': 34937106161,
              'source_artifact_id': 10384166004,
              'source_artifact_sha256': '17e7519023f8a182d996613fc3f9e9b15e6fa45d634b89cdb0df5b58d9425858',
              'fresh_functional_gap_total': 150,
              'fresh_closure_blocker_total': 13,
              'gap_classes': {
                  'ARCHITECTURE_GAP': 112,
                  'AUTHORITY_GAP': 4,
                  'INPUT_SOURCE_GAP': 34,
              },
              'gap_categories': {
                  'ACTION_WITHOUT_CONTROL_OR_TRIGGER': 1,
                  'AUDIT_EVENT_NODE_MISSING': 13,
                  'FAILURE_STATE_ERROR_BINDING_MISSING': 23,
                  'PAYLOAD_INPUT_CONTRACT_MISSING': 34,
                  'POST_ACTION_VALIDATION_NODE_MISSING': 18,
                  'SHARED_OWNER_AUTHORITY_UNRESOLVED': 4,
                  'STATE_TRANSITION_LEDGER_FIELD_MISSING': 50,
                  'SUCCESS_NEXT_STATE_BINDING_MISSING': 7,
              },
              'page_results': {
                  'CORE-01': {
                      'functional_gap_count': 45,
                      'closure_blocker_count': 7,
                      'closure_blockers': pages['CORE-01']['closure_blockers'],
                  },
                  'ASSET-01': {
                      'functional_gap_count': 105,
                      'closure_blocker_count': 6,
                      'closure_blockers': pages['ASSET-01']['closure_blockers'],
                  },
              },
              'official_stage_output_denominator_count': 17,
              'current_manifest_mandatory_stage_output_subset_count': 12,
              'preserved_external_authority_union_count': 8,
              'preserved_external_authority_union_gap_uids': evidence['preserved_external_authority_union_gap_uids'],
              'prior_stage2_results_used': False,
              'result': 'BLOCKED',
              'current_specification_mutated': False,
              'immutable_stage1_source_mutated': False,
              'stage03_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
              'next_action': 'OWNING_LAYER_REMEDIATION_OF_150_FUNCTIONAL_GAPS_AND_13_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
          }
          (ROOT / 'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml').write_text(
              yaml.safe_dump(findings, sort_keys=False, allow_unicode=True), encoding='utf-8'
          )

          candidate_text = '''schema_version: 1
artifact_type: NON_NORMATIVE_SPECIFICATION_CHANGE_CANDIDATE
normative_authority: false
finding_uid: FIND-20260915-027
stage_uid: STAGE-02
title: GOVERNANCE_PROMOTION_PROJECTION_ATOMICITY_GAP
class: GOVERNANCE_SPECIFICATION_REUSABILITY_GAP
status: OPEN_FOR_STAGE_END_CONSOLIDATED_PROMOTION_REVIEW
severity: HIGH
specification_change_required: true
formal_specification_mutated_for_fix: false
current_specification_may_be_modified_from_this_finding_alone: false
ordinary_mid_stage_normative_promotion_allowed: false
finding_may_auto_promote: false
observed_failures:
  - run_id: 34935154063
    defect: VERIFY_SOURCE_IDENTITY retained the pre-promotion deterministic bundle SHA after v2.1.15 source promotion.
  - run_id: 34935792840
    defect: Full-Line runner retained pre-promotion checksum-manifest SHA, semantic content hash, package SHA, bundle SHA, and a stale v2.1.13 suite denominator.
  - run_id: 34936690855
