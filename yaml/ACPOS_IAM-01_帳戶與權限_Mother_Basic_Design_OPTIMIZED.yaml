  - index: 56
    style: Heading 1
    text: 20. Gate Registry
  - index: 58
    style: Heading 1
    text: 21. Error / Recovery Contract
  - index: 60
    style: Heading 1
    text: 22. Identity / Security / Data Boundary
  - index: 62
    style: Heading 1
    text: 23. Cross-page / System Slice & Interaction Topology
  - index: 64
    style: Normal
    text: AI Continuity：IAM-01 不是 AI Conversation page，因此 Multi-AI / Conversation Thread Continuity = NOT_APPLICABLE。若未來加入 AI 輔助，只能作建議，不得成為授權來源或繞過 Preview / Confirm
      / Apply Gate。
  - index: 65
    style: Heading 1
    text: 24. Page Visual Design / 主工作區實際畫面
  - index: 67
    style: Normal
    text: 圖 2｜IAM-01 主工作區：左側帳號目錄、右側同頁 3-Step；底部清楚呈現 L1 → Explicit Assignment 的套用鏈。
  - index: 68
    style: Normal
    text: 設計重點：主畫面不塞滿 MFA、Risk、Session、Audit 卡片；這些屬 Detail / Drawer。真正高頻的 Account Directory、3-Step、Preview/Complete 保持在同一視線範圍。
  - index: 69
    style: Heading 1
    text: 25. Permission Preview / Apply 實際畫面
  - index: 71
    style: Normal
    text: 圖 3｜Step 3 權限預覽：Added / Removed / Unchanged / Blocked、Version、Idempotency、Audit 與 Partial Apply Recovery 在同一確認面板。
  - index: 72
    style: Heading 1
    text: 26. Visual Anchors / Locked & Editable Regions
  - index: 74
    style: Heading 1
    text: 27. Responsive / Localization / Accessibility
  - index: 76
