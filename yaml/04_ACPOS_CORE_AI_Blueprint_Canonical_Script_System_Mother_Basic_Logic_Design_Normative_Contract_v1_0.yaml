      - AcceptCoreCandidateRequest
      - System 04 / CandidateVersion + Adopted Canon Version Lineage + Decision Evidence
      - Acceptance requires exact human decision evidence and creates/binds a new canonical version lineage; prior candidate/version evidence remains immutable.
