    text: 這一包是「最完整方向的 Basic Design Draft」，不是施工證據。每頁均已建立完整 artifacts 與 8 種視覺候選，但正式 DESIGN_FROZEN 仍需 Human Visual/Functional Review，並在核准後把變更 materialize 回既有 Current
      Authority owner。未經該步驟，不得直接施工。
