authority:
  id: ACPOS_I18N_TRANSLATION_ENCODING
  version: V1.0
  status: FINAL_LOCKED
  revision: 2026-08-30-PHASE1-CLOSURE-GLOBAL-NAV-SURFACE-KEYS
  current_only: true
  scope: GLOBAL_UI_TRANSLATION
  purpose: Single translation encoding for ORANGE ONE / ACPOS website UI.
  undefined_behavior: BLOCK + REPORT_AUTHORITY_GAP

locales:
  default: zh-TW
  supported:
    zh-TW:
      label: 繁體中文
      html_lang: zh-Hant-TW
    zh-CN:
      label: 简体中文
      html_lang: zh-Hans-CN
    en:
      label: English
      html_lang: en

translation_rules:
  all_user_visible_ui_requires_key: true
  page_may_define_new_key_only_when_source_text_exists_in_current_page_authority: true
  ai_synonym_or_paraphrase_generation: FORBIDDEN
  missing_key_behavior: BLOCK + REPORT_AUTHORITY_GAP
  fallback_to_other_locale: FORBIDDEN_FOR_PRODUCTION_UI
  fallback_to_key_name: FORBIDDEN_FOR_PRODUCTION_UI
  brand_names_translate: false
  registered_international_shared_terms_translate: false
  user_or_business_data_translate: false
  ids_codes_hashes_versions_translate: false
  provider_model_names_translate: false
  external_source_titles_translate: false
  punctuation_and_number_format: locale-aware only where Current Authority permits formatting.
  preserve_exact_meaning: true

fixed_terms:
  ORANGE ONE: BRAND
  ACPOS: SYSTEM_NAME
  AI: INTERNATIONAL_SHARED
  API: INTERNATIONAL_SHARED
  QA: INTERNATIONAL_SHARED
  ERP: INTERNATIONAL_SHARED
  URL: INTERNATIONAL_SHARED
  HTTP: INTERNATIONAL_SHARED
  HTTPS: INTERNATIONAL_SHARED
  JSON: INTERNATIONAL_SHARED
  RSS: INTERNATIONAL_SHARED
  Sitemap: INTERNATIONAL_SHARED
  Provider: ACPOS_SHARED_TERM
  Model: ACPOS_SHARED_TERM
  Blueprint: ACPOS_SHARED_TERM
  DNA: ACPOS_SHARED_TERM
  Topic: ACPOS_SHARED_TERM
  Episode: ACPOS_SHARED_TERM
  Task: ACPOS_SHARED_TERM
  Runtime: ACPOS_SHARED_TERM
  Context: ACPOS_SHARED_TERM
  Citation: ACPOS_SHARED_TERM
  Experience: ACPOS_SHARED_TERM
  Replay: ACPOS_SHARED_TERM
  Knowledge: ACPOS_SHARED_TERM
  ID: INTERNATIONAL_SHARED
  UID: INTERNATIONAL_SHARED
  SHA256: INTERNATIONAL_SHARED

key_encoding:
  format: '<scope>.<page_or_component>.<semantic_key>'
  examples:
    - global.language.zh_tw
    - global.nav.dashboard
    - wb01.section.company_project_count
  allowed_scopes:
    - global
    - wb01
    - core01
    - asset01
    - video01
    - edit01
    - qa01
    - db01
    - str01
    - info01
    - sys01
    - iam01
    - dev01
    - soc01
    - erp01
    - aiapi01
    - sg02
    - strategy_admin01
    - kb01
  duplicate_semantic_key: FORBIDDEN
  unrelated_key_precreation: FORBIDDEN
  future_page_rule: Add page keys only when that page enters construction and only from its Current Page Authority.

