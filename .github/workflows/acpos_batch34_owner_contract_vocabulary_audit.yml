name: ACPOS Batch 34 Owner Contract Vocabulary Audit

on:
  push:
    branches: [0921acpos]

permissions:
  contents: write

concurrency:
  group: acpos-batch34-owner-contract-vocabulary-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Batch 33 boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="4d07d19c74d6f1f74a4ed2889aeef73f5003fec2"
          git cat-file -e "$BASE^{commit}"
          test -z "$(git -c core.quotePath=false diff --name-only "$BASE" HEAD -- '*.docx')"
          test "$(find . -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 31
          echo "PASS: BATCH33 CONTENT BOUNDARY / 31 DOCX"

      - name: Install audit runtime
        run: python -m pip install --quiet python-docx

      - name: Run Batch 34 owner contract vocabulary audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B __temp/batch34_owner_contract_vocabulary_audit.py

      - name: Verify Batch 34 output
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("__batch34_owner_contract_vocabulary_audit.json").read_text(encoding="utf-8"))
          s=r["summary"]
          assert s["owners"]==9,s
          assert s["total_route_rows"]>=0 and s["total_payload_rows"]>=0 and s["total_persistence_rows"]>=0,s
          print("PASS: BATCH34 OWNER CONTRACT VOCABULARY")
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload Batch 34 evidence
        uses: actions/upload-artifact@v4
        with:
          name: acpos-batch34-owner-contract-vocabulary-audit
          path: |
            __batch34_owner_contract_vocabulary_audit.json
            __batch34_summary.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove Batch 34 harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f __batch34_owner_contract_vocabulary_audit.json __batch34_summary.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "acpos-word-batch-34-audit"
          git config user.email "actions@users.noreply.github.com"
          git rm -f __temp/batch34_owner_contract_vocabulary_audit.py .github/workflows/acpos_batch34_owner_contract_vocabulary_audit.yml
          git commit -m "chore(acpos): close batch 34 owner contract vocabulary audit harness"
          git push origin HEAD:0921acpos
          test -z "$(git status --porcelain)"
          echo "PASS: BATCH34 HARNESS REMOVED / CLEAN TREE"
