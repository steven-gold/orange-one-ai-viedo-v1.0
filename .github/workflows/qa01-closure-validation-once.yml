name: QA-01 closure validation

on:
  push:
    branches:
      - acpos-qa01-closure-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audit and typecheck
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
      - name: QA authority and source coverage
        shell: python
        run: |
          from pathlib import Path
          import re
          auth=Path('authority/pages/workspace/QA-01/ACPOS_QA-01_FINAL_LOCKED_ENCODING_DEDUP_CLEAN.yaml').read_text()
          visual=Path('src/components/pages/QaVisual.tsx').read_text()
          bindings=Path('src/domain/qa/qaControlBindings.ts').read_text()
          projection=Path('src/domain/qa/qaProjectionPort.ts').read_text()
          state=Path('src/domain/qa/qaClientState.ts').read_text()
          controlled=Path('src/server/testing/controlledQaTestRuntime.ts').read_text()
          runtime=Path('src/components/pages/QaControlRuntime.tsx').read_text()
          sections=set(re.findall(r'section_uid:\s*(QA-01-SEC-[0-9]+)',auth))
          controls=set(re.findall(r'control_uid:\s*(QA-01-[A-Z0-9-]+)',auth))
          actions=set(re.findall(r'action_uid:\s*(QA-01-ACT-[A-Z0-9-]+)',auth))
          gates=set(re.findall(r'gate_uid:\s*(QA-01-GATE-[A-Z0-9-]+)',auth))
          errors=set(re.findall(r'error_uid:\s*(QA-01-ERR-[A-Z0-9-]+)',auth))
          print('QA_AUTHORITY_COUNTS',{'sections':len(sections),'controls':len(controls),'actions':len(actions),'gates':len(gates),'errors':len(errors)})
          assert len(sections)==10
          assert len(controls)==87
          assert len(actions)==32
          assert all(x in visual for x in controls), sorted(x for x in controls if x not in visual)
          assert 'QA_MATERIALIZED_CONTROL_COUNT=87' in bindings
          assert 'QA_MATERIALIZED_ACTION_COUNT=32' in bindings
          assert 'QaTestMetadata' in state and 'data_classification:"TEST_ONLY"' in state
          assert '!isControlledTestMode()' in projection and 'production_eligible!==false' in projection
          assert 'test_metadata:{data_classification:"TEST_ONLY"' in controlled
          assert 'AUTHORITY_GAP_QA_ISSUE_CATEGORY_REGISTRY' in controlled
          assert 'AUTHORITY_GAP_QA_ISSUE_CATEGORY_REGISTRY' in runtime
          assert 'data-data-classification={state.resolved.test_metadata?.data_classification}' in visual
          print('QA_AUTHORITY_SOURCE_COVERAGE_PASS')
      - name: Production build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: ""
        run: npm run build
      - name: Production QA must fail closed
        shell: bash
        run: |
          set -euo pipefail
          PORT=3171 NEXT_PUBLIC_ACPOS_RUNTIME_MODE= npm run start >/tmp/qa-prod.log 2>&1 &
          pid=$!; trap 'cat /tmp/qa-prod.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3171/qa >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/qa-prod-proj.json -w '%{http_code}' http://127.0.0.1:3171/v1/ui-projections/QA-01)
          cat /tmp/qa-prod-proj.json
          test "$code" = "503"
          grep -q 'UI_PROJECTION_RUNTIME_NOT_BOUND' /tmp/qa-prod-proj.json
          ! grep -q 'TEST_ONLY' /tmp/qa-prod-proj.json
          kill $pid; wait $pid || true; trap - EXIT
      - name: Controlled build
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
          ACPOS_QA_TEST_SCENARIO: CORRECTION
        run: npm run build
      - name: Controlled QA projection classification
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
          ACPOS_QA_TEST_SCENARIO: CORRECTION
        run: |
          set -euo pipefail
          PORT=3172 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST ACPOS_QA_TEST_SCENARIO=CORRECTION npm run start >/tmp/qa-controlled.log 2>&1 &
          pid=$!; trap 'cat /tmp/qa-controlled.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3172/qa >/dev/null && break || sleep 1; done
          code=$(curl -sS -o /tmp/qa-controlled-proj.json -w '%{http_code}' http://127.0.0.1:3172/v1/ui-projections/QA-01)
          test "$code" = "200"
          python <<'PY'
          import json
          d=json.load(open('/tmp/qa-controlled-proj.json'))
          m=d['test_metadata']
          assert m['data_classification']=='TEST_ONLY'
          assert m['synthetic'] is True
          assert m['production_eligible'] is False
          assert d['page_state_uid']=='QA-01-ST-NOT-STARTED'
          assert d['values']['QA-01-FLD-DISABLED']=='FINDING_CREATE:AUTHORITY_GAP_QA_ISSUE_CATEGORY'
          print('QA_CONTROLLED_PROJECTION_PASS')
          PY
          kill $pid; wait $pid || true; trap - EXIT
      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Controlled QA browser flow
        shell: bash
        env:
          NEXT_PUBLIC_ACPOS_RUNTIME_MODE: CONTROLLED_TEST
          ACPOS_QA_TEST_SCENARIO: CORRECTION
        run: |
          set -euo pipefail
          PORT=3173 NEXT_PUBLIC_ACPOS_RUNTIME_MODE=CONTROLLED_TEST ACPOS_QA_TEST_SCENARIO=CORRECTION npm run start >/tmp/qa-browser.log 2>&1 &
          pid=$!; trap 'cat /tmp/qa-browser.log || true; kill $pid || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:3173/qa >/dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [1280,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1100}});
              page.on('pageerror',e=>errors.push(`pageerror:${width}:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${width}:${m.text()}`)});
              const res=await page.goto('http://127.0.0.1:3173/qa',{waitUntil:'networkidle'});
              if(!res||res.status()!==200)throw new Error(`QA route ${res&&res.status()} ${width}`);
              await page.waitForFunction(()=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')==='QA-01-ST-NOT-STARTED');
              const root=page.locator('[data-page-uid="QA-01"]');
              if(await root.getAttribute('data-authority-controls')!=='87'||await root.getAttribute('data-authority-actions')!=='32'||await root.getAttribute('data-registry-valid')!=='true')throw new Error('QA registry mismatch');
              if(await root.getAttribute('data-data-classification')!=='TEST_ONLY'||await root.getAttribute('data-production-eligible')!=='false')throw new Error('QA classification missing');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>0)throw new Error(`QA horizontal overflow ${overflow} ${width}`);
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1400}});
            page.on('pageerror',e=>errors.push(`pageerror:flow:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:flow:${m.text()}`)});
            await page.goto('http://127.0.0.1:3173/qa',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')==='QA-01-ST-NOT-STARTED');
            const q=id=>page.locator(`[data-control-id="${id}"]`).first();
            const finding=q('QA-01-BTN-FINDING-CREATE');
            if(!(await finding.isDisabled()))throw new Error('QA Finding Create must stay authority-gap disabled');
            if(await finding.getAttribute('data-disabled-reason')!=='AUTHORITY_GAP_QA_ISSUE_CATEGORY_REGISTRY')throw new Error('QA Finding authority-gap reason missing');
            const seg=q('QA-01-SEG-REVIEW-MODE');
            await seg.getByRole('button',{name:'MANUAL'}).click();
            if(await page.locator('[data-control-id="QA-01-BTN-START-REVIEW"]').count()!==1)throw new Error('QA manual Start Review missing');
            await q('QA-01-BTN-START-REVIEW').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')==='QA-01-ST-FAIL');
            const score=(await q('QA-01-FLD-TOTAL-SCORE').textContent())||'';
            if(!score.includes('82'))throw new Error(`QA system score not 82: ${score}`);
            if(!(await q('QA-01-FLD-GATE-STATUS').textContent()||'').includes('FAIL'))throw new Error('QA system FAIL not shown');
            if(await q('QA-01-BTN-CORRECTION').isDisabled())throw new Error('QA correction request not enabled after fail');
            await q('QA-01-INP-CORR-ACTION').fill('依既有 correction contract 修正失敗輸出，維持 exact output identity 與 lineage。');
            await q('QA-01-BTN-CORRECTION').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')==='QA-01-ST-CORRECTION');
            const newVersion=(await q('QA-01-FLD-NEW-VERSION').textContent())||'';
            if(!newVersion.includes('TEST-EDIT-OUTPUT-002'))throw new Error('QA verified new exact output missing');
            if(await q('QA-01-BTN-RECHECK').isDisabled())throw new Error('QA recheck not enabled');
            await q('QA-01-BTN-RECHECK').click();
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="QA-01"]')?.getAttribute('data-page-state')==='QA-01-ST-PASS');
            const score2=(await q('QA-01-FLD-TOTAL-SCORE').textContent())||'';
            if(!score2.includes('98'))throw new Error(`QA recheck score not 98: ${score2}`);
            if(!(await q('QA-01-FLD-GATE-STATUS').textContent()||'').includes('PASS'))throw new Error('QA PASS not shown');
            if(await q('QA-01-BTN-RELEASE-CREATE').isDisabled())throw new Error('QA release candidate not enabled');
            await q('QA-01-BTN-RELEASE-CREATE').click();
            await page.waitForFunction(()=>((document.querySelector('[data-control-id="QA-01-FLD-REL-PACKAGE"]')?.textContent)||'').includes('TEST-RELEASE-CANDIDATE-001'));
            const body=(await page.locator('body').textContent())||'';
            if(!body.includes('TEST-RELEASE-CANDIDATE-001')||!body.includes('TEST-QA-GATE-PASS-001'))throw new Error('QA release candidate evidence missing');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('QA_BROWSER_INTERACTION_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $pid; wait $pid || true; trap - EXIT
      - name: Residual and dirty-tree guard
        run: |
          set -euo pipefail
          ! grep -RInE '\b(TODO|FIXME|HACK|STUB)\b|console\.(log|debug)\(' src/domain/qa src/server/qa src/server/testing/controlledQaTestRuntime.ts src/components/pages/QaControlRuntime.tsx src/components/pages/QaVisual.tsx
          test ! -e .github/workflows/qa01-runtime-fix-once.yml
          git diff --exit-code
