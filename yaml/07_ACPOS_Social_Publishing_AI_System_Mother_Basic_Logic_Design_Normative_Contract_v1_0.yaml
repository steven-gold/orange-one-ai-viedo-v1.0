  - index: 9
    style: Heading 1
    text: 0. 文件身份與使用方式
  - index: 10
    style: Normal
    text: 本文件定義 ACPOS 社群發布 AI 系統的系統級母設計。它不是單一 SOC-01 頁面操作說明，也不是某一社群平台 SDK 手冊；它規定「從商業訊息到外部貼文，再到真實 metrics 與可治理 Experience」的唯一正式生命週期。後續 UI、API、DB、Queue、Adapter、Provider
      與平台 Connector 施工必須依本邏輯落地，不得自行建立第二套 Publishing Registry、Content DB、Scheduler、Queue、Analytics Store 或 Provider-specific 平行系統。
  - index: 12
    style: Heading 1
    text: 1. Purpose / Scope / Out-of-Scope
  - index: 13
    style: Heading 2
    text: 1.1 Purpose
  - index: 14
    style: List Bullet
    text: 把使用者的貼文需求／Master Message 轉成可治理的 Canonical Content，再衍生為平台原生 Variant，而不是四平台盲目複製同文。
  - index: 15
    style: List Bullet
    text: 確保 AI 只產生 RAW_AI_DRAFT_PREVIEW；人工採用、修改、儲存與治理決策後才形成可發布 Candidate。
  - index: 16
    style: List Bullet
    text: 讓 Release/Asset/Approved Content 以 exact version reference 綁入 Media Binding；不在社群發布域建立第二套素材庫。
  - index: 17
    style: List Bullet
    text: 把 Target、Account、Platform Capability、Policy、Approval、Schedule、Rights、Classification 與 Idempotency 變成 effect-time Publish Hard Gate。
  - index: 18
    style: List Bullet
    text: 把 Publish Request accepted 與 external POSTED 嚴格分離；只有驗證過的 Callback/Poll + ExternalPostRef 才能形成 POSTED_CONFIRMED。
  - index: 19
    style: List Bullet
    text: 把 Metrics / Interaction / Attribution 轉成可追溯 Experience；Experience 只能形成 Recommendation Candidate，不能自動改發布政策或內容 Canon。
  - index: 20
    style: Heading 2
    text: 1.2 In Scope / Out-of-Scope
  - index: 22
    style: Heading 1
    text: 2. Authority Inheritance / Owner Boundary
  - index: 23
    style: Normal
    text: AI-07 MUST follow ONE CONCEPT / ONE OWNER / REFERENCE, DO NOT COPY. Shared Context 由 AI-01 提供；Conversation 由 AI-02；Compiler/Router/Provider/Tool Runtime
      由 AI-03；CORE/Canonical Production Package 由 AI-04；Asset/Video/Edit/Voice/QA 由 AI-05；Business Development Email/CRM 由 AI-06；Strategy 由 AI-08；System Lifecycle
      與新平台導入由 AI-09。AI-07 只擁有 Social Publishing Domain Logic。
  - index: 25
    style: Heading 1
    text: 3. System Architecture / Functional Topology
  - index: 27
    style: Normal
    text: 圖 2｜Canonical Content 是單一商業語義來源；平台 Variant 只能做格式、語氣、長度、hashtag、title/description 等允許的原生化，不得無聲改變核心事實、CTA、Rights 或 Approval 範圍。
