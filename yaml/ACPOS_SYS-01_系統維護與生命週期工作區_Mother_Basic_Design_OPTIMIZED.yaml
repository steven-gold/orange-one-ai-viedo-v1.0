document:
  paragraphs:
  - index: 0
    style: Normal
    text: 本版沿用既有 SYS-01 功能規劃，依 Mother 規範補齊缺失的功能完整性、Business Entity × Operation、功能鏈、互動拓撲、AI 對話連續性、視覺幾何、欄位／控制／狀態／錯誤／驗收規格；不重建第二套系統，也不把非必要功能塞進主畫面。
  - index: 1
    style: Normal
    text: 設計原則：單一 System Change、單一 Conversation Core、Existing System First、必要功能才進主工作區、同一 Context 最多一個 Primary CTA、所有連續操作保持同一工作台與上下文。
  - index: 3
    style: Normal
    text: 圖 1｜SYS-01 優化後主工作區：Context、Conversation、Decision/Validation 與 Unified Lifecycle 在同一工作台中完成。
  - index: 4
    style: Heading 1
    text: 1. Page Identity / 頁面定位與產品目標
  - index: 6
    style: Normal
    text: 頁面定位不是「聊天 + 幾個維護按鈕」，而是把需求收斂、系統理解、AI 協作、變更候選、驗證與人工發布邊界整合成一個可連續工作的生命週期工作台。
  - index: 7
    style: Heading 1
    text: 2. Scope / 功能範圍、Out-of-Scope 與非功能要求
  - index: 9
    style: Heading 1
    text: 3. Business Entity Inventory / 業務實體清單
  - index: 12
    style: Heading 1
    text: 4. Business Entity × Applicable Operation Matrix
  - index: 16
    style: Normal
    text: Legend：R = REQUIRED、O = OPTIONAL、N = NOT_APPLICABLE。N/A 僅代表該 Entity 不具該生命週期語義；例如 System Change 不以 Category/Group 管理、Validation Run 不允許任意 Edit。任何新 Entity
      或 Required Operation 都必須先通過必要性與既有能力重用檢查。
  - index: 17
    style: Heading 1
    text: 5. Entity Hierarchy / 關聯與版本依賴
  - index: 19
    style: Heading 1
    text: 6. Functional Admission & Optimization Decisions / 功能補齊與精簡
  - index: 20
    style: Normal
    text: Mother 規範要求「補缺」不能等於「把所有可能功能都加回來」。以下針對既有 AI 對話細項做必要性與主工作區負擔檢查，採最小完整閉環。
  - index: 22
    style: Heading 1
    text: 7. Functional Workbench Contract / 互動工作台拓撲
  - index: 24
    style: Heading 1
    text: 8. Unified User / System Journey & Lifecycle State Machine
  - index: 25
    style: Normal
    text: Lifecycle：Requirement / Change / Incident / Provider Update → Resolve System Context → Existing-System Resolution → AI Discussion → P0/P1 Decision → Design
      → Freeze → Implement → Validate → Human Approval → Release Handoff → Health / Closure。
  - index: 27
    style: Heading 1
    text: 9. Layout / Grid / Responsive Geometry
  - index: 29
    style: Normal
    text: Geometry Guard：任何 viewport 必須保持 overlap=0、clipping=0、horizontal overflow=0、text overflow=0；Global Sidebar 展開只能 overlay，不得擠壓 SYS-01 workspace。
  - index: 30
    style: Heading 1
    text: 10. Canonical Section Specification / 8 個正式 Section
  - index: 32
    style: Heading 1
    text: 11. Component Registry / 元件規格
  - index: 34
    style: Heading 1
    text: 12. Field Registry / 欄位規格
  - index: 36
    style: Normal
    text: 主頁不為了「欄位完整」額外塞入 Change Goal、Scope、Provider、Runtime 等常駐輸入框；這些資料以既有 Entity／Change Package owner 為準，必要時在 contextual drawer / owned form 中編輯。
  - index: 37
    style: Heading 1
    text: 13. Control Registry / 12 個核心互動控制
  - index: 40
    style: Normal
    text: 共同互動狀態：Default / Hover / Focus / Active / Loading / Disabled / Success / Error。Effectful control 的 Disabled 必須顯示原因；Focus 不得只靠顏色；任何按鈕不得縮到低於 44×44px 可觸控範圍。
  - index: 41
    style: Heading 1
    text: 14. AI Interaction Continuity Matrix / AI 對話連續性
  - index: 43
    style: Heading 1
    text: 15. Conversation / Multi-AI Interaction Detail
  - index: 45
    style: Normal
    text: 圖 2｜Multi-AI 對話細節：同一 Change Context 下保留獨立視角、Decision/Impact/Validation 與單一 Composer。
  - index: 46
    style: Heading 1
    text: 16. Requirement Convergence & Decision Ledger
  - index: 48
    style: Normal
    text: 提問前檢查維度：Purpose、Current Behavior、Role、Entry/Exit、Happy Path、State、Error/Edge、Data、API/Runtime、Permission、Provider、Dependency、Migration、UI Impact、Acceptance、Deploy/Rollback。
  - index: 49
    style: Heading 1
    text: 17. Functional Chain Contracts / 關鍵功能完整鏈
  - index: 52
    style: Normal
    text: 功能鏈不得在 Control 或 API 就結束；每一條都必須有 Feedback、Success/Failure、Recovery 與 Next/Terminal Outcome。若缺的是 shared owner，沿用既有 owner；若存在多種合理產品行為，停止自動補齊並回到決策 Gate。
  - index: 53
    style: Heading 1
    text: 18. API / Runtime / Data / Audit Contract
  - index: 56
    style: Heading 1
    text: 19. Permission & Gate Model
  - index: 58
    style: Heading 1
    text: 20. Error / Edge / Recovery Matrix
  - index: 60
    style: Heading 1
    text: 21. Provider / API Update Watch
  - index: 61
    style: Normal
    text: Watch 同時支援 Periodic 與 Event-driven；時程與外部 fetch 由既有系統設定／監控 owner 管理，SYS-01 不硬編第二套 scheduler。
  - index: 63
    style: Heading 1
    text: 22. Asset / Icon / Visual Binding
  - index: 65
    style: Normal
    text: 本文件中的 UI 圖是「頁面設計預覽」，不是網站 runtime asset。正式頁面不因文件排版而新增任何不必要的圖片元件。
  - index: 66
    style: Heading 1
    text: 23. Localization / 語系與文字容量
  - index: 68
    style: Heading 1
    text: 24. Accessibility / 可及性規格
  - index: 69
    style: List Bullet
    text: 所有 segmented controls 使用可辨識的 selected state + aria-pressed / aria-selected 語義；不能只靠紫色判斷。
  - index: 70
    style: List Bullet
    text: Composer 必須有可程式辨識 label；Send / Stop / Attach 有明確 accessible name。
  - index: 71
    style: List Bullet
    text: 鍵盤順序：Page Context → AI Mode → Conversation → Composer → Contextual Actions → Decision/Validation；Drawer 開啟時 focus trap，關閉後回原 trigger。
  - index: 72
    style: List Bullet
    text: Disabled effectful controls 必須提供 reason text / tooltip / aria-describedby。
  - index: 73
    style: List Bullet
    text: 錯誤訊息與 validation status 必須可由 screen reader 感知；loading / processing 使用 live region 或等效狀態。
  - index: 74
    style: List Bullet
    text: 最小互動命中 44×44px；文字對比遵循 design system；不使用只有顏色的 pass/fail。
  - index: 75
    style: Heading 1
    text: 25. Visual Anchor / Locked & Editable Regions
  - index: 77
    style: Heading 1
    text: 26. Visual Preview / 實際頁面設計
  - index: 79
    style: Normal
    text: 圖 3｜桌面主視圖：三欄工作台 + Context Strip + Unified Lifecycle；所有內容皆直接服務 SYS-01 的變更生命週期。
  - index: 80
    style: Normal
    text: 視覺基準：深色科技紫、全站一致的 40px control / 10–12px radius / 16px section gap；紫色只用於 active / selected / primary / focus。不存在業務資料時顯示「—」，不產生 fake KPI、fake progress 或無資料圖表。
  - index: 81
    style: Heading 1
    text: 27. Validation Plan / 7-Pass Closure & Geometry QA
  - index: 83
    style: Heading 1
    text: 28. Acceptance Matrix / Design Definition of Done
  - index: 85
    style: Heading 1
    text: 29. Design Review / Freeze Criteria & Next Transition
  - index: 87
    style: Normal
    text: 本版的「優化」定義：保留既有功能與 owner，補齊 Mother 規範要求的缺失契約；只加入能關閉 Required gap 的最小必要功能，其他功能降為條件顯示、次要操作、共用 owner 或不採用。
  - index: 88
    style: Heading 1
    text: 30. Mother Completeness Index / 文件完整度檢查
  - index: 91
    style: Heading 1
    text: 2026-09-21 Machine Authority Construction Closure / 機器權威施工綁定封板
