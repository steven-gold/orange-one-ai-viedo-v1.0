    conversation_cycle_rules:
      first_create: Create or resolve the first thread under exact Project/Topic + Work Item; no unrelated history.
      resume_unfinished: Return to the same unfinished thread/cycle; do not create duplicate draft versions.
      modify_before_confirm: Continue current conversation cycle; immutable candidate replacement requires a new Candidate.
      modify_after_confirm_or_lock: Start a new revision Conversation bound to exact base version; prior version and prior thread remain immutable/read-only history.
      branch_discussion: Branch stays under the same Work Item and is not a production Topic/formal truth until adopted through finalization.
      switch_work_item: Load selected Work Item Conversation; confirmed upstream outputs enter Context; raw prior-item chat is not merged.
