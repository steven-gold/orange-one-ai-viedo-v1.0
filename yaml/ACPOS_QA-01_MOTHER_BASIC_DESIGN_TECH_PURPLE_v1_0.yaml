  - index: 30
    rows:
    - row: 0
      cells:
      - Control UID
      - Operation
      - Method / Path
      - Payload / Schema
      - Persistence Owner
      - Semantics
    - row: 1
      cells:
      - QA-01-BTN-START-REVIEW
      - startQaReview
      - POST /v1/qa/reviews
      - StartQaReviewRequest
      - QAService / QAReviewCase + QAScorecard + Audit
      - Starts QA only from ExactOutputVersion + QAValidationScriptView + approved CriteriaVersion/QualityGatePolicy + Evidence + Rights/Policy + checksum/provenance.
        Missing required criterion/evidence is BLOCK.
    - row: 2
      cells:
      - QA-01-BTN-FINDING-CREATE
      - createFinding
      - POST /v1/findings
      - CreateFindingRequest
      - public.findings
      - Finding must bind owning domain, exact source version, evidence, severity and expected correction; route/persistence are existing Current authority.
    - row: 3
      cells:
      - QA-01-BTN-CORRECTION
      - createCorrectionRequest
      - POST /v1/correction-requests
      - CreateCorrectionRequestPayload
      - public.correction_requests
      - CorrectionRequest routes to the original canonical owner with exact source + required delta/evidence. QA does not directly edit upstream output.
    - row: 4
      cells:
      - QA-01-BTN-RECHECK
      - startRecheck
      - POST /v1/qa/reviews/{reviewId}/rechecks
      - StartQaRecheckRequest
      - QAService / QARecheckCase + QAScorecard + Audit
      - Recheck is only against a new exact corrected version; historical PASS cannot close a finding on a newer revision.
    - row: 5
      cells:
      - QA-01-BTN-RELEASE-CREATE
      - createReleasePackage
      - POST /v1/qa/release-candidates
      - CreateReleaseCandidateRequest
      - ReleaseService / ReleaseCandidate + Provenance/Audit
      - Creates ReleaseCandidate only from exact QA PASS/version/checksum/provenance. ReleaseCandidate is not published/released-to-channel truth.
    - row: 6
      cells:
      - QA-01-BTN-AUTO-START
      - startAutoTopicQaReview
      - POST /v1/qa/reviews/auto
      - StartAutoTopicQaReviewRequest
      - QAService / AutoQAReviewCase + QAScorecard + Evaluation Evidence
      - AUTO review evaluates exact output against approved criteria/evidence. Machine score cannot bypass required manual review or auto-release.
    - row: 7
      cells:
      - QA-01-BTN-FINDING-POINT
      - setQAFindingPoint
      - LOCAL LOCAL
      - SetQAFindingPointCommand
      - CLIENT/QA / EvidenceCaptureDraft (session-local, non-canonical)
      - Client-only evidence marker mutation. It records a local draft point bound to the current exact output; it does not create a Finding until the governed Finding
        create command is submitted.
    - row: 8
      cells:
      - QA-01-BTN-EVIDENCE-IN
      - setQAEvidenceRangeIn
      - LOCAL LOCAL
      - SetQAEvidenceRangeInCommand
      - CLIENT/QA / EvidenceCaptureDraft (session-local, non-canonical)
      - Client-only local range-start capture. No server API or canonical QA decision is implied.
    - row: 9
      cells:
      - QA-01-BTN-EVIDENCE-OUT
      - setQAEvidenceRangeOut
      - LOCAL LOCAL
      - SetQAEvidenceRangeOutCommand
      - CLIENT/QA / EvidenceCaptureDraft (session-local, non-canonical)
      - Client-only local range-end capture. Range remains a draft until bound into a governed Finding/evidence submission.
    - row: 10
      cells:
      - QA-01-BTN-MANUAL-MODIFY
      - modifyManualReview
      - POST /v1/qa/manual-reviews/{reviewCaseId}/modify
      - ModifyManualReviewRequest
      - ManualReviewService / ManualReviewCase + Human Decision/Audit
      - Modifies the exact manual review case under an authorized reviewer. Required manual review cannot be bypassed; unresolved case/reviewer/state fails closed.
    - row: 11
      cells:
      - QA-01-BTN-MANUAL-PASS
      - passManualReview
      - POST /v1/qa/manual-reviews/{reviewCaseId}/pass
      - PassManualReviewRequest
      - ManualReviewService / ManualReviewCase + Human Decision/Audit
      - Records authorized manual-review PASS for exact case/output/version. Machine score alone is insufficient and cannot substitute reviewer evidence.
