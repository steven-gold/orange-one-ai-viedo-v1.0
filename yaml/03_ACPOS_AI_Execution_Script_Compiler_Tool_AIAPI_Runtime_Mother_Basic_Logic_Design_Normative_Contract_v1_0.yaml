      (display v2.2.16).'
  - index: 12
    style: Heading 1
    text: 0. 文件使用方式與不可誤解原則
  - index: 13
    style: Normal
    text: 本文件定義 ACPOS 共享 AI Execution Runtime 的母級邏輯：把已受治理的 Intent / Script / Context / Constraints，透過唯一 InstructionCompiler、Capability/Route Policy、Provider Profile/Adapter、ProviderGateway、Execution
      Job/Attempt、Tool Runtime、Response Normalization、Audit/Cost/Incident 串成可驗證執行鏈。
  - index: 14
    style: List Bullet
    text: 本文件不是 Provider 文件、不是某部門 Prompt 手冊、不是 UI 操作說明，也不是已部署 Runtime 證明。
  - index: 15
    style: List Bullet
    text: 01 ACPOS-AI-01 是資訊／Context／Truth Owner；02 ACPOS-AI-02 是 Conversation/Memory Owner；本文件只能引用它們，不得複製第二套 Context 或 Conversation Core。
  - index: 16
    style: List Bullet
    text: 04～09 的業務系統只提供 Governed Intent、Domain Script、Target Scope 與 Domain Output Contract；不得自建 Provider Router、Secret Store、Retry Engine 或 Job Runtime。
  - index: 17
    style: List Bullet
    text: 所有未能從 Current Authority 精確綁定的 API、DB、Queue、Secret Backend、Timeout、Retry 數值、Provider profile id 一律標示 REQUIRE_EXACT_BINDING。
  - index: 18
    style: List Bullet
    text: 任何「有 interface / 有 UI / 有 profile / 有 queue library」都不等於 Runtime 已完成；必須另有 Implementation / Binding / Production Evidence。
  - index: 20
    style: Heading 1
    text: 1. Design Identity / 設計身份、目的與邊界
