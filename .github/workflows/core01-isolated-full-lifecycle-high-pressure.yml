name: CORE-01 Isolated Full Lifecycle High Pressure

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core01-isolated-full-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Current governance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install governance test dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Resolve exact TEST_ONLY CORE-01 source provider
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX="${RUNNER_TEMP}/acpos-core01-full-lifecycle-${GITHUB_RUN_ID}"
          PRODUCT="$SANDBOX/product"
          REPORT="${RUNNER_TEMP}/core01-full-lifecycle-report-${GITHUB_RUN_ID}.json"
          CLEANUP="${RUNNER_TEMP}/core01-full-lifecycle-cleanup-${GITHUB_RUN_ID}.json"
          CONTENT_REPORT="${RUNNER_TEMP}/core01-content-integrity-${GITHUB_RUN_ID}.json"
          echo "CORE01_SANDBOX=$SANDBOX" >> "$GITHUB_ENV"
          echo "CORE01_PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
          echo "CORE01_REPORT=$REPORT" >> "$GITHUB_ENV"
          echo "CORE01_CLEANUP=$CLEANUP" >> "$GITHUB_ENV"
          echo "CORE01_CONTENT_REPORT=$CONTENT_REPORT" >> "$GITHUB_ENV"
          rm -rf "$SANDBOX"
          ACTUAL="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/new | cut -f1)"
          test -n "$ACTUAL"
          echo "CORE01_SOURCE_HEAD=$ACTUAL" >> "$GITHUB_ENV"
          git clone --depth=1 --branch new "https://github.com/${GITHUB_REPOSITORY}.git" "$PRODUCT"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$ACTUAL"
          echo "PASS: CORE-01 TEST_ONLY source provider dynamically resolved at $ACTUAL"

      - name: Run Stage-01 through Stage-11 actual isolated high-pressure flow
        run: |
          python governance/ci/run_core01_isolated_full_lifecycle_test.py \
            --sandbox-root "$CORE01_SANDBOX" \
            --product-root "$CORE01_PRODUCT" \
            --source-head "$CORE01_SOURCE_HEAD" \
            --report "$CORE01_REPORT" \
            --content-report "$CORE01_CONTENT_REPORT"

      - name: Delete complete isolated test folder
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX="${CORE01_SANDBOX:-${RUNNER_TEMP}/acpos-core01-full-lifecycle-${GITHUB_RUN_ID}}"
          CLEANUP="${CORE01_CLEANUP:-${RUNNER_TEMP}/core01-full-lifecycle-cleanup-${GITHUB_RUN_ID}.json}"
          BEFORE=0
          if [ -d "$SANDBOX" ]; then
            BEFORE="$(find "$SANDBOX" -type f | wc -l | tr -d ' ')"
          fi
          rm -rf "$SANDBOX"
          test ! -e "$SANDBOX"
          export CORE01_SANDBOX="$SANDBOX"
          export CORE01_CLEANUP="$CLEANUP"
          python - <<'PY'
          import json, os
          path=os.environ["CORE01_CLEANUP"]
          payload={
            "artifact_type":"NON_NORMATIVE_CORE01_ISOLATED_SANDBOX_CLEANUP_RECEIPT",
            "sandbox_root":os.environ["CORE01_SANDBOX"],
            "sandbox_absent_after_cleanup":True,
            "repository_product_data_mutated":False,
            "formal_production_deployment_performed":False,
            "product_stage_credit":0,
          }
          open(path,"w",encoding="utf-8").write(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(payload,ensure_ascii=False))
          PY
          echo "PASS: isolated CORE-01 sandbox removed; files_before_cleanup=$BEFORE"

      - name: Verify isolated folder is absent
        if: always()
        run: |
          SANDBOX="${CORE01_SANDBOX:-${RUNNER_TEMP}/acpos-core01-full-lifecycle-${GITHUB_RUN_ID}}"
          test ! -e "$SANDBOX"
          echo "PASS: no isolated CORE-01 test folder residual"

      - name: Upload non-product summary evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core01-isolated-full-lifecycle-summary-${{ github.run_id }}
          path: |
            ${{ env.CORE01_REPORT }}
            ${{ env.CORE01_CONTENT_REPORT }}
            ${{ env.CORE01_CLEANUP }}
          if-no-files-found: warn
          retention-days: 14
