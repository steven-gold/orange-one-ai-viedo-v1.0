name: Product Full Stage Lifecycle Validation
on:
  push:
    branches: [0921acpos]
    paths:
      - 'STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/**'
      - '.github/scripts/full_stage_lifecycle_guard.py'
      - '.github/scripts/stage01_current_materialize.py'
      - '.github/workflows/product-clean-bootstrap-validation.yml'
      - '.github/scripts/stage_lifecycle_gate.py'
      - '.github/scripts/current_stage_execute.py'
      - '.github/scripts/common_stage_closure.py'
      - '.github/scripts/common_stage_closure_adapter.py'
      - '.github/scripts/common_stage_terminalizer.py'
      - '.github/scripts/common_successor_materialize.py'
      - '.github/scripts/common_successor_work_unit_builder.py'
      - '.github/scripts/common_successor_binding_resolver.py'
      - '.github/scripts/common_stage_preterminal.py'
      - '.github/scripts/common_declared_stage_validator.py'
      - '.github/workflows/product-stage-lifecycle-driver.yml'
      - '.github/workflows/product-stage-preterminal-validation.yml'
      - '.github/workflows/product-full-stage-lifecycle-validation.yml'
      - '.github/workflows/product-stage01-validated-entry.yml'
      - '.github/workflows/product-stage*-materialize.yml'
      - '.github/workflows/product-stage*-validation.yml'
      - '.github/workflows/product-stage-current-execute-reusable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-full-lifecycle-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact selected Current governance
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          SEL="STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_GOVERNANCE_SELECTION.yaml"
          test -s "$SEL" || { echo "BLOCK:CURRENT_GOVERNANCE_SELECTION_MISSING"; exit 31; }
          STATUS="$(awk '$1=="status:" {print $2; exit}' "$SEL")"
          COMMIT="$(awk '$1=="governance_commit_sha:" {print $2; exit}' "$SEL")"
          test "$STATUS" = "SELECTED_EXACT_CURRENT_SNAPSHOT" || { echo "BLOCK:CURRENT_GOVERNANCE_SELECTION_STATUS_INVALID"; exit 32; }
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "BLOCK:CURRENT_GOVERNANCE_COMMIT_INVALID"; exit 33; }
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: steven-gold/orange-one-ai-viedo-v1.0
          ref: ${{ steps.governance.outputs.commit_sha }}
          path: _governance_authority
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Validate Current Governance lifecycle definition first
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r _governance_authority/governance/ci/requirements-governance.lock
          cd _governance_authority
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
      - name: Syntax-check lifecycle runtime guards
        run: |
          python -m py_compile .github/scripts/full_stage_lifecycle_guard.py .github/scripts/stage_lifecycle_gate.py .github/scripts/current_stage_execute.py .github/scripts/common_stage_closure.py .github/scripts/common_stage_closure_adapter.py .github/scripts/common_cross_stage_handoff_builder.py .github/scripts/common_stage_terminalizer.py .github/scripts/common_successor_materialize.py .github/scripts/common_successor_work_unit_builder.py .github/scripts/common_successor_binding_resolver.py .github/scripts/common_stage_preterminal.py .github/scripts/common_declared_stage_validator.py
      - name: Regression-test shared runtime import and retired consumer paths
        run: |
          set -euo pipefail
          (
            cd _governance_authority
            python - <<'PY'
          import sys
          sys.path.insert(0,'governance/ci')
          from external_execution_admission import validate_external_stage_admission
          print('PASS: external execution admission imports with the runtime path used by current_stage_execute')
          PY
          )
          grep -q "sys.path.insert(0,'governance/ci')" .github/scripts/current_stage_execute.py
          grep -q "def rebind_run_manifest_hash" .github/scripts/current_stage_execute.py
          grep -q "WORK_UNIT ledger hash rebinding is owned by current_stage_execute.py" .github/scripts/stage01_operation_runtime.py
          ! grep -q "CURRENT_STAGE02_RESUME.yaml" .github/workflows/product-stage02-validation.yml
          ! grep -q "STAGE03_NORMALIZED_EVIDENCE_NOT_YET_MATERIALIZED" .github/workflows/product-stage03-validation.yml
          ! grep -q "STAGE04_NORMALIZED_EVIDENCE_NOT_YET_MATERIALIZED" .github/workflows/product-stage04-validation.yml
      - name: Parse all current Product Stage workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths=sorted(Path('.github/workflows').glob('product-stage*.yml'))+[Path('.github/workflows/product-full-stage-lifecycle-validation.yml')]
          for p in paths:
              try:
                  obj=yaml.safe_load(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'BLOCK:WORKFLOW_YAML_PARSE_FAILED:{p}:{type(exc).__name__}:{exc}')
              if not isinstance(obj,dict) or not obj.get('jobs'):
                  raise SystemExit(f'BLOCK:WORKFLOW_STRUCTURE_INVALID:{p}')
          print('PASS: current Product Stage workflows parse and expose jobs',len(paths))
          PY
      - name: Validate common closure successor and terminalizer contracts
        run: |
          set -euo pipefail
          python .github/scripts/common_stage_closure_adapter.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_successor_work_unit_builder.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_stage_terminalizer.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_successor_binding_resolver.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
          python .github/scripts/common_stage_preterminal.py --mode validate-contract --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
      - name: Validate transition and permission skeleton with negative tests
        run: |
          python .github/scripts/stage_lifecycle_gate.py --mode self-test --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
      - name: Validate one full Stage authorization and permission lifecycle
        run: |
          set -euo pipefail
          python .github/scripts/full_stage_lifecycle_guard.py --mode plan --product-root "$GITHUB_WORKSPACE" --governance-root "$GITHUB_WORKSPACE/_governance_authority"
      - name: Assert planning validation has zero execution credit
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          p=Path('STAGE_EXECUTION/SHARED_AUTHORITY/CURRENT_STAGE_FLOW/FULL_STAGE_LIFECYCLE_AUTHORIZATION_CONTRACT.yaml')
          d=yaml.safe_load(p.read_text()) or {}
          assert d.get('completion_credit') == 0
          assert d.get('execution_authorization',{}).get('future_effectful_stage_policy') == 'BLOCK_UNTIL_EXPLICIT_USER_OR_GOVERNED_CALLER_RANGE_AUTHORIZATION'
          print('PASS: planning validation cannot create Stage completion or future-stage execution authority')
          PY
