name: Stage-02 Actual Product Test After Full-Line Gate

on:
  push:
    branches: [rebuild-v2.1.1]
    paths:
      - '.github/workflows/stage02-actual-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage02-actual-test:
    if: ${{ !contains(github.event.head_commit.message, 'persist fresh current result') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Re-prove exact 75-file source identity
        run: python .github/governance-source/VERIFY_SOURCE_IDENTITY.py
      - name: Enforce Current Specification mutation authorization
        run: python governance/ci/specification_mutation_guard.py
      - name: Resolve stable Current governance registry
        run: python governance/ci/governance_resolver.py
      - name: Validate canonical rule registry anti-drift binding
        run: python governance/ci/validate_canonical_rule_registry.py
      - name: Validate reusable governance portability and machine-layer profile isolation
        run: python governance/ci/validate_governance_portability.py
      - name: Validate canonical validation remediation closure protocol
        run: python governance/ci/validate_validation_remediation_closure_protocol.py
      - name: Validate Current governance layout
        run: python governance/ci/validate_governance_layout.py
      - name: Validate authoring reference governance coverage
        run: python governance/ci/validate_authoring_reference_governance_coverage.py
      - name: Validate active consumer reference integrity
        run: python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Run Current Registry multidirectional stress 13 of 13
        run: python governance/ci/stress_test_governance_registry.py
      - name: Validate selected execution profile and historical predecessor binding
        run: python governance/ci/validate_selected_execution_profile_integrity.py
      - name: Validate profile-local finding closure readiness
        run: python governance/test/validate_selected_profile_finding_closure.py
      - name: Validate Stage-02 admission predecessor state
        run: python governance/ci/validate_stage02_state_integrity.py
      - name: Validate Stage-02 frozen governance and clean baseline entry receipts
        run: python governance/ci/validate_stage02_entry_receipts.py
      - name: Run complete 75-file full-lifecycle high-pressure system gate on exact Stage-02 execution SHA
        run: python .github/governance-source/RUN_FULL_LINE_SYSTEM_GATE.py
      - name: Prove verified source remained byte-clean before Stage-02 actual test
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/governance-source/active/source
          bad="$(find .github/governance-source/active/source \( -name '*.pyc' -o -name '__pycache__' -o -name '*.tmp' -o -name '*.bak' -o -name '*~' \) -print)"
          test -z "$bad" || { printf 'BLOCK: source runtime residue\n%s\n' "$bad" >&2; exit 1; }
          echo 'PASS: exact source remains byte-clean before Stage-02 actual test'
      - name: Execute fresh Stage-02 actual test
        run: python governance/ci/run_current_stage2_actual_test.py
      - name: Prove Current Specification and immutable Stage-01 inputs were not mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
          echo 'PASS: Stage-02 actual test did not mutate Current Specification or immutable predecessor inputs'
      - name: Upload fresh Stage-02 actual test evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-actual-test-evidence
          path: |
            .github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json
            governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml
            governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml
            .github/governance-source/SOURCE_IDENTITY_REPORT.json
            .github/governance-source/FULL_LINE_SYSTEM_GATE_RESULT.json
            governance/test/FINDING_CLOSURE_READINESS.json
          if-no-files-found: error

  persist-fresh-current-result:
    if: ${{ contains(github.event.head_commit.message, 'persist fresh current result') }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/acpos-governance-pycache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-v2.1.1
          fetch-depth: 0
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Resolve exact parent Stage-02 run and artifact
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(git rev-parse HEAD^)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/stage02-actual-test.yml/runs?branch=rebuild-v2.1.1&head_sha=${parent_sha}&status=completed&per_page=20")"
          source_run_id="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.conclusion=="success") | .id] | if length==1 then .[0] else empty end')"
          test -n "$source_run_id" || { echo 'BLOCK: expected exactly one successful parent Stage-02 run' >&2; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts")"
          artifact_id="$(printf '%s' "$artifacts" | jq -r '[.artifacts[] | select(.name=="stage02-actual-test-evidence") | .id] | if length==1 then .[0] else empty end')"
          artifact_digest="$(printf '%s' "$artifacts" | jq -r '[.artifacts[] | select(.name=="stage02-actual-test-evidence") | .digest] | if length==1 then .[0] else empty end')"
          test -n "$artifact_id" && test -n "$artifact_digest" || { echo 'BLOCK: exact fresh Stage-02 artifact missing or ambiguous' >&2; exit 1; }
          rm -rf /tmp/stage02-current && mkdir -p /tmp/stage02-current
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/stage02-current.zip
          actual_digest="sha256:$(sha256sum /tmp/stage02-current.zip | awk '{print $1}')"
          test "$actual_digest" = "$artifact_digest" || { echo "BLOCK: artifact digest mismatch expected=$artifact_digest actual=$actual_digest" >&2; exit 1; }
          unzip -q /tmp/stage02-current.zip -d /tmp/stage02-current
          test -f /tmp/stage02-current/.github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json
          {
            echo "STAGE02_SOURCE_PARENT_SHA=$parent_sha"
            echo "STAGE02_SOURCE_RUN_ID=$source_run_id"
            echo "STAGE02_SOURCE_ARTIFACT_ID=$artifact_id"
            echo "STAGE02_SOURCE_ARTIFACT_DIGEST=$artifact_digest"
          } >> "$GITHUB_ENV"
      - name: Persist exact fresh evidence and Current blocked state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os, yaml

          ROOT = Path('.')
          src = Path('/tmp/stage02-current/.github/stage02-test/STAGE02_ACTUAL_TEST_RESULT.json')
          raw = src.read_bytes()
          ev = json.loads(raw)
          source_sha = os.environ['STAGE02_SOURCE_PARENT_SHA']
          source_run = int(os.environ['STAGE02_SOURCE_RUN_ID'])
          artifact_id = int(os.environ['STAGE02_SOURCE_ARTIFACT_ID'])
          artifact_digest = os.environ['STAGE02_SOURCE_ARTIFACT_DIGEST']
          artifact_sha = artifact_digest.split(':', 1)[1]

          required = {
              'artifact_type': 'NON_NORMATIVE_STAGE02_ACTUAL_TEST_EVIDENCE',
              'stage_uid': 'STAGE-02',
              'source_head_sha': source_sha,
              'actual_product_stage_test_started': True,
              'actual_product_stage_test_completed': True,
              'result': 'BLOCKED',
              'current_specification_mutated': False,
              'ai_autofill_used': False,
              'inference_used': False,
              'prior_stage2_results_used': False,
              'stage_exit_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
          }
          for k, v in required.items():
              assert ev.get(k) == v, (k, ev.get(k), v)
          pages = ev.get('pages') or {}
          assert set(pages) == {'CORE-01', 'ASSET-01'}, sorted(pages)
          assert ev.get('fresh_functional_gap_total') == sum((v.get('functional_chain_fresh_scan') or {}).get('gap_count', 0) for v in pages.values())
          assert ev.get('closure_blocker_total') == sum(v.get('closure_blocker_count', 0) for v in pages.values())
          assert ev.get('preserved_external_authority_union_count') == len(set(ev.get('preserved_external_authority_union_gap_uids') or []))

          freeze = yaml.safe_load((ROOT/'governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml').read_text()) or {}
          baseline = yaml.safe_load((ROOT/'governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml').read_text()) or {}
          attempt_uid = freeze.get('attempt_uid')
          governance_uid = freeze.get('frozen_governance_uid')
          assert attempt_uid and baseline.get('attempt_uid') == attempt_uid
          assert governance_uid

          latest = ROOT/'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json'
          latest.write_bytes(raw)

          gap_classes = {}
          gap_categories = {}
          page_results = {}
          for page_uid, page in pages.items():
              scan = page.get('functional_chain_fresh_scan') or {}
              for k, v in (scan.get('gap_classes') or {}).items(): gap_classes[k] = gap_classes.get(k, 0) + int(v)
              for k, v in (scan.get('gap_categories') or {}).items(): gap_categories[k] = gap_categories.get(k, 0) + int(v)
              page_results[page_uid] = {
                  'functional_gap_count': int(scan.get('gap_count', 0)),
                  'closure_blocker_count': int(page.get('closure_blocker_count', 0)),
                  'closure_blockers': list(page.get('closure_blockers') or []),
              }
          findings = {
              'schema_version': 11,
              'artifact_type': 'STAGE02_CURRENT_FINDINGS',
              'normative_authority': False,
              'stage_uid': 'STAGE-02',
              'attempt_uid': attempt_uid,
              'frozen_governance_uid': governance_uid,
              'source_cycle': 'FRESH_CURRENT_GOVERNANCE_STAGE02_ACTUAL_TEST',
              'source_head_sha': source_sha,
              'source_workflow_run_id': source_run,
              'source_artifact_id': artifact_id,
              'source_artifact_sha256': artifact_sha,
              'fresh_functional_gap_total': int(ev['fresh_functional_gap_total']),
              'fresh_closure_blocker_total': int(ev['closure_blocker_total']),
              'gap_classes': gap_classes,
              'gap_categories': gap_categories,
              'page_results': page_results,
              'official_stage_output_denominator_count': len(ev.get('official_stage_output_denominator') or []),
              'current_manifest_mandatory_stage_output_subset_count': len(ev.get('execution_profile_mandatory_output_subset') or []),
              'preserved_external_authority_union_count': int(ev['preserved_external_authority_union_count']),
              'preserved_external_authority_union_gap_uids': list(ev.get('preserved_external_authority_union_gap_uids') or []),
              'prior_stage2_results_used': False,
              'result': 'BLOCKED',
              'current_specification_mutated': False,
              'immutable_stage1_source_mutated': False,
              'stage03_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
              'next_action': 'OWNING_LAYER_REMEDIATION_OF_FRESH_FUNCTIONAL_GAPS_AND_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
          }
          (ROOT/'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml').write_text(yaml.safe_dump(findings, sort_keys=False, allow_unicode=True), encoding='utf-8')

          state_p = ROOT/'governance/test/ACTIVE_STATE.yaml'
          state = yaml.safe_load(state_p.read_text()) or {}
          profile = state.setdefault('selected_execution_profile_state', {})
          profile['active_attempt_state_key'] = 'stage02_active_attempt'
          ex = state.setdefault('execution', {})
          ex['current_stage'] = 'STAGE-02-TESTED-BLOCKED'
          s2 = ex.setdefault('stage2', {})
          s2.update({
              'result': 'TEST_EXECUTED_BLOCKED',
              'stage_entry_gate': 'PASS',
              'stage_exit_allowed': False,
              'prior_results_authoritative_for_next_run': False,
              'prior_results_used_in_current_run': False,
              'artifact_root_present': False,
              'revalidation_required_under_current_governance': False,
              'prior_results_authoritative_for_current_governance': False,
          })
          ex['website_construction_allowed'] = False
          ex['deployment_allowed'] = False
          state['stage02_active_attempt'] = {
              'attempt_uid': attempt_uid,
              'frozen_governance_receipt_ref': 'governance/test/stage02/STAGE02_STAGE_FROZEN_GOVERNANCE_RECEIPT.yaml',
              'clean_baseline_receipt_ref': 'governance/test/stage02/STAGE02_CLEAN_BASELINE_RESET_RECEIPT.yaml',
              'frozen_governance_uid': governance_uid,
              'source_execution_sha': source_sha,
              'source_workflow_run_id': source_run,
              'source_artifact_id': artifact_id,
              'source_artifact_sha256': artifact_sha,
              'active_evidence_present': True,
              'active_findings_present': True,
              'active_evidence_ref': 'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json',
              'active_findings_ref': 'governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml',
              'historical_attempt_may_be_used_as_current_result': False,
              'historical_defect_signatures_may_be_used_only_as_regression_targets_after_fresh_rescan': True,
              'fresh_functional_gap_total': int(ev['fresh_functional_gap_total']),
              'fresh_closure_blocker_total': int(ev['closure_blocker_total']),
              'preserved_external_authority_union_count': int(ev['preserved_external_authority_union_count']),
              'official_stage_output_denominator_count': len(ev.get('official_stage_output_denominator') or []),
              'current_manifest_mandatory_stage_output_subset_count': len(ev.get('execution_profile_mandatory_output_subset') or []),
              'product_or_contract_material_remediation_started': False,
              'next_action': 'OWNING_LAYER_REMEDIATION_OF_FRESH_FUNCTIONAL_GAPS_AND_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
              'governance_status': 'CURRENT_FROZEN_ATTEMPT_FRESHLY_REVALIDATED_BLOCKED',
              'closure_credit_under_current_governance': True,
              'fresh_revalidation_required': False,
          }
          state['stage2_result_evidence'] = {
              'mode': 'RUNTIME_GENERATED_GITHUB_ACTION_ARTIFACT',
              'static_result_pointer_required': False,
              'static_run_id_copy_forbidden': True,
              'static_head_sha_copy_forbidden': True,
              'static_specification_digest_copy_forbidden': True,
              'tracked_current_evidence_ref': 'governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json',
              'artifact_provenance_recorded_in_active_attempt': True,
          }
          protocol_state = state.setdefault('stage_execution_remediation_closure_protocol', {})
          protocol_state['binding_status'] = 'CURRENT_POLICY_FRESH_REVALIDATION_PASS_BLOCKED_RESULT'
          state['stage02_current_problem_state'] = {
              'fresh_functional_gap_total': int(ev['fresh_functional_gap_total']),
              'fresh_closure_blocker_total': int(ev['closure_blocker_total']),
              'architecture_gap_total': int(gap_classes.get('ARCHITECTURE_GAP', 0)),
              'input_source_gap_total': int(gap_classes.get('INPUT_SOURCE_GAP', 0)),
              'authority_gap_total': int(gap_classes.get('AUTHORITY_GAP', 0)),
              'external_authority_union_count': int(ev['preserved_external_authority_union_count']),
              'current_specification_mutated': False,
              'immutable_stage1_source_mutated': False,
              'prior_stage2_results_used': False,
          }
          state['status'] = 'ACTIVE_STAGE2_TESTED_BLOCKED_CURRENT_GOVERNANCE'
          state['next_action'] = 'OWNING_LAYER_REMEDIATION_OF_FRESH_FUNCTIONAL_GAPS_AND_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED'
          resume = state.setdefault('resume_control', {})
          resume['chat_memory_is_authority'] = False
          resume['historical_stage2_results_are_current_state'] = False
          resume['stage2_execution_requires_fresh_entry_resolution'] = False
          resume['effectful_stage2_execution_before_entry_resolution'] = 'PASS_ENTRY_RESOLVED'
          resume['current_resume_point'] = 'STAGE2_TESTED_BLOCKED_OWNING_LAYER_REMEDIATION'
          trans = state.setdefault('governance_revision_transition', {})
          trans['current_governance_uid'] = governance_uid
          trans['fresh_revalidation_required'] = False
          trans['website_construction_remains_blocked'] = True
          trans['deployment_remains_blocked'] = True
          sysrun = state.setdefault('full_lifecycle_governance_system_test', {})
          sysrun['full_line_github_result'] = 'PASS_EXECUTION_SOURCE_HEAD'
          sysrun['full_line_verification_run_id'] = source_run
          sysrun['exact_denominators_verified'] = True
          sysrun['persisted_head_revalidation_required'] = True
          state_p.write_text(yaml.safe_dump(state, sort_keys=False, allow_unicode=True), encoding='utf-8')

          candidate_p = ROOT/'governance/test/SPECIFICATION_CHANGE_CANDIDATES.yaml'
          candidate = yaml.safe_load(candidate_p.read_text()) or {}
          current = candidate.setdefault('current_stage2_execution', {})
          current.update({
              'state': 'TEST_EXECUTED_BLOCKED',
              'attempt_uid': attempt_uid,
              'frozen_governance_uid': governance_uid,
              'raw_discovery_gap_count': int(ev['fresh_functional_gap_total']),
              'product_materialization_elimination_count': 0,
              'external_authority_elimination_count': 0,
              'total_fresh_elimination_count': 0,
              'current_functional_gap_count': int(ev['fresh_functional_gap_total']),
              'current_closure_blocker_count': int(ev['closure_blocker_total']),
              'official_stage_output_denominator_count': len(ev.get('official_stage_output_denominator') or []),
              'current_manifest_mandatory_stage_output_subset_count': len(ev.get('execution_profile_mandatory_output_subset') or []),
              'preserved_external_authority_union_count': int(ev['preserved_external_authority_union_count']),
              'active_evidence_present': True,
              'active_findings_present': True,
              'stage_exit_allowed': False,
              'website_construction_allowed': False,
              'deployment_allowed': False,
              'historical_counts_may_be_treated_as_current': False,
              'prior_stage2_results_used': False,
              'source_execution_sha': source_sha,
              'source_workflow_run_id': source_run,
              'source_artifact_id': artifact_id,
              'source_artifact_sha256': artifact_sha,
              'reexecution_cycle': f'FRESH_CURRENT_GOVERNANCE_STAGE02_ATTEMPT_{attempt_uid.rsplit("-", 1)[-1]}',
              'next_action': 'OWNING_LAYER_REMEDIATION_OF_FRESH_FUNCTIONAL_GAPS_AND_CLOSURE_BLOCKERS_WITH_EXTERNAL_AUTHORITY_GAPS_PRESERVED',
          })
          candidate_p.write_text(yaml.safe_dump(candidate, sort_keys=False, allow_unicode=True), encoding='utf-8')
          PY
      - name: Validate persisted Current Stage-02 state before commit
        run: |
          python governance/ci/validate_stage02_state_integrity.py
          python governance/ci/validate_validation_remediation_closure_protocol.py
          python governance/ci/validate_selected_execution_profile_integrity.py
          python governance/ci/specification_mutation_guard.py
          python governance/ci/validate_active_consumer_reference_integrity.py
      - name: Prove no normative or immutable predecessor mutation
        run: |
          git diff --exit-code -- governance/specifications/current governance/specifications/REGISTRY.yaml GOVERNANCE_CURRENT.yaml
          git diff --exit-code -- 00_SOURCE_INTAKE/fresh_run_003/02_BASE_BLUEPRINT 00_SOURCE_INTAKE/fresh_run_003/03_BLUEPRINT_BINDING
      - name: Commit exact fresh Current evidence and resume point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/test/ACTIVE_STATE.yaml governance/test/stage02/STAGE02_LATEST_TEST_EVIDENCE.json governance/test/stage02/STAGE02_CURRENT_FINDINGS.yaml
          test -n "$(git diff --cached --name-only)" || { echo 'BLOCK: no persistence changes staged' >&2; exit 1; }
          git commit -m "test(stage02): persist fresh current-governance attempt evidence"
          git push origin HEAD:rebuild-v2.1.1
