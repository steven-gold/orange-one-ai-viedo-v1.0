name: Issue60 External Admission Layer Reconcile
on:
  push:
    branches:
      - rebuild-v2.1.1
    paths:
      - '.github/workflows/issue60-external-admission-layer-reconcile.yml'
      - '.github/governance-source/active/source/12_DOCS/mother-spec/03_EXECUTION_CONTROL_STANDARD.md'
      - '.github/governance-source/active/source/12_DOCS/mother-spec/04_AUDIT_PROGRESS_STANDARD.md'
      - '.github/governance-source/active/source/12_DOCS/external-admission/PRODUCT_EXECUTION_ENVIRONMENT_ADMISSION_STANDARD.md'
      - '.github/governance-source/active/source/10_REGISTRY/PRODUCT_EXECUTION_ENVIRONMENT_ADMISSION_REGISTRY.yaml'
      - '.github/governance-source/active/source/10_REGISTRY/STAGE_EXECUTION_INVARIANT_REGISTRY.yaml'
      - '.github/governance-source/active/source/10_REGISTRY/SECTION_NUMBER_REGISTRY.yaml'
      - '.github/governance-source/active/source/10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml'
      - '.github/governance-source/active/source/10_REGISTRY/PROTECTED_CURRENT_ARTIFACT_REGISTRY.yaml'
      - '.github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml'
      - '.github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py'
      - '.github/governance-source/active/source/09_TESTS/governance/validate_governance.py'
      - 'governance/ci/stage_execution_engine.py'
      - 'governance/specifications/REGISTRY.yaml'
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]' && github.ref_name == 'rebuild-v2.1.1'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: rebuild-v2.1.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r governance/ci/requirements-governance.lock
      - name: Reconcile external-admission layer derivatives
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')" = "$BASE_HEAD"
          python governance/source-successor/materialize_derived_source_package.py
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          p=Path('governance/specifications/REGISTRY.yaml')
          text=p.read_text(encoding='utf-8')
          doc=yaml.safe_load(text) or {}
          bindings=((doc.get('candidate_validation_contract') or {}).get('source_package_validation_toolchain_blob_bindings') or {})
          if not isinstance(bindings,dict) or not bindings:
              raise SystemExit('TOOLCHAIN_BINDING_BLOCK_MISSING')
          ls=text.splitlines()
          start=[i for i,x in enumerate(ls) if x=='  source_package_validation_toolchain_blob_bindings:']
          if len(start)!=1:
              raise SystemExit('TOOLCHAIN_BINDING_BLOCK_COUNT='+str(len(start)))
          lo=start[0]+1
          hi=next((i for i in range(lo,len(ls)) if ls[i] and not ls[i].startswith('    ')),len(ls))
          changed=0
          for key in sorted(bindings):
              path=Path(key)
              if not path.is_file():
                  raise SystemExit('REGISTERED_TOOLCHAIN_PATH_MISSING:'+key)
              blob=subprocess.run(['git','hash-object',key],check=True,text=True,capture_output=True).stdout.strip()
              needle='    "'+key+'":'
              rows=[i for i in range(lo,hi) if ls[i].startswith(needle)]
              if len(rows)!=1:
                  raise SystemExit('TOOLCHAIN_BINDING_ROW_COUNT:'+key+':'+str(len(rows)))
              if ls[rows[0]].split(':',1)[1].strip()!=blob:
                  ls[rows[0]]=needle+' '+blob
                  changed+=1
          p.write_text('\n'.join(ls)+'\n',encoding='utf-8')
          print('PASS: toolchain blob bindings reconciled changed='+str(changed))
          PY
          python governance/source-successor/materialize_derived_source_package.py --check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/governance-source/active/source/10_REGISTRY/SEMANTIC_AUTHORITY_BASELINE.yaml \
                  .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py \
                  .github/governance-source/active/source/11_EVIDENCE/audit/AUDIT_BASELINE.yaml \
                  .github/governance-source/active/source/11_EVIDENCE/audit/generated/GOVERNANCE_REQUIREMENT_INDEX.json \
                  .github/governance-source/active/source/10_REGISTRY/GOVERNANCE_ROOT_MANIFEST.yaml \
                  .github/governance-source/active/source/CHECKSUMS.sha256 \
                  governance/specifications/REGISTRY.yaml
          git diff --cached --quiet && { echo "NO_DERIVED_RECONCILIATION_CHANGES"; exit 1; }
          git commit -m "chore(governance): reconcile external admission layer derivatives"
          python .github/governance-source/active/source/09_TESTS/governance/validate_section_registry.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_reference_semantics.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_stage_execution_invariants.py
          python .github/governance-source/active/source/09_TESTS/governance/validate_governance.py
          python governance/ci/stage_execution_engine.py --definition-audit-all
          python governance/ci/validate_successor_governance_preformal.py
          python governance/ci/validate_structured_mutation_safety.py
          test "$(git ls-remote origin refs/heads/rebuild-v2.1.1 | awk '{print $1}')" = "$BASE_HEAD"
          git push origin HEAD:rebuild-v2.1.1
