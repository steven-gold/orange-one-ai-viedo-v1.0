name: IAM-01 validation once

on:
  push:
    branches: [new]
    paths:
      - '.github/workflows/iam01-validation-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scope and authority guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=6a597c6a00dc218869eeb502691e0530d88ae2c0
          allowed='^(src/components/pages/IamControlRuntime.tsx|src/components/pages/IamVisual.tsx|src/domain/iam/iamClientPort.ts|src/domain/iam/iamClientState.ts|src/domain/iam/iamControlBindings.ts|src/domain/iam/iamRuntimeContract.ts|.github/workflows/iam01-validation-once.yml)$'
          bad=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
          git diff --quiet "$BASE" -- src/components/pages/IamVisual.module.css
          git diff --quiet "$BASE" -- src/app/page.tsx src/components/pages/DashboardVisual.tsx src/components/pages/DashboardVisual.module.css
          AUTH=authority/pages/admin/IAM-01/ACPOS_IAM-01_ACCOUNT_PERMISSION_SINGLE_PAGE_FINAL_LOCKED_ENCODING.yaml
          test "$(grep -c '^\- section_uid: IAM-01-SEC-' "$AUTH")" = 6
          test "$(grep -c '^\- component_uid: IAM-01-CMP-' "$AUTH")" = 10
          test "$(grep -c '^\- control_uid: IAM-01-' "$AUTH")" = 14
          test "$(grep -c '^\- port_uid: IAM-01-PORT-' "$AUTH")" = 9
          test "$(grep -c '^  - order:' "$AUTH")" = 18
          grep -q 'authorization_model: ACCOUNT_PERMISSION_ASSIGNMENT_ONLY' "$AUTH"
          grep -q 'user_visible_permission_granularity: L1_ONLY' "$AUTH"
          grep -q 'new_resource_auto_grant: FORBIDDEN' "$AUTH"
          grep -q 'role_name_authorization: FORBIDDEN' "$AUTH"
          grep -q 'department_membership_as_allow: FORBIDDEN' "$AUTH"
          grep -q 'No wildcard admin:\* grant' "$AUTH"
          test "$(grep -R 'configureIamProjectionResolver' src --exclude=iamClientPort.ts | wc -l | tr -d ' ')" = 0
          test "$(grep -R 'configureIamClientCommandAdapter' src --exclude=iamClientPort.ts | wc -l | tr -d ' ')" = 0
          ! grep -R '"IAM-01-ERR-AUTH"' src/domain/iam src/components/pages/IamControlRuntime.tsx src/components/pages/IamVisual.tsx
          echo IAM01_SCOPE_AUTHORITY_PASS
      - name: Install and audit
        run: |
          npm ci
          npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Product residue guard
        shell: bash
        run: |
          set -euo pipefail
          files=(src/components/pages/IamControlRuntime.tsx src/components/pages/IamVisual.tsx src/domain/iam/iamClientPort.ts src/domain/iam/iamClientState.ts src/domain/iam/iamControlBindings.ts src/domain/iam/iamRuntimeContract.ts)
          ! grep -En 'TODO|FIXME|HACK|XXX|STUB|NOOP|NOT_IMPLEMENTED|IMPLEMENT_ME|@ts-ignore|@ts-nocheck|@ts-expect-error|debugger|console\.(log|debug)' "${files[@]}"
          echo IAM01_RESIDUE_PASS
      - name: Production browser validation
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 4173 > /tmp/iam01-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true; cat /tmp/iam01-next.log || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/admin/accounts >/dev/null; then break; fi
            sleep 1
          done
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain package.json package-lock.json)"
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const failed=[]; const nonGetV1=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname.startsWith('/v1/')&&r.method()!=='GET')nonGetV1.push(`${r.method()} ${u.pathname}`)});
            await page.goto('http://127.0.0.1:4173/admin/accounts',{waitUntil:'networkidle'});
            const root=page.locator('[data-page-uid="admin:IAM-01"]');
            await root.waitFor({state:'attached',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('[data-page-uid="admin:IAM-01"]')?.getAttribute('data-page-state')==='BLOCKED');
            assert.equal(await root.getAttribute('data-authority-status'),'FINAL_LOCKED');
            assert.equal(await root.getAttribute('data-authority-sections'),'6');
            assert.equal(await root.getAttribute('data-authority-components'),'10');
            assert.equal(await root.getAttribute('data-authority-controls'),'14');
            assert.equal(await root.getAttribute('data-frontend-l1-count'),'9');
            assert.equal(await root.getAttribute('data-backend-l1-count'),'9');
            assert.equal(await root.getAttribute('data-control-registry-valid'),'true');
            assert.equal(await root.getAttribute('data-page-state'),'BLOCKED');
            assert.equal(await root.getAttribute('data-projection-status'),'BLOCKED');
            assert.equal(await root.getAttribute('data-projection-reason'),'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.equal(await root.getAttribute('data-runtime-error-uid'),'IAM-01-ERR-UNDEFINED');
            assert.equal(await root.getAttribute('data-projection-adapter-ready'),'false');
            assert.equal(await root.getAttribute('data-effectful-runtime-ready'),'false');
            assert.equal(await root.getAttribute('data-formal-runtime-status'),'NOT_EXECUTED');
            assert.equal(await page.locator('[data-section-id^="IAM-01-SEC-"]').count(),6);
            assert.equal(await page.locator('[data-component-id^="IAM-01-CMP-"]').count(),10);
            const controls=page.locator('[data-control-id^="IAM-01-"]');
            assert.equal(await controls.count(),14);
            for(let i=0;i<14;i++){
              const node=controls.nth(i);
              assert(await node.getAttribute('data-action-uid'));
              assert(await node.getAttribute('data-gate-uid'));
              assert(await node.getAttribute('data-permission-uid'));
              assert(await node.getAttribute('data-effect-type'));
              assert(await node.getAttribute('data-current-state'));
              assert(await node.getAttribute('data-runtime-binding'));
            }
            for(const id of ['IAM-01-BTN-ADD','IAM-01-BTN-EDIT','IAM-01-BTN-SAVE-DRAFT','IAM-01-BTN-VALIDATE','IAM-01-BTN-PREVIEW','IAM-01-BTN-COMPLETE','IAM-01-BTN-AUDIT']) assert.equal(await page.locator(`#${id}`).isDisabled(),true);
            assert.equal(await page.locator('[data-control-id="IAM-01-CTL-SEARCH"]').isDisabled(),true);
            assert.equal(await page.locator('[data-control-id="IAM-01-SEL-DEPT-PRESET"]').isDisabled(),true);
            assert.equal(await page.locator('[data-control-id="IAM-01-CHK-FRONT-ALL"]').isDisabled(),true);
            assert.equal(await page.locator('[data-control-id="IAM-01-CHK-BACK-ALL"]').isDisabled(),true);
            assert.equal(await page.locator('[data-control-id="IAM-01-CTL-BASIC-DATA"]').getAttribute('data-disabled-reason'),'IAM-01-ERR-IDENTITY-SCHEMA');
            assert.equal(await page.locator('[data-control-id="IAM-01-SEL-DEPT-PRESET"]').getAttribute('data-disabled-reason'),'IAM-01-ERR-PRESET');
            const formal=page.locator('[data-control-id^="IAM-01-"][data-runtime-binding="NOT_EXECUTED"]');
            assert((await formal.count())>=7);
            const direct=await page.evaluate(async()=>{const r=await fetch('/v1/ui-projections/admin%3AIAM-01',{cache:'no-store'});return{status:r.status,body:await r.json()}});
            assert.equal(direct.status,503);
            assert.equal(direct.body.reason_code,'UI_PROJECTION_RUNTIME_NOT_BOUND');
            assert.deepEqual(nonGetV1,[]);
            for(const width of [1280,1440,1920]){
              await page.setViewportSize({width,height:900});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              console.log('IAM01_WIDTH',width,'OVERFLOW',overflow);
              assert(overflow<=0,`overflow ${width}: ${overflow}`);
            }
            assert.deepEqual(pageErrors,[]);
            assert.deepEqual(failed,[]);
            console.log('IAM01_BROWSER_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
