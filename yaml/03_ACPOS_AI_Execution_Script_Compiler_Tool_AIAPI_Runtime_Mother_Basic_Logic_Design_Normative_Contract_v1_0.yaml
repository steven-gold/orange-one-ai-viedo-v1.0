  - index: 83
    style: List Bullet
    text: Callback/poll response MUST bind to expected job/attempt/external_ref and trusted provider route.
  - index: 84
    style: List Bullet
    text: Signature/token/secret verification specifics remain REQUIRE_EXACT_BINDING, but verification result MUST exist before success projection.
  - index: 85
    style: List Bullet
    text: Duplicate callback MUST NOT duplicate artifact writes or cost records.
  - index: 86
    style: List Bullet
    text: Late callback after terminal cancel/failure MUST be recorded and reconciled, not silently change canonical terminal state.
  - index: 87
    style: List Bullet
    text: Callback payload MUST be normalized; raw provider payload remains evidence with classification/redaction rules, not business truth by itself.
  - index: 89
    style: Heading 1
    text: 21. Response Normalization / Validation / Quarantine
  - index: 91
