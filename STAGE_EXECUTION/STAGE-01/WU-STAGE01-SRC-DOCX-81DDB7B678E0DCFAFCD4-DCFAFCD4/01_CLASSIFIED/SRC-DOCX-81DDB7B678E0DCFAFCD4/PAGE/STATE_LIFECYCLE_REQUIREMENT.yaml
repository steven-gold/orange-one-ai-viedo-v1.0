  source_text: 'Cross-document invariant: the owning page must render concrete dimension rows from the exact approved profile. An abstract CriteriaVersion/Dimension container alone is CONTENT_INCOMPLETE.'
- source_node_uid: SN-16A3FB0A112BBDFF52540BB2
  document_order_index: 86239
  source_text: 任何需要 Quality Review / Score / Evaluation 的系統，MUST resolve exact approved Criteria Profile + CriteriaVersion + QualityGatePolicyVersion；不得用 generic/default/latest 取代。
- source_node_uid: SN-AD08B7DD0B4064BCCDFC8120
  document_order_index: 86307
  source_text: Correction 必須產生 NEW exact output/version 後才可 Recheck；不得在原輸出上直接關閉 Finding。
- source_node_uid: SN-CD15BC2CDFB534D6B384865B
  document_order_index: 86341
  source_text: SG-02 lifecycle canonical path = EMPTY → DRAFT → REVIEW → APPROVED / ACTIVE → SUPERSEDED。
- source_node_uid: SN-BE4F866C11B2D2A5BE5949AB
  document_order_index: 86595
  source_text: Department creates exact output/version; output identity/checksum/lineage immutable for that review.
- source_node_uid: SN-36DE2B29D4810079E4FE04E2
